<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="lms-title lms-desc" color="#222">
<title id="lms-title">Layered Material Structure</title>
<desc id="lms-desc">Exploded stack of four weathered-metal material layers, base metal at the bottom rising through paint, rust and dirt, each gated by its own mask and combined top to bottom into the final surface.</desc>
<style>
.lbl{fill:currentColor;font-family:'Segoe UI',Arial,sans-serif;}
.hd{font-size:26px;font-weight:700;}
.nm{font-size:19px;font-weight:700;}
.sub{font-size:13px;fill:currentColor;opacity:.75;}
.mk{font-size:12px;font-weight:700;}
.slab{stroke:currentColor;stroke-width:1.5;opacity:.9;}
</style>
<text x="400" y="44" text-anchor="middle" class="lbl hd">Layered Material Structure</text>
<text x="400" y="70" text-anchor="middle" class="lbl sub">Each layer sits on the one below and is revealed only where its mask is white</text>

<!-- layer 4 dirt (top) -->
<g transform="translate(150,110)">
<polygon class="slab" points="0,40 320,40 400,0 80,0" fill="#F5C242" opacity=".85"/>
<text x="430" y="26" class="lbl nm">Dirt</text>
<text x="430" y="44" class="lbl sub">very matte, in crevices</text>
<rect x="-120" y="4" width="34" height="34" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<circle cx="-103" cy="21" r="6" fill="currentColor"/>
<text x="-103" y="58" text-anchor="middle" class="lbl mk" fill="#F5C242">MASK</text>
</g>

<!-- layer 3 rust -->
<g transform="translate(150,210)">
<polygon class="slab" points="0,40 320,40 400,0 80,0" fill="#FF6B00" opacity=".85"/>
<text x="430" y="26" class="lbl nm">Rust</text>
<text x="430" y="44" class="lbl sub">rough, on exposed metal</text>
<rect x="-120" y="4" width="34" height="34" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<path d="M-116,32 Q-108,10 -100,26 T-88,20" fill="none" stroke="currentColor" stroke-width="2"/>
<text x="-103" y="58" text-anchor="middle" class="lbl mk" fill="#FF6B00">MASK</text>
</g>

<!-- layer 2 paint -->
<g transform="translate(150,310)">
<polygon class="slab" points="0,40 320,40 400,0 80,0" fill="#4A9EFF" opacity=".85"/>
<text x="430" y="26" class="lbl nm">Paint</text>
<text x="430" y="44" class="lbl sub">matte colour coat</text>
<rect x="-120" y="4" width="34" height="34" rx="5" fill="#4A9EFF" opacity=".85" stroke="currentColor" stroke-width="1.5"/>
<text x="-103" y="58" text-anchor="middle" class="lbl mk" fill="#4A9EFF">FULL</text>
</g>

<!-- layer 1 base metal (bottom) -->
<g transform="translate(150,410)">
<polygon class="slab" points="0,40 320,40 400,0 80,0" fill="#B47EE8" opacity=".7"/>
<text x="430" y="26" class="lbl nm">Base Metal</text>
<text x="430" y="44" class="lbl sub">grey, metallic foundation</text>
<text x="-103" y="30" text-anchor="middle" class="lbl mk" fill="#B47EE8">BASE</text>
</g>

<!-- combine arrow -->
<g transform="translate(90,150)">
<line x1="0" y1="0" x2="0" y2="320" stroke="#FF6B00" stroke-width="3"/>
<polygon points="-7,312 7,312 0,326" fill="#FF6B00"/>
<text x="-14" y="160" text-anchor="middle" class="lbl mk" fill="#FF6B00" transform="rotate(-90 -14 160)">STACKED TOP TO BOTTOM</text>
</g>

<text x="400" y="560" text-anchor="middle" class="lbl sub">Result: one surface where paint, rust and dirt show through only where their masks allow</text>
</svg>
