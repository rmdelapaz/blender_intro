<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="rce-title rce-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="rce-title">Resample Curve node</title>
  <desc id="rce-desc">Before and after comparison of the Resample Curve node: an input curve with uneven control points becomes a curve with evenly spaced points, using Length mode set to 2.0 so spacing is consistent regardless of the original point distribution.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">RESAMPLE CURVE</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Rebuild a curve with evenly spaced points before you use it</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- BEFORE panel -->
  <text x="40" y="150" font-size="18" font-weight="600" fill="currentColor">Before · uneven points</text>
  <rect x="40" y="166" width="330" height="150" rx="8" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.2" stroke-width="1.5"/>
  <!-- input curve path -->
  <path d="M 70 280 C 120 180, 160 300, 210 210 S 300 200, 340 250" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="2.5"/>
  <!-- uneven points -->
  <g fill="#4A9EFF">
    <circle cx="70"  cy="280" r="6"/>
    <circle cx="105" cy="205" r="6"/>
    <circle cx="150" cy="252" r="6"/>
    <circle cx="210" cy="210" r="6"/>
    <circle cx="340" cy="250" r="6"/>
  </g>
  <text x="205" y="304" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6" font-style="italic">clustered left, sparse right</text>

  <!-- Arrow + node -->
  <g stroke-linecap="round">
    <path d="M 386 240 L 414 240" stroke="#FF6B00" stroke-width="3" fill="none"/>
    <path d="M 406 233 L 416 240 L 406 247 Z" fill="#FF6B00"/>
  </g>
  <rect x="300" y="336" width="200" height="70" rx="8" fill="currentColor" fill-opacity="0.06" stroke="#4ADE80" stroke-opacity="0.9" stroke-width="1.8"/>
  <rect x="300" y="336" width="200" height="24" rx="8" fill="#4ADE80" fill-opacity="0.9"/>
  <text x="400" y="353" text-anchor="middle" font-size="13" font-weight="600" fill="#0f1a14">Resample Curve</text>
  <text x="400" y="378" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.8">Mode: Length</text>
  <text x="400" y="396" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.8">Length: 2.0</text>

  <!-- AFTER panel -->
  <text x="430" y="150" font-size="18" font-weight="600" fill="currentColor">After · even spacing</text>
  <rect x="430" y="166" width="330" height="150" rx="8" fill="currentColor" fill-opacity="0.04" stroke="#4ADE80" stroke-opacity="0.4" stroke-width="1.5"/>
  <!-- resampled curve, same shape -->
  <path d="M 460 280 C 510 180, 550 300, 600 210 S 690 200, 730 250" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="2.5"/>
  <!-- even points along path -->
  <g fill="#4ADE80">
    <circle cx="460" cy="280" r="6"/>
    <circle cx="493" cy="223" r="6"/>
    <circle cx="524" cy="238" r="6"/>
    <circle cx="558" cy="248" r="6"/>
    <circle cx="592" cy="219" r="6"/>
    <circle cx="628" cy="212" r="6"/>
    <circle cx="664" cy="219" r="6"/>
    <circle cx="700" cy="236" r="6"/>
    <circle cx="730" cy="250" r="6"/>
  </g>
  <text x="595" y="304" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6" font-style="italic">equal distance between every point</text>

  <!-- Why-it-matters strip -->
  <text x="40" y="446" font-size="14" fill="currentColor" opacity="0.75">Even points give Curve to Mesh and Instance on Points a predictable, uniform result · resample first, build second.</text>
  <line x1="40" y1="466" x2="760" y2="466" stroke="currentColor" stroke-width="1.5" opacity="0.2"/>

  <!-- Footer tip Variant B -->
  <rect x="40" y="506" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Length mode keeps spacing constant as the curve changes shape · Count mode fixes the number of points instead.</text>
</svg>
