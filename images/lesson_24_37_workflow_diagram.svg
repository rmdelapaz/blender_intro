<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="wf-title wf-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="wf-title">The professional animation workflow cycle</title>
  <desc id="wf-desc">A five stage animation workflow shown as a left to right pipeline: plan, block, refine, polish, and review, with a return arrow looping from review back to the start to show the process is iterative.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">THE ANIMATION WORKFLOW</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">A five stage cycle &#183; plan, block, refine, polish, review, then loop back</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <text x="40" y="170" font-size="18" font-weight="600" fill="currentColor">The professional process</text>

  <defs>
    <marker id="wf-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="currentColor" opacity="0.45"/>
    </marker>
  </defs>
  <!-- Stage 1: PLAN -->
  <rect x="40" y="220" width="120" height="130" rx="10" fill="currentColor" opacity="0.04"/>
  <rect x="40" y="220" width="120" height="130" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.18" stroke-width="1.5"/>
  <circle cx="100" cy="254" r="18" fill="#FF6B00"/>
  <text x="100" y="260" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">1</text>
  <text x="100" y="298" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor">PLAN</text>
  <text x="100" y="318" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">Thumbnails</text>
  <text x="100" y="334" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">+ reference</text>
  <line x1="166" y1="285" x2="184" y2="285" stroke="currentColor" stroke-width="2" opacity="0.45" marker-end="url(#wf-arrow)"/>
  <!-- Stage 2: BLOCK -->
  <rect x="190" y="220" width="120" height="130" rx="10" fill="currentColor" opacity="0.04"/>
  <rect x="190" y="220" width="120" height="130" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.18" stroke-width="1.5"/>
  <circle cx="250" cy="254" r="18" fill="#FF6B00"/>
  <text x="250" y="260" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">2</text>
  <text x="250" y="298" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor">BLOCK</text>
  <text x="250" y="318" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">Key poses</text>
  <text x="250" y="334" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">+ rough timing</text>
  <line x1="316" y1="285" x2="334" y2="285" stroke="currentColor" stroke-width="2" opacity="0.45" marker-end="url(#wf-arrow)"/>
  <!-- Stage 3: REFINE -->
  <rect x="340" y="220" width="120" height="130" rx="10" fill="currentColor" opacity="0.04"/>
  <rect x="340" y="220" width="120" height="130" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.18" stroke-width="1.5"/>
  <circle cx="400" cy="254" r="18" fill="#FF6B00"/>
  <text x="400" y="260" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">3</text>
  <text x="400" y="298" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor">REFINE</text>
  <text x="400" y="318" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">Add the</text>
  <text x="400" y="334" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">principles</text>
  <line x1="466" y1="285" x2="484" y2="285" stroke="currentColor" stroke-width="2" opacity="0.45" marker-end="url(#wf-arrow)"/>
  <!-- Stage 4: POLISH -->
  <rect x="490" y="220" width="120" height="130" rx="10" fill="currentColor" opacity="0.04"/>
  <rect x="490" y="220" width="120" height="130" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.18" stroke-width="1.5"/>
  <circle cx="550" cy="254" r="18" fill="#FF6B00"/>
  <text x="550" y="260" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">4</text>
  <text x="550" y="298" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor">POLISH</text>
  <text x="550" y="318" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">Smooth curves</text>
  <text x="550" y="334" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">+ final timing</text>
  <line x1="616" y1="285" x2="634" y2="285" stroke="currentColor" stroke-width="2" opacity="0.45" marker-end="url(#wf-arrow)"/>
  <!-- Stage 5: REVIEW -->
  <rect x="640" y="220" width="120" height="130" rx="10" fill="currentColor" opacity="0.04"/>
  <rect x="640" y="220" width="120" height="130" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.18" stroke-width="1.5"/>
  <circle cx="700" cy="254" r="18" fill="#FF6B00"/>
  <text x="700" y="260" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">5</text>
  <text x="700" y="298" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor">REVIEW</text>
  <text x="700" y="318" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">Watch,</text>
  <text x="700" y="334" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">iterate, repeat</text>
  <!-- Return / iterate arc -->
  <path d="M 700 350 C 700 430, 100 430, 100 350" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="6 5" opacity="0.4" marker-end="url(#wf-arrow)"/>
  <text x="400" y="454" text-anchor="middle" font-size="13" font-weight="600" fill="#FF6B00">iterate</text>
  <text x="400" y="472" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.55">loop back to refine and polish as needed</text>

  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> animation is iterative &#183; expect to loop through refine and polish many times before a shot is done.</text>
</svg>