<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="mp-title mp-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="mp-title">How UV mapping works: from 3D vertex to surface color</title>
  <desc id="mp-desc">A five-stage flowchart connected by orange arrows. Stage one is a 3D vertex with XYZ coordinates. Stage two is its UV coordinate as a U and V pair. Stage three is a 2D texture image with a sample point marked. Stage four is the color picked from that point in the texture. Stage five is the final colored point on the 3D surface.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">HOW UV MAPPING WORKS</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">From a 3D vertex to the final surface color</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Stage nodes: 5 boxes, top row 3 + bottom row 2 zigzag for legibility -->
  <!-- Row 1: stages 1,2,3 at y 150..290 ; Row 2: stages 4,5 -->

  <!-- Stage 1: 3D Vertex -->
  <g>
    <rect x="56" y="160" width="200" height="120" rx="8"
          fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.3"/>
    <text x="156" y="190" font-size="13" font-weight="700" text-anchor="middle" fill="#FF6B00">STAGE 1</text>
    <text x="156" y="216" font-size="15" font-weight="600" text-anchor="middle" fill="currentColor">3D Vertex</text>
    <!-- mini cube glyph -->
    <polygon points="126,236 156,226 186,236 156,246" fill="#FF6B00" fill-opacity="0.12" stroke="currentColor" stroke-width="1" stroke-opacity="0.5"/>
    <polygon points="126,236 156,246 156,266 126,256" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1" stroke-opacity="0.5"/>
    <polygon points="186,236 156,246 156,266 186,256" fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="156" cy="246" r="3.5" fill="#FF6B00"/>
    <text x="156" y="278" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.6">position (X, Y, Z)</text>
  </g>

  <!-- Stage 2: UV Coordinate -->
  <g>
    <rect x="300" y="160" width="200" height="120" rx="8"
          fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.3"/>
    <text x="400" y="190" font-size="13" font-weight="700" text-anchor="middle" fill="#FF6B00">STAGE 2</text>
    <text x="400" y="216" font-size="15" font-weight="600" text-anchor="middle" fill="currentColor">UV Coordinate</text>
    <!-- mini uv square -->
    <rect x="372" y="228" width="40" height="40" fill="#FF6B00" fill-opacity="0.06" stroke="#FF6B00" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="392" cy="248" r="3.5" fill="#FF6B00"/>
    <text x="426" y="252" font-size="12" text-anchor="start" fill="currentColor" opacity="0.6">(u, v)</text>
  </g>

  <!-- Stage 3: Texture Sample -->
  <g>
    <rect x="544" y="160" width="200" height="120" rx="8"
          fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.3"/>
    <text x="644" y="190" font-size="13" font-weight="700" text-anchor="middle" fill="#FF6B00">STAGE 3</text>
    <text x="644" y="216" font-size="15" font-weight="600" text-anchor="middle" fill="currentColor">Texture Sample</text>
    <!-- mini texture checker -->
    <g>
      <rect x="616" y="228" width="40" height="40" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1" stroke-opacity="0.5"/>
      <rect x="616" y="228" width="20" height="20" fill="currentColor" fill-opacity="0.18"/>
      <rect x="636" y="248" width="20" height="20" fill="currentColor" fill-opacity="0.18"/>
      <circle cx="646" cy="238" r="3.5" fill="#FF6B00"/>
    </g>
    <text x="644" y="278" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.6">read pixel at (u, v)</text>
  </g>

  <!-- Stage 4: Color Pick -->
  <g>
    <rect x="300" y="332" width="200" height="120" rx="8"
          fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.3"/>
    <text x="400" y="362" font-size="13" font-weight="700" text-anchor="middle" fill="#FF6B00">STAGE 4</text>
    <text x="400" y="388" font-size="15" font-weight="600" text-anchor="middle" fill="currentColor">Color Pick</text>
    <rect x="372" y="400" width="56" height="32" rx="4" fill="#FF6B00" fill-opacity="0.85"/>
    <text x="400" y="446" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.6">sampled color</text>
  </g>

  <!-- Stage 5: Surface Result -->
  <g>
    <rect x="544" y="332" width="200" height="120" rx="8"
          fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.3"/>
    <text x="644" y="362" font-size="13" font-weight="700" text-anchor="middle" fill="#FF6B00">STAGE 5</text>
    <text x="644" y="388" font-size="15" font-weight="600" text-anchor="middle" fill="currentColor">Surface Result</text>
    <!-- mini shaded face with colored point -->
    <polygon points="616,400 668,400 656,432 604,432" fill="#FF6B00" fill-opacity="0.18" stroke="currentColor" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="636" cy="416" r="4" fill="#FF6B00"/>
    <text x="644" y="446" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.6">colored on surface</text>
  </g>

  <!-- Connectors -->
  <g stroke="#FF6B00" stroke-width="2.5" opacity="0.3" stroke-linecap="round" fill="none">
    <!-- 1 -> 2 -->
    <line x1="256" y1="220" x2="294" y2="220"/>
    <!-- 2 -> 3 -->
    <line x1="500" y1="220" x2="538" y2="220"/>
    <!-- 3 -> 4 (down and across) -->
    <path d="M 644 280 L 644 306 L 400 306 L 400 326"/>
    <!-- 4 -> 5 -->
    <line x1="500" y1="392" x2="538" y2="392"/>
  </g>
  <g fill="#FF6B00" opacity="0.3">
    <polygon points="294,220 282,214 282,226"/>
    <polygon points="538,220 526,214 526,226"/>
    <polygon points="400,326 394,314 406,314"/>
    <polygon points="538,392 526,386 526,398"/>
  </g>

  <!-- Footer tip (Variant B left rail) -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> The UV coordinate is the bridge that links geometry to the texture image.
  </text>
</svg>
