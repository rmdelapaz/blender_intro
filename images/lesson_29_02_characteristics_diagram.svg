<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" role="img" aria-labelledby="hcTitle hcDesc" fill="none" style="max-width:100%;height:auto;color:currentColor">
  <title id="hcTitle">Hard surface characteristics diagram</title>
  <desc id="hcDesc">A mechanical container at three-quarter view with callouts pointing to beveled edges, panel separation, surface details, geometric precision, and flat surfaces.</desc>
  <defs>
    <marker id="hcArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <style>
    .hc-stroke{stroke:currentColor;stroke-width:2;fill:none}
    .hc-thin{stroke:currentColor;stroke-width:1;fill:none;opacity:.55}
    .hc-fill{fill:currentColor;opacity:.06}
    .hc-fill2{fill:currentColor;opacity:.12}
    .hc-lead{stroke:currentColor;stroke-width:1.4;fill:none;opacity:.8}
    .hc-label{font:600 15px system-ui,Arial,sans-serif;fill:currentColor}
    .hc-sub{font:400 11.5px system-ui,Arial,sans-serif;fill:currentColor;opacity:.7}
    .hc-dot{fill:currentColor}
  </style>

  <!-- container body (3/4 view) -->
  <g transform="translate(330,150)">
    <!-- front face -->
    <path class="hc-fill2" d="M0,40 L150,40 L150,200 L0,200 Z"/>
    <path class="hc-stroke" d="M0,40 L150,40 L150,200 L0,200 Z"/>
    <!-- top face -->
    <path class="hc-fill" d="M0,40 L60,0 L210,0 L150,40 Z"/>
    <path class="hc-stroke" d="M0,40 L60,0 L210,0 L150,40 Z"/>
    <!-- side face -->
    <path class="hc-fill" d="M150,40 L210,0 L210,160 L150,200 Z"/>
    <path class="hc-stroke" d="M150,40 L210,0 L210,160 L150,200 Z"/>
    <!-- panel separation line (front) -->
    <line class="hc-thin" x1="0" y1="120" x2="150" y2="120"/>
    <line class="hc-thin" x1="150" y1="120" x2="210" y2="80"/>
    <!-- inset panel (flat surface) -->
    <rect class="hc-thin" x="22" y="58" width="106" height="46"/>
    <!-- bolts / surface details -->
    <circle class="hc-dot" cx="14" cy="52" r="3"/>
    <circle class="hc-dot" cx="136" cy="52" r="3"/>
    <circle class="hc-dot" cx="14" cy="188" r="3"/>
    <circle class="hc-dot" cx="136" cy="188" r="3"/>
    <!-- bevel highlight strip on top edge -->
    <line class="hc-stroke" x1="0" y1="40" x2="150" y2="40" stroke-width="3"/>
  </g>

  <!-- Callout: Beveled edges (top-left) -->
  <g>
    <line class="hc-lead" x1="200" y1="110" x2="330" y2="190" marker-end="url(#hcArrow)"/>
    <text class="hc-label" x="40" y="98">Beveled edges</text>
    <text class="hc-sub" x="40" y="116">soft, light-catching corners</text>
  </g>

  <!-- Callout: Geometric precision (top-right) -->
  <g>
    <line class="hc-lead" x1="700" y1="100" x2="560" y2="160" marker-end="url(#hcArrow)"/>
    <text class="hc-label" x="600" y="90" text-anchor="start">Geometric precision</text>
    <text class="hc-sub" x="600" y="108" text-anchor="start">parallel lines, right angles</text>
  </g>

  <!-- Callout: Panel separation (left-mid) -->
  <g>
    <line class="hc-lead" x1="190" y1="300" x2="332" y2="270" marker-end="url(#hcArrow)"/>
    <text class="hc-label" x="40" y="296">Panel separation</text>
    <text class="hc-sub" x="40" y="314">recessed seams between plates</text>
  </g>

  <!-- Callout: Surface details (right-mid) -->
  <g>
    <line class="hc-lead" x1="720" y1="300" x2="470" y2="200" marker-end="url(#hcArrow)"/>
    <text class="hc-label" x="600" y="296" text-anchor="start">Surface details</text>
    <text class="hc-sub" x="600" y="314" text-anchor="start">bolts, screws, fasteners</text>
  </g>

  <!-- Callout: Flat surfaces (bottom) -->
  <g>
    <line class="hc-lead" x1="420" y1="470" x2="405" y2="312" marker-end="url(#hcArrow)"/>
    <text class="hc-label" x="330" y="500">Flat surfaces</text>
    <text class="hc-sub" x="330" y="518">planar faces, minimal curvature</text>
  </g>

  <text class="hc-sub" x="440" y="30" text-anchor="middle" style="font-size:13px;opacity:.85">What makes a model read as &#8220;hard surface&#8221;</text>
</svg>
