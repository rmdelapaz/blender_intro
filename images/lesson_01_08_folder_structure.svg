<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="fs-title fs-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="fs-title">Recommended Blender Learning Folder Structure</title>
  <desc id="fs-desc">A hierarchical folder organization for Blender course work. The root Blender_Learning folder contains five subfolders: Course_Projects (with Module_01_Getting_Started and Module_02_3D_Modeling subfolders inside), Practice_Files, Reference_Images, Resources, and Portfolio. Each folder is color coded by category.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Recommended Project Organization</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">A clean folder structure keeps your Blender learning organized and easy to navigate.</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Tree connectors -->
  <g stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.3">
    <!-- Root trunk -->
    <line x1="64" y1="166" x2="64" y2="471"/>
    <!-- Branches to top-level children -->
    <line x1="64" y1="201" x2="98" y2="201"/>
    <line x1="64" y1="351" x2="98" y2="351"/>
    <line x1="64" y1="391" x2="98" y2="391"/>
    <line x1="64" y1="431" x2="98" y2="431"/>
    <line x1="64" y1="471" x2="98" y2="471"/>
    <!-- Course_Projects sub-trunk -->
    <line x1="112" y1="210" x2="112" y2="313"/>
    <!-- Branches to grandchildren -->
    <line x1="112" y1="241" x2="142" y2="241"/>
    <line x1="112" y1="277" x2="142" y2="277"/>
    <line x1="112" y1="313" x2="142" y2="313"/>
  </g>

  <!-- Row 1: Root -->
  <path transform="translate(48,140)" d="M 4 7 Q 4 5 6 5 L 11 5 L 14 8 L 26 8 Q 28 8 28 10 L 28 22 Q 28 24 26 24 L 6 24 Q 4 24 4 22 Z" fill="#FF6B00"/>
  <text x="88" y="162" font-size="16" font-weight="600" fill="currentColor">Blender_Learning/</text>
  <text x="360" y="162" font-size="13" fill="currentColor" opacity="0.6" font-style="italic">your root learning folder</text>

  <!-- Row 2: Course_Projects -->
  <path transform="translate(96,184)" d="M 4 7 Q 4 5 6 5 L 11 5 L 14 8 L 26 8 Q 28 8 28 10 L 28 22 Q 28 24 26 24 L 6 24 Q 4 24 4 22 Z" fill="#4A9EFF"/>
  <text x="136" y="206" font-size="15" font-weight="500" fill="currentColor">Course_Projects/</text>
  <text x="360" y="206" font-size="13" fill="currentColor" opacity="0.6">Your work organized by module</text>

  <!-- Row 3: Module_01_Getting_Started -->
  <path transform="translate(140,224)" d="M 4 7 Q 4 5 6 5 L 11 5 L 14 8 L 26 8 Q 28 8 28 10 L 28 22 Q 28 24 26 24 L 6 24 Q 4 24 4 22 Z" fill="#3a7fd1"/>
  <text x="180" y="246" font-size="14" fill="currentColor">Module_01_Getting_Started/</text>

  <!-- Row 4: Module_02_3D_Modeling -->
  <path transform="translate(140,260)" d="M 4 7 Q 4 5 6 5 L 11 5 L 14 8 L 26 8 Q 28 8 28 10 L 28 22 Q 28 24 26 24 L 6 24 Q 4 24 4 22 Z" fill="#3a7fd1"/>
  <text x="180" y="282" font-size="14" fill="currentColor">Module_02_3D_Modeling/</text>

  <!-- Row 5: ellipsis -->
  <text x="180" y="318" font-size="14" fill="currentColor" opacity="0.45" font-style="italic">&#8230; one folder per module</text>

  <!-- Row 6: Practice_Files -->
  <path transform="translate(96,334)" d="M 4 7 Q 4 5 6 5 L 11 5 L 14 8 L 26 8 Q 28 8 28 10 L 28 22 Q 28 24 26 24 L 6 24 Q 4 24 4 22 Z" fill="#B47EE8"/>
  <text x="136" y="356" font-size="15" font-weight="500" fill="currentColor">Practice_Files/</text>
  <text x="360" y="356" font-size="13" fill="currentColor" opacity="0.6">Experiments and freeform exercises</text>

  <!-- Row 7: Reference_Images -->
  <path transform="translate(96,374)" d="M 4 7 Q 4 5 6 5 L 11 5 L 14 8 L 26 8 Q 28 8 28 10 L 28 22 Q 28 24 26 24 L 6 24 Q 4 24 4 22 Z" fill="#FF7EA8"/>
  <text x="136" y="396" font-size="15" font-weight="500" fill="currentColor">Reference_Images/</text>
  <text x="360" y="396" font-size="13" fill="currentColor" opacity="0.6">Inspiration and reference material</text>

  <!-- Row 8: Resources -->
  <path transform="translate(96,414)" d="M 4 7 Q 4 5 6 5 L 11 5 L 14 8 L 26 8 Q 28 8 28 10 L 28 22 Q 28 24 26 24 L 6 24 Q 4 24 4 22 Z" fill="#4ADE80"/>
  <text x="136" y="436" font-size="15" font-weight="500" fill="currentColor">Resources/</text>
  <text x="360" y="436" font-size="13" fill="currentColor" opacity="0.6">Tutorials, links, downloads</text>

  <!-- Row 9: Portfolio -->
  <path transform="translate(96,454)" d="M 4 7 Q 4 5 6 5 L 11 5 L 14 8 L 26 8 Q 28 8 28 10 L 28 22 Q 28 24 26 24 L 6 24 Q 4 24 4 22 Z" fill="#F5C242"/>
  <text x="136" y="476" font-size="15" font-weight="500" fill="currentColor">Portfolio/</text>
  <text x="360" y="476" font-size="13" fill="currentColor" opacity="0.6">Your best finished work</text>

  <!-- Footer tip -->
  <rect x="40" y="506" width="720" height="34" rx="6" fill="#FF6B00" fill-opacity="0.10" stroke="#FF6B00" stroke-opacity="0.4"/>
  <text x="54" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Set this up before opening Blender &#8212; future-you will thank you.
  </text>
</svg>
