<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="am-title am-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="am-title">Axis-Constrained Movement in Blender</title>
  <desc id="am-desc">A three-panel comparison of axis-constrained movement in Blender. The left panel shows the G then X shortcut: a ghost cube on the left and a solid cube on the right are connected by a red horizontal arrow, illustrating motion locked to the X axis. The middle panel shows G then Y: a ghost cube in the lower-left and a solid cube in the upper-right are connected by a green diagonal arrow, illustrating motion locked to the Y axis (away from the viewer). The right panel shows G then Z: a ghost cube at the bottom and a solid cube at the top are connected by a blue vertical arrow, illustrating motion locked to the Z axis. A shared note below the panels explains that pressing the axis key twice (G X X, G Y Y, G Z Z) locks to local axes instead of global. A footer tip explains that typing a number after the key combo moves a precise distance, for example G Z 2 moves up 2 units.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">AXIS-CONSTRAINED MOVEMENT</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">G plus an axis key locks the move to one direction</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Subhead -->
  <text x="400" y="142" font-size="15" font-weight="700" fill="#FF6B00" text-anchor="middle" letter-spacing="2">MOVE ALONG X, Y, OR Z</text>

  <!-- =============================================================== -->
  <!-- THREE PANELS                                                     -->
  <!-- Panel 1 (G X):  translate(40, 170)   220 x 250                   -->
  <!-- Panel 2 (G Y):  translate(290, 170)  220 x 250                   -->
  <!-- Panel 3 (G Z):  translate(540, 170)  220 x 250                   -->
  <!-- =============================================================== -->

  <!-- ===== PANEL 1: G then X (red axis, horizontal) ===== -->
  <g transform="translate(40, 170)">
    <rect x="0" y="0" width="220" height="250" rx="8"
          fill="currentColor" fill-opacity="0.04"
          stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>

    <!-- Tool name -->
    <text x="14" y="26" font-size="14" font-weight="700" fill="currentColor">Move along X</text>

    <!-- Key badge: G X -->
    <g transform="translate(170, 10)">
      <rect x="0" y="0" width="36" height="22" rx="4" fill="#FF6B00"/>
      <text x="18" y="16" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">G X</text>
    </g>

    <!-- Ghost cube (starting position, left) -->
    <g opacity="0.30" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="24" y="105" width="30" height="30"/>
      <polygon points="24,105 34,95 64,95 54,105"/>
      <polygon points="54,105 64,95 64,125 54,135"/>
    </g>

    <!-- Solid cube (ending position, right) -->
    <g opacity="0.10">
      <rect x="146" y="105" width="30" height="30" fill="currentColor"/>
      <polygon points="146,105 156,95 186,95 176,105" fill="currentColor"/>
      <polygon points="176,105 186,95 186,125 176,135" fill="currentColor"/>
    </g>
    <g stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
      <rect x="146" y="105" width="30" height="30"/>
      <polygon points="146,105 156,95 186,95 176,105"/>
      <polygon points="176,105 186,95 186,125 176,135"/>
    </g>

    <!-- X translation arrow (red, horizontal) -->
    <line x1="70" y1="120" x2="140" y2="120" stroke="#E63946" stroke-width="4" stroke-linecap="round"/>
    <polygon points="140,120 128,114 128,126" fill="#E63946"/>

    <!-- Description -->
    <text x="110" y="216" font-size="12" fill="currentColor" opacity="0.75" text-anchor="middle">Move along X</text>
    <text x="110" y="232" font-size="12" font-weight="600" fill="#E63946" text-anchor="middle">(red axis)</text>
  </g>

  <!-- ===== PANEL 2: G then Y (green axis, into the scene) ===== -->
  <g transform="translate(290, 170)">
    <rect x="0" y="0" width="220" height="250" rx="8"
          fill="currentColor" fill-opacity="0.04"
          stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>

    <!-- Tool name -->
    <text x="14" y="26" font-size="14" font-weight="700" fill="currentColor">Move along Y</text>

    <!-- Key badge: G Y -->
    <g transform="translate(170, 10)">
      <rect x="0" y="0" width="36" height="22" rx="4" fill="#FF6B00"/>
      <text x="18" y="16" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">G Y</text>
    </g>

    <!-- Ghost cube (starting position, foreground / lower-left) -->
    <g opacity="0.30" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="24" y="132" width="30" height="30"/>
      <polygon points="24,132 34,122 64,122 54,132"/>
      <polygon points="54,132 64,122 64,152 54,162"/>
    </g>

    <!-- Solid cube (ending position, "deeper" / upper-right) -->
    <g opacity="0.10">
      <rect x="140" y="62" width="30" height="30" fill="currentColor"/>
      <polygon points="140,62 150,52 180,52 170,62" fill="currentColor"/>
      <polygon points="170,62 180,52 180,82 170,92" fill="currentColor"/>
    </g>
    <g stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
      <rect x="140" y="62" width="30" height="30"/>
      <polygon points="140,62 150,52 180,52 170,62"/>
      <polygon points="170,62 180,52 180,82 170,92"/>
    </g>

    <!-- Y translation arrow (green, diagonal upper-right) -->
    <line x1="58" y1="136" x2="136" y2="88" stroke="#4ADE80" stroke-width="4" stroke-linecap="round"/>
    <polygon points="136,88 128,97 124,91" fill="#4ADE80"/>

    <!-- Description -->
    <text x="110" y="216" font-size="12" fill="currentColor" opacity="0.75" text-anchor="middle">Move along Y</text>
    <text x="110" y="232" font-size="12" font-weight="600" fill="#4ADE80" text-anchor="middle">(green axis)</text>
  </g>

  <!-- ===== PANEL 3: G then Z (blue axis, vertical) ===== -->
  <g transform="translate(540, 170)">
    <rect x="0" y="0" width="220" height="250" rx="8"
          fill="currentColor" fill-opacity="0.04"
          stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>

    <!-- Tool name -->
    <text x="14" y="26" font-size="14" font-weight="700" fill="currentColor">Move along Z</text>

    <!-- Key badge: G Z -->
    <g transform="translate(170, 10)">
      <rect x="0" y="0" width="36" height="22" rx="4" fill="#FF6B00"/>
      <text x="18" y="16" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">G Z</text>
    </g>

    <!-- Ghost cube (starting position, bottom) -->
    <g opacity="0.30" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="90" y="150" width="30" height="30"/>
      <polygon points="90,150 100,140 130,140 120,150"/>
      <polygon points="120,150 130,140 130,170 120,180"/>
    </g>

    <!-- Solid cube (ending position, top) -->
    <g opacity="0.10">
      <rect x="90" y="60" width="30" height="30" fill="currentColor"/>
      <polygon points="90,60 100,50 130,50 120,60" fill="currentColor"/>
      <polygon points="120,60 130,50 130,80 120,90" fill="currentColor"/>
    </g>
    <g stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
      <rect x="90" y="60" width="30" height="30"/>
      <polygon points="90,60 100,50 130,50 120,60"/>
      <polygon points="120,60 130,50 130,80 120,90"/>
    </g>

    <!-- Z translation arrow (blue, vertical, points up) -->
    <line x1="110" y1="138" x2="110" y2="98" stroke="#4A9EFF" stroke-width="4" stroke-linecap="round"/>
    <polygon points="110,92 103,106 117,106" fill="#4A9EFF"/>

    <!-- Description -->
    <text x="110" y="216" font-size="12" fill="currentColor" opacity="0.75" text-anchor="middle">Move along Z</text>
    <text x="110" y="232" font-size="12" font-weight="600" fill="#4A9EFF" text-anchor="middle">(blue axis)</text>
  </g>

  <!-- ===== Shared "local vs global" inset ===== -->
  <g transform="translate(60, 438)">
    <rect x="0" y="0" width="680" height="52" rx="6"
          fill="currentColor" fill-opacity="0.04"
          stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>
    <text x="14" y="20" font-size="11" font-weight="700" fill="currentColor" opacity="0.75" letter-spacing="0.8">LOCAL VS GLOBAL</text>
    <text x="14" y="40" font-size="12" fill="currentColor" opacity="0.8">Press the axis key twice (G X X, G Y Y, G Z Z) to lock to the object's local axes instead of the world axes.</text>
  </g>

  <!-- Footer tip callout -->
  <rect x="40" y="506" width="720" height="34" rx="6"
        fill="#FF6B00" fill-opacity="0.10"
        stroke="#FF6B00" stroke-opacity="0.4"/>
  <text x="54" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Type a number after the key combo for an exact distance. G Z 2 moves the object up by 2 units.
  </text>
</svg>
