<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="as-title as-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="as-title">The anticipation, action, follow-through sequence</title>
  <desc id="as-desc">Three sequential panels showing the beats of an action. Panel one, anticipation: the figure winds up by pulling back, shown with a backward arrow. Panel two, action: the main fast move forward, shown with a long forward arrow and motion-spacing dots. Panel three, follow-through: a small overshoot past the target that settles back, shown with a short curved arrow.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">ANTICIPATION &#183; ACTION &#183; FOLLOW-THROUGH</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Every action reads better with a wind-up before and a settle after</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ====== Panel 1: ANTICIPATION ====== -->
  <circle cx="58" cy="150" r="13" fill="#FF6B00"/>
  <text x="58" y="155" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
  <rect x="80" y="138" width="136" height="24" rx="4" fill="#FF6B00" fill-opacity="0.12" stroke="#FF6B00" stroke-opacity="0.45"/>
  <text x="148" y="155" font-size="13" font-weight="700" text-anchor="middle" fill="#FF6B00">ANTICIPATION</text>
  <text x="40" y="186" font-size="13" fill="currentColor" opacity="0.6">Wind-up: pull back opposite the move</text>

  <!-- baseline -->
  <line x1="40" y1="360" x2="270" y2="360" stroke="currentColor" stroke-width="2" opacity="0.5"/>
  <!-- neutral ghost (dashed outline) at rest position -->
  <ellipse cx="185" cy="330" rx="20" ry="30" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.35"/>
  <!-- crouched / pulled-back figure (orange) leaning back -->
  <ellipse cx="150" cy="338" rx="22" ry="24" fill="#FF6B00" transform="rotate(-18 150 338)"/>
  <!-- back-pointing arrow -->
  <line x1="170" y1="250" x2="110" y2="250" stroke="#FF6B00" stroke-width="3" stroke-linecap="round"/>
  <polygon points="110,250 122,244 122,256" fill="#FF6B00"/>
  <text x="155" y="240" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor">pull back</text>
  <text x="218" y="300" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">rest</text>
  <text x="40" y="388" font-size="11" fill="currentColor" opacity="0.7">frames 1&#8211;8</text>

  <!-- divider -->
  <line x1="288" y1="138" x2="288" y2="470" stroke="currentColor" stroke-width="1" opacity="0.12"/>

  <!-- ====== Panel 2: ACTION ====== -->
  <circle cx="316" cy="150" r="13" fill="#FF6B00"/>
  <text x="316" y="155" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
  <rect x="338" y="138" width="100" height="24" rx="4" fill="#FF6B00" fill-opacity="0.12" stroke="#FF6B00" stroke-opacity="0.45"/>
  <text x="388" y="155" font-size="13" font-weight="700" text-anchor="middle" fill="#FF6B00">ACTION</text>
  <text x="304" y="186" font-size="13" fill="currentColor" opacity="0.6">Fast travel in the intended direction</text>

  <!-- baseline -->
  <line x1="304" y1="360" x2="534" y2="360" stroke="currentColor" stroke-width="2" opacity="0.5"/>
  <!-- start ghost (dashed) -->
  <ellipse cx="322" cy="330" rx="18" ry="26" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.35"/>
  <!-- moving figure (orange) at end -->
  <ellipse cx="512" cy="330" rx="20" ry="28" fill="#FF6B00"/>
  <!-- long forward arrow -->
  <line x1="318" y1="250" x2="512" y2="250" stroke="#FF6B00" stroke-width="3" stroke-linecap="round"/>
  <polygon points="512,250 498,243 498,257" fill="#FF6B00"/>
  <text x="415" y="240" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor">main move</text>
  <!-- motion spacing dots widening (fast) -->
  <circle cx="350" cy="330" r="4" fill="#FF6B00" opacity="0.6"/>
  <circle cx="372" cy="330" r="4" fill="#FF6B00" opacity="0.6"/>
  <circle cx="400" cy="330" r="4" fill="#FF6B00" opacity="0.6"/>
  <circle cx="436" cy="330" r="4" fill="#FF6B00" opacity="0.6"/>
  <circle cx="478" cy="330" r="4" fill="#FF6B00" opacity="0.6"/>
  <text x="410" y="392" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.7">wide spacing = fast</text>
  <text x="304" y="392" font-size="11" fill="currentColor" opacity="0.0">.</text>

  <!-- divider -->
  <line x1="552" y1="138" x2="552" y2="470" stroke="currentColor" stroke-width="1" opacity="0.12"/>

  <!-- ====== Panel 3: FOLLOW-THROUGH ====== -->
  <circle cx="580" cy="150" r="13" fill="#FF6B00"/>
  <text x="580" y="155" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
  <rect x="602" y="138" width="150" height="24" rx="4" fill="#FF6B00" fill-opacity="0.12" stroke="#FF6B00" stroke-opacity="0.45"/>
  <text x="677" y="155" font-size="13" font-weight="700" text-anchor="middle" fill="#FF6B00">FOLLOW-THROUGH</text>
  <text x="568" y="186" font-size="13" fill="currentColor" opacity="0.6">Overshoot, then settle back</text>

  <!-- baseline -->
  <line x1="568" y1="360" x2="760" y2="360" stroke="currentColor" stroke-width="2" opacity="0.5"/>
  <!-- target/settle ghost (dashed) -->
  <ellipse cx="660" cy="330" rx="18" ry="26" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.35"/>
  <!-- overshot figure (orange) leaning past -->
  <ellipse cx="710" cy="332" rx="19" ry="26" fill="#FF6B00" transform="rotate(12 710 332)"/>
  <!-- short overshoot-and-back curved arrow -->
  <path d="M 640 250 Q 720 224 700 270" fill="none" stroke="#FF6B00" stroke-width="3" stroke-linecap="round"/>
  <polygon points="700,270 706,256 692,260" fill="#FF6B00"/>
  <text x="678" y="240" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor">overshoot</text>
  <text x="660" y="300" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">settle</text>
  <text x="568" y="392" font-size="11" fill="currentColor" opacity="0.7">frames 16&#8211;24</text>

  <!-- Footer tip (Variant B left rail) -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Anticipation tells the viewer what is about to happen &#183; a bigger wind-up reads as a bigger action.
  </text>
</svg>
