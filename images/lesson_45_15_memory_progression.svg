<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t15 d15" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" color="#222">
<title id="t15">Memory usage progression and danger zones</title>
<desc id="d15">A rising curve of RAM/VRAM usage as scene complexity grows, crossing a safe green zone, a caution amber zone, and a red danger zone where the system swaps or crashes.</desc>
<text x="320" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="currentColor">Memory Progression &amp; Danger Zones</text>
<!-- plot frame -->
<rect x="70" y="60" width="500" height="230" fill="none" stroke="#4A9EFF" stroke-width="1" opacity="0.4"/>
<!-- zone bands -->
<rect x="70" y="230" width="500" height="60" fill="#4ADE80" opacity="0.14"/>
<rect x="70" y="150" width="500" height="80" fill="#F5C242" opacity="0.16"/>
<rect x="70" y="60" width="500" height="90" fill="#E63946" opacity="0.16"/>
<text x="562" y="266" text-anchor="end" font-size="12" fill="#4ADE80" font-weight="600">Safe</text>
<text x="562" y="196" text-anchor="end" font-size="12" fill="#F5C242" font-weight="600">Caution</text>
<text x="562" y="96" text-anchor="end" font-size="12" fill="#E63946" font-weight="600">Danger &#8212; swap / crash</text>
<!-- axes labels -->
<text x="60" y="66" text-anchor="end" font-size="11" fill="currentColor">100%</text>
<text x="60" y="234" text-anchor="end" font-size="11" fill="currentColor">40%</text>
<text x="60" y="294" text-anchor="end" font-size="11" fill="currentColor">0%</text>
<text x="320" y="316" text-anchor="middle" font-size="12" fill="currentColor">Scene complexity &#8594; (geometry &#183; textures &#183; subdivisions)</text>
<text x="26" y="175" text-anchor="middle" font-size="12" fill="currentColor" transform="rotate(-90 26 175)">Memory used</text>
<!-- rising curve -->
<path d="M70 282 C 190 276, 250 250, 320 210 S 470 120, 570 74" fill="none" stroke="#FF6B00" stroke-width="3"/>
<circle cx="320" cy="210" r="4" fill="#FF6B00"/>
<circle cx="470" cy="132" r="4" fill="#FF6B00"/>
<text x="330" y="205" font-size="11" fill="#FF6B00">headroom shrinking</text>
<rect x="70" y="330" width="500" height="24" rx="5" fill="#E63946" opacity="0.12"/>
<text x="320" y="346" text-anchor="middle" font-size="12" fill="currentColor">Keep a buffer &#8212; free RAM/VRAM before the curve enters the red zone.</text>
</svg>
