<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" color="#222" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" role="img" aria-labelledby="lod49-t lod49-d">
  <title id="lod49-t">Level of Detail: Match Geometry Budget to Camera Distance</title>
  <desc id="lod49-d">Three distance bands &#8212; close, medium, and far from the camera &#8212; each mapped to how much modelling detail is worth building, illustrating the core efficiency principle of spending polygon budget only where the camera can see it.</desc>
  <rect x="0" y="0" width="760" height="400" fill="none"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="currentColor">Level of Detail &#8212; Match Effort to Distance</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#8a8f98">The camera decides how much geometry a surface actually deserves</text>

  <!-- camera -->
  <g>
    <rect x="40" y="196" width="34" height="24" rx="4" fill="#1a1a1a" stroke="#8a8f98" stroke-width="1.5"/>
    <path d="M74,202 L92,194 L92,222 L74,214 Z" fill="#1a1a1a" stroke="#8a8f98" stroke-width="1.5"/>
    <text x="57" y="244" text-anchor="middle" font-size="12" font-weight="600" fill="#8a8f98">CAMERA</text>
  </g>
  <!-- view cone -->
  <path d="M92,208 L710,120 L710,296 Z" fill="#4A9EFF" fill-opacity="0.06" stroke="#4A9EFF" stroke-opacity="0.25" stroke-width="1"/>

  <!-- CLOSE band -->
  <g>
    <rect x="120" y="150" width="150" height="116" rx="9" fill="#1a1a1a" stroke="#FF6B00" stroke-width="2"/>
    <text x="195" y="176" text-anchor="middle" font-size="14" font-weight="700" fill="#FF6B00">CLOSE</text>
    <text x="195" y="196" text-anchor="middle" font-size="11.5" fill="#8a8f98">hero foreground</text>
    <text x="195" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#e0e0e0">Full detail</text>
    <text x="195" y="242" text-anchor="middle" font-size="11.5" fill="#c9ccd1">bevels, trims, wear,</text>
    <text x="195" y="257" text-anchor="middle" font-size="11.5" fill="#c9ccd1">real geometry</text>
  </g>
  <!-- MEDIUM band -->
  <g>
    <rect x="320" y="158" width="150" height="100" rx="9" fill="#1a1a1a" stroke="#F5C242" stroke-width="2"/>
    <text x="395" y="184" text-anchor="middle" font-size="14" font-weight="700" fill="#F5C242">MEDIUM</text>
    <text x="395" y="204" text-anchor="middle" font-size="11.5" fill="#8a8f98">mid-ground</text>
    <text x="395" y="228" text-anchor="middle" font-size="13" font-weight="700" fill="#e0e0e0">Simplified</text>
    <text x="395" y="247" text-anchor="middle" font-size="11.5" fill="#c9ccd1">shape reads, detail</text>
  </g>
  <!-- FAR band -->
  <g>
    <rect x="520" y="168" width="150" height="80" rx="9" fill="#1a1a1a" stroke="#4ADE80" stroke-width="2"/>
    <text x="595" y="194" text-anchor="middle" font-size="14" font-weight="700" fill="#4ADE80">FAR</text>
    <text x="595" y="213" text-anchor="middle" font-size="11.5" fill="#8a8f98">background</text>
    <text x="595" y="235" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e0e0e0">Box + texture</text>
  </g>

  <text x="380" y="312" text-anchor="middle" font-size="13.5" fill="#c9ccd1">Detail the camera can't resolve is detail you paid for and no one sees.</text>
  <rect x="205" y="332" width="350" height="40" rx="8" fill="#1a1a1a"/>
  <text x="380" y="357" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4ADE80">Build where the lens looks. Simplify everywhere else.</text>
</svg>
