<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="la-title la-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="la-title">Line of action: C-curve, S-curve, and straight-line poses</title>
  <desc id="la-desc">Three stick-figure poses shown in profile, each with a guiding line of action drawn through the body. The first leans into a single C-curve for a dynamic, one-direction gesture. The second flows through an S-curve for a natural, relaxed stance. The third stands along a straight vertical line for a rigid, formal pose.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">The Line of Action</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">One sweeping line through the body sets the energy of a pose</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Panel dividers -->
  <line x1="280" y1="140" x2="280" y2="470" stroke="currentColor" stroke-width="1" opacity="0.12"/>
  <line x1="520" y1="140" x2="520" y2="470" stroke="currentColor" stroke-width="1" opacity="0.12"/>

  <!-- ============ PANEL 1: C-curve (dynamic) ============ -->
  <text x="140" y="170" text-anchor="middle" font-size="16" font-weight="600" fill="currentColor">C-Curve</text>

  <!-- Line of action (orange, behind figure) -->
  <path d="M 110 200 Q 200 300 120 420" fill="none" stroke="#FF6B00" stroke-width="7" stroke-linecap="round" opacity="0.85"/>

  <!-- Stick figure leaning into the C -->
  <g stroke="currentColor" stroke-width="3.5" stroke-linecap="round" fill="none">
    <!-- head -->
    <circle cx="118" cy="205" r="13" fill="currentColor" opacity="0.85" stroke="none"/>
    <!-- spine following curve -->
    <path d="M 118 218 Q 168 290 130 372"/>
    <!-- arms reaching -->
    <path d="M 140 250 Q 185 230 205 210"/>
    <path d="M 138 258 Q 175 280 200 300"/>
    <!-- legs -->
    <path d="M 130 372 Q 110 400 100 430"/>
    <path d="M 130 372 Q 150 405 162 432"/>
  </g>

  <text x="140" y="452" text-anchor="middle" font-size="13" font-weight="600" fill="#FF6B00">Dynamic</text>
  <text x="140" y="472" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">Single direction, full of energy</text>

  <!-- ============ PANEL 2: S-curve (natural) ============ -->
  <text x="400" y="170" text-anchor="middle" font-size="16" font-weight="600" fill="currentColor">S-Curve</text>

  <!-- Line of action (purple) -->
  <path d="M 400 198 C 350 260 460 320 400 420" fill="none" stroke="#B47EE8" stroke-width="7" stroke-linecap="round" opacity="0.9"/>

  <!-- Stick figure, contrapposto S -->
  <g stroke="currentColor" stroke-width="3.5" stroke-linecap="round" fill="none">
    <circle cx="395" cy="205" r="13" fill="currentColor" opacity="0.85" stroke="none"/>
    <path d="M 395 218 C 372 260 432 310 402 372"/>
    <!-- arms relaxed -->
    <path d="M 388 250 Q 360 275 358 300"/>
    <path d="M 410 252 Q 440 272 444 298"/>
    <!-- legs -->
    <path d="M 402 372 Q 392 405 388 432"/>
    <path d="M 402 372 Q 420 402 428 430"/>
  </g>

  <text x="400" y="452" text-anchor="middle" font-size="13" font-weight="600" fill="#B47EE8">Natural</text>
  <text x="400" y="472" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">Relaxed, flowing contrapposto</text>

  <!-- ============ PANEL 3: Straight (rigid) ============ -->
  <text x="660" y="170" text-anchor="middle" font-size="16" font-weight="600" fill="currentColor">Straight Line</text>

  <!-- Line of action (currentColor, full weight) -->
  <line x1="660" y1="198" x2="660" y2="420" stroke="currentColor" stroke-width="7" stroke-linecap="round" opacity="0.7"/>

  <!-- Stick figure at attention -->
  <g stroke="currentColor" stroke-width="3.5" stroke-linecap="round" fill="none">
    <circle cx="660" cy="205" r="13" fill="currentColor" opacity="0.85" stroke="none"/>
    <line x1="660" y1="218" x2="660" y2="372"/>
    <!-- arms straight at sides -->
    <line x1="660" y1="248" x2="640" y2="320"/>
    <line x1="660" y1="248" x2="680" y2="320"/>
    <!-- legs straight -->
    <line x1="660" y1="372" x2="648" y2="432"/>
    <line x1="660" y1="372" x2="672" y2="432"/>
  </g>

  <text x="660" y="452" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Rigid</text>
  <text x="660" y="472" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">Formal, static, at attention</text>

  <!-- Footer tip (Variant B, left rail) -->
  <rect x="40" y="506" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Sketch the line of action first, then build the pose along it &#183; clear lines make clear poses.
  </text>
</svg>
