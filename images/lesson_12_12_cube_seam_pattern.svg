<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="cu-title cu-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="cu-title">Cube Seam Pattern and Resulting UV Layout</title>
  <desc id="cu-desc">A two panel diagram. The left panel shows a cube in perspective with seven edges marked as seams in red. The right panel shows the resulting flat UV layout, a cross shape of six connected squares: four in a vertical column with two more attached to the sides of the second square.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">CUBE SEAM PATTERN</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Seven seam edges unfold the six faces into a flat cross</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Panel divider -->
  <line x1="400" y1="138" x2="400" y2="496" stroke="#FF6B00" stroke-width="2" opacity="0.55"/>

  <!-- Panel labels -->
  <text x="200" y="158" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor">3D Model &#183; Seams</text>
  <text x="600" y="158" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor">UV Layout</text>

  <!-- LEFT: cube in perspective, cyan edges -->
  <g stroke="#00bcd4" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- front face -->
    <path d="M 140 250 L 240 250 L 240 350 L 140 350 Z"/>
    <!-- top face -->
    <path d="M 140 250 L 190 200 L 290 200 L 240 250"/>
    <!-- right face -->
    <path d="M 240 250 L 290 200 L 290 300 L 240 350"/>
  </g>

  <!-- LEFT: 7 seam edges in red -->
  <g stroke="#ff0000" stroke-width="4" fill="none" stroke-linecap="round">
    <!-- top face perimeter (3 visible edges) -->
    <path d="M 140 250 L 190 200"/>
    <path d="M 190 200 L 290 200"/>
    <path d="M 290 200 L 240 250"/>
    <!-- one vertical edge front-right -->
    <path d="M 240 250 L 240 350"/>
    <!-- bottom front edge -->
    <path d="M 140 350 L 240 350"/>
    <!-- right face outer vertical -->
    <path d="M 290 200 L 290 300"/>
    <!-- right face bottom -->
    <path d="M 290 300 L 240 350"/>
  </g>

  <!-- RIGHT: cross UV layout, 6 connected squares, orange -->
  <g stroke="#FF6B00" stroke-width="2.5" fill="#FF6B00" fill-opacity="0.10">
    <!-- vertical column of 4 -->
    <rect x="568" y="200" width="64" height="64"/>
    <rect x="568" y="264" width="64" height="64"/>
    <rect x="568" y="328" width="64" height="64"/>
    <rect x="568" y="392" width="64" height="64"/>
    <!-- two side squares on second cell -->
    <rect x="504" y="264" width="64" height="64"/>
    <rect x="632" y="264" width="64" height="64"/>
  </g>
  <!-- face labels inside the cross -->
  <g font-size="12" font-weight="600" fill="currentColor" text-anchor="middle" opacity="0.8">
    <text x="600" y="237">Top</text>
    <text x="600" y="301">Front</text>
    <text x="600" y="365">Bottom</text>
    <text x="600" y="429">Back</text>
    <text x="536" y="301">Left</text>
    <text x="664" y="301">Right</text>
  </g>

  <!-- Footer tip (Variant B) -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> A cube unwraps with no distortion: every face is already flat, so the checker stays perfectly square.
  </text>
</svg>
