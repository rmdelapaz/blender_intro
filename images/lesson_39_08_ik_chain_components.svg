<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="icc-title icc-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="icc-title">IK chain components breakdown</title>
  <desc id="icc-desc">A technical diagram of the three parts of an IK chain. A two-bone deformation chain (upper arm and forearm) sits on the left, joined by a parent-child link. A hand-shaped IK target on the right is what the animator moves; an arrow shows the solve direction back into the chain. A pole target sphere above the elbow controls which way the elbow points. A constraint settings box at the bottom lists the IK constraint target, chain length of two, and pole target.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">IK CHAIN COMPONENTS</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Chain · IK target · pole target · the three parts of every IK setup</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Pole target (top center) -->
  <circle cx="360" cy="170" r="13" fill="none" stroke="#00bcd4" stroke-width="3"/>
  <text x="384" y="166" font-size="15" font-weight="600" fill="#00bcd4">Pole Target</text>
  <text x="384" y="186" font-size="13" fill="currentColor" opacity="0.6">Controls elbow direction</text>
  <!-- dotted link pole -> elbow -->
  <g stroke="#00bcd4" stroke-width="1.5" opacity="0.5" stroke-dasharray="3 3" fill="none">
    <line x1="360" y1="183" x2="360" y2="300"/>
  </g>

  <!-- ===== Deformation chain (left) ===== -->
  <text x="40" y="240" font-size="18" font-weight="600" fill="currentColor">Deformation chain</text>

  <!-- Chain bone 1 (upper arm) -->
  <g stroke="currentColor" stroke-width="4" opacity="0.5" stroke-linecap="round" fill="none">
    <line x1="120" y1="300" x2="360" y2="300"/>
  </g>
  <circle cx="120" cy="300" r="7" fill="currentColor" opacity="0.5"/>
  <text x="150" y="288" font-size="14" fill="currentColor">Chain Bone 1 · upper arm</text>

  <!-- elbow joint -->
  <circle cx="360" cy="300" r="6" fill="#FF6B00"/>
  <text x="330" y="338" font-size="12" fill="currentColor" opacity="0.6">elbow</text>

  <!-- parent-child marker between bones -->
  <text x="222" y="322" font-size="12" fill="currentColor" opacity="0.45" font-style="italic">parent → child</text>

  <!-- Chain bone 2 (forearm) -->
  <g stroke="currentColor" stroke-width="4" opacity="0.5" stroke-linecap="round" fill="none">
    <line x1="360" y1="300" x2="560" y2="360"/>
  </g>
  <text x="372" y="356" font-size="14" fill="currentColor">Chain Bone 2 · forearm</text>

  <!-- ===== IK target (right) ===== -->
  <rect x="556" y="346" width="30" height="30" rx="4" fill="none" stroke="#00bcd4" stroke-width="3"/>
  <text x="600" y="356" font-size="15" font-weight="600" fill="#00bcd4">IK Target</text>
  <text x="600" y="376" font-size="13" fill="currentColor" opacity="0.6">Animator moves this</text>

  <!-- solve-direction arrow: target back into chain -->
  <g stroke="#00bcd4" stroke-width="2" opacity="0.7" fill="none" stroke-linecap="round">
    <line x1="556" y1="400" x2="372" y2="400"/>
    <polyline points="384,392 372,400 384,408" fill="#00bcd4" stroke="none"/>
  </g>
  <text x="392" y="392" font-size="12" fill="currentColor" opacity="0.6">solve direction</text>

  <!-- ===== Constraint settings box (bottom) ===== -->
  <rect x="40" y="470" width="720" height="120" rx="8" fill="none" stroke="currentColor" stroke-width="1" opacity="0.15"/>
  <rect x="40" y="470" width="4" height="120" fill="#00bcd4"/>
  <text x="64" y="500" font-size="16" font-weight="600" fill="#00bcd4">IK Constraint</text>
  <text x="64" y="528" font-size="14" fill="currentColor">Target: hand_IK.L</text>
  <text x="64" y="552" font-size="14" fill="currentColor">Chain Length: 2</text>
  <text x="64" y="576" font-size="14" fill="currentColor">Pole Target: elbow_pole.L</text>
  <text x="430" y="528" font-size="13" fill="currentColor" opacity="0.6">Lives on the last chain bone (forearm).</text>
  <text x="430" y="552" font-size="13" fill="currentColor" opacity="0.6">Length 2 = solver affects forearm + upper arm.</text>
  <text x="430" y="576" font-size="13" fill="currentColor" opacity="0.6">Pole keeps the elbow from flipping.</text>

  <!-- Footer tip (Variant B, left rail, dense y641) -->
  <rect x="40" y="641" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Every IK chain needs all three: a chain to solve, a target to reach, and a pole to aim the bend.</text>
</svg>