<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="cn-title cn-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="cn-title">Constant interpolation visualization</title>
  <desc id="cn-desc">A value-versus-time graph showing the stair-step pattern produced by Constant interpolation. The value holds flat between keyframes, then jumps instantly to the next value. Keyframes sit at frame 1 value 0, frame 24 value 10, and frame 36 value 5. There is no interpolation between keyframes.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Constant Interpolation</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Hold then jump &#183; no in-between values &#183; stepped motion</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Graph plot area: x 120..720, y 150..450; frames 1..36 across, value 0..10 -->
  <!-- frame x: f1=120, f24=520, f36=720 ; value y: 0=450, 5=300, 10=150 -->
  <g stroke="currentColor" opacity="0.15" stroke-width="1">
    <line x1="120" y1="150" x2="120" y2="450"/>
    <line x1="520" y1="150" x2="520" y2="450"/>
    <line x1="720" y1="150" x2="720" y2="450"/>
    <line x1="120" y1="450" x2="720" y2="450"/>
    <line x1="120" y1="300" x2="720" y2="300"/>
    <line x1="120" y1="150" x2="720" y2="150"/>
  </g>

  <!-- Axis lines -->
  <g stroke="currentColor" opacity="0.45" stroke-width="1.5" stroke-linecap="round">
    <line x1="120" y1="150" x2="120" y2="450"/>
    <line x1="120" y1="450" x2="720" y2="450"/>
  </g>

  <!-- Axis labels: X -->
  <text x="420" y="492" font-size="13" text-anchor="middle" fill="currentColor" opacity="0.6">TIME (frames)</text>
  <text x="120" y="470" font-size="13" text-anchor="middle" fill="currentColor" opacity="0.6">1</text>
  <text x="520" y="470" font-size="13" text-anchor="middle" fill="currentColor" opacity="0.6">24</text>
  <text x="720" y="470" font-size="13" text-anchor="middle" fill="currentColor" opacity="0.6">36</text>

  <!-- Axis labels: Y -->
  <text x="64" y="300" font-size="13" text-anchor="middle" fill="currentColor" opacity="0.6" transform="rotate(-90 64 300)">VALUE</text>
  <text x="104" y="455" font-size="13" text-anchor="end" fill="currentColor" opacity="0.6">0</text>
  <text x="104" y="305" font-size="13" text-anchor="end" fill="currentColor" opacity="0.6">5</text>
  <text x="104" y="155" font-size="13" text-anchor="end" fill="currentColor" opacity="0.6">10</text>

  <!-- Stair-step path: hold at 0 from f1..f24, jump to 10, hold to f36, jump to 5 -->
  <!-- holds in orange, jumps drawn as lighter dashed verticals -->
  <g stroke="#FF6B00" stroke-width="4" stroke-linecap="round" fill="none">
    <!-- hold value 0, f1 -> f24 -->
    <line x1="120" y1="450" x2="520" y2="450"/>
    <!-- hold value 10, f24 -> f36 -->
    <line x1="520" y1="150" x2="720" y2="150"/>
  </g>
  <!-- instant jumps (vertical, dashed, muted) -->
  <g stroke="#FF6B00" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.55" stroke-linecap="round">
    <line x1="520" y1="450" x2="520" y2="150"/>
    <line x1="720" y1="150" x2="720" y2="300"/>
  </g>

  <!-- Keyframe diamonds (yellow): f1/v0, f24/v10, f36/v5 -->
  <path d="M 120 438 L 132 450 L 120 462 L 108 450 Z" fill="#F5C242" stroke="currentColor" stroke-opacity="0.3" stroke-width="1"/>
  <path d="M 520 138 L 532 150 L 520 162 L 508 150 Z" fill="#F5C242" stroke="currentColor" stroke-opacity="0.3" stroke-width="1"/>
  <path d="M 720 288 L 732 300 L 720 312 L 708 300 Z" fill="#F5C242" stroke="currentColor" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Annotations -->
  <text x="320" y="438" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">HOLD</text>
  <text x="620" y="138" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">HOLD</text>
  <text x="534" y="300" font-size="13" font-weight="600" fill="currentColor">Instant change</text>
  <text x="534" y="316" font-size="12" fill="currentColor" opacity="0.6">no in-between frames</text>

  <!-- Footer tip (Variant B left rail) -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Use Constant for on/off states, blinking lights, or a stop-motion look where you want no blending between poses.
  </text>
</svg>
