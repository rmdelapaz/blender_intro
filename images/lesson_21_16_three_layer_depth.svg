<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="dl-title dl-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="dl-title">Three-layer depth structure</title>
  <desc id="dl-desc">A scene split into three depth planes. The foreground is nearest and frames the shot, the middle ground holds the sharp subject, and the background sits farthest with soft context. Distance markers show roughly zero to five metres, five to twenty metres, and twenty metres or more.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">THREE-LAYER DEPTH</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Foreground, middle ground, background &#183; build space into the frame</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ============ Scene with three depth bands ============ -->
  <!-- frame x 40..520 (w 480), y 150..470 (h 320) -->
  <rect x="40" y="150" width="480" height="320" rx="6" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.3" stroke-width="2"/>
  <clipPath id="dl-clip"><rect x="40" y="150" width="480" height="320" rx="6"/></clipPath>

  <g clip-path="url(#dl-clip)">
    <!-- BACKGROUND band (top, blue, farthest) -->
    <rect x="40" y="150" width="480" height="120" fill="#4A9EFF" fill-opacity="0.18"/>
    <!-- distant mountains -->
    <polygon points="40,270 150,200 240,270" fill="#4A9EFF" fill-opacity="0.3"/>
    <polygon points="200,270 320,205 430,270" fill="#4A9EFF" fill-opacity="0.25"/>
    <polygon points="380,270 470,215 560,270" fill="#4A9EFF" fill-opacity="0.3"/>

    <!-- MIDDLE band (subject, green) -->
    <rect x="40" y="270" width="480" height="100" fill="#4ADE80" fill-opacity="0.15"/>
    <!-- sharp subject -->
    <circle cx="280" cy="330" r="30" fill="#4ADE80"/>
    <rect x="266" y="330" width="28" height="40" fill="#4ADE80"/>

    <!-- FOREGROUND band (bottom, red/orange, nearest) -->
    <rect x="40" y="370" width="480" height="100" fill="#E63946" fill-opacity="0.14"/>
    <!-- foreground framing element silhouettes (grasses / rocks) -->
    <path d="M 70 470 Q 90 410 100 470 Q 110 415 122 470 Z" fill="#E63946" fill-opacity="0.5"/>
    <path d="M 430 470 Q 455 405 470 470 Q 482 420 498 470 Z" fill="#E63946" fill-opacity="0.5"/>
  </g>

  <!-- Band divider lines -->
  <g stroke="currentColor" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="4 4">
    <line x1="40" y1="270" x2="520" y2="270"/>
    <line x1="40" y1="370" x2="520" y2="370"/>
  </g>

  <!-- ============ Labels (right column) ============ -->
  <g>
    <!-- Foreground (listed first, nearest) -->
    <rect x="548" y="168" width="16" height="16" rx="3" fill="#E63946" fill-opacity="0.6"/>
    <text x="574" y="181" font-size="14" font-weight="600" fill="currentColor">Foreground</text>
    <text x="574" y="199" font-size="12" fill="currentColor" opacity="0.6">Entry, framing &#183; 0&#8211;5 m</text>

    <!-- Middle -->
    <rect x="548" y="238" width="16" height="16" rx="3" fill="#4ADE80"/>
    <text x="574" y="251" font-size="14" font-weight="600" fill="currentColor">Middle ground</text>
    <text x="574" y="269" font-size="12" fill="currentColor" opacity="0.6">Subject, sharp &#183; 5&#8211;20 m</text>

    <!-- Background -->
    <rect x="548" y="308" width="16" height="16" rx="3" fill="#4A9EFF" fill-opacity="0.7"/>
    <text x="574" y="321" font-size="14" font-weight="600" fill="currentColor">Background</text>
    <text x="574" y="339" font-size="12" fill="currentColor" opacity="0.6">Context, soft &#183; 20 m+</text>

    <!-- near-far axis arrow -->
    <line x1="556" y1="380" x2="556" y2="440" stroke="currentColor" stroke-width="2" opacity="0.4" stroke-linecap="round" marker-end="url(#dl-arrow)"/>
    <text x="574" y="392" font-size="12" fill="currentColor" opacity="0.6">near</text>
    <text x="574" y="438" font-size="12" fill="currentColor" opacity="0.6">far</text>
  </g>
  <defs>
    <marker id="dl-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" opacity="0.5"/>
    </marker>
  </defs>

  <!-- Footer tip callout (Variant B, left rail) -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Put something in all three layers and the flat frame suddenly reads as deep space.
  </text>
</svg>
