<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" color="currentColor" role="img" aria-labelledby="bsp-title bsp-desc" style="max-width:100%;height:auto">
<title id="bsp-title">Box modeling versus sculpting versus poly modeling</title>
<desc id="bsp-desc">Three side-by-side panels comparing the box modeling, sculpting, and poly modeling approaches to character creation.</desc>
<style>
.bsp-fill{fill:currentColor}.bsp-stroke{fill:none;stroke:currentColor;stroke-width:2}
.bsp-thin{fill:none;stroke:currentColor;stroke-width:1.2;opacity:.55}
.bsp-t{fill:currentColor;font-family:system-ui,Arial,sans-serif}
.bsp-h{font-size:17px;font-weight:700}.bsp-b{font-size:12.5px}.bsp-s{font-size:11px;opacity:.75}
.bsp-card{fill:none;stroke:currentColor;stroke-width:1.5;opacity:.45;rx:10}
.bsp-acc1{fill:#4CAF50}.bsp-acc2{fill:#e8833a}.bsp-acc3{fill:#3a8ee6}
</style>
<!-- Panel 1: Box modeling -->
<rect x="14" y="14" width="216" height="312" rx="10" class="bsp-card"/>
<circle cx="34" cy="40" r="6" class="bsp-acc1"/>
<text x="48" y="45" class="bsp-t bsp-h">Box Modeling</text>
<!-- cube -> shaped progression -->
<rect x="46" y="70" width="50" height="50" class="bsp-stroke"/>
<path d="M96 70 l16 -12 M96 120 l16 -12 M46 70 l16 -12 h50 M112 58 v50" class="bsp-thin"/>
<path d="M132 95 h24 m0 0 l-7 -6 m7 6 l-7 6" class="bsp-stroke"/>
<path d="M168 74 q14 -6 26 0 q8 26 0 52 q-13 8 -26 0 q-7 -26 0 -52 z" class="bsp-stroke"/>
<path d="M168 100 h26 M181 74 v52" class="bsp-thin"/>
<text x="34" y="160" class="bsp-t bsp-b">Start from a primitive,</text>
<text x="34" y="178" class="bsp-t bsp-b">extrude &amp; refine to form.</text>
<text x="34" y="208" class="bsp-t bsp-s">+ Clean quad topology</text>
<text x="34" y="226" class="bsp-t bsp-s">+ Animation-ready early</text>
<text x="34" y="244" class="bsp-t bsp-s">&#8211; Slower to block shapes</text>
<text x="34" y="300" class="bsp-t bsp-b" font-weight="700">Best: game / anim meshes</text>
<!-- Panel 2: Sculpting -->
<rect x="252" y="14" width="216" height="312" rx="10" class="bsp-card"/>
<circle cx="272" cy="40" r="6" class="bsp-acc2"/>
<text x="286" y="45" class="bsp-t bsp-h">Sculpting</text>
<path d="M300 96 q18 -34 44 0 q14 30 0 44 q-22 18 -44 0 q-12 -22 0 -44 z" class="bsp-stroke"/>
<path d="M308 104 q14 8 28 2 M312 124 q12 10 24 2 M322 90 q0 12 -4 22" class="bsp-thin"/>
<path d="M360 110 h24 m0 0 l-7 -6 m7 6 l-7 6" class="bsp-stroke"/>
<path d="M396 96 q18 -34 44 0 q14 30 0 44 q-22 18 -44 0 q-12 -22 0 -44 z" class="bsp-stroke"/>
<path d="M402 100 q10 -6 18 -2 M428 100 q8 -4 14 0 M408 118 q14 12 28 2 M418 130 q4 6 2 10 M414 88 q2 8 0 14" class="bsp-thin"/>
<text x="272" y="172" class="bsp-t bsp-b">Push/pull millions of</text>
<text x="272" y="190" class="bsp-t bsp-b">verts like digital clay.</text>
<text x="272" y="216" class="bsp-t bsp-s">+ Organic, high detail</text>
<text x="272" y="234" class="bsp-t bsp-s">+ Fast artistic forms</text>
<text x="272" y="252" class="bsp-t bsp-s">&#8211; Needs retopology later</text>
<text x="272" y="300" class="bsp-t bsp-b" font-weight="700">Best: detail / hero models</text>
<!-- Panel 3: Poly modeling -->
<rect x="490" y="14" width="216" height="312" rx="10" class="bsp-card"/>
<circle cx="510" cy="40" r="6" class="bsp-acc3"/>
<text x="524" y="45" class="bsp-t bsp-h">Poly Modeling</text>
<g class="bsp-thin">
<path d="M548 72 l40 -8 l40 8 l-8 56 l-32 12 l-32 -12 z"/>
<path d="M548 72 l40 10 l40 -10 M588 82 v68 M566 76 v52 M610 76 v52 M540 100 h96"/>
</g>
<path d="M548 72 l40 -8 l40 8 l-8 56 l-32 12 l-32 -12 z" class="bsp-stroke"/>
<text x="524" y="172" class="bsp-t bsp-b">Place &amp; weld individual</text>
<text x="524" y="190" class="bsp-t bsp-b">faces vertex-by-vertex.</text>
<text x="524" y="216" class="bsp-t bsp-s">+ Total topology control</text>
<text x="524" y="234" class="bsp-t bsp-s">+ Precise edge flow</text>
<text x="524" y="252" class="bsp-t bsp-s">&#8211; Tedious for whole body</text>
<text x="524" y="300" class="bsp-t bsp-b" font-weight="700">Best: faces / tricky areas</text>
</svg>
