<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="po-title po-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="po-title">Eevee performance optimization priorities</title>
  <desc id="po-desc">A three-tier priority chart for speeding up Eevee renders. High impact: lower render samples, reduce raytracing resolution scale, and limit light probe and shadow resolution. Medium impact: cut texture resolution, simplify materials, and reduce light count. Lower impact: tweak clamp values and minor viewport settings. Tackle high-impact items first.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Optimization Priorities</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Where to spend your effort first when Eevee gets slow</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- HIGH impact tier -->
  <rect x="40" y="140" width="720" height="150" rx="10" fill="#E63946" fill-opacity="0.08" stroke="#E63946" stroke-width="1.5"/>
  <rect x="40" y="140" width="6" height="150" rx="3" fill="#E63946"/>
  <text x="64" y="172" font-size="18" font-weight="700" fill="#E63946">HIGH impact</text>
  <text x="64" y="194" font-size="12.5" fill="currentColor" opacity="0.6">Biggest speed-ups &#183; start here</text>
  <text x="64" y="228" font-size="13.5" fill="currentColor">&#8226; Lower <tspan font-weight="600">Render Samples</tspan> (taa render samples) &#183; often the single biggest win</text>
  <text x="64" y="252" font-size="13.5" fill="currentColor">&#8226; Drop <tspan font-weight="600">Raytracing &#183; Resolution Scale</tspan> to 1/2 for reflections and GI</text>
  <text x="64" y="276" font-size="13.5" fill="currentColor">&#8226; Cap <tspan font-weight="600">Shadow</tspan> and <tspan font-weight="600">Light Probe</tspan> resolution to what the shot needs</text>

  <!-- MEDIUM impact tier -->
  <rect x="40" y="306" width="720" height="150" rx="10" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-width="1.5"/>
  <rect x="40" y="306" width="6" height="150" rx="3" fill="#FF6B00"/>
  <text x="64" y="338" font-size="18" font-weight="700" fill="#FF6B00">MEDIUM impact</text>
  <text x="64" y="360" font-size="12.5" fill="currentColor" opacity="0.6">Worth doing on heavier scenes</text>
  <text x="64" y="394" font-size="13.5" fill="currentColor">&#8226; Reduce <tspan font-weight="600">texture resolution</tspan> for distant or small objects</text>
  <text x="64" y="418" font-size="13.5" fill="currentColor">&#8226; Simplify <tspan font-weight="600">materials</tspan>: fewer nodes, bake where possible</text>
  <text x="64" y="442" font-size="13.5" fill="currentColor">&#8226; Trim <tspan font-weight="600">light count</tspan>; disable raytraced shadows on minor lights</text>

  <!-- LOWER impact tier -->
  <rect x="40" y="472" width="720" height="132" rx="10" fill="#F5C242" fill-opacity="0.12" stroke="#F5C242" stroke-width="1.5"/>
  <rect x="40" y="472" width="6" height="132" rx="3" fill="#F5C242"/>
  <text x="64" y="504" font-size="18" font-weight="700" fill="currentColor">LOWER impact</text>
  <text x="64" y="526" font-size="12.5" fill="currentColor" opacity="0.6">Fine-tuning once the big items are done</text>
  <text x="64" y="560" font-size="13.5" fill="currentColor">&#8226; Adjust <tspan font-weight="600">clamp</tspan> values to tame fireflies without killing detail</text>
  <text x="64" y="584" font-size="13.5" fill="currentColor">&#8226; Minor viewport and denoise tweaks for interactivity</text>

  <!-- Footer tip (Variant B left rail) -->
  <rect x="40" y="630" width="720" height="34" fill="none"/>
  <rect x="40" y="630" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="652" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Halve samples and raytracing resolution before touching anything else &#183; measure, then decide if more is needed.</text>
</svg>