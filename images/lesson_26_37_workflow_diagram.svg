<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="wf-title wf-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="wf-title">The professional animation refinement workflow</title>
  <desc id="wf-desc">A four-step flowchart showing the professional animation refinement process as a left-to-right pipeline. Step one is Block in the Timeline: set the major key poses. Step two is Time in the Dope Sheet: adjust the spacing between keyframes. Step three is Refine in the Graph Editor: shape the curves and easing. Step four is Polish in the Graph Editor: make the final micro-adjustments. Straight arrows connect each step. A bracket under the first two steps is labelled eighty percent of the time, and a bracket under the last two steps is labelled twenty percent of the time, which makes all the difference.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">THE REFINEMENT WORKFLOW</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Four steps from rough blocking to polished motion &#183; each editor does one job well</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Connectors (straight only, currentColor 0.3). Arrows between the 4 nodes at vertical center y=250. -->
  <g stroke="currentColor" stroke-width="2" opacity="0.3" stroke-linecap="round">
    <line x1="208" y1="250" x2="236" y2="250"/>
    <line x1="392" y1="250" x2="420" y2="250"/>
    <line x1="576" y1="250" x2="604" y2="250"/>
  </g>
  <!-- Arrowheads (orange, the pipeline accent) -->
  <g fill="#FF6B00">
    <path d="M 236 250 L 226 244 L 226 256 Z"/>
    <path d="M 420 250 L 410 244 L 410 256 Z"/>
    <path d="M 604 250 L 594 244 L 594 256 Z"/>
  </g>

  <!-- ===== STEP 1: BLOCK (Timeline) ===== -->
  <rect x="56" y="160" width="152" height="180" rx="10" fill="currentColor" opacity="0.04"/>
  <rect x="56" y="160" width="152" height="4" rx="0" fill="#4A9EFF"/>
  <text x="132" y="192" font-size="13" font-weight="700" fill="#4A9EFF" text-anchor="middle">STEP 1</text>
  <text x="132" y="222" font-size="19" font-weight="700" fill="currentColor" text-anchor="middle">BLOCK</text>
  <text x="132" y="244" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">in the Timeline</text>
  <line x1="80" y1="260" x2="184" y2="260" stroke="currentColor" stroke-width="1" opacity="0.15"/>
  <text x="132" y="284" font-size="13" fill="currentColor" opacity="0.75" text-anchor="middle">Set the major</text>
  <text x="132" y="302" font-size="13" fill="currentColor" opacity="0.75" text-anchor="middle">key poses and</text>
  <text x="132" y="320" font-size="13" fill="currentColor" opacity="0.75" text-anchor="middle">moments</text>

  <!-- ===== STEP 2: TIME (Dope Sheet) ===== -->
  <rect x="240" y="160" width="152" height="180" rx="10" fill="currentColor" opacity="0.04"/>
  <rect x="240" y="160" width="152" height="4" rx="0" fill="#4ADE80"/>
  <text x="316" y="192" font-size="13" font-weight="700" fill="#4ADE80" text-anchor="middle">STEP 2</text>
  <text x="316" y="222" font-size="19" font-weight="700" fill="currentColor" text-anchor="middle">TIME</text>
  <text x="316" y="244" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">in the Dope Sheet</text>
  <line x1="264" y1="260" x2="368" y2="260" stroke="currentColor" stroke-width="1" opacity="0.15"/>
  <text x="316" y="284" font-size="13" fill="currentColor" opacity="0.75" text-anchor="middle">Adjust the</text>
  <text x="316" y="302" font-size="13" fill="currentColor" opacity="0.75" text-anchor="middle">spacing between</text>
  <text x="316" y="320" font-size="13" fill="currentColor" opacity="0.75" text-anchor="middle">keyframes</text>

  <!-- ===== STEP 3: REFINE (Graph Editor) ===== -->
  <rect x="424" y="160" width="152" height="180" rx="10" fill="currentColor" opacity="0.04"/>
  <rect x="424" y="160" width="152" height="4" rx="0" fill="#FF6B00"/>
  <text x="500" y="192" font-size="13" font-weight="700" fill="#FF6B00" text-anchor="middle">STEP 3</text>
  <text x="500" y="222" font-size="19" font-weight="700" fill="currentColor" text-anchor="middle">REFINE</text>
  <text x="500" y="244" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">in the Graph Editor</text>
  <line x1="448" y1="260" x2="552" y2="260" stroke="currentColor" stroke-width="1" opacity="0.15"/>
  <text x="500" y="284" font-size="13" fill="currentColor" opacity="0.75" text-anchor="middle">Shape the curves,</text>
  <text x="500" y="302" font-size="13" fill="currentColor" opacity="0.75" text-anchor="middle">handles, and</text>
  <text x="500" y="320" font-size="13" fill="currentColor" opacity="0.75" text-anchor="middle">easing</text>

  <!-- ===== STEP 4: POLISH (Graph Editor) ===== -->
  <rect x="608" y="160" width="152" height="180" rx="10" fill="currentColor" opacity="0.04"/>
  <rect x="608" y="160" width="152" height="4" rx="0" fill="#B47EE8"/>
  <text x="684" y="192" font-size="13" font-weight="700" fill="#B47EE8" text-anchor="middle">STEP 4</text>
  <text x="684" y="222" font-size="19" font-weight="700" fill="currentColor" text-anchor="middle">POLISH</text>
  <text x="684" y="244" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">in the Graph Editor</text>
  <line x1="632" y1="260" x2="736" y2="260" stroke="currentColor" stroke-width="1" opacity="0.15"/>
  <text x="684" y="284" font-size="13" fill="currentColor" opacity="0.75" text-anchor="middle">Final micro-</text>
  <text x="684" y="302" font-size="13" fill="currentColor" opacity="0.75" text-anchor="middle">adjustments for</text>
  <text x="684" y="320" font-size="13" fill="currentColor" opacity="0.75" text-anchor="middle">pro quality</text>

  <!-- ===== Phase brackets ===== -->
  <!-- Phase A bracket under steps 1+2 -->
  <g stroke="currentColor" stroke-width="1.5" opacity="0.3" stroke-linecap="round" fill="none">
    <path d="M 56 372 L 56 384 L 392 384 L 392 372"/>
    <line x1="224" y1="384" x2="224" y2="396"/>
  </g>
  <text x="224" y="416" font-size="15" font-weight="700" fill="currentColor" text-anchor="middle">80% of the time</text>
  <text x="224" y="436" font-size="13" fill="currentColor" opacity="0.65" text-anchor="middle">blocking and timing the action</text>

  <!-- Phase B bracket under steps 3+4 -->
  <g stroke="#FF6B00" stroke-width="1.5" opacity="0.6" stroke-linecap="round" fill="none">
    <path d="M 424 372 L 424 384 L 760 384 L 760 372"/>
    <line x1="592" y1="384" x2="592" y2="396"/>
  </g>
  <text x="592" y="416" font-size="15" font-weight="700" fill="#FF6B00" text-anchor="middle">20% of the time</text>
  <text x="592" y="436" font-size="13" fill="currentColor" opacity="0.8" text-anchor="middle">but it makes all the difference</text>

  <!-- Footer tip -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Block the poses and nail the timing first. Reach for the Graph Editor only once the rough motion already works.
  </text>
</svg>
