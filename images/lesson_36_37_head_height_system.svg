<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" color="currentColor" role="img" aria-labelledby="hhs-title hhs-desc" style="max-width:100%;height:auto">
<title id="hhs-title">Head-height proportion system</title>
<desc id="hhs-desc">A standing figure measured in head units showing the realistic adult height of about seven and a half to eight heads, with key landmarks at each head division.</desc>
<style>
.hhs-s{fill:none;stroke:currentColor;stroke-width:2}
.hhs-div{fill:none;stroke:currentColor;stroke-width:1;opacity:.4;stroke-dasharray:5 4}
.hhs-acc{fill:none;stroke:#3a8ee6;stroke-width:1.5}
.hhs-t{fill:currentColor;font-family:system-ui,Arial,sans-serif}
.hhs-h{font-size:15px;font-weight:700}.hhs-b{font-size:11.5px}.hhs-s2{font-size:10.5px;opacity:.82}
.hhs-num{fill:#3a8ee6;font-size:12px;font-weight:700;font-family:system-ui,Arial,sans-serif}
.hhs-lm{fill:currentColor;font-size:10.5px;opacity:.85;font-family:system-ui,Arial,sans-serif}
</style>
<text x="40" y="34" class="hhs-t hhs-h">Realistic adult = 7.5&#8211;8 heads tall</text>
<!-- 8 divisions, head unit = 58px, top at y=70 -> bottom y=70+8*58=534 -->
<!-- division lines x 150..330 ; numbers left at x130; landmarks right at x340 -->
<g class="hhs-div">
<path d="M150 70 H330"/><path d="M150 128 H330"/><path d="M150 186 H330"/><path d="M150 244 H330"/>
<path d="M150 302 H330"/><path d="M150 360 H330"/><path d="M150 418 H330"/><path d="M150 476 H330"/><path d="M150 534 H330"/>
</g>
<!-- head unit numbers -->
<g class="hhs-num" text-anchor="end">
<text x="138" y="103">1</text><text x="138" y="161">2</text><text x="138" y="219">3</text><text x="138" y="277">4</text>
<text x="138" y="335">5</text><text x="138" y="393">6</text><text x="138" y="451">7</text><text x="138" y="509">8</text>
</g>
<!-- brace whole height -->
<path d="M118 70 V534 M112 70 h12 M112 534 h12" class="hhs-acc"/>
<!-- figure centered at x=240 -->
<!-- head (unit 1) -->
<ellipse cx="240" cy="99" rx="26" ry="29" class="hhs-s"/>
<!-- neck + shoulders to ~ unit2 line (chest) -->
<path d="M228 126 v14 M252 126 v14" class="hhs-s"/>
<path d="M205 150 q35 -16 70 0" class="hhs-s"/>
<!-- torso to crotch ~ unit 4 (y244) -->
<path d="M205 150 C198 200 200 220 214 244 M275 150 C282 200 280 220 266 244" class="hhs-s"/>
<path d="M214 244 H266" class="hhs-s"/>
<!-- arms: shoulder to fingertips ~ mid-thigh (just below unit4) -->
<path d="M208 152 C176 200 172 240 178 270 M272 152 C304 200 308 240 302 270" class="hhs-s"/>
<!-- legs to feet at unit8 -->
<path d="M222 244 C214 330 214 420 216 520 M258 244 C266 330 266 420 264 520" class="hhs-s"/>
<path d="M214 246 C234 300 246 300 266 246" class="hhs-s" opacity=".0"/>
<!-- feet -->
<path d="M204 520 q12 14 24 0 M252 520 q12 14 24 0" class="hhs-s"/>
<!-- landmark labels right -->
<g class="hhs-lm">
<text x="340" y="103">crown &#8594; chin (1 head)</text>
<text x="340" y="161">nipple line &#8776; 2</text>
<text x="340" y="219">navel &#8776; 3</text>
<text x="340" y="248">crotch / mid-point &#8776; 4</text>
<text x="340" y="335">mid-thigh &#8776; 5</text>
<text x="340" y="393">below knee &#8776; 6</text>
<text x="340" y="451">lower shin &#8776; 7</text>
<text x="340" y="512">soles &#8776; 8</text>
</g>
<!-- note -->
<text x="40" y="552" class="hhs-t hhs-s2">Heroic figures stretch to 8&#8211;8.5 heads; cartoon &amp; child compress to 2&#8211;6 (see proportion types).</text>
</svg>
