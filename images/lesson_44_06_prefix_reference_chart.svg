<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" role="img" aria-labelledby="prx-title prx-desc" color="#222" font-family="'Segoe UI',system-ui,sans-serif">
<title id="prx-title">Standard naming prefix reference chart</title>
<desc id="prx-desc">A quick-reference grid of Blender naming prefixes grouped into four categories: object types (MESH, LIGHT, CAMERA, EMPTY, CURVE, RIG), asset types (MAT, TEX, IMG, NODE, COLL), category prefixes (PROP, CHAR, ENV, ARCH, VEH, VEG) and special purposes (REF, TEMP, PROXY, HP, LP). Each prefix is shown in monospace with its meaning.</desc>
<text x="440" y="34" text-anchor="middle" font-size="23" font-weight="700" fill="currentColor">Prefix Reference Chart</text>
<text x="440" y="58" text-anchor="middle" font-size="13.5" fill="currentColor" opacity="0.75">Start names with a category prefix so related items group together when sorted</text>

<!-- Column 1: Object Types (brand #FF6B00) -->
<g>
<rect x="24" y="80" width="410" height="30" rx="6" fill="#FF6B00"/>
<text x="229" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#1e1e1e">OBJECT TYPES</text>
<g font-size="13">
<rect x="24" y="116" width="410" height="252" rx="7" fill="#2a2a2a"/>
<g font-family="'Consolas','Courier New',monospace" font-weight="700" fill="#FF6B00" font-size="14.5">
<text x="44" y="146">MESH</text><text x="44" y="186">LIGHT</text><text x="44" y="226">CAMERA</text><text x="44" y="266">EMPTY</text><text x="44" y="306">CURVE</text><text x="44" y="346">RIG</text>
</g>
<g fill="#d4d4d4">
<text x="170" y="146">Mesh geometry (or GEO)</text>
<text x="170" y="186">Light sources</text>
<text x="170" y="226">Cameras (or CAM)</text>
<text x="170" y="266">Controllers &amp; targets</text>
<text x="170" y="306">Curve objects</text>
<text x="170" y="346">Armatures (or ARMATURE)</text>
</g>
<line x1="44" y1="158" x2="414" y2="158" stroke="#444" stroke-width="1"/>
<line x1="44" y1="198" x2="414" y2="198" stroke="#444" stroke-width="1"/>
<line x1="44" y1="238" x2="414" y2="238" stroke="#444" stroke-width="1"/>
<line x1="44" y1="278" x2="414" y2="278" stroke="#444" stroke-width="1"/>
<line x1="44" y1="318" x2="414" y2="318" stroke="#444" stroke-width="1"/>
</g>
</g>

<!-- Column 2: Asset Types (info #4A9EFF) -->
<g>
<rect x="446" y="80" width="410" height="30" rx="6" fill="#4A9EFF"/>
<text x="651" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#1e1e1e">ASSET TYPES</text>
<rect x="446" y="116" width="410" height="212" rx="7" fill="#2a2a2a"/>
<g font-family="'Consolas','Courier New',monospace" font-weight="700" fill="#4A9EFF" font-size="14.5">
<text x="466" y="146">MAT</text><text x="466" y="186">TEX</text><text x="466" y="226">IMG</text><text x="466" y="266">NODE</text><text x="466" y="306">COLL</text>
</g>
<g fill="#d4d4d4" font-size="13">
<text x="592" y="146">Materials</text>
<text x="592" y="186">Textures</text>
<text x="592" y="226">Images</text>
<text x="592" y="266">Node groups</text>
<text x="592" y="306">Collections</text>
</g>
<line x1="466" y1="158" x2="836" y2="158" stroke="#444" stroke-width="1"/>
<line x1="466" y1="198" x2="836" y2="198" stroke="#444" stroke-width="1"/>
<line x1="466" y1="238" x2="836" y2="238" stroke="#444" stroke-width="1"/>
<line x1="466" y1="278" x2="836" y2="278" stroke="#444" stroke-width="1"/>
</g>

<!-- Column 3: Category prefixes (practice #B47EE8) -->
<g>
<rect x="446" y="344" width="410" height="30" rx="6" fill="#B47EE8"/>
<text x="651" y="364" text-anchor="middle" font-size="14" font-weight="700" fill="#1e1e1e">CATEGORY PREFIXES</text>
<rect x="446" y="380" width="410" height="212" rx="7" fill="#2a2a2a"/>
<g font-family="'Consolas','Courier New',monospace" font-weight="700" fill="#B47EE8" font-size="14.5">
<text x="466" y="410">PROP</text><text x="466" y="446">CHAR</text><text x="466" y="482">ENV</text><text x="466" y="518">ARCH</text><text x="466" y="554">VEH</text>
</g>
<g fill="#d4d4d4" font-size="13">
<text x="592" y="410">Props &amp; small objects</text>
<text x="592" y="446">Characters</text>
<text x="592" y="482">Environment elements</text>
<text x="592" y="518">Architecture</text>
<text x="592" y="554">Vehicles (VEG = plants)</text>
</g>
<line x1="466" y1="422" x2="836" y2="422" stroke="#444" stroke-width="1"/>
<line x1="466" y1="458" x2="836" y2="458" stroke="#444" stroke-width="1"/>
<line x1="466" y1="494" x2="836" y2="494" stroke="#444" stroke-width="1"/>
<line x1="466" y1="530" x2="836" y2="530" stroke="#444" stroke-width="1"/>
</g>

<!-- Column 1 lower: Special purposes (caution #F5C242) -->
<g>
<rect x="24" y="384" width="410" height="30" rx="6" fill="#F5C242"/>
<text x="229" y="404" text-anchor="middle" font-size="14" font-weight="700" fill="#1e1e1e">SPECIAL PURPOSES</text>
<rect x="24" y="420" width="410" height="172" rx="7" fill="#2a2a2a"/>
<g font-family="'Consolas','Courier New',monospace" font-weight="700" fill="#F5C242" font-size="14.5">
<text x="44" y="450">REF</text><text x="44" y="486">TEMP</text><text x="44" y="522">PROXY</text><text x="44" y="558">HP / LP</text>
</g>
<g fill="#d4d4d4" font-size="13">
<text x="170" y="450">Reference objects</text>
<text x="170" y="486">Temporary (to delete)</text>
<text x="170" y="522">Placeholder objects</text>
<text x="170" y="558">High-poly / Low-poly</text>
</g>
<line x1="44" y1="462" x2="414" y2="462" stroke="#444" stroke-width="1"/>
<line x1="44" y1="498" x2="414" y2="498" stroke="#444" stroke-width="1"/>
<line x1="44" y1="534" x2="414" y2="534" stroke="#444" stroke-width="1"/>
</g>

<text x="440" y="610" text-anchor="middle" font-size="12.5" fill="currentColor" opacity="0.72">Example: LIGHT_Key &#183; MAT_Wood_Oak_Polished &#183; PROP_Coffee_Mug &#183; CHAR_Hero_HighPoly</text>
</svg>
