<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="np-title np-desc" color="#222">
  <title id="np-title">Numpad layout for view shortcuts</title>
  <desc id="np-desc">A numeric keypad with color-coded keys: 1, 3, 7 in orange for front/right/top views, 5 in blue for the perspective and orthographic toggle, 0 in yellow for camera view, period in purple for frame selected, 9 in pink for the opposite view. A legend on the right names each function.</desc>

  <!-- Orange top strip -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Header -->
  <text x="400" y="48" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="currentColor">Numpad Layout for View Shortcuts</text>
  <text x="400" y="74" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="currentColor" opacity="0.7">Color coded by function: views, toggle, camera, frame, opposite</text>

  <!-- Operation badge area: section label + emphasized name (left of numpad area, mirroring inset pattern) -->
  <text x="185" y="118" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FF6B00" letter-spacing="1.5">VIEW KEYS</text>
  <text x="185" y="142" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="currentColor">Right side of the keyboard</text>

  <!-- Numpad chassis -->
  <rect x="68" y="163" width="234" height="288" rx="10" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Row 1: NumLk -->
  <rect x="78" y="175" width="48" height="48" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.35" stroke-width="1"/>
  <text x="102" y="206" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="currentColor" opacity="0.7">NumLk</text>

  <rect x="132" y="175" width="48" height="48" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.35" stroke-width="1"/>
  <text x="156" y="207" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="currentColor" opacity="0.7">/</text>

  <rect x="186" y="175" width="48" height="48" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.35" stroke-width="1"/>
  <text x="210" y="207" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="currentColor" opacity="0.7">*</text>

  <rect x="240" y="175" width="48" height="48" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.35" stroke-width="1"/>
  <text x="264" y="207" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="currentColor" opacity="0.7">&#8722;</text>

  <!-- Row 2: 7, 8, 9, + (top of +) -->
  <!-- 7 orange Top view -->
  <rect x="78" y="229" width="48" height="48" rx="6" fill="#FF6B00" fill-opacity="0.18" stroke="#FF6B00" stroke-width="1.5"/>
  <text x="102" y="261" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#FF6B00">7</text>

  <!-- 8 subtle orbit -->
  <rect x="132" y="229" width="48" height="48" rx="6" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.45" stroke-width="1"/>
  <text x="156" y="261" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="currentColor" opacity="0.85">8</text>

  <!-- 9 pink Opposite view -->
  <rect x="186" y="229" width="48" height="48" rx="6" fill="#FF7EA8" fill-opacity="0.18" stroke="#FF7EA8" stroke-width="1.5"/>
  <text x="210" y="261" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#FF7EA8">9</text>

  <!-- + spans rows 2-3 -->
  <rect x="240" y="229" width="48" height="102" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.35" stroke-width="1"/>
  <text x="264" y="286" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="currentColor" opacity="0.7">+</text>

  <!-- Row 3: 4, 5, 6 -->
  <!-- 4 subtle orbit -->
  <rect x="78" y="283" width="48" height="48" rx="6" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.45" stroke-width="1"/>
  <text x="102" y="315" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="currentColor" opacity="0.85">4</text>

  <!-- 5 blue Toggle ortho/persp -->
  <rect x="132" y="283" width="48" height="48" rx="6" fill="#4A9EFF" fill-opacity="0.18" stroke="#4A9EFF" stroke-width="1.5"/>
  <text x="156" y="315" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#4A9EFF">5</text>

  <!-- 6 subtle orbit -->
  <rect x="186" y="283" width="48" height="48" rx="6" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.45" stroke-width="1"/>
  <text x="210" y="315" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="currentColor" opacity="0.85">6</text>

  <!-- Row 4: 1, 2, 3, Enter (top) -->
  <!-- 1 orange Front view -->
  <rect x="78" y="337" width="48" height="48" rx="6" fill="#FF6B00" fill-opacity="0.18" stroke="#FF6B00" stroke-width="1.5"/>
  <text x="102" y="369" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#FF6B00">1</text>

  <!-- 2 subtle orbit -->
  <rect x="132" y="337" width="48" height="48" rx="6" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.45" stroke-width="1"/>
  <text x="156" y="369" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="currentColor" opacity="0.85">2</text>

  <!-- 3 orange Right view -->
  <rect x="186" y="337" width="48" height="48" rx="6" fill="#FF6B00" fill-opacity="0.18" stroke="#FF6B00" stroke-width="1.5"/>
  <text x="210" y="369" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#FF6B00">3</text>

  <!-- Enter spans rows 4-5 -->
  <rect x="240" y="337" width="48" height="102" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.35" stroke-width="1"/>
  <text x="264" y="394" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="currentColor" opacity="0.7">Enter</text>

  <!-- Row 5: 0 (spans cols 1-2), . -->
  <!-- 0 yellow Camera view -->
  <rect x="78" y="391" width="102" height="48" rx="6" fill="#F5C242" fill-opacity="0.20" stroke="#F5C242" stroke-width="1.5"/>
  <text x="129" y="423" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#F5C242">0</text>

  <!-- . purple Frame selected -->
  <rect x="186" y="391" width="48" height="48" rx="6" fill="#B47EE8" fill-opacity="0.18" stroke="#B47EE8" stroke-width="1.5"/>
  <text x="210" y="425" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#B47EE8">.</text>

  <!-- Legend on right -->
  <text x="400" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FF6B00" letter-spacing="1.5">LEGEND</text>
  <text x="400" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="currentColor">What each key does</text>

  <!-- Legend rows: swatch (24x24) + key label + function description -->
  <!-- Row 1: 7 Top view -->
  <rect x="400" y="190" width="24" height="24" rx="4" fill="#FF6B00" fill-opacity="0.18" stroke="#FF6B00" stroke-width="1.2"/>
  <text x="412" y="207" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FF6B00">7</text>
  <text x="436" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="currentColor">Numpad 7</text>
  <text x="436" y="217" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="currentColor" opacity="0.75">Top view, looking straight down</text>

  <!-- Row 2: 1 Front view -->
  <rect x="400" y="226" width="24" height="24" rx="4" fill="#FF6B00" fill-opacity="0.18" stroke="#FF6B00" stroke-width="1.2"/>
  <text x="412" y="243" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FF6B00">1</text>
  <text x="436" y="236" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="currentColor">Numpad 1</text>
  <text x="436" y="253" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="currentColor" opacity="0.75">Front view, looking along positive Y</text>

  <!-- Row 3: 3 Right view -->
  <rect x="400" y="262" width="24" height="24" rx="4" fill="#FF6B00" fill-opacity="0.18" stroke="#FF6B00" stroke-width="1.2"/>
  <text x="412" y="279" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FF6B00">3</text>
  <text x="436" y="272" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="currentColor">Numpad 3</text>
  <text x="436" y="289" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="currentColor" opacity="0.75">Right side view, looking along negative X</text>

  <!-- Row 4: 5 Toggle ortho/persp -->
  <rect x="400" y="298" width="24" height="24" rx="4" fill="#4A9EFF" fill-opacity="0.18" stroke="#4A9EFF" stroke-width="1.2"/>
  <text x="412" y="315" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#4A9EFF">5</text>
  <text x="436" y="308" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="currentColor">Numpad 5</text>
  <text x="436" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="currentColor" opacity="0.75">Toggle perspective and orthographic</text>

  <!-- Row 5: 9 Opposite view -->
  <rect x="400" y="334" width="24" height="24" rx="4" fill="#FF7EA8" fill-opacity="0.18" stroke="#FF7EA8" stroke-width="1.2"/>
  <text x="412" y="351" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FF7EA8">9</text>
  <text x="436" y="344" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="currentColor">Numpad 9</text>
  <text x="436" y="361" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="currentColor" opacity="0.75">Flip to the opposite side, top to bottom</text>

  <!-- Row 6: 0 Camera view -->
  <rect x="400" y="370" width="24" height="24" rx="4" fill="#F5C242" fill-opacity="0.20" stroke="#F5C242" stroke-width="1.2"/>
  <text x="412" y="387" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#F5C242">0</text>
  <text x="436" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="currentColor">Numpad 0</text>
  <text x="436" y="397" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="currentColor" opacity="0.75">Jump to the active camera view</text>

  <!-- Row 7: . Frame selected -->
  <rect x="400" y="406" width="24" height="24" rx="4" fill="#B47EE8" fill-opacity="0.18" stroke="#B47EE8" stroke-width="1.2"/>
  <text x="412" y="424" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#B47EE8">.</text>
  <text x="436" y="416" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="currentColor">Numpad .</text>
  <text x="436" y="433" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="currentColor" opacity="0.75">Frame the selected object, fill the viewport</text>

  <!-- Footer tip -->
  <rect x="68" y="488" width="664" height="48" rx="8" fill="#FF6B00" fill-opacity="0.10" stroke="#FF6B00" stroke-opacity="0.4" stroke-width="1"/>
  <text x="86" y="510" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FF6B00" letter-spacing="1.5">TIP</text>
  <text x="86" y="528" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="currentColor" opacity="0.85">Numpad 2, 4, 6, 8 nudge the orbit in 15 degree steps. Hold Ctrl with 1, 3, or 7 to flip to the opposite axis.</text>
</svg>
