<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" role="img" aria-labelledby="crc-title crc-desc" color="#222" font-family="'Segoe UI',system-ui,sans-serif">
<title id="crc-title">ColorRamp control techniques</title>
<desc id="crc-desc">Three ColorRamp configurations and their effect on a noise input: range control clips values with stops moved inward, increasing contrast places stops close together for a sharp transition, and inversion swaps the black and white stops.</desc>
<defs>
<marker id="crc-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#FF6B00"/>
</marker>
<linearGradient id="crc-input" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#111"/><stop offset="0.5" stop-color="#bbb"/><stop offset="1" stop-color="#111"/>
</linearGradient>
<linearGradient id="crc-range" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#555"/><stop offset="0.5" stop-color="#aaa"/><stop offset="1" stop-color="#555"/>
</linearGradient>
<linearGradient id="crc-contrast" x1="0" y1="0" x2="1" y2="0">
<stop offset="0.46" stop-color="#111"/><stop offset="0.54" stop-color="#eee"/>
</linearGradient>
<linearGradient id="crc-invert" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#eee"/><stop offset="0.5" stop-color="#444"/><stop offset="1" stop-color="#eee"/>
</linearGradient>
<linearGradient id="crc-rampfull" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#fff"/>
</linearGradient>
<linearGradient id="crc-rampinv" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/>
</linearGradient>
</defs>

<text x="400" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="currentColor">ColorRamp Control Techniques</text>
<text x="400" y="56" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.75">Shaping a procedural noise input with a single ColorRamp node</text>

<!-- column captions -->
<text x="175" y="88" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor" opacity="0.6">COLORRAMP CONFIGURATION</text>
<text x="640" y="88" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor" opacity="0.6">RESULT</text>

<!-- ============ ROW 1: RANGE CONTROL ============ -->
<g transform="translate(0,100)">
<rect x="24" y="0" width="752" height="150" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.28"/>
<text x="44" y="30" font-size="15" font-weight="700" fill="#4A9EFF">1 &#183; Range Control</text>
<text x="44" y="50" font-size="11.5" fill="currentColor" opacity="0.8">Move both stops inward (0.40 &#8594; 0.60) to clip the output into a narrow value band.</text>

<!-- node body -->
<g transform="translate(44,66)">
<rect x="0" y="0" width="262" height="66" rx="6" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-opacity="0.35"/>
<rect x="0" y="0" width="262" height="18" rx="6" fill="#4A9EFF" fill-opacity="0.85"/>
<rect x="0" y="9" width="262" height="9" fill="#4A9EFF" fill-opacity="0.85"/>
<text x="8" y="13" font-size="10.5" font-weight="700" fill="#fff">ColorRamp</text>
<!-- ramp bar -->
<rect x="12" y="28" width="238" height="16" rx="2" fill="url(#crc-rampfull)" stroke="currentColor" stroke-opacity="0.4"/>
<!-- stops moved inward -->
<g stroke="#FF6B00" stroke-width="2">
<line x1="107" y1="24" x2="107" y2="48"/>
<line x1="155" y1="24" x2="155" y2="48"/>
</g>
<circle cx="107" cy="24" r="3" fill="#000" stroke="#FF6B00" stroke-width="1.5"/>
<circle cx="155" cy="24" r="3" fill="#fff" stroke="#FF6B00" stroke-width="1.5"/>
<text x="107" y="60" text-anchor="middle" font-size="9" fill="currentColor" opacity="0.75">0.40</text>
<text x="155" y="60" text-anchor="middle" font-size="9" fill="currentColor" opacity="0.75">0.60</text>
</g>

<line x1="320" y1="99" x2="520" y2="99" stroke="#FF6B00" stroke-width="2" marker-end="url(#crc-arrow)"/>
<!-- result: input vs output -->
<g transform="translate(534,72)">
<text x="0" y="-4" font-size="9" fill="currentColor" opacity="0.6">input</text>
<rect x="0" y="0" width="212" height="20" rx="3" fill="url(#crc-input)" stroke="currentColor" stroke-opacity="0.3"/>
<text x="0" y="42" font-size="9" fill="currentColor" opacity="0.6">clipped output</text>
<rect x="0" y="46" width="212" height="20" rx="3" fill="url(#crc-range)" stroke="currentColor" stroke-opacity="0.3"/>
</g>
</g>

<!-- ============ ROW 2: CONTRAST ============ -->
<g transform="translate(0,262)">
<rect x="24" y="0" width="752" height="150" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.28"/>
<text x="44" y="30" font-size="15" font-weight="700" fill="#F5C242">2 &#183; Increase Contrast</text>
<text x="44" y="50" font-size="11.5" fill="currentColor" opacity="0.8">Slide the two stops close together (0.48 / 0.52) for a hard, near-binary transition.</text>

<g transform="translate(44,66)">
<rect x="0" y="0" width="262" height="66" rx="6" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-opacity="0.35"/>
<rect x="0" y="0" width="262" height="18" rx="6" fill="#F5C242" fill-opacity="0.9"/>
<rect x="0" y="9" width="262" height="9" fill="#F5C242" fill-opacity="0.9"/>
<text x="8" y="13" font-size="10.5" font-weight="700" fill="#222">ColorRamp</text>
<rect x="12" y="28" width="238" height="16" rx="2" fill="url(#crc-contrast)" stroke="currentColor" stroke-opacity="0.4"/>
<g stroke="#FF6B00" stroke-width="2">
<line x1="126" y1="24" x2="126" y2="48"/>
<line x1="136" y1="24" x2="136" y2="48"/>
</g>
<circle cx="126" cy="24" r="3" fill="#000" stroke="#FF6B00" stroke-width="1.5"/>
<circle cx="136" cy="24" r="3" fill="#fff" stroke="#FF6B00" stroke-width="1.5"/>
<text x="131" y="60" text-anchor="middle" font-size="9" fill="currentColor" opacity="0.75">0.48 / 0.52</text>
</g>

<line x1="320" y1="99" x2="520" y2="99" stroke="#FF6B00" stroke-width="2" marker-end="url(#crc-arrow)"/>
<g transform="translate(534,72)">
<text x="0" y="-4" font-size="9" fill="currentColor" opacity="0.6">input</text>
<rect x="0" y="0" width="212" height="20" rx="3" fill="url(#crc-input)" stroke="currentColor" stroke-opacity="0.3"/>
<text x="0" y="42" font-size="9" fill="currentColor" opacity="0.6">high-contrast output</text>
<rect x="0" y="46" width="212" height="20" rx="3" fill="url(#crc-contrast)" stroke="currentColor" stroke-opacity="0.3"/>
</g>
</g>

<!-- ============ ROW 3: INVERSION ============ -->
<g transform="translate(0,424)">
<rect x="24" y="0" width="752" height="150" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.28"/>
<text x="44" y="30" font-size="15" font-weight="700" fill="#4ADE80">3 &#183; Inversion</text>
<text x="44" y="50" font-size="11.5" fill="currentColor" opacity="0.8">Swap the black and white stops to flip the mask &#183; no Invert node required.</text>

<g transform="translate(44,66)">
<rect x="0" y="0" width="262" height="66" rx="6" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-opacity="0.35"/>
<rect x="0" y="0" width="262" height="18" rx="6" fill="#4ADE80" fill-opacity="0.9"/>
<rect x="0" y="9" width="262" height="9" fill="#4ADE80" fill-opacity="0.9"/>
<text x="8" y="13" font-size="10.5" font-weight="700" fill="#222">ColorRamp</text>
<rect x="12" y="28" width="238" height="16" rx="2" fill="url(#crc-rampinv)" stroke="currentColor" stroke-opacity="0.4"/>
<circle cx="12" cy="24" r="3" fill="#fff" stroke="#FF6B00" stroke-width="1.5"/>
<circle cx="250" cy="24" r="3" fill="#000" stroke="#FF6B00" stroke-width="1.5"/>
<text x="12" y="60" text-anchor="middle" font-size="9" fill="currentColor" opacity="0.75">white</text>
<text x="250" y="60" text-anchor="middle" font-size="9" fill="currentColor" opacity="0.75">black</text>
</g>

<line x1="320" y1="99" x2="520" y2="99" stroke="#FF6B00" stroke-width="2" marker-end="url(#crc-arrow)"/>
<g transform="translate(534,72)">
<text x="0" y="-4" font-size="9" fill="currentColor" opacity="0.6">input</text>
<rect x="0" y="0" width="212" height="20" rx="3" fill="url(#crc-input)" stroke="currentColor" stroke-opacity="0.3"/>
<text x="0" y="42" font-size="9" fill="currentColor" opacity="0.6">inverted output</text>
<rect x="0" y="46" width="212" height="20" rx="3" fill="url(#crc-invert)" stroke="currentColor" stroke-opacity="0.3"/>
</g>
</g>
</svg>
