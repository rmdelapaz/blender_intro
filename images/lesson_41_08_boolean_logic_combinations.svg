<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="blc-title blc-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="blc-title">Boolean logic combinations for selections</title>
  <desc id="blc-desc">Three Venn diagrams combining two selections A and B. AND keeps only elements in both. OR keeps elements in either. NOT keeps elements in A that are not in B. Kept regions are filled green, excluded regions are outlined.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Combining Selections</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Boolean math on two criteria: AND, OR, NOT</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Three rows, each: label + node glyph on left, Venn on right. Row centers y=210, 370, 530 -->

  <!-- ============ ROW 1: AND ============ -->
  <text x="60" y="175" font-size="18" font-weight="600" fill="currentColor">AND</text>
  <text x="60" y="197" font-size="13" fill="currentColor" opacity="0.6">In both A and B</text>
  <text x="60" y="230" font-size="13" fill="currentColor" opacity="0.6">Use: steep slope</text>
  <text x="60" y="248" font-size="13" fill="currentColor" opacity="0.6">and high up</text>
  <!-- node glyph -->
  <rect x="60" y="262" width="150" height="26" rx="5" fill="#4ADE80" fill-opacity="0.12" stroke="#4ADE80" stroke-width="1.3"/>
  <text x="135" y="279" text-anchor="middle" font-size="12" font-weight="600" fill="#4ADE80">Boolean Math &#183; AND</text>
  <!-- Venn: only intersection filled -->
  <g transform="translate(430,210)">
    <!-- intersection fill via clip -->
    <defs>
      <clipPath id="blc-and-clip"><circle cx="-30" cy="0" r="70"/></clipPath>
    </defs>
    <circle cx="30" cy="0" r="70" fill="#4ADE80" fill-opacity="0.85" clip-path="url(#blc-and-clip)"/>
    <circle cx="-30" cy="0" r="70" fill="none" stroke="currentColor" stroke-width="2" opacity="0.55"/>
    <circle cx="30" cy="0" r="70" fill="none" stroke="currentColor" stroke-width="2" opacity="0.55"/>
    <text x="-70" y="5" text-anchor="middle" font-size="18" font-weight="700" fill="currentColor" opacity="0.7">A</text>
    <text x="70" y="5" text-anchor="middle" font-size="18" font-weight="700" fill="currentColor" opacity="0.7">B</text>
  </g>

  <!-- ============ ROW 2: OR ============ -->
  <text x="60" y="335" font-size="18" font-weight="600" fill="currentColor">OR</text>
  <text x="60" y="357" font-size="13" fill="currentColor" opacity="0.6">In either A or B</text>
  <text x="60" y="390" font-size="13" fill="currentColor" opacity="0.6">Use: near path</text>
  <text x="60" y="408" font-size="13" fill="currentColor" opacity="0.6">or near water</text>
  <rect x="60" y="422" width="150" height="26" rx="5" fill="#4ADE80" fill-opacity="0.12" stroke="#4ADE80" stroke-width="1.3"/>
  <text x="135" y="439" text-anchor="middle" font-size="12" font-weight="600" fill="#4ADE80">Boolean Math &#183; OR</text>
  <!-- Venn: both circles filled (union) -->
  <g transform="translate(430,370)">
    <circle cx="-30" cy="0" r="70" fill="#4ADE80" fill-opacity="0.6"/>
    <circle cx="30" cy="0" r="70" fill="#4ADE80" fill-opacity="0.6"/>
    <circle cx="-30" cy="0" r="70" fill="none" stroke="currentColor" stroke-width="2" opacity="0.55"/>
    <circle cx="30" cy="0" r="70" fill="none" stroke="currentColor" stroke-width="2" opacity="0.55"/>
    <text x="-70" y="5" text-anchor="middle" font-size="18" font-weight="700" fill="currentColor" opacity="0.85">A</text>
    <text x="70" y="5" text-anchor="middle" font-size="18" font-weight="700" fill="currentColor" opacity="0.85">B</text>
  </g>

  <!-- ============ ROW 3: NOT ============ -->
  <text x="60" y="495" font-size="18" font-weight="600" fill="currentColor">NOT</text>
  <text x="60" y="517" font-size="13" fill="currentColor" opacity="0.6">In A, but not B</text>
  <text x="60" y="550" font-size="13" fill="currentColor" opacity="0.6">Use: on ground</text>
  <text x="60" y="568" font-size="13" fill="currentColor" opacity="0.6">but not on road</text>
  <rect x="60" y="582" width="180" height="26" rx="5" fill="#E63946" fill-opacity="0.12" stroke="#E63946" stroke-width="1.3"/>
  <text x="150" y="599" text-anchor="middle" font-size="12" font-weight="600" fill="#E63946">A AND (NOT B)</text>
  <!-- Venn: A minus B filled; B carves out -->
  <g transform="translate(430,530)">
    <defs>
      <!-- mask: white = show, black = hide. Show all of A, punch out B. -->
      <mask id="blc-not-mask" maskUnits="userSpaceOnUse" x="-120" y="-90" width="240" height="180">
        <circle cx="-30" cy="0" r="70" fill="white"/>
        <circle cx="30" cy="0" r="70" fill="black"/>
      </mask>
    </defs>
    <!-- A-minus-B: fill a rect covering A, masked to (A not B) -->
    <rect x="-110" y="-80" width="150" height="160" fill="#4ADE80" fill-opacity="0.85" mask="url(#blc-not-mask)"/>
    <circle cx="-30" cy="0" r="70" fill="none" stroke="currentColor" stroke-width="2" opacity="0.55"/>
    <circle cx="30" cy="0" r="70" fill="none" stroke="#E63946" stroke-width="2" stroke-dasharray="5 4" opacity="0.85"/>
    <text x="-70" y="5" text-anchor="middle" font-size="18" font-weight="700" fill="currentColor" opacity="0.85">A</text>
    <text x="70" y="5" text-anchor="middle" font-size="18" font-weight="700" fill="#E63946" opacity="0.85">B</text>
  </g>

  <!-- legend -->
  <g transform="translate(600,175)">
    <rect x="0" y="-10" width="14" height="14" rx="2" fill="#4ADE80" fill-opacity="0.85"/>
    <text x="20" y="2" font-size="12" fill="currentColor" opacity="0.7">kept</text>
    <rect x="0" y="14" width="14" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2" opacity="0.55"/>
    <text x="20" y="26" font-size="12" fill="currentColor" opacity="0.7">excluded</text>
  </g>

  <!-- Footer tip (dense variant, y=641) -->
  <rect x="40" y="641" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Selections are Boolean fields (true/false per element), so you combine them with the same AND / OR / NOT math.
  </text>
</svg>
