<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="svf-title svf-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="svf-title">Single value versus field input</title>
  <desc id="svf-desc">A side-by-side comparison. On the left, a single scale value feeds every element of a cube equally, so all faces scale uniformly. On the right, a field supplies a different scale value per element, driven by position, so the faces scale by varying amounts.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Single Value vs Field Input</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">One value for everything, or one value per element</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Center divider -->
  <line x1="400" y1="128" x2="400" y2="500" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ============ LEFT: Single Value ============ -->
  <text x="60" y="150" font-size="18" font-weight="600" fill="currentColor">Single Value</text>
  <text x="60" y="172" font-size="13" fill="currentColor" opacity="0.6">Scale = 1.5 for every element</text>

  <!-- value chip -->
  <rect x="60" y="190" width="120" height="34" rx="6" fill="#4ADE80" fill-opacity="0.14" stroke="#4ADE80" stroke-width="1.5"/>
  <text x="120" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#4ADE80">Scale 1.5</text>

  <!-- fan-out: same value to each element (three equal arrows) -->
  <g stroke="#4ADE80" stroke-width="2" opacity="0.8" fill="none" stroke-linecap="round">
    <path d="M180 207 C 220 207, 230 250, 268 250"/>
    <path d="M180 207 C 220 207, 230 300, 268 300"/>
    <path d="M180 207 C 220 207, 230 350, 268 350"/>
  </g>
  <!-- equal glyph labels on each wire -->
  <text x="232" y="244" font-size="11" fill="currentColor" opacity="0.55">=</text>
  <text x="232" y="294" font-size="11" fill="currentColor" opacity="0.55">=</text>
  <text x="232" y="344" font-size="11" fill="currentColor" opacity="0.55">=</text>

  <!-- uniform cube: all cells same size -->
  <g transform="translate(280,225)">
    <rect x="0" y="0" width="90" height="90" fill="none" stroke="#4ADE80" stroke-width="2.5"/>
    <line x1="30" y1="0" x2="30" y2="90" stroke="#4ADE80" stroke-width="1.2" opacity="0.7"/>
    <line x1="60" y1="0" x2="60" y2="90" stroke="#4ADE80" stroke-width="1.2" opacity="0.7"/>
    <line x1="0" y1="30" x2="90" y2="30" stroke="#4ADE80" stroke-width="1.2" opacity="0.7"/>
    <line x1="0" y1="60" x2="90" y2="60" stroke="#4ADE80" stroke-width="1.2" opacity="0.7"/>
    <!-- equal dots -->
    <circle cx="15" cy="15" r="4" fill="#4ADE80"/>
    <circle cx="45" cy="15" r="4" fill="#4ADE80"/>
    <circle cx="75" cy="15" r="4" fill="#4ADE80"/>
    <circle cx="15" cy="45" r="4" fill="#4ADE80"/>
    <circle cx="45" cy="45" r="4" fill="#4ADE80"/>
    <circle cx="75" cy="45" r="4" fill="#4ADE80"/>
    <circle cx="15" cy="75" r="4" fill="#4ADE80"/>
    <circle cx="45" cy="75" r="4" fill="#4ADE80"/>
    <circle cx="75" cy="75" r="4" fill="#4ADE80"/>
  </g>
  <text x="200" y="410" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.6">Every element gets the same number.</text>
  <text x="200" y="430" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.6">Uniform result.</text>

  <!-- ============ RIGHT: Field ============ -->
  <text x="440" y="150" font-size="18" font-weight="600" fill="currentColor">Field</text>
  <text x="440" y="172" font-size="13" fill="currentColor" opacity="0.6">Scale varies per element (from Position)</text>

  <!-- field source chip -->
  <rect x="440" y="190" width="150" height="34" rx="6" fill="#4A9EFF" fill-opacity="0.14" stroke="#4A9EFF" stroke-width="1.5"/>
  <text x="515" y="212" text-anchor="middle" font-size="13" font-weight="700" fill="#4A9EFF">Position &#8594; Scale</text>

  <!-- fan-out: different value to each element -->
  <g stroke="#4A9EFF" stroke-width="2" opacity="0.85" fill="none" stroke-linecap="round">
    <path d="M590 207 C 630 207, 636 250, 668 250"/>
    <path d="M590 207 C 630 207, 636 300, 668 300"/>
    <path d="M590 207 C 630 207, 636 350, 668 350"/>
  </g>
  <text x="640" y="244" font-size="11" fill="currentColor" opacity="0.55">0.6</text>
  <text x="640" y="294" font-size="11" fill="currentColor" opacity="0.55">1.4</text>
  <text x="640" y="344" font-size="11" fill="currentColor" opacity="0.55">2.2</text>

  <!-- varied cube: cells scale by row -->
  <g transform="translate(680,225)">
    <rect x="0" y="0" width="90" height="90" fill="none" stroke="#4A9EFF" stroke-width="2.5"/>
    <line x1="30" y1="0" x2="30" y2="90" stroke="#4A9EFF" stroke-width="1.2" opacity="0.7"/>
    <line x1="60" y1="0" x2="60" y2="90" stroke="#4A9EFF" stroke-width="1.2" opacity="0.7"/>
    <line x1="0" y1="30" x2="90" y2="30" stroke="#4A9EFF" stroke-width="1.2" opacity="0.7"/>
    <line x1="0" y1="60" x2="90" y2="60" stroke="#4A9EFF" stroke-width="1.2" opacity="0.7"/>
    <!-- varied dots: small top row -> large bottom row -->
    <circle cx="15" cy="15" r="2.5" fill="#4A9EFF"/>
    <circle cx="45" cy="15" r="2.5" fill="#4A9EFF"/>
    <circle cx="75" cy="15" r="2.5" fill="#4A9EFF"/>
    <circle cx="15" cy="45" r="5" fill="#4A9EFF"/>
    <circle cx="45" cy="45" r="5" fill="#4A9EFF"/>
    <circle cx="75" cy="45" r="5" fill="#4A9EFF"/>
    <circle cx="15" cy="75" r="7.5" fill="#4A9EFF"/>
    <circle cx="45" cy="75" r="7.5" fill="#4A9EFF"/>
    <circle cx="75" cy="75" r="7.5" fill="#4A9EFF"/>
  </g>
  <text x="600" y="410" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.6">Each element gets its own number.</text>
  <text x="600" y="430" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.6">Varied result.</text>

  <!-- Footer tip (Variant B, left rail) -->
  <rect x="40" y="506" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> A grey socket carries a single value; a diamond (field) socket carries one value per element.
  </text>
</svg>
