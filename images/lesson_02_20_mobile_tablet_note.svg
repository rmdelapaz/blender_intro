<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500"
     role="img" aria-labelledby="mt-title mt-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="mt-title">Blender on mobile and tablet: hardware expectations</title>
  <desc id="mt-desc">An informational graphic comparing three device types for Blender use. Desktop is recommended with full mouse and keyboard, all shortcuts, and ample screen. Tablet is limited use: stylus is great for sculpting but most shortcuts still need a keyboard, so tablets work best as a secondary station. Phone is not viable due to screen size, lack of keyboard, and absence of a middle-mouse equivalent.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Blender on Mobile and Tablet</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Blender is built for desktop. Here is what to expect on smaller devices.</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Column dividers -->
  <g stroke="currentColor" stroke-width="1" opacity="0.15">
    <line x1="280" y1="160" x2="280" y2="396"/>
    <line x1="520" y1="160" x2="520" y2="396"/>
  </g>

  <!-- =================== Desktop column =================== -->
  <!-- Monitor body -->
  <rect x="120" y="170" width="80" height="40" rx="3" fill="#4ADE80" fill-opacity="0.08" stroke="currentColor" stroke-width="1.5"/>
  <!-- Screen inset -->
  <rect x="124" y="174" width="72" height="32" rx="2" fill="#4ADE80" fill-opacity="0.18"/>
  <!-- Stand neck -->
  <rect x="148" y="210" width="24" height="6" fill="currentColor" opacity="0.4"/>
  <!-- Base -->
  <rect x="132" y="216" width="56" height="4" rx="2" fill="currentColor" opacity="0.4"/>

  <!-- Device label -->
  <text x="160" y="240" font-size="14" font-weight="600" fill="currentColor" text-anchor="middle">Desktop</text>

  <!-- Status pill -->
  <rect x="110" y="254" width="100" height="24" rx="12" fill="#4ADE80" fill-opacity="0.15" stroke="#4ADE80" stroke-opacity="0.5"/>
  <text x="160" y="270" font-size="11" font-weight="700" fill="#4ADE80" text-anchor="middle" letter-spacing="1">RECOMMENDED</text>

  <!-- Bullet list -->
  <g fill="#4ADE80">
    <circle cx="56" cy="312" r="2.5"/>
    <circle cx="56" cy="336" r="2.5"/>
    <circle cx="56" cy="360" r="2.5"/>
    <circle cx="56" cy="384" r="2.5"/>
  </g>
  <g font-size="12" fill="currentColor">
    <text x="68" y="316">Full mouse + keyboard</text>
    <text x="68" y="340">All shortcuts available</text>
    <text x="68" y="364">Ample screen for the UI</text>
    <text x="68" y="388">Standard production setup</text>
  </g>

  <!-- =================== Tablet column =================== -->
  <!-- Body -->
  <rect x="365" y="172" width="70" height="48" rx="6" fill="#F5C242" fill-opacity="0.08" stroke="currentColor" stroke-width="1.5"/>
  <!-- Screen inset -->
  <rect x="370" y="177" width="60" height="38" rx="3" fill="#F5C242" fill-opacity="0.18"/>

  <!-- Device label -->
  <text x="400" y="240" font-size="14" font-weight="600" fill="currentColor" text-anchor="middle">Tablet</text>

  <!-- Status pill -->
  <rect x="350" y="254" width="100" height="24" rx="12" fill="#F5C242" fill-opacity="0.15" stroke="#F5C242" stroke-opacity="0.5"/>
  <text x="400" y="270" font-size="11" font-weight="700" fill="#F5C242" text-anchor="middle" letter-spacing="1">LIMITED USE</text>

  <!-- Bullet list -->
  <g fill="#F5C242">
    <circle cx="296" cy="312" r="2.5"/>
    <circle cx="296" cy="336" r="2.5"/>
    <circle cx="296" cy="360" r="2.5"/>
    <circle cx="296" cy="384" r="2.5"/>
  </g>
  <g font-size="12" fill="currentColor">
    <text x="308" y="316">Stylus great for sculpting</text>
    <text x="308" y="340">Shortcuts need a keyboard</text>
    <text x="308" y="364">External keyboard helps</text>
    <text x="308" y="388">Best as a secondary station</text>
  </g>

  <!-- =================== Phone column =================== -->
  <!-- Body -->
  <rect x="626" y="170" width="28" height="50" rx="5" fill="#FF7EA8" fill-opacity="0.08" stroke="currentColor" stroke-width="1.5"/>
  <!-- Screen inset -->
  <rect x="629" y="177" width="22" height="36" rx="2" fill="#FF7EA8" fill-opacity="0.18"/>
  <!-- Camera dot -->
  <circle cx="640" cy="173.5" r="0.9" fill="currentColor" opacity="0.6"/>

  <!-- Device label -->
  <text x="640" y="240" font-size="14" font-weight="600" fill="currentColor" text-anchor="middle">Phone</text>

  <!-- Status pill -->
  <rect x="590" y="254" width="100" height="24" rx="12" fill="#FF7EA8" fill-opacity="0.15" stroke="#FF7EA8" stroke-opacity="0.5"/>
  <text x="640" y="270" font-size="11" font-weight="700" fill="#FF7EA8" text-anchor="middle" letter-spacing="1">NOT VIABLE</text>

  <!-- Bullet list -->
  <g fill="#FF7EA8">
    <circle cx="536" cy="312" r="2.5"/>
    <circle cx="536" cy="336" r="2.5"/>
    <circle cx="536" cy="360" r="2.5"/>
    <circle cx="536" cy="384" r="2.5"/>
  </g>
  <g font-size="12" fill="currentColor">
    <text x="548" y="316">Screen too small for the UI</text>
    <text x="548" y="340">No keyboard for shortcuts</text>
    <text x="548" y="364">No middle-mouse equivalent</text>
    <text x="548" y="388">Viewing references only</text>
  </g>

  <!-- Footer tip callout -->
  <rect x="40" y="420" width="720" height="44" rx="6"
        fill="#FF6B00" fill-opacity="0.10"
        stroke="#FF6B00" stroke-opacity="0.4"/>
  <text x="54" y="440" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> A three-button mouse and a keyboard are functionally required. Plan around a desktop or
  </text>
  <text x="54" y="456" font-size="13" fill="currentColor">laptop; treat tablets and phones as supplementary tools at best.</text>
</svg>
