<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" color="#222" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" role="img" aria-labelledby="dl49-t dl49-d">
  <title id="dl49-t">The Three Components of Natural Daylight</title>
  <desc id="dl49-d">Daylight on a facade broken into its three stacked contributions &#8212; direct sun casting sharp warm-lit shadow, blue sky fill softening the shade, and colour-tinted light bounced off nearby surfaces &#8212; which combine into the light we read as real.</desc>
  <rect x="0" y="0" width="760" height="400" fill="none"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="currentColor">How Natural Light Actually Behaves</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#8a8f98">Daylight is three light sources at once &#8212; not one</text>

  <!-- three component cards -->
  <g>
    <rect x="70" y="86" width="200" height="196" rx="10" fill="#1a1a1a" stroke="#FF6B00" stroke-width="2"/>
    <circle cx="120" cy="126" r="15" fill="#FF6B00"/>
    <g stroke="#FF6B00" stroke-width="1.6"><line x1="120" y1="102" x2="120" y2="94"/><line x1="120" y1="158" x2="120" y2="150"/><line x1="96" y1="126" x2="88" y2="126"/><line x1="152" y1="126" x2="144" y2="126"/></g>
    <text x="185" y="120" font-size="13.5" font-weight="700" fill="#FF6B00">Direct sun</text>
    <text x="90" y="182" font-size="11.5" fill="#c9ccd1">one hard, warm key light</text>
    <text x="90" y="200" font-size="11.5" fill="#c9ccd1">that casts sharp,</text>
    <text x="90" y="218" font-size="11.5" fill="#c9ccd1">directional shadows</text>
    <text x="90" y="248" font-size="11" fill="#8a8f98">sets the time of day and</text>
    <text x="90" y="264" font-size="11" fill="#8a8f98">the mood of the scene</text>
  </g>
  <g>
    <rect x="280" y="86" width="200" height="196" rx="10" fill="#1a1a1a" stroke="#4A9EFF" stroke-width="2"/>
    <path d="M312,140 a20,20 0 0 1 40,0 Z" fill="#4A9EFF"/>
    <text x="395" y="120" font-size="13.5" font-weight="700" fill="#4A9EFF">Sky fill</text>
    <text x="300" y="182" font-size="11.5" fill="#c9ccd1">the whole blue dome</text>
    <text x="300" y="200" font-size="11.5" fill="#c9ccd1">as a soft, cool</text>
    <text x="300" y="218" font-size="11.5" fill="#c9ccd1">wrap-around ambient</text>
    <text x="300" y="248" font-size="11" fill="#8a8f98">fills shadows so they're</text>
    <text x="300" y="264" font-size="11" fill="#8a8f98">never pure black</text>
  </g>
  <g>
    <rect x="490" y="86" width="200" height="196" rx="10" fill="#1a1a1a" stroke="#4ADE80" stroke-width="2"/>
    <path d="M512,118 L540,140 L512,140 Z" fill="#4ADE80"/><path d="M540,140 L568,118 L568,140 Z" fill="#4ADE80" opacity="0.6"/>
    <text x="605" y="120" font-size="13.5" font-weight="700" fill="#4ADE80">Bounced</text>
    <text x="510" y="182" font-size="11.5" fill="#c9ccd1">light kicking off grass,</text>
    <text x="510" y="200" font-size="11.5" fill="#c9ccd1">pavement, nearby walls</text>
    <text x="510" y="218" font-size="11.5" fill="#c9ccd1">&#8212; tinted by each</text>
    <text x="510" y="248" font-size="11" fill="#8a8f98">green grass throws green</text>
    <text x="510" y="264" font-size="11" fill="#8a8f98">into the shadow side</text>
  </g>

  <!-- combine -->
  <defs><marker id="dl49-a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8a8f98"/></marker></defs>
  <line x1="170" y1="292" x2="360" y2="326" stroke="#8a8f98" stroke-width="1.6" marker-end="url(#dl49-a)"/>
  <line x1="380" y1="292" x2="380" y2="326" stroke="#8a8f98" stroke-width="1.6" marker-end="url(#dl49-a)"/>
  <line x1="590" y1="292" x2="400" y2="326" stroke="#8a8f98" stroke-width="1.6" marker-end="url(#dl49-a)"/>
  <rect x="200" y="338" width="360" height="46" rx="9" fill="#F5C242"/>
  <text x="380" y="367" text-anchor="middle" font-size="14" font-weight="700" fill="#3a2e08">All three together = light the eye believes</text>
</svg>
