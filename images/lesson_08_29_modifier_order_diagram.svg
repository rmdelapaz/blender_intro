<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="mo-title mo-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="mo-title">Modifier order changes the result</title>
  <desc id="mo-desc">A two-path flowchart starting from one source post. The top path applies Array first then Mirror, producing a mirrored pair of long post rows. The bottom path applies Mirror first then Array, producing a repeated run of mirrored post pairs. Both paths use the same two modifiers but the stack order produces different geometry, shown by the divergent final shapes.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Order Changes the Result</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Same two modifiers · two stack orders · two different shapes</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ===== Shared source ===== -->
  <text x="40" y="142" font-size="14" font-weight="600" fill="currentColor" opacity="0.7">Start</text>
  <!-- one post glyph -->
  <rect x="48" y="156" width="22" height="78" rx="3" fill="currentColor" fill-opacity="0.22" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="40" y="256" font-size="13" font-weight="600" fill="currentColor">One post</text>

  <!-- split connectors from source to the two paths -->
  <g stroke="#FF6B00" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M 86 180 C 120 180 120 224 150 224"/>
    <path d="M 86 210 C 120 210 120 470 150 470"/>
  </g>
  <polygon points="146,218 162,224 146,230" fill="#FF6B00"/>
  <polygon points="146,464 162,470 146,476" fill="#FF6B00"/>

  <!-- ============ PATH A: Array then Mirror ============ -->
  <rect x="172" y="156" width="588" height="184" rx="10" fill="#4A9EFF" fill-opacity="0.05" stroke="#4A9EFF" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="192" y="184" font-size="16" font-weight="700" fill="#4A9EFF">Path A · Array, then Mirror</text>

  <!-- Step 1 chip: Array -->
  <rect x="192" y="200" width="120" height="30" rx="6" fill="#F5C242" fill-opacity="0.95"/>
  <text x="252" y="220" font-size="13" font-weight="700" fill="#0f1a14" text-anchor="middle">1 · Array</text>
  <!-- intermediate: a row of posts -->
  <g fill="currentColor" fill-opacity="0.22" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.2">
    <rect x="200" y="250" width="14" height="52" rx="2"/>
    <rect x="220" y="250" width="14" height="52" rx="2"/>
    <rect x="240" y="250" width="14" height="52" rx="2"/>
    <rect x="260" y="250" width="14" height="52" rx="2"/>
  </g>
  <text x="192" y="324" font-size="12" fill="currentColor" opacity="0.65">a single row</text>

  <!-- arrow to step 2 -->
  <g stroke="#4A9EFF" stroke-width="2.5" fill="none" stroke-linecap="round">
    <line x1="320" y1="262" x2="372" y2="262"/>
  </g>
  <polygon points="372,255 388,262 372,269" fill="#4A9EFF"/>

  <!-- Step 2 chip: Mirror -->
  <rect x="404" y="200" width="120" height="30" rx="6" fill="#4ADE80" fill-opacity="0.95"/>
  <text x="464" y="220" font-size="13" font-weight="700" fill="#0f1a14" text-anchor="middle">2 · Mirror</text>
  <!-- result: two mirrored rows -->
  <g fill="#4A9EFF" fill-opacity="0.3" stroke="#4A9EFF" stroke-opacity="0.6" stroke-width="1.2">
    <rect x="412" y="250" width="12" height="52" rx="2"/>
    <rect x="429" y="250" width="12" height="52" rx="2"/>
    <rect x="446" y="250" width="12" height="52" rx="2"/>
    <rect x="463" y="250" width="12" height="52" rx="2"/>
    <rect x="486" y="250" width="12" height="52" rx="2"/>
    <rect x="503" y="250" width="12" height="52" rx="2"/>
    <rect x="520" y="250" width="12" height="52" rx="2"/>
    <rect x="537" y="250" width="12" height="52" rx="2"/>
  </g>
  <!-- mirror axis line -->
  <line x1="481" y1="244" x2="481" y2="308" stroke="#FF6B00" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="404" y="324" font-size="12" fill="currentColor" opacity="0.65">the whole row mirrored</text>

  <!-- Path A result label -->
  <rect x="560" y="244" width="188" height="64" rx="8" fill="#4ADE80" fill-opacity="0.12"/>
  <text x="654" y="268" font-size="13" font-weight="700" fill="currentColor" text-anchor="middle">Result A</text>
  <text x="654" y="290" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.75">two long rows,</text>
  <text x="654" y="306" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.75">one reflected pair</text>

  <!-- ============ PATH B: Mirror then Array ============ -->
  <rect x="172" y="402" width="588" height="184" rx="10" fill="#B47EE8" fill-opacity="0.05" stroke="#B47EE8" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="192" y="430" font-size="16" font-weight="700" fill="#B47EE8">Path B · Mirror, then Array</text>

  <!-- Step 1 chip: Mirror -->
  <rect x="192" y="446" width="120" height="30" rx="6" fill="#4ADE80" fill-opacity="0.95"/>
  <text x="252" y="466" font-size="13" font-weight="700" fill="#0f1a14" text-anchor="middle">1 · Mirror</text>
  <!-- intermediate: a mirrored pair -->
  <g fill="currentColor" fill-opacity="0.22" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.2">
    <rect x="216" y="496" width="14" height="52" rx="2"/>
    <rect x="244" y="496" width="14" height="52" rx="2"/>
  </g>
  <line x1="237" y1="490" x2="237" y2="554" stroke="#FF6B00" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="192" y="570" font-size="12" fill="currentColor" opacity="0.65">one mirrored pair</text>

  <!-- arrow to step 2 -->
  <g stroke="#B47EE8" stroke-width="2.5" fill="none" stroke-linecap="round">
    <line x1="320" y1="508" x2="372" y2="508"/>
  </g>
  <polygon points="372,501 388,508 372,515" fill="#B47EE8"/>

  <!-- Step 2 chip: Array -->
  <rect x="404" y="446" width="120" height="30" rx="6" fill="#F5C242" fill-opacity="0.95"/>
  <text x="464" y="466" font-size="13" font-weight="700" fill="#0f1a14" text-anchor="middle">2 · Array</text>
  <!-- result: repeated mirrored pairs -->
  <g fill="#B47EE8" fill-opacity="0.3" stroke="#B47EE8" stroke-opacity="0.6" stroke-width="1.2">
    <rect x="412" y="496" width="12" height="52" rx="2"/>
    <rect x="427" y="496" width="12" height="52" rx="2"/>
    <rect x="450" y="496" width="12" height="52" rx="2"/>
    <rect x="465" y="496" width="12" height="52" rx="2"/>
    <rect x="488" y="496" width="12" height="52" rx="2"/>
    <rect x="503" y="496" width="12" height="52" rx="2"/>
    <rect x="526" y="496" width="12" height="52" rx="2"/>
    <rect x="541" y="496" width="12" height="52" rx="2"/>
  </g>
  <!-- repeat-gap markers -->
  <text x="404" y="570" font-size="12" fill="currentColor" opacity="0.65">the pair repeated four times</text>

  <!-- Path B result label -->
  <rect x="560" y="490" width="188" height="64" rx="8" fill="#B47EE8" fill-opacity="0.14"/>
  <text x="654" y="514" font-size="13" font-weight="700" fill="currentColor" text-anchor="middle">Result B</text>
  <text x="654" y="536" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.75">four spaced</text>
  <text x="654" y="552" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.75">mirrored pairs</text>

  <!-- divergence brace between the two results -->
  <text x="654" y="338" font-size="12" font-weight="700" fill="#FF6B00" text-anchor="middle">different!</text>
  <g stroke="#FF6B00" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M 654 344 C 654 380 654 380 654 414"/>
  </g>
  <polygon points="648,410 654,424 660,410" fill="#FF6B00"/>

  <!-- Footer tip (Variant B, left rail) -->
  <rect x="40" y="608" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="608" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="630" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Blender reads a stack bottom to top · drag a modifier up or down to change which effect runs first.</text>
</svg>
