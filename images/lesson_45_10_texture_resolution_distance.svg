<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="l45f10-t l45f10-d" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" color="#222">
<title id="l45f10-t">Match texture resolution to how close an object gets to camera</title>
<desc id="l45f10-d">Texture resolution should scale with camera proximity. Hero objects seen close up justify four thousand or eight thousand pixel maps. Mid-ground objects are well served by two thousand pixel maps. Background objects that never come near the camera need only one thousand or five hundred twelve pixel maps. Oversized textures on distant objects waste memory with no visible gain.</desc>
<style>
.title{font-size:15px;font-weight:700;}
.sub{font-size:11.5px;fill:#c8c8c8;}
.tier{font-size:13px;font-weight:800;}
.res{font-size:13px;font-weight:800;}
.role{font-size:11px;fill:#c8c8c8;}
.note{font-size:10.5px;font-weight:700;}
</style>
<text class="title" x="380" y="38" text-anchor="middle">Texture resolution follows camera distance</text>
<g>
<!-- HERO -->
<rect x="70" y="70" width="620" height="66" rx="6" fill="#2a2a2a" stroke="#4ADE80" stroke-width="1.5"/>
<rect x="86" y="82" width="42" height="42" rx="3" fill="#4ADE80"/>
<text class="tier" x="146" y="100" fill="#4ADE80">Hero / close-up</text>
<text class="role" x="146" y="120">object fills the frame</text>
<text class="res" x="620" y="100" fill="#4ADE80" text-anchor="end">4K&#8211;8K</text>
<text class="note" x="620" y="120" fill="#4ADE80" text-anchor="end">full-res maps justified</text>
<!-- MID -->
<rect x="70" y="152" width="620" height="66" rx="6" fill="#2a2a2a" stroke="#4A9EFF" stroke-width="1.5"/>
<rect x="90" y="164" width="34" height="42" rx="3" fill="#4A9EFF"/>
<text class="tier" x="146" y="182" fill="#4A9EFF">Mid-ground</text>
<text class="role" x="146" y="202">visible but not dominant</text>
<text class="res" x="620" y="182" fill="#4A9EFF" text-anchor="end">2K</text>
<text class="note" x="620" y="202" fill="#4A9EFF" text-anchor="end">plenty of detail</text>
<!-- BG -->
<rect x="70" y="234" width="620" height="66" rx="6" fill="#2a2a2a" stroke="#F5C242" stroke-width="1.5"/>
<rect x="96" y="246" width="26" height="42" rx="3" fill="#F5C242"/>
<text class="tier" x="146" y="264" fill="#F5C242">Background</text>
<text class="role" x="146" y="284">far, never approached</text>
<text class="res" x="620" y="264" fill="#F5C242" text-anchor="end">1K&#8211;512</text>
<text class="note" x="620" y="284" fill="#F5C242" text-anchor="end">bigger = wasted VRAM</text>
</g>
<text class="sub" x="380" y="380" text-anchor="middle">Conceptual mapping; see the memory table for exact per-map figures.</text>
</svg>
