<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="bz-title bz-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="bz-title">Bezier interpolation curve</title>
  <desc id="bz-desc">A value-versus-time graph showing the smooth S-shaped curve produced by Bezier interpolation between two keyframes. The curve starts shallow (slow start), steepens through the middle (fast middle), and flattens at the end (slow end). Each keyframe is a yellow diamond with green Bezier control handles extending from it.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Bezier Interpolation</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">The default mode &#183; smooth ease in and ease out between keyframes</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Graph plot area: x 120..720, y 150..450 -->
  <!-- Axis grid -->
  <g stroke="currentColor" opacity="0.15" stroke-width="1">
    <!-- vertical grid at frame 1, 12, 24 -->
    <line x1="120" y1="150" x2="120" y2="450"/>
    <line x1="420" y1="150" x2="420" y2="450"/>
    <line x1="720" y1="150" x2="720" y2="450"/>
    <!-- horizontal grid at value 0, 5, 10 -->
    <line x1="120" y1="450" x2="720" y2="450"/>
    <line x1="120" y1="300" x2="720" y2="300"/>
    <line x1="120" y1="150" x2="720" y2="150"/>
  </g>

  <!-- Axis lines (stronger) -->
  <g stroke="currentColor" opacity="0.45" stroke-width="1.5" stroke-linecap="round">
    <line x1="120" y1="150" x2="120" y2="450"/>
    <line x1="120" y1="450" x2="720" y2="450"/>
  </g>

  <!-- Axis labels: X -->
  <text x="420" y="492" font-size="13" text-anchor="middle" fill="currentColor" opacity="0.6">TIME (frames)</text>
  <text x="120" y="470" font-size="13" text-anchor="middle" fill="currentColor" opacity="0.6">1</text>
  <text x="420" y="470" font-size="13" text-anchor="middle" fill="currentColor" opacity="0.6">12</text>
  <text x="720" y="470" font-size="13" text-anchor="middle" fill="currentColor" opacity="0.6">24</text>

  <!-- Axis labels: Y (rotated) -->
  <text x="64" y="300" font-size="13" text-anchor="middle" fill="currentColor" opacity="0.6" transform="rotate(-90 64 300)">VALUE (position)</text>
  <text x="104" y="455" font-size="13" text-anchor="end" fill="currentColor" opacity="0.6">0</text>
  <text x="104" y="305" font-size="13" text-anchor="end" fill="currentColor" opacity="0.6">5</text>
  <text x="104" y="155" font-size="13" text-anchor="end" fill="currentColor" opacity="0.6">10</text>

  <!-- Bezier curve: from KF1 (120,450) to KF2 (720,150), S-shaped ease in/out -->
  <!-- Cubic Bezier: control points pulled horizontally to flatten the ends -->
  <path d="M 120 450 C 320 450 520 150 720 150"
        fill="none" stroke="#FF6B00" stroke-width="4" stroke-linecap="round"/>

  <!-- Keyframe 1 handle (green): from (120,450) toward (260,450) -->
  <g stroke="#4ADE80" stroke-width="2">
    <line x1="120" y1="450" x2="240" y2="450"/>
  </g>
  <circle cx="240" cy="450" r="6" fill="none" stroke="#4ADE80" stroke-width="2"/>

  <!-- Keyframe 2 handle (green): from (720,150) toward (600,150) -->
  <g stroke="#4ADE80" stroke-width="2">
    <line x1="720" y1="150" x2="600" y2="150"/>
  </g>
  <circle cx="600" cy="150" r="6" fill="none" stroke="#4ADE80" stroke-width="2"/>

  <!-- Keyframe diamonds (yellow) -->
  <path d="M 120 438 L 132 450 L 120 462 L 108 450 Z" fill="#F5C242" stroke="currentColor" stroke-opacity="0.3" stroke-width="1"/>
  <path d="M 720 138 L 732 150 L 720 162 L 708 150 Z" fill="#F5C242" stroke="currentColor" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Annotations -->
  <!-- Slow start -->
  <text x="150" y="430" font-size="13" font-weight="600" fill="currentColor">Slow start</text>
  <text x="150" y="446" font-size="12" fill="currentColor" opacity="0.6">(ease in)</text>

  <!-- Fast middle -->
  <text x="430" y="296" font-size="13" font-weight="600" fill="currentColor">Fast middle</text>
  <text x="430" y="312" font-size="12" fill="currentColor" opacity="0.6">steepest slope</text>

  <!-- Slow end -->
  <text x="610" y="190" font-size="13" font-weight="600" fill="currentColor" text-anchor="end">Slow end</text>
  <text x="610" y="206" font-size="12" fill="currentColor" opacity="0.6" text-anchor="end">(ease out)</text>

  <!-- Green handle legend -->
  <circle cx="430" cy="356" r="6" fill="none" stroke="#4ADE80" stroke-width="2"/>
  <text x="446" y="360" font-size="12" fill="currentColor" opacity="0.6">Green handles shape the curve</text>

  <!-- Footer tip (Variant B left rail) -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Bezier is Blender's default because the gentle ends and quick middle read as natural, weighted motion.
  </text>
</svg>
