<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="rgo-title rgo-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="rgo-title">Reference gathering and organization</title>
  <desc id="rgo-desc">Five reference categories to collect before opening Blender (direct, material, lighting, composition, technical) feeding into an organized per-project reference folder, with a target of twenty to fifty images sorted by category.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Gather References First</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Collect before you model &#183; organize by category &#183; 20&#8211;50 images is typical</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Left: five reference categories -->
  <text x="40" y="138" font-size="18" font-weight="600" fill="currentColor">What to Look For</text>

  <!-- Category rows -->
  <g font-size="14">
    <!-- Direct -->
    <rect x="40" y="152" width="6" height="46" fill="#FF6B00"/>
    <text x="60" y="172" font-weight="600" fill="currentColor">Direct</text>
    <text x="60" y="190" font-size="13" fill="currentColor" opacity="0.6">Your specific subject &#183; photos, artwork</text>
    <!-- Material -->
    <rect x="40" y="206" width="6" height="46" fill="#4A9EFF"/>
    <text x="60" y="226" font-weight="600" fill="currentColor">Material</text>
    <text x="60" y="244" font-size="13" fill="currentColor" opacity="0.6">Surfaces and textures you will need</text>
    <!-- Lighting -->
    <rect x="40" y="260" width="6" height="46" fill="#F5C242"/>
    <text x="60" y="280" font-weight="600" fill="currentColor">Lighting</text>
    <text x="60" y="298" font-size="13" fill="currentColor" opacity="0.6">Mood and atmosphere you want to hit</text>
    <!-- Composition -->
    <rect x="40" y="314" width="6" height="46" fill="#B47EE8"/>
    <text x="60" y="334" font-weight="600" fill="currentColor">Composition</text>
    <text x="60" y="352" font-size="13" fill="currentColor" opacity="0.6">Strong visual layouts and framing</text>
    <!-- Technical -->
    <rect x="40" y="368" width="6" height="46" fill="#4ADE80"/>
    <text x="60" y="388" font-weight="600" fill="currentColor">Technical</text>
    <text x="60" y="406" font-size="13" fill="currentColor" opacity="0.6">Breakdowns of similar projects</text>
  </g>

  <!-- Right: organized folder -->
  <text x="440" y="138" font-size="18" font-weight="600" fill="currentColor">One Project Folder</text>

  <!-- Folder icon -->
  <path transform="translate(440,152)"
        d="M 4 7 Q 4 5 6 5 L 11 5 L 14 8 L 26 8 Q 28 8 28 10 L 28 22 Q 28 24 26 24 L 6 24 Q 4 24 4 22 Z"
        fill="#FF6B00"/>
  <text x="480" y="173" font-size="14" font-weight="600" fill="currentColor">/references</text>

  <!-- Category subfolders tree -->
  <g stroke="currentColor" stroke-width="1.5" opacity="0.3" stroke-linecap="round">
    <line x1="454" y1="182" x2="454" y2="392"/>
    <line x1="454" y1="200" x2="470" y2="200"/>
    <line x1="454" y1="248" x2="470" y2="248"/>
    <line x1="454" y1="296" x2="470" y2="296"/>
    <line x1="454" y1="344" x2="470" y2="344"/>
    <line x1="454" y1="392" x2="470" y2="392"/>
  </g>
  <g font-size="13">
    <text x="478" y="204" fill="currentColor">modeling/</text>
    <text x="478" y="252" fill="currentColor">materials/</text>
    <text x="478" y="300" fill="currentColor">lighting/</text>
    <text x="478" y="348" fill="currentColor">composition/</text>
    <text x="478" y="396" fill="currentColor">technical/</text>
  </g>
  <text x="440" y="432" font-size="13" fill="currentColor" opacity="0.6">Sources: ArtStation &#183; PureRef &#183; Pinterest &#183; Unsplash</text>

  <!-- Footer tip (Variant B, left rail) -->
  <rect x="40" y="506" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Collect more than you think you need, and note what you like about each one.
  </text>
</svg>
