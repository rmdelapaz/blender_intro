<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="ss-title ss-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="ss-title">What screen-space effects can and cannot see</title>
  <desc id="ss-desc">A diagram of a camera and its view frustum. Objects inside the frustum are drawn to the screen and can be used by screen-space effects, shown in blue and green. An object outside the frustum, behind the camera, is dimmed in grey and marked with a red cross, because it never reaches the screen it cannot be reflected or used by any screen-space effect.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Screen Space: Only What the Camera Sees</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Screen-space effects reuse the rendered image, so off-screen detail simply isn&#8217;t there</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- camera -->
  <g>
    <rect x="70" y="280" width="40" height="28" rx="3" fill="#FF6B00"/>
    <polygon points="110,286 128,276 128,312 110,302" fill="#FF6B00"/>
    <text x="90" y="334" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.7">camera</text>
  </g>

  <!-- view frustum -->
  <polygon points="124,294 540,150 540,438 124,294" fill="#4A9EFF" fill-opacity="0.07" stroke="#4A9EFF" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="330" y="150" font-size="12" text-anchor="middle" fill="#4A9EFF" font-weight="600">view frustum (what the camera renders)</text>

  <!-- screen plane -->
  <line x1="300" y1="196" x2="300" y2="392" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.4"/>
  <text x="300" y="410" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.6">screen</text>

  <!-- IN-VIEW object A (visible, can reflect) -->
  <circle cx="360" cy="250" r="26" fill="#4A9EFF" fill-opacity="0.85"/>
  <text x="360" y="255" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="700">A</text>
  <text x="360" y="300" font-size="11.5" text-anchor="middle" fill="currentColor" opacity="0.75">on screen</text>

  <!-- IN-VIEW object B (visible, can be used) -->
  <rect x="430" y="320" width="48" height="48" rx="5" fill="#4ADE80" fill-opacity="0.85"/>
  <text x="454" y="349" font-size="11" text-anchor="middle" fill="#0f1a14" font-weight="700">B</text>
  <text x="454" y="386" font-size="11.5" text-anchor="middle" fill="currentColor" opacity="0.75">on screen</text>

  <!-- reflection relationship A<->B (allowed) -->
  <path d="M 384 264 Q 420 310 436 332" fill="none" stroke="#4ADE80" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="420" y="296" font-size="10.5" fill="#4ADE80" font-weight="600">can reflect</text>

  <!-- OUT-OF-VIEW object C (behind camera, cannot be processed) -->
  <circle cx="150" cy="470" r="26" fill="currentColor" fill-opacity="0.18" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.5"/>
  <text x="150" y="475" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55" font-weight="700">C</text>
  <text x="150" y="512" font-size="11.5" text-anchor="middle" fill="currentColor" opacity="0.55">off screen</text>

  <!-- red X: cannot reflect C -->
  <g stroke="#E63946" stroke-width="3" stroke-linecap="round">
    <line x1="138" y1="458" x2="162" y2="482"/>
    <line x1="162" y1="458" x2="138" y2="482"/>
  </g>
  <!-- attempted reflection of C onto A, denied -->
  <path d="M 176 462 Q 280 380 344 268" fill="none" stroke="#E63946" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.6"/>
  <text x="250" y="430" font-size="11" fill="#E63946" font-weight="600">cannot reflect &#183; never rendered</text>

  <!-- legend -->
  <rect x="560" y="170" width="200" height="210" rx="8" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.12" stroke-width="1"/>
  <text x="576" y="196" font-size="13" font-weight="700" fill="currentColor">Legend</text>

  <circle cx="586" cy="224" r="9" fill="#4A9EFF" fill-opacity="0.85"/>
  <text x="604" y="228" font-size="12" fill="currentColor" opacity="0.8">In view: drawn to screen</text>

  <rect x="577" y="248" width="18" height="18" rx="3" fill="#4ADE80" fill-opacity="0.85"/>
  <text x="604" y="262" font-size="12" fill="currentColor" opacity="0.8">In view: usable by effects</text>

  <circle cx="586" cy="292" r="9" fill="currentColor" fill-opacity="0.18" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="604" y="296" font-size="12" fill="currentColor" opacity="0.8">Off screen: invisible</text>

  <g stroke="#E63946" stroke-width="2.5" stroke-linecap="round">
    <line x1="579" y1="318" x2="593" y2="332"/>
    <line x1="593" y1="318" x2="579" y2="332"/>
  </g>
  <text x="604" y="330" font-size="12" fill="currentColor" opacity="0.8">Cannot be processed</text>

  <text x="576" y="362" font-size="11" fill="currentColor" opacity="0.6">Reflections, AO and SSR</text>
  <text x="576" y="376" font-size="11" fill="currentColor" opacity="0.6">all share this limit.</text>

  <!-- Footer tip (Variant B left rail) -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> If something missing from a reflection is also off the edge of your frame, that is the screen-space limit, not a bug.</text>
</svg>