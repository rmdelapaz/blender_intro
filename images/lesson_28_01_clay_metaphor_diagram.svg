<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cm-title cm-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="cm-title">The Clay Metaphor: digital sculpting as working with clay</title>
  <desc id="cm-desc">Five core clay actions feeding into a central digital clay mass, surrounded by the digital superpowers traditional clay lacks.</desc>
  <defs>
    <marker id="cm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="2">

    <!-- central clay mass -->
    <g>
      <ellipse cx="380" cy="220" rx="96" ry="80" stroke-width="2.5" opacity="0.95"/>
      <path d="M300 210 q40 -34 88 -20 q44 14 64 6" stroke-width="1.4" opacity="0.5"/>
      <path d="M306 244 q52 26 110 12 q30 -8 50 -18" stroke-width="1.4" opacity="0.5"/>
      <text x="380" y="206" text-anchor="middle" font-size="17" font-weight="700" fill="currentColor" stroke="none">Digital</text>
      <text x="380" y="230" text-anchor="middle" font-size="17" font-weight="700" fill="currentColor" stroke="none">Clay</text>
      <text x="380" y="256" text-anchor="middle" font-size="11.5" fill="currentColor" stroke="none" opacity="0.75">mesh surface</text>
    </g>

    <!-- five action nodes (left) -->
    <g font-size="12.5">
      <g>
        <rect x="40" y="44" width="150" height="40" rx="9" opacity="0.9"/>
        <text x="115" y="62" text-anchor="middle" fill="currentColor" stroke="none" font-weight="600">Push in</text>
        <text x="115" y="77" text-anchor="middle" fill="currentColor" stroke="none" font-size="10.5" opacity="0.7">indents &amp; creases</text>
        <line x1="190" y1="64" x2="292" y2="180" marker-end="url(#cm-arrow)" stroke-width="1.6"/>
      </g>
      <g>
        <rect x="40" y="106" width="150" height="40" rx="9" opacity="0.9"/>
        <text x="115" y="124" text-anchor="middle" fill="currentColor" stroke="none" font-weight="600">Pull out</text>
        <text x="115" y="139" text-anchor="middle" fill="currentColor" stroke="none" font-size="10.5" opacity="0.7">volume &amp; forms</text>
        <line x1="190" y1="126" x2="286" y2="192" marker-end="url(#cm-arrow)" stroke-width="1.6"/>
      </g>
      <g>
        <rect x="40" y="200" width="150" height="40" rx="9" opacity="0.9"/>
        <text x="115" y="218" text-anchor="middle" fill="currentColor" stroke="none" font-weight="600">Smooth</text>
        <text x="115" y="233" text-anchor="middle" fill="currentColor" stroke="none" font-size="10.5" opacity="0.7">blend transitions</text>
        <line x1="190" y1="220" x2="282" y2="220" marker-end="url(#cm-arrow)" stroke-width="1.6"/>
      </g>
      <g>
        <rect x="40" y="294" width="150" height="40" rx="9" opacity="0.9"/>
        <text x="115" y="312" text-anchor="middle" fill="currentColor" stroke="none" font-weight="600">Carve</text>
        <text x="115" y="327" text-anchor="middle" fill="currentColor" stroke="none" font-size="10.5" opacity="0.7">fine details</text>
        <line x1="190" y1="314" x2="286" y2="250" marker-end="url(#cm-arrow)" stroke-width="1.6"/>
      </g>
      <g>
        <rect x="40" y="356" width="150" height="40" rx="9" opacity="0.9"/>
        <text x="115" y="374" text-anchor="middle" fill="currentColor" stroke="none" font-weight="600">Add / remove</text>
        <text x="115" y="389" text-anchor="middle" fill="currentColor" stroke="none" font-size="10.5" opacity="0.7">build or cut away</text>
        <line x1="190" y1="376" x2="292" y2="262" marker-end="url(#cm-arrow)" stroke-width="1.6"/>
      </g>
    </g>

    <!-- superpowers (right) -->
    <g font-size="12">
      <text x="650" y="40" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700" font-size="13">Clay&#8217;s superpowers</text>
      <g stroke-width="1.6" opacity="0.95">
        <rect x="556" y="56" width="188" height="34" rx="8"/>
        <text x="650" y="78" text-anchor="middle" fill="currentColor" stroke="none">Undo / redo &#183; infinite</text>
        <rect x="556" y="98" width="188" height="34" rx="8"/>
        <text x="650" y="120" text-anchor="middle" fill="currentColor" stroke="none">Non-destructive saves</text>
        <rect x="556" y="140" width="188" height="34" rx="8"/>
        <text x="650" y="162" text-anchor="middle" fill="currentColor" stroke="none">Mirror symmetry</text>
        <rect x="556" y="182" width="188" height="34" rx="8"/>
        <text x="650" y="204" text-anchor="middle" fill="currentColor" stroke="none">Detail layers</text>
        <rect x="556" y="224" width="188" height="34" rx="8"/>
        <text x="650" y="246" text-anchor="middle" fill="currentColor" stroke="none">Dynamic detail</text>
        <rect x="556" y="266" width="188" height="34" rx="8"/>
        <text x="650" y="288" text-anchor="middle" fill="currentColor" stroke="none">No mess / drying</text>
      </g>
      <path d="M476 220 q44 0 80 -40" stroke-width="1.4" opacity="0.55" marker-end="url(#cm-arrow)"/>
      <path d="M476 230 q60 30 80 60" stroke-width="1.4" opacity="0.55" marker-end="url(#cm-arrow)"/>
    </g>

    <!-- caption strip -->
    <text x="380" y="334" text-anchor="middle" fill="currentColor" stroke="none" font-size="12.5" opacity="0.85">Move brush over surface &#8594; surface responds</text>
    <text x="380" y="408" text-anchor="middle" fill="currentColor" stroke="none" font-size="11.5" opacity="0.7">More pressure &#8594; stronger effect &#183; smaller brush &#8594; finer detail</text>
  </g>
</svg>
