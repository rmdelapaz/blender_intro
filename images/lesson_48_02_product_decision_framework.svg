<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" color="#222" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" role="img" aria-labelledby="pdf-t pdf-d">
  <title id="pdf-t">Choosing Your First Product: Decision Framework</title>
  <desc id="pdf-d">A scorecard contrasting good first-product choices against products to avoid, rated across three axes &#8212; shape complexity, reference availability, and project scope &#8212; with headphones highlighted as the recommended starting point.</desc>
  <rect x="0" y="0" width="760" height="540" fill="none"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="currentColor">Choosing Your First Product</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#8a8f98">Score a candidate on three axes before you commit</text>

  <!-- column headers -->
  <text x="300" y="92" text-anchor="middle" font-size="13" font-weight="600" fill="#8a8f98">Shape complexity</text>
  <text x="450" y="92" text-anchor="middle" font-size="13" font-weight="600" fill="#8a8f98">Reference availability</text>
  <text x="600" y="92" text-anchor="middle" font-size="13" font-weight="600" fill="#8a8f98">Project scope</text>

  <!-- GOOD group -->
  <rect x="30" y="104" width="700" height="150" rx="8" fill="#4ADE80" opacity="0.07"/>
  <text x="46" y="128" font-size="14" font-weight="700" fill="#4ADE80">&#10003; GOOD FIRST CHOICES</text>

  <!-- rows: label + 3 dots (filled=good) -->
  <g font-size="13" fill="currentColor">
    <text x="46" y="160">Headphones  <tspan fill="#FF6B00" font-weight="700">&#9733; recommended</tspan></text>
    <text x="46" y="192">Coffee mug</text>
    <text x="46" y="224">Wristwatch</text>
  </g>
  <!-- dot helper: green good, blue mid -->
  <g>
    <!-- headphones: mid complexity, high ref, tight scope -->
    <circle cx="300" cy="155" r="9" fill="#F5C242"/><circle cx="450" cy="155" r="9" fill="#4ADE80"/><circle cx="600" cy="155" r="9" fill="#4ADE80"/>
    <!-- mug: low complexity, high ref, tight -->
    <circle cx="300" cy="187" r="9" fill="#4ADE80"/><circle cx="450" cy="187" r="9" fill="#4ADE80"/><circle cx="600" cy="187" r="9" fill="#4ADE80"/>
    <!-- watch: mid-high complexity, high ref, tight -->
    <circle cx="300" cy="219" r="9" fill="#F5C242"/><circle cx="450" cy="219" r="9" fill="#4ADE80"/><circle cx="600" cy="219" r="9" fill="#4ADE80"/>
  </g>

  <!-- AVOID group -->
  <rect x="30" y="266" width="700" height="150" rx="8" fill="#E63946" opacity="0.08"/>
  <text x="46" y="290" font-size="14" font-weight="700" fill="#E63946">&#10007; AVOID FOR NOW</text>
  <g font-size="13" fill="currentColor">
    <text x="46" y="322">Car / vehicle</text>
    <text x="46" y="354">Human figure</text>
    <text x="46" y="386">Detailed electronics (open PC)</text>
  </g>
  <g>
    <circle cx="300" cy="317" r="9" fill="#E63946"/><circle cx="450" cy="317" r="9" fill="#F5C242"/><circle cx="600" cy="317" r="9" fill="#E63946"/>
    <circle cx="300" cy="349" r="9" fill="#E63946"/><circle cx="450" cy="349" r="9" fill="#F5C242"/><circle cx="600" cy="349" r="9" fill="#E63946"/>
    <circle cx="300" cy="381" r="9" fill="#E63946"/><circle cx="450" cy="381" r="9" fill="#F5C242"/><circle cx="600" cy="381" r="9" fill="#E63946"/>
  </g>

  <!-- legend -->
  <g font-size="12" fill="#8a8f98">
    <circle cx="46" cy="446" r="8" fill="#4ADE80"/><text x="60" y="450">manageable</text>
    <circle cx="190" cy="446" r="8" fill="#F5C242"/><text x="204" y="450">stretch, but doable</text>
    <circle cx="380" cy="446" r="8" fill="#E63946"/><text x="394" y="450">too much for a first project</text>
  </g>
  <text x="46" y="488" font-size="13" fill="currentColor">Pick something with hard surfaces, a few distinct materials, and photos you can shoot yourself.</text>
  <text x="46" y="512" font-size="13" font-weight="600" fill="#FF6B00">Headphones win: rigid forms, 2&#8211;3 materials, and reference on any desk.</text>
</svg>
