<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="fs-title fs-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="fs-title">The f-stop scale and aperture size</title>
  <desc id="fs-desc">A horizontal scale of six aperture diagrams from f/1.4 to f/16. Each diagram is an iris whose central opening grows smaller as the f-number grows larger, showing that a higher f-number means a smaller aperture. The openings are color coded from green at the wide end through yellow and orange to red at the narrow end. A bar beneath the row shows that wide apertures (low f-numbers) give more blur and shallow depth of field, while narrow apertures (high f-numbers) give less blur and deep depth of field.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">The f-stop scale</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">A higher f-number means a smaller aperture opening (the inverse relationship)</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Aperture row: 6 irises, centers x=100,220,340,460,580,700 at y=240 -->
  <!-- iris outer ring r=46 (currentColor 0.85); opening circle color-keyed, shrinking with f-number -->

  <!-- f/1.4 - very wide - green -->
  <g>
    <circle cx="100" cy="240" r="46" fill="currentColor" opacity="0.85"/>
    <circle cx="100" cy="240" r="40" fill="#4ADE80"/>
    <text x="100" y="166" text-anchor="middle" font-size="18" font-weight="700" fill="currentColor">f/1.4</text>
    <text x="100" y="316" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.65">Very wide</text>
  </g>

  <!-- f/2.8 - wide - green -->
  <g>
    <circle cx="220" cy="240" r="46" fill="currentColor" opacity="0.85"/>
    <circle cx="220" cy="240" r="31" fill="#4ADE80"/>
    <text x="220" y="166" text-anchor="middle" font-size="18" font-weight="700" fill="currentColor">f/2.8</text>
    <text x="220" y="316" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.65">Wide</text>
  </g>

  <!-- f/4 - medium - yellow -->
  <g>
    <circle cx="340" cy="240" r="46" fill="currentColor" opacity="0.85"/>
    <circle cx="340" cy="240" r="24" fill="#F5C242"/>
    <text x="340" y="166" text-anchor="middle" font-size="18" font-weight="700" fill="currentColor">f/4</text>
    <text x="340" y="316" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.65">Medium</text>
  </g>

  <!-- f/5.6 - medium - yellow -->
  <g>
    <circle cx="460" cy="240" r="46" fill="currentColor" opacity="0.85"/>
    <circle cx="460" cy="240" r="18" fill="#F5C242"/>
    <text x="460" y="166" text-anchor="middle" font-size="18" font-weight="700" fill="currentColor">f/5.6</text>
    <text x="460" y="316" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.65">Medium</text>
  </g>

  <!-- f/8 - narrow - orange -->
  <g>
    <circle cx="580" cy="240" r="46" fill="currentColor" opacity="0.85"/>
    <circle cx="580" cy="240" r="12" fill="#FF6B00"/>
    <text x="580" y="166" text-anchor="middle" font-size="18" font-weight="700" fill="currentColor">f/8</text>
    <text x="580" y="316" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.65">Narrow</text>
  </g>

  <!-- f/16 - very narrow - red -->
  <g>
    <circle cx="700" cy="240" r="46" fill="currentColor" opacity="0.85"/>
    <circle cx="700" cy="240" r="7" fill="#E63946"/>
    <text x="700" y="166" text-anchor="middle" font-size="18" font-weight="700" fill="currentColor">f/16</text>
    <text x="700" y="316" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.65">Very narrow</text>
  </g>

  <!-- Blur-direction bar -->
  <defs>
    <linearGradient id="fs-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ADE80"/>
      <stop offset="0.4" stop-color="#F5C242"/>
      <stop offset="0.72" stop-color="#FF6B00"/>
      <stop offset="1" stop-color="#E63946"/>
    </linearGradient>
  </defs>
  <rect x="40" y="372" width="720" height="14" rx="7" fill="url(#fs-grad)"/>
  <text x="44" y="412" text-anchor="start" font-size="13" font-weight="600" fill="currentColor">More blur &#183; shallow depth of field</text>
  <text x="756" y="412" text-anchor="end" font-size="13" font-weight="600" fill="currentColor">Less blur &#183; deep depth of field</text>
  <text x="44" y="432" text-anchor="start" font-size="12" fill="currentColor" opacity="0.6">low f-number, wide aperture</text>
  <text x="756" y="432" text-anchor="end" font-size="12" fill="currentColor" opacity="0.6">high f-number, narrow aperture</text>

  <!-- Key takeaway -->
  <text x="40" y="472" font-size="13" fill="currentColor" opacity="0.75">Each full stop (f/1.4, f/2, f/2.8, f/4 and so on) halves the light reaching the sensor and halves the opening area.</text>

  <!-- Footer tip callout (Variant B, left rail) -->
  <rect x="40" y="506" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> The number is a ratio, so it runs backwards: a small number means a big opening and lots of blur.
  </text>
</svg>
