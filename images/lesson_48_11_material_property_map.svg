<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" color="#222" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" role="img" aria-labelledby="mpm-t mpm-d">
  <title id="mpm-t">Material Property Map: Five Surfaces, Five Controls</title>
  <desc id="mpm-d">A grid mapping the five core PBR properties &#8212; base color, metallic, roughness, normal detail, and clearcoat &#8212; across the five materials on a pair of headphones (matte plastic, brushed metal, leather cushion, rubber cable, and glossy logo), with filled dots showing how high each property is set, so the artist sees at a glance what makes each surface read differently.</desc>
  <rect x="0" y="0" width="760" height="470" fill="none"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="currentColor">Material Property Map</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#8a8f98">The same 5 sliders make every surface &#8212; only the values change</text>

  <!-- column headers (properties) -->
  <g font-size="11" font-weight="600" fill="currentColor" text-anchor="middle">
    <text x="300" y="94">Base color</text>
    <text x="388" y="94">Metallic</text>
    <text x="476" y="94">Roughness</text>
    <text x="564" y="94">Normal</text>
    <text x="652" y="94">Clearcoat</text>
  </g>
  <line x1="60" y1="104" x2="700" y2="104" stroke="#666" stroke-width="1"/>

  <!-- helper: rows -->
  <!-- each dot: filled = high, ring = low. use role hue per row swatch -->

  <!-- Row 1: Matte plastic -->
  <g>
    <rect x="60" y="116" width="120" height="52" rx="5" fill="#1a1a1a"/>
    <text x="70" y="140" font-size="12" font-weight="700" fill="#e8e8e8">Matte plastic</text>
    <text x="70" y="158" font-size="10" fill="#9aa4b2">body shell</text>
    <circle cx="300" cy="142" r="10" fill="#2b2b2b" stroke="#8a8f98"/>
    <circle cx="388" cy="142" r="10" fill="none" stroke="#8a8f98" stroke-width="2"/>
    <circle cx="476" cy="142" r="10" fill="#FF6B00"/>
    <circle cx="564" cy="142" r="10" fill="#FF6B00" opacity="0.5"/>
    <circle cx="652" cy="142" r="10" fill="none" stroke="#8a8f98" stroke-width="2"/>
  </g>
  <!-- Row 2: Brushed metal -->
  <g>
    <rect x="60" y="176" width="120" height="52" rx="5" fill="#9aa2ad"/>
    <text x="70" y="200" font-size="12" font-weight="700" fill="#1a1a1a">Brushed metal</text>
    <text x="70" y="218" font-size="10" fill="#2a2a2a">yokes / trim</text>
    <circle cx="300" cy="202" r="10" fill="#c9ced6" stroke="#8a8f98"/>
    <circle cx="388" cy="202" r="10" fill="#4A9EFF"/>
    <circle cx="476" cy="202" r="10" fill="#4A9EFF" opacity="0.5"/>
    <circle cx="564" cy="202" r="10" fill="#4A9EFF"/>
    <circle cx="652" cy="202" r="10" fill="none" stroke="#8a8f98" stroke-width="2"/>
  </g>
  <!-- Row 3: Leather cushion -->
  <g>
    <rect x="60" y="236" width="120" height="52" rx="5" fill="#5a3d2b"/>
    <text x="70" y="260" font-size="12" font-weight="700" fill="#f0e6dc">Leather</text>
    <text x="70" y="278" font-size="10" fill="#d9c3ad">ear cushions</text>
    <circle cx="300" cy="262" r="10" fill="#5a3d2b" stroke="#8a8f98"/>
    <circle cx="388" cy="262" r="10" fill="none" stroke="#8a8f98" stroke-width="2"/>
    <circle cx="476" cy="262" r="10" fill="#B47EE8"/>
    <circle cx="564" cy="262" r="10" fill="#B47EE8"/>
    <circle cx="652" cy="262" r="10" fill="none" stroke="#8a8f98" stroke-width="2"/>
  </g>
  <!-- Row 4: Rubber cable -->
  <g>
    <rect x="60" y="296" width="120" height="52" rx="5" fill="#26262a"/>
    <text x="70" y="320" font-size="12" font-weight="700" fill="#e8e8e8">Rubber</text>
    <text x="70" y="338" font-size="10" fill="#9aa4b2">cable sleeve</text>
    <circle cx="300" cy="322" r="10" fill="#26262a" stroke="#8a8f98"/>
    <circle cx="388" cy="322" r="10" fill="none" stroke="#8a8f98" stroke-width="2"/>
    <circle cx="476" cy="322" r="10" fill="#F5C242"/>
    <circle cx="564" cy="322" r="10" fill="#F5C242"/>
    <circle cx="652" cy="322" r="10" fill="none" stroke="#8a8f98" stroke-width="2"/>
  </g>
  <!-- Row 5: Glossy logo -->
  <g>
    <rect x="60" y="356" width="120" height="52" rx="5" fill="#2a2a2a"/>
    <text x="70" y="380" font-size="12" font-weight="700" fill="#e8e8e8">Glossy logo</text>
    <text x="70" y="398" font-size="10" fill="#9aa4b2">badge inlay</text>
    <circle cx="300" cy="382" r="10" fill="#4ADE80" stroke="#8a8f98"/>
    <circle cx="388" cy="382" r="10" fill="none" stroke="#8a8f98" stroke-width="2"/>
    <circle cx="476" cy="382" r="10" fill="#4ADE80" opacity="0.35"/>
    <circle cx="564" cy="382" r="10" fill="none" stroke="#8a8f98" stroke-width="2"/>
    <circle cx="652" cy="382" r="10" fill="#4ADE80"/>
  </g>

  <!-- legend -->
  <g font-size="11">
    <circle cx="70" cy="436" r="8" fill="#8a8f98"/><text x="86" y="440" fill="currentColor">high value</text>
    <circle cx="200" cy="436" r="8" fill="#8a8f98" opacity="0.5"/><text x="216" y="440" fill="currentColor">mid</text>
    <circle cx="300" cy="436" r="8" fill="none" stroke="#8a8f98" stroke-width="2"/><text x="316" y="440" fill="currentColor">low / off</text>
    <text x="430" y="440" fill="#8a8f98">Metallic is a hard 0 or 1 &#8212; never a middle value on real surfaces.</text>
  </g>
</svg>
