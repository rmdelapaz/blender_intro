<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" color="#222" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" role="img" aria-labelledby="tls-t tls-d">
  <title id="tls-t">Three-Point Studio Lighting: Top-Down Stage Plan</title>
  <desc id="tls-d">A top-down floor plan of a three-point studio setup around a product and camera &#8212; a large key light front-left at full power for the main shaping, a softer fill light front-right at reduced power to open the shadows, and a rim light behind to separate the subject from the background &#8212; with each light's angle and relative power labeled so the spatial relationship is clear.</desc>
  <rect x="0" y="0" width="760" height="500" fill="none"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="currentColor">Three-Point Lighting &#8212; Stage Plan</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#8a8f98">Seen from above: where each light sits, how strong, and why</text>

  <!-- floor -->
  <ellipse cx="380" cy="290" rx="300" ry="170" fill="#000" opacity="0.12"/>
  <ellipse cx="380" cy="290" rx="300" ry="170" fill="none" stroke="#555" stroke-width="1" stroke-dasharray="4 5"/>

  <!-- product (center) -->
  <circle cx="380" cy="280" r="30" fill="#FF6B00" opacity="0.9"/>
  <text x="380" y="285" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">PRODUCT</text>

  <!-- camera (front, bottom) -->
  <g>
    <rect x="356" y="440" width="48" height="30" rx="4" fill="#4A9EFF" opacity="0.9"/>
    <polygon points="380,440 366,420 394,420" fill="#4A9EFF" opacity="0.9"/>
    <text x="380" y="486" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">CAMERA</text>
  </g>

  <!-- KEY light front-left -->
  <g>
    <line x1="150" y1="150" x2="360" y2="264" stroke="#F5C242" stroke-width="2"/>
    <polygon points="150,150 130,158 158,172" fill="#F5C242"/>
    <rect x="96" y="120" width="70" height="46" rx="6" fill="#F5C242"/>
    <text x="131" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">KEY</text>
    <text x="131" y="156" text-anchor="middle" font-size="10" fill="#1a1a1a">100%</text>
    <text x="96" y="186" font-size="11" fill="currentColor">Large soft box, front-left</text>
    <text x="96" y="202" font-size="11" fill="#8a8f98">~45&#176; off camera. Main shaper.</text>
  </g>

  <!-- FILL light front-right -->
  <g>
    <line x1="610" y1="150" x2="400" y2="264" stroke="#4ADE80" stroke-width="2"/>
    <polygon points="610,150 602,172 630,158" fill="#4ADE80"/>
    <rect x="594" y="120" width="70" height="46" rx="6" fill="#4ADE80"/>
    <text x="629" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">FILL</text>
    <text x="629" y="156" text-anchor="middle" font-size="10" fill="#1a1a1a">~40%</text>
    <text x="500" y="186" font-size="11" fill="currentColor">Softer, front-right</text>
    <text x="500" y="202" font-size="11" fill="#8a8f98">Opens shadows, no new ones.</text>
  </g>

  <!-- RIM light behind -->
  <g>
    <line x1="380" y1="380" x2="380" y2="312" stroke="#B47EE8" stroke-width="2"/>
    <polygon points="380,312 368,330 392,330" fill="#B47EE8"/>
    <rect x="344" y="384" width="72" height="46" rx="6" fill="#B47EE8"/>
    <text x="380" y="404" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">RIM</text>
    <text x="380" y="420" text-anchor="middle" font-size="10" fill="#1a1a1a">60&#8211;80%</text>
    <text x="430" y="400" font-size="11" fill="currentColor">Behind subject, aimed forward</text>
    <text x="430" y="416" font-size="11" fill="#8a8f98">Edge highlight = separation from bg.</text>
  </g>

  <!-- power ratio note -->
  <text x="60" y="474" font-size="12" fill="#8a8f98">Key is the brightest; fill is a fraction of it (the key-to-fill ratio sets contrast); rim only needs to catch the edges. Start with the key alone, then add fill, then rim.</text>
</svg>
