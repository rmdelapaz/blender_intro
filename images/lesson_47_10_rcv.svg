<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="rcvTitle rcvDesc" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" color="#222">
  <title id="rcvTitle">RGB Curves Anatomy</title>
  <desc id="rcvDesc">Anatomy of the RGB Curves node. A square graph plots input tone on the horizontal axis against output tone on the vertical axis, with the diagonal being no change. Dragging the shadow end down and the highlight end up creates an S-curve that adds contrast. The lower-left region controls shadows, the middle controls midtones, and the upper-right controls highlights. Separate Red, Green and Blue channels let you tint specific tonal ranges.</desc>
  <style>
    .hd{fill:currentColor;font-size:19px;font-weight:700;}
    .sub{fill:#9aa4b2;font-size:11px;}
    .ax{stroke:#555;stroke-width:1;}
    .grid{stroke:#333;stroke-width:1;}
    .lbl{fill:#9aa4b2;font-size:10px;}
    .zone{fill:#d4d4d4;font-size:10px;font-weight:700;}
    .note{fill:#d4d4d4;font-size:11px;}
    .chip{font-size:11px;font-weight:700;}
  </style>
  <text x="20" y="34" class="hd">RGB Curves: input vs output tone</text>
  <text x="20" y="54" class="sub">The diagonal is "no change." Bend it to remap brightness; an S-curve adds contrast.</text>

  <!-- graph frame -->
  <rect x="40" y="80" width="280" height="280" fill="#141414" stroke="#555" stroke-width="1.5"/>
  <!-- grid -->
  <line class="grid" x1="110" y1="80" x2="110" y2="360"/>
  <line class="grid" x1="180" y1="80" x2="180" y2="360"/>
  <line class="grid" x1="250" y1="80" x2="250" y2="360"/>
  <line class="grid" x1="40" y1="150" x2="320" y2="150"/>
  <line class="grid" x1="40" y1="220" x2="320" y2="220"/>
  <line class="grid" x1="40" y1="290" x2="320" y2="290"/>
  <!-- reference diagonal -->
  <line x1="40" y1="360" x2="320" y2="80" stroke="#666" stroke-width="1" stroke-dasharray="4 4"/>
  <!-- S curve -->
  <path d="M40 360 C 110 340 120 300 180 220 C 240 140 250 100 320 80" fill="none" stroke="#FF6B00" stroke-width="3"/>
  <!-- handles -->
  <circle cx="40" cy="360" r="5" fill="#FF6B00"/>
  <circle cx="110" cy="318" r="5" fill="#4A9EFF"/>
  <circle cx="180" cy="220" r="5" fill="#F5C242"/>
  <circle cx="250" cy="122" r="5" fill="#4ADE80"/>
  <circle cx="320" cy="80" r="5" fill="#FF6B00"/>
  <!-- axis labels -->
  <text x="150" y="384" class="lbl">Input tone (dark &#8594; bright)</text>
  <text x="18" y="230" class="lbl" transform="rotate(-90 18 230)">Output tone (dark &#8594; bright)</text>
  <text x="46" y="352" class="zone" fill="#4A9EFF">Shadows</text>
  <text x="150" y="212" class="zone" fill="#F5C242">Mids</text>
  <text x="250" y="112" class="zone" fill="#4ADE80">Highlights</text>

  <!-- side notes -->
  <rect x="360" y="90" width="380" height="60" rx="6" fill="#1b1b1b" stroke="#4A9EFF"/>
  <text x="376" y="114" class="chip" fill="#4A9EFF">Pull shadows down</text>
  <text x="376" y="136" class="note">Deepens blacks, richer contrast in dark areas.</text>

  <rect x="360" y="162" width="380" height="60" rx="6" fill="#1b1b1b" stroke="#4ADE80"/>
  <text x="376" y="186" class="chip" fill="#4ADE80">Lift highlights up</text>
  <text x="376" y="208" class="note">Brightens whites; watch for clipping at the top.</text>

  <rect x="360" y="234" width="380" height="60" rx="6" fill="#1b1b1b" stroke="#FF6B00"/>
  <text x="376" y="258" class="chip" fill="#FF6B00">S-curve = contrast</text>
  <text x="376" y="280" class="note">Down in shadows + up in highlights, mids untouched.</text>

  <rect x="360" y="306" width="380" height="54" rx="6" fill="#1b1b1b" stroke="#B47EE8"/>
  <text x="376" y="328" class="chip" fill="#B47EE8">Per-channel R / G / B</text>
  <text x="376" y="348" class="note">Tint one tonal range &#8212; e.g. blue into shadows.</text>
</svg>
