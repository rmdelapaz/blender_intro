<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="cf-title cf-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="cf-title">Flat-plateau F&#183;Curve: held, unchanging value</title>
  <desc id="cf-desc">A Graph Editor F-curve drawn as a perfectly horizontal line at value 5 from frame 1 to frame 24. A flat curve means the value never changes across that span, so the object holds still, paused or stationary.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">READING F&#183;CURVES &#183; FLAT PLATEAU</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">A flat line means no change &#183; the value is held, the object is still</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Gridlines -->
  <g stroke="currentColor" stroke-width="1" opacity="0.15">
    <line x1="110" y1="170" x2="110" y2="460"/>
    <line x1="415" y1="170" x2="415" y2="460"/>
    <line x1="720" y1="170" x2="720" y2="460"/>
    <line x1="110" y1="460" x2="720" y2="460"/>
    <line x1="110" y1="170" x2="720" y2="170"/>
  </g>

  <!-- Axes -->
  <g stroke="currentColor" stroke-width="1.5" opacity="0.4" stroke-linecap="round">
    <line x1="110" y1="170" x2="110" y2="460"/>
    <line x1="110" y1="460" x2="720" y2="460"/>
  </g>

  <!-- Axis labels + ticks -->
  <text x="110" y="478" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">1</text>
  <text x="415" y="478" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">12</text>
  <text x="720" y="478" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">24</text>
  <text x="415" y="500" font-size="13" fill="currentColor" opacity="0.65" text-anchor="middle">Frame (time)</text>
  <text x="98" y="464" font-size="13" fill="currentColor" opacity="0.6" text-anchor="end">0</text>
  <text x="98" y="219" font-size="13" fill="currentColor" opacity="0.6" text-anchor="end">5</text>
  <text x="78" y="315" font-size="13" fill="currentColor" opacity="0.65" text-anchor="middle" transform="rotate(-90 78 315)">Value</text>

  <!-- Flat line held at value 5 (y=215) from frame 1 to 24 -->
  <line x1="110" y1="215" x2="720" y2="215" stroke="#FF6B00" stroke-width="3" stroke-linecap="round"/>

  <!-- Keyframe diamonds at both ends, both at value 5 -->
  <g fill="#FF6B00">
    <path d="M 110 206 L 119 215 L 110 224 L 101 215 Z"/>
    <path d="M 720 206 L 729 215 L 720 224 L 711 215 Z"/>
  </g>

  <!-- Horizontal-handle stubs to reinforce "flat tangent" -->
  <g stroke="#FF6B00" stroke-width="1.5" opacity="0.55" stroke-linecap="round">
    <line x1="110" y1="215" x2="158" y2="215"/>
    <circle cx="158" cy="215" r="3" fill="#FF6B00" stroke="none"/>
    <line x1="720" y1="215" x2="672" y2="215"/>
    <circle cx="672" cy="215" r="3" fill="#FF6B00" stroke="none"/>
  </g>

  <!-- Annotation: no change, double-headed arrow showing no vertical movement -->
  <g stroke="currentColor" stroke-width="1" opacity="0.3" stroke-linecap="round">
    <line x1="415" y1="240" x2="415" y2="300"/>
    <path d="M 411 246 L 415 240 L 419 246" fill="none"/>
    <path d="M 411 294 L 415 300 L 419 294" fill="none"/>
  </g>
  <text x="430" y="276" font-size="14" fill="currentColor">No vertical movement:</text>
  <text x="430" y="294" font-size="13" fill="currentColor" opacity="0.65">value stays constant</text>

  <!-- Annotation: flat tangent at the keyframe -->
  <line x1="158" y1="215" x2="190" y2="180" stroke="currentColor" stroke-width="1" opacity="0.3" stroke-linecap="round"/>
  <text x="196" y="176" font-size="14" fill="currentColor">Horizontal handles = flat hold</text>

  <!-- Info pill: stationary / paused (course role blue, informational) -->
  <rect x="430" y="396" width="290" height="30" rx="6" fill="#4A9EFF" fill-opacity="0.14" stroke="#4A9EFF" stroke-opacity="0.55"/>
  <circle cx="448" cy="411" r="4" fill="#4A9EFF"/>
  <text x="460" y="416" font-size="14" font-weight="600" fill="currentColor">Stationary &#183; paused / held pose</text>

  <!-- Footer tip -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> A held pose is still animation &#183; flat sections give the eye a beat to rest between moves.
  </text>
</svg>
