<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" role="img" aria-labelledby="sqr-title sqr-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" color="#222">
  <title id="sqr-title">Particle settings quick reference for common effects</title>
  <desc id="sqr-desc">A reference table of starting settings for five common particle effects. Columns are Effect, Count, Velocity, Gravity, and Forces. Rows: Rain has count 3000, velocity 0.0, gravity 1.0, forces Wind. Snow has count 2000, velocity 0.0, gravity 0.3, forces Turbulence. Sparks has count 500, velocity 10, gravity 0.5, forces None. Smoke has count 1000, velocity 1.0, gravity minus 0.5, forces Turbulence. Explosion has count 500, velocity 20, gravity 1.5, forces None.</desc>
  <style>
    .sqr-hd{font:700 14px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#fff}
    .sqr-eff{font:700 15px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:currentColor}
    .sqr-cell{font:400 14px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:currentColor;opacity:.85}
    .sqr-note{font:400 12px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:currentColor;opacity:.55}
    .sqr-rowline{stroke:currentColor;stroke-opacity:.12;stroke-width:1}
  </style>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">SETTINGS QUICK REFERENCE</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Starting values for five common particle effects</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Column x-centers: Effect 120 | Count 330 | Velocity 450 | Gravity 570 | Forces 690 -->

  <!-- Header row -->
  <rect x="40" y="138" width="720" height="44" rx="6" fill="#FF6B00"/>
  <text class="sqr-hd" x="60" y="166">Effect</text>
  <text class="sqr-hd" x="330" y="166" text-anchor="middle">Count</text>
  <text class="sqr-hd" x="450" y="166" text-anchor="middle">Velocity</text>
  <text class="sqr-hd" x="570" y="166" text-anchor="middle">Gravity</text>
  <text class="sqr-hd" x="690" y="166" text-anchor="middle">Forces</text>

  <!-- Row 1: Rain (y band 182-258) -->
  <g>
    <rect x="40" y="196" width="6" height="48" rx="3" fill="#4A9EFF"/>
    <text class="sqr-eff" x="60" y="220">Rain</text>
    <text class="sqr-note" x="60" y="238">Straight, fast fall</text>
    <text class="sqr-cell" x="330" y="226" text-anchor="middle">3000</text>
    <text class="sqr-cell" x="450" y="226" text-anchor="middle">0.0</text>
    <text class="sqr-cell" x="570" y="226" text-anchor="middle">1.0</text>
    <text class="sqr-cell" x="690" y="226" text-anchor="middle">Wind</text>
    <line class="sqr-rowline" x1="40" y1="258" x2="760" y2="258"/>
  </g>

  <!-- Row 2: Snow -->
  <g>
    <rect x="40" y="272" width="6" height="48" rx="3" fill="#4ADE80"/>
    <text class="sqr-eff" x="60" y="296">Snow</text>
    <text class="sqr-note" x="60" y="314">Slow, drifting</text>
    <text class="sqr-cell" x="330" y="302" text-anchor="middle">2000</text>
    <text class="sqr-cell" x="450" y="302" text-anchor="middle">0.0</text>
    <text class="sqr-cell" x="570" y="302" text-anchor="middle">0.3</text>
    <text class="sqr-cell" x="690" y="302" text-anchor="middle">Turbulence</text>
    <line class="sqr-rowline" x1="40" y1="334" x2="760" y2="334"/>
  </g>

  <!-- Row 3: Sparks -->
  <g>
    <rect x="40" y="348" width="6" height="48" rx="3" fill="#F5C242"/>
    <text class="sqr-eff" x="60" y="372">Sparks</text>
    <text class="sqr-note" x="60" y="390">Fast burst, short life</text>
    <text class="sqr-cell" x="330" y="378" text-anchor="middle">500</text>
    <text class="sqr-cell" x="450" y="378" text-anchor="middle">10</text>
    <text class="sqr-cell" x="570" y="378" text-anchor="middle">0.5</text>
    <text class="sqr-cell" x="690" y="378" text-anchor="middle">None</text>
    <line class="sqr-rowline" x1="40" y1="410" x2="760" y2="410"/>
  </g>

  <!-- Row 4: Smoke -->
  <g>
    <rect x="40" y="424" width="6" height="48" rx="3" fill="#B47EE8"/>
    <text class="sqr-eff" x="60" y="448">Smoke</text>
    <text class="sqr-note" x="60" y="466">Rises, billows</text>
    <text class="sqr-cell" x="330" y="454" text-anchor="middle">1000</text>
    <text class="sqr-cell" x="450" y="454" text-anchor="middle">1.0</text>
    <text class="sqr-cell" x="570" y="454" text-anchor="middle">&#8722;0.5</text>
    <text class="sqr-cell" x="690" y="454" text-anchor="middle">Turbulence</text>
    <line class="sqr-rowline" x1="40" y1="486" x2="760" y2="486"/>
  </g>

  <!-- Row 5: Explosion -->
  <g>
    <rect x="40" y="500" width="6" height="48" rx="3" fill="#E63946"/>
    <text class="sqr-eff" x="60" y="524">Explosion</text>
    <text class="sqr-note" x="60" y="542">Radial blast</text>
    <text class="sqr-cell" x="330" y="530" text-anchor="middle">500</text>
    <text class="sqr-cell" x="450" y="530" text-anchor="middle">20</text>
    <text class="sqr-cell" x="570" y="530" text-anchor="middle">1.5</text>
    <text class="sqr-cell" x="690" y="530" text-anchor="middle">None</text>
  </g>

  <!-- light column separators -->
  <g stroke="currentColor" stroke-opacity="0.08" stroke-width="1">
    <line x1="270" y1="182" x2="270" y2="548"/>
    <line x1="390" y1="182" x2="390" y2="548"/>
    <line x1="510" y1="182" x2="510" y2="548"/>
    <line x1="630" y1="182" x2="630" y2="548"/>
  </g>

  <!-- Footer tip (Variant B, left rail; dense-variant y positions) -->
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Treat these as starting points, not absolutes. Scale Count to scene size and tune Velocity to taste.</text>
</svg>
