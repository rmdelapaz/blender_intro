<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" color="#222" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" role="img" aria-labelledby="tl49-t tl49-d">
  <title id="tl49-t">The Two-Light Exterior Recipe: Sun Plus HDRI Dome</title>
  <desc id="tl49-d">The standard exterior lighting setup shown in plan around a house: a warm directional sun lamp providing the key and shadows, and an HDRI environment dome wrapping the scene to supply sky fill, reflections, and realistic ambient light.</desc>
  <rect x="0" y="0" width="760" height="400" fill="none"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="currentColor">The Two-Light Setup &#8212; Sun + HDRI</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#8a8f98">The reliable recipe for believable exterior daylight</text>

  <!-- HDRI dome ring -->
  <circle cx="380" cy="232" r="150" fill="#4A9EFF" fill-opacity="0.05" stroke="#4A9EFF" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="380" y="102" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4A9EFF">HDRI ENVIRONMENT DOME</text>
  <text x="380" y="392" text-anchor="middle" font-size="11.5" fill="#8a8f98">wraps the whole scene &#8212; sky fill, ambient colour, reflections in glass &amp; metal</text>

  <!-- house (plan) -->
  <g>
    <rect x="330" y="196" width="100" height="72" rx="3" fill="#1a1a1a" stroke="#c9ccd1" stroke-width="2"/>
    <path d="M330,196 L380,166 L430,196 Z" fill="#1a1a1a" stroke="#c9ccd1" stroke-width="2"/>
    <rect x="352" y="220" width="20" height="26" fill="none" stroke="#8a8f98" stroke-width="1.2"/>
    <rect x="392" y="220" width="20" height="26" fill="none" stroke="#8a8f98" stroke-width="1.2"/>
    <text x="380" y="290" text-anchor="middle" font-size="11" fill="#8a8f98">subject</text>
  </g>

  <!-- sun -->
  <g>
    <circle cx="560" cy="150" r="20" fill="#FF6B00"/>
    <g stroke="#FF6B00" stroke-width="2"><line x1="560" y1="118" x2="560" y2="126"/><line x1="560" y1="174" x2="560" y2="182"/><line x1="528" y1="150" x2="536" y2="150"/><line x1="584" y1="150" x2="592" y2="150"/><line x1="538" y1="128" x2="544" y2="134"/><line x1="576" y1="166" x2="582" y2="172"/><line x1="582" y1="128" x2="576" y2="134"/><line x1="544" y1="166" x2="538" y2="172"/></g>
    <text x="560" y="200" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FF6B00">SUN LAMP</text>
    <text x="560" y="217" text-anchor="middle" font-size="10.5" fill="#8a8f98">warm, directional key</text>
  </g>
  <!-- sun rays to house -->
  <defs><marker id="tl49-a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#FF6B00"/></marker></defs>
  <line x1="542" y1="164" x2="440" y2="210" stroke="#FF6B00" stroke-width="1.8" marker-end="url(#tl49-a)"/>
  <!-- cast shadow direction -->
  <path d="M330,255 L250,300 L300,300 L360,266 Z" fill="#FF6B00" fill-opacity="0.1"/>
  <text x="278" y="320" text-anchor="middle" font-size="10.5" fill="#8a8f98">sharp cast shadow</text>

  <!-- role legend -->
  <rect x="70" y="140" width="150" height="96" rx="9" fill="#1a1a1a"/>
  <circle cx="90" cy="166" r="6" fill="#FF6B00"/><text x="104" y="170" font-size="11.5" fill="#c9ccd1">Sun: key + shadows</text>
  <circle cx="90" cy="190" r="6" fill="#4A9EFF"/><text x="104" y="194" font-size="11.5" fill="#c9ccd1">HDRI: fill + reflect</text>
  <text x="82" y="218" font-size="10.5" fill="#8a8f98">match the sun's angle to</text>
  <text x="82" y="230" font-size="10.5" fill="#8a8f98">the HDRI's baked-in sun</text>
</svg>
