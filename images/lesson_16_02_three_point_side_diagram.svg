<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="tps-title tps-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="tps-title">Three-point lighting side view diagram</title>
  <desc id="tps-desc">Profile view of a three-point lighting setup showing vertical positioning. The subject sits at eye level on the ground line. The key light is raised about 45 degrees above eye level, the fill light is at roughly eye level, and the rim light is high behind the subject at about 60 degrees above, catching the top and back edges.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">THREE-POINT LIGHTING &#183; SIDE VIEW</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Profile view &#183; vertical height and angle of each light</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ground line -->
  <line x1="60" y1="430" x2="740" y2="430" stroke="currentColor" stroke-width="2" opacity="0.4"/>
  <text x="740" y="448" font-size="12" fill="currentColor" opacity="0.5" text-anchor="end">Ground</text>

  <!-- eye-level reference line -->
  <line x1="60" y1="300" x2="740" y2="300" stroke="currentColor" stroke-width="1" opacity="0.15" stroke-dasharray="4 6"/>
  <text x="64" y="294" font-size="12" fill="currentColor" opacity="0.5">Eye level</text>

  <!-- SUBJECT (Suzanne profile bust) at center on ground, brand tie-break orange -->
  <g>
    <!-- head -->
    <circle cx="400" cy="288" r="26" fill="#FF6B00" opacity="0.92"/>
    <!-- ear -->
    <circle cx="380" cy="282" r="8" fill="#FF6B00" opacity="0.92"/>
    <!-- neck + shoulders to ground -->
    <path d="M 386 310 L 386 360 Q 360 370 356 430 L 444 430 Q 440 370 414 360 L 414 310 Z" fill="#FF6B00" opacity="0.92"/>
    <text x="400" y="412" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Subject</text>
  </g>

  <!-- direction beams from each light to subject head -->
  <g stroke-width="2.5" stroke-linecap="round" opacity="0.9">
    <!-- key: upper right, ~45 above -->
    <line x1="588" y1="170" x2="430" y2="270" stroke="#667eea"/>
    <polygon points="430,270 448,266 442,282" fill="#667eea"/>
    <!-- fill: front-left, eye level -->
    <line x1="210" y1="300" x2="368" y2="290" stroke="#6BCF7F"/>
    <polygon points="368,290 350,284 352,300" fill="#6BCF7F"/>
    <!-- rim: high behind right, ~60 above -->
    <line x1="616" y1="120" x2="424" y2="270" stroke="#FF6B9D"/>
    <polygon points="424,270 442,268 434,284" fill="#FF6B9D"/>
  </g>

  <!-- vertical drop guides + angle arcs at subject -->
  <line x1="400" y1="288" x2="400" y2="430" stroke="currentColor" stroke-width="1" opacity="0.18" stroke-dasharray="3 5"/>
  <path d="M 460 288 A 60 60 0 0 0 442 246" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.35"/>
  <text x="470" y="262" font-size="12" fill="currentColor" opacity="0.6">45&#176;</text>
  <path d="M 460 288 A 72 72 0 0 0 436 222" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.3"/>
  <text x="486" y="232" font-size="12" fill="#FF6B9D" opacity="0.85">60&#176;</text>

  <!-- KEY LIGHT glyph -->
  <g>
    <rect x="592" y="146" width="44" height="30" rx="4" fill="#667eea"/>
    <text x="614" y="166" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">K</text>
    <text x="614" y="132" font-size="14" font-weight="600" fill="currentColor" text-anchor="middle">Key Light</text>
    <text x="652" y="166" font-size="12" fill="currentColor" opacity="0.6">45&#176; above</text>
  </g>

  <!-- FILL LIGHT glyph -->
  <g>
    <rect x="166" y="284" width="44" height="30" rx="4" fill="#6BCF7F"/>
    <text x="188" y="304" font-size="15" font-weight="700" fill="#0f1a14" text-anchor="middle">F</text>
    <text x="188" y="270" font-size="14" font-weight="600" fill="currentColor" text-anchor="middle">Fill Light</text>
    <text x="188" y="336" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">eye level</text>
  </g>

  <!-- RIM LIGHT glyph -->
  <g>
    <rect x="622" y="96" width="44" height="30" rx="4" fill="#FF6B9D"/>
    <text x="644" y="116" font-size="15" font-weight="700" fill="#0f1a14" text-anchor="middle">R</text>
    <text x="644" y="82" font-size="14" font-weight="600" fill="currentColor" text-anchor="middle">Rim Light</text>
    <text x="680" y="116" font-size="12" fill="currentColor" opacity="0.6">60&#176; above, behind</text>
  </g>

  <!-- Footer tip (Variant B left rail) -->
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Raising the key gives natural downward shadow; the rim rides high behind to rim the head and shoulders.</text>
</svg>
