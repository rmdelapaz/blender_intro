<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="rc-title rc-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
    <title id="rc-title">Texture resolution comparison chart</title>
    <desc id="rc-desc">A reference table comparing five texture resolutions and their typical use. From smallest to largest: 512 by 512, about 1 megabyte, for small or background objects; 1024 by 1024 or 1K, about 3 megabytes, for medium props and accessories; 2048 by 2048 or 2K, about 12 megabytes, the recommended standard choice for hero props, marked with a star; 4096 by 4096 or 4K, about 48 megabytes, for high detail and cinematic close-ups; and 8192 by 8192 or 8K, about 192 megabytes, for extreme detail and film. File size and detail rise together as resolution increases.</desc>
    <!-- Top brand accent -->
    <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
    <!-- Heading block -->
    <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Choosing a texture resolution</text>
    <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Higher resolution means more detail &#183; but bigger files, more memory, and slower painting</text>
    <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>
    <!-- Column headers -->
    <g font-size="13" font-weight="700" fill="#FF6B00">
        <text x="40" y="140">RESOLUTION</text>
        <text x="250" y="140">FILE SIZE</text>
        <text x="380" y="140">BEST FOR</text>
    </g>
    <line x1="40" y1="152" x2="760" y2="152" stroke="#FF6B00" stroke-width="1.5" opacity="0.5"/>
    <!-- Rows: 5 resolution tiers. Bar width encodes relative detail/size. -->
    <g font-size="14">
        <!-- Row 1: 512 -->
        <text x="40" y="194" font-weight="700" fill="currentColor">512 &#215; 512</text>
        <text x="40" y="212" font-size="11" fill="currentColor" opacity="0.6">Half K</text>
        <rect x="160" y="178" width="8" height="22" rx="2" fill="#FF6B00" opacity="0.35"/>
        <text x="250" y="194" fill="currentColor">~1 MB</text>
        <text x="380" y="194" fill="currentColor">Small objects &#183; background props</text>
        <line x1="40" y1="226" x2="760" y2="226" stroke="currentColor" stroke-width="1" opacity="0.10"/>
        <!-- Row 2: 1024 -->
        <text x="40" y="268" font-weight="700" fill="currentColor">1024 &#215; 1024</text>
        <text x="40" y="286" font-size="11" fill="currentColor" opacity="0.6">1K</text>
        <rect x="160" y="252" width="16" height="22" rx="2" fill="#FF6B00" opacity="0.45"/>
        <text x="250" y="268" fill="currentColor">~3 MB</text>
        <text x="380" y="268" fill="currentColor">Medium props &#183; accessories</text>
        <line x1="40" y1="300" x2="760" y2="300" stroke="currentColor" stroke-width="1" opacity="0.10"/>
        <!-- Row 3: 2048 (recommended, starred) -->
        <rect x="28" y="312" width="732" height="62" rx="8" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-width="1.5"/>
        <text x="40" y="346" font-weight="700" fill="currentColor">2048 &#215; 2048</text>
        <text x="40" y="364" font-size="11" fill="#FF6B00" font-weight="700">2K &#183; RECOMMENDED</text>
        <rect x="160" y="330" width="32" height="22" rx="2" fill="#FF6B00" opacity="0.65"/>
        <text x="250" y="346" fill="currentColor">~12 MB</text>
        <text x="380" y="346" fill="currentColor">Standard choice &#183; hero props &#183; main pieces</text>
        <!-- Star marker -->
        <path d="M 726 330 l 5.1 10.3 l 11.4 1.7 l -8.2 8.0 l 1.9 11.3 l -10.2 -5.4 l -10.2 5.4 l 1.9 -11.3 l -8.2 -8.0 l 11.4 -1.7 z" fill="#FF6B00"/>
        <!-- Row 4: 4096 -->
        <text x="40" y="416" font-weight="700" fill="currentColor">4096 &#215; 4096</text>
        <text x="40" y="434" font-size="11" fill="currentColor" opacity="0.6">4K</text>
        <rect x="160" y="400" width="56" height="22" rx="2" fill="#FF6B00" opacity="0.5"/>
        <text x="250" y="416" fill="currentColor">~48 MB</text>
        <text x="380" y="416" fill="currentColor">High detail &#183; character faces &#183; cinematic</text>
        <line x1="40" y1="448" x2="760" y2="448" stroke="currentColor" stroke-width="1" opacity="0.10"/>
        <!-- Row 5: 8192 -->
        <text x="40" y="490" font-weight="700" fill="currentColor">8192 &#215; 8192</text>
        <text x="40" y="508" font-size="11" fill="currentColor" opacity="0.6">8K</text>
        <rect x="160" y="474" width="84" height="22" rx="2" fill="#FF6B00" opacity="0.55"/>
        <text x="250" y="490" fill="currentColor">~192 MB</text>
        <text x="380" y="490" fill="currentColor">Extreme detail &#183; film &#183; large surfaces</text>
    </g>
    <!-- Footer tip callout (left rail) -->
    <rect x="40" y="524" width="4" height="22" fill="#FF6B00"/>
    <text x="58" y="540" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Start at 1K to block in your design fast &#183; scale up only where the detail will actually be seen.</text>
</svg>
