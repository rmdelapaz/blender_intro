<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="rea-title rea-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="rea-title">Reality check: scope your first portfolio piece honestly</title>
  <desc id="rea-desc">Three scope tiers for a first portfolio piece. A realistic single-focus scene ships in one to two weeks. An ambitious multi-element scene stretches to a month and often stalls. A dream cinematic sequence rarely finishes and is not a first piece. The guidance is to start small and actually finish.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Reality Check: Scope It Honestly</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">A finished small scene beats an abandoned masterpiece every single time</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ============ TIER 1: Realistic ============ -->
  <rect x="40" y="132" width="720" height="108" rx="8" fill="#4ADE80" fill-opacity="0.06"/>
  <rect x="40" y="132" width="4" height="108" fill="#4ADE80"/>
  <text x="60" y="160" font-size="16" font-weight="700" fill="#4ADE80">Realistic &#183; Start Here</text>
  <text x="60" y="182" font-size="13" fill="currentColor" opacity="0.85">Single hero object or one tight vignette. One material focus, one lighting setup.</text>
  <text x="60" y="202" font-size="13" fill="currentColor" opacity="0.6">A stylised prop, a still-life corner, one game-ready asset with a clean turntable.</text>
  <!-- ship badge -->
  <rect x="574" y="150" width="166" height="30" rx="15" fill="#4ADE80" fill-opacity="0.15"/>
  <text x="657" y="170" font-size="13" font-weight="700" fill="#4ADE80" text-anchor="middle">Ships in 1&#8211;2 weeks</text>
  <g transform="translate(60,216)" font-size="12" fill="#4ADE80">
    <circle cx="6" cy="-4" r="6" fill="#4ADE80"/><path d="M 3 -4 l 2 2.5 l 4 -5" fill="none" stroke="#0f1a14" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="20" y="0" fill="currentColor" opacity="0.75">Finishable, refinable, and genuinely portfolio-worthy</text>
  </g>

  <!-- ============ TIER 2: Ambitious ============ -->
  <rect x="40" y="256" width="720" height="108" rx="8" fill="#F5C242" fill-opacity="0.06"/>
  <rect x="40" y="256" width="4" height="108" fill="#F5C242"/>
  <text x="60" y="284" font-size="16" font-weight="700" fill="#F5C242">Ambitious &#183; Only Once You Have One Finished</text>
  <text x="60" y="306" font-size="13" fill="currentColor" opacity="0.85">Full environment, several hero elements, multiple materials and light rigs.</text>
  <text x="60" y="326" font-size="13" fill="currentColor" opacity="0.6">A room interior, a small diorama, a character with a simple set.</text>
  <rect x="574" y="274" width="166" height="30" rx="15" fill="#F5C242" fill-opacity="0.15"/>
  <text x="657" y="294" font-size="13" font-weight="700" fill="#F5C242" text-anchor="middle">Stretches to a month</text>
  <g transform="translate(60,340)" font-size="12">
    <circle cx="6" cy="-4" r="6" fill="#F5C242"/><text x="6" y="0.5" font-size="10" font-weight="700" fill="#0f1a14" text-anchor="middle">!</text>
    <text x="20" y="0" fill="currentColor" opacity="0.75">Doable, but scope creep stalls it if the fundamentals are still shaky</text>
  </g>

  <!-- ============ TIER 3: Dream ============ -->
  <rect x="40" y="380" width="720" height="96" rx="8" fill="#E63946" fill-opacity="0.06"/>
  <rect x="40" y="380" width="4" height="96" fill="#E63946"/>
  <text x="60" y="408" font-size="16" font-weight="700" fill="#E63946">Dream &#183; Not a First Piece</text>
  <text x="60" y="430" font-size="13" fill="currentColor" opacity="0.85">Cinematic sequence, animated character, sprawling world with dozens of assets.</text>
  <text x="60" y="450" font-size="13" fill="currentColor" opacity="0.6">The project you picture when you imagine being finished. Park it, and come back later.</text>
  <rect x="574" y="398" width="166" height="30" rx="15" fill="#E63946" fill-opacity="0.15"/>
  <text x="657" y="418" font-size="13" font-weight="700" fill="#E63946" text-anchor="middle">Rarely finishes</text>
  <g transform="translate(60,464)" font-size="12">
    <circle cx="6" cy="-4" r="6" fill="#E63946"/><path d="M 3 -7 l 6 6 M 9 -7 l -6 6" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
    <text x="20" y="0" fill="currentColor" opacity="0.75">Burns weeks, teaches little, and almost never reaches a shippable state</text>
  </g>

  <!-- Footer tip (Variant B, left rail) -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Pick the tier one notch smaller than your ambition. You can always add polish; you can rarely rescue an over-scoped scene.
  </text>
</svg>
