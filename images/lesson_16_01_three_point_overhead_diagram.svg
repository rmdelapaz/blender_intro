<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="tpo-title tpo-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="tpo-title">Three-point lighting overhead diagram</title>
  <desc id="tpo-desc">Top-down view of a three-point lighting setup. The subject sits at center with the camera below it. The key light is front-right at 45 degrees, the fill light is front-left at 45 degrees opposite the key with shadows off, and the rim light is behind-right pointing at the subject's back. Lights sit about 3 to 5 metres from the subject.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">THREE-POINT LIGHTING &#183; OVERHEAD</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Top-down view &#183; spatial layout of key, fill, and rim around the subject</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ground reference ring (subject zone) -->
  <circle cx="400" cy="320" r="150" fill="none" stroke="currentColor" stroke-width="1" opacity="0.12" stroke-dasharray="3 6"/>

  <!-- camera-to-subject sightline -->
  <line x1="400" y1="458" x2="400" y2="320" stroke="currentColor" stroke-width="1.5" opacity="0.3" stroke-dasharray="5 5"/>

  <!-- direction arrows from each light to subject -->
  <g stroke-width="2.5" stroke-linecap="round" opacity="0.9">
    <!-- key: front-right -->
    <line x1="588" y1="232" x2="452" y2="300" stroke="#667eea"/>
    <polygon points="452,300 470,294 466,310" fill="#667eea"/>
    <!-- fill: front-left -->
    <line x1="212" y1="232" x2="348" y2="300" stroke="#6BCF7F"/>
    <polygon points="348,300 330,294 334,310" fill="#6BCF7F"/>
    <!-- rim: behind-right -->
    <line x1="588" y1="180" x2="446" y2="252" stroke="#FF6B9D"/>
    <polygon points="446,252 464,250 456,266" fill="#FF6B9D"/>
  </g>

  <!-- angle arcs from sightline -->
  <path d="M 400 410 A 90 90 0 0 1 464 374" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.35"/>
  <text x="470" y="392" font-size="12" fill="currentColor" opacity="0.6">45&#176;</text>
  <path d="M 400 410 A 90 90 0 0 0 336 374" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.35"/>
  <text x="300" y="392" font-size="12" fill="currentColor" opacity="0.6">45&#176;</text>

  <!-- SUBJECT (Suzanne) at center, brand tie-break orange -->
  <g>
    <circle cx="400" cy="320" r="26" fill="#FF6B00" opacity="0.92"/>
    <!-- ears -->
    <circle cx="376" cy="306" r="9" fill="#FF6B00" opacity="0.92"/>
    <circle cx="424" cy="306" r="9" fill="#FF6B00" opacity="0.92"/>
    <text x="400" y="372" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">Subject</text>
  </g>

  <!-- KEY LIGHT glyph: front-right -->
  <g>
    <rect x="592" y="206" width="44" height="30" rx="4" fill="#667eea"/>
    <text x="614" y="226" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">K</text>
    <text x="614" y="258" font-size="14" font-weight="600" fill="currentColor" text-anchor="middle">Key Light</text>
    <text x="614" y="276" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">45&#176; front-right</text>
  </g>

  <!-- FILL LIGHT glyph: front-left -->
  <g>
    <rect x="164" y="206" width="44" height="30" rx="4" fill="#6BCF7F"/>
    <text x="186" y="226" font-size="15" font-weight="700" fill="#0f1a14" text-anchor="middle">F</text>
    <text x="186" y="258" font-size="14" font-weight="600" fill="currentColor" text-anchor="middle">Fill Light</text>
    <text x="186" y="276" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">45&#176; front-left</text>
    <text x="186" y="293" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">shadows off</text>
  </g>

  <!-- RIM LIGHT glyph: behind-right -->
  <g>
    <rect x="600" y="150" width="44" height="30" rx="4" fill="#FF6B9D"/>
    <text x="622" y="170" font-size="15" font-weight="700" fill="#0f1a14" text-anchor="middle">R</text>
    <text x="622" y="142" font-size="14" font-weight="600" fill="currentColor" text-anchor="middle">Rim Light</text>
    <text x="622" y="124" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">behind subject</text>
  </g>

  <!-- CAMERA glyph at bottom -->
  <g>
    <rect x="378" y="458" width="44" height="28" rx="3" fill="none" stroke="currentColor" stroke-width="2" opacity="0.7"/>
    <polygon points="422,466 438,460 438,484 422,478" fill="none" stroke="currentColor" stroke-width="2" opacity="0.7"/>
    <text x="356" y="477" font-size="13" font-weight="600" fill="currentColor" text-anchor="end">Camera</text>
  </g>

  <!-- distance note -->
  <text x="180" y="430" font-size="12" fill="currentColor" opacity="0.55" text-anchor="middle">Lights ~3&#8211;5 m from subject</text>

  <!-- Footer tip (Variant B left rail) -->
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Key and fill sit on opposite sides of the camera axis; the rim goes behind the subject for edge separation.</text>
</svg>
