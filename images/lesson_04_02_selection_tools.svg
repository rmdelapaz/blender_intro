<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="st-title st-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="st-title">Selection Tools in Blender</title>
  <desc id="st-desc">A three-panel comparison of Blender's main object selection tools. The left panel shows Box Select with a dashed rectangle drawn around two small cube primitives and a B key badge in the corner. The middle panel shows Circle Select with a translucent orange circle brush hovering over a cube and a C key badge. The right panel shows Lasso Select with a freeform closed curve drawn around two cubes and a Ctrl plus drag badge. A shared-behavior note explains that holding Shift adds to the selection and holding Ctrl subtracts from it. A tip below reminds the reader that all three tools live one keypress apart, and that Alt plus A clears the selection from any of them.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Header -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">SELECTION TOOLS</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Three ways to pick objects in the viewport</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Section sub-label -->
  <text x="400" y="142" font-size="15" font-weight="700" fill="#FF6B00" text-anchor="middle" letter-spacing="2">BOX, CIRCLE, LASSO</text>

  <!-- =============================================================== -->
  <!-- THREE TOOL PANELS                                                -->
  <!-- Panel 1 (Box):    translate(40, 170)   220 wide x 250 tall       -->
  <!-- Panel 2 (Circle): translate(290, 170)  220 wide x 250 tall       -->
  <!-- Panel 3 (Lasso):  translate(540, 170)  220 wide x 250 tall       -->
  <!-- =============================================================== -->

  <!-- ===== PANEL 1: BOX SELECT ===== -->
  <g transform="translate(40, 170)">
    <rect x="0" y="0" width="220" height="250" rx="8"
          fill="currentColor" fill-opacity="0.04"
          stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>

    <!-- Tool name -->
    <text x="14" y="26" font-size="14" font-weight="700" fill="currentColor">Box Select</text>

    <!-- Key badge: B -->
    <g transform="translate(184, 10)">
      <rect x="0" y="0" width="22" height="22" rx="4" fill="#FF6B00"/>
      <text x="11" y="16" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">B</text>
    </g>

    <!-- Cube A at front-three-quarter view: front face (56, 116) 28x28 -->
    <g opacity="0.10">
      <rect x="56" y="116" width="28" height="28" fill="#FF6B00"/>
      <polygon points="56,116 66,106 94,106 84,116" fill="#FF6B00"/>
      <polygon points="84,116 94,106 94,134 84,144" fill="#FF6B00"/>
    </g>
    <g stroke="#FF6B00" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="56" y="116" width="28" height="28"/>
      <polygon points="56,116 66,106 94,106 84,116"/>
      <polygon points="84,116 94,106 94,134 84,144"/>
    </g>

    <!-- Cube B: front face (128, 146) 24x24 -->
    <g opacity="0.10">
      <rect x="128" y="146" width="24" height="24" fill="#FF6B00"/>
      <polygon points="128,146 137,137 161,137 152,146" fill="#FF6B00"/>
      <polygon points="152,146 161,137 161,161 152,170" fill="#FF6B00"/>
    </g>
    <g stroke="#FF6B00" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="128" y="146" width="24" height="24"/>
      <polygon points="128,146 137,137 161,137 152,146"/>
      <polygon points="152,146 161,137 161,161 152,170"/>
    </g>

    <!-- Dashed selection rectangle around both cubes -->
    <rect x="38" y="92" width="148" height="94" rx="2"
          fill="none" stroke="currentColor" stroke-width="1.5"
          stroke-dasharray="6 4" opacity="0.4"/>

    <!-- Description -->
    <text x="110" y="216" font-size="12" fill="currentColor" opacity="0.75" text-anchor="middle">Click and drag a</text>
    <text x="110" y="232" font-size="12" fill="currentColor" opacity="0.75" text-anchor="middle">rectangle across objects.</text>
  </g>

  <!-- ===== PANEL 2: CIRCLE SELECT ===== -->
  <g transform="translate(290, 170)">
    <rect x="0" y="0" width="220" height="250" rx="8"
          fill="currentColor" fill-opacity="0.04"
          stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>

    <!-- Tool name -->
    <text x="14" y="26" font-size="14" font-weight="700" fill="currentColor">Circle Select</text>

    <!-- Key badge: C -->
    <g transform="translate(184, 10)">
      <rect x="0" y="0" width="22" height="22" rx="4" fill="#FF6B00"/>
      <text x="11" y="16" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">C</text>
    </g>

    <!-- Cube at center: front face (94, 130) 32x32 -->
    <g opacity="0.10">
      <rect x="94" y="130" width="32" height="32" fill="#FF6B00"/>
      <polygon points="94,130 106,118 138,118 126,130" fill="#FF6B00"/>
      <polygon points="126,130 138,118 138,150 126,162" fill="#FF6B00"/>
    </g>
    <g stroke="#FF6B00" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="94" y="130" width="32" height="32"/>
      <polygon points="94,130 106,118 138,118 126,130"/>
      <polygon points="126,130 138,118 138,150 126,162"/>
    </g>

    <!-- Circle brush hovering over cube -->
    <circle cx="110" cy="142" r="42"
            fill="#FF6B00" fill-opacity="0.3"
            stroke="#FF6B00" stroke-width="2"/>

    <!-- Crosshair at brush center -->
    <g stroke="#fff" stroke-width="1.5" opacity="0.9" stroke-linecap="round">
      <line x1="104" y1="142" x2="116" y2="142"/>
      <line x1="110" y1="136" x2="110" y2="148"/>
    </g>

    <!-- Description -->
    <text x="110" y="216" font-size="12" fill="currentColor" opacity="0.75" text-anchor="middle">Paint with a circular</text>
    <text x="110" y="232" font-size="12" fill="currentColor" opacity="0.75" text-anchor="middle">brush. Scroll to resize.</text>
  </g>

  <!-- ===== PANEL 3: LASSO SELECT ===== -->
  <g transform="translate(540, 170)">
    <rect x="0" y="0" width="220" height="250" rx="8"
          fill="currentColor" fill-opacity="0.04"
          stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>

    <!-- Tool name -->
    <text x="14" y="26" font-size="14" font-weight="700" fill="currentColor">Lasso Select</text>

    <!-- Key badge: Ctrl + drag -->
    <g transform="translate(138, 10)">
      <rect x="0" y="0" width="68" height="22" rx="4" fill="#FF6B00"/>
      <text x="34" y="16" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">Ctrl + drag</text>
    </g>

    <!-- Cube A: front face (56, 120) 26x26 -->
    <g opacity="0.10">
      <rect x="56" y="120" width="26" height="26" fill="#FF6B00"/>
      <polygon points="56,120 66,110 92,110 82,120" fill="#FF6B00"/>
      <polygon points="82,120 92,110 92,136 82,146" fill="#FF6B00"/>
    </g>
    <g stroke="#FF6B00" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="56" y="120" width="26" height="26"/>
      <polygon points="56,120 66,110 92,110 82,120"/>
      <polygon points="82,120 92,110 92,136 82,146"/>
    </g>

    <!-- Cube B: front face (134, 152) 22x22 -->
    <g opacity="0.10">
      <rect x="134" y="152" width="22" height="22" fill="#FF6B00"/>
      <polygon points="134,152 142,144 164,144 156,152" fill="#FF6B00"/>
      <polygon points="156,152 164,144 164,166 156,174" fill="#FF6B00"/>
    </g>
    <g stroke="#FF6B00" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="134" y="152" width="22" height="22"/>
      <polygon points="134,152 142,144 164,144 156,152"/>
      <polygon points="156,152 164,144 164,166 156,174"/>
    </g>

    <!-- Freeform lasso curve loops around both cubes -->
    <path d="M 38 132 C 28 96, 70 82, 100 100 C 130 86, 168 104, 184 134 C 196 168, 178 196, 142 198 C 102 202, 60 188, 40 168 C 28 154, 28 142, 38 132 Z"
          fill="none" stroke="currentColor" stroke-width="1.8"
          opacity="0.4" stroke-linejoin="round"/>

    <!-- Description -->
    <text x="110" y="216" font-size="12" fill="currentColor" opacity="0.75" text-anchor="middle">Draw a freeform shape</text>
    <text x="110" y="232" font-size="12" fill="currentColor" opacity="0.75" text-anchor="middle">around objects.</text>
  </g>

  <!-- Shared-behavior inset -->
  <g transform="translate(60, 438)">
    <rect x="0" y="0" width="680" height="52" rx="6"
          fill="currentColor" fill-opacity="0.04"
          stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>
    <text x="14" y="20" font-size="11" font-weight="700" fill="currentColor" opacity="0.75" letter-spacing="0.8">SHARED BEHAVIOR</text>
    <text x="14" y="40" font-size="12" fill="currentColor" opacity="0.8">Hold Shift while using any tool to add to the current selection. Hold Ctrl to subtract from it.</text>
  </g>

  <!-- Footer tip callout -->
  <rect x="40" y="506" width="720" height="34" rx="6"
        fill="#FF6B00" fill-opacity="0.10"
        stroke="#FF6B00" stroke-opacity="0.4"/>
  <text x="54" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> The three tools live one keypress apart, and Alt + A clears the selection from any of them.
  </text>
</svg>
