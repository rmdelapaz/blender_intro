<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="ceg-title ceg-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="ceg-title">Common Geometry Nodes errors</title>
  <desc id="ceg-desc">A two-by-three grid of the six most common Geometry Nodes mistakes, each card pairing the warning symptom in red with the positive fix in green: no output geometry, wrong socket type, missing instance geometry, overlapping instances, forgotten Realize Instances, and wrong geometry type into a node.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">COMMON ERRORS</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Six mistakes that break a node tree, and the fix for each</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Card template: symptom (red) top, fix (green) bottom -->
  <!-- Row 1 -->
  <!-- Card 1: no output -->
  <rect x="40"  y="132" width="230" height="160" rx="8" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.2" stroke-width="1.5"/>
  <rect x="40" y="132" width="230" height="4" fill="#E63946"/>
  <text x="56" y="158" font-size="14" font-weight="700" fill="currentColor">Nothing shows up</text>
  <rect x="56" y="170" width="120" height="22" rx="4" fill="#E63946"/>
  <text x="116" y="185" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">NO OUTPUT</text>
  <text x="56" y="212" font-size="12" fill="currentColor" opacity="0.75">Group Output not linked to</text>
  <text x="56" y="228" font-size="12" fill="currentColor" opacity="0.75">the final geometry.</text>
  <rect x="56" y="244" width="60" height="20" rx="4" fill="#4ADE80"/>
  <text x="86" y="258" text-anchor="middle" font-size="11" font-weight="700" fill="#0f1a14">FIX</text>
  <text x="124" y="258" font-size="12" fill="currentColor" opacity="0.85">Connect to Geometry out.</text>

  <!-- Card 2: wrong socket -->
  <rect x="285" y="132" width="230" height="160" rx="8" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.2" stroke-width="1.5"/>
  <rect x="285" y="132" width="230" height="4" fill="#E63946"/>
  <text x="301" y="158" font-size="14" font-weight="700" fill="currentColor">Link is rejected</text>
  <rect x="301" y="170" width="140" height="22" rx="4" fill="#E63946"/>
  <text x="371" y="185" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">WRONG SOCKET</text>
  <text x="301" y="212" font-size="12" fill="currentColor" opacity="0.75">Dragging a Geometry link</text>
  <text x="301" y="228" font-size="12" fill="currentColor" opacity="0.75">into a Value socket.</text>
  <rect x="301" y="244" width="60" height="20" rx="4" fill="#4ADE80"/>
  <text x="331" y="258" text-anchor="middle" font-size="11" font-weight="700" fill="#0f1a14">FIX</text>
  <text x="369" y="258" font-size="12" fill="currentColor" opacity="0.85">Match socket colors.</text>

  <!-- Card 3: missing instance -->
  <rect x="530" y="132" width="230" height="160" rx="8" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.2" stroke-width="1.5"/>
  <rect x="530" y="132" width="230" height="4" fill="#E63946"/>
  <text x="546" y="158" font-size="14" font-weight="700" fill="currentColor">Points but no shapes</text>
  <rect x="546" y="170" width="170" height="22" rx="4" fill="#E63946"/>
  <text x="631" y="185" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">NO INSTANCE GEO</text>
  <text x="546" y="212" font-size="12" fill="currentColor" opacity="0.75">Instance on Points has no</text>
  <text x="546" y="228" font-size="12" fill="currentColor" opacity="0.75">Instance input connected.</text>
  <rect x="546" y="244" width="60" height="20" rx="4" fill="#4ADE80"/>
  <text x="576" y="258" text-anchor="middle" font-size="11" font-weight="700" fill="#0f1a14">FIX</text>
  <text x="614" y="258" font-size="12" fill="currentColor" opacity="0.85">Plug in a mesh.</text>

  <!-- Row 2 -->
  <!-- Card 4: overlapping -->
  <rect x="40"  y="312" width="230" height="160" rx="8" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.2" stroke-width="1.5"/>
  <rect x="40" y="312" width="230" height="4" fill="#E63946"/>
  <text x="56" y="338" font-size="14" font-weight="700" fill="currentColor">Instances collide</text>
  <rect x="56" y="350" width="140" height="22" rx="4" fill="#E63946"/>
  <text x="126" y="365" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">OVERLAPPING</text>
  <text x="56" y="392" font-size="12" fill="currentColor" opacity="0.75">Too many points for the</text>
  <text x="56" y="408" font-size="12" fill="currentColor" opacity="0.75">instance size.</text>
  <rect x="56" y="424" width="60" height="20" rx="4" fill="#4ADE80"/>
  <text x="86" y="438" text-anchor="middle" font-size="11" font-weight="700" fill="#0f1a14">FIX</text>
  <text x="124" y="438" font-size="12" fill="currentColor" opacity="0.85">Lower density or scale.</text>

  <!-- Card 5: realize lag -->
  <rect x="285" y="312" width="230" height="160" rx="8" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.2" stroke-width="1.5"/>
  <rect x="285" y="312" width="230" height="4" fill="#E63946"/>
  <text x="301" y="338" font-size="14" font-weight="700" fill="currentColor">Edits do nothing</text>
  <rect x="301" y="350" width="170" height="22" rx="4" fill="#E63946"/>
  <text x="386" y="365" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">NOT REALIZED</text>
  <text x="301" y="392" font-size="12" fill="currentColor" opacity="0.75">Mesh ops run before</text>
  <text x="301" y="408" font-size="12" fill="currentColor" opacity="0.75">Realize Instances.</text>
  <rect x="301" y="424" width="60" height="20" rx="4" fill="#4ADE80"/>
  <text x="331" y="438" text-anchor="middle" font-size="11" font-weight="700" fill="#0f1a14">FIX</text>
  <text x="369" y="438" font-size="12" fill="currentColor" opacity="0.85">Realize before editing.</text>

  <!-- Card 6: wrong geo type -->
  <rect x="530" y="312" width="230" height="160" rx="8" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.2" stroke-width="1.5"/>
  <rect x="530" y="312" width="230" height="4" fill="#E63946"/>
  <text x="546" y="338" font-size="14" font-weight="700" fill="currentColor">Node has no effect</text>
  <rect x="546" y="350" width="170" height="22" rx="4" fill="#E63946"/>
  <text x="631" y="365" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">WRONG GEO TYPE</text>
  <text x="546" y="392" font-size="12" fill="currentColor" opacity="0.75">Feeding a curve into a</text>
  <text x="546" y="408" font-size="12" fill="currentColor" opacity="0.75">mesh-only node.</text>
  <rect x="546" y="424" width="60" height="20" rx="4" fill="#4ADE80"/>
  <text x="576" y="438" text-anchor="middle" font-size="11" font-weight="700" fill="#0f1a14">FIX</text>
  <text x="614" y="438" font-size="12" fill="currentColor" opacity="0.85">Convert type first.</text>

  <!-- Legend -->
  <rect x="40" y="500" width="18" height="18" rx="4" fill="#E63946"/>
  <text x="66" y="514" font-size="13" fill="currentColor" opacity="0.8">Symptom</text>
  <rect x="180" y="500" width="18" height="18" rx="4" fill="#4ADE80"/>
  <text x="206" y="514" font-size="13" fill="currentColor" opacity="0.8">Fix</text>
  <line x1="40" y1="600" x2="760" y2="600" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Footer tip Variant B (680 offsets) -->
  <rect x="40" y="641" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Most of these show as an empty viewport or an unchanged mesh · use the Viewer node to see what each step outputs.</text>
</svg>
