<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="mf-title mf-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="mf-title">Coordinating camera movement and focus over time</title>
  <desc id="mf-desc">Three two-track timeline rows comparing how a camera movement bar and a focus-pull bar line up over a frame-1-to-120 axis: simultaneous (both bars aligned), sequential (move then focus, end to end), and overlapping (focus starts partway through the move). Each row pairs an orange motion bar with a focus bar and a one-line description.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">MOVEMENT + FOCUS TIMING</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Three ways to line up a camera move with a focus pull</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- legend -->
  <g font-size="12">
    <rect x="40" y="128" width="22" height="10" rx="2" fill="#FF6B00"/>
    <text x="68" y="137" fill="currentColor">Camera movement</text>
    <rect x="210" y="128" width="22" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <circle cx="221" cy="133" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="238" y="137" fill="currentColor">Focus pull</text>
  </g>

  <!-- frame axis geometry: track area x=200..720 maps frame 1..120 -->
  <!-- ROW A: Simultaneous (y center ~190) -->
  <text x="40" y="178" font-size="14" font-weight="600" fill="currentColor">Simultaneous</text>
  <text x="40" y="198" font-size="13" fill="currentColor" opacity="0.6">Move and focus</text>
  <text x="40" y="214" font-size="13" fill="currentColor" opacity="0.6">together</text>
  <!-- motion bar 1..120 -->
  <rect x="200" y="172" width="520" height="14" rx="4" fill="#FF6B00"/>
  <!-- focus bar 1..120 -->
  <rect x="200" y="192" width="520" height="14" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="207" cy="199" r="3.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="713" cy="199" r="3.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="730" y="184" font-size="11" fill="currentColor" opacity="0.55">unified,</text>
  <text x="730" y="198" font-size="11" fill="currentColor" opacity="0.55">flowing</text>

  <line x1="200" y1="230" x2="720" y2="230" stroke="currentColor" stroke-width="1" opacity="0.12"/>

  <!-- ROW B: Sequential (y center ~278) -->
  <text x="40" y="266" font-size="14" font-weight="600" fill="currentColor">Sequential</text>
  <text x="40" y="286" font-size="13" fill="currentColor" opacity="0.6">Move, then shift</text>
  <text x="40" y="302" font-size="13" fill="currentColor" opacity="0.6">focus</text>
  <!-- motion bar 1..60 (x 200..460) -->
  <rect x="200" y="260" width="260" height="14" rx="4" fill="#FF6B00"/>
  <!-- focus bar 60..120 (x 460..720) -->
  <rect x="460" y="280" width="260" height="14" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="467" cy="287" r="3.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="713" cy="287" r="3.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="730" y="272" font-size="11" fill="currentColor" opacity="0.55">distinct</text>
  <text x="730" y="286" font-size="11" fill="currentColor" opacity="0.55">beats</text>

  <line x1="200" y1="318" x2="720" y2="318" stroke="currentColor" stroke-width="1" opacity="0.12"/>

  <!-- ROW C: Overlapping (y center ~366) - highlighted tie-break -->
  <text x="40" y="354" font-size="14" font-weight="600" fill="#FF6B00">Overlapping</text>
  <text x="40" y="374" font-size="13" fill="currentColor" opacity="0.6">Focus starts</text>
  <text x="40" y="390" font-size="13" fill="currentColor" opacity="0.6">mid-move</text>
  <!-- motion bar 1..90 (x 200..590) -->
  <rect x="200" y="348" width="390" height="14" rx="4" fill="#FF6B00"/>
  <!-- focus bar 30..120 (x 330..720) -->
  <rect x="330" y="368" width="390" height="14" rx="4" fill="none" stroke="#FF6B00" stroke-width="1.5" stroke-opacity="0.7"/>
  <circle cx="337" cy="375" r="3.5" fill="none" stroke="#FF6B00" stroke-width="1.5" stroke-opacity="0.7"/>
  <circle cx="713" cy="375" r="3.5" fill="none" stroke="#FF6B00" stroke-width="1.5" stroke-opacity="0.7"/>
  <text x="730" y="360" font-size="11" fill="currentColor" opacity="0.55">organic</text>

  <!-- shared frame ruler beneath -->
  <line x1="200" y1="414" x2="720" y2="414" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
  <!-- ticks at frame 1, 60, 120 -->
  <line x1="200" y1="409" x2="200" y2="419" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
  <text x="200" y="436" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">frame 1</text>
  <line x1="460" y1="409" x2="460" y2="419" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
  <text x="460" y="436" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">60</text>
  <line x1="720" y1="409" x2="720" y2="419" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
  <text x="720" y="436" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.55">120</text>
  <text x="460" y="460" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.5">time &#8594;</text>

  <!-- Footer tip (Variant B) -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Match energy &#183; a slow dolly wants a slow focus pull, a fast move wants a quick rack.</text>
</svg>
