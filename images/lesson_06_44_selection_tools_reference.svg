<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="sr-title sr-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="sr-title">Selection tools quick reference</title>
  <desc id="sr-desc">Reference card listing the five main Edit Mode selection tools in Blender 5.1 with an icon, keyboard shortcut, and short description for each: Box Select, Circle Select, Lasso Select, Select Similar, and Checker Deselect.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Header block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Selection Tools Reference</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">5 ways to select in Edit Mode · drag, brush, trace, match, alternate</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Entry row 1: Box Select -->
  <g id="sr-box">
    <rect x="40" y="138" width="720" height="66" fill="none" stroke="currentColor" stroke-width="1" opacity="0.15"/>
    <g id="sr-icon-box" transform="translate(52, 151)">
      <rect x="2" y="2" width="36" height="36" fill="none" stroke="#FF6B00" stroke-width="2" stroke-dasharray="4,3"/>
    </g>
    <text x="110" y="170" font-size="17" font-weight="700" fill="currentColor">Box Select</text>
    <text x="110" y="190" font-size="13" fill="currentColor" opacity="0.85">Drag a rectangle to select everything inside</text>
    <rect x="728" y="160" width="24" height="22" rx="4" fill="#FF6B00"/>
    <text x="740" y="176" font-size="12" font-weight="700" fill="white" text-anchor="middle">B</text>
  </g>

  <!-- Entry row 2: Circle Select -->
  <g id="sr-circle">
    <rect x="40" y="210" width="720" height="66" fill="none" stroke="currentColor" stroke-width="1" opacity="0.15"/>
    <g id="sr-icon-circle" transform="translate(52, 223)">
      <circle cx="20" cy="20" r="16" fill="none" stroke="#FF6B00" stroke-width="2"/>
    </g>
    <text x="110" y="242" font-size="17" font-weight="700" fill="currentColor">Circle Select</text>
    <text x="110" y="262" font-size="13" fill="currentColor" opacity="0.85">Brush over elements; scroll to resize</text>
    <rect x="728" y="232" width="24" height="22" rx="4" fill="#FF6B00"/>
    <text x="740" y="248" font-size="12" font-weight="700" fill="white" text-anchor="middle">C</text>
  </g>

  <!-- Entry row 3: Lasso Select -->
  <g id="sr-lasso">
    <rect x="40" y="282" width="720" height="66" fill="none" stroke="currentColor" stroke-width="1" opacity="0.15"/>
    <g id="sr-icon-lasso" transform="translate(52, 295)">
      <polyline points="6,18 14,6 28,8 36,18 32,32 22,36 10,30 6,18"
                fill="none" stroke="#FF6B00" stroke-width="2"
                stroke-dasharray="4,3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="110" y="314" font-size="17" font-weight="700" fill="currentColor">Lasso Select</text>
    <text x="110" y="334" font-size="13" fill="currentColor" opacity="0.85">Trace freeform around elements</text>
    <rect x="668" y="304" width="30" height="22" rx="4" fill="#FF6B00"/>
    <text x="683" y="320" font-size="12" font-weight="700" fill="white" text-anchor="middle">Ctrl</text>
    <text x="706" y="320" font-size="13" fill="currentColor" opacity="0.5" text-anchor="middle">+</text>
    <rect x="714" y="304" width="38" height="22" rx="4" fill="#FF6B00"/>
    <text x="733" y="320" font-size="12" font-weight="700" fill="white" text-anchor="middle">RMB</text>
  </g>

  <!-- Entry row 4: Select Similar -->
  <g id="sr-similar">
    <rect x="40" y="354" width="720" height="66" fill="none" stroke="currentColor" stroke-width="1" opacity="0.15"/>
    <g id="sr-icon-similar" transform="translate(52, 367)">
      <rect x="3" y="3" width="14" height="14" fill="#FF6B00"/>
      <rect x="23" y="3" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.55"/>
      <rect x="3" y="23" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.55"/>
      <rect x="23" y="23" width="14" height="14" fill="#FF6B00"/>
      <line x1="17" y1="17" x2="23" y2="23" stroke="#FF6B00" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <text x="110" y="386" font-size="17" font-weight="700" fill="currentColor">Select Similar</text>
    <text x="110" y="406" font-size="13" fill="currentColor" opacity="0.85">Match length, direction, area, or other traits</text>
    <rect x="670" y="376" width="42" height="22" rx="4" fill="#FF6B00"/>
    <text x="691" y="392" font-size="12" font-weight="700" fill="white" text-anchor="middle">Shift</text>
    <text x="720" y="392" font-size="13" fill="currentColor" opacity="0.5" text-anchor="middle">+</text>
    <rect x="728" y="376" width="24" height="22" rx="4" fill="#FF6B00"/>
    <text x="740" y="392" font-size="12" font-weight="700" fill="white" text-anchor="middle">G</text>
  </g>

  <!-- Entry row 5: Checker Deselect -->
  <g id="sr-checker">
    <rect x="40" y="426" width="720" height="66" fill="none" stroke="currentColor" stroke-width="1" opacity="0.15"/>
    <g id="sr-icon-checker" transform="translate(52, 439)">
      <rect x="4" y="4" width="8" height="8" fill="#FF6B00"/>
      <rect x="20" y="4" width="8" height="8" fill="#FF6B00"/>
      <rect x="12" y="12" width="8" height="8" fill="#FF6B00"/>
      <rect x="28" y="12" width="8" height="8" fill="#FF6B00"/>
      <rect x="4" y="20" width="8" height="8" fill="#FF6B00"/>
      <rect x="20" y="20" width="8" height="8" fill="#FF6B00"/>
      <rect x="12" y="28" width="8" height="8" fill="#FF6B00"/>
      <rect x="28" y="28" width="8" height="8" fill="#FF6B00"/>
    </g>
    <text x="110" y="458" font-size="17" font-weight="700" fill="currentColor">Checker Deselect</text>
    <text x="110" y="478" font-size="13" fill="currentColor" opacity="0.85">Deselect every other element in a selection</text>
    <rect x="702" y="448" width="50" height="22" rx="4" fill="#FF6B00"/>
    <text x="727" y="464" font-size="12" font-weight="700" fill="white" text-anchor="middle">Menu</text>
  </g>

  <!-- Footer tip (Variant B 4px left rail) -->
  <rect x="40" y="506" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Hold Shift while using Box, Circle, or Lasso Select to add to your existing selection.
  </text>

</svg>
