<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520"
     role="img" aria-labelledby="br-title br-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="br-title">Resizing the brush with the F key</title>
  <desc id="br-desc">Press F, then move the mouse away from the center to grow the brush or toward the center to shrink it. Concentric circles show the size progression around a shared center, with outward and inward arrows labeled larger and smaller.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Resizing the Brush &#183; Press F</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Tap F, then move the mouse to set brush size &#183; click or move again to confirm</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Instruction pill -->
  <g>
    <rect x="270" y="132" width="260" height="34" rx="17" fill="#FF6B00" fill-opacity="0.10" stroke="#FF6B00" stroke-opacity="0.5"/>
    <text x="400" y="154" text-anchor="middle" font-size="15" font-weight="600" fill="#FF6B00">Press F, then move mouse</text>
  </g>

  <!-- Radial resize diagram, center at (400, 330) -->
  <g>
    <!-- Motion guide rings (size progression), faint -->
    <circle cx="400" cy="330" r="40" fill="none" stroke="currentColor" stroke-opacity="0.18" stroke-width="1.5"/>
    <circle cx="400" cy="330" r="78" fill="none" stroke="currentColor" stroke-opacity="0.18" stroke-width="1.5"/>
    <circle cx="400" cy="330" r="118" fill="none" stroke="currentColor" stroke-opacity="0.18" stroke-width="1.5"/>

    <!-- Live brush cursor: white outline, faint orange fill -->
    <circle cx="400" cy="330" r="78" fill="#FF6B00" fill-opacity="0.07" stroke="#FF6B00" stroke-width="2.5"/>
    <!-- Center dot -->
    <circle cx="400" cy="330" r="4" fill="#FF6B00"/>

    <!-- Outward arrow (larger): up-right -->
    <line x1="430" y1="300" x2="510" y2="220" stroke="#FF6B00" stroke-width="3" stroke-linecap="round" marker-end="url(#br-arrow)"/>
    <!-- Inward arrow (smaller): from lower-left toward center -->
    <line x1="290" y1="440" x2="362" y2="368" stroke="#FF6B00" stroke-width="3" stroke-linecap="round" marker-end="url(#br-arrow)"/>

    <!-- Larger label -->
    <g>
      <text x="524" y="208" font-size="15" font-weight="600" fill="currentColor">Move away</text>
      <text x="524" y="228" font-size="14" fill="currentColor" opacity="0.65">larger brush</text>
    </g>
    <!-- Smaller label -->
    <g>
      <text x="150" y="452" font-size="15" font-weight="600" fill="currentColor">Move toward center</text>
      <text x="150" y="472" font-size="14" fill="currentColor" opacity="0.65">smaller brush</text>
    </g>

    <!-- Small size-progression preview circles, lower-right -->
    <g>
      <circle cx="612" cy="392" r="10" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.5"/>
      <circle cx="648" cy="392" r="18" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.5"/>
      <circle cx="700" cy="392" r="28" fill="none" stroke="#FF6B00" stroke-width="2"/>
      <text x="656" y="442" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.6">size steps</text>
    </g>
  </g>

  <!-- Arrowhead marker -->
  <defs>
    <marker id="br-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF6B00"/>
    </marker>
  </defs>

  <!-- Footer tip (Variant B, left rail) -->
  <rect x="40" y="476" width="720" height="34" fill="none"/>
  <rect x="40" y="476" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="498" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> No need to hold F &#183; tap it, move to size, then click or move again to lock the brush radius.
  </text>
</svg>
