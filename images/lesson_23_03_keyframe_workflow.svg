<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="kw-title kw-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="kw-title">Keyframe animation workflow</title>
  <desc id="kw-desc">A keyframe workflow diagram in three zones: a top-down view of a start and end camera position aimed at a subject with Blender interpolating between them, a timeline strip with two keyframe diamonds at frame 1 and frame 120, and an eight-step numbered workflow from setting the start frame to refining timing.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">KEYFRAME WORKFLOW</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Pin the camera at key moments &#183; Blender draws the path between</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Zone 1: top-down A to B motion idea -->
  <text x="40" y="140" font-size="18" font-weight="600" fill="currentColor">The keyframe idea</text>

  <!-- subject cube (neutral, fixed) -->
  <g transform="translate(400,196)">
    <rect x="-16" y="-16" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="0" y="-26" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.65">Subject</text>
  </g>

  <!-- interpolation path (dotted) from start to end -->
  <path d="M 210 300 Q 320 250 360 214" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 5" opacity="0.45"/>
  <text x="262" y="290" font-size="12" fill="currentColor" opacity="0.6" font-style="italic">Blender interpolates</text>

  <!-- Ghost START camera (frame 1) -->
  <g transform="translate(190,310)" opacity="0.4">
    <!-- camera body -->
    <rect x="-22" y="-15" width="40" height="30" rx="3" fill="#FF6B00"/>
    <!-- lens nub pointing toward subject (up-right) -->
    <path d="M 18 -8 L 34 -14 L 34 14 L 18 8 Z" fill="#FF6B00"/>
    <!-- FOV cone -->
    <path d="M 30 0 L 138 -62 L 138 62 Z" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>
  </g>
  <text x="150" y="360" font-size="12" fill="currentColor">Frame 1 &#183; Start</text>

  <!-- Solid END camera (frame 120) -->
  <g transform="translate(330,238)" opacity="0.95">
    <rect x="-22" y="-15" width="40" height="30" rx="3" fill="#FF6B00" stroke="#FF6B00" stroke-opacity="0.5"/>
    <path d="M 18 -8 L 34 -14 L 34 14 L 18 8 Z" fill="#FF6B00"/>
    <path d="M 30 0 L 126 -44 L 126 44 Z" fill="currentColor" fill-opacity="0.07" stroke="#FF6B00" stroke-opacity="0.5" stroke-width="1"/>
  </g>
  <text x="284" y="208" font-size="12" fill="currentColor">Frame 120 &#183; End</text>

  <!-- Zone 2: timeline strip -->
  <text x="40" y="406" font-size="18" font-weight="600" fill="currentColor">On the timeline</text>
  <!-- track -->
  <line x1="120" y1="446" x2="680" y2="446" stroke="currentColor" stroke-width="2" opacity="0.3"/>
  <!-- in-between region marker -->
  <line x1="120" y1="446" x2="680" y2="446" stroke="#FF6B00" stroke-width="2" opacity="0.25" stroke-dasharray="2 6"/>
  <!-- keyframe diamond at frame 1 -->
  <g transform="translate(120,446)">
    <rect x="-9" y="-9" width="18" height="18" transform="rotate(45)" fill="#FF6B00"/>
    <text x="0" y="34" font-size="12" text-anchor="middle" fill="currentColor">1</text>
  </g>
  <!-- keyframe diamond at frame 120 -->
  <g transform="translate(680,446)">
    <rect x="-9" y="-9" width="18" height="18" transform="rotate(45)" fill="#FF6B00"/>
    <text x="0" y="34" font-size="12" text-anchor="middle" fill="currentColor">120</text>
  </g>
  <!-- playhead tick -->
  <line x1="300" y1="430" x2="300" y2="462" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
  <path d="M 294 426 L 306 426 L 300 434 Z" fill="currentColor" opacity="0.5"/>
  <text x="400" y="486" font-size="13" text-anchor="middle" fill="currentColor" opacity="0.6">auto in-between frames</text>

  <!-- Zone 3: 8-step workflow chips -->
  <text x="40" y="528" font-size="18" font-weight="600" fill="currentColor">The standard process</text>

  <!-- row 1: steps 1-4 -->
  <g font-size="12.5">
    <!-- step 1 -->
    <g transform="translate(40,548)">
      <circle cx="12" cy="12" r="11" fill="#FF6B00"/>
      <text x="12" y="16" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">1</text>
      <text x="30" y="16" fill="currentColor">Set start frame</text>
    </g>
    <line x1="158" y1="560" x2="178" y2="560" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
    <!-- step 2 -->
    <g transform="translate(178,548)">
      <circle cx="12" cy="12" r="11" fill="#FF6B00"/>
      <text x="12" y="16" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">2</text>
      <text x="30" y="16" fill="currentColor">Position camera</text>
    </g>
    <line x1="300" y1="560" x2="320" y2="560" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
    <!-- step 3 -->
    <g transform="translate(320,548)">
      <circle cx="12" cy="12" r="11" fill="#FF6B00"/>
      <text x="12" y="16" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">3</text>
      <text x="30" y="16" fill="currentColor">Insert key (</text>
      <rect x="100" y="2" width="20" height="20" rx="4" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-opacity="0.55"/>
      <text x="110" y="16" font-size="11" font-weight="700" text-anchor="middle" fill="#FF6B00">I</text>
      <text x="124" y="16" fill="currentColor">&#8594; LocRot)</text>
    </g>
    <line x1="500" y1="560" x2="520" y2="560" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
    <!-- step 4 -->
    <g transform="translate(520,548)">
      <circle cx="12" cy="12" r="11" fill="#FF6B00"/>
      <text x="12" y="16" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">4</text>
      <text x="30" y="16" fill="currentColor">Go to end frame</text>
    </g>
  </g>

  <!-- row 2: steps 5-8 -->
  <g font-size="12.5">
    <!-- step 5 -->
    <g transform="translate(40,588)">
      <circle cx="12" cy="12" r="11" fill="#FF6B00"/>
      <text x="12" y="16" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">5</text>
      <text x="30" y="16" fill="currentColor">Reposition camera</text>
    </g>
    <line x1="178" y1="600" x2="198" y2="600" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
    <!-- step 6 -->
    <g transform="translate(198,588)">
      <circle cx="12" cy="12" r="11" fill="#FF6B00"/>
      <text x="12" y="16" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">6</text>
      <text x="30" y="16" fill="currentColor">Insert key (</text>
      <rect x="98" y="2" width="20" height="20" rx="4" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-opacity="0.55"/>
      <text x="108" y="16" font-size="11" font-weight="700" text-anchor="middle" fill="#FF6B00">I</text>
      <text x="122" y="16" fill="currentColor">)</text>
    </g>
    <line x1="330" y1="600" x2="350" y2="600" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
    <!-- step 7 -->
    <g transform="translate(350,588)">
      <circle cx="12" cy="12" r="11" fill="#FF6B00"/>
      <text x="12" y="16" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">7</text>
      <text x="30" y="16" fill="currentColor">Blender interpolates</text>
    </g>
    <line x1="528" y1="600" x2="548" y2="600" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
    <!-- step 8 -->
    <g transform="translate(548,588)">
      <circle cx="12" cy="12" r="11" fill="#FF6B00"/>
      <text x="12" y="16" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">8</text>
      <text x="30" y="16" fill="currentColor">Refine timing</text>
    </g>
  </g>

  <!-- Footer tip (Variant B) at y=641 for 680 canvas -->
  <rect x="40" y="641" width="720" height="34" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> You set the start and end &#183; Blender fills every frame between, so press I &#8594; Location &amp; Rotation.</text>
</svg>
