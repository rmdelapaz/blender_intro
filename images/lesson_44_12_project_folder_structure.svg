<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640" role="img" aria-labelledby="pfs-title pfs-desc" color="#222" font-family="'Segoe UI',system-ui,sans-serif">
<title id="pfs-title">Standard project folder structure</title>
<desc id="pfs-desc">A numbered project folder layout. Under the project root sit eight numbered folders that sort in workflow order: 01 Reference, 02 Concept, 03 Blender working files, 04 Textures, 05 Renders, 06 Output deliverables, 07 Scripts, and 08 Documentation, plus an optional automated Backup folder. Numbered prefixes force natural sorting and separate working files from final output.</desc>
<text x="440" y="34" text-anchor="middle" font-size="23" font-weight="700" fill="currentColor">Standard Project Structure</text>
<text x="440" y="58" text-anchor="middle" font-size="13.5" fill="currentColor" opacity="0.75">Numbered folders sort in workflow order &#8212; work stays separate from output</text>

<!-- project root -->
<rect x="300" y="78" width="280" height="40" rx="8" fill="#2a2a2a" stroke="#FF6B00" stroke-width="1.6"/>
<rect x="300" y="78" width="6" height="40" rx="3" fill="#FF6B00"/>
<text x="324" y="103" font-size="14" font-weight="700" fill="#FF6B00" font-family="'Consolas','Courier New',monospace">&#128193; ProjectName/</text>

<!-- 8 numbered folder rows + backup -->
<!-- row template: rect card, number pill, folder name mono, purpose -->
<g font-family="'Consolas','Courier New',monospace">
<!-- 01 -->
<rect x="60" y="136" width="760" height="44" rx="7" fill="#2a2a2a" stroke="#4A9EFF" stroke-width="1"/>
<rect x="72" y="148" width="30" height="20" rx="4" fill="#4A9EFF"/>
<text x="87" y="163" text-anchor="middle" font-size="12" font-weight="700" fill="#1e1e1e">01</text>
<text x="116" y="164" font-size="13.5" fill="#4A9EFF" font-weight="700">Reference/</text>
<text x="252" y="164" font-size="12" fill="#d4d4d4" font-family="'Segoe UI',system-ui,sans-serif">Reference images, mood boards, research (Characters / Environment / Technical)</text>
<!-- 02 -->
<rect x="60" y="186" width="760" height="44" rx="7" fill="#2a2a2a" stroke="#4A9EFF" stroke-width="1"/>
<rect x="72" y="198" width="30" height="20" rx="4" fill="#4A9EFF"/>
<text x="87" y="213" text-anchor="middle" font-size="12" font-weight="700" fill="#1e1e1e">02</text>
<text x="116" y="214" font-size="13.5" fill="#4A9EFF" font-weight="700">Concept/</text>
<text x="252" y="214" font-size="12" fill="#d4d4d4" font-family="'Segoe UI',system-ui,sans-serif">Early sketches, concepts, design docs</text>
<!-- 03 -->
<rect x="60" y="236" width="760" height="44" rx="7" fill="#2a2a2a" stroke="#FF6B00" stroke-width="1.2"/>
<rect x="72" y="248" width="30" height="20" rx="4" fill="#FF6B00"/>
<text x="87" y="263" text-anchor="middle" font-size="12" font-weight="700" fill="#1e1e1e">03</text>
<text x="116" y="264" font-size="13.5" fill="#FF6B00" font-weight="700">Blender/</text>
<text x="252" y="264" font-size="12" fill="#d4d4d4" font-family="'Segoe UI',system-ui,sans-serif">All working .blend files (Scenes / Assets / Archive)</text>
<text x="812" y="264" text-anchor="end" font-size="10" fill="#FF6B00" font-family="'Segoe UI',system-ui,sans-serif">the work</text>
<!-- 04 -->
<rect x="60" y="286" width="760" height="44" rx="7" fill="#2a2a2a" stroke="#4A9EFF" stroke-width="1"/>
<rect x="72" y="298" width="30" height="20" rx="4" fill="#4A9EFF"/>
<text x="87" y="313" text-anchor="middle" font-size="12" font-weight="700" fill="#1e1e1e">04</text>
<text x="116" y="314" font-size="13.5" fill="#4A9EFF" font-weight="700">Textures/</text>
<text x="252" y="314" font-size="12" fill="#d4d4d4" font-family="'Segoe UI',system-ui,sans-serif">All texture files (PBR_Materials / Procedural / Custom)</text>
<!-- 05 -->
<rect x="60" y="336" width="760" height="44" rx="7" fill="#2a2a2a" stroke="#F5C242" stroke-width="1"/>
<rect x="72" y="348" width="30" height="20" rx="4" fill="#F5C242"/>
<text x="87" y="363" text-anchor="middle" font-size="12" font-weight="700" fill="#1e1e1e">05</text>
<text x="116" y="364" font-size="13.5" fill="#F5C242" font-weight="700">Renders/</text>
<text x="252" y="364" font-size="12" fill="#d4d4d4" font-family="'Segoe UI',system-ui,sans-serif">Rendered images &amp; animation (Tests / Finals / Passes)</text>
<!-- 06 -->
<rect x="60" y="386" width="760" height="44" rx="7" fill="#2a2a2a" stroke="#4ADE80" stroke-width="1.2"/>
<rect x="72" y="398" width="30" height="20" rx="4" fill="#4ADE80"/>
<text x="87" y="413" text-anchor="middle" font-size="12" font-weight="700" fill="#1e1e1e">06</text>
<text x="116" y="414" font-size="13.5" fill="#4ADE80" font-weight="700">Output/</text>
<text x="252" y="414" font-size="12" fill="#d4d4d4" font-family="'Segoe UI',system-ui,sans-serif">Final deliverables (Images / Videos / Composites)</text>
<text x="812" y="414" text-anchor="end" font-size="10" fill="#4ADE80" font-family="'Segoe UI',system-ui,sans-serif">the output</text>
<!-- 07 -->
<rect x="60" y="436" width="760" height="44" rx="7" fill="#2a2a2a" stroke="#4A9EFF" stroke-width="1"/>
<rect x="72" y="448" width="30" height="20" rx="4" fill="#4A9EFF"/>
<text x="87" y="463" text-anchor="middle" font-size="12" font-weight="700" fill="#1e1e1e">07</text>
<text x="116" y="464" font-size="13.5" fill="#4A9EFF" font-weight="700">Scripts/</text>
<text x="252" y="464" font-size="12" fill="#d4d4d4" font-family="'Segoe UI',system-ui,sans-serif">Python scripts, add-ons</text>
<!-- 08 -->
<rect x="60" y="486" width="760" height="44" rx="7" fill="#2a2a2a" stroke="#4A9EFF" stroke-width="1"/>
<rect x="72" y="498" width="30" height="20" rx="4" fill="#4A9EFF"/>
<text x="87" y="513" text-anchor="middle" font-size="12" font-weight="700" fill="#1e1e1e">08</text>
<text x="116" y="514" font-size="13.5" fill="#4A9EFF" font-weight="700">Documentation/</text>
<text x="252" y="514" font-size="12" fill="#d4d4d4" font-family="'Segoe UI',system-ui,sans-serif">Notes.txt, Workflow.md</text>
<!-- backup (dashed, optional) -->
<rect x="60" y="536" width="760" height="44" rx="7" fill="#1e1e1e" stroke="#B47EE8" stroke-width="1" stroke-dasharray="5 4"/>
<rect x="72" y="548" width="30" height="20" rx="4" fill="#B47EE8"/>
<text x="87" y="563" text-anchor="middle" font-size="11" font-weight="700" fill="#1e1e1e">&#128190;</text>
<text x="116" y="564" font-size="13.5" fill="#B47EE8" font-weight="700">ProjectName_Backup/</text>
<text x="330" y="564" font-size="12" fill="#d4d4d4" font-family="'Segoe UI',system-ui,sans-serif">Automated backups (optional)</text>
</g>

<!-- key principles footer -->
<rect x="60" y="592" width="760" height="34" rx="8" fill="#2a2a2a" stroke="currentColor" stroke-width="1"/>
<text x="440" y="613" text-anchor="middle" font-size="12" fill="currentColor">Numbered prefixes (01_, 02_&#8230;) force natural sort &#183; scalable from small jobs to full productions.</text>
</svg>
