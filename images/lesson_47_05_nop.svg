<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="nopTitle nopDesc" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" color="#222">
  <title id="nopTitle">Basic Node Operations</title>
  <desc id="nopDesc">The five core actions for working in the compositor: Add a node with Shift A, Connect nodes by dragging between sockets, Mute a node with M to bypass it, send a node to the Viewer with Ctrl Shift Left click, and toggle the Backdrop to preview the viewer result behind the graph. Each is shown as a mini panel with its shortcut.</desc>
  <style>
    .hd{fill:currentColor;font-size:19px;font-weight:700;}
    .sub{fill:#9aa4b2;font-size:11px;}
    .pt{fill:#ffffff;font-size:13px;font-weight:700;}
    .pd{fill:#d4d4d4;font-size:10.5px;}
    .key{fill:#F5C242;font-size:10.5px;font-weight:700;font-family:monospace;}
    .box{fill:#1b1b1b;stroke:#555;stroke-width:1;}
  </style>
  <text x="20" y="34" class="hd">Working in the node graph</text>
  <text x="20" y="54" class="sub">Five operations cover almost everything you do in the Compositor.</text>

  <!-- 1 Add -->
  <rect class="box" x="20" y="74" width="230" height="140" rx="7" stroke="#4ADE80"/>
  <circle cx="46" cy="100" r="12" fill="#4ADE80"/>
  <text x="42" y="105" class="pt" fill="#14351f">1</text>
  <text x="68" y="105" class="pt">Add a node</text>
  <text x="34" y="132" class="key">Shift + A</text>
  <text x="34" y="152" class="pd">Opens the add-node menu.</text>
  <text x="34" y="170" class="pd">Pick from Input, Color,</text>
  <text x="34" y="188" class="pd">Filter, Distort, Output.</text>

  <!-- 2 Connect -->
  <rect class="box" x="265" y="74" width="230" height="140" rx="7" stroke="#4A9EFF"/>
  <circle cx="291" cy="100" r="12" fill="#4A9EFF"/>
  <text x="287" y="105" class="pt">2</text>
  <text x="313" y="105" class="pt">Connect</text>
  <text x="279" y="132" class="key">drag socket &#8594; socket</text>
  <circle cx="300" cy="165" r="5" fill="#c8c866"/>
  <path d="M300 165 C 360 165 380 178 430 178" fill="none" stroke="#c8c866" stroke-width="2.5"/>
  <circle cx="430" cy="178" r="5" fill="#c8c866"/>
  <text x="279" y="205" class="pd">Output socket to input socket.</text>

  <!-- 3 Mute -->
  <rect class="box" x="510" y="74" width="230" height="140" rx="7" stroke="#E63946"/>
  <circle cx="536" cy="100" r="12" fill="#E63946"/>
  <text x="532" y="105" class="pt">3</text>
  <text x="558" y="105" class="pt">Mute / bypass</text>
  <text x="524" y="132" class="key">M</text>
  <rect x="560" y="150" width="90" height="40" rx="5" fill="#2a2a2a" stroke="#E63946" stroke-dasharray="4 3"/>
  <line x1="560" y1="150" x2="650" y2="190" stroke="#E63946" stroke-width="2"/>
  <text x="524" y="207" class="pd">Passes input straight through.</text>

  <!-- 4 Viewer -->
  <rect class="box" x="20" y="230" width="350" height="150" rx="7" stroke="#B47EE8"/>
  <circle cx="46" cy="256" r="12" fill="#B47EE8"/>
  <text x="42" y="261" class="pt">4</text>
  <text x="68" y="261" class="pt">Send to Viewer</text>
  <text x="34" y="290" class="key">Ctrl + Shift + Click</text>
  <text x="34" y="312" class="pd">Attaches a Viewer node to any node so</text>
  <text x="34" y="330" class="pd">you can inspect its output at that point</text>
  <text x="34" y="348" class="pd">in the tree &#8212; great for debugging wiring.</text>

  <!-- 5 Backdrop -->
  <rect class="box" x="385" y="230" width="355" height="150" rx="7" stroke="#FF6B00"/>
  <circle cx="411" cy="256" r="12" fill="#FF6B00"/>
  <text x="407" y="261" class="pt">5</text>
  <text x="433" y="261" class="pt">Toggle Backdrop</text>
  <text x="399" y="290" class="key">Header &#8594; Backdrop</text>
  <rect x="399" y="302" width="120" height="66" rx="4" fill="#0f0f0f" stroke="#FF6B00" stroke-dasharray="4 3"/>
  <circle cx="459" cy="335" r="20" fill="#3a3f4a"/>
  <text x="535" y="330" class="pd">Shows the Viewer result</text>
  <text x="535" y="348" class="pd">behind the graph as a</text>
  <text x="535" y="366" class="pd">live preview.</text>
</svg>
