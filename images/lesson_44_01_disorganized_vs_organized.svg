<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 600" role="img" aria-labelledby="dvo-title dvo-desc" color="#222" font-family="'Segoe UI',system-ui,-apple-system,sans-serif">
<title id="dvo-title">Disorganized versus organized Outliner</title>
<desc id="dvo-desc">Side by side comparison: a flat Outliner full of default names like Cube.047 on the left, versus a clean nested collection hierarchy with descriptive names on the right.</desc>
<style>
.h{font-size:26px;font-weight:700;fill:currentColor}
.sub{font-size:13px;fill:currentColor;opacity:.75}
.panelttl{font-size:15px;font-weight:700}
.row{font-size:13px;fill:currentColor}
.coll{font-size:13px;font-weight:600;fill:currentColor}
.mono{font-family:'Cascadia Code',Consolas,monospace}
.badge{font-size:13px;font-weight:700}
.note{font-size:12px;fill:currentColor;opacity:.8}
</style>

<text x="430" y="38" text-anchor="middle" class="h">Same scene, two Outliners</text>
<text x="430" y="60" text-anchor="middle" class="sub">Organization is the difference between fighting your file and flowing through it</text>

<!-- center divider -->
<line x1="430" y1="80" x2="430" y2="560" stroke="#FF6B00" stroke-width="3"/>
<circle cx="430" cy="300" r="17" fill="#FF6B00"/>
<text x="430" y="305" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">vs</text>

<!-- ============ LEFT: DISORGANIZED ============ -->
<rect x="30" y="82" width="360" height="470" rx="8" fill="#2a2a2a" stroke="#E63946" stroke-width="2"/>
<rect x="30" y="82" width="360" height="34" rx="8" fill="#E63946"/>
<rect x="30" y="100" width="360" height="16" fill="#E63946"/>
<text x="46" y="105" class="panelttl" fill="#1a1a1a">&#10007; Disorganized</text>
<text x="374" y="105" text-anchor="end" class="badge" fill="#1a1a1a">chaos</text>

<!-- flat scene collection -->
<text x="48" y="140" class="coll" fill="#d4d4d4">&#9660; Scene Collection</text>
<g fill="#d4d4d4">
<text x="70" y="166" class="row mono">&#9642; Cube</text>
<text x="70" y="190" class="row mono">&#9642; Cube.001</text>
<text x="70" y="214" class="row mono">&#9642; Cube.047</text>
<text x="70" y="238" class="row mono">&#9642; Cylinder.023</text>
<text x="70" y="262" class="row mono">&#9642; Sphere.089</text>
<text x="70" y="286" class="row mono">&#9642; Light</text>
<text x="70" y="310" class="row mono">&#9642; Light.001</text>
<text x="70" y="334" class="row mono">&#9642; Camera</text>
<text x="70" y="358" class="row mono">&#9642; Empty</text>
<text x="70" y="382" class="row mono">&#9642; Plane.012</text>
<text x="70" y="406" class="row mono">&#9642; Material.003</text>
</g>
<!-- pain callouts -->
<rect x="48" y="424" width="324" height="112" rx="6" fill="#1e1e1e" stroke="#E63946" stroke-width="1"/>
<text x="60" y="446" class="note" fill="#E63946" font-weight="700">Every session you pay for this:</text>
<text x="60" y="468" class="note">&#8226; Which cube is the door handle?</text>
<text x="60" y="488" class="note">&#8226; No way to hide a group at once</text>
<text x="60" y="508" class="note">&#8226; Duplicates pile up unnoticed</text>
<text x="60" y="528" class="note">&#8226; Handoff to anyone else is hopeless</text>

<!-- ============ RIGHT: ORGANIZED ============ -->
<rect x="470" y="82" width="360" height="470" rx="8" fill="#2a2a2a" stroke="#4ADE80" stroke-width="2"/>
<rect x="470" y="82" width="360" height="34" rx="8" fill="#4ADE80"/>
<rect x="470" y="100" width="360" height="16" fill="#4ADE80"/>
<text x="486" y="105" class="panelttl" fill="#0a2a14">&#10003; Organized</text>
<text x="814" y="105" text-anchor="end" class="badge" fill="#0a2a14">clarity</text>

<text x="488" y="140" class="coll" fill="#d4d4d4">&#9660; Scene Collection</text>
<!-- COLL_Lighting -->
<text x="510" y="164" class="coll" fill="#F5C242">&#9660; &#128193; COLL_Lighting</text>
<g fill="#d4d4d4">
<text x="534" y="186" class="row mono">&#9642; LIGHT_Key</text>
<text x="534" y="206" class="row mono">&#9642; LIGHT_Fill</text>
<text x="534" y="226" class="row mono">&#9642; LIGHT_Rim</text>
</g>
<!-- COLL_Furniture -->
<text x="510" y="250" class="coll" fill="#F5C242">&#9660; &#128193; COLL_Furniture</text>
<g fill="#d4d4d4">
<text x="534" y="272" class="row mono">&#9642; Kitchen_Table</text>
<text x="534" y="292" class="row mono">&#9642; Kitchen_Chair_01</text>
<text x="534" y="312" class="row mono">&#9642; Living_Room_Couch</text>
</g>
<!-- COLL_Cameras -->
<text x="510" y="336" class="coll" fill="#F5C242">&#9654; &#128193; COLL_Cameras</text>
<!-- COLL_Architecture -->
<text x="510" y="360" class="coll" fill="#F5C242">&#9654; &#128193; COLL_Architecture</text>

<!-- gains callout -->
<rect x="488" y="378" width="324" height="158" rx="6" fill="#1e1e1e" stroke="#4ADE80" stroke-width="1"/>
<text x="500" y="400" class="note" fill="#4ADE80" font-weight="700">What you get back:</text>
<text x="500" y="422" class="note">&#8226; Names say what things are, instantly</text>
<text x="500" y="442" class="note">&#8226; Toggle a whole collection&#8217;s visibility</text>
<text x="500" y="462" class="note">&#8226; Nesting mirrors how you think</text>
<text x="500" y="482" class="note">&#8226; Any teammate can pick it up cold</text>
<text x="500" y="514" class="note" fill="#4A9EFF">Same objects &#8212; only the structure changed.</text>

</svg>
