<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="aw-title aw-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="aw-title">Applying a modifier is destructive</title>
  <desc id="aw-desc">A flow diagram contrasting the live modifier stack, which stays editable and removable, with the result of using Apply, which bakes the modifier into the mesh permanently so it can no longer be edited or removed. A warning panel lists what is lost when you apply, and a guidance note explains when applying is safe.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Applying a Modifier Is Permanent</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Apply bakes the effect into the mesh · there is no going back</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Flow: LEFT live stack state -->
  <text x="40" y="138" font-size="18" font-weight="600" fill="currentColor">Before: live modifier</text>

  <!-- Live state card -->
  <rect x="40" y="156" width="320" height="196" rx="10" fill="#4ADE80" fill-opacity="0.08" stroke="#4ADE80" stroke-opacity="0.55" stroke-width="2"/>

  <!-- Base mesh glyph -->
  <rect x="72" y="184" width="84" height="64" rx="6" fill="currentColor" opacity="0.14"/>
  <text x="114" y="220" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">Base</text>
  <text x="114" y="236" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">mesh</text>

  <!-- Modifier chip stacked on top -->
  <rect x="196" y="184" width="132" height="30" rx="6" fill="#B47EE8" fill-opacity="0.9"/>
  <text x="262" y="204" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Subdivision</text>
  <rect x="196" y="220" width="132" height="28" rx="6" fill="#B47EE8" fill-opacity="0.18" stroke="#B47EE8" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="262" y="239" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle" opacity="0.8">live · non-destructive</text>

  <!-- Live state benefits -->
  <text x="72" y="284" font-size="13" fill="#4ADE80" font-weight="700">Editable</text>
  <text x="146" y="284" font-size="13" fill="currentColor" opacity="0.7">change settings anytime</text>
  <text x="72" y="308" font-size="13" fill="#4ADE80" font-weight="700">Removable</text>
  <text x="158" y="308" font-size="13" fill="currentColor" opacity="0.7">delete to restore base</text>
  <text x="72" y="332" font-size="13" fill="#4ADE80" font-weight="700">Reorderable</text>
  <text x="166" y="332" font-size="13" fill="currentColor" opacity="0.7">drag in the stack</text>

  <!-- Apply arrow between states -->
  <g stroke="#FF6B00" stroke-width="3" fill="none">
    <line x1="372" y1="254" x2="436" y2="254" stroke-linecap="round"/>
  </g>
  <polygon points="436,246 452,254 436,262" fill="#FF6B00"/>
  <rect x="372" y="216" width="80" height="26" rx="13" fill="#FF6B00"/>
  <text x="412" y="234" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Apply</text>

  <!-- Flow: RIGHT baked state -->
  <text x="468" y="138" font-size="18" font-weight="600" fill="currentColor">After: applied</text>

  <!-- Baked state card -->
  <rect x="468" y="156" width="292" height="196" rx="10" fill="#E63946" fill-opacity="0.07" stroke="#E63946" stroke-opacity="0.55" stroke-width="2"/>

  <!-- Flattened mesh glyph (dense wireframe = baked geometry) -->
  <g transform="translate(508,184)" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.5" fill="currentColor" fill-opacity="0.16">
    <rect x="0" y="0" width="120" height="64" rx="4"/>
    <line x1="30" y1="0" x2="30" y2="64"/>
    <line x1="60" y1="0" x2="60" y2="64"/>
    <line x1="90" y1="0" x2="90" y2="64"/>
    <line x1="0" y1="21" x2="120" y2="21"/>
    <line x1="0" y1="43" x2="120" y2="43"/>
  </g>
  <text x="568" y="270" font-size="13" font-weight="700" fill="currentColor" text-anchor="middle">One flat mesh · baked in</text>

  <!-- Baked state consequences -->
  <text x="508" y="300" font-size="13" fill="#E63946" font-weight="700">No panel</text>
  <text x="588" y="300" font-size="13" fill="currentColor" opacity="0.7">settings are gone</text>
  <text x="508" y="324" font-size="13" fill="#E63946" font-weight="700">No undo</text>
  <text x="576" y="324" font-size="13" fill="currentColor" opacity="0.7">after you save and reopen</text>

  <!-- Warning panel: what you lose -->
  <text x="40" y="392" font-size="18" font-weight="600" fill="currentColor">What you lose when you apply</text>
  <rect x="40" y="408" width="720" height="120" rx="10" fill="#E63946" fill-opacity="0.06"/>
  <rect x="40" y="408" width="4" height="120" fill="#E63946"/>

  <!-- Warning items -->
  <g>
    <circle cx="74" cy="442" r="9" fill="#E63946"/>
    <text x="74" y="447" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">!</text>
    <text x="94" y="447" font-size="13" fill="currentColor">The modifier panel disappears · you cannot tweak the amount, count, or levels again.</text>
  </g>
  <g>
    <circle cx="74" cy="472" r="9" fill="#E63946"/>
    <text x="74" y="477" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">!</text>
    <text x="94" y="477" font-size="13" fill="currentColor">The base shape is replaced · subdividing a cube to a sphere leaves no cube to go back to.</text>
  </g>
  <g>
    <circle cx="74" cy="502" r="9" fill="#E63946"/>
    <text x="74" y="507" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">!</text>
    <text x="94" y="507" font-size="13" fill="currentColor">Vertex count jumps · an applied Subdivision bakes every smoothed face into real geometry.</text>
  </g>

  <!-- Guidance panel: when applying is OK -->
  <text x="40" y="566" font-size="18" font-weight="600" fill="currentColor">When applying is safe</text>
  <rect x="40" y="582" width="720" height="44" rx="10" fill="#4ADE80" fill-opacity="0.08"/>
  <rect x="40" y="582" width="4" height="44" fill="#4ADE80"/>
  <text x="64" y="600" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#4ADE80">Apply only when:</tspan> the look is final, you need to sculpt or edit the result directly, or an</text>
  <text x="64" y="618" font-size="13" fill="currentColor">export target needs baked geometry. Save a copy of the file first so the live stack survives.</text>

  <!-- Footer tip (Variant B, left rail) -->
  <rect x="40" y="641" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Keep modifiers live as long as you can · apply at the very end, never mid-workflow.</text>
</svg>
