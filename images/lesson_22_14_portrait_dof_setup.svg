<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="pd-title pd-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="pd-title">Portrait depth of field setup</title>
  <desc id="pd-desc">Side profile diagram of a portrait camera setup. A camera at left aims along an optical axis at a head and shoulders subject. An orange focal plane line passes through the eyes, a narrow cyan acceptable sharpness band hugs the subject with one third in front and two thirds behind, and the background eight or more units away dissolves into soft bokeh. A specifications card lists 85mm focal length, f slash 2.8 aperture, focus on the eyes, and background separation.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Portrait DoF Setup</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Shallow depth of field to isolate the subject from a soft background</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Optical axis -->
  <line x1="96" y1="300" x2="720" y2="300" stroke="currentColor" stroke-width="1.5" opacity="0.3" stroke-dasharray="2 6" stroke-linecap="round"/>

  <!-- DoF acceptable sharpness band (cyan), narrow, 1/3 front : 2/3 behind around plane x=300 -->
  <rect x="262" y="150" width="114" height="300" fill="#4A9EFF" opacity="0.13"/>
  <text x="319" y="468" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.6">Sharp zone</text>

  <!-- Camera glyph at left -->
  <g>
    <rect x="64" y="282" width="40" height="36" rx="3" fill="currentColor" opacity="0.75"/>
    <polygon points="104,290 124,278 124,322 104,310" fill="currentColor" opacity="0.75"/>
    <text x="84" y="338" font-size="12" text-anchor="middle" fill="currentColor">Camera</text>
  </g>

  <!-- Subject: head and shoulders bust at focus, x~300 -->
  <g>
    <circle cx="300" cy="270" r="26" fill="currentColor" opacity="0.85"/>
    <path d="M 266 326 Q 300 296 334 326 L 334 350 L 266 350 Z" fill="currentColor" opacity="0.85"/>
    <!-- eyes -->
    <circle cx="291" cy="266" r="2.6" fill="#FF6B00"/>
    <circle cx="309" cy="266" r="2.6" fill="#FF6B00"/>
    <text x="300" y="372" font-size="12" text-anchor="middle" fill="currentColor">Subject</text>
  </g>

  <!-- Focal plane line through eyes (orange) -->
  <line x1="300" y1="150" x2="300" y2="438" stroke="#FF6B00" stroke-width="3"/>
  <text x="300" y="142" font-size="13" font-weight="600" text-anchor="middle" fill="#FF6B00">Focal plane (eyes)</text>

  <!-- Background: 8+ units away, blurred with bokeh -->
  <g>
    <circle cx="560" cy="240" r="22" fill="#FF6B00" opacity="0.18"/>
    <circle cx="630" cy="300" r="30" fill="#FF6B00" opacity="0.14"/>
    <circle cx="600" cy="360" r="18" fill="#4A9EFF" opacity="0.16"/>
    <circle cx="675" cy="250" r="16" fill="#4A9EFF" opacity="0.14"/>
    <circle cx="660" cy="345" r="24" fill="#FF6B00" opacity="0.12"/>
    <text x="616" y="412" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.6">Background blur (bokeh)</text>
  </g>

  <!-- Dimension: camera to subject -->
  <g stroke="#4A9EFF" stroke-width="1.5" fill="none">
    <line x1="84" y1="408" x2="300" y2="408"/>
    <line x1="84" y1="402" x2="84" y2="414"/>
    <line x1="300" y1="402" x2="300" y2="414"/>
  </g>
  <text x="192" y="426" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.8">Subject ( 3 units )</text>

  <!-- Dimension: subject to background -->
  <g stroke="#4A9EFF" stroke-width="1.5" fill="none">
    <line x1="300" y1="440" x2="616" y2="440"/>
    <line x1="300" y1="434" x2="300" y2="446"/>
    <line x1="616" y1="434" x2="616" y2="446"/>
  </g>
  <text x="458" y="458" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.8">Background 8+ units behind</text>

  <!-- Specs card (muted-orange badge style) -->
  <g>
    <rect x="40" y="150" width="170" height="118" rx="6" fill="#FF6B00" fill-opacity="0.06" stroke="#FF6B00" stroke-opacity="0.4"/>
    <text x="56" y="174" font-size="13" font-weight="700" fill="#FF6B00">Settings</text>
    <text x="56" y="198" font-size="13" fill="currentColor">85mm focal length</text>
    <text x="56" y="220" font-size="13" fill="currentColor">f / 2.8 aperture</text>
    <text x="56" y="242" font-size="13" fill="currentColor">Focus: the eyes</text>
    <text x="56" y="260" font-size="12" fill="currentColor" opacity="0.65">Wide aperture, soft BG</text>
  </g>

  <!-- Footer tip (Variant B, left rail) -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Focus on the near eye and give the background room so it melts away.
  </text>
</svg>
