<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" role="img" aria-labelledby="me-title me-desc" color="#222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="me-title">Blender Calculates Math For You</title>
  <desc id="me-desc">Reference infographic showing five transform commands typed as math expressions and their calculated results: G X 360 divided by 8 gives 45 units, S 10 divided by 4 gives 2.5 times scale, G Z 3 plus 2 gives 5 units, R Z 360 divided by 12 gives 30 degrees, and S 2 times 3 gives 6 times scale. Expressions are shown in blue, results in green.</desc>

  <!-- card background -->
  <rect x="0" y="0" width="800" height="680" rx="18" fill="#0f1a14"/>
  <!-- top orange accent strip -->
  <rect x="0" y="0" width="800" height="10" rx="5" fill="#FF6B00"/>

  <!-- header -->
  <g>
    <!-- calculator glyph -->
    <g transform="translate(56,46)">
      <rect x="0" y="0" width="48" height="60" rx="7" fill="#101c16" stroke="#4A9EFF" stroke-width="2.5"/>
      <rect x="8" y="8" width="32" height="13" rx="2.5" fill="#4ADE80" opacity="0.85"/>
      <g fill="#9fb0aa">
        <rect x="8" y="28" width="9" height="9" rx="2"/>
        <rect x="20" y="28" width="9" height="9" rx="2"/>
        <rect x="32" y="28" width="9" height="9" rx="2" fill="#FF6B00"/>
        <rect x="8" y="41" width="9" height="9" rx="2"/>
        <rect x="20" y="41" width="9" height="9" rx="2"/>
        <rect x="32" y="41" width="9" height="9" rx="2" fill="#FF6B00"/>
      </g>
    </g>
    <text x="124" y="68" font-size="34" font-weight="700" fill="#f5f7f6">Blender Calculates Math For You</text>
    <text x="124" y="98" font-size="18" fill="#9fb0aa">Type an expression in any transform field &#8212; Blender evaluates it.</text>
  </g>

  <!-- legend -->
  <g font-size="16" font-weight="600">
    <rect x="56" y="120" width="16" height="16" rx="3" fill="#4A9EFF"/>
    <text x="80" y="133" fill="#cdd8d3">Expression typed</text>
    <rect x="240" y="120" width="16" height="16" rx="3" fill="#4ADE80"/>
    <text x="264" y="133" fill="#cdd8d3">Calculated result</text>
  </g>

  <!-- expression rows -->
  <!-- defs: arrow marker -->
  <defs>
    <marker id="me-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 Z" fill="#FF6B00"/>
    </marker>
  </defs>

  <!-- row template: expression chip (blue) -> arrow -> result chip (green) + note -->
  <!-- Row 1: G X 360/8 -> 45 -->
  <g transform="translate(0,162)">
    <rect x="40" y="0" width="720" height="86" rx="11" fill="#16241d" stroke="#23362c" stroke-width="1.5"/>
    <rect x="60" y="16" width="246" height="54" rx="9" fill="#101c16" stroke="#4A9EFF" stroke-width="2"/>
    <text x="183" y="50" font-size="26" font-weight="700" fill="#7cc0ff" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace">G X 360/8</text>
    <line x1="318" y1="43" x2="372" y2="43" stroke="#FF6B00" stroke-width="3" marker-end="url(#me-arrow)"/>
    <rect x="386" y="16" width="200" height="54" rx="9" fill="#101c16" stroke="#4ADE80" stroke-width="2"/>
    <text x="486" y="50" font-size="26" font-weight="700" fill="#7ef0a8" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace">= 45</text>
    <text x="610" y="38" font-size="15" font-weight="600" fill="#cdd8d3">Move 45 units</text>
    <text x="610" y="58" font-size="13" fill="#9fb0aa">on the X axis</text>
  </g>

  <!-- Row 2: S 10/4 -> 2.5x -->
  <g transform="translate(0,258)">
    <rect x="40" y="0" width="720" height="86" rx="11" fill="#16241d" stroke="#23362c" stroke-width="1.5"/>
    <rect x="60" y="16" width="246" height="54" rx="9" fill="#101c16" stroke="#4A9EFF" stroke-width="2"/>
    <text x="183" y="50" font-size="26" font-weight="700" fill="#7cc0ff" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace">S 10/4</text>
    <line x1="318" y1="43" x2="372" y2="43" stroke="#FF6B00" stroke-width="3" marker-end="url(#me-arrow)"/>
    <rect x="386" y="16" width="200" height="54" rx="9" fill="#101c16" stroke="#4ADE80" stroke-width="2"/>
    <text x="486" y="50" font-size="26" font-weight="700" fill="#7ef0a8" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace">= 2.5&#215;</text>
    <text x="610" y="38" font-size="15" font-weight="600" fill="#cdd8d3">Scale to 2.5&#215;</text>
    <text x="610" y="58" font-size="13" fill="#9fb0aa">the original size</text>
  </g>

  <!-- Row 3: G Z 3+2 -> 5 -->
  <g transform="translate(0,354)">
    <rect x="40" y="0" width="720" height="86" rx="11" fill="#16241d" stroke="#23362c" stroke-width="1.5"/>
    <rect x="60" y="16" width="246" height="54" rx="9" fill="#101c16" stroke="#4A9EFF" stroke-width="2"/>
    <text x="183" y="50" font-size="26" font-weight="700" fill="#7cc0ff" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace">G Z 3+2</text>
    <line x1="318" y1="43" x2="372" y2="43" stroke="#FF6B00" stroke-width="3" marker-end="url(#me-arrow)"/>
    <rect x="386" y="16" width="200" height="54" rx="9" fill="#101c16" stroke="#4ADE80" stroke-width="2"/>
    <text x="486" y="50" font-size="26" font-weight="700" fill="#7ef0a8" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace">= 5</text>
    <text x="610" y="38" font-size="15" font-weight="600" fill="#cdd8d3">Move 5 units</text>
    <text x="610" y="58" font-size="13" fill="#9fb0aa">up the Z axis</text>
  </g>

  <!-- Row 4: R Z 360/12 -> 30 deg -->
  <g transform="translate(0,450)">
    <rect x="40" y="0" width="720" height="86" rx="11" fill="#16241d" stroke="#23362c" stroke-width="1.5"/>
    <rect x="60" y="16" width="246" height="54" rx="9" fill="#101c16" stroke="#4A9EFF" stroke-width="2"/>
    <text x="183" y="50" font-size="26" font-weight="700" fill="#7cc0ff" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace">R Z 360/12</text>
    <line x1="318" y1="43" x2="372" y2="43" stroke="#FF6B00" stroke-width="3" marker-end="url(#me-arrow)"/>
    <rect x="386" y="16" width="200" height="54" rx="9" fill="#101c16" stroke="#4ADE80" stroke-width="2"/>
    <text x="486" y="50" font-size="26" font-weight="700" fill="#7ef0a8" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace">= 30&#176;</text>
    <text x="610" y="38" font-size="15" font-weight="600" fill="#cdd8d3">Rotate 30&#176;</text>
    <text x="610" y="58" font-size="13" fill="#9fb0aa">for a 12-part circle</text>
  </g>

  <!-- Row 5: S 2*3 -> 6x -->
  <g transform="translate(0,546)">
    <rect x="40" y="0" width="720" height="86" rx="11" fill="#16241d" stroke="#23362c" stroke-width="1.5"/>
    <rect x="60" y="16" width="246" height="54" rx="9" fill="#101c16" stroke="#4A9EFF" stroke-width="2"/>
    <text x="183" y="50" font-size="26" font-weight="700" fill="#7cc0ff" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace">S 2*3</text>
    <line x1="318" y1="43" x2="372" y2="43" stroke="#FF6B00" stroke-width="3" marker-end="url(#me-arrow)"/>
    <rect x="386" y="16" width="200" height="54" rx="9" fill="#101c16" stroke="#4ADE80" stroke-width="2"/>
    <text x="486" y="50" font-size="26" font-weight="700" fill="#7ef0a8" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace">= 6&#215;</text>
    <text x="610" y="38" font-size="15" font-weight="600" fill="#cdd8d3">Scale to 6&#215;</text>
    <text x="610" y="58" font-size="13" fill="#9fb0aa">the original size</text>
  </g>

  <!-- footer tip rail -->
  <g transform="translate(0,646)">
    <rect x="40" y="0" width="720" height="26" rx="7" fill="#1a2a12"/>
    <rect x="40" y="0" width="6" height="26" rx="3" fill="#F5C242"/>
    <text x="60" y="18" font-size="14" font-weight="600" fill="#e7d6a2">Tip: works with + &#8722; * / and parentheses &#8212; no calculator needed.</text>
  </g>
</svg>
