<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="gd-title gd-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="gd-title">UV space: the 0 to 1 unit square</title>
  <desc id="gd-desc">A single square grid representing UV space, running from 0 to 1 in both directions with grid lines every 0.1 units. The four corners are labeled (0,0) at bottom-left, (1,0) at bottom-right, (0,1) at top-left and (1,1) at top-right. The U axis runs along the bottom and the V axis up the left side, both in orange. The center point is marked with an orange dot labeled (0.5, 0.5).</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">UV SPACE &#183; THE 0 TO 1 SQUARE</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Every UV coordinate lives inside this unit square</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Plotted square: x 290..710 (420 px), y 138..458 not square; use 320 px square centered -->
  <!-- Square region: x 320..690 (370), y 140..450 (310) -> use 300 px square at x 350..650, y 150..450 -->
  <!-- Fine grid lines every 0.1 (30 px) -->
  <g stroke="currentColor" stroke-width="1" opacity="0.15">
    <!-- vertical -->
    <line x1="380" y1="150" x2="380" y2="450"/>
    <line x1="410" y1="150" x2="410" y2="450"/>
    <line x1="440" y1="150" x2="440" y2="450"/>
    <line x1="470" y1="150" x2="470" y2="450"/>
    <line x1="500" y1="150" x2="500" y2="450"/>
    <line x1="530" y1="150" x2="530" y2="450"/>
    <line x1="560" y1="150" x2="560" y2="450"/>
    <line x1="590" y1="150" x2="590" y2="450"/>
    <line x1="620" y1="150" x2="620" y2="450"/>
    <!-- horizontal -->
    <line x1="350" y1="180" x2="650" y2="180"/>
    <line x1="350" y1="210" x2="650" y2="210"/>
    <line x1="350" y1="240" x2="650" y2="240"/>
    <line x1="350" y1="270" x2="650" y2="270"/>
    <line x1="350" y1="300" x2="650" y2="300"/>
    <line x1="350" y1="330" x2="650" y2="330"/>
    <line x1="350" y1="360" x2="650" y2="360"/>
    <line x1="350" y1="390" x2="650" y2="390"/>
    <line x1="350" y1="420" x2="650" y2="420"/>
  </g>

  <!-- Square outline -->
  <rect x="350" y="150" width="300" height="300"
        fill="#FF6B00" fill-opacity="0.05" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- U axis (bottom) -->
  <line x1="350" y1="450" x2="672" y2="450" stroke="#FF6B00" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="672,450 660,444 660,456" fill="#FF6B00"/>
  <text x="666" y="472" font-size="15" font-weight="600" fill="#FF6B00">U</text>
  <!-- V axis (left) -->
  <line x1="350" y1="450" x2="350" y2="128" stroke="#FF6B00" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="350,128 344,140 356,140" fill="#FF6B00"/>
  <text x="334" y="134" font-size="15" font-weight="600" fill="#FF6B00">V</text>

  <!-- Corner labels (full opacity) -->
  <text x="344" y="470" font-size="14" text-anchor="end" fill="currentColor">(0,0)</text>
  <text x="656" y="470" font-size="14" text-anchor="start" fill="currentColor">(1,0)</text>
  <text x="344" y="146" font-size="14" text-anchor="end" fill="currentColor">(0,1)</text>
  <text x="656" y="146" font-size="14" text-anchor="start" fill="currentColor">(1,1)</text>

  <!-- Center point -->
  <circle cx="500" cy="300" r="6" fill="#FF6B00"/>
  <text x="512" y="296" font-size="14" font-weight="600" fill="currentColor">(0.5, 0.5)</text>

  <!-- Footer tip (Variant B left rail) -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> In Blender's UV editor, (0,0) is the bottom-left corner and (1,1) is the top-right.
  </text>
</svg>
