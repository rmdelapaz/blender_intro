<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="lp-title lp-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="lp-title">12-Module Learning Path Progression</title>
  <desc id="lp-desc">Your Blender learning journey across 12 modules, divided into a Foundation phase (modules 1 through 6) and an Advanced phase (modules 7 through 12). Foundation modules cover Getting Started, 3D Modeling, Materials, Lighting, Camera, and Animation. Advanced modules cover Advanced Modeling, Simulations, Characters, Nodes, Workflows, and Portfolio. The journey starts with a green flag and ends with a gold star.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Your 12-Module Learning Journey</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">From first launch to portfolio-ready artist.</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ==== FOUNDATION PHASE ==== -->
  <text x="40" y="144" font-size="12" font-weight="700" fill="currentColor" opacity="0.7" letter-spacing="1.5">FOUNDATION</text>
  <text x="140" y="144" font-size="12" fill="currentColor" opacity="0.55">&#183; Modules 1&#8211;6 &#183; Build your core skills</text>

  <!-- Row 1 connectors -->
  <g stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.3">
    <line x1="52" y1="220" x2="68" y2="220"/>
    <line x1="112" y1="220" x2="188" y2="220"/>
    <line x1="232" y1="220" x2="308" y2="220"/>
    <line x1="352" y1="220" x2="428" y2="220"/>
    <line x1="472" y1="220" x2="548" y2="220"/>
    <line x1="592" y1="220" x2="668" y2="220"/>
  </g>

  <!-- Start flag -->
  <g transform="translate(28, 210)">
    <line x1="2" y1="-10" x2="2" y2="30" stroke="currentColor" stroke-width="2" opacity="0.55"/>
    <path d="M 4 -8 L 22 10 L 4 18 Z" fill="#4ADE80"/>
  </g>

  <!-- Foundation circles (M1-M6, blue) -->
  <g>
    <circle cx="90" cy="220" r="22" fill="#4A9EFF"/>
    <text x="90" y="226" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="90" y="270" font-size="11" fill="currentColor" text-anchor="middle">Getting Started</text>
  </g>
  <g>
    <circle cx="210" cy="220" r="22" fill="#4A9EFF"/>
    <text x="210" y="226" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="210" y="270" font-size="11" fill="currentColor" text-anchor="middle">3D Modeling</text>
  </g>
  <g>
    <circle cx="330" cy="220" r="22" fill="#4A9EFF"/>
    <text x="330" y="226" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="330" y="270" font-size="11" fill="currentColor" text-anchor="middle">Materials</text>
  </g>
  <g>
    <circle cx="450" cy="220" r="22" fill="#4A9EFF"/>
    <text x="450" y="226" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">4</text>
    <text x="450" y="270" font-size="11" fill="currentColor" text-anchor="middle">Lighting</text>
  </g>
  <g>
    <circle cx="570" cy="220" r="22" fill="#4A9EFF"/>
    <text x="570" y="226" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">5</text>
    <text x="570" y="270" font-size="11" fill="currentColor" text-anchor="middle">Camera</text>
  </g>
  <g>
    <circle cx="690" cy="220" r="22" fill="#4A9EFF"/>
    <text x="690" y="226" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">6</text>
    <text x="690" y="270" font-size="11" fill="currentColor" text-anchor="middle">Animation</text>
  </g>

  <!-- ==== ADVANCED PHASE ==== -->
  <text x="40" y="320" font-size="12" font-weight="700" fill="currentColor" opacity="0.7" letter-spacing="1.5">ADVANCED</text>
  <text x="125" y="320" font-size="12" fill="currentColor" opacity="0.55">&#183; Modules 7&#8211;12 &#183; Specialize and refine</text>

  <!-- Row 2 connectors -->
  <g stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.3">
    <line x1="112" y1="386" x2="188" y2="386"/>
    <line x1="232" y1="386" x2="308" y2="386"/>
    <line x1="352" y1="386" x2="428" y2="386"/>
    <line x1="472" y1="386" x2="548" y2="386"/>
    <line x1="592" y1="386" x2="668" y2="386"/>
    <line x1="712" y1="386" x2="731" y2="386"/>
  </g>

  <!-- Advanced circles (M7-M12, purple) -->
  <g>
    <circle cx="90" cy="386" r="22" fill="#B47EE8"/>
    <text x="90" y="392" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">7</text>
    <text x="90" y="436" font-size="11" fill="currentColor" text-anchor="middle">Adv. Modeling</text>
  </g>
  <g>
    <circle cx="210" cy="386" r="22" fill="#B47EE8"/>
    <text x="210" y="392" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">8</text>
    <text x="210" y="436" font-size="11" fill="currentColor" text-anchor="middle">Simulations</text>
  </g>
  <g>
    <circle cx="330" cy="386" r="22" fill="#B47EE8"/>
    <text x="330" y="392" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">9</text>
    <text x="330" y="436" font-size="11" fill="currentColor" text-anchor="middle">Characters</text>
  </g>
  <g>
    <circle cx="450" cy="386" r="22" fill="#B47EE8"/>
    <text x="450" y="392" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">10</text>
    <text x="450" y="436" font-size="11" fill="currentColor" text-anchor="middle">Nodes</text>
  </g>
  <g>
    <circle cx="570" cy="386" r="22" fill="#B47EE8"/>
    <text x="570" y="392" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">11</text>
    <text x="570" y="436" font-size="11" fill="currentColor" text-anchor="middle">Workflows</text>
  </g>
  <g>
    <circle cx="690" cy="386" r="22" fill="#B47EE8"/>
    <text x="690" y="392" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">12</text>
    <text x="690" y="436" font-size="11" fill="currentColor" text-anchor="middle">Portfolio</text>
  </g>

  <!-- End star -->
  <path transform="translate(748, 386) scale(0.75)"
        d="M 0 -20 L 4.7 -6.47 L 19.02 -6.18 L 7.6 2.47 L 11.76 16.18 L 0 8 L -11.76 16.18 L -7.6 2.47 L -19.02 -6.18 L -4.7 -6.47 Z"
        fill="#F5C242"/>

  <!-- Footer tip -->
  <rect x="40" y="506" width="720" height="34" rx="6" fill="#FF6B00" fill-opacity="0.10" stroke="#FF6B00" stroke-opacity="0.4"/>
  <text x="54" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Follow the order &#8212; every module unlocks tools the next one assumes.
  </text>
</svg>
