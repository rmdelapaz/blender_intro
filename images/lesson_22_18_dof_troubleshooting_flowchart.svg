<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="tf-title tf-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="tf-title">Depth of field troubleshooting flowchart</title>
  <desc id="tf-desc">A decision tree for fixing depth of field that is not working. Starting from the problem, four checks run in sequence down the left spine: is depth of field enabled, is the focus distance correct, is the aperture wide enough, and are there enough render samples. Answering yes continues to the next check; answering no branches right to a green solution node. Passing all four checks reaches a final node saying depth of field should now render correctly.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">DoF TROUBLESHOOTING FLOWCHART</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Work down the checks &#183; each No points to the fix</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Legend -->
  <g font-size="12">
    <rect x="430" y="124" width="14" height="14" rx="3" fill="#E63946"/>
    <text x="450" y="135" fill="currentColor" opacity="0.7">Problem</text>
    <rect x="520" y="124" width="14" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/>
    <text x="540" y="135" fill="currentColor" opacity="0.7">Check</text>
    <rect x="600" y="124" width="14" height="14" rx="3" fill="#4ADE80"/>
    <text x="620" y="135" fill="currentColor" opacity="0.7">Solution</text>
  </g>

  <!-- Connectors group (currentColor) -->
  <g stroke="currentColor" stroke-width="1.6" opacity="0.45" fill="none" stroke-linecap="round">
    <!-- spine: problem to Q1 -->
    <line x1="220" y1="188" x2="220" y2="214"/>
    <!-- Q1 to Q2 -->
    <line x1="220" y1="272" x2="220" y2="306"/>
    <!-- Q2 to Q3 -->
    <line x1="220" y1="364" x2="220" y2="398"/>
    <!-- Q3 to Q4 -->
    <line x1="220" y1="456" x2="220" y2="490"/>
    <!-- Q4 to final -->
    <line x1="220" y1="548" x2="220" y2="582"/>
    <!-- No branches to the right -->
    <line x1="340" y1="243" x2="470" y2="243"/>
    <line x1="340" y1="335" x2="470" y2="335"/>
    <line x1="340" y1="427" x2="470" y2="427"/>
    <line x1="340" y1="519" x2="470" y2="519"/>
  </g>
  <!-- Spine arrowheads (Yes direction) -->
  <g fill="currentColor" opacity="0.45">
    <polygon points="220,214 213,202 227,202"/>
    <polygon points="220,306 213,294 227,294"/>
    <polygon points="220,398 213,386 227,386"/>
    <polygon points="220,490 213,478 227,478"/>
    <polygon points="220,582 213,570 227,570"/>
  </g>
  <!-- No-branch arrowheads (point into solution nodes) -->
  <g fill="currentColor" opacity="0.45">
    <polygon points="470,243 458,236 458,250"/>
    <polygon points="470,335 458,328 458,342"/>
    <polygon points="470,427 458,420 458,434"/>
    <polygon points="470,519 458,512 458,526"/>
  </g>

  <!-- Yes / No edge labels -->
  <g font-size="12" font-weight="600" fill="currentColor" opacity="0.7">
    <text x="232" y="290">Yes</text>
    <text x="232" y="382">Yes</text>
    <text x="232" y="474">Yes</text>
    <text x="232" y="566">Yes</text>
    <text x="400" y="236" text-anchor="middle">No</text>
    <text x="400" y="328" text-anchor="middle">No</text>
    <text x="400" y="420" text-anchor="middle">No</text>
    <text x="400" y="512" text-anchor="middle">No</text>
  </g>

  <!-- Problem entry node (red) -->
  <rect x="120" y="152" width="200" height="36" rx="18" fill="#E63946"/>
  <text x="220" y="175" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">DoF not working?</text>

  <!-- Q1 -->
  <rect x="120" y="216" width="200" height="56" rx="8" fill="none" stroke="currentColor" stroke-width="1.8"/>
  <text x="220" y="240" font-size="14" font-weight="600" fill="currentColor" text-anchor="middle">DoF enabled?</text>
  <text x="220" y="259" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.6">Camera &#183; Depth of Field</text>
  <!-- S1 -->
  <rect x="470" y="220" width="250" height="46" rx="8" fill="#4ADE80"/>
  <text x="595" y="248" font-size="14" font-weight="700" fill="#0f1a14" text-anchor="middle">Enable F-Stop or Focus Object</text>

  <!-- Q2 -->
  <rect x="120" y="308" width="200" height="56" rx="8" fill="none" stroke="currentColor" stroke-width="1.8"/>
  <text x="220" y="332" font-size="14" font-weight="600" fill="currentColor" text-anchor="middle">Focus distance correct?</text>
  <text x="220" y="351" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.6">does the plane hit the subject</text>
  <!-- S2 -->
  <rect x="470" y="312" width="250" height="46" rx="8" fill="#4ADE80"/>
  <text x="595" y="340" font-size="14" font-weight="700" fill="#0f1a14" text-anchor="middle">Use Limits display to check</text>

  <!-- Q3 -->
  <rect x="120" y="400" width="200" height="56" rx="8" fill="none" stroke="currentColor" stroke-width="1.8"/>
  <text x="220" y="424" font-size="14" font-weight="600" fill="currentColor" text-anchor="middle">Aperture wide enough?</text>
  <text x="220" y="443" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.6">lower f-number = more blur</text>
  <!-- S3 -->
  <rect x="470" y="404" width="250" height="46" rx="8" fill="#4ADE80"/>
  <text x="595" y="432" font-size="14" font-weight="700" fill="#0f1a14" text-anchor="middle">Try f/2.8 or wider</text>

  <!-- Q4 -->
  <rect x="120" y="492" width="200" height="56" rx="8" fill="none" stroke="currentColor" stroke-width="1.8"/>
  <text x="220" y="516" font-size="14" font-weight="600" fill="currentColor" text-anchor="middle">Enough render samples?</text>
  <text x="220" y="535" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.6">blur zone looks noisy</text>
  <!-- S4 -->
  <rect x="470" y="496" width="250" height="46" rx="8" fill="#4ADE80"/>
  <text x="595" y="524" font-size="14" font-weight="700" fill="#0f1a14" text-anchor="middle">Increase to 256+ samples</text>

  <!-- Final node (green) -->
  <rect x="110" y="584" width="220" height="40" rx="20" fill="#4ADE80"/>
  <text x="220" y="609" font-size="14" font-weight="700" fill="#0f1a14" text-anchor="middle">DoF renders correctly</text>

  <!-- Footer tip (Variant B, left rail; dense-variant y positions) -->
  <rect x="40" y="641" width="720" height="34" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Most DoF that looks broken is just disabled, mis-focused, or too noisy. Check those first.
  </text>
</svg>
