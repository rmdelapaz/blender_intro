<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="ks-title ks-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="ks-title">Keyboard Shortcuts: Object Manipulation</title>
  <desc id="ks-desc">A reference card of essential object-manipulation shortcuts for Blender 5.1, organized into four categories: selection, transformations, duplication and cursor, and advanced controls.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Header -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Keyboard Shortcuts: Object Manipulation</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Essential manipulation shortcuts for Blender 5.1</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ============================ -->
  <!--        LEFT COLUMN           -->
  <!-- ============================ -->

  <!-- Category 1: SELECTION -->
  <text x="40" y="148" font-size="13" font-weight="700" fill="#FF6B00" letter-spacing="1.5">SELECTION</text>

  <!-- Row 1: A | Select all -->
  <rect x="40" y="162" width="24" height="22" rx="4" fill="#FF6B00"/>
  <text x="52" y="178" font-size="12" font-weight="700" fill="white" text-anchor="middle">A</text>
  <text x="200" y="178" font-size="13" fill="currentColor">Select all</text>

  <!-- Row 2: Alt + A | Deselect all -->
  <rect x="40" y="192" width="30" height="22" rx="4" fill="#FF6B00"/>
  <text x="55" y="208" font-size="12" font-weight="700" fill="white" text-anchor="middle">Alt</text>
  <text x="78" y="208" font-size="13" fill="currentColor" opacity="0.5" text-anchor="middle">+</text>
  <rect x="86" y="192" width="24" height="22" rx="4" fill="#FF6B00"/>
  <text x="98" y="208" font-size="12" font-weight="700" fill="white" text-anchor="middle">A</text>
  <text x="200" y="208" font-size="13" fill="currentColor">Deselect all</text>

  <!-- Row 3: B | Box select -->
  <rect x="40" y="222" width="24" height="22" rx="4" fill="#FF6B00"/>
  <text x="52" y="238" font-size="12" font-weight="700" fill="white" text-anchor="middle">B</text>
  <text x="200" y="238" font-size="13" fill="currentColor">Box select, drag a rectangle</text>

  <!-- Row 4: C | Circle select -->
  <rect x="40" y="252" width="24" height="22" rx="4" fill="#FF6B00"/>
  <text x="52" y="268" font-size="12" font-weight="700" fill="white" text-anchor="middle">C</text>
  <text x="200" y="268" font-size="13" fill="currentColor">Circle select with the brush</text>

  <!-- Row 5: Ctrl + drag | Lasso select -->
  <rect x="40" y="282" width="30" height="22" rx="4" fill="#FF6B00"/>
  <text x="55" y="298" font-size="12" font-weight="700" fill="white" text-anchor="middle">Ctrl</text>
  <text x="78" y="298" font-size="13" fill="currentColor" opacity="0.5" text-anchor="middle">+</text>
  <rect x="86" y="282" width="42" height="22" rx="4" fill="#FF6B00"/>
  <text x="107" y="298" font-size="12" font-weight="700" fill="white" text-anchor="middle">drag</text>
  <text x="200" y="298" font-size="13" fill="currentColor">Lasso select, freeform path</text>

  <!-- Row 6: Click | Select an object -->
  <rect x="40" y="312" width="42" height="22" rx="4" fill="#FF6B00"/>
  <text x="61" y="328" font-size="12" font-weight="700" fill="white" text-anchor="middle">Click</text>
  <text x="200" y="328" font-size="13" fill="currentColor">Select an object</text>

  <!-- Row 7: Shift + Click | Add or remove from selection -->
  <rect x="40" y="342" width="42" height="22" rx="4" fill="#FF6B00"/>
  <text x="61" y="358" font-size="12" font-weight="700" fill="white" text-anchor="middle">Shift</text>
  <text x="90" y="358" font-size="13" fill="currentColor" opacity="0.5" text-anchor="middle">+</text>
  <rect x="98" y="342" width="42" height="22" rx="4" fill="#FF6B00"/>
  <text x="119" y="358" font-size="12" font-weight="700" fill="white" text-anchor="middle">Click</text>
  <text x="200" y="358" font-size="13" fill="currentColor">Add or remove from selection</text>

  <!-- Category 2: TRANSFORMATIONS -->
  <text x="40" y="392" font-size="13" font-weight="700" fill="#FF6B00" letter-spacing="1.5">TRANSFORMATIONS</text>

  <!-- Row 1: G / R / S | Move, rotate, or scale -->
  <rect x="40" y="406" width="64" height="22" rx="4" fill="#FF6B00"/>
  <text x="72" y="422" font-size="12" font-weight="700" fill="white" text-anchor="middle">G / R / S</text>
  <text x="200" y="422" font-size="13" fill="currentColor">Move (Grab), Rotate, or Scale</text>

  <!-- Row 2: + X / Y / Z | Constrain to a global axis -->
  <rect x="40" y="436" width="72" height="22" rx="4" fill="#FF6B00"/>
  <text x="76" y="452" font-size="12" font-weight="700" fill="white" text-anchor="middle">+ X / Y / Z</text>
  <text x="200" y="452" font-size="13" fill="currentColor">Constrain to a global axis (e.g. G X)</text>

  <!-- Row 3: + number | Type an exact value -->
  <rect x="40" y="466" width="64" height="22" rx="4" fill="#FF6B00"/>
  <text x="72" y="482" font-size="12" font-weight="700" fill="white" text-anchor="middle">+ number</text>
  <text x="200" y="482" font-size="13" fill="currentColor">Type an exact value (e.g. R Z 45)</text>

  <!-- ============================ -->
  <!--        RIGHT COLUMN          -->
  <!-- ============================ -->

  <!-- Category 3: DUPLICATION &amp; CURSOR -->
  <text x="420" y="148" font-size="13" font-weight="700" fill="#FF6B00" letter-spacing="1.5">DUPLICATION &amp; CURSOR</text>

  <!-- Row 1: Shift + D | Independent duplicate -->
  <rect x="420" y="162" width="42" height="22" rx="4" fill="#FF6B00"/>
  <text x="441" y="178" font-size="12" font-weight="700" fill="white" text-anchor="middle">Shift</text>
  <text x="470" y="178" font-size="13" fill="currentColor" opacity="0.5" text-anchor="middle">+</text>
  <rect x="478" y="162" width="24" height="22" rx="4" fill="#FF6B00"/>
  <text x="490" y="178" font-size="12" font-weight="700" fill="white" text-anchor="middle">D</text>
  <text x="580" y="178" font-size="13" fill="currentColor">Independent duplicate</text>

  <!-- Row 2: Alt + D | Linked duplicate, shared mesh -->
  <rect x="420" y="192" width="30" height="22" rx="4" fill="#FF6B00"/>
  <text x="435" y="208" font-size="12" font-weight="700" fill="white" text-anchor="middle">Alt</text>
  <text x="458" y="208" font-size="13" fill="currentColor" opacity="0.5" text-anchor="middle">+</text>
  <rect x="466" y="192" width="24" height="22" rx="4" fill="#FF6B00"/>
  <text x="478" y="208" font-size="12" font-weight="700" fill="white" text-anchor="middle">D</text>
  <text x="580" y="208" font-size="13" fill="currentColor">Linked duplicate, shared mesh</text>

  <!-- Row 3: Shift + S | Snap menu pie -->
  <rect x="420" y="222" width="42" height="22" rx="4" fill="#FF6B00"/>
  <text x="441" y="238" font-size="12" font-weight="700" fill="white" text-anchor="middle">Shift</text>
  <text x="470" y="238" font-size="13" fill="currentColor" opacity="0.5" text-anchor="middle">+</text>
  <rect x="478" y="222" width="24" height="22" rx="4" fill="#FF6B00"/>
  <text x="490" y="238" font-size="12" font-weight="700" fill="white" text-anchor="middle">S</text>
  <text x="580" y="238" font-size="13" fill="currentColor">Snap menu, cursor or selection</text>

  <!-- Row 4: Shift + Right Click | Place the 3D cursor -->
  <rect x="420" y="252" width="42" height="22" rx="4" fill="#FF6B00"/>
  <text x="441" y="268" font-size="12" font-weight="700" fill="white" text-anchor="middle">Shift</text>
  <text x="470" y="268" font-size="13" fill="currentColor" opacity="0.5" text-anchor="middle">+</text>
  <rect x="478" y="252" width="84" height="22" rx="4" fill="#FF6B00"/>
  <text x="520" y="268" font-size="12" font-weight="700" fill="white" text-anchor="middle">Right Click</text>
  <text x="580" y="268" font-size="13" fill="currentColor">Place the 3D cursor</text>

  <!-- Category 4: ADVANCED -->
  <text x="420" y="322" font-size="13" font-weight="700" fill="#FF6B00" letter-spacing="1.5">ADVANCED</text>

  <!-- Row 1: Ctrl + A | Apply transforms to data -->
  <rect x="420" y="336" width="30" height="22" rx="4" fill="#FF6B00"/>
  <text x="435" y="352" font-size="12" font-weight="700" fill="white" text-anchor="middle">Ctrl</text>
  <text x="458" y="352" font-size="13" fill="currentColor" opacity="0.5" text-anchor="middle">+</text>
  <rect x="466" y="336" width="24" height="22" rx="4" fill="#FF6B00"/>
  <text x="478" y="352" font-size="12" font-weight="700" fill="white" text-anchor="middle">A</text>
  <text x="580" y="352" font-size="13" fill="currentColor">Apply transforms to data</text>

  <!-- Row 2: Alt + G / R / S | Reset move, rotate, scale -->
  <rect x="420" y="366" width="30" height="22" rx="4" fill="#FF6B00"/>
  <text x="435" y="382" font-size="12" font-weight="700" fill="white" text-anchor="middle">Alt</text>
  <text x="458" y="382" font-size="13" fill="currentColor" opacity="0.5" text-anchor="middle">+</text>
  <rect x="466" y="366" width="64" height="22" rx="4" fill="#FF6B00"/>
  <text x="498" y="382" font-size="12" font-weight="700" fill="white" text-anchor="middle">G / R / S</text>
  <text x="580" y="382" font-size="13" fill="currentColor">Reset move, rotate, scale</text>

  <!-- Row 3: N | Toggle the sidebar (N-panel) -->
  <rect x="420" y="396" width="24" height="22" rx="4" fill="#FF6B00"/>
  <text x="432" y="412" font-size="12" font-weight="700" fill="white" text-anchor="middle">N</text>
  <text x="580" y="412" font-size="13" fill="currentColor">Toggle the sidebar (N-panel)</text>

  <!-- Footer tip callout -->
  <rect x="40" y="506" width="720" height="34" rx="6"
        fill="#FF6B00" fill-opacity="0.10"
        stroke="#FF6B00" stroke-opacity="0.4"/>
  <text x="54" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Press the axis key twice for local axes. G X moves along world X, G X X moves along the object's own X.
  </text>

</svg>
