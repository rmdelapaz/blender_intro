<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600" role="img" aria-labelledby="cvi-title cvi-desc" color="#222" font-family="'Segoe UI',system-ui,-apple-system,sans-serif">
<title id="cvi-title">Collection visibility and control icons</title>
<desc id="cvi-desc">An Outliner collection row with its cluster of control toggles called out one by one: exclude checkbox, hide-in-viewport eye, disable-in-viewport monitor, disable-in-render camera, holdout, and indirect-only; each icon is labelled with what it does and whether it affects the final render.</desc>
<text x="410" y="34" fill="currentColor" font-size="22" font-weight="700" text-anchor="middle">Reading a collection&#8217;s control icons</text>
<text x="410" y="58" fill="currentColor" font-size="14" text-anchor="middle" opacity="0.75">Each toggle in the Outliner row governs a different kind of visibility</text>

<!-- Outliner row mock -->
<rect x="60" y="82" width="700" height="46" rx="7" fill="#2a2a2a" stroke="#FF6B00" stroke-width="1.6"/>
<text x="80" y="111" fill="#F5C242" font-size="16">&#128193;</text>
<text x="106" y="111" fill="#d4d4d4" font-size="14" font-weight="600">COLL_Environment</text>
<!-- icon cluster on the right -->
<g font-size="17" text-anchor="middle">
<text x="470" y="112" fill="#d4d4d4">&#9745;</text>
<text x="520" y="112" fill="#d4d4d4">&#128065;</text>
<text x="570" y="112" fill="#d4d4d4">&#128421;</text>
<text x="620" y="112" fill="#d4d4d4">&#128247;</text>
<text x="670" y="112" fill="#d4d4d4">&#9679;</text>
<text x="720" y="112" fill="#d4d4d4">&#9680;</text>
</g>
<!-- pointers down to cards -->
<path d="M470 128 V150 M520 128 V150 M570 128 V150 M620 128 V150 M670 128 V150 M720 128 V150" fill="none" stroke="currentColor" stroke-width="1" opacity="0.4"/>

<!-- Cards: two columns of three -->
<!-- Card 1: Exclude checkbox -->
<rect x="60" y="158" width="340" height="94" rx="9" fill="#2a2a2a" stroke="#4A9EFF" stroke-width="1.4"/>
<text x="84" y="188" fill="#d4d4d4" font-size="20">&#9745;</text>
<text x="116" y="184" fill="#4A9EFF" font-size="15" font-weight="700">Exclude from View Layer</text>
<text x="116" y="205" fill="#d4d4d4" font-size="12.5">Untick to remove the collection from this</text>
<text x="116" y="222" fill="#d4d4d4" font-size="12.5">view layer entirely. Excluded data is not</text>
<text x="116" y="239" fill="#d4d4d4" font-size="12.5">evaluated &#8212; <tspan fill="#E63946" font-weight="700">affects render</tspan>.</text>

<!-- Card 2: Hide in viewport (eye) -->
<rect x="420" y="158" width="340" height="94" rx="9" fill="#2a2a2a" stroke="#4A9EFF" stroke-width="1.4"/>
<text x="444" y="188" fill="#d4d4d4" font-size="20">&#128065;</text>
<text x="476" y="184" fill="#4A9EFF" font-size="15" font-weight="700">Hide in Viewport (eye)</text>
<text x="476" y="205" fill="#d4d4d4" font-size="12.5">Temporarily hides the collection in the</text>
<text x="476" y="222" fill="#d4d4d4" font-size="12.5">viewport only. Quick, non-destructive.</text>
<text x="476" y="239" fill="#d4d4d4" font-size="12.5"><tspan fill="#4ADE80" font-weight="700">Render unaffected</tspan> &#8212; still renders.</text>

<!-- Card 3: Disable in viewport (monitor) -->
<rect x="60" y="266" width="340" height="94" rx="9" fill="#2a2a2a" stroke="#4A9EFF" stroke-width="1.4"/>
<text x="84" y="296" fill="#d4d4d4" font-size="20">&#128421;</text>
<text x="116" y="292" fill="#4A9EFF" font-size="15" font-weight="700">Disable in Viewports (monitor)</text>
<text x="116" y="313" fill="#d4d4d4" font-size="12.5">Fully disables the collection in all</text>
<text x="116" y="330" fill="#d4d4d4" font-size="12.5">viewports &#8212; heavier than the eye.</text>
<text x="116" y="347" fill="#d4d4d4" font-size="12.5"><tspan fill="#4ADE80" font-weight="700">Render unaffected</tspan>.</text>

<!-- Card 4: Disable in render (camera) -->
<rect x="420" y="266" width="340" height="94" rx="9" fill="#2a2a2a" stroke="#E63946" stroke-width="1.6"/>
<text x="444" y="296" fill="#d4d4d4" font-size="20">&#128247;</text>
<text x="476" y="292" fill="#E63946" font-size="15" font-weight="700">Disable in Renders (camera)</text>
<text x="476" y="313" fill="#d4d4d4" font-size="12.5">Excludes the collection from the final</text>
<text x="476" y="330" fill="#d4d4d4" font-size="12.5">render while leaving it visible to work on.</text>
<text x="476" y="347" fill="#d4d4d4" font-size="12.5"><tspan fill="#E63946" font-weight="700">Affects render</tspan> &#8212; the key one to watch.</text>

<!-- Card 5: Holdout -->
<rect x="60" y="374" width="340" height="94" rx="9" fill="#2a2a2a" stroke="#B47EE8" stroke-width="1.4"/>
<text x="84" y="404" fill="#d4d4d4" font-size="20">&#9679;</text>
<text x="116" y="400" fill="#B47EE8" font-size="15" font-weight="700">Holdout</text>
<text x="116" y="421" fill="#d4d4d4" font-size="12.5">Punches a transparent hole where the</text>
<text x="116" y="438" fill="#d4d4d4" font-size="12.5">collection is &#8212; used for compositing masks.</text>
<text x="116" y="455" fill="#d4d4d4" font-size="12.5"><tspan fill="#E63946" font-weight="700">Affects render</tspan>.</text>

<!-- Card 6: Indirect only -->
<rect x="420" y="374" width="340" height="94" rx="9" fill="#2a2a2a" stroke="#B47EE8" stroke-width="1.4"/>
<text x="444" y="404" fill="#d4d4d4" font-size="20">&#9680;</text>
<text x="476" y="400" fill="#B47EE8" font-size="15" font-weight="700">Indirect Only</text>
<text x="476" y="421" fill="#d4d4d4" font-size="12.5">Object contributes only bounced light /</text>
<text x="476" y="438" fill="#d4d4d4" font-size="12.5">reflections, not direct visibility (Cycles).</text>
<text x="476" y="455" fill="#d4d4d4" font-size="12.5"><tspan fill="#E63946" font-weight="700">Affects render</tspan>.</text>

<!-- Bottom rule of thumb -->
<rect x="60" y="486" width="700" height="86" rx="10" fill="#2a2a2a" stroke="currentColor" stroke-width="1" opacity="0.96"/>
<text x="80" y="512" fill="#d4d4d4" font-size="14" font-weight="700">Rule of thumb</text>
<text x="80" y="536" fill="#d4d4d4" font-size="13"><tspan fill="#4ADE80" font-weight="700">Eye &amp; monitor</tspan> = viewport-only convenience, safe to toggle freely while working.</text>
<text x="80" y="558" fill="#d4d4d4" font-size="13"><tspan fill="#E63946" font-weight="700">Camera, exclude, holdout, indirect-only</tspan> = change the final image. Check these before every render.</text>
</svg>
