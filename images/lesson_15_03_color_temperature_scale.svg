<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="ct-title ct-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="ct-title">Color temperature scale in Kelvin</title>
  <desc id="ct-desc">A horizontal gradient bar running from warm orange at 1800 Kelvin through neutral white at 6500 Kelvin to cool blue beyond 20000 Kelvin, with tick marks, Kelvin values, and common light-source labels. Lower Kelvin reads warmer; higher Kelvin reads cooler.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Color Temperature Scale</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Measured in Kelvin (K) &#183; lower = warmer &#183; higher = cooler</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Kelvin gradient (CONTENT color, not brand palette) -->
  <defs>
    <linearGradient id="ct-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#FF8E3C"/>
      <stop offset="0.12" stop-color="#FFB66B"/>
      <stop offset="0.28" stop-color="#FFD9A8"/>
      <stop offset="0.42" stop-color="#FFF4E8"/>
      <stop offset="0.52" stop-color="#FFFFFF"/>
      <stop offset="0.68" stop-color="#DCEBFF"/>
      <stop offset="0.84" stop-color="#A8CCFF"/>
      <stop offset="1"    stop-color="#7FB0FF"/>
    </linearGradient>
  </defs>

  <!-- Warm / Cool end captions -->
  <text x="40" y="156" font-size="14" font-weight="600" fill="currentColor" opacity="0.7">WARM</text>
  <text x="760" y="156" font-size="14" font-weight="600" fill="currentColor" opacity="0.7" text-anchor="end">COOL</text>

  <!-- Gradient bar with subtle frame -->
  <rect x="40" y="168" width="720" height="64" rx="6" fill="url(#ct-grad)"
        stroke="currentColor" stroke-opacity="0.18" stroke-width="1"/>

  <!-- Tick marks + Kelvin value labels (positions are fractional along 40..760) -->
  <!-- 1800K @0.02 -> x=54.4 ; 2700K @0.10 ->112 ; 4000K @0.22 ->198.4 ; 5500K @0.38 ->313.6 ;
       6500K @0.50 ->400 ; 8000K @0.64 ->500.8 ; 12000K @0.80 ->616 ; 20000K @0.95 ->724 -->
  <g stroke="currentColor" stroke-opacity="0.55" stroke-width="1.5" stroke-linecap="round">
    <line x1="54"  y1="234" x2="54"  y2="248"/>
    <line x1="112" y1="234" x2="112" y2="248"/>
    <line x1="198" y1="234" x2="198" y2="248"/>
    <line x1="314" y1="234" x2="314" y2="248"/>
    <line x1="400" y1="234" x2="400" y2="252"/>
    <line x1="501" y1="234" x2="501" y2="248"/>
    <line x1="616" y1="234" x2="616" y2="248"/>
    <line x1="724" y1="234" x2="724" y2="248"/>
  </g>
  <g font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">
    <text x="54"  y="270">1800K</text>
    <text x="112" y="270">2700K</text>
    <text x="198" y="270">4000K</text>
    <text x="314" y="270">5500K</text>
    <text x="400" y="272" fill="#FF6B00">6500K</text>
    <text x="501" y="270">8000K</text>
    <text x="616" y="270">12000K</text>
    <text x="724" y="270">20000K+</text>
  </g>

  <!-- Default-white marker emphasis at 6500K -->
  <text x="400" y="289" font-size="11" font-weight="700" fill="#FF6B00" text-anchor="middle">DEFAULT WHITE</text>

  <!-- Source-name labels (second row, content reference) -->
  <g font-size="12" fill="currentColor" opacity="0.75" text-anchor="middle">
    <text x="54"  y="312">candle</text>
    <text x="198" y="312">fluorescent</text>
    <text x="314" y="312">daylight</text>
    <text x="501" y="312">overcast</text>
    <text x="616" y="312">blue sky</text>
    <text x="724" y="312">deep shade</text>
  </g>

  <!-- Reference rows: three example swatches with descriptions -->
  <text x="40" y="356" font-size="18" font-weight="600" fill="currentColor">Common reference points</text>

  <g font-size="13">
    <!-- Row 1 -->
    <rect x="40" y="372" width="26" height="26" rx="4" fill="#FFB66B" stroke="currentColor" stroke-opacity="0.18"/>
    <text x="78" y="384" font-weight="600" fill="currentColor">2700K &#8211; 3000K</text>
    <text x="78" y="402" fill="currentColor" opacity="0.6">Incandescent and tungsten: cozy, warm yellow interiors.</text>
    <!-- Row 2 -->
    <rect x="40" y="416" width="26" height="26" rx="4" fill="#FFFFFF" stroke="currentColor" stroke-opacity="0.3"/>
    <text x="78" y="428" font-weight="600" fill="currentColor">5500K &#8211; 6500K</text>
    <text x="78" y="446" fill="currentColor" opacity="0.6">Daylight and neutral white: the default, balanced look.</text>
    <!-- Row 3 -->
    <rect x="40" y="460" width="26" height="26" rx="4" fill="#A8CCFF" stroke="currentColor" stroke-opacity="0.18"/>
    <text x="78" y="472" font-weight="600" fill="currentColor">7000K &#8211; 10000K</text>
    <text x="78" y="490" fill="currentColor" opacity="0.6">Overcast and shade: cool blue, good for night or cold moods.</text>
  </g>

  <!-- Footer tip (Variant B left rail) -->
  <rect x="40" y="506" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Counter-intuitive scale: lower K is warmer, higher K is cooler. Subtle tints read more natural than pure colors.
  </text>
</svg>
