<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="car03-title car03-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="car03-title">The Pre-Animation Checklist</title>
  <desc id="car03-desc">A four-gate readiness checklist to clear before keying a single frame: the rig is tested, the scene is set up, reference is gathered, and the story beat is clear.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">The Pre-Animation Checklist</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Clear all four gates before you key a single frame.</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <g>
    <rect x="40" y="140" width="350" height="160" rx="8" fill="currentColor" opacity="0.04"/>
    <rect x="40" y="140" width="4" height="160" fill="#4A9EFF"/>
    <circle cx="72" cy="172" r="12" fill="#4ADE80"/>
    <path d="M 66 172 L 70 176 L 78 167" stroke="#0f1a14" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="96" y="178" font-size="16" font-weight="600" fill="currentColor">Rig tested</text>
    <text x="64" y="210" font-size="13" fill="currentColor" opacity="0.75">Controls move without breaking,</text>
    <text x="64" y="230" font-size="13" fill="currentColor" opacity="0.75">no flipping joints, IK/FK works,</text>
    <text x="64" y="250" font-size="13" fill="currentColor" opacity="0.75">face controls respond as expected.</text>
    <text x="64" y="278" font-size="12" fill="currentColor" opacity="0.55">A broken rig wastes hours mid-shot.</text>
  </g>
  <g>
    <rect x="410" y="140" width="350" height="160" rx="8" fill="currentColor" opacity="0.04"/>
    <rect x="410" y="140" width="4" height="160" fill="#B47EE8"/>
    <circle cx="442" cy="172" r="12" fill="#4ADE80"/>
    <path d="M 436 172 L 440 176 L 448 167" stroke="#0f1a14" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="466" y="178" font-size="16" font-weight="600" fill="currentColor">Scene set up</text>
    <text x="434" y="210" font-size="13" fill="currentColor" opacity="0.75">Frame range set, frame rate locked</text>
    <text x="434" y="230" font-size="13" fill="currentColor" opacity="0.75">to 24fps, camera placed, a simple</text>
    <text x="434" y="250" font-size="13" fill="currentColor" opacity="0.75">ground and lighting in place.</text>
    <text x="434" y="278" font-size="12" fill="currentColor" opacity="0.55">Changing fps later reshuffles timing.</text>
  </g>
  <g>
    <rect x="40" y="316" width="350" height="160" rx="8" fill="currentColor" opacity="0.04"/>
    <rect x="40" y="316" width="4" height="160" fill="#4ADE80"/>
    <circle cx="72" cy="348" r="12" fill="#4ADE80"/>
    <path d="M 66 348 L 70 352 L 78 343" stroke="#0f1a14" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="96" y="354" font-size="16" font-weight="600" fill="currentColor">Reference gathered</text>
    <text x="64" y="386" font-size="13" fill="currentColor" opacity="0.75">Video of the action, filmed or found,</text>
    <text x="64" y="406" font-size="13" fill="currentColor" opacity="0.75">plus pose and expression images.</text>
    <text x="64" y="426" font-size="13" fill="currentColor" opacity="0.75">Study it before you touch a control.</text>
    <text x="64" y="454" font-size="12" fill="currentColor" opacity="0.55">Reference is not cheating, it is craft.</text>
  </g>
  <g>
    <rect x="410" y="316" width="350" height="160" rx="8" fill="currentColor" opacity="0.04"/>
    <rect x="410" y="316" width="4" height="160" fill="#F5C242"/>
    <circle cx="442" cy="348" r="12" fill="#4ADE80"/>
    <path d="M 436 348 L 440 352 L 448 343" stroke="#0f1a14" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="466" y="354" font-size="16" font-weight="600" fill="currentColor">Story beat clear</text>
    <text x="434" y="386" font-size="13" fill="currentColor" opacity="0.75">You can say the shot in one line:</text>
    <text x="434" y="406" font-size="13" fill="currentColor" opacity="0.75">who wants what, and the moment it</text>
    <text x="434" y="426" font-size="13" fill="currentColor" opacity="0.75">turns. A pose test proves it reads.</text>
    <text x="434" y="454" font-size="12" fill="currentColor" opacity="0.55">No idea means no shot worth keying.</text>
  </g>

  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> If any gate is red, fixing it now costs minutes. Fixing it after blocking costs a re-do.</text>
</svg>
