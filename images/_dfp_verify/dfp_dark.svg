<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="dfp-title dfp-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#e8e8e8">
  <title id="dfp-title">The geometry pipeline</title>
  <desc id="dfp-desc">Geometry flows left to right through a node tree. It enters at Group Input, passes through processing nodes that transform, modify, and analyse it, and leaves at Group Output. A critical rule notes that geometry must have a continuous path from input to output.</desc>
  <defs>
    <marker id="dfp-arrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4ADE80"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">The geometry pipeline</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Data flows in one direction: input, then processing, then output</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- stage labels -->
  <text x="110" y="164" text-anchor="middle" font-size="13" font-weight="600" fill="#4ADE80">1. Input</text>
  <text x="400" y="164" text-anchor="middle" font-size="13" font-weight="600" fill="#FF6B00">2. Processing</text>
  <text x="690" y="164" text-anchor="middle" font-size="13" font-weight="600" fill="#4ADE80">3. Output</text>

  <!-- input -->
  <rect x="52" y="240" width="116" height="60" rx="8" fill="#4ADE80" fill-opacity="0.14" stroke="#4ADE80" stroke-width="2"/>
  <text x="110" y="266" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">Group Input</text>
  <text x="110" y="285" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.6">original mesh</text>

  <!-- processing 3 nodes -->
  <rect x="238" y="240" width="84" height="60" rx="8" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.3"/><text x="280" y="274" text-anchor="middle" font-size="12" fill="currentColor">Transform</text> <rect x="392" y="240" width="84" height="60" rx="8" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.3"/><text x="434" y="274" text-anchor="middle" font-size="12" fill="currentColor">Modify</text> <rect x="546" y="240" width="84" height="60" rx="8" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.3"/><text x="588" y="274" text-anchor="middle" font-size="12" fill="currentColor">Analyze</text>

  <!-- output -->
  <rect x="632" y="240" width="116" height="60" rx="8" fill="#4ADE80" fill-opacity="0.14" stroke="#4ADE80" stroke-width="2"/>
  <text x="690" y="266" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">Group Output</text>
  <text x="690" y="285" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.6">final result</text>

  <!-- flow arrows (green) -->
  <g stroke="#4ADE80" stroke-width="2.5" fill="none">
    <line x1="168" y1="270" x2="238" y2="270" marker-end="url(#dfp-arrow)"/>
    <line x1="322" y1="270" x2="392" y2="270" marker-end="url(#dfp-arrow)"/>
    <line x1="476" y1="270" x2="546" y2="270" marker-end="url(#dfp-arrow)"/>
    <line x1="630" y1="270" x2="632" y2="270" marker-end="url(#dfp-arrow)"/>
  </g>

  <!-- flow dots -->
  <g fill="#4ADE80" opacity="0.5">
    <circle cx="200" cy="270" r="3"/><circle cx="360" cy="270" r="3"/><circle cx="512" cy="270" r="3"/>
  </g>

  <text x="400" y="360" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.65">Each node takes geometry in, changes it, and passes it along.</text>

  <!-- critical rule box -->
  <rect x="140" y="400" width="520" height="52" rx="8" fill="#E63946" fill-opacity="0.10" stroke="#E63946" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="400" y="424" text-anchor="middle" font-size="13" font-weight="700" fill="#E63946">Critical rule</text>
  <text x="400" y="443" text-anchor="middle" font-size="13" fill="currentColor">Geometry needs an unbroken path from Input to Output, or nothing shows.</text>

  <rect x="40" y="506" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> If your object vanishes, trace the green line: somewhere it stops before reaching Output.</text>
</svg>
