<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="st-title st-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="st-title">Squash and stretch timing through a bounce cycle</title>
  <desc id="st-desc">A side view of one bounce cycle showing when to apply deformation. The ball is neutral at the slow apex, stretches as it speeds up falling and rising, and squashes at the moment of impact on the ground.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Squash and Stretch Timing</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">When to deform across one bounce: neutral at the apex, stretch on the fast parts, squash on impact</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Ground line -->
  <line x1="40" y1="520" x2="760" y2="520" stroke="currentColor" stroke-width="2" opacity="0.4"/>
  <text x="752" y="538" text-anchor="end" font-size="12" fill="currentColor" opacity="0.5">ground</text>

  <!-- Parabolic motion arc (dashed currentColor), apex left and right, dip to impact at center -->
  <path d="M 110 200 Q 260 560 400 506 Q 540 560 690 200"
        fill="none" stroke="currentColor" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="7 6"/>

  <!-- Position 1: neutral apex (left) -->
  <circle cx="110" cy="200" r="34" fill="#FF6B00"/>
  <!-- Position 2: stretch falling -->
  <ellipse cx="190" cy="300" rx="26" ry="44" transform="rotate(28 190 300)" fill="#FF6B00"/>
  <!-- Position 3: stretch pre-impact -->
  <ellipse cx="288" cy="430" rx="22" ry="50" transform="rotate(14 288 430)" fill="#FF6B00"/>
  <!-- Position 4: squash impact (on ground) -->
  <ellipse cx="400" cy="500" rx="56" ry="22" fill="#FF6B00"/>
  <!-- Position 5: stretch rising -->
  <ellipse cx="512" cy="430" rx="22" ry="50" transform="rotate(-14 512 430)" fill="#FF6B00"/>
  <!-- Position 6: stretch rising higher -->
  <ellipse cx="610" cy="300" rx="26" ry="44" transform="rotate(-28 610 300)" fill="#FF6B00"/>
  <!-- Position 7: neutral apex (right) -->
  <circle cx="690" cy="200" r="34" fill="#FF6B00"/>

  <!-- State pills + frame labels -->
  <!-- p1 -->
  <rect x="62" y="138" width="96" height="22" rx="11" fill="#FF6B00" fill-opacity="0.12" stroke="#FF6B00" stroke-opacity="0.5"/>
  <text x="110" y="153" text-anchor="middle" font-size="12" font-weight="700" fill="#FF6B00">NEUTRAL</text>
  <text x="110" y="174" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.6">frame 1</text>
  <!-- p2 -->
  <rect x="142" y="356" width="96" height="22" rx="11" fill="#FF6B00" fill-opacity="0.12" stroke="#FF6B00" stroke-opacity="0.5"/>
  <text x="190" y="371" text-anchor="middle" font-size="12" font-weight="700" fill="#FF6B00">STRETCH</text>
  <text x="190" y="391" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.6">frame 5</text>
  <!-- p3 -->
  <rect x="240" y="356" width="96" height="22" rx="11" fill="#FF6B00" fill-opacity="0.12" stroke="#FF6B00" stroke-opacity="0.5"/>
  <text x="288" y="371" text-anchor="middle" font-size="12" font-weight="700" fill="#FF6B00">STRETCH</text>
  <text x="288" y="391" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.6">frame 8</text>
  <!-- p4 squash -->
  <rect x="352" y="540" width="96" height="22" rx="11" fill="#FF6B00" fill-opacity="0.18" stroke="#FF6B00" stroke-opacity="0.7"/>
  <text x="400" y="555" text-anchor="middle" font-size="12" font-weight="700" fill="#FF6B00">SQUASH</text>
  <text x="400" y="576" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.6">frame 9 (impact)</text>
  <!-- p5 -->
  <rect x="464" y="356" width="96" height="22" rx="11" fill="#FF6B00" fill-opacity="0.12" stroke="#FF6B00" stroke-opacity="0.5"/>
  <text x="512" y="371" text-anchor="middle" font-size="12" font-weight="700" fill="#FF6B00">STRETCH</text>
  <text x="512" y="391" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.6">frame 10</text>
  <!-- p6 -->
  <rect x="562" y="356" width="96" height="22" rx="11" fill="#FF6B00" fill-opacity="0.12" stroke="#FF6B00" stroke-opacity="0.5"/>
  <text x="610" y="371" text-anchor="middle" font-size="12" font-weight="700" fill="#FF6B00">STRETCH</text>
  <text x="610" y="391" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.6">frame 13</text>
  <!-- p7 -->
  <rect x="642" y="138" width="96" height="22" rx="11" fill="#FF6B00" fill-opacity="0.12" stroke="#FF6B00" stroke-opacity="0.5"/>
  <text x="690" y="153" text-anchor="middle" font-size="12" font-weight="700" fill="#FF6B00">NEUTRAL</text>
  <text x="690" y="174" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.6">frame 17</text>

  <!-- Slow / fast read cues along the arc -->
  <text x="400" y="240" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor" opacity="0.55">slow at the apex (spacing tight, stays neutral)</text>
  <text x="248" y="478" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.5">fast = stretch</text>
  <text x="552" y="478" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.5">fast = stretch</text>

  <!-- Footer tip (Variant B left rail) -->
  <rect x="40" y="626" width="720" height="34" fill="none"/>
  <rect x="40" y="626" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="648" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Stretch reads only on the fast frames and squash only on the single impact frame. Hold the ball neutral at the slow apex.</text>
</svg>
