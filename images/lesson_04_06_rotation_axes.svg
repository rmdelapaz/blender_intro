<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="ra-title ra-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="ra-title">Rotation Axes in Blender</title>
  <desc id="ra-desc">A three-panel comparison of axis-constrained rotation in Blender. The left panel shows the R then X shortcut, labeled Pitch: a cube with a red horizontal rod through it and a tall vertical arc indicating rotation around the X axis. The middle panel shows R then Y, labeled Yaw: a cube with a green diagonal rod and a near-circular arc indicating rotation around the Y axis. The right panel shows R then Z, labeled Roll: a cube with a blue vertical rod and a flat horizontal arc indicating rotation around the Z axis. A shared note below the panels explains that the rod points along the rotation axis while the arc shows the direction of spin. A footer tip explains that typing a number after R sets the exact angle in degrees, for example R Z 45 rotates 45 degrees around Z.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">ROTATION AXES</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">R plus an axis key rotates around that axis</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Subhead -->
  <text x="400" y="142" font-size="15" font-weight="700" fill="#FF6B00" text-anchor="middle" letter-spacing="2">ROTATE AROUND X, Y, OR Z</text>

  <!-- =============================================================== -->
  <!-- THREE PANELS                                                     -->
  <!-- Panel 1 (R X):  translate(40, 170)   220 x 250                   -->
  <!-- Panel 2 (R Y):  translate(290, 170)  220 x 250                   -->
  <!-- Panel 3 (R Z):  translate(540, 170)  220 x 250                   -->
  <!-- =============================================================== -->

  <!-- ===== PANEL 1: R then X (Pitch, around horizontal X) ===== -->
  <g transform="translate(40, 170)">
    <rect x="0" y="0" width="220" height="250" rx="8"
          fill="currentColor" fill-opacity="0.04"
          stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>

    <!-- Tool name -->
    <text x="14" y="26" font-size="14" font-weight="700" fill="currentColor">Pitch</text>

    <!-- Key badge: R X -->
    <g transform="translate(170, 10)">
      <rect x="0" y="0" width="36" height="22" rx="4" fill="#FF6B00"/>
      <text x="18" y="16" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">R X</text>
    </g>

    <!-- Rotation axis rod (red, horizontal, dashed) -->
    <line x1="30" y1="125" x2="200" y2="125" stroke="#E63946" stroke-width="2" stroke-dasharray="4 3" opacity="0.6"/>

    <!-- Cube (filled body) -->
    <g opacity="0.10">
      <rect x="95" y="110" width="30" height="30" fill="currentColor"/>
      <polygon points="95,110 105,100 135,100 125,110" fill="currentColor"/>
      <polygon points="125,110 135,100 135,130 125,140" fill="currentColor"/>
    </g>
    <!-- Cube (wireframe) -->
    <g stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
      <rect x="95" y="110" width="30" height="30"/>
      <polygon points="95,110 105,100 135,100 125,110"/>
      <polygon points="125,110 135,100 135,130 125,140"/>
    </g>

    <!-- Rotation arc (red, tall vertical ellipse, 270 deg clockwise from top to left) -->
    <path d="M 115 81 A 14 44 0 1 1 101 125"
          fill="none" stroke="#E63946" stroke-width="3" stroke-linecap="round" opacity="0.95"/>

    <!-- Arrowhead at arc end (tangent points up at left side, motion direction is upward) -->
    <polygon points="101,125 95,137 107,137" fill="#E63946"/>

    <!-- Description -->
    <text x="110" y="216" font-size="12" fill="currentColor" opacity="0.75" text-anchor="middle">Pitch</text>
    <text x="110" y="232" font-size="12" font-weight="600" fill="#E63946" text-anchor="middle">(around X)</text>
  </g>

  <!-- ===== PANEL 2: R then Y (Yaw, around Y axis going into the scene) ===== -->
  <g transform="translate(290, 170)">
    <rect x="0" y="0" width="220" height="250" rx="8"
          fill="currentColor" fill-opacity="0.04"
          stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>

    <!-- Tool name -->
    <text x="14" y="26" font-size="14" font-weight="700" fill="currentColor">Yaw</text>

    <!-- Key badge: R Y -->
    <g transform="translate(170, 10)">
      <rect x="0" y="0" width="36" height="22" rx="4" fill="#FF6B00"/>
      <text x="18" y="16" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">R Y</text>
    </g>

    <!-- Rotation axis rod (green, diagonal upper-right, dashed) -->
    <line x1="50" y1="190" x2="180" y2="60" stroke="#4ADE80" stroke-width="2" stroke-dasharray="4 3" opacity="0.6"/>

    <!-- Cube (filled body) -->
    <g opacity="0.10">
      <rect x="95" y="110" width="30" height="30" fill="currentColor"/>
      <polygon points="95,110 105,100 135,100 125,110" fill="currentColor"/>
      <polygon points="125,110 135,100 135,130 125,140" fill="currentColor"/>
    </g>
    <!-- Cube (wireframe) -->
    <g stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
      <rect x="95" y="110" width="30" height="30"/>
      <polygon points="95,110 105,100 135,100 125,110"/>
      <polygon points="125,110 135,100 135,130 125,140"/>
    </g>

    <!-- Rotation arc (green, near-circular, 270 deg clockwise from top to left) -->
    <path d="M 115 93 A 38 32 0 1 1 77 125"
          fill="none" stroke="#4ADE80" stroke-width="3" stroke-linecap="round" opacity="0.95"/>

    <!-- Arrowhead at arc end (tangent points up at left side) -->
    <polygon points="77,125 71,137 83,137" fill="#4ADE80"/>

    <!-- Description -->
    <text x="110" y="216" font-size="12" fill="currentColor" opacity="0.75" text-anchor="middle">Yaw</text>
    <text x="110" y="232" font-size="12" font-weight="600" fill="#4ADE80" text-anchor="middle">(around Y)</text>
  </g>

  <!-- ===== PANEL 3: R then Z (Roll, around vertical Z) ===== -->
  <g transform="translate(540, 170)">
    <rect x="0" y="0" width="220" height="250" rx="8"
          fill="currentColor" fill-opacity="0.04"
          stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>

    <!-- Tool name -->
    <text x="14" y="26" font-size="14" font-weight="700" fill="currentColor">Roll</text>

    <!-- Key badge: R Z -->
    <g transform="translate(170, 10)">
      <rect x="0" y="0" width="36" height="22" rx="4" fill="#FF6B00"/>
      <text x="18" y="16" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">R Z</text>
    </g>

    <!-- Rotation axis rod (blue, vertical, dashed) -->
    <line x1="115" y1="55" x2="115" y2="200" stroke="#4A9EFF" stroke-width="2" stroke-dasharray="4 3" opacity="0.6"/>

    <!-- Cube (filled body) -->
    <g opacity="0.10">
      <rect x="95" y="110" width="30" height="30" fill="currentColor"/>
      <polygon points="95,110 105,100 135,100 125,110" fill="currentColor"/>
      <polygon points="125,110 135,100 135,130 125,140" fill="currentColor"/>
    </g>
    <!-- Cube (wireframe) -->
    <g stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
      <rect x="95" y="110" width="30" height="30"/>
      <polygon points="95,110 105,100 135,100 125,110"/>
      <polygon points="125,110 135,100 135,130 125,140"/>
    </g>

    <!-- Rotation arc (blue, flat horizontal ellipse, 270 deg clockwise from right to top) -->
    <path d="M 159 125 A 44 12 0 1 1 115 113"
          fill="none" stroke="#4A9EFF" stroke-width="3" stroke-linecap="round" opacity="0.95"/>

    <!-- Arrowhead at arc end (tangent points right at top of flat ellipse) -->
    <polygon points="115,113 103,107 103,119" fill="#4A9EFF"/>

    <!-- Description -->
    <text x="110" y="216" font-size="12" fill="currentColor" opacity="0.75" text-anchor="middle">Roll</text>
    <text x="110" y="232" font-size="12" font-weight="600" fill="#4A9EFF" text-anchor="middle">(around Z)</text>
  </g>

  <!-- ===== Shared "rod and arc" inset ===== -->
  <g transform="translate(60, 438)">
    <rect x="0" y="0" width="680" height="52" rx="6"
          fill="currentColor" fill-opacity="0.04"
          stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>
    <text x="14" y="20" font-size="11" font-weight="700" fill="currentColor" opacity="0.75" letter-spacing="0.8">ROD AND ARC</text>
    <text x="14" y="40" font-size="12" fill="currentColor" opacity="0.8">The rod points along the rotation axis. The arc shows which way the object spins as you drag the mouse.</text>
  </g>

  <!-- Footer tip callout -->
  <rect x="40" y="506" width="720" height="34" rx="6"
        fill="#FF6B00" fill-opacity="0.10"
        stroke="#FF6B00" stroke-opacity="0.4"/>
  <text x="54" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Type a number after R to set the exact angle in degrees. R Z 45 rotates 45 degrees around Z.
  </text>
</svg>
