<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="b321-title b321-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="b321-title">The 3-2-1 backup rule</title>
  <desc id="b321-desc">The 3-2-1 backup rule shown as three numbered bands: keep 3 copies of your work, on 2 different storage types, with 1 copy off-site, mapped to a practical setup of main drive, external drive, and cloud storage.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">The 3-2-1 Backup Rule</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Protect the portfolio piece you spent weeks building</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- 3 copies -->
  <g>
    <rect x="40" y="132" width="720" height="108" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.15"/>
    <circle cx="90" cy="186" r="26" fill="#FF6B00"/>
    <text x="90" y="195" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="140" y="170" font-size="16" font-weight="600" fill="currentColor">Copies of your work</text>
    <text x="140" y="193" font-size="13" fill="currentColor" opacity="0.6">The original plus two backups &#8212; so no single loss ends the project</text>
    <!-- three copy glyphs -->
    <rect x="140" y="206" width="34" height="24" rx="3" fill="#FF6B00" opacity="0.9"/>
    <rect x="184" y="206" width="34" height="24" rx="3" fill="#FF6B00" opacity="0.55"/>
    <rect x="228" y="206" width="34" height="24" rx="3" fill="#FF6B00" opacity="0.55"/>
    <text x="157" y="222" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">orig</text>
  </g>

  <!-- 2 types -->
  <g>
    <rect x="40" y="252" width="720" height="108" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.15"/>
    <circle cx="90" cy="306" r="26" fill="#4A9EFF"/>
    <text x="90" y="315" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="140" y="290" font-size="16" font-weight="600" fill="currentColor">Different storage types</text>
    <text x="140" y="313" font-size="13" fill="currentColor" opacity="0.6">Internal drive plus external drive or cloud &#8212; one failure mode can't take both</text>
    <text x="140" y="340" font-size="13" font-weight="500" fill="#4A9EFF">Internal SSD &#183; External drive / cloud</text>
  </g>

  <!-- 1 off-site -->
  <g>
    <rect x="40" y="372" width="720" height="108" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.15"/>
    <circle cx="90" cy="426" r="26" fill="#4ADE80"/>
    <text x="90" y="435" font-size="28" font-weight="700" fill="#0f1a14" text-anchor="middle">1</text>
    <text x="140" y="410" font-size="16" font-weight="600" fill="currentColor">Off-site backup</text>
    <text x="140" y="433" font-size="13" fill="currentColor" opacity="0.6">Cloud storage or a different physical location &#8212; survives fire, theft, or a dead machine</text>
    <text x="140" y="460" font-size="13" font-weight="500" fill="#4ADE80">Google Drive / Dropbox &#183; or a drive kept elsewhere</text>
  </g>

  <!-- Footer tip -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Main drive, then an external or second partition, then the cloud &#8212; that single flow satisfies all three numbers at once.</text>
</svg>
