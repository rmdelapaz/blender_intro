<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 590" role="img" aria-labelledby="vlc-title vlc-desc" color="#222" font-family="'Segoe UI',system-ui,sans-serif">
<title id="vlc-title">What a view layer is</title>
<desc id="vlc-desc">One scene feeds three view layers. Each view layer is a separate view of the same scene with its own collection visibility, render passes, overrides, and output. A Beauty layer includes every collection, a Character layer includes only the character collection, and an Environment layer includes only the background, producing three separate renders from a single scene for compositing.</desc>
<text x="440" y="34" text-anchor="middle" font-size="23" font-weight="700" fill="currentColor">What Are View Layers?</text>
<text x="440" y="58" text-anchor="middle" font-size="13.5" fill="currentColor" opacity="0.75">One scene, many "views" &#8212; each view layer decides what renders and how</text>

<!-- source scene node -->
<rect x="40" y="230" width="200" height="118" rx="10" fill="#2a2a2a" stroke="#FF6B00" stroke-width="1.6"/>
<rect x="40" y="230" width="200" height="6" rx="3" fill="#FF6B00"/>
<text x="140" y="262" text-anchor="middle" font-size="15" font-weight="700" fill="#FF6B00">One Scene</text>
<text x="140" y="286" text-anchor="middle" font-size="11.5" fill="#d4d4d4" font-family="'Consolas','Courier New',monospace">COLL_Character</text>
<text x="140" y="304" text-anchor="middle" font-size="11.5" fill="#d4d4d4" font-family="'Consolas','Courier New',monospace">COLL_Environment</text>
<text x="140" y="322" text-anchor="middle" font-size="11.5" fill="#d4d4d4" font-family="'Consolas','Courier New',monospace">COLL_Lighting</text>

<!-- branch connectors -->
<path d="M240 260 C300 260 300 120 356 120" fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.55"/>
<path d="M240 289 C300 289 300 289 356 289" fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.55"/>
<path d="M240 318 C300 318 300 458 356 458" fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.55"/>

<!-- View Layer 1: Beauty (all in) -->
<g>
<rect x="356" y="74" width="356" height="92" rx="9" fill="#2a2a2a" stroke="#4ADE80" stroke-width="1.4"/>
<rect x="356" y="74" width="6" height="92" rx="3" fill="#4ADE80"/>
<text x="378" y="102" font-size="15" font-weight="700" fill="#4ADE80">View Layer: "Beauty"</text>
<text x="378" y="124" font-size="11.5" fill="#d4d4d4">All collections included &#8594; full scene render</text>
<text x="378" y="144" font-size="11.5" fill="#d4d4d4">Every render pass enabled</text>
<text x="700" y="102" text-anchor="end" font-size="11" fill="#4ADE80" font-weight="700">ALL</text>
</g>

<!-- View Layer 2: Character only -->
<g>
<rect x="356" y="243" width="356" height="92" rx="9" fill="#2a2a2a" stroke="#4A9EFF" stroke-width="1.4"/>
<rect x="356" y="243" width="6" height="92" rx="3" fill="#4A9EFF"/>
<text x="378" y="271" font-size="15" font-weight="700" fill="#4A9EFF">View Layer: "Character"</text>
<text x="378" y="293" font-size="11.5" fill="#d4d4d4">Only COLL_Character included</text>
<text x="378" y="313" font-size="11.5" fill="#d4d4d4">Character renders isolated for comp</text>
</g>

<!-- View Layer 3: Environment only -->
<g>
<rect x="356" y="412" width="356" height="92" rx="9" fill="#2a2a2a" stroke="#B47EE8" stroke-width="1.4"/>
<rect x="356" y="412" width="6" height="92" rx="3" fill="#B47EE8"/>
<text x="378" y="440" font-size="15" font-weight="700" fill="#B47EE8">View Layer: "Environment"</text>
<text x="378" y="462" font-size="11.5" fill="#d4d4d4">Only background collections included</text>
<text x="378" y="482" font-size="11.5" fill="#d4d4d4">Adjusted independently in the comp</text>
</g>

<!-- what each layer owns (right rail) -->
<rect x="726" y="150" width="130" height="278" rx="9" fill="#1e1e1e" stroke="currentColor" stroke-width="1" opacity="0.9"/>
<text x="791" y="176" text-anchor="middle" font-size="11.5" font-weight="700" fill="#F5C242">Each layer owns</text>
<text x="740" y="204" font-size="11" fill="#d4d4d4">&#9642; collection</text>
<text x="740" y="222" font-size="11" fill="#d4d4d4">&#160;&#160;visibility</text>
<text x="740" y="246" font-size="11" fill="#d4d4d4">&#9642; render passes</text>
<text x="740" y="270" font-size="11" fill="#d4d4d4">&#9642; overrides</text>
<text x="740" y="294" font-size="11" fill="#d4d4d4">&#9642; output</text>
<line x1="740" y1="312" x2="842" y2="312" stroke="currentColor" stroke-width="0.8" opacity="0.4"/>
<text x="740" y="336" font-size="10.5" fill="#4A9EFF">Collections</text>
<text x="740" y="352" font-size="10" fill="#d4d4d4">= organize objects</text>
<text x="740" y="376" font-size="10.5" fill="#4ADE80">View Layers</text>
<text x="740" y="392" font-size="10" fill="#d4d4d4">= control what renders</text>
<text x="740" y="416" font-size="10" fill="#d4d4d4" opacity="0.85">They work together.</text>

<!-- footer -->
<rect x="40" y="524" width="800" height="46" rx="9" fill="#2a2a2a" stroke="currentColor" stroke-width="1"/>
<text x="60" y="551" font-size="12.5" fill="currentColor" font-weight="700">Result:</text>
<text x="118" y="551" font-size="12.5" fill="#d4d4d4">Three separate renders from one scene &#8212; same objects, different visibility &amp; render settings.</text>
</svg>
