<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" role="img" aria-labelledby="ptTitle ptDesc" fill="none" style="max-width:100%;height:auto;color:currentColor">
  <title id="ptTitle">Precision tools reference</title>
  <desc id="ptDesc">A shortcut card for precision modeling: numeric move, toggle snapping, flatten to plane, edge loop select, loop cut, and measurement overlay.</desc>
  <style>
    .pt-card{stroke:currentColor;stroke-width:1.5;fill:currentColor;fill-opacity:.04;rx:10}
    .pt-key{stroke:currentColor;stroke-width:1.6;fill:currentColor;fill-opacity:.10;rx:5}
    .pt-keytx{font:700 12px ui-monospace,Menlo,Consolas,monospace;fill:currentColor;text-anchor:middle}
    .pt-name{font:700 14.5px system-ui,Arial,sans-serif;fill:currentColor}
    .pt-desc{font:400 11.5px system-ui,Arial,sans-serif;fill:currentColor;opacity:.72}
    .pt-icon{stroke:currentColor;stroke-width:1.6;fill:none;opacity:.8}
    .pt-fill{fill:currentColor;opacity:.8}
    .pt-hd{font:600 13px system-ui,Arial,sans-serif;fill:currentColor;opacity:.85}
    .pt-plus{font:700 12px system-ui,Arial,sans-serif;fill:currentColor;opacity:.6}
  </style>

  <text class="pt-hd" x="440" y="32" text-anchor="middle">Precision modeling &#8212; type exact values instead of dragging by eye</text>

  <!-- key helper rendered inline per card -->

  <!-- Card 1: Numeric input  (col1 row1) -->
  <g transform="translate(30,56)">
    <rect class="pt-card" x="0" y="0" width="396" height="142" rx="10"/>
    <text class="pt-name" x="20" y="32">Numeric move</text>
    <!-- keycaps: G  X  2  Enter -->
    <g transform="translate(20,48)">
      <rect class="pt-key" x="0" y="0" width="26" height="26"/><text class="pt-keytx" x="13" y="18">G</text>
      <rect class="pt-key" x="34" y="0" width="26" height="26"/><text class="pt-keytx" x="47" y="18">X</text>
      <rect class="pt-key" x="68" y="0" width="26" height="26"/><text class="pt-keytx" x="81" y="18">2</text>
      <rect class="pt-key" x="102" y="0" width="48" height="26"/><text class="pt-keytx" x="126" y="18">Enter</text>
    </g>
    <text class="pt-desc" x="20" y="104">Grab, lock to X axis, move exactly 2 units.</text>
    <text class="pt-desc" x="20" y="122">Works with R (rotate) and S (scale) too.</text>
  </g>

  <!-- Card 2: Toggle snapping (col2 row1) -->
  <g transform="translate(454,56)">
    <rect class="pt-card" x="0" y="0" width="396" height="142" rx="10"/>
    <text class="pt-name" x="20" y="32">Toggle snapping</text>
    <g transform="translate(20,48)">
      <rect class="pt-key" x="0" y="0" width="48" height="26"/><text class="pt-keytx" x="24" y="18">Shift</text>
      <text class="pt-plus" x="56" y="18">+</text>
      <rect class="pt-key" x="66" y="0" width="40" height="26"/><text class="pt-keytx" x="86" y="18">Tab</text>
    </g>
    <text class="pt-desc" x="20" y="104">Flips the magnet on or off mid-edit so you</text>
    <text class="pt-desc" x="20" y="122">can snap to vertices, edges or the grid.</text>
  </g>

  <!-- Card 3: Flatten to plane (col1 row2) -->
  <g transform="translate(30,212)">
    <rect class="pt-card" x="0" y="0" width="396" height="142" rx="10"/>
    <text class="pt-name" x="20" y="32">Flatten to plane</text>
    <g transform="translate(20,48)">
      <rect class="pt-key" x="0" y="0" width="26" height="26"/><text class="pt-keytx" x="13" y="18">S</text>
      <rect class="pt-key" x="34" y="0" width="26" height="26"/><text class="pt-keytx" x="47" y="18">Z</text>
      <rect class="pt-key" x="68" y="0" width="26" height="26"/><text class="pt-keytx" x="81" y="18">0</text>
      <rect class="pt-key" x="102" y="0" width="48" height="26"/><text class="pt-keytx" x="126" y="18">Enter</text>
    </g>
    <text class="pt-desc" x="20" y="104">Scale to zero on Z &#8212; collapses selected</text>
    <text class="pt-desc" x="20" y="122">geometry dead flat onto a single plane.</text>
  </g>

  <!-- Card 4: Edge loop select (col2 row2) -->
  <g transform="translate(454,212)">
    <rect class="pt-card" x="0" y="0" width="396" height="142" rx="10"/>
    <text class="pt-name" x="20" y="32">Edge loop select</text>
    <g transform="translate(20,48)">
      <rect class="pt-key" x="0" y="0" width="36" height="26"/><text class="pt-keytx" x="18" y="18">Alt</text>
      <text class="pt-plus" x="44" y="18">+</text>
      <rect class="pt-key" x="54" y="0" width="56" height="26"/><text class="pt-keytx" x="82" y="18">Click</text>
    </g>
    <!-- loop icon -->
    <g transform="translate(300,40)">
      <ellipse class="pt-icon" cx="30" cy="40" rx="30" ry="20"/>
      <circle class="pt-fill" cx="30" cy="20" r="3"/>
    </g>
    <text class="pt-desc" x="20" y="104">Selects an entire continuous loop in one</text>
    <text class="pt-desc" x="20" y="122">click &#8212; no dragging across each edge.</text>
  </g>

  <!-- Card 5: Loop cut (col1 row3) -->
  <g transform="translate(30,368)">
    <rect class="pt-card" x="0" y="0" width="396" height="142" rx="10"/>
    <text class="pt-name" x="20" y="32">Loop cut</text>
    <g transform="translate(20,48)">
      <rect class="pt-key" x="0" y="0" width="36" height="26"/><text class="pt-keytx" x="18" y="18">Ctrl</text>
      <text class="pt-plus" x="44" y="18">+</text>
      <rect class="pt-key" x="54" y="0" width="26" height="26"/><text class="pt-keytx" x="67" y="18">R</text>
    </g>
    <g transform="translate(300,40)">
      <rect class="pt-icon" x="0" y="10" width="60" height="44"/>
      <line class="pt-icon" x1="30" y1="10" x2="30" y2="54" stroke-width="2.4"/>
    </g>
    <text class="pt-desc" x="20" y="104">Adds a precise new edge loop; scroll to</text>
    <text class="pt-desc" x="20" y="122">set count, then slide to position it.</text>
  </g>

  <!-- Card 6: Measurement overlay (col2 row3) -->
  <g transform="translate(454,368)">
    <rect class="pt-card" x="0" y="0" width="396" height="142" rx="10"/>
    <text class="pt-name" x="20" y="32">Measure overlay</text>
    <g transform="translate(20,48)">
      <rect class="pt-key" x="0" y="0" width="150" height="26"/><text class="pt-keytx" x="75" y="18">Overlays &#9656; Edge Length</text>
    </g>
    <g transform="translate(300,38)">
      <path class="pt-icon" d="M0,52 L0,12 L60,12 L60,52"/>
      <line class="pt-icon" x1="0" y1="32" x2="60" y2="32" stroke-dasharray="4 3"/>
      <circle class="pt-fill" cx="0" cy="32" r="2.5"/>
      <circle class="pt-fill" cx="60" cy="32" r="2.5"/>
    </g>
    <text class="pt-desc" x="20" y="104">Shows live edge lengths and angles so you</text>
    <text class="pt-desc" x="20" y="122">can verify dimensions while modeling.</text>
  </g>
</svg>
