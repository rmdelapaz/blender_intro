<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="bc-title bc-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="bc-title">Base Color PBR Value Range</title>
  <desc id="bc-desc">A horizontal black-to-white gradient bar showing acceptable base color brightness for physically based materials. The dark and bright extremes are marked as out-of-range in red; the wide middle band from roughly 30 to 245 on the 0 to 255 scale is the realistic range, marked in green. Example materials are placed along the gradient, and an RGB 0 to 255 scale runs beneath the bar.</desc>

  <defs>
    <linearGradient id="bc-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Base Color PBR Value Range</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Keep base color brightness inside the realistic band for the Principled BSDF</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ============ Zone label row (above the bar) ============ -->
  <!-- Bar geometry: x 60..740 (width 680) maps value 0..255 -->
  <!-- ideal band: value 30 -> x = 60 + 680*30/255 = 140.0 ; value 245 -> x = 60 + 680*245/255 = 713.3 -->

  <!-- Too dark zone bracket label -->
  <text x="100" y="150" font-size="14" font-weight="700" fill="#E63946" text-anchor="middle">TOO DARK</text>
  <text x="100" y="169" font-size="11" fill="currentColor" opacity="0.6" text-anchor="middle">0&#8211;30</text>

  <!-- Ideal zone label -->
  <text x="426" y="150" font-size="14" font-weight="700" fill="#4ADE80" text-anchor="middle">REALISTIC RANGE</text>
  <text x="426" y="169" font-size="11" fill="currentColor" opacity="0.6" text-anchor="middle">30&#8211;245 &#183; the safe working band</text>

  <!-- Too bright zone label -->
  <text x="726" y="150" font-size="14" font-weight="700" fill="#E63946" text-anchor="middle">TOO BRIGHT</text>
  <text x="726" y="169" font-size="11" fill="currentColor" opacity="0.6" text-anchor="middle">245&#8211;255</text>

  <!-- ============ The gradient bar ============ -->
  <rect x="60" y="186" width="680" height="92" rx="4" fill="url(#bc-grad)" stroke="currentColor" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Zone boundary markers at value 30 (x=140) and value 245 (x=713.3) -->
  <line x1="140" y1="180" x2="140" y2="290" stroke="#4ADE80" stroke-width="2.5"/>
  <line x1="713.3" y1="180" x2="713.3" y2="290" stroke="#4ADE80" stroke-width="2.5"/>

  <!-- Out-of-range red hatching caps on the bar extremes -->
  <rect x="60" y="186" width="80" height="92" rx="4" fill="#E63946" fill-opacity="0.16"/>
  <rect x="713.3" y="186" width="26.7" height="92" fill="#E63946" fill-opacity="0.16"/>

  <!-- Realistic band underline emphasis -->
  <rect x="140" y="282" width="573.3" height="4" rx="2" fill="#4ADE80"/>

  <!-- ============ Example material markers (inside the realistic band) ============ -->
  <!-- value -> x = 60 + 680*v/255 ; tops/labels below the bar -->

  <!-- Coal/charcoal ~40 -> x=166.7 -->
  <g>
    <circle cx="166.7" cy="232" r="7" fill="#2a2a2a" stroke="#fff" stroke-width="1.5"/>
    <line x1="166.7" y1="278" x2="166.7" y2="312" stroke="#FF6B00" stroke-width="1.5"/>
    <text x="166.7" y="328" font-size="11" font-weight="600" fill="currentColor" text-anchor="middle">Coal</text>
    <text x="166.7" y="343" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">~40</text>
  </g>

  <!-- Asphalt ~65 -> x=233.3 -->
  <g>
    <circle cx="233.3" cy="232" r="7" fill="#444444" stroke="#fff" stroke-width="1.5"/>
    <line x1="233.3" y1="278" x2="233.3" y2="312" stroke="#FF6B00" stroke-width="1.5"/>
    <text x="233.3" y="328" font-size="11" font-weight="600" fill="currentColor" text-anchor="middle">Asphalt</text>
    <text x="233.3" y="343" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">~65</text>
  </g>

  <!-- Brick ~130 -> x=406.7 -->
  <g>
    <circle cx="406.7" cy="232" r="7" fill="#9a6a55" stroke="#fff" stroke-width="1.5"/>
    <line x1="406.7" y1="278" x2="406.7" y2="312" stroke="#FF6B00" stroke-width="1.5"/>
    <text x="406.7" y="328" font-size="11" font-weight="600" fill="currentColor" text-anchor="middle">Brick / leather</text>
    <text x="406.7" y="343" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">~130</text>
  </g>

  <!-- Concrete ~200 -> x=593.3 -->
  <g>
    <circle cx="593.3" cy="232" r="7" fill="#c8c8c8" stroke="#fff" stroke-width="1.5"/>
    <line x1="593.3" y1="278" x2="593.3" y2="312" stroke="#FF6B00" stroke-width="1.5"/>
    <text x="593.3" y="328" font-size="11" font-weight="600" fill="currentColor" text-anchor="middle">Concrete</text>
    <text x="593.3" y="343" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">~200</text>
  </g>

  <!-- Snow ~235 -> x=686.7 -->
  <g>
    <circle cx="686.7" cy="232" r="7" fill="#f2f2f2" stroke="#999" stroke-width="1.5"/>
    <line x1="686.7" y1="278" x2="686.7" y2="312" stroke="#FF6B00" stroke-width="1.5"/>
    <text x="686.7" y="328" font-size="11" font-weight="600" fill="currentColor" text-anchor="middle">Snow / paint</text>
    <text x="686.7" y="343" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">~235</text>
  </g>

  <!-- ============ RGB 0-255 scale beneath ============ -->
  <line x1="60" y1="392" x2="740" y2="392" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
  <!-- ticks at 0,50,100,150,200,255 -->
  <!-- 0 -> x=60 -->
  <line x1="60" y1="386" x2="60" y2="398" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
  <text x="60" y="416" font-size="11" fill="currentColor" opacity="0.6" text-anchor="middle" font-family="'Roboto Mono', ui-monospace, monospace">0</text>
  <!-- 50 -> x=193.3 -->
  <line x1="193.3" y1="386" x2="193.3" y2="398" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
  <text x="193.3" y="416" font-size="11" fill="currentColor" opacity="0.6" text-anchor="middle" font-family="'Roboto Mono', ui-monospace, monospace">50</text>
  <!-- 100 -> x=326.7 -->
  <line x1="326.7" y1="386" x2="326.7" y2="398" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
  <text x="326.7" y="416" font-size="11" fill="currentColor" opacity="0.6" text-anchor="middle" font-family="'Roboto Mono', ui-monospace, monospace">100</text>
  <!-- 150 -> x=460 -->
  <line x1="460" y1="386" x2="460" y2="398" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
  <text x="460" y="416" font-size="11" fill="currentColor" opacity="0.6" text-anchor="middle" font-family="'Roboto Mono', ui-monospace, monospace">150</text>
  <!-- 200 -> x=593.3 -->
  <line x1="593.3" y1="386" x2="593.3" y2="398" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
  <text x="593.3" y="416" font-size="11" fill="currentColor" opacity="0.6" text-anchor="middle" font-family="'Roboto Mono', ui-monospace, monospace">200</text>
  <!-- 255 -> x=740 -->
  <line x1="740" y1="386" x2="740" y2="398" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
  <text x="740" y="416" font-size="11" fill="currentColor" opacity="0.6" text-anchor="middle" font-family="'Roboto Mono', ui-monospace, monospace">255</text>
  <text x="400" y="444" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">sRGB value on the 0&#8211;255 scale (Blender shows 0&#8211;1; multiply by 255)</text>

  <!-- ============ Rule callout cards ============ -->
  <!-- Left: never pure black -->
  <rect x="40" y="480" width="350" height="64" rx="8" fill="#E63946" fill-opacity="0.08"/>
  <rect x="40" y="480" width="4" height="64" rx="2" fill="#E63946"/>
  <text x="60" y="508" font-size="14" font-weight="700" fill="#E63946">Never pure black (0)</text>
  <text x="60" y="530" font-size="12" fill="currentColor" opacity="0.75">Real surfaces always reflect a little light. Floor</text>
  <text x="60" y="546" font-size="12" fill="currentColor" opacity="0.75">at ~30 even for coal and charcoal.</text>

  <!-- Right: never pure white -->
  <rect x="410" y="480" width="350" height="64" rx="8" fill="#E63946" fill-opacity="0.08"/>
  <rect x="410" y="480" width="4" height="64" rx="2" fill="#E63946"/>
  <text x="430" y="508" font-size="14" font-weight="700" fill="#E63946">Never pure white (255)</text>
  <text x="430" y="530" font-size="12" fill="currentColor" opacity="0.75">Nothing reflects 100% of light. Cap bright</text>
  <text x="430" y="546" font-size="12" fill="currentColor" opacity="0.75">materials like snow and fresh paint at ~245.</text>

  <!-- Scale note -->
  <text x="40" y="592" font-size="13" fill="currentColor" opacity="0.6">Staying inside the band keeps materials responding correctly across every lighting condition.</text>

  <!-- Footer tip (Variant B, left rail) at dense-variant y=641 -->
  <rect x="40" y="641" width="720" height="34" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Reduce saturation to 60&#8211;80% as well; fully saturated base colors read as artificial.</text>
</svg>
