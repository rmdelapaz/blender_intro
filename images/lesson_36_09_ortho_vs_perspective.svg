<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" color="currentColor" role="img" aria-labelledby="ovp-title ovp-desc" style="max-width:100%;height:auto">
<title id="ovp-title">Orthographic versus perspective reference</title>
<desc id="ovp-desc">An orthographic projection keeps parallel edges and true proportions for modeling, while a perspective projection introduces foreshortening that distorts measurements.</desc>
<style>
.ovp-s{fill:none;stroke:currentColor;stroke-width:2}
.ovp-g{fill:none;stroke:currentColor;stroke-width:1;opacity:.35}
.ovp-t{fill:currentColor;font-family:system-ui,Arial,sans-serif}
.ovp-h{font-size:16px;font-weight:700}.ovp-b{font-size:12px}.ovp-s2{font-size:10.5px;opacity:.78}
.ovp-good{fill:#4CAF50}.ovp-bad{fill:#e1483a}
.ovp-ray{fill:none;stroke:currentColor;stroke-width:1.3;opacity:.5;stroke-dasharray:4 3}
.ovp-meas{fill:none;stroke:#4CAF50;stroke-width:1.6}
.ovp-measb{fill:none;stroke:#e1483a;stroke-width:1.6}
</style>
<!-- LEFT ortho -->
<circle cx="40" cy="32" r="8" class="ovp-good"/>
<path d="M36 32 l3 3 l5 -7" fill="none" stroke="#fff" stroke-width="2"/>
<text x="56" y="37" class="ovp-t ovp-h">Orthographic &#8212; use this</text>
<!-- parallel projection rays -->
<g class="ovp-ray"><path d="M120 70 H300"/><path d="M120 130 H300"/><path d="M120 190 H300"/><path d="M120 250 H300"/></g>
<!-- box (true proportion) -->
<rect x="120" y="70" width="120" height="180" class="ovp-s"/>
<path d="M120 130 H240 M120 190 H240" class="ovp-g"/>
<!-- measurement equal -->
<path d="M260 70 V250" class="ovp-meas"/>
<path d="M256 70 h8 M256 250 h8" class="ovp-meas"/>
<text x="268" y="165" class="ovp-t ovp-s2" fill="#4CAF50">true height</text>
<text x="120" y="288" class="ovp-t ovp-b">Parallel rays &#183; no foreshortening.</text>
<text x="120" y="306" class="ovp-t ovp-s2">Edges stay parallel; widths measure true at</text>
<text x="120" y="322" class="ovp-t ovp-s2">any depth &#8594; reference traces 1:1.</text>
<!-- divider -->
<path d="M360 30 v300" stroke="currentColor" stroke-width="1" opacity=".3"/>
<!-- RIGHT perspective -->
<circle cx="392" cy="32" r="8" class="ovp-bad"/>
<path d="M388 28 l8 8 M396 28 l-8 8" fill="none" stroke="#fff" stroke-width="2"/>
<text x="408" y="37" class="ovp-t ovp-h">Perspective &#8212; distorts</text>
<!-- vanishing rays -->
<g class="ovp-ray"><path d="M700 160 L470 70"/><path d="M700 160 L470 110"/><path d="M700 160 L470 210"/><path d="M700 160 L470 250"/></g>
<!-- foreshortened box -->
<path d="M470 70 L470 250 L560 215 L560 105 Z" class="ovp-s"/>
<path d="M560 105 L640 130 L640 190 L560 215" class="ovp-s"/>
<path d="M470 70 L560 105 M470 250 L560 215" class="ovp-g"/>
<!-- unequal measure -->
<path d="M455 70 V250" class="ovp-measb"/><path d="M451 70 h8 M451 250 h8" class="ovp-measb"/>
<path d="M655 130 V190" class="ovp-measb"/><path d="M651 130 h8 M651 190 h8" class="ovp-measb"/>
<text x="408" y="288" class="ovp-t ovp-b">Rays converge &#183; far side shrinks.</text>
<text x="408" y="306" class="ovp-t ovp-s2">Same real height reads shorter with depth</text>
<text x="408" y="322" class="ovp-t ovp-s2">&#8594; tracing gives wrong proportions.</text>
</svg>
