<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="es-title es-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="es-title">Types of easing</title>
  <desc id="es-desc">Three velocity lanes showing where a camera move speeds up and slows down. Dot spacing encodes speed: close dots are slow, spread dots are fast. Ease In starts tight then spreads (slow start, accelerates). Ease Out starts spread then tightens (decelerates to a gentle landing). Ease In and Out is tight then spread then tight, the natural go-to that is smooth at both ends. A small value-versus-frame curve sits at the right of each lane.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">EASING</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Where the move speeds up and slows down</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Three lanes. Each lane: name + gloss (left), motion track with dots (center),
       value curve inset (right ~x=620-740). Lane baselines at y=190, 320, 450. -->

  <!-- ============ Lane 1: Ease In (tight -> spread) ============ -->
  <g>
    <text x="40" y="170" font-size="15" font-weight="600" fill="currentColor">Ease In</text>
    <text x="40" y="188" font-size="13" fill="currentColor" opacity="0.6">Builds momentum:</text>
    <text x="40" y="204" font-size="13" fill="currentColor" opacity="0.6">deliberate start, then urgent</text>
    <!-- motion track -->
    <line x1="250" y1="190" x2="600" y2="190" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
    <!-- dots: tight at start, spreading toward the end (accelerating) -->
    <circle cx="250" cy="190" r="5" fill="#FF6B00"/>
    <circle cx="262" cy="190" r="5" fill="#FF6B00"/>
    <circle cx="278" cy="190" r="5" fill="#FF6B00"/>
    <circle cx="300" cy="190" r="5" fill="#FF6B00"/>
    <circle cx="330" cy="190" r="5" fill="#FF6B00"/>
    <circle cx="372" cy="190" r="5" fill="#FF6B00"/>
    <circle cx="428" cy="190" r="5" fill="#FF6B00"/>
    <circle cx="500" cy="190" r="5" fill="#FF6B00"/>
    <circle cx="592" cy="190" r="5" fill="#FF6B00"/>
    <!-- inset value curve: ease-in (flat then steep) -->
    <line x1="640" y1="166" x2="640" y2="214" stroke="currentColor" stroke-width="1.2" opacity="0.3"/>
    <line x1="640" y1="214" x2="744" y2="214" stroke="currentColor" stroke-width="1.2" opacity="0.3"/>
    <path d="M 640 214 C 700 214 700 214 744 166" fill="none" stroke="#FF6B00" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- ============ Lane 2: Ease Out (spread -> tight) ============ -->
  <g>
    <text x="40" y="300" font-size="15" font-weight="600" fill="currentColor">Ease Out</text>
    <text x="40" y="318" font-size="13" fill="currentColor" opacity="0.6">Settles into position:</text>
    <text x="40" y="334" font-size="13" fill="currentColor" opacity="0.6">decisive, gentle landing</text>
    <!-- motion track -->
    <line x1="250" y1="320" x2="600" y2="320" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
    <!-- dots: spread at start, tightening toward the end (decelerating) -->
    <circle cx="250" cy="320" r="5" fill="#FF6B00"/>
    <circle cx="342" cy="320" r="5" fill="#FF6B00"/>
    <circle cx="414" cy="320" r="5" fill="#FF6B00"/>
    <circle cx="470" cy="320" r="5" fill="#FF6B00"/>
    <circle cx="512" cy="320" r="5" fill="#FF6B00"/>
    <circle cx="542" cy="320" r="5" fill="#FF6B00"/>
    <circle cx="564" cy="320" r="5" fill="#FF6B00"/>
    <circle cx="580" cy="320" r="5" fill="#FF6B00"/>
    <circle cx="592" cy="320" r="5" fill="#FF6B00"/>
    <!-- inset value curve: ease-out (steep then flat) -->
    <line x1="640" y1="296" x2="640" y2="344" stroke="currentColor" stroke-width="1.2" opacity="0.3"/>
    <line x1="640" y1="344" x2="744" y2="344" stroke="currentColor" stroke-width="1.2" opacity="0.3"/>
    <path d="M 640 344 C 684 296 684 296 744 296" fill="none" stroke="#FF6B00" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- ============ Lane 3: Ease In/Out (tight -> spread -> tight, tie-break) ============ -->
  <g>
    <!-- faint orange emphasis edge marks the go-to lane -->
    <rect x="28" y="412" width="732" height="74" rx="6" fill="none" stroke="#FF6B00" stroke-width="1.5" opacity="0.5"/>
    <text x="40" y="436" font-size="15" font-weight="600" fill="currentColor">Ease In / Out</text>
    <text x="40" y="454" font-size="13" fill="currentColor" opacity="0.6">The go-to:</text>
    <text x="40" y="470" font-size="13" fill="currentColor" opacity="0.6">smooth at both ends</text>
    <!-- motion track -->
    <line x1="250" y1="450" x2="600" y2="450" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
    <!-- dots: tight, spread in the middle, tight again (symmetric) -->
    <circle cx="250" cy="450" r="5" fill="#FF6B00"/>
    <circle cx="262" cy="450" r="5" fill="#FF6B00"/>
    <circle cx="282" cy="450" r="5" fill="#FF6B00"/>
    <circle cx="312" cy="450" r="5" fill="#FF6B00"/>
    <circle cx="356" cy="450" r="5" fill="#FF6B00"/>
    <circle cx="424" cy="450" r="5" fill="#FF6B00"/>
    <circle cx="492" cy="450" r="5" fill="#FF6B00"/>
    <circle cx="536" cy="450" r="5" fill="#FF6B00"/>
    <circle cx="566" cy="450" r="5" fill="#FF6B00"/>
    <circle cx="586" cy="450" r="5" fill="#FF6B00"/>
    <circle cx="598" cy="450" r="5" fill="#FF6B00"/>
    <!-- inset value curve: ease-in-out (gentle symmetric S) -->
    <line x1="640" y1="426" x2="640" y2="474" stroke="currentColor" stroke-width="1.2" opacity="0.3"/>
    <line x1="640" y1="474" x2="744" y2="474" stroke="currentColor" stroke-width="1.2" opacity="0.3"/>
    <path d="M 640 474 C 690 474 694 426 744 426" fill="none" stroke="#FF6B00" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- slow/fast legend -->
  <text x="250" y="506" font-size="12" fill="currentColor" opacity="0.6">Dots close together = slow &#183; dots spread apart = fast</text>

  <!-- Footer tip (Variant B, left rail) -->
  <rect x="40" y="526" width="720" height="30" fill="none"/>
  <rect x="40" y="526" width="4" height="30" fill="#FF6B00"/>
  <text x="58" y="546" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Ease In / Out is the natural default &#183; humans never start or stop a camera at full speed.</text>
</svg>
