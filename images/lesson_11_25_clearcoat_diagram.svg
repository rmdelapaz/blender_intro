<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="cc-title cc-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="cc-title">Clearcoat two-layer material cross-section</title>
  <desc id="cc-desc">Cross-section of a clearcoat material. A smooth transparent clearcoat layer sits on top of a rough colored base layer. Incoming light produces a sharp glossy highlight from the clearcoat and softer scattered reflections from the rough base beneath it. Each layer has its own independent roughness value.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">CLEARCOAT LAYER</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">A glossy transparent coat over a rough colored base</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ===== Clearcoat layer (smooth transparent, top) ===== -->
  <!-- Coat slab: y=250 to y=300, flat smooth top -->
  <rect x="120" y="250" width="560" height="50" rx="4"
        fill="#4A9EFF" fill-opacity="0.10" stroke="#4A9EFF" stroke-opacity="0.45" stroke-width="1.5"/>
  <line x1="120" y1="250" x2="680" y2="250" stroke="currentColor" stroke-width="2" opacity="0.45"/>
  <text x="694" y="278" font-size="13" font-weight="600" fill="currentColor">Clearcoat</text>
  <text x="694" y="296" font-size="11" fill="currentColor" opacity="0.6">Roughness 0.1</text>

  <!-- ===== Base layer (rough, colored, bottom) ===== -->
  <!-- Base slab body: y=300 to y=430 -->
  <rect x="120" y="300" width="560" height="130" rx="4"
        fill="#4A9EFF" fill-opacity="0.30" stroke="#4A9EFF" stroke-opacity="0.6" stroke-width="1.5"/>
  <!-- Rough interface (jagged) between base top and coat bottom at y=300 -->
  <polyline points="120,300 150,292 180,304 210,294 240,306 270,293 300,303 330,295 360,305 390,292 420,304 450,294 480,306 510,295 540,303 570,293 600,305 630,296 660,304 680,300"
            fill="none" stroke="#4A9EFF" stroke-width="2" stroke-opacity="0.8"/>
  <!-- Color flakes in the base (metallic-flake car-paint cue) -->
  <g fill="#F5C242" opacity="0.85">
    <rect x="200" y="350" width="10" height="5" rx="1" transform="rotate(20 205 352)"/>
    <rect x="320" y="380" width="10" height="5" rx="1" transform="rotate(-15 325 382)"/>
    <rect x="440" y="345" width="10" height="5" rx="1" transform="rotate(35 445 347)"/>
    <rect x="540" y="390" width="10" height="5" rx="1" transform="rotate(-25 545 392)"/>
    <rect x="380" y="410" width="10" height="5" rx="1" transform="rotate(10 385 412)"/>
  </g>
  <text x="694" y="356" font-size="13" font-weight="600" fill="currentColor">Base layer</text>
  <text x="694" y="374" font-size="11" fill="currentColor" opacity="0.6">Roughness 0.6</text>
  <text x="694" y="396" font-size="11" fill="#F5C242" opacity="0.95">Color flakes</text>

  <!-- ===== Incoming light ray (gold) ===== -->
  <line x1="200" y1="150" x2="330" y2="250" stroke="#F5C242" stroke-width="3" stroke-linecap="round"/>
  <polygon points="330,250 318,240 326,234" fill="#F5C242"/>
  <text x="170" y="178" font-size="13" font-weight="600" fill="#F5C242">Incoming light</text>

  <!-- ===== Sharp specular reflection off the clearcoat (tight orange) ===== -->
  <line x1="330" y1="250" x2="460" y2="150" stroke="#FF6B00" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="460,150 448,156 456,166" fill="#FF6B00"/>
  <text x="468" y="150" font-size="13" font-weight="600" fill="#FF6B00">Sharp highlight</text>
  <text x="468" y="168" font-size="11" fill="currentColor" opacity="0.6">from the smooth coat</text>

  <!-- ===== Penetrating ray into the base (continues from coat into base) ===== -->
  <line x1="330" y1="250" x2="360" y2="320" stroke="#F5C242" stroke-width="2" stroke-linecap="round" opacity="0.7" stroke-dasharray="2 4"/>

  <!-- ===== Soft scattered reflections from the rough base (fanned orange) ===== -->
  <g stroke="#FF6B00" stroke-width="2" stroke-linecap="round" opacity="0.55">
    <line x1="360" y1="320" x2="320" y2="232"/>
    <line x1="360" y1="320" x2="370" y2="226"/>
    <line x1="360" y1="320" x2="410" y2="234"/>
  </g>
  <g fill="#FF6B00" opacity="0.55">
    <polygon points="320,232 322,244 330,238"/>
    <polygon points="370,226 364,237 374,237"/>
    <polygon points="410,234 400,236 406,246"/>
  </g>
  <text x="430" y="214" font-size="12" font-weight="600" fill="#FF6B00" opacity="0.9">Soft scattered highlights</text>
  <text x="430" y="231" font-size="11" fill="currentColor" opacity="0.55">from the rough base</text>

  <!-- ===== Key callout: two independent roughness values ===== -->
  <rect x="120" y="470" width="4" height="44" fill="#FF6B00"/>
  <text x="138" y="488" font-size="14" font-weight="700" fill="currentColor">Two independent roughness values</text>
  <text x="138" y="508" font-size="13" fill="currentColor" opacity="0.65">The coat stays glossy (0.1) while the base underneath is rough (0.6) &#183; classic car paint</text>

  <!-- ===== Footer tip (Variant B left rail) ===== -->
  <rect x="40" y="528" width="4" height="24" fill="#FF6B00"/>
  <text x="58" y="545" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> The sharp coat highlight and the soft base sheen appear together, which sells the layered look.
  </text>
</svg>
