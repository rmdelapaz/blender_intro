<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="mnc-title mnc-desc" color="#222" font-family="'Segoe UI',system-ui,sans-serif">
<title id="mnc-title">Mapping node transform controls</title>
<desc id="mnc-desc">A central brick texture with three transforms branching out: Location moves the pattern, Rotation turns it, and Scale resizes it, each shown with a small before-and-after tile.</desc>
<defs>
<marker id="mnc-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#FF6B00"/>
</marker>
<pattern id="mnc-brick" width="24" height="16" patternUnits="userSpaceOnUse">
<rect width="24" height="16" fill="#4A9EFF" fill-opacity="0.18"/>
<rect x="0" y="0" width="24" height="7" fill="none" stroke="#4A9EFF" stroke-width="1"/>
<rect x="0" y="8" width="24" height="7" fill="none" stroke="#4A9EFF" stroke-width="1"/>
<line x1="12" y1="0" x2="12" y2="7" stroke="#4A9EFF" stroke-width="1"/>
<line x1="0" y1="8" x2="0" y2="15" stroke="#4A9EFF" stroke-width="1"/>
<line x1="24" y1="8" x2="24" y2="15" stroke="#4A9EFF" stroke-width="1"/>
</pattern>
<pattern id="mnc-brick-loc" width="24" height="16" patternUnits="userSpaceOnUse" patternTransform="translate(8,5)">
<rect width="24" height="16" fill="#4A9EFF" fill-opacity="0.18"/>
<rect x="0" y="0" width="24" height="7" fill="none" stroke="#4A9EFF" stroke-width="1"/>
<rect x="0" y="8" width="24" height="7" fill="none" stroke="#4A9EFF" stroke-width="1"/>
</pattern>
<pattern id="mnc-brick-rot" width="24" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
<rect width="24" height="16" fill="#4A9EFF" fill-opacity="0.18"/>
<rect x="0" y="0" width="24" height="7" fill="none" stroke="#4A9EFF" stroke-width="1"/>
<rect x="0" y="8" width="24" height="7" fill="none" stroke="#4A9EFF" stroke-width="1"/>
</pattern>
<pattern id="mnc-brick-scl" width="40" height="26" patternUnits="userSpaceOnUse">
<rect width="40" height="26" fill="#4A9EFF" fill-opacity="0.18"/>
<rect x="0" y="0" width="40" height="12" fill="none" stroke="#4A9EFF" stroke-width="1"/>
<rect x="0" y="13" width="40" height="12" fill="none" stroke="#4A9EFF" stroke-width="1"/>
<line x1="20" y1="0" x2="20" y2="12" stroke="#4A9EFF" stroke-width="1"/>
</pattern>
</defs>

<text x="400" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="currentColor">The Mapping Node: Location, Rotation, Scale</text>
<text x="400" y="56" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.75">One node transforms texture coordinates before they reach the texture</text>

<!-- center source tile -->
<g transform="translate(330,250)">
<rect x="0" y="0" width="140" height="100" rx="6" fill="url(#mnc-brick)" stroke="#FF6B00" stroke-width="2"/>
<text x="70" y="125" text-anchor="middle" font-size="12" font-weight="700" fill="#FF6B00">Source Texture</text>
</g>

<!-- LOCATION (top) -->
<line x1="400" y1="245" x2="400" y2="150" stroke="#FF6B00" stroke-width="2" marker-end="url(#mnc-arrow)"/>
<g transform="translate(300,70)">
<rect x="0" y="0" width="200" height="78" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.3"/>
<text x="14" y="22" font-size="14" font-weight="700" fill="#4ADE80">Location</text>
<text x="14" y="40" font-size="11" fill="currentColor" opacity="0.8">Shifts the pattern in X / Y / Z</text>
<rect x="140" y="20" width="48" height="34" rx="3" fill="url(#mnc-brick-loc)" stroke="currentColor" stroke-opacity="0.35"/>
<text x="14" y="62" font-size="10" fill="currentColor" opacity="0.6">offset applied &#8594; tiles slide</text>
</g>

<!-- ROTATION (left) -->
<line x1="325" y1="300" x2="235" y2="300" stroke="#FF6B00" stroke-width="2" marker-end="url(#mnc-arrow)"/>
<g transform="translate(20,255)">
<rect x="0" y="0" width="210" height="90" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.3"/>
<text x="14" y="24" font-size="14" font-weight="700" fill="#B47EE8">Rotation</text>
<text x="14" y="42" font-size="11" fill="currentColor" opacity="0.8">Turns the pattern around an axis</text>
<rect x="150" y="24" width="48" height="34" rx="3" fill="url(#mnc-brick-rot)" stroke="currentColor" stroke-opacity="0.35"/>
<text x="14" y="66" font-size="10" fill="currentColor" opacity="0.6">Z = 30&#176; &#8594; rows tilt</text>
<path d="M120 70 a20 20 0 1 1 -14 -6" fill="none" stroke="#B47EE8" stroke-width="2" marker-end="url(#mnc-arrow)"/>
</g>

<!-- SCALE (right) -->
<line x1="475" y1="300" x2="565" y2="300" stroke="#FF6B00" stroke-width="2" marker-end="url(#mnc-arrow)"/>
<g transform="translate(570,255)">
<rect x="0" y="0" width="210" height="90" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.3"/>
<text x="14" y="24" font-size="14" font-weight="700" fill="#F5C242">Scale</text>
<text x="14" y="42" font-size="11" fill="currentColor" opacity="0.8">Resizes the pattern (tiling)</text>
<rect x="150" y="22" width="50" height="36" rx="3" fill="url(#mnc-brick-scl)" stroke="currentColor" stroke-opacity="0.35"/>
<text x="14" y="66" font-size="10" fill="currentColor" opacity="0.6">value &#60;1 &#8594; fewer, larger bricks</text>
</g>

<!-- bottom note -->
<g transform="translate(300,470)">
<rect x="-176" y="0" width="552" height="86" rx="10" fill="#4A9EFF" fill-opacity="0.08" stroke="#4A9EFF" stroke-opacity="0.4"/>
<text x="100" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#4A9EFF">Order matters</text>
<text x="100" y="50" text-anchor="middle" font-size="11.5" fill="currentColor" opacity="0.85">Feed Texture Coordinate &#8594; Mapping &#8594; Texture. The Mapping node</text>
<text x="100" y="68" text-anchor="middle" font-size="11.5" fill="currentColor" opacity="0.85">applies Scale, then Rotation, then Location to the coordinates.</text>
</g>
</svg>
