<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="ppwTitle ppwDesc" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" color="#222">
  <title id="ppwTitle">The Post-Processing Workflow</title>
  <desc id="ppwDesc">A left-to-right pipeline: raw render feeds compositing, then render-pass integration, color correction, effects and enhancement, and final adjustments to the delivered image.</desc>
  <style>
    .stg{fill:#2a2a2a;stroke:#4A9EFF;stroke-width:1.5;}
    .num{fill:#4A9EFF;font-size:13px;font-weight:700;}
    .lbl{fill:#d4d4d4;font-size:14px;font-weight:700;}
    .sub{fill:#9aa4b2;font-size:11px;}
    .arw{fill:#FF6B00;}
    .hd{fill:currentColor;font-size:19px;font-weight:700;}
  </style>
  <text x="20" y="34" class="hd">Post-Processing Pipeline</text>
  <text x="20" y="56" class="sub">Each stage builds on the last &#8212; work from technical base toward creative finish.</text>

  <!-- 6 stages -->
  <g>
    <rect class="stg" x="20"  y="88" width="110" height="120" rx="9"/>
    <text x="34" y="112" class="num">01</text>
    <text x="34" y="140" class="lbl">Raw</text>
    <text x="34" y="158" class="lbl">Render</text>
    <text x="34" y="182" class="sub">Straight from</text>
    <text x="34" y="196" class="sub">the engine</text>
  </g>
  <g>
    <rect class="stg" x="150" y="88" width="110" height="120" rx="9"/>
    <text x="164" y="112" class="num">02</text>
    <text x="164" y="140" class="lbl">Composite</text>
    <text x="164" y="182" class="sub">Node graph</text>
    <text x="164" y="196" class="sub">assembly</text>
  </g>
  <g>
    <rect class="stg" x="280" y="88" width="110" height="120" rx="9"/>
    <text x="294" y="112" class="num">03</text>
    <text x="294" y="140" class="lbl">Passes</text>
    <text x="294" y="182" class="sub">Isolate &amp;</text>
    <text x="294" y="196" class="sub">recombine</text>
  </g>
  <g>
    <rect class="stg" x="410" y="88" width="110" height="120" rx="9"/>
    <text x="424" y="112" class="num">04</text>
    <text x="424" y="140" class="lbl">Color</text>
    <text x="424" y="182" class="sub">Correct then</text>
    <text x="424" y="196" class="sub">grade</text>
  </g>
  <g>
    <rect class="stg" x="540" y="88" width="110" height="120" rx="9"/>
    <text x="554" y="112" class="num">05</text>
    <text x="554" y="140" class="lbl">Effects</text>
    <text x="554" y="182" class="sub">Glow, fog,</text>
    <text x="554" y="196" class="sub">grain</text>
  </g>
  <g>
    <rect class="stg" x="670" y="88" width="72" height="120" rx="9" stroke="#4ADE80"/>
    <text x="684" y="112" class="num" fill="#4ADE80">06</text>
    <text x="684" y="140" class="lbl" fill="#4ADE80">Final</text>
    <text x="684" y="182" class="sub">Deliver</text>
  </g>

  <!-- arrows -->
  <g class="arw">
    <path d="M132 148 l16 0 l0 -6 l10 8 l-10 8 l0 -6 l-16 0 z"/>
    <path d="M262 148 l16 0 l0 -6 l10 8 l-10 8 l0 -6 l-16 0 z"/>
    <path d="M392 148 l16 0 l0 -6 l10 8 l-10 8 l0 -6 l-16 0 z"/>
    <path d="M522 148 l16 0 l0 -6 l10 8 l-10 8 l0 -6 l-16 0 z"/>
    <path d="M652 148 l16 0 l0 -6 l10 8 l-10 8 l0 -6 l-16 0 z"/>
  </g>

  <rect x="20" y="232" width="722" height="46" rx="8" fill="#2a2a2a" stroke="#F5C242" stroke-width="1"/>
  <text x="34" y="252" class="sub" fill="#F5C242" font-weight="700">Rule of thumb</text>
  <text x="34" y="270" class="sub">Fix technical problems early (stages 1&#8211;3); make creative choices late (stages 4&#8211;6). Never grade on top of uncorrected color.</text>
</svg>
