<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="psg-title psg-desc" color="#222">
<title id="psg-title">Procedural Texture Scale Guide</title>
<desc id="psg-desc">Reference of four noise scale ranges from large features at 0.5 to 2 down to micro detail at 100 or more, each row pairing the range and its use case with a swatch whose pattern grows finer as the scale rises.</desc>
<defs>
<filter id="n1"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="4"/><feColorMatrix type="saturate" values="0"/></filter>
<filter id="n2"><feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="2" seed="7"/><feColorMatrix type="saturate" values="0"/></filter>
<filter id="n3"><feTurbulence type="fractalNoise" baseFrequency="0.22" numOctaves="3" seed="2"/><feColorMatrix type="saturate" values="0"/></filter>
<filter id="n4"><feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="3" seed="9"/><feColorMatrix type="saturate" values="0"/></filter>
</defs>
<style>
.lbl{fill:currentColor;font-family:'Segoe UI',Arial,sans-serif;}
.hd{font-size:26px;font-weight:700;}
.rng{font-size:24px;font-weight:700;font-family:Consolas,'Courier New',monospace;}
.use{font-size:17px;font-weight:600;}
.dsc{font-size:12px;fill:currentColor;opacity:.7;}
.sw{stroke:currentColor;stroke-width:1.5;}
.rl{stroke:currentColor;stroke-width:1;opacity:.2;}
</style>
<text x="400" y="42" text-anchor="middle" class="lbl hd">Procedural Texture Scale Guide</text>
<text x="400" y="68" text-anchor="middle" class="lbl dsc" style="opacity:.8">Pick the scale to match the size of the feature you want</text>

<!-- ROW 1 -->
<g transform="translate(0,100)">
<rect x="60" y="0" width="90" height="90" class="sw" fill="#888"/><rect x="60" y="0" width="90" height="90" filter="url(#n1)" opacity=".9"/>
<text x="190" y="34" class="lbl rng" fill="#4A9EFF">0.5-2</text>
<text x="190" y="60" class="lbl use">Large Features</text>
<text x="190" y="80" class="lbl dsc">broad colour patches, overall variation</text>
<line x1="60" y1="106" x2="740" y2="106" class="rl"/>
</g>
<!-- ROW 2 -->
<g transform="translate(0,208)">
<rect x="60" y="0" width="90" height="90" class="sw" fill="#888"/><rect x="60" y="0" width="90" height="90" filter="url(#n2)" opacity=".9"/>
<text x="190" y="34" class="lbl rng" fill="#4ADE80">3-10</text>
<text x="190" y="60" class="lbl use">Medium Features</text>
<text x="190" y="80" class="lbl dsc">the primary readable texture</text>
<line x1="60" y1="106" x2="740" y2="106" class="rl"/>
</g>
<!-- ROW 3 -->
<g transform="translate(0,316)">
<rect x="60" y="0" width="90" height="90" class="sw" fill="#888"/><rect x="60" y="0" width="90" height="90" filter="url(#n3)" opacity=".9"/>
<text x="190" y="34" class="lbl rng" fill="#F5C242">15-50</text>
<text x="190" y="60" class="lbl use">Fine Details</text>
<text x="190" y="80" class="lbl dsc">surface grain and small breakup</text>
<line x1="60" y1="106" x2="740" y2="106" class="rl"/>
</g>
<!-- ROW 4 -->
<g transform="translate(0,424)">
<rect x="60" y="0" width="90" height="90" class="sw" fill="#888"/><rect x="60" y="0" width="90" height="90" filter="url(#n4)" opacity=".9"/>
<text x="190" y="34" class="lbl rng" fill="#B47EE8">100+</text>
<text x="190" y="60" class="lbl use">Micro Detail</text>
<text x="190" y="80" class="lbl dsc">near-imperceptible roughness variation</text>
</g>
</svg>
