<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" color="#222" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" role="img" aria-labelledby="ce49-t ce49-d">
  <title id="ce49-t">Cycles vs. Eevee: The Right Tool for the Job</title>
  <desc id="ce49-d">A side-by-side comparison of Blender's two render engines: Eevee is fast and interactive for previewing and iterating, while Cycles is physically accurate for the final render &#8212; the workflow being to model and light in Eevee, then render the final in Cycles.</desc>
  <rect x="0" y="0" width="760" height="400" fill="none"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="currentColor">Two Engines, One Workflow</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#8a8f98">Iterate fast in Eevee &#8212; deliver accurate in Cycles</text>

  <!-- EEVEE card -->
  <rect x="46" y="86" width="300" height="252" rx="10" fill="#1a1a1a" stroke="#4A9EFF" stroke-width="1.8"/>
  <text x="196" y="118" text-anchor="middle" font-size="17" font-weight="700" fill="#4A9EFF">Eevee</text>
  <text x="196" y="139" text-anchor="middle" font-size="12" fill="#8a8f98">Rasterizer &#183; real-time</text>
  <text x="70" y="174" font-size="12.5" fill="#4ADE80">+ Near-instant viewport feedback</text>
  <text x="70" y="199" font-size="12.5" fill="#4ADE80">+ Fast look-dev &amp; blocking</text>
  <text x="70" y="224" font-size="12.5" fill="#4ADE80">+ Great for animation previews</text>
  <text x="70" y="253" font-size="12.5" fill="#E63946">&#8722; Approximate light &amp; reflections</text>
  <text x="70" y="278" font-size="12.5" fill="#E63946">&#8722; Fakes GI, caustics, refraction</text>
  <rect x="70" y="296" width="252" height="30" rx="6" fill="#1a1a1a" stroke="#4A9EFF" stroke-width="1"/>
  <text x="196" y="316" text-anchor="middle" font-size="12" fill="#c9ccd1">Use while: modeling, lighting, iterating</text>

  <!-- handoff arrow -->
  <g>
    <line x1="356" y1="212" x2="404" y2="212" stroke="#F5C242" stroke-width="2.4"/>
    <path d="M404,212 l-10,-6 l0,12 z" fill="#F5C242"/>
    <text x="380" y="196" text-anchor="middle" font-size="11" font-weight="700" fill="#F5C242">handoff</text>
    <text x="380" y="236" text-anchor="middle" font-size="10" fill="#8a8f98">when the</text>
    <text x="380" y="249" text-anchor="middle" font-size="10" fill="#8a8f98">look is set</text>
  </g>

  <!-- CYCLES card -->
  <rect x="414" y="86" width="300" height="252" rx="10" fill="#1a1a1a" stroke="#FF6B00" stroke-width="1.8"/>
  <text x="564" y="118" text-anchor="middle" font-size="17" font-weight="700" fill="#FF6B00">Cycles</text>
  <text x="564" y="139" text-anchor="middle" font-size="12" fill="#8a8f98">Path tracer &#183; physically based</text>
  <text x="438" y="174" font-size="12.5" fill="#4ADE80">+ Accurate global illumination</text>
  <text x="438" y="199" font-size="12.5" fill="#4ADE80">+ True reflection, refraction, caustics</text>
  <text x="438" y="224" font-size="12.5" fill="#4ADE80">+ Photoreal final quality</text>
  <text x="438" y="253" font-size="12.5" fill="#E63946">&#8722; Slower &#183; needs denoising</text>
  <text x="438" y="278" font-size="12.5" fill="#E63946">&#8722; Sample noise on hard light paths</text>
  <rect x="438" y="296" width="252" height="30" rx="6" fill="#1a1a1a" stroke="#FF6B00" stroke-width="1"/>
  <text x="564" y="316" text-anchor="middle" font-size="12" fill="#c9ccd1">Use for: the final delivered render</text>

  <text x="380" y="366" text-anchor="middle" font-size="12.5" fill="#c9ccd1">Rule of thumb &#8212; check the shot in Eevee, commit the frame in Cycles.</text>
</svg>
