<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="cw-title cw-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="cw-title">Color wheel and harmony schemes</title>
  <desc id="cw-desc">A twelve-hue color wheel on the left with a complementary pair connected through the center. On the right, four harmony schemes are listed with small indicator diagrams: complementary uses opposite hues, analogous uses neighbours, triadic uses three evenly spaced hues, and split-complementary uses a base hue plus the two neighbours of its opposite.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">COLOR WHEEL &amp; HARMONY</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Twelve hues &#183; four reliable ways to combine them</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ============ Wheel (left) ============ -->
  <!-- center 280,330 R150 r70 -->
  <!-- 12 hue wedges -->
  <path d="M 241.2 185.1 A 150 150 0 0 1 318.8 185.1 L 298.1 262.4 A 70 70 0 0 0 261.9 262.4 Z" fill="#E63946"/>
  <path d="M 318.8 185.1 A 150 150 0 0 1 386.1 223.9 L 329.5 280.5 A 70 70 0 0 0 298.1 262.4 Z" fill="#F0612F"/>
  <path d="M 386.1 223.9 A 150 150 0 0 1 424.9 291.2 L 347.6 311.9 A 70 70 0 0 0 329.5 280.5 Z" fill="#FF8C00"/>
  <path d="M 424.9 291.2 A 150 150 0 0 1 424.9 368.8 L 347.6 348.1 A 70 70 0 0 0 347.6 311.9 Z" fill="#FFB200"/>
  <path d="M 424.9 368.8 A 150 150 0 0 1 386.1 436.1 L 329.5 379.5 A 70 70 0 0 0 347.6 348.1 Z" fill="#FFD700"/>
  <path d="M 386.1 436.1 A 150 150 0 0 1 318.8 474.9 L 298.1 397.6 A 70 70 0 0 0 329.5 379.5 Z" fill="#9ACD32"/>
  <path d="M 318.8 474.9 A 150 150 0 0 1 241.2 474.9 L 261.9 397.6 A 70 70 0 0 0 298.1 397.6 Z" fill="#4ADE80"/>
  <path d="M 241.2 474.9 A 150 150 0 0 1 173.9 436.1 L 230.5 379.5 A 70 70 0 0 0 261.9 397.6 Z" fill="#1FB6B6"/>
  <path d="M 173.9 436.1 A 150 150 0 0 1 135.1 368.8 L 212.4 348.1 A 70 70 0 0 0 230.5 379.5 Z" fill="#4A9EFF"/>
  <path d="M 135.1 368.8 A 150 150 0 0 1 135.1 291.2 L 212.4 311.9 A 70 70 0 0 0 212.4 348.1 Z" fill="#6A5ACD"/>
  <path d="M 135.1 291.2 A 150 150 0 0 1 173.9 223.9 L 230.5 280.5 A 70 70 0 0 0 212.4 311.9 Z" fill="#9B5DE5"/>
  <path d="M 173.9 223.9 A 150 150 0 0 1 241.2 185.1 L 261.9 262.4 A 70 70 0 0 0 230.5 280.5 Z" fill="#D6539C"/>

  <!-- Complementary connector through center: hue 0 (red, top) to hue 6 (green, bottom) -->
  <g>
    <line x1="280" y1="266" x2="280" y2="394" stroke="currentColor" stroke-width="2.5" opacity="0.55"/>
    <circle cx="280" cy="220" r="11" fill="#ffffff" stroke="currentColor" stroke-opacity="0.5" stroke-width="2"/>
    <circle cx="280" cy="440" r="11" fill="#ffffff" stroke="currentColor" stroke-opacity="0.5" stroke-width="2"/>
  </g>
  <text x="280" y="334" font-size="12" fill="currentColor" opacity="0.7" text-anchor="middle">complementary</text>
  <text x="280" y="500" font-size="13" fill="currentColor" opacity="0.65" text-anchor="middle">12-hue wheel</text>

  <!-- ============ Scheme legend with mini indicators (right) ============ -->
  <!-- each row: a small 56px wheel-ring with marker dots + label -->

  <!-- helper geometry: mini ring center varies; markers at hue angles -->
  <!-- Row 1: Complementary (opposite) -->
  <g transform="translate(500,170)">
    <circle cx="28" cy="28" r="26" fill="none" stroke="currentColor" stroke-opacity="0.25" stroke-width="8"/>
    <circle cx="28" cy="2"  r="6" fill="#E63946"/>
    <circle cx="28" cy="54" r="6" fill="#4ADE80"/>
    <line x1="28" y1="8" x2="28" y2="48" stroke="currentColor" stroke-opacity="0.4" stroke-width="2"/>
  </g>
  <text x="566" y="188" font-size="15" font-weight="600" fill="currentColor">Complementary</text>
  <text x="566" y="208" font-size="12" fill="currentColor" opacity="0.6">Opposite hues &#183; vivid contrast</text>

  <!-- Row 2: Analogous (neighbours) -->
  <g transform="translate(500,250)">
    <circle cx="28" cy="28" r="26" fill="none" stroke="currentColor" stroke-opacity="0.25" stroke-width="8"/>
    <circle cx="28" cy="2"  r="6" fill="#FF8C00"/>
    <circle cx="5"  cy="15" r="6" fill="#E63946"/>
    <circle cx="51" cy="15" r="6" fill="#FFD700"/>
  </g>
  <text x="566" y="268" font-size="15" font-weight="600" fill="currentColor">Analogous</text>
  <text x="566" y="288" font-size="12" fill="currentColor" opacity="0.6">Neighbour hues &#183; calm, natural</text>

  <!-- Row 3: Triadic (3 evenly spaced) -->
  <g transform="translate(500,330)">
    <circle cx="28" cy="28" r="26" fill="none" stroke="currentColor" stroke-opacity="0.25" stroke-width="8"/>
    <circle cx="28" cy="2"  r="6" fill="#E63946"/>
    <circle cx="50" cy="42" r="6" fill="#FFD700"/>
    <circle cx="6"  cy="42" r="6" fill="#4A9EFF"/>
    <polygon points="28,8 45,38 11,38" fill="none" stroke="currentColor" stroke-opacity="0.4" stroke-width="2"/>
  </g>
  <text x="566" y="348" font-size="15" font-weight="600" fill="currentColor">Triadic</text>
  <text x="566" y="368" font-size="12" fill="currentColor" opacity="0.6">Three evenly spaced &#183; vibrant</text>

  <!-- Row 4: Split-complementary -->
  <g transform="translate(500,410)">
    <circle cx="28" cy="28" r="26" fill="none" stroke="currentColor" stroke-opacity="0.25" stroke-width="8"/>
    <circle cx="28" cy="2"  r="6" fill="#E63946"/>
    <circle cx="9"  cy="48" r="6" fill="#1FB6B6"/>
    <circle cx="47" cy="48" r="6" fill="#9ACD32"/>
    <line x1="28" y1="8" x2="14" y2="43" stroke="currentColor" stroke-opacity="0.4" stroke-width="2"/>
    <line x1="28" y1="8" x2="42" y2="43" stroke="currentColor" stroke-opacity="0.4" stroke-width="2"/>
  </g>
  <text x="566" y="428" font-size="15" font-weight="600" fill="currentColor">Split-complementary</text>
  <text x="566" y="448" font-size="12" fill="currentColor" opacity="0.6">Base + its opposite's neighbours</text>

  <!-- Footer tip callout (Variant B, left rail) -->
  <rect x="40" y="641" width="720" height="34" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Let one hue dominate and use its harmony partner as an accent, not a 50/50 split.
  </text>
</svg>
