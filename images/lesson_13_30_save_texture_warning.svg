<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420"
     role="img" aria-labelledby="sw-title sw-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
    <title id="sw-title">Save your texture warning</title>
    <desc id="sw-desc">A warning graphic stressing that painted textures must be saved separately. Saving the blend file does not save textures. An unsaved texture shows an asterisk after its name in the Image Editor header, for example Chest underscore Color followed by an asterisk meaning unsaved. To save it, use the Image menu then Save, choosing PNG. The warning side is marked in red and the save action in green.</desc>
    <!-- Top warning accent -->
    <rect x="0" y="0" width="800" height="3" fill="#E63946"/>
    <!-- Warning header: icon + headline -->
    <g>
        <!-- Triangle warning icon -->
        <path d="M 60 78 L 96 16 L 132 78 Z" fill="none" stroke="#E63946" stroke-width="4" stroke-linejoin="round"/>
        <rect x="93" y="38" width="6" height="22" rx="3" fill="#E63946"/>
        <circle cx="96" cy="69" r="3.5" fill="#E63946"/>
        <text x="160" y="46" font-size="30" font-weight="800" fill="#E63946">SAVE YOUR TEXTURE!</text>
        <text x="160" y="74" font-size="15" font-weight="600" fill="currentColor">Saving the .blend file does <tspan font-weight="800" fill="#E63946">NOT</tspan> save your painted textures.</text>
    </g>
    <line x1="40" y1="100" x2="760" y2="100" stroke="currentColor" stroke-width="1" opacity="0.15"/>
    <!-- Problem band: the unsaved asterisk -->
    <g>
        <rect x="40" y="124" width="340" height="148" rx="10" fill="#E63946" fill-opacity="0.07" stroke="#E63946" stroke-width="1.5"/>
        <rect x="40" y="124" width="5" height="148" rx="2.5" fill="#E63946"/>
        <text x="64" y="156" font-size="13" font-weight="700" fill="#E63946">THE WARNING SIGN</text>
        <text x="64" y="184" font-size="14" fill="currentColor">An unsaved texture shows an asterisk</text>
        <text x="64" y="204" font-size="14" fill="currentColor">after its name in the Image Editor header:</text>
        <!-- Mock header chip showing unsaved name -->
        <rect x="64" y="220" width="292" height="38" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>
        <rect x="76" y="231" width="16" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.6"/>
        <text x="104" y="244" font-size="16" font-weight="700" fill="currentColor" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">Chest_Color<tspan font-size="22" font-weight="800" fill="#E63946">*</tspan></text>
        <text x="296" y="244" font-size="11" font-weight="700" fill="#E63946">= UNSAVED</text>
    </g>
    <!-- Save action band: the fix -->
    <g>
        <rect x="420" y="124" width="340" height="148" rx="10" fill="#4ADE80" fill-opacity="0.10" stroke="#4ADE80" stroke-width="1.5"/>
        <rect x="420" y="124" width="5" height="148" rx="2.5" fill="#4ADE80"/>
        <text x="444" y="156" font-size="13" font-weight="700" fill="currentColor">HOW TO SAVE IT</text>
        <!-- Menu path: Image -> Save -->
        <g font-size="15" font-weight="700">
            <rect x="444" y="172" width="74" height="32" rx="6" fill="#FF6B00" fill-opacity="0.12" stroke="#FF6B00" stroke-width="1.5"/>
            <text x="481" y="193" text-anchor="middle" fill="#FF6B00">Image</text>
            <text x="532" y="193" text-anchor="middle" font-size="18" fill="#FF6B00">&#8594;</text>
            <rect x="546" y="172" width="70" height="32" rx="6" fill="#FF6B00" fill-opacity="0.12" stroke="#FF6B00" stroke-width="1.5"/>
            <text x="581" y="193" text-anchor="middle" fill="#FF6B00">Save</text>
        </g>
        <text x="444" y="232" font-size="13" fill="currentColor" opacity="0.85">Or <tspan font-weight="700">Save As</tspan> to pick a location and name.</text>
        <text x="444" y="254" font-size="13" fill="currentColor" opacity="0.85">Choose <tspan font-weight="700">PNG</tspan> &#183; do this the first time you paint.</text>
    </g>
    <!-- Footer reinforcement -->
    <rect x="40" y="300" width="720" height="80" rx="10" fill="#E63946" fill-opacity="0.05"/>
    <rect x="40" y="300" width="720" height="80" rx="10" fill="none" stroke="#E63946" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="400" y="334" text-anchor="middle" font-size="17" font-weight="800" fill="#E63946">No asterisk = saved. Asterisk = you can still lose your work.</text>
    <text x="400" y="362" text-anchor="middle" font-size="13" fill="currentColor">Optional: Edit &#8594; Preferences &#8594; File Paths enables auto-save with the .blend &#183; but always save manually first.</text>
</svg>
