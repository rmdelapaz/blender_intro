<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="tc-title tc-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="tc-title">Retopology method comparison matrix</title>
  <desc id="tc-desc">A comparison table of five retopology methods: Manual, Voxel Remesh, Quad Remesh, Instant Meshes, and a Hybrid approach. Columns rate output quality and speed and list what each method is best for and its main limitation. The hybrid approach row is highlighted as the recommended professional workflow.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Choosing a Retopology Method</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Quality and speed are a trade-off &#183; pick by asset role, not habit</text>

  <!-- Column headers -->
  <g font-size="13" font-weight="700" fill="currentColor">
    <text x="40"  y="128">Method</text>
    <text x="250" y="128" text-anchor="middle">Quality</text>
    <text x="378" y="128" text-anchor="middle">Speed</text>
    <text x="470" y="128">Best for</text>
    <text x="650" y="128">Limitation</text>
  </g>
  <line x1="40" y1="140" x2="760" y2="140" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>

  <!-- Row geometry: 5 rows, height 70, start y=152 -->
  <!-- Reusable star/bolt rendered explicitly per row for control -->

  <!-- Row 1: Manual -->
  <g>
    <text x="40" y="183" font-size="14" font-weight="600" fill="currentColor">Manual retopo</text>
    <text x="40" y="203" font-size="12" fill="currentColor" opacity="0.55">Poly Build, by hand</text>
    <!-- quality 5/5 -->
    <g fill="#FF6B00"><circle cx="210" cy="190" r="5"/><circle cx="230" cy="190" r="5"/><circle cx="250" cy="190" r="5"/><circle cx="270" cy="190" r="5"/><circle cx="290" cy="190" r="5"/></g>
    <!-- speed 1/3 -->
    <g><circle cx="358" cy="190" r="5" fill="#FF6B00"/><circle cx="378" cy="190" r="5" fill="currentColor" opacity="0.18"/><circle cx="398" cy="190" r="5" fill="currentColor" opacity="0.18"/></g>
    <text x="470" y="194" font-size="13" fill="currentColor">Hero assets, animation</text>
    <text x="650" y="194" font-size="13" fill="currentColor" opacity="0.75">Time intensive</text>
  </g>
  <line x1="40" y1="222" x2="760" y2="222" stroke="currentColor" stroke-width="1" opacity="0.12"/>

  <!-- Row 2: Voxel Remesh -->
  <g>
    <text x="40" y="253" font-size="14" font-weight="600" fill="currentColor">Voxel Remesh</text>
    <text x="40" y="273" font-size="12" fill="currentColor" opacity="0.55">Uniform rebuild</text>
    <g><circle cx="240" cy="260" r="5" fill="#FF6B00"/><circle cx="260" cy="260" r="5" fill="#FF6B00"/><circle cx="280" cy="260" r="5" fill="currentColor" opacity="0.18"/></g>
    <g fill="#FF6B00"><circle cx="358" cy="260" r="5"/><circle cx="378" cy="260" r="5"/><circle cx="398" cy="260" r="5"/></g>
    <text x="470" y="264" font-size="13" fill="currentColor">Quick cleanup, blockout</text>
    <text x="650" y="264" font-size="13" fill="currentColor" opacity="0.75">Triangles, no flow</text>
  </g>
  <line x1="40" y1="292" x2="760" y2="292" stroke="currentColor" stroke-width="1" opacity="0.12"/>

  <!-- Row 3: Quad Remesh -->
  <g>
    <text x="40" y="323" font-size="14" font-weight="600" fill="currentColor">Quad Remesh</text>
    <text x="40" y="343" font-size="12" fill="currentColor" opacity="0.55">Auto quad pass</text>
    <g><circle cx="220" cy="330" r="5" fill="#FF6B00"/><circle cx="240" cy="330" r="5" fill="#FF6B00"/><circle cx="260" cy="330" r="5" fill="#FF6B00"/><circle cx="280" cy="330" r="5" fill="#FF6B00"/><circle cx="300" cy="330" r="5" fill="currentColor" opacity="0.18"/></g>
    <g><circle cx="358" cy="330" r="5" fill="#FF6B00"/><circle cx="378" cy="330" r="5" fill="#FF6B00"/><circle cx="398" cy="330" r="5" fill="currentColor" opacity="0.18"/></g>
    <text x="470" y="334" font-size="13" fill="currentColor">General use, characters</text>
    <text x="650" y="334" font-size="13" fill="currentColor" opacity="0.75">Needs cleanup</text>
  </g>
  <line x1="40" y1="352" x2="760" y2="352" stroke="currentColor" stroke-width="1" opacity="0.12"/>

  <!-- Row 4: Instant Meshes -->
  <g>
    <text x="40" y="383" font-size="14" font-weight="600" fill="currentColor">Instant Meshes</text>
    <text x="40" y="403" font-size="12" fill="currentColor" opacity="0.55">External, field-guided</text>
    <g fill="#FF6B00"><circle cx="210" cy="390" r="5"/><circle cx="230" cy="390" r="5"/><circle cx="250" cy="390" r="5"/><circle cx="270" cy="390" r="5"/><circle cx="290" cy="390" r="5"/></g>
    <g><circle cx="358" cy="390" r="5" fill="#FF6B00"/><circle cx="378" cy="390" r="5" fill="#FF6B00"/><circle cx="398" cy="390" r="5" fill="currentColor" opacity="0.18"/></g>
    <text x="470" y="394" font-size="13" fill="currentColor">Complex organic models</text>
    <text x="650" y="394" font-size="13" fill="currentColor" opacity="0.75">External tool</text>
  </g>
  <line x1="40" y1="412" x2="760" y2="412" stroke="currentColor" stroke-width="1" opacity="0.12"/>

  <!-- Row 5: Hybrid (highlighted) -->
  <g>
    <rect x="32" y="420" width="736" height="60" rx="8" fill="#FF6B00" fill-opacity="0.10" stroke="#FF6B00" stroke-width="1.5"/>
    <text x="40" y="451" font-size="14" font-weight="700" fill="#FF6B00">Hybrid approach</text>
    <text x="40" y="470" font-size="12" fill="currentColor" opacity="0.6">Auto pass + manual fix</text>
    <g fill="#FF6B00"><circle cx="210" cy="458" r="5"/><circle cx="230" cy="458" r="5"/><circle cx="250" cy="458" r="5"/><circle cx="270" cy="458" r="5"/><circle cx="290" cy="458" r="5"/></g>
    <g><circle cx="358" cy="458" r="5" fill="#FF6B00"/><circle cx="378" cy="458" r="5" fill="#FF6B00"/><circle cx="398" cy="458" r="5" fill="currentColor" opacity="0.18"/></g>
    <text x="470" y="462" font-size="13" fill="currentColor">Professional production</text>
    <text x="650" y="462" font-size="13" fill="currentColor" opacity="0.75">Requires skill</text>
  </g>

  <!-- Legend -->
  <g font-size="12" fill="currentColor" opacity="0.7">
    <circle cx="46" cy="508" r="5" fill="#FF6B00"/>
    <text x="58" y="512">Quality / speed rating</text>
    <circle cx="240" cy="508" r="5" fill="currentColor" opacity="0.18"/>
    <text x="252" y="512" opacity="1">Unfilled = lower rating</text>
  </g>

  <!-- Footer tip -->
  <rect x="40" y="530" width="4" height="22" fill="#FF6B00"/>
  <text x="58" y="546" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Rule of thumb:</tspan> automate the bulk, then hand-fix the loops that deform.
  </text>
</svg>
