<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="mo-title mo-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" color="#222">
  <title id="mo-title">Object versus mesh data</title>
  <desc id="mo-desc">A split panel comparing the two layers that make up a 3D object in Blender. The left side shows the object layer with location, rotation, scale, and name properties. The right side shows the mesh data layer with vertices, edges, and faces. A vs badge sits at the center of a vertical divider.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <text x="400" y="56" text-anchor="middle" font-size="24" font-weight="700" fill="currentColor">OBJECT vs MESH DATA</text>
  <text x="400" y="84" text-anchor="middle" font-size="14" fill="currentColor" opacity="0.65">Two layers make up every 3D object in Blender.</text>
  <line x1="120" y1="108" x2="680" y2="108" stroke="currentColor" stroke-width="1" stroke-opacity="0.25"/>
  <text x="400" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#FF6B00" letter-spacing="2">ONE OBJECT, TWO LAYERS</text>

  <!-- Side headers -->
  <text x="200" y="170" text-anchor="middle" font-size="16" font-weight="700" fill="#4A9EFF" letter-spacing="2">OBJECT</text>
  <text x="200" y="187" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.65">The container</text>
  <text x="600" y="170" text-anchor="middle" font-size="16" font-weight="700" fill="#FF6B00" letter-spacing="2">MESH DATA</text>
  <text x="600" y="187" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.65">The geometry</text>

  <!-- Vertical divider dashed -->
  <line x1="400" y1="155" x2="400" y2="295" stroke="currentColor" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 4"/>
  <line x1="400" y1="335" x2="400" y2="475" stroke="currentColor" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 4"/>

  <!-- vs badge -->
  <circle cx="400" cy="315" r="20" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1" stroke-opacity="0.4"/>
  <text x="400" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor" opacity="0.7">vs</text>

  <!-- ===== LEFT: OBJECT ===== -->
  <!-- Connectors first (under tags and cube) -->
  <line x1="150" y1="236" x2="212" y2="303" stroke="#4A9EFF" stroke-width="1" stroke-opacity="0.55" stroke-dasharray="4 3"/>
  <line x1="250" y1="236" x2="212" y2="303" stroke="#4A9EFF" stroke-width="1" stroke-opacity="0.55" stroke-dasharray="4 3"/>
  <line x1="150" y1="395" x2="212" y2="303" stroke="#4A9EFF" stroke-width="1" stroke-opacity="0.55" stroke-dasharray="4 3"/>
  <line x1="250" y1="395" x2="212" y2="303" stroke="#4A9EFF" stroke-width="1" stroke-opacity="0.55" stroke-dasharray="4 3"/>

  <!-- Left cube -->
  <polygon points="150,265 175,240 275,240 250,265" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.8" stroke-opacity="0.7"/>
  <polygon points="250,265 275,240 275,340 250,365" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.8" stroke-opacity="0.7"/>
  <rect x="150" y="265" width="100" height="100" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.8" stroke-opacity="0.85"/>
  <!-- Origin dot (blue) at slight 3D center -->
  <circle cx="212" cy="303" r="5" fill="#4A9EFF"/>
  <circle cx="212" cy="303" r="9" fill="none" stroke="#4A9EFF" stroke-width="1" stroke-opacity="0.5"/>
  <text x="225" y="307" font-size="10" font-weight="700" fill="#4A9EFF">origin</text>

  <!-- Left tags -->
  <g>
    <rect x="20" y="200" width="130" height="36" rx="6" fill="currentColor" fill-opacity="0.04" stroke="#4A9EFF" stroke-width="1" stroke-opacity="0.5"/>
    <text x="30" y="216" font-size="12" font-weight="700" fill="#4A9EFF">Location</text>
    <text x="30" y="230" font-size="10" fill="currentColor" opacity="0.7">X, Y, Z position</text>
  </g>
  <g>
    <rect x="250" y="200" width="130" height="36" rx="6" fill="currentColor" fill-opacity="0.04" stroke="#4A9EFF" stroke-width="1" stroke-opacity="0.5"/>
    <text x="260" y="216" font-size="12" font-weight="700" fill="#4A9EFF">Rotation</text>
    <text x="260" y="230" font-size="10" fill="currentColor" opacity="0.7">X, Y, Z angles</text>
  </g>
  <g>
    <rect x="20" y="395" width="130" height="36" rx="6" fill="currentColor" fill-opacity="0.04" stroke="#4A9EFF" stroke-width="1" stroke-opacity="0.5"/>
    <text x="30" y="411" font-size="12" font-weight="700" fill="#4A9EFF">Scale</text>
    <text x="30" y="425" font-size="10" fill="currentColor" opacity="0.7">X, Y, Z factors</text>
  </g>
  <g>
    <rect x="250" y="395" width="130" height="36" rx="6" fill="currentColor" fill-opacity="0.04" stroke="#4A9EFF" stroke-width="1" stroke-opacity="0.5"/>
    <text x="260" y="411" font-size="12" font-weight="700" fill="#4A9EFF">Name</text>
    <text x="260" y="425" font-size="10" fill="currentColor" opacity="0.7">Identifier label</text>
  </g>

  <!-- ===== RIGHT: MESH DATA ===== -->
  <!-- Connectors first -->
  <line x1="640" y1="236" x2="640" y2="265" stroke="#FF6B00" stroke-width="1" stroke-opacity="0.55" stroke-dasharray="4 3"/>
  <line x1="680" y1="315" x2="640" y2="315" stroke="#FF6B00" stroke-width="1" stroke-opacity="0.55" stroke-dasharray="4 3"/>
  <line x1="590" y1="395" x2="590" y2="315" stroke="#FF6B00" stroke-width="1" stroke-opacity="0.55" stroke-dasharray="4 3"/>

  <!-- Right cube -->
  <polygon points="540,265 565,240 665,240 640,265" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.8" stroke-opacity="0.7"/>
  <polygon points="640,265 665,240 665,340 640,365" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.8" stroke-opacity="0.7"/>
  <rect x="540" y="265" width="100" height="100" fill="#FF6B00" fill-opacity="0.10" stroke="currentColor" stroke-width="1.8" stroke-opacity="0.85"/>
  <!-- Highlighted right edge (front-right vertical) -->
  <line x1="640" y1="265" x2="640" y2="365" stroke="#FF6B00" stroke-width="3.5"/>
  <!-- Vertex dots at visible corners -->
  <circle cx="540" cy="265" r="3" fill="#FF6B00"/>
  <circle cx="540" cy="365" r="3" fill="#FF6B00"/>
  <circle cx="640" cy="365" r="3" fill="#FF6B00"/>
  <circle cx="565" cy="240" r="3" fill="#FF6B00"/>
  <circle cx="665" cy="240" r="3" fill="#FF6B00"/>
  <circle cx="665" cy="340" r="3" fill="#FF6B00"/>
  <!-- Emphasized vertex top-front-right -->
  <circle cx="640" cy="265" r="5.5" fill="#FF6B00"/>
  <circle cx="640" cy="265" r="9" fill="none" stroke="#FF6B00" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Right tags -->
  <g>
    <rect x="575" y="200" width="130" height="36" rx="6" fill="currentColor" fill-opacity="0.04" stroke="#FF6B00" stroke-width="1" stroke-opacity="0.5"/>
    <text x="585" y="216" font-size="12" font-weight="700" fill="#FF6B00">Vertices</text>
    <text x="585" y="230" font-size="10" fill="currentColor" opacity="0.7">8 corner points</text>
  </g>
  <g>
    <rect x="680" y="297" width="110" height="36" rx="6" fill="currentColor" fill-opacity="0.04" stroke="#FF6B00" stroke-width="1" stroke-opacity="0.5"/>
    <text x="690" y="313" font-size="12" font-weight="700" fill="#FF6B00">Edges</text>
    <text x="690" y="327" font-size="10" fill="currentColor" opacity="0.7">12 connectors</text>
  </g>
  <g>
    <rect x="525" y="395" width="130" height="36" rx="6" fill="currentColor" fill-opacity="0.04" stroke="#FF6B00" stroke-width="1" stroke-opacity="0.5"/>
    <text x="535" y="411" font-size="12" font-weight="700" fill="#FF6B00">Faces</text>
    <text x="535" y="425" font-size="10" fill="currentColor" opacity="0.7">6 surfaces</text>
  </g>

  <!-- Takeaway -->
  <text x="400" y="478" text-anchor="middle" font-size="13" font-style="italic" fill="currentColor" opacity="0.75">Modify the container without touching the geometry, or shape the geometry without moving the container.</text>

  <!-- Footer tip -->
  <rect x="40" y="506" width="720" height="34" rx="6" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="527" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Object Mode edits the container. Tab into Edit Mode to change the mesh itself.</text>
</svg>
