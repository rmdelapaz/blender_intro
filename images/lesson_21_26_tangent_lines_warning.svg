<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="tl-title tl-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="tl-title">Avoid tangent lines</title>
  <desc id="tl-desc">A good versus bad comparison. On the left, a background pole just touches the top of a subject's head so it appears to grow out of them, marked with a red warning. On the right, the same pole is shifted clear of the head so the spatial relationship is obvious, marked with a green check.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">AVOID TANGENT LINES</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Almost-touching edges create confusing, flat-looking depth</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ============ LEFT panel: BAD (tangent) ============ -->
  <g>
    <rect x="40" y="150" width="345" height="320" rx="8" fill="currentColor" fill-opacity="0.03" stroke="#E63946" stroke-opacity="0.5" stroke-width="2"/>
    <!-- background pole touching head top -->
    <rect x="205" y="180" width="14" height="120" fill="currentColor" opacity="0.35"/>
    <!-- subject head + shoulders, head top at y=300 (pole bottom touches) -->
    <circle cx="212" cy="335" r="35" fill="#4A9EFF"/>
    <path d="M 160 470 Q 160 390 212 390 Q 264 390 264 470 Z" fill="#4A9EFF"/>
    <!-- red tangent highlight at the contact point -->
    <circle cx="212" cy="300" r="22" fill="none" stroke="#E63946" stroke-width="4"/>
    <line x1="212" y1="278" x2="212" y2="240" stroke="#E63946" stroke-width="3" stroke-linecap="round"/>
    <!-- BAD badge -->
    <rect x="56" y="166" width="44" height="28" rx="6" fill="#E63946"/>
    <text x="78" y="186" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">&#10007;</text>
    <text x="212" y="225" font-size="13" font-weight="600" fill="#E63946" text-anchor="middle">Pole "grows" from head</text>
  </g>

  <!-- ============ RIGHT panel: GOOD (separated) ============ -->
  <g>
    <rect x="415" y="150" width="345" height="320" rx="8" fill="currentColor" fill-opacity="0.03" stroke="#4ADE80" stroke-opacity="0.6" stroke-width="2"/>
    <!-- background pole shifted left, clear of head -->
    <rect x="520" y="180" width="14" height="180" fill="currentColor" opacity="0.35"/>
    <!-- subject head + shoulders, head clear to the right -->
    <circle cx="610" cy="335" r="35" fill="#4A9EFF"/>
    <path d="M 558 470 Q 558 390 610 390 Q 662 390 662 470 Z" fill="#4A9EFF"/>
    <!-- green separation highlight: clear gap between pole and head -->
    <line x1="534" y1="330" x2="575" y2="330" stroke="#4ADE80" stroke-width="3" stroke-linecap="round"/>
    <text x="554" y="320" font-size="12" fill="#4ADE80" text-anchor="middle" font-weight="600">gap</text>
    <!-- GOOD badge -->
    <rect x="431" y="166" width="44" height="28" rx="6" fill="#4ADE80"/>
    <text x="453" y="187" font-size="18" font-weight="700" fill="#0f1a14" text-anchor="middle">&#10003;</text>
    <text x="610" y="225" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">Clear separation reads as depth</text>
  </g>

  <!-- Footer tip callout (Variant B, left rail) -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Nudge the camera a little. Either clearly separate the edges or clearly overlap them, never let them just kiss.
  </text>
</svg>
