<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="bn-title bn-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="bn-title">Common handle pattern: bounce settle</title>
  <desc id="bn-desc">A Graph Editor F-curve showing the bounce handle pattern. The value drops to a sharp valley at each ground contact, where the handles are short so the corner stays pointed, then arcs up to a rounded peak that gets lower with every bounce until the motion settles. Sharp valleys plus rounded peaks is the signature bounce shape.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">PATTERN &#183; BOUNCE</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Sharp valleys at contact, rounded peaks, each bounce lower &#183; the settle shape</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Gridlines -->
  <g stroke="currentColor" stroke-width="1" opacity="0.15">
    <line x1="110" y1="170" x2="110" y2="460"/>
    <line x1="262" y1="170" x2="262" y2="460"/>
    <line x1="415" y1="170" x2="415" y2="460"/>
    <line x1="567" y1="170" x2="567" y2="460"/>
    <line x1="720" y1="170" x2="720" y2="460"/>
    <line x1="110" y1="460" x2="720" y2="460"/>
    <line x1="110" y1="170" x2="720" y2="170"/>
  </g>

  <!-- Axes -->
  <g stroke="currentColor" stroke-width="1.5" opacity="0.4" stroke-linecap="round">
    <line x1="110" y1="170" x2="110" y2="460"/>
    <line x1="110" y1="460" x2="720" y2="460"/>
  </g>

  <!-- Axis labels + ticks -->
  <text x="110" y="478" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">1</text>
  <text x="415" y="478" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">12</text>
  <text x="720" y="478" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">24</text>
  <text x="415" y="500" font-size="13" fill="currentColor" opacity="0.65" text-anchor="middle">Frame (time)</text>
  <text x="98" y="464" font-size="13" fill="currentColor" opacity="0.6" text-anchor="end">0</text>
  <text x="98" y="174" font-size="13" fill="currentColor" opacity="0.6" text-anchor="end">5</text>
  <text x="78" y="315" font-size="13" fill="currentColor" opacity="0.65" text-anchor="middle" transform="rotate(-90 78 315)">Height (Z)</text>

  <!-- Bounce settle: start high(110,185), sharp valley(230,460), rounded peak(330,255), sharp valley(420,460), peak(495,330), valley(560,460), peak(615,395), valley(665,460), settle(720,460). Short handles into valleys keep corners pointed. -->
  <path d="M 110 185
           Q 175 320 230 460
           Q 285 300 330 255
           Q 380 360 420 460
           Q 460 360 495 330
           Q 530 405 560 460
           Q 590 425 615 395
           Q 642 445 665 460
           L 720 460"
        fill="none" stroke="#FF6B00" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Keyframe diamonds: start, valleys, peaks, settle -->
  <g fill="#FF6B00">
    <path d="M 110 176 L 119 185 L 110 194 L 101 185 Z"/>
    <path d="M 230 451 L 239 460 L 230 469 L 221 460 Z"/>
    <path d="M 330 246 L 339 255 L 330 264 L 321 255 Z"/>
    <path d="M 420 451 L 429 460 L 420 469 L 411 460 Z"/>
    <path d="M 495 321 L 504 330 L 495 339 L 486 330 Z"/>
    <path d="M 560 451 L 569 460 L 560 469 L 551 460 Z"/>
    <path d="M 615 386 L 624 395 L 615 404 L 606 395 Z"/>
    <path d="M 665 451 L 674 460 L 665 469 L 656 460 Z"/>
  </g>

  <!-- Short handle arms at first valley (keeps corner sharp) -->
  <g stroke="#FF6B00" stroke-width="1.5" opacity="0.5" stroke-linecap="round">
    <line x1="230" y1="460" x2="208" y2="437"/>
    <line x1="230" y1="460" x2="252" y2="437"/>
  </g>

  <!-- Annotation: sharp valley = short handles -->
  <line x1="230" y1="460" x2="270" y2="420" stroke="currentColor" stroke-width="1" opacity="0.3" stroke-linecap="round"/>
  <text x="276" y="416" font-size="14" fill="currentColor">Sharp valley</text>
  <text x="276" y="434" font-size="13" fill="currentColor" opacity="0.65">short handles = pointed corner</text>

  <!-- Annotation: rounded peak -->
  <line x1="330" y1="255" x2="360" y2="210" stroke="currentColor" stroke-width="1" opacity="0.3" stroke-linecap="round"/>
  <text x="366" y="206" font-size="14" fill="currentColor">Rounded peak</text>
  <text x="366" y="224" font-size="13" fill="currentColor" opacity="0.65">smooth handles = hang time</text>

  <!-- Annotation: settle -->
  <line x1="665" y1="460" x2="690" y2="420" stroke="currentColor" stroke-width="1" opacity="0.3" stroke-linecap="round"/>
  <text x="696" y="416" font-size="13" fill="currentColor" opacity="0.65" text-anchor="end">comes to rest</text>

  <!-- Footer tip -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Make valley handles Vector or short so each impact stays sharp; keep peaks rounded for the hang.
  </text>
</svg>
