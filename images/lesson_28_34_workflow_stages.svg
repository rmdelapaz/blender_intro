<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ws-title ws-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="ws-title">Sculpting workflow: big to small</title>
  <desc id="ws-desc">Three progressive stages from a rough sphere to a refined form: block major forms, refine secondary forms, add fine details.</desc>
  <defs>
    <marker id="ws-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="2" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

    <text x="380" y="32" text-anchor="middle" fill="currentColor" stroke="none" font-size="16" font-weight="700">Work From Big to Small</text>

    <!-- STAGE 1: rough block -->
    <g>
      <text x="130" y="70" text-anchor="middle" fill="currentColor" stroke="none" font-size="12.5" font-weight="700">1 &#183; Block major forms</text>
      <!-- blocky faceted mass -->
      <path d="M92 150 L108 110 L150 100 L182 124 L178 168 L140 188 L100 178 Z" stroke-width="2.4"/>
      <path d="M108 110 L140 132 L150 100" stroke-width="1.2" opacity="0.5"/>
      <path d="M140 132 L178 168" stroke-width="1.2" opacity="0.5"/>
      <path d="M140 132 L140 188" stroke-width="1.2" opacity="0.5"/>
      <text x="130" y="214" text-anchor="middle" fill="currentColor" stroke="none" font-size="10.5" opacity="0.72">low res &#183; Grab + Clay Strips</text>
      <text x="130" y="230" text-anchor="middle" fill="currentColor" stroke="none" font-size="10.5" opacity="0.72">rough masses, proportions</text>
    </g>

    <!-- STAGE 2: secondary forms -->
    <g>
      <text x="380" y="70" text-anchor="middle" fill="currentColor" stroke="none" font-size="12.5" font-weight="700">2 &#183; Refine secondary forms</text>
      <path d="M342 148 q-4 -34 30 -46 q40 -14 64 8 q22 22 14 56 q-8 34 -44 42 q-44 8 -60 -22 q-8 -16 -4 -38 Z" stroke-width="2.4"/>
      <path d="M356 130 q24 -18 52 -6" stroke-width="1.3" opacity="0.55"/>
      <path d="M350 162 q34 22 78 6" stroke-width="1.3" opacity="0.55"/>
      <path d="M398 120 q10 30 0 70" stroke-width="1.1" opacity="0.4"/>
      <text x="380" y="214" text-anchor="middle" fill="currentColor" stroke="none" font-size="10.5" opacity="0.72">medium res &#183; Draw + Inflate</text>
      <text x="380" y="230" text-anchor="middle" fill="currentColor" stroke="none" font-size="10.5" opacity="0.72">muscle groups, planes</text>
    </g>

    <!-- STAGE 3: fine detail -->
    <g>
      <text x="630" y="70" text-anchor="middle" fill="currentColor" stroke="none" font-size="12.5" font-weight="700">3 &#183; Add fine details</text>
      <path d="M592 148 q-4 -34 30 -46 q40 -14 64 8 q22 22 14 56 q-8 34 -44 42 q-44 8 -60 -22 q-8 -16 -4 -38 Z" stroke-width="2.4"/>
      <!-- fine surface marks -->
      <g stroke-width="1" opacity="0.6">
        <path d="M604 128 q10 -6 20 -2"/>
        <path d="M612 142 q12 -4 22 0"/>
        <path d="M600 158 q16 8 34 4"/>
        <path d="M616 170 q14 6 30 0"/>
        <path d="M640 120 q8 -4 16 2"/>
        <path d="M648 140 q6 6 4 16"/>
        <circle cx="626" cy="150" r="3"/>
        <circle cx="660" cy="158" r="2.4"/>
        <circle cx="612" cy="120" r="2.2"/>
      </g>
      <text x="630" y="214" text-anchor="middle" fill="currentColor" stroke="none" font-size="10.5" opacity="0.72">high res &#183; Crease + Draw Sharp</text>
      <text x="630" y="230" text-anchor="middle" fill="currentColor" stroke="none" font-size="10.5" opacity="0.72">wrinkles, pores, texture</text>
    </g>

    <!-- arrows between stages -->
    <g stroke-width="2">
      <line x1="196" y1="140" x2="334" y2="140" marker-end="url(#ws-arrow)"/>
      <line x1="452" y1="140" x2="584" y2="140" marker-end="url(#ws-arrow)"/>
    </g>

    <!-- footer principles -->
    <line x1="60" y1="262" x2="700" y2="262" stroke-width="1" opacity="0.3"/>
    <text x="380" y="288" text-anchor="middle" fill="currentColor" stroke="none" font-size="12" opacity="0.85">Block forms first &#183; refine progressively &#183; details last</text>
    <text x="380" y="312" text-anchor="middle" fill="currentColor" stroke="none" font-size="11" opacity="0.65">Rotate &amp; review constantly &#183; smooth as you go &#183; this order prevents wasted effort</text>
  </g>
</svg>
