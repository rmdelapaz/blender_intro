<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="at-title at-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="at-title">Common types of natural motion arcs</title>
  <desc id="at-desc">Three motion-path examples shown side by side: a thrown object travelling in a high parabolic arc, a pendulum or swinging limb following a shallow circular arc, and a head turn tracing a gentle flat S-curve. Each path is dashed with orange ghost positions marking the start, middle, and end of the motion. The takeaway is that almost all natural motion travels in arcs rather than straight lines.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">TYPES OF MOTION ARCS</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Natural movement follows curved paths, not straight lines</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ============ Panel 1: THROWN OBJECT (high parabolic arc) ============ -->
  <text x="160" y="150" font-size="18" font-weight="600" fill="currentColor" text-anchor="middle">Thrown Object</text>

  <!-- parabolic arc path -->
  <path d="M 50 360 Q 160 150 270 360" fill="none" stroke="currentColor" stroke-width="2"
        stroke-dasharray="6 6" opacity="0.55"/>
  <!-- ghost positions: start / apex / end -->
  <circle cx="50" cy="360" r="11" fill="#FF6B00" opacity="0.35"/>
  <circle cx="160" cy="207" r="11" fill="#FF6B00" opacity="0.65"/>
  <circle cx="270" cy="360" r="11" fill="#FF6B00"/>
  <!-- direction arrow at end -->
  <path d="M 256 330 L 270 360 L 250 352" fill="none" stroke="#FF6B00" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- frame labels -->
  <text x="50" y="388" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">start</text>
  <text x="160" y="189" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">apex</text>
  <text x="270" y="388" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">land</text>
  <!-- descriptor pill -->
  <rect x="60" y="412" width="200" height="26" rx="13" fill="#FF6B00" fill-opacity="0.10"
        stroke="#FF6B00" stroke-opacity="0.35"/>
  <text x="160" y="429" font-size="12" fill="currentColor" text-anchor="middle">High parabolic arc</text>

  <!-- ============ Panel 2: PENDULUM / LIMB SWING (shallow circular arc) ============ -->
  <text x="400" y="150" font-size="18" font-weight="600" fill="currentColor" text-anchor="middle">Pendulum / Limb Swing</text>

  <!-- pivot point -->
  <circle cx="400" cy="180" r="4" fill="currentColor" opacity="0.6"/>
  <text x="400" y="172" font-size="11" fill="currentColor" opacity="0.6" text-anchor="middle">pivot</text>
  <!-- shallow circular swing arc (bottom of an arc) -->
  <path d="M 320 320 A 100 100 0 0 0 480 320" fill="none" stroke="currentColor" stroke-width="2"
        stroke-dasharray="6 6" opacity="0.55"/>
  <!-- swing rods (faint) -->
  <line x1="400" y1="180" x2="320" y2="320" stroke="currentColor" stroke-width="1" opacity="0.18"/>
  <line x1="400" y1="180" x2="400" y2="360" stroke="currentColor" stroke-width="1" opacity="0.18"/>
  <line x1="400" y1="180" x2="480" y2="320" stroke="currentColor" stroke-width="1" opacity="0.18"/>
  <!-- ghost positions along the swing -->
  <circle cx="320" cy="320" r="11" fill="#FF6B00" opacity="0.35"/>
  <circle cx="400" cy="360" r="11" fill="#FF6B00" opacity="0.65"/>
  <circle cx="480" cy="320" r="11" fill="#FF6B00"/>
  <!-- direction arrow at end -->
  <path d="M 468 296 L 480 320 L 460 312" fill="none" stroke="#FF6B00" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- descriptor pill -->
  <rect x="300" y="412" width="200" height="26" rx="13" fill="#FF6B00" fill-opacity="0.10"
        stroke="#FF6B00" stroke-opacity="0.35"/>
  <text x="400" y="429" font-size="12" fill="currentColor" text-anchor="middle">Shallow circular arc</text>

  <!-- ============ Panel 3: HEAD TURN (gentle flat S-curve) ============ -->
  <text x="640" y="150" font-size="18" font-weight="600" fill="currentColor" text-anchor="middle">Head Turn</text>

  <!-- gentle S-curve / flat arc path -->
  <path d="M 560 300 C 600 250 680 350 720 300" fill="none" stroke="currentColor" stroke-width="2"
        stroke-dasharray="6 6" opacity="0.55"/>
  <!-- ghost positions -->
  <circle cx="560" cy="300" r="11" fill="#FF6B00" opacity="0.35"/>
  <circle cx="640" cy="300" r="11" fill="#FF6B00" opacity="0.65"/>
  <circle cx="720" cy="300" r="11" fill="#FF6B00"/>
  <!-- direction arrow at end -->
  <path d="M 706 282 L 720 300 L 700 304" fill="none" stroke="#FF6B00" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- frame labels -->
  <text x="560" y="334" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">left</text>
  <text x="640" y="262" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">mid</text>
  <text x="720" y="334" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">right</text>
  <!-- descriptor pill -->
  <rect x="540" y="412" width="200" height="26" rx="13" fill="#FF6B00" fill-opacity="0.10"
        stroke="#FF6B00" stroke-opacity="0.35"/>
  <text x="640" y="429" font-size="12" fill="currentColor" text-anchor="middle">Gentle flat S-curve</text>

  <!-- panel separators -->
  <line x1="290" y1="138" x2="290" y2="448" stroke="currentColor" stroke-width="1" opacity="0.12"/>
  <line x1="510" y1="138" x2="510" y2="448" stroke="currentColor" stroke-width="1" opacity="0.12"/>

  <!-- Footer tip (Variant B, left rail) -->
  <rect x="40" y="506" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Almost all natural motion travels in arcs, never perfectly straight lines.
  </text>
</svg>
