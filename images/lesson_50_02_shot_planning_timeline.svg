<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="car02-title car02-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="car02-title">Planning Shots on a Timeline</title>
  <desc id="car02-desc">A shot-planning chart with each showcase shot as a block on a timeline, showing its purpose and its rough frame count at 24 frames per second, so total runtime is budgeted before animation starts.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Planning Shots on a Timeline</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Budget frames before you animate. Length is a decision, not an accident.</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <text x="60" y="150" font-size="13" font-weight="700" fill="currentColor" opacity="0.7">SHOT</text>
  <text x="230" y="150" font-size="13" font-weight="700" fill="currentColor" opacity="0.7">PURPOSE</text>
  <text x="520" y="150" font-size="13" font-weight="700" fill="currentColor" opacity="0.7">FRAMES @ 24fps</text>

  <g>
    <rect x="40" y="166" width="720" height="60" rx="6" fill="currentColor" opacity="0.04"/>
    <rect x="40" y="166" width="6" height="60" fill="#FF6B00"/>
    <text x="60" y="192" font-size="15" font-weight="600" fill="currentColor">Shot 1</text>
    <text x="60" y="212" font-size="12" fill="currentColor" opacity="0.55">Hook</text>
    <text x="230" y="200" font-size="13" fill="currentColor" opacity="0.8">Signature physical action, camera on the arc</text>
    <rect x="520" y="184" width="120" height="26" rx="4" fill="#FF6B00" opacity="0.85"/>
    <text x="580" y="202" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1a14">72 (3s)</text>
  </g>
  <g>
    <rect x="40" y="234" width="720" height="60" rx="6" fill="currentColor" opacity="0.04"/>
    <rect x="40" y="234" width="6" height="60" fill="#4A9EFF"/>
    <text x="60" y="260" font-size="15" font-weight="600" fill="currentColor">Shot 2</text>
    <text x="60" y="280" font-size="12" fill="currentColor" opacity="0.55">Body</text>
    <text x="230" y="268" font-size="13" fill="currentColor" opacity="0.8">Acting beat: a decision read on the face</text>
    <rect x="520" y="252" width="160" height="26" rx="4" fill="#4A9EFF" opacity="0.8"/>
    <text x="600" y="270" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1a14">120 (5s)</text>
  </g>
  <g>
    <rect x="40" y="302" width="720" height="60" rx="6" fill="currentColor" opacity="0.04"/>
    <rect x="40" y="302" width="6" height="60" fill="#4A9EFF"/>
    <text x="60" y="328" font-size="15" font-weight="600" fill="currentColor">Shot 3</text>
    <text x="60" y="348" font-size="12" fill="currentColor" opacity="0.55">Body</text>
    <text x="230" y="336" font-size="13" fill="currentColor" opacity="0.8">Weight and balance: a lift or a heavy push</text>
    <rect x="520" y="320" width="144" height="26" rx="4" fill="#4A9EFF" opacity="0.8"/>
    <text x="592" y="338" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1a14">96 (4s)</text>
  </g>
  <g>
    <rect x="40" y="370" width="720" height="60" rx="6" fill="currentColor" opacity="0.04"/>
    <rect x="40" y="370" width="6" height="60" fill="#F5C242"/>
    <text x="60" y="396" font-size="15" font-weight="600" fill="currentColor">Shot 4</text>
    <text x="60" y="416" font-size="12" fill="currentColor" opacity="0.55">Closer</text>
    <text x="230" y="404" font-size="13" fill="currentColor" opacity="0.8">Personality moment, ends clean for the end card</text>
    <rect x="520" y="388" width="100" height="26" rx="4" fill="#F5C242" opacity="0.9"/>
    <text x="570" y="406" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1a14">48 (2s)</text>
  </g>

  <line x1="40" y1="450" x2="760" y2="450" stroke="currentColor" stroke-width="1" opacity="0.15"/>
  <text x="60" y="478" font-size="14" font-weight="700" fill="currentColor">Total</text>
  <text x="230" y="478" font-size="13" fill="currentColor" opacity="0.7">Four shots, tight and varied</text>
  <text x="520" y="478" font-size="14" font-weight="700" fill="#FF6B00">336 frames (14s)</text>

  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Fewer, polished shots beat many rough ones. A short reel that is fully finished always wins.</text>
</svg>
