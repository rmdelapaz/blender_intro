<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="pp-title pp-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="pp-title">Properties Panel Icon Reference</title>
  <desc id="pp-desc">A reference card listing the twelve icons in Blender's Properties panel sidebar. Each row shows the icon, the section name, and a short description of what the section controls. From top to bottom: Active Tool, Render Properties, Output Properties, View Layer Properties, Scene Properties, World Properties, Object Properties shown as the orange cube, Modifier Properties, Particle Properties, Physics Properties, Material Properties, and Texture Properties.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Properties Panel &#8212; Icon Reference</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">The vertical icon strip down the right side of Blender. Each icon opens a different settings group.</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Column hints -->
  <text x="115" y="135" font-size="11" font-weight="700" fill="currentColor" opacity="0.5" letter-spacing="1.5">SECTION</text>
  <text x="310" y="135" font-size="11" font-weight="700" fill="currentColor" opacity="0.5" letter-spacing="1.5">WHAT IT CONTROLS</text>

  <!-- ===== Row 1: Active Tool (wrench) ===== -->
  <g transform="translate(70, 145)" stroke="currentColor" stroke-width="1.8" fill="none" opacity="0.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="7" r="4"/>
    <line x1="10" y1="10" x2="21" y2="21"/>
  </g>
  <text x="115" y="162" font-size="14" font-weight="600" fill="currentColor">Active Tool</text>
  <text x="310" y="162" font-size="12" fill="currentColor" opacity="0.6">Settings for the tool currently selected in the toolbar</text>

  <!-- ===== Row 2: Render Properties (camera) ===== -->
  <g transform="translate(70, 173)" stroke="currentColor" stroke-width="1.6" fill="none" opacity="0.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="6" width="18" height="13" rx="2"/>
    <circle cx="11" cy="12.5" r="3.5"/>
    <path d="M 6 6 L 8 3 L 14 3 L 16 6"/>
  </g>
  <text x="115" y="190" font-size="14" font-weight="600" fill="currentColor">Render Properties</text>
  <text x="310" y="190" font-size="12" fill="currentColor" opacity="0.6">Engine (Cycles or EEVEE) and render quality settings</text>

  <!-- ===== Row 3: Output Properties (printer) ===== -->
  <g transform="translate(70, 201)" stroke="currentColor" stroke-width="1.6" fill="none" opacity="0.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5" y="3" width="14" height="6"/>
    <rect x="2" y="9" width="20" height="9" rx="1"/>
    <rect x="6" y="14" width="12" height="7"/>
  </g>
  <text x="115" y="218" font-size="14" font-weight="600" fill="currentColor">Output Properties</text>
  <text x="310" y="218" font-size="12" fill="currentColor" opacity="0.6">Resolution, frame range, and output file format</text>

  <!-- ===== Row 4: View Layer (stacked layers) ===== -->
  <g transform="translate(70, 229)" stroke="currentColor" stroke-width="1.6" fill="none" opacity="0.75" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="12,3 21,8 12,13 3,8"/>
    <polyline points="3,12 12,17 21,12"/>
    <polyline points="3,16 12,21 21,16"/>
  </g>
  <text x="115" y="246" font-size="14" font-weight="600" fill="currentColor">View Layer Properties</text>
  <text x="310" y="246" font-size="12" fill="currentColor" opacity="0.6">Render passes and per-layer visibility</text>

  <!-- ===== Row 5: Scene Properties (cone) ===== -->
  <g transform="translate(70, 257)" stroke="currentColor" stroke-width="1.6" fill="none" opacity="0.75" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="12,3 21,20 3,20"/>
    <ellipse cx="12" cy="20" rx="9" ry="2.5"/>
  </g>
  <text x="115" y="274" font-size="14" font-weight="600" fill="currentColor">Scene Properties</text>
  <text x="310" y="274" font-size="12" fill="currentColor" opacity="0.6">Units, gravity, and active camera</text>

  <!-- ===== Row 6: World Properties (globe) ===== -->
  <g transform="translate(70, 285)" stroke="currentColor" stroke-width="1.6" fill="none" opacity="0.75" stroke-linecap="round">
    <circle cx="12" cy="12" r="9"/>
    <line x1="3" y1="12" x2="21" y2="12"/>
    <ellipse cx="12" cy="12" rx="4" ry="9"/>
  </g>
  <text x="115" y="302" font-size="14" font-weight="600" fill="currentColor">World Properties</text>
  <text x="310" y="302" font-size="12" fill="currentColor" opacity="0.6">Background color, HDRI, and ambient light</text>

  <!-- ===== Row 7: Object Properties (orange wireframe cube) ===== -->
  <g transform="translate(70, 313)" stroke="#FF6B00" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="12,3 20,7.5 20,16.5 12,21 4,16.5 4,7.5"/>
    <line x1="12" y1="3" x2="12" y2="12"/>
    <line x1="12" y1="12" x2="4" y2="7.5"/>
    <line x1="12" y1="12" x2="20" y2="7.5"/>
    <line x1="12" y1="12" x2="12" y2="21"/>
  </g>
  <text x="115" y="330" font-size="14" font-weight="600" fill="currentColor">Object Properties</text>
  <text x="310" y="330" font-size="12" fill="currentColor" opacity="0.6">Transforms, visibility, and viewport display</text>

  <!-- ===== Row 8: Modifier Properties (stack of bars) ===== -->
  <g transform="translate(70, 341)" stroke="currentColor" stroke-width="1.6" fill="none" opacity="0.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="4" rx="1"/>
    <rect x="2" y="10" width="20" height="4" rx="1"/>
    <rect x="2" y="16" width="20" height="4" rx="1"/>
  </g>
  <text x="115" y="358" font-size="14" font-weight="600" fill="currentColor">Modifier Properties</text>
  <text x="310" y="358" font-size="12" fill="currentColor" opacity="0.6">Non-destructive geometry operations stack</text>

  <!-- ===== Row 9: Particle Properties (atom orbits) ===== -->
  <g transform="translate(70, 369)" stroke="currentColor" stroke-width="1.4" fill="none" opacity="0.75" stroke-linecap="round">
    <circle cx="12" cy="12" r="1.8" fill="currentColor"/>
    <ellipse cx="12" cy="12" rx="9" ry="3.5"/>
    <ellipse cx="12" cy="12" rx="9" ry="3.5" transform="rotate(60 12 12)"/>
    <ellipse cx="12" cy="12" rx="9" ry="3.5" transform="rotate(120 12 12)"/>
  </g>
  <text x="115" y="386" font-size="14" font-weight="600" fill="currentColor">Particle Properties</text>
  <text x="310" y="386" font-size="12" fill="currentColor" opacity="0.6">Hair, sparks, and other emitter systems</text>

  <!-- ===== Row 10: Physics Properties (bouncing arc) ===== -->
  <g transform="translate(70, 397)" stroke="currentColor" stroke-width="1.6" fill="none" opacity="0.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="8" cy="15" r="4"/>
    <path d="M 8 11 L 8 5 L 16 5 L 20 10 L 17 12"/>
    <polyline points="17 12 17 9 14 9"/>
  </g>
  <text x="115" y="414" font-size="14" font-weight="600" fill="currentColor">Physics Properties</text>
  <text x="310" y="414" font-size="12" fill="currentColor" opacity="0.6">Rigid body, soft body, cloth, and fluid simulation</text>

  <!-- ===== Row 11: Material Properties (sphere with highlight) ===== -->
  <g transform="translate(70, 425)" stroke="currentColor" stroke-width="1.6" fill="none" opacity="0.75" stroke-linecap="round">
    <circle cx="12" cy="12" r="8"/>
    <ellipse cx="9" cy="9" rx="2.5" ry="1.4" transform="rotate(-30 9 9)"/>
  </g>
  <text x="115" y="442" font-size="14" font-weight="600" fill="currentColor">Material Properties</text>
  <text x="310" y="442" font-size="12" fill="currentColor" opacity="0.6">Shaders, colors, and surface appearance</text>

  <!-- ===== Row 12: Texture Properties (checkerboard 3x3) ===== -->
  <g transform="translate(70, 453)" fill="currentColor" opacity="0.75">
    <rect x="0" y="0" width="7" height="7"/>
    <rect x="14" y="0" width="7" height="7"/>
    <rect x="7" y="7" width="7" height="7"/>
    <rect x="0" y="14" width="7" height="7"/>
    <rect x="14" y="14" width="7" height="7"/>
  </g>
  <text x="115" y="470" font-size="14" font-weight="600" fill="currentColor">Texture Properties</text>
  <text x="310" y="470" font-size="12" fill="currentColor" opacity="0.6">Brush textures and legacy texture slots</text>

  <!-- Sub-note -->
  <text x="400" y="492" font-size="11" font-style="italic" fill="currentColor" opacity="0.5" text-anchor="middle">Some icons appear only when the relevant object type is selected.</text>

  <!-- Footer tip -->
  <rect x="40" y="506" width="720" height="34" rx="6"
        fill="#FF6B00" fill-opacity="0.10" stroke="#FF6B00" stroke-opacity="0.4"/>
  <text x="54" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Hover any icon to see its tooltip with the section name &#8212; useful while you&#8217;re still memorizing them.
  </text>
</svg>
