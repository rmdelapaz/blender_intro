<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="car08-title car08-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="car08-title">Reading Body Language</title>
  <desc id="car08-desc">Three character silhouettes contrasting an open confident stance, a closed guarded stance, and a weighted tired stance. The pose alone communicates the emotion before any facial detail, so silhouette and weight distribution carry the read.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Reading Body Language</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">The silhouette reads the emotion before the face does. Pose first, detail second.</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Panel 1: Open -->
  <g>
    <rect x="40" y="150" width="226" height="300" rx="8" fill="currentColor" opacity="0.04"/>
    <rect x="40" y="150" width="4" height="300" fill="#4ADE80"/>
    <text x="64" y="182" font-size="16" font-weight="600" fill="#4ADE80">Open</text>
    <text x="64" y="203" font-size="12" fill="currentColor" opacity="0.6">Confident · inviting</text>
    <!-- open silhouette: head, wide chest, arms out, planted stance -->
    <g fill="#4ADE80">
      <circle cx="153" cy="248" r="18"/>
      <path d="M 153 268 L 138 300 L 168 300 Z"/>
      <rect x="140" y="296" width="26" height="60" rx="6"/>
      <path d="M 142 302 L 104 336 L 112 346 L 150 316 Z"/>
      <path d="M 164 302 L 202 336 L 194 346 L 156 316 Z"/>
      <path d="M 144 354 L 132 420 L 146 420 L 154 366 Z"/>
      <path d="M 162 354 L 174 420 L 160 420 L 152 366 Z"/>
    </g>
    <text x="153" y="440" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.6">chest up, arms away</text>
  </g>

  <!-- Panel 2: Closed -->
  <g>
    <rect x="287" y="150" width="226" height="300" rx="8" fill="currentColor" opacity="0.04"/>
    <rect x="287" y="150" width="4" height="300" fill="#4A9EFF"/>
    <text x="311" y="182" font-size="16" font-weight="600" fill="#4A9EFF">Closed</text>
    <text x="311" y="203" font-size="12" fill="currentColor" opacity="0.6">Guarded · defensive</text>
    <!-- closed silhouette: head tucked, shoulders in, arms crossed -->
    <g fill="#4A9EFF">
      <circle cx="400" cy="252" r="18"/>
      <path d="M 400 270 L 390 296 L 410 296 Z"/>
      <rect x="384" y="292" width="32" height="62" rx="8"/>
      <path d="M 386 306 L 418 320 L 414 330 L 384 318 Z"/>
      <path d="M 414 306 L 382 320 L 386 330 L 416 318 Z"/>
      <path d="M 388 352 L 384 420 L 396 420 L 398 360 Z"/>
      <path d="M 412 352 L 416 420 L 404 420 L 402 360 Z"/>
    </g>
    <text x="400" y="440" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.6">arms crossed, shoulders in</text>
  </g>

  <!-- Panel 3: Weighted -->
  <g>
    <rect x="534" y="150" width="226" height="300" rx="8" fill="currentColor" opacity="0.04"/>
    <rect x="534" y="150" width="4" height="300" fill="#F5C242"/>
    <text x="558" y="182" font-size="16" font-weight="600" fill="#F5C242">Weighted</text>
    <text x="558" y="203" font-size="12" fill="currentColor" opacity="0.6">Tired · burdened</text>
    <!-- weighted silhouette: head low, curved spine, slumped -->
    <g fill="#F5C242">
      <circle cx="640" cy="262" r="18"/>
      <path d="M 636 279 L 636 300 L 652 296 Z"/>
      <path d="M 626 298 Q 660 302 662 356 L 636 358 Q 632 316 620 306 Z"/>
      <path d="M 630 312 L 606 352 L 614 358 L 638 322 Z"/>
      <path d="M 658 320 L 680 356 L 672 362 L 650 330 Z"/>
      <path d="M 636 356 L 624 420 L 638 420 L 648 360 Z"/>
      <path d="M 658 356 L 668 420 L 654 420 L 648 362 Z"/>
    </g>
    <text x="647" y="440" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.6">spine curved, weight down</text>
  </g>

  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Test your pose in black silhouette. If the emotion still reads with all detail removed, the body language is working.</text>
</svg>
