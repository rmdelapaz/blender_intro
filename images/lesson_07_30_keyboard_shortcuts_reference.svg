<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="ks-title ks-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="ks-title">Keyboard Shortcuts: Modeling Your First Object</title>
  <desc id="ks-desc">A reference card of essential keyboard shortcuts used to build the coffee mug, grouped into four categories across two columns: Modes and Selection, Modeling, Transform, and View and File. Each shortcut is shown as filled-orange key badges with a short description.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Header -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Keyboard Shortcuts: Mug Modeling</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Essential shortcuts you used to build the coffee mug from cylinder to finished model</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ============================ -->
  <!--        LEFT COLUMN           -->
  <!-- ============================ -->

  <!-- Category 1: MODES & SELECTION -->
  <text x="40" y="148" font-size="13" font-weight="700" fill="#FF6B00" letter-spacing="1.5">MODES &amp; SELECTION</text>

  <!-- Row 1: Tab | Toggle Edit / Object mode -->
  <rect x="40" y="162" width="42" height="22" rx="4" fill="#FF6B00"/>
  <text x="61" y="178" font-size="12" font-weight="700" fill="white" text-anchor="middle">Tab</text>
  <text x="200" y="178" font-size="13" fill="currentColor">Toggle Edit / Object mode</text>

  <!-- Row 2: 1 / 2 / 3 | Vertex / Edge / Face select -->
  <rect x="40" y="192" width="56" height="22" rx="4" fill="#FF6B00"/>
  <text x="68" y="208" font-size="12" font-weight="700" fill="white" text-anchor="middle">1 / 2 / 3</text>
  <text x="200" y="208" font-size="13" fill="currentColor">Vertex / Edge / Face select</text>

  <!-- Row 3: A | Select all -->
  <rect x="40" y="222" width="24" height="22" rx="4" fill="#FF6B00"/>
  <text x="52" y="238" font-size="12" font-weight="700" fill="white" text-anchor="middle">A</text>
  <text x="200" y="238" font-size="13" fill="currentColor">Select all</text>

  <!-- Row 4: Alt + Click | Loop select -->
  <rect x="40" y="252" width="30" height="22" rx="4" fill="#FF6B00"/>
  <text x="55" y="268" font-size="12" font-weight="700" fill="white" text-anchor="middle">Alt</text>
  <text x="78" y="268" font-size="13" fill="currentColor" opacity="0.5" text-anchor="middle">+</text>
  <rect x="86" y="252" width="42" height="22" rx="4" fill="#FF6B00"/>
  <text x="107" y="268" font-size="12" font-weight="700" fill="white" text-anchor="middle">Click</text>
  <text x="200" y="268" font-size="13" fill="currentColor">Loop select around a ring</text>

  <!-- Row 5: B | Box select -->
  <rect x="40" y="282" width="24" height="22" rx="4" fill="#FF6B00"/>
  <text x="52" y="298" font-size="12" font-weight="700" fill="white" text-anchor="middle">B</text>
  <text x="200" y="298" font-size="13" fill="currentColor">Box select, drag a rectangle</text>

  <!-- Category 2: MODELING -->
  <text x="40" y="328" font-size="13" font-weight="700" fill="#FF6B00" letter-spacing="1.5">MODELING</text>

  <!-- Row 1: E | Extrude -->
  <rect x="40" y="342" width="24" height="22" rx="4" fill="#FF6B00"/>
  <text x="52" y="358" font-size="12" font-weight="700" fill="white" text-anchor="middle">E</text>
  <text x="200" y="358" font-size="13" fill="currentColor">Extrude selected geometry</text>

  <!-- Row 2: Ctrl + R | Loop cut -->
  <rect x="40" y="372" width="30" height="22" rx="4" fill="#FF6B00"/>
  <text x="55" y="388" font-size="12" font-weight="700" fill="white" text-anchor="middle">Ctrl</text>
  <text x="78" y="388" font-size="13" fill="currentColor" opacity="0.5" text-anchor="middle">+</text>
  <rect x="86" y="372" width="24" height="22" rx="4" fill="#FF6B00"/>
  <text x="98" y="388" font-size="12" font-weight="700" fill="white" text-anchor="middle">R</text>
  <text x="200" y="388" font-size="13" fill="currentColor">Loop cut, scroll for more cuts</text>

  <!-- Row 3: I | Inset face -->
  <rect x="40" y="402" width="24" height="22" rx="4" fill="#FF6B00"/>
  <text x="52" y="418" font-size="12" font-weight="700" fill="white" text-anchor="middle">I</text>
  <text x="200" y="418" font-size="13" fill="currentColor">Inset face, makes inner ring</text>

  <!-- Row 4: F | Fill / bridge edges -->
  <rect x="40" y="432" width="24" height="22" rx="4" fill="#FF6B00"/>
  <text x="52" y="448" font-size="12" font-weight="700" fill="white" text-anchor="middle">F</text>
  <text x="200" y="448" font-size="13" fill="currentColor">Fill or bridge selected edges</text>

  <!-- Row 5: Ctrl + B | Bevel -->
  <rect x="40" y="462" width="30" height="22" rx="4" fill="#FF6B00"/>
  <text x="55" y="478" font-size="12" font-weight="700" fill="white" text-anchor="middle">Ctrl</text>
  <text x="78" y="478" font-size="13" fill="currentColor" opacity="0.5" text-anchor="middle">+</text>
  <rect x="86" y="462" width="24" height="22" rx="4" fill="#FF6B00"/>
  <text x="98" y="478" font-size="12" font-weight="700" fill="white" text-anchor="middle">B</text>
  <text x="200" y="478" font-size="13" fill="currentColor">Bevel edge or vertex</text>

  <!-- ============================ -->
  <!--        RIGHT COLUMN          -->
  <!-- ============================ -->

  <!-- Category 3: TRANSFORM -->
  <text x="420" y="148" font-size="13" font-weight="700" fill="#FF6B00" letter-spacing="1.5">TRANSFORM</text>

  <!-- Row 1: G / R / S | Move, rotate, or scale -->
  <rect x="420" y="162" width="64" height="22" rx="4" fill="#FF6B00"/>
  <text x="452" y="178" font-size="12" font-weight="700" fill="white" text-anchor="middle">G / R / S</text>
  <text x="580" y="178" font-size="13" fill="currentColor">Move, rotate, or scale</text>

  <!-- Row 2: + X / Y / Z | Constrain to a global axis -->
  <rect x="420" y="192" width="72" height="22" rx="4" fill="#FF6B00"/>
  <text x="456" y="208" font-size="12" font-weight="700" fill="white" text-anchor="middle">+ X / Y / Z</text>
  <text x="580" y="208" font-size="13" fill="currentColor">Constrain to a global axis</text>

  <!-- Row 3: O | Proportional editing toggle -->
  <rect x="420" y="222" width="24" height="22" rx="4" fill="#FF6B00"/>
  <text x="432" y="238" font-size="12" font-weight="700" fill="white" text-anchor="middle">O</text>
  <text x="580" y="238" font-size="13" fill="currentColor">Proportional editing toggle</text>

  <!-- Row 4: Shift + D | Duplicate -->
  <rect x="420" y="252" width="42" height="22" rx="4" fill="#FF6B00"/>
  <text x="441" y="268" font-size="12" font-weight="700" fill="white" text-anchor="middle">Shift</text>
  <text x="470" y="268" font-size="13" fill="currentColor" opacity="0.5" text-anchor="middle">+</text>
  <rect x="478" y="252" width="24" height="22" rx="4" fill="#FF6B00"/>
  <text x="490" y="268" font-size="12" font-weight="700" fill="white" text-anchor="middle">D</text>
  <text x="580" y="268" font-size="13" fill="currentColor">Duplicate selection</text>

  <!-- Row 5: Ctrl + Z | Undo -->
  <rect x="420" y="282" width="30" height="22" rx="4" fill="#FF6B00"/>
  <text x="435" y="298" font-size="12" font-weight="700" fill="white" text-anchor="middle">Ctrl</text>
  <text x="458" y="298" font-size="13" fill="currentColor" opacity="0.5" text-anchor="middle">+</text>
  <rect x="466" y="282" width="24" height="22" rx="4" fill="#FF6B00"/>
  <text x="478" y="298" font-size="12" font-weight="700" fill="white" text-anchor="middle">Z</text>
  <text x="580" y="298" font-size="13" fill="currentColor">Undo last action</text>

  <!-- Category 4: VIEW & FILE -->
  <text x="420" y="328" font-size="13" font-weight="700" fill="#FF6B00" letter-spacing="1.5">VIEW &amp; FILE</text>

  <!-- Row 1: Z | Shading mode pie menu -->
  <rect x="420" y="342" width="24" height="22" rx="4" fill="#FF6B00"/>
  <text x="432" y="358" font-size="12" font-weight="700" fill="white" text-anchor="middle">Z</text>
  <text x="580" y="358" font-size="13" fill="currentColor">Shading mode pie menu</text>

  <!-- Row 2: Numpad 1 / 3 / 7 | Front / Side / Top view -->
  <rect x="420" y="372" width="92" height="22" rx="4" fill="#FF6B00"/>
  <text x="466" y="388" font-size="12" font-weight="700" fill="white" text-anchor="middle">Np 1 / 3 / 7</text>
  <text x="580" y="388" font-size="13" fill="currentColor">Front / Side / Top view</text>

  <!-- Row 3: Numpad 5 | Toggle perspective / ortho -->
  <rect x="420" y="402" width="42" height="22" rx="4" fill="#FF6B00"/>
  <text x="441" y="418" font-size="12" font-weight="700" fill="white" text-anchor="middle">Np 5</text>
  <text x="580" y="418" font-size="13" fill="currentColor">Toggle perspective / ortho</text>

  <!-- Row 4: Ctrl + S | Save the .blend file -->
  <rect x="420" y="432" width="30" height="22" rx="4" fill="#FF6B00"/>
  <text x="435" y="448" font-size="12" font-weight="700" fill="white" text-anchor="middle">Ctrl</text>
  <text x="458" y="448" font-size="13" fill="currentColor" opacity="0.5" text-anchor="middle">+</text>
  <rect x="466" y="432" width="24" height="22" rx="4" fill="#FF6B00"/>
  <text x="478" y="448" font-size="12" font-weight="700" fill="white" text-anchor="middle">S</text>
  <text x="580" y="448" font-size="13" fill="currentColor">Save the .blend file</text>

  <!-- Row 5: Shift + Ctrl + S | Save As, new version -->
  <rect x="420" y="462" width="42" height="22" rx="4" fill="#FF6B00"/>
  <text x="441" y="478" font-size="12" font-weight="700" fill="white" text-anchor="middle">Shift</text>
  <text x="470" y="478" font-size="13" fill="currentColor" opacity="0.5" text-anchor="middle">+</text>
  <rect x="478" y="462" width="30" height="22" rx="4" fill="#FF6B00"/>
  <text x="493" y="478" font-size="12" font-weight="700" fill="white" text-anchor="middle">Ctrl</text>
  <text x="516" y="478" font-size="13" fill="currentColor" opacity="0.5" text-anchor="middle">+</text>
  <rect x="524" y="462" width="24" height="22" rx="4" fill="#FF6B00"/>
  <text x="536" y="478" font-size="12" font-weight="700" fill="white" text-anchor="middle">S</text>
  <text x="580" y="478" font-size="13" fill="currentColor">Save As, new version</text>

  <!-- Footer tip callout -->
  <rect x="40" y="506" width="720" height="34" rx="6"
        fill="#FF6B00" fill-opacity="0.10"
        stroke="#FF6B00" stroke-opacity="0.4"/>
  <text x="54" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Chain transforms · G Z 0.1 moves the selection 0.1 units up along Z in one keystroke.
  </text>
</svg>
