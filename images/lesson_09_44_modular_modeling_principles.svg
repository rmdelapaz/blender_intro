<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" color="#222" role="img" aria-labelledby="mk-title mk-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="mk-title">Modular Modeling Principles</title>
  <desc id="mk-desc">A modular asset kit built on one base module, a two by two grid unit. From it come four reusable pieces: a straight wall, a doorway, an L-shaped corner, and an end cap. Because every piece shares the same grid footprint, they snap together into larger layouts without gaps.</desc>

  <rect x="0" y="0" width="800" height="680" rx="18" fill="#0f1a14"/>
  <rect x="0" y="0" width="800" height="10" rx="5" fill="#FF6B00"/>

  <text x="40" y="58" font-size="30" font-weight="700" fill="#f5f7f6">Modular Asset Kit</text>
  <text x="40" y="88" font-size="17" font-weight="500" fill="#9fb0a8">One grid unit &#183; many pieces that always fit</text>

  <defs>
    <pattern id="mk-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0 H0 V20" fill="none" stroke="#26342c" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- base module -->
  <text x="40" y="124" font-size="15" font-weight="700" fill="#F5C242">THE BASE MODULE</text>
  <g>
    <rect x="40" y="138" width="120" height="120" fill="url(#mk-grid)" stroke="#F5C242" stroke-width="2.5"/>
    <rect x="40" y="138" width="120" height="120" fill="#F5C242" opacity="0.10"/>
    <!-- dimension marks 2 by 2 -->
    <text x="100" y="132" font-size="12.5" fill="#F5C242" text-anchor="middle">2 units</text>
    <text x="28" y="202" font-size="12.5" fill="#F5C242" text-anchor="middle" transform="rotate(-90 28 202)">2 units</text>
    <text x="100" y="204" font-size="13" font-weight="700" fill="#f5f7f6" text-anchor="middle">Base</text>
  </g>
  <text x="184" y="158" font-size="14" fill="#cdd8d2">Pick one footprint, say a</text>
  <text x="184" y="180" font-size="14" fill="#cdd8d2">2&#215;2 grid square, then build</text>
  <text x="184" y="202" font-size="14" fill="#cdd8d2">every piece to fill it exactly.</text>
  <text x="184" y="236" font-size="13" fill="#9fb0a8">Snap to grid so edges always meet</text>
  <text x="184" y="254" font-size="13" fill="#9fb0a8">cleanly when pieces sit side by side.</text>

  <!-- variations -->
  <text x="40" y="306" font-size="15" font-weight="700" fill="#4ADE80">VARIATIONS (same footprint)</text>

  <!-- wall (blue) -->
  <g>
    <rect x="40" y="320" width="100" height="100" fill="url(#mk-grid)" stroke="#4A9EFF" stroke-width="2"/>
    <rect x="56" y="336" width="68" height="68" fill="#4A9EFF" opacity="0.22" stroke="#4A9EFF" stroke-width="2"/>
    <text x="90" y="442" font-size="13" font-weight="700" fill="#9fd0ff" text-anchor="middle">Wall</text>
  </g>
  <!-- doorway (blue) -->
  <g>
    <rect x="180" y="320" width="100" height="100" fill="url(#mk-grid)" stroke="#4A9EFF" stroke-width="2"/>
    <path d="M196 404 V352 a34 30 0 0 1 68 0 V404" fill="none" stroke="#4A9EFF" stroke-width="3"/>
    <text x="230" y="442" font-size="13" font-weight="700" fill="#9fd0ff" text-anchor="middle">Doorway</text>
  </g>
  <!-- corner (orange) -->
  <g>
    <rect x="320" y="320" width="100" height="100" fill="url(#mk-grid)" stroke="#FF6B00" stroke-width="2"/>
    <path d="M340 336 H404 V404 H384 V356 H340 Z" fill="#FF6B00" opacity="0.22" stroke="#FF6B00" stroke-width="2"/>
    <text x="370" y="442" font-size="13" font-weight="700" fill="#ffb878" text-anchor="middle">Corner</text>
  </g>
  <!-- end cap (orange) -->
  <g>
    <rect x="460" y="320" width="100" height="100" fill="url(#mk-grid)" stroke="#FF6B00" stroke-width="2"/>
    <path d="M476 336 H544 V404 H476 V336 M476 370 H520" fill="none" stroke="#FF6B00" stroke-width="2.5"/>
    <rect x="476" y="336" width="44" height="68" fill="#FF6B00" opacity="0.18"/>
    <text x="510" y="442" font-size="13" font-weight="700" fill="#ffb878" text-anchor="middle">End cap</text>
  </g>
  <!-- legend block to the right of the variations -->
  <g>
    <rect x="592" y="320" width="168" height="100" rx="10" fill="#11201a" stroke="#24382e" stroke-width="2"/>
    <rect x="606" y="338" width="16" height="12" fill="#4A9EFF"/>
    <text x="630" y="349" font-size="12.5" fill="#cdd8d2">Through pieces</text>
    <rect x="606" y="362" width="16" height="12" fill="#FF6B00"/>
    <text x="630" y="373" font-size="12.5" fill="#cdd8d2">Turn / terminate</text>
    <text x="606" y="398" font-size="12" fill="#9fb0a8">Colour by role keeps a</text>
    <text x="606" y="414" font-size="12" fill="#9fb0a8">kit easy to read.</text>
  </g>

  <!-- assembly -->
  <text x="40" y="480" font-size="15" font-weight="700" fill="#FF6B00">ASSEMBLED ON THE GRID</text>
  <g>
    <rect x="40" y="492" width="720" height="104" rx="8" fill="url(#mk-grid)" stroke="#3a4d43" stroke-width="2"/>
    <!-- a run of snapped pieces: corner, wall, doorway, wall, end cap -->
    <g opacity="0.9">
      <path d="M60 512 H120 V576 H100 V532 H60 Z" fill="#FF6B00" opacity="0.30" stroke="#FF6B00" stroke-width="2"/>
      <rect x="120" y="512" width="64" height="64" fill="#4A9EFF" opacity="0.26" stroke="#4A9EFF" stroke-width="2"/>
      <g>
        <rect x="184" y="512" width="64" height="64" fill="none" stroke="#4A9EFF" stroke-width="2"/>
        <path d="M196 576 V536 a20 18 0 0 1 40 0 V576" fill="none" stroke="#4A9EFF" stroke-width="2.5"/>
      </g>
      <rect x="248" y="512" width="64" height="64" fill="#4A9EFF" opacity="0.26" stroke="#4A9EFF" stroke-width="2"/>
      <rect x="312" y="512" width="44" height="64" fill="#FF6B00" opacity="0.30" stroke="#FF6B00" stroke-width="2"/>
    </g>
    <text x="430" y="534" font-size="14" fill="#cdd8d2">Same footprints snap edge to edge</text>
    <text x="430" y="556" font-size="14" fill="#cdd8d2">&#8594; no gaps, no overlaps, fully</text>
    <text x="430" y="578" font-size="14" fill="#cdd8d2">rearrangeable later.</text>
  </g>

  <!-- footer tip rail -->
  <rect x="40" y="624" width="6" height="32" rx="3" fill="#F5C242"/>
  <text x="60" y="646" font-size="15" font-weight="600" fill="#F5C242">Design to the grid once &#183; reuse the kit across whole environments.</text>
</svg>
