<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="rt-title rt-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="rt-title">Rule of Thirds grid</title>
  <desc id="rt-desc">A frame divided by two evenly spaced vertical and two horizontal lines into nine equal rectangles. The four line intersections are marked as power points; a subject silhouette sits on the lower-right power point to show ideal placement.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">RULE OF THIRDS</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Divide the frame in thirds &#183; place key subjects on the power points</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ============ Framed thirds grid ============ -->
  <!-- Frame geometry: x 150..650 (w 500), y 150..480 (h 330); thirds at 1/3 and 2/3 -->
  <!-- Vertical thirds at x = 150 + 500/3 = 316.67 and 483.33 ; horizontal at y = 150 + 330/3 = 260 and 370 -->

  <!-- Frame border -->
  <rect x="150" y="150" width="500" height="330" rx="4"
        fill="currentColor" fill-opacity="0.03"
        stroke="currentColor" stroke-opacity="0.4" stroke-width="2"/>

  <!-- Subject silhouette on lower-right power point (483.33, 370). Centered so head+torso mass sits on the point. -->
  <g transform="translate(483.33,370)" fill="#4A9EFF" opacity="0.9">
    <!-- simple standing-figure silhouette, vertically centered on the power point -->
    <circle cx="0" cy="-34" r="17"/>
    <path d="M -23 -12 Q 0 -23 23 -12 L 19 44 Q 0 51 -19 44 Z"/>
    <rect x="-19" y="40" width="14" height="60" rx="6"/>
    <rect x="5" y="40" width="14" height="60" rx="6"/>
  </g>

  <!-- Grid lines (cyan, the rule-of-thirds guides) -->
  <g stroke="#00BCD4" stroke-width="2" opacity="0.85">
    <!-- verticals -->
    <line x1="316.67" y1="150" x2="316.67" y2="480"/>
    <line x1="483.33" y1="150" x2="483.33" y2="480"/>
    <!-- horizontals -->
    <line x1="150" y1="260" x2="650" y2="260"/>
    <line x1="150" y1="370" x2="650" y2="370"/>
  </g>

  <!-- Power points (orange circles at the four intersections) -->
  <g fill="#FF6B00">
    <circle cx="316.67" cy="260" r="8"/>
    <circle cx="483.33" cy="260" r="8"/>
    <circle cx="316.67" cy="370" r="8"/>
    <!-- the occupied power point gets an emphasis ring -->
    <circle cx="483.33" cy="370" r="8"/>
    <circle cx="483.33" cy="370" r="15" fill="none" stroke="#FF6B00" stroke-width="2.5" opacity="0.55"/>
  </g>

  <!-- 33% / 66% division markers along the top edge -->
  <g fill="currentColor" opacity="0.6" font-size="12" text-anchor="middle">
    <text x="233.33" y="142">1/3</text>
    <text x="400" y="142">1/3</text>
    <text x="566.67" y="142">1/3</text>
  </g>
  <!-- division ticks above top edge -->
  <g stroke="currentColor" stroke-opacity="0.3" stroke-width="1">
    <line x1="316.67" y1="146" x2="316.67" y2="150"/>
    <line x1="483.33" y1="146" x2="483.33" y2="150"/>
  </g>

  <!-- Power-point label (right of grid, pointing at occupied point) -->
  <g>
    <line x1="650" y1="370" x2="690" y2="370" stroke="#FF6B00" stroke-width="2" opacity="0.7" stroke-linecap="round"/>
    <text x="694" y="366" font-size="14" font-weight="600" fill="#FF6B00">Power</text>
    <text x="694" y="383" font-size="14" font-weight="600" fill="#FF6B00">point</text>
  </g>

  <!-- Static-vs-dynamic note (left of grid) -->
  <g font-size="13" fill="currentColor">
    <text x="40" y="270" opacity="0.6">Subject on a</text>
    <text x="40" y="288" opacity="0.6">third reads as</text>
    <text x="40" y="306" font-weight="600" opacity="0.9">dynamic, not</text>
    <text x="40" y="324" font-weight="600" opacity="0.9">static.</text>
  </g>

  <!-- Footer tip callout (Variant B, left rail) -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> In Blender, enable Camera &#183; Viewport Display &#183; Composition Guides &#183; Thirds for a live grid.
  </text>
</svg>
