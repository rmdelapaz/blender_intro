<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="rpcTitle rpcDesc" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" color="#222">
  <title id="rpcTitle">Render Passes Concept</title>
  <desc id="rpcDesc">One final beauty image is the sum of many separate render passes stacked together. The passes shown are Diffuse for base surface color, Glossy for reflections and highlights, Ambient Occlusion for contact shadows, Emission for glowing surfaces, Z-depth for distance from camera, and Normal for surface direction. Splitting them out lets you adjust each independently in post.</desc>
  <style>
    .hd{fill:currentColor;font-size:19px;font-weight:700;}
    .sub{fill:#9aa4b2;font-size:11px;}
    .bl{fill:#ffffff;font-size:12px;font-weight:700;}
    .bd{fill:#d4d4d4;font-size:10px;}
    .cap{fill:#9aa4b2;font-size:10px;}
    .plus{fill:#F5C242;font-size:22px;font-weight:700;}
  </style>
  <text x="20" y="34" class="hd">One image = a stack of passes</text>
  <text x="20" y="54" class="sub">The Render Layers node can output each light/geometry component separately &#8212; recombine or tweak them in the compositor.</text>

  <!-- beauty result -->
  <g>
    <rect x="20" y="82" width="150" height="280" rx="8" fill="#0f0f0f" stroke="#FF6B00" stroke-width="2.5"/>
    <rect x="20" y="82" width="150" height="24" rx="8" fill="#FF6B00"/>
    <text x="30" y="99" class="bl">BEAUTY (final)</text>
    <circle cx="95" cy="230" r="58" fill="#5a6272"/>
    <ellipse cx="78" cy="210" rx="20" ry="26" fill="#8791a3"/>
    <ellipse cx="112" cy="255" rx="24" ry="18" fill="#3f4552"/>
    <text x="30" y="348" class="cap">What the camera sees</text>
  </g>

  <text x="188" y="238" class="plus">=</text>

  <!-- passes column -->
  <g>
    <rect x="220" y="82" width="250" height="132" rx="7" fill="#1b1b1b" stroke="#4ADE80"/>
    <rect x="220" y="82" width="250" height="22" rx="7" fill="#4ADE80"/>
    <text x="230" y="99" class="bl" fill="#14351f">DIFFUSE</text>
    <circle cx="270" cy="160" r="34" fill="#7a6a58"/>
    <text x="320" y="150" class="bd">Base surface color, flat lighting.</text>
    <text x="320" y="168" class="bd">No reflections or shine.</text>

    <rect x="220" y="224" width="250" height="132" rx="7" fill="#1b1b1b" stroke="#4A9EFF"/>
    <rect x="220" y="224" width="250" height="22" rx="7" fill="#4A9EFF"/>
    <text x="230" y="241" class="bl">GLOSSY</text>
    <circle cx="270" cy="302" r="34" fill="#20242c"/>
    <ellipse cx="258" cy="288" rx="10" ry="14" fill="#cfe0ff"/>
    <text x="320" y="292" class="bd">Reflections &amp; specular</text>
    <text x="320" y="310" class="bd">highlights only.</text>
  </g>

  <text x="486" y="238" class="plus">+</text>

  <!-- data passes column -->
  <g>
    <rect x="510" y="82" width="230" height="86" rx="7" fill="#1b1b1b" stroke="#B47EE8"/>
    <rect x="510" y="82" width="230" height="22" rx="7" fill="#B47EE8"/>
    <text x="520" y="99" class="bl">AMBIENT OCCLUSION</text>
    <text x="520" y="128" class="bd">Contact shadows in crevices;</text>
    <text x="520" y="146" class="bd">multiply over diffuse for depth.</text>

    <rect x="510" y="178" width="230" height="82" rx="7" fill="#1b1b1b" stroke="#F5C242"/>
    <rect x="510" y="178" width="230" height="22" rx="7" fill="#F5C242"/>
    <text x="520" y="195" class="bl" fill="#3a2c05">Z-DEPTH &amp; NORMAL</text>
    <text x="520" y="222" class="bd">Z = distance from camera (fog,</text>
    <text x="520" y="240" class="bd">DoF). Normal = surface direction.</text>

    <rect x="510" y="270" width="230" height="86" rx="7" fill="#1b1b1b" stroke="#E63946"/>
    <rect x="510" y="270" width="230" height="22" rx="7" fill="#E63946"/>
    <text x="520" y="287" class="bl">EMISSION</text>
    <text x="520" y="316" class="bd">Self-lit / glowing surfaces,</text>
    <text x="520" y="334" class="bd">isolated for bloom &amp; glow.</text>
  </g>
</svg>
