<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="sr-title sr-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="sr-title">Blender System Requirements: Minimum vs Recommended</title>
  <desc id="sr-desc">A comparison of minimum and recommended hardware for running Blender. Minimum specs are quad-core CPU, 8 GB RAM, 2 GB VRAM GPU, and 1280 by 768 display. Recommended specs are eight-core CPU, 32 GB RAM, 8 or more GB VRAM GPU, and 1920 by 1080 display. You can learn on minimum hardware; better hardware speeds up previews and renders but does not change what you can create.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">System Requirements</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">You can start with minimum hardware. Better specs just mean faster.</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Column panel backgrounds -->
  <rect x="290" y="140" width="200" height="305" rx="8" fill="#4A9EFF" fill-opacity="0.06"/>
  <rect x="510" y="140" width="220" height="305" rx="8" fill="#4ADE80" fill-opacity="0.07"/>

  <!-- Column headers -->
  <text x="390" y="172" font-size="13" font-weight="700" fill="#4A9EFF" letter-spacing="1.5" text-anchor="middle">MINIMUM</text>
  <text x="390" y="194" font-size="12" fill="currentColor" opacity="0.65" text-anchor="middle">You can learn on this</text>

  <text x="620" y="172" font-size="13" font-weight="700" fill="#4ADE80" letter-spacing="1.5" text-anchor="middle">RECOMMENDED</text>
  <text x="620" y="194" font-size="12" fill="currentColor" opacity="0.65" text-anchor="middle">Better experience</text>

  <!-- Subtle row dividers inside the panels -->
  <g stroke="currentColor" stroke-width="1" opacity="0.08">
    <line x1="300" y1="270" x2="480" y2="270"/>
    <line x1="300" y1="330" x2="480" y2="330"/>
    <line x1="300" y1="390" x2="480" y2="390"/>
    <line x1="520" y1="270" x2="720" y2="270"/>
    <line x1="520" y1="330" x2="720" y2="330"/>
    <line x1="520" y1="390" x2="720" y2="390"/>
  </g>

  <!-- ===== Row 1: CPU ===== -->
  <!-- icon -->
  <g transform="translate(60, 228)" stroke="currentColor" stroke-width="1.6" fill="none" opacity="0.75" stroke-linecap="round">
    <rect x="3" y="3" width="18" height="18" rx="2"/>
    <rect x="7" y="7" width="10" height="10"/>
    <line x1="7" y1="0" x2="7" y2="3"/>
    <line x1="12" y1="0" x2="12" y2="3"/>
    <line x1="17" y1="0" x2="17" y2="3"/>
    <line x1="7" y1="21" x2="7" y2="24"/>
    <line x1="12" y1="21" x2="12" y2="24"/>
    <line x1="17" y1="21" x2="17" y2="24"/>
    <line x1="0" y1="7" x2="3" y2="7"/>
    <line x1="0" y1="12" x2="3" y2="12"/>
    <line x1="0" y1="17" x2="3" y2="17"/>
    <line x1="21" y1="7" x2="24" y2="7"/>
    <line x1="21" y1="12" x2="24" y2="12"/>
    <line x1="21" y1="17" x2="24" y2="17"/>
  </g>
  <text x="100" y="234" font-size="15" font-weight="600" fill="currentColor">CPU</text>
  <text x="100" y="252" font-size="12" fill="currentColor" opacity="0.55">Processor</text>
  <text x="390" y="244" font-size="17" font-weight="600" fill="currentColor" text-anchor="middle">Quad-core</text>
  <text x="620" y="244" font-size="17" font-weight="600" fill="currentColor" text-anchor="middle">Eight-core+</text>

  <!-- ===== Row 2: RAM ===== -->
  <g transform="translate(60, 288)" stroke="currentColor" stroke-width="1.6" fill="none" opacity="0.75" stroke-linecap="round">
    <rect x="1" y="6" width="22" height="12" rx="1"/>
    <line x1="1" y1="14" x2="23" y2="14" stroke-width="1"/>
    <line x1="5" y1="18" x2="5" y2="22"/>
    <line x1="9" y1="18" x2="9" y2="22"/>
    <line x1="13" y1="18" x2="13" y2="22"/>
    <line x1="17" y1="18" x2="17" y2="22"/>
    <line x1="21" y1="18" x2="21" y2="22"/>
  </g>
  <text x="100" y="294" font-size="15" font-weight="600" fill="currentColor">RAM</text>
  <text x="100" y="312" font-size="12" fill="currentColor" opacity="0.55">Memory</text>
  <text x="390" y="304" font-size="17" font-weight="600" fill="currentColor" text-anchor="middle">8 GB</text>
  <text x="620" y="304" font-size="17" font-weight="600" fill="currentColor" text-anchor="middle">32 GB</text>

  <!-- ===== Row 3: GPU ===== -->
  <g transform="translate(60, 348)" stroke="currentColor" stroke-width="1.6" fill="none" opacity="0.75" stroke-linecap="round">
    <rect x="1" y="5" width="22" height="14" rx="1"/>
    <circle cx="8" cy="12" r="3.5"/>
    <line x1="8" y1="8.5" x2="8" y2="15.5" stroke-width="1"/>
    <line x1="4.5" y1="12" x2="11.5" y2="12" stroke-width="1"/>
    <line x1="15" y1="9" x2="20" y2="9"/>
    <line x1="15" y1="12" x2="20" y2="12"/>
    <line x1="15" y1="15" x2="20" y2="15"/>
  </g>
  <text x="100" y="354" font-size="15" font-weight="600" fill="currentColor">GPU</text>
  <text x="100" y="372" font-size="12" fill="currentColor" opacity="0.55">Graphics card</text>
  <text x="390" y="364" font-size="17" font-weight="600" fill="currentColor" text-anchor="middle">2 GB VRAM</text>
  <text x="620" y="364" font-size="17" font-weight="600" fill="currentColor" text-anchor="middle">8+ GB VRAM</text>

  <!-- ===== Row 4: Display ===== -->
  <g transform="translate(60, 408)" stroke="currentColor" stroke-width="1.6" fill="none" opacity="0.75" stroke-linecap="round">
    <rect x="1" y="3" width="22" height="14" rx="1.5"/>
    <line x1="9" y1="20" x2="15" y2="20" stroke-width="2"/>
    <line x1="12" y1="17" x2="12" y2="20"/>
  </g>
  <text x="100" y="414" font-size="15" font-weight="600" fill="currentColor">Display</text>
  <text x="100" y="432" font-size="12" fill="currentColor" opacity="0.55">Screen resolution</text>
  <text x="390" y="424" font-size="17" font-weight="600" fill="currentColor" text-anchor="middle">1280 &#215; 768</text>
  <text x="620" y="424" font-size="17" font-weight="600" fill="currentColor" text-anchor="middle">1920 &#215; 1080</text>

  <!-- Encouragement note -->
  <text x="400" y="475" font-size="13" font-style="italic" fill="currentColor" opacity="0.6" text-anchor="middle">Better hardware speeds up previews and renders &#8212; it doesn&#8217;t change what you can create.</text>

  <!-- Footer tip -->
  <rect x="40" y="506" width="720" height="34" rx="6" fill="#FF6B00" fill-opacity="0.10" stroke="#FF6B00" stroke-opacity="0.4"/>
  <text x="54" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Start with what you own. Upgrade when render times start hurting your workflow.
  </text>
</svg>
