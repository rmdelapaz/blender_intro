<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 580" role="img" aria-labelledby="ccp-title ccp-desc" color="#222" font-family="'Segoe UI',system-ui,-apple-system,sans-serif">
<title id="ccp-title">Common collection structures</title>
<desc id="ccp-desc">Three example collection layouts side by side for different project types: a still-life or product scene organized by role, a character scene organized by asset, and an architectural scene organized by discipline; a note explains there is no single correct structure, only consistency.</desc>
<text x="430" y="34" fill="currentColor" font-size="22" font-weight="700" text-anchor="middle">Three ways teams structure collections</text>
<text x="430" y="58" fill="currentColor" font-size="14" text-anchor="middle" opacity="0.75">Organize by role, by asset, or by discipline &#8212; pick one and stay consistent</text>

<!-- Column 1: Product / still-life (by role) -->
<rect x="30" y="82" width="260" height="380" rx="10" fill="#2a2a2a" stroke="#FF6B00" stroke-width="1.6"/>
<text x="160" y="108" fill="#FF6B00" font-size="15" font-weight="700" text-anchor="middle">Product / still-life</text>
<text x="160" y="127" fill="currentColor" font-size="11.5" text-anchor="middle" opacity="0.7">grouped by role</text>
<g font-size="13" fill="#d4d4d4">
<text x="52" y="158">&#128193; COLL_Subject</text>
<text x="72" y="180" font-size="12">&#9648; Product</text>
<text x="72" y="200" font-size="12">&#9648; Label</text>
<text x="52" y="228">&#128193; COLL_Set</text>
<text x="72" y="250" font-size="12">&#9648; Backdrop</text>
<text x="72" y="270" font-size="12">&#9648; Table</text>
<text x="52" y="298">&#128193; COLL_Lighting</text>
<text x="72" y="320" font-size="12">&#9679; Key / Fill / Rim</text>
<text x="52" y="348">&#128193; COLL_Camera</text>
<text x="72" y="370" font-size="12">&#9678; Cam_Hero</text>
</g>
<rect x="52" y="392" width="216" height="52" rx="7" fill="#1e1e1e" stroke="#4ADE80" stroke-width="1.1"/>
<text x="160" y="412" fill="#4ADE80" font-size="11.5" font-weight="700" text-anchor="middle">Best for</text>
<text x="160" y="430" fill="#d4d4d4" font-size="11" text-anchor="middle">single-hero shots, fast lighting swaps</text>

<!-- Column 2: Character scene (by asset) -->
<rect x="300" y="82" width="260" height="380" rx="10" fill="#2a2a2a" stroke="#4A9EFF" stroke-width="1.6"/>
<text x="430" y="108" fill="#4A9EFF" font-size="15" font-weight="700" text-anchor="middle">Character scene</text>
<text x="430" y="127" fill="currentColor" font-size="11.5" text-anchor="middle" opacity="0.7">grouped by asset</text>
<g font-size="13" fill="#d4d4d4">
<text x="322" y="158">&#128193; COLL_Hero</text>
<text x="342" y="180" font-size="12">&#128193; Body / Rig / Cloth</text>
<text x="322" y="208">&#128193; COLL_NPCs</text>
<text x="342" y="230" font-size="12">&#128193; NPC_01 &#8230; NPC_04</text>
<text x="322" y="258">&#128193; COLL_Environment</text>
<text x="342" y="280" font-size="12">&#9648; Ground / Props</text>
<text x="322" y="308">&#128193; COLL_Lighting</text>
<text x="342" y="330" font-size="12">&#9679; Rig lights</text>
<text x="322" y="358">&#128193; COLL_FX</text>
<text x="342" y="380" font-size="12">&#9648; Smoke / Particles</text>
</g>
<rect x="322" y="392" width="216" height="52" rx="7" fill="#1e1e1e" stroke="#4ADE80" stroke-width="1.1"/>
<text x="430" y="412" fill="#4ADE80" font-size="11.5" font-weight="700" text-anchor="middle">Best for</text>
<text x="430" y="430" fill="#d4d4d4" font-size="11" text-anchor="middle">animation, reusable / linked characters</text>

<!-- Column 3: Architectural (by discipline) -->
<rect x="570" y="82" width="260" height="380" rx="10" fill="#2a2a2a" stroke="#B47EE8" stroke-width="1.6"/>
<text x="700" y="108" fill="#B47EE8" font-size="15" font-weight="700" text-anchor="middle">Architectural</text>
<text x="700" y="127" fill="currentColor" font-size="11.5" text-anchor="middle" opacity="0.7">grouped by discipline</text>
<g font-size="13" fill="#d4d4d4">
<text x="592" y="158">&#128193; COLL_Structure</text>
<text x="612" y="180" font-size="12">&#9648; Walls / Floors / Roof</text>
<text x="592" y="208">&#128193; COLL_Interior</text>
<text x="612" y="230" font-size="12">&#9648; Furniture / Decor</text>
<text x="592" y="258">&#128193; COLL_Exterior</text>
<text x="612" y="280" font-size="12">&#9648; Landscape / Vehicles</text>
<text x="592" y="308">&#128193; COLL_Lighting</text>
<text x="612" y="330" font-size="12">&#9679; Sun / Interior / Practical</text>
<text x="592" y="358">&#128193; COLL_Cameras</text>
<text x="612" y="380" font-size="12">&#9678; Exterior / Walkthrough</text>
</g>
<rect x="592" y="392" width="216" height="52" rx="7" fill="#1e1e1e" stroke="#4ADE80" stroke-width="1.1"/>
<text x="700" y="412" fill="#4ADE80" font-size="11.5" font-weight="700" text-anchor="middle">Best for</text>
<text x="700" y="430" fill="#d4d4d4" font-size="11" text-anchor="middle">large sets, multi-camera walkthroughs</text>

<!-- Bottom note -->
<rect x="30" y="480" width="800" height="82" rx="10" fill="#2a2a2a" stroke="#F5C242" stroke-width="1.3"/>
<text x="52" y="508" fill="#F5C242" font-size="14" font-weight="700">&#9888; There is no single correct structure</text>
<text x="52" y="532" fill="#d4d4d4" font-size="13">Any of these works. What matters is that the layout is <tspan fill="#4ADE80" font-weight="700">predictable</tspan> &#8212; anyone (including future you)</text>
<text x="52" y="552" fill="#d4d4d4" font-size="13">can guess where an object lives. Choose a scheme that fits the project and apply it the same way every time.</text>
</svg>
