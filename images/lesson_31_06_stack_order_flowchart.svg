<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="sof-title sof-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="sof-title">General modifier stack order</title>
  <desc id="sof-desc">A vertical flowchart of the recommended modifier stack order in eight stages from top to bottom: data preparation, generation, shape changes, edge refinement, deformation, smoothing, final details, and animation or physics. Each stage lists example modifiers and the reason it sits at that position.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">General stack order</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">A reliable top-to-bottom ordering for most stacks</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- 8 stages, rows of height 56 starting y=130, gap 8 -->
  <!-- connectors between rows -->
  <g stroke="currentColor" opacity="0.3" stroke-width="1.5" stroke-linecap="round">
    <line x1="70" y1="186" x2="70" y2="194"/>
    <line x1="70" y1="250" x2="70" y2="258"/>
    <line x1="70" y1="314" x2="70" y2="322"/>
    <line x1="70" y1="378" x2="70" y2="386"/>
    <line x1="70" y1="442" x2="70" y2="450"/>
    <line x1="70" y1="506" x2="70" y2="514"/>
    <line x1="70" y1="570" x2="70" y2="578"/>
  </g>

  <!-- Stage 1 -->
  <rect x="40" y="130" width="720" height="56" rx="6" fill="#FF6B00" fill-opacity="0.10"/>
  <rect x="40" y="130" width="4" height="56" fill="#FF6B00"/>
  <circle cx="70" cy="158" r="14" fill="#FF6B00"/>
  <text x="70" y="163" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
  <text x="98" y="154" font-size="15" font-weight="600" fill="currentColor">Data preparation</text>
  <text x="98" y="173" font-size="13" fill="currentColor" opacity="0.6">Data Transfer, Weighted Normal &#183; clean inputs before anything generates</text>

  <!-- Stage 2 -->
  <rect x="40" y="194" width="720" height="56" rx="6" fill="#FF6B00" fill-opacity="0.10"/>
  <rect x="40" y="194" width="4" height="56" fill="#FF6B00"/>
  <circle cx="70" cy="222" r="14" fill="#FF6B00"/>
  <text x="70" y="227" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
  <text x="98" y="218" font-size="15" font-weight="600" fill="currentColor">Generation</text>
  <text x="98" y="237" font-size="13" fill="currentColor" opacity="0.6">Mirror, Array, Screw &#183; build all the geometry first</text>

  <!-- Stage 3 -->
  <rect x="40" y="258" width="720" height="56" rx="6" fill="#FF6B00" fill-opacity="0.10"/>
  <rect x="40" y="258" width="4" height="56" fill="#FF6B00"/>
  <circle cx="70" cy="286" r="14" fill="#FF6B00"/>
  <text x="70" y="291" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text>
  <text x="98" y="282" font-size="15" font-weight="600" fill="currentColor">Shape changes</text>
  <text x="98" y="301" font-size="13" fill="currentColor" opacity="0.6">Boolean, Solidify &#183; cut and combine the built geometry</text>

  <!-- Stage 4 -->
  <rect x="40" y="322" width="720" height="56" rx="6" fill="#FF6B00" fill-opacity="0.10"/>
  <rect x="40" y="322" width="4" height="56" fill="#FF6B00"/>
  <circle cx="70" cy="350" r="14" fill="#FF6B00"/>
  <text x="70" y="355" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text>
  <text x="98" y="346" font-size="15" font-weight="600" fill="currentColor">Edge refinement</text>
  <text x="98" y="365" font-size="13" fill="currentColor" opacity="0.6">Bevel &#183; round the new edges Booleans created</text>

  <!-- Stage 5 -->
  <rect x="40" y="386" width="720" height="56" rx="6" fill="#FF6B00" fill-opacity="0.10"/>
  <rect x="40" y="386" width="4" height="56" fill="#FF6B00"/>
  <circle cx="70" cy="414" r="14" fill="#FF6B00"/>
  <text x="70" y="419" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">5</text>
  <text x="98" y="410" font-size="15" font-weight="600" fill="currentColor">Deformation</text>
  <text x="98" y="429" font-size="13" fill="currentColor" opacity="0.6">Curve, Lattice, Simple Deform &#183; bend the finished shape</text>

  <!-- Stage 6 -->
  <rect x="40" y="450" width="720" height="56" rx="6" fill="#FF6B00" fill-opacity="0.10"/>
  <rect x="40" y="450" width="4" height="56" fill="#FF6B00"/>
  <circle cx="70" cy="478" r="14" fill="#FF6B00"/>
  <text x="70" y="483" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">6</text>
  <text x="98" y="474" font-size="15" font-weight="600" fill="currentColor">Smoothing</text>
  <text x="98" y="493" font-size="13" fill="currentColor" opacity="0.6">Subdivision Surface &#183; smooth everything as one of the last steps</text>

  <!-- Stage 7 -->
  <rect x="40" y="514" width="720" height="56" rx="6" fill="#FF6B00" fill-opacity="0.10"/>
  <rect x="40" y="514" width="4" height="56" fill="#FF6B00"/>
  <circle cx="70" cy="542" r="14" fill="#FF6B00"/>
  <text x="70" y="547" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">7</text>
  <text x="98" y="538" font-size="15" font-weight="600" fill="currentColor">Final details</text>
  <text x="98" y="557" font-size="13" fill="currentColor" opacity="0.6">Decimate, Wireframe &#183; last-pass touches on the smoothed mesh</text>

  <!-- Stage 8 -->
  <rect x="40" y="578" width="720" height="56" rx="6" fill="#FF6B00"/>
  <circle cx="70" cy="606" r="14" fill="#fff"/>
  <text x="70" y="611" text-anchor="middle" font-size="14" font-weight="700" fill="#FF6B00">8</text>
  <text x="98" y="602" font-size="15" font-weight="700" fill="#fff">Animation &#183; Physics</text>
  <text x="98" y="621" font-size="13" fill="#fff" opacity="0.85">Armature, Cloth, Soft Body &#183; always evaluates on the final geometry</text>

  <!-- Footer tip -->
  <rect x="40" y="648" width="720" height="28" rx="0" fill="none"/>
  <rect x="40" y="648" width="4" height="28" fill="#FF6B00"/>
  <text x="58" y="667" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Treat this as a starting point, not a law. Some looks need a deliberate reorder.
  </text>
</svg>
