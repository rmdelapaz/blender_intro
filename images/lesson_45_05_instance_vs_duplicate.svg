<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="l45f05-t l45f05-d" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" color="#222">
<title id="l45f05-t">Instances versus full duplicates</title>
<desc id="l45f05-d">Ten copies of one object compared two ways. Full duplicates each store their own mesh data, multiplying memory roughly ten times. Linked instances share a single mesh data block, so memory stays near one copy plus small per-instance transform overhead. Instances win for repeated geometry like trees, bolts, or crowd objects.</desc>
<style>
.title{font-size:15px;font-weight:700;}
.sub{font-size:11.5px;fill:#c8c8c8;}
.cardbg{fill:#2a2a2a;}
.big{font-size:26px;font-weight:800;}
.lab{font-size:12px;font-weight:700;}
.tiny{font-size:9px;fill:#1e1e1e;font-weight:700;}
</style>
<text class="title" x="380" y="38" text-anchor="middle">Ten copies of one object &#8212; two ways to store them</text>
<g>
<rect class="cardbg" x="40" y="64" width="330" height="290" rx="12" stroke="#E63946" stroke-width="2"/>
<text class="lab" x="205" y="92" text-anchor="middle" fill="#E63946">Full duplicates (Shift+D)</text>
<g fill="#E63946" opacity="0.85">
<rect x="70" y="112" width="46" height="46" rx="5"/><rect x="130" y="112" width="46" height="46" rx="5"/><rect x="190" y="112" width="46" height="46" rx="5"/><rect x="250" y="112" width="46" height="46" rx="5"/><rect x="310" y="112" width="46" height="46" rx="5"/>
<rect x="70" y="170" width="46" height="46" rx="5"/><rect x="130" y="170" width="46" height="46" rx="5"/><rect x="190" y="170" width="46" height="46" rx="5"/><rect x="250" y="170" width="46" height="46" rx="5"/><rect x="310" y="170" width="46" height="46" rx="5"/>
</g>
<text class="tiny" x="93" y="139" text-anchor="middle">mesh</text><text class="tiny" x="153" y="139" text-anchor="middle">mesh</text><text class="tiny" x="213" y="139" text-anchor="middle">mesh</text><text class="tiny" x="273" y="139" text-anchor="middle">mesh</text><text class="tiny" x="333" y="139" text-anchor="middle">mesh</text>
<text class="sub" x="205" y="248" text-anchor="middle">10 separate mesh data blocks</text>
<rect x="70" y="266" width="270" height="30" rx="6" fill="#1e1e1e"/>
<rect x="70" y="266" width="270" height="30" rx="6" fill="#E63946" opacity="0.75"/>
<text class="lab" x="205" y="287" text-anchor="middle" fill="#1e1e1e">Memory &#8776; 10&#215;</text>
<text class="sub" x="205" y="322" text-anchor="middle">edit one, the rest stay unchanged</text>
</g>
<g>
<rect class="cardbg" x="390" y="64" width="330" height="290" rx="12" stroke="#4ADE80" stroke-width="2"/>
<text class="lab" x="555" y="92" text-anchor="middle" fill="#4ADE80">Linked instances (Alt+D)</text>
<g fill="#4ADE80" opacity="0.35" stroke="#4ADE80" stroke-width="1.5">
<rect x="420" y="112" width="46" height="46" rx="5"/><rect x="480" y="112" width="46" height="46" rx="5"/><rect x="540" y="112" width="46" height="46" rx="5"/><rect x="600" y="112" width="46" height="46" rx="5"/><rect x="660" y="112" width="46" height="46" rx="5"/>
<rect x="420" y="170" width="46" height="46" rx="5"/><rect x="480" y="170" width="46" height="46" rx="5"/><rect x="540" y="170" width="46" height="46" rx="5"/><rect x="600" y="170" width="46" height="46" rx="5"/><rect x="660" y="170" width="46" height="46" rx="5"/>
</g>
<rect x="500" y="228" width="110" height="34" rx="6" fill="#4ADE80"/>
<text class="tiny" x="555" y="250" text-anchor="middle">1 shared mesh</text>
<g stroke="#4ADE80" stroke-width="1" opacity="0.6" fill="none">
<path d="M443,158 L545,228 M503,158 L550,228 M563,158 L560,228 M623,158 L565,228 M683,158 L570,228"/>
</g>
<rect x="420" y="276" width="270" height="30" rx="6" fill="#1e1e1e"/>
<rect x="420" y="276" width="46" height="30" rx="6" fill="#4ADE80"/>
<text class="lab" x="555" y="297" text-anchor="middle">Memory &#8776; 1&#215; + overhead</text>
<text class="sub" x="555" y="332" text-anchor="middle">edit the mesh once, all update</text>
</g>
</svg>
