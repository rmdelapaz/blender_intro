<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="sv-title sv-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="sv-title">The Six Standard Views: Cameras Around the Cube</title>
  <desc id="sv-desc">A diagram showing the six standard axis-aligned camera positions in Blender, arranged around a central isometric cube. Numpad 1 jumps to the Front view, Numpad 3 to the Right view, and Numpad 7 to the Top view. Adding Ctrl to the same key flips the view to the opposite face: Back, Left, or Bottom. The pattern reserves the bare numpad keys for the front, right, and top faces, and uses Ctrl for the three opposites.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Header -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">The Six Standard Views</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Each numpad shortcut snaps the viewport to one face of the scene cube.</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Operation badge -->
  <text x="400" y="142" font-size="15" font-weight="700" fill="#FF6B00" text-anchor="middle" letter-spacing="2">STANDARD VIEWS</text>
  <text x="400" y="164" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">Numpad 1, 3, 7 and their Ctrl pairs</text>

  <!-- ================================================================ -->
  <!-- Isometric cube centered at (400, 295)                             -->
  <!-- Front face: (370,265) to (430,325)                                -->
  <!-- Top face: parallelogram offset (22, -18)                          -->
  <!-- ================================================================ -->

  <!-- Subtle face tinting (drawn first; wireframe sits on top) -->
  <g opacity="0.07">
    <rect x="370" y="265" width="60" height="60" fill="#FF6B00"/>
    <polygon points="370,265 392,247 452,247 430,265" fill="#FF6B00"/>
    <polygon points="430,265 452,247 452,307 430,325" fill="#FF6B00"/>
  </g>

  <!-- Wireframe -->
  <g stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <rect x="370" y="265" width="60" height="60"/>
    <polygon points="370,265 392,247 452,247 430,265"/>
    <polygon points="430,265 452,247 452,307 430,325"/>
  </g>

  <!-- ================================================================ -->
  <!-- Six camera markers                                                -->
  <!-- Primary (bare numpad keys): full-opacity r=8 orange               -->
  <!-- Secondary (Ctrl + numpad keys): 0.55 opacity r=7 orange           -->
  <!-- ================================================================ -->

  <!-- TOP (above the cube) — primary -->
  <g transform="translate(400, 195)">
    <circle cx="0" cy="0" r="8" fill="#FF6B00"/>
    <circle cx="0" cy="0" r="3" fill="#fff"/>
  </g>
  <text x="400" y="172" font-size="13" font-weight="700" fill="currentColor" text-anchor="middle">TOP</text>
  <text x="400" y="220" font-size="11" font-weight="600" fill="#FF6B00" text-anchor="middle">Numpad 7</text>

  <!-- BOTTOM (below the cube) — secondary -->
  <g transform="translate(400, 385)">
    <circle cx="0" cy="0" r="7" fill="#FF6B00" opacity="0.55"/>
    <circle cx="0" cy="0" r="2.5" fill="#fff"/>
  </g>
  <text x="400" y="411" font-size="13" font-weight="700" fill="currentColor" text-anchor="middle">BOTTOM</text>
  <text x="400" y="428" font-size="11" font-weight="600" fill="#FF6B00" text-anchor="middle">Ctrl + Numpad 7</text>

  <!-- LEFT — secondary -->
  <g transform="translate(250, 290)">
    <circle cx="0" cy="0" r="7" fill="#FF6B00" opacity="0.55"/>
    <circle cx="0" cy="0" r="2.5" fill="#fff"/>
  </g>
  <text x="238" y="285" font-size="13" font-weight="700" fill="currentColor" text-anchor="end">LEFT</text>
  <text x="238" y="301" font-size="11" font-weight="600" fill="#FF6B00" text-anchor="end">Ctrl + Numpad 3</text>

  <!-- RIGHT — primary -->
  <g transform="translate(530, 290)">
    <circle cx="0" cy="0" r="8" fill="#FF6B00"/>
    <circle cx="0" cy="0" r="3" fill="#fff"/>
  </g>
  <text x="542" y="285" font-size="13" font-weight="700" fill="currentColor" text-anchor="start">RIGHT</text>
  <text x="542" y="301" font-size="11" font-weight="600" fill="#FF6B00" text-anchor="start">Numpad 3</text>

  <!-- BACK (upper-left) — secondary -->
  <g transform="translate(310, 220)">
    <circle cx="0" cy="0" r="7" fill="#FF6B00" opacity="0.55"/>
    <circle cx="0" cy="0" r="2.5" fill="#fff"/>
  </g>
  <text x="298" y="215" font-size="13" font-weight="700" fill="currentColor" text-anchor="end">BACK</text>
  <text x="298" y="231" font-size="11" font-weight="600" fill="#FF6B00" text-anchor="end">Ctrl + Numpad 1</text>

  <!-- FRONT (lower-right) — primary -->
  <g transform="translate(490, 360)">
    <circle cx="0" cy="0" r="8" fill="#FF6B00"/>
    <circle cx="0" cy="0" r="3" fill="#fff"/>
  </g>
  <text x="502" y="355" font-size="13" font-weight="700" fill="currentColor" text-anchor="start">FRONT</text>
  <text x="502" y="371" font-size="11" font-weight="600" fill="#FF6B00" text-anchor="start">Numpad 1</text>

  <!-- ================================================================ -->
  <!-- Bottom insets                                                     -->
  <!-- ================================================================ -->

  <g transform="translate(60, 452)">
    <rect x="0" y="0" width="320" height="50" rx="6"
          fill="currentColor" fill-opacity="0.04"
          stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>
    <text x="14" y="20" font-size="11" font-weight="700" fill="currentColor" opacity="0.75" letter-spacing="0.8">THE PATTERN</text>
    <text x="14" y="40" font-size="12" fill="currentColor" opacity="0.8">Bare keys reach Front, Right, Top. Add Ctrl to flip.</text>
  </g>

  <g transform="translate(420, 452)">
    <rect x="0" y="0" width="320" height="50" rx="6"
          fill="currentColor" fill-opacity="0.04"
          stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>
    <text x="14" y="20" font-size="11" font-weight="700" fill="currentColor" opacity="0.75" letter-spacing="0.8">PROJECTION TOGGLE</text>
    <text x="14" y="40" font-size="12" fill="currentColor" opacity="0.8">Numpad 5 swaps perspective and orthographic.</text>
  </g>

  <!-- Footer tip callout -->
  <rect x="40" y="514" width="720" height="34" rx="6"
        fill="#FF6B00" fill-opacity="0.10"
        stroke="#FF6B00" stroke-opacity="0.4"/>
  <text x="54" y="536" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Memorize 1, 3, 7 for the primary views. Ctrl plus the same key always flips you to the opposite face.
  </text>
</svg>
