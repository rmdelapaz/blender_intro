<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="crs-title crs-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="crs-title">Three-point lighting complete setup reference sheet</title>
  <desc id="crs-desc">A one-page quick reference for three-point lighting: a top-view layout of key, fill, and rim lights around the subject and camera; a settings card for each of the three lights with type, size, power, and angle; a lighting ratio table from 2 to 1 through 8 to 1 with mood labels; and a short list of common mistakes to avoid.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Three-Point Lighting Reference</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Key &#183; Fill &#183; Rim &#8211; positions, settings, and ratios at a glance</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ============ Top-view layout diagram (left block) ============ -->
  <text x="40" y="138" font-size="18" font-weight="600" fill="currentColor">Top-view layout</text>

  <!-- subject at center -->
  <circle cx="200" cy="300" r="22" fill="#FF6B00" opacity="0.9"/>
  <text x="200" y="305" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">SUB</text>

  <!-- camera below subject -->
  <rect x="184" y="392" width="32" height="22" rx="3" fill="currentColor" opacity="0.55"/>
  <polygon points="200,392 190,378 210,378" fill="currentColor" opacity="0.55"/>
  <text x="200" y="430" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.7">Camera</text>

  <!-- Key light front-right 45 -->
  <circle cx="296" cy="216" r="16" fill="#667eea"/>
  <text x="296" y="220" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">K</text>
  <line x1="284" y1="227" x2="214" y2="287" stroke="#667eea" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <polygon points="214,287 224,283 221,293" fill="#667eea"/>
  <text x="312" y="200" font-size="12" font-weight="600" fill="#667eea">Key 45&#176;</text>

  <!-- Fill light front-left 45 (opposite key) -->
  <circle cx="104" cy="216" r="16" fill="#6BCF7F"/>
  <text x="104" y="220" font-size="11" font-weight="700" fill="#0f1a14" text-anchor="middle">F</text>
  <line x1="116" y1="227" x2="186" y2="287" stroke="#6BCF7F" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <polygon points="186,287 176,283 179,293" fill="#6BCF7F"/>
  <text x="40" y="200" font-size="12" font-weight="600" fill="#6BCF7F">Fill 45&#176;</text>

  <!-- Rim light behind subject -->
  <circle cx="248" cy="150" r="16" fill="#FF6B9D"/>
  <text x="248" y="154" font-size="11" font-weight="700" fill="#0f1a14" text-anchor="middle">R</text>
  <line x1="240" y1="164" x2="212" y2="284" stroke="#FF6B9D" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <polygon points="212,284 207,274 218,277" fill="#FF6B9D"/>
  <text x="268" y="140" font-size="12" font-weight="600" fill="#FF6B9D">Rim (behind)</text>

  <!-- distance note -->
  <text x="40" y="456" font-size="13" fill="currentColor" opacity="0.6">Lights 3&#8211;5 m from subject. Camera on the key/fill axis.</text>

  <!-- ============ Settings cards (right block) ============ -->
  <text x="400" y="138" font-size="18" font-weight="600" fill="currentColor">Light settings</text>

  <!-- Key card -->
  <rect x="400" y="150" width="360" height="62" rx="6" fill="currentColor" opacity="0.04"/>
  <rect x="400" y="150" width="4" height="62" fill="#667eea"/>
  <text x="416" y="170" font-size="14" font-weight="700" fill="#667eea">KEY LIGHT</text>
  <text x="416" y="189" font-size="13" fill="currentColor">Area &#183; 3&#8211;5 m &#183; 800&#8211;1500 W</text>
  <text x="416" y="206" font-size="13" fill="currentColor" opacity="0.7">45&#176; to the side, 40&#176; above</text>

  <!-- Fill card -->
  <rect x="400" y="222" width="360" height="62" rx="6" fill="currentColor" opacity="0.04"/>
  <rect x="400" y="222" width="4" height="62" fill="#6BCF7F"/>
  <text x="416" y="242" font-size="14" font-weight="700" fill="#6BCF7F">FILL LIGHT</text>
  <text x="416" y="261" font-size="13" fill="currentColor">Area &#183; 4&#8211;6 m &#183; 300&#8211;500 W</text>
  <text x="416" y="278" font-size="13" fill="currentColor" opacity="0.7">Opposite key, eye level &#183; shadows OFF</text>

  <!-- Rim card -->
  <rect x="400" y="294" width="360" height="62" rx="6" fill="currentColor" opacity="0.04"/>
  <rect x="400" y="294" width="4" height="62" fill="#FF6B9D"/>
  <text x="416" y="314" font-size="14" font-weight="700" fill="#FF6B9D">RIM LIGHT</text>
  <text x="416" y="333" font-size="13" fill="currentColor">Spot or Area &#183; 400&#8211;800 W</text>
  <text x="416" y="350" font-size="13" fill="currentColor" opacity="0.7">Behind subject, 45&#8211;60&#176; above</text>

  <!-- Ratio table -->
  <text x="400" y="386" font-size="18" font-weight="600" fill="currentColor">Lighting ratios</text>
  <text x="400" y="410" font-size="13" font-weight="700" fill="currentColor">2:1</text>
  <text x="448" y="410" font-size="13" fill="currentColor" opacity="0.85">50% fill</text>
  <text x="556" y="410" font-size="13" fill="currentColor" opacity="0.6">Soft &#183; beauty</text>

  <text x="400" y="430" font-size="13" font-weight="700" fill="currentColor">3:1</text>
  <text x="448" y="430" font-size="13" fill="currentColor" opacity="0.85">33% fill</text>
  <text x="556" y="430" font-size="13" fill="currentColor" opacity="0.6">Standard</text>

  <text x="400" y="450" font-size="13" font-weight="700" fill="currentColor">4:1</text>
  <text x="448" y="450" font-size="13" fill="currentColor" opacity="0.85">25% fill</text>
  <text x="556" y="450" font-size="13" fill="currentColor" opacity="0.6">Dramatic</text>

  <text x="400" y="470" font-size="13" font-weight="700" fill="currentColor">8:1</text>
  <text x="448" y="470" font-size="13" fill="currentColor" opacity="0.85">12% fill</text>
  <text x="556" y="470" font-size="13" fill="currentColor" opacity="0.6">Film noir</text>

  <!-- ============ Common mistakes (full-width band) ============ -->
  <line x1="40" y1="492" x2="760" y2="492" stroke="currentColor" stroke-width="1" opacity="0.15"/>
  <text x="40" y="518" font-size="18" font-weight="600" fill="currentColor">Avoid these</text>

  <text x="40" y="544" font-size="13" fill="currentColor"><tspan fill="#E63946" font-weight="700">&#215;</tspan> Fill as bright as key (flat, no dimension)</text>
  <text x="40" y="566" font-size="13" fill="currentColor"><tspan fill="#E63946" font-weight="700">&#215;</tspan> Fill light casting its own shadows</text>
  <text x="40" y="588" font-size="13" fill="currentColor"><tspan fill="#E63946" font-weight="700">&#215;</tspan> No rim (subject merges with background)</text>

  <text x="416" y="544" font-size="13" fill="currentColor"><tspan fill="#E63946" font-weight="700">&#215;</tspan> Key too frontal (no modeling)</text>
  <text x="416" y="566" font-size="13" fill="currentColor"><tspan fill="#E63946" font-weight="700">&#215;</tspan> Hard tiny lights (harsh shadow edges)</text>
  <text x="416" y="588" font-size="13" fill="currentColor"><tspan fill="#E63946" font-weight="700">&#215;</tspan> Rim too bright (artificial halo)</text>

  <!-- Footer tip (Variant B left rail, dense 680 position) -->
  <rect x="40" y="641" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Set the key first and judge it alone, then add fill for shadow density and rim for separation.</text>
</svg>
