<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="wt-title wt-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="wt-title">Communicating weight through timing and spacing</title>
  <desc id="wt-desc">Two vertical motion tracks compare a light object and a heavy object falling. The light object, a balloon, drops slowly with many evenly and widely spaced positions. The heavy object, an anvil, starts with positions bunched close together at the top then rapidly widening downward as it accelerates under gravity, covering the distance in fewer frames. Weight is read from the timing and spacing pattern, not from the size of the object.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">WEIGHT THROUGH TIMING</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Spacing between frames tells the viewer how heavy something is</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ============ TRACK 1: LIGHT (balloon, slow, wide-even spacing) ============ -->
  <text x="220" y="150" font-size="18" font-weight="600" fill="currentColor" text-anchor="middle">Light Object</text>

  <!-- name pill -->
  <rect x="150" y="164" width="140" height="26" rx="13" fill="#FF6B00" fill-opacity="0.10"
        stroke="#FF6B00" stroke-opacity="0.35"/>
  <text x="220" y="181" font-size="12" fill="currentColor" text-anchor="middle">LIGHT &#183; balloon</text>

  <!-- vertical path -->
  <path d="M 220 215 L 220 595" fill="none" stroke="currentColor" stroke-width="2"
        stroke-dasharray="6 8" opacity="0.5"/>
  <!-- balloon glyph at start -->
  <ellipse cx="220" cy="225" rx="15" ry="18" fill="#FF6B00" opacity="0.85"/>
  <path d="M 220 243 q -4 6 0 10 q 4 -6 0 -10" fill="#FF6B00" opacity="0.6"/>
  <!-- ghost positions: many, wide, even gaps (slow drift) -->
  <circle cx="220" cy="225" r="9" fill="#FF6B00"/>
  <circle cx="220" cy="285" r="9" fill="#FF6B00" opacity="0.82"/>
  <circle cx="220" cy="345" r="9" fill="#FF6B00" opacity="0.66"/>
  <circle cx="220" cy="405" r="9" fill="#FF6B00" opacity="0.52"/>
  <circle cx="220" cy="465" r="9" fill="#FF6B00" opacity="0.4"/>
  <circle cx="220" cy="525" r="9" fill="#FF6B00" opacity="0.3"/>
  <circle cx="220" cy="585" r="9" fill="#FF6B00" opacity="0.22"/>
  <!-- frame labels (right of dots) -->
  <text x="240" y="229" font-size="12" fill="currentColor" opacity="0.6">f1</text>
  <text x="240" y="289" font-size="12" fill="currentColor" opacity="0.6">f5</text>
  <text x="240" y="349" font-size="12" fill="currentColor" opacity="0.6">f9</text>
  <text x="240" y="409" font-size="12" fill="currentColor" opacity="0.6">f13</text>
  <text x="240" y="469" font-size="12" fill="currentColor" opacity="0.6">f17</text>
  <text x="240" y="529" font-size="12" fill="currentColor" opacity="0.6">f21</text>
  <text x="240" y="589" font-size="12" fill="currentColor" opacity="0.6">f25</text>
  <!-- spacing descriptor -->
  <rect x="120" y="612" width="200" height="26" rx="13" fill="#FF6B00" fill-opacity="0.10"
        stroke="#FF6B00" stroke-opacity="0.35"/>
  <text x="220" y="629" font-size="12" fill="currentColor" text-anchor="middle">Wide, even gaps &#183; 25 frames</text>

  <!-- center divider -->
  <line x1="400" y1="138" x2="400" y2="648" stroke="currentColor" stroke-width="1" opacity="0.12"/>

  <!-- ============ TRACK 2: HEAVY (anvil, bunched then widening) ============ -->
  <text x="580" y="150" font-size="18" font-weight="600" fill="currentColor" text-anchor="middle">Heavy Object</text>

  <!-- name pill -->
  <rect x="510" y="164" width="140" height="26" rx="13" fill="#FF6B00" fill-opacity="0.10"
        stroke="#FF6B00" stroke-opacity="0.35"/>
  <text x="580" y="181" font-size="12" fill="currentColor" text-anchor="middle">HEAVY &#183; anvil</text>

  <!-- vertical path -->
  <path d="M 580 215 L 580 595" fill="none" stroke="currentColor" stroke-width="2"
        stroke-dasharray="6 8" opacity="0.5"/>
  <!-- anvil glyph at start -->
  <g transform="translate(580,225)">
    <rect x="-16" y="-6" width="32" height="7" rx="2" fill="#FF6B00" opacity="0.85"/>
    <rect x="-7" y="1" width="14" height="6" fill="#FF6B00" opacity="0.85"/>
    <rect x="-12" y="7" width="24" height="6" rx="2" fill="#FF6B00" opacity="0.85"/>
  </g>
  <!-- ghost positions: bunched at top, rapidly widening (acceleration) -->
  <circle cx="580" cy="225" r="9" fill="#FF6B00"/>
  <circle cx="580" cy="247" r="9" fill="#FF6B00" opacity="0.85"/>
  <circle cx="580" cy="283" r="9" fill="#FF6B00" opacity="0.7"/>
  <circle cx="580" cy="345" r="9" fill="#FF6B00" opacity="0.55"/>
  <circle cx="580" cy="445" r="9" fill="#FF6B00" opacity="0.4"/>
  <circle cx="580" cy="585" r="9" fill="#FF6B00" opacity="0.28"/>
  <!-- frame labels -->
  <text x="600" y="229" font-size="12" fill="currentColor" opacity="0.6">f1</text>
  <text x="600" y="251" font-size="12" fill="currentColor" opacity="0.6">f2</text>
  <text x="600" y="287" font-size="12" fill="currentColor" opacity="0.6">f3</text>
  <text x="600" y="349" font-size="12" fill="currentColor" opacity="0.6">f4</text>
  <text x="600" y="449" font-size="12" fill="currentColor" opacity="0.6">f5</text>
  <text x="600" y="589" font-size="12" fill="currentColor" opacity="0.6">f6</text>
  <!-- ground line at impact -->
  <line x1="520" y1="600" x2="640" y2="600" stroke="currentColor" stroke-width="2" opacity="0.4"/>
  <!-- spacing descriptor -->
  <rect x="480" y="612" width="200" height="26" rx="13" fill="#FF6B00" fill-opacity="0.10"
        stroke="#FF6B00" stroke-opacity="0.35"/>
  <text x="580" y="629" font-size="12" fill="currentColor" text-anchor="middle">Bunched then widening &#183; 6 frames</text>

  <!-- Footer tip (Variant B, left rail, dense-variant y) -->
  <rect x="40" y="641" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Weight is communicated through timing and spacing, not the object's size alone.
  </text>
</svg>
