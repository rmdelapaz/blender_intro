<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="ag-title ag-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="ag-title">The three animation stages: blocking, spacing, polish</title>
  <desc id="ag-desc">Three sequential panels showing the same bounce at each workflow stage. Panel one, blocking: only the key apex and contact poses on the arc. Panel two, spacing: the in-between positions added along the arc, bunching near the apex. Panel three, polish: squash and stretch on the ball plus a smooth eased arc.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">THE THREE ANIMATION STAGES</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Work the same bounce from keys, to in-betweens, to polish</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ====== Panel 1: BLOCKING ====== -->
  <circle cx="58" cy="150" r="13" fill="#FF6B00"/>
  <text x="58" y="155" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
  <rect x="80" y="138" width="104" height="24" rx="4" fill="#FF6B00" fill-opacity="0.12" stroke="#FF6B00" stroke-opacity="0.45"/>
  <text x="132" y="155" font-size="13" font-weight="700" text-anchor="middle" fill="#FF6B00">BLOCKING</text>
  <text x="40" y="186" font-size="13" fill="currentColor" opacity="0.6">Key poses only: apex + contacts</text>

  <!-- panel ground -->
  <line x1="40" y1="300" x2="270" y2="300" stroke="currentColor" stroke-width="2" opacity="0.5"/>
  <!-- arc (faint guide), control-y = 2*peak-300 so peaks land on the key balls -->
  <path d="M 50 300 Q 110 116 170 300 Q 215 186 260 300" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 5" opacity="0.25"/>
  <!-- only key ghost balls -->
  <circle cx="50" cy="300" r="10" fill="#FF6B00"/>
  <circle cx="110" cy="208" r="11" fill="#FF6B00"/>
  <circle cx="170" cy="300" r="10" fill="#FF6B00"/>
  <circle cx="215" cy="243" r="9" fill="#FF6B00"/>
  <circle cx="260" cy="300" r="9" fill="#FF6B00"/>
  <text x="110" y="194" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.7">apex</text>
  <text x="50" y="326" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.7">contact</text>

  <!-- divider -->
  <line x1="288" y1="138" x2="288" y2="470" stroke="currentColor" stroke-width="1" opacity="0.12"/>

  <!-- ====== Panel 2: SPACING / IN-BETWEENS ====== -->
  <circle cx="316" cy="150" r="13" fill="#FF6B00"/>
  <text x="316" y="155" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
  <rect x="338" y="138" width="120" height="24" rx="4" fill="#FF6B00" fill-opacity="0.12" stroke="#FF6B00" stroke-opacity="0.45"/>
  <text x="398" y="155" font-size="13" font-weight="700" text-anchor="middle" fill="#FF6B00">SPACING</text>
  <text x="304" y="186" font-size="13" fill="currentColor" opacity="0.6">In-betweens added along the arc</text>

  <!-- panel ground -->
  <line x1="304" y1="300" x2="534" y2="300" stroke="currentColor" stroke-width="2" opacity="0.5"/>
  <!-- arc, peaks on keys -->
  <path d="M 314 300 Q 374 116 434 300 Q 479 186 524 300" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="6 5" opacity="0.7"/>
  <!-- keys (larger) -->
  <circle cx="314" cy="300" r="9" fill="#FF6B00"/>
  <circle cx="374" cy="208" r="10" fill="#FF6B00"/>
  <circle cx="434" cy="300" r="9" fill="#FF6B00"/>
  <circle cx="479" cy="243" r="8" fill="#FF6B00"/>
  <circle cx="524" cy="300" r="8" fill="#FF6B00"/>
  <!-- in-between dots ON arch1 (t .25/.375/.625/.75): bunch near apex -->
  <circle cx="344" cy="231" r="4.5" fill="#FF6B00" opacity="0.85"/>
  <circle cx="359" cy="214" r="4.5" fill="#FF6B00" opacity="0.85"/>
  <circle cx="389" cy="214" r="4.5" fill="#FF6B00" opacity="0.85"/>
  <circle cx="404" cy="231" r="4.5" fill="#FF6B00" opacity="0.85"/>
  <!-- in-between dots ON arch2 (t .3/.7) -->
  <circle cx="461" cy="252" r="4" fill="#FF6B00" opacity="0.85"/>
  <circle cx="497" cy="252" r="4" fill="#FF6B00" opacity="0.85"/>
  <text x="374" y="196" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.65">slow</text>
  <text x="324" y="284" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.65">fast</text>

  <!-- divider -->
  <line x1="552" y1="138" x2="552" y2="470" stroke="currentColor" stroke-width="1" opacity="0.12"/>

  <!-- ====== Panel 3: POLISH ====== -->
  <circle cx="580" cy="150" r="13" fill="#FF6B00"/>
  <text x="580" y="155" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
  <rect x="602" y="138" width="96" height="24" rx="4" fill="#FF6B00" fill-opacity="0.12" stroke="#FF6B00" stroke-opacity="0.45"/>
  <text x="650" y="155" font-size="13" font-weight="700" text-anchor="middle" fill="#FF6B00">POLISH</text>
  <text x="568" y="186" font-size="13" fill="currentColor" opacity="0.6">Squash, stretch + eased arc</text>

  <!-- panel ground -->
  <line x1="568" y1="300" x2="760" y2="300" stroke="currentColor" stroke-width="2" opacity="0.5"/>
  <!-- smooth arc, peaks on the apex balls -->
  <path d="M 578 300 Q 632 100 686 300 Q 723 172 760 300" fill="none" stroke="currentColor" stroke-width="2" opacity="0.7"/>
  <!-- neutral at apex (on curve, t .5 = 632,200) -->
  <circle cx="632" cy="200" r="11" fill="#FF6B00"/>
  <!-- stretch on fall (vertical ellipse) on curve near t .2 = 600,236 -->
  <ellipse cx="600" cy="236" rx="6.5" ry="11" fill="#FF6B00"/>
  <!-- stretch rising on curve near t .8 = 664,236 -->
  <ellipse cx="664" cy="236" rx="6.5" ry="11" fill="#FF6B00"/>
  <!-- squash at contacts (horizontal ellipse) on ground -->
  <ellipse cx="578" cy="296" rx="13" ry="6" fill="#FF6B00"/>
  <ellipse cx="686" cy="296" rx="12" ry="6" fill="#FF6B00"/>
  <!-- second smaller apex neutral on curve t .5 = 723,236 -->
  <circle cx="723" cy="236" r="8" fill="#FF6B00"/>
  <text x="578" y="326" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.7">squash</text>
  <text x="596" y="222" font-size="10" text-anchor="end" fill="currentColor" opacity="0.7">stretch</text>

  <!-- Footer tip (Variant B left rail) -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Block the keys, space the in-betweens, then polish &#183; never start with polish.
  </text>
</svg>
