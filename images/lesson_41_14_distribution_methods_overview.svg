<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="dmo-title dmo-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="dmo-title">Distribution methods overview</title>
  <desc id="dmo-desc">Three panels comparing where instances can be placed. Point based scatters instances at existing points. Surface based scatters instances across the faces of a mesh. Volume based fills the inside of a shape with instances.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Distribution Methods</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Three ways to decide where instances go</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Panel geometry: 3 columns. x starts 40, 293, 546; width 214; card top 140 height 320 -->
  <!-- Panel dividers -->
  <line x1="266" y1="150" x2="266" y2="470" stroke="currentColor" stroke-width="1" opacity="0.15"/>
  <line x1="520" y1="150" x2="520" y2="470" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ===== PANEL 1: Point-based ===== -->
  <text x="60" y="170" font-size="16" font-weight="600" fill="currentColor">Point-based</text>
  <text x="60" y="190" font-size="12" fill="currentColor" opacity="0.6">Instances at existing points</text>
  <!-- host: a scatter of source points, instances sit exactly on them -->
  <g transform="translate(60,210)">
    <rect x="0" y="0" width="180" height="180" rx="6" fill="currentColor" opacity="0.04"/>
    <!-- source points (grey ring) + instance glyph (blue) centered on each -->
    <g stroke="#4A9EFF" stroke-width="1.5" fill="#4A9EFF">
      <g><circle cx="35" cy="40" r="3"/><rect x="31" y="18" width="8" height="16" rx="1.5" fill="#4A9EFF"/></g>
      <g><circle cx="95" cy="30" r="3"/><rect x="91" y="8"  width="8" height="16" rx="1.5" fill="#4A9EFF"/></g>
      <g><circle cx="150" cy="55" r="3"/><rect x="146" y="33" width="8" height="16" rx="1.5" fill="#4A9EFF"/></g>
      <g><circle cx="55" cy="95" r="3"/><rect x="51" y="73" width="8" height="16" rx="1.5" fill="#4A9EFF"/></g>
      <g><circle cx="120" cy="105" r="3"/><rect x="116" y="83" width="8" height="16" rx="1.5" fill="#4A9EFF"/></g>
      <g><circle cx="40" cy="150" r="3"/><rect x="36" y="128" width="8" height="16" rx="1.5" fill="#4A9EFF"/></g>
      <g><circle cx="140" cy="150" r="3"/><rect x="136" y="128" width="8" height="16" rx="1.5" fill="#4A9EFF"/></g>
    </g>
  </g>
  <text x="150" y="428" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">Sparse, exact control.</text>
  <text x="150" y="446" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">One instance per point.</text>

  <!-- ===== PANEL 2: Surface-based ===== -->
  <text x="313" y="170" font-size="16" font-weight="600" fill="currentColor">Surface-based</text>
  <text x="313" y="190" font-size="12" fill="currentColor" opacity="0.6">Scattered across faces</text>
  <g transform="translate(313,210)">
    <!-- a slab surface (parallelogram) with many instances scattered on it -->
    <path d="M10 120 L120 60 L180 90 L70 150 Z" fill="#4ADE80" fill-opacity="0.12" stroke="#4ADE80" stroke-width="1.5"/>
    <g fill="#4ADE80">
      <circle cx="45" cy="118" r="3"/><circle cx="70" cy="105" r="3"/><circle cx="95" cy="95" r="3"/>
      <circle cx="120" cy="85" r="3"/><circle cx="60" cy="130" r="3"/><circle cx="88" cy="118" r="3"/>
      <circle cx="112" cy="108" r="3"/><circle cx="138" cy="98" r="3"/><circle cx="78" cy="140" r="3"/>
      <circle cx="104" cy="128" r="3"/><circle cx="130" cy="118" r="3"/><circle cx="150" cy="108" r="3"/>
      <circle cx="55" cy="100" r="3"/><circle cx="82" cy="88" r="3"/><circle cx="108" cy="78" r="3"/>
    </g>
  </g>
  <text x="404" y="428" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">Even coverage on a mesh.</text>
  <text x="404" y="446" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">Density controls count.</text>

  <!-- ===== PANEL 3: Volume-based ===== -->
  <text x="566" y="170" font-size="16" font-weight="600" fill="currentColor">Volume-based</text>
  <text x="566" y="190" font-size="12" fill="currentColor" opacity="0.6">Filling the inside</text>
  <g transform="translate(566,210)">
    <!-- a cube wireframe filled with a 3D lattice of dots -->
    <g stroke="#B47EE8" stroke-width="1.5" fill="none" opacity="0.9">
      <rect x="30" y="35" width="100" height="100"/>
      <path d="M30 35 L60 12 L160 12 L130 35"/>
      <path d="M130 35 L160 12 L160 112 L130 135"/>
    </g>
    <g fill="#B47EE8">
      <circle cx="50" cy="55" r="3"/><circle cx="80" cy="55" r="3"/><circle cx="110" cy="55" r="3"/>
      <circle cx="50" cy="85" r="3"/><circle cx="80" cy="85" r="3"/><circle cx="110" cy="85" r="3"/>
      <circle cx="50" cy="115" r="3"/><circle cx="80" cy="115" r="3"/><circle cx="110" cy="115" r="3"/>
      <circle cx="70" cy="40" r="2.5" opacity="0.7"/><circle cx="100" cy="40" r="2.5" opacity="0.7"/>
      <circle cx="128" cy="45" r="2.5" opacity="0.7"/><circle cx="128" cy="80" r="2.5" opacity="0.7"/>
    </g>
  </g>
  <text x="656" y="428" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">Fills 3D space.</text>
  <text x="656" y="446" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">Good for clouds, swarms.</text>

  <!-- Footer tip -->
  <rect x="40" y="506" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Most scattering uses Distribute Points on Faces (surface-based); reach for points or volume only when you need them.
  </text>
</svg>
