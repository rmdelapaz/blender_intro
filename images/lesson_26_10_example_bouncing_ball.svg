<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="bb-title bb-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="bb-title">Real-world F&#183;Curve: bouncing ball Z-location</title>
  <desc id="bb-desc">A Graph Editor Z-location F-curve for a bouncing ball. A series of parabolic arcs with sharp valleys at each ground contact and rounded peaks at each apex, the peaks getting lower with every bounce as the ball loses energy.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">REAL-WORLD CURVE &#183; BOUNCING BALL</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Z-Location over time &#183; sharp valleys at impact, lower peaks each bounce</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Gridlines: vertical at frame 0,10,20,30,40 ; horizontal at value 0,5 -->
  <g stroke="currentColor" stroke-width="1" opacity="0.15">
    <line x1="110" y1="170" x2="110" y2="460"/>
    <line x1="262" y1="170" x2="262" y2="460"/>
    <line x1="415" y1="170" x2="415" y2="460"/>
    <line x1="567" y1="170" x2="567" y2="460"/>
    <line x1="720" y1="170" x2="720" y2="460"/>
    <line x1="110" y1="460" x2="720" y2="460"/>
    <line x1="110" y1="170" x2="720" y2="170"/>
  </g>

  <!-- Axes -->
  <g stroke="currentColor" stroke-width="1.5" opacity="0.4" stroke-linecap="round">
    <line x1="110" y1="170" x2="110" y2="460"/>
    <line x1="110" y1="460" x2="720" y2="460"/>
  </g>

  <!-- Axis labels + ticks -->
  <text x="110" y="478" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">0</text>
  <text x="262" y="478" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">10</text>
  <text x="415" y="478" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">20</text>
  <text x="567" y="478" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">30</text>
  <text x="720" y="478" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">40</text>
  <text x="415" y="500" font-size="13" fill="currentColor" opacity="0.65" text-anchor="middle">Frame (time)</text>
  <text x="98" y="464" font-size="13" fill="currentColor" opacity="0.6" text-anchor="end">0</text>
  <text x="98" y="174" font-size="13" fill="currentColor" opacity="0.6" text-anchor="end">5</text>
  <text x="78" y="315" font-size="13" fill="currentColor" opacity="0.65" text-anchor="middle" transform="rotate(-90 78 315)">Height (Z)</text>

  <!-- Bounce curve: Z-axis blue. Parabolic arcs, sharp valleys, rounded peaks. -->
  <!-- start(110,170) drop to valley1(262,460); arc to peak1(415,228); down valley2(491,460); peak2(567,315); valley3(613,460); peak3(659,402); settle end(720,460) -->
  <path d="M 110 170
           Q 170 320 262 460
           Q 360 460 415 228
           Q 460 460 491 460
           Q 530 460 567 315
           Q 598 460 613 460
           Q 640 460 659 402
           Q 690 460 720 460"
        fill="none" stroke="#4A9EFF" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Keyframe diamonds: start, valleys, peaks -->
  <g fill="#FF6B00">
    <path d="M 110 161 L 119 170 L 110 179 L 101 170 Z"/>
    <path d="M 262 451 L 271 460 L 262 469 L 253 460 Z"/>
    <path d="M 415 219 L 424 228 L 415 237 L 406 228 Z"/>
    <path d="M 491 451 L 500 460 L 491 469 L 482 460 Z"/>
    <path d="M 567 306 L 576 315 L 567 324 L 558 315 Z"/>
    <path d="M 613 451 L 622 460 L 613 469 L 604 460 Z"/>
    <path d="M 659 393 L 668 402 L 659 411 L 650 402 Z"/>
  </g>

  <!-- Annotation: rounded peak = hang time -->
  <line x1="415" y1="228" x2="415" y2="180" stroke="currentColor" stroke-width="1" opacity="0.3" stroke-linecap="round"/>
  <text x="415" y="172" font-size="14" fill="currentColor" text-anchor="middle">Rounded peak = hang time</text>

  <!-- Annotation: sharp valley = impact -->
  <line x1="262" y1="460" x2="220" y2="425" stroke="currentColor" stroke-width="1" opacity="0.3" stroke-linecap="round"/>
  <text x="214" y="420" font-size="14" fill="currentColor" text-anchor="end">Sharp valley</text>
  <text x="214" y="438" font-size="13" fill="currentColor" opacity="0.65" text-anchor="end">= ground impact</text>

  <!-- Annotation: decreasing heights -->
  <line x1="567" y1="315" x2="600" y2="270" stroke="currentColor" stroke-width="1" opacity="0.3" stroke-linecap="round"/>
  <text x="606" y="266" font-size="14" fill="currentColor">Lower peaks =</text>
  <text x="606" y="284" font-size="13" fill="currentColor" opacity="0.65">energy lost each bounce</text>

  <!-- Footer tip -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Sharp valleys + rounded peaks + falling heights = a ball that reads as having real weight.
  </text>
</svg>
