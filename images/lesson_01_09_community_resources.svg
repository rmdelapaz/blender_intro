<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="cr-title cr-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="cr-title">Blender's Diverse User Community</title>
  <desc id="cr-desc">An overview of the seven kinds of people who use Blender: Independent Artists, Game Developers, Architects, Product Designers, VFX Studios, Educators and Scientists, and 3D Printing makers. Each group is shown as a color-coded card with an icon and short descriptor.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">A Diverse Global Community</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Blender is the everyday tool of artists, studios, scientists, and makers worldwide.</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ===== Row 1: 4 cards ===== -->

  <!-- Card 1: Independent Artists (pink) -->
  <rect x="43" y="140" width="165" height="145" rx="10" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.12"/>
  <circle cx="125.5" cy="188" r="24" fill="#FF7EA8"/>
  <g transform="translate(125.5, 188)">
    <!-- Artist's palette -->
    <path d="M -10 -2 Q -11 -10 -1 -10 Q 9 -10 11 -3 Q 11 5 5 7 Q 1 8 -1 6 L -1 3 Q -2 1 -6 2 Q -10 3 -10 -2 Z" fill="#fff"/>
    <circle cx="-4" cy="-5" r="1.5" fill="#FF6B00"/>
    <circle cx="2" cy="-6" r="1.5" fill="#4ADE80"/>
    <circle cx="6" cy="-1" r="1.5" fill="#4A9EFF"/>
    <circle cx="3" cy="3" r="1.5" fill="#B47EE8"/>
  </g>
  <text x="125.5" y="240" font-size="14" font-weight="600" fill="currentColor" text-anchor="middle">Independent Artists</text>
  <text x="125.5" y="260" font-size="11" fill="currentColor" opacity="0.65" text-anchor="middle">personal projects &amp; careers</text>

  <!-- Card 2: Game Developers (purple) -->
  <rect x="226" y="140" width="165" height="145" rx="10" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.12"/>
  <circle cx="308.5" cy="188" r="24" fill="#B47EE8"/>
  <g transform="translate(308.5, 188)">
    <!-- Game controller -->
    <path d="M -12 -2 Q -12 -6 -7 -5 L 7 -5 Q 12 -6 12 -2 L 12 3 Q 12 9 7 9 Q 4 9 3 6 L -3 6 Q -4 9 -7 9 Q -12 9 -12 3 Z" fill="#fff"/>
    <rect x="-9" y="-1" width="5" height="1.5" rx="0.5" fill="#B47EE8"/>
    <rect x="-7.5" y="-2.5" width="1.5" height="5" rx="0.5" fill="#B47EE8"/>
    <circle cx="4" cy="-1" r="1.3" fill="#B47EE8"/>
    <circle cx="8" cy="2" r="1.3" fill="#B47EE8"/>
  </g>
  <text x="308.5" y="240" font-size="14" font-weight="600" fill="currentColor" text-anchor="middle">Game Developers</text>
  <text x="308.5" y="260" font-size="11" fill="currentColor" opacity="0.65" text-anchor="middle">characters &amp; environments</text>

  <!-- Card 3: Architects (blue) -->
  <rect x="409" y="140" width="165" height="145" rx="10" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.12"/>
  <circle cx="491.5" cy="188" r="24" fill="#4A9EFF"/>
  <g transform="translate(491.5, 188)" fill="#fff">
    <!-- Stepped skyline -->
    <rect x="-10" y="-1" width="6" height="10"/>
    <rect x="-3" y="-6" width="6" height="15"/>
    <rect x="4" y="-9" width="6" height="18"/>
    <rect x="-9" y="2" width="1.5" height="1.5" fill="#4A9EFF"/>
    <rect x="-9" y="5.5" width="1.5" height="1.5" fill="#4A9EFF"/>
    <rect x="-2" y="-3" width="1.5" height="1.5" fill="#4A9EFF"/>
    <rect x="-2" y="0.5" width="1.5" height="1.5" fill="#4A9EFF"/>
    <rect x="-2" y="4" width="1.5" height="1.5" fill="#4A9EFF"/>
    <rect x="5.5" y="-6.5" width="1.5" height="1.5" fill="#4A9EFF"/>
    <rect x="5.5" y="-3" width="1.5" height="1.5" fill="#4A9EFF"/>
    <rect x="5.5" y="0.5" width="1.5" height="1.5" fill="#4A9EFF"/>
    <rect x="5.5" y="4" width="1.5" height="1.5" fill="#4A9EFF"/>
  </g>
  <text x="491.5" y="240" font-size="14" font-weight="600" fill="currentColor" text-anchor="middle">Architects</text>
  <text x="491.5" y="260" font-size="11" fill="currentColor" opacity="0.65" text-anchor="middle">spaces before they exist</text>

  <!-- Card 4: Product Designers (green) -->
  <rect x="592" y="140" width="165" height="145" rx="10" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.12"/>
  <circle cx="674.5" cy="188" r="24" fill="#4ADE80"/>
  <g transform="translate(674.5, 188)">
    <!-- Gear: 6 teeth (one defined, five rotated) around a central white disc -->
    <circle cx="0" cy="0" r="6.5" fill="#fff"/>
    <g fill="#fff">
      <rect x="-2" y="-10" width="4" height="3.5" rx="0.5"/>
      <rect x="-2" y="-10" width="4" height="3.5" rx="0.5" transform="rotate(60)"/>
      <rect x="-2" y="-10" width="4" height="3.5" rx="0.5" transform="rotate(120)"/>
      <rect x="-2" y="-10" width="4" height="3.5" rx="0.5" transform="rotate(180)"/>
      <rect x="-2" y="-10" width="4" height="3.5" rx="0.5" transform="rotate(240)"/>
      <rect x="-2" y="-10" width="4" height="3.5" rx="0.5" transform="rotate(300)"/>
    </g>
    <circle cx="0" cy="0" r="2.8" fill="#4ADE80"/>
  </g>
  <text x="674.5" y="240" font-size="14" font-weight="600" fill="currentColor" text-anchor="middle">Product Designers</text>
  <text x="674.5" y="260" font-size="11" fill="currentColor" opacity="0.65" text-anchor="middle">concepts &amp; prototypes</text>

  <!-- ===== Row 2: 3 cards (centered) ===== -->

  <!-- Card 5: VFX Studios (purple) -->
  <rect x="135" y="305" width="165" height="145" rx="10" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.12"/>
  <circle cx="217.5" cy="353" r="24" fill="#B47EE8"/>
  <g transform="translate(217.5, 353)">
    <!-- Clapperboard -->
    <rect x="-11" y="-2" width="22" height="11" rx="1" fill="#fff"/>
    <path d="M -11 -2 L 11 -7 L 11 -2 Z" fill="#fff"/>
    <path d="M -8 -2.7 L -5.5 -6.5 M -3 -3.2 L -0.5 -7.1 M 2 -3.9 L 4.5 -7.7 M 7 -4.6 L 9.5 -8.4" stroke="#B47EE8" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  </g>
  <text x="217.5" y="405" font-size="14" font-weight="600" fill="currentColor" text-anchor="middle">VFX Studios</text>
  <text x="217.5" y="425" font-size="11" fill="currentColor" opacity="0.65" text-anchor="middle">films &amp; commercials</text>

  <!-- Card 6: Educators &amp; Scientists (gold) -->
  <rect x="318" y="305" width="165" height="145" rx="10" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.12"/>
  <circle cx="400.5" cy="353" r="24" fill="#F5C242"/>
  <g transform="translate(400.5, 353)">
    <!-- Graduation cap with tassel -->
    <path d="M 0 -9 L -12 -3 L 0 3 L 12 -3 Z" fill="#fff"/>
    <path d="M -7 -0.5 L -7 6 Q 0 10 7 6 L 7 -0.5" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="12" y1="-3" x2="12" y2="5" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="12" cy="6" r="1.4" fill="#fff"/>
  </g>
  <text x="400.5" y="405" font-size="14" font-weight="600" fill="currentColor" text-anchor="middle">Educators &amp; Scientists</text>
  <text x="400.5" y="425" font-size="11" fill="currentColor" opacity="0.65" text-anchor="middle">teaching &amp; visualization</text>

  <!-- Card 7: 3D Printing (blue) -->
  <rect x="501" y="305" width="165" height="145" rx="10" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.12"/>
  <circle cx="583.5" cy="353" r="24" fill="#4A9EFF"/>
  <g transform="translate(583.5, 353)">
    <!-- Isometric cube -->
    <path d="M -10 -4 L 0 -10 L 10 -4 L 0 2 Z" fill="#fff"/>
    <path d="M -10 -4 L -10 7 L 0 13 L 0 2" fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 10 -4 L 10 7 L 0 13" fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <text x="583.5" y="405" font-size="14" font-weight="600" fill="currentColor" text-anchor="middle">3D Printing</text>
  <text x="583.5" y="425" font-size="11" fill="currentColor" opacity="0.65" text-anchor="middle">objects you can hold</text>

  <!-- Footer tip -->
  <rect x="40" y="506" width="720" height="34" rx="6" fill="#FF6B00" fill-opacity="0.10" stroke="#FF6B00" stroke-opacity="0.4"/>
  <text x="54" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Whatever you want to make, somebody in this community has already done it &#8212; and posted a tutorial.
  </text>
</svg>
