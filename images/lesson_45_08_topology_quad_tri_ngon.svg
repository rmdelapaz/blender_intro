<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="l45f08-t l45f08-d" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" color="#222">
<title id="l45f08-t">Quads deform cleanly, triangles are situational, n-gons cause trouble</title>
<desc id="l45f08-d">Three topology types compared. Quads, four-sided faces, are the preferred choice: they subdivide and deform predictably. Triangles are acceptable in flat, non-deforming areas but can pinch when animated. N-gons, faces with five or more sides, are unpredictable under subdivision and deformation and should be avoided on final meshes.</desc>
<style>
.title{font-size:15px;font-weight:700;}
.sub{font-size:11.5px;fill:#c8c8c8;}
.name{font-size:14px;font-weight:800;}
.verdict{font-size:11.5px;font-weight:700;}
.note{font-size:10.5px;fill:#c8c8c8;}
</style>
<text class="title" x="380" y="38" text-anchor="middle">Topology: build with quads wherever it matters</text>
<g text-anchor="middle">
<!-- QUAD -->
<rect x="70" y="70" width="180" height="210" rx="8" fill="none" stroke="#4ADE80" stroke-width="2"/>
<rect x="120" y="100" width="80" height="80" fill="none" stroke="#4ADE80" stroke-width="2.5"/>
<text class="name" x="160" y="212" fill="#4ADE80">Quad</text>
<text class="note" x="160" y="230">4 sides</text>
<text class="verdict" x="160" y="258" fill="#4ADE80">Preferred</text>
<!-- TRI -->
<rect x="290" y="70" width="180" height="210" rx="8" fill="none" stroke="#F5C242" stroke-width="2"/>
<path d="M380 100 L420 178 L340 178 Z" fill="none" stroke="#F5C242" stroke-width="2.5"/>
<text class="name" x="380" y="212" fill="#F5C242">Triangle</text>
<text class="note" x="380" y="230">3 sides</text>
<text class="verdict" x="380" y="258" fill="#F5C242">Use with care</text>
<!-- NGON -->
<rect x="510" y="70" width="180" height="210" rx="8" fill="none" stroke="#E63946" stroke-width="2"/>
<path d="M600 98 L638 122 L628 168 L572 168 L562 122 Z" fill="none" stroke="#E63946" stroke-width="2.5"/>
<text class="name" x="600" y="212" fill="#E63946">N-gon</text>
<text class="note" x="600" y="230">5+ sides</text>
<text class="verdict" x="600" y="258" fill="#E63946">Avoid on finals</text>
</g>
<text class="sub" x="380" y="380" text-anchor="middle">Quads subdivide and deform predictably; n-gons behave unpredictably under both.</text>
</svg>
