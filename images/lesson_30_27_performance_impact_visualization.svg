<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="pi-title pi-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="pi-title">Performance impact of retopology and baking</title>
  <desc id="pi-desc">A side-by-side comparison of a five-million-triangle high-poly sculpt against a twenty-thousand-triangle retopologized mesh with a baked normal map. The retopo version shows roughly the same visual quality but dramatically better performance: far lower triangle count and file size, much higher frame rate, and readiness for game engines and animation.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Why Retopology Pays Off</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Same look on screen &#183; a fraction of the cost to render and animate</text>

  <!-- LEFT: High-poly sculpt -->
  <g>
    <rect x="40" y="110" width="330" height="360" rx="12" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.9"/>
    <text x="205" y="142" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor">High-Poly Sculpt</text>

    <!-- dense-mesh glyph -->
    <g stroke="currentColor" stroke-width="1" opacity="0.4" fill="none">
      <circle cx="205" cy="210" r="44"/>
      <path d="M161 210 H249 M205 166 V254 M174 179 L236 241 M236 179 L174 241"/>
      <circle cx="205" cy="210" r="28"/>
      <circle cx="205" cy="210" r="14"/>
    </g>

    <!-- stat rows -->
    <g font-size="13" fill="currentColor">
      <text x="64" y="290">Triangles</text>      <text x="346" y="290" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700">5,000,000</text>
      <text x="64" y="318">File size</text>      <text x="346" y="318" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700">~500 MB</text>
      <text x="64" y="346">Real-time FPS</text>  <text x="346" y="346" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700">8</text>
    </g>
    <line x1="64" y1="362" x2="346" y2="362" stroke="currentColor" stroke-width="1" opacity="0.12"/>
    <g font-size="13" fill="currentColor" opacity="0.8">
      <text x="64" y="392">&#215;&#160; Game-engine ready</text>
      <text x="64" y="420">&#215;&#160; Can be animated</text>
      <text x="64" y="448">&#215;&#160; Practical to ship</text>
    </g>
  </g>

  <!-- CENTER arrow -->
  <g>
    <line x1="378" y1="290" x2="422" y2="290" stroke="#FF6B00" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M414 282 L424 290 L414 298" fill="none" stroke="#FF6B00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="400" y="262" text-anchor="middle" font-size="11" font-weight="700" fill="#FF6B00">RETOPO</text>
    <text x="400" y="318" text-anchor="middle" font-size="11" font-weight="700" fill="#FF6B00">+ BAKE</text>
  </g>

  <!-- RIGHT: Retopo + normal map (highlighted) -->
  <g>
    <rect x="430" y="110" width="330" height="360" rx="12" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-width="2"/>
    <text x="595" y="142" text-anchor="middle" font-size="16" font-weight="700" fill="#FF6B00">Retopo + Normal Map</text>

    <!-- clean-mesh glyph -->
    <g stroke="#FF6B00" stroke-width="1.3" opacity="0.85" fill="none">
      <circle cx="595" cy="210" r="44"/>
      <path d="M551 210 H639 M595 166 V254"/>
      <path d="M564 188 Q595 176 626 188 M564 232 Q595 244 626 232"/>
    </g>

    <g font-size="13" fill="currentColor">
      <text x="454" y="290">Triangles</text>     <text x="736" y="290" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700">20,000</text>
      <text x="454" y="318">File size</text>     <text x="736" y="318" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700">~5 MB</text>
      <text x="454" y="346">Real-time FPS</text> <text x="736" y="346" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700">144</text>
    </g>
    <line x1="454" y1="362" x2="736" y2="362" stroke="currentColor" stroke-width="1" opacity="0.12"/>
    <g font-size="13" fill="currentColor">
      <text x="454" y="392"><tspan fill="#FF6B00" font-weight="700">&#10003;</tspan>&#160; Game-engine ready</text>
      <text x="454" y="420"><tspan fill="#FF6B00" font-weight="700">&#10003;</tspan>&#160; Animation ready</text>
      <text x="454" y="448"><tspan fill="#FF6B00" font-weight="700">&#10003;</tspan>&#160; Ships at scale</text>
    </g>
  </g>

  <!-- Footer headline tip -->
  <rect x="40" y="500" width="4" height="40" fill="#FF6B00"/>
  <text x="58" y="520" font-size="15" font-weight="700" fill="currentColor">Same visual quality &#183; about 250&#215; lighter to run.</text>
  <text x="58" y="540" font-size="13" fill="currentColor" opacity="0.7">The normal map carries the sculpted detail; the mesh stays cheap enough to animate and ship.</text>
</svg>
