<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="og-title og-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="og-title">Orbit rig: parent the camera to an Empty</title>
  <desc id="og-desc">Top-down diagram of an orbit camera rig. The subject sits at the scene center with an Empty named Orbit_Center placed on it. The camera sits out at a radius distance with its lens aimed inward. The camera is parented to the Empty with Ctrl+P, and a Track To constraint keeps it aimed at the center. Animating only the Empty's Z rotation from zero to 360 degrees spins the whole rig so the camera orbits the subject. One animated value drives the entire move.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">ORBIT RIG</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Parent the camera to an Empty and spin the Empty</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Scene center ~ (360, 300). Camera at radius to the right ~ (600, 300). orbit r=240 -->

  <!-- orbit ring (where the camera travels) -->
  <circle cx="360" cy="300" r="240" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.15" stroke-dasharray="6 8"/>

  <!-- radius line center -> camera -->
  <line x1="360" y1="300" x2="592" y2="300" stroke="currentColor" stroke-width="1.5" opacity="0.3" stroke-dasharray="5 5"/>
  <text x="430" y="292" font-size="13" fill="currentColor" opacity="0.6">radius = distance</text>

  <!-- ===== Driven rotation: orange arc arrow ringing the Empty (above center, clears labels) ===== -->
  <defs>
    <marker id="og-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF6B00"/>
    </marker>
  </defs>
  <!-- ~270deg arc at r=78 around center, opening at lower-left, arrowhead = animated rotation -->
  <path d="M 282 300 A 78 78 0 1 0 360 222" fill="none" stroke="#FF6B00" stroke-width="3" stroke-linecap="round" marker-end="url(#og-arrow)"/>
  <text x="360" y="200" font-size="13" font-weight="600" fill="#FF6B00" text-anchor="middle">rotate Empty Z  0&#176; &#8594; 360&#176;</text>

  <!-- ===== Subject + Empty (Orbit_Center) at scene center ===== -->
  <!-- subject cube glyph (neutral, currentColor) -->
  <rect x="342" y="282" width="36" height="36" rx="3" fill="none" stroke="currentColor" stroke-width="2"/>
  <!-- Empty: plain-axes glyph (currentColor cross) co-located on subject -->
  <g stroke="currentColor" stroke-width="2" opacity="0.85" stroke-linecap="round">
    <line x1="360" y1="270" x2="360" y2="330"/>
    <line x1="330" y1="300" x2="390" y2="300"/>
  </g>
  <text x="360" y="356" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">Empty (Orbit_Center)</text>
  <text x="360" y="373" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">+ subject at center</text>

  <!-- ===== Camera body glyph (locked pilot template) at radius, aimed inward (-X) ===== -->
  <g>
    <rect x="604" y="280" width="44" height="40" rx="4" fill="#FF6B00"/>
    <!-- lens nub on the left edge (view direction toward subject) -->
    <path d="M 604 290 L 586 298 L 586 302 L 604 310 Z" fill="#FF6B00"/>
    <text x="626" y="344" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">Camera</text>
  </g>

  <!-- Track To aim ray (camera -> subject), faint annotation -->
  <line x1="586" y1="300" x2="384" y2="300" stroke="currentColor" stroke-width="1.5" opacity="0.25"/>
  <text x="466" y="320" font-size="12" fill="currentColor" opacity="0.6">Track To keeps aim</text>

  <!-- parent-link connector (camera -> Empty), elbow below -->
  <path d="M 626 324 L 626 430 L 360 430 L 360 380" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.3" stroke-dasharray="4 4"/>
  <text x="493" y="424" font-size="13" fill="currentColor" opacity="0.7" text-anchor="middle">Ctrl+P &#183; parent camera to Empty</text>

  <!-- Footer tip (Variant B, left rail) -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Parent the camera to an Empty, then animate only the Empty's Z rotation &#183; one value drives the whole orbit.</text>
</svg>
