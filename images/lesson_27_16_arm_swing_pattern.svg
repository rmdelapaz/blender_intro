<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="as-title as-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="as-title">Oppositional arm swing: forward leg pairs with the opposite arm</title>
  <desc id="as-desc">A top-down view of a walking character facing up the page. The right leg swings forward while the left arm swings forward; the left leg and right arm swing back. This diagonal, opposite pairing keeps the body balanced as it walks. Forward limbs are shown in blue with forward arrows, back limbs in pink with back arrows, and a dashed center line divides left from right.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Arm Swing &#183; Oppositional Pattern</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Top-down view &#183; the forward leg always pairs with the opposite arm</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Legend -->
  <g font-size="13" fill="currentColor">
    <rect x="40" y="126" width="14" height="14" rx="3" fill="#4A9EFF"/>
    <text x="62" y="138" opacity="0.8">Swinging forward</text>
    <rect x="220" y="126" width="14" height="14" rx="3" fill="#FF7EA8"/>
    <text x="242" y="138" opacity="0.8">Swinging back</text>
  </g>

  <!-- Facing indicator (character faces up = "forward" toward top) -->
  <text x="400" y="180" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">&#9650; Direction of travel</text>

  <!-- Center division line (dashed, orange) running head-to-tail -->
  <line x1="400" y1="200" x2="400" y2="430" stroke="#FF6B00" stroke-width="2" stroke-dasharray="7 6" opacity="0.7"/>
  <text x="408" y="424" font-size="11" fill="#FF6B00" opacity="0.8">body center line</text>

  <!-- ============ Character body (top-down torso oval) ============ -->
  <ellipse cx="400" cy="315" rx="46" ry="78" fill="currentColor" opacity="0.16"/>
  <!-- head (top-down, small circle toward travel direction) -->
  <circle cx="400" cy="232" r="26" fill="currentColor" opacity="0.28"/>
  <text x="400" y="237" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.7">head</text>

  <!-- ============ LIMBS ============ -->
  <!-- Convention: character's RIGHT is page-left (top-down, facing up). -->

  <!-- RIGHT LEG forward (blue) : from lower-right of torso reaching toward top -->
  <g stroke="#4A9EFF" stroke-width="13" stroke-linecap="round" fill="none">
    <path d="M 372 360 L 330 250"/>
  </g>
  <line x1="330" y1="262" x2="318" y2="214" stroke="#4A9EFF" stroke-width="3.5" stroke-linecap="round" marker-end="url(#as-fwd)"/>
  <text x="300" y="206" text-anchor="middle" font-size="13" font-weight="600" fill="#4A9EFF">R leg fwd</text>

  <!-- LEFT ARM forward (blue) : from upper-left of torso reaching toward top -->
  <g stroke="#4A9EFF" stroke-width="11" stroke-linecap="round" fill="none">
    <path d="M 438 268 L 486 196"/>
  </g>
  <line x1="478" y1="208" x2="500" y2="170" stroke="#4A9EFF" stroke-width="3.5" stroke-linecap="round" marker-end="url(#as-fwd)"/>
  <text x="520" y="166" text-anchor="middle" font-size="13" font-weight="600" fill="#4A9EFF">L arm fwd</text>

  <!-- LEFT LEG back (pink) : from lower-left of torso reaching toward bottom -->
  <g stroke="#FF7EA8" stroke-width="13" stroke-linecap="round" fill="none">
    <path d="M 428 360 L 470 446"/>
  </g>
  <line x1="470" y1="434" x2="482" y2="476" stroke="#FF7EA8" stroke-width="3.5" stroke-linecap="round" marker-end="url(#as-back)"/>
  <text x="500" y="492" text-anchor="middle" font-size="13" font-weight="600" fill="#FF7EA8">L leg back</text>

  <!-- RIGHT ARM back (pink) : from upper-right of torso reaching toward bottom-left -->
  <g stroke="#FF7EA8" stroke-width="11" stroke-linecap="round" fill="none">
    <path d="M 362 268 L 314 420"/>
  </g>
  <line x1="320" y1="408" x2="304" y2="452" stroke="#FF7EA8" stroke-width="3.5" stroke-linecap="round" marker-end="url(#as-back)"/>
  <text x="286" y="470" text-anchor="middle" font-size="13" font-weight="600" fill="#FF7EA8">R arm back</text>

  <!-- Diagonal pairing brackets (subtle) connecting the two forward limbs and two back limbs -->
  <g stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 5" opacity="0.3" fill="none">
    <path d="M 318 222 Q 400 150 500 184"/>
    <path d="M 308 440 Q 400 500 490 462"/>
  </g>

  <!-- Pairing call-outs -->
  <text x="400" y="146" text-anchor="middle" font-size="12" font-style="italic" fill="currentColor" opacity="0.55">forward pair (diagonal)</text>
  <text x="400" y="516" text-anchor="middle" font-size="12" font-style="italic" fill="currentColor" opacity="0.55">back pair (diagonal)</text>

  <!-- Footer tip (Variant B, left rail) -->
  <rect x="40" y="524" width="720" height="32" rx="0" fill="none"/>
  <rect x="40" y="524" width="4" height="32" fill="#FF6B00"/>
  <text x="58" y="545" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Right leg forward means left arm forward &#183; same-side swinging looks like a robot or a march.
  </text>

  <!-- Arrowhead markers -->
  <defs>
    <marker id="as-fwd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4A9EFF"/>
    </marker>
    <marker id="as-back" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF7EA8"/>
    </marker>
  </defs>
</svg>
