<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" color="#222" role="img" aria-labelledby="mf-title mf-desc">
  <title id="mf-title">Manifold Geometry</title>
  <desc id="mf-desc">A small piece of mesh with one central edge highlighted in green to show how every interior edge in a manifold mesh borders exactly two faces. Annotation cards label the two-face rule, the watertight property, and the 3D-printability requirement.</desc>

  <!-- Top accent rail -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Header band -->
  <text x="400" y="56" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="currentColor">Manifold Geometry</text>
  <text x="400" y="84" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" text-anchor="middle" fill="currentColor" opacity="0.65">Every edge shared by exactly two faces</text>
  <line x1="120" y1="108" x2="680" y2="108" stroke="currentColor" stroke-width="1" opacity="0.25"/>
  <text x="400" y="138" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#FF6B00" letter-spacing="2">WATERTIGHT &#183; 3D-PRINTABLE &#183; SOLID</text>

  <!-- Hero: 2x2 quad patch, 9 verts in 3x3 grid -->
  <g id="mf-mesh">
    <!-- Faint face fills -->
    <polygon points="310,170 400,170 400,282 310,282" fill="currentColor" fill-opacity="0.05"/>
    <polygon points="400,170 490,170 490,282 400,282" fill="currentColor" fill-opacity="0.05"/>
    <polygon points="310,282 400,282 400,395 310,395" fill="currentColor" fill-opacity="0.05"/>
    <polygon points="400,282 490,282 490,395 400,395" fill="currentColor" fill-opacity="0.05"/>

    <!-- Regular edges (11 of the 12; highlighted edge drawn last on top) -->
    <line x1="310" y1="170" x2="400" y2="170" stroke="currentColor" stroke-width="1.4" opacity="0.85"/>
    <line x1="400" y1="170" x2="490" y2="170" stroke="currentColor" stroke-width="1.4" opacity="0.85"/>
    <line x1="310" y1="282" x2="400" y2="282" stroke="currentColor" stroke-width="1.4" opacity="0.85"/>
    <line x1="400" y1="282" x2="490" y2="282" stroke="currentColor" stroke-width="1.4" opacity="0.85"/>
    <line x1="310" y1="395" x2="400" y2="395" stroke="currentColor" stroke-width="1.4" opacity="0.85"/>
    <line x1="400" y1="395" x2="490" y2="395" stroke="currentColor" stroke-width="1.4" opacity="0.85"/>
    <line x1="310" y1="170" x2="310" y2="282" stroke="currentColor" stroke-width="1.4" opacity="0.85"/>
    <line x1="490" y1="170" x2="490" y2="282" stroke="currentColor" stroke-width="1.4" opacity="0.85"/>
    <line x1="310" y1="282" x2="310" y2="395" stroke="currentColor" stroke-width="1.4" opacity="0.85"/>
    <line x1="400" y1="282" x2="400" y2="395" stroke="currentColor" stroke-width="1.4" opacity="0.85"/>
    <line x1="490" y1="282" x2="490" y2="395" stroke="currentColor" stroke-width="1.4" opacity="0.85"/>

    <!-- Highlighted central edge: shared by upper-left and upper-right quads -->
    <line x1="400" y1="170" x2="400" y2="282" stroke="#4ADE80" stroke-width="4" stroke-linecap="round"/>

    <!-- Regular vertex glyphs (orange, 2-layer): 7 of 9 verts -->
    <g id="mf-verts-regular">
      <circle cx="310" cy="170" r="6" fill="#FF6B00" opacity="0.20"/>
      <circle cx="310" cy="170" r="3.5" fill="#FF6B00"/>
      <circle cx="490" cy="170" r="6" fill="#FF6B00" opacity="0.20"/>
      <circle cx="490" cy="170" r="3.5" fill="#FF6B00"/>
      <circle cx="310" cy="282" r="6" fill="#FF6B00" opacity="0.20"/>
      <circle cx="310" cy="282" r="3.5" fill="#FF6B00"/>
      <circle cx="490" cy="282" r="6" fill="#FF6B00" opacity="0.20"/>
      <circle cx="490" cy="282" r="3.5" fill="#FF6B00"/>
      <circle cx="310" cy="395" r="6" fill="#FF6B00" opacity="0.20"/>
      <circle cx="310" cy="395" r="3.5" fill="#FF6B00"/>
      <circle cx="400" cy="395" r="6" fill="#FF6B00" opacity="0.20"/>
      <circle cx="400" cy="395" r="3.5" fill="#FF6B00"/>
      <circle cx="490" cy="395" r="6" fill="#FF6B00" opacity="0.20"/>
      <circle cx="490" cy="395" r="3.5" fill="#FF6B00"/>
    </g>

    <!-- Highlighted-edge endpoint glyphs (green, 3-layer) -->
    <g id="mf-verts-highlight">
      <circle cx="400" cy="170" r="8" fill="#4ADE80" opacity="0.20"/>
      <circle cx="400" cy="170" r="5" fill="#4ADE80"/>
      <circle cx="400" cy="170" r="1.5" fill="#ffffff"/>
      <circle cx="400" cy="282" r="8" fill="#4ADE80" opacity="0.20"/>
      <circle cx="400" cy="282" r="5" fill="#4ADE80"/>
      <circle cx="400" cy="282" r="1.5" fill="#ffffff"/>
    </g>
  </g>

  <!-- Annotation cards -->
  <g id="mf-cards">
    <!-- LEFT card: EXACTLY 2 FACES -->
    <g id="mf-card-left" transform="translate(40, 195)">
      <rect x="0" y="0" width="180" height="100" rx="4" fill="currentColor" fill-opacity="0.04" stroke="#FF6B00" stroke-width="1" stroke-opacity="0.4"/>
      <rect x="0" y="0" width="4" height="100" fill="#FF6B00"/>
      <text x="14" y="22" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#FF6B00">EXACTLY 2 FACES</text>
      <text x="14" y="46" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="currentColor" opacity="0.75">The highlighted edge borders</text>
      <text x="14" y="62" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="currentColor" opacity="0.75">the quad on its left and the</text>
      <text x="14" y="78" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="currentColor" opacity="0.75">quad on its right. That is</text>
      <text x="14" y="94" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="currentColor" opacity="0.75">the manifold rule.</text>
    </g>

    <!-- RIGHT card: WATERTIGHT -->
    <g id="mf-card-right" transform="translate(580, 195)">
      <rect x="0" y="0" width="180" height="100" rx="4" fill="currentColor" fill-opacity="0.04" stroke="#FF6B00" stroke-width="1" stroke-opacity="0.4"/>
      <rect x="0" y="0" width="4" height="100" fill="#FF6B00"/>
      <text x="14" y="22" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#FF6B00">WATERTIGHT</text>
      <text x="14" y="46" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="currentColor" opacity="0.75">A manifold mesh has a clear</text>
      <text x="14" y="62" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="currentColor" opacity="0.75">inside and outside, like a</text>
      <text x="14" y="78" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="currentColor" opacity="0.75">sealed solid object holding</text>
      <text x="14" y="94" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="currentColor" opacity="0.75">water without leaks.</text>
    </g>

    <!-- BOTTOM card: 3D-PRINTABLE (wide single-row variant) -->
    <g id="mf-card-bottom" transform="translate(180, 415)">
      <rect x="0" y="0" width="440" height="50" rx="4" fill="currentColor" fill-opacity="0.04" stroke="#FF6B00" stroke-width="1" stroke-opacity="0.4"/>
      <rect x="0" y="0" width="4" height="50" fill="#FF6B00"/>
      <text x="14" y="22" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#FF6B00">3D-PRINTABLE &#183; BOOLEAN-SAFE &#183; SIM-READY</text>
      <text x="14" y="40" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="currentColor" opacity="0.75">Slicers, booleans, and physics simulations all require manifold input.</text>
    </g>
  </g>

  <!-- Dashed connectors from side cards to the highlighted edge -->
  <g id="mf-connectors" stroke="currentColor" stroke-opacity="0.30" stroke-dasharray="4 3" stroke-width="1" fill="none">
    <line x1="220" y1="226" x2="395" y2="226"/>
    <line x1="580" y1="226" x2="405" y2="226"/>
  </g>

  <!-- Italic takeaway -->
  <text x="400" y="490" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-style="italic" text-anchor="middle" fill="currentColor" opacity="0.75">If you can trace a continuous surface with no holes and no dangling parts, the mesh is manifold.</text>

  <!-- Footer tip card -->
  <g id="mf-tip">
    <rect x="60" y="506" width="680" height="34" rx="4" fill="currentColor" fill-opacity="0.04" stroke="#FF6B00" stroke-width="1" stroke-opacity="0.4"/>
    <rect x="60" y="506" width="4" height="34" fill="#FF6B00"/>
    <text x="74" y="528" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="currentColor" opacity="0.85"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Use Select &gt; All by Trait &gt; Non Manifold to find any edges that violate the rule.</text>
  </g>
</svg>
