<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" role="img" aria-labelledby="mr-title mr-desc" color="#222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="mr-title">Measurement Overlays Reference</title>
  <desc id="mr-desc">A reference table of the four Edit Mode measurement overlays. Edge Length displays the length of each selected edge, for example 2.5 m, and is used for matching real-world dimensions. Edge Angle displays the angle between two connected edges, for example 90 degrees, and is used for checking corners and bevels. Face Area displays the surface area of each face, for example 4.0 square metres, and is used for UV and material budgeting. Face Angle displays the angle a face is tilted relative to the view or neighbours, and is used for checking slopes and draft angles. Edge overlays are colour-coded blue, face overlays orange.</desc>

  <!-- card background -->
  <rect x="0" y="0" width="800" height="680" rx="18" fill="#0f1a14"/>
  <!-- top orange accent strip -->
  <rect x="0" y="0" width="800" height="10" rx="5" fill="#FF6B00"/>

  <!-- header -->
  <text x="40" y="62" font-size="32" font-weight="700" fill="#f5f7f6">Measurement Overlays Reference</text>
  <text x="40" y="90" font-size="17" fill="#9fb0aa">Edit Mode &#8594; Overlays &#8594; Measurement &#8226; toggle each to label geometry live.</text>

  <!-- legend (own row, clear of the header) -->
  <g font-size="14" font-weight="600">
    <rect x="40" y="112" width="14" height="14" rx="3" fill="#4A9EFF"/>
    <text x="60" y="124" fill="#9fb0aa">Edge overlays</text>
    <rect x="178" y="112" width="14" height="14" rx="3" fill="#FF6B00"/>
    <text x="198" y="124" fill="#9fb0aa">Face overlays</text>
  </g>

  <!-- ROW 1: Edge Length (blue) -->
  <g>
    <rect x="40" y="148" width="720" height="110" rx="12" fill="#101c16" stroke="#23362c" stroke-width="2"/>
    <!-- icon tile: single edge with length tick -->
    <rect x="56" y="162" width="82" height="82" rx="10" fill="#16241d" stroke="#4A9EFF" stroke-width="2"/>
    <line x1="74" y1="222" x2="122" y2="188" stroke="#4A9EFF" stroke-width="5" stroke-linecap="round"/>
    <circle cx="74" cy="222" r="5" fill="#4A9EFF"/>
    <circle cx="122" cy="188" r="5" fill="#4A9EFF"/>
    <text x="97" y="178" font-size="13" font-weight="700" fill="#cfe0d8" text-anchor="middle">len</text>
    <!-- text block -->
    <text x="160" y="184" font-size="22" font-weight="700" fill="#f5f7f6">Edge Length</text>
    <text x="160" y="212" font-size="16" fill="#cfe0d8">Length of each selected edge, in scene units.</text>
    <text x="160" y="238" font-size="14" fill="#9fb0aa">Use it to match real-world dimensions and keep edges to spec.</text>
    <!-- example chip -->
    <rect x="636" y="172" width="100" height="40" rx="8" fill="#16241d" stroke="#4A9EFF" stroke-width="2"/>
    <text x="686" y="198" font-size="18" font-weight="700" fill="#4A9EFF" text-anchor="middle">2.5 m</text>
  </g>

  <!-- ROW 2: Edge Angle (blue) -->
  <g>
    <rect x="40" y="270" width="720" height="110" rx="12" fill="#101c16" stroke="#23362c" stroke-width="2"/>
    <!-- icon tile: two edges meeting with angle arc -->
    <rect x="56" y="284" width="82" height="82" rx="10" fill="#16241d" stroke="#4A9EFF" stroke-width="2"/>
    <polyline points="76,350 76,302 124,302" fill="none" stroke="#4A9EFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 76 322 A 20 20 0 0 1 96 302" fill="none" stroke="#cfe0d8" stroke-width="2.5"/>
    <text x="108" y="348" font-size="13" font-weight="700" fill="#cfe0d8" text-anchor="middle">&#176;</text>
    <!-- text block -->
    <text x="160" y="306" font-size="22" font-weight="700" fill="#f5f7f6">Edge Angle</text>
    <text x="160" y="334" font-size="16" fill="#cfe0d8">Angle between two connected, selected edges.</text>
    <text x="160" y="360" font-size="14" fill="#9fb0aa">Use it to check corners, bevels, and chamfer angles.</text>
    <!-- example chip -->
    <rect x="636" y="294" width="100" height="40" rx="8" fill="#16241d" stroke="#4A9EFF" stroke-width="2"/>
    <text x="686" y="320" font-size="18" font-weight="700" fill="#4A9EFF" text-anchor="middle">90&#176;</text>
  </g>

  <!-- ROW 3: Face Area (orange) -->
  <g>
    <rect x="40" y="392" width="720" height="110" rx="12" fill="#101c16" stroke="#23362c" stroke-width="2"/>
    <!-- icon tile: filled quad with area label -->
    <rect x="56" y="406" width="82" height="82" rx="10" fill="#16241d" stroke="#FF6B00" stroke-width="2"/>
    <polygon points="74,470 126,470 114,422 84,422" fill="#FF6B00" fill-opacity="0.22" stroke="#FF6B00" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="97" y="454" font-size="13" font-weight="700" fill="#ffd9b8" text-anchor="middle">area</text>
    <!-- text block -->
    <text x="160" y="428" font-size="22" font-weight="700" fill="#f5f7f6">Face Area</text>
    <text x="160" y="456" font-size="16" fill="#cfe0d8">Surface area of each selected face.</text>
    <text x="160" y="482" font-size="14" fill="#9fb0aa">Use it for UV planning, material budgets, and even spacing.</text>
    <!-- example chip -->
    <rect x="636" y="416" width="100" height="40" rx="8" fill="#16241d" stroke="#FF6B00" stroke-width="2"/>
    <text x="686" y="442" font-size="18" font-weight="700" fill="#FF6B00" text-anchor="middle">4.0 m&#178;</text>
  </g>

  <!-- ROW 4: Face Angle (orange) -->
  <g>
    <rect x="40" y="514" width="720" height="110" rx="12" fill="#101c16" stroke="#23362c" stroke-width="2"/>
    <!-- icon tile: tilted face with slope indicator -->
    <rect x="56" y="528" width="82" height="82" rx="10" fill="#16241d" stroke="#FF6B00" stroke-width="2"/>
    <line x1="72" y1="594" x2="124" y2="594" stroke="#3a4a42" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="72,594 124,594 116,552 88,562" fill="#FF6B00" fill-opacity="0.22" stroke="#FF6B00" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 92 594 A 20 20 0 0 0 99 577" fill="none" stroke="#cfe0d8" stroke-width="2.5"/>
    <!-- text block -->
    <text x="160" y="552" font-size="22" font-weight="700" fill="#f5f7f6">Face Angle</text>
    <text x="160" y="580" font-size="16" fill="#cfe0d8">Angle a face is tilted, relative to its neighbours.</text>
    <text x="160" y="606" font-size="14" fill="#9fb0aa">Use it to verify slopes, roof pitches, and draft angles.</text>
    <!-- example chip -->
    <rect x="636" y="538" width="100" height="40" rx="8" fill="#16241d" stroke="#FF6B00" stroke-width="2"/>
    <text x="686" y="564" font-size="18" font-weight="700" fill="#FF6B00" text-anchor="middle">30&#176;</text>
  </g>

  <!-- footer tip rail -->
  <g>
    <rect x="40" y="642" width="6" height="22" rx="3" fill="#F5C242"/>
    <text x="58" y="659" font-size="15" fill="#9fb0aa">Tip &#8226; overlays only show in Edit Mode &#8226; select the geometry you want labelled first.</text>
  </g>
</svg>
