<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="blm-title blm-desc" color="#222" font-family="'Segoe UI',system-ui,sans-serif">
<title id="blm-title">Mix node blend modes and when to use each</title>
<desc id="blm-desc">A decision chart for the Mix node blend modes: Add brightens and is used for light passes and glows, Multiply darkens and is used for ambient occlusion and shadow, Screen builds glows without clipping, Overlay boosts contrast, and Mix plainly blends two inputs by a factor. Each row shows a small black-and-white swatch demonstrating the result.</desc>
<rect x="0" y="0" width="800" height="600" fill="none"/>
<text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="currentColor">Blend Modes: Which to Use</text>
<text x="400" y="58" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.75">The Mix node blends two images; the mode decides how they combine</text>

<!-- column headers -->
<g font-size="12" font-weight="700" fill="currentColor" opacity="0.7">
  <text x="70" y="92">MODE</text>
  <text x="250" y="92" text-anchor="middle">RESULT</text>
  <text x="360" y="92">WHAT IT DOES</text>
  <text x="560" y="92">REACH FOR IT WHEN</text>
</g>
<line x1="40" y1="100" x2="760" y2="100" stroke="currentColor" stroke-width="1" opacity="0.3"/>

<!-- helper swatch: two overlapping squares A (dark-left) + B (light-right), result middle -->
<!-- ADD -->
<g>
  <rect x="40" y="112" width="720" height="76" rx="8" fill="none" stroke="#4ADE80" stroke-width="1.6"/>
  <text x="58" y="156" font-size="16" font-weight="700" fill="#4ADE80">Add</text>
  <!-- swatch: two mid-grays sum to brighter -->
  <rect x="212" y="126" width="22" height="48" fill="#555"/>
  <rect x="236" y="126" width="22" height="48" fill="#888"/>
  <rect x="260" y="126" width="22" height="48" fill="#e0e0e0"/>
  <text x="360" y="145" font-size="13" fill="currentColor">Sums pixel values &#8212; always brightens</text>
  <text x="360" y="165" font-size="11.5" fill="currentColor" opacity="0.7">Values stack, can blow past white</text>
  <text x="560" y="145" font-size="12.5" fill="currentColor">Recombining light passes,</text>
  <text x="560" y="163" font-size="12.5" fill="currentColor">adding glow / emission back in</text>
</g>

<!-- MULTIPLY -->
<g>
  <rect x="40" y="196" width="720" height="76" rx="8" fill="none" stroke="#E63946" stroke-width="1.6"/>
  <text x="58" y="240" font-size="16" font-weight="700" fill="#E63946">Multiply</text>
  <rect x="212" y="210" width="22" height="48" fill="#cfcfcf"/>
  <rect x="236" y="210" width="22" height="48" fill="#888"/>
  <rect x="260" y="210" width="22" height="48" fill="#4a4a4a"/>
  <text x="360" y="229" font-size="13" fill="currentColor">Multiplies values &#8212; always darkens</text>
  <text x="360" y="249" font-size="11.5" fill="currentColor" opacity="0.7">White keeps, black wipes out</text>
  <text x="560" y="229" font-size="12.5" fill="currentColor">Applying ambient occlusion</text>
  <text x="560" y="247" font-size="12.5" fill="currentColor">or a shadow pass onto color</text>
</g>

<!-- SCREEN -->
<g>
  <rect x="40" y="280" width="720" height="76" rx="8" fill="none" stroke="#4A9EFF" stroke-width="1.6"/>
  <text x="58" y="324" font-size="16" font-weight="700" fill="#4A9EFF">Screen</text>
  <rect x="212" y="294" width="22" height="48" fill="#4a4a4a"/>
  <rect x="236" y="294" width="22" height="48" fill="#888"/>
  <rect x="260" y="294" width="22" height="48" fill="#c4c4c4"/>
  <text x="360" y="313" font-size="13" fill="currentColor">Inverse-multiply &#8212; brightens softly</text>
  <text x="360" y="333" font-size="11.5" fill="currentColor" opacity="0.7">Lifts without harsh clipping</text>
  <text x="560" y="313" font-size="12.5" fill="currentColor">Building up glows and haze</text>
  <text x="560" y="331" font-size="12.5" fill="currentColor">that should not clip to white</text>
</g>

<!-- OVERLAY -->
<g>
  <rect x="40" y="364" width="720" height="76" rx="8" fill="none" stroke="#F5C242" stroke-width="1.6"/>
  <text x="58" y="408" font-size="16" font-weight="700" fill="#F5C242">Overlay</text>
  <rect x="212" y="378" width="22" height="48" fill="#3a3a3a"/>
  <rect x="236" y="378" width="22" height="48" fill="#888"/>
  <rect x="260" y="378" width="22" height="48" fill="#d8d8d8"/>
  <text x="360" y="397" font-size="13" fill="currentColor">Darkens darks, brightens lights</text>
  <text x="360" y="417" font-size="11.5" fill="currentColor" opacity="0.7">Punches up midtone contrast</text>
  <text x="560" y="397" font-size="12.5" fill="currentColor">Adding contrast or texture,</text>
  <text x="560" y="415" font-size="12.5" fill="currentColor">stylized grade overlays</text>
</g>

<!-- MIX -->
<g>
  <rect x="40" y="448" width="720" height="76" rx="8" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <text x="58" y="492" font-size="16" font-weight="700" fill="currentColor">Mix</text>
  <rect x="212" y="462" width="22" height="48" fill="#3a3a3a"/>
  <rect x="236" y="462" width="22" height="48" fill="#cfcfcf"/>
  <rect x="260" y="462" width="22" height="48" fill="#818181"/>
  <text x="360" y="481" font-size="13" fill="currentColor">Plain crossfade by Factor 0 to 1</text>
  <text x="360" y="501" font-size="11.5" fill="currentColor" opacity="0.7">Factor 0.5 = half of each input</text>
  <text x="560" y="481" font-size="12.5" fill="currentColor">Blending two versions, masking</text>
  <text x="560" y="499" font-size="12.5" fill="currentColor">with a Factor input or matte</text>
</g>

<!-- footer key -->
<g>
  <rect x="40" y="540" width="720" height="44" rx="8" fill="none" stroke="#4ADE80" stroke-width="1.6"/>
  <text x="58" y="567" font-size="12.5" fill="currentColor"><tspan font-weight="700" fill="#4ADE80">Rule of thumb:</tspan> Add and Screen lighten, Multiply darkens, Overlay adds contrast, Mix just blends by Factor.</text>
</g>
</svg>
