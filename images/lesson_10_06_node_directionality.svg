<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="nd-title nd-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="nd-title">Node directionality diagram</title>
  <desc id="nd-desc">A generic shader node shown as a rectangle. Three colored input sockets on the left edge are labeled Inputs with arrows pointing into the node; two colored output sockets on the right edge are labeled Outputs with arrows pointing out of the node. A bold orange arrow beneath the node shows that data flows from left to right through the system.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">NODE DIRECTIONALITY</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Data flows left to right &#183; inputs enter, outputs leave</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Generic node body -->
  <rect x="300" y="180" width="200" height="200" rx="10" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="2" stroke-opacity="0.55"/>
  <rect x="300" y="180" width="200" height="34" rx="10" fill="#FF6B00" fill-opacity="0.85"/>
  <rect x="300" y="200" width="200" height="14" fill="#FF6B00" fill-opacity="0.85"/>
  <text x="400" y="203" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">Generic Node</text>
  <text x="400" y="296" font-size="14" text-anchor="middle" fill="currentColor" opacity="0.7">Processing</text>
  <text x="400" y="318" font-size="14" text-anchor="middle" fill="currentColor" opacity="0.7">happens here</text>

  <!-- Inputs label -->
  <text x="150" y="172" font-size="15" font-weight="600" text-anchor="middle" fill="currentColor">Inputs</text>
  <text x="150" y="192" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.55">enter on the left</text>

  <!-- Input arrows + sockets (point INTO node, colored) -->
  <g stroke-linecap="round">
    <line x1="190" y1="244" x2="296" y2="244" stroke="currentColor" stroke-width="2.5" opacity="0.45"/>
    <polygon points="300,244 290,239 290,249" fill="currentColor" opacity="0.45"/>
    <circle cx="300" cy="244" r="9" fill="#facc15" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.5"/>

    <line x1="190" y1="290" x2="296" y2="290" stroke="currentColor" stroke-width="2.5" opacity="0.45"/>
    <polygon points="300,290 290,285 290,295" fill="currentColor" opacity="0.45"/>
    <circle cx="300" cy="290" r="9" fill="#a1a1a1" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.5"/>

    <line x1="190" y1="336" x2="296" y2="336" stroke="currentColor" stroke-width="2.5" opacity="0.45"/>
    <polygon points="300,336 290,331 290,341" fill="currentColor" opacity="0.45"/>
    <circle cx="300" cy="336" r="9" fill="#c084fc" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.5"/>
  </g>

  <!-- Outputs label -->
  <text x="650" y="172" font-size="15" font-weight="600" text-anchor="middle" fill="currentColor">Outputs</text>
  <text x="650" y="192" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.55">leave on the right</text>

  <!-- Output arrows + sockets (point OUT of node, colored) -->
  <g stroke-linecap="round">
    <circle cx="500" cy="262" r="9" fill="#4ADE80" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.5"/>
    <line x1="504" y1="262" x2="606" y2="262" stroke="currentColor" stroke-width="2.5" opacity="0.45"/>
    <polygon points="610,262 600,257 600,267" fill="currentColor" opacity="0.45"/>

    <circle cx="500" cy="318" r="9" fill="#facc15" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.5"/>
    <line x1="504" y1="318" x2="606" y2="318" stroke="currentColor" stroke-width="2.5" opacity="0.45"/>
    <polygon points="610,318 600,313 600,323" fill="currentColor" opacity="0.45"/>
  </g>

  <!-- Flow arrow beneath the node (bold orange, left to right) -->
  <g>
    <line x1="150" y1="440" x2="630" y2="440" stroke="#FF6B00" stroke-width="5" stroke-linecap="round"/>
    <polygon points="650,440 628,429 628,451" fill="#FF6B00"/>
    <text x="400" y="430" font-size="14" font-weight="600" text-anchor="middle" fill="#FF6B00">Data flows left to right</text>
  </g>

  <!-- Footer tip (Variant B, left rail) -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Inputs on the left, outputs on the right &#183; every node, every time.</text>
</svg>
