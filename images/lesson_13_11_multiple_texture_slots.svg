<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="ts-title ts-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="ts-title">Multiple texture slots connected to a Principled BSDF shader</title>
  <desc id="ts-desc">A shader node graph showing three Image Texture nodes labeled Base Color, Roughness, and Metallic, each connecting to the matching input of a central Principled BSDF node, which in turn connects to a Material Output node.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">MULTIPLE TEXTURE SLOTS</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Three Image Texture nodes feed one Principled BSDF &#183; each slot drives a different surface property</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ============ Noodles (drawn first, sit behind nodes) ============ -->
  <g fill="none" stroke-width="2.5" stroke-linecap="round">
    <!-- Base Color image node out (250,196) -> BSDF Base Color in (470,250) -->
    <path d="M 250 196 C 360 196, 360 250, 470 250" stroke="#FF6B00"/>
    <!-- Roughness image node out (250,316) -> BSDF Roughness in (470,290) -->
    <path d="M 250 316 C 360 316, 360 290, 470 290" stroke="#FF6B00"/>
    <!-- Metallic image node out (250,436) -> BSDF Metallic in (470,330) -->
    <path d="M 250 436 C 360 436, 360 330, 470 330" stroke="#FF6B00"/>
    <!-- BSDF out (650,250) -> Material Output Surface in (690,250) -->
    <path d="M 650 250 C 668 250, 672 250, 690 250" stroke="currentColor" opacity="0.5"/>
  </g>

  <!-- ============ Image Texture node: Base Color ============ -->
  <g>
    <rect x="60" y="156" width="190" height="80" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.5"/>
    <rect x="60" y="156" width="190" height="24" rx="8" fill="#4A9EFF" fill-opacity="0.85"/>
    <rect x="60" y="168" width="190" height="12" fill="#4A9EFF" fill-opacity="0.85"/>
    <text x="72" y="173" font-size="13" font-weight="600" fill="#ffffff">Image Texture</text>
    <text x="72" y="202" font-size="14" font-weight="600" fill="currentColor">Base Color</text>
    <text x="72" y="222" font-size="12" fill="currentColor" opacity="0.6">Chest_Color &#183; sRGB</text>
    <!-- output socket -->
    <circle cx="250" cy="196" r="5" fill="#F5C242" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- ============ Image Texture node: Roughness ============ -->
  <g>
    <rect x="60" y="276" width="190" height="80" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.5"/>
    <rect x="60" y="276" width="190" height="24" rx="8" fill="#4A9EFF" fill-opacity="0.85"/>
    <rect x="60" y="288" width="190" height="12" fill="#4A9EFF" fill-opacity="0.85"/>
    <text x="72" y="293" font-size="13" font-weight="600" fill="#ffffff">Image Texture</text>
    <text x="72" y="322" font-size="14" font-weight="600" fill="currentColor">Roughness</text>
    <text x="72" y="342" font-size="12" fill="currentColor" opacity="0.6">Chest_Rough &#183; Non-Color</text>
    <!-- output socket -->
    <circle cx="250" cy="316" r="5" fill="#999999" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- ============ Image Texture node: Metallic ============ -->
  <g>
    <rect x="60" y="396" width="190" height="80" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.5"/>
    <rect x="60" y="396" width="190" height="24" rx="8" fill="#4A9EFF" fill-opacity="0.85"/>
    <rect x="60" y="408" width="190" height="12" fill="#4A9EFF" fill-opacity="0.85"/>
    <text x="72" y="413" font-size="13" font-weight="600" fill="#ffffff">Image Texture</text>
    <text x="72" y="442" font-size="14" font-weight="600" fill="currentColor">Metallic</text>
    <text x="72" y="462" font-size="12" fill="currentColor" opacity="0.6">Chest_Metal &#183; Non-Color</text>
    <!-- output socket -->
    <circle cx="250" cy="436" r="5" fill="#999999" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- ============ Principled BSDF node ============ -->
  <g>
    <rect x="470" y="186" width="180" height="172" rx="8" fill="currentColor" fill-opacity="0.05" stroke="#FF6B00" stroke-opacity="0.55" stroke-width="2"/>
    <rect x="470" y="186" width="180" height="24" rx="8" fill="#FF6B00" fill-opacity="0.9"/>
    <rect x="470" y="198" width="180" height="12" fill="#FF6B00" fill-opacity="0.9"/>
    <text x="482" y="203" font-size="13" font-weight="600" fill="#ffffff">Principled BSDF</text>
    <!-- output socket (BSDF) -->
    <circle cx="650" cy="250" r="5" fill="#9FE84A" stroke="#ffffff" stroke-width="1"/>
    <text x="640" y="240" font-size="11" fill="currentColor" opacity="0.6" text-anchor="end">BSDF</text>
    <!-- input sockets + labels -->
    <circle cx="470" cy="250" r="5" fill="#F5C242" stroke="#ffffff" stroke-width="1"/>
    <text x="484" y="254" font-size="12" fill="currentColor">Base Color</text>
    <circle cx="470" cy="290" r="5" fill="#999999" stroke="#ffffff" stroke-width="1"/>
    <text x="484" y="294" font-size="12" fill="currentColor">Roughness</text>
    <circle cx="470" cy="330" r="5" fill="#999999" stroke="#ffffff" stroke-width="1"/>
    <text x="484" y="334" font-size="12" fill="currentColor">Metallic</text>
  </g>

  <!-- ============ Material Output node ============ -->
  <g>
    <rect x="690" y="216" width="70" height="68" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.5"/>
    <rect x="690" y="216" width="70" height="22" rx="8" fill="#E63946" fill-opacity="0.8"/>
    <rect x="690" y="227" width="70" height="11" fill="#E63946" fill-opacity="0.8"/>
    <text x="699" y="232" font-size="10.5" font-weight="600" fill="#ffffff">Output</text>
    <!-- input socket (Surface) -->
    <circle cx="690" cy="250" r="5" fill="#9FE84A" stroke="#ffffff" stroke-width="1"/>
    <text x="725" y="272" font-size="10" fill="currentColor" opacity="0.6" text-anchor="middle">Surface</text>
  </g>

  <!-- Footer tip (Variant B, left rail) -->
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> One material, many slots &#183; every map shares the same UVs and plugs into its own Principled BSDF input.
  </text>
</svg>
