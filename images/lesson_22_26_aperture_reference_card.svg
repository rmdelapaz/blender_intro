<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="rc-title rc-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="rc-title">Aperture priority quick reference card</title>
  <desc id="rc-desc">A cheat sheet table for choosing an f-stop by scenario. Five rows cover portrait, product, architecture, landscape, and action. For each scenario the card lists a recommended f-stop range shown as an orange badge, a focal length range, the focus target, and the look or feel. Portrait uses f/1.8 to f/2.8 at 85mm and up, focused on the eyes, for an intimate look. Product uses f/4 to f/5.6 at 50 to 85mm, focused on the key feature, for a commercial look. Architecture uses f/8 to f/11 at 24 to 35mm, focused one third into the scene, for a professional look. Landscape uses f/11 to f/16 at 24 to 50mm, focused at the hyperfocal distance, for an epic look. Action uses f/2.8 to f/4 at 50 to 85mm, focused on the subject, for a dynamic look.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Aperture quick reference</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Pick an f-stop by what you are shooting (a starting point for each scenario)</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Column headers (y=150). Columns: Scenario 40-220 | F-stop 230-360 | Focal length 380-520 | Focus target 530-650 | Look 660-760 -->
  <g font-size="12" font-weight="700" fill="currentColor" opacity="0.7">
    <text x="50" y="150">SCENARIO</text>
    <text x="240" y="150">F-STOP</text>
    <text x="390" y="150">FOCAL LENGTH</text>
    <text x="540" y="150">FOCUS TARGET</text>
    <text x="668" y="150">LOOK</text>
  </g>
  <line x1="40" y1="162" x2="760" y2="162" stroke="currentColor" stroke-width="1" opacity="0.2"/>

  <!-- 5 rows, band height 88, tops y=170,258,346,434,522; centers y=214,302,390,478,566 -->
  <!-- zebra tint alternate rows -->
  <rect x="40" y="258" width="720" height="88" fill="currentColor" opacity="0.04"/>
  <rect x="40" y="434" width="720" height="88" fill="currentColor" opacity="0.04"/>

  <!-- f-stop badge: muted-orange cheat-sheet variant (transparent fill, orange border + text) -->
  <!-- badge rect x=235 w=110 h=30 centered vertically in row; text centered -->

  <!-- Row 1: Portrait -->
  <g>
    <text x="50" y="208" font-size="16" font-weight="600" fill="currentColor">Portrait</text>
    <text x="50" y="230" font-size="12" fill="currentColor" opacity="0.6">people, close subjects</text>
    <rect x="235" y="199" width="110" height="30" rx="6" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-opacity="0.7"/>
    <text x="290" y="219" text-anchor="middle" font-size="14" font-weight="700" fill="#FF6B00">f/1.8 to f/2.8</text>
    <text x="390" y="218" font-size="13" fill="currentColor">85mm and up</text>
    <text x="540" y="218" font-size="13" fill="currentColor">The eyes</text>
    <text x="668" y="218" font-size="13" fill="currentColor" opacity="0.75">Intimate</text>
  </g>

  <!-- Row 2: Product -->
  <g>
    <text x="50" y="296" font-size="16" font-weight="600" fill="currentColor">Product</text>
    <text x="50" y="318" font-size="12" fill="currentColor" opacity="0.6">commercial, catalog</text>
    <rect x="235" y="287" width="110" height="30" rx="6" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-opacity="0.7"/>
    <text x="290" y="307" text-anchor="middle" font-size="14" font-weight="700" fill="#FF6B00">f/4 to f/5.6</text>
    <text x="390" y="306" font-size="13" fill="currentColor">50 to 85mm</text>
    <text x="540" y="306" font-size="13" fill="currentColor">Key feature</text>
    <text x="668" y="306" font-size="13" fill="currentColor" opacity="0.75">Commercial</text>
  </g>

  <!-- Row 3: Architecture -->
  <g>
    <text x="50" y="384" font-size="16" font-weight="600" fill="currentColor">Architecture</text>
    <text x="50" y="406" font-size="12" fill="currentColor" opacity="0.6">interiors, buildings</text>
    <rect x="235" y="375" width="110" height="30" rx="6" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-opacity="0.7"/>
    <text x="290" y="395" text-anchor="middle" font-size="14" font-weight="700" fill="#FF6B00">f/8 to f/11</text>
    <text x="390" y="394" font-size="13" fill="currentColor">24 to 35mm</text>
    <text x="540" y="394" font-size="13" fill="currentColor">1/3 into scene</text>
    <text x="668" y="394" font-size="13" fill="currentColor" opacity="0.75">Professional</text>
  </g>

  <!-- Row 4: Landscape -->
  <g>
    <text x="50" y="472" font-size="16" font-weight="600" fill="currentColor">Landscape</text>
    <text x="50" y="494" font-size="12" fill="currentColor" opacity="0.6">wide vistas, depth</text>
    <rect x="235" y="463" width="110" height="30" rx="6" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-opacity="0.7"/>
    <text x="290" y="483" text-anchor="middle" font-size="14" font-weight="700" fill="#FF6B00">f/11 to f/16</text>
    <text x="390" y="482" font-size="13" fill="currentColor">24 to 50mm</text>
    <text x="540" y="482" font-size="13" fill="currentColor">Hyperfocal</text>
    <text x="668" y="482" font-size="13" fill="currentColor" opacity="0.75">Epic</text>
  </g>

  <!-- Row 5: Action -->
  <g>
    <text x="50" y="560" font-size="16" font-weight="600" fill="currentColor">Action</text>
    <text x="50" y="582" font-size="12" fill="currentColor" opacity="0.6">movement, sports</text>
    <rect x="235" y="551" width="110" height="30" rx="6" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-opacity="0.7"/>
    <text x="290" y="571" text-anchor="middle" font-size="14" font-weight="700" fill="#FF6B00">f/2.8 to f/4</text>
    <text x="390" y="570" font-size="13" fill="currentColor">50 to 85mm</text>
    <text x="540" y="570" font-size="13" fill="currentColor">The subject</text>
    <text x="668" y="570" font-size="13" fill="currentColor" opacity="0.75">Dynamic</text>
  </g>

  <line x1="40" y1="610" x2="760" y2="610" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Footer tip callout (Variant B, left rail), dense variant y=641 -->
  <rect x="40" y="641" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Move the subject farther from the background and even a moderate f-stop will blur it nicely.
  </text>
</svg>
