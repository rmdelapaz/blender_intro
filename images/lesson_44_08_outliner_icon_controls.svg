<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 590" role="img" aria-labelledby="oic-title oic-desc" color="#222" font-family="'Segoe UI',system-ui,sans-serif">
<title id="oic-title">Object visibility and control icons in the Outliner</title>
<desc id="oic-desc">Each object row in the Outliner carries four control icons to the right of the name. The eye icon toggles viewport visibility (hover plus H to hide). The arrow icon toggles selectability to lock objects. The camera icon toggles render visibility independently of the viewport. The monitor icon cycles the viewport display mode. A footer highlights the viewport-versus-render distinction.</desc>
<text x="440" y="34" text-anchor="middle" font-size="23" font-weight="700" fill="currentColor">Object Control Icons</text>
<text x="440" y="58" text-anchor="middle" font-size="13.5" fill="currentColor" opacity="0.75">The icons to the right of every object name &#8212; each controls one behavior</text>

<!-- outliner object row mock -->
<rect x="150" y="78" width="580" height="34" rx="6" fill="#2a2a2a"/>
<text x="168" y="100" font-size="13" fill="#d4d4d4" font-family="'Consolas','Courier New',monospace">&#9662; Kitchen_Table</text>
<!-- 4 icons in row -->
<text x="600" y="101" font-size="15" fill="#4A9EFF">&#128065;</text>
<text x="632" y="101" font-size="15" fill="#4ADE80">&#9655;</text>
<text x="664" y="101" font-size="15" fill="#F5C242">&#128247;</text>
<text x="696" y="101" font-size="15" fill="#B47EE8">&#128421;</text>
<!-- pointer lines to the four cards -->
<line x1="605" y1="112" x2="235" y2="150" stroke="currentColor" stroke-width="1" opacity="0.5"/>
<line x1="637" y1="112" x2="655" y2="150" stroke="currentColor" stroke-width="1" opacity="0.5"/>
<line x1="669" y1="112" x2="235" y2="360" stroke="currentColor" stroke-width="1" opacity="0.5"/>
<line x1="701" y1="112" x2="655" y2="360" stroke="currentColor" stroke-width="1" opacity="0.5"/>

<!-- Card 1: Eye / Viewport visibility (#4A9EFF) -->
<g>
<rect x="24" y="150" width="410" height="196" rx="8" fill="#2a2a2a" stroke="#4A9EFF" stroke-width="1.3"/>
<rect x="24" y="150" width="6" height="196" rx="3" fill="#4A9EFF"/>
<text x="48" y="178" font-size="20" fill="#4A9EFF">&#128065;</text>
<text x="78" y="178" font-size="15.5" font-weight="700" fill="#4A9EFF">Eye &#8212; Viewport Visibility</text>
<g fill="#d4d4d4" font-size="12.5">
<text x="46" y="206">Click: hide / show object in viewport</text>
<text x="46" y="230">Hover + H: hide (no click needed!)</text>
<text x="46" y="254">Hover + U: unhide</text>
<text x="46" y="278">Alt + Click: isolate (hide all others)</text>
<text x="46" y="302">Shift + Click: isolate hierarchy</text>
</g>
<rect x="46" y="316" width="366" height="20" rx="10" fill="#1e1e1e" stroke="#4A9EFF" stroke-width="0.8"/>
<text x="54" y="330" font-size="11.5" fill="#4A9EFF">Viewport only &#8212; does not affect the render</text>
</g>

<!-- Card 2: Arrow / Selectability (#4ADE80) -->
<g>
<rect x="446" y="150" width="410" height="196" rx="8" fill="#2a2a2a" stroke="#4ADE80" stroke-width="1.3"/>
<rect x="446" y="150" width="6" height="196" rx="3" fill="#4ADE80"/>
<text x="470" y="178" font-size="18" fill="#4ADE80">&#9655;</text>
<text x="498" y="178" font-size="15.5" font-weight="700" fill="#4ADE80">Arrow &#8212; Selectability</text>
<g fill="#d4d4d4" font-size="12.5">
<text x="468" y="206">Enabled: object is selectable</text>
<text x="468" y="230">Disabled: object cannot be selected</text>
<text x="468" y="254">Use: lock background while working</text>
<text x="468" y="278">on the foreground</text>
<text x="468" y="302">Pro tip: disable on reference objects</text>
</g>
<rect x="468" y="316" width="366" height="20" rx="10" fill="#1e1e1e" stroke="#4ADE80" stroke-width="0.8"/>
<text x="476" y="330" font-size="11.5" fill="#4ADE80">Protects objects from accidental edits</text>
</g>

<!-- Card 3: Camera / Render visibility (#F5C242) -->
<g>
<rect x="24" y="360" width="410" height="196" rx="8" fill="#2a2a2a" stroke="#F5C242" stroke-width="1.3"/>
<rect x="24" y="360" width="6" height="196" rx="3" fill="#F5C242"/>
<text x="48" y="388" font-size="18" fill="#F5C242">&#128247;</text>
<text x="78" y="388" font-size="15.5" font-weight="700" fill="#F5C242">Camera &#8212; Render Visibility</text>
<g fill="#d4d4d4" font-size="12.5">
<text x="46" y="416">Enabled: object renders</text>
<text x="46" y="440">Disabled: excluded from the render</text>
<text x="46" y="464">Still visible in the viewport!</text>
<text x="46" y="488">Use for: guides, helpers, temp objects</text>
</g>
<rect x="46" y="512" width="366" height="34" rx="8" fill="#1e1e1e" stroke="#F5C242" stroke-width="0.8"/>
<text x="54" y="526" font-size="11.5" fill="#F5C242" font-weight="700">Viewport vs. Render distinction</text>
<text x="54" y="540" font-size="11" fill="#d4d4d4">an object can show in viewport yet skip the render</text>
</g>

<!-- Card 4: Monitor / Viewport display (#B47EE8) -->
<g>
<rect x="446" y="360" width="410" height="196" rx="8" fill="#2a2a2a" stroke="#B47EE8" stroke-width="1.3"/>
<rect x="446" y="360" width="6" height="196" rx="3" fill="#B47EE8"/>
<text x="470" y="388" font-size="18" fill="#B47EE8">&#128421;</text>
<text x="498" y="388" font-size="15.5" font-weight="700" fill="#B47EE8">Monitor &#8212; Viewport Display</text>
<g fill="#d4d4d4" font-size="12.5">
<text x="468" y="416">Controls how the object displays</text>
<text x="468" y="440">Options: Textured, Solid, Wire, Bounds</text>
<text x="468" y="464">Click to cycle through display modes</text>
<text x="468" y="488">Use: show proxy as bounds for speed</text>
</g>
<rect x="468" y="512" width="366" height="34" rx="8" fill="#1e1e1e" stroke="#B47EE8" stroke-width="0.8"/>
<text x="476" y="526" font-size="11.5" fill="#B47EE8" font-weight="700">Performance tool</text>
<text x="476" y="540" font-size="11" fill="#d4d4d4">bounds display keeps heavy scenes responsive</text>
</g>
</svg>
