<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="lpf-title lpf-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="lpf-title">Geometry Nodes learning path</title>
  <desc id="lpf-desc">A three-tier learning path for Geometry Nodes: a green Beginner tier covering the interface and first node tree, a blue Intermediate tier covering instancing and curves, and a purple Advanced tier covering fields, simulation, and custom node groups, with arrows and time estimates connecting the tiers.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">LEARNING PATH</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Where to go next with Geometry Nodes, tier by tier</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Tier 1: Beginner (green) -->
  <rect x="40" y="132" width="720" height="140" rx="10" fill="#4ADE80" fill-opacity="0.07" stroke="#4ADE80" stroke-opacity="0.7" stroke-width="2"/>
  <rect x="40" y="132" width="6" height="140" rx="3" fill="#4ADE80"/>
  <text x="66" y="162" font-size="18" font-weight="700" fill="currentColor">Beginner</text>
  <rect x="180" y="146" width="120" height="22" rx="11" fill="#4ADE80" fill-opacity="0.85"/>
  <text x="240" y="161" text-anchor="middle" font-size="12" font-weight="700" fill="#0f1a14">1 to 2 weeks</text>
  <text x="66" y="192" font-size="13" fill="currentColor" opacity="0.85">You are here · build the foundation.</text>
  <g font-size="13" fill="currentColor" opacity="0.8">
    <text x="66" y="220">· Editor interface and node anatomy</text>
    <text x="66" y="242">· Your first node tree, exposing parameters</text>
    <text x="410" y="220">· Data flow and the geometry socket</text>
    <text x="410" y="242">· Reading and connecting sockets</text>
  </g>

  <!-- arrow 1 -->
  <g stroke-linecap="round" fill="none">
    <path d="M 400 272 L 400 296" stroke="#FF6B00" stroke-width="3"/>
    <path d="M 392 288 L 400 300 L 408 288 Z" fill="#FF6B00"/>
  </g>

  <!-- Tier 2: Intermediate (blue) -->
  <rect x="40" y="308" width="720" height="140" rx="10" fill="#4A9EFF" fill-opacity="0.07" stroke="#4A9EFF" stroke-opacity="0.7" stroke-width="2"/>
  <rect x="40" y="308" width="6" height="140" rx="3" fill="#4A9EFF"/>
  <text x="66" y="338" font-size="18" font-weight="700" fill="currentColor">Intermediate</text>
  <rect x="200" y="322" width="120" height="22" rx="11" fill="#4A9EFF" fill-opacity="0.85"/>
  <text x="260" y="337" text-anchor="middle" font-size="12" font-weight="700" fill="#0f1a14">3 to 6 weeks</text>
  <text x="66" y="368" font-size="13" fill="currentColor" opacity="0.85">Make things procedural and reusable.</text>
  <g font-size="13" fill="currentColor" opacity="0.8">
    <text x="66" y="396">· Instance on Points and Random Value</text>
    <text x="66" y="418">· Curves: Resample and Curve to Mesh</text>
    <text x="410" y="396">· Scatter and array workflows</text>
    <text x="410" y="418">· The fence practical project</text>
  </g>

  <!-- arrow 2 -->
  <g stroke-linecap="round" fill="none">
    <path d="M 400 448 L 400 472" stroke="#FF6B00" stroke-width="3"/>
    <path d="M 392 464 L 400 476 L 408 464 Z" fill="#FF6B00"/>
  </g>

  <!-- Tier 3: Advanced (purple) -->
  <rect x="40" y="484" width="720" height="140" rx="10" fill="#B47EE8" fill-opacity="0.07" stroke="#B47EE8" stroke-opacity="0.7" stroke-width="2"/>
  <rect x="40" y="484" width="6" height="140" rx="3" fill="#B47EE8"/>
  <text x="66" y="514" font-size="18" font-weight="700" fill="currentColor">Advanced</text>
  <rect x="180" y="498" width="130" height="22" rx="11" fill="#B47EE8" fill-opacity="0.85"/>
  <text x="245" y="513" text-anchor="middle" font-size="12" font-weight="700" fill="#0f1a14">ongoing</text>
  <text x="66" y="544" font-size="13" fill="currentColor" opacity="0.85">Full procedural power.</text>
  <g font-size="13" fill="currentColor" opacity="0.8">
    <text x="66" y="572">· Fields and per-element attributes</text>
    <text x="66" y="594">· Simulation zones and repeat zones</text>
    <text x="410" y="572">· Custom node groups and tools</text>
    <text x="410" y="594">· Sharing assets across projects</text>
  </g>

  <!-- Footer tip Variant B (680 offsets) -->
  <rect x="40" y="641" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Times are rough guides, not deadlines · rebuild each project from memory before moving up a tier.</text>
</svg>
