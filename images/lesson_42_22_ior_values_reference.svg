<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" role="img" aria-labelledby="ior-title ior-desc" color="#222">
<title id="ior-title">IOR Values Reference</title>
<desc id="ior-desc">Reference chart of Index of Refraction values for common materials from air at 1.0 to diamond at 2.42, each row pairing the material name and value with a small sphere whose reflectivity rises with the IOR.</desc>
<defs>
<radialGradient id="glo" cx="38%" cy="34%" r="72%"><stop offset="0%" stop-color="#fff"/><stop offset="55%" stop-color="#9aa"/><stop offset="100%" stop-color="#223"/></radialGradient>
</defs>
<style>
.lbl{fill:currentColor;font-family:'Segoe UI',Arial,sans-serif;}
.hd{font-size:26px;font-weight:700;}
.ch{font-size:13px;font-weight:700;fill:currentColor;opacity:.7;}
.mat{font-size:18px;font-weight:600;}
.val{font-size:19px;font-weight:700;font-family:Consolas,'Courier New',monospace;fill:#4A9EFF;}
.row{stroke:currentColor;stroke-width:1;opacity:.25;}
</style>
<text x="400" y="44" text-anchor="middle" class="lbl hd">IOR Values Reference</text>
<text x="400" y="70" text-anchor="middle" class="lbl ch" style="opacity:.75">Index of Refraction &#183; higher value, stronger surface reflection</text>

<!-- column headers -->
<text x="90"  y="106" class="lbl ch">MATERIAL</text>
<text x="430" y="106" class="lbl ch">IOR</text>
<text x="640" y="106" class="lbl ch">REFLECTIVITY</text>
<line x1="70" y1="116" x2="730" y2="116" class="row"/>

<!-- rows: y baseline every 68 -->
<!-- Air 1.0 -->
<g transform="translate(0,150)">
<text x="90" y="6" class="lbl mat">Air</text><text x="430" y="6" class="lbl val">1.00</text>
<circle cx="650" cy="0" r="20" fill="url(#glo)"/><circle cx="650" cy="0" r="20" fill="#000" opacity=".55"/>
<line x1="70" y1="34" x2="730" y2="34" class="row"/>
</g>
<!-- Water 1.33 -->
<g transform="translate(0,218)">
<text x="90" y="6" class="lbl mat">Water</text><text x="430" y="6" class="lbl val">1.33</text>
<circle cx="650" cy="0" r="20" fill="url(#glo)"/><circle cx="650" cy="0" r="20" fill="#000" opacity=".4"/>
<line x1="70" y1="34" x2="730" y2="34" class="row"/>
</g>
<!-- Glass 1.5 -->
<g transform="translate(0,286)">
<text x="90" y="6" class="lbl mat">Glass</text><text x="430" y="6" class="lbl val">1.50</text>
<circle cx="650" cy="0" r="20" fill="url(#glo)"/><circle cx="650" cy="0" r="20" fill="#000" opacity=".28"/>
<line x1="70" y1="34" x2="730" y2="34" class="row"/>
</g>
<!-- Plastic 1.45 -->
<g transform="translate(0,354)">
<text x="90" y="6" class="lbl mat">Plastic</text><text x="430" y="6" class="lbl val">1.45</text>
<circle cx="650" cy="0" r="20" fill="url(#glo)"/><circle cx="650" cy="0" r="20" fill="#000" opacity=".32"/>
<line x1="70" y1="34" x2="730" y2="34" class="row"/>
</g>
<!-- Crystal 2.0 -->
<g transform="translate(0,422)">
<text x="90" y="6" class="lbl mat">Crystal</text><text x="430" y="6" class="lbl val">2.00</text>
<circle cx="650" cy="0" r="20" fill="url(#glo)"/><circle cx="650" cy="0" r="20" fill="#000" opacity=".15"/>
<line x1="70" y1="34" x2="730" y2="34" class="row"/>
</g>
<!-- Diamond 2.42 -->
<g transform="translate(0,490)">
<text x="90" y="6" class="lbl mat" fill="#F5C242">Diamond</text><text x="430" y="6" class="lbl val" fill="#F5C242">2.42</text>
<circle cx="650" cy="0" r="20" fill="url(#glo)"/><circle cx="650" cy="0" r="20" fill="#000" opacity=".05"/>
<line x1="70" y1="34" x2="730" y2="34" class="row"/>
</g>

<text x="400" y="570" text-anchor="middle" class="lbl ch" style="opacity:.7">Set the Principled BSDF IOR to match the real material, dielectrics sit near 1.5.</text>
</svg>
