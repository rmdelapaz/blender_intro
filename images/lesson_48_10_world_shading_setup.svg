<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" color="#222" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" role="img" aria-labelledby="wss-t wss-d">
  <title id="wss-t">World, HDRI, and Color Management Setup</title>
  <desc id="wss-d">A concept map of the three scene-wide settings that decide how a product render reads before any lamp is placed &#8212; the World shader with an HDRI environment providing ambient light and reflections, the render engine set to Cycles for physically accurate results, and the color-management view transform (AgX or Filmic) that tames highlights &#8212; each with a note on why it matters for photorealism.</desc>
  <rect x="0" y="0" width="760" height="480" fill="none"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="currentColor">Scene Foundation: World, HDRI &amp; Color</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#8a8f98">Three global settings that shape realism before the first lamp</text>

  <!-- center: the scene -->
  <rect x="316" y="212" width="128" height="72" rx="10" fill="#FF6B00" opacity="0.9"/>
  <text x="380" y="245" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">THE</text>
  <text x="380" y="264" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">RENDER</text>

  <!-- connectors -->
  <g stroke="#666" stroke-width="1.5">
    <line x1="316" y1="230" x2="230" y2="150"/>
    <line x1="444" y1="230" x2="540" y2="150"/>
    <line x1="380" y1="284" x2="380" y2="352"/>
  </g>

  <!-- Node A: World + HDRI -->
  <g>
    <rect x="60" y="96" width="320" height="118" rx="8" fill="#4A9EFF" opacity="0.12"/>
    <rect x="60" y="96" width="320" height="118" rx="8" fill="none" stroke="#4A9EFF" stroke-width="1.5"/>
    <text x="78" y="122" font-size="14" font-weight="700" fill="#4A9EFF">1 &#183; World + HDRI environment</text>
    <!-- mini hdri dome -->
    <path d="M 90 190 A 40 40 0 0 1 170 190 Z" fill="#4A9EFF" opacity="0.3"/>
    <line x1="90" y1="190" x2="170" y2="190" stroke="#4A9EFF" stroke-width="1.5"/>
    <circle cx="130" cy="186" r="8" fill="#F5C242"/>
    <text x="188" y="156" font-size="12" fill="currentColor">Wraps the scene in real-world</text>
    <text x="188" y="174" font-size="12" fill="currentColor">ambient light + reflections.</text>
    <text x="188" y="196" font-size="11" fill="#8a8f98">Studio HDRI = instant believable</text>
    <text x="188" y="210" font-size="11" fill="#8a8f98">fill and specular highlights.</text>
  </g>

  <!-- Node B: engine / Cycles -->
  <g>
    <rect x="380" y="96" width="320" height="118" rx="8" fill="#B47EE8" opacity="0.12"/>
    <rect x="380" y="96" width="320" height="118" rx="8" fill="none" stroke="#B47EE8" stroke-width="1.5"/>
    <text x="398" y="122" font-size="14" font-weight="700" fill="#B47EE8">2 &#183; Engine: Cycles</text>
    <circle cx="430" cy="176" r="22" fill="none" stroke="#B47EE8" stroke-width="2"/>
    <line x1="430" y1="154" x2="430" y2="132" stroke="#F5C242" stroke-width="2"/>
    <line x1="430" y1="176" x2="452" y2="188" stroke="#B47EE8" stroke-width="2"/>
    <text x="470" y="156" font-size="12" fill="currentColor">Path-traced, physically based.</text>
    <text x="470" y="174" font-size="12" fill="currentColor">True reflections &amp; caustics.</text>
    <text x="470" y="196" font-size="11" fill="#8a8f98">Slower than EEVEE but the</text>
    <text x="470" y="210" font-size="11" fill="#8a8f98">realism payoff is decisive.</text>
  </g>

  <!-- Node C: color management -->
  <g>
    <rect x="180" y="356" width="400" height="104" rx="8" fill="#4ADE80" opacity="0.12"/>
    <rect x="180" y="356" width="400" height="104" rx="8" fill="none" stroke="#4ADE80" stroke-width="1.5"/>
    <text x="198" y="382" font-size="14" font-weight="700" fill="#4ADE80">3 &#183; Color management: AgX / Filmic view transform</text>
    <!-- tone curve -->
    <path d="M 210 440 Q 240 440 260 416 Q 280 396 320 396" fill="none" stroke="#4ADE80" stroke-width="2"/>
    <line x1="210" y1="396" x2="210" y2="440" stroke="#666" stroke-width="1"/>
    <line x1="210" y1="440" x2="320" y2="440" stroke="#666" stroke-width="1"/>
    <text x="340" y="410" font-size="12" fill="currentColor">Rolls off bright highlights so hot</text>
    <text x="340" y="428" font-size="12" fill="currentColor">reflections don't clip to flat white.</text>
    <text x="340" y="450" font-size="11" fill="#8a8f98">Standard view = blown, plasticky look. Fix this first.</text>
  </g>
</svg>
