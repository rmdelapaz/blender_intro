<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="ns-title ns-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="ns-title">Timeline navigation shortcuts reference</title>
  <desc id="ns-desc">A keyboard shortcut reference card for navigating Blender's Timeline. Spacebar plays or pauses. Left and right arrows step one frame. Up and down arrows jump to the next or previous keyframe. Shift plus left or right arrow jumps to the start or end of the frame range.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Timeline Navigation</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Keyboard shortcuts for moving through your animation</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ===== Group 1: Playback ===== -->
  <text x="40" y="150" font-size="18" font-weight="600" fill="currentColor">Playback</text>
  <!-- Spacebar key: wide muted key -->
  <rect x="40" y="168" width="220" height="44" rx="8" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-width="1.5"/>
  <text x="150" y="196" font-size="16" font-weight="700" fill="#FF6B00" text-anchor="middle">Spacebar</text>
  <text x="280" y="190" font-size="14" font-weight="500" fill="currentColor">Play / Pause</text>
  <text x="280" y="208" font-size="13" fill="currentColor" opacity="0.6">Toggle animation playback</text>

  <!-- ===== Group 2: Frame navigation ===== -->
  <text x="40" y="262" font-size="18" font-weight="600" fill="currentColor">Frame Navigation</text>

  <!-- Left arrow -->
  <rect x="40" y="280" width="48" height="44" rx="8" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-width="1.5"/>
  <text x="64" y="309" font-size="20" font-weight="700" fill="#FF6B00" text-anchor="middle">&#8592;</text>
  <text x="100" y="302" font-size="14" font-weight="500" fill="currentColor">Previous frame</text>
  <text x="100" y="320" font-size="13" fill="currentColor" opacity="0.6">Step back one frame</text>

  <!-- Right arrow -->
  <rect x="420" y="280" width="48" height="44" rx="8" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-width="1.5"/>
  <text x="444" y="309" font-size="20" font-weight="700" fill="#FF6B00" text-anchor="middle">&#8594;</text>
  <text x="480" y="302" font-size="14" font-weight="500" fill="currentColor">Next frame</text>
  <text x="480" y="320" font-size="13" fill="currentColor" opacity="0.6">Step forward one frame</text>

  <!-- Up arrow -->
  <rect x="40" y="338" width="48" height="44" rx="8" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-width="1.5"/>
  <text x="64" y="367" font-size="20" font-weight="700" fill="#FF6B00" text-anchor="middle">&#8593;</text>
  <text x="100" y="360" font-size="14" font-weight="500" fill="currentColor">Jump to next keyframe</text>
  <text x="100" y="378" font-size="13" fill="currentColor" opacity="0.6">Skip to the following key</text>

  <!-- Down arrow -->
  <rect x="420" y="338" width="48" height="44" rx="8" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-width="1.5"/>
  <text x="444" y="367" font-size="20" font-weight="700" fill="#FF6B00" text-anchor="middle">&#8595;</text>
  <text x="480" y="360" font-size="14" font-weight="500" fill="currentColor">Jump to previous keyframe</text>
  <text x="480" y="378" font-size="13" fill="currentColor" opacity="0.6">Skip to the prior key</text>

  <!-- ===== Group 3: Quick jump ===== -->
  <text x="40" y="420" font-size="18" font-weight="600" fill="currentColor">Quick Jump</text>

  <!-- Shift + Left -->
  <rect x="40" y="438" width="74" height="44" rx="8" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-width="1.5"/>
  <text x="77" y="466" font-size="13" font-weight="700" fill="#FF6B00" text-anchor="middle">Shift</text>
  <text x="124" y="466" font-size="16" font-weight="700" fill="currentColor" opacity="0.4">+</text>
  <rect x="140" y="438" width="48" height="44" rx="8" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-width="1.5"/>
  <text x="164" y="467" font-size="20" font-weight="700" fill="#FF6B00" text-anchor="middle">&#8592;</text>
  <text x="204" y="460" font-size="14" font-weight="500" fill="currentColor">Jump to start</text>
  <text x="204" y="478" font-size="13" fill="currentColor" opacity="0.6">First frame of the range</text>

  <!-- Shift + Right -->
  <rect x="40" y="496" width="74" height="44" rx="8" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-width="1.5"/>
  <text x="77" y="524" font-size="13" font-weight="700" fill="#FF6B00" text-anchor="middle">Shift</text>
  <text x="124" y="524" font-size="16" font-weight="700" fill="currentColor" opacity="0.4">+</text>
  <rect x="140" y="496" width="48" height="44" rx="8" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-width="1.5"/>
  <text x="164" y="525" font-size="20" font-weight="700" fill="#FF6B00" text-anchor="middle">&#8594;</text>
  <text x="204" y="518" font-size="14" font-weight="500" fill="currentColor">Jump to end</text>
  <text x="204" y="536" font-size="13" fill="currentColor" opacity="0.6">Last frame of the range</text>

  <!-- divider above note -->
  <line x1="40" y1="568" x2="760" y2="568" stroke="currentColor" stroke-width="1" opacity="0.15"/>
  <text x="40" y="596" font-size="13" fill="currentColor" opacity="0.6">Arrow keys work with the cursor over the Timeline or 3D viewport.</text>

  <!-- Footer tip (Variant B, 680 variant: y=641) -->
  <rect x="40" y="641" width="720" height="34" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Up / Down arrows snap straight to keyframes, so you can review poses without scrubbing frame by frame.
  </text>
</svg>
