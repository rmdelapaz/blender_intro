<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="car06-title car06-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="car06-title">Follow-Through and Overlap</title>
  <desc id="car06-desc">A stopping figure whose main body has halted while looser parts such as hair, a coat, and hands lag behind and keep moving, illustrating that connected parts trail the leading mass instead of stopping all at once.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Follow-Through and Overlap</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">When the body stops, loose parts keep going and catch up late.</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <text x="40" y="150" font-size="18" font-weight="600" fill="currentColor">Leading mass vs trailing parts</text>

  <path d="M 120 200 L 300 200" stroke="currentColor" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
  <path d="M 288 192 L 302 200 L 288 208" stroke="currentColor" stroke-width="2" opacity="0.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="150" y="190" font-size="12" fill="currentColor" opacity="0.55">travel</text>
  <line x1="330" y1="180" x2="330" y2="430" stroke="#E63946" stroke-width="2" stroke-dasharray="6 6" opacity="0.7"/>
  <text x="338" y="196" font-size="12" fill="#E63946" opacity="0.9">stop line</text>

  <circle cx="300" cy="270" r="22" fill="#FF6B00" opacity="0.85"/>
  <text x="300" y="275" text-anchor="middle" font-size="12" font-weight="700" fill="#0f1a14">BODY</text>
  <rect x="278" y="292" width="44" height="90" rx="10" fill="#FF6B00" opacity="0.75"/>

  <path d="M 300 252 Q 360 245 400 268" stroke="#4A9EFF" stroke-width="6" fill="none" stroke-linecap="round"/>
  <text x="410" y="266" font-size="12" fill="#4A9EFF">hair lags</text>
  <path d="M 300 360 Q 372 372 420 350" stroke="#B47EE8" stroke-width="8" fill="none" stroke-linecap="round"/>
  <text x="430" y="352" font-size="12" fill="#B47EE8">coat trails</text>
  <path d="M 300 300 Q 372 300 408 316" stroke="#4ADE80" stroke-width="6" fill="none" stroke-linecap="round"/>
  <circle cx="408" cy="316" r="7" fill="#4ADE80"/>
  <text x="422" y="320" font-size="12" fill="#4ADE80">hand overshoots</text>

  <text x="520" y="150" font-size="18" font-weight="600" fill="currentColor">Offset in time</text>
  <g>
    <rect x="520" y="176" width="240" height="30" rx="4" fill="currentColor" opacity="0.06"/>
    <rect x="520" y="176" width="120" height="30" rx="4" fill="#FF6B00" opacity="0.8"/>
    <text x="530" y="196" font-size="12" font-weight="600" fill="#0f1a14">body stops</text>
  </g>
  <g>
    <rect x="520" y="214" width="240" height="30" rx="4" fill="currentColor" opacity="0.06"/>
    <rect x="548" y="214" width="150" height="30" rx="4" fill="#4A9EFF" opacity="0.75"/>
    <text x="558" y="234" font-size="12" font-weight="600" fill="#0f1a14">hair stops (+2f)</text>
  </g>
  <g>
    <rect x="520" y="252" width="240" height="30" rx="4" fill="currentColor" opacity="0.06"/>
    <rect x="572" y="252" width="160" height="30" rx="4" fill="#B47EE8" opacity="0.75"/>
    <text x="582" y="272" font-size="12" font-weight="600" fill="#0f1a14">coat stops (+4f)</text>
  </g>
  <g>
    <rect x="520" y="290" width="240" height="30" rx="4" fill="currentColor" opacity="0.06"/>
    <rect x="560" y="290" width="150" height="30" rx="4" fill="#4ADE80" opacity="0.8"/>
    <text x="570" y="310" font-size="12" font-weight="600" fill="#0f1a14">hand stops (+3f)</text>
  </g>
  <text x="520" y="352" font-size="12" fill="currentColor" opacity="0.6">Each looser part settles a few</text>
  <text x="520" y="370" font-size="12" fill="currentColor" opacity="0.6">frames after the heavy body.</text>

  <g>
    <rect x="40" y="452" width="720" height="40" rx="6" fill="currentColor" opacity="0.04"/>
    <text x="60" y="477" font-size="13" fill="currentColor" opacity="0.8">Follow-through is a part continuing past the stop. Overlap is different parts stopping at different times. Together they kill the robotic freeze.</text>
  </g>

  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> The looser and lighter the part, the more it lags. Match the offset to the material.</text>
</svg>
