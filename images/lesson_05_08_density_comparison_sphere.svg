<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="ds-title ds-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" color="#222">
  <title id="ds-title">The density trade-off: low-poly versus high-poly</title>
  <desc id="ds-desc">A two-panel comparison of the same sphere shape at two polygon counts. The left panel labeled LOW-POLY shows an 8-segment, 4-ring sphere as a faceted octagonal silhouette with eight orange vertex dots; the panel reports 32 faces and 26 vertices, with use cases listed as games, VR, backgrounds, and mobile. The right panel labeled HIGH-POLY shows a 64-segment, 32-ring sphere as a smooth circle with faint internal latitude and longitude wireframe ellipses suggesting dense geometry; the panel reports 2,048 faces and 1,986 vertices, with use cases listed as film, product visualization, hero close-ups, and sculpting. The two panels are separated by a dashed vertical divider with a small vs badge at the center. A footer tip notes that most production work uses both: low-poly for editing and a Subdivision Surface modifier for smoothing at render time.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <text x="400" y="56" text-anchor="middle" font-size="24" font-weight="700" fill="currentColor">THE DENSITY TRADE-OFF</text>
  <text x="400" y="84" text-anchor="middle" font-size="14" fill="currentColor" opacity="0.65">Same sphere shape, very different polygon counts</text>
  <line x1="120" y1="108" x2="680" y2="108" stroke="currentColor" stroke-width="1" stroke-opacity="0.25"/>
  <text x="400" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#FF6B00" letter-spacing="2">LOW-POLY vs HIGH-POLY</text>

  <!-- Panel 1: Low-poly -->
  <rect x="40" y="170" width="300" height="290" rx="8" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>
  <text x="190" y="195" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">LOW-POLY</text>

  <!-- Octagon silhouette (8 segments, 4 rings - very faceted) -->
  <polygon points="190,235 240,256 260,305 240,354 190,375 140,354 120,305 140,256" fill="#FF6B00" fill-opacity="0.08" stroke="currentColor" stroke-width="1.6" stroke-opacity="0.85"/>
  <!-- Horizontal latitude slices (3 rings visible) -->
  <line x1="140" y1="256" x2="240" y2="256" stroke="currentColor" stroke-width="1" stroke-opacity="0.55"/>
  <line x1="120" y1="305" x2="260" y2="305" stroke="currentColor" stroke-width="1" stroke-opacity="0.55"/>
  <line x1="140" y1="354" x2="240" y2="354" stroke="currentColor" stroke-width="1" stroke-opacity="0.55"/>
  <!-- Vertical longitude line -->
  <line x1="190" y1="235" x2="190" y2="375" stroke="currentColor" stroke-width="1" stroke-opacity="0.55"/>
  <!-- Vertex dots at 8 corners -->
  <circle cx="190" cy="235" r="3.5" fill="#FF6B00"/>
  <circle cx="240" cy="256" r="3.5" fill="#FF6B00"/>
  <circle cx="260" cy="305" r="3.5" fill="#FF6B00"/>
  <circle cx="240" cy="354" r="3.5" fill="#FF6B00"/>
  <circle cx="190" cy="375" r="3.5" fill="#FF6B00"/>
  <circle cx="140" cy="354" r="3.5" fill="#FF6B00"/>
  <circle cx="120" cy="305" r="3.5" fill="#FF6B00"/>
  <circle cx="140" cy="256" r="3.5" fill="#FF6B00"/>

  <!-- Footer counts and use case -->
  <text x="190" y="398" text-anchor="middle" font-size="13" font-weight="700" fill="#FF6B00">32 faces</text>
  <text x="190" y="416" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.7">26 verts · 8 × 4</text>
  <text x="190" y="442" text-anchor="middle" font-size="11" font-style="italic" fill="currentColor" opacity="0.6">Games · VR · backgrounds · mobile</text>

  <!-- Panel 2: High-poly -->
  <rect x="460" y="170" width="300" height="290" rx="8" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>
  <text x="610" y="195" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">HIGH-POLY</text>

  <!-- Smooth circle silhouette -->
  <circle cx="610" cy="305" r="70" fill="#FF6B00" fill-opacity="0.08" stroke="currentColor" stroke-width="1.6" stroke-opacity="0.85"/>
  <!-- Latitude ellipses (rings) -->
  <ellipse cx="610" cy="252" rx="40" ry="3" fill="none" stroke="currentColor" stroke-width="0.7" stroke-opacity="0.45"/>
  <ellipse cx="610" cy="268" rx="55" ry="4" fill="none" stroke="currentColor" stroke-width="0.7" stroke-opacity="0.45"/>
  <ellipse cx="610" cy="285" rx="65" ry="5" fill="none" stroke="currentColor" stroke-width="0.7" stroke-opacity="0.45"/>
  <ellipse cx="610" cy="305" rx="70" ry="6" fill="none" stroke="currentColor" stroke-width="0.7" stroke-opacity="0.45"/>
  <ellipse cx="610" cy="325" rx="65" ry="5" fill="none" stroke="currentColor" stroke-width="0.7" stroke-opacity="0.45"/>
  <ellipse cx="610" cy="342" rx="55" ry="4" fill="none" stroke="currentColor" stroke-width="0.7" stroke-opacity="0.45"/>
  <ellipse cx="610" cy="358" rx="40" ry="3" fill="none" stroke="currentColor" stroke-width="0.7" stroke-opacity="0.45"/>
  <!-- Longitude ellipses -->
  <line x1="610" y1="235" x2="610" y2="375" stroke="currentColor" stroke-width="0.7" stroke-opacity="0.45"/>
  <ellipse cx="610" cy="305" rx="12" ry="70" fill="none" stroke="currentColor" stroke-width="0.7" stroke-opacity="0.4"/>
  <ellipse cx="610" cy="305" rx="28" ry="70" fill="none" stroke="currentColor" stroke-width="0.7" stroke-opacity="0.4"/>
  <ellipse cx="610" cy="305" rx="45" ry="70" fill="none" stroke="currentColor" stroke-width="0.7" stroke-opacity="0.4"/>
  <ellipse cx="610" cy="305" rx="58" ry="70" fill="none" stroke="currentColor" stroke-width="0.7" stroke-opacity="0.4"/>

  <!-- Footer counts and use case -->
  <text x="610" y="398" text-anchor="middle" font-size="13" font-weight="700" fill="#FF6B00">2,048 faces</text>
  <text x="610" y="416" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.7">1,986 verts · 64 × 32</text>
  <text x="610" y="442" text-anchor="middle" font-size="11" font-style="italic" fill="currentColor" opacity="0.6">Film · product viz · hero close-ups · sculpting</text>

  <!-- Center dashed divider, split around vs badge -->
  <line x1="400" y1="210" x2="400" y2="280" stroke="currentColor" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 6"/>
  <line x1="400" y1="330" x2="400" y2="430" stroke="currentColor" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 6"/>
  <!-- vs badge -->
  <circle cx="400" cy="305" r="20" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1" stroke-opacity="0.4"/>
  <text x="400" y="310" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor" opacity="0.7">vs</text>

  <!-- Italic takeaway -->
  <text x="400" y="478" text-anchor="middle" font-size="13" font-style="italic" fill="currentColor" opacity="0.75">Polygon count is a creative choice. Match it to the job.</text>

  <!-- Footer tip -->
  <rect x="40" y="506" width="720" height="34" rx="6" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="527" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Most production work uses both. Low-poly to edit fast, then a Subdivision Surface modifier to smooth at render.</text>
</svg>
