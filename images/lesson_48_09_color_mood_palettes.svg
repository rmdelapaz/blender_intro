<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" color="#222" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" role="img" aria-labelledby="cmp-t cmp-d">
  <title id="cmp-t">Three Color-Mood Strategies for the Scene</title>
  <desc id="cmp-d">Three background-and-accent color strategies shown as swatch rows &#8212; monochrome for a calm, premium feel that keeps focus on form, complementary for high-contrast energy that makes the product pop, and brand-accent for tying the scene to a product's own identity color &#8212; each labeled with the mood it creates and when to reach for it.</desc>
  <rect x="0" y="0" width="760" height="440" fill="none"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="currentColor">Color-Mood Strategies</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#8a8f98">The scene's palette sets the emotion before anyone reads a label</text>

  <!-- Row 1: Monochrome -->
  <g>
    <rect x="50" y="80" width="660" height="100" rx="8" fill="#000" opacity="0.12"/>
    <rect x="50" y="80" width="660" height="100" rx="8" fill="none" stroke="#666" stroke-width="1.2"/>
    <text x="70" y="108" font-size="15" font-weight="700" fill="currentColor">Monochrome</text>
    <text x="70" y="130" font-size="12" fill="#8a8f98">One hue, varied value. Calm, premium, timeless &#8212; keeps focus on form.</text>
    <text x="70" y="150" font-size="11" fill="#8a8f98">Use for: luxury, minimalist, spec-forward shots.</text>
    <!-- swatches -->
    <rect x="470" y="98" width="56" height="64" rx="4" fill="#20242b"/>
    <rect x="530" y="98" width="56" height="64" rx="4" fill="#3a414c"/>
    <rect x="590" y="98" width="56" height="64" rx="4" fill="#6b7482"/>
    <rect x="650" y="98" width="56" height="64" rx="4" fill="#aab3c0"/>
  </g>

  <!-- Row 2: Complementary -->
  <g>
    <rect x="50" y="192" width="660" height="100" rx="8" fill="#000" opacity="0.12"/>
    <rect x="50" y="192" width="660" height="100" rx="8" fill="none" stroke="#666" stroke-width="1.2"/>
    <text x="70" y="220" font-size="15" font-weight="700" fill="currentColor">Complementary</text>
    <text x="70" y="242" font-size="12" fill="#8a8f98">Opposite hues (e.g. warm product on cool background). High-energy pop.</text>
    <text x="70" y="262" font-size="11" fill="#8a8f98">Use for: making the subject leap off the frame; ads, thumbnails.</text>
    <rect x="470" y="210" width="86" height="64" rx="4" fill="#FF6B00"/>
    <rect x="560" y="210" width="86" height="64" rx="4" fill="#4A9EFF"/>
    <circle cx="513" cy="242" r="18" fill="#fff" opacity="0.18"/>
    <circle cx="603" cy="242" r="18" fill="#fff" opacity="0.18"/>
  </g>

  <!-- Row 3: Brand accent -->
  <g>
    <rect x="50" y="304" width="660" height="100" rx="8" fill="#000" opacity="0.12"/>
    <rect x="50" y="304" width="660" height="100" rx="8" fill="none" stroke="#666" stroke-width="1.2"/>
    <text x="70" y="332" font-size="15" font-weight="700" fill="currentColor">Brand accent</text>
    <text x="70" y="354" font-size="12" fill="#8a8f98">Neutral scene + one saturated pull from the product's own identity color.</text>
    <text x="70" y="374" font-size="11" fill="#8a8f98">Use for: on-brand campaigns; a rim light or prop echoes the logo hue.</text>
    <rect x="470" y="322" width="56" height="64" rx="4" fill="#2a2e35"/>
    <rect x="530" y="322" width="56" height="64" rx="4" fill="#4b515c"/>
    <rect x="590" y="322" width="56" height="64" rx="4" fill="#B47EE8"/>
    <rect x="650" y="322" width="56" height="64" rx="4" fill="#B47EE8" opacity="0.4"/>
  </g>

  <text x="50" y="428" font-size="12" fill="#8a8f98">Pick one strategy and commit. Mixing all three in one frame reads as noise &#8212; restraint is what looks &quot;designed.&quot;</text>
</svg>
