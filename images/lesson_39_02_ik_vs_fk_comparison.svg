<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="ikfk-title ikfk-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="ikfk-title">IK versus FK control comparison</title>
  <desc id="ikfk-desc">A side-by-side comparison of two ways to control the same arm pose. On the left, FK (forward kinematics) uses three rotation controls at the shoulder, elbow, and wrist that the animator rotates individually for natural arcing motion. On the right, IK (inverse kinematics) uses a single hand target plus an elbow pole target; the animator moves the hand target and the joint rotations are solved automatically.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">IK VS FK CONTROL</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Same arm pose · two control methods · rotation vs position</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- center divider -->
  <line x1="400" y1="134" x2="400" y2="478" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ===== LEFT: FK ===== -->
  <text x="40" y="156" font-size="18" font-weight="600" fill="#ff8c00">FK · Forward Kinematics</text>
  <text x="40" y="178" font-size="13" fill="currentColor" opacity="0.6">Rotation-based</text>

  <!-- FK arm bones (light wireframe), bent reaching pose -->
  <g stroke="currentColor" stroke-width="3" opacity="0.45" stroke-linecap="round" fill="none">
    <line x1="110" y1="250" x2="180" y2="320"/>
    <line x1="180" y1="320" x2="280" y2="300"/>
    <line x1="280" y1="300" x2="330" y2="330"/>
  </g>

  <!-- FK joint controls: decreasing circles -->
  <circle cx="110" cy="250" r="22" fill="none" stroke="#ff8c00" stroke-width="3"/>
  <circle cx="180" cy="320" r="16" fill="none" stroke="#ff8c00" stroke-width="3"/>
  <circle cx="280" cy="300" r="11" fill="none" stroke="#ff8c00" stroke-width="3"/>

  <!-- FK rotation arrows (curved) -->
  <g stroke="#ff8c00" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M 132 232 a 28 28 0 0 1 14 26"/>
    <polyline points="142,250 146,260 152,251" fill="#ff8c00" stroke="none"/>
    <path d="M 198 304 a 22 22 0 0 1 10 20"/>
    <polyline points="203,320 208,328 213,320" fill="#ff8c00" stroke="none"/>
  </g>

  <!-- FK angle labels -->
  <text x="142" y="222" font-size="13" font-weight="600" fill="#ff8c00">30°</text>
  <text x="206" y="296" font-size="13" font-weight="600" fill="#ff8c00">45°</text>

  <!-- FK joint name labels -->
  <text x="76" y="288" font-size="12" fill="currentColor" opacity="0.6">shoulder</text>
  <text x="150" y="356" font-size="12" fill="currentColor" opacity="0.6">elbow</text>
  <text x="276" y="332" font-size="12" fill="currentColor" opacity="0.6">wrist</text>

  <!-- FK caption -->
  <text x="40" y="430" font-size="14" fill="currentColor">Rotate each joint individually</text>
  <text x="40" y="452" font-size="13" fill="currentColor" opacity="0.6">Natural arcing motion · full control per joint</text>

  <!-- ===== RIGHT: IK ===== -->
  <text x="424" y="156" font-size="18" font-weight="600" fill="#00bcd4">IK · Inverse Kinematics</text>
  <text x="424" y="178" font-size="13" fill="currentColor" opacity="0.6">Position-based</text>

  <!-- IK arm bones (same pose, light wireframe) -->
  <g stroke="currentColor" stroke-width="3" opacity="0.45" stroke-linecap="round" fill="none">
    <line x1="494" y1="250" x2="564" y2="320"/>
    <line x1="564" y1="320" x2="664" y2="300"/>
    <line x1="664" y1="300" x2="714" y2="330"/>
  </g>

  <!-- IK shoulder anchor + straight solution line shoulder->hand -->
  <circle cx="494" cy="250" r="6" fill="currentColor" opacity="0.45"/>
  <g stroke="#00bcd4" stroke-width="1.5" opacity="0.55" stroke-dasharray="5 4" fill="none">
    <line x1="494" y1="250" x2="714" y2="330"/>
  </g>

  <!-- IK pole target sphere in front of elbow + dotted link -->
  <g stroke="#00bcd4" stroke-width="1.5" opacity="0.5" stroke-dasharray="3 3" fill="none">
    <line x1="564" y1="320" x2="560" y2="388"/>
  </g>
  <circle cx="560" cy="396" r="9" fill="none" stroke="#00bcd4" stroke-width="2.5"/>
  <text x="576" y="400" font-size="12" fill="currentColor" opacity="0.6">pole target</text>

  <!-- IK hand target widget (square handle) at wrist -->
  <rect x="700" y="316" width="28" height="28" rx="4" fill="none" stroke="#00bcd4" stroke-width="3"/>
  <text x="640" y="368" font-size="12" font-weight="600" fill="#00bcd4">hand target</text>

  <!-- IK caption -->
  <text x="424" y="430" font-size="14" fill="currentColor">Move one hand target</text>
  <text x="424" y="452" font-size="13" fill="currentColor" opacity="0.6">Joints solve automatically · fast posing</text>

  <!-- Footer tip (Variant B, left rail) -->
  <rect x="40" y="506" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> FK suits arcing motion like waving; IK suits planted contact like a hand on a wall.</text>
</svg>