<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="io-title io-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="io-title">Index of Refraction (IOR) Reference</title>
  <desc id="io-desc">A two-column reference table of Index of Refraction values for common real-world materials, ordered from air at 1.0 up to diamond at 2.4. The Blender default value of 1.45 for plastic and acrylic is highlighted in orange. Higher IOR means light bends more strongly as it passes through the material.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Index of Refraction (IOR) Reference</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Common real-world values for the Principled BSDF IOR input</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Column header row -->
  <text x="58" y="150" font-size="13" font-weight="700" fill="currentColor" opacity="0.6" letter-spacing="0.5">MATERIAL</text>
  <text x="742" y="150" font-size="13" font-weight="700" fill="currentColor" opacity="0.6" letter-spacing="0.5" text-anchor="end">IOR</text>
  <line x1="40" y1="164" x2="760" y2="164" stroke="currentColor" stroke-width="1.5" opacity="0.25"/>

  <!-- Table rows: y centers stepped by 46, starting at 196 -->

  <!-- Row 1: Air -->
  <text x="58" y="201" font-size="16" fill="currentColor">Vacuum / Air</text>
  <text x="742" y="201" font-size="17" font-weight="600" fill="currentColor" text-anchor="end" font-family="'Roboto Mono', ui-monospace, monospace">1.00</text>
  <line x1="40" y1="219" x2="760" y2="219" stroke="currentColor" stroke-width="1" opacity="0.1"/>

  <!-- Row 2: Water -->
  <text x="58" y="247" font-size="16" fill="currentColor">Water</text>
  <text x="742" y="247" font-size="17" font-weight="600" fill="currentColor" text-anchor="end" font-family="'Roboto Mono', ui-monospace, monospace">1.33</text>
  <line x1="40" y1="265" x2="760" y2="265" stroke="currentColor" stroke-width="1" opacity="0.1"/>

  <!-- Row 3: Plastic / Acrylic (Blender default, highlighted) -->
  <rect x="40" y="266" width="720" height="46" rx="6" fill="#FF6B00" fill-opacity="0.1"/>
  <rect x="40" y="266" width="4" height="46" fill="#FF6B00"/>
  <text x="58" y="293" font-size="16" font-weight="600" fill="currentColor">Plastic / Acrylic</text>
  <text x="58" y="306" font-size="11" font-weight="700" fill="#FF6B00" letter-spacing="0.3">BLENDER DEFAULT</text>
  <text x="742" y="298" font-size="17" font-weight="700" fill="#FF6B00" text-anchor="end" font-family="'Roboto Mono', ui-monospace, monospace">1.45</text>

  <!-- Row 4: Glass (standard) -->
  <text x="58" y="339" font-size="16" fill="currentColor">Glass (standard)</text>
  <text x="742" y="339" font-size="17" font-weight="600" fill="currentColor" text-anchor="end" font-family="'Roboto Mono', ui-monospace, monospace">1.50</text>
  <line x1="40" y1="357" x2="760" y2="357" stroke="currentColor" stroke-width="1" opacity="0.1"/>

  <!-- Row 5: Glass (window) / Quartz -->
  <text x="58" y="385" font-size="16" fill="currentColor">Glass (window), Quartz</text>
  <text x="742" y="385" font-size="17" font-weight="600" fill="currentColor" text-anchor="end" font-family="'Roboto Mono', ui-monospace, monospace">1.55</text>
  <line x1="40" y1="403" x2="760" y2="403" stroke="currentColor" stroke-width="1" opacity="0.1"/>

  <!-- Row 6: Emerald -->
  <text x="58" y="431" font-size="16" fill="currentColor">Emerald</text>
  <text x="742" y="431" font-size="17" font-weight="600" fill="currentColor" text-anchor="end" font-family="'Roboto Mono', ui-monospace, monospace">1.58</text>
  <line x1="40" y1="449" x2="760" y2="449" stroke="currentColor" stroke-width="1" opacity="0.1"/>

  <!-- Row 7: Ruby -->
  <text x="58" y="477" font-size="16" fill="currentColor">Ruby</text>
  <text x="742" y="477" font-size="17" font-weight="600" fill="currentColor" text-anchor="end" font-family="'Roboto Mono', ui-monospace, monospace">1.76</text>
  <line x1="40" y1="495" x2="760" y2="495" stroke="currentColor" stroke-width="1" opacity="0.1"/>

  <!-- Row 8: Diamond -->
  <text x="58" y="523" font-size="16" font-weight="600" fill="currentColor">Diamond</text>
  <text x="742" y="523" font-size="17" font-weight="700" fill="currentColor" text-anchor="end" font-family="'Roboto Mono', ui-monospace, monospace">2.40</text>
  <line x1="40" y1="541" x2="760" y2="541" stroke="currentColor" stroke-width="1" opacity="0.1"/>

  <!-- Scale note -->
  <text x="40" y="585" font-size="13" fill="currentColor" opacity="0.6">Higher IOR bends light more strongly. Air is the 1.0 baseline; most solids fall between 1.3 and 1.6.</text>

  <!-- Footer tip (Variant B, left rail) at dense-variant y=641 -->
  <rect x="40" y="641" width="720" height="34" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Match IOR to the real material for believable glass and gems; 1.45 suits most everyday plastics.</text>
</svg>
