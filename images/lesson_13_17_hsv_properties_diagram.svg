<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620"
     role="img" aria-labelledby="hv-title hv-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="hv-title">The three properties of color: hue, saturation, and value</title>
  <desc id="hv-desc">Three rows, each a progression of five swatches built from the same blue. The Hue row keeps intensity and brightness fixed while the color shifts from cyan through blue to purple. The Saturation row keeps hue and brightness fixed while the color drains from vivid to gray. The Value row keeps hue and intensity fixed while the color moves from dark to light. An arrow under each row shows the direction of change.</desc>

  <defs>
    <marker id="hv-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 1 L 8 4.5 L 0 8 Z" fill="currentColor" opacity="0.55"/>
    </marker>
  </defs>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">The Three Properties of Color</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Hue, Saturation, Value &#183; each row changes one property of the same blue</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Row 1: Hue -->
  <rect x="40" y="150" width="4" height="56" fill="#FF6B00"/>
  <text x="58" y="172" font-size="18" font-weight="700" fill="currentColor">Hue</text>
  <text x="58" y="192" font-size="12.5" fill="currentColor" opacity="0.7">The color itself</text>
  <rect x="250" y="150" width="88" height="56" fill="#22E6E6" stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>
  <rect x="346" y="150" width="88" height="56" fill="#2288E6" stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>
  <rect x="442" y="150" width="88" height="56" fill="#2259E6" stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>
  <rect x="538" y="150" width="88" height="56" fill="#4922E6" stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>
  <rect x="634" y="150" width="88" height="56" fill="#A722E6" stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>
  <line x1="250" y1="224" x2="712" y2="224" stroke="currentColor" stroke-width="1.5" opacity="0.55" marker-end="url(#hv-arrow)"/>
  <text x="250" y="242" font-size="11.5" fill="currentColor" opacity="0.7">cyan</text>
  <text x="722" y="242" font-size="11.5" fill="currentColor" opacity="0.7" text-anchor="end">purple</text>
  <!-- Row 2: Saturation -->
  <rect x="40" y="300" width="4" height="56" fill="#FF6B00"/>
  <text x="58" y="322" font-size="18" font-weight="700" fill="currentColor">Saturation</text>
  <text x="58" y="342" font-size="12.5" fill="currentColor" opacity="0.7">Color intensity</text>
  <rect x="250" y="300" width="88" height="56" fill="#005CE6" stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>
  <rect x="346" y="300" width="88" height="56" fill="#397EE6" stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>
  <rect x="442" y="300" width="88" height="56" fill="#73A1E6" stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>
  <rect x="538" y="300" width="88" height="56" fill="#ACC3E6" stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>
  <rect x="634" y="300" width="88" height="56" fill="#E6E6E6" stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>
  <line x1="250" y1="374" x2="712" y2="374" stroke="currentColor" stroke-width="1.5" opacity="0.55" marker-end="url(#hv-arrow)"/>
  <text x="250" y="392" font-size="11.5" fill="currentColor" opacity="0.7">vivid</text>
  <text x="722" y="392" font-size="11.5" fill="currentColor" opacity="0.7" text-anchor="end">gray</text>
  <!-- Row 3: Value -->
  <rect x="40" y="450" width="4" height="56" fill="#FF6B00"/>
  <text x="58" y="472" font-size="18" font-weight="700" fill="currentColor">Value</text>
  <text x="58" y="492" font-size="12.5" fill="currentColor" opacity="0.7">Lightness</text>
  <rect x="250" y="450" width="88" height="56" fill="#0B254D" stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>
  <rect x="346" y="450" width="88" height="56" fill="#123B79" stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>
  <rect x="442" y="450" width="88" height="56" fill="#1951A6" stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>
  <rect x="538" y="450" width="88" height="56" fill="#2067D2" stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>
  <rect x="634" y="450" width="88" height="56" fill="#267DFF" stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>
  <line x1="250" y1="524" x2="712" y2="524" stroke="currentColor" stroke-width="1.5" opacity="0.55" marker-end="url(#hv-arrow)"/>
  <text x="250" y="542" font-size="11.5" fill="currentColor" opacity="0.7">dark</text>
  <text x="722" y="542" font-size="11.5" fill="currentColor" opacity="0.7" text-anchor="end">light</text>

  <text x="58" y="214" font-size="11" fill="currentColor" opacity="0.6">Intensity and brightness</text>
  <text x="58" y="229" font-size="11" fill="currentColor" opacity="0.6">stay fixed, the color</text>
  <text x="58" y="244" font-size="11" fill="currentColor" opacity="0.6">identity shifts.</text>
  <text x="58" y="364" font-size="11" fill="currentColor" opacity="0.6">Hue and brightness stay</text>
  <text x="58" y="379" font-size="11" fill="currentColor" opacity="0.6">fixed, vivid drains toward</text>
  <text x="58" y="394" font-size="11" fill="currentColor" opacity="0.6">gray.</text>
  <text x="58" y="514" font-size="11" fill="currentColor" opacity="0.6">Hue and intensity stay</text>
  <text x="58" y="529" font-size="11" fill="currentColor" opacity="0.6">fixed, the color moves</text>
  <text x="58" y="544" font-size="11" fill="currentColor" opacity="0.6">dark to light.</text>

  <!-- Footer tip -->
  <rect x="40" y="566" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="588" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Value does the heaviest lifting for form &#183; nail light and dark first, then tune hue and saturation.</text>
</svg>