<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="lu-title lu-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="lu-title">Light measurement units compared</title>
  <desc id="lu-desc">Three columns comparing Watts, Lumens, and Candelas: what each unit measures, a real-world equivalent, and a typical range in Blender. Watts are the intuitive default, Lumens measure total output, and Candelas measure intensity in one direction.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Light Units Compared</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Three ways to measure light &#183; Watts &#183; Lumens &#183; Candelas</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Column geometry: x = 40 / 296 / 552, width 208, gap 48 -->
  <!-- Card backgrounds: transparent, left rail accent + header band -->

  <!-- ===== Column 1: WATTS (orange) ===== -->
  <g>
    <rect x="40" y="136" width="208" height="468" rx="8" fill="currentColor" fill-opacity="0.03"
          stroke="currentColor" stroke-opacity="0.12"/>
    <rect x="40" y="136" width="208" height="52" rx="8" fill="#FF6B00" fill-opacity="0.14"/>
    <rect x="40" y="160" width="208" height="28" fill="#FF6B00" fill-opacity="0.14"/>
    <rect x="40" y="136" width="5" height="468" rx="2" fill="#FF6B00"/>
    <text x="144" y="170" font-size="20" font-weight="700" fill="#FF6B00" text-anchor="middle">Watts (W)</text>

    <text x="64" y="224" font-size="13" font-weight="700" fill="currentColor">Measures</text>
    <text x="64" y="246" font-size="13" fill="currentColor" opacity="0.7">Electrical power, the</text>
    <text x="64" y="264" font-size="13" fill="currentColor" opacity="0.7">intuitive default unit.</text>

    <text x="64" y="312" font-size="13" font-weight="700" fill="currentColor">Real-world feel</text>
    <text x="64" y="334" font-size="13" fill="currentColor" opacity="0.7">A 60W incandescent</text>
    <text x="64" y="352" font-size="13" fill="currentColor" opacity="0.7">bulb is a familiar</text>
    <text x="64" y="370" font-size="13" fill="currentColor" opacity="0.7">reference point.</text>

    <text x="64" y="418" font-size="13" font-weight="700" fill="currentColor">Typical range</text>
    <text x="64" y="440" font-size="13" fill="currentColor" opacity="0.7">1W to 10,000W+,</text>
    <text x="64" y="458" font-size="13" fill="currentColor" opacity="0.7">by light type.</text>

    <text x="64" y="506" font-size="13" font-weight="700" fill="currentColor">Use when</text>
    <text x="64" y="528" font-size="13" fill="currentColor" opacity="0.7">You want quick,</text>
    <text x="64" y="546" font-size="13" fill="currentColor" opacity="0.7">intuitive control</text>
    <text x="64" y="564" font-size="13" fill="currentColor" opacity="0.7">(the usual choice).</text>
  </g>

  <!-- ===== Column 2: LUMENS (blue) ===== -->
  <g>
    <rect x="296" y="136" width="208" height="468" rx="8" fill="currentColor" fill-opacity="0.03"
          stroke="currentColor" stroke-opacity="0.12"/>
    <rect x="296" y="136" width="208" height="52" rx="8" fill="#4A9EFF" fill-opacity="0.16"/>
    <rect x="296" y="160" width="208" height="28" fill="#4A9EFF" fill-opacity="0.16"/>
    <rect x="296" y="136" width="5" height="468" rx="2" fill="#4A9EFF"/>
    <text x="400" y="170" font-size="20" font-weight="700" fill="#4A9EFF" text-anchor="middle">Lumens (lm)</text>

    <text x="320" y="224" font-size="13" font-weight="700" fill="currentColor">Measures</text>
    <text x="320" y="246" font-size="13" fill="currentColor" opacity="0.7">Total visible light</text>
    <text x="320" y="264" font-size="13" fill="currentColor" opacity="0.7">output, physically</text>
    <text x="320" y="282" font-size="13" fill="currentColor" opacity="0.7">accurate.</text>

    <text x="320" y="312" font-size="13" font-weight="700" fill="currentColor">Real-world feel</text>
    <text x="320" y="334" font-size="13" fill="currentColor" opacity="0.7">An 800 lm LED</text>
    <text x="320" y="352" font-size="13" fill="currentColor" opacity="0.7">roughly equals a</text>
    <text x="320" y="370" font-size="13" fill="currentColor" opacity="0.7">60W incandescent.</text>

    <text x="320" y="418" font-size="13" font-weight="700" fill="currentColor">Typical range</text>
    <text x="320" y="440" font-size="13" fill="currentColor" opacity="0.7">Hundreds to tens of</text>
    <text x="320" y="458" font-size="13" fill="currentColor" opacity="0.7">thousands of lm.</text>

    <text x="320" y="506" font-size="13" font-weight="700" fill="currentColor">Use when</text>
    <text x="320" y="528" font-size="13" fill="currentColor" opacity="0.7">You want to match</text>
    <text x="320" y="546" font-size="13" fill="currentColor" opacity="0.7">real bulb specs or</text>
    <text x="320" y="564" font-size="13" fill="currentColor" opacity="0.7">physical accuracy.</text>
  </g>

  <!-- ===== Column 3: CANDELAS (purple) ===== -->
  <g>
    <rect x="552" y="136" width="208" height="468" rx="8" fill="currentColor" fill-opacity="0.03"
          stroke="currentColor" stroke-opacity="0.12"/>
    <rect x="552" y="136" width="208" height="52" rx="8" fill="#B47EE8" fill-opacity="0.18"/>
    <rect x="552" y="160" width="208" height="28" fill="#B47EE8" fill-opacity="0.18"/>
    <rect x="552" y="136" width="5" height="468" rx="2" fill="#B47EE8"/>
    <text x="656" y="170" font-size="20" font-weight="700" fill="#B47EE8" text-anchor="middle">Candelas (cd)</text>

    <text x="576" y="224" font-size="13" font-weight="700" fill="currentColor">Measures</text>
    <text x="576" y="246" font-size="13" fill="currentColor" opacity="0.7">Intensity in one</text>
    <text x="576" y="264" font-size="13" fill="currentColor" opacity="0.7">particular direction.</text>

    <text x="576" y="312" font-size="13" font-weight="700" fill="currentColor">Real-world feel</text>
    <text x="576" y="334" font-size="13" fill="currentColor" opacity="0.7">Like a spotlight or</text>
    <text x="576" y="352" font-size="13" fill="currentColor" opacity="0.7">torch beam rated</text>
    <text x="576" y="370" font-size="13" fill="currentColor" opacity="0.7">by its aimed punch.</text>

    <text x="576" y="418" font-size="13" font-weight="700" fill="currentColor">Typical range</text>
    <text x="576" y="440" font-size="13" fill="currentColor" opacity="0.7">Varies widely with</text>
    <text x="576" y="458" font-size="13" fill="currentColor" opacity="0.7">beam focus.</text>

    <text x="576" y="506" font-size="13" font-weight="700" fill="currentColor">Use when</text>
    <text x="576" y="528" font-size="13" fill="currentColor" opacity="0.7">Working with</text>
    <text x="576" y="546" font-size="13" fill="currentColor" opacity="0.7">directional lights</text>
    <text x="576" y="564" font-size="13" fill="currentColor" opacity="0.7">(least common).</text>
  </g>

  <!-- Footer tip (Variant B left rail), dense variant y=641 -->
  <rect x="40" y="625" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="625" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="647" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Blender defaults to Watts. These are starting points; scene scale and materials shift what works.
  </text>
</svg>
