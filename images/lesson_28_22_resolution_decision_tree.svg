<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rd-title rd-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="rd-title">Choosing a resolution method</title>
  <desc id="rd-desc">Decision guide comparing Dynamic Topology, Multiresolution, and Remeshing by when to use each, plus a combined workflow path.</desc>
  <defs>
    <marker id="rd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="2" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

    <text x="380" y="32" text-anchor="middle" fill="currentColor" stroke="none" font-size="16" font-weight="700">Choosing Your Resolution Method</text>

    <!-- root -->
    <rect x="300" y="48" width="160" height="42" rx="10" stroke-width="2.4"/>
    <text x="380" y="68" text-anchor="middle" fill="currentColor" stroke="none" font-size="12.5" font-weight="700">What do you need?</text>
    <text x="380" y="83" text-anchor="middle" fill="currentColor" stroke="none" font-size="10.5" opacity="0.7">pick by project</text>

    <!-- three branch connectors -->
    <g stroke-width="1.7">
      <path d="M330 90 L150 132" marker-end="url(#rd-arrow)"/>
      <path d="M380 90 L380 132" marker-end="url(#rd-arrow)"/>
      <path d="M430 90 L610 132" marker-end="url(#rd-arrow)"/>
    </g>

    <!-- DYNTOPO -->
    <g>
      <rect x="24" y="134" width="216" height="150" rx="11" stroke-width="2"/>
      <text x="132" y="158" text-anchor="middle" fill="currentColor" stroke="none" font-size="13.5" font-weight="700">Dynamic Topology</text>
      <text x="132" y="174" text-anchor="middle" fill="currentColor" stroke="none" font-size="10.5" opacity="0.7">auto add/remove geometry</text>
      <line x1="40" y1="184" x2="224" y2="184" stroke-width="1" opacity="0.3"/>
      <text x="38" y="204" fill="currentColor" stroke="none" font-size="11">Learning &amp; concept work</text>
      <text x="38" y="224" fill="currentColor" stroke="none" font-size="11">Exploring forms freely</text>
      <text x="38" y="244" fill="currentColor" stroke="none" font-size="11">High-res for baking</text>
      <text x="38" y="264" fill="currentColor" stroke="none" font-size="11">Topology doesn&#8217;t matter</text>
      <text x="38" y="280" fill="currentColor" stroke="none" font-size="10" opacity="0.65" font-style="italic">creates triangles</text>
    </g>

    <!-- MULTIRES -->
    <g>
      <rect x="272" y="134" width="216" height="150" rx="11" stroke-width="2"/>
      <text x="380" y="158" text-anchor="middle" fill="currentColor" stroke="none" font-size="13.5" font-weight="700">Multiresolution</text>
      <text x="380" y="174" text-anchor="middle" fill="currentColor" stroke="none" font-size="10.5" opacity="0.7">controlled subdivision levels</text>
      <line x1="288" y1="184" x2="472" y2="184" stroke-width="1" opacity="0.3"/>
      <text x="286" y="204" fill="currentColor" stroke="none" font-size="11">Good base mesh to start</text>
      <text x="286" y="224" fill="currentColor" stroke="none" font-size="11">Animation-ready character</text>
      <text x="286" y="244" fill="currentColor" stroke="none" font-size="11">Clean quad topology</text>
      <text x="286" y="264" fill="currentColor" stroke="none" font-size="11">Non-destructive workflow</text>
      <text x="286" y="280" fill="currentColor" stroke="none" font-size="10" opacity="0.65" font-style="italic">clean quads, uniform</text>
    </g>

    <!-- REMESH -->
    <g>
      <rect x="520" y="134" width="216" height="150" rx="11" stroke-width="2"/>
      <text x="628" y="158" text-anchor="middle" fill="currentColor" stroke="none" font-size="13.5" font-weight="700">Remeshing</text>
      <text x="628" y="174" text-anchor="middle" fill="currentColor" stroke="none" font-size="10.5" opacity="0.7">rebuild even topology</text>
      <line x1="536" y1="184" x2="720" y2="184" stroke-width="1" opacity="0.3"/>
      <text x="534" y="204" fill="currentColor" stroke="none" font-size="11">Dyntopo made a mess</text>
      <text x="534" y="224" fill="currentColor" stroke="none" font-size="11">Cleanup after sculpting</text>
      <text x="534" y="244" fill="currentColor" stroke="none" font-size="11">Bridge to Multires</text>
      <text x="534" y="264" fill="currentColor" stroke="none" font-size="11">Need even resolution</text>
      <text x="534" y="280" fill="currentColor" stroke="none" font-size="10" opacity="0.65" font-style="italic">may lose fine detail</text>
    </g>

    <!-- combined path -->
    <text x="380" y="328" text-anchor="middle" fill="currentColor" stroke="none" font-size="13" font-weight="700">Or combine all three</text>
    <g font-size="11.5">
      <rect x="70" y="346" width="140" height="46" rx="9" stroke-width="1.8" stroke-dasharray="4 3"/>
      <text x="140" y="368" text-anchor="middle" fill="currentColor" stroke="none">Dyntopo</text>
      <text x="140" y="383" text-anchor="middle" fill="currentColor" stroke="none" font-size="10" opacity="0.7">free exploration</text>

      <rect x="310" y="346" width="140" height="46" rx="9" stroke-width="1.8" stroke-dasharray="4 3"/>
      <text x="380" y="368" text-anchor="middle" fill="currentColor" stroke="none">Remesh</text>
      <text x="380" y="383" text-anchor="middle" fill="currentColor" stroke="none" font-size="10" opacity="0.7">clean up forms</text>

      <rect x="550" y="346" width="140" height="46" rx="9" stroke-width="1.8" stroke-dasharray="4 3"/>
      <text x="620" y="368" text-anchor="middle" fill="currentColor" stroke="none">Multires</text>
      <text x="620" y="383" text-anchor="middle" fill="currentColor" stroke="none" font-size="10" opacity="0.7">controlled detail</text>

      <line x1="210" y1="369" x2="308" y2="369" stroke-width="1.7" marker-end="url(#rd-arrow)"/>
      <line x1="450" y1="369" x2="548" y2="369" stroke-width="1.7" marker-end="url(#rd-arrow)"/>
    </g>

    <text x="380" y="432" text-anchor="middle" fill="currentColor" stroke="none" font-size="12" opacity="0.8">Start low resolution &#183; go high gradually &#183; match resolution to the current task</text>
    <text x="380" y="456" text-anchor="middle" fill="currentColor" stroke="none" font-size="11" opacity="0.62">Block big forms first &#8212; add fine detail only when the foundation is solid</text>
  </g>
</svg>
