<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="so-title so-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="so-title">Scale operations: uniform and axis-constrained scaling</title>
  <desc id="so-desc">Six cube variants arranged in a two by three grid. The top row shows uniform scaling: the original cube, the cube doubled in size, and the cube halved. The bottom row shows axis-constrained scaling: the cube stretched along the X axis, the cube stretched along the Z axis, and the cube compressed along the Y axis. Active axis edges in the constrained panels are tinted red for X and blue for Z; the Y panel is shown with a very shallow depth to make the compression clear. A footer tip explains that S alone scales uniformly, S followed by an axis key constrains the scale to that axis, and typing a number sets the exact factor.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">SCALE OPERATIONS</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">S resizes the object. Add an axis key to constrain to one dimension.</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Subhead -->
  <text x="400" y="138" font-size="15" font-weight="700" fill="#FF6B00" text-anchor="middle" letter-spacing="2">UNIFORM VS AXIS-CONSTRAINED</text>

  <!-- =============================================================== -->
  <!-- TWO BY THREE GRID                                                 -->
  <!-- Row 1 (uniform):     y=155, panel 220 x 160                       -->
  <!--   Panel 1 (Original)    translate(40, 155)                        -->
  <!--   Panel 2 (Uniform 2x)  translate(290, 155)                       -->
  <!--   Panel 3 (Uniform .5x) translate(540, 155)                       -->
  <!-- Row 2 (constrained): y=325, panel 220 x 160                       -->
  <!--   Panel 4 (Stretch X)   translate(40, 325)                        -->
  <!--   Panel 5 (Stretch Z)   translate(290, 325)                       -->
  <!--   Panel 6 (Compress Y)  translate(540, 325)                       -->
  <!-- =============================================================== -->

  <!-- ===== PANEL 1: Original (1x reference) ===== -->
  <g transform="translate(40, 155)">
    <rect x="0" y="0" width="220" height="160" rx="8"
          fill="currentColor" fill-opacity="0.04"
          stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>

    <text x="14" y="22" font-size="13" font-weight="700" fill="currentColor">Original</text>

    <!-- Reference badge: muted (no key combo) -->
    <g transform="translate(178, 8)">
      <rect x="0" y="0" width="32" height="20" rx="4" fill="currentColor" opacity="0.25"/>
      <text x="16" y="14" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1x</text>
    </g>

    <!-- Cube: 30 x 30, depth offset 10 -->
    <g opacity="0.10">
      <rect x="95" y="70" width="30" height="30" fill="currentColor"/>
      <polygon points="95,70 105,60 135,60 125,70" fill="currentColor"/>
      <polygon points="125,70 135,60 135,90 125,100" fill="currentColor"/>
    </g>
    <g stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
      <rect x="95" y="70" width="30" height="30"/>
      <polygon points="95,70 105,60 135,60 125,70"/>
      <polygon points="125,70 135,60 135,90 125,100"/>
    </g>

    <text x="110" y="138" font-size="12" fill="currentColor" opacity="0.75" text-anchor="middle">Reference size</text>
    <text x="110" y="153" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">(no scaling)</text>
  </g>

  <!-- ===== PANEL 2: Uniform 2x ===== -->
  <g transform="translate(290, 155)">
    <rect x="0" y="0" width="220" height="160" rx="8"
          fill="currentColor" fill-opacity="0.04"
          stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>

    <text x="14" y="22" font-size="13" font-weight="700" fill="currentColor">Uniform 2x</text>

    <g transform="translate(174, 8)">
      <rect x="0" y="0" width="36" height="20" rx="4" fill="#FF6B00"/>
      <text x="18" y="14" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">S 2</text>
    </g>

    <!-- Cube: 60 x 60, depth offset 20 -->
    <g opacity="0.10">
      <rect x="80" y="55" width="60" height="60" fill="currentColor"/>
      <polygon points="80,55 100,35 160,35 140,55" fill="currentColor"/>
      <polygon points="140,55 160,35 160,95 140,115" fill="currentColor"/>
    </g>
    <g stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
      <rect x="80" y="55" width="60" height="60"/>
      <polygon points="80,55 100,35 160,35 140,55"/>
      <polygon points="140,55 160,35 160,95 140,115"/>
    </g>

    <text x="110" y="138" font-size="12" fill="currentColor" opacity="0.75" text-anchor="middle">Scaled up uniformly</text>
    <text x="110" y="153" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">(double size)</text>
  </g>

  <!-- ===== PANEL 3: Uniform 0.5x ===== -->
  <g transform="translate(540, 155)">
    <rect x="0" y="0" width="220" height="160" rx="8"
          fill="currentColor" fill-opacity="0.04"
          stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>

    <text x="14" y="22" font-size="13" font-weight="700" fill="currentColor">Uniform 0.5x</text>

    <g transform="translate(170, 8)">
      <rect x="0" y="0" width="40" height="20" rx="4" fill="#FF6B00"/>
      <text x="20" y="14" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">S .5</text>
    </g>

    <!-- Cube: 15 x 15, depth offset 5 -->
    <g opacity="0.10">
      <rect x="102.5" y="77.5" width="15" height="15" fill="currentColor"/>
      <polygon points="102.5,77.5 107.5,72.5 122.5,72.5 117.5,77.5" fill="currentColor"/>
      <polygon points="117.5,77.5 122.5,72.5 122.5,87.5 117.5,92.5" fill="currentColor"/>
    </g>
    <g stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
      <rect x="102.5" y="77.5" width="15" height="15"/>
      <polygon points="102.5,77.5 107.5,72.5 122.5,72.5 117.5,77.5"/>
      <polygon points="117.5,77.5 122.5,72.5 122.5,87.5 117.5,92.5"/>
    </g>

    <!-- Ghosted reference outline at original size (subtle), for scale comparison -->
    <g stroke="currentColor" stroke-width="1" fill="none" stroke-dasharray="3 3" opacity="0.2">
      <rect x="95" y="70" width="30" height="30"/>
    </g>

    <text x="110" y="138" font-size="12" fill="currentColor" opacity="0.75" text-anchor="middle">Scaled down uniformly</text>
    <text x="110" y="153" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">(half size)</text>
  </g>

  <!-- ===== PANEL 4: Stretch X (red axis) ===== -->
  <g transform="translate(40, 325)">
    <rect x="0" y="0" width="220" height="160" rx="8"
          fill="currentColor" fill-opacity="0.04"
          stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>

    <text x="14" y="22" font-size="13" font-weight="700" fill="currentColor">Stretch X</text>

    <g transform="translate(162, 8)">
      <rect x="0" y="0" width="48" height="20" rx="4" fill="#FF6B00"/>
      <text x="24" y="14" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">S X 2</text>
    </g>

    <!-- Cube: 60 wide x 30 tall, depth offset 10 -->
    <g opacity="0.10">
      <rect x="80" y="70" width="60" height="30" fill="currentColor"/>
      <polygon points="80,70 90,60 150,60 140,70" fill="currentColor"/>
      <polygon points="140,70 150,60 150,90 140,100" fill="currentColor"/>
    </g>
    <g stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
      <rect x="80" y="70" width="60" height="30"/>
      <polygon points="80,70 90,60 150,60 140,70"/>
      <polygon points="140,70 150,60 150,90 140,100"/>
    </g>
    <!-- Red overlay on X-axis aligned edges -->
    <g stroke="#E63946" stroke-width="2.4" fill="none" stroke-linecap="round">
      <line x1="80" y1="70" x2="140" y2="70"/>
      <line x1="80" y1="100" x2="140" y2="100"/>
      <line x1="90" y1="60" x2="150" y2="60"/>
    </g>

    <text x="110" y="138" font-size="12" fill="currentColor" opacity="0.75" text-anchor="middle">Wider along X</text>
    <text x="110" y="153" font-size="11" font-weight="600" fill="#E63946" text-anchor="middle">(red axis)</text>
  </g>

  <!-- ===== PANEL 5: Stretch Z (blue axis) ===== -->
  <g transform="translate(290, 325)">
    <rect x="0" y="0" width="220" height="160" rx="8"
          fill="currentColor" fill-opacity="0.04"
          stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>

    <text x="14" y="22" font-size="13" font-weight="700" fill="currentColor">Stretch Z</text>

    <g transform="translate(162, 8)">
      <rect x="0" y="0" width="48" height="20" rx="4" fill="#FF6B00"/>
      <text x="24" y="14" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">S Z 3</text>
    </g>

    <!-- Cube: 30 wide x 90 tall, depth offset 10 -->
    <g opacity="0.10">
      <rect x="95" y="40" width="30" height="90" fill="currentColor"/>
      <polygon points="95,40 105,30 135,30 125,40" fill="currentColor"/>
      <polygon points="125,40 135,30 135,120 125,130" fill="currentColor"/>
    </g>
    <g stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
      <rect x="95" y="40" width="30" height="90"/>
      <polygon points="95,40 105,30 135,30 125,40"/>
      <polygon points="125,40 135,30 135,120 125,130"/>
    </g>
    <!-- Blue overlay on Z-axis aligned edges -->
    <g stroke="#4A9EFF" stroke-width="2.4" fill="none" stroke-linecap="round">
      <line x1="95" y1="40" x2="95" y2="130"/>
      <line x1="125" y1="40" x2="125" y2="130"/>
      <line x1="135" y1="30" x2="135" y2="120"/>
    </g>

    <text x="110" y="148" font-size="12" fill="currentColor" opacity="0.75" text-anchor="middle">Taller along Z</text>
  </g>

  <!-- ===== PANEL 6: Compress Y (green axis) ===== -->
  <g transform="translate(540, 325)">
    <rect x="0" y="0" width="220" height="160" rx="8"
          fill="currentColor" fill-opacity="0.04"
          stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>

    <text x="14" y="22" font-size="13" font-weight="700" fill="currentColor">Compress Y</text>

    <g transform="translate(158, 8)">
      <rect x="0" y="0" width="52" height="20" rx="4" fill="#FF6B00"/>
      <text x="26" y="14" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">S Y .5</text>
    </g>

    <!-- Cube: 30 x 30 with shallow depth offset 3 (compressed along Y) -->
    <g opacity="0.10">
      <rect x="95" y="70" width="30" height="30" fill="currentColor"/>
      <polygon points="95,70 98,67 128,67 125,70" fill="currentColor"/>
      <polygon points="125,70 128,67 128,97 125,100" fill="currentColor"/>
    </g>
    <g stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
      <rect x="95" y="70" width="30" height="30"/>
      <polygon points="95,70 98,67 128,67 125,70"/>
      <polygon points="125,70 128,67 128,97 125,100"/>
    </g>
    <!-- Green inward arrows on the Y axis (front and back, indicating depth compression) -->
    <g stroke="#4ADE80" stroke-width="2.4" fill="#4ADE80" stroke-linecap="round">
      <line x1="155" y1="55" x2="138" y2="62"/>
      <polygon points="138,62 144,57 143,68"/>
      <line x1="65" y1="115" x2="82" y2="108"/>
      <polygon points="82,108 76,113 77,102"/>
    </g>
    <!-- Ghosted reference outline of original depth (dashed), to visualize compression -->
    <g stroke="currentColor" stroke-width="1" fill="none" stroke-dasharray="3 3" opacity="0.25">
      <polygon points="95,70 105,60 135,60 125,70"/>
    </g>

    <text x="110" y="138" font-size="12" fill="currentColor" opacity="0.75" text-anchor="middle">Shallower along Y</text>
    <text x="110" y="153" font-size="11" font-weight="600" fill="#4ADE80" text-anchor="middle">(green axis)</text>
  </g>

  <!-- Footer tip callout -->
  <rect x="40" y="506" width="720" height="34" rx="6"
        fill="#FF6B00" fill-opacity="0.10"
        stroke="#FF6B00" stroke-opacity="0.4"/>
  <text x="54" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> S scales uniformly. Add X, Y, or Z to constrain to one axis. Type a number for an exact factor, like S Z 3.
  </text>
</svg>
