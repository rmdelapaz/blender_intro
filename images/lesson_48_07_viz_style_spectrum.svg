<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" color="#222" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" role="img" aria-labelledby="vps-t vps-d">
  <title id="vps-t">The Product Visualization Style Spectrum</title>
  <desc id="vps-d">Three visualization styles laid out along a spectrum &#8212; clean studio with a seamless background and even light, lifestyle with a real-world setting and props, and hero-dramatic with dark surroundings and hard directional light &#8212; each card noting its background, lighting, and typical use so the artist picks a look before building the scene.</desc>
  <rect x="0" y="0" width="760" height="470" fill="none"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="currentColor">Style Spectrum</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#8a8f98">Decide the look first &#8212; it drives every lighting and scene choice</text>

  <!-- spectrum arrow -->
  <line x1="60" y1="82" x2="700" y2="82" stroke="#666" stroke-width="1.5"/>
  <text x="70" y="76" font-size="11" fill="#8a8f98">neutral / catalog</text>
  <text x="690" y="76" text-anchor="end" font-size="11" fill="#8a8f98">bold / editorial</text>

  <!-- Card 1: Clean Studio -->
  <g>
    <rect x="60" y="98" width="200" height="326" rx="8" fill="#4A9EFF" opacity="0.1"/>
    <rect x="60" y="98" width="200" height="326" rx="8" fill="none" stroke="#4A9EFF" stroke-width="1.5"/>
    <!-- swatch preview: light bg, soft product -->
    <rect x="76" y="114" width="168" height="96" rx="4" fill="#e8ecf2"/>
    <ellipse cx="160" cy="188" rx="52" ry="12" fill="#9aa4b2" opacity="0.5"/>
    <circle cx="160" cy="160" r="30" fill="#4A9EFF" opacity="0.8"/>
    <text x="160" y="236" text-anchor="middle" font-size="15" font-weight="700" fill="#4A9EFF">Clean Studio</text>
    <text x="76" y="266" font-size="12" fill="currentColor">Background: seamless</text>
    <text x="76" y="286" font-size="12" fill="currentColor">Light: soft, even</text>
    <text x="76" y="306" font-size="12" fill="currentColor">Shadows: minimal</text>
    <text x="76" y="334" font-size="11" fill="#8a8f98">Use: catalog, e-commerce,</text>
    <text x="76" y="350" font-size="11" fill="#8a8f98">spec sheets. Safe default.</text>
    <text x="76" y="382" font-size="11" font-weight="600" fill="#4ADE80">Easiest to light</text>
  </g>

  <!-- Card 2: Lifestyle -->
  <g>
    <rect x="280" y="98" width="200" height="326" rx="8" fill="#F5C242" opacity="0.1"/>
    <rect x="280" y="98" width="200" height="326" rx="8" fill="none" stroke="#F5C242" stroke-width="1.5"/>
    <rect x="296" y="114" width="168" height="96" rx="4" fill="#cbb487" opacity="0.55"/>
    <rect x="296" y="180" width="168" height="30" fill="#a68a5a" opacity="0.6"/>
    <circle cx="380" cy="162" r="28" fill="#F5C242" opacity="0.85"/>
    <rect x="316" y="150" width="18" height="40" fill="#8a8f98" opacity="0.5"/>
    <text x="380" y="236" text-anchor="middle" font-size="15" font-weight="700" fill="#F5C242">Lifestyle</text>
    <text x="296" y="266" font-size="12" fill="currentColor">Background: real setting</text>
    <text x="296" y="286" font-size="12" fill="currentColor">Light: natural / motivated</text>
    <text x="296" y="306" font-size="12" fill="currentColor">Props: in context</text>
    <text x="296" y="334" font-size="11" fill="#8a8f98">Use: ads, social, telling</text>
    <text x="296" y="350" font-size="11" fill="#8a8f98">a use-case story.</text>
    <text x="296" y="382" font-size="11" font-weight="600" fill="#F5C242">Needs set dressing</text>
  </g>

  <!-- Card 3: Hero Dramatic -->
  <g>
    <rect x="500" y="98" width="200" height="326" rx="8" fill="#B47EE8" opacity="0.1"/>
    <rect x="500" y="98" width="200" height="326" rx="8" fill="none" stroke="#B47EE8" stroke-width="1.5"/>
    <rect x="516" y="114" width="168" height="96" rx="4" fill="#1a1a1a"/>
    <ellipse cx="600" cy="192" rx="46" ry="10" fill="#000" opacity="0.6"/>
    <circle cx="600" cy="160" r="30" fill="#B47EE8" opacity="0.9"/>
    <path d="M 600 130 A 30 30 0 0 1 600 190 Z" fill="#fff" opacity="0.25"/>
    <text x="600" y="236" text-anchor="middle" font-size="15" font-weight="700" fill="#B47EE8">Hero Dramatic</text>
    <text x="516" y="266" font-size="12" fill="currentColor">Background: dark / void</text>
    <text x="516" y="286" font-size="12" fill="currentColor">Light: hard, directional</text>
    <text x="516" y="306" font-size="12" fill="currentColor">Shadows: deep, shaping</text>
    <text x="516" y="334" font-size="11" fill="#8a8f98">Use: launch hero, poster,</text>
    <text x="516" y="350" font-size="11" fill="#8a8f98">premium mood.</text>
    <text x="516" y="382" font-size="11" font-weight="600" fill="#E63946">Unforgiving of flaws</text>
  </g>

  <text x="60" y="452" font-size="12" fill="#8a8f98">Rightward = more mood and risk. A first project is safest in Clean Studio; move right once modeling and materials hold up to scrutiny.</text>
</svg>
