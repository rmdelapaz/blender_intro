<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="cs-title cs-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="cs-title">UV coordinate system: 3D space maps to 2D texture space</title>
  <desc id="cs-desc">A two-panel diagram. The left panel shows a 3D cube with X, Y and Z axes in red, green and blue. The right panel shows the 2D UV square running from 0 to 1, with U horizontal and V vertical in orange and the four corners labeled. Arrows between the panels indicate that a 3D surface position maps to a 2D UV coordinate.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">UV COORDINATE SYSTEM</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">3D position (XYZ) maps to 2D texture space (UV)</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Panel subheads -->
  <text x="40" y="146" font-size="18" font-weight="600" fill="currentColor">3D Space</text>
  <text x="480" y="146" font-size="18" font-weight="600" fill="currentColor">2D UV Space</text>

  <!-- 3D cube panel -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- Cube faces (isometric) -->
    <!-- Top face -->
    <polygon points="150,230 230,200 310,230 230,260"
             fill="#FF6B00" fill-opacity="0.10" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.6"/>
    <!-- Left face -->
    <polygon points="150,230 230,260 230,360 150,330"
             fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.6"/>
    <!-- Right face -->
    <polygon points="310,230 230,260 230,360 310,330"
             fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.6"/>
  </g>

  <!-- Axes from cube origin corner (front-bottom vertex at 230,360) -->
  <g stroke-width="2.5" stroke-linecap="round">
    <!-- X axis (red) -->
    <line x1="230" y1="360" x2="330" y2="398" stroke="#E63946"/>
    <polygon points="330,398 318,392 322,404" fill="#E63946"/>
    <text x="338" y="406" font-size="14" font-weight="600" fill="#E63946">X</text>
    <!-- Y axis (green) -->
    <line x1="230" y1="360" x2="130" y2="398" stroke="#4ADE80"/>
    <polygon points="130,398 142,392 138,404" fill="#4ADE80"/>
    <text x="110" y="406" font-size="14" font-weight="600" fill="#4ADE80">Y</text>
    <!-- Z axis (blue) -->
    <line x1="230" y1="360" x2="230" y2="250" stroke="#4A9EFF"/>
    <polygon points="230,250 224,262 236,262" fill="#4A9EFF"/>
    <text x="240" y="252" font-size="14" font-weight="600" fill="#4A9EFF">Z</text>
  </g>
  <!-- Sample surface point on cube right face -->
  <circle cx="270" cy="300" r="5" fill="#FF6B00"/>
  <text x="278" y="296" font-size="12" fill="currentColor" opacity="0.6">surface point</text>

  <!-- Mapping arrows (center) -->
  <g stroke="#FF6B00" stroke-width="2" opacity="0.3" stroke-linecap="round" fill="none">
    <line x1="350" y1="270" x2="455" y2="270"/>
    <line x1="350" y1="310" x2="455" y2="310"/>
  </g>
  <polygon points="455,270 443,264 443,276" fill="#FF6B00" opacity="0.3"/>
  <polygon points="455,310 443,304 443,316" fill="#FF6B00" opacity="0.3"/>
  <text x="402" y="258" font-size="12" text-anchor="middle" fill="#FF6B00" opacity="0.85">maps to</text>

  <!-- 2D UV square panel -->
  <!-- Plotted square: x 500..720, y 230..450 (220 px) -->
  <rect x="500" y="230" width="220" height="220"
        fill="#FF6B00" fill-opacity="0.05" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Inner grid lines at 0.25 steps -->
  <g stroke="currentColor" stroke-width="1" opacity="0.15">
    <line x1="555" y1="230" x2="555" y2="450"/>
    <line x1="610" y1="230" x2="610" y2="450"/>
    <line x1="665" y1="230" x2="665" y2="450"/>
    <line x1="500" y1="285" x2="720" y2="285"/>
    <line x1="500" y1="340" x2="720" y2="340"/>
    <line x1="500" y1="395" x2="720" y2="395"/>
  </g>
  <!-- U axis (bottom, orange) -->
  <line x1="500" y1="450" x2="730" y2="450" stroke="#FF6B00" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="730,450 718,444 718,456" fill="#FF6B00"/>
  <text x="724" y="470" font-size="14" font-weight="600" fill="#FF6B00">U</text>
  <!-- V axis (left, orange) -->
  <line x1="500" y1="450" x2="500" y2="220" stroke="#FF6B00" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="500,220 494,232 506,232" fill="#FF6B00"/>
  <text x="484" y="216" font-size="14" font-weight="600" fill="#FF6B00">V</text>
  <!-- Corner labels -->
  <text x="496" y="468" font-size="12" text-anchor="end" fill="currentColor">(0,0)</text>
  <text x="724" y="468" font-size="12" text-anchor="start" fill="currentColor">(1,0)</text>
  <text x="496" y="226" font-size="12" text-anchor="end" fill="currentColor">(0,1)</text>
  <text x="724" y="226" font-size="12" text-anchor="start" fill="currentColor">(1,1)</text>
  <!-- Mapped UV point matching the surface point -->
  <circle cx="610" cy="340" r="5" fill="#FF6B00"/>
  <text x="618" y="336" font-size="12" fill="currentColor" opacity="0.6">(u, v)</text>

  <!-- Footer tip (Variant B left rail) -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> UV coordinates always run from 0 to 1, no matter how large the 3D model is.
  </text>
</svg>
