<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="cd-title cd-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="cd-title">Custom Distance light range limitation</title>
  <desc id="cd-desc">A light source at the center of a dashed spherical boundary marking its custom distance limit. Objects inside the sphere are lit; objects outside the boundary receive no light and stay dark. A radius line labels the custom distance, and the lit and unlit zones are annotated.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">CUSTOM DISTANCE</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Limiting a light&#8217;s range &#183; objects beyond the boundary receive zero light</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ============ Scene ============ -->
  <!-- Custom-distance boundary sphere: dashed blue circle centered on the light -->
  <g>
    <!-- soft lit-zone fill inside the boundary -->
    <circle cx="300" cy="330" r="180" fill="#FF6B00" fill-opacity="0.05"/>
    <circle cx="300" cy="330" r="180" fill="none" stroke="#4A9EFF" stroke-width="2.5"
            stroke-dasharray="9 7" opacity="0.9"/>
    <!-- equator ellipse to read the circle as a 3D sphere -->
    <ellipse cx="300" cy="330" rx="180" ry="58" fill="none" stroke="#4A9EFF"
             stroke-width="1.5" stroke-dasharray="6 7" opacity="0.45"/>
  </g>

  <!-- Light source at sphere center -->
  <g>
    <circle cx="300" cy="330" r="26" fill="#FF6B00" opacity="0.18"/>
    <circle cx="300" cy="330" r="11" fill="#FF6B00"/>
    <!-- short emission ticks -->
    <g stroke="#FF6B00" stroke-width="2" stroke-linecap="round" opacity="0.8">
      <line x1="300" y1="300" x2="300" y2="290"/>
      <line x1="300" y1="360" x2="300" y2="370"/>
      <line x1="270" y1="330" x2="260" y2="330"/>
      <line x1="330" y1="330" x2="340" y2="330"/>
      <line x1="279" y1="309" x2="272" y2="302"/>
      <line x1="321" y1="351" x2="328" y2="358"/>
      <line x1="321" y1="309" x2="328" y2="302"/>
      <line x1="279" y1="351" x2="272" y2="358"/>
    </g>
    <text x="300" y="298" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Light</text>
  </g>

  <!-- Radius measurement line from center to boundary -->
  <g>
    <line x1="300" y1="330" x2="468" y2="330" stroke="#FF6B00" stroke-width="2"
          stroke-linecap="round"/>
    <!-- end ticks -->
    <line x1="300" y1="320" x2="300" y2="340" stroke="#FF6B00" stroke-width="2"/>
    <line x1="468" y1="320" x2="468" y2="340" stroke="#FF6B00" stroke-width="2"/>
    <rect x="312" y="345" width="140" height="22" rx="5" fill="#FF6B00"/>
    <text x="382" y="360" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Custom Distance: 5m</text>
  </g>

  <!-- Lit objects INSIDE the sphere (bright / green) -->
  <g>
    <!-- cube inside, upper -->
    <rect x="232" y="232" width="34" height="34" rx="3" fill="#4ADE80" opacity="0.92"/>
    <!-- sphere inside, lower-left -->
    <circle cx="246" cy="402" r="18" fill="#4ADE80" opacity="0.92"/>
  </g>

  <!-- Unlit objects OUTSIDE the sphere (dark / muted) -->
  <g>
    <!-- cube far right -->
    <rect x="612" y="300" width="34" height="34" rx="3" fill="currentColor" opacity="0.32"/>
    <!-- sphere lower right, outside -->
    <circle cx="556" cy="452" r="18" fill="currentColor" opacity="0.32"/>
    <!-- small cube top-right, outside -->
    <rect x="560" y="180" width="28" height="28" rx="3" fill="currentColor" opacity="0.32"/>
  </g>

  <!-- Zone labels -->
  <g>
    <!-- Lit zone label inside -->
    <text x="300" y="476" text-anchor="middle" font-size="14" font-weight="600" fill="#4ADE80">Lit zone</text>
    <text x="300" y="494" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">inside the boundary</text>
    <!-- Unlit zone label outside, right -->
    <text x="648" y="392" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor" opacity="0.7">Unlit zone</text>
    <text x="648" y="410" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.5">beyond the limit</text>
  </g>

  <!-- Boundary callout -->
  <g>
    <line x1="468" y1="216" x2="430" y2="248" stroke="#4A9EFF" stroke-width="1.5"
          stroke-linecap="round" opacity="0.7"/>
    <circle cx="430" cy="248" r="4" fill="#4A9EFF"/>
    <text x="474" y="212" font-size="12.5" font-weight="600" fill="#4A9EFF">Distance limit (viewport sphere)</text>
    <text x="474" y="230" font-size="11.5" fill="currentColor" opacity="0.6">light abruptly cuts to zero here</text>
  </g>

  <!-- Footer tip (Variant B left rail) -->
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Set the distance generous enough that natural inverse-square falloff, not a hard edge, ends the light.
  </text>
</svg>
