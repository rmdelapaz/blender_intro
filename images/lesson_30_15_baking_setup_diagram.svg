<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="bk-title bk-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="bk-title">Normal map baking process flow</title>
  <desc id="bk-desc">A six-stage left-to-right flow showing how surface detail moves from a high-poly source onto a low-poly retopo mesh: high-poly source, low-poly mesh, UV map, blank image texture, baked normal map, and the final detailed low-poly result. The baking step is highlighted as the critical phase.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Baking Setup: Detail Transfer Flow</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">How high-poly surface detail bakes onto a low-poly mesh as a normal map</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ===== Row 1: stages 1-3 ===== -->
  <!-- Stage 1: High-Poly Source -->
  <g>
    <rect x="40" y="150" width="200" height="120" rx="10" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.9"/>
    <!-- dense triangle-soup glyph -->
    <g stroke="#FF6B00" stroke-width="1.4" fill="none" opacity="0.85">
      <path d="M70 240 L100 188 L132 238 Z"/>
      <path d="M100 188 L132 238 L150 192 Z"/>
      <path d="M132 238 L150 192 L182 240 Z"/>
      <path d="M150 192 L182 240 L208 196 Z"/>
      <path d="M70 240 L88 214 L110 240"/>
      <path d="M150 220 L170 210 L188 224"/>
    </g>
    <text x="140" y="178" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor">1 &#183; High-Poly Source</text>
    <text x="140" y="262" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.6">Millions of triangles</text>
  </g>

  <!-- Stage 2: Low-Poly Mesh -->
  <g>
    <rect x="300" y="150" width="200" height="120" rx="10" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.9"/>
    <!-- clean quad glyph -->
    <g stroke="#FF6B00" stroke-width="1.6" fill="none" opacity="0.85">
      <rect x="340" y="196" width="120" height="44"/>
      <line x1="370" y1="196" x2="370" y2="240"/>
      <line x1="400" y1="196" x2="400" y2="240"/>
      <line x1="430" y1="196" x2="430" y2="240"/>
      <line x1="340" y1="218" x2="460" y2="218"/>
    </g>
    <text x="400" y="178" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor">2 &#183; Low-Poly Mesh</text>
    <text x="400" y="262" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.6">Clean quad retopo</text>
  </g>

  <!-- Stage 3: UV Map -->
  <g>
    <rect x="560" y="150" width="200" height="120" rx="10" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.9"/>
    <!-- UV island glyph -->
    <g stroke="#FF6B00" stroke-width="1.5" fill="none" opacity="0.85">
      <rect x="600" y="190" width="56" height="50"/>
      <path d="M676 190 L712 190 L712 226 L694 240 L676 226 Z"/>
    </g>
    <text x="660" y="178" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor">3 &#183; UV Map</text>
    <text x="660" y="262" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.6">Unwrapped 2D layout</text>
  </g>

  <!-- Row-1 connectors (1->2, 2->3) -->
  <g stroke="currentColor" stroke-width="1.5" opacity="0.3" stroke-linecap="round">
    <line x1="240" y1="210" x2="296" y2="210"/>
    <path d="M290 205 L300 210 L290 215" fill="none"/>
    <line x1="500" y1="210" x2="556" y2="210"/>
    <path d="M550 205 L560 210 L550 215" fill="none"/>
  </g>

  <!-- Down connector (3 -> 4): right column drop -->
  <g stroke="currentColor" stroke-width="1.5" opacity="0.3" stroke-linecap="round" fill="none">
    <path d="M660 270 L660 318"/>
    <path d="M655 312 L660 322 L665 312"/>
  </g>

  <!-- ===== Row 2: stages 6 <- 5 <- 4 ===== -->
  <!-- Stage 4: Image Texture (blank) -->
  <g>
    <rect x="560" y="324" width="200" height="120" rx="10" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.9"/>
    <rect x="612" y="362" width="96" height="56" rx="3" fill="currentColor" opacity="0.06" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.4"/>
    <text x="660" y="352" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor">4 &#183; Image Texture</text>
    <text x="660" y="436" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.6">Blank bake target</text>
  </g>

  <!-- Stage 5: Normal Map (THE bake step, highlighted) -->
  <g>
    <rect x="300" y="324" width="200" height="120" rx="10" fill="#FF6B00" fill-opacity="0.10" stroke="#FF6B00" stroke-width="2"/>
    <!-- normal-map swatch glyph (neutral, label-carried) -->
    <rect x="352" y="362" width="96" height="56" rx="3" fill="currentColor" opacity="0.10" stroke="#FF6B00" stroke-width="1.4"/>
    <text x="400" y="394" text-anchor="middle" font-size="12" fill="#FF6B00" font-weight="700">BAKE</text>
    <text x="400" y="352" text-anchor="middle" font-size="14" font-weight="700" fill="#FF6B00">5 &#183; Normal Map</text>
    <text x="400" y="436" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.7">Detail captured here</text>
  </g>

  <!-- Stage 6: Final Result -->
  <g>
    <rect x="40" y="324" width="200" height="120" rx="10" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.9"/>
    <!-- low-poly outline + detail hint -->
    <g fill="none" opacity="0.85">
      <rect x="80" y="362" width="120" height="56" rx="3" stroke="#FF6B00" stroke-width="1.6"/>
      <path d="M92 404 q14 -22 28 -4 q14 18 28 -6 q12 -18 26 2" stroke="currentColor" stroke-width="1.4" opacity="0.6"/>
    </g>
    <text x="140" y="352" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor">6 &#183; Final Result</text>
    <text x="140" y="436" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.6">Low-poly, full detail</text>
  </g>

  <!-- Row-2 connectors (4->5, 5->6), right-to-left -->
  <g stroke="currentColor" stroke-width="1.5" opacity="0.3" stroke-linecap="round" fill="none">
    <line x1="556" y1="384" x2="504" y2="384"/>
    <path d="M510 379 L500 384 L510 389"/>
    <line x1="296" y1="384" x2="244" y2="384"/>
    <path d="M250 379 L240 384 L250 389"/>
  </g>

  <!-- Footer tip (Variant B, left rail) -->
  <rect x="40" y="506" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> The bake samples high-poly detail along each low-poly normal, so clean UVs and ray distance are critical.
  </text>
</svg>
