<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="sp-title sp-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="sp-title">Four spacing patterns compared</title>
  <desc id="sp-desc">Four horizontal tracks of position dots comparing spacing patterns: linear with even spacing, ease in that speeds up, ease out that slows down, and ease in and out with an organic spacing, which is highlighted as the natural choice.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Four spacing patterns</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Same distance, same frame count : only the spacing changes</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <text x="40" y="150" font-size="18" font-weight="600" fill="currentColor">Dot spacing is the whole story</text>

  <!-- Linear -->
  <text x="40" y="184" font-size="15" font-weight="600" fill="currentColor">Linear</text>
  <text x="40" y="204" font-size="13" fill="currentColor" opacity="0.6">constant spacing</text>
  <line x1="200" y1="194" x2="720" y2="194" stroke="currentColor" stroke-width="1" opacity="0.1"/>
    <circle cx="200.0" cy="194" r="5" fill="#FF6B00"/>
    <circle cx="243.3" cy="194" r="5" fill="#FF6B00"/>
    <circle cx="286.7" cy="194" r="5" fill="#FF6B00"/>
    <circle cx="330.0" cy="194" r="5" fill="#FF6B00"/>
    <circle cx="373.3" cy="194" r="5" fill="#FF6B00"/>
    <circle cx="416.7" cy="194" r="5" fill="#FF6B00"/>
    <circle cx="460.0" cy="194" r="5" fill="#FF6B00"/>
    <circle cx="503.3" cy="194" r="5" fill="#FF6B00"/>
    <circle cx="546.7" cy="194" r="5" fill="#FF6B00"/>
    <circle cx="590.0" cy="194" r="5" fill="#FF6B00"/>
    <circle cx="633.3" cy="194" r="5" fill="#FF6B00"/>
    <circle cx="676.7" cy="194" r="5" fill="#FF6B00"/>
    <circle cx="720.0" cy="194" r="5" fill="#FF6B00"/>

  <!-- Ease in -->
  <text x="40" y="284" font-size="15" font-weight="600" fill="currentColor">Ease in</text>
  <text x="40" y="304" font-size="13" fill="currentColor" opacity="0.6">speeds up</text>
  <line x1="200" y1="294" x2="720" y2="294" stroke="currentColor" stroke-width="1" opacity="0.1"/>
    <circle cx="200.0" cy="294" r="5" fill="#FF6B00"/>
    <circle cx="203.6" cy="294" r="5" fill="#FF6B00"/>
    <circle cx="214.4" cy="294" r="5" fill="#FF6B00"/>
    <circle cx="232.5" cy="294" r="5" fill="#FF6B00"/>
    <circle cx="257.8" cy="294" r="5" fill="#FF6B00"/>
    <circle cx="290.3" cy="294" r="5" fill="#FF6B00"/>
    <circle cx="330.0" cy="294" r="5" fill="#FF6B00"/>
    <circle cx="376.9" cy="294" r="5" fill="#FF6B00"/>
    <circle cx="431.1" cy="294" r="5" fill="#FF6B00"/>
    <circle cx="492.5" cy="294" r="5" fill="#FF6B00"/>
    <circle cx="561.1" cy="294" r="5" fill="#FF6B00"/>
    <circle cx="636.9" cy="294" r="5" fill="#FF6B00"/>
    <circle cx="720.0" cy="294" r="5" fill="#FF6B00"/>

  <!-- Ease out -->
  <text x="40" y="384" font-size="15" font-weight="600" fill="currentColor">Ease out</text>
  <text x="40" y="404" font-size="13" fill="currentColor" opacity="0.6">slows down</text>
  <line x1="200" y1="394" x2="720" y2="394" stroke="currentColor" stroke-width="1" opacity="0.1"/>
    <circle cx="200.0" cy="394" r="5" fill="#FF6B00"/>
    <circle cx="283.1" cy="394" r="5" fill="#FF6B00"/>
    <circle cx="358.9" cy="394" r="5" fill="#FF6B00"/>
    <circle cx="427.5" cy="394" r="5" fill="#FF6B00"/>
    <circle cx="488.9" cy="394" r="5" fill="#FF6B00"/>
    <circle cx="543.1" cy="394" r="5" fill="#FF6B00"/>
    <circle cx="590.0" cy="394" r="5" fill="#FF6B00"/>
    <circle cx="629.7" cy="394" r="5" fill="#FF6B00"/>
    <circle cx="662.2" cy="394" r="5" fill="#FF6B00"/>
    <circle cx="687.5" cy="394" r="5" fill="#FF6B00"/>
    <circle cx="705.6" cy="394" r="5" fill="#FF6B00"/>
    <circle cx="716.4" cy="394" r="5" fill="#FF6B00"/>
    <circle cx="720.0" cy="394" r="5" fill="#FF6B00"/>

  <!-- Ease in &amp; out -->
  <text x="40" y="494" font-size="15" font-weight="600" fill="currentColor">Ease in &amp; out</text>
  <text x="40" y="514" font-size="13" fill="currentColor" opacity="0.6">natural arc</text>
  <line x1="200" y1="504" x2="720" y2="504" stroke="currentColor" stroke-width="1" opacity="0.1"/>
    <circle cx="200.0" cy="504" r="5" fill="#FF6B00"/>
    <circle cx="208.9" cy="504" r="5" fill="#FF6B00"/>
    <circle cx="234.8" cy="504" r="5" fill="#FF6B00"/>
    <circle cx="276.2" cy="504" r="5" fill="#FF6B00"/>
    <circle cx="330.0" cy="504" r="5" fill="#FF6B00"/>
    <circle cx="392.7" cy="504" r="5" fill="#FF6B00"/>
    <circle cx="460.0" cy="504" r="5" fill="#FF6B00"/>
    <circle cx="527.3" cy="504" r="5" fill="#FF6B00"/>
    <circle cx="590.0" cy="504" r="5" fill="#FF6B00"/>
    <circle cx="643.8" cy="504" r="5" fill="#FF6B00"/>
    <circle cx="685.2" cy="504" r="5" fill="#FF6B00"/>
    <circle cx="711.1" cy="504" r="5" fill="#FF6B00"/>
    <circle cx="720.0" cy="504" r="5" fill="#FF6B00"/>
  <rect x="170" y="454" width="590" height="86" rx="8" fill="none" stroke="#4ADE80" stroke-width="2" opacity="0.6"/>
  <rect x="660" y="456" width="92" height="22" rx="6" fill="#4ADE80"/>
  <text x="706" y="471" font-size="13" font-weight="700" fill="#0f1a14" text-anchor="middle">Natural</text>

  <rect x="40" y="641" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Blender's F-curve handles set this spacing. Bezier gives ease in and out for free.</text>
</svg>
