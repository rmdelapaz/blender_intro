<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="pms-title pms-desc" color="#222" font-family="'Segoe UI',system-ui,sans-serif">
<title id="pms-title">View Layer Properties Passes panel</title>
<desc id="pms-desc">Mock of the View Layer Properties Passes panel in Blender, split into a Data group (Z, Mist, Normal, Position, Vector, Ambient Occlusion, index passes) and a Light group (Diffuse, Glossy and Transmission each with Direct, Indirect and Color, plus Emission, Environment and Shadow), with checkboxes showing which passes to enable.</desc>
<rect x="0" y="0" width="800" height="600" fill="none"/>
<text x="400" y="34" text-anchor="middle" font-size="23" font-weight="700" fill="currentColor">Enabling Render Passes</text>
<text x="400" y="57" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.75">Properties editor &#8594; View Layer Properties &#8594; Passes</text>

<!-- panel frame -->
<rect x="60" y="78" width="680" height="500" rx="12" fill="#2a2a2a" stroke="currentColor" stroke-width="1.5"/>

<!-- panel header -->
<rect x="60" y="78" width="680" height="40" rx="12" fill="#333"/>
<rect x="60" y="100" width="680" height="18" fill="#333"/>
<circle cx="86" cy="98" r="6" fill="#FF6B00"/>
<text x="102" y="103" font-size="14" font-weight="700" fill="#d4d4d4">Passes</text>

<!-- DATA GROUP -->
<g>
  <rect x="84" y="132" width="316" height="30" rx="5" fill="#3a3a3a"/>
  <text x="100" y="152" font-size="14.5" font-weight="700" fill="#d4d4d4">Data</text>
</g>
<g font-size="13.5" fill="#d4d4d4">
  <rect x="100" y="176" width="16" height="16" rx="3" fill="#4ADE80"/>
  <path d="M103 184 l3 3 l6 -7" stroke="#1a1a1a" stroke-width="2" fill="none"/>
  <text x="126" y="189">Combined</text>

  <rect x="100" y="204" width="16" height="16" rx="3" fill="#4ADE80"/>
  <path d="M103 212 l3 3 l6 -7" stroke="#1a1a1a" stroke-width="2" fill="none"/>
  <text x="126" y="217">Z (depth)</text>
  <text x="240" y="217" font-size="11" fill="#4A9EFF">for DOF / fog</text>

  <rect x="100" y="232" width="16" height="16" rx="3" fill="#4ADE80"/>
  <path d="M103 240 l3 3 l6 -7" stroke="#1a1a1a" stroke-width="2" fill="none"/>
  <text x="126" y="245">Mist</text>
  <text x="240" y="245" font-size="11" fill="#4A9EFF">atmosphere</text>

  <rect x="100" y="260" width="16" height="16" rx="3" fill="none" stroke="#888" stroke-width="1.6"/>
  <text x="126" y="273" opacity="0.85">Normal</text>

  <rect x="100" y="288" width="16" height="16" rx="3" fill="none" stroke="#888" stroke-width="1.6"/>
  <text x="126" y="301" opacity="0.85">Position</text>

  <rect x="100" y="316" width="16" height="16" rx="3" fill="none" stroke="#888" stroke-width="1.6"/>
  <text x="126" y="329" opacity="0.85">Vector (motion)</text>

  <rect x="100" y="344" width="16" height="16" rx="3" fill="#4ADE80"/>
  <path d="M103 352 l3 3 l6 -7" stroke="#1a1a1a" stroke-width="2" fill="none"/>
  <text x="126" y="357">Ambient Occlusion</text>

  <rect x="100" y="372" width="16" height="16" rx="3" fill="none" stroke="#888" stroke-width="1.6"/>
  <text x="126" y="385" opacity="0.85">Material Index</text>

  <rect x="100" y="400" width="16" height="16" rx="3" fill="none" stroke="#888" stroke-width="1.6"/>
  <text x="126" y="413" opacity="0.85">Object Index</text>

  <rect x="100" y="428" width="16" height="16" rx="3" fill="none" stroke="#888" stroke-width="1.6"/>
  <text x="126" y="441" opacity="0.85">Cryptomatte</text>
</g>

<!-- LIGHT GROUP -->
<g>
  <rect x="418" y="132" width="298" height="30" rx="5" fill="#3a3a3a"/>
  <text x="434" y="152" font-size="14.5" font-weight="700" fill="#d4d4d4">Light</text>
</g>
<g font-size="13" fill="#d4d4d4">
  <text x="434" y="184" font-size="12" font-weight="700" fill="#F5C242">Diffuse</text>
  <rect x="440" y="192" width="15" height="15" rx="3" fill="#4ADE80"/><path d="M443 200 l2.5 2.5 l5.5 -6" stroke="#1a1a1a" stroke-width="1.8" fill="none"/><text x="463" y="204" font-size="12">Direct</text>
  <rect x="548" y="192" width="15" height="15" rx="3" fill="#4ADE80"/><path d="M551 200 l2.5 2.5 l5.5 -6" stroke="#1a1a1a" stroke-width="1.8" fill="none"/><text x="571" y="204" font-size="12">Indirect</text>
  <rect x="656" y="192" width="15" height="15" rx="3" fill="none" stroke="#888" stroke-width="1.6"/><text x="679" y="204" font-size="12" opacity="0.85">Color</text>

  <text x="434" y="236" font-size="12" font-weight="700" fill="#F5C242">Glossy</text>
  <rect x="440" y="244" width="15" height="15" rx="3" fill="#4ADE80"/><path d="M443 252 l2.5 2.5 l5.5 -6" stroke="#1a1a1a" stroke-width="1.8" fill="none"/><text x="463" y="256" font-size="12">Direct</text>
  <rect x="548" y="244" width="15" height="15" rx="3" fill="#4ADE80"/><path d="M551 252 l2.5 2.5 l5.5 -6" stroke="#1a1a1a" stroke-width="1.8" fill="none"/><text x="571" y="256" font-size="12">Indirect</text>
  <rect x="656" y="244" width="15" height="15" rx="3" fill="none" stroke="#888" stroke-width="1.6"/><text x="679" y="256" font-size="12" opacity="0.85">Color</text>

  <text x="434" y="288" font-size="12" font-weight="700" fill="#F5C242">Transmission</text>
  <rect x="440" y="296" width="15" height="15" rx="3" fill="none" stroke="#888" stroke-width="1.6"/><text x="463" y="308" font-size="12" opacity="0.85">Direct</text>
  <rect x="548" y="296" width="15" height="15" rx="3" fill="none" stroke="#888" stroke-width="1.6"/><text x="571" y="308" font-size="12" opacity="0.85">Indirect</text>
  <rect x="656" y="296" width="15" height="15" rx="3" fill="none" stroke="#888" stroke-width="1.6"/><text x="679" y="308" font-size="12" opacity="0.85">Color</text>

  <line x1="434" y1="330" x2="700" y2="330" stroke="currentColor" stroke-width="1" opacity="0.25"/>

  <rect x="440" y="344" width="15" height="15" rx="3" fill="#4ADE80"/><path d="M443 352 l2.5 2.5 l5.5 -6" stroke="#1a1a1a" stroke-width="1.8" fill="none"/><text x="463" y="356" font-size="12.5">Emission</text>
  <rect x="440" y="372" width="15" height="15" rx="3" fill="none" stroke="#888" stroke-width="1.6"/><text x="463" y="384" font-size="12.5" opacity="0.85">Environment</text>
  <rect x="440" y="400" width="15" height="15" rx="3" fill="none" stroke="#888" stroke-width="1.6"/><text x="463" y="412" font-size="12.5" opacity="0.85">Shadow</text>
  <rect x="440" y="428" width="15" height="15" rx="3" fill="none" stroke="#888" stroke-width="1.6"/><text x="463" y="440" font-size="12.5" opacity="0.85">Ambient Occlusion</text>
</g>

<!-- tip footer -->
<g>
  <rect x="84" y="470" width="632" height="90" rx="10" fill="none" stroke="#4ADE80" stroke-width="2"/>
  <circle cx="112" cy="500" r="12" fill="#4ADE80"/>
  <path d="M106 500 l4 4 l8 -9" stroke="#1a1a1a" stroke-width="2.2" fill="none"/>
  <text x="136" y="494" font-size="14" font-weight="700" fill="currentColor">Enable only what you need</text>
  <text x="136" y="516" font-size="12.5" fill="currentColor" opacity="0.88">Green ticks above are a sensible starter set: Z + Mist for depth effects, AO for contact shadows,</text>
  <text x="136" y="534" font-size="12.5" fill="currentColor" opacity="0.88">Diffuse and Glossy Direct/Indirect for relighting, Emission for glows. Each pass adds render memory,</text>
  <text x="136" y="552" font-size="12.5" fill="currentColor" opacity="0.88">so leave the rest off until a shot actually calls for them. Re-render after enabling new passes.</text>
</g>
</svg>
