<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" role="img" aria-labelledby="fo-title fo-desc" color="#222" font-family="'Segoe UI',system-ui,-apple-system,sans-serif">
  <title id="fo-title">HDRI library folder organization</title>
  <desc id="fo-desc">A recommended folder tree for an HDRI library: a root HDRIs folder containing four category folders: Outdoor, Studio, Interior, and Creative, each with subfolders grouping HDRIs by lighting type.</desc>

  <!-- header -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
  <text x="32" y="46" font-size="24" font-weight="700" fill="currentColor">HDRI Library Folder Structure</text>
  <text x="32" y="74" font-size="14" fill="currentColor" opacity="0.65">Organize by category &#183; subfolders group HDRIs by lighting type</text>
  <line x1="32" y1="92" x2="768" y2="92" stroke="currentColor" stroke-width="1" opacity="0.18"/>

  <!-- mini-folder glyph defined once -->
  <defs>
    <g id="fo-fold">
      <path d="M0 1 h7 l2.5 2.5 h6.5 v8.5 h-16 z" fill="currentColor" opacity="0.5"/>
    </g>
  </defs>

  <!-- ROOT -->
  <g font-size="16">
    <rect x="40" y="116" width="30" height="22" rx="3" fill="#FF6B00" opacity="0.92"/>
    <path d="M45 122 h8 l3 3 h7 v9 h-18 z" fill="#ffffff" opacity="0.9"/>
    <text x="82" y="132" font-weight="700" fill="currentColor">HDRIs/</text>
    <text x="150" y="132" font-size="12" fill="currentColor" opacity="0.55">root library folder</text>
  </g>

  <!-- vertical spine -->
  <line x1="55" y1="138" x2="55" y2="612" stroke="currentColor" stroke-width="1.5" opacity="0.35"/>

  <!-- OUTDOOR  blue #4A9EFF -->
  <g font-size="15">
    <line x1="55" y1="172" x2="78" y2="172" stroke="currentColor" stroke-width="1.5" opacity="0.35"/>
    <rect x="78" y="160" width="28" height="20" rx="3" fill="#4A9EFF"/>
    <path d="M82 165 h7 l3 3 h6 v8 h-16 z" fill="#ffffff" opacity="0.9"/>
    <text x="116" y="175" font-weight="700" fill="currentColor">Outdoor/</text>
    <line x1="92" y1="180" x2="92" y2="288" stroke="#4A9EFF" stroke-width="1.3" opacity="0.5"/>
    <g font-size="14" fill="currentColor">
      <line x1="92" y1="206" x2="112" y2="206" stroke="#4A9EFF" stroke-width="1.3" opacity="0.5"/>
      <use href="#fo-fold" x="120" y="199"/><text x="142" y="211">Clear_Sky/</text><text x="300" y="211" font-size="12" opacity="0.5">5&#8211;10 files</text>
      <line x1="92" y1="232" x2="112" y2="232" stroke="#4A9EFF" stroke-width="1.3" opacity="0.5"/>
      <use href="#fo-fold" x="120" y="225"/><text x="142" y="237">Cloudy/</text><text x="300" y="237" font-size="12" opacity="0.5">3&#8211;5 files</text>
      <line x1="92" y1="258" x2="112" y2="258" stroke="#4A9EFF" stroke-width="1.3" opacity="0.5"/>
      <use href="#fo-fold" x="120" y="251"/><text x="142" y="263">Sunset/</text><text x="300" y="263" font-size="12" opacity="0.5">3&#8211;5 files</text>
      <line x1="92" y1="284" x2="112" y2="284" stroke="#4A9EFF" stroke-width="1.3" opacity="0.5"/>
      <use href="#fo-fold" x="120" y="277"/><text x="142" y="289">Night/</text><text x="300" y="289" font-size="12" opacity="0.5">2&#8211;3 files</text>
    </g>
  </g>

  <!-- STUDIO  green #6BCF7F -->
  <g font-size="15">
    <line x1="55" y1="322" x2="78" y2="322" stroke="currentColor" stroke-width="1.5" opacity="0.35"/>
    <rect x="78" y="310" width="28" height="20" rx="3" fill="#6BCF7F"/>
    <path d="M82 315 h7 l3 3 h6 v8 h-16 z" fill="#ffffff" opacity="0.9"/>
    <text x="116" y="325" font-weight="700" fill="currentColor">Studio/</text>
    <line x1="92" y1="330" x2="92" y2="412" stroke="#6BCF7F" stroke-width="1.3" opacity="0.6"/>
    <g font-size="14" fill="currentColor">
      <line x1="92" y1="356" x2="112" y2="356" stroke="#6BCF7F" stroke-width="1.3" opacity="0.6"/>
      <use href="#fo-fold" x="120" y="349"/><text x="142" y="361">Softbox/</text><text x="300" y="361" font-size="12" opacity="0.5">3&#8211;5 files</text>
      <line x1="92" y1="382" x2="112" y2="382" stroke="#6BCF7F" stroke-width="1.3" opacity="0.6"/>
      <use href="#fo-fold" x="120" y="375"/><text x="142" y="387">Product_Lighting/</text><text x="300" y="387" font-size="12" opacity="0.5">3&#8211;5 files</text>
      <line x1="92" y1="408" x2="112" y2="408" stroke="#6BCF7F" stroke-width="1.3" opacity="0.6"/>
      <use href="#fo-fold" x="120" y="401"/><text x="142" y="413">Neutral/</text><text x="300" y="413" font-size="12" opacity="0.5">2&#8211;3 files</text>
    </g>
  </g>

  <!-- INTERIOR  pink #FF6B9D -->
  <g font-size="15">
    <line x1="55" y1="446" x2="78" y2="446" stroke="currentColor" stroke-width="1.5" opacity="0.35"/>
    <rect x="78" y="434" width="28" height="20" rx="3" fill="#FF6B9D"/>
    <path d="M82 439 h7 l3 3 h6 v8 h-16 z" fill="#ffffff" opacity="0.9"/>
    <text x="116" y="449" font-weight="700" fill="currentColor">Interior/</text>
    <line x1="92" y1="454" x2="92" y2="536" stroke="#FF6B9D" stroke-width="1.3" opacity="0.6"/>
    <g font-size="14" fill="currentColor">
      <line x1="92" y1="480" x2="112" y2="480" stroke="#FF6B9D" stroke-width="1.3" opacity="0.6"/>
      <use href="#fo-fold" x="120" y="473"/><text x="142" y="485">Window_Light/</text><text x="300" y="485" font-size="12" opacity="0.5">2&#8211;3 files</text>
      <line x1="92" y1="506" x2="112" y2="506" stroke="#FF6B9D" stroke-width="1.3" opacity="0.6"/>
      <use href="#fo-fold" x="120" y="499"/><text x="142" y="511">Artificial/</text><text x="300" y="511" font-size="12" opacity="0.5">2&#8211;3 files</text>
      <line x1="92" y1="532" x2="112" y2="532" stroke="#FF6B9D" stroke-width="1.3" opacity="0.6"/>
      <use href="#fo-fold" x="120" y="525"/><text x="142" y="537">Mixed/</text><text x="300" y="537" font-size="12" opacity="0.5">2&#8211;3 files</text>
    </g>
  </g>

  <!-- CREATIVE  purple #B47EE8 -->
  <g font-size="15">
    <line x1="55" y1="570" x2="78" y2="570" stroke="currentColor" stroke-width="1.5" opacity="0.35"/>
    <rect x="78" y="558" width="28" height="20" rx="3" fill="#B47EE8"/>
    <path d="M82 563 h7 l3 3 h6 v8 h-16 z" fill="#ffffff" opacity="0.9"/>
    <text x="116" y="573" font-weight="700" fill="currentColor">Creative/</text>
    <line x1="92" y1="578" x2="92" y2="608" stroke="#B47EE8" stroke-width="1.3" opacity="0.6"/>
    <g font-size="14" fill="currentColor">
      <line x1="92" y1="588" x2="112" y2="588" stroke="#B47EE8" stroke-width="1.3" opacity="0.6"/>
      <use href="#fo-fold" x="120" y="581"/><text x="142" y="593">Urban/</text>
      <line x1="92" y1="604" x2="112" y2="604" stroke="#B47EE8" stroke-width="1.3" opacity="0.6"/>
      <use href="#fo-fold" x="120" y="597"/><text x="142" y="609">Neon/</text>
      <use href="#fo-fold" x="250" y="597"/><text x="272" y="609">Abstract/</text>
    </g>
  </g>

  <!-- legend / note -->
  <g font-size="13" fill="currentColor">
    <rect x="430" y="160" width="338" height="158" rx="6" fill="currentColor" opacity="0.05"/>
    <text x="450" y="186" font-size="14" font-weight="700">Why organize this way?</text>
    <text x="450" y="212" opacity="0.8">&#8226; Category folders match scene context</text>
    <text x="450" y="234" opacity="0.8">&#8226; Find the right mood fast under deadline</text>
    <text x="450" y="256" opacity="0.8">&#8226; Keep 4K everyday + 8K only when needed</text>
    <text x="450" y="278" opacity="0.8">&#8226; Name with key info: time, sky, resolution</text>
    <text x="450" y="304" font-size="12" opacity="0.55" font-family="monospace">outdoor_clear_sky_afternoon_4k.hdr</text>
  </g>

  <!-- Variant-B footer -->
  <line x1="32" y1="641" x2="768" y2="641" stroke="currentColor" stroke-width="1" opacity="0.18"/>
  <rect x="32" y="650" width="4" height="20" rx="2" fill="#FF6B00"/>
  <text x="46" y="663" font-size="12.5" fill="currentColor" opacity="0.7">Tip &#183; mirror these categories in Blender&#8217;s file browser bookmarks for one-click loading</text>
</svg>