<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720"
     role="img" aria-labelledby="ic-title ic-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="ic-title">Blender vs other 3D software: interface comparison</title>
  <desc id="ic-desc">A feature comparison grid showing where eight common interface tasks live in Blender, Maya, 3ds Max, and Cinema 4D. Rows cover transform hotkeys, viewport orbit, object pivot, modifier stack, scene hierarchy, property editor, material editor, and workspace switcher. Each cell briefly names the equivalent feature or location in that application. The Blender column is highlighted with the Blender brand orange accent.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Blender vs Other 3D Software</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Where common interface tasks live in each application</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Blender column subtle tint (anchors focus column) -->
  <rect x="200" y="180" width="140" height="458" fill="#FF6B00" fill-opacity="0.04"/>

  <!-- Column header labels -->
  <text x="54" y="166" font-size="11" font-weight="700" fill="currentColor" opacity="0.5" letter-spacing="1">FEATURE / WORKFLOW</text>
  <text x="270" y="166" font-size="14" font-weight="700" fill="#FF6B00" text-anchor="middle">Blender</text>
  <text x="410" y="166" font-size="14" font-weight="700" fill="#4A9EFF" text-anchor="middle">Maya</text>
  <text x="550" y="166" font-size="14" font-weight="700" fill="#B47EE8" text-anchor="middle">3ds Max</text>
  <text x="690" y="166" font-size="14" font-weight="700" fill="#4ADE80" text-anchor="middle">Cinema 4D</text>

  <!-- Column header underlines (each in its app accent color) -->
  <line x1="200" y1="176" x2="340" y2="176" stroke="#FF6B00" stroke-width="2"/>
  <line x1="340" y1="176" x2="480" y2="176" stroke="#4A9EFF" stroke-width="2"/>
  <line x1="480" y1="176" x2="620" y2="176" stroke="#B47EE8" stroke-width="2"/>
  <line x1="620" y1="176" x2="760" y2="176" stroke="#4ADE80" stroke-width="2"/>

  <!-- Vertical column dividers -->
  <g stroke="currentColor" stroke-width="1" opacity="0.15">
    <line x1="200" y1="180" x2="200" y2="638"/>
    <line x1="340" y1="180" x2="340" y2="638"/>
    <line x1="480" y1="180" x2="480" y2="638"/>
    <line x1="620" y1="180" x2="620" y2="638"/>
  </g>

  <!-- Row dividers -->
  <g stroke="currentColor" stroke-width="1" opacity="0.12">
    <line x1="40" y1="246" x2="760" y2="246"/>
    <line x1="40" y1="302" x2="760" y2="302"/>
    <line x1="40" y1="358" x2="760" y2="358"/>
    <line x1="40" y1="414" x2="760" y2="414"/>
    <line x1="40" y1="470" x2="760" y2="470"/>
    <line x1="40" y1="526" x2="760" y2="526"/>
    <line x1="40" y1="582" x2="760" y2="582"/>
  </g>

  <!-- Row 1: Transform keys -->
  <text x="54" y="222" font-size="13" font-weight="600" fill="currentColor">Transform keys</text>
  <text x="212" y="222" font-size="12" fill="currentColor">G / R / S</text>
  <text x="352" y="222" font-size="12" fill="currentColor">W / E / R</text>
  <text x="492" y="222" font-size="12" fill="currentColor">W / E / R</text>
  <text x="632" y="222" font-size="12" fill="currentColor">E / R / T</text>

  <!-- Row 2: Viewport orbit -->
  <text x="54" y="278" font-size="13" font-weight="600" fill="currentColor">Viewport orbit</text>
  <text x="212" y="278" font-size="12" fill="currentColor">Middle-mouse drag</text>
  <text x="352" y="278" font-size="12" fill="currentColor">Alt + Left-drag</text>
  <text x="492" y="278" font-size="12" fill="currentColor">Alt + Middle-drag</text>
  <text x="632" y="278" font-size="12" fill="currentColor">Alt + Left-drag</text>

  <!-- Row 3: Object pivot -->
  <text x="54" y="334" font-size="13" font-weight="600" fill="currentColor">Object pivot</text>
  <text x="212" y="326" font-size="12" fill="currentColor">Object menu &gt;<tspan x="212" dy="14">Set Origin</tspan></text>
  <text x="352" y="326" font-size="12" fill="currentColor">D + drag<tspan x="352" dy="14">(Insert key)</tspan></text>
  <text x="492" y="326" font-size="12" fill="currentColor">Affect Pivot Only<tspan x="492" dy="14">(Hierarchy panel)</tspan></text>
  <text x="632" y="326" font-size="12" fill="currentColor">Axis Modify tool<tspan x="632" dy="14">(L key)</tspan></text>

  <!-- Row 4: Modifier stack -->
  <text x="54" y="390" font-size="13" font-weight="600" fill="currentColor">Modifier stack</text>
  <text x="212" y="382" font-size="12" fill="currentColor">Modifiers tab<tspan x="212" dy="14">(Properties panel)</tspan></text>
  <text x="352" y="382" font-size="12" fill="currentColor">Input nodes<tspan x="352" dy="14">(History)</tspan></text>
  <text x="492" y="382" font-size="12" fill="currentColor">Modifier Stack<tspan x="492" dy="14">(Command panel)</tspan></text>
  <text x="632" y="382" font-size="12" fill="currentColor">Object Manager<tspan x="632" dy="14">(parented)</tspan></text>

  <!-- Row 5: Scene hierarchy -->
  <text x="54" y="446" font-size="13" font-weight="600" fill="currentColor">Scene hierarchy</text>
  <text x="212" y="446" font-size="12" fill="currentColor">Outliner</text>
  <text x="352" y="438" font-size="12" fill="currentColor">Outliner /<tspan x="352" dy="14">Hypergraph</tspan></text>
  <text x="492" y="446" font-size="12" fill="currentColor">Scene Explorer</text>
  <text x="632" y="446" font-size="12" fill="currentColor">Object Manager</text>

  <!-- Row 6: Property editor -->
  <text x="54" y="502" font-size="13" font-weight="600" fill="currentColor">Property editor</text>
  <text x="212" y="502" font-size="12" fill="currentColor">Properties panel</text>
  <text x="352" y="502" font-size="12" fill="currentColor">Attribute Editor</text>
  <text x="492" y="502" font-size="12" fill="currentColor">Command Panel</text>
  <text x="632" y="502" font-size="12" fill="currentColor">Attribute Manager</text>

  <!-- Row 7: Material editor -->
  <text x="54" y="558" font-size="13" font-weight="600" fill="currentColor">Material editor</text>
  <text x="212" y="550" font-size="12" fill="currentColor">Shader Editor<tspan x="212" dy="14">(node-based)</tspan></text>
  <text x="352" y="558" font-size="12" fill="currentColor">Hypershade</text>
  <text x="492" y="550" font-size="12" fill="currentColor">Slate Material<tspan x="492" dy="14">Editor</tspan></text>
  <text x="632" y="550" font-size="12" fill="currentColor">Node Editor<tspan x="632" dy="14">(R20+)</tspan></text>

  <!-- Row 8: Workspaces -->
  <text x="54" y="614" font-size="13" font-weight="600" fill="currentColor">Workspaces</text>
  <text x="212" y="606" font-size="12" fill="currentColor">Workspace tabs<tspan x="212" dy="14">(top bar)</tspan></text>
  <text x="352" y="606" font-size="12" fill="currentColor">Workspaces<tspan x="352" dy="14">dropdown</tspan></text>
  <text x="492" y="606" font-size="12" fill="currentColor">Workspaces<tspan x="492" dy="14">(Customize menu)</tspan></text>
  <text x="632" y="614" font-size="12" fill="currentColor">Layouts dropdown</text>

  <!-- Footer tip callout -->
  <rect x="40" y="658" width="720" height="44" rx="6"
        fill="#FF6B00" fill-opacity="0.10"
        stroke="#FF6B00" stroke-opacity="0.4"/>
  <text x="54" y="678" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Most workflows have direct equivalents across all four apps. The name and location</text>
  <text x="54" y="694" font-size="13" fill="currentColor">change, not the underlying concept. Muscle memory adjusts within a couple weeks of regular use.</text>
</svg>
