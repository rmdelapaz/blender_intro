<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" color="#222" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" role="img" aria-labelledby="uv49-t uv49-d">
  <title id="uv49-t">Texture Scale: The UV Mapping Calculation That Sells Realism</title>
  <desc id="uv49-d">The formula for material scale &#8212; texture image size in metres divided by the real material's size in metres &#8212; worked through with a brick example, plus a side-by-side of wrong-scale versus right-scale brick so the impact is clear.</desc>
  <rect x="0" y="0" width="760" height="420" fill="none"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="currentColor">Material Scale &#8212; Getting UVs Right</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#8a8f98">The single number that decides whether brick looks like brick</text>

  <!-- formula -->
  <rect x="90" y="82" width="580" height="86" rx="10" fill="#1a1a1a"/>
  <text x="380" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#e0e0e0">Scale factor  =  texture area size (m)  &#247;  real material size (m)</text>
  <text x="380" y="144" text-anchor="middle" font-size="14" fill="#F5C242">Brick: a 2 m texture tile &#247; 0.2 m real brick  =  &#215;10 repeats</text>
  <text x="380" y="160" text-anchor="middle" font-size="11.5" fill="#8a8f98">set the node's Scale so one real-world unit maps to the texture's true size</text>

  <!-- WRONG -->
  <text x="235" y="204" text-anchor="middle" font-size="13.5" font-weight="700" fill="#E63946">WRONG SCALE</text>
  <rect x="120" y="216" width="230" height="150" rx="8" fill="#1a1a1a" stroke="#E63946" stroke-width="2"/>
  <g stroke="#E63946" stroke-width="1.4" opacity="0.85">
    <line x1="120" y1="266" x2="350" y2="266"/><line x1="120" y1="316" x2="350" y2="316"/>
    <line x1="235" y1="216" x2="235" y2="266"/><line x1="177" y1="266" x2="177" y2="316"/><line x1="293" y1="266" x2="293" y2="316"/><line x1="235" y1="316" x2="235" y2="366"/>
  </g>
  <text x="235" y="384" text-anchor="middle" font-size="11.5" fill="#c9ccd1">giant bricks &#8212; reads as a dollhouse</text>

  <!-- RIGHT -->
  <text x="525" y="204" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4ADE80">RIGHT SCALE</text>
  <rect x="410" y="216" width="230" height="150" rx="8" fill="#1a1a1a" stroke="#4ADE80" stroke-width="2"/>
  <g stroke="#4ADE80" stroke-width="0.9" opacity="0.85">
    <line x1="410" y1="238" x2="640" y2="238"/><line x1="410" y1="260" x2="640" y2="260"/><line x1="410" y1="282" x2="640" y2="282"/><line x1="410" y1="304" x2="640" y2="304"/><line x1="410" y1="326" x2="640" y2="326"/><line x1="410" y1="348" x2="640" y2="348"/>
    <line x1="448" y1="216" x2="448" y2="238"/><line x1="486" y1="238" x2="486" y2="260"/><line x1="524" y1="216" x2="524" y2="238"/><line x1="562" y1="238" x2="562" y2="260"/><line x1="600" y1="216" x2="600" y2="238"/>
    <line x1="467" y1="260" x2="467" y2="282"/><line x1="543" y1="260" x2="543" y2="282"/><line x1="505" y1="282" x2="505" y2="304"/><line x1="581" y1="282" x2="581" y2="304"/>
  </g>
  <text x="525" y="384" text-anchor="middle" font-size="11.5" fill="#c9ccd1">human-sized bricks &#8212; reads as a wall</text>
</svg>
