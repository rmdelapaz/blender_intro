<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="th-title th-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="th-title">Three-point lighting combined with HDRI, top-down view</title>
  <desc id="th-desc">A top-down diagram of a subject ringed by a subtle HDRI environment, with three manual lights positioned around it: a key light at 45 degrees front, a fill light opposite the key, and a rim light behind the subject. The HDRI provides ambient base lighting while the three lights provide directional control.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">THREE-POINT LIGHTING + HDRI</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Top-down view &#183; subtle HDRI ring + key / fill / rim</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ===== Scene (centered around 400,360) ===== -->
  <!-- Subtle HDRI ring: dashed environment circle -->
  <circle cx="400" cy="360" r="230" fill="none" stroke="#FF6B00" stroke-width="2" stroke-dasharray="6 8" opacity="0.55"/>
  <text x="400" y="148" text-anchor="middle" font-size="13" font-weight="700" fill="#FF6B00">HDRI ENVIRONMENT &#183; ambient base + reflections (all directions)</text>

  <!-- Camera glyph (bottom-center, on the ring's front arc, looking up toward subject) -->
  <g>
    <rect x="500" y="566" width="44" height="26" rx="4" fill="currentColor" opacity="0.5"/>
    <path d="M 512 566 L 518 555 L 526 555 L 532 566 Z" fill="currentColor" opacity="0.5"/>
    <line x1="522" y1="555" x2="430" y2="392" stroke="currentColor" stroke-width="1.5" opacity="0.3" stroke-dasharray="4 5"/>
    <text x="556" y="582" font-size="11" fill="currentColor" opacity="0.65">Camera</text>
  </g>

  <!-- Subject at center -->
  <circle cx="400" cy="360" r="34" fill="#c9c9cf"/>
  <path d="M 400 326 A 34 34 0 0 1 430 379 L 400 360 Z" fill="#ffffff" opacity="0.5"/>
  <text x="400" y="365" text-anchor="middle" font-size="12" font-weight="700" fill="#333">Subject</text>

  <!-- ===== KEY light: front-left of subject, ~45deg (camera side) ===== -->
  <g>
    <path d="M 214 470 L 372 382 L 384 414 Z" fill="#667eea" fill-opacity="0.18"/>
    <line x1="214" y1="470" x2="376" y2="386" stroke="#667eea" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="214" cy="470" r="16" fill="#667eea"/>
    <text x="214" y="475" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">K</text>
    <text x="214" y="442" text-anchor="middle" font-size="13" font-weight="700" fill="#667eea">KEY</text>
    <text x="214" y="504" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.7">main light &#183; 45&#176;</text>
  </g>

  <!-- ===== FILL light: front-right of subject, opposite the key ===== -->
  <g>
    <path d="M 586 470 L 428 382 L 416 414 Z" fill="#6BCF7F" fill-opacity="0.16"/>
    <line x1="586" y1="470" x2="424" y2="386" stroke="#6BCF7F" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 5"/>
    <circle cx="586" cy="470" r="16" fill="#6BCF7F"/>
    <text x="586" y="475" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1a14">F</text>
    <text x="586" y="442" text-anchor="middle" font-size="13" font-weight="700" fill="#6BCF7F">FILL</text>
    <text x="586" y="504" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.7">softens shadow</text>
  </g>

  <!-- ===== RIM light: behind subject (top-center), opposite the camera ===== -->
  <g>
    <path d="M 400 248 L 384 324 L 416 324 Z" fill="#FF6B9D" fill-opacity="0.18"/>
    <line x1="400" y1="248" x2="400" y2="322" stroke="#FF6B9D" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="400" cy="232" r="16" fill="#FF6B9D"/>
    <text x="400" y="237" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">R</text>
    <text x="400" y="204" text-anchor="middle" font-size="13" font-weight="700" fill="#FF6B9D">RIM</text>
    <text x="400" y="290" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.7">edge separation &#183; behind</text>
  </g>

  <!-- ===== Legend ===== -->
  <text x="40" y="585" font-size="13" font-weight="600" fill="currentColor">Reading it:</text>
  <text x="40" y="606" font-size="12" fill="currentColor" opacity="0.8">HDRI ring lights everything softly from all sides; the three manual lights add directional control on top.</text>

  <!-- Footer tip (Variant B, dense) -->
  <rect x="40" y="641" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Set HDRI to 0.2&#8211;0.5 so it reads as ambient fill, then balance key / fill / rim above it.
  </text>
</svg>
