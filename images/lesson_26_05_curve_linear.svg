<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="cl-title cl-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="cl-title">Linear F&#183;Curve: constant speed</title>
  <desc id="cl-desc">A Graph Editor F-curve drawn as a straight diagonal line from frame 1 value 0 to frame 24 value 5. The constant slope means the value changes by the same amount every frame, producing mechanical, robotic motion with no acceleration or deceleration.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">READING F&#183;CURVES &#183; LINEAR</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">A straight line means constant speed &#183; mechanical, robotic motion</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Plot frame: x 110..720, y 170..460 -->
  <!-- Gridlines -->
  <g stroke="currentColor" stroke-width="1" opacity="0.15">
    <!-- vertical gridlines at frame 1,12,24 -->
    <line x1="110" y1="170" x2="110" y2="460"/>
    <line x1="415" y1="170" x2="415" y2="460"/>
    <line x1="720" y1="170" x2="720" y2="460"/>
    <!-- horizontal gridlines at value 0,5 -->
    <line x1="110" y1="460" x2="720" y2="460"/>
    <line x1="110" y1="170" x2="720" y2="170"/>
  </g>

  <!-- Axes (slightly stronger) -->
  <g stroke="currentColor" stroke-width="1.5" opacity="0.4" stroke-linecap="round">
    <line x1="110" y1="170" x2="110" y2="460"/>
    <line x1="110" y1="460" x2="720" y2="460"/>
  </g>

  <!-- Axis labels + ticks -->
  <text x="110" y="478" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">1</text>
  <text x="415" y="478" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">12</text>
  <text x="720" y="478" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">24</text>
  <text x="415" y="500" font-size="13" fill="currentColor" opacity="0.65" text-anchor="middle">Frame (time)</text>

  <text x="98" y="464" font-size="13" fill="currentColor" opacity="0.6" text-anchor="end">0</text>
  <text x="98" y="174" font-size="13" fill="currentColor" opacity="0.6" text-anchor="end">5</text>
  <text x="78" y="315" font-size="13" fill="currentColor" opacity="0.65" text-anchor="middle" transform="rotate(-90 78 315)">Value</text>

  <!-- The linear F-curve: (frame1,val0)=(110,460) to (frame24,val5)=(720,170) -->
  <line x1="110" y1="460" x2="720" y2="170" stroke="#FF6B00" stroke-width="3" stroke-linecap="round"/>

  <!-- Keyframe diamonds at endpoints -->
  <g fill="#FF6B00">
    <path d="M 110 451 L 119 460 L 110 469 L 101 460 Z"/>
    <path d="M 720 161 L 729 170 L 720 179 L 711 170 Z"/>
  </g>

  <!-- Annotation: constant slope along the mid-line -->
  <line x1="415" y1="315" x2="500" y2="270" stroke="currentColor" stroke-width="1" opacity="0.3" stroke-linecap="round"/>
  <text x="506" y="266" font-size="14" fill="currentColor">Same slope the whole way:</text>
  <text x="506" y="285" font-size="14" fill="currentColor" opacity="0.65">value rises an equal amount</text>
  <text x="506" y="303" font-size="14" fill="currentColor" opacity="0.65">every frame</text>

  <!-- Annotation: no accel near start -->
  <line x1="180" y1="410" x2="150" y2="380" stroke="currentColor" stroke-width="1" opacity="0.3" stroke-linecap="round"/>
  <text x="150" y="372" font-size="14" fill="currentColor">No ease in / no ease out</text>

  <!-- Caution pill: robotic/mechanical (caution role, label carries meaning) -->
  <rect x="476" y="396" width="244" height="30" rx="6" fill="#F5C242" fill-opacity="0.14" stroke="#F5C242" stroke-opacity="0.55"/>
  <circle cx="494" cy="411" r="4" fill="#F5C242"/>
  <text x="506" y="416" font-size="14" font-weight="600" fill="currentColor">Robotic &#183; mechanical motion</text>

  <!-- Footer tip (Variant B, left rail) -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Equal frame spacing for equal value change means zero easing &#183; real motion almost always eases.
  </text>
</svg>
