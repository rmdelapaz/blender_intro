<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="dc-title dc-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="dc-title">Independent duplication versus linked duplication</title>
  <desc id="dc-desc">Two side by side panels compare the two duplication shortcuts. The left panel labeled Independent Copy shows the Shift plus D shortcut. An original cube and a duplicate cube sit side by side with an orange translation arrow between them. Both cubes are drawn the same way to show they are equal but fully separate. The right panel labeled Linked Copy shows the Alt plus D shortcut. The same two cubes appear with the same arrow, plus a small orange chain link icon between them labeled shared mesh data, indicating that both cubes share one mesh. A shared note below the panels summarizes the difference. A footer tip suggests reaching for Alt plus D for repeated geometry like rivets, leaves, or fence posts.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">DUPLICATION: SHIFT + D VS ALT + D</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Two ways to copy an object. The keys look similar, the results are not.</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Subhead -->
  <text x="400" y="138" font-size="15" font-weight="700" fill="#FF6B00" text-anchor="middle" letter-spacing="2">INDEPENDENT COPIES VS LINKED COPIES</text>

  <!-- =============================================================== -->
  <!-- TWO PANELS                                                       -->
  <!-- Left  (Shift + D): translate(40, 160)   340 x 260                -->
  <!-- Right (Alt + D):   translate(420, 160)  340 x 260                -->
  <!-- Cubes at panel-local front-face origins (30, 105) and (210, 105) -->
  <!-- =============================================================== -->

  <!-- ===== LEFT PANEL: SHIFT + D (INDEPENDENT) ===== -->
  <g transform="translate(40, 160)">
    <rect x="0" y="0" width="340" height="260" rx="8"
          fill="currentColor" fill-opacity="0.04"
          stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>

    <!-- Panel header -->
    <text x="170" y="26" font-size="16" font-weight="700" fill="#FF6B00" text-anchor="middle">Independent Copy</text>

    <!-- Operation badge -->
    <rect x="130" y="42" width="80" height="22" rx="4" fill="#FF6B00"/>
    <text x="170" y="58" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Shift + D</text>

    <!-- Original cube at panel-local front-face (30, 105) -->
    <g opacity="0.10">
      <rect x="30" y="105" width="50" height="50" fill="currentColor"/>
      <polygon points="30,105 48,90 98,90 80,105" fill="currentColor"/>
      <polygon points="80,105 98,90 98,140 80,155" fill="currentColor"/>
    </g>
    <g stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
      <rect x="30" y="105" width="50" height="50"/>
      <polygon points="30,105 48,90 98,90 80,105"/>
      <polygon points="80,105 98,90 98,140 80,155"/>
    </g>

    <!-- Translation arrow -->
    <line x1="105" y1="130" x2="200" y2="130" stroke="#FF6B00" stroke-width="3" stroke-linecap="round"/>
    <polygon points="200,130 190,124 190,136" fill="#FF6B00"/>

    <!-- Duplicate cube at panel-local front-face (210, 105) -->
    <g opacity="0.10">
      <rect x="210" y="105" width="50" height="50" fill="currentColor"/>
      <polygon points="210,105 228,90 278,90 260,105" fill="currentColor"/>
      <polygon points="260,105 278,90 278,140 260,155" fill="currentColor"/>
    </g>
    <g stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
      <rect x="210" y="105" width="50" height="50"/>
      <polygon points="210,105 228,90 278,90 260,105"/>
      <polygon points="260,105 278,90 278,140 260,155"/>
    </g>

    <!-- Description -->
    <text x="170" y="212" font-size="12" fill="currentColor" opacity="0.75" text-anchor="middle">Two separate meshes</text>
    <text x="170" y="232" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">Edit one, the other stays unchanged</text>
  </g>

  <!-- ===== RIGHT PANEL: ALT + D (LINKED) ===== -->
  <g transform="translate(420, 160)">
    <rect x="0" y="0" width="340" height="260" rx="8"
          fill="currentColor" fill-opacity="0.04"
          stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>

    <!-- Panel header -->
    <text x="170" y="26" font-size="16" font-weight="700" fill="#FF6B00" text-anchor="middle">Linked Copy</text>

    <!-- Operation badge -->
    <rect x="130" y="42" width="80" height="22" rx="4" fill="#FF6B00"/>
    <text x="170" y="58" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Alt + D</text>

    <!-- Original cube at panel-local front-face (30, 105) -->
    <g opacity="0.10">
      <rect x="30" y="105" width="50" height="50" fill="currentColor"/>
      <polygon points="30,105 48,90 98,90 80,105" fill="currentColor"/>
      <polygon points="80,105 98,90 98,140 80,155" fill="currentColor"/>
    </g>
    <g stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
      <rect x="30" y="105" width="50" height="50"/>
      <polygon points="30,105 48,90 98,90 80,105"/>
      <polygon points="80,105 98,90 98,140 80,155"/>
    </g>

    <!-- Translation arrow -->
    <line x1="105" y1="130" x2="200" y2="130" stroke="#FF6B00" stroke-width="3" stroke-linecap="round"/>
    <polygon points="200,130 190,124 190,136" fill="#FF6B00"/>

    <!-- Duplicate cube at panel-local front-face (210, 105) -->
    <g opacity="0.10">
      <rect x="210" y="105" width="50" height="50" fill="currentColor"/>
      <polygon points="210,105 228,90 278,90 260,105" fill="currentColor"/>
      <polygon points="260,105 278,90 278,140 260,155" fill="currentColor"/>
    </g>
    <g stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
      <rect x="210" y="105" width="50" height="50"/>
      <polygon points="210,105 228,90 278,90 260,105"/>
      <polygon points="260,105 278,90 278,140 260,155"/>
    </g>

    <!-- Chain-link icon (two interlocking ellipses) below the arrow -->
    <g stroke="#FF6B00" stroke-width="2" fill="none">
      <ellipse cx="140" cy="170" rx="11" ry="7"/>
      <ellipse cx="158" cy="170" rx="11" ry="7"/>
    </g>
    <text x="149" y="190" font-size="10" fill="currentColor" opacity="0.7" text-anchor="middle" font-style="italic">shared mesh data</text>

    <!-- Description -->
    <text x="170" y="212" font-size="12" fill="currentColor" opacity="0.75" text-anchor="middle">One mesh, two objects</text>
    <text x="170" y="232" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">Edit Mode changes propagate to both</text>
  </g>

  <!-- ===== Shared "INDEPENDENT VS LINKED" inset ===== -->
  <g transform="translate(60, 438)">
    <rect x="0" y="0" width="680" height="52" rx="6"
          fill="currentColor" fill-opacity="0.04"
          stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>
    <text x="14" y="20" font-size="11" font-weight="700" fill="currentColor" opacity="0.75" letter-spacing="0.8">INDEPENDENT VS LINKED</text>
    <text x="14" y="40" font-size="12" fill="currentColor" opacity="0.8">Shift + D copies the mesh data too, so each cube has its own geometry. Alt + D shares one mesh between both, so edits in Edit Mode show up on every linked instance.</text>
  </g>

  <!-- Footer tip callout -->
  <rect x="40" y="506" width="720" height="34" rx="6"
        fill="#FF6B00" fill-opacity="0.10"
        stroke="#FF6B00" stroke-opacity="0.4"/>
  <text x="54" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Reach for Alt + D when you need lots of the same geometry, rivets, leaves, fence posts. One Edit Mode tweak updates every copy at once.
  </text>
</svg>
