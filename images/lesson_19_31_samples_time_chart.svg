<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="stc-title stc-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="stc-title">Render time and quality versus sample count</title>
  <desc id="stc-desc">A chart plotting render time as orange bars and image quality as a blue curve against sample count from 32 to 4096. Render time rises roughly linearly while quality rises fast then flattens. A highlighted sweet-spot band around 256 to 512 samples marks where quality is high but time is still reasonable, especially with denoising on.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Samples vs Render Time and Quality</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Time keeps climbing · quality flattens · the sweet spot is lower than you think</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Plot frame: x from 110 to 720, y baseline 470, top 150 -->
  <!-- Sweet-spot band (behind everything): samples 256-512 -->
  <rect x="300" y="150" width="150" height="320" fill="#4ADE80" opacity="0.10"/>
  <text x="375" y="168" text-anchor="middle" font-size="12" font-weight="700" fill="#4ADE80">Sweet spot</text>
  <text x="375" y="184" text-anchor="middle" font-size="11" fill="#4ADE80" opacity="0.85">256 to 512 + denoise</text>

  <!-- Axes -->
  <line x1="110" y1="150" x2="110" y2="470" stroke="currentColor" stroke-width="1.5" opacity="0.35"/>
  <line x1="110" y1="470" x2="720" y2="470" stroke="currentColor" stroke-width="1.5" opacity="0.35"/>

  <!-- Left axis label (time) -->
  <text x="60" y="310" text-anchor="middle" font-size="13" font-weight="600" fill="#FF6B00" transform="rotate(-90 60 310)">Render time</text>
  <!-- Right axis label (quality) -->
  <text x="752" y="310" text-anchor="middle" font-size="13" font-weight="600" fill="#4A9EFF" transform="rotate(-90 752 310)">Image quality</text>

  <!-- gridlines (subtle) -->
  <g stroke="currentColor" stroke-width="1" opacity="0.08">
    <line x1="110" y1="390" x2="720" y2="390"/>
    <line x1="110" y1="310" x2="720" y2="310"/>
    <line x1="110" y1="230" x2="720" y2="230"/>
  </g>

  <!-- Bars: render time (orange), columns at samples 32/64/128/256/512/1024/2048/4096 -->
  <!-- x-centers: 150 225 300 375 450 525 600 675, width 44 -->
  <g fill="#FF6B00" opacity="0.85">
    <rect x="128" y="452" width="44" height="18"/>
    <rect x="203" y="438" width="44" height="32"/>
    <rect x="278" y="414" width="44" height="56"/>
    <rect x="353" y="378" width="44" height="92"/>
    <rect x="428" y="330" width="44" height="140"/>
    <rect x="503" y="268" width="44" height="202"/>
    <rect x="578" y="206" width="44" height="264"/>
    <rect x="653" y="158" width="44" height="312"/>
  </g>

  <!-- Quality curve (blue): rises fast then flattens. y smaller = higher quality -->
  <polyline points="150,440 225,392 300,344 375,300 450,272 525,256 600,248 675,244"
            fill="none" stroke="#4A9EFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#4A9EFF">
    <circle cx="150" cy="440" r="4"/>
    <circle cx="225" cy="392" r="4"/>
    <circle cx="300" cy="344" r="4"/>
    <circle cx="375" cy="300" r="4"/>
    <circle cx="450" cy="272" r="4"/>
    <circle cx="525" cy="256" r="4"/>
    <circle cx="600" cy="248" r="4"/>
    <circle cx="675" cy="244" r="4"/>
  </g>
  <!-- "diminishing returns" note on the flat part -->
  <text x="540" y="206" text-anchor="middle" font-size="11" font-style="italic" fill="#4A9EFF" opacity="0.9">quality barely improves</text>

  <!-- X axis tick labels (sample counts) -->
  <g font-size="12" fill="currentColor" opacity="0.7" text-anchor="middle">
    <text x="150" y="490">32</text>
    <text x="225" y="490">64</text>
    <text x="300" y="490">128</text>
    <text x="375" y="490">256</text>
    <text x="450" y="490">512</text>
    <text x="525" y="490">1024</text>
    <text x="600" y="490">2048</text>
    <text x="675" y="490">4096</text>
  </g>
  <text x="415" y="514" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Sample count</text>

  <!-- Legend -->
  <g>
    <rect x="120" y="540" width="20" height="14" fill="#FF6B00" opacity="0.85"/>
    <text x="148" y="552" font-size="13" fill="currentColor">Render time (rises with every sample)</text>
    <line x1="450" y1="547" x2="478" y2="547" stroke="#4A9EFF" stroke-width="3" stroke-linecap="round"/>
    <circle cx="464" cy="547" r="4" fill="#4A9EFF"/>
    <text x="486" y="552" font-size="13" fill="currentColor">Image quality (flattens early)</text>
  </g>

  <!-- Takeaway line -->
  <text x="40" y="592" font-size="13" fill="currentColor" opacity="0.75">Past the sweet spot you pay much more time for almost no visible gain. Denoising lifts the low end.</text>

  <!-- Footer tip (Variant B left rail), dense 680 position -->
  <rect x="40" y="641" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Start at 256 to 512 samples with denoising on. Only push higher if a final render still shows noise.
  </text>
</svg>
