<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="fo-title fo-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="fo-title">Recommended Blender Asset Folder Structure</title>
  <desc id="fo-desc">A hierarchical folder tree for organizing Blender assets. The root Blender_Assets folder contains four subfolders: Props with Kitchen (holding CoffeeMug_v01 and Plate_v01) and Furniture (holding Chair_v01) subfolders inside, plus Characters, Environments, and Materials. Folders are color coded by category and the .blend files are shown in purple.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Organizing Your Blender Assets</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">A clean folder tree makes your saved mugs, props, and other models easy to find again.</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Tree connectors -->
  <g stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.3">
    <!-- Root trunk: from below root icon down to last top-level child -->
    <line x1="64" y1="166" x2="64" y2="471"/>
    <!-- Branches to top-level children -->
    <line x1="64" y1="201" x2="98" y2="201"/>
    <line x1="64" y1="403" x2="98" y2="403"/>
    <line x1="64" y1="437" x2="98" y2="437"/>
    <line x1="64" y1="471" x2="98" y2="471"/>
    <!-- Props sub-trunk -->
    <line x1="112" y1="210" x2="112" y2="333"/>
    <!-- Branches to Level 2 children -->
    <line x1="112" y1="237" x2="142" y2="237"/>
    <line x1="112" y1="333" x2="142" y2="333"/>
    <!-- Kitchen sub-sub-trunk -->
    <line x1="156" y1="246" x2="156" y2="297"/>
    <!-- Branches to .blend files under Kitchen -->
    <line x1="156" y1="267" x2="186" y2="267"/>
    <line x1="156" y1="297" x2="186" y2="297"/>
    <!-- Furniture sub-sub-trunk -->
    <line x1="156" y1="342" x2="156" y2="363"/>
    <!-- Branch to .blend file under Furniture -->
    <line x1="156" y1="363" x2="186" y2="363"/>
  </g>

  <!-- Row 1: Root Blender_Assets/ (brand orange) -->
  <path transform="translate(48,140)" d="M 4 7 Q 4 5 6 5 L 11 5 L 14 8 L 26 8 Q 28 8 28 10 L 28 22 Q 28 24 26 24 L 6 24 Q 4 24 4 22 Z" fill="#FF6B00"/>
  <text x="88" y="162" font-size="16" font-weight="600" fill="currentColor">Blender_Assets/</text>
  <text x="380" y="162" font-size="13" fill="currentColor" opacity="0.6" font-style="italic">your asset library root</text>

  <!-- Row 2: Props/ (blue) -->
  <path transform="translate(96,184)" d="M 4 7 Q 4 5 6 5 L 11 5 L 14 8 L 26 8 Q 28 8 28 10 L 28 22 Q 28 24 26 24 L 6 24 Q 4 24 4 22 Z" fill="#4A9EFF"/>
  <text x="136" y="206" font-size="15" font-weight="500" fill="currentColor">Props/</text>
  <text x="380" y="206" font-size="13" fill="currentColor" opacity="0.6">Reusable objects organized by category</text>

  <!-- Row 3: Kitchen/ (darker blue) -->
  <path transform="translate(140,220)" d="M 4 7 Q 4 5 6 5 L 11 5 L 14 8 L 26 8 Q 28 8 28 10 L 28 22 Q 28 24 26 24 L 6 24 Q 4 24 4 22 Z" fill="#3a7fd1"/>
  <text x="180" y="242" font-size="14" fill="currentColor">Kitchen/</text>

  <!-- Row 4: CoffeeMug_v01.blend (purple file with Blender-orange dot) -->
  <g transform="translate(184,250)">
    <path d="M 4 5 L 18 5 L 26 13 L 26 25 Q 26 27 24 27 L 6 27 Q 4 27 4 25 Z" fill="#B47EE8"/>
    <path d="M 18 5 L 18 13 L 26 13" fill="none" stroke="#0f1a14" stroke-opacity="0.25" stroke-width="1"/>
    <circle cx="15" cy="20" r="2.5" fill="#FF6B00"/>
  </g>
  <text x="224" y="272" font-size="13" fill="currentColor">CoffeeMug_v01.blend</text>

  <!-- Row 5: Plate_v01.blend (purple file with Blender-orange dot) -->
  <g transform="translate(184,280)">
    <path d="M 4 5 L 18 5 L 26 13 L 26 25 Q 26 27 24 27 L 6 27 Q 4 27 4 25 Z" fill="#B47EE8"/>
    <path d="M 18 5 L 18 13 L 26 13" fill="none" stroke="#0f1a14" stroke-opacity="0.25" stroke-width="1"/>
    <circle cx="15" cy="20" r="2.5" fill="#FF6B00"/>
  </g>
  <text x="224" y="302" font-size="13" fill="currentColor">Plate_v01.blend</text>

  <!-- Row 6: Furniture/ (darker blue) -->
  <path transform="translate(140,316)" d="M 4 7 Q 4 5 6 5 L 11 5 L 14 8 L 26 8 Q 28 8 28 10 L 28 22 Q 28 24 26 24 L 6 24 Q 4 24 4 22 Z" fill="#3a7fd1"/>
  <text x="180" y="338" font-size="14" fill="currentColor">Furniture/</text>

  <!-- Row 7: Chair_v01.blend (purple file with Blender-orange dot) -->
  <g transform="translate(184,346)">
    <path d="M 4 5 L 18 5 L 26 13 L 26 25 Q 26 27 24 27 L 6 27 Q 4 27 4 25 Z" fill="#B47EE8"/>
    <path d="M 18 5 L 18 13 L 26 13" fill="none" stroke="#0f1a14" stroke-opacity="0.25" stroke-width="1"/>
    <circle cx="15" cy="20" r="2.5" fill="#FF6B00"/>
  </g>
  <text x="224" y="368" font-size="13" fill="currentColor">Chair_v01.blend</text>

  <!-- Row 8: Characters/ (pink) -->
  <path transform="translate(96,386)" d="M 4 7 Q 4 5 6 5 L 11 5 L 14 8 L 26 8 Q 28 8 28 10 L 28 22 Q 28 24 26 24 L 6 24 Q 4 24 4 22 Z" fill="#FF7EA8"/>
  <text x="136" y="408" font-size="15" font-weight="500" fill="currentColor">Characters/</text>
  <text x="380" y="408" font-size="13" fill="currentColor" opacity="0.6">Rigged figures and creatures</text>

  <!-- Row 9: Environments/ (green) -->
  <path transform="translate(96,420)" d="M 4 7 Q 4 5 6 5 L 11 5 L 14 8 L 26 8 Q 28 8 28 10 L 28 22 Q 28 24 26 24 L 6 24 Q 4 24 4 22 Z" fill="#4ADE80"/>
  <text x="136" y="442" font-size="15" font-weight="500" fill="currentColor">Environments/</text>
  <text x="380" y="442" font-size="13" fill="currentColor" opacity="0.6">Scenes, terrains, and backdrops</text>

  <!-- Row 10: Materials/ (yellow) -->
  <path transform="translate(96,454)" d="M 4 7 Q 4 5 6 5 L 11 5 L 14 8 L 26 8 Q 28 8 28 10 L 28 22 Q 28 24 26 24 L 6 24 Q 4 24 4 22 Z" fill="#F5C242"/>
  <text x="136" y="476" font-size="15" font-weight="500" fill="currentColor">Materials/</text>
  <text x="380" y="476" font-size="13" fill="currentColor" opacity="0.6">Shared shaders and textures</text>

  <!-- Footer tip -->
  <rect x="40" y="506" width="720" height="34" rx="6" fill="#FF6B00" fill-opacity="0.10" stroke="#FF6B00" stroke-opacity="0.4"/>
  <text x="54" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Version your files (v01, v02) and keep one folder per category · future-you will find them in seconds.
  </text>
</svg>
