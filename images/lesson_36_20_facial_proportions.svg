<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" color="currentColor" role="img" aria-labelledby="fpr-title fpr-desc" style="max-width:100%;height:auto">
<title id="fpr-title">Facial proportions guide</title>
<desc id="fpr-desc">Front view of a head divided into standard proportional thirds with the eye line at the vertical midpoint and the face five eye-widths wide.</desc>
<style>
.fpr-s{fill:none;stroke:currentColor;stroke-width:2}
.fpr-g{fill:none;stroke:currentColor;stroke-width:1.2;opacity:.4;stroke-dasharray:5 4}
.fpr-acc{fill:none;stroke:#3a8ee6;stroke-width:1.6}
.fpr-t{fill:currentColor;font-family:system-ui,Arial,sans-serif}
.fpr-h{font-size:15px;font-weight:700}.fpr-b{font-size:12px}.fpr-s2{font-size:11px;opacity:.8}
.fpr-lbl{fill:#3a8ee6;font-size:11px;font-family:system-ui,Arial,sans-serif}
</style>
<!-- head outline -->
<path d="M280 40 C200 40 168 110 168 175 C168 250 196 320 280 360 C364 320 392 250 392 175 C392 110 360 40 280 40 Z" class="fpr-s"/>
<!-- vertical center -->
<path d="M280 30 V370" class="fpr-g"/>
<!-- horizontal thirds: hairline, brow, nose-base, chin -->
<path d="M120 70 H440" class="fpr-g"/><text x="96" y="74" class="fpr-t fpr-s2" text-anchor="end">hairline</text>
<path d="M120 167 H440" class="fpr-g"/><text x="96" y="171" class="fpr-t fpr-s2" text-anchor="end">brow</text>
<path d="M120 263 H440" class="fpr-g"/><text x="96" y="267" class="fpr-t fpr-s2" text-anchor="end">nose base</text>
<path d="M120 358 H440" class="fpr-g"/><text x="96" y="362" class="fpr-t fpr-s2" text-anchor="end">chin</text>
<!-- thirds brace right -->
<path d="M456 70 V167 M452 70 h8 M452 167 h8" class="fpr-acc"/>
<path d="M456 167 V263 M452 167 h8 M452 263 h8" class="fpr-acc"/>
<path d="M456 263 V358 M452 263 h8 M452 358 h8" class="fpr-acc"/>
<text x="470" y="123" class="fpr-lbl">1/3</text>
<text x="470" y="219" class="fpr-lbl">1/3</text>
<text x="470" y="315" class="fpr-lbl">1/3</text>
<!-- eye line at vertical midpoint (between brow & nose roughly, classic "eyes at halfway of head height") -->
<path d="M168 215 H392" stroke="#3a8ee6" stroke-width="1.6" opacity=".9" fill="none"/>
<text x="280" y="208" class="fpr-lbl" text-anchor="middle">eye line = halfway down head</text>
<!-- eyes: 5 widths across -->
<g class="fpr-s">
<path d="M214 215 q14 -10 28 0 q-14 10 -28 0 z"/>
<path d="M318 215 q14 -10 28 0 q-14 10 -28 0 z"/>
</g>
<circle cx="228" cy="215" r="4" class="fpr-t fpr-s"/>
<circle cx="332" cy="215" r="4" class="fpr-t fpr-s"/>
<!-- five eye-width ticks (above the eyes, clear of nose) -->
<g stroke="#3a8ee6" stroke-width="1.4" fill="none" opacity=".85">
<path d="M196 190 v-8 M224 190 v-8 M252 190 v-8 M308 190 v-8 M336 190 v-8 M364 190 v-8"/>
<path d="M196 190 H364"/>
</g>
<text x="280" y="182" class="fpr-lbl" text-anchor="middle">face width = 5 eye-widths (incl. ear gaps)</text>
<!-- nose -->
<path d="M280 230 q-10 26 -2 32 q-8 4 -12 -2 M280 230 q10 26 2 32 q8 4 12 -2" class="fpr-s"/>
<!-- mouth: ~1/3 from nose to chin; corners align with eye pupils' inner -->
<path d="M256 308 q24 14 48 0 q-24 8 -48 0 z" class="fpr-s"/>
<path d="M280 287 V308" class="fpr-g"/>
<text x="312" y="300" class="fpr-lbl">mouth: top 1/3 nose&#8594;chin</text>
<!-- bottom notes -->
<text x="40" y="400" class="fpr-t fpr-h">Standard adult landmarks</text>
<text x="40" y="424" class="fpr-t fpr-b">&#183; Face height splits into equal thirds: hairline&#8594;brow, brow&#8594;nose base, nose base&#8594;chin.</text>
<text x="40" y="444" class="fpr-t fpr-b">&#183; Eyes sit on the horizontal midline of the whole head; one eye-width gap between them.</text>
<text x="40" y="464" class="fpr-t fpr-b">&#183; Mouth rests one-third down from nose to chin; ears span brow to nose-base line.</text>
</svg>
