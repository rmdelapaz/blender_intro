<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="pl-title pl-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="pl-title">The Eevee rendering pipeline</title>
  <desc id="pl-desc">A four-stage horizontal flow showing how Eevee turns a scene into a finished frame. Stage one rasterization projects geometry to the screen. Stage two shading evaluates materials and direct lighting. Stage three screen-space and raytraced effects add reflections, refraction, ambient occlusion and shadows. Stage four post-processing applies colour management and compositor glare. Arrows connect the stages left to right.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">The Eevee Pipeline</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">How a scene becomes a finished frame, stage by stage</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Stage 1 -->
  <rect x="40" y="150" width="168" height="150" rx="8" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-width="1.5"/>
  <circle cx="64" cy="178" r="13" fill="#FF6B00"/>
  <text x="64" y="183" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
  <text x="88" y="183" font-size="15" font-weight="700" fill="currentColor">Rasterization</text>
  <text x="58" y="216" font-size="12" fill="currentColor" opacity="0.7">Project geometry</text>
  <text x="58" y="234" font-size="12" fill="currentColor" opacity="0.7">straight to screen</text>
  <text x="58" y="252" font-size="12" fill="currentColor" opacity="0.7">pixels in one</text>
  <text x="58" y="270" font-size="12" fill="currentColor" opacity="0.7">GPU pass</text>
  <text x="58" y="290" font-size="11" fill="#FF6B00" font-weight="600">depth + visibility</text>

  <!-- Stage 2 -->
  <rect x="240" y="150" width="168" height="150" rx="8" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-width="1.5"/>
  <circle cx="264" cy="178" r="13" fill="#FF6B00"/>
  <text x="264" y="183" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
  <text x="288" y="183" font-size="15" font-weight="700" fill="currentColor">Shading</text>
  <text x="258" y="216" font-size="12" fill="currentColor" opacity="0.7">Evaluate each</text>
  <text x="258" y="234" font-size="12" fill="currentColor" opacity="0.7">material and</text>
  <text x="258" y="252" font-size="12" fill="currentColor" opacity="0.7">direct light per</text>
  <text x="258" y="270" font-size="12" fill="currentColor" opacity="0.7">visible pixel</text>
  <text x="258" y="290" font-size="11" fill="#FF6B00" font-weight="600">BSDF + lamps</text>

  <!-- Stage 3 -->
  <rect x="440" y="150" width="168" height="150" rx="8" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-width="1.5"/>
  <circle cx="464" cy="178" r="13" fill="#FF6B00"/>
  <text x="464" y="183" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
  <text x="488" y="183" font-size="15" font-weight="700" fill="currentColor">Effects</text>
  <text x="458" y="216" font-size="12" fill="currentColor" opacity="0.7">Screen-space and</text>
  <text x="458" y="234" font-size="12" fill="currentColor" opacity="0.7">raytraced passes:</text>
  <text x="458" y="252" font-size="12" fill="currentColor" opacity="0.7">reflections, AO,</text>
  <text x="458" y="270" font-size="12" fill="currentColor" opacity="0.7">refraction, shadows</text>
  <text x="458" y="290" font-size="11" fill="#FF6B00" font-weight="600">raytracing on</text>

  <!-- Stage 4 -->
  <rect x="640" y="150" width="120" height="150" rx="8" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-width="1.5"/>
  <circle cx="664" cy="178" r="13" fill="#FF6B00"/>
  <text x="664" y="183" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
  <text x="688" y="183" font-size="14" font-weight="700" fill="currentColor">Post</text>
  <text x="658" y="216" font-size="12" fill="currentColor" opacity="0.7">Colour mgmt,</text>
  <text x="658" y="234" font-size="12" fill="currentColor" opacity="0.7">compositor</text>
  <text x="658" y="252" font-size="12" fill="currentColor" opacity="0.7">glare, final</text>
  <text x="658" y="270" font-size="12" fill="currentColor" opacity="0.7">frame</text>
  <text x="658" y="290" font-size="11" fill="#FF6B00" font-weight="600">to display</text>

  <!-- arrows between stages -->
  <g fill="#FF6B00">
    <polygon points="232,225 212,215 212,235"/>
    <polygon points="432,225 412,215 412,235"/>
    <polygon points="632,225 612,215 612,235"/>
  </g>

  <!-- single-pass band -->
  <rect x="40" y="336" width="568" height="56" rx="6" fill="#4A9EFF" fill-opacity="0.08"/>
  <text x="56" y="360" font-size="13" font-weight="600" fill="currentColor">Stages 1 to 3 run together on the GPU, once per frame</text>
  <text x="56" y="380" font-size="12" fill="currentColor" opacity="0.7">No light bouncing around the scene for minutes &#183; the whole frame is approximated in milliseconds</text>

  <rect x="624" y="336" width="136" height="56" rx="6" fill="#4ADE80" fill-opacity="0.1"/>
  <text x="692" y="360" font-size="12.5" font-weight="700" text-anchor="middle" fill="currentColor">Real-time</text>
  <text x="692" y="380" font-size="11.5" text-anchor="middle" fill="currentColor" opacity="0.7">interactive</text>

  <!-- Footer tip (Variant B left rail) -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Effects in stage 3 only see what is already on screen &#183; that single constraint explains most of Eevee&#8217;s quirks.</text>
</svg>