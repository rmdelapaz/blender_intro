<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="l45f02-t l45f02-d" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" color="#222">
<title id="l45f02-t">Performance targets: good versus poor</title>
<desc id="l45f02-d">Three metric rows compare healthy targets against warning thresholds: viewport frame rate above twenty-four frames per second is good while below twelve stutters; test-render time under one minute is good while over ten minutes stalls iteration; memory use below seventy percent of available RAM is safe while above ninety percent risks a crash.</desc>
<style>
.hd{font-size:15px;font-weight:700;}
.metric{font-size:13.5px;font-weight:700;}
.val{font-size:13px;font-weight:700;}
.note{font-size:11px;fill:#c8c8c8;}
.cell{fill:#2a2a2a;}
.gcol{fill:#4ADE80;}
.rcol{fill:#E63946;}
</style>
<rect class="cell" x="40" y="44" width="220" height="34" rx="6"/>
<rect class="cell" x="272" y="44" width="220" height="34" rx="6"/>
<rect class="cell" x="504" y="44" width="216" height="34" rx="6"/>
<text class="hd" x="150" y="66" text-anchor="middle">Metric</text>
<text class="hd" x="382" y="66" text-anchor="middle" fill="#4ADE80">Good target</text>
<text class="hd" x="612" y="66" text-anchor="middle" fill="#E63946">Warning</text>
<g>
<rect class="cell" x="40" y="90" width="220" height="80" rx="6"/>
<text class="metric" x="60" y="122">Viewport FPS</text>
<text class="note" x="60" y="142">Editing responsiveness</text>
<rect class="cell" x="272" y="90" width="220" height="80" rx="6" stroke="#4ADE80" stroke-width="2"/>
<text class="val gcol" x="382" y="126" text-anchor="middle">&#8805; 24 fps</text>
<text class="note" x="382" y="146" text-anchor="middle">smooth navigation</text>
<rect class="cell" x="504" y="90" width="216" height="80" rx="6" stroke="#E63946" stroke-width="2"/>
<text class="val rcol" x="612" y="126" text-anchor="middle">&#60; 12 fps</text>
<text class="note" x="612" y="146" text-anchor="middle">stutters, hard to work</text>
</g>
<g>
<rect class="cell" x="40" y="182" width="220" height="80" rx="6"/>
<text class="metric" x="60" y="214">Test-render time</text>
<text class="note" x="60" y="234">Iteration speed</text>
<rect class="cell" x="272" y="182" width="220" height="80" rx="6" stroke="#4ADE80" stroke-width="2"/>
<text class="val gcol" x="382" y="218" text-anchor="middle">&#60; 1 min</text>
<text class="note" x="382" y="238" text-anchor="middle">fast feedback</text>
<rect class="cell" x="504" y="182" width="216" height="80" rx="6" stroke="#E63946" stroke-width="2"/>
<text class="val rcol" x="612" y="218" text-anchor="middle">&#62; 10 min</text>
<text class="note" x="612" y="238" text-anchor="middle">stalls the workflow</text>
</g>
<g>
<rect class="cell" x="40" y="274" width="220" height="80" rx="6"/>
<text class="metric" x="60" y="306">Memory use</text>
<text class="note" x="60" y="326">Share of system RAM</text>
<rect class="cell" x="272" y="274" width="220" height="80" rx="6" stroke="#4ADE80" stroke-width="2"/>
<text class="val gcol" x="382" y="310" text-anchor="middle">&#60; 70%</text>
<text class="note" x="382" y="330" text-anchor="middle">safe headroom</text>
<rect class="cell" x="504" y="274" width="216" height="80" rx="6" stroke="#E63946" stroke-width="2"/>
<text class="val rcol" x="612" y="310" text-anchor="middle">&#62; 90%</text>
<text class="note" x="612" y="330" text-anchor="middle">crash risk</text>
</g>
</svg>
