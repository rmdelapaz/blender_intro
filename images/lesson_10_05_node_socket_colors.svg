<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="sk-title sk-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="sk-title">Node socket color chart</title>
  <desc id="sk-desc">Four Blender shader-node socket data types shown as colored circles with labels: green Shader sockets carry complete shader information, yellow Color sockets carry RGB color values, gray Value sockets carry a single number, and purple Vector sockets carry 3D coordinates. Socket color tells you the data type, and only matching colors connect cleanly.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">NODE SOCKET COLORS</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">What each socket color tells you &#183; Blender shader nodes</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Row: Shader (green) -->
  <g>
    <circle cx="86" cy="170" r="16" fill="#4ADE80"/>
    <text x="124" y="164" font-size="15" font-weight="500" fill="currentColor">Shader</text>
    <text x="124" y="186" font-size="13" fill="currentColor" opacity="0.6">Complete shader information &#183; the full surface description</text>
    <text x="724" y="176" font-size="13" font-weight="700" text-anchor="end" fill="#4ADE80">#4ADE80</text>
  </g>
  <line x1="40" y1="212" x2="760" y2="212" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Row: Color (yellow) -->
  <g>
    <circle cx="86" cy="262" r="16" fill="#facc15"/>
    <text x="124" y="256" font-size="15" font-weight="500" fill="currentColor">Color</text>
    <text x="124" y="278" font-size="13" fill="currentColor" opacity="0.6">RGB color values &#183; a red, green, blue triple</text>
    <text x="724" y="268" font-size="13" font-weight="700" text-anchor="end" fill="#facc15">#FACC15</text>
  </g>
  <line x1="40" y1="304" x2="760" y2="304" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Row: Value (gray) -->
  <g>
    <circle cx="86" cy="354" r="16" fill="#a1a1a1"/>
    <text x="124" y="348" font-size="15" font-weight="500" fill="currentColor">Value</text>
    <text x="124" y="370" font-size="13" fill="currentColor" opacity="0.6">A single number &#183; one float such as 0.5 or 1.0</text>
    <text x="724" y="360" font-size="13" font-weight="700" text-anchor="end" fill="#a1a1a1">#A1A1A1</text>
  </g>
  <line x1="40" y1="396" x2="760" y2="396" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Row: Vector (purple) -->
  <g>
    <circle cx="86" cy="446" r="16" fill="#c084fc"/>
    <text x="124" y="440" font-size="15" font-weight="500" fill="currentColor">Vector</text>
    <text x="124" y="462" font-size="13" fill="currentColor" opacity="0.6">3D coordinates &#183; an X, Y, Z direction or position</text>
    <text x="724" y="452" font-size="13" font-weight="700" text-anchor="end" fill="#c084fc">#C084FC</text>
  </g>

  <!-- Footer tip (Variant B, left rail) -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Socket color tells you the data type &#183; only matching colors connect cleanly.</text>
</svg>
