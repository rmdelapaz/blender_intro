<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="whlTitle whlDesc" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" color="#222">
  <title id="whlTitle">Lift, Gamma, Gain Color Wheels</title>
  <desc id="whlDesc">The three-way color grading model. Lift controls the shadows, Gamma controls the midtones, and Gain controls the highlights. Each is shown as a color wheel: dragging the center dot toward a hue tints that tonal range, and a slider under each wheel raises or lowers its brightness. A common cinematic look pushes Lift toward teal and Gain toward orange.</desc>
  <defs>
    <radialGradient id="hue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#808080"/>
      <stop offset="100%" stop-color="#808080" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .hd{fill:currentColor;font-size:19px;font-weight:700;}
    .sub{fill:#9aa4b2;font-size:11px;}
    .wt{fill:#ffffff;font-size:14px;font-weight:700;}
    .wr{fill:#9aa4b2;font-size:10px;}
    .note{fill:#d4d4d4;font-size:10px;}
  </style>
  <text x="20" y="34" class="hd">Lift &#183; Gamma &#183; Gain</text>
  <text x="20" y="54" class="sub">Three wheels, three tonal ranges. Drag the dot to tint; slide below to brighten or darken that range.</text>

  <!-- LIFT wheel -->
  <g>
    <circle cx="150" cy="180" r="80" fill="#2a2a2a" stroke="#4A9EFF" stroke-width="2"/>
    <circle cx="150" cy="180" r="72" fill="none" stroke="#3a3a3a" stroke-width="1"/>
    <circle cx="120" cy="205" r="7" fill="#1e6a6a" stroke="#fff" stroke-width="1.5"/>
    <line x1="150" y1="180" x2="120" y2="205" stroke="#666" stroke-width="1"/>
    <text x="150" y="150" text-anchor="middle" class="wt">LIFT</text>
    <text x="150" y="285" text-anchor="middle" class="wr">Shadows</text>
    <rect x="90" y="298" width="120" height="8" rx="4" fill="#333"/>
    <circle cx="135" cy="302" r="7" fill="#4A9EFF"/>
  </g>
  <!-- GAMMA wheel -->
  <g>
    <circle cx="380" cy="180" r="80" fill="#2a2a2a" stroke="#F5C242" stroke-width="2"/>
    <circle cx="380" cy="180" r="72" fill="none" stroke="#3a3a3a" stroke-width="1"/>
    <circle cx="380" cy="180" r="7" fill="#808080" stroke="#fff" stroke-width="1.5"/>
    <text x="380" y="150" text-anchor="middle" class="wt">GAMMA</text>
    <text x="380" y="285" text-anchor="middle" class="wr">Midtones</text>
    <rect x="320" y="298" width="120" height="8" rx="4" fill="#333"/>
    <circle cx="380" cy="302" r="7" fill="#F5C242"/>
  </g>
  <!-- GAIN wheel -->
  <g>
    <circle cx="610" cy="180" r="80" fill="#2a2a2a" stroke="#FF6B00" stroke-width="2"/>
    <circle cx="610" cy="180" r="72" fill="none" stroke="#3a3a3a" stroke-width="1"/>
    <circle cx="640" cy="158" r="7" fill="#c96a20" stroke="#fff" stroke-width="1.5"/>
    <line x1="610" y1="180" x2="640" y2="158" stroke="#666" stroke-width="1"/>
    <text x="610" y="150" text-anchor="middle" class="wt">GAIN</text>
    <text x="610" y="285" text-anchor="middle" class="wr">Highlights</text>
    <rect x="550" y="298" width="120" height="8" rx="4" fill="#333"/>
    <circle cx="625" cy="302" r="7" fill="#FF6B00"/>
  </g>

  <!-- caption bar -->
  <rect x="20" y="330" width="720" height="52" rx="7" fill="#1b1b1b" stroke="#B47EE8"/>
  <text x="36" y="352" class="note" fill="#B47EE8" font-weight="700">Classic cinematic look:</text>
  <text x="185" y="352" class="note">push LIFT toward teal, push GAIN toward orange &#8212; cool shadows, warm highlights.</text>
  <text x="36" y="372" class="note">Small moves go a long way. Reset a wheel by double-clicking its center dot.</text>
</svg>
