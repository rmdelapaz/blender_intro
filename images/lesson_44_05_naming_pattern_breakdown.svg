<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" role="img" aria-labelledby="npb-title npb-desc" color="#222" font-family="'Segoe UI',system-ui,-apple-system,sans-serif">
<title id="npb-title">Anatomy of a good object name</title>
<desc id="npb-desc">A single example name broken into its parts: a type prefix, a subject, a descriptor, and a variant number, with each segment colour-coded and explained; a comparison row shows a vague default name against the structured name.</desc>
<text x="430" y="34" fill="currentColor" font-size="22" font-weight="700" text-anchor="middle">Anatomy of a good name</text>
<text x="430" y="58" fill="currentColor" font-size="14" text-anchor="middle" opacity="0.75">Consistent segments make every name sortable, searchable, and self-explaining</text>

<!-- The name, big, segmented -->
<g font-family="'Consolas','SF Mono',monospace" font-size="30" font-weight="700">
<rect x="120" y="86" width="120" height="52" rx="7" fill="#2a2a2a" stroke="#FF6B00" stroke-width="1.8"/>
<text x="180" y="122" fill="#FF6B00" text-anchor="middle">CHR_</text>
<rect x="244" y="86" width="150" height="52" rx="7" fill="#2a2a2a" stroke="#4A9EFF" stroke-width="1.8"/>
<text x="319" y="122" fill="#4A9EFF" text-anchor="middle">Hero</text>
<rect x="398" y="86" width="180" height="52" rx="7" fill="#2a2a2a" stroke="#4ADE80" stroke-width="1.8"/>
<text x="488" y="122" fill="#4ADE80" text-anchor="middle">_Jacket</text>
<rect x="582" y="86" width="120" height="52" rx="7" fill="#2a2a2a" stroke="#B47EE8" stroke-width="1.8"/>
<text x="642" y="122" fill="#B47EE8" text-anchor="middle">_01</text>
</g>

<!-- brackets down -->
<path d="M180 138 V162 M319 138 V162 M488 138 V162 M642 138 V162" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.5"/>

<!-- Four explanation cards -->
<rect x="60" y="170" width="185" height="150" rx="9" fill="#2a2a2a" stroke="#FF6B00" stroke-width="1.4"/>
<text x="152" y="196" fill="#FF6B00" font-size="15" font-weight="700" text-anchor="middle">Type prefix</text>
<text x="152" y="220" fill="#d4d4d4" font-size="12.5" text-anchor="middle">what kind of thing</text>
<text x="152" y="246" fill="#d4d4d4" font-size="11.5" text-anchor="middle" font-family="monospace">CHR_ MAT_ COL_</text>
<text x="152" y="264" fill="#d4d4d4" font-size="11.5" text-anchor="middle" font-family="monospace">LGT_ CAM_ EMP_</text>
<text x="152" y="292" fill="#d4d4d4" font-size="11.5" text-anchor="middle" opacity="0.8">Groups &amp; sorts</text>
<text x="152" y="308" fill="#d4d4d4" font-size="11.5" text-anchor="middle" opacity="0.8">alike items together</text>

<rect x="257" y="170" width="185" height="150" rx="9" fill="#2a2a2a" stroke="#4A9EFF" stroke-width="1.4"/>
<text x="349" y="196" fill="#4A9EFF" font-size="15" font-weight="700" text-anchor="middle">Subject</text>
<text x="349" y="220" fill="#d4d4d4" font-size="12.5" text-anchor="middle">who / what it is</text>
<text x="349" y="246" fill="#d4d4d4" font-size="11.5" text-anchor="middle" font-family="monospace">Hero Wall Table</text>
<text x="349" y="286" fill="#d4d4d4" font-size="11.5" text-anchor="middle" opacity="0.8">The main identity &#8212;</text>
<text x="349" y="302" fill="#d4d4d4" font-size="11.5" text-anchor="middle" opacity="0.8">clear, human-readable</text>

<rect x="454" y="170" width="185" height="150" rx="9" fill="#2a2a2a" stroke="#4ADE80" stroke-width="1.4"/>
<text x="546" y="196" fill="#4ADE80" font-size="15" font-weight="700" text-anchor="middle">Descriptor</text>
<text x="546" y="220" fill="#d4d4d4" font-size="12.5" text-anchor="middle">which part / detail</text>
<text x="546" y="246" fill="#d4d4d4" font-size="11.5" text-anchor="middle" font-family="monospace">_Jacket _Roof</text>
<text x="546" y="286" fill="#d4d4d4" font-size="11.5" text-anchor="middle" opacity="0.8">Optional &#8212; distinguishes</text>
<text x="546" y="302" fill="#d4d4d4" font-size="11.5" text-anchor="middle" opacity="0.8">sub-parts of a subject</text>

<rect x="651" y="170" width="185" height="150" rx="9" fill="#2a2a2a" stroke="#B47EE8" stroke-width="1.4"/>
<text x="743" y="196" fill="#B47EE8" font-size="15" font-weight="700" text-anchor="middle">Variant / number</text>
<text x="743" y="220" fill="#d4d4d4" font-size="12.5" text-anchor="middle">which instance</text>
<text x="743" y="246" fill="#d4d4d4" font-size="11.5" text-anchor="middle" font-family="monospace">_01 _02 _LOD0</text>
<text x="743" y="286" fill="#d4d4d4" font-size="11.5" text-anchor="middle" opacity="0.8">Zero-padded so they</text>
<text x="743" y="302" fill="#d4d4d4" font-size="11.5" text-anchor="middle" opacity="0.8">sort in order</text>

<!-- Comparison row -->
<rect x="60" y="344" width="776" height="76" rx="10" fill="#2a2a2a" stroke="#E63946" stroke-width="1.4"/>
<text x="80" y="370" fill="#E63946" font-size="14" font-weight="700">&#10007; Vague default</text>
<text x="80" y="400" fill="#d4d4d4" font-size="17" font-family="monospace">Cube.024</text>
<text x="360" y="386" fill="currentColor" font-size="22" text-anchor="middle" opacity="0.6">&#8594;</text>
<text x="470" y="370" fill="#4ADE80" font-size="14" font-weight="700">&#10003; Structured</text>
<text x="470" y="400" fill="#d4d4d4" font-size="17" font-family="monospace">CHR_Hero_Jacket_01</text>

<!-- Principles footer -->
<rect x="60" y="444" width="776" height="96" rx="10" fill="#2a2a2a" stroke="currentColor" stroke-width="1" opacity="0.96"/>
<text x="80" y="470" fill="#d4d4d4" font-size="14" font-weight="700">Core principles</text>
<g font-size="12.5" fill="#d4d4d4">
<text x="80" y="494"><tspan fill="#4ADE80" font-weight="700">Prefix by type</tspan> so related data groups when sorted alphabetically.</text>
<text x="80" y="514"><tspan fill="#4ADE80" font-weight="700">No spaces</tspan> &#8212; use underscores; keep casing consistent (PascalCase subjects here).</text>
<text x="80" y="533"><tspan fill="#4ADE80" font-weight="700">Zero-pad numbers</tspan> (_01 not _1) and name as you create, never &#8220;later&#8221;.</text>
</g>
</svg>
