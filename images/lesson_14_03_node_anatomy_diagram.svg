<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="na-title na-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="na-title">Anatomy of a Blender shader node</title>
  <desc id="na-desc">A Principled BSDF node with its parts labeled: the node header at top, the column of input sockets on the left, the single BSDF output socket on the right, the interior parameter fields and sliders, and the color-coded sockets whose hue indicates the data type they accept.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Anatomy of a Shader Node</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">The Principled BSDF, part by part</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Node body: a stylised Principled BSDF.  x 250..510, header y 150..182, body to y 470 -->
  <!-- Node header -->
  <rect x="250" y="150" width="260" height="32" rx="6" fill="#2c4a33"/>
  <rect x="250" y="166" width="260" height="16" fill="#2c4a33"/>
  <text x="266" y="172" font-size="14" font-weight="600" fill="#ffffff">Principled BSDF</text>

  <!-- Node body -->
  <rect x="250" y="178" width="260" height="292" rx="6" fill="#3a3a3a"/>
  <rect x="250" y="178" width="260" height="8" fill="#3a3a3a"/>

  <!-- Output socket (right) BSDF: green shader -->
  <text x="498" y="206" font-size="13" fill="#e6e6e6" text-anchor="end">BSDF</text>
  <circle cx="510" cy="202" r="7" fill="#63C763" stroke="#0f1a14" stroke-width="1"/>

  <!-- Input rows: socket dot at x=250 edge, label inside.  Socket hue = data type. -->
  <!-- Base Color : yellow color socket + colour swatch field -->
  <circle cx="250" cy="232" r="6" fill="#C7C729" stroke="#0f1a14" stroke-width="1"/>
  <text x="266" y="237" font-size="13" fill="#e6e6e6">Base Color</text>
  <rect x="372" y="224" width="126" height="16" rx="3" fill="#d9d4c4"/>

  <!-- Metallic : grey value socket + slider field -->
  <circle cx="250" cy="262" r="6" fill="#A1A1A1" stroke="#0f1a14" stroke-width="1"/>
  <rect x="328" y="254" width="170" height="16" rx="3" fill="#545454"/>
  <text x="338" y="267" font-size="12" fill="#e6e6e6">Metallic</text>
  <text x="490" y="267" font-size="12" fill="#e6e6e6" text-anchor="end">0.000</text>

  <!-- Roughness : grey value socket + slider field -->
  <circle cx="250" cy="292" r="6" fill="#A1A1A1" stroke="#0f1a14" stroke-width="1"/>
  <rect x="328" y="284" width="170" height="16" rx="3" fill="#545454"/>
  <text x="338" y="297" font-size="12" fill="#e6e6e6">Roughness</text>
  <text x="490" y="297" font-size="12" fill="#e6e6e6" text-anchor="end">0.500</text>

  <!-- IOR : grey value socket + slider field -->
  <circle cx="250" cy="322" r="6" fill="#A1A1A1" stroke="#0f1a14" stroke-width="1"/>
  <rect x="328" y="314" width="170" height="16" rx="3" fill="#545454"/>
  <text x="338" y="327" font-size="12" fill="#e6e6e6">IOR</text>
  <text x="490" y="327" font-size="12" fill="#e6e6e6" text-anchor="end">1.450</text>

  <!-- Normal : blue vector socket -->
  <circle cx="250" cy="352" r="6" fill="#6363C7" stroke="#0f1a14" stroke-width="1"/>
  <text x="266" y="357" font-size="13" fill="#e6e6e6">Normal</text>

  <!-- collapsed parameter group rows (sliders) to fill the interior -->
  <rect x="266" y="378" width="232" height="14" rx="3" fill="#4a4a4a"/>
  <text x="276" y="389" font-size="11" fill="#cfcfcf">Subsurface</text>
  <rect x="266" y="398" width="232" height="14" rx="3" fill="#4a4a4a"/>
  <text x="276" y="409" font-size="11" fill="#cfcfcf">Specular</text>
  <rect x="266" y="418" width="232" height="14" rx="3" fill="#4a4a4a"/>
  <text x="276" y="429" font-size="11" fill="#cfcfcf">Transmission</text>
  <rect x="266" y="438" width="232" height="14" rx="3" fill="#4a4a4a"/>
  <text x="276" y="449" font-size="11" fill="#cfcfcf">Emission</text>

  <!-- ===== Callouts ===== -->
  <g stroke="#FF6B00" stroke-width="2" fill="none" stroke-linecap="round">
    <!-- Node Header leader -->
    <line x1="240" y1="166" x2="150" y2="150"/>
    <!-- Input sockets leader -->
    <line x1="240" y1="292" x2="150" y2="300"/>
    <!-- Output socket leader -->
    <line x1="520" y1="202" x2="620" y2="190"/>
    <!-- Parameters leader -->
    <line x1="520" y1="408" x2="612" y2="408"/>
    <!-- Socket colours leader (to Base Color yellow dot) -->
    <line x1="240" y1="232" x2="150" y2="232"/>
  </g>
  <g fill="#FF6B00">
    <circle cx="150" cy="150" r="4"/>
    <circle cx="150" cy="300" r="4"/>
    <circle cx="620" cy="190" r="4"/>
    <circle cx="612" cy="408" r="4"/>
    <circle cx="150" cy="232" r="4"/>
  </g>

  <!-- Callout labels -->
  <text x="142" y="142" font-size="13" font-weight="600" fill="currentColor" text-anchor="end">Node Header</text>
  <text x="142" y="296" font-size="13" font-weight="600" fill="currentColor" text-anchor="end">Input Sockets</text>
  <text x="142" y="308" font-size="11" fill="currentColor" opacity="0.6" text-anchor="end">(left side)</text>
  <text x="630" y="186" font-size="13" font-weight="600" fill="currentColor">Output Socket</text>
  <text x="630" y="200" font-size="11" fill="currentColor" opacity="0.6">(right side)</text>
  <text x="622" y="404" font-size="13" font-weight="600" fill="currentColor">Parameters</text>
  <text x="622" y="418" font-size="11" fill="currentColor" opacity="0.6">&amp; settings</text>
  <text x="142" y="224" font-size="13" font-weight="600" fill="currentColor" text-anchor="end">Socket Colors</text>
  <text x="142" y="248" font-size="11" fill="currentColor" opacity="0.6" text-anchor="end">show data type</text>

  <!-- ===== Socket-colour legend ===== -->
  <text x="40" y="512" font-size="18" font-weight="600" fill="currentColor">Socket color = data type</text>
  <g font-size="13" fill="currentColor">
    <circle cx="56" cy="538" r="8" fill="#63C763" stroke="#0f1a14" stroke-width="1"/>
    <text x="74" y="543">Green: Shader</text>
    <circle cx="236" cy="538" r="8" fill="#C7C729" stroke="#0f1a14" stroke-width="1"/>
    <text x="254" y="543">Yellow: Color</text>
    <circle cx="416" cy="538" r="8" fill="#A1A1A1" stroke="#0f1a14" stroke-width="1"/>
    <text x="434" y="543">Grey: Value</text>
    <circle cx="596" cy="538" r="8" fill="#6363C7" stroke="#0f1a14" stroke-width="1"/>
    <text x="614" y="543">Blue: Vector</text>
  </g>

  <!-- Footer tip (Variant B, left rail) -->
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> You can only connect sockets of matching color. Green goes to green, yellow to yellow.
  </text>
</svg>
