<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="cif-title cif-desc" color="#222" font-family="'Segoe UI',system-ui,-apple-system,sans-serif">
<title id="cif-title">The Compositor interface layout</title>
<desc id="cif-desc">An annotated map of Blender's Compositing workspace showing four regions: the node editor main area, the backdrop preview behind the nodes, the header bar across the top, and the N-panel sidebar on the right.</desc>

<!-- ===== window frame ===== -->
<rect x="20" y="70" width="760" height="500" rx="8" fill="none" stroke="currentColor" stroke-width="2" opacity="0.5"/>

<!-- ===== 1. HEADER BAR ===== -->
<rect x="20" y="70" width="760" height="34" rx="8" fill="currentColor" opacity="0.08"/>
<rect x="20" y="98" width="760" height="6" fill="currentColor" opacity="0.08"/>
<g font-size="12" fill="currentColor">
  <rect x="34" y="79" width="70" height="18" rx="3" fill="#4A9EFF" opacity="0.18"/>
  <text x="69" y="92" text-anchor="middle" font-weight="600" fill="#4A9EFF">Compositor</text>
  <rect x="116" y="79" width="82" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="1" opacity="0.6"/>
  <text x="157" y="92" text-anchor="middle">Use Nodes</text>
  <rect x="210" y="79" width="76" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="1" opacity="0.6"/>
  <text x="248" y="92" text-anchor="middle">Backdrop</text>
  <text x="320" y="92">View</text>
  <text x="372" y="92">Select</text>
  <text x="428" y="92">Add</text>
  <text x="474" y="92">Node</text>
</g>

<!-- ===== 2. BACKDROP (preview behind nodes) ===== -->
<rect x="40" y="120" width="470" height="330" rx="5" fill="#4A9EFF" opacity="0.06"/>
<rect x="40" y="120" width="470" height="330" rx="5" fill="none" stroke="#4A9EFF" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.7"/>
<!-- faux composited image hint inside backdrop -->
<circle cx="180" cy="250" r="46" fill="currentColor" opacity="0.12"/>
<rect x="250" y="300" width="150" height="90" rx="4" fill="currentColor" opacity="0.1"/>
<text x="52" y="140" font-size="11" fill="#4A9EFF" font-weight="600" opacity="0.9">backdrop preview</text>

<!-- ===== 3. NODE EDITOR nodes on top of backdrop ===== -->
<!-- Render Layers node -->
<g>
  <rect x="70" y="180" width="120" height="66" rx="5" fill="currentColor" opacity="0.1"/>
  <rect x="70" y="180" width="120" height="18" rx="5" fill="#4ADE80" opacity="0.85"/>
  <rect x="70" y="189" width="120" height="9" fill="#4ADE80" opacity="0.85"/>
  <text x="130" y="193" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0c2a17">Render Layers</text>
  <text x="130" y="216" text-anchor="middle" font-size="9.5" fill="currentColor">Image</text>
  <text x="130" y="232" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.7">Alpha / Z</text>
  <circle cx="190" cy="212" r="3.5" fill="#F5C242"/>
</g>
<!-- RGB Curves node -->
<g>
  <rect x="270" y="200" width="120" height="66" rx="5" fill="currentColor" opacity="0.1"/>
  <rect x="270" y="200" width="120" height="18" rx="5" fill="#B47EE8" opacity="0.85"/>
  <rect x="270" y="209" width="120" height="9" fill="#B47EE8" opacity="0.85"/>
  <text x="330" y="213" text-anchor="middle" font-size="10.5" font-weight="700" fill="#22103a">RGB Curves</text>
  <circle cx="270" cy="234" r="3.5" fill="#F5C242"/>
  <circle cx="390" cy="234" r="3.5" fill="#F5C242"/>
  <path d="M284 254 q22 -14 44 -22 t28 -6" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.7"/>
</g>
<!-- Composite node -->
<g>
  <rect x="410" y="330" width="86" height="48" rx="5" fill="currentColor" opacity="0.1"/>
  <rect x="410" y="330" width="86" height="18" rx="5" fill="#FF6B00"/>
  <rect x="410" y="339" width="86" height="9" fill="#FF6B00"/>
  <text x="453" y="343" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">Composite</text>
  <text x="453" y="366" text-anchor="middle" font-size="9.5" fill="currentColor">Image</text>
  <circle cx="410" cy="360" r="3.5" fill="#F5C242"/>
</g>
<!-- wires -->
<path d="M190 212 C230 212 232 234 270 234" fill="none" stroke="#FF6B00" stroke-width="2"/>
<path d="M390 234 C420 234 410 360 410 360" fill="none" stroke="#FF6B00" stroke-width="2"/>

<!-- node-area label -->
<text x="88" y="440" font-size="11" fill="currentColor" font-weight="600" opacity="0.75">node editor (main area)</text>

<!-- ===== 4. N-PANEL sidebar ===== -->
<rect x="524" y="120" width="240" height="330" rx="5" fill="currentColor" opacity="0.06"/>
<rect x="524" y="120" width="240" height="330" rx="5" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.5"/>
<g font-size="11" fill="currentColor">
  <rect x="524" y="120" width="240" height="24" rx="5" fill="#F5C242" opacity="0.22"/>
  <text x="536" y="136" font-weight="700" fill="#8a6410">N-panel &#183; sidebar</text>
  <rect x="536" y="156" width="52" height="16" rx="3" fill="#F5C242" opacity="0.3"/>
  <text x="562" y="168" text-anchor="middle" font-size="10" font-weight="600">Item</text>
  <text x="600" y="168" font-size="10" opacity="0.7">Tool</text>
  <text x="640" y="168" font-size="10" opacity="0.7">View</text>
  <text x="536" y="196" opacity="0.85">Selected node:</text>
  <text x="536" y="214" font-weight="600" fill="#B47EE8">RGB Curves</text>
  <line x1="536" y1="226" x2="752" y2="226" stroke="currentColor" stroke-width="1" opacity="0.25"/>
  <text x="536" y="248" opacity="0.7">Location  X / Y</text>
  <text x="536" y="270" opacity="0.7">Dimensions</text>
  <text x="536" y="292" opacity="0.7">Label</text>
  <line x1="536" y1="304" x2="752" y2="304" stroke="currentColor" stroke-width="1" opacity="0.25"/>
  <text x="536" y="326" opacity="0.85">Detailed node settings</text>
  <text x="536" y="344" opacity="0.7">appear here for the</text>
  <text x="536" y="362" opacity="0.7">active node.</text>
  <text x="536" y="400" font-size="10" opacity="0.6">Toggle with N</text>
</g>

<!-- ===== number badges ===== -->
<g font-size="13" font-weight="700">
  <circle cx="40" cy="87" r="11" fill="#FF6B00"/><text x="40" y="92" text-anchor="middle" fill="#fff">1</text>
  <circle cx="58" cy="138" r="11" fill="#4A9EFF"/><text x="58" y="143" text-anchor="middle" fill="#fff">2</text>
  <circle cx="88" cy="168" r="11" fill="#4ADE80"/><text x="88" y="173" text-anchor="middle" fill="#0c2a17">3</text>
  <circle cx="544" cy="132" r="11" fill="#F5C242"/><text x="544" y="137" text-anchor="middle" fill="#8a6410">4</text>
</g>

<!-- ===== legend ===== -->
<g font-size="12" fill="currentColor">
  <text x="20" y="500" font-weight="700">Four regions of the Compositing workspace</text>
  <circle cx="30" cy="522" r="7" fill="#FF6B00"/><text x="44" y="526"><tspan font-weight="600">1 Header bar</tspan> &#183; Use Nodes, Backdrop, Add menu</text>
  <circle cx="30" cy="544" r="7" fill="#4A9EFF"/><text x="44" y="548"><tspan font-weight="600">2 Backdrop</tspan> &#183; live composited image behind the nodes</text>
  <circle cx="410" cy="522" r="7" fill="#4ADE80"/><text x="424" y="526"><tspan font-weight="600">3 Node editor</tspan> &#183; build the tree here</text>
  <circle cx="410" cy="544" r="7" fill="#F5C242"/><text x="424" y="548"><tspan font-weight="600">4 N-panel</tspan> &#183; settings for the selected node</text>
</g>
</svg>
