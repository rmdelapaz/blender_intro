<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="mo-title mo-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="mo-title">Camera movement overview, taxonomy card</title>
  <desc id="mo-desc">An overview of the classic camera moves grouped by what the camera does. Position changes move the camera through space: dolly forward and back, track left and right, crane up and down. Rotation changes rotate the camera in place: pan horizontally, tilt vertically, roll around the lens axis. The combined orbit move arcs the camera in a circle around the subject.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">CAMERA MOVES</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">The classic moves, grouped by what the camera does</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Reusable arrowhead -->
  <defs>
    <marker id="mo-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#FF6B00"/>
    </marker>
  </defs>

  <!-- ============================================================ -->
  <!-- BAND 1: POSITION CHANGES (move through space)                -->
  <!-- ============================================================ -->
  <text x="40" y="140" font-size="14" font-weight="700" fill="currentColor">Position changes</text>
  <text x="178" y="140" font-size="13" fill="currentColor" opacity="0.6">move the camera through space</text>
  <line x1="40" y1="150" x2="760" y2="150" stroke="currentColor" stroke-width="1" opacity="0.1"/>

  <!-- Cell 1: DOLLY (camera moves toward subject; subject ref + camera + straight arrow toward it) -->
  <g>
    <rect x="116" y="170" width="18" height="16" rx="2" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1.5"/>
    <rect x="110" y="216" width="30" height="20" rx="3" fill="#FF6B00"/>
    <rect x="119" y="209" width="12" height="9" rx="1.5" fill="#FF6B00"/>
    <line x1="125" y1="208" x2="125" y2="192" stroke="#FF6B00" stroke-width="2.5" stroke-linecap="round" marker-end="url(#mo-arrow)"/>
    <text x="160" y="196" font-size="15" font-weight="600" fill="currentColor">Dolly</text>
    <text x="160" y="216" font-size="13" fill="currentColor" opacity="0.6">Forward / back</text>
  </g>

  <!-- Cell 2: TRACK (camera moves sideways; camera + horizontal double-arrow BELOW it, clear of body) -->
  <g>
    <rect x="350" y="200" width="30" height="20" rx="3" fill="#FF6B00"/>
    <rect x="359" y="193" width="12" height="9" rx="1.5" fill="#FF6B00"/>
    <line x1="338" y1="232" x2="392" y2="232" stroke="#FF6B00" stroke-width="2.5" stroke-linecap="round" marker-start="url(#mo-arrow)" marker-end="url(#mo-arrow)"/>
    <text x="400" y="196" font-size="15" font-weight="600" fill="currentColor">Track</text>
    <text x="400" y="216" font-size="13" fill="currentColor" opacity="0.6">Left / right</text>
  </g>

  <!-- Cell 3: CRANE (camera moves vertically; camera + vertical double-arrow beside it) -->
  <g>
    <rect x="590" y="206" width="30" height="20" rx="3" fill="#FF6B00"/>
    <rect x="599" y="199" width="12" height="9" rx="1.5" fill="#FF6B00"/>
    <line x1="638" y1="196" x2="638" y2="236" stroke="#FF6B00" stroke-width="2.5" stroke-linecap="round" marker-start="url(#mo-arrow)" marker-end="url(#mo-arrow)"/>
    <text x="656" y="196" font-size="15" font-weight="600" fill="currentColor">Crane</text>
    <text x="656" y="216" font-size="13" fill="currentColor" opacity="0.6">Up / down</text>
  </g>

  <!-- ============================================================ -->
  <!-- BAND 2: ROTATION CHANGES (rotate in place)                   -->
  <!-- ============================================================ -->
  <text x="40" y="304" font-size="14" font-weight="700" fill="currentColor">Rotation changes</text>
  <text x="180" y="304" font-size="13" fill="currentColor" opacity="0.6">rotate the camera in place</text>
  <line x1="40" y1="314" x2="760" y2="314" stroke="currentColor" stroke-width="1" opacity="0.1"/>

  <!-- Cell 4: PAN (rotate horizontal; fixed camera + horizontal sweep arc above) -->
  <g>
    <rect x="110" y="360" width="30" height="20" rx="3" fill="#FF6B00"/>
    <rect x="119" y="353" width="12" height="9" rx="1.5" fill="#FF6B00"/>
    <path d="M 102 350 A 32 16 0 0 1 148 350" fill="none" stroke="#FF6B00" stroke-width="2.5" stroke-linecap="round" marker-end="url(#mo-arrow)"/>
    <text x="162" y="360" font-size="15" font-weight="600" fill="currentColor">Pan</text>
    <text x="162" y="380" font-size="13" fill="currentColor" opacity="0.6">Horizontal rotation</text>
  </g>

  <!-- Cell 5: TILT (rotate vertical; fixed camera + vertical sweep arc to the right side) -->
  <g>
    <rect x="350" y="360" width="30" height="20" rx="3" fill="#FF6B00"/>
    <rect x="359" y="353" width="12" height="9" rx="1.5" fill="#FF6B00"/>
    <path d="M 398 392 A 16 32 0 0 1 398 348" fill="none" stroke="#FF6B00" stroke-width="2.5" stroke-linecap="round" marker-end="url(#mo-arrow)"/>
    <text x="406" y="360" font-size="15" font-weight="600" fill="currentColor">Tilt</text>
    <text x="406" y="380" font-size="13" fill="currentColor" opacity="0.6">Vertical rotation</text>
  </g>

  <!-- Cell 6: ROLL (rotate around lens axis; lens-on camera front + circular roll arrow) -->
  <g>
    <circle cx="605" cy="370" r="13" fill="#FF6B00" fill-opacity="0.18" stroke="#FF6B00" stroke-width="2"/>
    <circle cx="605" cy="370" r="4" fill="#FF6B00"/>
    <path d="M 605 347 A 23 23 0 1 1 583 373" fill="none" stroke="#FF6B00" stroke-width="2.5" stroke-linecap="round" marker-end="url(#mo-arrow)"/>
    <text x="656" y="360" font-size="15" font-weight="600" fill="currentColor">Roll</text>
    <text x="656" y="380" font-size="13" fill="currentColor" opacity="0.6">Axis rotation</text>
  </g>

  <!-- ============================================================ -->
  <!-- BAND 3: COMBINED                                             -->
  <!-- ============================================================ -->
  <text x="40" y="464" font-size="14" font-weight="700" fill="currentColor">Combined</text>
  <text x="138" y="464" font-size="13" fill="currentColor" opacity="0.6">position + rotation together</text>
  <line x1="40" y1="474" x2="760" y2="474" stroke="currentColor" stroke-width="1" opacity="0.1"/>

  <!-- Cell 7: ORBIT (arc around subject; subject center + camera on dashed circle + arc travel arrow) -->
  <g>
    <circle cx="125" cy="544" r="34" fill="none" stroke="currentColor" stroke-width="1.25" stroke-opacity="0.3" stroke-dasharray="4 5"/>
    <rect x="116" y="535" width="18" height="16" rx="2" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1.5"/>
    <rect x="74" y="535" width="22" height="16" rx="3" fill="#FF6B00"/>
    <rect x="96" y="539" width="9" height="8" rx="1.5" fill="#FF6B00"/>
    <path d="M 95 572 A 40 40 0 0 0 160 562" fill="none" stroke="#FF6B00" stroke-width="2.5" stroke-linecap="round" marker-end="url(#mo-arrow)"/>
    <text x="186" y="538" font-size="15" font-weight="600" fill="currentColor">Orbit</text>
    <text x="186" y="558" font-size="13" fill="currentColor" opacity="0.6">Circle around subject</text>
  </g>

  <!-- ===== Footer tip (Variant B left rail, dense 680 variant y=641) ===== -->
  <rect x="40" y="641" width="720" height="34" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Pan and tilt rotate the camera in place &#183; dolly, track, crane and orbit move it through space.</text>
</svg>
