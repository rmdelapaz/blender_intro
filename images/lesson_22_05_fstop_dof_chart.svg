<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="fc-title fc-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="fc-title">F-stop to depth of field reference chart</title>
  <desc id="fc-desc">A reference table of seven common f-stops from f/1.4 to f/16. For each row the table shows the f-stop, a small aperture glyph that shrinks as the f-number rises, a depth of field bar that grows longer as the f-number rises, a typical use, and the look or feel it produces. Wide apertures such as f/1.4 and f/2.8 give a short depth of field bar and suit portraits; middle apertures such as f/4 to f/8 give a medium bar for general work; narrow apertures such as f/11 and f/16 give a long bar for landscapes.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">F-stop to depth of field</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Common apertures, the depth of field they give, and where each one fits</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Column headers (y=138). Columns: F-stop 40-120 | Aperture 120-200 | DoF depth 200-430 | Typical use 440-600 | Look 610-760 -->
  <g font-size="12" font-weight="700" fill="currentColor" opacity="0.7">
    <text x="50" y="150">F-STOP</text>
    <text x="130" y="150">APERTURE</text>
    <text x="210" y="150">DEPTH OF FIELD</text>
    <text x="450" y="150">TYPICAL USE</text>
    <text x="620" y="150">LOOK / FEEL</text>
  </g>
  <line x1="40" y1="162" x2="760" y2="162" stroke="currentColor" stroke-width="1" opacity="0.2"/>

  <!-- Row band height 64, first row top y=170. Rows centered at y=202,266,330,394,458,522,586 -->
  <!-- zebra tint on alternate rows via currentColor 0.04 -->
  <rect x="40" y="234" width="720" height="64" fill="currentColor" opacity="0.04"/>
  <rect x="40" y="362" width="720" height="64" fill="currentColor" opacity="0.04"/>
  <rect x="40" y="490" width="720" height="64" fill="currentColor" opacity="0.04"/>

  <!-- Helper geometry per row:
       aperture glyph center x=160; outer r=18 currentColor 0.85; opening color-keyed
       DoF bar: x start 210, max width 220 (to x=430); height 12, rounded; color-keyed -->

  <!-- Row 1: f/1.4 -->
  <g>
    <text x="50" y="207" font-size="16" font-weight="700" fill="currentColor">f/1.4</text>
    <circle cx="160" cy="202" r="18" fill="currentColor" opacity="0.85"/>
    <circle cx="160" cy="202" r="16" fill="#4ADE80"/>
    <rect x="210" y="196" width="34" height="12" rx="6" fill="#4ADE80"/>
    <text x="450" y="207" font-size="13" fill="currentColor">Portrait, close subject</text>
    <text x="620" y="207" font-size="13" fill="currentColor" opacity="0.75">Dreamy, isolated</text>
  </g>

  <!-- Row 2: f/2.8 -->
  <g>
    <text x="50" y="271" font-size="16" font-weight="700" fill="currentColor">f/2.8</text>
    <circle cx="160" cy="266" r="18" fill="currentColor" opacity="0.85"/>
    <circle cx="160" cy="266" r="12" fill="#4ADE80"/>
    <rect x="210" y="260" width="64" height="12" rx="6" fill="#4ADE80"/>
    <text x="450" y="271" font-size="13" fill="currentColor">Portrait, low light</text>
    <text x="620" y="271" font-size="13" fill="currentColor" opacity="0.75">Soft background</text>
  </g>

  <!-- Row 3: f/4 -->
  <g>
    <text x="50" y="335" font-size="16" font-weight="700" fill="currentColor">f/4</text>
    <circle cx="160" cy="330" r="18" fill="currentColor" opacity="0.85"/>
    <circle cx="160" cy="330" r="9" fill="#F5C242"/>
    <rect x="210" y="324" width="100" height="12" rx="6" fill="#F5C242"/>
    <text x="450" y="335" font-size="13" fill="currentColor">Product, small groups</text>
    <text x="620" y="335" font-size="13" fill="currentColor" opacity="0.75">Balanced</text>
  </g>

  <!-- Row 4: f/5.6 -->
  <g>
    <text x="50" y="399" font-size="16" font-weight="700" fill="currentColor">f/5.6</text>
    <circle cx="160" cy="394" r="18" fill="currentColor" opacity="0.85"/>
    <circle cx="160" cy="394" r="7" fill="#F5C242"/>
    <rect x="210" y="388" width="130" height="12" rx="6" fill="#F5C242"/>
    <text x="450" y="399" font-size="13" fill="currentColor">General, everyday</text>
    <text x="620" y="399" font-size="13" fill="currentColor" opacity="0.75">Safe, sharp</text>
  </g>

  <!-- Row 5: f/8 -->
  <g>
    <text x="50" y="463" font-size="16" font-weight="700" fill="currentColor">f/8</text>
    <circle cx="160" cy="458" r="18" fill="currentColor" opacity="0.85"/>
    <circle cx="160" cy="458" r="5" fill="#FF6B00"/>
    <rect x="210" y="452" width="160" height="12" rx="6" fill="#FF6B00"/>
    <text x="450" y="463" font-size="13" fill="currentColor">Architecture, interiors</text>
    <text x="620" y="463" font-size="13" fill="currentColor" opacity="0.75">Clean, even</text>
  </g>

  <!-- Row 6: f/11 -->
  <g>
    <text x="50" y="527" font-size="16" font-weight="700" fill="currentColor">f/11</text>
    <circle cx="160" cy="522" r="18" fill="currentColor" opacity="0.85"/>
    <circle cx="160" cy="522" r="4" fill="#FF6B00"/>
    <rect x="210" y="516" width="190" height="12" rx="6" fill="#FF6B00"/>
    <text x="450" y="527" font-size="13" fill="currentColor">Landscape, wide scenes</text>
    <text x="620" y="527" font-size="13" fill="currentColor" opacity="0.75">Front to back</text>
  </g>

  <!-- Row 7: f/16 -->
  <g>
    <text x="50" y="591" font-size="16" font-weight="700" fill="currentColor">f/16</text>
    <circle cx="160" cy="586" r="18" fill="currentColor" opacity="0.85"/>
    <circle cx="160" cy="586" r="3" fill="#E63946"/>
    <rect x="210" y="580" width="220" height="12" rx="6" fill="#E63946"/>
    <text x="450" y="591" font-size="13" fill="currentColor">Landscape, max sharp</text>
    <text x="620" y="591" font-size="13" fill="currentColor" opacity="0.75">Everything sharp</text>
  </g>

  <line x1="40" y1="618" x2="760" y2="618" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Footer tip callout (Variant B, left rail), dense variant y=641 -->
  <rect x="40" y="641" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Focal length and subject distance shift these too, so read the bars as a relative guide, not fixed values.
  </text>
</svg>
