<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="fp-title fp-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="fp-title">Focus distance and the focal plane</title>
  <desc id="fp-desc">Top-down diagram. A camera sits at the left. The focus distance runs from the camera to a vertical focal plane line where the scene is perfectly sharp. A depth of field band of acceptable sharpness surrounds the focal plane, extending roughly one third in front of it and two thirds behind it. Three sample objects show the result: a near object in front of the band is blurred, an object on the focal plane is sharp, and a far object behind the band is blurred.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Focus distance and the focal plane</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Top-down view: where the scene is sharp, and how far the sharpness reaches</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ============ Scene region: y 140 .. 430, camera at left ============ -->

  <!-- Depth of field band (acceptable sharpness): 1/3 in front of plane, 2/3 behind -->
  <!-- focal plane at x=470; band from x=380 (near limit) to x=650 (far limit) -->
  <rect x="380" y="150" width="270" height="250" fill="#4ADE80" opacity="0.12"/>
  <line x1="380" y1="150" x2="380" y2="400" stroke="#4ADE80" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.8"/>
  <line x1="650" y1="150" x2="650" y2="400" stroke="#4ADE80" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.8"/>
  <text x="515" y="172" text-anchor="middle" font-size="13" font-weight="600" fill="#4ADE80">Depth of Field</text>
  <text x="515" y="190" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">acceptable sharpness</text>

  <!-- Focal plane line (sharp) -->
  <line x1="470" y1="142" x2="470" y2="408" stroke="#FF6B00" stroke-width="3"/>
  <text x="470" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#FF6B00">Focal plane</text>
  <text x="470" y="426" text-anchor="middle" font-size="12" fill="#FF6B00" opacity="0.85">perfectly sharp</text>

  <!-- Camera (left), simple top-down body + lens snout pointing right -->
  <g>
    <rect x="92" y="258" width="48" height="44" rx="4" fill="currentColor" opacity="0.85"/>
    <path d="M 140 268 L 166 258 L 166 302 L 140 292 Z" fill="currentColor" opacity="0.85"/>
    <text x="118" y="326" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Camera</text>
  </g>

  <!-- Optical axis from lens to focal plane and beyond -->
  <line x1="166" y1="280" x2="690" y2="280" stroke="currentColor" stroke-width="1" opacity="0.3"/>

  <!-- Focus distance dimension arrow: camera lens (x=166) to focal plane (x=470) -->
  <g stroke="#4A9EFF" stroke-width="2" fill="#4A9EFF">
    <line x1="166" y1="230" x2="470" y2="230"/>
    <path d="M 166 230 L 176 225 L 176 235 Z"/>
    <path d="M 470 230 L 460 225 L 460 235 Z"/>
    <line x1="166" y1="222" x2="166" y2="238" stroke-width="1.5"/>
    <line x1="470" y1="222" x2="470" y2="238" stroke-width="1.5"/>
  </g>
  <text x="318" y="220" text-anchor="middle" font-size="13" font-weight="600" fill="#4A9EFF">Focus distance</text>

  <!-- Sample objects on the optical axis -->
  <!-- Near object (in front of band, blurred) at x=300 -->
  <g>
    <circle cx="300" cy="280" r="16" fill="none" stroke="#E63946" stroke-width="6" opacity="0.35"/>
    <circle cx="300" cy="280" r="11" fill="none" stroke="#E63946" stroke-width="3" opacity="0.55"/>
    <text x="300" y="338" text-anchor="middle" font-size="12" font-weight="600" fill="#E63946">Too near</text>
    <text x="300" y="354" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.6">blurred</text>
  </g>
  <!-- On-plane object (sharp) at x=470 -->
  <g>
    <circle cx="470" cy="280" r="13" fill="#FF6B00"/>
    <text x="470" y="338" text-anchor="middle" font-size="12" font-weight="700" fill="#FF6B00">In focus</text>
    <text x="470" y="354" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.6">sharp</text>
  </g>
  <!-- Far object (behind band, blurred) at x=700 -->
  <g>
    <circle cx="700" cy="280" r="16" fill="none" stroke="#E63946" stroke-width="6" opacity="0.35"/>
    <circle cx="700" cy="280" r="11" fill="none" stroke="#E63946" stroke-width="3" opacity="0.55"/>
    <text x="700" y="338" text-anchor="middle" font-size="12" font-weight="600" fill="#E63946">Too far</text>
    <text x="700" y="354" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.6">blurred</text>
  </g>

  <!-- Front / behind split note under the band -->
  <g font-size="11" fill="currentColor" opacity="0.6">
    <text x="425" y="396" text-anchor="middle">~1/3 in front</text>
    <text x="560" y="396" text-anchor="middle">~2/3 behind</text>
  </g>

  <!-- ============ Key takeaway row ============ -->
  <text x="40" y="468" font-size="13" fill="currentColor" opacity="0.75">The focal plane is set by the focus distance. Only objects within the depth of field band render acceptably sharp; everything outside it falls off into blur.</text>

  <!-- Footer tip callout (Variant B, left rail) -->
  <rect x="40" y="506" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> The band is not centered on the plane. It reaches farther behind the focus point than in front, so focus about a third into the depth you want sharp.
  </text>
</svg>
