<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="ac-title ac-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="ac-title">Natural arc motion versus mechanical straight-line motion</title>
  <desc id="ac-desc">Two stacked tracks compare the same movement between identical start and end points. The top track, labelled Natural and marked with a check, routes the motion through a smooth curved arc with orange ghost positions following the curve. The bottom track, labelled Mechanical and marked with a cross, connects the same two points with a stiff straight line. Routing motion through an arc is what separates lifelike animation from robotic movement.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">ARCS VS STRAIGHT LINES</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">The same motion, routed two different ways</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ============ TRACK 1: NATURAL (curved arc) ============ -->
  <text x="40" y="150" font-size="18" font-weight="600" fill="currentColor">Natural motion</text>

  <!-- name pill + check glyph -->
  <rect x="210" y="135" width="118" height="24" rx="12" fill="#4ADE80" fill-opacity="0.15"
        stroke="#4ADE80" stroke-opacity="0.55"/>
  <path d="M 224 147 l 5 6 l 10 -12" fill="none" stroke="#4ADE80" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>
  <text x="248" y="151" font-size="12" font-weight="600" fill="currentColor">NATURAL</text>

  <!-- endpoints (shared geometry, same x as mechanical track) -->
  <!-- curved arc path -->
  <path d="M 90 260 Q 400 150 710 260" fill="none" stroke="currentColor" stroke-width="2"
        stroke-dasharray="7 7" opacity="0.55"/>
  <!-- ghost positions following the curve -->
  <circle cx="90" cy="260" r="10" fill="#FF6B00" opacity="0.35"/>
  <circle cx="245" cy="207" r="10" fill="#FF6B00" opacity="0.55"/>
  <circle cx="400" cy="188" r="10" fill="#FF6B00" opacity="0.7"/>
  <circle cx="555" cy="207" r="10" fill="#FF6B00" opacity="0.85"/>
  <circle cx="710" cy="260" r="10" fill="#FF6B00"/>
  <!-- endpoint labels -->
  <text x="90" y="288" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">A</text>
  <text x="710" y="288" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">B</text>

  <!-- divider -->
  <line x1="40" y1="320" x2="760" y2="320" stroke="currentColor" stroke-width="1" opacity="0.12"/>

  <!-- ============ TRACK 2: MECHANICAL (straight line) ============ -->
  <text x="40" y="360" font-size="18" font-weight="600" fill="currentColor">Mechanical motion</text>

  <!-- name pill + cross glyph -->
  <rect x="248" y="345" width="140" height="24" rx="12" fill="#E63946" fill-opacity="0.15"
        stroke="#E63946" stroke-opacity="0.55"/>
  <path d="M 262 351 l 12 12 M 274 351 l -12 12" fill="none" stroke="#E63946" stroke-width="3"
        stroke-linecap="round"/>
  <text x="286" y="361" font-size="12" font-weight="600" fill="currentColor">MECHANICAL</text>

  <!-- straight robotic path (same endpoints A->B) -->
  <path d="M 90 440 L 710 440" fill="none" stroke="currentColor" stroke-width="2"
        stroke-dasharray="7 7" opacity="0.55"/>
  <!-- evenly machine-spaced ghost positions on a flat line -->
  <circle cx="90" cy="440" r="10" fill="#FF6B00" opacity="0.35"/>
  <circle cx="245" cy="440" r="10" fill="#FF6B00" opacity="0.55"/>
  <circle cx="400" cy="440" r="10" fill="#FF6B00" opacity="0.7"/>
  <circle cx="555" cy="440" r="10" fill="#FF6B00" opacity="0.85"/>
  <circle cx="710" cy="440" r="10" fill="#FF6B00"/>
  <!-- endpoint labels -->
  <text x="90" y="468" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">A</text>
  <text x="710" y="468" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">B</text>

  <!-- Footer tip (Variant B, left rail) -->
  <rect x="40" y="506" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Same start and end points: routing the motion through an arc is what separates lifelike from robotic.
  </text>
</svg>
