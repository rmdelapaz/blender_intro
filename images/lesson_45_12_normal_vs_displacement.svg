<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="l45f12-t l45f12-d" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" color="#222">
<title id="l45f12-t">Normal maps fake detail cheaply; displacement adds real geometry at a cost</title>
<desc id="l45f12-d">Three ways to represent surface detail. A flat face with no map is cheapest but looks plain. A normal map keeps the geometry flat while faking light response, giving detail at almost no geometry cost. True displacement subdivides and moves real vertices, producing accurate silhouettes and shadows but adding heavy geometry. Choose normal maps by default and displacement only where the silhouette matters.</desc>
<style>
.title{font-size:15px;font-weight:700;}
.sub{font-size:11.5px;fill:#c8c8c8;}
.hdr{font-size:13px;font-weight:800;}
.cost{font-size:11px;font-weight:700;}
.note{font-size:10px;fill:#c8c8c8;}
</style>
<text class="title" x="380" y="36" text-anchor="middle">Flat vs normal map vs displacement</text>
<g>
<!-- FLAT -->
<rect x="54" y="62" width="212" height="220" rx="8" fill="#2a2a2a" stroke="#4A9EFF" stroke-width="1.5"/>
<text class="hdr" x="160" y="88" fill="#4A9EFF" text-anchor="middle">Flat</text>
<line x1="86" y1="170" x2="234" y2="170" stroke="#4A9EFF" stroke-width="2.5"/>
<text class="note" x="160" y="200" text-anchor="middle">no detail</text>
<text class="cost" x="160" y="256" fill="#4ADE80" text-anchor="middle">geometry: minimal</text>
<text class="cost" x="160" y="272" fill="#4ADE80" text-anchor="middle">looks plain</text>
<!-- NORMAL -->
<rect x="282" y="62" width="212" height="220" rx="8" fill="#2a2a2a" stroke="#4ADE80" stroke-width="1.5"/>
<text class="hdr" x="388" y="88" fill="#4ADE80" text-anchor="middle">Normal map</text>
<line x1="314" y1="170" x2="462" y2="170" stroke="#4ADE80" stroke-width="2.5"/>
<g stroke="#4ADE80" stroke-width="1">
<line x1="330" y1="170" x2="330" y2="156"/><line x1="352" y1="170" x2="356" y2="158"/>
<line x1="374" y1="170" x2="372" y2="155"/><line x1="396" y1="170" x2="400" y2="158"/>
<line x1="418" y1="170" x2="416" y2="156"/><line x1="440" y1="170" x2="444" y2="158"/>
</g>
<text class="note" x="388" y="200" text-anchor="middle">faked lighting, flat mesh</text>
<text class="cost" x="388" y="256" fill="#4ADE80" text-anchor="middle">geometry: minimal</text>
<text class="cost" x="388" y="272" fill="#4ADE80" text-anchor="middle">detail nearly free</text>
<!-- DISPLACEMENT -->
<rect x="510" y="62" width="196" height="220" rx="8" fill="#2a2a2a" stroke="#F5C242" stroke-width="1.5"/>
<text class="hdr" x="608" y="88" fill="#F5C242" text-anchor="middle">Displacement</text>
<path d="M534 172 L546 150 L558 176 L570 148 L582 174 L594 152 L606 178 L618 150 L630 174 L642 152 L654 176 L666 150 L678 172" fill="none" stroke="#F5C242" stroke-width="2.5"/>
<text class="note" x="608" y="200" text-anchor="middle">real moved vertices</text>
<text class="cost" x="608" y="256" fill="#E63946" text-anchor="middle">geometry: heavy</text>
<text class="cost" x="608" y="272" fill="#F5C242" text-anchor="middle">true silhouette</text>
</g>
<text class="sub" x="380" y="380" text-anchor="middle">Default to normal maps; use displacement only where the outline must be real.</text>
</svg>
