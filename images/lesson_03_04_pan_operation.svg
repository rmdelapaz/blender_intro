<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540"
     role="img" aria-labelledby="pa-title pa-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="pa-title">Pan: Sliding the Viewport Sideways</title>
  <desc id="pa-desc">An educational diagram of the Blender pan operation. Two side-by-side viewport frames show the same scene: in the left frame, the cube sits in the right half of the visible area; in the right frame, after a pan, the cube sits in the left half. A bold horizontal arrow between the frames shows the slide direction. The viewing angle and the cube's position in 3D space are both unchanged. Only the visible window moves. Pan also works vertically and diagonally.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Pan: Sliding the View</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">The viewing angle stays put; the visible window slides.</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Operation badge -->
  <text x="400" y="142" font-size="15" font-weight="700" fill="#FF6B00" text-anchor="middle" letter-spacing="2">PAN</text>
  <text x="400" y="164" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">Shift + MMB + Drag</text>

  <!-- ============================================================== -->
  <!-- LEFT VIEWPORT FRAME (before pan): cube is on the right side     -->
  <!-- ============================================================== -->
  <g>
    <!-- Frame border -->
    <rect x="60" y="200" width="280" height="180" rx="4"
          fill="currentColor" fill-opacity="0.03"
          stroke="currentColor" stroke-width="1.5" stroke-opacity="0.4"/>
    <!-- Frame label -->
    <text x="60" y="194" font-size="11" font-weight="700" fill="currentColor" opacity="0.65" letter-spacing="0.5">BEFORE</text>

    <!-- Grid floor inside frame -->
    <g stroke="currentColor" stroke-width="0.8" opacity="0.15" fill="none">
      <line x1="60" y1="330" x2="340" y2="330"/>
      <line x1="60" y1="350" x2="340" y2="350"/>
      <line x1="100" y1="310" x2="100" y2="370"/>
      <line x1="160" y1="310" x2="160" y2="370"/>
      <line x1="220" y1="310" x2="220" y2="370"/>
      <line x1="280" y1="310" x2="280" y2="370"/>
    </g>

    <!-- Cube on the RIGHT side of the frame -->
    <g stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
      <rect x="260" y="266" width="40" height="40"/>
      <polyline points="260,266 270,254 310,254 300,266"/>
      <polyline points="310,254 310,294 300,306"/>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- SLIDE ARROW (big, horizontal, between frames)                   -->
  <!-- ============================================================== -->
  <g>
    <line x1="358" y1="290" x2="442" y2="290"
          stroke="#FF6B00" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    <path d="M 442 290 L 432 282 L 432 298 Z" fill="#FF6B00" opacity="0.9"/>
    <text x="400" y="320" font-size="11" font-style="italic" fill="#FF6B00" text-anchor="middle" opacity="0.85">drag right</text>
  </g>

  <!-- ============================================================== -->
  <!-- RIGHT VIEWPORT FRAME (after pan): cube is on the left side      -->
  <!-- ============================================================== -->
  <g>
    <!-- Frame border -->
    <rect x="460" y="200" width="280" height="180" rx="4"
          fill="currentColor" fill-opacity="0.03"
          stroke="currentColor" stroke-width="1.5" stroke-opacity="0.4"/>
    <!-- Frame label -->
    <text x="460" y="194" font-size="11" font-weight="700" fill="#FF6B00" opacity="0.85" letter-spacing="0.5">AFTER</text>

    <!-- Grid floor inside frame -->
    <g stroke="currentColor" stroke-width="0.8" opacity="0.15" fill="none">
      <line x1="460" y1="330" x2="740" y2="330"/>
      <line x1="460" y1="350" x2="740" y2="350"/>
      <line x1="500" y1="310" x2="500" y2="370"/>
      <line x1="560" y1="310" x2="560" y2="370"/>
      <line x1="620" y1="310" x2="620" y2="370"/>
      <line x1="680" y1="310" x2="680" y2="370"/>
    </g>

    <!-- Same cube, now on the LEFT side of the frame -->
    <g stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
      <rect x="500" y="266" width="40" height="40"/>
      <polyline points="500,266 510,254 550,254 540,266"/>
      <polyline points="550,254 550,294 540,306"/>
    </g>
  </g>

  <!-- Description -->
  <text x="400" y="408" font-size="13" fill="currentColor" opacity="0.75" text-anchor="middle">The cube's actual position never changes. Only your viewport's framing</text>
  <text x="400" y="426" font-size="13" fill="currentColor" opacity="0.75" text-anchor="middle">of the scene moves, like sliding a window across a wall.</text>

  <!-- ===== Inset: pan directions (bottom-left) ===== -->
  <g transform="translate(60, 446)">
    <rect x="0" y="0" width="280" height="62" rx="6"
          fill="currentColor" fill-opacity="0.04"
          stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>
    <text x="14" y="20" font-size="11" font-weight="700" fill="currentColor" opacity="0.75" letter-spacing="0.8">PAN WORKS IN ANY DIRECTION</text>
    <!-- 4-direction arrows around a center dot -->
    <g transform="translate(50, 42)">
      <circle cx="0" cy="0" r="3" fill="#FF6B00"/>
      <line x1="-14" y1="0" x2="14" y2="0" stroke="#FF6B00" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="0" y1="-12" x2="0" y2="12" stroke="#FF6B00" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M 14 0 L 9 -3 L 9 3 Z" fill="#FF6B00"/>
      <path d="M -14 0 L -9 -3 L -9 3 Z" fill="#FF6B00"/>
      <path d="M 0 12 L -3 7 L 3 7 Z" fill="#FF6B00"/>
      <path d="M 0 -12 L -3 -7 L 3 -7 Z" fill="#FF6B00"/>
    </g>
    <text x="80" y="40" font-size="11" fill="currentColor" opacity="0.75">Left, right, up, down,</text>
    <text x="80" y="55" font-size="11" fill="currentColor" opacity="0.75">or any diagonal.</text>
  </g>

  <!-- ===== Inset: key idea (bottom-right) ===== -->
  <g transform="translate(460, 446)">
    <rect x="0" y="0" width="280" height="62" rx="6"
          fill="currentColor" fill-opacity="0.04"
          stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>
    <text x="14" y="20" font-size="11" font-weight="700" fill="currentColor" opacity="0.75" letter-spacing="0.8">KEY IDEA</text>
    <text x="14" y="40" font-size="12" fill="currentColor" opacity="0.8">Same angle, different framing.</text>
    <text x="14" y="55" font-size="12" fill="currentColor" opacity="0.8">Pan never rotates the camera.</text>
  </g>
</svg>
