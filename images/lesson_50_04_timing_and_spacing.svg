<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="car04-title car04-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="car04-title">Timing and Spacing</title>
  <desc id="car04-desc">Two motion paths compared. Even spacing between positions reads as a mechanical, constant-speed move, while spacing that bunches at the ends and spreads in the middle reads as a natural ease-in and ease-out.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Timing and Spacing</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Timing is how many frames. Spacing is how far apart they sit.</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <text x="40" y="150" font-size="18" font-weight="600" fill="currentColor">Even spacing</text>
  <text x="40" y="172" font-size="13" fill="currentColor" opacity="0.6">Constant gaps read as machine-like, no acceleration.</text>
  <line x1="60" y1="212" x2="740" y2="212" stroke="currentColor" stroke-width="1.5" opacity="0.25"/>
  <g fill="#4A9EFF">
    <circle cx="60" cy="212" r="8"/>
    <circle cx="145" cy="212" r="8"/>
    <circle cx="230" cy="212" r="8"/>
    <circle cx="315" cy="212" r="8"/>
    <circle cx="400" cy="212" r="8"/>
    <circle cx="485" cy="212" r="8"/>
    <circle cx="570" cy="212" r="8"/>
    <circle cx="655" cy="212" r="8"/>
    <circle cx="740" cy="212" r="8"/>
  </g>
  <text x="60" y="248" font-size="12" fill="currentColor" opacity="0.55">start</text>
  <text x="740" y="248" text-anchor="end" font-size="12" fill="currentColor" opacity="0.55">end</text>

  <line x1="40" y1="286" x2="760" y2="286" stroke="currentColor" stroke-width="1" opacity="0.1"/>

  <text x="40" y="326" font-size="18" font-weight="600" fill="currentColor">Eased spacing</text>
  <text x="40" y="348" font-size="13" fill="currentColor" opacity="0.6">Bunched at the ends, spread in the middle: ease-in, ease-out.</text>
  <line x1="60" y1="392" x2="740" y2="392" stroke="currentColor" stroke-width="1.5" opacity="0.25"/>
  <g fill="#FF6B00">
    <circle cx="60" cy="392" r="8"/>
    <circle cx="78" cy="392" r="8"/>
    <circle cx="112" cy="392" r="8"/>
    <circle cx="170" cy="392" r="8"/>
    <circle cx="400" cy="392" r="8"/>
    <circle cx="630" cy="392" r="8"/>
    <circle cx="688" cy="392" r="8"/>
    <circle cx="722" cy="392" r="8"/>
    <circle cx="740" cy="392" r="8"/>
  </g>
  <text x="60" y="428" font-size="12" fill="currentColor" opacity="0.55">slow in</text>
  <text x="400" y="428" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.55">fast</text>
  <text x="740" y="428" text-anchor="end" font-size="12" fill="currentColor" opacity="0.55">slow out</text>

  <g>
    <rect x="40" y="452" width="720" height="40" rx="6" fill="currentColor" opacity="0.04"/>
    <text x="60" y="477" font-size="13" fill="currentColor" opacity="0.8">Same start, same end, same frame count. Only the spacing differs, and it changes everything about how the move feels.</text>
  </g>

  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Almost nothing in nature moves at a constant speed, so almost nothing you animate should either.</text>
</svg>
