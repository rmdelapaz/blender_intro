<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="gpd-title gpd-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="gpd-title">Geometry Proximity Node Diagram</title>
  <desc id="gpd-desc">Source points on the left measure the distance to the nearest location on a target surface on the right; leader lines connect each source point to its closest point, producing a per-point distance field.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Geometry Proximity Node</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Distance from each point to the nearest spot on a target surface</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Left label -->
  <text x="40" y="138" font-size="18" font-weight="600" fill="currentColor">Source points</text>
  <text x="40" y="158" font-size="13" fill="currentColor" opacity="0.6">each measures its own distance</text>

  <!-- Right label -->
  <text x="760" y="138" font-size="18" font-weight="600" fill="currentColor" text-anchor="end">Target surface</text>
  <text x="760" y="158" font-size="13" fill="currentColor" opacity="0.6" text-anchor="end">the geometry to measure toward</text>

  <!-- Target surface: a curved wall on the right -->
  <path d="M 620 200 C 560 250, 600 330, 560 380 C 540 410, 560 450, 600 470"
        fill="none" stroke="currentColor" stroke-width="2.5" opacity="0.55"/>
  <path d="M 620 200 C 560 250, 600 330, 560 380 C 540 410, 560 450, 600 470 L 660 470 L 660 200 Z"
        fill="currentColor" opacity="0.06"/>

  <!-- Leader lines: source point -> nearest point on surface (drawn first so dots sit on top) -->
  <g stroke="currentColor" stroke-width="1.5" opacity="0.3" stroke-linecap="round">
    <line x1="150" y1="225" x2="588" y2="232"/>
    <line x1="150" y1="300" x2="573" y2="318"/>
    <line x1="150" y1="375" x2="559" y2="378"/>
    <line x1="230" y1="262" x2="588" y2="245"/>
    <line x1="230" y1="338" x2="566" y2="352"/>
    <line x1="230" y1="415" x2="575" y2="430"/>
  </g>

  <!-- Nearest-point markers on surface (orange tie-break) -->
  <g fill="#FF6B00">
    <circle cx="588" cy="232" r="4"/>
    <circle cx="573" cy="318" r="4"/>
    <circle cx="559" cy="378" r="4"/>
    <circle cx="588" cy="245" r="4"/>
    <circle cx="566" cy="352" r="4"/>
    <circle cx="575" cy="430" r="4"/>
  </g>

  <!-- Source points (blue field markers) with distance chips -->
  <g fill="#4A9EFF">
    <circle cx="150" cy="225" r="7"/>
    <circle cx="150" cy="300" r="7"/>
    <circle cx="150" cy="375" r="7"/>
    <circle cx="230" cy="262" r="7"/>
    <circle cx="230" cy="338" r="7"/>
    <circle cx="230" cy="415" r="7"/>
  </g>

  <!-- distance labels along a couple of leaders -->
  <text x="360" y="222" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">distance</text>
  <text x="360" y="370" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">distance</text>

  <!-- Node glyph -->
  <rect x="300" y="454" width="220" height="46" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
  <text x="410" y="474" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">Geometry Proximity</text>
  <text x="410" y="491" font-size="12" fill="#4A9EFF" text-anchor="middle">Target &#8594; Distance (field)</text>

  <!-- Footer tip Variant B (default y=506/528) -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Feed the Distance output into a Map Range or Color Ramp to drive density, scale, or masking near a surface.</text>
</svg>
