<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" role="img" aria-labelledby="pt-title pt-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" color="#222">
  <title id="pt-title">Blender mesh primitives</title>
  <desc id="pt-desc">A two by four grid of the eight mesh primitives in Blender: plane, cube, UV sphere, ico sphere, cylinder, cone, torus, and Suzanne. Each cell shows the shape silhouette and its default vertex count.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <text x="400" y="56" text-anchor="middle" font-size="24" font-weight="700" fill="currentColor">BLENDER MESH PRIMITIVES</text>
  <text x="400" y="84" text-anchor="middle" font-size="14" fill="currentColor" opacity="0.65">Press Shift + A in the 3D Viewport, then choose Mesh.</text>
  <line x1="120" y1="108" x2="680" y2="108" stroke="currentColor" stroke-width="1" stroke-opacity="0.25"/>
  <text x="400" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#FF6B00" letter-spacing="2">EIGHT STARTING POINTS</text>

  <!-- ===== ROW 1 ===== -->

  <!-- Cell: Plane -->
  <rect x="38" y="160" width="175" height="195" rx="8" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>
  <text x="125" y="184" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">PLANE</text>
  <polygon points="95,235 155,235 175,285 75,285" fill="#FF6B00" fill-opacity="0.10" stroke="currentColor" stroke-width="1.8" stroke-opacity="0.85"/>
  <circle cx="95" cy="235" r="3.5" fill="#FF6B00"/>
  <circle cx="155" cy="235" r="3.5" fill="#FF6B00"/>
  <circle cx="175" cy="285" r="3.5" fill="#FF6B00"/>
  <circle cx="75" cy="285" r="3.5" fill="#FF6B00"/>
  <text x="125" y="340" text-anchor="middle" font-size="12" font-weight="700" fill="#FF6B00">4 verts</text>

  <!-- Cell: Cube -->
  <rect x="221" y="160" width="175" height="195" rx="8" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>
  <text x="308" y="184" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">CUBE</text>
  <polygon points="273,220 290,200 360,200 343,220" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.8" stroke-opacity="0.7"/>
  <polygon points="343,220 360,200 360,270 343,290" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.8" stroke-opacity="0.7"/>
  <rect x="273" y="220" width="70" height="70" fill="#FF6B00" fill-opacity="0.10" stroke="currentColor" stroke-width="1.8" stroke-opacity="0.85"/>
  <circle cx="273" cy="220" r="2.8" fill="#FF6B00"/>
  <circle cx="343" cy="220" r="2.8" fill="#FF6B00"/>
  <circle cx="273" cy="290" r="2.8" fill="#FF6B00"/>
  <circle cx="343" cy="290" r="2.8" fill="#FF6B00"/>
  <circle cx="290" cy="200" r="2.8" fill="#FF6B00"/>
  <circle cx="360" cy="200" r="2.8" fill="#FF6B00"/>
  <circle cx="360" cy="270" r="2.8" fill="#FF6B00"/>
  <text x="308" y="340" text-anchor="middle" font-size="12" font-weight="700" fill="#FF6B00">8 verts</text>

  <!-- Cell: UV Sphere -->
  <rect x="404" y="160" width="175" height="195" rx="8" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>
  <text x="491" y="184" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">UV SPHERE</text>
  <circle cx="491" cy="255" r="42" fill="#FF6B00" fill-opacity="0.10" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.85"/>
  <ellipse cx="491" cy="227" rx="30" ry="4" fill="none" stroke="currentColor" stroke-width="0.8" stroke-opacity="0.5"/>
  <ellipse cx="491" cy="241" rx="38" ry="5" fill="none" stroke="currentColor" stroke-width="0.8" stroke-opacity="0.5"/>
  <ellipse cx="491" cy="255" rx="42" ry="6" fill="none" stroke="currentColor" stroke-width="0.8" stroke-opacity="0.5"/>
  <ellipse cx="491" cy="269" rx="38" ry="5" fill="none" stroke="currentColor" stroke-width="0.8" stroke-opacity="0.5"/>
  <ellipse cx="491" cy="283" rx="30" ry="4" fill="none" stroke="currentColor" stroke-width="0.8" stroke-opacity="0.5"/>
  <line x1="491" y1="213" x2="491" y2="297" stroke="currentColor" stroke-width="0.8" stroke-opacity="0.5"/>
  <ellipse cx="491" cy="255" rx="16" ry="42" fill="none" stroke="currentColor" stroke-width="0.8" stroke-opacity="0.5"/>
  <ellipse cx="491" cy="255" rx="32" ry="42" fill="none" stroke="currentColor" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="491" y="340" text-anchor="middle" font-size="12" font-weight="700" fill="#FF6B00">482 verts</text>

  <!-- Cell: Ico Sphere -->
  <rect x="587" y="160" width="175" height="195" rx="8" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>
  <text x="674" y="184" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">ICO SPHERE</text>
  <!-- Hexagon silhouette -->
  <polygon points="674,213 710,234 710,276 674,297 638,276 638,234" fill="#FF6B00" fill-opacity="0.10" stroke="currentColor" stroke-width="1.8" stroke-opacity="0.85"/>
  <!-- Internal triangle facets -->
  <line x1="638" y1="234" x2="710" y2="234" stroke="currentColor" stroke-width="0.9" stroke-opacity="0.55"/>
  <line x1="638" y1="276" x2="710" y2="276" stroke="currentColor" stroke-width="0.9" stroke-opacity="0.55"/>
  <line x1="674" y1="213" x2="674" y2="255" stroke="currentColor" stroke-width="0.9" stroke-opacity="0.55"/>
  <line x1="638" y1="234" x2="674" y2="255" stroke="currentColor" stroke-width="0.9" stroke-opacity="0.55"/>
  <line x1="710" y1="234" x2="674" y2="255" stroke="currentColor" stroke-width="0.9" stroke-opacity="0.55"/>
  <line x1="638" y1="276" x2="674" y2="255" stroke="currentColor" stroke-width="0.9" stroke-opacity="0.55"/>
  <line x1="710" y1="276" x2="674" y2="255" stroke="currentColor" stroke-width="0.9" stroke-opacity="0.55"/>
  <line x1="674" y1="297" x2="674" y2="255" stroke="currentColor" stroke-width="0.9" stroke-opacity="0.55"/>
  <!-- Vertex dots -->
  <circle cx="674" cy="213" r="2.5" fill="#FF6B00"/>
  <circle cx="710" cy="234" r="2.5" fill="#FF6B00"/>
  <circle cx="710" cy="276" r="2.5" fill="#FF6B00"/>
  <circle cx="674" cy="297" r="2.5" fill="#FF6B00"/>
  <circle cx="638" cy="276" r="2.5" fill="#FF6B00"/>
  <circle cx="638" cy="234" r="2.5" fill="#FF6B00"/>
  <circle cx="674" cy="255" r="2.5" fill="#FF6B00"/>
  <text x="674" y="340" text-anchor="middle" font-size="12" font-weight="700" fill="#FF6B00">42 verts</text>

  <!-- ===== ROW 2 ===== -->

  <!-- Cell: Cylinder -->
  <rect x="38" y="365" width="175" height="195" rx="8" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>
  <text x="125" y="389" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">CYLINDER</text>
  <!-- Cylinder body -->
  <rect x="90" y="425" width="70" height="70" fill="#FF6B00" fill-opacity="0.10" stroke="none"/>
  <line x1="90" y1="425" x2="90" y2="495" stroke="currentColor" stroke-width="1.8" stroke-opacity="0.85"/>
  <line x1="160" y1="425" x2="160" y2="495" stroke="currentColor" stroke-width="1.8" stroke-opacity="0.85"/>
  <!-- Top ellipse -->
  <ellipse cx="125" cy="425" rx="35" ry="9" fill="#FF6B00" fill-opacity="0.18" stroke="currentColor" stroke-width="1.8" stroke-opacity="0.85"/>
  <!-- Bottom ellipse (front arc) -->
  <ellipse cx="125" cy="495" rx="35" ry="9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-opacity="0.85"/>
  <!-- Side vertical wireframe -->
  <line x1="108" y1="418" x2="108" y2="502" stroke="currentColor" stroke-width="0.8" stroke-opacity="0.45"/>
  <line x1="142" y1="418" x2="142" y2="502" stroke="currentColor" stroke-width="0.8" stroke-opacity="0.45"/>
  <line x1="125" y1="416" x2="125" y2="504" stroke="currentColor" stroke-width="0.8" stroke-opacity="0.45"/>
  <text x="125" y="545" text-anchor="middle" font-size="12" font-weight="700" fill="#FF6B00">64 verts</text>

  <!-- Cell: Cone -->
  <rect x="221" y="365" width="175" height="195" rx="8" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>
  <text x="308" y="389" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">CONE</text>
  <!-- Cone body triangle -->
  <polygon points="308,418 273,495 343,495" fill="#FF6B00" fill-opacity="0.10" stroke="currentColor" stroke-width="1.8" stroke-opacity="0.85"/>
  <!-- Base ellipse -->
  <ellipse cx="308" cy="495" rx="35" ry="9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-opacity="0.85"/>
  <!-- Spoke lines from apex to base edge -->
  <line x1="308" y1="418" x2="290" y2="503" stroke="currentColor" stroke-width="0.8" stroke-opacity="0.45"/>
  <line x1="308" y1="418" x2="326" y2="503" stroke="currentColor" stroke-width="0.8" stroke-opacity="0.45"/>
  <line x1="308" y1="418" x2="308" y2="504" stroke="currentColor" stroke-width="0.8" stroke-opacity="0.45"/>
  <!-- Apex vertex -->
  <circle cx="308" cy="418" r="3.5" fill="#FF6B00"/>
  <text x="308" y="545" text-anchor="middle" font-size="12" font-weight="700" fill="#FF6B00">33 verts</text>

  <!-- Cell: Torus -->
  <rect x="404" y="365" width="175" height="195" rx="8" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>
  <text x="491" y="389" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">TORUS</text>
  <!-- Outer ellipse -->
  <ellipse cx="491" cy="460" rx="55" ry="28" fill="#FF6B00" fill-opacity="0.10" stroke="currentColor" stroke-width="1.8" stroke-opacity="0.85"/>
  <!-- Inner hole ellipse -->
  <ellipse cx="491" cy="460" rx="22" ry="9" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.75"/>
  <!-- Wireframe cross-sections -->
  <ellipse cx="491" cy="460" rx="38" ry="18" fill="none" stroke="currentColor" stroke-width="0.7" stroke-opacity="0.4"/>
  <ellipse cx="491" cy="460" rx="48" ry="24" fill="none" stroke="currentColor" stroke-width="0.7" stroke-opacity="0.4"/>
  <!-- Small ring sections suggesting tube divisions -->
  <ellipse cx="446" cy="460" rx="6" ry="12" fill="none" stroke="currentColor" stroke-width="0.7" stroke-opacity="0.4"/>
  <ellipse cx="536" cy="460" rx="6" ry="12" fill="none" stroke="currentColor" stroke-width="0.7" stroke-opacity="0.4"/>
  <text x="491" y="545" text-anchor="middle" font-size="12" font-weight="700" fill="#FF6B00">576 verts</text>

  <!-- Cell: Suzanne -->
  <rect x="587" y="365" width="175" height="195" rx="8" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>
  <text x="674" y="389" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">SUZANNE</text>
  <!-- Ears -->
  <ellipse cx="630" cy="460" rx="10" ry="16" fill="#FF6B00" fill-opacity="0.10" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.85"/>
  <ellipse cx="718" cy="460" rx="10" ry="16" fill="#FF6B00" fill-opacity="0.10" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.85"/>
  <!-- Main head ellipse -->
  <ellipse cx="674" cy="460" rx="38" ry="45" fill="#FF6B00" fill-opacity="0.10" stroke="currentColor" stroke-width="1.8" stroke-opacity="0.85"/>
  <!-- Eyes -->
  <ellipse cx="660" cy="450" rx="5" ry="6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.75"/>
  <ellipse cx="688" cy="450" rx="5" ry="6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.75"/>
  <circle cx="660" cy="450" r="1.5" fill="currentColor" opacity="0.8"/>
  <circle cx="688" cy="450" r="1.5" fill="currentColor" opacity="0.8"/>
  <!-- Brows -->
  <path d="M 652,438 Q 660,434 668,438" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.7"/>
  <path d="M 680,438 Q 688,434 696,438" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.7"/>
  <!-- Mouth arc -->
  <path d="M 662,480 Q 674,488 686,480" fill="none" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.75"/>
  <!-- Center crease -->
  <line x1="674" y1="425" x2="674" y2="500" stroke="currentColor" stroke-width="0.7" stroke-opacity="0.35"/>
  <text x="674" y="545" text-anchor="middle" font-size="12" font-weight="700" fill="#FF6B00">507 verts</text>

  <!-- Italic takeaway -->
  <text x="400" y="595" text-anchor="middle" font-size="13" font-style="italic" fill="currentColor" opacity="0.75">Most modeling jobs begin with one of these. Pick the closest match and edit from there.</text>

  <!-- Footer tip -->
  <rect x="40" y="620" width="720" height="34" rx="6" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>
  <rect x="40" y="620" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="641" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Suzanne is Blender's mascot and a handy stand in for testing materials, lighting, and rigs.</text>
</svg>
