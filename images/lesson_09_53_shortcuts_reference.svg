<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" color="#222" role="img" aria-labelledby="sr-title sr-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="sr-title">Precision Modeling Keyboard Shortcuts</title>
  <desc id="sr-desc">A keyboard shortcut cheat sheet grouped into four categories: snapping, exact transformations, cleanup and verification, and view navigation. Each row pairs a key combination with what it does.</desc>

  <rect x="0" y="0" width="800" height="680" rx="18" fill="#0f1a14"/>
  <rect x="0" y="0" width="800" height="10" rx="5" fill="#FF6B00"/>

  <text x="40" y="58" font-size="30" font-weight="700" fill="#f5f7f6">Keyboard Shortcuts</text>
  <text x="40" y="88" font-size="17" font-weight="500" fill="#9fb0a8">The precision keys, grouped by what you are doing</text>

  <!-- key-pill style: rounded rect + centered mono-ish label -->

  <!-- ===== SNAPPING (orange) ===== -->
  <text x="40" y="124" font-size="15" font-weight="700" fill="#FF6B00">SNAPPING</text>
  <g>
    <rect x="40" y="136" width="138" height="34" rx="7" fill="#1c2a22" stroke="#FF6B00" stroke-width="1.6"/>
    <text x="109" y="159" font-size="14" font-weight="700" fill="#ffb878" text-anchor="middle">Shift + Tab</text>
    <text x="192" y="159" font-size="13.5" fill="#cdd8d2">Toggle snapping on and off</text>
  </g>
  <g>
    <rect x="40" y="178" width="138" height="34" rx="7" fill="#1c2a22" stroke="#FF6B00" stroke-width="1.6"/>
    <text x="109" y="201" font-size="14" font-weight="700" fill="#ffb878" text-anchor="middle">Shift + S</text>
    <text x="192" y="201" font-size="13.5" fill="#cdd8d2">Open the Snap menu (cursor / selection)</text>
  </g>
  <g>
    <rect x="40" y="220" width="138" height="34" rx="7" fill="#1c2a22" stroke="#FF6B00" stroke-width="1.6"/>
    <text x="109" y="243" font-size="13" font-weight="700" fill="#ffb878" text-anchor="middle">Hold Ctrl</text>
    <text x="192" y="243" font-size="13.5" fill="#cdd8d2">Snap temporarily while dragging</text>
  </g>

  <!-- ===== EXACT TRANSFORMS (blue) ===== -->
  <text x="40" y="294" font-size="15" font-weight="700" fill="#4A9EFF">EXACT TRANSFORMATIONS</text>
  <g>
    <rect x="40" y="306" width="200" height="34" rx="7" fill="#1c2a22" stroke="#4A9EFF" stroke-width="1.6"/>
    <text x="140" y="329" font-size="13" font-weight="700" fill="#9fd0ff" text-anchor="middle">G / R / S &#8594; axis &#8594; num</text>
    <text x="254" y="329" font-size="13.5" fill="#cdd8d2">Move, rotate or scale a precise amount</text>
  </g>
  <g>
    <rect x="40" y="348" width="200" height="34" rx="7" fill="#1c2a22" stroke="#4A9EFF" stroke-width="1.6"/>
    <text x="140" y="371" font-size="13" font-weight="700" fill="#9fd0ff" text-anchor="middle">G &#8594; axis &#8594; = num</text>
    <text x="254" y="371" font-size="13.5" fill="#cdd8d2">Jump to an absolute coordinate</text>
  </g>
  <g>
    <rect x="40" y="390" width="200" height="34" rx="7" fill="#1c2a22" stroke="#4A9EFF" stroke-width="1.6"/>
    <text x="140" y="413" font-size="13" font-weight="700" fill="#9fd0ff" text-anchor="middle">type math, e.g. 360/8</text>
    <text x="254" y="413" font-size="13.5" fill="#cdd8d2">Let Blender calculate the value</text>
  </g>
  <g>
    <rect x="40" y="432" width="200" height="34" rx="7" fill="#1c2a22" stroke="#4A9EFF" stroke-width="1.6"/>
    <text x="140" y="455" font-size="14" font-weight="700" fill="#9fd0ff" text-anchor="middle">Shift + R</text>
    <text x="254" y="455" font-size="13.5" fill="#cdd8d2">Repeat the last transform exactly</text>
  </g>

  <!-- ===== CLEANUP & VERIFICATION (green) ===== -->
  <text x="40" y="506" font-size="15" font-weight="700" fill="#4ADE80">CLEANUP &amp; VERIFICATION</text>
  <g>
    <rect x="40" y="518" width="200" height="32" rx="7" fill="#1c2a22" stroke="#4ADE80" stroke-width="1.6"/>
    <text x="140" y="540" font-size="13" font-weight="700" fill="#86efac" text-anchor="middle">Ctrl + A &#8594; Scale</text>
    <text x="254" y="540" font-size="13.5" fill="#cdd8d2">Apply scale (resets to 1.0)</text>
  </g>
  <g>
    <rect x="40" y="558" width="200" height="32" rx="7" fill="#1c2a22" stroke="#4ADE80" stroke-width="1.6"/>
    <text x="140" y="580" font-size="13" font-weight="700" fill="#86efac" text-anchor="middle">M &#8594; By Distance</text>
    <text x="254" y="580" font-size="13.5" fill="#cdd8d2">Merge overlapping vertices</text>
  </g>
  <g>
    <rect x="40" y="598" width="200" height="32" rx="7" fill="#1c2a22" stroke="#4ADE80" stroke-width="1.6"/>
    <text x="140" y="620" font-size="14" font-weight="700" fill="#86efac" text-anchor="middle">Shift + N</text>
    <text x="254" y="620" font-size="13.5" fill="#cdd8d2">Recalculate normals outward</text>
  </g>

  <!-- ===== VIEW NAVIGATION (purple) - right column ===== -->
  <text x="556" y="294" font-size="15" font-weight="700" fill="#B47EE8">VIEW NAVIGATION</text>
  <g>
    <rect x="556" y="306" width="112" height="34" rx="7" fill="#1c2a22" stroke="#B47EE8" stroke-width="1.6"/>
    <text x="612" y="329" font-size="14" font-weight="700" fill="#d6b8f5" text-anchor="middle">Numpad 1</text>
    <text x="676" y="329" font-size="13" fill="#cdd8d2">Front</text>
  </g>
  <g>
    <rect x="556" y="348" width="112" height="34" rx="7" fill="#1c2a22" stroke="#B47EE8" stroke-width="1.6"/>
    <text x="612" y="371" font-size="14" font-weight="700" fill="#d6b8f5" text-anchor="middle">Numpad 3</text>
    <text x="676" y="371" font-size="13" fill="#cdd8d2">Right</text>
  </g>
  <g>
    <rect x="556" y="390" width="112" height="34" rx="7" fill="#1c2a22" stroke="#B47EE8" stroke-width="1.6"/>
    <text x="612" y="413" font-size="14" font-weight="700" fill="#d6b8f5" text-anchor="middle">Numpad 7</text>
    <text x="676" y="413" font-size="13" fill="#cdd8d2">Top</text>
  </g>
  <g>
    <rect x="556" y="432" width="112" height="34" rx="7" fill="#1c2a22" stroke="#B47EE8" stroke-width="1.6"/>
    <text x="612" y="455" font-size="15" font-weight="700" fill="#d6b8f5" text-anchor="middle">N</text>
    <text x="676" y="455" font-size="13" fill="#cdd8d2">Sidebar</text>
  </g>

  <!-- tip card under view nav -->
  <g>
    <rect x="556" y="488" width="204" height="116" rx="10" fill="#11201a" stroke="#24382e" stroke-width="2"/>
    <text x="572" y="514" font-size="13" font-weight="700" fill="#F5C242">QUICK TIP</text>
    <text x="572" y="540" font-size="12.5" fill="#cdd8d2">Combine the order:</text>
    <text x="572" y="560" font-size="12.5" fill="#9fd0ff">key &#8594; axis &#8594; number</text>
    <text x="572" y="582" font-size="12.5" fill="#cdd8d2">covers almost every</text>
    <text x="572" y="600" font-size="12.5" fill="#cdd8d2">precise transform.</text>
  </g>

  <!-- footer tip rail -->
  <rect x="40" y="640" width="6" height="22" rx="3" fill="#F5C242"/>
  <text x="60" y="657" font-size="14.5" font-weight="600" fill="#F5C242">Learn the four groups &#183; the rest is just axis and number.</text>
</svg>
