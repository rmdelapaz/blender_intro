<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" width="800" height="680" color="#222" role="img" aria-labelledby="dt-title dt-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="dt-title">Light type decision tree</title>
  <desc id="dt-desc">A flowchart for choosing a Blender light type. Starting from "What lighting do you need?": if it is an outdoor scene use a Sun light; otherwise if soft shadows are needed use an Area light; otherwise if a directional focused beam is needed use a Spot light; otherwise if a small omnidirectional source is needed use a Point light; otherwise default to an Area light as the most versatile.</desc>

  <defs>
    <marker id="dt-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FF6B00"/>
    </marker>
  </defs>

  <!-- header -->
  <rect x="0" y="0" width="800" height="6" fill="#FF6B00"/>
  <text x="32" y="44" font-size="24" font-weight="700" fill="currentColor">WHICH LIGHT TO USE?</text>
  <text x="32" y="68" font-size="15" fill="currentColor" opacity="0.65">A decision tree for picking the right light type</text>
  <line x1="32" y1="82" x2="768" y2="82" stroke="currentColor" stroke-opacity="0.18" stroke-width="1"/>

  <!-- connectors (drawn first, behind nodes) -->
  <g stroke="#FF6B00" stroke-width="2.5" fill="none">
    <!-- start -> Q1 -->
    <line x1="400" y1="138" x2="400" y2="158" marker-end="url(#dt-arrow)"/>
    <!-- Q1 Yes -> Sun (right) -->
    <path d="M520,186 L640,186" marker-end="url(#dt-arrow)"/>
    <!-- Q1 No -> Q2 (down) -->
    <line x1="400" y1="214" x2="400" y2="244" marker-end="url(#dt-arrow)"/>
    <!-- Q2 Yes -> Area (right) -->
    <path d="M520,272 L640,272" marker-end="url(#dt-arrow)"/>
    <!-- Q2 No -> Q3 (down) -->
    <line x1="400" y1="300" x2="400" y2="330" marker-end="url(#dt-arrow)"/>
    <!-- Q3 Yes -> Spot (right) -->
    <path d="M520,358 L640,358" marker-end="url(#dt-arrow)"/>
    <!-- Q3 No -> Q4 (down) -->
    <line x1="400" y1="386" x2="400" y2="416" marker-end="url(#dt-arrow)"/>
    <!-- Q4 Yes -> Point (right) -->
    <path d="M520,444 L640,444" marker-end="url(#dt-arrow)"/>
    <!-- Q4 No -> Default Area (down) -->
    <line x1="400" y1="472" x2="400" y2="512" marker-end="url(#dt-arrow)"/>
  </g>

  <!-- edge labels -->
  <g font-size="12" font-weight="700">
    <text x="566" y="178" fill="#1F8A4C" text-anchor="middle">Yes</text>
    <text x="414" y="234" fill="#C0392B">No</text>
    <text x="566" y="264" fill="#1F8A4C" text-anchor="middle">Yes</text>
    <text x="414" y="320" fill="#C0392B">No</text>
    <text x="566" y="350" fill="#1F8A4C" text-anchor="middle">Yes</text>
    <text x="414" y="406" fill="#C0392B">No</text>
    <text x="566" y="436" fill="#1F8A4C" text-anchor="middle">Yes</text>
    <text x="414" y="492" fill="#C0392B">No</text>
  </g>

  <!-- START node -->
  <g>
    <rect x="250" y="104" width="300" height="34" rx="17" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="400" y="126" font-size="14" font-weight="700" fill="currentColor" text-anchor="middle">What lighting do you need?</text>
  </g>

  <!-- decision diamonds (rendered as rotated squares) + outcome boxes -->
  <!-- Q1 -->
  <g>
    <rect x="330" y="158" width="140" height="56" rx="6" fill="#fff" fill-opacity="0.0" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.6"/>
    <text x="400" y="182" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">Outdoor</text>
    <text x="400" y="200" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">scene?</text>
  </g>
  <!-- Q2 -->
  <g>
    <rect x="330" y="244" width="140" height="56" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.6"/>
    <text x="400" y="268" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">Soft shadows</text>
    <text x="400" y="286" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">needed?</text>
  </g>
  <!-- Q3 -->
  <g>
    <rect x="330" y="330" width="140" height="56" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.6"/>
    <text x="400" y="354" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">Directional /</text>
    <text x="400" y="372" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">focused beam?</text>
  </g>
  <!-- Q4 -->
  <g>
    <rect x="330" y="416" width="140" height="56" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.6"/>
    <text x="400" y="440" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">Small omni-</text>
    <text x="400" y="458" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">directional source?</text>
  </g>

  <!-- OUTCOME boxes (colors match the live mermaid fills) -->
  <!-- Sun -->
  <g>
    <rect x="640" y="166" width="128" height="40" rx="8" fill="#FFD93D" stroke="#333" stroke-width="1.5"/>
    <text x="704" y="191" font-size="15" font-weight="700" fill="#000" text-anchor="middle">&#9728; Sun Light</text>
  </g>
  <!-- Area -->
  <g>
    <rect x="640" y="252" width="128" height="40" rx="8" fill="#6BCF7F" stroke="#333" stroke-width="1.5"/>
    <text x="704" y="277" font-size="15" font-weight="700" fill="#000" text-anchor="middle">&#9632; Area Light</text>
  </g>
  <!-- Spot -->
  <g>
    <rect x="640" y="338" width="128" height="40" rx="8" fill="#FF6B9D" stroke="#333" stroke-width="1.5"/>
    <text x="704" y="363" font-size="15" font-weight="700" fill="#000" text-anchor="middle">&#9650; Spot Light</text>
  </g>
  <!-- Point -->
  <g>
    <rect x="640" y="424" width="128" height="40" rx="8" fill="#4D96FF" stroke="#333" stroke-width="1.5"/>
    <text x="704" y="449" font-size="15" font-weight="700" fill="#000" text-anchor="middle">&#9679; Point Light</text>
  </g>
  <!-- Default Area -->
  <g>
    <rect x="300" y="512" width="200" height="48" rx="8" fill="#6BCF7F" stroke="#333" stroke-width="1.5"/>
    <text x="400" y="533" font-size="14" font-weight="700" fill="#000" text-anchor="middle">Area Light</text>
    <text x="400" y="551" font-size="11" font-weight="600" fill="#000" text-anchor="middle">(most versatile default)</text>
  </g>

  <!-- footer tip -->
  <g>
    <rect x="32" y="600" width="4" height="56" fill="#FF6B00"/>
    <text x="48" y="618" font-size="13" font-weight="600" fill="currentColor">Not sure?</text>
    <text x="48" y="638" font-size="12" fill="currentColor" opacity="0.8">Area lights are the safe, realistic default for most indoor</text>
    <text x="48" y="654" font-size="12" fill="currentColor" opacity="0.8">and studio work. Start there, then specialize as needed.</text>
  </g>
</svg>
