<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="ob-title ob-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="ob-title">Orbit camera move, top-down diagram</title>
  <desc id="ob-desc">Top-down view of an orbit move. The camera travels along a circular path around a fixed central subject, and at every position the camera is rotated to keep aiming inward at the subject. The subject stays framed while the background sweeps behind it.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">ORBIT</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Arc around the subject &#183; keep it aimed inward</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- View label -->
  <text x="40" y="138" font-size="18" font-weight="600" fill="currentColor">Top-down view</text>

  <!-- ===== Aim annotation pill (top-right, clear of header divider) ===== -->
  <g>
    <rect x="544" y="124" width="216" height="30" rx="15" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1" stroke-opacity="0.3"/>
    <text x="652" y="144" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Aim stays locked on subject</text>
  </g>

  <!-- ===== Orbit circle (dashed, currentColor) ===== -->
  <circle cx="400" cy="300" r="146" fill="none" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="6 7"/>

  <!-- ===== FOV cones (each apex at a camera, opening inward toward subject; currentColor low-opacity) ===== -->
  <!-- LEFT camera apex (254,300) -> cone opens right toward subject -->
  <polygon points="254,300 372,250 372,350" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-width="1" stroke-opacity="0.3"/>
  <!-- BOTTOM camera apex (400,446) -> cone opens up toward subject -->
  <polygon points="400,446 350,352 450,352" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="1" stroke-opacity="0.3"/>
  <!-- RIGHT camera apex (546,300) -> cone opens left toward subject; active, faint orange edge -->
  <polygon points="546,300 428,250 428,350" fill="currentColor" fill-opacity="0.10" stroke="#FF6B00" stroke-width="1.25" stroke-opacity="0.5"/>

  <!-- ===== Subject (fixed reference, center) ===== -->
  <g>
    <rect x="368" y="272" width="64" height="56" rx="3" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="2"/>
    <path d="M 368 272 L 384 258 L 448 258 L 432 272" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-width="1.5" opacity="0.55"/>
    <path d="M 432 272 L 448 258 L 448 314 L 432 328" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-width="1.5" opacity="0.55"/>
    <text x="400" y="306" text-anchor="middle" font-size="14" font-weight="500" fill="currentColor">Subject</text>
  </g>

  <!-- ===== Orbit travel arrow (orange arc riding outside the circle, left -> bottom -> right) ===== -->
  <defs>
    <marker id="ob-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#FF6B00"/>
    </marker>
  </defs>
  <!-- arc from near left-camera, sweeping through bottom, to near right-camera; r=172 outside the dashed orbit -->
  <path d="M 258 358 A 172 172 0 0 0 542 358" fill="none" stroke="#FF6B00" stroke-width="3" stroke-linecap="round" marker-end="url(#ob-arrow)"/>
  <text x="400" y="492" text-anchor="middle" font-size="14" font-weight="600" fill="#FF6B00">Orbit</text>

  <!-- ===== Ghost camera bodies on the arc (rotated to aim inward) ===== -->
  <!-- LEFT camera @ (254,300), lens nub points right (+x) toward subject, opacity 0.4 -->
  <g opacity="0.4" transform="translate(254,300)">
    <rect x="-19" y="-28" width="38" height="56" rx="4" fill="#FF6B00"/>
    <rect x="19" y="-8" width="14" height="16" rx="2" fill="#FF6B00"/>
  </g>
  <text x="226" y="304" text-anchor="end" font-size="13" font-weight="500" fill="currentColor">Start</text>

  <!-- BOTTOM camera @ (400,446), lens nub points up (-y) toward subject, opacity 0.6 -->
  <g opacity="0.6" transform="translate(400,446)">
    <rect x="-28" y="-19" width="56" height="38" rx="4" fill="#FF6B00"/>
    <rect x="-8" y="-33" width="16" height="14" rx="2" fill="#FF6B00"/>
  </g>

  <!-- RIGHT camera @ (546,300), lens nub points left (-x) toward subject, opacity 0.9 -->
  <g opacity="0.9" transform="translate(546,300)">
    <rect x="-19" y="-28" width="38" height="56" rx="4" fill="#FF6B00"/>
    <rect x="-33" y="-8" width="14" height="16" rx="2" fill="#FF6B00"/>
  </g>
  <text x="574" y="304" text-anchor="start" font-size="13" font-weight="500" fill="currentColor">End</text>

  <!-- ===== Footer tip (Variant B left rail) ===== -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Parent the camera to an empty at the subject, then rotate the empty &#183; the camera orbits and stays aimed.</text>
</svg>
