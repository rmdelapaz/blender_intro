<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" width="800" height="680" color="#222" role="img" aria-labelledby="ltt-title ltt-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="ltt-title">Light types comparison table</title>
  <desc id="ltt-desc">A scan-friendly comparison of Blender's four light types (Point, Sun, Spot, Area) across nine features: direction, shadow quality, falloff, position matters, rotation matters, size control, best for, render speed, and realism. Cells are color coded green for advantages, amber for neutral, and red for limitations.</desc>

  <defs>
    <!-- light-type glyphs reused as small column-header icons -->
    <g id="ltt-ic-point">
      <circle cx="0" cy="0" r="7" fill="#4D96FF"/>
      <g stroke="#4D96FF" stroke-width="1.6">
        <line x1="0" y1="-12" x2="0" y2="-9"/><line x1="0" y1="9" x2="0" y2="12"/>
        <line x1="-12" y1="0" x2="-9" y2="0"/><line x1="9" y1="0" x2="12" y2="0"/>
        <line x1="-8.5" y1="-8.5" x2="-6.4" y2="-6.4"/><line x1="6.4" y1="6.4" x2="8.5" y2="8.5"/>
        <line x1="8.5" y1="-8.5" x2="6.4" y2="-6.4"/><line x1="-6.4" y1="6.4" x2="-8.5" y2="8.5"/>
      </g>
    </g>
    <g id="ltt-ic-sun">
      <circle cx="0" cy="0" r="6" fill="#FFD93D"/>
      <g stroke="#FFD93D" stroke-width="2">
        <line x1="0" y1="-13" x2="0" y2="-9"/><line x1="0" y1="9" x2="0" y2="13"/>
        <line x1="-13" y1="0" x2="-9" y2="0"/><line x1="9" y1="0" x2="13" y2="0"/>
        <line x1="-9.2" y1="-9.2" x2="-6.4" y2="-6.4"/><line x1="6.4" y1="6.4" x2="9.2" y2="9.2"/>
        <line x1="9.2" y1="-9.2" x2="6.4" y2="-6.4"/><line x1="-6.4" y1="6.4" x2="-9.2" y2="9.2"/>
      </g>
    </g>
    <g id="ltt-ic-spot">
      <path d="M0,-12 L9,9 L-9,9 z" fill="#FF6B9D"/>
    </g>
    <g id="ltt-ic-area">
      <rect x="-10" y="-10" width="20" height="20" rx="2" fill="#6BCF7F"/>
    </g>
  </defs>

  <!-- header -->
  <rect x="0" y="0" width="800" height="6" fill="#FF6B00"/>
  <text x="32" y="44" font-size="24" font-weight="700" fill="currentColor">LIGHT TYPES AT A GLANCE</text>
  <text x="32" y="68" font-size="15" fill="currentColor" opacity="0.65">Quick reference &#183; choose the right light for the job</text>

  <!-- legend -->
  <g font-size="12" fill="currentColor">
    <rect x="430" y="34" width="14" height="14" rx="3" fill="#6BCF7F"/><text x="450" y="45" opacity="0.85">advantage</text>
    <rect x="540" y="34" width="14" height="14" rx="3" fill="#F5C242"/><text x="560" y="45" opacity="0.85">neutral</text>
    <rect x="640" y="34" width="14" height="14" rx="3" fill="#E63946"/><text x="660" y="45" opacity="0.85">limitation</text>
  </g>

  <!-- table geometry: feature col x=32 w=168 ; 4 type cols start x=200 each w=150 -->
  <!-- column header band -->
  <g>
    <rect x="200" y="86" width="150" height="44" fill="#4D96FF" fill-opacity="0.14"/>
    <rect x="350" y="86" width="150" height="44" fill="#FFD93D" fill-opacity="0.16"/>
    <rect x="500" y="86" width="150" height="44" fill="#FF6B9D" fill-opacity="0.14"/>
    <rect x="650" y="86" width="118" height="44" fill="#6BCF7F" fill-opacity="0.16"/>
    <use href="#ltt-ic-point" x="232" y="108"/>
    <use href="#ltt-ic-sun" x="382" y="108"/>
    <use href="#ltt-ic-spot" x="532" y="108"/>
    <use href="#ltt-ic-area" x="691" y="108"/>
    <text x="252" y="113" font-size="14" font-weight="700" fill="currentColor">Point</text>
    <text x="402" y="113" font-size="14" font-weight="700" fill="currentColor">Sun</text>
    <text x="552" y="113" font-size="14" font-weight="700" fill="currentColor">Spot</text>
    <text x="709" y="113" font-size="14" font-weight="700" fill="currentColor">Area</text>
  </g>

  <!-- rows: y top = 130, row height 56, 9 rows -->
  <!-- helper visual: zebra striping via rects; cell text colored by semantic -->
  <g font-size="12.5">
    <!-- ROW 1 Direction (y 130-186) -->
    <rect x="32" y="130" width="736" height="56" fill="currentColor" fill-opacity="0.04"/>
    <text x="44" y="163" font-size="13" font-weight="700" fill="currentColor">Direction</text>
    <text x="275" y="163" fill="#C0392B" text-anchor="middle">Omni-directional</text>
    <text x="425" y="163" fill="#1F8A4C" text-anchor="middle">Parallel rays</text>
    <text x="575" y="163" fill="#1F8A4C" text-anchor="middle">Cone shape</text>
    <text x="709" y="163" fill="#1F8A4C" text-anchor="middle">Planar</text>

    <!-- ROW 2 Shadow Quality (186-242) -->
    <text x="44" y="219" font-size="13" font-weight="700" fill="currentColor">Shadow Quality</text>
    <text x="275" y="219" fill="#C0392B" text-anchor="middle">Hard (sharp)</text>
    <text x="425" y="219" fill="#C0392B" text-anchor="middle">Hard (parallel)</text>
    <text x="575" y="219" fill="#B8860B" text-anchor="middle">Hard&#8211;Medium</text>
    <text x="709" y="219" fill="#1F8A4C" text-anchor="middle">Soft (realistic)</text>

    <!-- ROW 3 Falloff (242-298) -->
    <rect x="32" y="242" width="736" height="56" fill="currentColor" fill-opacity="0.04"/>
    <text x="44" y="275" font-size="13" font-weight="700" fill="currentColor">Falloff</text>
    <text x="275" y="275" fill="#B8860B" text-anchor="middle">Inverse square</text>
    <text x="425" y="275" fill="#1F8A4C" text-anchor="middle">No falloff</text>
    <text x="575" y="275" fill="#B8860B" text-anchor="middle">Inverse square</text>
    <text x="709" y="275" fill="#B8860B" text-anchor="middle">Inverse square</text>

    <!-- ROW 4 Position Matters (298-354) -->
    <text x="44" y="331" font-size="13" font-weight="700" fill="currentColor">Position Matters</text>
    <text x="275" y="331" fill="#1F8A4C" text-anchor="middle">Yes</text>
    <text x="425" y="331" fill="#C0392B" text-anchor="middle">No</text>
    <text x="575" y="331" fill="#1F8A4C" text-anchor="middle">Yes</text>
    <text x="709" y="331" fill="#1F8A4C" text-anchor="middle">Yes</text>

    <!-- ROW 5 Rotation Matters (354-410) -->
    <rect x="32" y="354" width="736" height="56" fill="currentColor" fill-opacity="0.04"/>
    <text x="44" y="387" font-size="13" font-weight="700" fill="currentColor">Rotation Matters</text>
    <text x="275" y="387" fill="#C0392B" text-anchor="middle">No</text>
    <text x="425" y="387" fill="#1F8A4C" text-anchor="middle">Yes</text>
    <text x="575" y="387" fill="#1F8A4C" text-anchor="middle">Yes</text>
    <text x="709" y="387" fill="#1F8A4C" text-anchor="middle">Yes</text>

    <!-- ROW 6 Size Control (410-466) -->
    <text x="44" y="443" font-size="13" font-weight="700" fill="currentColor">Size Control</text>
    <text x="275" y="443" fill="#B8860B" text-anchor="middle">Radius only</text>
    <text x="425" y="443" fill="#B8860B" text-anchor="middle">Angle only</text>
    <text x="575" y="443" fill="#1F8A4C" text-anchor="middle">Radius + Cone</text>
    <text x="709" y="443" fill="#1F8A4C" text-anchor="middle">Physical size</text>

    <!-- ROW 7 Best For (466-522) -->
    <rect x="32" y="466" width="736" height="56" fill="currentColor" fill-opacity="0.04"/>
    <text x="44" y="494" font-size="13" font-weight="700" fill="currentColor">Best For</text>
    <text x="275" y="492" fill="currentColor" text-anchor="middle" opacity="0.85">Small sources,</text>
    <text x="275" y="508" fill="currentColor" text-anchor="middle" opacity="0.85">accents</text>
    <text x="425" y="492" fill="currentColor" text-anchor="middle" opacity="0.85">Outdoor,</text>
    <text x="425" y="508" fill="currentColor" text-anchor="middle" opacity="0.85">distant light</text>
    <text x="575" y="492" fill="currentColor" text-anchor="middle" opacity="0.85">Focused,</text>
    <text x="575" y="508" fill="currentColor" text-anchor="middle" opacity="0.85">theatrical</text>
    <text x="709" y="492" fill="currentColor" text-anchor="middle" opacity="0.85">Realistic,</text>
    <text x="709" y="508" fill="currentColor" text-anchor="middle" opacity="0.85">studio</text>

    <!-- ROW 8 Render Speed (522-578) -->
    <text x="44" y="555" font-size="13" font-weight="700" fill="currentColor">Render Speed</text>
    <text x="275" y="555" fill="#1F8A4C" text-anchor="middle">Fast</text>
    <text x="425" y="555" fill="#1F8A4C" text-anchor="middle">Fast</text>
    <text x="575" y="555" fill="#1F8A4C" text-anchor="middle">Fast</text>
    <text x="709" y="555" fill="#C0392B" text-anchor="middle">Slower</text>

    <!-- ROW 9 Realism (578-634) -->
    <rect x="32" y="578" width="736" height="56" fill="currentColor" fill-opacity="0.04"/>
    <text x="44" y="611" font-size="13" font-weight="700" fill="currentColor">Realism</text>
    <text x="275" y="611" fill="#B8860B" text-anchor="middle">Low&#8211;Medium</text>
    <text x="425" y="611" fill="#1F8A4C" text-anchor="middle">High (outdoors)</text>
    <text x="575" y="611" fill="#B8860B" text-anchor="middle">Medium</text>
    <text x="709" y="611" fill="#1F8A4C" text-anchor="middle">High</text>
  </g>

  <!-- column separators -->
  <g stroke="currentColor" stroke-opacity="0.12" stroke-width="1">
    <line x1="200" y1="130" x2="200" y2="634"/>
    <line x1="350" y1="130" x2="350" y2="634"/>
    <line x1="500" y1="130" x2="500" y2="634"/>
    <line x1="650" y1="130" x2="650" y2="634"/>
  </g>
  <rect x="32" y="130" width="736" height="504" fill="none" stroke="currentColor" stroke-opacity="0.18" stroke-width="1.4"/>

  <text x="32" y="660" font-size="12" fill="currentColor" opacity="0.6">Area lights cost the most render time but read the most realistic. Point and Spot stay fast.</text>
</svg>
