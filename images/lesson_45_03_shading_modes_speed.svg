<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="l45f03-t l45f03-d" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" color="#222">
<title id="l45f03-t">Viewport shading modes ranked by cost</title>
<desc id="l45f03-d">Four viewport shading modes ordered from cheapest to most expensive: wireframe is fastest, solid is light, material preview is moderate, and rendered is heaviest. A cost bar grows across the four, showing that dropping to solid or wireframe while modeling reclaims the most viewport speed.</desc>
<style>
.title{font-size:15px;font-weight:700;}
.sub{font-size:11.5px;fill:#c8c8c8;}
.cardbg{fill:#2a2a2a;}
.cap{font-size:12px;font-weight:600;fill:#c8c8c8;}
.lab{font-size:11px;font-weight:700;fill:#1e1e1e;}
</style>
<text class="cap" x="40" y="40">Cheapest / fastest</text>
<text class="cap" x="720" y="40" text-anchor="end">Costliest / slowest</text>
<line x1="40" y1="52" x2="720" y2="52" stroke="#8a8a8a" stroke-width="2" marker-end="url(#a3)"/>
<defs><marker id="a3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8a8a8a"/></marker></defs>
<g>
<rect class="cardbg" x="40" y="80" width="150" height="150" rx="10" stroke="#4ADE80" stroke-width="2"/>
<rect x="60" y="104" width="110" height="70" rx="4" fill="none" stroke="#4ADE80" stroke-width="1.5"/>
<path d="M60,104 L170,174 M170,104 L60,174 M115,104 L115,174 M60,139 L170,139" stroke="#4ADE80" stroke-width="1"/>
<text class="title" x="115" y="198" text-anchor="middle" fill="#4ADE80">Wireframe</text>
<text class="sub" x="115" y="218" text-anchor="middle">edges only</text>
</g>
<g>
<rect class="cardbg" x="210" y="80" width="150" height="150" rx="10" stroke="#4A9EFF" stroke-width="2"/>
<rect x="230" y="104" width="110" height="70" rx="4" fill="#4A9EFF" opacity="0.55"/>
<text class="title" x="285" y="198" text-anchor="middle" fill="#4A9EFF">Solid</text>
<text class="sub" x="285" y="218" text-anchor="middle">flat shading</text>
</g>
<g>
<rect class="cardbg" x="380" y="80" width="150" height="150" rx="10" stroke="#F5C242" stroke-width="2"/>
<rect x="400" y="104" width="110" height="70" rx="4" fill="#F5C242" opacity="0.6"/>
<circle cx="455" cy="139" r="24" fill="#2a2a2a" opacity="0.5"/>
<text class="title" x="455" y="198" text-anchor="middle" fill="#F5C242">Material</text>
<text class="sub" x="455" y="218" text-anchor="middle">preview textures</text>
</g>
<g>
<rect class="cardbg" x="550" y="80" width="150" height="150" rx="10" stroke="#E63946" stroke-width="2"/>
<rect x="570" y="104" width="110" height="70" rx="4" fill="#E63946" opacity="0.55"/>
<circle cx="600" cy="126" r="10" fill="#F5C242" opacity="0.9"/>
<path d="M570,174 L610,140 L640,160 L680,120 L680,174 Z" fill="#2a2a2a" opacity="0.45"/>
<text class="title" x="625" y="198" text-anchor="middle" fill="#E63946">Rendered</text>
<text class="sub" x="625" y="218" text-anchor="middle">full lights + shadows</text>
</g>
<text class="cap" x="380" y="266" text-anchor="middle">Relative viewport cost</text>
<rect x="40" y="278" width="660" height="26" rx="13" fill="#2a2a2a"/>
<rect x="40" y="278" width="90" height="26" rx="13" fill="#4ADE80"/>
<rect x="130" y="278" width="120" height="26" fill="#4A9EFF"/>
<rect x="250" y="278" width="200" height="26" fill="#F5C242"/>
<rect x="450" y="278" width="250" height="26" rx="0" fill="#E63946"/>
<rect x="686" y="278" width="14" height="26" rx="7" fill="#E63946"/>
<text class="lab" x="85" y="296" text-anchor="middle">1&#215;</text>
<text class="lab" x="190" y="296" text-anchor="middle">2&#215;</text>
<text class="lab" x="350" y="296" text-anchor="middle">4&#215;</text>
<text class="lab" x="575" y="296" text-anchor="middle">8&#215;+</text>
<text class="sub" x="380" y="338" text-anchor="middle">Model in Solid or Wireframe; switch to Rendered only to check the final look.</text>
</svg>
