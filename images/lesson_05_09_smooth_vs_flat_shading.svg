<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="sf-title sf-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" color="#222">
  <title id="sf-title">Flat shading versus smooth shading</title>
  <desc id="sf-desc">A two-panel comparison of the same low-poly sphere rendered with two different shading modes. The left panel labeled FLAT SHADING shows a 12-sided polygon silhouette with sharp facet edges and twelve green normal arrows projecting perpendicularly outward from the midpoint of each facet, illustrating how each face uses its own normal. The right panel labeled SMOOTH SHADING shows the same 12-sided silhouette with very faint edges and a smooth radial gradient fill, with twelve green vertex-normal arrows projecting radially outward from each vertex, illustrating how vertex normals are averaged across adjacent faces to produce the illusion of a smooth surface. The two panels are separated by a dashed vertical divider with a small vs badge at the center. A footer tip notes that the geometry does not change between modes; only how the renderer interprets normals changes.</desc>

  <defs>
    <marker id="sf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4ADE80"/>
    </marker>
    <radialGradient id="sf-smooth-grad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#FF6B00" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0.02"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <text x="400" y="56" text-anchor="middle" font-size="24" font-weight="700" fill="currentColor">FLAT vs SMOOTH SHADING</text>
  <text x="400" y="84" text-anchor="middle" font-size="14" fill="currentColor" opacity="0.65">Same low-poly geometry, two ways of interpreting normals</text>
  <line x1="120" y1="108" x2="680" y2="108" stroke="currentColor" stroke-width="1" stroke-opacity="0.25"/>
  <text x="400" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#FF6B00" letter-spacing="2">PER-FACE NORMALS vs AVERAGED VERTEX NORMALS</text>

  <!-- Panel 1: Flat shading -->
  <rect x="40" y="170" width="300" height="290" rx="8" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>
  <text x="190" y="195" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">FLAT SHADING</text>

  <!-- 12-gon silhouette with sharp facet edges -->
  <polygon points="190,235 225,244 251,270 260,305 251,340 225,366 190,375 155,366 129,340 120,305 129,270 155,244" fill="#FF6B00" fill-opacity="0.07" stroke="currentColor" stroke-width="1.8" stroke-opacity="0.85"/>

  <!-- Per-face normal arrows (green), 12 faces, length 20 outward from face midpoint -->
  <line x1="208" y1="240" x2="213" y2="220" stroke="#4ADE80" stroke-width="1.8" marker-end="url(#sf-arrow)"/>
  <line x1="238" y1="257" x2="252" y2="243" stroke="#4ADE80" stroke-width="1.8" marker-end="url(#sf-arrow)"/>
  <line x1="255" y1="288" x2="275" y2="282" stroke="#4ADE80" stroke-width="1.8" marker-end="url(#sf-arrow)"/>
  <line x1="255" y1="322" x2="275" y2="328" stroke="#4ADE80" stroke-width="1.8" marker-end="url(#sf-arrow)"/>
  <line x1="238" y1="353" x2="252" y2="367" stroke="#4ADE80" stroke-width="1.8" marker-end="url(#sf-arrow)"/>
  <line x1="208" y1="370" x2="213" y2="390" stroke="#4ADE80" stroke-width="1.8" marker-end="url(#sf-arrow)"/>
  <line x1="173" y1="370" x2="167" y2="390" stroke="#4ADE80" stroke-width="1.8" marker-end="url(#sf-arrow)"/>
  <line x1="142" y1="353" x2="128" y2="367" stroke="#4ADE80" stroke-width="1.8" marker-end="url(#sf-arrow)"/>
  <line x1="125" y1="322" x2="105" y2="328" stroke="#4ADE80" stroke-width="1.8" marker-end="url(#sf-arrow)"/>
  <line x1="125" y1="288" x2="105" y2="282" stroke="#4ADE80" stroke-width="1.8" marker-end="url(#sf-arrow)"/>
  <line x1="142" y1="257" x2="128" y2="243" stroke="#4ADE80" stroke-width="1.8" marker-end="url(#sf-arrow)"/>
  <line x1="173" y1="240" x2="167" y2="220" stroke="#4ADE80" stroke-width="1.8" marker-end="url(#sf-arrow)"/>

  <!-- Vertex dots -->
  <circle cx="190" cy="235" r="3" fill="#FF6B00"/>
  <circle cx="225" cy="244" r="3" fill="#FF6B00"/>
  <circle cx="251" cy="270" r="3" fill="#FF6B00"/>
  <circle cx="260" cy="305" r="3" fill="#FF6B00"/>
  <circle cx="251" cy="340" r="3" fill="#FF6B00"/>
  <circle cx="225" cy="366" r="3" fill="#FF6B00"/>
  <circle cx="190" cy="375" r="3" fill="#FF6B00"/>
  <circle cx="155" cy="366" r="3" fill="#FF6B00"/>
  <circle cx="129" cy="340" r="3" fill="#FF6B00"/>
  <circle cx="120" cy="305" r="3" fill="#FF6B00"/>
  <circle cx="129" cy="270" r="3" fill="#FF6B00"/>
  <circle cx="155" cy="244" r="3" fill="#FF6B00"/>

  <!-- Footer for flat panel -->
  <text x="190" y="416" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.75">Each face uses its own normal</text>
  <text x="190" y="442" text-anchor="middle" font-size="11" font-style="italic" fill="currentColor" opacity="0.6">Hard surface · mechanical · stylized</text>

  <!-- Panel 2: Smooth shading -->
  <rect x="460" y="170" width="300" height="290" rx="8" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>
  <text x="610" y="195" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">SMOOTH SHADING</text>

  <!-- 12-gon silhouette with faint edges, smooth radial gradient fill -->
  <polygon points="610,235 645,244 671,270 680,305 671,340 645,366 610,375 575,366 549,340 540,305 549,270 575,244" fill="url(#sf-smooth-grad)" stroke="currentColor" stroke-width="0.6" stroke-opacity="0.25"/>
  <!-- Suggestive outer "smooth" circle reinforcing the rounded appearance -->
  <circle cx="610" cy="305" r="70" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.55"/>

  <!-- Per-vertex normal arrows (green), 12 vertices, length 20 outward -->
  <line x1="610" y1="235" x2="610" y2="215" stroke="#4ADE80" stroke-width="1.8" marker-end="url(#sf-arrow)"/>
  <line x1="645" y1="244" x2="655" y2="227" stroke="#4ADE80" stroke-width="1.8" marker-end="url(#sf-arrow)"/>
  <line x1="671" y1="270" x2="688" y2="260" stroke="#4ADE80" stroke-width="1.8" marker-end="url(#sf-arrow)"/>
  <line x1="680" y1="305" x2="700" y2="305" stroke="#4ADE80" stroke-width="1.8" marker-end="url(#sf-arrow)"/>
  <line x1="671" y1="340" x2="688" y2="350" stroke="#4ADE80" stroke-width="1.8" marker-end="url(#sf-arrow)"/>
  <line x1="645" y1="366" x2="655" y2="383" stroke="#4ADE80" stroke-width="1.8" marker-end="url(#sf-arrow)"/>
  <line x1="610" y1="375" x2="610" y2="395" stroke="#4ADE80" stroke-width="1.8" marker-end="url(#sf-arrow)"/>
  <line x1="575" y1="366" x2="565" y2="383" stroke="#4ADE80" stroke-width="1.8" marker-end="url(#sf-arrow)"/>
  <line x1="549" y1="340" x2="532" y2="350" stroke="#4ADE80" stroke-width="1.8" marker-end="url(#sf-arrow)"/>
  <line x1="540" y1="305" x2="520" y2="305" stroke="#4ADE80" stroke-width="1.8" marker-end="url(#sf-arrow)"/>
  <line x1="549" y1="270" x2="532" y2="260" stroke="#4ADE80" stroke-width="1.8" marker-end="url(#sf-arrow)"/>
  <line x1="575" y1="244" x2="565" y2="227" stroke="#4ADE80" stroke-width="1.8" marker-end="url(#sf-arrow)"/>

  <!-- Vertex dots (smaller, slightly muted to emphasize smooth fill) -->
  <circle cx="610" cy="235" r="2.5" fill="#FF6B00" fill-opacity="0.7"/>
  <circle cx="645" cy="244" r="2.5" fill="#FF6B00" fill-opacity="0.7"/>
  <circle cx="671" cy="270" r="2.5" fill="#FF6B00" fill-opacity="0.7"/>
  <circle cx="680" cy="305" r="2.5" fill="#FF6B00" fill-opacity="0.7"/>
  <circle cx="671" cy="340" r="2.5" fill="#FF6B00" fill-opacity="0.7"/>
  <circle cx="645" cy="366" r="2.5" fill="#FF6B00" fill-opacity="0.7"/>
  <circle cx="610" cy="375" r="2.5" fill="#FF6B00" fill-opacity="0.7"/>
  <circle cx="575" cy="366" r="2.5" fill="#FF6B00" fill-opacity="0.7"/>
  <circle cx="549" cy="340" r="2.5" fill="#FF6B00" fill-opacity="0.7"/>
  <circle cx="540" cy="305" r="2.5" fill="#FF6B00" fill-opacity="0.7"/>
  <circle cx="549" cy="270" r="2.5" fill="#FF6B00" fill-opacity="0.7"/>
  <circle cx="575" cy="244" r="2.5" fill="#FF6B00" fill-opacity="0.7"/>

  <!-- Footer for smooth panel -->
  <text x="610" y="416" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.75">Vertex normals averaged across faces</text>
  <text x="610" y="442" text-anchor="middle" font-size="11" font-style="italic" fill="currentColor" opacity="0.6">Organic · characters · rounded</text>

  <!-- Center dashed divider, split around vs badge -->
  <line x1="400" y1="210" x2="400" y2="280" stroke="currentColor" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 6"/>
  <line x1="400" y1="330" x2="400" y2="430" stroke="currentColor" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 6"/>
  <!-- vs badge -->
  <circle cx="400" cy="305" r="20" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1" stroke-opacity="0.4"/>
  <text x="400" y="310" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor" opacity="0.7">vs</text>

  <!-- Italic takeaway -->
  <text x="400" y="478" text-anchor="middle" font-size="13" font-style="italic" fill="currentColor" opacity="0.75">Geometry does not change. Only the renderer's interpretation does.</text>

  <!-- Footer tip -->
  <rect x="40" y="506" width="720" height="34" rx="6" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="527" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Right-click in Object Mode and pick Shade Smooth or Shade Flat. Most organic models use Smooth; hard-surface models often combine both.</text>
</svg>
