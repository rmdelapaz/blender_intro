<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="mo-title mo-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="mo-title">Three-Button Mouse for Blender Navigation</title>
  <desc id="mo-desc">A top-down diagram of a three-button mouse with a scroll wheel, showing the role of each button in Blender. The left button performs primary clicks for selecting objects. The middle button and scroll wheel orbit, pan, and zoom the 3D viewport, and are essential for Blender navigation. The right button opens context menus and cancels operations.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Why You Need a Three-Button Mouse</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Blender&#8217;s navigation is built around three buttons and a scroll wheel.</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ===== Mouse illustration centered at (400, 320) ===== -->

  <!-- Mouse body outline -->
  <path d="M 400 215
           C 455 215, 478 280, 478 325
           C 478 385, 460 425, 400 425
           C 340 425, 322 385, 322 325
           C 322 280, 345 215, 400 215 Z"
        fill="none" stroke="currentColor" stroke-width="2" opacity="0.85"/>

  <!-- Button divider: vertical line from top of mouse to wheel, around wheel, to button base -->
  <g stroke="currentColor" stroke-width="1.4" opacity="0.45" fill="none">
    <line x1="400" y1="217" x2="400" y2="240"/>
    <line x1="400" y1="278" x2="400" y2="300"/>
    <!-- Horizontal divider below buttons -->
    <path d="M 332 300 Q 400 305 468 300"/>
  </g>

  <!-- Scroll wheel (Blender orange to emphasize) -->
  <rect x="392" y="240" width="16" height="38" rx="3" fill="#FF6B00"/>
  <g stroke="#fff" stroke-width="0.8" opacity="0.75">
    <line x1="394" y1="248" x2="406" y2="248"/>
    <line x1="394" y1="256" x2="406" y2="256"/>
    <line x1="394" y1="264" x2="406" y2="264"/>
    <line x1="394" y1="272" x2="406" y2="272"/>
  </g>

  <!-- ===== Annotation: Left Click (left side) ===== -->
  <text x="70" y="245" font-size="15" font-weight="700" fill="currentColor">Left Click</text>
  <text x="70" y="265" font-size="13" fill="currentColor" opacity="0.65">Select objects,</text>
  <text x="70" y="282" font-size="13" fill="currentColor" opacity="0.65">activate tools</text>
  <g stroke="currentColor" stroke-width="1.4" opacity="0.4" fill="none">
    <path d="M 195 258 Q 270 258, 345 258"/>
  </g>
  <circle cx="345" cy="258" r="3" fill="currentColor" opacity="0.5"/>

  <!-- ===== Annotation: Middle / Scroll Wheel (right side, upper) ===== -->
  <text x="540" y="215" font-size="15" font-weight="700" fill="#FF6B00">Middle Click + Scroll</text>
  <text x="540" y="235" font-size="13" fill="currentColor" opacity="0.75">Orbit, pan, and zoom</text>
  <text x="540" y="252" font-size="13" fill="currentColor" opacity="0.75">the 3D viewport</text>
  <text x="540" y="276" font-size="12" font-style="italic" fill="#FF6B00" opacity="0.85">Essential for Blender</text>
  <g stroke="#FF6B00" stroke-width="1.4" opacity="0.55" fill="none">
    <path d="M 535 244 Q 480 244, 420 258"/>
  </g>
  <circle cx="420" cy="258" r="3.5" fill="#FF6B00"/>

  <!-- ===== Annotation: Right Click (right side, lower) ===== -->
  <text x="540" y="365" font-size="15" font-weight="700" fill="currentColor">Right Click</text>
  <text x="540" y="385" font-size="13" fill="currentColor" opacity="0.65">Context menus,</text>
  <text x="540" y="402" font-size="13" fill="currentColor" opacity="0.65">cancel operations</text>
  <g stroke="currentColor" stroke-width="1.4" opacity="0.4" fill="none">
    <path d="M 535 376 Q 490 376, 450 290"/>
  </g>
  <circle cx="450" cy="290" r="3" fill="currentColor" opacity="0.5"/>

  <!-- ===== Annotation: Mouse body (cosmetic, bottom-left) ===== -->
  <text x="160" y="395" font-size="12" font-style="italic" fill="currentColor" opacity="0.55">A three-button mouse</text>
  <text x="160" y="410" font-size="12" font-style="italic" fill="currentColor" opacity="0.55">isn&#8217;t a luxury here &#8212;</text>
  <text x="160" y="425" font-size="12" font-style="italic" fill="currentColor" opacity="0.55">it&#8217;s how Blender expects</text>
  <text x="160" y="440" font-size="12" font-style="italic" fill="currentColor" opacity="0.55">you to navigate.</text>

  <!-- Footer tip -->
  <rect x="40" y="506" width="720" height="34" rx="6" fill="#FF6B00" fill-opacity="0.10" stroke="#FF6B00" stroke-opacity="0.4"/>
  <text x="54" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> On a trackpad? Turn on &#8220;Emulate 3 Button Mouse&#8221; in Preferences &#8594; Input.
  </text>
</svg>
