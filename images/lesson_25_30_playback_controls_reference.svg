<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="pc-title pc-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="pc-title">Playback controls visual reference</title>
  <desc id="pc-desc">A labeled diagram of Blender's Timeline playback control bar. From left to right: jump to start, step backward one frame, play or pause, step forward one frame, and jump to end. Each button shows its keyboard shortcut: Shift plus left arrow, left arrow, spacebar, right arrow, and Shift plus right arrow.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Playback Controls</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">The transport bar at the bottom of the Timeline</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Button bar background -->
  <rect x="120" y="220" width="560" height="80" rx="12" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.12" stroke-width="1"/>

  <!-- 5 buttons centered at x = 184, 304, 400, 496, 616 ; bar center y = 260 -->
  <!-- Button 1: Jump to start |< -->
  <g fill="#FF6B00">
    <rect x="166" y="252" width="3.5" height="16" rx="1"/>
    <path d="M 184 252 L 172 260 L 184 268 Z"/>
    <path d="M 196 252 L 184 260 L 196 268 Z"/>
  </g>
  <!-- Button 2: Step back << -->
  <g fill="#FF6B00">
    <path d="M 304 252 L 292 260 L 304 268 Z"/>
    <path d="M 316 252 L 304 260 L 316 268 Z"/>
  </g>
  <!-- Button 3: Play (bigger, emphasized) -->
  <circle cx="400" cy="260" r="26" fill="#FF6B00"/>
  <path d="M 392 247 L 414 260 L 392 273 Z" fill="#ffffff"/>
  <!-- Button 4: Step forward >> -->
  <g fill="#FF6B00">
    <path d="M 484 252 L 496 260 L 484 268 Z"/>
    <path d="M 496 252 L 508 260 L 496 268 Z"/>
  </g>
  <!-- Button 5: Jump to end >| -->
  <g fill="#FF6B00">
    <path d="M 604 252 L 616 260 L 604 268 Z"/>
    <path d="M 616 252 L 628 260 L 616 268 Z"/>
    <rect x="630.5" y="252" width="3.5" height="16" rx="1"/>
  </g>

  <!-- Labels above each button -->
  <g text-anchor="middle">
    <text x="184" y="190" font-size="12" font-weight="600" fill="currentColor">Jump to Start</text>
    <text x="304" y="190" font-size="12" font-weight="600" fill="currentColor">Prev Frame</text>
    <text x="400" y="184" font-size="14" font-weight="700" fill="currentColor">Play / Pause</text>
    <text x="496" y="190" font-size="12" font-weight="600" fill="currentColor">Next Frame</text>
    <text x="616" y="190" font-size="12" font-weight="600" fill="currentColor">Jump to End</text>
  </g>

  <!-- Shortcut chips below each button -->
  <g text-anchor="middle">
    <text x="184" y="346" font-size="12" fill="#FF6B00" font-weight="700">Shift + &#8592;</text>
    <text x="304" y="346" font-size="12" fill="#FF6B00" font-weight="700">&#8592;</text>
    <text x="400" y="346" font-size="12" fill="#FF6B00" font-weight="700">Spacebar</text>
    <text x="496" y="346" font-size="12" fill="#FF6B00" font-weight="700">&#8594;</text>
    <text x="616" y="346" font-size="12" fill="#FF6B00" font-weight="700">Shift + &#8594;</text>
  </g>

  <!-- leader ticks from label to button -->
  <g stroke="currentColor" opacity="0.2" stroke-width="1">
    <line x1="184" y1="198" x2="184" y2="234"/>
    <line x1="304" y1="198" x2="304" y2="234"/>
    <line x1="496" y1="198" x2="496" y2="234"/>
    <line x1="616" y1="198" x2="616" y2="234"/>
  </g>

  <!-- secondary note -->
  <text x="400" y="400" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">To the right of these sit the loop toggle and playback-sync options.</text>

  <!-- Footer tip (Variant B left rail) -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Spacebar is the one to memorize. It starts and stops playback no matter where your cursor sits in the Timeline.
  </text>
</svg>
