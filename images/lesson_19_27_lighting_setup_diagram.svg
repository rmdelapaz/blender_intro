<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="lsd-title lsd-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="lsd-title">Top-down three-point lighting setup</title>
  <desc id="lsd-desc">A top-down floor plan. The subject sits at the center with the camera below it. A bright key light sits front-left at about 45 degrees, a softer fill light front-right opposite the key, and a rim light behind the subject. Arrows point from each light toward the subject.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Three-Point Lighting (Top-Down View)</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Key · Fill · Rim · the classic setup for showing form</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ground reference ring -->
  <ellipse cx="400" cy="320" rx="250" ry="160" fill="none" stroke="currentColor" stroke-width="1" opacity="0.12" stroke-dasharray="5 6"/>

  <!-- ===== Subject (center) ===== -->
  <circle cx="400" cy="320" r="30" fill="#FF6B00" opacity="0.85"/>
  <text x="400" y="325" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Subject</text>

  <!-- ===== Camera (front / below) ===== -->
  <g>
    <rect x="372" y="470" width="56" height="34" rx="5" fill="currentColor" opacity="0.75"/>
    <polygon points="428,478 452,470 452,504 428,496" fill="currentColor" opacity="0.75"/>
    <text x="400" y="492" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">CAM</text>
    <!-- sight line to subject -->
    <line x1="400" y1="470" x2="400" y2="352" stroke="currentColor" stroke-width="1" opacity="0.3" stroke-dasharray="4 5"/>
  </g>

  <!-- ===== Key light (front-left, ~45 deg) ===== -->
  <g>
    <circle cx="170" cy="180" r="26" fill="#FF6B00"/>
    <text x="170" y="185" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">KEY</text>
    <line x1="192" y1="198" x2="378" y2="306" stroke="#FF6B00" stroke-width="3" stroke-linecap="round"/>
    <polygon points="378,306 360,298 364,314" fill="#FF6B00"/>
    <text x="150" y="150" text-anchor="middle" font-size="13" fill="currentColor">Key light</text>
    <text x="150" y="232" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">Brightest · 45&#176; front-left</text>
  </g>

  <!-- ===== Fill light (front-right, opposite key) ===== -->
  <g>
    <circle cx="630" cy="180" r="26" fill="#4A9EFF"/>
    <text x="630" y="185" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">FILL</text>
    <line x1="608" y1="198" x2="422" y2="306" stroke="#4A9EFF" stroke-width="3" stroke-linecap="round"/>
    <polygon points="422,306 436,314 440,298" fill="#4A9EFF"/>
    <text x="650" y="150" text-anchor="middle" font-size="13" fill="currentColor">Fill light</text>
    <text x="650" y="232" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">Softer · opposite the key</text>
  </g>

  <!-- ===== Rim light (behind subject) ===== -->
  <g>
    <circle cx="400" cy="110" r="26" fill="#B47EE8"/>
    <text x="400" y="115" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">RIM</text>
    <line x1="400" y1="136" x2="400" y2="288" stroke="#B47EE8" stroke-width="3" stroke-linecap="round"/>
    <polygon points="400,288 392,272 408,272" fill="#B47EE8"/>
    <text x="400" y="166" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">Behind · separates from background</text>
  </g>

  <!-- legend -->
  <g font-size="13" fill="currentColor">
    <circle cx="48" cy="470" r="7" fill="#FF6B00"/>
    <text x="62" y="474" opacity="0.8">Key</text>
    <circle cx="130" cy="470" r="7" fill="#4A9EFF"/>
    <text x="144" y="474" opacity="0.8">Fill</text>
    <circle cx="210" cy="470" r="7" fill="#B47EE8"/>
    <text x="224" y="474" opacity="0.8">Rim</text>
  </g>

  <!-- Footer tip (Variant B) -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Set the key first and judge it alone, then add the fill to open the shadows, and add the rim last.</text>
</svg>
