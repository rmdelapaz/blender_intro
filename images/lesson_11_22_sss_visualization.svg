<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="sv-title sv-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="sv-title">Subsurface scattering cross-section</title>
  <desc id="sv-desc">Cross-section of a translucent material. Light enters the top surface, scatters randomly inside, some of it is absorbed, and the rest exits the surface several millimeters away from where it entered. The lateral distance between entry and exit is the scattering radius.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">SUBSURFACE SCATTERING</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Light enters, scatters inside, and exits offset from its entry point</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ===== Material slab cross-section ===== -->
  <!-- Translucent peach body: top surface at y=210, bottom at y=440 -->
  <rect x="80" y="210" width="640" height="230" rx="6"
        fill="#F5C242" fill-opacity="0.16" stroke="#F5C242" stroke-opacity="0.55" stroke-width="2"/>
  <!-- Top surface line (the air/material interface) -->
  <line x1="80" y1="210" x2="720" y2="210" stroke="currentColor" stroke-width="2" opacity="0.4"/>
  <text x="92" y="232" font-size="13" fill="currentColor" opacity="0.6">Translucent material (skin, wax, marble)</text>

  <!-- ===== Incoming rays (gold) ===== -->
  <g stroke="#F5C242" stroke-width="3" stroke-linecap="round">
    <line x1="150" y1="120" x2="220" y2="210"/>
    <line x1="240" y1="120" x2="300" y2="210"/>
  </g>
  <g fill="#F5C242">
    <polygon points="220,210 212,196 228,198"/>
    <polygon points="300,210 292,196 308,198"/>
  </g>
  <text x="120" y="150" font-size="13" font-weight="600" fill="#F5C242">Incoming light</text>

  <!-- ===== Entry marker ===== -->
  <circle cx="220" cy="210" r="6" fill="#FF6B00"/>
  <circle cx="300" cy="210" r="4.5" fill="#FF6B00" opacity="0.85"/>
  <text x="150" y="186" font-size="12" font-weight="600" fill="currentColor">Entry point</text>

  <!-- ===== Internal scattering paths (orange squiggle) ===== -->
  <!-- Main path: enters at x220, wanders right, exits at x540 -->
  <path d="M 220 210 Q 250 270 300 280 T 380 320 Q 430 350 470 300 T 540 280 Q 555 250 540 210"
        fill="none" stroke="#FF6B00" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Secondary scatter branch off the main path -->
  <path d="M 300 280 Q 320 330 360 360 Q 400 385 430 360"
        fill="none" stroke="#FF6B00" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
  <!-- Second photon: enters at x300, dips and merges into the main path near x380 -->
  <path d="M 300 210 Q 318 250 345 285 Q 365 308 380 320"
        fill="none" stroke="#FF6B00" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <!-- Small bounce dots along the paths -->
  <g fill="#FF6B00">
    <circle cx="300" cy="280" r="3.5"/>
    <circle cx="380" cy="320" r="3.5"/>
    <circle cx="470" cy="300" r="3.5"/>
    <circle cx="430" cy="360" r="3"/>
  </g>
  <text x="350" y="270" font-size="13" font-weight="600" fill="#FF6B00" text-anchor="middle">Internal scattering</text>

  <!-- ===== Absorbed ray (red X) ===== -->
  <path d="M 240 210 Q 250 250 270 275 Q 290 300 285 335"
        fill="none" stroke="#E63946" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <g stroke="#E63946" stroke-width="3" stroke-linecap="round">
    <line x1="276" y1="345" x2="294" y2="363"/>
    <line x1="294" y1="345" x2="276" y2="363"/>
  </g>
  <text x="305" y="360" font-size="12" font-weight="600" fill="#E63946">Absorbed</text>

  <!-- ===== Exit point + exiting rays (green) ===== -->
  <circle cx="540" cy="210" r="6" fill="#4ADE80"/>
  <g stroke="#4ADE80" stroke-width="3" stroke-linecap="round">
    <line x1="540" y1="210" x2="540" y2="120"/>
    <line x1="540" y1="210" x2="600" y2="135"/>
  </g>
  <g fill="#4ADE80">
    <polygon points="540,120 532,134 548,134"/>
    <polygon points="600,135 588,140 596,150"/>
  </g>
  <text x="556" y="186" font-size="12" font-weight="600" fill="currentColor">Exit point</text>
  <text x="620" y="120" font-size="13" font-weight="600" fill="#4ADE80">Diffuse exit</text>

  <!-- ===== Scattering radius indicator (entry x220 to exit x540) ===== -->
  <line x1="220" y1="470" x2="540" y2="470" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
  <line x1="220" y1="462" x2="220" y2="478" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
  <line x1="540" y1="462" x2="540" y2="478" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
  <text x="380" y="494" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">Scattering radius</text>
  <text x="380" y="512" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">Exit lands several mm from entry</text>

  <!-- ===== Subsurface color tint note ===== -->
  <text x="640" y="330" font-size="12" font-weight="600" fill="#F5C242" text-anchor="middle">Subsurface</text>
  <text x="640" y="348" font-size="12" font-weight="600" fill="#F5C242" text-anchor="middle">color tint</text>

  <!-- ===== Footer tip (Variant B left rail) ===== -->
  <rect x="40" y="526" width="4" height="26" fill="#FF6B00"/>
  <text x="58" y="544" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Thin or backlit areas glow because light travels through and exits the far side.
  </text>
</svg>
