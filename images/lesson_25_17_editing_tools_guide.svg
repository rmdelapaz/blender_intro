<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="et-title et-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="et-title">Keyframe editing tools visual guide</title>
  <desc id="et-desc">A four-cell reference for keyframe editing operations in the Timeline. G grabs and moves keyframes. S scales their spacing to change timing. X deletes keyframes. Shift plus D duplicates them. A bottom row lists supplementary shortcuts: Ctrl C and Ctrl V copy and paste, T changes interpolation, and A selects all.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Keyframe Editing Tools</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">The core operations for reshaping animation in the Timeline</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- 2x2 grid cells: each 340 wide x 150 tall; gutters -->
  <!-- Cell A: G - Move (x40..380, y136..286) -->
  <rect x="40" y="136" width="340" height="150" rx="10" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.12" stroke-width="1"/>
  <rect x="64" y="160" width="48" height="44" rx="8" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-width="1.5"/>
  <text x="88" y="189" font-size="20" font-weight="700" fill="#FF6B00" text-anchor="middle">G</text>
  <text x="128" y="182" font-size="17" font-weight="600" fill="currentColor">Move / Grab</text>
  <text x="128" y="202" font-size="13" fill="currentColor" opacity="0.6">Slide keyframes along time</text>
  <!-- glyph: two diamonds with arrow -->
  <path d="M 110 248 L 120 258 L 110 268 L 100 258 Z" fill="#F5C242"/>
  <line x1="135" y1="258" x2="255" y2="258" stroke="#FF6B00" stroke-width="2.5" stroke-linecap="round" marker-end="url(#et-arrow)"/>
  <path d="M 290 248 L 300 258 L 290 268 L 280 258 Z" fill="#F5C242" opacity="0.45"/>

  <!-- Cell B: S - Scale (x420..760, y136..286) -->
  <rect x="420" y="136" width="340" height="150" rx="10" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.12" stroke-width="1"/>
  <rect x="444" y="160" width="48" height="44" rx="8" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-width="1.5"/>
  <text x="468" y="189" font-size="20" font-weight="700" fill="#FF6B00" text-anchor="middle">S</text>
  <text x="508" y="182" font-size="17" font-weight="600" fill="currentColor">Scale Timing</text>
  <text x="508" y="202" font-size="13" fill="currentColor" opacity="0.6">Spread or compress spacing</text>
  <!-- glyph: two diamonds spreading apart from center -->
  <path d="M 510 248 L 520 258 L 510 268 L 500 258 Z" fill="#F5C242"/>
  <path d="M 550 248 L 560 258 L 550 268 L 540 258 Z" fill="#F5C242"/>
  <line x1="495" y1="258" x2="462" y2="258" stroke="#FF6B00" stroke-width="2.5" stroke-linecap="round" marker-end="url(#et-arrow)"/>
  <line x1="565" y1="258" x2="598" y2="258" stroke="#FF6B00" stroke-width="2.5" stroke-linecap="round" marker-end="url(#et-arrow)"/>

  <!-- Cell C: X - Delete (x40..380, y302..452) -->
  <rect x="40" y="302" width="340" height="150" rx="10" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.12" stroke-width="1"/>
  <rect x="64" y="326" width="48" height="44" rx="8" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-width="1.5"/>
  <text x="88" y="355" font-size="20" font-weight="700" fill="#FF6B00" text-anchor="middle">X</text>
  <text x="128" y="348" font-size="17" font-weight="600" fill="currentColor">Delete</text>
  <text x="128" y="368" font-size="13" fill="currentColor" opacity="0.6">Remove selected keyframes</text>
  <!-- glyph: diamond with red cross -->
  <path d="M 150 414 L 160 424 L 150 434 L 140 424 Z" fill="#F5C242" opacity="0.7"/>
  <g stroke="#E63946" stroke-width="3" stroke-linecap="round">
    <line x1="140" y1="414" x2="160" y2="434"/>
    <line x1="160" y1="414" x2="140" y2="434"/>
  </g>

  <!-- Cell D: Shift+D - Duplicate (x420..760, y302..452) -->
  <rect x="420" y="302" width="340" height="150" rx="10" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.12" stroke-width="1"/>
  <rect x="444" y="326" width="74" height="44" rx="8" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-width="1.5"/>
  <text x="481" y="354" font-size="13" font-weight="700" fill="#FF6B00" text-anchor="middle">Shift</text>
  <text x="528" y="354" font-size="16" font-weight="700" fill="currentColor" opacity="0.4">+</text>
  <rect x="544" y="326" width="48" height="44" rx="8" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-width="1.5"/>
  <text x="568" y="355" font-size="20" font-weight="700" fill="#FF6B00" text-anchor="middle">D</text>
  <text x="610" y="348" font-size="17" font-weight="600" fill="currentColor">Duplicate</text>
  <text x="610" y="368" font-size="13" fill="currentColor" opacity="0.6">Copy selected keyframes</text>
  <!-- glyph: diamond copied -->
  <path d="M 470 414 L 480 424 L 470 434 L 460 424 Z" fill="#F5C242"/>
  <path d="M 510 414 L 520 424 L 510 434 L 500 424 Z" fill="#F5C242" opacity="0.45"/>
  <path d="M 530 414 L 540 424 L 530 434 L 520 424 Z" fill="#F5C242" opacity="0.45"/>

  <!-- Supplementary shortcuts row -->
  <line x1="40" y1="486" x2="760" y2="486" stroke="currentColor" stroke-width="1" opacity="0.15"/>
  <text x="40" y="516" font-size="14" font-weight="600" fill="currentColor">Also useful</text>

  <rect x="40" y="530" width="92" height="36" rx="8" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-width="1.5"/>
  <text x="86" y="554" font-size="13" font-weight="700" fill="#FF6B00" text-anchor="middle">Ctrl C / V</text>
  <text x="142" y="553" font-size="13" fill="currentColor" opacity="0.6">Copy / paste</text>

  <rect x="270" y="530" width="48" height="36" rx="8" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-width="1.5"/>
  <text x="294" y="554" font-size="16" font-weight="700" fill="#FF6B00" text-anchor="middle">T</text>
  <text x="328" y="553" font-size="13" fill="currentColor" opacity="0.6">Change interpolation</text>

  <rect x="540" y="530" width="48" height="36" rx="8" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-width="1.5"/>
  <text x="564" y="554" font-size="16" font-weight="700" fill="#FF6B00" text-anchor="middle">A</text>
  <text x="598" y="553" font-size="13" fill="currentColor" opacity="0.6">Select all</text>

  <!-- arrowhead marker -->
  <defs>
    <marker id="et-arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#FF6B00"/>
    </marker>
  </defs>

  <!-- Footer tip (Variant B, 680 variant: y=641) -->
  <rect x="40" y="641" width="720" height="34" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> These are the same transform keys you use in the viewport, just acting on keyframes instead of objects.
  </text>
</svg>
