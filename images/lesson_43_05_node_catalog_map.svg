<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="ndx-title ndx-desc" color="#222" font-family="'Segoe UI',system-ui,sans-serif">
<title id="ndx-title">Compositor node catalog by category</title>
<desc id="ndx-desc">A reference map of the most-used compositor nodes grouped into five categories: Color (RGB Curves, Hue/Saturation, Bright/Contrast, Color Balance, Gamma, Exposure), Filter (Blur, Glare, Denoise, Sharpen, Dilate/Erode), Mix (Mix, Alpha Over, Z Combine), Converter (ColorRamp, RGB to BW, Set Alpha, Separate/Combine, Math), and Matte (ID Mask, Cryptomatte).</desc>
<rect x="0" y="0" width="900" height="620" fill="none"/>
<text x="450" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="currentColor">Compositor Node Catalog</text>
<text x="450" y="58" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.75">The nodes you reach for most, grouped by what they do</text>

<!-- 5 columns; each header uses a role hex, body nodes are currentColor chips -->
<!-- col geometry: x starts, width 160, gap 12 -->
<!-- COLOR col -->
<g>
  <rect x="24" y="80" width="164" height="34" rx="7" fill="#FF6B00"/>
  <text x="106" y="103" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">Color</text>
  <g font-size="12.5" fill="currentColor">
    <rect x="30" y="126" width="152" height="30" rx="5" fill="none" stroke="currentColor" stroke-width="1.3"/><text x="106" y="145" text-anchor="middle">RGB Curves</text>
    <rect x="30" y="164" width="152" height="30" rx="5" fill="none" stroke="currentColor" stroke-width="1.3"/><text x="106" y="183" text-anchor="middle">Hue / Saturation</text>
    <rect x="30" y="202" width="152" height="30" rx="5" fill="none" stroke="currentColor" stroke-width="1.3"/><text x="106" y="221" text-anchor="middle">Bright / Contrast</text>
    <rect x="30" y="240" width="152" height="30" rx="5" fill="none" stroke="currentColor" stroke-width="1.3"/><text x="106" y="259" text-anchor="middle">Color Balance</text>
    <rect x="30" y="278" width="152" height="30" rx="5" fill="none" stroke="currentColor" stroke-width="1.3"/><text x="106" y="297" text-anchor="middle">Gamma</text>
    <rect x="30" y="316" width="152" height="30" rx="5" fill="none" stroke="currentColor" stroke-width="1.3"/><text x="106" y="335" text-anchor="middle">Exposure</text>
  </g>
  <text x="106" y="368" text-anchor="middle" font-size="11" fill="#FF6B00">tone, grade, saturation</text>
</g>

<!-- FILTER col -->
<g>
  <rect x="200" y="80" width="164" height="34" rx="7" fill="#4A9EFF"/>
  <text x="282" y="103" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">Filter</text>
  <g font-size="12.5" fill="currentColor">
    <rect x="206" y="126" width="152" height="30" rx="5" fill="none" stroke="currentColor" stroke-width="1.3"/><text x="282" y="145" text-anchor="middle">Blur</text>
    <rect x="206" y="164" width="152" height="30" rx="5" fill="none" stroke="currentColor" stroke-width="1.3"/><text x="282" y="183" text-anchor="middle">Glare</text>
    <rect x="206" y="202" width="152" height="30" rx="5" fill="none" stroke="currentColor" stroke-width="1.3"/><text x="282" y="221" text-anchor="middle">Denoise</text>
    <rect x="206" y="240" width="152" height="30" rx="5" fill="none" stroke="currentColor" stroke-width="1.3"/><text x="282" y="259" text-anchor="middle">Filter (sharpen)</text>
    <rect x="206" y="278" width="152" height="30" rx="5" fill="none" stroke="currentColor" stroke-width="1.3"/><text x="282" y="297" text-anchor="middle">Dilate / Erode</text>
  </g>
  <text x="282" y="330" text-anchor="middle" font-size="11" fill="#4A9EFF">soften, glow, clean up</text>
</g>

<!-- MIX col -->
<g>
  <rect x="376" y="80" width="164" height="34" rx="7" fill="#4ADE80"/>
  <text x="458" y="103" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">Mix</text>
  <g font-size="12.5" fill="currentColor">
    <rect x="382" y="126" width="152" height="30" rx="5" fill="none" stroke="currentColor" stroke-width="1.3"/><text x="458" y="145" text-anchor="middle">Mix (blend modes)</text>
    <rect x="382" y="164" width="152" height="30" rx="5" fill="none" stroke="currentColor" stroke-width="1.3"/><text x="458" y="183" text-anchor="middle">Alpha Over</text>
    <rect x="382" y="202" width="152" height="30" rx="5" fill="none" stroke="currentColor" stroke-width="1.3"/><text x="458" y="221" text-anchor="middle">Z Combine</text>
  </g>
  <text x="458" y="254" text-anchor="middle" font-size="11" fill="#4ADE80">layer, composite, combine</text>
</g>

<!-- CONVERTER col -->
<g>
  <rect x="552" y="80" width="164" height="34" rx="7" fill="#F5C242"/>
  <text x="634" y="103" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">Converter</text>
  <g font-size="12.5" fill="currentColor">
    <rect x="558" y="126" width="152" height="30" rx="5" fill="none" stroke="currentColor" stroke-width="1.3"/><text x="634" y="145" text-anchor="middle">ColorRamp</text>
    <rect x="558" y="164" width="152" height="30" rx="5" fill="none" stroke="currentColor" stroke-width="1.3"/><text x="634" y="183" text-anchor="middle">RGB to BW</text>
    <rect x="558" y="202" width="152" height="30" rx="5" fill="none" stroke="currentColor" stroke-width="1.3"/><text x="634" y="221" text-anchor="middle">Set Alpha</text>
    <rect x="558" y="240" width="152" height="30" rx="5" fill="none" stroke="currentColor" stroke-width="1.3"/><text x="634" y="259" text-anchor="middle">Separate / Combine</text>
    <rect x="558" y="278" width="152" height="30" rx="5" fill="none" stroke="currentColor" stroke-width="1.3"/><text x="634" y="297" text-anchor="middle">Math</text>
  </g>
  <text x="634" y="330" text-anchor="middle" font-size="11" fill="#F5C242">reshape, split, remap data</text>
</g>

<!-- MATTE col -->
<g>
  <rect x="728" y="80" width="148" height="34" rx="7" fill="#B47EE8"/>
  <text x="802" y="103" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">Matte</text>
  <g font-size="12.5" fill="currentColor">
    <rect x="734" y="126" width="136" height="30" rx="5" fill="none" stroke="currentColor" stroke-width="1.3"/><text x="802" y="145" text-anchor="middle">ID Mask</text>
    <rect x="734" y="164" width="136" height="30" rx="5" fill="none" stroke="currentColor" stroke-width="1.3"/><text x="802" y="183" text-anchor="middle">Cryptomatte</text>
  </g>
  <text x="802" y="216" text-anchor="middle" font-size="11" fill="#B47EE8">isolate objects / materials</text>
</g>

<!-- bottom usage-pattern strip -->
<g>
  <rect x="24" y="400" width="852" height="196" rx="12" fill="#2a2a2a"/>
  <text x="46" y="430" font-size="15" font-weight="700" fill="#d4d4d4">Typical usage patterns</text>

  <g font-size="12.5" fill="#d4d4d4">
    <circle cx="52" cy="458" r="5" fill="#FF6B00"/>
    <text x="66" y="463">Fix exposure and white balance first with RGB Curves and Color Balance, then push a look.</text>

    <circle cx="52" cy="486" r="5" fill="#4A9EFF"/>
    <text x="66" y="491">Add Glare (Fog Glow) for bloom on emissive areas; Blur for soft focus or fake depth.</text>

    <circle cx="52" cy="514" r="5" fill="#4ADE80"/>
    <text x="66" y="519">Use Alpha Over to lay one image on another; Z Combine to merge two renders by depth.</text>

    <circle cx="52" cy="542" r="5" fill="#F5C242"/>
    <text x="66" y="547">Drive a factor with ColorRamp or Math to shape a pass before it controls a Mix.</text>

    <circle cx="52" cy="570" r="5" fill="#B47EE8"/>
    <text x="66" y="575">Isolate one object with ID Mask or Cryptomatte, then grade only that selection.</text>
  </g>
</g>
</svg>
