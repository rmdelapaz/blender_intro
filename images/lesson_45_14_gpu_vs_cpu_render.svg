<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t14 d14" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" color="#222">
<title id="t14">GPU vs CPU render device speed tiers</title>
<desc id="d14">Relative render-speed tiers: integrated GPU slowest, CPU mid, dedicated GPU fast, multi-GPU fastest, shown as lengthening speed bars.</desc>
<text x="320" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="currentColor">GPU vs CPU: Render Device Speed</text>
<text x="320" y="56" text-anchor="middle" font-size="13" fill="#4A9EFF">Relative time to finish the same frame &#8212; longer bar is faster</text>
<g font-size="13" fill="currentColor">
<text x="24" y="98" font-weight="600">Integrated GPU</text>
<rect x="180" y="86" width="80" height="18" rx="3" fill="#E63946"/>
<text x="270" y="99" font-size="12" fill="#E63946">1&#215; baseline</text>
<text x="24" y="146" font-weight="600">CPU (multi-core)</text>
<rect x="180" y="134" width="150" height="18" rx="3" fill="#F5C242"/>
<text x="340" y="147" font-size="12" fill="#F5C242">~2&#8211;3&#215;</text>
<text x="24" y="194" font-weight="600">Dedicated GPU</text>
<rect x="180" y="182" width="330" height="18" rx="3" fill="#4ADE80"/>
<text x="520" y="195" font-size="12" fill="#4ADE80">~5&#8211;8&#215;</text>
<text x="24" y="242" font-weight="600">Multi-GPU</text>
<rect x="180" y="230" width="430" height="18" rx="3" fill="#FF6B00"/>
<text x="180" y="268" font-size="12" fill="#FF6B00">~10&#215;+ &#8212; scales near-linearly per added GPU</text>
</g>
<line x1="180" y1="76" x2="180" y2="256" stroke="#4A9EFF" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
<rect x="24" y="292" width="592" height="46" rx="6" fill="#4A9EFF" opacity="0.12"/>
<text x="40" y="312" font-size="12" fill="currentColor">GPU (CUDA/OptiX/HIP) wins on parallel path-tracing; CPU stays useful for</text>
<text x="40" y="330" font-size="12" fill="currentColor">huge scenes that exceed VRAM. Match the device to scene size, not habit.</text>
</svg>
