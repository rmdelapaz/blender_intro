<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="npd-title npd-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#e8e8e8">
  <title id="npd-title">Common node tree patterns</title>
  <desc id="npd-desc">Four common ways nodes are arranged. A linear chain processes steps in sequence. Branching splits geometry into parallel paths that rejoin. Multi-input combines several sources into one node. Parameter control feeds a value node into a main geometry node.</desc>
  <defs>
    <marker id="npd-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="currentColor" fill-opacity="0.4"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Common node tree patterns</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Most trees are built from these four repeating shapes</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- divider -->
  <line x1="400" y1="150" x2="400" y2="600" stroke="currentColor" stroke-width="1" opacity="0.12"/>
  <line x1="40" y1="375" x2="760" y2="375" stroke="currentColor" stroke-width="1" opacity="0.12"/>

  <!-- TL Linear chain -->
  <text x="60" y="145" font-size="15" font-weight="600" fill="currentColor">Linear chain</text>
  <text x="60" y="165" font-size="12" fill="currentColor" opacity="0.6">Sequential processing</text>
  <rect x="60" y="210" width="84" height="34" rx="5" fill="#4ADE80" fill-opacity="0.12" stroke="#4ADE80" stroke-opacity="0.6" stroke-width="1.3"/><text x="102" y="231" text-anchor="middle" font-size="11" fill="currentColor">Node A</text> <rect x="178" y="210" width="84" height="34" rx="5" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.3"/><text x="220" y="231" text-anchor="middle" font-size="11" fill="currentColor">Node B</text> <rect x="296" y="210" width="84" height="34" rx="5" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.3"/><text x="338" y="231" text-anchor="middle" font-size="11" fill="currentColor">Node C</text>
  <line x1="144" y1="227" x2="178" y2="227" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.8" marker-end="url(#npd-arrow)"/> <line x1="262" y1="227" x2="296" y2="227" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.8" marker-end="url(#npd-arrow)"/>

  <!-- TR Branching -->
  <text x="420" y="145" font-size="15" font-weight="600" fill="currentColor">Branching</text>
  <text x="420" y="165" font-size="12" fill="currentColor" opacity="0.6">Parallel operations, then join</text>
  <rect x="420" y="250" width="80" height="34" rx="5" fill="#4ADE80" fill-opacity="0.12" stroke="#4ADE80" stroke-opacity="0.6" stroke-width="1.3"/><text x="460" y="271" text-anchor="middle" font-size="11" fill="currentColor">Input</text> <rect x="540" y="210" width="80" height="34" rx="5" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.3"/><text x="580" y="231" text-anchor="middle" font-size="11" fill="currentColor">Node B</text> <rect x="540" y="290" width="80" height="34" rx="5" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.3"/><text x="580" y="311" text-anchor="middle" font-size="11" fill="currentColor">Node C</text> <rect x="660" y="250" width="80" height="34" rx="5" fill="#F5C242" fill-opacity="0.14" stroke="#F5C242" stroke-opacity="0.7" stroke-width="1.3"/><text x="700" y="271" text-anchor="middle" font-size="11" fill="currentColor">Join</text>
  <line x1="500" y1="262" x2="540" y2="232" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.8" marker-end="url(#npd-arrow)"/> <line x1="500" y1="272" x2="540" y2="302" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.8" marker-end="url(#npd-arrow)"/> <line x1="620" y1="227" x2="660" y2="258" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.8" marker-end="url(#npd-arrow)"/> <line x1="620" y1="307" x2="660" y2="278" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.8" marker-end="url(#npd-arrow)"/>

  <!-- BL Multi-input -->
  <text x="60" y="405" font-size="15" font-weight="600" fill="currentColor">Multi-input</text>
  <text x="60" y="425" font-size="12" fill="currentColor" opacity="0.6">Combining sources</text>
  <rect x="60" y="440" width="80" height="34" rx="5" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.3"/><text x="100" y="461" text-anchor="middle" font-size="11" fill="currentColor">Source A</text> <rect x="60" y="510" width="80" height="34" rx="5" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.3"/><text x="100" y="531" text-anchor="middle" font-size="11" fill="currentColor">Source B</text> <rect x="200" y="475" width="84" height="34" rx="5" fill="#F5C242" fill-opacity="0.14" stroke="#F5C242" stroke-opacity="0.7" stroke-width="1.3"/><text x="242" y="496" text-anchor="middle" font-size="11" fill="currentColor">Combine</text>
  <line x1="140" y1="457" x2="200" y2="486" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.8" marker-end="url(#npd-arrow)"/> <line x1="140" y1="527" x2="200" y2="500" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.8" marker-end="url(#npd-arrow)"/>

  <!-- BR Parameter control -->
  <text x="420" y="405" font-size="15" font-weight="600" fill="currentColor">Parameter control</text>
  <text x="420" y="425" font-size="12" fill="currentColor" opacity="0.6">A value drives an operation</text>
  <rect x="420" y="455" width="96" height="34" rx="5" fill="#4ADE80" fill-opacity="0.12" stroke="#4ADE80" stroke-opacity="0.6" stroke-width="1.3"/><text x="468" y="476" text-anchor="middle" font-size="11" fill="currentColor">Geometry</text> <rect x="420" y="520" width="96" height="34" rx="5" fill="#4A9EFF" fill-opacity="0.12" stroke="#4A9EFF" stroke-opacity="0.6" stroke-width="1.3"/><text x="468" y="541" text-anchor="middle" font-size="11" fill="currentColor">Value</text> <rect x="576" y="485" width="96" height="34" rx="5" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.3"/><text x="624" y="506" text-anchor="middle" font-size="11" fill="currentColor">Main node</text>
  <line x1="516" y1="472" x2="576" y2="498" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.8" marker-end="url(#npd-arrow)"/> <line x1="516" y1="537" x2="576" y2="510" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.8" marker-end="url(#npd-arrow)"/>

  <rect x="40" y="641" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Real trees mix these: a linear chain with a branch that joins back is the everyday pattern.</text>
</svg>
