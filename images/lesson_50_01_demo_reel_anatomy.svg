<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="car01-title car01-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="car01-title">Anatomy of a Strong Demo Reel</title>
  <desc id="car01-desc">A demo reel laid out as a horizontal timeline: it opens with the strongest shot as a hook, moves through a body of varied showcase shots, and closes on a memorable final shot, all inside a short total runtime.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Anatomy of a Strong Demo Reel</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Lead with your best. Keep it short. End on a note they remember.</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <text x="40" y="150" font-size="18" font-weight="600" fill="currentColor">Reel timeline (target 30 to 90 seconds)</text>

  <g>
    <rect x="40" y="176" width="144" height="64" rx="6" fill="#FF6B00" opacity="0.9"/>
    <rect x="184" y="176" width="396" height="64" rx="6" fill="#4A9EFF" opacity="0.85"/>
    <rect x="580" y="176" width="180" height="64" rx="6" fill="#F5C242" opacity="0.9"/>
  </g>
  <text x="112" y="214" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1a14">HOOK</text>
  <text x="382" y="214" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1a14">BODY</text>
  <text x="670" y="214" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1a14">CLOSER</text>

  <text x="40" y="262" font-size="13" fill="currentColor" opacity="0.6">0s</text>
  <text x="760" y="262" text-anchor="end" font-size="13" fill="currentColor" opacity="0.6">end</text>

  <g>
    <rect x="40" y="292" width="228" height="150" rx="8" fill="currentColor" opacity="0.04"/>
    <rect x="40" y="292" width="4" height="150" fill="#FF6B00"/>
    <text x="60" y="320" font-size="15" font-weight="600" fill="#FF6B00">1. Hook</text>
    <text x="60" y="346" font-size="13" fill="currentColor" opacity="0.75">Open on your single</text>
    <text x="60" y="364" font-size="13" fill="currentColor" opacity="0.75">strongest shot. Grab</text>
    <text x="60" y="382" font-size="13" fill="currentColor" opacity="0.75">attention in 3 seconds.</text>
    <text x="60" y="410" font-size="13" fill="currentColor" opacity="0.6">No slow build-up,</text>
    <text x="60" y="428" font-size="13" fill="currentColor" opacity="0.6">no long title card.</text>
  </g>
  <g>
    <rect x="286" y="292" width="228" height="150" rx="8" fill="currentColor" opacity="0.04"/>
    <rect x="286" y="292" width="4" height="150" fill="#4A9EFF"/>
    <text x="306" y="320" font-size="15" font-weight="600" fill="#4A9EFF">2. Body</text>
    <text x="306" y="346" font-size="13" fill="currentColor" opacity="0.75">Your range: a walk, an</text>
    <text x="306" y="364" font-size="13" fill="currentColor" opacity="0.75">acting beat, a physical</text>
    <text x="306" y="382" font-size="13" fill="currentColor" opacity="0.75">action, a lip-sync.</text>
    <text x="306" y="410" font-size="13" fill="currentColor" opacity="0.6">Order strong to weak</text>
    <text x="306" y="428" font-size="13" fill="currentColor" opacity="0.6">so quality never dips.</text>
  </g>
  <g>
    <rect x="532" y="292" width="228" height="150" rx="8" fill="currentColor" opacity="0.04"/>
    <rect x="532" y="292" width="4" height="150" fill="#F5C242"/>
    <text x="552" y="320" font-size="15" font-weight="600" fill="#F5C242">3. Closer</text>
    <text x="552" y="346" font-size="13" fill="currentColor" opacity="0.75">Finish on a shot with</text>
    <text x="552" y="364" font-size="13" fill="currentColor" opacity="0.75">personality that leaves</text>
    <text x="552" y="382" font-size="13" fill="currentColor" opacity="0.75">a lasting impression.</text>
    <text x="552" y="410" font-size="13" fill="currentColor" opacity="0.6">End card: name plus</text>
    <text x="552" y="428" font-size="13" fill="currentColor" opacity="0.6">contact, held briefly.</text>
  </g>

  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> A recruiter often decides in the first few seconds, so your best frame belongs at the very front, not the end.</text>
</svg>
