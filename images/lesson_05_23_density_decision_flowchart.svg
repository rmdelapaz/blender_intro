<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" color="#222" role="img" aria-labelledby="df-title df-desc">
  <title id="df-title">Choosing Mesh Density</title>
  <desc id="df-desc">A two-question decision tree for picking polygon density. The first question asks whether the camera will get close to the model; the second question splits further based on deformation or instancing needs. Four terminal density recommendations are color-coded green for high, yellow for medium, and blue for low. A bottom synthesis pill row maps common use cases to their typical density tier.</desc>

  <defs>
    <marker id="df-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#FF6B00"/>
    </marker>
  </defs>

  <!-- Top accent rail -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Header band -->
  <text x="400" y="56" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="currentColor">Choosing Mesh Density</text>
  <text x="400" y="84" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" text-anchor="middle" fill="currentColor" opacity="0.65">Match polygon count to the job</text>
  <line x1="120" y1="108" x2="680" y2="108" stroke="currentColor" stroke-width="1" opacity="0.25"/>
  <text x="400" y="138" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#FF6B00" letter-spacing="2">ASK &#183; DECIDE &#183; BUILD</text>

  <!-- Root question box (centered x=400) -->
  <g id="df-root">
    <rect x="280" y="170" width="240" height="50" rx="8" fill="currentColor" fill-opacity="0.05" stroke="#FF6B00" stroke-width="2"/>
    <text x="400" y="201" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="currentColor">Will the camera get close?</text>
  </g>

  <!-- Root arrows: YES to LEFT secondary, NO to RIGHT secondary -->
  <g id="df-arrows-1" stroke="#FF6B00" stroke-width="2.5" fill="none">
    <line x1="340" y1="222" x2="220" y2="271" marker-end="url(#df-arrow)"/>
    <line x1="460" y1="222" x2="580" y2="271" marker-end="url(#df-arrow)"/>
  </g>
  <text x="262" y="244" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#FF6B00">YES</text>
  <text x="514" y="244" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#FF6B00">NO</text>

  <!-- Secondary question boxes -->
  <g id="df-secondary">
    <!-- LEFT (centered x=200) -->
    <rect x="90" y="275" width="220" height="50" rx="8" fill="currentColor" fill-opacity="0.05" stroke="#FF6B00" stroke-width="2"/>
    <text x="200" y="306" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="currentColor">Animated or deformed?</text>
    <!-- RIGHT (centered x=600) -->
    <rect x="490" y="275" width="220" height="50" rx="8" fill="currentColor" fill-opacity="0.05" stroke="#FF6B00" stroke-width="2"/>
    <text x="600" y="306" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="currentColor">Many copies in scene?</text>
  </g>

  <!-- Secondary arrows: 4 leaf paths to 4 terminal boxes -->
  <g id="df-arrows-2" stroke="#FF6B00" stroke-width="2.5" fill="none">
    <!-- LEFT-LEFT: to HIGH at x=110 -->
    <line x1="155" y1="327" x2="120" y2="391" marker-end="url(#df-arrow)"/>
    <!-- LEFT-RIGHT: to MEDIUM at x=290 -->
    <line x1="245" y1="327" x2="280" y2="391" marker-end="url(#df-arrow)"/>
    <!-- RIGHT-LEFT: to LOW at x=510 -->
    <line x1="555" y1="327" x2="520" y2="391" marker-end="url(#df-arrow)"/>
    <!-- RIGHT-RIGHT: to LOW (instanced) at x=690 -->
    <line x1="645" y1="327" x2="680" y2="391" marker-end="url(#df-arrow)"/>
  </g>
  <text x="100" y="355" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FF6B00">YES</text>
  <text x="290" y="355" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FF6B00">NO</text>
  <text x="500" y="355" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FF6B00">YES</text>
  <text x="690" y="355" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FF6B00">NO</text>

  <!-- Terminal density boxes -->
  <g id="df-terminals">
    <!-- HIGH (green) -->
    <g transform="translate(40, 395)">
      <rect x="0" y="0" width="140" height="70" rx="8" fill="#4ADE80" fill-opacity="0.15" stroke="#4ADE80" stroke-width="2"/>
      <text x="70" y="32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="currentColor">HIGH</text>
      <text x="70" y="54" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.75">50K+ verts</text>
    </g>
    <!-- MEDIUM (yellow) -->
    <g transform="translate(220, 395)">
      <rect x="0" y="0" width="140" height="70" rx="8" fill="#F5C242" fill-opacity="0.15" stroke="#F5C242" stroke-width="2"/>
      <text x="70" y="32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="currentColor">MEDIUM</text>
      <text x="70" y="54" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.75">5K to 50K verts</text>
    </g>
    <!-- LOW (blue) -->
    <g transform="translate(440, 395)">
      <rect x="0" y="0" width="140" height="70" rx="8" fill="#4A9EFF" fill-opacity="0.15" stroke="#4A9EFF" stroke-width="2"/>
      <text x="70" y="32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="currentColor">LOW</text>
      <text x="70" y="54" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.75">Under 5K verts</text>
    </g>
    <!-- LOW (instanced, blue) -->
    <g transform="translate(620, 395)">
      <rect x="0" y="0" width="140" height="70" rx="8" fill="#4A9EFF" fill-opacity="0.15" stroke="#4A9EFF" stroke-width="2"/>
      <text x="70" y="32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="currentColor">LOW</text>
      <text x="70" y="54" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-style="italic" text-anchor="middle" fill="currentColor" opacity="0.75">Instanced</text>
    </g>
  </g>

  <!-- Synthesis pill row: use case to density mapping -->
  <g id="df-pills">
    <!-- Pill 1: GAMES -->
    <g transform="translate(105, 505)">
      <rect x="0" y="0" width="150" height="40" rx="6" fill="currentColor" fill-opacity="0.04" stroke="#FF6B00" stroke-width="1" stroke-opacity="0.5"/>
      <text x="14" y="17" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FF6B00" letter-spacing="1">GAMES</text>
      <text x="14" y="32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="currentColor" opacity="0.85">Low to medium</text>
    </g>
    <!-- Pill 2: FILM -->
    <g transform="translate(325, 505)">
      <rect x="0" y="0" width="150" height="40" rx="6" fill="currentColor" fill-opacity="0.04" stroke="#FF6B00" stroke-width="1" stroke-opacity="0.5"/>
      <text x="14" y="17" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FF6B00" letter-spacing="1">FILM</text>
      <text x="14" y="32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="currentColor" opacity="0.85">High to very high</text>
    </g>
    <!-- Pill 3: PRINT -->
    <g transform="translate(545, 505)">
      <rect x="0" y="0" width="150" height="40" rx="6" fill="currentColor" fill-opacity="0.04" stroke="#FF6B00" stroke-width="1" stroke-opacity="0.5"/>
      <text x="14" y="17" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FF6B00" letter-spacing="1">PRINT</text>
      <text x="14" y="32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="currentColor" opacity="0.85">Medium to high</text>
    </g>
  </g>

  <!-- Italic takeaway -->
  <text x="400" y="585" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-style="italic" text-anchor="middle" fill="currentColor" opacity="0.75">Density is a budget. Spend polygons where the camera looks.</text>

  <!-- Footer tip card -->
  <g id="df-tip">
    <rect x="60" y="610" width="680" height="34" rx="4" fill="currentColor" fill-opacity="0.04" stroke="#FF6B00" stroke-width="1" stroke-opacity="0.4"/>
    <rect x="60" y="610" width="4" height="34" fill="#FF6B00"/>
    <text x="74" y="632" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="currentColor" opacity="0.85"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Start dense and use Decimate or Remesh modifiers to reduce; reversing the direction is harder.</text>
  </g>
</svg>
