<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="l45f13-t l45f13-d" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" color="#222">
<title id="l45f13-t">Each extra light bounce adds render cost with diminishing visual return</title>
<desc id="l45f13-d">A ray of light is traced as it bounces through a scene. The first few bounces carry most of the visible lighting: direct light, then the first and second indirect bounces contribute strong color bleed and fill. Each additional bounce costs more trace time while adding progressively less visible energy. Lowering the maximum bounce count is one of the most effective render optimizations.</desc>
<style>
.title{font-size:15px;font-weight:700;}
.sub{font-size:11.5px;fill:#c8c8c8;}
.num{font-size:12px;font-weight:800;fill:#1e1e1e;}
.lbl{font-size:10.5px;font-weight:700;}
.ret{font-size:10px;fill:#c8c8c8;}
.axis{font-size:10.5px;fill:#c8c8c8;}
</style>
<text class="title" x="380" y="36" text-anchor="middle">Light bounces: first few matter most</text>
<!-- ray path with numbered bounce nodes -->
<polyline points="80,110 210,230 340,120 470,240 590,150 690,250" fill="none" stroke="#F5C242" stroke-width="2"/>
<g text-anchor="middle">
<circle cx="80" cy="110" r="15" fill="#FF6B00"/><text class="num" x="80" y="114">0</text>
<text class="lbl" x="80" y="88" fill="#FF6B00">source</text>
<circle cx="210" cy="230" r="15" fill="#4ADE80"/><text class="num" x="210" y="234">1</text>
<text class="ret" x="210" y="258">strong</text>
<circle cx="340" cy="120" r="15" fill="#4ADE80"/><text class="num" x="340" y="124">2</text>
<text class="ret" x="340" y="100">strong</text>
<circle cx="470" cy="240" r="14" fill="#4A9EFF"/><text class="num" x="470" y="244">3</text>
<text class="ret" x="470" y="268">moderate</text>
<circle cx="590" cy="150" r="12" fill="#B47EE8"/><text class="num" x="590" y="154">4</text>
<text class="ret" x="590" y="128">faint</text>
<circle cx="690" cy="250" r="10" fill="#E63946"/><text class="num" x="690" y="254" font-size="10">5+</text>
<text class="ret" x="690" y="276">negligible</text>
</g>
<text class="axis" x="80" y="320">contribution to final image shrinks with each bounce &#8594;</text>
<text class="sub" x="380" y="380" text-anchor="middle">Cap max bounces low; the last bounces cost the most and show the least.</text>
</svg>
