<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="l45f07-t l45f07-d" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" color="#222">
<title id="l45f07-t">Subdivision multiplies polygons fourfold each level</title>
<desc id="l45f07-d">Each Subdivision Surface level roughly quadruples the face count. Starting from a base of one thousand faces, level one reaches four thousand, level two sixteen thousand, level three sixty-four thousand, and level four over a quarter million. The growth is exponential, so every extra level is a large jump in cost.</desc>
<style>
.title{font-size:15px;font-weight:700;}
.sub{font-size:11.5px;fill:#c8c8c8;}
.lvl{font-size:12.5px;font-weight:700;}
.val{font-size:13px;font-weight:800;}
.mult{font-size:11px;font-weight:700;fill:#F5C242;}
.axis{font-size:10.5px;fill:#c8c8c8;}
</style>
<text class="title" x="380" y="38" text-anchor="middle">Every subdivision level &#8776; 4&#215; the faces</text>
<line x1="70" y1="300" x2="712" y2="300" stroke="#8a8a8a" stroke-width="1.5"/>
<g text-anchor="middle">
<rect x="86" y="286" width="70" height="14" rx="3" fill="#4ADE80"/>
<text class="val" x="121" y="278" fill="#4ADE80">1K</text>
<text class="lvl" x="121" y="318">Base</text>
<rect x="206" y="258" width="70" height="42" rx="3" fill="#4A9EFF"/>
<text class="val" x="241" y="250" fill="#4A9EFF">4K</text>
<text class="lvl" x="241" y="318">Level 1</text>
<rect x="326" y="196" width="70" height="104" rx="3" fill="#B47EE8"/>
<text class="val" x="361" y="188" fill="#B47EE8">16K</text>
<text class="lvl" x="361" y="318">Level 2</text>
<rect x="446" y="118" width="70" height="182" rx="3" fill="#F5C242"/>
<text class="val" x="481" y="110" fill="#F5C242">64K</text>
<text class="lvl" x="481" y="318">Level 3</text>
<rect x="566" y="74" width="70" height="226" rx="3" fill="#E63946"/>
<text class="val" x="601" y="66" fill="#E63946">256K</text>
<text class="lvl" x="601" y="318">Level 4</text>
</g>
<g class="mult" text-anchor="middle">
<text x="181" y="272">&#215;4</text>
<text x="301" y="240">&#215;4</text>
<text x="421" y="180">&#215;4</text>
<text x="541" y="104">&#215;4</text>
</g>
<text class="axis" x="70" y="356">faces (base 1K example)</text>
<text class="sub" x="380" y="380" text-anchor="middle">Keep viewport level low; raise render level only for the final output.</text>
</svg>
