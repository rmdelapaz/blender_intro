<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="cs-title cs-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="cs-title">S-curve F&#183;Curve: ease in and ease out</title>
  <desc id="cs-desc">A Graph Editor F-curve drawn as a smooth S-shape from frame 1 value 0 to frame 24 value 5. The gentle slope at the start and end with a steep middle means the motion eases in, speeds up, then eases out, the natural organic motion most animation uses.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">READING F&#183;CURVES &#183; S-CURVE</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">A smooth S means ease in and ease out &#183; natural, organic motion</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Gridlines -->
  <g stroke="currentColor" stroke-width="1" opacity="0.15">
    <line x1="110" y1="170" x2="110" y2="460"/>
    <line x1="415" y1="170" x2="415" y2="460"/>
    <line x1="720" y1="170" x2="720" y2="460"/>
    <line x1="110" y1="460" x2="720" y2="460"/>
    <line x1="110" y1="170" x2="720" y2="170"/>
  </g>

  <!-- Axes -->
  <g stroke="currentColor" stroke-width="1.5" opacity="0.4" stroke-linecap="round">
    <line x1="110" y1="170" x2="110" y2="460"/>
    <line x1="110" y1="460" x2="720" y2="460"/>
  </g>

  <!-- Axis labels + ticks -->
  <text x="110" y="478" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">1</text>
  <text x="415" y="478" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">12</text>
  <text x="720" y="478" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">24</text>
  <text x="415" y="500" font-size="13" fill="currentColor" opacity="0.65" text-anchor="middle">Frame (time)</text>
  <text x="98" y="464" font-size="13" fill="currentColor" opacity="0.6" text-anchor="end">0</text>
  <text x="98" y="174" font-size="13" fill="currentColor" opacity="0.6" text-anchor="end">5</text>
  <text x="78" y="315" font-size="13" fill="currentColor" opacity="0.65" text-anchor="middle" transform="rotate(-90 78 315)">Value</text>

  <!-- S-curve: (110,460) ease-in flat, steep middle, (720,170) ease-out flat -->
  <!-- cubic with handles flat at both ends -> classic ease in/out -->
  <path d="M 110 460 C 400 460 430 170 720 170" fill="none" stroke="#FF6B00" stroke-width="3" stroke-linecap="round"/>

  <!-- Keyframe diamonds at endpoints + mid -->
  <g fill="#FF6B00">
    <path d="M 110 451 L 119 460 L 110 469 L 101 460 Z"/>
    <path d="M 720 161 L 729 170 L 720 179 L 711 170 Z"/>
  </g>

  <!-- Annotation: ease in at start -->
  <line x1="150" y1="445" x2="160" y2="400" stroke="currentColor" stroke-width="1" opacity="0.3" stroke-linecap="round"/>
  <text x="138" y="392" font-size="14" fill="currentColor">Slow start</text>
  <text x="138" y="410" font-size="13" fill="currentColor" opacity="0.65">(ease in)</text>

  <!-- Annotation: fast middle -->
  <line x1="415" y1="315" x2="470" y2="300" stroke="currentColor" stroke-width="1" opacity="0.3" stroke-linecap="round"/>
  <text x="476" y="296" font-size="14" fill="currentColor">Fast middle:</text>
  <text x="476" y="314" font-size="13" fill="currentColor" opacity="0.65">steepest = quickest</text>

  <!-- Annotation: ease out at end -->
  <line x1="680" y1="185" x2="640" y2="225" stroke="currentColor" stroke-width="1" opacity="0.3" stroke-linecap="round"/>
  <text x="520" y="222" font-size="14" fill="currentColor" text-anchor="end">Slow end (ease out)</text>

  <!-- Positive pill: natural motion -->
  <rect x="496" y="396" width="224" height="30" rx="6" fill="#4ADE80" fill-opacity="0.16" stroke="#4ADE80" stroke-opacity="0.55"/>
  <circle cx="514" cy="411" r="4" fill="#4ADE80"/>
  <text x="526" y="416" font-size="14" font-weight="600" fill="currentColor">Natural, organic motion</text>

  <!-- Footer tip -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> The S-curve is the workhorse of animation &#183; ease in and out makes almost any move read as believable.
  </text>
</svg>
