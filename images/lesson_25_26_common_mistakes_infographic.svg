<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="cm-title cm-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="cm-title">Common keyframing mistakes and fixes</title>
  <desc id="cm-desc">An infographic of four common keyframing mistakes paired with their fixes. First, keyframing before transforming records no change; fix by transforming first, then pressing I. Second, keyframing every frame makes the animation impossible to edit; fix by setting a few key poses and letting interpolation fill the rest. Third, keying the wrong property; fix by choosing the matching channel in the Insert Keyframe menu. Fourth, leaving Auto-Key on by accident overwrites poses; fix by turning Auto-Key off when you are done.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Common Keyframing Mistakes</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Four traps beginners hit, and the fix for each</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ===== Row 1 ===== -->
  <!-- red warning glyph -->
  <g transform="translate(40,140)">
    <path d="M 22 0 L 44 38 L 0 38 Z" fill="#E63946"/>
    <text x="22" y="32" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">!</text>
  </g>
  <text x="100" y="158" font-size="16" font-weight="600" fill="currentColor">Keyframing before you transform</text>
  <text x="100" y="178" font-size="13" fill="currentColor" opacity="0.65">Pressing I before moving the object stores the pose it is already in: no change.</text>
  <!-- green check + fix -->
  <circle cx="112" cy="200" r="11" fill="#4ADE80"/>
  <path d="M 106 200 l 4 4 l 8 -9" fill="none" stroke="#0f1a14" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="132" y="205" font-size="13" font-weight="600" fill="currentColor">Fix: Transform first (G / R / S), then press I.</text>
  <line x1="40" y1="226" x2="760" y2="226" stroke="currentColor" stroke-width="1" opacity="0.1"/>

  <!-- ===== Row 2 ===== -->
  <g transform="translate(40,248)">
    <path d="M 22 0 L 44 38 L 0 38 Z" fill="#E63946"/>
    <text x="22" y="32" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">!</text>
  </g>
  <text x="100" y="266" font-size="16" font-weight="600" fill="currentColor">Keyframing every single frame</text>
  <text x="100" y="286" font-size="13" fill="currentColor" opacity="0.65">A key on every frame is near-impossible to retime or clean up later.</text>
  <circle cx="112" cy="308" r="11" fill="#4ADE80"/>
  <path d="M 106 308 l 4 4 l 8 -9" fill="none" stroke="#0f1a14" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="132" y="313" font-size="13" font-weight="600" fill="currentColor">Fix: Set a few key poses; let interpolation fill the rest.</text>
  <line x1="40" y1="334" x2="760" y2="334" stroke="currentColor" stroke-width="1" opacity="0.1"/>

  <!-- ===== Row 3 ===== -->
  <g transform="translate(40,356)">
    <path d="M 22 0 L 44 38 L 0 38 Z" fill="#E63946"/>
    <text x="22" y="32" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">!</text>
  </g>
  <text x="100" y="374" font-size="16" font-weight="600" fill="currentColor">Keying the wrong property</text>
  <text x="100" y="394" font-size="13" fill="currentColor" opacity="0.65">Choosing Location when you meant Rotation leaves the real motion unkeyed.</text>
  <circle cx="112" cy="416" r="11" fill="#4ADE80"/>
  <path d="M 106 416 l 4 4 l 8 -9" fill="none" stroke="#0f1a14" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="132" y="421" font-size="13" font-weight="600" fill="currentColor">Fix: Pick the matching channel in the Insert Keyframe menu.</text>
  <line x1="40" y1="442" x2="760" y2="442" stroke="currentColor" stroke-width="1" opacity="0.1"/>

  <!-- ===== Row 4 ===== -->
  <g transform="translate(40,464)">
    <path d="M 22 0 L 44 38 L 0 38 Z" fill="#E63946"/>
    <text x="22" y="32" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">!</text>
  </g>
  <text x="100" y="482" font-size="16" font-weight="600" fill="currentColor">Leaving Auto-Key on by accident</text>
  <text x="100" y="502" font-size="13" fill="currentColor" opacity="0.65">Every stray nudge writes a new key and quietly overwrites your poses.</text>
  <circle cx="112" cy="524" r="11" fill="#4ADE80"/>
  <path d="M 106 524 l 4 4 l 8 -9" fill="none" stroke="#0f1a14" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="132" y="529" font-size="13" font-weight="600" fill="currentColor">Fix: Turn Auto-Key off the moment you finish posing.</text>
  <line x1="40" y1="550" x2="760" y2="550" stroke="currentColor" stroke-width="1" opacity="0.1"/>

  <!-- legend -->
  <path d="M 52 580 L 64 600 L 40 600 Z" fill="#E63946"/>
  <text x="74" y="597" font-size="13" fill="currentColor">The mistake</text>
  <circle cx="232" cy="592" r="9" fill="#4ADE80"/>
  <path d="M 227 592 l 3 3 l 7 -8" fill="none" stroke="#0f1a14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="248" y="597" font-size="13" fill="currentColor">The fix</text>

  <!-- Footer tip (Variant B left rail, 680 variant: y=641) -->
  <rect x="40" y="641" width="720" height="34" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Most of these come down to one habit: pose first, key second, and check which property you are keying.
  </text>
</svg>
