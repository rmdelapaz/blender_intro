<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="dy-title dy-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="dy-title">Dolly camera move, top-down diagram</title>
  <desc id="dy-desc">Top-down view of a dolly move. The camera body physically translates along a straight path from a far start position to a near end position toward a fixed subject. Both positions project a field-of-view cone with the same apex angle, showing the lens stays fixed while only the camera-to-subject distance changes.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">DOLLY</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Move the camera body &#183; keep the lens fixed</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- View label -->
  <text x="40" y="138" font-size="18" font-weight="600" fill="currentColor">Top-down view</text>

  <!-- ===== Subject (fixed reference) ===== -->
  <!-- Subject cube glyph, centered, neutral currentColor outline -->
  <g>
    <rect x="368" y="172" width="64" height="56" rx="3" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="2"/>
    <!-- cube top-edge hint -->
    <path d="M 368 172 L 384 158 L 448 158 L 432 172" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-width="1.5" opacity="0.55"/>
    <path d="M 432 172 L 448 158 L 448 214 L 432 228" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-width="1.5" opacity="0.55"/>
    <text x="400" y="206" text-anchor="middle" font-size="14" font-weight="500" fill="currentColor">Subject</text>
  </g>

  <!-- ===== FOV cones (same apex angle, currentColor low-opacity) ===== -->
  <!-- START cone: apex at far camera (400,430), opening up to subject width at y~228 -->
  <polygon points="400,430 300,236 500,236" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-width="1" stroke-opacity="0.3"/>
  <!-- END cone: apex at near camera (400,325), SAME apex half-angle, opening up to subject. Faint orange edge separates it from the grey start cone without changing geometry. -->
  <polygon points="400,325 339,236 461,236" fill="currentColor" fill-opacity="0.10" stroke="#FF6B00" stroke-width="1.25" stroke-opacity="0.5"/>

  <!-- ===== Dolly translation path (orange arrow, Start -> End) ===== -->
  <defs>
    <marker id="dy-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#FF6B00"/>
    </marker>
  </defs>
  <line x1="400" y1="424" x2="400" y2="338" stroke="#FF6B00" stroke-width="3" stroke-linecap="round" marker-end="url(#dy-arrow)"/>
  <text x="414" y="388" font-size="14" font-weight="600" fill="#FF6B00">Dolly in</text>

  <!-- ===== START camera body (ghost, far) ===== -->
  <g opacity="0.4">
    <!-- body rect + lens nub pointing up toward subject -->
    <rect x="372" y="430" width="56" height="38" rx="4" fill="#FF6B00"/>
    <rect x="392" y="418" width="16" height="14" rx="2" fill="#FF6B00"/>
  </g>
  <text x="400" y="492" text-anchor="middle" font-size="13" font-weight="500" fill="currentColor">Start (far)</text>

  <!-- ===== END camera body (solid, near) ===== -->
  <g opacity="0.9">
    <rect x="374" y="296" width="52" height="34" rx="4" fill="#FF6B00"/>
    <rect x="392" y="285" width="16" height="13" rx="2" fill="#FF6B00"/>
  </g>
  <text x="470" y="316" font-size="13" font-weight="500" fill="currentColor">End (near)</text>

  <!-- ===== FOV constant annotation pill ===== -->
  <g>
    <rect x="556" y="250" width="150" height="30" rx="15" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1" stroke-opacity="0.3"/>
    <text x="631" y="270" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">FOV constant</text>
  </g>
  <line x1="556" y1="265" x2="505" y2="262" stroke="currentColor" stroke-width="1" stroke-opacity="0.3" stroke-linecap="round"/>

  <!-- ===== Footer tip (Variant B left rail) ===== -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> A dolly changes your distance to the subject, so the background scale shifts &#183; a zoom does not.</text>
</svg>
