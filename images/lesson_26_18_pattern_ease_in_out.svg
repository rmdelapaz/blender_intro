<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="ei-title ei-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="ei-title">Common handle pattern: ease in and ease out</title>
  <desc id="ei-desc">A Graph Editor F-curve showing the ease-in/ease-out pattern. The curve leaves the first keyframe slowly with a flat horizontal handle, accelerates through a steep middle, then arrives at the second keyframe slowly with another flat horizontal handle. Both end handles are horizontal, which produces the slow-fast-slow timing.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">PATTERN &#183; EASE IN / EASE OUT</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Flat handles at both ends &#183; slow start, fast middle, slow finish</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Gridlines -->
  <g stroke="currentColor" stroke-width="1" opacity="0.15">
    <line x1="110" y1="170" x2="110" y2="460"/>
    <line x1="262" y1="170" x2="262" y2="460"/>
    <line x1="415" y1="170" x2="415" y2="460"/>
    <line x1="567" y1="170" x2="567" y2="460"/>
    <line x1="720" y1="170" x2="720" y2="460"/>
    <line x1="110" y1="460" x2="720" y2="460"/>
    <line x1="110" y1="170" x2="720" y2="170"/>
  </g>

  <!-- Axes -->
  <g stroke="currentColor" stroke-width="1.5" opacity="0.4" stroke-linecap="round">
    <line x1="110" y1="170" x2="110" y2="460"/>
    <line x1="110" y1="460" x2="720" y2="460"/>
  </g>

  <!-- Axis labels + ticks -->
  <text x="110" y="478" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">1</text>
  <text x="415" y="478" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">12</text>
  <text x="720" y="478" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">24</text>
  <text x="415" y="500" font-size="13" fill="currentColor" opacity="0.65" text-anchor="middle">Frame (time)</text>
  <text x="98" y="464" font-size="13" fill="currentColor" opacity="0.6" text-anchor="end">0</text>
  <text x="98" y="174" font-size="13" fill="currentColor" opacity="0.6" text-anchor="end">5</text>
  <text x="78" y="315" font-size="13" fill="currentColor" opacity="0.65" text-anchor="middle" transform="rotate(-90 78 315)">Value</text>

  <!-- Ease in/out curve: monotonic cubic, flat tangents both ends, steep middle. start(110,460) end(720,170) -->
  <path d="M 110 460 C 360 460 470 170 720 170"
        fill="none" stroke="#FF6B00" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- End handle arms (horizontal, faint orange) -->
  <g stroke="#FF6B00" stroke-width="1.5" opacity="0.5" stroke-linecap="round">
    <line x1="110" y1="460" x2="200" y2="460"/>
    <line x1="720" y1="170" x2="630" y2="170"/>
  </g>
  <!-- Handle points (orange squares) -->
  <rect x="194" y="454" width="12" height="12" fill="#FF6B00"/>
  <rect x="624" y="164" width="12" height="12" fill="#FF6B00"/>

  <!-- Keyframe diamonds (start + end, drawn on top) -->
  <g fill="#FF6B00">
    <path d="M 110 449 L 121 460 L 110 471 L 99 460 Z"/>
    <path d="M 720 159 L 731 170 L 720 181 L 709 170 Z"/>
  </g>

  <!-- Annotation: ease in (slow start) -->
  <line x1="175" y1="455" x2="210" y2="410" stroke="currentColor" stroke-width="1" opacity="0.3" stroke-linecap="round"/>
  <text x="216" y="406" font-size="14" fill="currentColor">Ease in</text>
  <text x="216" y="424" font-size="13" fill="currentColor" opacity="0.65">flat handle = slow start</text>

  <!-- Annotation: fast middle -->
  <line x1="415" y1="315" x2="380" y2="270" stroke="currentColor" stroke-width="1" opacity="0.3" stroke-linecap="round"/>
  <text x="374" y="266" font-size="14" fill="currentColor" text-anchor="end">Steep middle</text>
  <text x="374" y="284" font-size="13" fill="currentColor" opacity="0.65" text-anchor="end">= fastest motion</text>

  <!-- Annotation: ease out (slow finish) -->
  <line x1="655" y1="175" x2="620" y2="220" stroke="currentColor" stroke-width="1" opacity="0.3" stroke-linecap="round"/>
  <text x="614" y="232" font-size="14" fill="currentColor" text-anchor="end">Ease out</text>
  <text x="614" y="250" font-size="13" fill="currentColor" opacity="0.65" text-anchor="end">flat handle = slow finish</text>

  <!-- Positive pill: natural motion -->
  <rect x="110" y="170" width="190" height="26" rx="13" fill="#4ADE80" fill-opacity="0.15" stroke="#4ADE80" stroke-opacity="0.5"/>
  <circle cx="126" cy="183" r="4" fill="#4ADE80"/>
  <text x="138" y="187" font-size="13" fill="currentColor">Smooth &#183; the default for natural motion</text>

  <!-- Footer tip -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Flatten both end handles to the horizontal for the classic ease-in/out. It suits most object moves.
  </text>
</svg>
