<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="swpTitle swpDesc" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" color="#222">
  <title id="swpTitle">External Software Pipeline</title>
  <desc id="swpDesc">A roundtrip map showing how Blender hands off to external post-processing software. Blender exports high bit-depth formats: multilayer EXR carrying all render passes, or 16-bit TIFF for stills. Photoshop handles still-image compositing and matte painting, DaVinci Resolve handles color grading and video finishing, and After Effects handles motion graphics and animated compositing. Finished work comes back as the final delivery. EXR preserves passes and dynamic range for the fullest control downstream.</desc>
  <style>
    .hd{fill:currentColor;font-size:19px;font-weight:700;}
    .sub{fill:#9aa4b2;font-size:11px;}
    .bt{fill:#ffffff;font-size:12px;font-weight:700;}
    .bd{fill:#d4d4d4;font-size:9.5px;}
    .fmt{fill:#0f0f0f;font-size:10px;font-weight:700;}
    .arw{fill:#9aa4b2;font-size:9px;}
  </style>
  <text x="20" y="34" class="hd">Handing off to external software</text>
  <text x="20" y="54" class="sub">Export high bit-depth (EXR keeps every pass), finish in the right tool, bring it back for delivery.</text>

  <!-- Blender source -->
  <rect x="20" y="150" width="150" height="110" rx="8" fill="#2a2a2a" stroke="#FF6B00" stroke-width="2.5"/>
  <rect x="20" y="150" width="150" height="26" rx="8" fill="#FF6B00"/>
  <text x="34" y="168" class="bt">Blender</text>
  <text x="34" y="196" class="bd">Render + composite</text>
  <text x="34" y="214" class="bd">base pass here first.</text>
  <text x="34" y="240" class="bd">Then export high</text>
  <text x="34" y="254" class="bd">bit-depth for post.</text>

  <!-- export formats -->
  <rect x="196" y="120" width="120" height="30" rx="6" fill="#4ADE80"/>
  <text x="210" y="140" class="fmt">EXR (all passes)</text>
  <rect x="196" y="252" width="120" height="30" rx="6" fill="#F5C242"/>
  <text x="214" y="272" class="fmt">TIFF 16-bit</text>

  <!-- export arrows -->
  <path d="M170 190 C 182 190 184 135 196 135" fill="none" stroke="#4ADE80" stroke-width="2"/>
  <path d="M170 220 C 182 220 184 267 196 267" fill="none" stroke="#F5C242" stroke-width="2"/>

  <!-- three destinations -->
  <rect x="360" y="80" width="240" height="80" rx="8" fill="#1b1b1b" stroke="#4A9EFF" stroke-width="2"/>
  <text x="376" y="104" class="bt">Photoshop</text>
  <text x="376" y="126" class="bd">Still compositing, matte</text>
  <text x="376" y="142" class="bd">painting, retouch, print prep.</text>

  <rect x="360" y="172" width="240" height="80" rx="8" fill="#1b1b1b" stroke="#B47EE8" stroke-width="2"/>
  <text x="376" y="196" class="bt">DaVinci Resolve</text>
  <text x="376" y="218" class="bd">Color grading, node-based</text>
  <text x="376" y="234" class="bd">finishing, video delivery.</text>

  <rect x="360" y="264" width="240" height="80" rx="8" fill="#1b1b1b" stroke="#E63946" stroke-width="2"/>
  <text x="376" y="288" class="bt">After Effects</text>
  <text x="376" y="310" class="bd">Motion graphics, animated</text>
  <text x="376" y="326" class="bd">comp, effects over sequences.</text>

  <!-- fan arrows from formats to destinations -->
  <path d="M316 135 C 335 135 340 120 360 120" fill="none" stroke="#4A9EFF" stroke-width="1.5"/>
  <path d="M316 140 C 335 190 340 210 360 212" fill="none" stroke="#B47EE8" stroke-width="1.5"/>
  <path d="M316 267 C 335 300 340 300 360 304" fill="none" stroke="#E63946" stroke-width="1.5"/>

  <!-- delivery return -->
  <rect x="628" y="150" width="112" height="110" rx="8" fill="#2a2a2a" stroke="#4ADE80" stroke-width="2.5"/>
  <rect x="628" y="150" width="112" height="26" rx="8" fill="#4ADE80"/>
  <text x="642" y="168" class="bt" fill="#14351f">Delivery</text>
  <text x="642" y="196" class="bd">Final master:</text>
  <text x="642" y="214" class="bd">image / video /</text>
  <text x="642" y="232" class="bd">sequence, in the</text>
  <text x="642" y="250" class="bd">target color space.</text>

  <path d="M600 120 C 615 120 618 190 628 195" fill="none" stroke="#4ADE80" stroke-width="1.5"/>
  <path d="M600 212 C 615 212 618 205 628 205" fill="none" stroke="#4ADE80" stroke-width="1.5"/>
  <path d="M600 304 C 615 304 618 225 628 220" fill="none" stroke="#4ADE80" stroke-width="1.5"/>

  <text x="20" y="300" class="arw">EXR (green) carries every render pass + full dynamic range &#8212; the most flexible handoff.</text>
  <text x="20" y="316" class="arw">TIFF (yellow) is a simpler 16-bit still when you don't need separate passes.</text>
</svg>
