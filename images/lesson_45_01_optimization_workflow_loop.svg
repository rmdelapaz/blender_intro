<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="l45f01-t l45f01-d" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" color="#222">
<title id="l45f01-t">The optimization workflow loop</title>
<desc id="l45f01-d">A five-step cycle: measure current performance, identify the bottleneck, apply a targeted optimization, then measure results; a return arrow from the fourth step back to identify shows the iterative loop, ending in balance quality against speed.</desc>
<style>
.card{fill:#2a2a2a;stroke-width:2;}
.num{font-size:13px;font-weight:700;fill:#1e1e1e;}
.title{font-size:15px;font-weight:700;}
.sub{font-size:11.5px;fill:#c8c8c8;}
.flow{fill:none;stroke:#8a8a8a;stroke-width:2.5;}
.loop{fill:none;stroke:#F5C242;stroke-width:2.5;stroke-dasharray:6 5;}
.cap{font-size:12px;font-weight:600;}
</style>
<defs>
<marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8a8a8a"/></marker>
<marker id="ahl" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#F5C242"/></marker>
</defs>
<g>
<rect class="card" x="24" y="70" width="132" height="96" rx="10" stroke="#4A9EFF"/>
<circle cx="44" cy="90" r="13" fill="#4A9EFF"/><text class="num" x="44" y="94" text-anchor="middle">1</text>
<text class="title" x="90" y="118" text-anchor="middle" fill="#4A9EFF">Measure</text>
<text class="sub" x="90" y="138" text-anchor="middle">Enable stats,</text>
<text class="sub" x="90" y="152" text-anchor="middle">test render, RAM</text>
</g>
<g>
<rect class="card" x="188" y="70" width="132" height="96" rx="10" stroke="#B47EE8"/>
<circle cx="208" cy="90" r="13" fill="#B47EE8"/><text class="num" x="208" y="94" text-anchor="middle">2</text>
<text class="title" x="254" y="118" text-anchor="middle" fill="#B47EE8">Identify</text>
<text class="sub" x="254" y="138" text-anchor="middle">Viewport lag?</text>
<text class="sub" x="254" y="152" text-anchor="middle">Slow render? Crash?</text>
</g>
<g>
<rect class="card" x="352" y="70" width="132" height="96" rx="10" stroke="#FF6B00"/>
<circle cx="372" cy="90" r="13" fill="#FF6B00"/><text class="num" x="372" y="94" text-anchor="middle">3</text>
<text class="title" x="418" y="118" text-anchor="middle" fill="#FF6B00">Optimize</text>
<text class="sub" x="418" y="138" text-anchor="middle">Apply targeted</text>
<text class="sub" x="418" y="152" text-anchor="middle">technique</text>
</g>
<g>
<rect class="card" x="516" y="70" width="132" height="96" rx="10" stroke="#4ADE80"/>
<circle cx="536" cy="90" r="13" fill="#4ADE80"/><text class="num" x="536" y="94" text-anchor="middle">4</text>
<text class="title" x="582" y="118" text-anchor="middle" fill="#4ADE80">Re-measure</text>
<text class="sub" x="582" y="138" text-anchor="middle">Compare to</text>
<text class="sub" x="582" y="152" text-anchor="middle">baseline</text>
</g>
<line class="flow" x1="158" y1="118" x2="184" y2="118" marker-end="url(#ah)"/>
<line class="flow" x1="322" y1="118" x2="348" y2="118" marker-end="url(#ah)"/>
<line class="flow" x1="486" y1="118" x2="512" y2="118" marker-end="url(#ah)"/>
<path class="loop" d="M582,166 L582,210 Q582,224 568,224 L268,224 Q254,224 254,210 L254,168" marker-end="url(#ahl)"/>
<text class="cap" x="418" y="246" text-anchor="middle" fill="#F5C242">Iterate until acceptable</text>
<g>
<rect class="card" x="286" y="300" width="188" height="66" rx="10" stroke="#E63946"/>
<text class="title" x="380" y="330" text-anchor="middle" fill="#E63946">5 &#183; Balance</text>
<text class="sub" x="380" y="350" text-anchor="middle">quality vs. speed threshold</text>
</g>
<line class="flow" x1="380" y1="256" x2="380" y2="298" marker-end="url(#ah)"/>
</svg>
