<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="hl-title hl-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="hl-title">Handle length and its influence on an F&#183;Curve</title>
  <desc id="hl-desc">Two F-curves drawn between the same two keyframes in a Graph Editor plot. The first curve has short handles and turns sharply, giving a snappy abrupt motion. The second curve has long handles and eases broadly, giving a slow gentle motion. Both share identical start and end control points, so only the handle length differs.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">HANDLE LENGTH = INFLUENCE</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Same two keyframes, different handle length &#183; longer handles reach further into the curve</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Gridlines -->
  <g stroke="currentColor" stroke-width="1" opacity="0.15">
    <line x1="110" y1="170" x2="110" y2="460"/>
    <line x1="262" y1="170" x2="262" y2="460"/>
    <line x1="415" y1="170" x2="415" y2="460"/>
    <line x1="567" y1="170" x2="567" y2="460"/>
    <line x1="720" y1="170" x2="720" y2="460"/>
    <line x1="110" y1="460" x2="720" y2="460"/>
    <line x1="110" y1="170" x2="720" y2="170"/>
  </g>

  <!-- Axes -->
  <g stroke="currentColor" stroke-width="1.5" opacity="0.4" stroke-linecap="round">
    <line x1="110" y1="170" x2="110" y2="460"/>
    <line x1="110" y1="460" x2="720" y2="460"/>
  </g>

  <!-- Axis labels + ticks -->
  <text x="110" y="478" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">1</text>
  <text x="415" y="478" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">12</text>
  <text x="720" y="478" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">24</text>
  <text x="415" y="500" font-size="13" fill="currentColor" opacity="0.65" text-anchor="middle">Frame (time)</text>
  <text x="98" y="464" font-size="13" fill="currentColor" opacity="0.6" text-anchor="end">0</text>
  <text x="98" y="174" font-size="13" fill="currentColor" opacity="0.6" text-anchor="end">5</text>
  <text x="78" y="315" font-size="13" fill="currentColor" opacity="0.65" text-anchor="middle" transform="rotate(-90 78 315)">Value</text>

  <!-- Shared keyframes: start(150,430) end(680,200). -->

  <!-- LONG handles: green curve, broad ease (handles reach far past centre, flat start and flat end). -->
  <path d="M 150 430 C 430 430 400 200 680 200"
        fill="none" stroke="#4ADE80" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- long handle arms (green, faint) -->
  <g stroke="#4ADE80" stroke-width="1.5" opacity="0.5" stroke-linecap="round">
    <line x1="150" y1="430" x2="430" y2="430"/>
    <line x1="680" y1="200" x2="400" y2="200"/>
  </g>
  <!-- long handle points (green squares) -->
  <rect x="423" y="423" width="12" height="12" fill="#4ADE80"/>
  <rect x="394" y="194" width="12" height="12" fill="#4ADE80"/>

  <!-- SHORT handles: orange curve, barely-eased (handles short, so it stays close to a straight diagonal then snaps level near each end). -->
  <path d="M 150 430 C 178 430 660 200 680 200"
        fill="none" stroke="#FF6B00" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- short handle arms (orange, faint) -->
  <g stroke="#FF6B00" stroke-width="1.5" opacity="0.55" stroke-linecap="round">
    <line x1="150" y1="430" x2="178" y2="430"/>
    <line x1="680" y1="200" x2="660" y2="200"/>
  </g>
  <!-- short handle points (orange squares) -->
  <rect x="172" y="424" width="12" height="12" fill="#FF6B00"/>
  <rect x="654" y="194" width="12" height="12" fill="#FF6B00"/>

  <!-- Shared control-point diamonds (orange, drawn last so they sit on top) -->
  <g fill="#FF6B00">
    <path d="M 150 419 L 161 430 L 150 441 L 139 430 Z"/>
    <path d="M 680 189 L 691 200 L 680 211 L 669 200 Z"/>
  </g>

  <!-- Legend / annotation: short = snappy -->
  <line x1="430" y1="338" x2="470" y2="300" stroke="#FF6B00" stroke-width="1" opacity="0.5" stroke-linecap="round"/>
  <text x="476" y="296" font-size="14" fill="#FF6B00" font-weight="600">Short handles</text>
  <text x="476" y="314" font-size="13" fill="currentColor" opacity="0.7">snappy &#183; sudden turn, abrupt motion</text>

  <!-- annotation: long = smooth -->
  <line x1="270" y1="380" x2="230" y2="345" stroke="#4ADE80" stroke-width="1" opacity="0.6" stroke-linecap="round"/>
  <text x="224" y="341" font-size="14" fill="#4ADE80" font-weight="600" text-anchor="end">Long handles</text>
  <text x="224" y="359" font-size="13" fill="currentColor" opacity="0.7" text-anchor="end">smooth &#183; broad, gentle ease</text>

  <!-- Footer tip -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Drag a handle outward to ease more gradually, pull it in to make the keyframe hit harder.
  </text>
</svg>
