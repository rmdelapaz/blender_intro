<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="vd-title vd-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" color="#222">
  <title id="vd-title">Particle velocity direction components</title>
  <desc id="vd-desc">A plane emitter with three labeled arrows showing the velocity components that give particles their initial direction: Normal pointing away from the surface, Tangent running along the surface, and Object inheriting the emitter's own motion.</desc>
  <style>
    .vd-lbl{font:600 14px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:currentColor}
    .vd-val{font:400 12px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:currentColor;opacity:.6}
    .vd-plane{fill:currentColor;fill-opacity:.06;stroke:currentColor;stroke-opacity:.4;stroke-width:1.5}
    .vd-axis{stroke:currentColor;stroke-opacity:.2;stroke-width:1;stroke-dasharray:4 4}
  </style>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">VELOCITY DIRECTION</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Normal &#183; Tangent &#183; Object &#183; the components that aim a new particle</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- arrowhead markers, one per color -->
  <defs>
    <marker id="vd-h-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B47EE8"/>
    </marker>
    <marker id="vd-h-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4ADE80"/>
    </marker>
    <marker id="vd-h-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A9EFF"/>
    </marker>
  </defs>

  <!-- Emitter plane (parallelogram for a sense of perspective) -->
  <polygon class="vd-plane" points="250,330 560,330 470,392 160,392"/>
  <text class="vd-val" x="360" y="376" text-anchor="middle">Plane emitter surface</text>

  <!-- emission point at center of plane -->
  <circle cx="360" cy="361" r="5" fill="#FF6B00"/>

  <!-- Normal velocity: straight up, perpendicular to surface -->
  <line x1="360" y1="350" x2="360" y2="170" stroke="#B47EE8" stroke-width="3" marker-end="url(#vd-h-purple)"/>
  <circle cx="360" cy="200" r="5" fill="#B47EE8" fill-opacity="0.85"/>
  <circle cx="360" cy="250" r="4" fill="#B47EE8" fill-opacity="0.5"/>
  <text class="vd-lbl" x="360" y="150" text-anchor="middle" fill="#B47EE8">Normal</text>
  <text class="vd-val" x="360" y="168" text-anchor="middle">Away from the surface</text>

  <!-- Tangent velocity: along the surface plane -->
  <line x1="372" y1="357" x2="600" y2="290" stroke="#4ADE80" stroke-width="3" marker-end="url(#vd-h-green)"/>
  <circle cx="500" cy="319" r="4" fill="#4ADE80" fill-opacity="0.6"/>
  <text class="vd-lbl" x="616" y="284" fill="#4ADE80">Tangent</text>
  <text class="vd-val" x="616" y="302">Along the surface</text>

  <!-- Object velocity: inherited motion of the emitter, angled -->
  <line x1="348" y1="356" x2="150" y2="248" stroke="#4A9EFF" stroke-width="3" marker-end="url(#vd-h-blue)"/>
  <circle cx="250" cy="302" r="4" fill="#4A9EFF" fill-opacity="0.6"/>
  <text class="vd-lbl" x="150" y="226" text-anchor="middle" fill="#4A9EFF">Object</text>
  <text class="vd-val" x="150" y="244" text-anchor="middle">Emitter's own motion</text>

  <!-- Footer tip (Variant B, left rail) -->
  <rect x="40" y="416" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="438" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> These components add together. Most natural emission starts from Normal, with a little Tangent and Object mixed in.</text>
</svg>
