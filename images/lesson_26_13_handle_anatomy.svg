<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="ha-title ha-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="ha-title">Anatomy of a Bezier handle on an F&#183;Curve keyframe</title>
  <desc id="ha-desc">A single keyframe control point in the centre of a Graph Editor plot, with its two Bezier handles drawn as straight arms extending left and right. Each handle ends in a square handle point. Labels identify the control point, the handle arm, and the handle point, and show that the handle tangent direction sets the curve slope as it passes through the keyframe.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">ANATOMY OF A HANDLE</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">A keyframe control point and its two Bezier handles &#183; the tangent sets the curve slope</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Gridlines -->
  <g stroke="currentColor" stroke-width="1" opacity="0.15">
    <line x1="110" y1="170" x2="110" y2="460"/>
    <line x1="262" y1="170" x2="262" y2="460"/>
    <line x1="415" y1="170" x2="415" y2="460"/>
    <line x1="567" y1="170" x2="567" y2="460"/>
    <line x1="720" y1="170" x2="720" y2="460"/>
    <line x1="110" y1="460" x2="720" y2="460"/>
    <line x1="110" y1="170" x2="720" y2="170"/>
  </g>

  <!-- Axes -->
  <g stroke="currentColor" stroke-width="1.5" opacity="0.4" stroke-linecap="round">
    <line x1="110" y1="170" x2="110" y2="460"/>
    <line x1="110" y1="460" x2="720" y2="460"/>
  </g>

  <!-- Axis labels + ticks -->
  <text x="110" y="478" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">1</text>
  <text x="415" y="478" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">12</text>
  <text x="720" y="478" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">24</text>
  <text x="415" y="500" font-size="13" fill="currentColor" opacity="0.65" text-anchor="middle">Frame (time)</text>
  <text x="98" y="464" font-size="13" fill="currentColor" opacity="0.6" text-anchor="end">0</text>
  <text x="98" y="174" font-size="13" fill="currentColor" opacity="0.6" text-anchor="end">5</text>
  <text x="78" y="315" font-size="13" fill="currentColor" opacity="0.65" text-anchor="middle" transform="rotate(-90 78 315)">Value</text>

  <!-- The F-curve passing through the central keyframe (ease in, ease out). -->
  <!-- Control point at (415,315). Curve enters from lower-left, leaves to upper area, slope matches the handle tangent. -->
  <path d="M 130 430 C 280 430 340 315 415 315 C 490 315 550 200 700 200"
        fill="none" stroke="#FF6B00" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Handle arms: straight tangent line through the control point. -->
  <g stroke="currentColor" stroke-width="2" opacity="0.55" stroke-linecap="round">
    <line x1="295" y1="315" x2="535" y2="315"/>
  </g>

  <!-- Left handle point (square) -->
  <rect x="288" y="308" width="14" height="14" fill="currentColor" opacity="0.75"/>
  <!-- Right handle point (square) -->
  <rect x="528" y="308" width="14" height="14" fill="currentColor" opacity="0.75"/>

  <!-- Control point: orange keyframe diamond (larger, hero) -->
  <path d="M 415 301 L 429 315 L 415 329 L 401 315 Z" fill="#FF6B00"/>

  <!-- Annotation: control point -->
  <line x1="415" y1="329" x2="415" y2="392" stroke="currentColor" stroke-width="1" opacity="0.3" stroke-linecap="round"/>
  <text x="415" y="410" font-size="14" fill="currentColor" text-anchor="middle" font-weight="600">Control point (keyframe)</text>
  <text x="415" y="428" font-size="13" fill="currentColor" opacity="0.65" text-anchor="middle">the value you set at this frame</text>

  <!-- Annotation: left handle point -->
  <line x1="295" y1="315" x2="262" y2="262" stroke="currentColor" stroke-width="1" opacity="0.3" stroke-linecap="round"/>
  <text x="256" y="256" font-size="14" fill="currentColor" text-anchor="end">Handle point</text>
  <text x="256" y="274" font-size="13" fill="currentColor" opacity="0.65" text-anchor="end">drag to reshape</text>

  <!-- Annotation: the arm / tangent -->
  <line x1="475" y1="315" x2="540" y2="392" stroke="currentColor" stroke-width="1" opacity="0.3" stroke-linecap="round"/>
  <text x="546" y="396" font-size="14" fill="currentColor">Handle (tangent arm)</text>
  <text x="546" y="414" font-size="13" fill="currentColor" opacity="0.65">its angle = the curve slope here</text>

  <!-- Footer tip -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> The curve always leaves a keyframe travelling along its handle direction &#183; aim the handle, aim the motion.
  </text>
</svg>
