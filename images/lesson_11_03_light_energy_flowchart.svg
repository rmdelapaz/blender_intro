<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="le-title le-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="le-title">Light Energy Distribution Flowchart</title>
  <desc id="le-desc">A flowchart showing how 100 percent of incoming light energy is distributed at a surface. The incoming energy reaches a surface interaction node, then splits into three paths: reflected light, which further divides into specular and diffuse; absorbed light, which becomes heat; and transmitted light, which passes through the material. The three output paths always sum back to 100 percent.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">LIGHT ENERGY DISTRIBUTION</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Where every unit of incoming light goes at a surface</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Connectors group (drawn first so boxes sit on top) -->
  <g stroke="currentColor" stroke-width="1.5" opacity="0.3" fill="none" stroke-linecap="round">
    <!-- incoming -> diamond -->
    <line x1="400" y1="178" x2="400" y2="206"/>
    <!-- diamond -> three branches bus -->
    <line x1="400" y1="290" x2="400" y2="312"/>
    <line x1="160" y1="312" x2="640" y2="312"/>
    <line x1="160" y1="312" x2="160" y2="338"/>
    <line x1="400" y1="312" x2="400" y2="338"/>
    <line x1="640" y1="312" x2="640" y2="338"/>
    <!-- reflected -> specular/diffuse bus -->
    <line x1="160" y1="410" x2="160" y2="432"/>
    <line x1="92" y1="432" x2="228" y2="432"/>
    <line x1="92" y1="432" x2="92" y2="458"/>
    <line x1="228" y1="432" x2="228" y2="458"/>
    <!-- absorbed -> heat -->
    <line x1="400" y1="410" x2="400" y2="458"/>
    <!-- transmitted -> through material -->
    <line x1="640" y1="410" x2="640" y2="458"/>
  </g>

  <!-- Arrowheads -->
  <g fill="currentColor" opacity="0.3">
    <path d="M 400 206 l -5 -9 l 10 0 Z"/>
    <path d="M 160 338 l -5 -9 l 10 0 Z"/>
    <path d="M 400 338 l -5 -9 l 10 0 Z"/>
    <path d="M 640 338 l -5 -9 l 10 0 Z"/>
    <path d="M 92 458 l -5 -9 l 10 0 Z"/>
    <path d="M 228 458 l -5 -9 l 10 0 Z"/>
    <path d="M 400 458 l -5 -9 l 10 0 Z"/>
    <path d="M 640 458 l -5 -9 l 10 0 Z"/>
  </g>

  <!-- Incoming light: 100% (gold) -->
  <rect x="290" y="138" width="220" height="40" rx="8" fill="#F5C242" opacity="0.16"/>
  <rect x="290" y="138" width="220" height="40" rx="8" fill="none" stroke="#F5C242" stroke-width="2.5"/>
  <text x="400" y="163" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor">Incoming Light: 100%</text>

  <!-- Surface interaction (blue diamond) -->
  <polygon points="400,206 486,248 400,290 314,248" fill="#4A9EFF" opacity="0.16"/>
  <polygon points="400,206 486,248 400,290 314,248" fill="none" stroke="#4A9EFF" stroke-width="2.5"/>
  <text x="400" y="244" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor">Surface</text>
  <text x="400" y="262" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor">Interaction</text>

  <!-- Branch 1: Reflected (green) -->
  <rect x="70" y="338" width="180" height="72" rx="8" fill="#4ADE80" opacity="0.14"/>
  <rect x="70" y="338" width="180" height="72" rx="8" fill="none" stroke="#4ADE80" stroke-width="2.5"/>
  <text x="160" y="368" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor">Reflected Light</text>
  <text x="160" y="390" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">Bounces off the surface</text>

  <!-- Branch 2: Absorbed (red) -->
  <rect x="310" y="338" width="180" height="72" rx="8" fill="#E63946" opacity="0.12"/>
  <rect x="310" y="338" width="180" height="72" rx="8" fill="none" stroke="#E63946" stroke-width="2.5"/>
  <text x="400" y="368" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor">Absorbed Light</text>
  <text x="400" y="390" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">Taken in by the material</text>

  <!-- Branch 3: Transmitted (cyan/blue) -->
  <rect x="550" y="338" width="180" height="72" rx="8" fill="#4A9EFF" opacity="0.14"/>
  <rect x="550" y="338" width="180" height="72" rx="8" fill="none" stroke="#4A9EFF" stroke-width="2.5"/>
  <text x="640" y="368" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor">Transmitted Light</text>
  <text x="640" y="390" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">Passes into the material</text>

  <!-- Leaf: Specular (green) -->
  <rect x="28" y="458" width="128" height="64" rx="8" fill="#4ADE80" opacity="0.10"/>
  <rect x="28" y="458" width="128" height="64" rx="8" fill="none" stroke="#4ADE80" stroke-width="2" opacity="0.85"/>
  <text x="92" y="486" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Specular</text>
  <text x="92" y="505" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.6">Sharp highlight</text>

  <!-- Leaf: Diffuse (green) -->
  <rect x="164" y="458" width="128" height="64" rx="8" fill="#4ADE80" opacity="0.10"/>
  <rect x="164" y="458" width="128" height="64" rx="8" fill="none" stroke="#4ADE80" stroke-width="2" opacity="0.85"/>
  <text x="228" y="486" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Diffuse</text>
  <text x="228" y="505" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.6">Soft scatter</text>

  <!-- Leaf: Heat (red) -->
  <rect x="336" y="458" width="128" height="64" rx="8" fill="#E63946" opacity="0.10"/>
  <rect x="336" y="458" width="128" height="64" rx="8" fill="none" stroke="#E63946" stroke-width="2" opacity="0.85"/>
  <text x="400" y="486" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Heat</text>
  <text x="400" y="505" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.6">Energy lost</text>

  <!-- Leaf: Through material (blue) -->
  <rect x="576" y="458" width="128" height="64" rx="8" fill="#4A9EFF" opacity="0.10"/>
  <rect x="576" y="458" width="128" height="64" rx="8" fill="none" stroke="#4A9EFF" stroke-width="2" opacity="0.85"/>
  <text x="640" y="482" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Through</text>
  <text x="640" y="500" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Material</text>
  <text x="640" y="516" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.6">Refraction / SSS</text>

  <!-- Conservation reminder band -->
  <rect x="120" y="556" width="560" height="40" rx="8" fill="#FF6B00" opacity="0.10"/>
  <rect x="120" y="556" width="560" height="40" rx="8" fill="none" stroke="#FF6B00" stroke-width="2" opacity="0.5"/>
  <text x="400" y="581" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor">Reflected + Absorbed + Transmitted = 100%</text>

  <!-- Footer tip callout (Variant B, left rail) -->
  <rect x="40" y="641" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> The split shifts with the material, but the three shares always add back to 100%.
  </text>
</svg>
