<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="rod-title rod-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="rod-title">Raycast Operation Diagram</title>
  <desc id="rod-desc">Rays are cast from a row of source points in one direction; rays that strike a target surface register a hit and stop at the surface, while rays that miss the surface pass through unobstructed.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Raycast Operation</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Shoot a ray from each point and see what it hits</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Left label: source row -->
  <text x="40" y="138" font-size="18" font-weight="600" fill="currentColor">Source points</text>
  <text x="40" y="158" font-size="13" fill="currentColor" opacity="0.6">cast a ray in the Ray Direction</text>

  <!-- Arrowhead markers -->
  <defs>
    <marker id="rod-hit" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <circle cx="4.5" cy="4.5" r="3.5" fill="#E63946"/>
    </marker>
    <marker id="rod-clear" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#4ADE80" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Target surface: angled slab in mid-right, partial height so some rays clear it -->
  <text x="540" y="138" font-size="18" font-weight="600" fill="currentColor" text-anchor="end">Target surface</text>
  <polygon points="470,175 500,175 500,365 470,365" fill="currentColor" opacity="0.08"/>
  <line x1="485" y1="172" x2="485" y2="368" stroke="currentColor" stroke-width="2.5" opacity="0.55"/>

  <!-- Source dots -->
  <g fill="#4A9EFF">
    <circle cx="120" cy="200" r="6"/>
    <circle cx="120" cy="250" r="6"/>
    <circle cx="120" cy="300" r="6"/>
    <circle cx="120" cy="350" r="6"/>
    <circle cx="120" cy="400" r="6"/>
    <circle cx="120" cy="450" r="6"/>
  </g>

  <!-- HIT rays: stop at surface x=485, red dot marker -->
  <g stroke="#E63946" stroke-width="2.5" stroke-linecap="round">
    <line x1="130" y1="200" x2="483" y2="200" marker-end="url(#rod-hit)"/>
    <line x1="130" y1="250" x2="483" y2="250" marker-end="url(#rod-hit)"/>
    <line x1="130" y1="300" x2="483" y2="300" marker-end="url(#rod-hit)"/>
    <line x1="130" y1="350" x2="483" y2="350" marker-end="url(#rod-hit)"/>
  </g>

  <!-- CLEAR rays: below the slab, pass through to the right, green arrow -->
  <g stroke="#4ADE80" stroke-width="2.5" stroke-linecap="round">
    <line x1="130" y1="400" x2="690" y2="400" marker-end="url(#rod-clear)"/>
    <line x1="130" y1="450" x2="690" y2="450" marker-end="url(#rod-clear)"/>
  </g>

  <!-- Legend -->
  <g>
    <circle cx="330" cy="486" r="5" fill="#E63946"/>
    <text x="344" y="490" font-size="13" fill="currentColor">Hit &#183; ray stops at the surface, Is Hit = true</text>
  </g>

  <!-- Footer tip Variant B -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Raycast returns Is Hit, Hit Position, and Hit Normal &#183; align instances to a surface below or drape geometry onto it.</text>
</svg>
