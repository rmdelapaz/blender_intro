<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" color="#222" role="img" aria-labelledby="wf-title wf-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <title id="wf-title">The cloth simulation workflow</title>
    <desc id="wf-desc">A top-to-bottom flowchart of the cloth simulation process. Setup the scene, add cloth physics and configure settings, then test the simulation. A decision asks whether the result is satisfactory. If no, the flow loops back to adjust settings and test again. If yes, the flow proceeds to bake the simulation and finally render. Setup steps are blue, the test and adjust iteration loop is orange, and the final bake and render steps are green.</desc>
    <style>
        .wf-h{font:700 24px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:currentColor}
        .wf-sub{font:400 14px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:currentColor;opacity:.65}
        .wf-t{font:700 15px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:currentColor}
        .wf-d{font:400 12px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:currentColor;opacity:.62}
        .wf-num{font:700 13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
        .wf-flow{stroke:#FF8C00;stroke-width:2.5;fill:none}
        .wf-loop{stroke:#FF8C00;stroke-width:2;fill:none;stroke-dasharray:6 4}
    </style>
    <defs>
        <marker id="wf-h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF8C00"/></marker>
    </defs>
    <rect x="0" y="0" width="800" height="3" fill="#FF8C00"/>
    <text x="40" y="50" class="wf-h">CLOTH SIMULATION WORKFLOW</text>
    <text x="40" y="76" class="wf-sub">Setup &#183; configure &#183; test &#183; adjust loop &#183; bake &#183; render</text>
    <line x1="40" y1="96" x2="760" y2="96" stroke="currentColor" stroke-width="1" opacity="0.15"/>

    <!-- Column of boxes centred near x=250, width 320. Decision diamond + loop on the right. -->
    <!-- Box helper geometry: x=90 w=320 h=58 -->

    <!-- 1 Setup (blue) -->
    <g transform="translate(90,118)">
        <rect width="320" height="58" rx="8" fill="#4A9EFF" fill-opacity="0.10" stroke="#4A9EFF" stroke-width="1.6"/>
        <text x="18" y="27" class="wf-num" fill="#4A9EFF">01</text>
        <text x="46" y="26" class="wf-t">Set up the scene</text>
        <text x="46" y="46" class="wf-d">Cloth object + collision objects in place</text>
    </g>
    <line class="wf-flow" x1="250" y1="176" x2="250" y2="190" marker-end="url(#wf-h)"/>

    <!-- 2 Add cloth physics + configure (blue) -->
    <g transform="translate(90,192)">
        <rect width="320" height="58" rx="8" fill="#4A9EFF" fill-opacity="0.10" stroke="#4A9EFF" stroke-width="1.6"/>
        <text x="18" y="27" class="wf-num" fill="#4A9EFF">02</text>
        <text x="46" y="26" class="wf-t">Add cloth physics &amp; configure</text>
        <text x="46" y="46" class="wf-d">Quality, mass, stiffness, collision settings</text>
    </g>
    <line class="wf-flow" x1="250" y1="250" x2="250" y2="264" marker-end="url(#wf-h)"/>

    <!-- 3 Test (orange) -->
    <g transform="translate(90,266)">
        <rect width="320" height="58" rx="8" fill="#FF8C00" fill-opacity="0.10" stroke="#FF8C00" stroke-width="1.6"/>
        <text x="18" y="27" class="wf-num" fill="#FF8C00">03</text>
        <text x="46" y="26" class="wf-t">Test the simulation</text>
        <text x="46" y="46" class="wf-d">Scrub the timeline &#183; watch it drape &amp; settle</text>
    </g>
    <line class="wf-flow" x1="250" y1="324" x2="250" y2="338" marker-end="url(#wf-h)"/>

    <!-- Decision diamond: Satisfied? centre (250,392) -->
    <polygon points="250,348 360,392 250,436 140,392" fill="#FF8C00" fill-opacity="0.10" stroke="#FF8C00" stroke-width="1.6"/>
    <text x="250" y="388" class="wf-t" text-anchor="middle">Satisfied with</text>
    <text x="250" y="406" class="wf-t" text-anchor="middle">the result?</text>

    <!-- YES down to bake -->
    <line class="wf-flow" x1="250" y1="436" x2="250" y2="464" marker-end="url(#wf-h)"/>
    <text x="262" y="456" class="wf-num" fill="#4CAF50">YES</text>

    <!-- NO branch: right then up to an Adjust box, then back into Test -->
    <g transform="translate(470,266)">
        <rect width="250" height="58" rx="8" fill="#FF8C00" fill-opacity="0.10" stroke="#FF8C00" stroke-width="1.6"/>
        <text x="18" y="27" class="wf-num" fill="#FF8C00">&#8635;</text>
        <text x="44" y="26" class="wf-t">Adjust settings</text>
        <text x="44" y="46" class="wf-d">Tweak quality, stiffness, distance</text>
    </g>
    <!-- NO: from diamond right vertex to adjust box bottom -->
    <path class="wf-loop" d="M360,392 L595,392 L595,324" marker-end="url(#wf-h)"/>
    <text x="406" y="384" class="wf-num" fill="#f44336">NO</text>
    <!-- adjust back into test: adjust left edge to test right edge -->
    <path class="wf-loop" d="M470,295 L410,295" marker-end="url(#wf-h)"/>

    <!-- 4 Bake (green) -->
    <g transform="translate(90,466)">
        <rect width="320" height="58" rx="8" fill="#4CAF50" fill-opacity="0.10" stroke="#4CAF50" stroke-width="1.6"/>
        <text x="18" y="27" class="wf-num" fill="#4CAF50">04</text>
        <text x="46" y="26" class="wf-t">Bake the simulation</text>
        <text x="46" y="46" class="wf-d">Cache every frame to disk &#183; locks the motion</text>
    </g>
    <line class="wf-flow" x1="250" y1="524" x2="250" y2="538" marker-end="url(#wf-h)"/>

    <!-- 5 Render (green) -->
    <g transform="translate(90,540)">
        <rect width="320" height="52" rx="8" fill="#4CAF50" fill-opacity="0.10" stroke="#4CAF50" stroke-width="1.6"/>
        <text x="18" y="25" class="wf-num" fill="#4CAF50">05</text>
        <text x="46" y="24" class="wf-t">Render</text>
        <text x="46" y="43" class="wf-d">Final frames or animation from the baked cache</text>
    </g>

    <!-- side note -->
    <text x="470" y="470" class="wf-d">The test &#8594; adjust loop is</text>
    <text x="470" y="488" class="wf-d">where most of the work</text>
    <text x="470" y="506" class="wf-d">happens. Only bake once</text>
    <text x="470" y="524" class="wf-d">the drape looks right &#183;</text>
    <text x="470" y="542" class="wf-d">baking locks it in.</text>
</svg>
