<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="mb-title mb-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="mb-title">Base Color Values for Common Metals</title>
  <desc id="mb-desc">A reference chart of base colors for four metals at Metallic 1.0 and Roughness 0.1. Gold is a warm yellow-orange (hex FFB54A), Copper a reddish-brown (hex F2A389), Steel a neutral blue-grey (hex 8F9194), and Aluminum a bright near-white grey (hex E8EBEB). Each entry shows a swatch disc with its RGB and hex values.</desc>

  <defs>
    <radialGradient id="mb-gold" cx="38%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#FFD78A"/>
      <stop offset="55%" stop-color="#FFB54A"/>
      <stop offset="100%" stop-color="#B5781F"/>
    </radialGradient>
    <radialGradient id="mb-copper" cx="38%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#F8C3AE"/>
      <stop offset="55%" stop-color="#F2A389"/>
      <stop offset="100%" stop-color="#A85E45"/>
    </radialGradient>
    <radialGradient id="mb-steel" cx="38%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#C2C4C7"/>
      <stop offset="55%" stop-color="#8F9194"/>
      <stop offset="100%" stop-color="#54565A"/>
    </radialGradient>
    <radialGradient id="mb-alum" cx="38%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#FBFCFC"/>
      <stop offset="55%" stop-color="#E8EBEB"/>
      <stop offset="100%" stop-color="#9DA2A2"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Base Color Values for Common Metals</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">All set with Metallic 1.0 and Roughness 0.1 &#183; base color tints the reflection, not a paint layer</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Gold (top-left) -->
  <circle cx="110" cy="196" r="58" fill="url(#mb-gold)" stroke="currentColor" stroke-opacity="0.18" stroke-width="1"/>
  <ellipse cx="92" cy="178" rx="20" ry="12" fill="#ffffff" opacity="0.30"/>
  <text x="196" y="172" font-size="18" font-weight="700" fill="currentColor">Gold</text>
  <text x="196" y="200" font-size="14" font-weight="700" fill="currentColor">#FFB54A</text>
  <text x="196" y="224" font-size="13" fill="currentColor" opacity="0.7">RGB 1.0 &#183; 0.71 &#183; 0.29</text>
  <text x="196" y="246" font-size="13" fill="currentColor" opacity="0.6">Warm yellow-orange</text>

  <!-- Copper (top-right) -->
  <circle cx="490" cy="196" r="58" fill="url(#mb-copper)" stroke="currentColor" stroke-opacity="0.18" stroke-width="1"/>
  <ellipse cx="472" cy="178" rx="20" ry="12" fill="#ffffff" opacity="0.30"/>
  <text x="576" y="172" font-size="18" font-weight="700" fill="currentColor">Copper</text>
  <text x="576" y="200" font-size="14" font-weight="700" fill="currentColor">#F2A389</text>
  <text x="576" y="224" font-size="13" fill="currentColor" opacity="0.7">RGB 0.95 &#183; 0.64 &#183; 0.54</text>
  <text x="576" y="246" font-size="13" fill="currentColor" opacity="0.6">Reddish-brown</text>

  <!-- divider line between rows -->
  <line x1="40" y1="300" x2="760" y2="300" stroke="currentColor" stroke-width="1" opacity="0.12"/>

  <!-- Steel (bottom-left) -->
  <circle cx="110" cy="380" r="58" fill="url(#mb-steel)" stroke="currentColor" stroke-opacity="0.18" stroke-width="1"/>
  <ellipse cx="92" cy="362" rx="20" ry="12" fill="#ffffff" opacity="0.30"/>
  <text x="196" y="356" font-size="18" font-weight="700" fill="currentColor">Steel / Iron</text>
  <text x="196" y="384" font-size="14" font-weight="700" fill="currentColor">#8F9194</text>
  <text x="196" y="408" font-size="13" fill="currentColor" opacity="0.7">RGB 0.56 &#183; 0.57 &#183; 0.58</text>
  <text x="196" y="430" font-size="13" fill="currentColor" opacity="0.6">Neutral blue-grey</text>

  <!-- Aluminum (bottom-right) -->
  <circle cx="490" cy="380" r="58" fill="url(#mb-alum)" stroke="currentColor" stroke-opacity="0.18" stroke-width="1"/>
  <ellipse cx="472" cy="362" rx="20" ry="12" fill="#ffffff" opacity="0.30"/>
  <text x="576" y="356" font-size="18" font-weight="700" fill="currentColor">Aluminum</text>
  <text x="576" y="384" font-size="14" font-weight="700" fill="currentColor">#E8EBEB</text>
  <text x="576" y="408" font-size="13" fill="currentColor" opacity="0.7">RGB 0.91 &#183; 0.92 &#183; 0.92</text>
  <text x="576" y="430" font-size="13" fill="currentColor" opacity="0.6">Bright near-white grey</text>

  <!-- Footer tip (Variant B) -->
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Real metals are never pure white or pure black. These measured values keep reflections believable.
  </text>
</svg>
