<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="rr-title rr-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="rr-title">Real-time rendering versus ray tracing</title>
  <desc id="rr-desc">A split diagram. The left side shows Eevee using rasterization: 3D geometry projected straight to 2D screen pixels in a single fast pass, labelled fast approximation. The right side shows Cycles using path tracing: light rays bouncing between surfaces many times before reaching the camera, labelled physically accurate. A vertical divider separates the two approaches.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Real-Time vs Ray Tracing</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Two ways to turn a 3D scene into a 2D image</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Vertical divider -->
  <line x1="400" y1="130" x2="400" y2="500" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ===== LEFT: EEVEE rasterization ===== -->
  <text x="60" y="152" font-size="18" font-weight="600" fill="#FF6B00">EEVEE &#183; Rasterization</text>
  <text x="60" y="176" font-size="13" fill="currentColor" opacity="0.6">One fast pass: geometry straight to pixels</text>

  <!-- 3D geometry box (left) -->
  <rect x="60" y="210" width="96" height="96" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
  <!-- simple cube glyph -->
  <g stroke="#FF6B00" stroke-width="2" fill="none" stroke-linejoin="round">
    <rect x="82" y="232" width="40" height="40"/>
    <path d="M 82 232 L 98 218 L 138 218 L 138 258 L 122 272"/>
    <line x1="122" y1="232" x2="138" y2="218"/>
  </g>
  <text x="108" y="324" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.6">3D geometry</text>

  <!-- fast-forward arrows -->
  <g fill="#FF6B00">
    <polygon points="186,252 206,262 186,272"/>
    <polygon points="206,252 226,262 206,272"/>
    <polygon points="226,252 246,262 226,272"/>
  </g>
  <text x="216" y="296" font-size="11" text-anchor="middle" fill="#FF6B00" font-weight="600">one pass</text>

  <!-- 2D screen pixels (left) -->
  <rect x="276" y="210" width="96" height="96" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
  <g fill="#FF6B00" opacity="0.85">
    <rect x="290" y="224" width="20" height="20"/><rect x="312" y="224" width="20" height="20"/><rect x="334" y="224" width="20" height="20"/>
    <rect x="290" y="246" width="20" height="20"/><rect x="312" y="246" width="20" height="20"/><rect x="334" y="246" width="20" height="20"/>
    <rect x="290" y="268" width="20" height="20"/><rect x="312" y="268" width="20" height="20"/><rect x="334" y="268" width="20" height="20"/>
  </g>
  <text x="324" y="324" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.6">2D pixels</text>

  <!-- left summary chip -->
  <rect x="60" y="372" width="312" height="92" rx="6" fill="#FF6B00" fill-opacity="0.08"/>
  <text x="76" y="398" font-size="14" font-weight="600" fill="currentColor">Fast approximation</text>
  <text x="76" y="422" font-size="12.5" fill="currentColor" opacity="0.7">Clever shortcuts, GPU-parallel</text>
  <text x="76" y="442" font-size="12.5" fill="currentColor" opacity="0.7">Milliseconds per frame</text>
  <text x="76" y="458" font-size="12.5" fill="currentColor" opacity="0.55">Great for previews, games, animation</text>

  <!-- ===== RIGHT: CYCLES path tracing ===== -->
  <text x="440" y="152" font-size="18" font-weight="600" fill="#4A9EFF">CYCLES &#183; Path Tracing</text>
  <text x="440" y="176" font-size="13" fill="currentColor" opacity="0.6">Many rays, bouncing until they find light</text>

  <!-- scene box (right) with bouncing rays -->
  <rect x="440" y="210" width="280" height="96" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
  <!-- camera glyph -->
  <g fill="#4A9EFF">
    <rect x="454" y="248" width="22" height="16" rx="2"/>
    <polygon points="476,250 488,244 488,268 476,262"/>
  </g>
  <text x="465" y="282" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.6">camera</text>
  <!-- surfaces -->
  <line x1="600" y1="222" x2="700" y2="222" stroke="currentColor" stroke-width="2" opacity="0.45"/>
  <line x1="690" y1="232" x2="690" y2="296" stroke="currentColor" stroke-width="2" opacity="0.45"/>
  <line x1="560" y1="296" x2="700" y2="296" stroke="currentColor" stroke-width="2" opacity="0.45"/>
  <!-- light glyph -->
  <circle cx="660" cy="232" r="7" fill="#F5C242"/>
  <g stroke="#F5C242" stroke-width="1.5" stroke-linecap="round">
    <line x1="660" y1="216" x2="660" y2="220"/><line x1="676" y1="232" x2="672" y2="232"/><line x1="648" y1="232" x2="644" y2="232"/>
  </g>
  <!-- bouncing ray path camera->surface->surface->light -->
  <path d="M 488 256 L 575 290 L 688 268 L 660 240" fill="none" stroke="#4A9EFF" stroke-width="2" stroke-linejoin="round"/>
  <g fill="#4A9EFF">
    <circle cx="575" cy="290" r="3.5"/><circle cx="688" cy="268" r="3.5"/>
  </g>
  <!-- bounce labels -->
  <text x="556" y="246" font-size="11" fill="#4A9EFF" font-weight="600">bounce &#215; many</text>

  <!-- right summary chip -->
  <rect x="440" y="372" width="280" height="92" rx="6" fill="#4A9EFF" fill-opacity="0.08"/>
  <text x="456" y="398" font-size="14" font-weight="600" fill="currentColor">Physically accurate</text>
  <text x="456" y="422" font-size="12.5" fill="currentColor" opacity="0.7">Simulates real light transport</text>
  <text x="456" y="442" font-size="12.5" fill="currentColor" opacity="0.7">Seconds to minutes per frame</text>
  <text x="456" y="458" font-size="12.5" fill="currentColor" opacity="0.55">Great for stills, hero shots, realism</text>

  <!-- Footer tip (Variant B left rail) -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Same scene, same materials. The engine decides how the image is computed, not how it looks on disk.</text>
</svg>
