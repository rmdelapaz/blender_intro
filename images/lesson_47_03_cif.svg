<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="cifTitle cifDesc" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" color="#222">
  <title id="cifTitle">The Compositor Interface</title>
  <desc id="cifDesc">Anatomy of Blender's Compositor editor: a top header with the Use Nodes toggle and backdrop control, the large node-graph work area in the middle showing a Render Layers input wired through a color node to a Composite output, a backdrop preview of the image, and the N-panel on the right for node properties.</desc>
  <style>
    .hd{fill:currentColor;font-size:19px;font-weight:700;}
    .sub{fill:#9aa4b2;font-size:11px;}
    .win{fill:#1b1b1b;stroke:#555;stroke-width:1;}
    .bar{fill:#333;}
    .node{stroke-width:1.5;rx:5;}
    .nt{fill:#ffffff;font-size:10px;font-weight:700;}
    .cap{fill:#F5C242;font-size:11px;font-weight:700;}
    .capx{fill:#9aa4b2;font-size:10px;}
    .sock{stroke:#222;stroke-width:1;}
  </style>
  <text x="20" y="34" class="hd">Compositor editor anatomy</text>
  <text x="20" y="54" class="sub">Shading workspace &#8594; Compositing tab. Enable "Use Nodes" to start.</text>

  <!-- editor window -->
  <rect class="win" x="20" y="70" width="600" height="310" rx="6"/>
  <!-- header bar -->
  <rect class="bar" x="20" y="70" width="600" height="26"/>
  <rect x="30" y="76" width="70" height="14" rx="3" fill="#FF6B00"/>
  <text x="38" y="87" class="nt">Use Nodes</text>
  <rect x="110" y="76" width="66" height="14" rx="3" fill="#4A9EFF"/>
  <text x="118" y="87" class="nt">Backdrop</text>
  <text x="560" y="87" class="capx">Header</text>

  <!-- backdrop preview -->
  <rect x="360" y="112" width="230" height="150" rx="4" fill="#0f0f0f" stroke="#4A9EFF" stroke-dasharray="4 3"/>
  <circle cx="475" cy="187" r="40" fill="#3a3f4a"/>
  <text x="368" y="255" class="capx" fill="#4A9EFF">Backdrop preview (viewer output)</text>

  <!-- nodes: Render Layers -->
  <g>
    <rect class="node" x="40" y="150" width="110" height="70" fill="#2a2a2a" stroke="#4ADE80"/>
    <rect x="40" y="150" width="110" height="18" rx="5" fill="#4ADE80"/>
    <text x="48" y="163" class="nt" fill="#14351f">Render Layers</text>
    <text x="48" y="188" class="capx" fill="#d4d4d4">Image</text>
    <circle class="sock" cx="150" cy="185" r="4" fill="#c8c866"/>
    <text x="48" y="206" class="capx" fill="#d4d4d4">Alpha</text>
    <circle class="sock" cx="150" cy="200" r="4" fill="#888"/>
  </g>
  <!-- color node -->
  <g>
    <rect class="node" x="185" y="160" width="96" height="50" fill="#2a2a2a" stroke="#B47EE8"/>
    <rect x="185" y="160" width="96" height="18" rx="5" fill="#B47EE8"/>
    <text x="193" y="173" class="nt">Color Balance</text>
    <circle class="sock" cx="185" cy="196" r="4" fill="#c8c866"/>
    <circle class="sock" cx="281" cy="196" r="4" fill="#c8c866"/>
  </g>
  <!-- composite -->
  <g>
    <rect class="node" x="300" y="160" width="50" height="50" fill="#2a2a2a" stroke="#FF6B00"/>
    <rect x="300" y="160" width="50" height="18" rx="5" fill="#FF6B00"/>
    <text x="305" y="173" class="nt">Comp</text>
    <circle class="sock" cx="300" cy="196" r="4" fill="#c8c866"/>
  </g>
  <!-- wires -->
  <path d="M150 185 C 168 185 168 196 185 196" fill="none" stroke="#c8c866" stroke-width="2"/>
  <path d="M281 196 C 291 196 291 196 300 196" fill="none" stroke="#c8c866" stroke-width="2"/>
  <text x="40" y="300" class="capx">Node graph work area &#8212; drag, connect, mute nodes here</text>

  <!-- N panel -->
  <rect class="win" x="632" y="70" width="108" height="310" rx="6"/>
  <rect class="bar" x="632" y="70" width="108" height="22"/>
  <text x="642" y="85" class="nt">N-Panel</text>
  <rect x="642" y="104" width="88" height="10" rx="2" fill="#3a3a3a"/>
  <rect x="642" y="122" width="88" height="10" rx="2" fill="#3a3a3a"/>
  <rect x="642" y="140" width="60" height="10" rx="2" fill="#4A9EFF"/>
  <rect x="642" y="162" width="88" height="10" rx="2" fill="#3a3a3a"/>
  <rect x="642" y="180" width="70" height="10" rx="2" fill="#3a3a3a"/>
  <text x="638" y="360" class="capx">Node properties</text>

  <!-- callout captions -->
  <text x="20" y="398" class="cap">Header <tspan class="capx">= Use Nodes / Backdrop toggles</tspan>   <tspan class="cap">Work area</tspan><tspan class="capx"> = graph</tspan>   <tspan class="cap">Backdrop</tspan><tspan class="capx"> = live preview</tspan>   <tspan class="cap">N-panel</tspan><tspan class="capx"> = properties</tspan></text>
</svg>
