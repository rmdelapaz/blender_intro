<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" color="#222" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" role="img" aria-labelledby="cam49-t cam49-d">
  <title id="cam49-t">The Essential ArchViz Camera Angles</title>
  <desc id="cam49-d">A plan view of a building with the five standard architectural camera positions arranged around it &#8212; eye-level, elevated, low, corner, and detail &#8212; each annotated with its typical height and focal length and the impression it creates.</desc>
  <rect x="0" y="0" width="760" height="440" fill="none"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="currentColor">The Five Standard ArchViz Camera Angles</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#8a8f98">Plan view &#8212; where to stand, how high, and what each shot says</text>

  <!-- building footprint (center) -->
  <rect x="330" y="200" width="100" height="80" rx="4" fill="#1a1a1a" stroke="#8a8f98" stroke-width="1.5"/>
  <text x="380" y="245" text-anchor="middle" font-size="12" fill="#c9ccd1">building</text>
  <text x="380" y="262" text-anchor="middle" font-size="10" fill="#8a8f98">(footprint)</text>

  <!-- EYE-LEVEL: front, straight on -->
  <g>
    <circle cx="380" cy="380" r="9" fill="#4A9EFF"/>
    <line x1="380" y1="371" x2="380" y2="288" stroke="#4A9EFF" stroke-width="1.4" stroke-dasharray="4 4" opacity="0.8"/>
    <rect x="300" y="392" width="160" height="40" rx="6" fill="#1a1a1a" stroke="#4A9EFF" stroke-width="1.4"/>
    <text x="380" y="409" text-anchor="middle" font-size="12" font-weight="700" fill="#4A9EFF">Eye-level</text>
    <text x="380" y="425" text-anchor="middle" font-size="10" fill="#c9ccd1">~1.6m &#183; 35&#8211;50mm &#183; natural, relatable</text>
  </g>

  <!-- ELEVATED: front-high -->
  <g>
    <circle cx="150" cy="130" r="9" fill="#FF6B00"/>
    <line x1="158" y1="136" x2="332" y2="210" stroke="#FF6B00" stroke-width="1.4" stroke-dasharray="4 4" opacity="0.8"/>
    <rect x="40" y="92" width="176" height="40" rx="6" fill="#1a1a1a" stroke="#FF6B00" stroke-width="1.4"/>
    <text x="128" y="109" text-anchor="middle" font-size="12" font-weight="700" fill="#FF6B00">Elevated</text>
    <text x="128" y="125" text-anchor="middle" font-size="10" fill="#c9ccd1">3&#8211;10m &#183; shows context &amp; roof</text>
  </g>

  <!-- LOW: dramatic upward -->
  <g>
    <circle cx="150" cy="350" r="9" fill="#E63946"/>
    <line x1="158" y1="344" x2="332" y2="272" stroke="#E63946" stroke-width="1.4" stroke-dasharray="4 4" opacity="0.8"/>
    <rect x="40" y="356" width="176" height="40" rx="6" fill="#1a1a1a" stroke="#E63946" stroke-width="1.4"/>
    <text x="128" y="373" text-anchor="middle" font-size="12" font-weight="700" fill="#E63946">Low</text>
    <text x="128" y="389" text-anchor="middle" font-size="10" fill="#c9ccd1">&lt;1m &#183; monumental, imposing</text>
  </g>

  <!-- CORNER: two-facade three-quarter -->
  <g>
    <circle cx="610" cy="130" r="9" fill="#4ADE80"/>
    <line x1="602" y1="136" x2="428" y2="210" stroke="#4ADE80" stroke-width="1.4" stroke-dasharray="4 4" opacity="0.8"/>
    <rect x="544" y="92" width="176" height="40" rx="6" fill="#1a1a1a" stroke="#4ADE80" stroke-width="1.4"/>
    <text x="632" y="109" text-anchor="middle" font-size="12" font-weight="700" fill="#4ADE80">Corner (3/4)</text>
    <text x="632" y="125" text-anchor="middle" font-size="10" fill="#c9ccd1">two facades &#183; depth &amp; volume</text>
  </g>

  <!-- DETAIL: close, tight -->
  <g>
    <circle cx="610" cy="350" r="9" fill="#B47EE8"/>
    <line x1="602" y1="344" x2="428" y2="272" stroke="#B47EE8" stroke-width="1.4" stroke-dasharray="4 4" opacity="0.8"/>
    <rect x="544" y="356" width="176" height="40" rx="6" fill="#1a1a1a" stroke="#B47EE8" stroke-width="1.4"/>
    <text x="632" y="373" text-anchor="middle" font-size="12" font-weight="700" fill="#B47EE8">Detail</text>
    <text x="632" y="389" text-anchor="middle" font-size="10" fill="#c9ccd1">close &#183; 85mm+ &#183; materials &amp; craft</text>
  </g>
</svg>
