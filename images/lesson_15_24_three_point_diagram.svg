<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" color="#222" role="img" aria-labelledby="tp-title tp-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="tp-title">Three-point lighting setup, top-down view</title>
  <desc id="tp-desc">A bird's-eye diagram of classic three-point lighting: a subject in the center with a key light front-right at 45 degrees, a fill light front-left, a rim light behind, the camera at the bottom, with aim arrows and power ratios labeled.</desc>

  <defs>
    <marker id="tp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FF6B00"/>
    </marker>
    <radialGradient id="tp-keyglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0.55"/>
    </radialGradient>
    <radialGradient id="tp-fillglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4A9EFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4A9EFF" stop-opacity="0.5"/>
    </radialGradient>
    <radialGradient id="tp-rimglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5C242" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F5C242" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <!-- header -->
  <rect x="0" y="0" width="800" height="6" fill="#FF6B00"/>
  <text x="32" y="44" font-size="24" font-weight="700" fill="currentColor">THREE-POINT LIGHTING</text>
  <text x="32" y="68" font-size="15" fill="currentColor" opacity="0.65">Top-down view &#183; key &#183; fill &#183; rim &#183; camera</text>
  <line x1="32" y1="82" x2="768" y2="82" stroke="currentColor" stroke-opacity="0.18" stroke-width="1"/>

  <!-- subject + camera reference axis (center subject at 400,300) -->
  <!-- aim arrows (drawn first, behind discs/subject) -->
  <g stroke-width="3">
    <line x1="615" y1="180" x2="452" y2="270" stroke="#FF6B00" marker-end="url(#tp-arrow)"/>
    <line x1="190" y1="185" x2="350" y2="272" stroke="#4A9EFF" marker-end="url(#tp-arrow)" opacity="0.95"/>
    <line x1="612" y1="438" x2="455" y2="338" stroke="#F5C242" marker-end="url(#tp-arrow)" opacity="0.95"/>
  </g>

  <!-- 45 degree arcs at subject for key and fill -->
  <g fill="none" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.4" stroke-dasharray="4 4">
    <!-- camera axis up from subject -->
    <line x1="400" y1="300" x2="400" y2="470" stroke-opacity="0.3"/>
    <!-- key 45 arc -->
    <path d="M400,235 A65,65 0 0,1 446,254"/>
    <!-- fill 45 arc -->
    <path d="M354,254 A65,65 0 0,1 400,235"/>
  </g>
  <text x="430" y="232" font-size="12" fill="currentColor" opacity="0.7">45&#176;</text>
  <text x="346" y="232" font-size="12" fill="currentColor" opacity="0.7" text-anchor="end">45&#176;</text>

  <!-- subject -->
  <circle cx="400" cy="300" r="34" fill="#3d3d3d"/>
  <circle cx="400" cy="300" r="34" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="400" y="356" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">Subject</text>

  <!-- camera -->
  <g>
    <rect x="372" y="486" width="56" height="34" rx="5" fill="none" stroke="currentColor" stroke-width="2"/>
    <path d="M428,494 L446,486 L446,520 L428,512 z" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="400" y="544" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">Camera</text>
  </g>

  <!-- KEY light (front-right, large) -->
  <g>
    <circle cx="640" cy="160" r="44" fill="url(#tp-keyglow)"/>
    <circle cx="640" cy="160" r="44" fill="none" stroke="#FF6B00" stroke-width="2"/>
    <text x="640" y="100" font-size="16" font-weight="700" fill="#FF6B00" text-anchor="middle">KEY</text>
    <text x="640" y="120" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.8">large area &#183; 100%</text>
  </g>

  <!-- FILL light (front-left, medium) -->
  <g>
    <circle cx="165" cy="165" r="33" fill="url(#tp-fillglow)"/>
    <circle cx="165" cy="165" r="33" fill="none" stroke="#4A9EFF" stroke-width="2"/>
    <text x="165" y="116" font-size="16" font-weight="700" fill="#4A9EFF" text-anchor="middle">FILL</text>
    <text x="165" y="134" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.8">medium &#183; 40%</text>
  </g>

  <!-- RIM light (behind-right, small) -->
  <g>
    <circle cx="640" cy="460" r="26" fill="url(#tp-rimglow)"/>
    <circle cx="640" cy="460" r="26" fill="none" stroke="#F5C242" stroke-width="2"/>
    <text x="640" y="506" font-size="16" font-weight="700" fill="#C8930A" text-anchor="middle">RIM</text>
    <text x="640" y="524" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.8">small &#183; 60%</text>
  </g>

  <!-- footer tip (Variant-B left rail) -->
  <g>
    <rect x="32" y="300" width="4" height="180" fill="#FF6B00"/>
    <text x="48" y="322" font-size="13" font-weight="600" fill="currentColor">Why three lights?</text>
    <text x="48" y="344" font-size="12" fill="currentColor" opacity="0.8">Key sets the main form and</text>
    <text x="48" y="360" font-size="12" fill="currentColor" opacity="0.8">shadow direction; fill softens</text>
    <text x="48" y="376" font-size="12" fill="currentColor" opacity="0.8">the shadow side; rim separates</text>
    <text x="48" y="392" font-size="12" fill="currentColor" opacity="0.8">the subject from the background.</text>
    <text x="48" y="420" font-size="12" fill="currentColor" opacity="0.8">Ratios are a starting point.</text>
    <text x="48" y="436" font-size="12" fill="currentColor" opacity="0.8">Adjust each light to taste.</text>
  </g>
</svg>
