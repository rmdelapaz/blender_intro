<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="pc-title pc-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="pc-title">Coffee Mug Project Checklist</title>
  <desc id="pc-desc">A five-phase project roadmap for the coffee mug modeling project. Each phase is a row with a numbered orange badge, a title, a time estimate, and three condensed key tasks: Phase 1 Basic Form (15 minutes), Phase 2 Interior and Walls (15 minutes), Phase 3 Handle Creation (20 minutes), Phase 4 Refinement (10 minutes), and Phase 5 Final Polish (5 to 10 minutes).</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Header -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Project Checklist: Build Your Mug</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">5 phases, about 60 to 75 minutes total · check off each task as you go</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Phase 1: Basic Form -->
  <g id="pc-phase-1">
    <rect x="40" y="130" width="720" height="65" fill="none" stroke="currentColor" stroke-width="1" opacity="0.15"/>
    <circle cx="78" cy="162" r="24" fill="#FF6B00"/>
    <text x="78" y="171" font-size="22" font-weight="700" fill="white" text-anchor="middle">1</text>
    <text x="120" y="152" font-size="16" font-weight="700" fill="currentColor">Basic Form</text>
    <text x="120" y="174" font-size="12" fill="currentColor" opacity="0.65">15 minutes</text>
    <g font-size="12" fill="currentColor" opacity="0.85">
      <text x="370" y="146">&#9744;  Add a cylinder and scale to mug proportions</text>
      <text x="370" y="166">&#9744;  Add 4 to 5 horizontal loop cuts</text>
      <text x="370" y="186">&#9744;  Remove the top face to open the rim</text>
    </g>
  </g>

  <!-- Phase 2: Interior and Walls -->
  <g id="pc-phase-2">
    <rect x="40" y="201" width="720" height="65" fill="none" stroke="currentColor" stroke-width="1" opacity="0.15"/>
    <circle cx="78" cy="233" r="24" fill="#FF6B00"/>
    <text x="78" y="242" font-size="22" font-weight="700" fill="white" text-anchor="middle">2</text>
    <text x="120" y="223" font-size="16" font-weight="700" fill="currentColor">Interior and Walls</text>
    <text x="120" y="245" font-size="12" fill="currentColor" opacity="0.65">15 minutes</text>
    <g font-size="12" fill="currentColor" opacity="0.85">
      <text x="370" y="217">&#9744;  Inset the top edge loop for rim thickness</text>
      <text x="370" y="237">&#9744;  Extrude the interior downward</text>
      <text x="370" y="257">&#9744;  Close the interior bottom with F</text>
    </g>
  </g>

  <!-- Phase 3: Handle Creation -->
  <g id="pc-phase-3">
    <rect x="40" y="272" width="720" height="65" fill="none" stroke="currentColor" stroke-width="1" opacity="0.15"/>
    <circle cx="78" cy="304" r="24" fill="#FF6B00"/>
    <text x="78" y="313" font-size="22" font-weight="700" fill="white" text-anchor="middle">3</text>
    <text x="120" y="294" font-size="16" font-weight="700" fill="currentColor">Handle Creation</text>
    <text x="120" y="316" font-size="12" fill="currentColor" opacity="0.65">20 minutes</text>
    <g font-size="12" fill="currentColor" opacity="0.85">
      <text x="370" y="288">&#9744;  Select two attachment faces and extrude stubs</text>
      <text x="370" y="308">&#9744;  Build the arc with extrude-rotate segments</text>
      <text x="370" y="328">&#9744;  Bridge the arc to the bottom stub</text>
    </g>
  </g>

  <!-- Phase 4: Refinement -->
  <g id="pc-phase-4">
    <rect x="40" y="343" width="720" height="65" fill="none" stroke="currentColor" stroke-width="1" opacity="0.15"/>
    <circle cx="78" cy="375" r="24" fill="#FF6B00"/>
    <text x="78" y="384" font-size="22" font-weight="700" fill="white" text-anchor="middle">4</text>
    <text x="120" y="365" font-size="16" font-weight="700" fill="currentColor">Refinement</text>
    <text x="120" y="387" font-size="12" fill="currentColor" opacity="0.65">10 minutes</text>
    <g font-size="12" fill="currentColor" opacity="0.85">
      <text x="370" y="359">&#9744;  Taper the top and bevel the rim edge</text>
      <text x="370" y="379">&#9744;  Smooth handle joints with proportional editing</text>
      <text x="370" y="399">&#9744;  Merge by Distance and check non-manifold</text>
    </g>
  </g>

  <!-- Phase 5: Final Polish -->
  <g id="pc-phase-5">
    <rect x="40" y="414" width="720" height="65" fill="none" stroke="currentColor" stroke-width="1" opacity="0.15"/>
    <circle cx="78" cy="446" r="24" fill="#FF6B00"/>
    <text x="78" y="455" font-size="22" font-weight="700" fill="white" text-anchor="middle">5</text>
    <text x="120" y="436" font-size="16" font-weight="700" fill="currentColor">Final Polish</text>
    <text x="120" y="458" font-size="12" fill="currentColor" opacity="0.65">5 to 10 minutes</text>
    <g font-size="12" fill="currentColor" opacity="0.85">
      <text x="370" y="430">&#9744;  Apply smooth shading</text>
      <text x="370" y="450">&#9744;  Auto Smooth and Mark Sharp where needed</text>
      <text x="370" y="470">&#9744;  Set origin to bottom center and final save</text>
    </g>
  </g>

  <!-- Footer tip -->
  <rect x="40" y="506" width="720" height="34" rx="6" fill="#FF6B00" fill-opacity="0.10" stroke="#FF6B00" stroke-opacity="0.4"/>
  <text x="54" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Save (Ctrl+S) at the end of every phase · incremental versions make rollbacks painless.
  </text>
</svg>
