<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="ik-title ik-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="ik-title">IK versus FK: two ways to control a character's arm</title>
  <desc id="ik-desc">A two-panel comparison. The left panel shows Forward Kinematics: the arm is posed by rotating each joint in sequence, shoulder first, then elbow, then wrist, numbered one, two, three. The right panel shows Inverse Kinematics: the hand is dragged to a target and the elbow and shoulder rotations are solved automatically.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">IK vs FK &#183; Two Ways to Pose an Arm</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Forward Kinematics rotates each joint by hand &#183; Inverse Kinematics solves from a hand target</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Panel divider -->
  <line x1="400" y1="138" x2="400" y2="476" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ============ LEFT PANEL: FK ============ -->
  <text x="60" y="160" font-size="18" font-weight="600" fill="currentColor">FK &#183; Forward Kinematics</text>
  <text x="60" y="182" font-size="13" fill="currentColor" opacity="0.6">Rotate joints in order, from the root outward</text>

  <!-- FK arm segments: shoulder -> elbow -> wrist -> hand -->
  <g stroke="#FF6B00" stroke-width="10" stroke-linecap="round" fill="none">
    <line x1="120" y1="250" x2="200" y2="300"/>
    <line x1="200" y1="300" x2="290" y2="280"/>
    <line x1="290" y1="280" x2="350" y2="320"/>
  </g>
  <!-- FK joints -->
  <g fill="#FF6B00">
    <circle cx="120" cy="250" r="9"/>
    <circle cx="200" cy="300" r="9"/>
    <circle cx="290" cy="280" r="9"/>
  </g>
  <circle cx="350" cy="320" r="7" fill="currentColor" opacity="0.55"/>

  <!-- FK rotation arcs + step numbers (currentColor, manual emphasis) -->
  <g fill="none" stroke="currentColor" stroke-width="2.5" opacity="0.85">
    <path d="M 100 232 A 26 26 0 0 1 142 234" marker-end="url(#ik-arc)"/>
    <path d="M 182 282 A 24 24 0 0 1 222 286" marker-end="url(#ik-arc)"/>
    <path d="M 273 262 A 22 22 0 0 1 310 268" marker-end="url(#ik-arc)"/>
  </g>
  <g font-size="14" font-weight="700" fill="currentColor">
    <circle cx="95" cy="222" r="13" fill="currentColor" opacity="0.12"/>
    <text x="95" y="227" text-anchor="middle" fill="currentColor">1</text>
    <circle cx="176" cy="272" r="13" fill="currentColor" opacity="0.12"/>
    <text x="176" y="277" text-anchor="middle" fill="currentColor">2</text>
    <circle cx="266" cy="252" r="13" fill="currentColor" opacity="0.12"/>
    <text x="266" y="257" text-anchor="middle" fill="currentColor">3</text>
  </g>

  <!-- FK joint labels -->
  <g font-size="12" fill="currentColor" opacity="0.6">
    <text x="90" y="248" text-anchor="end">Shoulder</text>
    <text x="178" y="334">Elbow</text>
    <text x="300" y="262">Wrist</text>
  </g>

  <!-- FK takeaway -->
  <text x="60" y="430" font-size="13" font-weight="600" fill="currentColor">Manual &#183; precise arcs, full control</text>
  <text x="60" y="450" font-size="13" fill="currentColor" opacity="0.6">You set every joint angle yourself, root first.</text>

  <!-- ============ RIGHT PANEL: IK ============ -->
  <text x="430" y="160" font-size="18" font-weight="600" fill="currentColor">IK &#183; Inverse Kinematics</text>
  <text x="430" y="182" font-size="13" fill="currentColor" opacity="0.6">Move the hand target; joints solve automatically</text>

  <!-- IK solved arm (resulting pose) -->
  <g stroke="currentColor" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.85">
    <line x1="500" y1="250" x2="565" y2="312"/>
    <line x1="565" y1="312" x2="660" y2="300"/>
    <line x1="660" y1="300" x2="710" y2="345"/>
  </g>
  <!-- IK solved joints (auto) -->
  <g fill="currentColor" opacity="0.5">
    <circle cx="500" cy="250" r="9"/>
    <circle cx="565" cy="312" r="9"/>
    <circle cx="660" cy="300" r="9"/>
  </g>
  <!-- "Auto" dotted leaders to the solved joints -->
  <g stroke="#FF6B00" stroke-width="1.6" stroke-dasharray="4 4" opacity="0.7" fill="none">
    <line x1="710" y1="345" x2="660" y2="300"/>
    <line x1="660" y1="300" x2="565" y2="312"/>
    <line x1="565" y1="312" x2="500" y2="250"/>
  </g>
  <text x="560" y="338" font-size="12" font-style="italic" fill="#FF6B00" opacity="0.9">auto-solved</text>

  <!-- IK hand target (the thing you actually move) -->
  <rect x="698" y="333" width="24" height="24" rx="4" fill="none" stroke="#FF6B00" stroke-width="3"/>
  <circle cx="710" cy="345" r="5" fill="#FF6B00"/>
  <!-- Drag arrow into the target -->
  <line x1="612" y1="392" x2="694" y2="360" stroke="#FF6B00" stroke-width="3" stroke-linecap="round" marker-end="url(#ik-arrow)"/>
  <text x="560" y="388" font-size="13" font-weight="600" fill="#FF6B00">Move target</text>

  <!-- IK target label -->
  <text x="688" y="322" font-size="12" fill="currentColor" opacity="0.6" text-anchor="end">Hand target</text>

  <!-- IK takeaway -->
  <text x="430" y="430" font-size="13" font-weight="600" fill="currentColor">Goal-driven &#183; fast for planted hands or feet</text>
  <text x="430" y="450" font-size="13" fill="currentColor" opacity="0.6">Position the goal; Blender computes the joint angles.</text>

  <!-- Footer tip (Variant B, left rail) -->
  <rect x="40" y="506" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Use FK for arcs that swing freely (a wave) and IK when a hand or foot must stay planted (a walk).
  </text>

  <!-- Arrowhead markers -->
  <defs>
    <marker id="ik-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF6B00"/>
    </marker>
    <marker id="ik-arc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
  </defs>
</svg>
