<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="tr-title tr-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="tr-title">Timing frame count reference at 24 fps</title>
  <desc id="tr-desc">A reference chart of five speed bands from very fast to very slow, each listing a frame count range at 24 frames per second, example actions, and a proportional duration bar showing relative length.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">TIMING FRAME COUNT REFERENCE</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Common action durations at 24 fps &#183; fastest at top, longest at bottom</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Band: VERY FAST -->
  <rect x="40" y="136" width="120" height="26" rx="13" fill="#FF6B00" fill-opacity="0.12" stroke="#FF6B00" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="100" y="154" text-anchor="middle" font-size="13" font-weight="700" fill="#FF6B00">VERY FAST</text>
  <text x="176" y="154" font-size="16" font-weight="700" fill="currentColor">1&#8211;6 fr</text>
  <text x="300" y="154" font-size="13" fill="currentColor" opacity="0.6">Blinks, impacts, sharp reactions</text>
  <rect x="40" y="174" width="680" height="8" rx="4" fill="currentColor" opacity="0.08"/>
  <rect x="40" y="174" width="56" height="8" rx="4" fill="currentColor" opacity="0.42"/>
  <text x="104" y="182" font-size="11" fill="currentColor" opacity="0.5">6 fr</text>
  <line x1="40" y1="220" x2="760" y2="220" stroke="currentColor" stroke-width="1" opacity="0.1"/>
  <!-- Band: FAST -->
  <rect x="40" y="230" width="120" height="26" rx="13" fill="#FF6B00" fill-opacity="0.12" stroke="#FF6B00" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="100" y="248" text-anchor="middle" font-size="13" font-weight="700" fill="#FF6B00">FAST</text>
  <text x="176" y="248" font-size="16" font-weight="700" fill="currentColor">6&#8211;12 fr</text>
  <text x="300" y="248" font-size="13" fill="currentColor" opacity="0.6">Gestures, quick moves, head turns</text>
  <rect x="40" y="268" width="680" height="8" rx="4" fill="currentColor" opacity="0.08"/>
  <rect x="40" y="268" width="113" height="8" rx="4" fill="currentColor" opacity="0.42"/>
  <text x="161" y="276" font-size="11" fill="currentColor" opacity="0.5">12 fr</text>
  <line x1="40" y1="314" x2="760" y2="314" stroke="currentColor" stroke-width="1" opacity="0.1"/>
  <!-- Band: MEDIUM -->
  <rect x="40" y="324" width="120" height="26" rx="13" fill="#FF6B00" fill-opacity="0.12" stroke="#FF6B00" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="100" y="342" text-anchor="middle" font-size="13" font-weight="700" fill="#FF6B00">MEDIUM</text>
  <text x="176" y="342" font-size="16" font-weight="700" fill="currentColor">12&#8211;24 fr</text>
  <text x="300" y="342" font-size="13" fill="currentColor" opacity="0.6">Walks, reaches, normal everyday actions</text>
  <rect x="40" y="362" width="680" height="8" rx="4" fill="currentColor" opacity="0.08"/>
  <rect x="40" y="362" width="226" height="8" rx="4" fill="currentColor" opacity="0.42"/>
  <text x="274" y="370" font-size="11" fill="currentColor" opacity="0.5">24 fr</text>
  <line x1="40" y1="408" x2="760" y2="408" stroke="currentColor" stroke-width="1" opacity="0.1"/>
  <!-- Band: SLOW -->
  <rect x="40" y="418" width="120" height="26" rx="13" fill="#FF6B00" fill-opacity="0.12" stroke="#FF6B00" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="100" y="436" text-anchor="middle" font-size="13" font-weight="700" fill="#FF6B00">SLOW</text>
  <text x="176" y="436" font-size="16" font-weight="700" fill="currentColor">24&#8211;48 fr</text>
  <text x="300" y="436" font-size="13" fill="currentColor" opacity="0.6">Heavy objects, dramatic beats</text>
  <rect x="40" y="456" width="680" height="8" rx="4" fill="currentColor" opacity="0.08"/>
  <rect x="40" y="456" width="453" height="8" rx="4" fill="currentColor" opacity="0.42"/>
  <text x="501" y="464" font-size="11" fill="currentColor" opacity="0.5">48 fr</text>
  <line x1="40" y1="502" x2="760" y2="502" stroke="currentColor" stroke-width="1" opacity="0.1"/>
  <!-- Band: VERY SLOW -->
  <rect x="40" y="512" width="120" height="26" rx="13" fill="#FF6B00" fill-opacity="0.12" stroke="#FF6B00" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="100" y="530" text-anchor="middle" font-size="13" font-weight="700" fill="#FF6B00">VERY SLOW</text>
  <text x="176" y="530" font-size="16" font-weight="700" fill="currentColor">48+ fr</text>
  <text x="300" y="530" font-size="13" fill="currentColor" opacity="0.6">Extreme weight, contemplative holds</text>
  <rect x="40" y="550" width="680" height="8" rx="4" fill="currentColor" opacity="0.08"/>
  <rect x="40" y="550" width="680" height="8" rx="4" fill="currentColor" opacity="0.42"/>
  <text x="728" y="558" font-size="11" fill="currentColor" opacity="0.5">72+ fr</text>

  <rect x="40" y="641" width="720" height="34" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> these are starting points, not rules &#183; always adjust to the weight and mood of the shot.</text>
</svg>