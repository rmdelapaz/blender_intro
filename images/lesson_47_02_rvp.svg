<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="rvpTitle rvpDesc" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" color="#222">
  <title id="rvpTitle">Fix in Render vs. Fix in Post</title>
  <desc id="rvpDesc">A two-column decision panel. The left column lists problems best solved by re-rendering, such as geometry, lighting setup, noise from low samples, and material errors. The right column lists adjustments suited to post-processing, such as exposure tweaks, color grading, glow, and minor cleanup.</desc>
  <style>
    .hd{fill:currentColor;font-size:19px;font-weight:700;}
    .sub{fill:#9aa4b2;font-size:11px;}
    .ch{font-size:15px;font-weight:700;}
    .it{fill:#d4d4d4;font-size:13px;}
    .why{fill:#9aa4b2;font-size:11px;}
  </style>
  <text x="20" y="34" class="hd">Where should you fix it?</text>
  <text x="20" y="56" class="sub">Post-processing is powerful, but some things must be right before the render finishes.</text>

  <!-- LEFT: re-render -->
  <rect x="20" y="76" width="350" height="284" rx="10" fill="#2a2a2a" stroke="#E63946" stroke-width="1.5"/>
  <rect x="20" y="76" width="350" height="40" rx="10" fill="#E63946"/>
  <rect x="20" y="96" width="350" height="20" fill="#E63946"/>
  <text x="40" y="103" class="ch" fill="#ffffff">Re-render &#8212; can't fix in post</text>
  <g>
    <text x="40" y="150" class="it">Geometry &amp; composition of the scene</text>
    <text x="40" y="168" class="why">Objects, camera angle, framing are baked in</text>
    <text x="40" y="200" class="it">Lighting setup &amp; shadows</text>
    <text x="40" y="218" class="why">Direction and shape of light can't be relit later</text>
    <text x="40" y="250" class="it">Noise from too few samples</text>
    <text x="40" y="268" class="why">Denoise helps, but detail already lost stays lost</text>
    <text x="40" y="300" class="it">Material &amp; shader errors</text>
    <text x="40" y="318" class="why">Wrong roughness or missing texture = re-render</text>
    <text x="40" y="344" class="why">Rule: anything about light transport or geometry.</text>
  </g>

  <!-- RIGHT: post -->
  <rect x="390" y="76" width="350" height="284" rx="10" fill="#2a2a2a" stroke="#4ADE80" stroke-width="1.5"/>
  <rect x="390" y="76" width="350" height="40" rx="10" fill="#4ADE80"/>
  <rect x="390" y="96" width="350" height="20" fill="#4ADE80"/>
  <text x="410" y="103" class="ch" fill="#14351f">Post &#8212; fix it here, fast</text>
  <g>
    <text x="410" y="150" class="it">Exposure &amp; overall brightness</text>
    <text x="410" y="168" class="why">Curves and exposure nodes, non-destructive</text>
    <text x="410" y="200" class="it">Color correction &amp; grading</text>
    <text x="410" y="218" class="why">White balance, mood, stylized looks</text>
    <text x="410" y="250" class="it">Glow, bloom, fog, lens effects</text>
    <text x="410" y="268" class="why">Added cheaply in the compositor</text>
    <text x="410" y="300" class="it">Minor cleanup &amp; sharpening</text>
    <text x="410" y="318" class="why">Small fireflies, edge sharpness, grain</text>
    <text x="410" y="344" class="why">Rule: anything about look, tone, or finish.</text>
  </g>
</svg>
