<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" color="#222"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Polygon types at a glance: triangle, quad, and n-gon compared</title>
  <desc>A comparison reference for the three polygon types. The top row shows
  mini hero shapes for triangle, quad, and n-gon side by side, each with a
  small heading and a side-count footer label. Below sits a properties table
  with TYPE, SIDES, ANIMATION, SUBDIVISION, and PRODUCTION USE columns,
  filled with one row per polygon type. Animation and subdivision cells carry
  small color-coded glyphs (green check, yellow warning, red cross) indicating
  the trade-off. An italic takeaway and a footer tip card close the figure.</desc>

  <!-- Top accent rail -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Header band -->
  <text x="400" y="56" text-anchor="middle" font-size="24" font-weight="700"
        fill="currentColor">POLYGON TYPES AT A GLANCE</text>
  <text x="400" y="84" text-anchor="middle" font-size="14"
        fill="currentColor" opacity="0.65">Triangle, quad, and n-gon side by side, with practical trade-offs.</text>
  <line x1="120" y1="108" x2="680" y2="108"
        stroke="currentColor" stroke-width="1" opacity="0.25"/>
  <text x="400" y="138" text-anchor="middle" font-size="15" font-weight="700"
        fill="#FF6B00" letter-spacing="2">PICK QUADS FOR DEFORMATION &#183; TRIANGLES FOR EXPORT</text>

  <!-- ============================================================== -->
  <!-- Top row: three mini hero cells (y 170 to 410)                   -->
  <!-- ============================================================== -->

  <!-- Cell 1: Triangle (x 40 to 260) -->
  <g id="pc-cell-tri">
    <text x="150" y="195" text-anchor="middle" font-size="13" font-weight="700"
          fill="currentColor">TRIANGLE</text>
    <!-- Mini equilateral triangle, center (150, 305), radius 60 -->
    <polygon points="150,245 98,335 202,335"
             fill="currentColor" fill-opacity="0.05"
             stroke="#FF6B00" stroke-width="3" stroke-linejoin="round"/>
    <!-- Vertex glyphs (halo + solid) -->
    <circle cx="150" cy="245" r="7" fill="#FF6B00" opacity="0.20"/>
    <circle cx="150" cy="245" r="4" fill="#FF6B00"/>
    <circle cx="98" cy="335" r="7" fill="#FF6B00" opacity="0.20"/>
    <circle cx="98" cy="335" r="4" fill="#FF6B00"/>
    <circle cx="202" cy="335" r="7" fill="#FF6B00" opacity="0.20"/>
    <circle cx="202" cy="335" r="4" fill="#FF6B00"/>
    <text x="150" y="395" text-anchor="middle" font-size="11" font-weight="700"
          fill="#FF6B00">3 SIDES</text>
  </g>

  <!-- Cell 2: Quad (x 280 to 520) -->
  <g id="pc-cell-qd">
    <text x="400" y="195" text-anchor="middle" font-size="13" font-weight="700"
          fill="currentColor">QUAD</text>
    <!-- Mini quad, vertices (320,245), (480,245), (480,365), (320,365) -->
    <polygon points="320,245 480,245 480,365 320,365"
             fill="currentColor" fill-opacity="0.05"
             stroke="#FF6B00" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="320" cy="245" r="7" fill="#FF6B00" opacity="0.20"/>
    <circle cx="320" cy="245" r="4" fill="#FF6B00"/>
    <circle cx="480" cy="245" r="7" fill="#FF6B00" opacity="0.20"/>
    <circle cx="480" cy="245" r="4" fill="#FF6B00"/>
    <circle cx="480" cy="365" r="7" fill="#FF6B00" opacity="0.20"/>
    <circle cx="480" cy="365" r="4" fill="#FF6B00"/>
    <circle cx="320" cy="365" r="7" fill="#FF6B00" opacity="0.20"/>
    <circle cx="320" cy="365" r="4" fill="#FF6B00"/>
    <text x="400" y="395" text-anchor="middle" font-size="11" font-weight="700"
          fill="#FF6B00">4 SIDES</text>
  </g>

  <!-- Cell 3: N-gon (x 540 to 760) -->
  <g id="pc-cell-ng">
    <text x="650" y="195" text-anchor="middle" font-size="13" font-weight="700"
          fill="currentColor">N-GON</text>
    <!-- Mini regular hexagon, center (650, 305), radius 70 -->
    <polygon points="720,305 685,366 615,366 580,305 615,244 685,244"
             fill="currentColor" fill-opacity="0.05"
             stroke="#FF6B00" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="720" cy="305" r="7" fill="#FF6B00" opacity="0.20"/>
    <circle cx="720" cy="305" r="4" fill="#FF6B00"/>
    <circle cx="685" cy="366" r="7" fill="#FF6B00" opacity="0.20"/>
    <circle cx="685" cy="366" r="4" fill="#FF6B00"/>
    <circle cx="615" cy="366" r="7" fill="#FF6B00" opacity="0.20"/>
    <circle cx="615" cy="366" r="4" fill="#FF6B00"/>
    <circle cx="580" cy="305" r="7" fill="#FF6B00" opacity="0.20"/>
    <circle cx="580" cy="305" r="4" fill="#FF6B00"/>
    <circle cx="615" cy="244" r="7" fill="#FF6B00" opacity="0.20"/>
    <circle cx="615" cy="244" r="4" fill="#FF6B00"/>
    <circle cx="685" cy="244" r="7" fill="#FF6B00" opacity="0.20"/>
    <circle cx="685" cy="244" r="4" fill="#FF6B00"/>
    <text x="650" y="395" text-anchor="middle" font-size="11" font-weight="700"
          fill="#FF6B00">5+ SIDES</text>
  </g>

  <!-- ============================================================== -->
  <!-- Properties table (y 430 to 600)                                 -->
  <!-- ============================================================== -->

  <!-- Top rule above the table -->
  <line x1="40" y1="425" x2="760" y2="425"
        stroke="currentColor" stroke-width="1" opacity="0.25"/>

  <!-- Header row at y=445 -->
  <g id="pc-table-header">
    <text x="110" y="445" text-anchor="middle" font-size="12" font-weight="700"
          fill="#FF6B00" letter-spacing="1">TYPE</text>
    <text x="240" y="445" text-anchor="middle" font-size="12" font-weight="700"
          fill="#FF6B00" letter-spacing="1">SIDES</text>
    <text x="380" y="445" text-anchor="middle" font-size="12" font-weight="700"
          fill="#FF6B00" letter-spacing="1">ANIMATION</text>
    <text x="540" y="445" text-anchor="middle" font-size="12" font-weight="700"
          fill="#FF6B00" letter-spacing="1">SUBDIVISION</text>
    <text x="700" y="445" text-anchor="middle" font-size="12" font-weight="700"
          fill="#FF6B00" letter-spacing="1">PRODUCTION USE</text>
  </g>

  <!-- Rule under header row -->
  <line x1="40" y1="458" x2="760" y2="458"
        stroke="currentColor" stroke-width="1" opacity="0.18"/>

  <!-- Row 1: Triangle (y=480) -->
  <g id="pc-row-tri">
    <text x="110" y="480" text-anchor="middle" font-size="12" font-weight="700"
          fill="currentColor">Triangle</text>
    <text x="240" y="480" text-anchor="middle" font-size="11"
          fill="currentColor" opacity="0.85">3</text>
    <text x="380" y="480" text-anchor="middle" font-size="11"
          fill="currentColor" opacity="0.85">Always planar <tspan fill="#4ADE80" font-weight="700">&#10003;</tspan></text>
    <text x="540" y="480" text-anchor="middle" font-size="11"
          fill="currentColor" opacity="0.85">Subdivides cleanly <tspan fill="#4ADE80" font-weight="700">&#10003;</tspan></text>
    <text x="700" y="480" text-anchor="middle" font-size="11"
          fill="currentColor" opacity="0.85">Game engines, baked geometry</text>
  </g>

  <!-- Row 2: Quad (y=525) -->
  <g id="pc-row-qd">
    <text x="110" y="525" text-anchor="middle" font-size="12" font-weight="700"
          fill="currentColor">Quad</text>
    <text x="240" y="525" text-anchor="middle" font-size="11"
          fill="currentColor" opacity="0.85">4</text>
    <text x="380" y="525" text-anchor="middle" font-size="11"
          fill="currentColor" opacity="0.85">Best for deformation <tspan fill="#4ADE80" font-weight="700">&#10003;&#10003;</tspan></text>
    <text x="540" y="525" text-anchor="middle" font-size="11"
          fill="currentColor" opacity="0.85">Smooth Catmull-Clark <tspan fill="#4ADE80" font-weight="700">&#10003;&#10003;</tspan></text>
    <text x="700" y="525" text-anchor="middle" font-size="11"
          fill="currentColor" opacity="0.85">Industry standard</text>
  </g>

  <!-- Row 3: N-gon (y=570) -->
  <g id="pc-row-ng">
    <text x="110" y="570" text-anchor="middle" font-size="12" font-weight="700"
          fill="currentColor">N-gon</text>
    <text x="240" y="570" text-anchor="middle" font-size="11"
          fill="currentColor" opacity="0.85">5+</text>
    <text x="380" y="570" text-anchor="middle" font-size="11"
          fill="currentColor" opacity="0.85">Avoid when deforming <tspan fill="#E63946" font-weight="700">&#10007;</tspan></text>
    <text x="540" y="570" text-anchor="middle" font-size="11"
          fill="currentColor" opacity="0.85">Subdivision artifacts <tspan fill="#F5C242" font-weight="700">&#9888;</tspan></text>
    <text x="700" y="570" text-anchor="middle" font-size="11"
          fill="currentColor" opacity="0.85">Flat hard surfaces only</text>
  </g>

  <!-- Bottom rule below the table -->
  <line x1="40" y1="595" x2="760" y2="595"
        stroke="currentColor" stroke-width="1" opacity="0.18"/>

  <!-- ============================================================== -->
  <!-- Italic takeaway + footer tip card                               -->
  <!-- ============================================================== -->

  <text x="400" y="625" text-anchor="middle" font-size="13" font-style="italic"
        fill="currentColor" opacity="0.75">Reach for quads first, triangles second, n-gons only when the geometry is hard-surfaced and flat.</text>

  <g id="pc-tip">
    <rect x="40" y="641" width="720" height="34" rx="6"
          fill="currentColor" fill-opacity="0.04"
          stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>
    <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
    <text x="58" y="662" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> In Edit Mode, Mesh &gt; Clean Up &gt; Tris to Quads converts triangulated meshes back to quad-dominant topology where possible.</text>
  </g>
</svg>
