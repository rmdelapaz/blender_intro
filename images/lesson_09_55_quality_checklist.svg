<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" color="#222" role="img" aria-labelledby="qc-title qc-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="qc-title">Precision Modeling Quality Checklist</title>
  <desc id="qc-desc">A three-phase quality checklist for precision projects. Project start covers setup tasks, during modeling covers ongoing checks, and project completion covers final verification. Each phase lists checkbox items to confirm before moving on.</desc>

  <rect x="0" y="0" width="800" height="680" rx="18" fill="#0f1a14"/>
  <rect x="0" y="0" width="800" height="10" rx="5" fill="#FF6B00"/>

  <text x="40" y="58" font-size="30" font-weight="700" fill="#f5f7f6">Quality Checklist</text>
  <text x="40" y="88" font-size="17" font-weight="500" fill="#9fb0a8">Three phases &#183; tick each before you move on</text>

  <defs>
    <!-- empty checkbox templates per phase colour, drawn inline below -->
  </defs>

  <!-- ===== PHASE 1: PROJECT START (blue) ===== -->
  <g>
    <rect x="40" y="110" width="232" height="350" rx="12" fill="#11201a" stroke="#4A9EFF" stroke-width="2"/>
    <rect x="40" y="110" width="232" height="44" rx="12" fill="#4A9EFF" opacity="0.16"/>
    <text x="56" y="139" font-size="16" font-weight="700" fill="#9fd0ff">PROJECT START</text>
    <text x="56" y="174" font-size="12.5" fill="#9fb0a8">First five minutes</text>

    <!-- items -->
    <g>
      <rect x="56" y="196" width="18" height="18" rx="4" fill="none" stroke="#4A9EFF" stroke-width="2"/>
      <text x="84" y="210" font-size="13.5" fill="#cdd8d2">Scene units configured</text>
    </g>
    <g>
      <rect x="56" y="240" width="18" height="18" rx="4" fill="none" stroke="#4A9EFF" stroke-width="2"/>
      <text x="84" y="254" font-size="13.5" fill="#cdd8d2">Grid scale set</text>
    </g>
    <g>
      <rect x="56" y="284" width="18" height="18" rx="4" fill="none" stroke="#4A9EFF" stroke-width="2"/>
      <text x="84" y="298" font-size="13.5" fill="#cdd8d2">Reference objects created</text>
    </g>
    <g>
      <rect x="56" y="328" width="18" height="18" rx="4" fill="none" stroke="#4A9EFF" stroke-width="2"/>
      <text x="84" y="342" font-size="13.5" fill="#cdd8d2">Snapping configured</text>
    </g>
    <g>
      <rect x="56" y="372" width="18" height="18" rx="4" fill="none" stroke="#4A9EFF" stroke-width="2"/>
      <text x="84" y="386" font-size="13.5" fill="#cdd8d2">File saved</text>
    </g>
    <text x="56" y="436" font-size="12" fill="#9fb0a8">Set the stage before you</text>
    <text x="56" y="452" font-size="12" fill="#9fb0a8">make any geometry.</text>
  </g>

  <!-- ===== PHASE 2: DURING MODELING (orange) ===== -->
  <g>
    <rect x="284" y="110" width="232" height="350" rx="12" fill="#11201a" stroke="#FF6B00" stroke-width="2"/>
    <rect x="284" y="110" width="232" height="44" rx="12" fill="#FF6B00" opacity="0.16"/>
    <text x="300" y="139" font-size="16" font-weight="700" fill="#ffb878">DURING MODELING</text>
    <text x="300" y="174" font-size="12.5" fill="#9fb0a8">Regular checks</text>

    <g>
      <rect x="300" y="196" width="18" height="18" rx="4" fill="none" stroke="#FF6B00" stroke-width="2"/>
      <text x="328" y="210" font-size="13.5" fill="#cdd8d2">Scale applied after</text>
      <text x="328" y="227" font-size="13.5" fill="#cdd8d2">transforms</text>
    </g>
    <g>
      <rect x="300" y="256" width="18" height="18" rx="4" fill="none" stroke="#FF6B00" stroke-width="2"/>
      <text x="328" y="270" font-size="13.5" fill="#cdd8d2">Measurements verified</text>
    </g>
    <g>
      <rect x="300" y="300" width="18" height="18" rx="4" fill="none" stroke="#FF6B00" stroke-width="2"/>
      <text x="328" y="314" font-size="13.5" fill="#cdd8d2">Symmetry checked</text>
    </g>
    <g>
      <rect x="300" y="344" width="18" height="18" rx="4" fill="none" stroke="#FF6B00" stroke-width="2"/>
      <text x="328" y="358" font-size="13.5" fill="#cdd8d2">Snapping toggled as</text>
      <text x="328" y="375" font-size="13.5" fill="#cdd8d2">needed</text>
    </g>
    <text x="300" y="436" font-size="12" fill="#9fb0a8">Catch errors while they</text>
    <text x="300" y="452" font-size="12" fill="#9fb0a8">are still cheap to fix.</text>
  </g>

  <!-- ===== PHASE 3: PROJECT COMPLETION (green) ===== -->
  <g>
    <rect x="528" y="110" width="232" height="350" rx="12" fill="#11201a" stroke="#4ADE80" stroke-width="2"/>
    <rect x="528" y="110" width="232" height="44" rx="12" fill="#4ADE80" opacity="0.16"/>
    <text x="544" y="139" font-size="16" font-weight="700" fill="#86efac">COMPLETION</text>
    <text x="544" y="174" font-size="12.5" fill="#9fb0a8">Final quality control</text>

    <g>
      <rect x="544" y="196" width="18" height="18" rx="4" fill="none" stroke="#4ADE80" stroke-width="2"/>
      <text x="572" y="210" font-size="13.5" fill="#cdd8d2">All dimensions verified</text>
    </g>
    <g>
      <rect x="544" y="240" width="18" height="18" rx="4" fill="none" stroke="#4ADE80" stroke-width="2"/>
      <text x="572" y="254" font-size="13.5" fill="#cdd8d2">Merge by distance applied</text>
    </g>
    <g>
      <rect x="544" y="284" width="18" height="18" rx="4" fill="none" stroke="#4ADE80" stroke-width="2"/>
      <text x="572" y="298" font-size="13.5" fill="#cdd8d2">Normals recalculated</text>
    </g>
    <g>
      <rect x="544" y="328" width="18" height="18" rx="4" fill="none" stroke="#4ADE80" stroke-width="2"/>
      <text x="572" y="342" font-size="13.5" fill="#cdd8d2">Non-manifold resolved</text>
    </g>
    <g>
      <rect x="544" y="372" width="18" height="18" rx="4" fill="none" stroke="#4ADE80" stroke-width="2"/>
      <text x="572" y="386" font-size="13.5" fill="#cdd8d2">Visual inspection complete</text>
    </g>
    <text x="544" y="436" font-size="12" fill="#9fb0a8">Confirm everything before</text>
    <text x="544" y="452" font-size="12" fill="#9fb0a8">the model ships.</text>
  </g>

  <!-- ===== flow band ===== -->
  <g>
    <rect x="40" y="486" width="720" height="118" rx="10" fill="#11201a" stroke="#24382e" stroke-width="2"/>
    <text x="56" y="512" font-size="14" font-weight="700" fill="#F5C242">WHY PHASES MATTER</text>
    <text x="56" y="540" font-size="13.5" fill="#cdd8d2">A clean <tspan fill="#9fd0ff" font-weight="700">start</tspan> sets units and scale so every later number is meaningful. Checking</text>
    <text x="56" y="562" font-size="13.5" fill="#cdd8d2"><tspan fill="#ffb878" font-weight="700">during</tspan> modeling stops small drift from compounding. A final <tspan fill="#86efac" font-weight="700">completion</tspan> pass catches</text>
    <text x="56" y="584" font-size="13.5" fill="#cdd8d2">the cleanup tasks that are easy to forget but break exports and modifiers.</text>
  </g>

  <!-- footer tip rail -->
  <rect x="40" y="632" width="6" height="32" rx="3" fill="#F5C242"/>
  <text x="60" y="654" font-size="15" font-weight="600" fill="#F5C242">Tick every box &#183; precision is a habit, not a final step.</text>
</svg>
