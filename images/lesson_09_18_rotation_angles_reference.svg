<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" role="img" aria-labelledby="ra-title ra-desc" color="#222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="ra-title">Common Rotation Angles Reference</title>
  <desc id="ra-desc">A reference dial divided into common rotation angles with four nested families: 90 degree quadrants in green for perpendicular walls, 45 degree divisions in blue for diagonal bracing, 30 degree divisions in orange for hexagonal patterns, and 22.5 degree divisions in purple for 16-sided cylinders. Each family lists its keyboard shortcut, such as R Z 90.</desc>

  <!-- card background -->
  <rect x="0" y="0" width="800" height="680" rx="18" fill="#0f1a14"/>
  <!-- top orange accent strip -->
  <rect x="0" y="0" width="800" height="10" rx="5" fill="#FF6B00"/>

  <!-- header -->
  <text x="40" y="62" font-size="32" font-weight="700" fill="#f5f7f6">Common Rotation Angles Reference</text>
  <text x="40" y="90" font-size="17" fill="#9fb0aa">Type the angle after R and an axis &#8212; e.g. R Z 45 rotates 45&#176; around Z.</text>

  <!-- angle dial -->
  <g>
    <circle cx="270" cy="330" r="170" fill="#101c16" stroke="#23362c" stroke-width="2"/>
    <circle cx="270" cy="330" r="30" fill="#16241d" stroke="#FF6B00" stroke-width="2.5"/>
    <g>
      <line x1="310.0" y1="330.0" x2="440.0" y2="330.0" stroke="#4ADE80" stroke-width="5" stroke-linecap="round"/>
      <line x1="379.0" y1="284.8" x2="427.1" y2="264.9" stroke="#B47EE8" stroke-width="2" stroke-linecap="round"/>
      <line x1="319.5" y1="280.5" x2="390.2" y2="209.8" stroke="#4A9EFF" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="315.2" y1="221.0" x2="335.1" y2="172.9" stroke="#B47EE8" stroke-width="2" stroke-linecap="round"/>
      <line x1="270.0" y1="290.0" x2="270.0" y2="160.0" stroke="#4ADE80" stroke-width="5" stroke-linecap="round"/>
      <line x1="224.8" y1="221.0" x2="204.9" y2="172.9" stroke="#B47EE8" stroke-width="2" stroke-linecap="round"/>
      <line x1="220.5" y1="280.5" x2="149.8" y2="209.8" stroke="#4A9EFF" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="161.0" y1="284.8" x2="112.9" y2="264.9" stroke="#B47EE8" stroke-width="2" stroke-linecap="round"/>
      <line x1="230.0" y1="330.0" x2="100.0" y2="330.0" stroke="#4ADE80" stroke-width="5" stroke-linecap="round"/>
      <line x1="161.0" y1="375.2" x2="112.9" y2="395.1" stroke="#B47EE8" stroke-width="2" stroke-linecap="round"/>
      <line x1="220.5" y1="379.5" x2="149.8" y2="450.2" stroke="#4A9EFF" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="224.8" y1="439.0" x2="204.9" y2="487.1" stroke="#B47EE8" stroke-width="2" stroke-linecap="round"/>
      <line x1="270.0" y1="370.0" x2="270.0" y2="500.0" stroke="#4ADE80" stroke-width="5" stroke-linecap="round"/>
      <line x1="315.2" y1="439.0" x2="335.1" y2="487.1" stroke="#B47EE8" stroke-width="2" stroke-linecap="round"/>
      <line x1="319.5" y1="379.5" x2="390.2" y2="450.2" stroke="#4A9EFF" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="379.0" y1="375.2" x2="427.1" y2="395.1" stroke="#B47EE8" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g>
      <text x="458.0" y="330.0" font-size="15" font-weight="700" fill="#4ADE80" text-anchor="start">0&#176;</text>
      <text x="270.0" y="142.0" font-size="15" font-weight="700" fill="#4ADE80" text-anchor="middle">90&#176;</text>
      <text x="82.0" y="330.0" font-size="15" font-weight="700" fill="#4ADE80" text-anchor="end">180&#176;</text>
      <text x="270.0" y="518.0" font-size="15" font-weight="700" fill="#4ADE80" text-anchor="middle">270&#176;</text>
    </g>
  </g>

  <!-- right-side family cards -->
  <g>
    <g transform="translate(478,120)">
      <rect x="0" y="0" width="282" height="86" rx="11" fill="#16241d" stroke="#4ADE80" stroke-width="2"/>
      <text x="16" y="34" font-size="24" font-weight="700" fill="#4ADE80">90&#176;</text>
      <text x="78" y="30" font-size="15.5" font-weight="600" fill="#e8efec">Perpendicular walls</text>
      <text x="78" y="52" font-size="13" fill="#9fb0aa">Right angles, box shapes</text>
      <rect x="186" y="58" width="84" height="22" rx="6" fill="#101c16" stroke="#2c4135" stroke-width="1"/>
      <text x="228.0" y="73.5" font-size="13" font-weight="700" fill="#7ef0a8" text-anchor="middle" font-family="'SFMono-Regular', Consolas, monospace">R Z 90</text>
      <text x="14" y="74" font-size="12" fill="#9fb0aa">use:</text>
    </g>
    <g transform="translate(478,214)">
      <rect x="0" y="0" width="282" height="86" rx="11" fill="#16241d" stroke="#4A9EFF" stroke-width="2"/>
      <text x="16" y="34" font-size="24" font-weight="700" fill="#4A9EFF">45&#176;</text>
      <text x="78" y="30" font-size="15.5" font-weight="600" fill="#e8efec">Diagonal bracing</text>
      <text x="78" y="52" font-size="13" fill="#9fb0aa">Half-quadrant cuts</text>
      <rect x="186" y="58" width="84" height="22" rx="6" fill="#101c16" stroke="#2c4135" stroke-width="1"/>
      <text x="228.0" y="73.5" font-size="13" font-weight="700" fill="#7cc0ff" text-anchor="middle" font-family="'SFMono-Regular', Consolas, monospace">R Z 45</text>
      <text x="14" y="74" font-size="12" fill="#9fb0aa">use:</text>
    </g>
    <g transform="translate(478,308)">
      <rect x="0" y="0" width="282" height="86" rx="11" fill="#16241d" stroke="#FF6B00" stroke-width="2"/>
      <text x="16" y="34" font-size="24" font-weight="700" fill="#FF8a33">30&#176;</text>
      <text x="78" y="30" font-size="15.5" font-weight="600" fill="#e8efec">Hexagonal patterns</text>
      <text x="78" y="52" font-size="13" fill="#9fb0aa">6-sided / 12-part circle</text>
      <rect x="186" y="58" width="84" height="22" rx="6" fill="#101c16" stroke="#2c4135" stroke-width="1"/>
      <text x="228.0" y="73.5" font-size="13" font-weight="700" fill="#FFa861" text-anchor="middle" font-family="'SFMono-Regular', Consolas, monospace">R Z 30</text>
      <text x="14" y="74" font-size="12" fill="#9fb0aa">use:</text>
    </g>
    <g transform="translate(478,402)">
      <rect x="0" y="0" width="282" height="86" rx="11" fill="#16241d" stroke="#B47EE8" stroke-width="2"/>
      <text x="16" y="34" font-size="22" font-weight="700" fill="#B47EE8">22.5&#176;</text>
      <text x="92" y="30" font-size="15.5" font-weight="600" fill="#e8efec">16-sided cylinders</text>
      <text x="92" y="52" font-size="13" fill="#9fb0aa">Fine radial detail</text>
      <rect x="170" y="58" width="100" height="22" rx="6" fill="#101c16" stroke="#2c4135" stroke-width="1"/>
      <text x="220.0" y="73.5" font-size="13" font-weight="700" fill="#cda6ec" text-anchor="middle" font-family="'SFMono-Regular', Consolas, monospace">R Z 22.5</text>
      <text x="14" y="74" font-size="12" fill="#9fb0aa">use:</text>
    </g>
  </g>

  <!-- math-expression bonus note -->
  <g transform="translate(478,500)">
    <rect x="0" y="0" width="282" height="46" rx="9" fill="#101c16" stroke="#23362c" stroke-width="1.5"/>
    <text x="16" y="20" font-size="13.5" font-weight="600" fill="#cdd8d3">Need an even division?</text>
    <text x="16" y="38" font-size="13" fill="#9fb0aa">Type R Z 360/n &#8212; Blender does the math.</text>
  </g>

  <!-- footer tip rail -->
  <g transform="translate(0,634)">
    <rect x="40" y="0" width="720" height="30" rx="7" fill="#1a2a12"/>
    <rect x="40" y="0" width="6" height="30" rx="3" fill="#F5C242"/>
    <text x="60" y="20" font-size="14" font-weight="600" fill="#e7d6a2">Tip: hold Ctrl while rotating to snap to these common angles automatically.</text>
  </g>
</svg>
