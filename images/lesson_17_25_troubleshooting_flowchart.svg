<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" role="img" aria-labelledby="tf-title tf-desc" color="#222" font-family="'Segoe UI', system-ui, sans-serif">
  <title id="tf-title">HDRI Troubleshooting Decision Tree</title>
  <desc id="tf-desc">A flowchart for diagnosing HDRI problems: start by checking what you see, follow the branch for dark scenes, washed-out colors, wrong rotation, or grain, and arrive at the matching fix.</desc>

  <defs>
    <marker id="tf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8A8F98"/>
    </marker>
  </defs>

  <!-- ===== header ===== -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
  <text x="32" y="56" font-size="24" font-weight="700" fill="currentColor">HDRI Troubleshooting</text>
  <text x="32" y="84" font-size="14" opacity="0.65" fill="currentColor">Work top to bottom &#183; follow the branch that matches what you see</text>
  <line x1="32" y1="108" x2="768" y2="108" stroke="currentColor" stroke-opacity="0.18" stroke-width="1"/>

  <!-- ===== start node ===== -->
  <g font-family="'Segoe UI', system-ui, sans-serif">
    <rect x="300" y="132" width="200" height="48" rx="24" fill="#FF6B00"/>
    <text x="400" y="162" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="middle">HDRI not working?</text>
  </g>
  <line x1="400" y1="180" x2="400" y2="208" stroke="#8A8F98" stroke-width="2" marker-end="url(#tf-arrow)"/>

  <!-- ===== decision 1: visible at all? ===== -->
  <g>
    <polygon points="400,212 520,260 400,308 280,260" fill="none" stroke="#4A9EFF" stroke-width="2"/>
    <text x="400" y="256" font-size="14" font-weight="600" fill="currentColor" text-anchor="middle">Is the HDRI</text>
    <text x="400" y="274" font-size="14" font-weight="600" fill="currentColor" text-anchor="middle">visible in render?</text>
  </g>

  <!-- NO branch -> left column -->
  <line x1="280" y1="260" x2="150" y2="260" stroke="#8A8F98" stroke-width="2"/>
  <text x="215" y="250" font-size="13" font-weight="700" fill="#E63946" text-anchor="middle">NO</text>
  <line x1="150" y1="260" x2="150" y2="300" stroke="#8A8F98" stroke-width="2" marker-end="url(#tf-arrow)"/>
  <g>
    <rect x="40" y="304" width="220" height="92" rx="10" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.2"/>
    <text x="56" y="330" font-size="13.5" font-weight="700" fill="currentColor">Scene dark / no light</text>
    <text x="56" y="354" font-size="12.5" fill="currentColor" opacity="0.85">&#8226; Use World, not Object</text>
    <text x="56" y="374" font-size="12.5" fill="currentColor" opacity="0.85">&#8226; Environment Texture node</text>
    <text x="56" y="390" font-size="12.5" fill="currentColor" opacity="0.85">&#8226; check Strength &#8805; 1.0</text>
  </g>
  <!-- left -> solution -->
  <line x1="150" y1="396" x2="150" y2="440" stroke="#8A8F98" stroke-width="2" marker-end="url(#tf-arrow)"/>
  <g>
    <rect x="40" y="444" width="220" height="56" rx="10" fill="#4ADE80"/>
    <text x="150" y="468" font-size="13" font-weight="700" fill="#0f1a14" text-anchor="middle">FIX: connect to World</text>
    <text x="150" y="488" font-size="13" font-weight="700" fill="#0f1a14" text-anchor="middle">Output, raise Strength</text>
  </g>

  <!-- YES branch -> decision 2 -->
  <line x1="520" y1="260" x2="650" y2="260" stroke="#8A8F98" stroke-width="2"/>
  <text x="585" y="250" font-size="13" font-weight="700" fill="#4ADE80" text-anchor="middle">YES</text>
  <line x1="650" y1="260" x2="650" y2="300" stroke="#8A8F98" stroke-width="2" marker-end="url(#tf-arrow)"/>
  <g>
    <polygon points="650,304 762,348 650,392 538,348" fill="none" stroke="#4A9EFF" stroke-width="2"/>
    <text x="650" y="344" font-size="13.5" font-weight="600" fill="currentColor" text-anchor="middle">Colors / look</text>
    <text x="650" y="362" font-size="13.5" font-weight="600" fill="currentColor" text-anchor="middle">wrong?</text>
  </g>

  <!-- decision 2 -> three fix branches (washed out, rotation, grain) -->
  <line x1="650" y1="392" x2="650" y2="430" stroke="#8A8F98" stroke-width="2"/>
  <line x1="350" y1="430" x2="650" y2="430" stroke="#8A8F98" stroke-width="2"/>
  <!-- three drops -->
  <line x1="350" y1="430" x2="350" y2="452" stroke="#8A8F98" stroke-width="2" marker-end="url(#tf-arrow)"/>
  <line x1="500" y1="430" x2="500" y2="452" stroke="#8A8F98" stroke-width="2" marker-end="url(#tf-arrow)"/>
  <line x1="650" y1="430" x2="650" y2="452" stroke="#8A8F98" stroke-width="2" marker-end="url(#tf-arrow)"/>

  <g>
    <rect x="296" y="456" width="108" height="92" rx="10" fill="#4ADE80"/>
    <text x="350" y="480" font-size="12" font-weight="700" fill="#0f1a14" text-anchor="middle">Washed out</text>
    <line x1="312" y1="490" x2="388" y2="490" stroke="#0f1a14" stroke-opacity="0.25"/>
    <text x="350" y="508" font-size="11" fill="#0f1a14" text-anchor="middle">Set view</text>
    <text x="350" y="524" font-size="11" fill="#0f1a14" text-anchor="middle">transform to</text>
    <text x="350" y="540" font-size="11" font-weight="700" fill="#0f1a14" text-anchor="middle">Standard</text>
  </g>
  <g>
    <rect x="446" y="456" width="108" height="92" rx="10" fill="#4ADE80"/>
    <text x="500" y="480" font-size="12" font-weight="700" fill="#0f1a14" text-anchor="middle">Wrong angle</text>
    <line x1="462" y1="490" x2="538" y2="490" stroke="#0f1a14" stroke-opacity="0.25"/>
    <text x="500" y="508" font-size="11" fill="#0f1a14" text-anchor="middle">Add Mapping</text>
    <text x="500" y="524" font-size="11" fill="#0f1a14" text-anchor="middle">node, rotate</text>
    <text x="500" y="540" font-size="11" font-weight="700" fill="#0f1a14" text-anchor="middle">Z axis</text>
  </g>
  <g>
    <rect x="596" y="456" width="108" height="92" rx="10" fill="#4ADE80"/>
    <text x="650" y="480" font-size="12" font-weight="700" fill="#0f1a14" text-anchor="middle">Grainy</text>
    <line x1="612" y1="490" x2="688" y2="490" stroke="#0f1a14" stroke-opacity="0.25"/>
    <text x="650" y="508" font-size="11" fill="#0f1a14" text-anchor="middle">Raise samples,</text>
    <text x="650" y="524" font-size="11" fill="#0f1a14" text-anchor="middle">enable</text>
    <text x="650" y="540" font-size="11" font-weight="700" fill="#0f1a14" text-anchor="middle">Denoise</text>
  </g>

  <!-- legend strip -->
  <g font-size="12.5">
    <rect x="40" y="566" width="14" height="14" rx="3" fill="#4A9EFF"/>
    <text x="62" y="578" fill="currentColor" opacity="0.85">decision</text>
    <rect x="150" y="566" width="14" height="14" rx="3" fill="#4ADE80"/>
    <text x="172" y="578" fill="currentColor" opacity="0.85">fix / solution</text>
    <rect x="296" y="566" width="14" height="14" rx="3" fill="#FF6B00"/>
    <text x="318" y="578" fill="currentColor" opacity="0.85">start</text>
  </g>

  <!-- footer tip (Variant-B dense) -->
  <line x1="32" y1="641" x2="768" y2="641" stroke="currentColor" stroke-opacity="0.15" stroke-width="1"/>
  <text x="32" y="663" font-size="12.5" fill="currentColor" opacity="0.7">Tip: 90% of HDRI issues are a missing World connection or a low Strength value &#183; check those first.</text>
</svg>
