<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="pr-title pr-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="pr-title">The 12 principles of animation quick reference</title>
  <desc id="pr-desc">A twelve cell quick reference card listing all twelve classic principles of animation in order, each with a number, name, and one line description.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">THE 12 PRINCIPLES OF ANIMATION</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Quick reference card &#183; the classic toolkit in canonical order</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Cell 1 -->
  <circle cx="58" cy="166" r="14" fill="#FF6B00"/>
  <text x="58" y="171" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>
  <text x="82" y="162" font-size="15" font-weight="600" fill="currentColor">Squash &amp; Stretch</text>
  <text x="42" y="194" font-size="13" fill="currentColor" opacity="0.6">Deform on impact, keep volume.</text>
  <!-- Cell 2 -->
  <circle cx="298" cy="166" r="14" fill="#FF6B00"/>
  <text x="298" y="171" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2</text>
  <text x="322" y="162" font-size="15" font-weight="600" fill="currentColor">Anticipation</text>
  <text x="282" y="194" font-size="13" fill="currentColor" opacity="0.6">Wind up before the action.</text>
  <!-- Cell 3 -->
  <circle cx="538" cy="166" r="14" fill="#FF6B00"/>
  <text x="538" y="171" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3</text>
  <text x="562" y="162" font-size="15" font-weight="600" fill="currentColor">Staging</text>
  <text x="522" y="194" font-size="13" fill="currentColor" opacity="0.6">Read the action clearly.</text>
  <!-- Cell 4 -->
  <circle cx="58" cy="284" r="14" fill="#FF6B00"/>
  <text x="58" y="289" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">4</text>
  <text x="82" y="280" font-size="15" font-weight="600" fill="currentColor">Straight Ahead &amp;</text>
  <text x="82" y="298" font-size="15" font-weight="600" fill="currentColor">Pose to Pose</text>
  <text x="42" y="330" font-size="13" fill="currentColor" opacity="0.6">Two ways to key a shot.</text>
  <!-- Cell 5 -->
  <circle cx="298" cy="284" r="14" fill="#FF6B00"/>
  <text x="298" y="289" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">5</text>
  <text x="322" y="280" font-size="15" font-weight="600" fill="currentColor">Follow-Through &amp;</text>
  <text x="322" y="298" font-size="15" font-weight="600" fill="currentColor">Overlap</text>
  <text x="282" y="330" font-size="13" fill="currentColor" opacity="0.6">Loose parts trail and settle.</text>
  <!-- Cell 6 -->
  <circle cx="538" cy="284" r="14" fill="#FF6B00"/>
  <text x="538" y="289" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">6</text>
  <text x="562" y="280" font-size="15" font-weight="600" fill="currentColor">Slow In &amp; Slow Out</text>
  <text x="522" y="312" font-size="13" fill="currentColor" opacity="0.6">Ease at the ends of a move.</text>
  <!-- Cell 7 -->
  <circle cx="58" cy="402" r="14" fill="#FF6B00"/>
  <text x="58" y="407" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">7</text>
  <text x="82" y="398" font-size="15" font-weight="600" fill="currentColor">Arcs</text>
  <text x="42" y="430" font-size="13" fill="currentColor" opacity="0.6">Natural motion curves, not lines.</text>
  <!-- Cell 8 -->
  <circle cx="298" cy="402" r="14" fill="#FF6B00"/>
  <text x="298" y="407" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">8</text>
  <text x="322" y="398" font-size="15" font-weight="600" fill="currentColor">Secondary Action</text>
  <text x="282" y="430" font-size="13" fill="currentColor" opacity="0.6">Support, never steal focus.</text>
  <!-- Cell 9 -->
  <circle cx="538" cy="402" r="14" fill="#FF6B00"/>
  <text x="538" y="407" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">9</text>
  <text x="562" y="398" font-size="15" font-weight="600" fill="currentColor">Timing</text>
  <text x="522" y="430" font-size="13" fill="currentColor" opacity="0.6">Frame count sets weight and mood.</text>
  <!-- Cell 10 -->
  <circle cx="58" cy="520" r="14" fill="#FF6B00"/>
  <text x="58" y="525" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">10</text>
  <text x="82" y="516" font-size="15" font-weight="600" fill="currentColor">Exaggeration</text>
  <text x="42" y="548" font-size="13" fill="currentColor" opacity="0.6">Push the idea past literal.</text>
  <!-- Cell 11 -->
  <circle cx="298" cy="520" r="14" fill="#FF6B00"/>
  <text x="298" y="525" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">11</text>
  <text x="322" y="516" font-size="15" font-weight="600" fill="currentColor">Solid Drawing</text>
  <text x="282" y="548" font-size="13" fill="currentColor" opacity="0.6">Believable form, weight, balance.</text>
  <!-- Cell 12 -->
  <circle cx="538" cy="520" r="14" fill="#FF6B00"/>
  <text x="538" y="525" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">12</text>
  <text x="562" y="516" font-size="15" font-weight="600" fill="currentColor">Appeal</text>
  <text x="522" y="548" font-size="13" fill="currentColor" opacity="0.6">Make it interesting to watch.</text>

  <rect x="40" y="641" width="720" height="34" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> these 12 are a checklist, not a recipe &#183; most shots lean on a handful at once.</text>
</svg>