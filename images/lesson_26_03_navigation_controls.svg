<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="nc-title nc-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="nc-title">Navigating the Graph Editor with mouse and keyboard</title>
  <desc id="nc-desc">A reference card of the main Graph Editor navigation controls, grouped into mouse actions and keyboard shortcuts. Mouse: drag the middle mouse button to pan the view, scroll the wheel to zoom in and out, hold Shift and drag the middle mouse button to pan vertically, and hold Ctrl and drag the middle mouse button to zoom. Keyboard: press Home to frame all curves, press Numpad Period to frame the selected keyframes, and press Spacebar to play the animation.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">NAVIGATION CONTROLS</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Pan, zoom, and frame your curves &#183; the moves you reach for constantly</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ===== MOUSE column header ===== -->
  <text x="40" y="150" font-size="15" font-weight="700" fill="#FF6B00">MOUSE</text>
  <line x1="40" y1="160" x2="380" y2="160" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Mouse row 1: MMB drag = Pan View -->
  <rect x="40" y="178" width="124" height="40" rx="7" fill="#FF6B00"/>
  <text x="102" y="203" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">MMB drag</text>
  <text x="180" y="197" font-size="15" font-weight="600" fill="currentColor">Pan View</text>
  <text x="180" y="214" font-size="12.5" fill="currentColor" opacity="0.6">Slide the curve area around</text>

  <!-- Mouse row 2: Scroll = Zoom In / Out -->
  <rect x="40" y="232" width="124" height="40" rx="7" fill="#FF6B00"/>
  <text x="102" y="257" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Scroll</text>
  <text x="180" y="251" font-size="15" font-weight="600" fill="currentColor">Zoom In / Out</text>
  <text x="180" y="268" font-size="12.5" fill="currentColor" opacity="0.6">Zoom both axes together</text>

  <!-- Mouse row 3: Shift+MMB = Pan Vertically -->
  <rect x="40" y="286" width="124" height="40" rx="7" fill="#FF6B00"/>
  <text x="102" y="311" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Shift+MMB</text>
  <text x="180" y="305" font-size="15" font-weight="600" fill="currentColor">Pan Vertically</text>
  <text x="180" y="322" font-size="12.5" fill="currentColor" opacity="0.6">Shift the value axis only</text>

  <!-- Mouse row 4: Ctrl+MMB = Zoom -->
  <rect x="40" y="340" width="124" height="40" rx="7" fill="#FF6B00"/>
  <text x="102" y="365" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Ctrl+MMB</text>
  <text x="180" y="359" font-size="15" font-weight="600" fill="currentColor">Drag to Zoom</text>
  <text x="180" y="376" font-size="12.5" fill="currentColor" opacity="0.6">Scale one axis by dragging</text>

  <!-- ===== KEYBOARD column header ===== -->
  <text x="420" y="150" font-size="15" font-weight="700" fill="#FF6B00">KEYBOARD</text>
  <line x1="420" y1="160" x2="760" y2="160" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Keyboard row 1: Home = Frame All Curves -->
  <rect x="420" y="178" width="124" height="40" rx="7" fill="#FF6B00"/>
  <text x="482" y="203" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Home</text>
  <text x="560" y="197" font-size="15" font-weight="600" fill="currentColor">Frame All Curves</text>
  <text x="560" y="214" font-size="12.5" fill="currentColor" opacity="0.6">Fit every curve on screen</text>

  <!-- Keyboard row 2: Numpad . = Frame Selected -->
  <rect x="420" y="232" width="124" height="40" rx="7" fill="#FF6B00"/>
  <text x="482" y="257" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Numpad .</text>
  <text x="560" y="251" font-size="15" font-weight="600" fill="currentColor">Frame Selected</text>
  <text x="560" y="268" font-size="12.5" fill="currentColor" opacity="0.6">Zoom to chosen keyframes</text>

  <!-- Keyboard row 3: Spacebar = Play Animation -->
  <rect x="420" y="286" width="124" height="40" rx="7" fill="#FF6B00"/>
  <text x="482" y="311" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Spacebar</text>
  <text x="560" y="305" font-size="15" font-weight="600" fill="currentColor">Play Animation</text>
  <text x="560" y="322" font-size="12.5" fill="currentColor" opacity="0.6">Watch the curves in motion</text>

  <!-- ===== Bottom panel: framing keys are the lifesavers ===== -->
  <rect x="40" y="420" width="720" height="150" rx="10" fill="currentColor" opacity="0.04"/>
  <rect x="40" y="420" width="4" height="150" fill="#FF6B00"/>
  <text x="66" y="454" font-size="16" font-weight="700" fill="currentColor">Lost in the curves? Frame your way back</text>
  <text x="66" y="482" font-size="13.5" fill="currentColor" opacity="0.75">It is easy to zoom or pan until your curves scroll right off the screen. Two keys</text>
  <text x="66" y="504" font-size="13.5" fill="currentColor" opacity="0.75">bring them straight back into view, so you never have to hunt:</text>

  <!-- Home badge -->
  <rect x="66" y="522" width="96" height="34" rx="6" fill="#FF6B00"/>
  <text x="114" y="544" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Home</text>
  <text x="174" y="544" font-size="13.5" fill="currentColor">frames everything</text>
  <!-- Numpad . badge -->
  <rect x="330" y="522" width="110" height="34" rx="6" fill="#FF6B00"/>
  <text x="385" y="544" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Numpad .</text>
  <text x="452" y="544" font-size="13.5" fill="currentColor">frames just the selection</text>

  <!-- Footer tip (800x680 variant: y=641 rail, y=663 text) -->
  <rect x="40" y="641" width="720" height="34" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> No middle mouse button? Turn on Emulate 3 Button Mouse in Preferences and use Alt+Left drag to pan.
  </text>
</svg>
