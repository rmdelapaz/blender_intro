<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"
     role="img" aria-labelledby="mc-title mc-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="mc-title">Material-specific color guidance chart</title>
  <desc id="mc-desc">A reference chart of starting color palettes for four common materials, each with four swatches, hex codes, and a key tip. Wood: tan to dark brown with orange and yellow tints, never pure brown. Metal: desaturated grays with slight tint, low saturation and high value contrast. Stone: muted gray, gray-brown and tan earth tones with subtle variation. Fabric: varied warm and cool tones, with cooler fold shadows and warmer highlights.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Material Color Guidance</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Starting palettes for four common surfaces &#183; tune to your reference</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Wood -->
  <rect x="40" y="150" width="4" height="26" fill="#FF6B00"/>
  <text x="56" y="170" font-size="18" font-weight="700" fill="#FF6B00">Wood</text>
  <rect x="56" y="188" width="70" height="54" fill="#C8945B" stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>
  <text x="91" y="258" font-size="10.5" fill="currentColor" opacity="0.75" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">#C8945B</text>
  <rect x="138" y="188" width="70" height="54" fill="#9C6B3C" stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>
  <text x="173" y="258" font-size="10.5" fill="currentColor" opacity="0.75" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">#9C6B3C</text>
  <rect x="220" y="188" width="70" height="54" fill="#5E3A1E" stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>
  <text x="255" y="258" font-size="10.5" fill="currentColor" opacity="0.75" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">#5E3A1E</text>
  <rect x="302" y="188" width="70" height="54" fill="#D8A765" stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>
  <text x="337" y="258" font-size="10.5" fill="currentColor" opacity="0.75" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">#D8A765</text>
  <text x="56" y="280" font-size="12" fill="currentColor" opacity="0.8">Never pure brown &#183; add orange and yellow tints</text>
  <!-- Metal -->
  <rect x="410" y="150" width="4" height="26" fill="#FF6B00"/>
  <text x="426" y="170" font-size="18" font-weight="700" fill="#FF6B00">Metal</text>
  <rect x="426" y="188" width="70" height="54" fill="#9AA0A6" stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>
  <text x="461" y="258" font-size="10.5" fill="currentColor" opacity="0.75" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">#9AA0A6</text>
  <rect x="508" y="188" width="70" height="54" fill="#5C636B" stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>
  <text x="543" y="258" font-size="10.5" fill="currentColor" opacity="0.75" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">#5C636B</text>
  <rect x="590" y="188" width="70" height="54" fill="#C3C8CE" stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>
  <text x="625" y="258" font-size="10.5" fill="currentColor" opacity="0.75" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">#C3C8CE</text>
  <rect x="672" y="188" width="70" height="54" fill="#3A3F45" stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>
  <text x="707" y="258" font-size="10.5" fill="currentColor" opacity="0.75" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">#3A3F45</text>
  <text x="426" y="280" font-size="12" fill="currentColor" opacity="0.8">Low saturation &#183; high value contrast</text>
  <!-- Stone -->
  <rect x="40" y="360" width="4" height="26" fill="#FF6B00"/>
  <text x="56" y="380" font-size="18" font-weight="700" fill="#FF6B00">Stone</text>
  <rect x="56" y="398" width="70" height="54" fill="#A7A29B" stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>
  <text x="91" y="468" font-size="10.5" fill="currentColor" opacity="0.75" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">#A7A29B</text>
  <rect x="138" y="398" width="70" height="54" fill="#7C766C" stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>
  <text x="173" y="468" font-size="10.5" fill="currentColor" opacity="0.75" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">#7C766C</text>
  <rect x="220" y="398" width="70" height="54" fill="#B9AE97" stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>
  <text x="255" y="468" font-size="10.5" fill="currentColor" opacity="0.75" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">#B9AE97</text>
  <rect x="302" y="398" width="70" height="54" fill="#615C54" stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>
  <text x="337" y="468" font-size="10.5" fill="currentColor" opacity="0.75" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">#615C54</text>
  <text x="56" y="490" font-size="12" fill="currentColor" opacity="0.8">Desaturated earth tones &#183; subtle variation</text>
  <!-- Fabric -->
  <rect x="410" y="360" width="4" height="26" fill="#FF6B00"/>
  <text x="426" y="380" font-size="18" font-weight="700" fill="#FF6B00">Fabric</text>
  <rect x="426" y="398" width="70" height="54" fill="#7E4A57" stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>
  <text x="461" y="468" font-size="10.5" fill="currentColor" opacity="0.75" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">#7E4A57</text>
  <rect x="508" y="398" width="70" height="54" fill="#C28A3D" stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>
  <text x="543" y="468" font-size="10.5" fill="currentColor" opacity="0.75" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">#C28A3D</text>
  <rect x="590" y="398" width="70" height="54" fill="#3E6E78" stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>
  <text x="625" y="468" font-size="10.5" fill="currentColor" opacity="0.75" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">#3E6E78</text>
  <rect x="672" y="398" width="70" height="54" fill="#B0A98F" stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>
  <text x="707" y="468" font-size="10.5" fill="currentColor" opacity="0.75" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">#B0A98F</text>
  <text x="426" y="490" font-size="12" fill="currentColor" opacity="0.8">Fold shadows cooler &#183; highlights warmer</text>

  <!-- Footer tip -->
  <rect x="40" y="556" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="578" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> These are starting points, not rules &#183; almost every real surface needs subtle color variation across it.</text>
</svg>