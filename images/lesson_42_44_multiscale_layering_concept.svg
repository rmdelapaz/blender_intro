<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="msl-title msl-desc" color="#222">
<title id="msl-title">Multi-Scale Layering Concept</title>
<desc id="msl-desc">Three semi-transparent noise layers, large then medium then fine, stack above a base and combine downward into a single richer final result, illustrating additive multi-scale layering.</desc>
<defs>
<filter id="mL"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feColorMatrix type="saturate" values="0"/></filter>
<filter id="mM"><feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" seed="6"/><feColorMatrix type="saturate" values="0"/></filter>
<filter id="mF"><feTurbulence type="fractalNoise" baseFrequency="0.28" numOctaves="3" seed="8"/><feColorMatrix type="saturate" values="0"/></filter>
<filter id="mAll"><feTurbulence type="fractalNoise" baseFrequency="0.02 0.02" numOctaves="5" seed="3"/><feColorMatrix type="saturate" values="0"/></filter>
</defs>
<style>
.lbl{fill:currentColor;font-family:'Segoe UI',Arial,sans-serif;}
.hd{font-size:26px;font-weight:700;}
.tag{font-size:15px;font-weight:700;}
.dsc{font-size:12px;fill:currentColor;opacity:.7;}
.pl{stroke-width:2;}
</style>
<text x="400" y="42" text-anchor="middle" class="lbl hd">Multi-Scale Layering Concept</text>
<text x="400" y="68" text-anchor="middle" class="lbl dsc" style="opacity:.8">Stack noise at several scales, each at partial strength, for natural richness</text>

<!-- stacked parallelogram layers (isometric-ish) -->
<!-- fine (top) -->
<g transform="translate(250,95)">
<polygon points="0,60 260,60 340,0 80,0" class="pl" fill="#F5C242" fill-opacity=".16" stroke="#F5C242"/>
<polygon points="0,60 260,60 340,0 80,0" filter="url(#mF)" opacity=".28"/>
<text x="360" y="34" class="lbl tag" fill="#F5C242">Fine Scale</text>
<text x="360" y="52" class="lbl dsc">micro detail &#183; ~50% strength</text>
</g>
<!-- medium -->
<g transform="translate(210,175)">
<polygon points="0,60 260,60 340,0 80,0" class="pl" fill="#4ADE80" fill-opacity=".16" stroke="#4ADE80"/>
<polygon points="0,60 260,60 340,0 80,0" filter="url(#mM)" opacity=".28"/>
<text x="360" y="34" class="lbl tag" fill="#4ADE80">Medium Scale</text>
<text x="360" y="52" class="lbl dsc">primary texture &#183; ~50% strength</text>
</g>
<!-- large -->
<g transform="translate(170,255)">
<polygon points="0,60 260,60 340,0 80,0" class="pl" fill="#4A9EFF" fill-opacity=".16" stroke="#4A9EFF"/>
<polygon points="0,60 260,60 340,0 80,0" filter="url(#mL)" opacity=".28"/>
<text x="360" y="34" class="lbl tag" fill="#4A9EFF">Large Scale</text>
<text x="360" y="52" class="lbl dsc">broad variation &#183; ~50% strength</text>
</g>

<!-- combine arrow -->
<g transform="translate(400,360)">
<line x1="0" y1="0" x2="0" y2="46" stroke="#FF6B00" stroke-width="4"/>
<polygon points="-9,46 9,46 0,63" fill="#FF6B00"/>
<text x="120" y="38" text-anchor="middle" class="lbl tag" fill="#FF6B00">combine</text>
</g>

<!-- final result -->
<g transform="translate(230,440)">
<rect x="0" y="0" width="340" height="110" rx="8" stroke="#FF6B00" stroke-width="2.5" fill="#888"/>
<rect x="4" y="4" width="332" height="102" rx="6" filter="url(#mAll)" opacity=".92"/>
<text x="170" y="-12" text-anchor="middle" class="lbl tag">Final Combined Result</text>
</g>
</svg>
