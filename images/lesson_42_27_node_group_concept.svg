<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="ngc-title ngc-desc" color="#222">
<title id="ngc-title">Node Group Concept</title>
<desc id="ngc-desc">A tangled network of many shader nodes on the left collapses through Make Group into a single clean node group box on the right that exposes only a few input and output sockets.</desc>
<style>
.lbl{fill:currentColor;font-family:'Segoe UI',Arial,sans-serif;}
.hd{font-size:26px;font-weight:700;}
.cap{font-size:15px;font-weight:700;}
.sub{font-size:12px;fill:currentColor;opacity:.7;}
.nd{fill:none;stroke:currentColor;stroke-width:1.5;opacity:.85;}
.wire{fill:none;stroke:currentColor;stroke-width:1;opacity:.5;}
.sock{fill:#F5C242;}
</style>
<text x="400" y="42" text-anchor="middle" class="lbl hd">Node Group Concept</text>

<!-- LEFT: messy network -->
<text x="185" y="80" text-anchor="middle" class="lbl cap" fill="#E63946">Before &#183; tangled network</text>
<g>
<!-- scattered node boxes -->
<rect x="40"  y="110" width="70" height="30" rx="4" class="nd"/>
<rect x="150" y="150" width="70" height="30" rx="4" class="nd"/>
<rect x="55"  y="200" width="70" height="30" rx="4" class="nd"/>
<rect x="170" y="240" width="70" height="30" rx="4" class="nd"/>
<rect x="45"  y="290" width="70" height="30" rx="4" class="nd"/>
<rect x="160" y="330" width="70" height="30" rx="4" class="nd"/>
<rect x="70"  y="380" width="70" height="30" rx="4" class="nd"/>
<rect x="185" y="415" width="70" height="30" rx="4" class="nd"/>
<!-- crossing wires (spaghetti) -->
<path class="wire" d="M110,125 C160,120 130,165 150,165"/>
<path class="wire" d="M220,165 C260,180 90,200 125,215"/>
<path class="wire" d="M125,215 C150,240 200,235 170,255"/>
<path class="wire" d="M240,255 C280,290 60,290 115,305"/>
<path class="wire" d="M115,305 C150,340 130,345 160,345"/>
<path class="wire" d="M230,345 C270,380 90,375 140,395"/>
<path class="wire" d="M140,395 C170,420 210,415 185,430"/>
<path class="wire" d="M40,125 C10,220 20,360 70,395"/>
<path class="wire" d="M150,180 C110,250 190,320 160,335"/>
</g>
<text x="185" y="480" text-anchor="middle" class="lbl sub">15-20 nodes, many crossing connections</text>

<!-- MIDDLE arrow -->
<g transform="translate(400,270)">
<line x1="-45" y1="0" x2="45" y2="0" stroke="#FF6B00" stroke-width="4"/>
<polygon points="45,-9 45,9 62,0" fill="#FF6B00"/>
<text x="8" y="-22" text-anchor="middle" class="lbl cap" fill="#FF6B00">Make Group</text>
<text x="8" y="30" text-anchor="middle" class="lbl sub">Ctrl G</text>
</g>

<!-- RIGHT: clean group -->
<text x="620" y="80" text-anchor="middle" class="lbl cap" fill="#4ADE80">After &#183; one node group</text>
<g>
<rect x="520" y="210" width="200" height="120" rx="10" fill="#4ADE80" opacity=".18" stroke="#4ADE80" stroke-width="2.5"/>
<text x="620" y="252" text-anchor="middle" class="lbl cap">Procedural</text>
<text x="620" y="272" text-anchor="middle" class="lbl cap">Dirt Mask</text>
<!-- input sockets left -->
<circle cx="520" cy="240" r="5" class="sock"/><text x="508" y="244" text-anchor="end" class="lbl sub">Scale</text>
<circle cx="520" cy="300" r="5" class="sock"/><text x="508" y="304" text-anchor="end" class="lbl sub">Detail</text>
<!-- output socket right -->
<circle cx="720" cy="270" r="5" fill="#4ADE80"/><text x="732" y="274" class="lbl sub">Mask</text>
</g>
<text x="620" y="480" text-anchor="middle" class="lbl sub">Complexity hidden inside, only a few clean sockets</text>

<text x="400" y="525" text-anchor="middle" class="lbl sub">Group once, reuse everywhere, edit the network in one place.</text>
</svg>
