<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="ae-title ae-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="ae-title">Areas and Editors in Blender</title>
  <desc id="ae-desc">A conceptual diagram of Blender's interface architecture. An area is a rectangular slot in the window with an editor-type selector in its top-left corner. An editor is the swappable content that fills the area. The same area can hold any editor: 3D Viewport, Outliner, Properties, Shader Editor, Image and UV Editor, Timeline, and many more. Click the editor-type icon to change which editor lives in any area.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Areas and Editors</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Areas are slots in the window. Editors are the swappable content that fills them.</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ===== LEFT: AREA ===== -->
  <text x="190" y="148" font-size="13" font-weight="700" fill="#4A9EFF" letter-spacing="1.5" text-anchor="middle">AREA</text>
  <text x="190" y="167" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">a rectangular slot in the window</text>

  <!-- Area frame -->
  <rect x="70" y="190" width="240" height="240" rx="6"
        fill="#4A9EFF" fill-opacity="0.04"
        stroke="#4A9EFF" stroke-opacity="0.55"
        stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Editor-type selector icon (cube + small down arrow) in area's top-left -->
  <rect x="82" y="200" width="13" height="13" rx="2"
        fill="#FF6B00" fill-opacity="0.20"
        stroke="#FF6B00" stroke-width="1.2"/>
  <polygon points="100,204 108,204 104,210" fill="#FF6B00"/>

  <!-- Callout from selector to label -->
  <line x1="112" y1="208" x2="180" y2="240" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <circle cx="112" cy="208" r="2" fill="currentColor" opacity="0.5"/>
  <text x="180" y="244" font-size="11" font-weight="600" fill="#FF6B00">Editor-type icon</text>
  <text x="180" y="260" font-size="11" fill="currentColor" opacity="0.6">click to change content</text>

  <!-- Placeholder inside area -->
  <text x="190" y="365" font-size="13" font-style="italic" fill="currentColor" opacity="0.5" text-anchor="middle">(an editor goes here)</text>

  <!-- ===== CENTER: swap arrows ===== -->
  <text x="380" y="275" font-size="10" font-weight="700" fill="#FF6B00" text-anchor="middle" letter-spacing="1.5">SWAP</text>
  <g fill="none" stroke="#FF6B00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <path d="M 320 295 Q 380 280 440 295"/>
    <polyline points="432,290 441,295 432,300"/>
    <path d="M 440 330 Q 380 345 320 330"/>
    <polyline points="328,325 319,330 328,335"/>
  </g>

  <!-- ===== RIGHT: EDITORS ===== -->
  <text x="565" y="148" font-size="13" font-weight="700" fill="#B47EE8" letter-spacing="1.5" text-anchor="middle">EDITORS</text>
  <text x="565" y="167" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">any of these can fill the area</text>

  <!-- Tile 1: 3D Viewport -->
  <rect x="455" y="194" width="220" height="32" rx="6"
        fill="#FF6B00" fill-opacity="0.10"
        stroke="#FF6B00" stroke-opacity="0.5" stroke-width="1.2"/>
  <circle cx="473" cy="210" r="5" fill="#FF6B00"/>
  <text x="487" y="214" font-size="13" font-weight="500" fill="currentColor">3D Viewport</text>

  <!-- Tile 2: Outliner -->
  <rect x="455" y="232" width="220" height="32" rx="6"
        fill="#4A9EFF" fill-opacity="0.10"
        stroke="#4A9EFF" stroke-opacity="0.55" stroke-width="1.2"/>
  <circle cx="473" cy="248" r="5" fill="#4A9EFF"/>
  <text x="487" y="252" font-size="13" font-weight="500" fill="currentColor">Outliner</text>

  <!-- Tile 3: Properties -->
  <rect x="455" y="270" width="220" height="32" rx="6"
        fill="#4ADE80" fill-opacity="0.10"
        stroke="#4ADE80" stroke-opacity="0.6" stroke-width="1.2"/>
  <circle cx="473" cy="286" r="5" fill="#4ADE80"/>
  <text x="487" y="290" font-size="13" font-weight="500" fill="currentColor">Properties</text>

  <!-- Tile 4: Shader Editor -->
  <rect x="455" y="308" width="220" height="32" rx="6"
        fill="#B47EE8" fill-opacity="0.10"
        stroke="#B47EE8" stroke-opacity="0.6" stroke-width="1.2"/>
  <circle cx="473" cy="324" r="5" fill="#B47EE8"/>
  <text x="487" y="328" font-size="13" font-weight="500" fill="currentColor">Shader Editor</text>

  <!-- Tile 5: Image / UV Editor -->
  <rect x="455" y="346" width="220" height="32" rx="6"
        fill="#FF7EA8" fill-opacity="0.10"
        stroke="#FF7EA8" stroke-opacity="0.6" stroke-width="1.2"/>
  <circle cx="473" cy="362" r="5" fill="#FF7EA8"/>
  <text x="487" y="366" font-size="13" font-weight="500" fill="currentColor">Image / UV Editor</text>

  <!-- Tile 6: Timeline -->
  <rect x="455" y="384" width="220" height="32" rx="6"
        fill="#F5C242" fill-opacity="0.14"
        stroke="#F5C242" stroke-opacity="0.65" stroke-width="1.2"/>
  <circle cx="473" cy="400" r="5" fill="#F5C242"/>
  <text x="487" y="404" font-size="13" font-weight="500" fill="currentColor">Timeline</text>

  <!-- "...and more" -->
  <text x="565" y="436" font-size="11" font-style="italic" fill="currentColor" opacity="0.55" text-anchor="middle">&#8230; and roughly 20 more editor types</text>

  <!-- Bottom caption -->
  <text x="400" y="478" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">Every workspace is the same idea &#8212; the same areas filled with different editors.</text>

  <!-- Footer tip -->
  <rect x="40" y="506" width="720" height="34" rx="6"
        fill="#FF6B00" fill-opacity="0.10" stroke="#FF6B00" stroke-opacity="0.4"/>
  <text x="54" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> If a panel disappears, you didn&#8217;t lose it &#8212; an area&#8217;s editor type just changed. Swap it back.
  </text>
</svg>
