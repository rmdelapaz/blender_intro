<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="qsr-title qsr-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="qsr-title">Cycles quick settings reference</title>
  <desc id="qsr-desc">A four-panel reference card of recommended Cycles starting values. Essential covers render engine, device, samples, adaptive sampling and denoising. Light Paths covers max bounces, diffuse, glossy, transmission, volume and clamping. Optimization lists the highest-impact speedups. When to Adjust explains when to push values higher or lower.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Cycles Quick Settings Reference</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Sensible starting values for Blender 5.1.1 Cycles · adjust from here, do not memorize</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Panel geometry: two columns x=40 (w=350) and x=410 (w=350) ; two rows y=132 (h=240) and y=388 (h=232) -->

  <!-- Panel 1: Essential -->
  <rect x="40" y="132" width="350" height="240" rx="10" fill="currentColor" opacity="0.04"/>
  <rect x="40" y="132" width="6" height="240" rx="3" fill="#FF6B00"/>
  <text x="62" y="160" font-size="17" font-weight="700" fill="currentColor">Essential</text>
  <g font-size="13.5">
    <text x="62" y="188" fill="currentColor" opacity="0.7">Render Engine</text><text x="370" y="188" text-anchor="end" font-weight="600" fill="currentColor">Cycles</text>
    <text x="62" y="214" fill="currentColor" opacity="0.7">Device</text><text x="370" y="214" text-anchor="end" font-weight="600" fill="currentColor">GPU Compute</text>
    <text x="62" y="240" fill="currentColor" opacity="0.7">Render Samples</text><text x="370" y="240" text-anchor="end" font-weight="600" fill="currentColor">256 to 512</text>
    <text x="62" y="266" fill="currentColor" opacity="0.7">Viewport Samples</text><text x="370" y="266" text-anchor="end" font-weight="600" fill="currentColor">32 to 64</text>
    <text x="62" y="292" fill="currentColor" opacity="0.7">Adaptive Sampling</text><text x="370" y="292" text-anchor="end" font-weight="600" fill="currentColor">On, 0.01</text>
    <text x="62" y="318" fill="currentColor" opacity="0.7">Denoise (Render)</text><text x="370" y="318" text-anchor="end" font-weight="600" fill="currentColor">On</text>
    <text x="62" y="344" fill="currentColor" opacity="0.7">Denoiser</text><text x="370" y="344" text-anchor="end" font-weight="600" fill="currentColor">OptiX / OIDN</text>
  </g>

  <!-- Panel 2: Light Paths -->
  <rect x="410" y="132" width="350" height="240" rx="10" fill="currentColor" opacity="0.04"/>
  <rect x="410" y="132" width="6" height="240" rx="3" fill="#4A9EFF"/>
  <text x="432" y="160" font-size="17" font-weight="700" fill="currentColor">Light Paths</text>
  <g font-size="13.5">
    <text x="432" y="188" fill="currentColor" opacity="0.7">Max Bounces</text><text x="740" y="188" text-anchor="end" font-weight="600" fill="currentColor">8 to 12</text>
    <text x="432" y="214" fill="currentColor" opacity="0.7">Diffuse</text><text x="740" y="214" text-anchor="end" font-weight="600" fill="currentColor">4</text>
    <text x="432" y="240" fill="currentColor" opacity="0.7">Glossy</text><text x="740" y="240" text-anchor="end" font-weight="600" fill="currentColor">4</text>
    <text x="432" y="266" fill="currentColor" opacity="0.7">Transmission (glass)</text><text x="740" y="266" text-anchor="end" font-weight="600" fill="currentColor">12</text>
    <text x="432" y="292" fill="currentColor" opacity="0.7">Volume</text><text x="740" y="292" text-anchor="end" font-weight="600" fill="currentColor">0 to 2</text>
    <text x="432" y="318" fill="currentColor" opacity="0.7">Clamp Indirect</text><text x="740" y="318" text-anchor="end" font-weight="600" fill="currentColor">5 to 10</text>
    <text x="432" y="344" fill="currentColor" opacity="0.7">Caustics</text><text x="740" y="344" text-anchor="end" font-weight="600" fill="currentColor">Off unless needed</text>
  </g>

  <!-- Panel 3: Optimization -->
  <rect x="40" y="388" width="350" height="232" rx="10" fill="currentColor" opacity="0.04"/>
  <rect x="40" y="388" width="6" height="232" rx="3" fill="#4ADE80"/>
  <text x="62" y="416" font-size="17" font-weight="700" fill="currentColor">Optimization</text>
  <g font-size="13.5" fill="currentColor">
    <text x="62" y="444"><tspan font-weight="700" fill="#4ADE80">1.</tspan> Denoising on (biggest win)</text>
    <text x="62" y="470"><tspan font-weight="700" fill="#4ADE80">2.</tspan> Adaptive Sampling on</text>
    <text x="62" y="496"><tspan font-weight="700" fill="#4ADE80">3.</tspan> Keep samples at 256 to 512</text>
    <text x="62" y="522"><tspan font-weight="700" fill="#4ADE80">4.</tspan> Test at 50 percent resolution</text>
    <text x="62" y="548"><tspan font-weight="700" fill="#4ADE80">5.</tspan> Lower bounces, caustics off</text>
    <text x="62" y="574"><tspan font-weight="700" fill="#4ADE80">6.</tspan> Instance repeats (Alt+D)</text>
    <text x="62" y="600"><tspan font-weight="700" fill="#4ADE80">7.</tspan> Render Region for spot tests</text>
  </g>

  <!-- Panel 4: When to Adjust -->
  <rect x="410" y="388" width="350" height="232" rx="10" fill="currentColor" opacity="0.04"/>
  <rect x="410" y="388" width="6" height="232" rx="3" fill="#F5C242"/>
  <text x="432" y="416" font-size="17" font-weight="700" fill="currentColor">When to Adjust</text>
  <g font-size="13" fill="currentColor">
    <text x="432" y="442" font-weight="600">Still noisy after denoise?</text>
    <text x="432" y="460" opacity="0.7">Raise samples toward 1024.</text>
    <text x="432" y="486" font-weight="600">Dark or flat glass / metal?</text>
    <text x="432" y="504" opacity="0.7">Raise Transmission and Glossy bounces.</text>
    <text x="432" y="530" font-weight="600">Bright dots (fireflies)?</text>
    <text x="432" y="548" opacity="0.7">Lower Clamp Indirect toward 3.</text>
    <text x="432" y="574" font-weight="600">Render too slow?</text>
    <text x="432" y="592" opacity="0.7">Drop samples, resolution, bounces first.</text>
  </g>

  <!-- Footer tip (Variant B left rail), dense 680 position -->
  <rect x="40" y="641" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> These are starting points, not rules. Render, look, then change one setting at a time.
  </text>
</svg>
