<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="jge-title jge-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="jge-title">Why Join Geometry is essential</title>
  <desc id="jge-desc">Two geometry branches, an original mesh and a new cube, feed into a Join Geometry node before Group Output. The result shows both objects together. A warning notes that without Join Geometry only one branch reaches the output and the other disappears.</desc>
  <defs>
    <marker id="jge-arrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#4ADE80"/></marker>
  </defs>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Why Join Geometry is essential</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">A socket takes one link, so two branches must be merged before output</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Branch 1 -->
  <rect x="52" y="180" width="150" height="44" rx="6" fill="#4ADE80" fill-opacity="0.12" stroke="#4ADE80" stroke-opacity="0.6" stroke-width="1.3"/>
  <text x="127" y="200" text-anchor="middle" font-size="12" fill="currentColor">Group Input</text>
  <text x="127" y="216" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.6">original geometry</text>
  <!-- Branch 2 -->
  <rect x="52" y="300" width="150" height="44" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.3"/>
  <text x="127" y="320" text-anchor="middle" font-size="12" fill="currentColor">Mesh Cube</text>
  <text x="127" y="336" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.6">new geometry</text>

  <!-- Join node -->
  <rect x="300" y="238" width="150" height="48" rx="6" fill="#F5C242" fill-opacity="0.16" stroke="#F5C242" stroke-width="2"/>
  <text x="375" y="266" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Join Geometry</text>

  <!-- Output -->
  <rect x="548" y="238" width="150" height="48" rx="6" fill="#4ADE80" fill-opacity="0.12" stroke="#4ADE80" stroke-opacity="0.6" stroke-width="1.3"/>
  <text x="623" y="266" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Group Output</text>

  <!-- links -->
  <g stroke="#4ADE80" stroke-width="2.5" fill="none">
    <path d="M 202 202 Q 260 202 300 250" marker-end="url(#jge-arrow)"/>
    <path d="M 202 322 Q 260 322 300 274" marker-end="url(#jge-arrow)"/>
    <line x1="450" y1="262" x2="548" y2="262" marker-end="url(#jge-arrow)"/>
  </g>
  <text x="252" y="180" font-size="11" fill="currentColor" opacity="0.6">branch 1</text>
  <text x="252" y="356" font-size="11" fill="currentColor" opacity="0.6">branch 2</text>

  <!-- result preview -->
  <text x="400" y="360" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">result: both visible</text>
  <rect x="330" y="372" width="46" height="46" fill="#4ADE80" fill-opacity="0.20" stroke="#4ADE80" stroke-width="1.5"/>
  <rect x="400" y="380" width="38" height="38" fill="#4A9EFF" fill-opacity="0.20" stroke="#4A9EFF" stroke-width="1.5"/>

  <!-- warning -->
  <rect x="470" y="372" width="290" height="52" rx="8" fill="#E63946" fill-opacity="0.10" stroke="#E63946" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="615" y="394" text-anchor="middle" font-size="12" font-weight="700" fill="#E63946">Without Join</text>
  <text x="615" y="412" text-anchor="middle" font-size="12" fill="currentColor">only one branch reaches Output, the other is lost.</text>

  <rect x="40" y="506" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Join Geometry takes many inputs at once, so add every branch you want to keep.</text>
</svg>
