<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" color="#222" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" role="img" aria-labelledby="cps-t cps-d">
  <title id="cps-t">Composition and Camera-Angle Placement</title>
  <desc id="cps-d">A rule-of-thirds frame with the product placed on a power point, paired with a small chart of three camera heights &#8212; low angle reads as heroic and imposing, eye level as honest and neutral, and high angle as small or approachable &#8212; so camera placement is a deliberate storytelling choice, not an accident.</desc>
  <rect x="0" y="0" width="760" height="500" fill="none"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="currentColor">Composition &amp; Camera Angle</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#8a8f98">Where the product sits, and where the camera looks from, both carry meaning</text>

  <!-- LEFT: rule of thirds frame -->
  <g>
    <rect x="50" y="86" width="360" height="240" rx="4" fill="#000" opacity="0.15"/>
    <rect x="50" y="86" width="360" height="240" rx="4" fill="none" stroke="#666" stroke-width="1.5"/>
    <!-- thirds -->
    <g stroke="#8a8f98" stroke-width="1" stroke-dasharray="5 5" opacity="0.7">
      <line x1="170" y1="86" x2="170" y2="326"/>
      <line x1="290" y1="86" x2="290" y2="326"/>
      <line x1="50" y1="166" x2="410" y2="166"/>
      <line x1="50" y1="246" x2="410" y2="246"/>
    </g>
    <!-- power points -->
    <g fill="#F5C242">
      <circle cx="170" cy="166" r="4"/>
      <circle cx="290" cy="166" r="4"/>
      <circle cx="170" cy="246" r="4"/>
      <circle cx="290" cy="246" r="4"/>
    </g>
    <!-- product on a power point -->
    <ellipse cx="290" cy="262" rx="52" ry="12" fill="#000" opacity="0.3"/>
    <circle cx="290" cy="238" r="34" fill="#FF6B00" opacity="0.9"/>
    <circle cx="290" cy="238" r="18" fill="#4ADE80" opacity="0.85"/>
    <!-- negative space arrow -->
    <line x1="96" y1="150" x2="240" y2="200" stroke="#4A9EFF" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="96" y="140" font-size="11" fill="#4A9EFF">breathing room / negative space</text>
    <text x="230" y="308" font-size="11" font-weight="600" fill="#F5C242">subject on a power point</text>
    <text x="60" y="352" font-size="12" font-weight="700" fill="currentColor">Rule of thirds</text>
    <text x="60" y="372" font-size="11" fill="#8a8f98">Place the product off-center on a</text>
    <text x="60" y="388" font-size="11" fill="#8a8f98">crossing point; leave space for it to</text>
    <text x="60" y="404" font-size="11" fill="#8a8f98">&quot;face into.&quot; Dead-center reads static.</text>
  </g>

  <!-- RIGHT: camera height psychology -->
  <g>
    <text x="440" y="104" font-size="12" font-weight="700" fill="currentColor">Camera height = attitude</text>
    <!-- low -->
    <g>
      <rect x="440" y="118" width="270" height="72" rx="6" fill="#E63946" opacity="0.1"/>
      <rect x="440" y="118" width="270" height="72" rx="6" fill="none" stroke="#E63946" stroke-width="1.3"/>
      <circle cx="476" cy="154" r="14" fill="#E63946" opacity="0.85"/>
      <path d="M 500 168 L 520 150 L 504 150" fill="none" stroke="#E63946" stroke-width="1.5"/>
      <text x="532" y="146" font-size="13" font-weight="700" fill="#E63946">Low angle</text>
      <text x="532" y="164" font-size="11" fill="currentColor">Heroic, powerful, imposing.</text>
      <text x="532" y="180" font-size="11" fill="#8a8f98">Look up at premium products.</text>
    </g>
    <!-- eye -->
    <g>
      <rect x="440" y="200" width="270" height="72" rx="6" fill="#4A9EFF" opacity="0.1"/>
      <rect x="440" y="200" width="270" height="72" rx="6" fill="none" stroke="#4A9EFF" stroke-width="1.3"/>
      <circle cx="476" cy="236" r="14" fill="#4A9EFF" opacity="0.85"/>
      <line x1="500" y1="236" x2="520" y2="236" stroke="#4A9EFF" stroke-width="1.5"/>
      <text x="532" y="228" font-size="13" font-weight="700" fill="#4A9EFF">Eye level</text>
      <text x="532" y="246" font-size="11" fill="currentColor">Honest, neutral, relatable.</text>
      <text x="532" y="262" font-size="11" fill="#8a8f98">The catalog default.</text>
    </g>
    <!-- high -->
    <g>
      <rect x="440" y="282" width="270" height="72" rx="6" fill="#F5C242" opacity="0.1"/>
      <rect x="440" y="282" width="270" height="72" rx="6" fill="none" stroke="#F5C242" stroke-width="1.3"/>
      <circle cx="476" cy="318" r="14" fill="#F5C242" opacity="0.9"/>
      <path d="M 500 304 L 520 322 L 504 322" fill="none" stroke="#F5C242" stroke-width="1.5"/>
      <text x="532" y="310" font-size="13" font-weight="700" fill="#F5C242">High angle</text>
      <text x="532" y="328" font-size="11" fill="currentColor">Small, approachable, overview.</text>
      <text x="532" y="344" font-size="11" fill="#8a8f98">Flat-lays, top-down layouts.</text>
    </g>
  </g>

  <text x="50" y="440" font-size="12" fill="#8a8f98">Combine both: a product on a lower-right power point, shot from a slight low angle, feels premium and gives the eye somewhere to travel.</text>
  <text x="50" y="462" font-size="12" fill="#8a8f98">Lock composition before lighting &#8212; the camera decides which surfaces the light even needs to reach.</text>
</svg>
