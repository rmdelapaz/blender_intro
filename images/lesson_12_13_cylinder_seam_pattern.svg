<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="cy-title cy-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="cy-title">Cylinder Seam Pattern and Resulting UV Layout</title>
  <desc id="cy-desc">A two panel diagram. The left panel shows a cylinder with a single vertical seam down the back in red, plus red seams around the top and bottom cap edges. The right panel shows the resulting UV layout: a wide rectangle for the unrolled barrel and two separate circles for the top and bottom caps.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">CYLINDER SEAM PATTERN</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">One vertical seam unrolls the barrel; cap rings free the two circles</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <line x1="400" y1="138" x2="400" y2="496" stroke="#FF6B00" stroke-width="2" opacity="0.55"/>

  <text x="200" y="158" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor">Single Vertical Seam</text>
  <text x="600" y="158" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor">Rect + Circle UVs</text>

  <!-- LEFT: cylinder, cyan -->
  <g stroke="#00bcd4" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- top ellipse -->
    <ellipse cx="200" cy="208" rx="70" ry="22"/>
    <!-- sides -->
    <path d="M 130 208 L 130 392"/>
    <path d="M 270 208 L 270 392"/>
    <!-- bottom front arc -->
    <path d="M 130 392 A 70 22 0 0 0 270 392"/>
  </g>

  <!-- LEFT: seams in red -->
  <g stroke="#ff0000" stroke-width="4" fill="none" stroke-linecap="round">
    <!-- vertical back seam (centre line, dashed to read as 'back') -->
    <path d="M 200 230 L 200 414" stroke-dasharray="2 7"/>
    <!-- top cap ring -->
    <ellipse cx="200" cy="208" rx="70" ry="22" stroke="#ff0000" fill="none"/>
    <!-- bottom cap front arc -->
    <path d="M 130 392 A 70 22 0 0 0 270 392"/>
  </g>

  <!-- RIGHT: UV = rectangle barrel + two cap circles, orange -->
  <g stroke="#FF6B00" stroke-width="2.5" fill="#FF6B00" fill-opacity="0.10">
    <!-- barrel rectangle -->
    <rect x="500" y="196" width="200" height="92"/>
    <!-- top cap circle -->
    <circle cx="548" cy="372" r="44"/>
    <!-- bottom cap circle -->
    <circle cx="652" cy="372" r="44"/>
  </g>
  <g font-size="12" font-weight="600" fill="currentColor" text-anchor="middle" opacity="0.8">
    <text x="600" y="246">Barrel (unrolled)</text>
    <text x="548" y="376">Top</text>
    <text x="652" y="376">Bottom</text>
  </g>

  <!-- Footer tip -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Place the vertical seam on the back so the texture join hides where the model is least seen.
  </text>
</svg>
