<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="spi-title spi-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="spi-title">Sun light position does not change the result</title>
  <desc id="spi-desc">Three views of the same scene with the sun light placed at the left, center, and right. Because the sun's rotation is identical in all three, the rays arrive at the same angle and the object casts an identical shadow every time, proving that the sun light's position has no effect on the render.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">SUN LIGHT &#183; POSITION INDEPENDENCE</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Same rotation, identical result, regardless of where the Sun sits</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Shared arrowhead marker -->
  <defs>
    <marker id="spi-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#FF6B00"/>
    </marker>
  </defs>

  <!-- Three panels, each 220 wide, gap 30, starting x=40. Panel inner content shares geometry. -->
  <!-- Panel template per column: sun glyph at a different x, one ray at the SAME angle, same object, same shadow. -->

  <!-- Panel 1: Sun on the LEFT -->
  <g>
    <rect x="40" y="150" width="220" height="360" rx="8" fill="currentColor" opacity="0.04"/>
    <rect x="40" y="150" width="220" height="360" rx="8" fill="none" stroke="currentColor" stroke-width="1" opacity="0.2"/>
    <text x="150" y="178" font-size="14" font-weight="600" fill="currentColor" text-anchor="middle">Sun at left</text>
    <!-- Sun glyph -->
    <circle cx="78" cy="218" r="15" fill="#FF6B00"/>
    <g stroke="#FF6B00" stroke-width="3" stroke-linecap="round">
      <line x1="78" y1="190" x2="78" y2="198"/>
      <line x1="78" y1="238" x2="78" y2="246"/>
      <line x1="50" y1="218" x2="58" y2="218"/>
      <line x1="98" y1="218" x2="106" y2="218"/>
    </g>
    <!-- Ground -->
    <line x1="64" y1="470" x2="236" y2="470" stroke="currentColor" stroke-width="2" opacity="0.45"/>
    <!-- Object -->
    <rect x="135" y="430" width="36" height="40" fill="currentColor" opacity="0.2"/>
    <rect x="135" y="430" width="36" height="40" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.55"/>
    <!-- Ray at fixed angle (down-right, dx=40 dy=60) -->
    <line x1="120" y1="250" x2="150" y2="295" stroke="#FF6B00" stroke-width="2.5" opacity="0.85" marker-end="url(#spi-arrow)"/>
    <!-- Shadow: cast to the right of the object, fixed direction/length -->
    <polygon points="171,470 171,452 219,470" fill="currentColor" opacity="0.28"/>
  </g>

  <!-- Panel 2: Sun in the CENTER -->
  <g>
    <rect x="290" y="150" width="220" height="360" rx="8" fill="currentColor" opacity="0.04"/>
    <rect x="290" y="150" width="220" height="360" rx="8" fill="none" stroke="currentColor" stroke-width="1" opacity="0.2"/>
    <text x="400" y="178" font-size="14" font-weight="600" fill="currentColor" text-anchor="middle">Sun at center</text>
    <!-- Sun glyph (different x position) -->
    <circle cx="400" cy="218" r="15" fill="#FF6B00"/>
    <g stroke="#FF6B00" stroke-width="3" stroke-linecap="round">
      <line x1="400" y1="190" x2="400" y2="198"/>
      <line x1="400" y1="238" x2="400" y2="246"/>
      <line x1="372" y1="218" x2="380" y2="218"/>
      <line x1="420" y1="218" x2="428" y2="218"/>
    </g>
    <!-- Ground -->
    <line x1="314" y1="470" x2="486" y2="470" stroke="currentColor" stroke-width="2" opacity="0.45"/>
    <!-- Object (same place in panel) -->
    <rect x="385" y="430" width="36" height="40" fill="currentColor" opacity="0.2"/>
    <rect x="385" y="430" width="36" height="40" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.55"/>
    <!-- Ray at SAME fixed angle (dx=40 dy=60) -->
    <line x1="400" y1="250" x2="430" y2="295" stroke="#FF6B00" stroke-width="2.5" opacity="0.85" marker-end="url(#spi-arrow)"/>
    <!-- Shadow: IDENTICAL direction and length -->
    <polygon points="421,470 421,452 469,470" fill="currentColor" opacity="0.28"/>
  </g>

  <!-- Panel 3: Sun on the RIGHT -->
  <g>
    <rect x="540" y="150" width="220" height="360" rx="8" fill="currentColor" opacity="0.04"/>
    <rect x="540" y="150" width="220" height="360" rx="8" fill="none" stroke="currentColor" stroke-width="1" opacity="0.2"/>
    <text x="650" y="178" font-size="14" font-weight="600" fill="currentColor" text-anchor="middle">Sun at right</text>
    <!-- Sun glyph (yet another x position) -->
    <circle cx="722" cy="218" r="15" fill="#FF6B00"/>
    <g stroke="#FF6B00" stroke-width="3" stroke-linecap="round">
      <line x1="722" y1="190" x2="722" y2="198"/>
      <line x1="722" y1="238" x2="722" y2="246"/>
      <line x1="694" y1="218" x2="702" y2="218"/>
      <line x1="742" y1="218" x2="750" y2="218"/>
    </g>
    <!-- Ground -->
    <line x1="564" y1="470" x2="736" y2="470" stroke="currentColor" stroke-width="2" opacity="0.45"/>
    <!-- Object -->
    <rect x="635" y="430" width="36" height="40" fill="currentColor" opacity="0.2"/>
    <rect x="635" y="430" width="36" height="40" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.55"/>
    <!-- Ray at SAME fixed angle (dx=40 dy=60) -->
    <line x1="650" y1="250" x2="680" y2="295" stroke="#FF6B00" stroke-width="2.5" opacity="0.85" marker-end="url(#spi-arrow)"/>
    <!-- Shadow: IDENTICAL direction and length -->
    <polygon points="671,470 671,452 719,470" fill="currentColor" opacity="0.28"/>
  </g>

  <!-- Conclusion band -->
  <text x="400" y="556" font-size="16" font-weight="600" fill="currentColor" text-anchor="middle">All three rotations are equal, so all three shadows are identical</text>
  <text x="400" y="582" font-size="14" fill="currentColor" opacity="0.65" text-anchor="middle">Only the Sun's rotation matters &#183; its X / Y / Z location is ignored by the renderer</text>

  <!-- Footer tip (Variant B, left rail) at the 800x680 position -->
  <rect x="40" y="641" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Place the Sun wherever it is easy to see in the viewport, then rotate it to aim the light.
  </text>
</svg>
