<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="fc-title fc-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="fc-title">Dielectric versus conductor Fresnel curves</title>
  <desc id="fc-desc">A line graph of reflection percentage against viewing angle from zero to ninety degrees. The dielectric curve starts near four percent at a head-on view and climbs steeply to one hundred percent at grazing angles, a dramatic change. The conductor curve starts near seventy percent and rises gently to one hundred percent, a subtle change. Both curves meet at one hundred percent reflection at the ninety degree grazing angle.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Fresnel Curves: Dielectric vs Conductor</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Reflection percentage as a function of viewing angle</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Grid -->
  <!-- horizontal gridlines at 0/20/40/60/80/100% -->
  <line x1="90" y1="470" x2="760" y2="470" stroke="currentColor" stroke-width="1" opacity="0.18"/>
  <line x1="90" y1="402" x2="760" y2="402" stroke="currentColor" stroke-width="1" opacity="0.10"/>
  <line x1="90" y1="334" x2="760" y2="334" stroke="currentColor" stroke-width="1" opacity="0.10"/>
  <line x1="90" y1="266" x2="760" y2="266" stroke="currentColor" stroke-width="1" opacity="0.10"/>
  <line x1="90" y1="198" x2="760" y2="198" stroke="currentColor" stroke-width="1" opacity="0.10"/>
  <line x1="90" y1="130" x2="760" y2="130" stroke="currentColor" stroke-width="1" opacity="0.18"/>
  <!-- vertical gridlines at 0/15/30/45/60/75/90 deg -->
  <line x1="90" y1="130" x2="90" y2="470" stroke="currentColor" stroke-width="1" opacity="0.18"/>
  <line x1="201.7" y1="130" x2="201.7" y2="470" stroke="currentColor" stroke-width="1" opacity="0.08"/>
  <line x1="313.3" y1="130" x2="313.3" y2="470" stroke="currentColor" stroke-width="1" opacity="0.08"/>
  <line x1="425" y1="130" x2="425" y2="470" stroke="currentColor" stroke-width="1" opacity="0.08"/>
  <line x1="536.7" y1="130" x2="536.7" y2="470" stroke="currentColor" stroke-width="1" opacity="0.08"/>
  <line x1="648.3" y1="130" x2="648.3" y2="470" stroke="currentColor" stroke-width="1" opacity="0.08"/>
  <line x1="760" y1="130" x2="760" y2="470" stroke="currentColor" stroke-width="1" opacity="0.08"/>

  <!-- Y axis labels (%) -->
  <text x="78" y="474" font-size="12" text-anchor="end" fill="currentColor" opacity="0.6">0%</text>
  <text x="78" y="406" font-size="12" text-anchor="end" fill="currentColor" opacity="0.6">20%</text>
  <text x="78" y="338" font-size="12" text-anchor="end" fill="currentColor" opacity="0.6">40%</text>
  <text x="78" y="270" font-size="12" text-anchor="end" fill="currentColor" opacity="0.6">60%</text>
  <text x="78" y="202" font-size="12" text-anchor="end" fill="currentColor" opacity="0.6">80%</text>
  <text x="78" y="134" font-size="12" text-anchor="end" fill="currentColor" opacity="0.6">100%</text>
  <text x="34" y="304" font-size="13" font-weight="600" fill="currentColor" opacity="0.7" transform="rotate(-90 34 304)">Reflection Percentage</text>

  <!-- X axis labels (deg) -->
  <text x="90" y="490" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.6">0&#176;</text>
  <text x="201.7" y="490" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.6">15&#176;</text>
  <text x="313.3" y="490" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.6">30&#176;</text>
  <text x="425" y="490" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.6">45&#176;</text>
  <text x="536.7" y="490" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.6">60&#176;</text>
  <text x="648.3" y="490" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.6">75&#176;</text>
  <text x="760" y="490" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.6">90&#176;</text>
  <text x="425" y="510" font-size="13" font-weight="600" fill="currentColor" opacity="0.7">Viewing Angle (0&#176; perpendicular &#8594; 90&#176; grazing)</text>

  <!-- Conductor curve (metallic gold, gentle) -->
  <path d="M 90.0,232.0 L 112.3,232.0 L 134.7,232.0 L 157.0,232.0 L 179.3,232.0 L 201.7,232.0 L 224.0,232.0 L 246.3,232.0 L 268.7,232.0 L 291.0,232.0 L 313.3,232.0 L 335.7,232.0 L 358.0,232.0 L 380.3,231.9 L 402.7,231.9 L 425.0,231.8 L 447.3,231.6 L 469.7,231.3 L 492.0,230.8 L 514.3,230.0 L 536.7,228.8 L 559.0,227.1 L 581.3,224.5 L 603.7,220.9 L 626.0,215.9 L 648.3,209.2 L 670.7,200.2 L 693.0,188.4 L 715.3,173.3 L 737.7,154.0 L 760.0,130.0" fill="none" stroke="#E0A82E" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Dielectric curve (bright green, dramatic) -->
  <path d="M 90.0,456.4 L 112.3,456.4 L 134.7,456.4 L 157.0,456.4 L 179.3,456.4 L 201.7,456.4 L 224.0,456.4 L 246.3,456.4 L 268.7,456.4 L 291.0,456.4 L 313.3,456.4 L 335.7,456.4 L 358.0,456.3 L 380.3,456.2 L 402.7,456.0 L 425.0,455.7 L 447.3,455.1 L 469.7,454.1 L 492.0,452.5 L 514.3,450.0 L 536.7,446.2 L 559.0,440.6 L 581.3,432.4 L 603.7,420.9 L 626.0,405.0 L 648.3,383.4 L 670.7,354.6 L 693.0,317.0 L 715.3,268.5 L 737.7,206.9 L 760.0,130.0" fill="none" stroke="#4ADE80" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Endpoint dots -->
  <circle cx="90" cy="456.4" r="4" fill="#4ADE80"/>
  <circle cx="90" cy="232" r="4" fill="#E0A82E"/>
  <circle cx="760" cy="130" r="5" fill="#FF6B00"/>

  <!-- Convergence annotation -->
  <line x1="700" y1="150" x2="752" y2="133" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <text x="694" y="148" font-size="12" text-anchor="end" fill="currentColor" opacity="0.7">Both reach 100% at grazing</text>

  <!-- Dramatic-change annotation (dielectric) -->
  <text x="600" y="400" font-size="12.5" font-weight="600" fill="#4ADE80">Dramatic Fresnel change</text>
  <text x="600" y="418" font-size="11.5" fill="currentColor" opacity="0.6">dielectric: 4% &#8594; 100%</text>
  <!-- Subtle-change annotation (conductor) -->
  <text x="150" y="210" font-size="12.5" font-weight="600" fill="#E0A82E">Subtle Fresnel change</text>
  <text x="150" y="192" font-size="11.5" fill="currentColor" opacity="0.6">conductor: ~70% &#8594; 100%</text>

  <!-- Legend (top-left, inside plot) -->
  <rect x="104" y="252" width="244" height="58" rx="6" fill="currentColor" opacity="0.05"/>
  <line x1="120" y1="272" x2="152" y2="272" stroke="#4ADE80" stroke-width="3.5"/>
  <text x="160" y="276" font-size="12.5" fill="currentColor">Dielectrics (non-metals): glass, water</text>
  <line x1="120" y1="294" x2="152" y2="294" stroke="#E0A82E" stroke-width="3.5"/>
  <text x="160" y="298" font-size="12.5" fill="currentColor">Conductors (metals): gold, copper</text>
</svg>
