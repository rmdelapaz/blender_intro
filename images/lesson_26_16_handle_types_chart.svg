<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="ht-title ht-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="ht-title">The five Bezier handle types in Blender's Graph Editor</title>
  <desc id="ht-desc">A reference grid of six cells. Five cells each show one Blender handle type with a small F-curve through a keyframe illustrating its characteristic shape: Automatic eases smoothly, Auto Clamped eases but flattens at extremes to stop overshoot, Vector points straight at neighbours for linear segments, Aligned keeps both handles in a straight line, and Free lets each handle move independently for a sharp corner. The sixth cell explains that you set a handle type with the V key or the Handle Type menu.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">HANDLE TYPES</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Five ways a keyframe shapes its curve &#183; pick the type that matches the motion you want</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ===== Grid: 3 cols x 2 rows. Cell origins: -->
  <!-- col x: 40, 300, 560 ; cell w 220, h 230 ; row y: 138, 388 -->

  <!-- ============ CELL 1: AUTOMATIC (row1 col1) ============ -->
  <g>
    <rect x="40" y="138" width="220" height="230" rx="6" fill="currentColor" opacity="0.04"/>
    <rect x="40" y="138" width="220" height="26" rx="6" fill="#4ADE80"/>
    <rect x="40" y="151" width="220" height="13" fill="#4ADE80"/>
    <text x="150" y="156" font-size="14" font-weight="700" fill="#0f1a14" text-anchor="middle">AUTOMATIC</text>
    <!-- mini plot frame -->
    <g stroke="currentColor" stroke-width="1" opacity="0.3" stroke-linecap="round">
      <line x1="64" y1="190" x2="64" y2="330"/>
      <line x1="64" y1="330" x2="236" y2="330"/>
    </g>
    <!-- smooth eased S through centre keyframe (150,260) -->
    <path d="M 70 318 C 110 318 120 260 150 260 C 180 260 190 202 230 202"
          fill="none" stroke="#FF6B00" stroke-width="2.5" stroke-linecap="round"/>
    <!-- tangent (smooth, sloped) -->
    <line x1="124" y1="260" x2="176" y2="260" stroke="currentColor" stroke-width="1.5" opacity="0.5" stroke-linecap="round"/>
    <path d="M 150 252 L 158 260 L 150 268 L 142 260 Z" fill="#FF6B00"/>
    <text x="150" y="352" font-size="12.5" fill="currentColor" opacity="0.7" text-anchor="middle">Smooth auto&#183;ease (default)</text>
  </g>

  <!-- ============ CELL 2: AUTO CLAMPED (row1 col2) ============ -->
  <g>
    <rect x="300" y="138" width="220" height="230" rx="6" fill="currentColor" opacity="0.04"/>
    <rect x="300" y="138" width="220" height="26" rx="6" fill="#4ADE80"/>
    <rect x="300" y="151" width="220" height="13" fill="#4ADE80"/>
    <text x="410" y="156" font-size="14" font-weight="700" fill="#0f1a14" text-anchor="middle">AUTO CLAMPED</text>
    <g stroke="currentColor" stroke-width="1" opacity="0.3" stroke-linecap="round">
      <line x1="324" y1="190" x2="324" y2="330"/>
      <line x1="324" y1="330" x2="496" y2="330"/>
    </g>
    <!-- eased but flattens at the peak (no overshoot): peak keyframe (410,210) with horizontal tangent -->
    <path d="M 330 322 C 360 322 380 210 410 210 C 440 210 460 322 490 322"
          fill="none" stroke="#FF6B00" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="384" y1="210" x2="436" y2="210" stroke="currentColor" stroke-width="1.5" opacity="0.5" stroke-linecap="round"/>
    <path d="M 410 202 L 418 210 L 410 218 L 402 210 Z" fill="#FF6B00"/>
    <text x="410" y="352" font-size="12.5" fill="currentColor" opacity="0.7" text-anchor="middle">Eases, flattens &#183; no overshoot</text>
  </g>

  <!-- ============ CELL 3: VECTOR (row1 col3) ============ -->
  <g>
    <rect x="560" y="138" width="220" height="230" rx="6" fill="currentColor" opacity="0.04"/>
    <rect x="560" y="138" width="220" height="26" rx="6" fill="#4A9EFF"/>
    <rect x="560" y="151" width="220" height="13" fill="#4A9EFF"/>
    <text x="670" y="156" font-size="14" font-weight="700" fill="#0f1a14" text-anchor="middle">VECTOR</text>
    <g stroke="currentColor" stroke-width="1" opacity="0.3" stroke-linecap="round">
      <line x1="584" y1="190" x2="584" y2="330"/>
      <line x1="584" y1="330" x2="756" y2="330"/>
    </g>
    <!-- straight segments aiming at neighbours: V shape through (670,260) -->
    <path d="M 590 210 L 670 300 L 750 210"
          fill="none" stroke="#FF6B00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- tangents point straight at neighbours (along the segments) -->
    <line x1="638" y1="294" x2="702" y2="294" stroke="currentColor" stroke-width="1.5" opacity="0.5" stroke-linecap="round"/>
    <path d="M 670 292 L 678 300 L 670 308 L 662 300 Z" fill="#FF6B00"/>
    <text x="670" y="352" font-size="12.5" fill="currentColor" opacity="0.7" text-anchor="middle">Straight &#183; linear to neighbours</text>
  </g>

  <!-- ============ CELL 4: ALIGNED (row2 col1) ============ -->
  <g>
    <rect x="40" y="388" width="220" height="230" rx="6" fill="currentColor" opacity="0.04"/>
    <rect x="40" y="388" width="220" height="26" rx="6" fill="#F5C242"/>
    <rect x="40" y="401" width="220" height="13" fill="#F5C242"/>
    <text x="150" y="406" font-size="14" font-weight="700" fill="#0f1a14" text-anchor="middle">ALIGNED</text>
    <g stroke="currentColor" stroke-width="1" opacity="0.3" stroke-linecap="round">
      <line x1="64" y1="440" x2="64" y2="580"/>
      <line x1="64" y1="580" x2="236" y2="580"/>
    </g>
    <!-- both handles collinear (a straight tilted tangent), smooth pass-through (150,510) -->
    <path d="M 70 565 C 105 552 120 525 150 510 C 180 495 195 468 230 455"
          fill="none" stroke="#FF6B00" stroke-width="2.5" stroke-linecap="round"/>
    <!-- one straight tilted tangent (both arms in a line) -->
    <line x1="118" y1="532" x2="182" y2="488" stroke="currentColor" stroke-width="1.5" opacity="0.5" stroke-linecap="round"/>
    <rect x="112" y="526" width="11" height="11" fill="currentColor" opacity="0.7"/>
    <rect x="177" y="483" width="11" height="11" fill="currentColor" opacity="0.7"/>
    <path d="M 150 502 L 158 510 L 150 518 L 142 510 Z" fill="#FF6B00"/>
    <text x="150" y="602" font-size="12.5" fill="currentColor" opacity="0.7" text-anchor="middle">Both arms locked in a line</text>
  </g>

  <!-- ============ CELL 5: FREE (row2 col2) ============ -->
  <g>
    <rect x="300" y="388" width="220" height="230" rx="6" fill="currentColor" opacity="0.04"/>
    <rect x="300" y="388" width="220" height="26" rx="6" fill="#E63946"/>
    <rect x="300" y="401" width="220" height="13" fill="#E63946"/>
    <text x="410" y="406" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">FREE</text>
    <g stroke="currentColor" stroke-width="1" opacity="0.3" stroke-linecap="round">
      <line x1="324" y1="440" x2="324" y2="580"/>
      <line x1="324" y1="580" x2="496" y2="580"/>
    </g>
    <!-- broken tangent = sharp corner at keyframe (410,510): two segments meeting at a visible angle -->
    <path d="M 332 462 Q 372 486 410 510 Q 430 540 490 568"
          fill="none" stroke="#FF6B00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- two independent arms at clearly different angles (broken) -->
    <line x1="410" y1="510" x2="366" y2="496" stroke="currentColor" stroke-width="1.5" opacity="0.5" stroke-linecap="round"/>
    <line x1="410" y1="510" x2="446" y2="552" stroke="currentColor" stroke-width="1.5" opacity="0.5" stroke-linecap="round"/>
    <rect x="360" y="490" width="11" height="11" fill="currentColor" opacity="0.7"/>
    <rect x="441" y="547" width="11" height="11" fill="currentColor" opacity="0.7"/>
    <path d="M 410 502 L 418 510 L 410 518 L 402 510 Z" fill="#FF6B00"/>
    <text x="410" y="602" font-size="12.5" fill="currentColor" opacity="0.7" text-anchor="middle">Independent arms &#183; sharp corner</text>
  </g>

  <!-- ============ CELL 6: HOW TO SET (row2 col3) ============ -->
  <g>
    <rect x="560" y="388" width="220" height="230" rx="6" fill="#FF6B00" opacity="0.06"/>
    <rect x="560" y="388" width="4" height="230" fill="#FF6B00"/>
    <text x="582" y="424" font-size="15" font-weight="700" fill="#FF6B00">Setting a type</text>
    <text x="582" y="454" font-size="13" fill="currentColor">Select a keyframe, then:</text>
    <!-- V key badge -->
    <rect x="582" y="468" width="34" height="26" rx="5" fill="#FF6B00"/>
    <text x="599" y="486" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">V</text>
    <text x="626" y="486" font-size="13" fill="currentColor">opens the menu</text>
    <text x="582" y="520" font-size="13" fill="currentColor" opacity="0.75">or Key &#8250; Handle Type</text>
    <text x="582" y="556" font-size="12.5" fill="currentColor" opacity="0.7">Different keys in one curve</text>
    <text x="582" y="574" font-size="12.5" fill="currentColor" opacity="0.7">can each use a different type.</text>
  </g>

  <!-- Footer tip (800x680 variant: y=641 rail, y=663 text) -->
  <rect x="40" y="641" width="720" height="34" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Automatic and Auto Clamped cover most motion &#183; use Vector, Aligned, or Free for precise control.
  </text>
</svg>
