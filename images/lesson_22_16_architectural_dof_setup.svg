<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="ar-title ar-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="ar-title">Architectural depth of field setup</title>
  <desc id="ar-desc">Side profile diagram of a wide angle architectural camera setup for deep depth of field. A camera at left aims along an optical axis across an interior space with foreground at two units, midground at six units, and background at twelve units. An orange focal plane line sits one third into the scene at four units, and a wide cyan acceptable sharpness band spans from the near foreground to the far background so every element stays sharp. A specifications card lists 24mm focal length, f slash 11 aperture, focus one third into the scene, and maximum front to back sharpness.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Architectural DoF Setup</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Wide angle and a narrow aperture for front to back sharpness</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Optical axis -->
  <line x1="96" y1="300" x2="730" y2="300" stroke="currentColor" stroke-width="1.5" opacity="0.3" stroke-dasharray="2 6" stroke-linecap="round"/>

  <!-- DoF acceptable sharpness band (cyan), wide, spanning near to far -->
  <rect x="190" y="160" width="540" height="280" fill="#4A9EFF" opacity="0.13"/>
  <text x="460" y="430" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.6">Acceptable sharpness: near to far</text>

  <!-- Camera glyph at left -->
  <g>
    <rect x="64" y="282" width="40" height="36" rx="3" fill="currentColor" opacity="0.75"/>
    <polygon points="104,290 124,278 124,322 104,310" fill="currentColor" opacity="0.75"/>
    <text x="84" y="338" font-size="12" text-anchor="middle" fill="currentColor">Camera</text>
  </g>

  <!-- Depth markers: foreground 2u, midground 6u, background 12u (all sharp) -->
  <!-- Foreground building element x~230 -->
  <g>
    <rect x="214" y="250" width="32" height="100" fill="currentColor" opacity="0.8"/>
    <text x="230" y="368" font-size="11" text-anchor="middle" fill="currentColor">Foreground</text>
    <text x="230" y="382" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.6">2 units</text>
  </g>
  <!-- Midground x~460 -->
  <g>
    <rect x="440" y="230" width="40" height="120" fill="currentColor" opacity="0.7"/>
    <text x="460" y="368" font-size="11" text-anchor="middle" fill="currentColor">Midground</text>
    <text x="460" y="382" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.6">6 units</text>
  </g>
  <!-- Background x~660 -->
  <g>
    <rect x="640" y="210" width="48" height="140" fill="currentColor" opacity="0.6"/>
    <text x="664" y="368" font-size="11" text-anchor="middle" fill="currentColor">Background</text>
    <text x="664" y="382" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.6">12 units</text>
  </g>

  <!-- Focal plane at 1/3 into scene (4u), x~320 (orange) -->
  <line x1="320" y1="160" x2="320" y2="404" stroke="#FF6B00" stroke-width="3"/>
  <text x="320" y="152" font-size="13" font-weight="600" text-anchor="middle" fill="#FF6B00">Focus 1/3 in (4 units)</text>

  <!-- Footer tip (Variant B, left rail) -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Focusing a third of the way in spreads sharpness evenly from near to far.
  </text>

  <!-- Specs card (placed lower-left to avoid the wide band, y=446) -->
  <g>
    <rect x="40" y="446" width="232" height="46" rx="6" fill="#FF6B00" fill-opacity="0.06" stroke="#FF6B00" stroke-opacity="0.4"/>
    <text x="56" y="466" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Settings:</tspan> 24mm &#183; f / 11</text>
    <text x="56" y="484" font-size="12" fill="currentColor" opacity="0.8">Wide angle &#183; max front to back sharp</text>
  </g>
</svg>
