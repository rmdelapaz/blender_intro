<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="hsa-title hsa-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <title id="hsa-title">Anatomy of a hair strand</title>
    <desc id="hsa-desc">A single curved hair strand drawn from its root anchored on a surface, through the control segments along its length, to the tapering tip, with each part labeled and the control points marked.</desc>
    <style>
        .hsa-lbl{font:600 14px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:currentColor}
        .hsa-val{font:400 12px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:currentColor;opacity:.6}
        .hsa-surf{fill:currentColor;fill-opacity:.06;stroke:currentColor;stroke-opacity:.4;stroke-width:1.5}
        .hsa-lead{stroke:currentColor;stroke-opacity:.35;stroke-width:1;stroke-dasharray:4 4}
    </style>
    <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
    <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">HAIR STRAND ANATOMY</text>
    <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Root &#183; segments &#183; tip &#183; the parts that make up one guide hair</text>
    <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

    <!-- emitter surface -->
    <rect class="hsa-surf" x="150" y="392" width="360" height="44" rx="3"/>
    <text x="330" y="420" text-anchor="middle" class="hsa-val">Emitter surface (scalp / mesh face)</text>

    <!-- the strand: root at (250,392) curving up to tip near (430,150) -->
    <path d="M250,392 C246,320 260,268 300,236 C346,202 350,162 430,150"
          fill="none" stroke="#FF6B00" stroke-width="3.5" stroke-linecap="round"/>

    <!-- control points -->
    <circle cx="250" cy="392" r="6.5" fill="#FF6B00"/>
    <circle cx="250" cy="392" r="11" fill="none" stroke="#FF6B00" stroke-width="1.5" opacity="0.5"/>
    <circle cx="300" cy="236" r="5.5" fill="#4A9EFF"/>
    <circle cx="346" cy="200" r="5.5" fill="#4A9EFF"/>
    <circle cx="430" cy="150" r="6" fill="#4ADE80"/>

    <!-- ROOT label (kept inside left margin) -->
    <line class="hsa-lead" x1="250" y1="392" x2="190" y2="348"/>
    <text x="150" y="342" class="hsa-lbl" fill="#FF6B00">Root</text>
    <text x="150" y="360" class="hsa-val">anchored to surface; fixed in place</text>

    <!-- SEGMENTS label (pulled in to fit canvas) -->
    <line class="hsa-lead" x1="322" y1="218" x2="540" y2="262"/>
    <text x="552" y="258" class="hsa-lbl" fill="#4A9EFF">Segments</text>
    <text x="552" y="276" class="hsa-val">control points set by the</text>
    <text x="552" y="292" class="hsa-val">Segments value; more =</text>
    <text x="552" y="308" class="hsa-val">smoother bend &amp; combing</text>

    <!-- TIP label -->
    <line class="hsa-lead" x1="430" y1="150" x2="552" y2="150"/>
    <text x="564" y="146" class="hsa-lbl" fill="#4ADE80">Tip</text>
    <text x="564" y="164" class="hsa-val">free end; tapers thin,</text>
    <text x="564" y="180" class="hsa-val">catches the most light</text>

    <!-- length bracket -->
    <line x1="112" y1="392" x2="112" y2="150" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
    <line x1="107" y1="392" x2="117" y2="392" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
    <line x1="107" y1="150" x2="117" y2="150" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
    <text x="100" y="276" text-anchor="middle" class="hsa-val" transform="rotate(-90 100 276)">Hair Length</text>

    <text x="58" y="460" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> The root stays pinned while you groom; combing only moves the segments and tip.</text>
</svg>
