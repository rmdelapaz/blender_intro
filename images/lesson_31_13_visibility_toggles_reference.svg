<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="vtr-title vtr-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="vtr-title">Modifier visibility toggles</title>
  <desc id="vtr-desc">A reference card explaining the three visibility toggle icons on every modifier panel. The eye icon controls viewport display. The camera icon controls whether the modifier is included in renders. The edit-mode icon controls whether the modifier result shows while editing the mesh.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Visibility toggles</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">The three icons in every modifier header</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Three cards: x=40 / x=288 / x=536, width 224, y=150 height 320 -->

  <!-- Card 1: Eye -->
  <rect x="40" y="150" width="224" height="320" rx="8" fill="currentColor" opacity="0.05"/>
  <rect x="40" y="150" width="224" height="320" rx="8" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.2"/>
  <!-- eye glyph centered cx=152 cy=224 -->
  <g transform="translate(152,224)" fill="none" stroke="#FF6B00" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M -34 0 Q 0 -26 34 0 Q 0 26 -34 0 Z"/>
    <circle cx="0" cy="0" r="10" fill="#FF6B00" stroke="none"/>
  </g>
  <text x="152" y="296" text-anchor="middle" font-size="17" font-weight="700" fill="currentColor">Viewport</text>
  <text x="152" y="320" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.6">Eye icon</text>
  <line x1="72" y1="338" x2="232" y2="338" stroke="currentColor" stroke-width="1" opacity="0.15"/>
  <text x="152" y="366" text-anchor="middle" font-size="13" fill="currentColor">Shows or hides the</text>
  <text x="152" y="386" text-anchor="middle" font-size="13" fill="currentColor">effect in the 3D view</text>
  <text x="152" y="430" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">Off to speed up a</text>
  <text x="152" y="448" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">heavy viewport</text>

  <!-- Card 2: Camera -->
  <rect x="288" y="150" width="224" height="320" rx="8" fill="currentColor" opacity="0.05"/>
  <rect x="288" y="150" width="224" height="320" rx="8" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.2"/>
  <!-- camera glyph centered cx=400 cy=224 -->
  <g transform="translate(400,224)" fill="#FF6B00" stroke="none">
    <rect x="-32" y="-16" width="56" height="36" rx="5"/>
    <path d="M 24 -6 L 38 -14 L 38 14 L 24 6 Z"/>
    <circle cx="-4" cy="2" r="10" fill="#fff"/>
    <circle cx="-4" cy="2" r="5" fill="#FF6B00"/>
  </g>
  <text x="400" y="296" text-anchor="middle" font-size="17" font-weight="700" fill="currentColor">Render</text>
  <text x="400" y="320" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.6">Camera icon</text>
  <line x1="320" y1="338" x2="480" y2="338" stroke="currentColor" stroke-width="1" opacity="0.15"/>
  <text x="400" y="366" text-anchor="middle" font-size="13" fill="currentColor">Includes or excludes</text>
  <text x="400" y="386" text-anchor="middle" font-size="13" fill="currentColor">the modifier at render</text>
  <text x="400" y="430" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">Pair with the eye to</text>
  <text x="400" y="448" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">show only at render</text>

  <!-- Card 3: Edit Mode -->
  <rect x="536" y="150" width="224" height="320" rx="8" fill="currentColor" opacity="0.05"/>
  <rect x="536" y="150" width="224" height="320" rx="8" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.2"/>
  <!-- edit-mode glyph (square with corner verts) centered cx=648 cy=224 -->
  <g transform="translate(648,224)" stroke="#FF6B00" stroke-width="4" fill="none" stroke-linejoin="round">
    <rect x="-26" y="-26" width="52" height="52" rx="3"/>
  </g>
  <g transform="translate(648,224)" fill="#FF6B00" stroke="none">
    <circle cx="-26" cy="-26" r="6"/>
    <circle cx="26" cy="-26" r="6"/>
    <circle cx="-26" cy="26" r="6"/>
    <circle cx="26" cy="26" r="6"/>
  </g>
  <text x="648" y="296" text-anchor="middle" font-size="17" font-weight="700" fill="currentColor">Edit Mode</text>
  <text x="648" y="320" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.6">Edit-mode icon</text>
  <line x1="568" y1="338" x2="728" y2="338" stroke="currentColor" stroke-width="1" opacity="0.15"/>
  <text x="648" y="366" text-anchor="middle" font-size="13" fill="currentColor">Shows the result</text>
  <text x="648" y="386" text-anchor="middle" font-size="13" fill="currentColor">while in Edit Mode</text>
  <text x="648" y="430" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">A fourth toggle keeps</text>
  <text x="648" y="448" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">the cage on the mesh</text>

  <!-- Footer tip -->
  <rect x="40" y="506" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> A toggle reads blue when on. Disabling the viewport eye does not affect the render camera.
  </text>
</svg>
