<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="ak-title ak-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="ak-title">Auto-keyframe workflow diagram</title>
  <desc id="ak-desc">A decision flowchart for auto-keyframing. Start by transforming the object. If auto-key is off, no keyframe is created and you must press I manually. If auto-key is on, Blender checks whether the property already has keyframes. If not, you must create the first keyframe with I. If it does, a keyframe is created automatically. A warning notes that auto-key easily creates unwanted keyframes, so turn it off when not animating.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">How Auto-Keyframing Decides</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">When a transform does and does not create a keyframe</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- arrowhead marker -->
  <defs>
    <marker id="ak-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="currentColor" fill-opacity="0.4"/>
    </marker>
  </defs>

  <!-- START: Transform object (rounded rect) centered x=290 -->
  <rect x="190" y="138" width="200" height="44" rx="22" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-width="1.5"/>
  <text x="290" y="165" font-size="15" font-weight="600" fill="currentColor" text-anchor="middle">Transform object</text>

  <!-- Decision 1: Auto-Key ON? (diamond) center x=290 y=250 -->
  <polygon points="290,206 380,250 290,294 200,250" fill="#4A9EFF" fill-opacity="0.1" stroke="#4A9EFF" stroke-width="1.5"/>
  <text x="290" y="246" font-size="14" font-weight="600" fill="currentColor" text-anchor="middle">Auto-Key</text>
  <text x="290" y="264" font-size="14" font-weight="600" fill="currentColor" text-anchor="middle">on?</text>
  <line x1="290" y1="182" x2="290" y2="206" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.5" marker-end="url(#ak-arrow)"/>

  <!-- NO branch -> right -->
  <line x1="380" y1="250" x2="560" y2="250" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.5" marker-end="url(#ak-arrow)"/>
  <text x="470" y="242" font-size="12" font-weight="700" fill="#E63946" text-anchor="middle">NO</text>
  <rect x="566" y="228" width="194" height="44" rx="8" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.2" stroke-width="1"/>
  <text x="663" y="248" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">No keyframe</text>
  <text x="663" y="265" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">Press I to add one manually</text>

  <!-- YES branch -> down to Decision 2 -->
  <line x1="290" y1="294" x2="290" y2="330" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.5" marker-end="url(#ak-arrow)"/>
  <text x="306" y="316" font-size="12" font-weight="700" fill="#4ADE80">YES</text>

  <!-- Decision 2: Property already keyed? center x=290 y=374 -->
  <polygon points="290,330 390,374 290,418 190,374" fill="#4A9EFF" fill-opacity="0.1" stroke="#4A9EFF" stroke-width="1.5"/>
  <text x="290" y="370" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">Property already</text>
  <text x="290" y="388" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">keyframed?</text>

  <!-- NO branch -> right -->
  <line x1="390" y1="374" x2="560" y2="374" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.5" marker-end="url(#ak-arrow)"/>
  <text x="470" y="366" font-size="12" font-weight="700" fill="#E63946" text-anchor="middle">NO</text>
  <rect x="566" y="352" width="194" height="44" rx="8" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.2" stroke-width="1"/>
  <text x="663" y="372" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">Still no keyframe</text>
  <text x="663" y="389" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">Create the first one with I</text>

  <!-- YES branch -> down to success -->
  <line x1="290" y1="418" x2="290" y2="454" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.5" marker-end="url(#ak-arrow)"/>
  <text x="306" y="440" font-size="12" font-weight="700" fill="#4ADE80">YES</text>

  <!-- Success box -->
  <rect x="150" y="454" width="280" height="50" rx="8" fill="#4ADE80" fill-opacity="0.12" stroke="#4ADE80" stroke-width="1.5"/>
  <path d="M 168 479 l 7 7 l 12 -13" fill="none" stroke="#4ADE80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="308" y="476" font-size="14" font-weight="700" fill="currentColor" text-anchor="middle">Keyframe created automatically</text>
  <text x="308" y="494" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">No I press needed</text>

  <!-- Requirements side card -->
  <rect x="40" y="538" width="720" height="74" rx="8" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.12" stroke-width="1"/>
  <text x="58" y="562" font-size="13" font-weight="700" fill="currentColor">Auto-key fires only when all three are true:</text>
  <text x="58" y="584" font-size="13" fill="currentColor" opacity="0.75">1. Auto-key enabled (red record button)   &#183;   2. Property is already animated</text>
  <text x="58" y="602" font-size="13" fill="currentColor" opacity="0.75">3. You transform at the current frame</text>

  <!-- Footer tip (warning flavor, Variant B 680: y=641) -->
  <rect x="40" y="641" width="720" height="34" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#E63946"/>
  <text x="58" y="663" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#E63946">Watch out:</tspan> Auto-key makes it easy to record keyframes you did not mean to. Turn it off when you are done animating.
  </text>
</svg>
