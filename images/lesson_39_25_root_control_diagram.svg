<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="rcd-title rcd-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="rcd-title">Root Control Visualization</title>
  <desc id="rcd-desc">The master Root control sits at ground level beneath the character. Moving the Root translates the whole rig through world space, shown by directional arrows radiating outward from the ground widget.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">ROOT CONTROL</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Master control · world-space movement</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <text x="40" y="138" font-size="18" font-weight="600" fill="currentColor">Master control · moves everything</text>

  <!-- Character silhouette -->
  <g fill="currentColor" opacity="0.3">
    <circle cx="400" cy="210" r="26"/>
    <rect x="378" y="240" width="44" height="120" rx="14"/>
    <rect x="345" y="252" width="34" height="14" rx="7"/>
    <rect x="421" y="252" width="34" height="14" rx="7"/>
    <rect x="382" y="356" width="14" height="74" rx="7"/>
    <rect x="404" y="356" width="14" height="74" rx="7"/>
  </g>

  <!-- Ground line -->
  <line x1="180" y1="438" x2="620" y2="438" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>

  <!-- Root master widget (4-arrow + ring) -->
  <g stroke="#FF6B00" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="400" cy="438" rx="70" ry="24"/>
  </g>

  <defs>
    <marker id="rcd-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF6B00"/>
    </marker>
  </defs>
  <g stroke="#FF6B00" stroke-width="2.5" opacity="0.85" stroke-linecap="round" marker-end="url(#rcd-ah)">
    <line x1="400" y1="438" x2="300" y2="438"/>
    <line x1="400" y1="438" x2="500" y2="438"/>
    <line x1="400" y1="438" x2="400" y2="486"/>
    <line x1="400" y1="438" x2="540" y2="408"/>
    <line x1="400" y1="438" x2="260" y2="408"/>
  </g>

  <text x="400" y="510" font-size="14" font-weight="600" fill="#FF6B00" text-anchor="middle">Root · master control</text>
  <text x="640" y="234" font-size="13" fill="currentColor" opacity="0.6">Largest control</text>
  <text x="640" y="252" font-size="13" fill="currentColor" opacity="0.6">at the ground</text>
  <text x="640" y="430" font-size="13" fill="currentColor" opacity="0.6">Move it and the</text>
  <text x="640" y="448" font-size="13" fill="currentColor" opacity="0.6">whole rig follows</text>

  <!-- Footer tip Variant B -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Animate the Root to relocate or reorient the entire character in the scene without disturbing any internal pose.</text>
</svg>
