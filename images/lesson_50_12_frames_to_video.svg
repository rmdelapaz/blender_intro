<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="car12-title car12-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="car12-title">From Frames to Final Video</title>
  <desc id="car12-desc">A three-stage pipeline for turning a rendered animation into a shareable file: first render to a numbered image sequence, then load that sequence into the Video Sequence Editor, then encode it out to an MP4 video with H.264. Rendering to frames first protects against crashes and lets you re-encode without re-rendering.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">From Frames to Final Video</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Render to still frames first, then assemble and encode. Safer than rendering straight to video.</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Stage 1: image sequence -->
  <g>
    <rect x="40" y="176" width="216" height="230" rx="8" fill="currentColor" opacity="0.04"/>
    <rect x="40" y="176" width="4" height="230" fill="#4A9EFF"/>
    <text x="64" y="206" font-size="12" font-weight="700" fill="#4A9EFF">STEP 1</text>
    <text x="64" y="228" font-size="16" font-weight="600" fill="currentColor">Image sequence</text>
    <!-- stack of frames -->
    <g>
      <rect x="88" y="250" width="96" height="72" rx="4" fill="currentColor" opacity="0.10" stroke="#4A9EFF" stroke-width="1.5"/>
      <rect x="100" y="262" width="96" height="72" rx="4" fill="currentColor" opacity="0.10" stroke="#4A9EFF" stroke-width="1.5"/>
      <rect x="112" y="274" width="96" height="72" rx="4" fill="currentColor" opacity="0.14" stroke="#4A9EFF" stroke-width="2"/>
      <text x="160" y="316" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.7">0001.png</text>
    </g>
    <text x="148" y="368" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.6">One PNG per frame</text>
    <text x="148" y="388" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.6">A crash loses only one</text>
  </g>

  <!-- arrow -->
  <g stroke="#FF6B00" stroke-width="2.5" fill="#FF6B00">
    <line x1="264" y1="291" x2="296" y2="291"/>
    <polygon points="296,285 310,291 296,297"/>
  </g>

  <!-- Stage 2: VSE -->
  <g>
    <rect x="318" y="176" width="216" height="230" rx="8" fill="currentColor" opacity="0.04"/>
    <rect x="318" y="176" width="4" height="230" fill="#B47EE8"/>
    <text x="342" y="206" font-size="12" font-weight="700" fill="#B47EE8">STEP 2</text>
    <text x="342" y="228" font-size="16" font-weight="600" fill="currentColor">Sequence Editor</text>
    <!-- timeline strip -->
    <rect x="342" y="252" width="168" height="26" rx="3" fill="#B47EE8" opacity="0.25"/>
    <rect x="342" y="252" width="168" height="26" rx="3" fill="none" stroke="#B47EE8" stroke-width="1.5"/>
    <line x1="384" y1="252" x2="384" y2="278" stroke="#B47EE8" stroke-width="1" opacity="0.6"/>
    <line x1="426" y1="252" x2="426" y2="278" stroke="#B47EE8" stroke-width="1" opacity="0.6"/>
    <line x1="468" y1="252" x2="468" y2="278" stroke="#B47EE8" stroke-width="1" opacity="0.6"/>
    <!-- playhead -->
    <line x1="404" y1="246" x2="404" y2="286" stroke="#FF6B00" stroke-width="2"/>
    <polygon points="398,246 410,246 404,254" fill="#FF6B00"/>
    <text x="426" y="316" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.6">Load the sequence</text>
    <text x="426" y="336" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.6">as one movie strip</text>
    <text x="426" y="368" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.6">Trim, add audio,</text>
    <text x="426" y="388" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.6">set the frame rate</text>
  </g>

  <!-- arrow -->
  <g stroke="#FF6B00" stroke-width="2.5" fill="#FF6B00">
    <line x1="542" y1="291" x2="574" y2="291"/>
    <polygon points="574,285 588,291 574,297"/>
  </g>

  <!-- Stage 3: encode -->
  <g>
    <rect x="596" y="176" width="164" height="230" rx="8" fill="currentColor" opacity="0.04"/>
    <rect x="596" y="176" width="4" height="230" fill="#4ADE80"/>
    <text x="620" y="206" font-size="12" font-weight="700" fill="#4ADE80">STEP 3</text>
    <text x="620" y="228" font-size="16" font-weight="600" fill="currentColor">Encode</text>
    <!-- play button disc -->
    <circle cx="678" cy="296" r="34" fill="#4ADE80" opacity="0.20"/>
    <circle cx="678" cy="296" r="34" fill="none" stroke="#4ADE80" stroke-width="2"/>
    <polygon points="668,280 668,312 696,296" fill="#4ADE80"/>
    <text x="678" y="356" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.7">MP4 · H.264</text>
    <text x="678" y="388" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.6">Re-encode anytime,</text>
    <text x="678" y="404" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.6">no re-render</text>
  </g>

  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Render stills to PNG or EXR, never straight to MP4. If Blender crashes at frame 800, you keep every frame before it.</text>
</svg>
