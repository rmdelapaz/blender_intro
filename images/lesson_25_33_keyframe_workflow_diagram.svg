<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="kw-title kw-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="kw-title">Property keyframe workflow diagram</title>
  <desc id="kw-desc">A six-step vertical workflow for keyframing a property. Step one: select the object. Step two: move to the desired frame. Step three: transform the object with G, R, or S. Step four: press the I key to insert keyframes on the default channels. Step five: choose which property to keyframe. Step six: the keyframe is created, confirmed by an orange property background.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">The Keyframing Workflow</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Six steps from selecting an object to a saved keyframe</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Connector trunk down the step-number column (x=88) -->
  <line x1="88" y1="150" x2="88" y2="600" stroke="currentColor" stroke-width="1.5" opacity="0.2"/>

  <!-- Step rows: number circle at x=88, box 130..760 -->
  <!-- Step 1 -->
  <circle cx="88" cy="172" r="20" fill="#FF6B00"/>
  <text x="88" y="179" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="130" y="168" font-size="16" font-weight="600" fill="currentColor">Select the object</text>
  <text x="130" y="188" font-size="13" fill="currentColor" opacity="0.6">Only the active object can be keyframed.</text>

  <!-- Step 2 -->
  <circle cx="88" cy="246" r="20" fill="#FF6B00"/>
  <text x="88" y="253" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="130" y="242" font-size="16" font-weight="600" fill="currentColor">Move to the desired frame</text>
  <text x="130" y="262" font-size="13" fill="currentColor" opacity="0.6">Set the playhead first, then pose.</text>

  <!-- Step 3 -->
  <circle cx="88" cy="320" r="20" fill="#FF6B00"/>
  <text x="88" y="327" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="130" y="316" font-size="16" font-weight="600" fill="currentColor">Transform the object</text>
  <text x="130" y="336" font-size="13" fill="currentColor" opacity="0.6">Move, rotate, or scale with G, R, or S.</text>

  <!-- Step 4 -->
  <circle cx="88" cy="394" r="20" fill="#FF6B00"/>
  <text x="88" y="401" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="130" y="390" font-size="16" font-weight="600" fill="currentColor">Press the I key</text>
  <text x="130" y="410" font-size="13" fill="currentColor" opacity="0.6">Inserts keyframes on the default channels.</text>
  <!-- muted I key badge -->
  <rect x="700" y="372" width="44" height="44" rx="8" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-width="1.5"/>
  <text x="722" y="401" font-size="20" font-weight="700" fill="#FF6B00" text-anchor="middle">I</text>

  <!-- Step 5 -->
  <circle cx="88" cy="468" r="20" fill="#FF6B00"/>
  <text x="88" y="475" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <text x="130" y="464" font-size="16" font-weight="600" fill="currentColor">Choose the property</text>
  <text x="130" y="484" font-size="13" fill="currentColor" opacity="0.6">Location, Rotation, Scale, or LocRotScale.</text>

  <!-- Step 6 (success: green circle) -->
  <circle cx="88" cy="556" r="20" fill="#4ADE80"/>
  <path d="M 79 556 l 6 6 l 11 -12" fill="none" stroke="#0f1a14" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="130" y="546" font-size="16" font-weight="600" fill="currentColor">Keyframe created</text>
  <text x="130" y="566" font-size="13" fill="currentColor" opacity="0.6">An orange property background confirms it.</text>
  <!-- keyframe diamond marker -->
  <path d="M 722 544 L 734 556 L 722 568 L 710 556 Z" fill="#F5C242" stroke="currentColor" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Footer tip (Variant B, 680 variant: y=641) -->
  <rect x="40" y="641" width="720" height="34" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Always transform <tspan font-style="italic">before</tspan> pressing I. The keyframe records wherever the object sits at that moment.
  </text>
</svg>
