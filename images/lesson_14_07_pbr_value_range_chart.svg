<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="bc-title bc-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="bc-title">Base Color PBR value range chart</title>
  <desc id="bc-desc">A horizontal gradient bar from black to white showing acceptable base color value ranges for physically based materials. Three zones are marked: a too-dark zone below RGB 30, an ideal range covering most materials from roughly RGB 30 to 240, and a too-bright zone above 240. An RGB value scale runs beneath the bar and example materials are listed in each zone.</desc>

  <defs>
    <linearGradient id="bc-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Base Color Value Range</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Keep PBR base color out of the pure-black and pure-white extremes</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Zone band (above the gradient bar): too dark / ideal / too bright -->
  <!-- Bar spans x=60..740 (width 680). Zone splits at RGB 30 (x=60+680*30/255=140) and RGB 240 (x=60+680*240/255=700) -->
  <!-- Too dark zone -->
  <rect x="60" y="150" width="80" height="26" rx="4" fill="#E63946" fill-opacity="0.18" stroke="#E63946" stroke-opacity="0.55"/>
  <text x="100" y="167" text-anchor="middle" font-size="12" font-weight="700" fill="#E63946">TOO DARK</text>
  <!-- Ideal zone -->
  <rect x="140" y="150" width="500" height="26" rx="4" fill="#4ADE80" fill-opacity="0.18" stroke="#4ADE80" stroke-opacity="0.55"/>
  <text x="390" y="167" text-anchor="middle" font-size="12" font-weight="700" fill="#4ADE80">IDEAL RANGE &#183; MOST MATERIALS</text>
  <!-- Too bright zone -->
  <rect x="648" y="150" width="92" height="26" rx="4" fill="#E63946" fill-opacity="0.18" stroke="#E63946" stroke-opacity="0.55"/>
  <text x="694" y="167" text-anchor="middle" font-size="12" font-weight="700" fill="#E63946">TOO BRIGHT</text>

  <!-- The gradient bar -->
  <rect x="60" y="184" width="680" height="60" rx="4" fill="url(#bc-grad)" stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Zone divider ticks on the bar -->
  <line x1="140" y1="180" x2="140" y2="252" stroke="#FF6B00" stroke-width="2"/>
  <line x1="700" y1="180" x2="700" y2="252" stroke="#FF6B00" stroke-width="2"/>
  <text x="140" y="266" text-anchor="middle" font-size="11" fill="#FF6B00" font-weight="600">~30</text>
  <text x="700" y="266" text-anchor="middle" font-size="11" fill="#FF6B00" font-weight="600">~240</text>

  <!-- RGB value scale beneath the bar -->
  <g fill="currentColor" opacity="0.6" font-size="11" text-anchor="middle">
    <text x="60" y="290">0</text>
    <text x="193" y="290">50</text>
    <text x="327" y="290">100</text>
    <text x="460" y="290">150</text>
    <text x="593" y="290">200</text>
    <text x="740" y="290">255</text>
  </g>
  <text x="400" y="312" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">8-bit RGB value (sRGB)</text>

  <!-- Example materials, grouped by zone -->
  <text x="40" y="352" font-size="18" font-weight="600" fill="currentColor">Example materials by zone</text>

  <!-- Dark materials card -->
  <rect x="60" y="372" width="200" height="96" rx="6" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.15"/>
  <circle cx="84" cy="396" r="7" fill="#1a1a1a" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="102" y="400" font-size="13" font-weight="600" fill="currentColor">Dark materials</text>
  <text x="76" y="424" font-size="12" fill="currentColor" opacity="0.65">Coal, fresh asphalt</text>
  <text x="76" y="444" font-size="12" fill="currentColor" opacity="0.65">Dark rubber, charcoal</text>
  <text x="76" y="462" font-size="11" fill="#FF6B00" font-weight="600">stay above ~30</text>

  <!-- Mid materials card -->
  <rect x="300" y="372" width="200" height="96" rx="6" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.15"/>
  <circle cx="324" cy="396" r="7" fill="#9a8c78" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="342" y="400" font-size="13" font-weight="600" fill="currentColor">Most materials</text>
  <text x="316" y="424" font-size="12" fill="currentColor" opacity="0.65">Brick, leather, cloth</text>
  <text x="316" y="444" font-size="12" fill="currentColor" opacity="0.65">Concrete, wood, soil</text>
  <text x="316" y="462" font-size="11" fill="#4ADE80" font-weight="600">the safe zone</text>

  <!-- Light materials card -->
  <rect x="540" y="372" width="200" height="96" rx="6" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.15"/>
  <circle cx="564" cy="396" r="7" fill="#e8e4dc" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="582" y="400" font-size="13" font-weight="600" fill="currentColor">Light materials</text>
  <text x="556" y="424" font-size="12" fill="currentColor" opacity="0.65">Fresh snow, white paint</text>
  <text x="556" y="444" font-size="12" fill="currentColor" opacity="0.65">Light sand, paper</text>
  <text x="556" y="462" font-size="11" fill="#FF6B00" font-weight="600">stay below ~240</text>

  <!-- Footer tip (Variant B, left rail) -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Real surfaces rarely hit pure black (0) or white (255); the extremes kill lighting response and look fake.
  </text>
</svg>
