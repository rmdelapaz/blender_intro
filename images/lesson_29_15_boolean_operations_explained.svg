<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" role="img" aria-labelledby="boTitle boDesc" fill="none" style="max-width:100%;height:auto;color:currentColor">
  <title id="boTitle">Boolean operations explained</title>
  <desc id="boDesc">Three columns showing the result of Boolean Union, Difference, and Intersect on two overlapping shapes A and B.</desc>
  <style>
    .bo-a{stroke:currentColor;stroke-width:2;fill:currentColor;fill-opacity:.10}
    .bo-b{stroke:currentColor;stroke-width:2;fill:currentColor;fill-opacity:.10;stroke-dasharray:5 4}
    .bo-res{stroke:currentColor;stroke-width:2.4;fill:currentColor;fill-opacity:.28}
    .bo-ghost{stroke:currentColor;stroke-width:1;fill:none;opacity:.35;stroke-dasharray:3 3}
    .bo-op{font:700 18px system-ui,Arial,sans-serif;fill:currentColor}
    .bo-sym{font:700 15px system-ui,Arial,sans-serif;fill:currentColor;opacity:.75}
    .bo-cap{font:400 12px system-ui,Arial,sans-serif;fill:currentColor;opacity:.7}
    .bo-tag{font:700 12px system-ui,Arial,sans-serif;fill:currentColor;opacity:.85}
    .bo-div{stroke:currentColor;stroke-width:1;opacity:.2}
  </style>

  <text class="bo-op" x="440" y="34" text-anchor="middle">Boolean operations on shapes A and B</text>

  <!-- column dividers -->
  <line class="bo-div" x1="293" y1="60" x2="293" y2="430"/>
  <line class="bo-div" x1="587" y1="60" x2="587" y2="430"/>

  <!-- ===== Column 1: UNION ===== -->
  <g transform="translate(0,0)">
    <text class="bo-op" x="146" y="84" text-anchor="middle">Union</text>
    <text class="bo-sym" x="146" y="104" text-anchor="middle">A &#8746; B</text>
    <!-- inputs (small) -->
    <g transform="translate(86,124)">
      <rect class="bo-a" x="0" y="0" width="44" height="44"/>
      <rect class="bo-b" x="30" y="20" width="44" height="44"/>
      <text class="bo-tag" x="6" y="-4">A</text>
      <text class="bo-tag" x="72" y="80">B</text>
    </g>
    <!-- result: merged outline -->
    <g transform="translate(78,240)">
      <path class="bo-res" d="M0,0 H60 V40 H90 V90 H30 V50 H0 Z"/>
    </g>
    <text class="bo-cap" x="146" y="356" text-anchor="middle">Combines both into</text>
    <text class="bo-cap" x="146" y="372" text-anchor="middle">one solid volume</text>
  </g>

  <!-- ===== Column 2: DIFFERENCE ===== -->
  <g transform="translate(294,0)">
    <text class="bo-op" x="146" y="84" text-anchor="middle">Difference</text>
    <text class="bo-sym" x="146" y="104" text-anchor="middle">A &#8722; B</text>
    <g transform="translate(86,124)">
      <rect class="bo-a" x="0" y="0" width="44" height="44"/>
      <rect class="bo-b" x="30" y="20" width="44" height="44"/>
      <text class="bo-tag" x="6" y="-4">A</text>
      <text class="bo-tag" x="72" y="80">B</text>
    </g>
    <!-- result: A with B-shaped notch removed -->
    <g transform="translate(96,240)">
      <path class="bo-res" d="M0,0 H60 V20 H30 V44 H0 Z"/>
      <path class="bo-ghost" d="M30,20 H60 V64 H30 Z"/>
    </g>
    <text class="bo-cap" x="146" y="356" text-anchor="middle">Subtracts B from A,</text>
    <text class="bo-cap" x="146" y="372" text-anchor="middle">cutting a cavity</text>
  </g>

  <!-- ===== Column 3: INTERSECT ===== -->
  <g transform="translate(588,0)">
    <text class="bo-op" x="146" y="84" text-anchor="middle">Intersect</text>
    <text class="bo-sym" x="146" y="104" text-anchor="middle">A &#8745; B</text>
    <g transform="translate(86,124)">
      <rect class="bo-a" x="0" y="0" width="44" height="44"/>
      <rect class="bo-b" x="30" y="20" width="44" height="44"/>
      <text class="bo-tag" x="6" y="-4">A</text>
      <text class="bo-tag" x="72" y="80">B</text>
    </g>
    <!-- result: only the overlap -->
    <g transform="translate(120,250)">
      <path class="bo-ghost" d="M-30,-10 H30 V14 H-30 Z"/>
      <path class="bo-ghost" d="M0,10 H44 V54 H0 Z"/>
      <rect class="bo-res" x="0" y="10" width="30" height="14"/>
    </g>
    <text class="bo-cap" x="146" y="356" text-anchor="middle">Keeps only where</text>
    <text class="bo-cap" x="146" y="372" text-anchor="middle">A and B overlap</text>
  </g>
</svg>
