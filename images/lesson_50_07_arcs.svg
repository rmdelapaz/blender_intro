<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="car07-title car07-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="car07-title">Motion Travels in Arcs</title>
  <desc id="car07-desc">A comparison of a hand moving in a straight line versus along a curved arc. The straight path reads as stiff and mechanical, while the arced path reads as natural because limbs pivot around joints.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Motion Travels in Arcs</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Limbs pivot around joints, so their paths curve. Straight lines look robotic.</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <g>
    <rect x="40" y="150" width="340" height="290" rx="8" fill="currentColor" opacity="0.04"/>
    <rect x="40" y="150" width="4" height="290" fill="#E63946"/>
    <text x="64" y="182" font-size="16" font-weight="600" fill="#E63946">Straight path</text>
    <text x="64" y="204" font-size="12" fill="currentColor" opacity="0.6">Reads stiff, mechanical</text>
    <circle cx="110" cy="380" r="9" fill="#FF6B00"/>
    <text x="90" y="410" font-size="12" fill="currentColor" opacity="0.6">shoulder</text>
    <line x1="150" y1="360" x2="340" y2="250" stroke="#E63946" stroke-width="2.5" stroke-dasharray="7 6"/>
    <circle cx="150" cy="360" r="7" fill="#E63946"/>
    <circle cx="198" cy="332" r="7" fill="#E63946"/>
    <circle cx="245" cy="305" r="7" fill="#E63946"/>
    <circle cx="293" cy="277" r="7" fill="#E63946"/>
    <circle cx="340" cy="250" r="7" fill="#E63946"/>
    <line x1="110" y1="380" x2="245" y2="305" stroke="currentColor" stroke-width="3" opacity="0.35"/>
  </g>

  <g>
    <rect x="420" y="150" width="340" height="290" rx="8" fill="currentColor" opacity="0.04"/>
    <rect x="420" y="150" width="4" height="290" fill="#4ADE80"/>
    <text x="444" y="182" font-size="16" font-weight="600" fill="#4ADE80">Arced path</text>
    <text x="444" y="204" font-size="12" fill="currentColor" opacity="0.6">Reads natural, alive</text>
    <circle cx="490" cy="380" r="9" fill="#FF6B00"/>
    <text x="470" y="410" font-size="12" fill="currentColor" opacity="0.6">shoulder</text>
    <path d="M 530 360 A 130 130 0 0 1 700 300" stroke="#4ADE80" stroke-width="2.5" fill="none" stroke-dasharray="7 6"/>
    <circle cx="530" cy="360" r="7" fill="#4ADE80"/>
    <circle cx="576" cy="336" r="7" fill="#4ADE80"/>
    <circle cx="622" cy="318" r="7" fill="#4ADE80"/>
    <circle cx="664" cy="307" r="7" fill="#4ADE80"/>
    <circle cx="700" cy="300" r="7" fill="#4ADE80"/>
    <line x1="490" y1="380" x2="622" y2="318" stroke="currentColor" stroke-width="3" opacity="0.35"/>
  </g>

  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Turn on the motion path in Blender and check it curves. A zig-zag or flat line is your warning sign.</text>
</svg>
