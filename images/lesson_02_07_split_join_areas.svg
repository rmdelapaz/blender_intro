<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="sj-title sj-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="sj-title">Splitting and Joining Areas in Blender</title>
  <desc id="sj-desc">A two-row step diagram. The top row shows splitting an area into two: hover the area's corner gizmo, drag inward to pull out a new edge, and release to get two new areas side by side. The bottom row shows joining two areas back into one: right-click the shared border to open the Area Options menu, choose Join Areas, then click the area you want to keep — the other one is absorbed.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Splitting and Joining Areas</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Reshape your workspace with the corner gizmo and the border right-click menu.</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ============ SPLITTING ROW ============ -->
  <text x="40" y="134" font-size="12" font-weight="700" fill="#FF6B00" letter-spacing="2">SPLITTING</text>
  <text x="124" y="134" font-size="12" fill="currentColor" opacity="0.55">one area becomes two</text>

  <!-- =========== STAGE 1: Hover corner =========== -->
  <!-- Panel frame -->
  <rect x="40" y="158" width="210" height="100" rx="6"
        fill="currentColor" fill-opacity="0.03"
        stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Inner area (the "Blender area") -->
  <rect x="52" y="170" width="186" height="76" rx="3"
        fill="#4A9EFF" fill-opacity="0.06"
        stroke="#4A9EFF" stroke-opacity="0.45" stroke-width="1"/>

  <!-- Corner gizmo (top-right triangle, Blender-style) -->
  <polygon points="238,170 238,184 224,170" fill="#FF6B00" opacity="0.85"/>

  <!-- Cursor approaching the gizmo -->
  <g transform="translate(212 178)">
    <path d="M 0 0 L 0 14 L 10 7 Z" fill="currentColor" stroke="#fff" stroke-width="1"/>
  </g>

  <!-- Caption -->
  <text x="145" y="282" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Hover the corner gizmo</text>
  <text x="145" y="297" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">cursor turns into a crosshair</text>

  <!-- Step badge -->
  <circle cx="58" cy="176" r="11" fill="#FF6B00"/>
  <text x="58" y="180" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>

  <!-- =========== STAGE 2: Drag inward =========== -->
  <rect x="295" y="158" width="210" height="100" rx="6"
        fill="currentColor" fill-opacity="0.03"
        stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Inner area -->
  <rect x="307" y="170" width="186" height="76" rx="3"
        fill="#4A9EFF" fill-opacity="0.06"
        stroke="#4A9EFF" stroke-opacity="0.45" stroke-width="1"/>

  <!-- Faded original corner gizmo -->
  <polygon points="493,170 493,184 479,170" fill="#FF6B00" opacity="0.25"/>

  <!-- Dashed split line at cursor position -->
  <line x1="400" y1="170" x2="400" y2="246"
        stroke="#FF6B00" stroke-width="1.6" stroke-dasharray="5 4" opacity="0.9"/>

  <!-- Drag arrow showing inward motion -->
  <g fill="none" stroke="#FF6B00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <path d="M 475 210 L 412 210"/>
    <polyline points="420,205 410,210 420,215"/>
  </g>

  <!-- Cursor at split line -->
  <g transform="translate(393 204)">
    <path d="M 0 0 L 0 14 L 10 7 Z" fill="currentColor" stroke="#fff" stroke-width="1"/>
  </g>

  <text x="400" y="282" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Drag inward</text>
  <text x="400" y="297" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">a new edge follows the cursor</text>

  <circle cx="313" cy="176" r="11" fill="#FF6B00"/>
  <text x="313" y="180" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text>

  <!-- =========== STAGE 3: Two areas =========== -->
  <rect x="550" y="158" width="210" height="100" rx="6"
        fill="currentColor" fill-opacity="0.03"
        stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Left new area (blue) -->
  <rect x="562" y="170" width="89" height="76" rx="3"
        fill="#4A9EFF" fill-opacity="0.15"
        stroke="#4A9EFF" stroke-opacity="0.7" stroke-width="1"/>

  <!-- Right new area (purple) -->
  <rect x="655" y="170" width="89" height="76" rx="3"
        fill="#B47EE8" fill-opacity="0.18"
        stroke="#B47EE8" stroke-opacity="0.7" stroke-width="1"/>

  <!-- Editor-type icons in top-left of each new area -->
  <rect x="568" y="174" width="8" height="8" rx="1.5" fill="#4A9EFF" opacity="0.85"/>
  <rect x="661" y="174" width="8" height="8" rx="1.5" fill="#B47EE8" opacity="0.85"/>

  <text x="655" y="282" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Release: two new areas</text>
  <text x="655" y="297" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">each ready for any editor</text>

  <circle cx="568" cy="176" r="11" fill="#FF6B00"/>
  <text x="568" y="180" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text>

  <!-- ============ SECTION DIVIDER ============ -->
  <line x1="40" y1="316" x2="760" y2="316" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ============ JOINING ROW ============ -->
  <text x="40" y="339" font-size="12" font-weight="700" fill="#FF6B00" letter-spacing="2">JOINING</text>
  <text x="116" y="339" font-size="12" fill="currentColor" opacity="0.55">two areas become one</text>

  <!-- =========== STAGE 1: Right-click border =========== -->
  <rect x="40" y="362" width="210" height="100" rx="6"
        fill="currentColor" fill-opacity="0.03"
        stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Two areas side by side -->
  <rect x="52" y="374" width="89" height="76" rx="3"
        fill="#4A9EFF" fill-opacity="0.15"
        stroke="#4A9EFF" stroke-opacity="0.7" stroke-width="1"/>
  <rect x="145" y="374" width="89" height="76" rx="3"
        fill="#B47EE8" fill-opacity="0.18"
        stroke="#B47EE8" stroke-opacity="0.7" stroke-width="1"/>

  <!-- Shared border highlight -->
  <line x1="143" y1="374" x2="143" y2="450" stroke="#FF6B00" stroke-width="2.2" opacity="0.9"/>

  <!-- Cursor on the border with RMB badge -->
  <g transform="translate(136 408)">
    <path d="M 0 0 L 0 14 L 10 7 Z" fill="currentColor" stroke="#fff" stroke-width="1"/>
  </g>
  <!-- RMB badge -->
  <circle cx="152" cy="404" r="8" fill="#fff" stroke="#FF6B00" stroke-width="1.4"/>
  <text x="152" y="408" font-size="9" font-weight="700" fill="#FF6B00" text-anchor="middle">R</text>

  <text x="145" y="486" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Right-click the shared border</text>
  <text x="145" y="501" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">opens the Area Options menu</text>

  <circle cx="58" cy="380" r="11" fill="#FF6B00"/>
  <text x="58" y="384" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>

  <!-- =========== STAGE 2: Choose Join Areas =========== -->
  <rect x="295" y="362" width="210" height="100" rx="6"
        fill="currentColor" fill-opacity="0.03"
        stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Faded two areas -->
  <rect x="307" y="374" width="89" height="76" rx="3"
        fill="#4A9EFF" fill-opacity="0.08"
        stroke="#4A9EFF" stroke-opacity="0.35" stroke-width="1"/>
  <rect x="400" y="374" width="89" height="76" rx="3"
        fill="#B47EE8" fill-opacity="0.08"
        stroke="#B47EE8" stroke-opacity="0.35" stroke-width="1"/>

  <!-- Context menu popup -->
  <rect x="346" y="378" width="116" height="62" rx="3"
        fill="#2a2a2a"
        stroke="currentColor" stroke-opacity="0.4" stroke-width="1"/>
  <!-- Menu rows -->
  <text x="354" y="394" font-size="9.5" fill="#e8e8e8">Vertical Split</text>
  <text x="354" y="409" font-size="9.5" fill="#e8e8e8">Horizontal Split</text>
  <!-- Highlighted Join Areas row -->
  <rect x="348" y="416" width="112" height="16" rx="2" fill="#FF6B00" opacity="0.85"/>
  <text x="354" y="427" font-size="9.5" font-weight="700" fill="#fff">Join Areas</text>

  <text x="400" y="486" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Choose Join Areas</text>
  <text x="400" y="501" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">from the Area Options menu</text>

  <circle cx="313" cy="380" r="11" fill="#FF6B00"/>
  <text x="313" y="384" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text>

  <!-- =========== STAGE 3: Merged =========== -->
  <rect x="550" y="362" width="210" height="100" rx="6"
        fill="currentColor" fill-opacity="0.03"
        stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Single merged area (blue absorbs purple) -->
  <rect x="562" y="374" width="186" height="76" rx="3"
        fill="#4A9EFF" fill-opacity="0.18"
        stroke="#4A9EFF" stroke-opacity="0.75" stroke-width="1"/>

  <!-- Absorption arrow showing direction (right side eaten by left) -->
  <g fill="none" stroke="#FF6B00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M 720 412 L 600 412"/>
    <polyline points="608,407 598,412 608,417"/>
  </g>
  <text x="660" y="402" font-size="10" font-weight="700" fill="#FF6B00" text-anchor="middle">click area to keep</text>

  <!-- Editor icon top-left of merged area -->
  <rect x="568" y="378" width="8" height="8" rx="1.5" fill="#4A9EFF" opacity="0.85"/>

  <text x="655" y="486" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Click the area to keep</text>
  <text x="655" y="501" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">the other one is absorbed</text>

  <circle cx="568" cy="380" r="11" fill="#FF6B00"/>
  <text x="568" y="384" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text>

  <!-- ============ FOOTER TIP ============ -->
  <rect x="40" y="518" width="720" height="34" rx="6"
        fill="#FF6B00" fill-opacity="0.07"
        stroke="#FF6B00" stroke-opacity="0.35" stroke-width="1"/>
  <text x="56" y="540" font-size="12" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan>
    <tspan>  Splitting and joining both start at the corner gizmo or a border right-click — no menus to memorize.</tspan>
  </text>
</svg>
