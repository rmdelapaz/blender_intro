<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" role="img" aria-labelledby="bsm-title bsm-desc" color="#222">
<title id="bsm-title">Principled BSDF Parameter Map</title>
<desc id="bsm-desc">The Principled BSDF node with its main input sockets labeled down the left side, each paired with a one-line description of what it controls, from Base Color and Metallic through Roughness, IOR, Subsurface, Anisotropic, Sheen and Coat.</desc>
<style>
.lbl{fill:currentColor;font-family:'Segoe UI',Arial,sans-serif;}
.hd{font-size:26px;font-weight:700;}
.node{fill:none;stroke:#FF6B00;stroke-width:2.5;}
.nodehd{font-size:15px;font-weight:700;}
.pin{font-size:14px;font-weight:600;}
.dsc{font-size:12px;fill:currentColor;opacity:.72;}
.wire{stroke:currentColor;stroke-width:1;opacity:.55;}
</style>
<text x="400" y="40" text-anchor="middle" class="lbl hd">Principled BSDF Parameter Map</text>

<!-- node body on the right -->
<rect x="560" y="90" width="180" height="470" rx="8" class="node"/>
<rect x="560" y="90" width="180" height="34" rx="8" fill="#FF6B00" opacity=".85"/>
<text x="650" y="113" text-anchor="middle" class="lbl nodehd" fill="#fff">Principled BSDF</text>
<circle cx="740" cy="150" r="5" fill="#4ADE80"/><text x="732" y="154" text-anchor="end" class="lbl dsc">BSDF</text>

<!-- rows: label + desc left, socket on node -->
<!-- y positions -->
<g>
<!-- Base Color -->
<circle cx="560" cy="150" r="5" fill="#F5C242"/>
<text x="60" y="146" class="lbl pin" fill="#4A9EFF">Base Color</text>
<text x="60" y="164" class="lbl dsc">the surface's main albedo colour</text>
<line x1="360" y1="150" x2="560" y2="150" class="wire"/>
<!-- Metallic -->
<circle cx="560" cy="200" r="5" fill="#F5C242"/>
<text x="60" y="196" class="lbl pin" fill="#4A9EFF">Metallic</text>
<text x="60" y="214" class="lbl dsc">0 dielectric to 1 raw metal</text>
<line x1="300" y1="200" x2="560" y2="200" class="wire"/>
<!-- Roughness -->
<circle cx="560" cy="250" r="5" fill="#F5C242"/>
<text x="60" y="246" class="lbl pin" fill="#4A9EFF">Roughness</text>
<text x="60" y="264" class="lbl dsc">sharp mirror at 0, matte at 1</text>
<line x1="320" y1="250" x2="560" y2="250" class="wire"/>
<!-- IOR -->
<circle cx="560" cy="300" r="5" fill="#F5C242"/>
<text x="60" y="296" class="lbl pin" fill="#4A9EFF">IOR</text>
<text x="60" y="314" class="lbl dsc">refraction index, ~1.5 for most</text>
<line x1="250" y1="300" x2="560" y2="300" class="wire"/>
<!-- Subsurface -->
<circle cx="560" cy="350" r="5" fill="#B47EE8"/>
<text x="60" y="346" class="lbl pin" fill="#B47EE8">Subsurface</text>
<text x="60" y="364" class="lbl dsc">light scattering under the surface</text>
<line x1="330" y1="350" x2="560" y2="350" class="wire"/>
<!-- Anisotropic -->
<circle cx="560" cy="400" r="5" fill="#B47EE8"/>
<text x="60" y="396" class="lbl pin" fill="#B47EE8">Anisotropic</text>
<text x="60" y="414" class="lbl dsc">stretches highlights, brushed metal</text>
<line x1="330" y1="400" x2="560" y2="400" class="wire"/>
<!-- Sheen -->
<circle cx="560" cy="450" r="5" fill="#B47EE8"/>
<text x="60" y="446" class="lbl pin" fill="#B47EE8">Sheen</text>
<text x="60" y="464" class="lbl dsc">soft edge glow for cloth and velvet</text>
<line x1="270" y1="450" x2="560" y2="450" class="wire"/>
<!-- Coat -->
<circle cx="560" cy="500" r="5" fill="#B47EE8"/>
<text x="60" y="496" class="lbl pin" fill="#B47EE8">Coat</text>
<text x="60" y="514" class="lbl dsc">glossy clearcoat over the base layer</text>
<line x1="250" y1="500" x2="560" y2="500" class="wire"/>
<!-- Emission -->
<circle cx="560" cy="550" r="5" fill="#B47EE8"/>
<text x="60" y="546" class="lbl pin" fill="#B47EE8">Emission</text>
<text x="60" y="564" class="lbl dsc">makes the surface give off light</text>
<line x1="300" y1="550" x2="560" y2="550" class="wire"/>
</g>

<text x="400" y="610" text-anchor="middle" class="lbl dsc" style="opacity:.7">One node covers most real materials, blue = core inputs, purple = advanced effects.</text>
</svg>
