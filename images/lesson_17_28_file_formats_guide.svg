<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="ff-title ff-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="ff-title">HDRI file formats: correct versus incorrect</title>
  <desc id="ff-desc">A two-column guide. The left column lists the correct HDRI formats, Radiance HDR and OpenEXR, both 32-bit floating point with a true high dynamic range, each marked with a green check. The right column lists JPG and PNG as incorrect for lighting because they are 8-bit with a limited dynamic range, each marked with a red cross. A takeaway band advises using .hdr or .exr for realistic lighting.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">HDRI File Formats</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Use true 32-bit HDR formats for lighting &#183; avoid 8-bit images</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ============ Left column: CORRECT ============ -->
  <!-- Column header -->
  <rect x="40" y="138" width="350" height="34" rx="6" fill="#4ADE80"/>
  <text x="64" y="161" font-size="17" font-weight="700" fill="#0f1a14">&#10003;  Correct for Lighting</text>

  <!-- .HDR card -->
  <rect x="40" y="186" width="350" height="118" rx="8" fill="currentColor" fill-opacity="0.04" stroke="#4ADE80" stroke-opacity="0.5" stroke-width="1.5"/>
  <rect x="56" y="202" width="78" height="34" rx="6" fill="#4ADE80"/>
  <text x="95" y="225" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1a14">.HDR</text>
  <text x="148" y="216" font-size="15" font-weight="600" fill="currentColor">Radiance HDR</text>
  <text x="148" y="236" font-size="12.5" fill="currentColor" opacity="0.6">Most common &#183; good compression</text>
  <text x="56" y="262" font-size="13" fill="currentColor" opacity="0.85">32-bit float per channel</text>
  <text x="56" y="284" font-size="13" font-weight="700" fill="#4ADE80">Recommended for most use cases</text>

  <!-- .EXR card -->
  <rect x="40" y="316" width="350" height="118" rx="8" fill="currentColor" fill-opacity="0.04" stroke="#4ADE80" stroke-opacity="0.5" stroke-width="1.5"/>
  <rect x="56" y="332" width="78" height="34" rx="6" fill="#4ADE80"/>
  <text x="95" y="355" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1a14">.EXR</text>
  <text x="148" y="346" font-size="15" font-weight="600" fill="currentColor">OpenEXR</text>
  <text x="148" y="366" font-size="12.5" fill="currentColor" opacity="0.6">VFX standard &#183; layers and passes</text>
  <text x="56" y="392" font-size="13" fill="currentColor" opacity="0.85">16-bit or 32-bit per channel</text>
  <text x="56" y="414" font-size="13" font-weight="700" fill="#4ADE80">Use when you need extra data</text>

  <!-- ============ Right column: INCORRECT ============ -->
  <!-- Column header -->
  <rect x="410" y="138" width="350" height="34" rx="6" fill="#E63946"/>
  <text x="434" y="161" font-size="17" font-weight="700" fill="#ffffff">&#10007;  Not True HDR</text>

  <!-- .JPG card -->
  <rect x="410" y="186" width="350" height="118" rx="8" fill="currentColor" fill-opacity="0.04" stroke="#E63946" stroke-opacity="0.5" stroke-width="1.5"/>
  <rect x="426" y="202" width="78" height="34" rx="6" fill="#E63946"/>
  <text x="465" y="225" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">.JPG</text>
  <text x="518" y="216" font-size="15" font-weight="600" fill="currentColor">JPEG</text>
  <text x="518" y="236" font-size="12.5" fill="currentColor" opacity="0.6">Lossy &#183; 8-bit per channel</text>
  <text x="426" y="262" font-size="13" fill="currentColor" opacity="0.85">Limited dynamic range</text>
  <text x="426" y="284" font-size="13" font-weight="700" fill="#E63946">No realistic lighting values</text>

  <!-- .PNG card -->
  <rect x="410" y="316" width="350" height="118" rx="8" fill="currentColor" fill-opacity="0.04" stroke="#E63946" stroke-opacity="0.5" stroke-width="1.5"/>
  <rect x="426" y="332" width="78" height="34" rx="6" fill="#E63946"/>
  <text x="465" y="355" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">.PNG</text>
  <text x="518" y="346" font-size="15" font-weight="600" fill="currentColor">PNG</text>
  <text x="518" y="366" font-size="12.5" fill="currentColor" opacity="0.6">Lossless &#183; still 8-bit</text>
  <text x="426" y="392" font-size="13" fill="currentColor" opacity="0.85">Limited dynamic range</text>
  <text x="426" y="414" font-size="13" font-weight="700" fill="#E63946">Backgrounds only, not lighting</text>

  <!-- ============ Why it matters band ============ -->
  <rect x="40" y="456" width="720" height="92" rx="8" fill="currentColor" fill-opacity="0.05"/>
  <text x="60" y="484" font-size="15" font-weight="600" fill="currentColor">Why the difference matters</text>
  <text x="60" y="510" font-size="13" fill="currentColor" opacity="0.8">8-bit images clamp brightness at a value of 1.0, so a bright sky and the sun read</text>
  <text x="60" y="530" font-size="13" fill="currentColor" opacity="0.8">as the same flat white. True HDR stores values far above 1.0, preserving real light intensity.</text>

  <!-- Big takeaway -->
  <rect x="40" y="566" width="720" height="44" rx="8" fill="#FF6B00" fill-opacity="0.12" stroke="#FF6B00" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="232" y="594" font-size="16" font-weight="700" fill="currentColor">Use <tspan fill="#FF6B00">.hdr</tspan> or <tspan fill="#FF6B00">.exr</tspan> for realistic lighting</text>


  <!-- Footer tip (Variant B, dense) -->
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> A 4K .hdr is the sweet spot for most scenes &#183; sharp reflections without huge files.
  </text>
</svg>
