<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="rs-title rs-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="rs-title">Bouncing ball project reference sheet</title>
  <desc id="rs-desc">An at-a-glance spec sheet for the bouncing-ball project: a labeled side-view bounce trajectory with decaying apexes across the top, above a block of spec rows giving the frame range, key apex frames and heights, squash and stretch states, timing, and the arc rule.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">BOUNCING BALL &#183; REFERENCE SHEET</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">One frame to block the project against &#183; lock the apexes first, then refine</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ============ Trajectory panel ============ -->
  <text x="40" y="138" font-size="18" font-weight="600" fill="currentColor">Trajectory</text>

  <!-- ground line -->
  <line x1="60" y1="300" x2="760" y2="300" stroke="currentColor" stroke-width="2" opacity="0.5"/>
  <text x="60" y="318" font-size="12" fill="currentColor" opacity="0.6">ground</text>

  <!-- decaying bounce arc series (dashed currentColor) apexes 100/64/41% over 300 baseline; heights 140/90/57 -->
  <path d="M 80 300 Q 150 20 220 300 Q 280 60 340 300 Q 388 144 436 300 Q 472 222 508 300 Q 536 258 564 300"
        fill="none" stroke="currentColor" stroke-width="2.5" stroke-dasharray="6 5" opacity="0.85"/>

  <!-- apex height guides (dashed) -->
  <line x1="150" y1="160" x2="150" y2="300" stroke="currentColor" stroke-width="1" stroke-dasharray="3 4" opacity="0.3"/>
  <line x1="280" y1="180" x2="280" y2="300" stroke="currentColor" stroke-width="1" stroke-dasharray="3 4" opacity="0.3"/>
  <line x1="388" y1="222" x2="388" y2="300" stroke="currentColor" stroke-width="1" stroke-dasharray="3 4" opacity="0.3"/>

  <!-- ghost balls at apexes + contacts (brand orange) -->
  <circle cx="80" cy="300" r="9" fill="#FF6B00"/>
  <circle cx="150" cy="160" r="11" fill="#FF6B00"/>
  <circle cx="220" cy="300" r="9" fill="#FF6B00"/>
  <circle cx="280" cy="180" r="10" fill="#FF6B00"/>
  <circle cx="340" cy="300" r="9" fill="#FF6B00"/>
  <circle cx="388" cy="222" r="9" fill="#FF6B00"/>
  <circle cx="436" cy="300" r="9" fill="#FF6B00"/>
  <circle cx="508" cy="300" r="8" fill="#FF6B00"/>
  <circle cx="564" cy="300" r="8" fill="#FF6B00"/>

  <!-- apex labels: frame + height -->
  <text x="150" y="150" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor">f8 &#183; 100%</text>
  <text x="280" y="170" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor">f24 &#183; 64%</text>
  <text x="388" y="212" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor">f36 &#183; 41%</text>

  <!-- contact frame labels under ground -->
  <text x="80" y="334" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.7">f1</text>
  <text x="220" y="334" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.7">f16</text>
  <text x="340" y="334" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.7">f30</text>
  <text x="436" y="334" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.7">f42</text>
  <text x="564" y="334" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.7">f48</text>

  <!-- ============ Spec block ============ -->
  <text x="40" y="392" font-size="18" font-weight="600" fill="currentColor">Spec</text>

  <!-- row 1: frame range -->
  <rect x="40" y="406" width="150" height="26" rx="4" fill="#FF6B00" fill-opacity="0.12" stroke="#FF6B00" stroke-opacity="0.45"/>
  <text x="115" y="424" font-size="13" font-weight="700" text-anchor="middle" fill="#FF6B00">FRAME RANGE</text>
  <text x="206" y="424" font-size="14" fill="currentColor">1 to 48 (2 seconds at 24 fps), 3 bounces with decreasing height</text>

  <!-- row 2: key apexes -->
  <rect x="40" y="442" width="150" height="26" rx="4" fill="#FF6B00" fill-opacity="0.12" stroke="#FF6B00" stroke-opacity="0.45"/>
  <text x="115" y="460" font-size="13" font-weight="700" text-anchor="middle" fill="#FF6B00">KEY APEXES</text>
  <text x="206" y="460" font-size="14" fill="currentColor">f8 = 100% &#183; f24 = 64% &#183; f36 = 41% (each roughly 64% of the last)</text>

  <!-- row 3: contacts -->
  <rect x="40" y="478" width="150" height="26" rx="4" fill="#FF6B00" fill-opacity="0.12" stroke="#FF6B00" stroke-opacity="0.45"/>
  <text x="115" y="496" font-size="13" font-weight="700" text-anchor="middle" fill="#FF6B00">CONTACTS</text>
  <text x="206" y="496" font-size="14" fill="currentColor">ground hits at f1, f16, f30, f42, f48 (settle)</text>

  <!-- row 4: squash and stretch -->
  <rect x="40" y="514" width="150" height="26" rx="4" fill="#FF6B00" fill-opacity="0.12" stroke="#FF6B00" stroke-opacity="0.45"/>
  <text x="115" y="532" font-size="13" font-weight="700" text-anchor="middle" fill="#FF6B00">SQUASH / STRETCH</text>
  <text x="206" y="532" font-size="14" fill="currentColor">stretch through the fast fall and rise, squash 1 frame on each contact</text>

  <!-- row 5: timing -->
  <rect x="40" y="550" width="150" height="26" rx="4" fill="#FF6B00" fill-opacity="0.12" stroke="#FF6B00" stroke-opacity="0.45"/>
  <text x="115" y="568" font-size="13" font-weight="700" text-anchor="middle" fill="#FF6B00">TIMING</text>
  <text x="206" y="568" font-size="14" fill="currentColor">ease out leaving the apex, ease in toward it, fastest near the ground</text>

  <!-- row 6: arc rule -->
  <rect x="40" y="586" width="150" height="26" rx="4" fill="#FF6B00" fill-opacity="0.12" stroke="#FF6B00" stroke-opacity="0.45"/>
  <text x="115" y="604" font-size="13" font-weight="700" text-anchor="middle" fill="#FF6B00">ARC RULE</text>
  <text x="206" y="604" font-size="14" fill="currentColor">every bounce is a smooth parabola, never a straight up-and-down line</text>

  <!-- Footer tip (Variant B left rail) -->
  <rect x="40" y="641" width="720" height="34" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Lock the apex frames and heights first, then refine the in-betweens and curves.
  </text>
</svg>
