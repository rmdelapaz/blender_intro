<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" color="#222"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>N-gon: five or more sides in a single face</title>
  <desc>A geometric primer for the n-gon polygon type, drawn as a regular
  hexagon with six highlighted orange vertex glyphs. A small italic clarifier
  notes that any face with five or more sides counts as an n-gon. Three property
  pills below the shape list the side count, animation behavior, and subdivision
  behavior. An italic takeaway and a footer tip card warn that n-gons should be
  converted to quads or triangles before rigging or subdivision.</desc>

  <!-- Top accent rail -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Header band -->
  <text x="400" y="56" text-anchor="middle" font-size="24" font-weight="700"
        fill="currentColor">N-GON</text>
  <text x="400" y="84" text-anchor="middle" font-size="14"
        fill="currentColor" opacity="0.65">Five or more sides in a single face. Convenient to draw, risky to deform.</text>
  <line x1="120" y1="108" x2="680" y2="108"
        stroke="currentColor" stroke-width="1" opacity="0.25"/>
  <text x="400" y="138" text-anchor="middle" font-size="15" font-weight="700"
        fill="#FF6B00" letter-spacing="2">N-GON &#183; 5 OR MORE SIDES</text>

  <!-- Hero polygon: regular hexagon, pointy-left/right orientation -->
  <polygon points="540,305 470,426 330,426 260,305 330,184 470,184"
           fill="currentColor" fill-opacity="0.05"
           stroke="#FF6B00" stroke-width="4" stroke-linejoin="round"/>

  <!-- Vertex glyphs (three-circle stack per vertex) -->
  <g id="ng-vertices">
    <!-- Right -->
    <circle cx="540" cy="305" r="10" fill="#FF6B00" opacity="0.20"/>
    <circle cx="540" cy="305" r="6" fill="#FF6B00"/>
    <circle cx="540" cy="305" r="1.8" fill="#ffffff"/>
    <!-- Bottom-right -->
    <circle cx="470" cy="426" r="10" fill="#FF6B00" opacity="0.20"/>
    <circle cx="470" cy="426" r="6" fill="#FF6B00"/>
    <circle cx="470" cy="426" r="1.8" fill="#ffffff"/>
    <!-- Bottom-left -->
    <circle cx="330" cy="426" r="10" fill="#FF6B00" opacity="0.20"/>
    <circle cx="330" cy="426" r="6" fill="#FF6B00"/>
    <circle cx="330" cy="426" r="1.8" fill="#ffffff"/>
    <!-- Left -->
    <circle cx="260" cy="305" r="10" fill="#FF6B00" opacity="0.20"/>
    <circle cx="260" cy="305" r="6" fill="#FF6B00"/>
    <circle cx="260" cy="305" r="1.8" fill="#ffffff"/>
    <!-- Top-left -->
    <circle cx="330" cy="184" r="10" fill="#FF6B00" opacity="0.20"/>
    <circle cx="330" cy="184" r="6" fill="#FF6B00"/>
    <circle cx="330" cy="184" r="1.8" fill="#ffffff"/>
    <!-- Top-right -->
    <circle cx="470" cy="184" r="10" fill="#FF6B00" opacity="0.20"/>
    <circle cx="470" cy="184" r="6" fill="#FF6B00"/>
    <circle cx="470" cy="184" r="1.8" fill="#ffffff"/>
  </g>

  <!-- Clarifying line (sits in lower interior of hex on top of faint fill) -->
  <text x="400" y="395" text-anchor="middle" font-size="12" font-style="italic"
        fill="currentColor" opacity="0.6">Hexagon shown here. Any face with 5 or more sides counts as an n-gon.</text>

  <!-- Property pills row -->
  <g id="ng-pills">
    <!-- Sides -->
    <rect x="50" y="425" width="220" height="40" rx="6"
          fill="currentColor" fill-opacity="0.04"
          stroke="#FF6B00" stroke-width="1" stroke-opacity="0.5"/>
    <text x="160" y="442" text-anchor="middle" font-size="11" font-weight="700"
          fill="#FF6B00" letter-spacing="1">SIDES</text>
    <text x="160" y="459" text-anchor="middle" font-size="12"
          fill="currentColor" opacity="0.85">6 typical</text>
    <!-- Animation -->
    <rect x="290" y="425" width="220" height="40" rx="6"
          fill="currentColor" fill-opacity="0.04"
          stroke="#FF6B00" stroke-width="1" stroke-opacity="0.5"/>
    <text x="400" y="442" text-anchor="middle" font-size="11" font-weight="700"
          fill="#FF6B00" letter-spacing="1">ANIMATION</text>
    <text x="400" y="459" text-anchor="middle" font-size="12"
          fill="currentColor" opacity="0.85">Avoid when deforming</text>
    <!-- Subdivision -->
    <rect x="530" y="425" width="220" height="40" rx="6"
          fill="currentColor" fill-opacity="0.04"
          stroke="#FF6B00" stroke-width="1" stroke-opacity="0.5"/>
    <text x="640" y="442" text-anchor="middle" font-size="11" font-weight="700"
          fill="#FF6B00" letter-spacing="1">SUBDIVISION</text>
    <text x="640" y="459" text-anchor="middle" font-size="12"
          fill="currentColor" opacity="0.85">Subdivision artifacts</text>
  </g>

  <!-- Italic takeaway -->
  <text x="400" y="490" text-anchor="middle" font-size="13" font-style="italic"
        fill="currentColor" opacity="0.75">Use n-gons sparingly. Convert to quads or triangles before rigging or applying subdivision.</text>

  <!-- Footer tip card -->
  <g id="ng-tip">
    <rect x="40" y="506" width="720" height="34" rx="6"
          fill="currentColor" fill-opacity="0.04"
          stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>
    <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
    <text x="58" y="527" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Select &gt; Select All by Trait &gt; Faces by Sides lets you find every n-gon in a mesh.</text>
  </g>
</svg>
