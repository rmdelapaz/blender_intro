<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="nw-title nw-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="nw-title">Navigation Workflow: Choose Your Move</title>
  <desc id="nw-desc">A decision-tree flowchart for choosing the right Blender viewport navigation operation based on the goal. Starting from the question "what's your goal in the 3D viewport", three branches lead to the three core operations: see a different side leads to Orbit (middle-mouse-button drag), slide the view leads to Pan (Shift plus middle-mouse-button drag), and get closer or further leads to Zoom (scroll wheel or Ctrl plus middle-mouse-button drag). All three feed into the final outcome of fluid 3D navigation. A side note reminds the reader that the Home key reframes everything if they get lost.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Choose Your Navigation Move</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Three goals, three operations. Pick the one that matches what you need.</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ===================================================================== -->
  <!-- Start node (top, centered)                                             -->
  <!-- ===================================================================== -->
  <rect x="310" y="142" width="180" height="56" rx="28"
        fill="#FF6B00" fill-opacity="0.10"
        stroke="#FF6B00" stroke-width="2"/>
  <text x="400" y="167" font-size="14" font-weight="700" fill="currentColor" text-anchor="middle">What's your goal?</text>
  <text x="400" y="186" font-size="11" fill="currentColor" opacity="0.65" text-anchor="middle">in the 3D viewport</text>

  <!-- ===================================================================== -->
  <!-- Connectors from start to three operation nodes                          -->
  <!-- Targets centered at x=160, 400, 640;  top of each target box = y=300   -->
  <!-- ===================================================================== -->
  <g stroke="currentColor" stroke-width="1.6" opacity="0.35" fill="none" stroke-linecap="round">
    <!-- Left branch -->
    <path d="M 400 200 L 400 230 L 160 230 L 160 298"/>
    <!-- Center branch -->
    <path d="M 400 200 L 400 298"/>
    <!-- Right branch -->
    <path d="M 400 200 L 400 230 L 640 230 L 640 298"/>
  </g>

  <!-- Arrowheads at the top of each operation box -->
  <g fill="currentColor" opacity="0.45">
    <path d="M 160 298 L 154 290 L 166 290 Z"/>
    <path d="M 400 298 L 394 290 L 406 290 Z"/>
    <path d="M 640 298 L 634 290 L 646 290 Z"/>
  </g>

  <!-- Branch labels (the questions the branches answer) -->
  <text x="270" y="252" font-size="11" font-style="italic" fill="currentColor" opacity="0.65" text-anchor="middle">See a different side?</text>
  <text x="400" y="252" font-size="11" font-style="italic" fill="currentColor" opacity="0.65" text-anchor="middle">Slide the view?</text>
  <text x="530" y="252" font-size="11" font-style="italic" fill="currentColor" opacity="0.65" text-anchor="middle">Get closer or further?</text>

  <!-- ===================================================================== -->
  <!-- Three operation target boxes (centered x: 160, 400, 640)               -->
  <!-- ===================================================================== -->

  <!-- ORBIT -->
  <rect x="80" y="300" width="160" height="106" rx="10"
        fill="currentColor" fill-opacity="0.04"
        stroke="#FF6B00" stroke-width="2" stroke-opacity="0.75"/>
  <text x="160" y="328" font-size="15" font-weight="700" fill="#FF6B00" text-anchor="middle" letter-spacing="1.5">ORBIT</text>
  <text x="160" y="354" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">MMB + Drag</text>
  <text x="160" y="378" font-size="11" fill="currentColor" opacity="0.7" text-anchor="middle">Rotate around the scene</text>
  <text x="160" y="394" font-size="11" fill="currentColor" opacity="0.7" text-anchor="middle">to view all sides.</text>

  <!-- PAN -->
  <rect x="320" y="300" width="160" height="106" rx="10"
        fill="currentColor" fill-opacity="0.04"
        stroke="#FF6B00" stroke-width="2" stroke-opacity="0.75"/>
  <text x="400" y="328" font-size="15" font-weight="700" fill="#FF6B00" text-anchor="middle" letter-spacing="1.5">PAN</text>
  <text x="400" y="354" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Shift + MMB + Drag</text>
  <text x="400" y="378" font-size="11" fill="currentColor" opacity="0.7" text-anchor="middle">Slide the view sideways</text>
  <text x="400" y="394" font-size="11" fill="currentColor" opacity="0.7" text-anchor="middle">without rotating.</text>

  <!-- ZOOM -->
  <rect x="560" y="300" width="160" height="106" rx="10"
        fill="currentColor" fill-opacity="0.04"
        stroke="#FF6B00" stroke-width="2" stroke-opacity="0.75"/>
  <text x="640" y="328" font-size="15" font-weight="700" fill="#FF6B00" text-anchor="middle" letter-spacing="1.5">ZOOM</text>
  <text x="640" y="354" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Scroll Wheel</text>
  <text x="640" y="372" font-size="10" fill="currentColor" opacity="0.55" text-anchor="middle">or Ctrl + MMB + Drag</text>
  <text x="640" y="392" font-size="11" fill="currentColor" opacity="0.7" text-anchor="middle">Move closer or further.</text>

  <!-- ===================================================================== -->
  <!-- Convergence to final outcome (bottom)                                  -->
  <!-- All three boxes converge at y=440, then drop to outcome at y=470       -->
  <!-- ===================================================================== -->
  <g stroke="currentColor" stroke-width="1.6" opacity="0.35" fill="none" stroke-linecap="round">
    <path d="M 160 406 L 160 440 L 640 440 L 640 406"/>
    <path d="M 400 406 L 400 440"/>
    <path d="M 400 440 L 400 462"/>
  </g>

  <!-- Final outcome -->
  <rect x="276" y="462" width="248" height="40" rx="20"
        fill="#FF6B00" fill-opacity="0.18"
        stroke="#FF6B00" stroke-width="2"/>
  <text x="400" y="487" font-size="14" font-weight="700" fill="currentColor" text-anchor="middle">Fluid 3D Navigation</text>

  <!-- Side note: stuck/lost case -->
  <g>
    <rect x="40" y="468" width="170" height="34" rx="6"
          fill="currentColor" fill-opacity="0.04"
          stroke="currentColor" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="3 2"/>
    <text x="125" y="482" font-size="10" font-weight="700" fill="currentColor" opacity="0.7" text-anchor="middle" letter-spacing="0.8">LOST OR DISORIENTED?</text>
    <text x="125" y="496" font-size="11" fill="currentColor" opacity="0.7" text-anchor="middle">Press Home to frame all.</text>
  </g>

  <g>
    <rect x="590" y="468" width="170" height="34" rx="6"
          fill="currentColor" fill-opacity="0.04"
          stroke="currentColor" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="3 2"/>
    <text x="675" y="482" font-size="10" font-weight="700" fill="currentColor" opacity="0.7" text-anchor="middle" letter-spacing="0.8">FOCUS ON ONE OBJECT?</text>
    <text x="675" y="496" font-size="11" fill="currentColor" opacity="0.7" text-anchor="middle">Select it, press Numpad .</text>
  </g>

  <!-- Footer tip callout -->
  <rect x="40" y="520" width="720" height="34" rx="6"
        fill="#FF6B00" fill-opacity="0.10"
        stroke="#FF6B00" stroke-opacity="0.4"/>
  <text x="54" y="542" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Real fluency means switching operations mid-motion. Orbit, pan, zoom, orbit, all in two seconds.
  </text>
</svg>
