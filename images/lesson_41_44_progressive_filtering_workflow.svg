<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" color="#222" role="img" aria-labelledby="pfw-title pfw-desc" font-family="'Segoe UI',system-ui,sans-serif">
<title id="pfw-title">Progressive filtering workflow</title>
<desc id="pfw-desc">A funnel workflow where a broad cheap filter runs first and a narrow expensive filter runs last, with element counts dropping at each stage.</desc>
<rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
<text x="400" y="56" text-anchor="middle" font-size="26" font-weight="700" fill="currentColor">Progressive Filtering Workflow</text>
<text x="400" y="84" text-anchor="middle" font-size="15" fill="currentColor" opacity="0.75">Cheap filters first &#183; expensive filters last, on fewer elements</text>
<line x1="60" y1="108" x2="740" y2="108" stroke="currentColor" stroke-width="1" opacity="0.3"/>

<!-- Stage 1: broad -->
<text x="150" y="150" text-anchor="middle" font-size="16" font-weight="600" fill="currentColor">Broad filter</text>
<text x="150" y="170" text-anchor="middle" font-size="12.5" fill="#4ADE80" font-weight="600">cheap &#183; runs on all</text>
<polygon points="70,190 230,190 190,250 110,250" fill="#4ADE80" fill-opacity="0.18" stroke="#4ADE80" stroke-width="2"/>
<text x="150" y="226" text-anchor="middle" font-size="13" fill="currentColor">e.g. height &gt; 0</text>
<text x="150" y="278" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor">100000 pts</text>

<!-- arrow -->
<line x1="240" y1="220" x2="290" y2="220" stroke="currentColor" stroke-width="2" marker-end="url(#pfw-arw)"/>
<text x="265" y="208" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.6">drop</text>

<!-- Stage 2: mid -->
<text x="400" y="150" text-anchor="middle" font-size="16" font-weight="600" fill="currentColor">Mid filter</text>
<text x="400" y="170" text-anchor="middle" font-size="12.5" fill="#F5C242" font-weight="600">moderate cost</text>
<polygon points="335,190 465,190 435,250 365,250" fill="#F5C242" fill-opacity="0.18" stroke="#F5C242" stroke-width="2"/>
<text x="400" y="226" text-anchor="middle" font-size="13" fill="currentColor">slope mask</text>
<text x="400" y="278" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor">12000 pts</text>

<!-- arrow -->
<line x1="480" y1="220" x2="530" y2="220" stroke="currentColor" stroke-width="2" marker-end="url(#pfw-arw)"/>
<text x="505" y="208" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.6">drop</text>

<!-- Stage 3: narrow -->
<text x="640" y="150" text-anchor="middle" font-size="16" font-weight="600" fill="currentColor">Narrow filter</text>
<text x="640" y="170" text-anchor="middle" font-size="12.5" fill="#E63946" font-weight="600">expensive &#183; runs on few</text>
<polygon points="590,190 690,190 665,250 615,250" fill="#E63946" fill-opacity="0.18" stroke="#E63946" stroke-width="2"/>
<text x="640" y="226" text-anchor="middle" font-size="13" fill="currentColor">raycast</text>
<text x="640" y="278" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor">800 pts</text>

<!-- result -->
<rect x="270" y="330" width="260" height="54" rx="8" fill="#FF6B00" fill-opacity="0.1" stroke="#FF6B00" stroke-width="1.5"/>
<text x="400" y="354" text-anchor="middle" font-size="14" font-weight="700" fill="#FF6B00">Result: 800 final instances</text>
<text x="400" y="374" text-anchor="middle" font-size="12.5" fill="currentColor">expensive node touched 800 elements, not 100000</text>

<!-- count ladder note -->
<text x="400" y="424" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.75">100000 &#8594; 12000 &#8594; 800 : each stage shrinks the set the next node must process</text>

<!-- footer tip Variant B -->
<rect x="60" y="506" width="4" height="34" rx="2" fill="#FF6B00"/>
<text x="76" y="519" font-size="12.5" font-weight="600" fill="currentColor">Tip</text>
<text x="76" y="537" font-size="12.5" fill="currentColor" opacity="0.8">Order matters: put the cheapest, most-selective filter first so costly nodes see the smallest possible set.</text>

<defs>
<marker id="pfw-arw" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="currentColor" stroke-width="2"/></marker>
</defs>
</svg>
