<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="vnw-title vnw-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="vnw-title">Viewer node workflow</title>
  <desc id="vnw-desc">The Viewer node debugging workflow: attach the yellow Viewer link to successive points in the node chain to inspect the geometry at each stage, from points, to instances, to the realized mesh.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">VIEWER NODE WORKFLOW</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Move the Viewer along the chain to see what each stage outputs</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Node chain across the top -->
  <!-- Stage A: Distribute Points -->
  <rect x="48" y="150" width="150" height="56" rx="8" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.5"/>
  <rect x="48" y="150" width="150" height="22" rx="8" fill="#4ADE80" fill-opacity="0.85"/>
  <text x="123" y="166" text-anchor="middle" font-size="12" font-weight="600" fill="#0f1a14">Distribute Points</text>
  <text x="123" y="192" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.7">stage 1</text>
  <circle cx="198" cy="184" r="5" fill="#FFC107"/>

  <!-- Stage B: Instance on Points -->
  <rect x="325" y="150" width="150" height="56" rx="8" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.5"/>
  <rect x="325" y="150" width="150" height="22" rx="8" fill="#4ADE80" fill-opacity="0.85"/>
  <text x="400" y="166" text-anchor="middle" font-size="12" font-weight="600" fill="#0f1a14">Instance on Points</text>
  <text x="400" y="192" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.7">stage 2</text>
  <circle cx="325" cy="184" r="5" fill="#FFC107"/>
  <circle cx="475" cy="184" r="5" fill="#FFC107"/>

  <!-- Stage C: Realize Instances -->
  <rect x="602" y="150" width="150" height="56" rx="8" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.5"/>
  <rect x="602" y="150" width="150" height="22" rx="8" fill="#4ADE80" fill-opacity="0.85"/>
  <text x="677" y="166" text-anchor="middle" font-size="12" font-weight="600" fill="#0f1a14">Realize Instances</text>
  <text x="677" y="192" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.7">stage 3</text>
  <circle cx="602" cy="184" r="5" fill="#FFC107"/>

  <!-- Main chain connectors -->
  <g stroke-linecap="round" fill="none">
    <path d="M 203 184 L 320 184" stroke="currentColor" stroke-opacity="0.4" stroke-width="2.5"/>
    <path d="M 480 184 L 597 184" stroke="currentColor" stroke-opacity="0.4" stroke-width="2.5"/>
  </g>

  <!-- Viewer node + yellow debug link (attached to stage 2 here) -->
  <rect x="325" y="270" width="150" height="50" rx="8" fill="#FFC107" fill-opacity="0.14" stroke="#FFC107" stroke-width="2"/>
  <text x="400" y="292" text-anchor="middle" font-size="13" font-weight="700" fill="#FFC107">Viewer</text>
  <text x="400" y="310" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.7">Ctrl + Shift + click</text>
  <circle cx="400" cy="270" r="5" fill="#FFC107"/>
  <path d="M 450 206 C 450 240, 400 240, 400 265" fill="none" stroke="#FFC107" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 6"/>

  <!-- Three stage preview boxes -->
  <text x="40" y="366" font-size="18" font-weight="600" fill="currentColor">What the Viewer shows at each stage</text>

  <!-- Preview 1: points -->
  <rect x="48" y="384" width="220" height="96" rx="8" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.2" stroke-width="1.5"/>
  <g fill="#FFC107">
    <circle cx="90" cy="410" r="3"/><circle cx="130" cy="428" r="3"/><circle cx="170" cy="408" r="3"/>
    <circle cx="210" cy="434" r="3"/><circle cx="108" cy="444" r="3"/><circle cx="190" cy="422" r="3"/>
    <circle cx="238" cy="416" r="3"/><circle cx="150" cy="440" r="3"/>
  </g>
  <text x="158" y="470" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.65">stage 1 · just points</text>

  <!-- Preview 2: instances -->
  <rect x="290" y="384" width="220" height="96" rx="8" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.2" stroke-width="1.5"/>
  <g fill="#4ADE80" fill-opacity="0.6">
    <rect x="330" y="410" width="12" height="12" rx="2"/><rect x="372" y="432" width="12" height="12" rx="2"/>
    <rect x="412" y="408" width="12" height="12" rx="2"/><rect x="452" y="438" width="12" height="12" rx="2"/>
    <rect x="352" y="452" width="12" height="12" rx="2"/><rect x="432" y="424" width="12" height="12" rx="2"/>
  </g>
  <text x="400" y="472" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.65">stage 2 · instances placed</text>

  <!-- Preview 3: realized -->
  <rect x="532" y="384" width="220" height="96" rx="8" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.2" stroke-width="1.5"/>
  <path d="M 560 460 L 600 405 L 640 460 Z" fill="#4ADE80" fill-opacity="0.5" stroke="#4ADE80" stroke-width="1.5"/>
  <path d="M 640 460 L 685 415 L 725 460 Z" fill="#4ADE80" fill-opacity="0.5" stroke="#4ADE80" stroke-width="1.5"/>
  <text x="642" y="472" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.65">stage 3 · one merged mesh</text>

  <!-- Footer tip Variant B -->
  <rect x="40" y="506" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> The yellow link marks the active Viewer · Ctrl+Shift+click any node to jump the Viewer there and inspect its output.</text>
</svg>
