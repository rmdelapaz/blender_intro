<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="pfs-title pfs-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="pfs-title">Numbered portfolio project folder structure</title>
  <desc id="pfs-desc">Five top-level project folders numbered 01 through 05: Planning, Assets, Scenes, Renders, and PostProcessing, each with its key sub-folders and the reason the number-prefix ordering keeps the pipeline in sequence.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Numbered Project Folders</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Number prefixes force the pipeline order &#183; Portfolio_Project/</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Folder rows -->
  <!-- 01 Planning -->
  <g>
    <rect x="40" y="132" width="720" height="88" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.15"/>
    <rect x="40" y="132" width="6" height="88" rx="0" fill="#FF6B00"/>
    <text x="66" y="163" font-size="16" font-weight="700" fill="#FF6B00">01</text>
    <path transform="translate(96,142)" d="M 4 7 Q 4 5 6 5 L 11 5 L 14 8 L 26 8 Q 28 8 28 10 L 28 22 Q 28 24 26 24 L 6 24 Q 4 24 4 22 Z" fill="#FF6B00"/>
    <text x="134" y="161" font-size="15" font-weight="600" fill="currentColor">Planning</text>
    <text x="134" y="184" font-size="13" fill="currentColor" opacity="0.6">references &#183; concepts &#183; project_plan.txt</text>
    <text x="134" y="205" font-size="13" fill="currentColor" opacity="0.45">Decisions and gathered material, before any build</text>
  </g>
  <!-- 02 Assets -->
  <g>
    <rect x="40" y="232" width="720" height="88" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.15"/>
    <rect x="40" y="232" width="6" height="88" rx="0" fill="#4A9EFF"/>
    <text x="66" y="263" font-size="16" font-weight="700" fill="#4A9EFF">02</text>
    <path transform="translate(96,242)" d="M 4 7 Q 4 5 6 5 L 11 5 L 14 8 L 26 8 Q 28 8 28 10 L 28 22 Q 28 24 26 24 L 6 24 Q 4 24 4 22 Z" fill="#4A9EFF"/>
    <text x="134" y="261" font-size="15" font-weight="600" fill="currentColor">Assets</text>
    <text x="134" y="284" font-size="13" fill="currentColor" opacity="0.6">models &#183; textures &#183; hdris &#183; reference_assets</text>
    <text x="134" y="305" font-size="13" fill="currentColor" opacity="0.45">Reusable inputs pulled into your scenes</text>
  </g>
  <!-- 03 Scenes -->
  <g>
    <rect x="40" y="332" width="720" height="88" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.15"/>
    <rect x="40" y="332" width="6" height="88" rx="0" fill="#B47EE8"/>
    <text x="66" y="363" font-size="16" font-weight="700" fill="#B47EE8">03</text>
    <path transform="translate(96,342)" d="M 4 7 Q 4 5 6 5 L 11 5 L 14 8 L 26 8 Q 28 8 28 10 L 28 22 Q 28 24 26 24 L 6 24 Q 4 24 4 22 Z" fill="#B47EE8"/>
    <text x="134" y="361" font-size="15" font-weight="600" fill="currentColor">Scenes</text>
    <text x="134" y="384" font-size="13" fill="currentColor" opacity="0.6">blockout &#183; modeling_v01 &#183; modeling_v02 &#183; final_scene</text>
    <text x="134" y="405" font-size="13" fill="currentColor" opacity="0.45">Versioned .blend files, never overwrite the working one</text>
  </g>
  <!-- 04 Renders -->
  <g>
    <rect x="40" y="432" width="720" height="88" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.15"/>
    <rect x="40" y="432" width="6" height="88" rx="0" fill="#F5C242"/>
    <text x="66" y="463" font-size="16" font-weight="700" fill="#F5C242">04</text>
    <path transform="translate(96,442)" d="M 4 7 Q 4 5 6 5 L 11 5 L 14 8 L 26 8 Q 28 8 28 10 L 28 22 Q 28 24 26 24 L 6 24 Q 4 24 4 22 Z" fill="#F5C242"/>
    <text x="134" y="461" font-size="15" font-weight="600" fill="currentColor">Renders</text>
    <text x="134" y="484" font-size="13" fill="currentColor" opacity="0.6">tests &#183; progress &#183; finals</text>
    <text x="134" y="505" font-size="13" fill="currentColor" opacity="0.45">Output frames, kept apart from working files</text>
  </g>
  <!-- 05 PostProcessing -->
  <g>
    <rect x="40" y="532" width="720" height="80" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.15"/>
    <rect x="40" y="532" width="6" height="80" rx="0" fill="#4ADE80"/>
    <text x="66" y="563" font-size="16" font-weight="700" fill="#4ADE80">05</text>
    <path transform="translate(96,542)" d="M 4 7 Q 4 5 6 5 L 11 5 L 14 8 L 26 8 Q 28 8 28 10 L 28 22 Q 28 24 26 24 L 6 24 Q 4 24 4 22 Z" fill="#4ADE80"/>
    <text x="134" y="561" font-size="15" font-weight="600" fill="currentColor">PostProcessing</text>
    <text x="134" y="584" font-size="13" fill="currentColor" opacity="0.6">finals</text>
    <text x="134" y="605" font-size="13" fill="currentColor" opacity="0.45">Composited and graded deliverables</text>
  </g>

  <!-- Footer tip (dense variant) -->
  <rect x="40" y="641" width="720" height="34" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> The 01&#8211;05 prefixes sort the folders into pipeline order automatically, so the structure reads the same on every machine.</text>
</svg>
