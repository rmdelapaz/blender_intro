<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" color="#222" role="img" aria-labelledby="sti-title sti-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <title id="sti-title">The four stiffness forces acting on cloth</title>
    <desc id="sti-desc">A four-panel diagram. Tension shows a fabric patch pulled outward by opposing arrows and stretching. Compression shows the patch pushed inward by converging arrows and buckling. Shear shows the patch skewed sideways by offset arrows into a parallelogram. Bending shows the patch folding over a crease with curved arrows. Each panel names the force and the stiffness setting that resists it.</desc>
    <style>
        .sti-h{font:700 24px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:currentColor}
        .sti-sub{font:400 14px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:currentColor;opacity:.65}
        .sti-pt{font:700 16px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:currentColor}
        .sti-pd{font:400 12px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:currentColor;opacity:.62}
        .sti-ghost{fill:currentColor;fill-opacity:.06;stroke:currentColor;stroke-opacity:.3;stroke-width:1.4;stroke-dasharray:5 4}
        .sti-cloth{fill:#4A9EFF;fill-opacity:.14;stroke:#4A9EFF;stroke-width:2}
        .sti-panel{fill:currentColor;fill-opacity:.03;stroke:currentColor;stroke-opacity:.22;stroke-width:1.5}
    </style>
    <defs>
        <marker id="sti-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f44336"/></marker>
        <marker id="sti-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A9EFF"/></marker>
        <marker id="sti-org" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF8C00"/></marker>
        <marker id="sti-grn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4CAF50"/></marker>
    </defs>
    <rect x="0" y="0" width="800" height="3" fill="#FF8C00"/>
    <text x="40" y="50" class="sti-h">FOUR FORCES, FOUR STIFFNESS SETTINGS</text>
    <text x="40" y="76" class="sti-sub">Each cloth stiffness value resists one way the fabric can deform</text>
    <line x1="40" y1="96" x2="760" y2="96" stroke="currentColor" stroke-width="1" opacity="0.15"/>

    <!-- Panel 1: TENSION  (top-left) box 40,120 360x215 -->
    <g transform="translate(40,120)">
        <rect class="sti-panel" width="360" height="215" rx="10"/>
        <text x="20" y="34" class="sti-pt" fill="#f44336">TENSION</text>
        <text x="20" y="54" class="sti-pd">Pulling apart &#183; resisted by Tension stiffness</text>
        <!-- ghost original -->
        <rect class="sti-ghost" x="140" y="90" width="80" height="80" rx="3"/>
        <!-- stretched cloth (wider) -->
        <rect class="sti-cloth" x="110" y="98" width="140" height="64" rx="3"/>
        <!-- arrows pulling out -->
        <line x1="100" y1="130" x2="55" y2="130" stroke="#f44336" stroke-width="2.5" marker-end="url(#sti-red)"/>
        <line x1="260" y1="130" x2="305" y2="130" stroke="#f44336" stroke-width="2.5" marker-end="url(#sti-red)"/>
        <text x="180" y="196" class="sti-pd" text-anchor="middle">Fabric stretches longer along the pull</text>
    </g>

    <!-- Panel 2: COMPRESSION (top-right) box 400,120 -->
    <g transform="translate(400,120)">
        <rect class="sti-panel" width="360" height="215" rx="10"/>
        <text x="20" y="34" class="sti-pt" fill="#4A9EFF">COMPRESSION</text>
        <text x="20" y="54" class="sti-pd">Pushing together &#183; resisted by Compression stiffness</text>
        <!-- ghost original -->
        <rect class="sti-ghost" x="140" y="90" width="80" height="80" rx="3"/>
        <!-- buckled cloth: wavy narrower patch -->
        <path class="sti-cloth" d="M152,96 q14,18 0,36 q-14,18 0,36 l56,0 q14,-18 0,-36 q-14,-18 0,-36 z"/>
        <!-- arrows pushing in -->
        <line x1="55" y1="130" x2="100" y2="130" stroke="#4A9EFF" stroke-width="2.5" marker-end="url(#sti-blue)"/>
        <line x1="305" y1="130" x2="260" y2="130" stroke="#4A9EFF" stroke-width="2.5" marker-end="url(#sti-blue)"/>
        <text x="180" y="196" class="sti-pd" text-anchor="middle">Fabric buckles &amp; wrinkles inward</text>
    </g>

    <!-- Panel 3: SHEAR (bottom-left) box 40,355 -->
    <g transform="translate(40,355)">
        <rect class="sti-panel" width="360" height="215" rx="10"/>
        <text x="20" y="34" class="sti-pt" fill="#FF8C00">SHEAR</text>
        <text x="20" y="54" class="sti-pd">Skewing sideways &#183; resisted by Shear stiffness</text>
        <!-- ghost original square -->
        <rect class="sti-ghost" x="140" y="90" width="80" height="80" rx="3"/>
        <!-- skewed parallelogram -->
        <polygon class="sti-cloth" points="150,170 190,90 270,90 230,170"/>
        <!-- offset arrows: top to right, bottom to left -->
        <line x1="195" y1="78" x2="265" y2="78" stroke="#FF8C00" stroke-width="2.5" marker-end="url(#sti-org)"/>
        <line x1="215" y1="182" x2="145" y2="182" stroke="#FF8C00" stroke-width="2.5" marker-end="url(#sti-org)"/>
        <text x="180" y="200" class="sti-pd" text-anchor="middle">Square skews into a parallelogram</text>
    </g>

    <!-- Panel 4: BENDING (bottom-right) box 400,355 -->
    <g transform="translate(400,355)">
        <rect class="sti-panel" width="360" height="215" rx="10"/>
        <text x="20" y="34" class="sti-pt" fill="#4CAF50">BENDING</text>
        <text x="20" y="54" class="sti-pd">Folding over a crease &#183; resisted by Bending stiffness</text>
        <!-- folded cloth: two facets meeting at a crease -->
        <polygon class="sti-cloth" points="120,160 170,96 210,108 170,168"/>
        <polygon class="sti-cloth" points="170,96 250,82 268,140 210,108"/>
        <!-- crease line -->
        <line x1="170" y1="96" x2="210" y2="108" stroke="#4CAF50" stroke-width="2.5"/>
        <!-- curved fold arrow -->
        <path d="M250,70 q40,30 22,78" fill="none" stroke="#4CAF50" stroke-width="2.5" marker-end="url(#sti-grn)"/>
        <text x="180" y="196" class="sti-pd" text-anchor="middle">Fabric hinges along a fold line</text>
    </g>
</svg>
