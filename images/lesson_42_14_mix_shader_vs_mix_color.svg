<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" role="img" aria-labelledby="msc-title msc-desc" color="#222" font-family="'Segoe UI',system-ui,sans-serif">
<title id="msc-title">Mix Shader versus Mix Color decision tree</title>
<desc id="msc-desc">A decision tree: if you are blending complete materials with different surface properties use Mix Shader, but if you are blending only colors or values within one material use Mix Color.</desc>
<defs>
<marker id="msc-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#FF6B00"/>
</marker>
</defs>

<text x="400" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="currentColor">Mix Shader vs Mix Color</text>
<text x="400" y="56" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.75">Pick the right node by asking what you are actually blending</text>

<!-- root question -->
<g transform="translate(250,84)">
<rect x="0" y="0" width="300" height="64" rx="10" fill="#4A9EFF" fill-opacity="0.12" stroke="#4A9EFF" stroke-width="2"/>
<text x="150" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#4A9EFF">What are you mixing?</text>
<text x="150" y="48" text-anchor="middle" font-size="11.5" fill="currentColor" opacity="0.8">Two whole materials, or just colors/values?</text>
</g>

<!-- branch lines -->
<line x1="330" y1="148" x2="200" y2="196" stroke="#FF6B00" stroke-width="2" marker-end="url(#msc-arrow)"/>
<line x1="470" y1="148" x2="600" y2="196" stroke="#FF6B00" stroke-width="2" marker-end="url(#msc-arrow)"/>
<text x="250" y="180" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor" opacity="0.7">complete materials</text>
<text x="552" y="180" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor" opacity="0.7">colors or values</text>

<!-- LEFT: Mix Shader -->
<g transform="translate(40,202)">
<rect x="0" y="0" width="330" height="220" rx="12" fill="#4ADE80" fill-opacity="0.08" stroke="#4ADE80" stroke-width="2"/>
<text x="165" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#4ADE80">Use Mix Shader</text>
<text x="165" y="58" text-anchor="middle" font-size="11.5" fill="currentColor" opacity="0.85">Different Metallic, Roughness, SSS&#8230;</text>
<!-- node sketch -->
<g transform="translate(30,78)">
<rect x="0" y="10" width="86" height="26" rx="4" fill="currentColor" fill-opacity="0.08" stroke="#4ADE80" stroke-width="1.5"/>
<text x="43" y="27" text-anchor="middle" font-size="9.5" fill="currentColor">Metal BSDF</text>
<rect x="0" y="70" width="86" height="26" rx="4" fill="currentColor" fill-opacity="0.08" stroke="#4ADE80" stroke-width="1.5"/>
<text x="43" y="87" text-anchor="middle" font-size="9.5" fill="currentColor">Paint BSDF</text>
<rect x="150" y="40" width="90" height="26" rx="4" fill="#4ADE80" fill-opacity="0.2" stroke="#4ADE80" stroke-width="1.5"/>
<text x="195" y="57" text-anchor="middle" font-size="9.5" font-weight="700" fill="currentColor">Mix Shader</text>
<path d="M86 23 C120 23 120 50 148 50" fill="none" stroke="#4ADE80" stroke-width="1.5"/>
<path d="M86 83 C120 83 120 56 148 56" fill="none" stroke="#4ADE80" stroke-width="1.5"/>
</g>
<text x="165" y="204" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.7">Blends surfaces &#183; costs more (evaluates both)</text>
</g>

<!-- RIGHT: Mix Color -->
<g transform="translate(430,202)">
<rect x="0" y="0" width="330" height="220" rx="12" fill="#F5C242" fill-opacity="0.08" stroke="#F5C242" stroke-width="2"/>
<text x="165" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#F5C242">Use Mix Color</text>
<text x="165" y="58" text-anchor="middle" font-size="11.5" fill="currentColor" opacity="0.85">Same material, blend inputs</text>
<g transform="translate(30,78)">
<rect x="0" y="10" width="86" height="26" rx="4" fill="currentColor" fill-opacity="0.08" stroke="#F5C242" stroke-width="1.5"/>
<text x="43" y="27" text-anchor="middle" font-size="9.5" fill="currentColor">Color A</text>
<rect x="0" y="70" width="86" height="26" rx="4" fill="currentColor" fill-opacity="0.08" stroke="#F5C242" stroke-width="1.5"/>
<text x="43" y="87" text-anchor="middle" font-size="9.5" fill="currentColor">Color B</text>
<rect x="150" y="40" width="90" height="26" rx="4" fill="#F5C242" fill-opacity="0.25" stroke="#F5C242" stroke-width="1.5"/>
<text x="195" y="57" text-anchor="middle" font-size="9.5" font-weight="700" fill="#222">Mix Color</text>
<path d="M86 23 C120 23 120 50 148 50" fill="none" stroke="#F5C242" stroke-width="1.5"/>
<path d="M86 83 C120 83 120 56 148 56" fill="none" stroke="#F5C242" stroke-width="1.5"/>
</g>
<text x="165" y="204" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.7">Blends values &#183; lightweight, feeds one BSDF</text>
</g>

<!-- warning strip -->
<g transform="translate(120,458)">
<rect x="0" y="0" width="560" height="120" rx="10" fill="#E63946" fill-opacity="0.08" stroke="#E63946" stroke-opacity="0.5"/>
<text x="280" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#E63946">Common mistake</text>
<text x="280" y="56" text-anchor="middle" font-size="11.5" fill="currentColor" opacity="0.85">Chaining Mix Shader nodes just to blend two colors wastes</text>
<text x="280" y="74" text-anchor="middle" font-size="11.5" fill="currentColor" opacity="0.85">render time. If both inputs share the same BSDF, mix the</text>
<text x="280" y="92" text-anchor="middle" font-size="11.5" fill="currentColor" opacity="0.85">values first, then plug the result into a single Principled BSDF.</text>
</g>
</svg>
