<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="mb-title mb-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="mb-title">Mouse Button Reference for Blender Navigation</title>
  <desc id="mb-desc">A top-down diagram of a three-button mouse with scroll wheel, annotated with the three core Blender viewport navigation operations. The middle mouse button and scroll wheel drive all viewport movement: middle-button drag alone orbits the view, Shift plus middle-button drag pans, and the scroll wheel or Ctrl plus middle-button drag zooms. The left and right buttons remain available for selection and context menus and are not used for navigation.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Mouse Buttons for Navigation</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">The middle mouse button and scroll wheel handle every viewport movement.</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ===== Mouse illustration centered around (400, 320) ===== -->

  <!-- Mouse body outline -->
  <path d="M 400 215
           C 455 215, 478 280, 478 325
           C 478 385, 460 425, 400 425
           C 340 425, 322 385, 322 325
           C 322 280, 345 215, 400 215 Z"
        fill="none" stroke="currentColor" stroke-width="2" opacity="0.85"/>

  <!-- Button divider lines -->
  <g stroke="currentColor" stroke-width="1.4" opacity="0.45" fill="none">
    <line x1="400" y1="217" x2="400" y2="240"/>
    <line x1="400" y1="278" x2="400" y2="300"/>
    <path d="M 332 300 Q 400 305 468 300"/>
  </g>

  <!-- Scroll wheel (Blender orange to emphasize the nav-active region) -->
  <rect x="392" y="240" width="16" height="38" rx="3" fill="#FF6B00"/>
  <g stroke="#fff" stroke-width="0.8" opacity="0.75">
    <line x1="394" y1="248" x2="406" y2="248"/>
    <line x1="394" y1="256" x2="406" y2="256"/>
    <line x1="394" y1="264" x2="406" y2="264"/>
    <line x1="394" y1="272" x2="406" y2="272"/>
  </g>

  <!-- Scroll direction hint (small up/down arrows next to wheel) -->
  <g fill="#FF6B00" opacity="0.65">
    <path d="M 415 246 L 421 246 L 418 240 Z"/>
    <path d="M 415 272 L 421 272 L 418 278 Z"/>
  </g>

  <!-- ===== LEFT-SIDE ANNOTATIONS (secondary, lower-emphasis) ===== -->

  <!-- Left Click: Select -->
  <text x="70" y="220" font-size="15" font-weight="700" fill="currentColor">Left Click</text>
  <text x="70" y="240" font-size="13" fill="currentColor" opacity="0.65">Select objects.</text>
  <text x="70" y="257" font-size="13" fill="currentColor" opacity="0.65">Not used for navigation.</text>
  <g stroke="currentColor" stroke-width="1.4" opacity="0.4" fill="none">
    <path d="M 190 232 Q 270 232, 345 245"/>
  </g>
  <circle cx="345" cy="245" r="3" fill="currentColor" opacity="0.5"/>

  <!-- Right Click: Context menu -->
  <text x="70" y="395" font-size="15" font-weight="700" fill="currentColor">Right Click</text>
  <text x="70" y="415" font-size="13" fill="currentColor" opacity="0.65">Context menus.</text>
  <text x="70" y="432" font-size="13" fill="currentColor" opacity="0.65">Cancels operations.</text>
  <g stroke="currentColor" stroke-width="1.4" opacity="0.4" fill="none">
    <path d="M 190 405 Q 270 405, 350 285"/>
  </g>
  <circle cx="350" cy="285" r="3" fill="currentColor" opacity="0.5"/>

  <!-- ===== RIGHT-SIDE ANNOTATIONS (the three navigation operations, highlighted) ===== -->

  <!-- Orbit -->
  <text x="540" y="195" font-size="15" font-weight="700" fill="#FF6B00">Orbit</text>
  <text x="540" y="215" font-size="13" fill="currentColor" opacity="0.75">
    <tspan font-weight="600">MMB + Drag</tspan>
  </text>
  <text x="540" y="232" font-size="13" fill="currentColor" opacity="0.65">Rotate around your scene.</text>
  <g stroke="#FF6B00" stroke-width="1.4" opacity="0.55" fill="none">
    <path d="M 535 215 Q 480 220, 420 252"/>
  </g>
  <circle cx="420" cy="252" r="3.5" fill="#FF6B00"/>

  <!-- Pan -->
  <text x="540" y="288" font-size="15" font-weight="700" fill="#FF6B00">Pan</text>
  <text x="540" y="308" font-size="13" fill="currentColor" opacity="0.75">
    <tspan font-weight="600">Shift + MMB + Drag</tspan>
  </text>
  <text x="540" y="325" font-size="13" fill="currentColor" opacity="0.65">Slide the view sideways.</text>
  <g stroke="#FF6B00" stroke-width="1.4" opacity="0.55" fill="none">
    <path d="M 535 308 Q 490 308, 420 296"/>
  </g>
  <circle cx="420" cy="296" r="3.5" fill="#FF6B00"/>

  <!-- Zoom -->
  <text x="540" y="378" font-size="15" font-weight="700" fill="#FF6B00">Zoom</text>
  <text x="540" y="398" font-size="13" fill="currentColor" opacity="0.75">
    <tspan font-weight="600">Scroll Wheel</tspan>
    <tspan fill="currentColor" opacity="0.55"> or </tspan>
    <tspan font-weight="600">Ctrl + MMB + Drag</tspan>
  </text>
  <text x="540" y="415" font-size="13" fill="currentColor" opacity="0.65">Move closer or further.</text>
  <g stroke="#FF6B00" stroke-width="1.4" opacity="0.55" fill="none">
    <path d="M 535 398 Q 480 398, 420 260"/>
  </g>
  <circle cx="420" cy="260" r="3.5" fill="#FF6B00"/>

  <!-- ===== Bottom hint band ===== -->
  <text x="400" y="470" font-size="13" font-style="italic" fill="currentColor" opacity="0.6" text-anchor="middle">
    Three buttons and a scroll wheel cover every navigation move you will make in Blender.
  </text>

  <!-- Footer tip callout -->
  <rect x="40" y="506" width="720" height="34" rx="6"
        fill="#FF6B00" fill-opacity="0.10"
        stroke="#FF6B00" stroke-opacity="0.4"/>
  <text x="54" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> No middle button? Edit &#8594; Preferences &#8594; Input &#8594; check &#8220;Emulate 3 Button Mouse&#8221; to substitute Alt + Left Click.
  </text>
</svg>
