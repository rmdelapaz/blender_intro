<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="t16 d16" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" color="#222">
<title id="t16">Optimization priority pyramid</title>
<desc id="d16">A five-level pyramid ordering optimization work by impact-per-effort: broad low-effort wins at the base, specialized high-effort tuning at the apex.</desc>
<text x="320" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="currentColor">Optimization Priority Pyramid</text>
<text x="320" y="55" text-anchor="middle" font-size="12" fill="#4A9EFF">Start at the base &#8212; biggest impact for least effort first</text>
<!-- level 5 apex -->
<polygon points="320,72 372,120 268,120" fill="#B47EE8"/>
<text x="320" y="106" text-anchor="middle" font-size="12" font-weight="700" fill="#1e1e1e">Micro-tuning</text>
<!-- level 4 -->
<polygon points="266,122 374,122 400,170 240,170" fill="#4A9EFF"/>
<text x="320" y="152" text-anchor="middle" font-size="12" font-weight="700" fill="#1e1e1e">Render sampling &amp; bounces</text>
<!-- level 3 -->
<polygon points="238,172 402,172 428,220 212,220" fill="#F5C242"/>
<text x="320" y="202" text-anchor="middle" font-size="12" font-weight="700" fill="#1e1e1e">Textures &amp; materials</text>
<!-- level 2 -->
<polygon points="210,222 430,222 456,270 184,270" fill="#4ADE80"/>
<text x="320" y="252" text-anchor="middle" font-size="12" font-weight="700" fill="#1e1e1e">Geometry &amp; modifiers</text>
<!-- level 1 base -->
<polygon points="182,272 458,272 484,320 156,320" fill="#FF6B00"/>
<text x="320" y="302" text-anchor="middle" font-size="12" font-weight="700" fill="#1e1e1e">Viewport &amp; scene organization</text>
<!-- effort/impact arrows -->
<text x="150" y="120" text-anchor="end" font-size="11" fill="currentColor">effort per fix</text>
<line x1="120" y1="130" x2="120" y2="310" stroke="#B47EE8" stroke-width="2" marker-end="url(#ar)"/>
<text x="120" y="326" text-anchor="middle" font-size="10" fill="#B47EE8">low</text>
<text x="120" y="126" text-anchor="middle" font-size="10" fill="#B47EE8">high</text>
<text x="510" y="120" font-size="11" fill="currentColor">reach / impact</text>
<line x1="520" y1="310" x2="520" y2="130" stroke="#FF6B00" stroke-width="2" marker-end="url(#ar)"/>
<text x="520" y="326" text-anchor="middle" font-size="10" fill="#FF6B00">broad</text>
<text x="520" y="126" text-anchor="middle" font-size="10" fill="#FF6B00">narrow</text>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="currentColor"/></marker></defs>
<rect x="120" y="342" width="400" height="26" rx="5" fill="#FF6B00" opacity="0.12"/>
<text x="320" y="359" text-anchor="middle" font-size="12" fill="currentColor">Exhaust each level before climbing &#8212; don't micro-tune a bloated scene.</text>
</svg>
