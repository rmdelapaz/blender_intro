<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="dt-title dt-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="dt-title">Dope Sheet versus Timeline comparison</title>
  <desc id="dt-desc">A side-by-side comparison of two editors. The Timeline on the left shows a single summary row of keyframes for the whole object, good for quick playback and scrubbing. The Dope Sheet on the right shows one row per animation channel, such as X Location, Y Location, and Rotation, so you can see and edit each property's keyframes separately.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Dope Sheet vs Timeline</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Same keyframes, two levels of detail</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Center divider -->
  <line x1="400" y1="138" x2="400" y2="600" stroke="#FF6B00" stroke-width="2" opacity="0.9"/>

  <!-- ============ LEFT: TIMELINE ============ -->
  <text x="200" y="162" font-size="16" font-weight="600" fill="currentColor" text-anchor="middle">TIMELINE</text>
  <text x="200" y="182" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">one summary row for the object</text>

  <!-- editor frame -->
  <rect x="56" y="210" width="288" height="120" rx="6" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.2" stroke-width="1"/>
  <!-- ruler -->
  <line x1="56" y1="238" x2="344" y2="238" stroke="currentColor" stroke-opacity="0.15" stroke-width="1"/>
  <g font-size="10" fill="currentColor" opacity="0.5" text-anchor="middle">
    <text x="96" y="230">1</text>
    <text x="170" y="230">24</text>
    <text x="244" y="230">48</text>
    <text x="318" y="230">72</text>
  </g>
  <!-- single summary channel label (above the keyframe row to clear the first diamond) -->
  <text x="68" y="260" font-size="12" font-weight="600" fill="currentColor">Summary</text>
  <!-- summary keyframes (all collapsed onto one row) -->
  <g fill="#F5C242" stroke="currentColor" stroke-opacity="0.3" stroke-width="1">
    <path d="M 96 286 L 104 294 L 96 302 L 88 294 Z"/>
    <path d="M 170 286 L 178 294 L 170 302 L 162 294 Z"/>
    <path d="M 244 286 L 252 294 L 244 302 L 236 294 Z"/>
    <path d="M 318 286 L 326 294 L 318 302 L 310 294 Z"/>
  </g>
  <!-- playhead -->
  <line x1="170" y1="238" x2="170" y2="330" stroke="#4A9EFF" stroke-width="2"/>

  <!-- best-for note -->
  <text x="200" y="362" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">Best for</text>
  <text x="200" y="384" font-size="13" fill="currentColor" opacity="0.7" text-anchor="middle">Playback, scrubbing,</text>
  <text x="200" y="402" font-size="13" fill="currentColor" opacity="0.7" text-anchor="middle">setting the frame range</text>

  <!-- ============ RIGHT: DOPE SHEET ============ -->
  <text x="600" y="162" font-size="16" font-weight="600" fill="currentColor" text-anchor="middle">DOPE SHEET</text>
  <text x="600" y="182" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">one row per animation channel</text>

  <!-- editor frame -->
  <rect x="456" y="210" width="288" height="180" rx="6" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.2" stroke-width="1"/>
  <!-- ruler -->
  <line x1="456" y1="238" x2="744" y2="238" stroke="currentColor" stroke-opacity="0.15" stroke-width="1"/>
  <g font-size="10" fill="currentColor" opacity="0.5" text-anchor="middle">
    <text x="566" y="230">1</text>
    <text x="624" y="230">24</text>
    <text x="682" y="230">48</text>
    <text x="740" y="230">72</text>
  </g>
  <!-- channel label column divider -->
  <line x1="548" y1="238" x2="548" y2="390" stroke="currentColor" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Channel rows -->
  <g font-size="11" font-weight="600" fill="currentColor">
    <text x="466" y="266">X Location</text>
    <text x="466" y="300">Y Location</text>
    <text x="466" y="334">Z Location</text>
    <text x="466" y="368">Rotation</text>
  </g>
  <!-- row dividers -->
  <g stroke="currentColor" stroke-opacity="0.1" stroke-width="1">
    <line x1="548" y1="278" x2="744" y2="278"/>
    <line x1="548" y1="312" x2="744" y2="312"/>
    <line x1="548" y1="346" x2="744" y2="346"/>
  </g>
  <!-- per-channel keyframes (small diamonds) -->
  <g fill="#F5C242" stroke="currentColor" stroke-opacity="0.3" stroke-width="1">
    <!-- X Location -->
    <path d="M 566 256 l 7 7 l -7 7 l -7 -7 Z"/>
    <path d="M 682 256 l 7 7 l -7 7 l -7 -7 Z"/>
    <!-- Y Location -->
    <path d="M 566 290 l 7 7 l -7 7 l -7 -7 Z"/>
    <path d="M 624 290 l 7 7 l -7 7 l -7 -7 Z"/>
    <path d="M 740 290 l 7 7 l -7 7 l -7 -7 Z"/>
    <!-- Z Location -->
    <path d="M 624 324 l 7 7 l -7 7 l -7 -7 Z"/>
    <path d="M 740 324 l 7 7 l -7 7 l -7 -7 Z"/>
    <!-- Rotation -->
    <path d="M 566 358 l 7 7 l -7 7 l -7 -7 Z"/>
    <path d="M 740 358 l 7 7 l -7 7 l -7 -7 Z"/>
  </g>
  <!-- playhead -->
  <line x1="624" y1="238" x2="624" y2="390" stroke="#4A9EFF" stroke-width="2"/>

  <!-- best-for note -->
  <text x="600" y="424" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">Best for</text>
  <text x="600" y="446" font-size="13" fill="currentColor" opacity="0.7" text-anchor="middle">Retiming single channels,</text>
  <text x="600" y="464" font-size="13" fill="currentColor" opacity="0.7" text-anchor="middle">sliding and deleting keys</text>

  <!-- shared note row -->
  <line x1="40" y1="500" x2="760" y2="500" stroke="currentColor" stroke-width="1" opacity="0.15"/>
  <text x="400" y="528" font-size="13" fill="currentColor" opacity="0.7" text-anchor="middle">The Timeline summary diamond is every channel's keys stacked on one row. The Dope Sheet unstacks them.</text>

  <!-- Footer tip (Variant B left rail, 680 variant: y=641) -->
  <rect x="40" y="641" width="720" height="34" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Use the Timeline to play and scrub; switch to the Dope Sheet when you need to move one property's keys.
  </text>
</svg>
