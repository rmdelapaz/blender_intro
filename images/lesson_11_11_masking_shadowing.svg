<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="mk-title mk-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="mk-title">Masking and shadowing on a rough microfacet surface</title>
  <desc id="mk-desc">Two cross-section panels of a rough surface at a grazing angle. On the left, shadowing: incoming light arriving low is blocked by tall peaks, so the valleys behind them never get lit, shown as red shaded dead zones. On the right, masking: light does reflect off the facets but neighbouring peaks block it from escaping, trapping the reflected rays. Both effects remove energy, which is why rough surfaces look darker than expected at grazing angles.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Masking and Shadowing</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Why rough surfaces darken at grazing angles</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ===== Panel 1: Shadowing (left) ===== -->
  <text x="220" y="148" font-size="16" font-weight="600" text-anchor="middle" fill="currentColor">Shadowing</text>
  <text x="220" y="168" font-size="12.5" text-anchor="middle" fill="currentColor" opacity="0.6">Incoming light blocked before it lands</text>

  <!-- surface profile -->
  <path d="M 50,300 L 110,410 L 170,300 L 230,410 L 290,300 L 350,410 L 390,360 L 390,460 L 50,460 Z"
        fill="currentColor" opacity="0.10"/>
  <polyline points="50,300 110,410 170,300 230,410 290,300 350,410 390,360"
            fill="none" stroke="currentColor" stroke-width="2.6" opacity="0.65"/>

  <!-- shadowed dead zones (red) on the lee side of peaks -->
  <path d="M 170,300 L 230,410 L 175,408 Z" fill="#E63946" opacity="0.28"/>
  <path d="M 290,300 L 350,410 L 296,408 Z" fill="#E63946" opacity="0.28"/>

  <!-- incoming grazing rays from upper-left -->
  <line x1="60" y1="205" x2="158" y2="312" stroke="#F4C430" stroke-width="3" marker-end="url(#mk-in)"/>
  <line x1="120" y1="200" x2="278" y2="312" stroke="#F4C430" stroke-width="3" marker-end="url(#mk-in)"/>
  <!-- a blocked ray: stops at the peak with an X -->
  <line x1="180" y1="200" x2="292" y2="298" stroke="#F4C430" stroke-width="3" opacity="0.55" marker-end="url(#mk-in)"/>
  <line x1="285" y1="291" x2="299" y2="305" stroke="#E63946" stroke-width="2.4"/>
  <line x1="299" y1="291" x2="285" y2="305" stroke="#E63946" stroke-width="2.4"/>
  <text x="200" y="430" font-size="11" text-anchor="middle" fill="#E63946">Not lit</text>

  <!-- ===== Panel 2: Masking (right) ===== -->
  <text x="580" y="148" font-size="16" font-weight="600" text-anchor="middle" fill="currentColor">Masking</text>
  <text x="580" y="168" font-size="12.5" text-anchor="middle" fill="currentColor" opacity="0.6">Reflected light blocked before it escapes</text>

  <path d="M 410,300 L 470,410 L 530,300 L 590,410 L 650,300 L 710,410 L 750,360 L 750,460 L 410,460 Z"
        fill="currentColor" opacity="0.10"/>
  <polyline points="410,300 470,410 530,300 590,410 650,300 710,410 750,360"
            fill="none" stroke="currentColor" stroke-width="2.6" opacity="0.65"/>

  <!-- masked trap zones (red) -->
  <path d="M 530,300 L 590,410 L 535,408 Z" fill="#E63946" opacity="0.28"/>

  <!-- incoming ray hits valley flank, reflects up but is blocked by the next peak -->
  <line x1="500" y1="200" x2="560" y2="372" stroke="#F4C430" stroke-width="3" marker-end="url(#mk-in)"/>
  <line x1="560" y1="372" x2="628" y2="318" stroke="#FF6B00" stroke-width="2.6" opacity="0.9" marker-end="url(#mk-out)"/>
  <!-- blocked at the neighbouring peak -->
  <line x1="623" y1="311" x2="637" y2="325" stroke="#E63946" stroke-width="2.4"/>
  <line x1="637" y1="311" x2="623" y2="325" stroke="#E63946" stroke-width="2.4"/>
  <text x="556" y="432" font-size="11" text-anchor="middle" fill="#E63946">Trapped</text>

  <!-- a successful escape ray for contrast -->
  <line x1="660" y1="200" x2="690" y2="372" stroke="#F4C430" stroke-width="3" marker-end="url(#mk-in)"/>
  <line x1="690" y1="372" x2="742" y2="250" stroke="#FF6B00" stroke-width="2.6" marker-end="url(#mk-out)"/>

  <!-- center divider -->
  <line x1="400" y1="138" x2="400" y2="470" stroke="currentColor" stroke-width="1" opacity="0.12"/>

  <!-- Legend -->
  <rect x="40" y="486" width="720" height="54" rx="6" fill="currentColor" opacity="0.04"/>
  <line x1="62" y1="506" x2="100" y2="506" stroke="#F4C430" stroke-width="3"/>
  <text x="108" y="510" font-size="13" fill="currentColor">Incoming</text>
  <line x1="220" y1="506" x2="258" y2="506" stroke="#FF6B00" stroke-width="3"/>
  <text x="266" y="510" font-size="13" fill="currentColor">Reflected</text>
  <rect x="396" y="500" width="22" height="12" fill="#E63946" opacity="0.28"/>
  <text x="426" y="510" font-size="13" fill="currentColor">Blocked / dead zone</text>
  <text x="62" y="532" font-size="12" fill="currentColor" opacity="0.6">Principled BSDF accounts for both automatically &#183; the energy lost here is real physics, not a bug.</text>

  <defs>
    <marker id="mk-in" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#F4C430"/></marker>
    <marker id="mk-out" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#FF6B00"/></marker>
  </defs>
</svg>
