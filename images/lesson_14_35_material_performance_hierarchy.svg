<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="ph-title ph-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="ph-title">Material Performance Hierarchy</title>
  <desc id="ph-desc">Eight material types ranked from fastest to slowest to render. Simple Principled BSDF with solid colors is fastest with a five-star rating in the green zone; materials with displacement are slowest with a one-star rating in the red zone. Speed decreases and cost increases from top to bottom, passing through green, yellow, and red performance zones.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">MATERIAL PERFORMANCE HIERARCHY</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Fastest to slowest to render &#183; simplify wherever the look allows</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Zone rail labels (left edge) -->
  <text x="56" y="186" font-size="13" font-weight="700" fill="#4ADE80" text-anchor="middle">FAST</text>
  <text x="56" y="382" font-size="13" font-weight="700" fill="#F5C242" text-anchor="middle">MED</text>
  <text x="56" y="572" font-size="13" font-weight="700" fill="#E63946" text-anchor="middle">SLOW</text>

  <!-- Row 1 FAST green -->
  <g>
    <rect x="96" y="152" width="664" height="56" rx="8" fill="#4ADE80" fill-opacity="0.18" stroke="#4ADE80" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="118" y="186" font-size="15" font-weight="700" fill="currentColor">1. Simple Principled BSDF (solid colors)</text>
    <text x="742" y="186" font-size="16" font-weight="700" fill="#4ADE80" text-anchor="end">&#9733;&#9733;&#9733;&#9733;&#9733;</text>
  </g>
  <!-- Row 2 green -->
  <g>
    <rect x="96" y="216" width="640" height="56" rx="8" fill="#4ADE80" fill-opacity="0.15" stroke="#4ADE80" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="118" y="250" font-size="15" font-weight="700" fill="currentColor">2. Principled BSDF + image textures</text>
    <text x="718" y="250" font-size="16" font-weight="700" fill="#4ADE80" text-anchor="end">&#9733;&#9733;&#9733;&#9733;&#9734;</text>
  </g>
  <!-- Row 3 green -->
  <g>
    <rect x="96" y="280" width="616" height="56" rx="8" fill="#4ADE80" fill-opacity="0.12" stroke="#4ADE80" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="118" y="314" font-size="15" font-weight="700" fill="currentColor">3. Principled BSDF + procedural textures</text>
    <text x="694" y="314" font-size="16" font-weight="700" fill="#4ADE80" text-anchor="end">&#9733;&#9733;&#9733;&#9733;&#9734;</text>
  </g>
  <!-- Row 4 MEDIUM yellow -->
  <g>
    <rect x="96" y="344" width="568" height="56" rx="8" fill="#F5C242" fill-opacity="0.16" stroke="#F5C242" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="118" y="378" font-size="15" font-weight="700" fill="currentColor">4. Mix Shaders (2&#8211;3 layers)</text>
    <text x="646" y="378" font-size="16" font-weight="700" fill="#F5C242" text-anchor="end">&#9733;&#9733;&#9733;&#9734;&#9734;</text>
  </g>
  <!-- Row 5 yellow -->
  <g>
    <rect x="96" y="408" width="520" height="56" rx="8" fill="#F5C242" fill-opacity="0.14" stroke="#F5C242" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="118" y="442" font-size="15" font-weight="700" fill="currentColor">5. Complex layered (4+ Mix Shaders)</text>
    <text x="598" y="442" font-size="16" font-weight="700" fill="#F5C242" text-anchor="end">&#9733;&#9733;&#9734;&#9734;&#9734;</text>
  </g>
  <!-- Row 6 red -->
  <g>
    <rect x="96" y="472" width="472" height="56" rx="8" fill="#E63946" fill-opacity="0.12" stroke="#E63946" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="118" y="506" font-size="15" font-weight="700" fill="currentColor">6. Subsurface Scattering materials</text>
    <text x="550" y="506" font-size="16" font-weight="700" fill="#E63946" text-anchor="end">&#9733;&#9733;&#9734;&#9734;&#9734;</text>
  </g>
  <!-- Row 7 red -->
  <g>
    <rect x="96" y="536" width="424" height="56" rx="8" fill="#E63946" fill-opacity="0.15" stroke="#E63946" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="118" y="570" font-size="15" font-weight="700" fill="currentColor">7. Transparent / Transmission</text>
    <text x="502" y="570" font-size="16" font-weight="700" fill="#E63946" text-anchor="end">&#9733;&#9734;&#9734;&#9734;&#9734;</text>
  </g>
  <!-- Row 8 SLOW red -->
  <g>
    <rect x="96" y="600" width="376" height="56" rx="8" fill="#E63946" fill-opacity="0.18" stroke="#E63946" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="118" y="634" font-size="15" font-weight="700" fill="currentColor">8. Materials with Displacement</text>
    <text x="454" y="634" font-size="16" font-weight="700" fill="#E63946" text-anchor="end">&#9733;&#9734;&#9734;&#9734;&#9734;</text>
  </g>
</svg>
