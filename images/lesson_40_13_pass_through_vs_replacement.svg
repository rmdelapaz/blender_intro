<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="ptr-title ptr-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="ptr-title">Pass-through versus replacement</title>
  <desc id="ptr-desc">Two panels contrast node behaviours. On the left, pass-through: Set Position modifies the incoming mesh, keeping the same structure with changed attributes. On the right, replacement: a Mesh primitive node ignores the input and generates brand-new geometry.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Pass-through vs replacement</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Some nodes change the mesh you give them; others build a new one and ignore it</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- divider + VS -->
  <line x1="400" y1="140" x2="400" y2="470" stroke="currentColor" stroke-width="1" opacity="0.12"/>
  <circle cx="400" cy="300" r="20" fill="currentColor" fill-opacity="0.06"/>
  <text x="400" y="305" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor" opacity="0.6">VS</text>

  <!-- LEFT: pass-through -->
  <text x="200" y="164" text-anchor="middle" font-size="16" font-weight="600" fill="#4ADE80">Pass-through</text>
  <text x="200" y="184" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">modifies what comes in</text>
  <!-- node chain -->
  <g transform="translate(0,0)">
    <rect x="60" y="210" width="66" height="30" rx="5" fill="#4ADE80" fill-opacity="0.12" stroke="#4ADE80" stroke-opacity="0.6" stroke-width="1.3"/><text x="93" y="230" text-anchor="middle" font-size="10" fill="currentColor">Input</text>
    <rect x="152" y="210" width="90" height="30" rx="5" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.3"/><text x="197" y="230" text-anchor="middle" font-size="10" fill="currentColor">Set Position</text>
    <rect x="268" y="210" width="72" height="30" rx="5" fill="#4ADE80" fill-opacity="0.12" stroke="#4ADE80" stroke-opacity="0.6" stroke-width="1.3"/><text x="304" y="230" text-anchor="middle" font-size="10" fill="currentColor">Output</text>
    <line x1="126" y1="225" x2="152" y2="225" stroke="#4ADE80" stroke-width="2"/>
    <line x1="242" y1="225" x2="268" y2="225" stroke="#4ADE80" stroke-width="2"/>
  </g>
  <!-- before/after cubes -->
  <text x="130" y="290" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.6">before</text>
  <rect x="100" y="300" width="60" height="60" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="270" y="290" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.6">after</text>
  <rect x="240" y="310" width="60" height="60" fill="#4ADE80" fill-opacity="0.18" stroke="#4ADE80" stroke-width="1.5"/>
  <path d="M 172 330 l 56 0" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.5" marker-end="url(#ptr-a)"/>
  <text x="200" y="410" text-anchor="middle" font-size="12" font-weight="600" fill="#4ADE80">Same mesh, moved</text>
  <text x="200" y="430" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">structure unchanged</text>

  <!-- RIGHT: replacement -->
  <text x="600" y="164" text-anchor="middle" font-size="16" font-weight="600" fill="#4A9EFF">Replacement</text>
  <text x="600" y="184" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">builds new, ignores input</text>
  <g>
    <rect x="450" y="210" width="66" height="30" rx="5" fill="#4ADE80" fill-opacity="0.12" stroke="#4ADE80" stroke-opacity="0.6" stroke-width="1.3"/><text x="483" y="230" text-anchor="middle" font-size="10" fill="currentColor">Input</text>
    <rect x="542" y="210" width="90" height="30" rx="5" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.3"/><text x="587" y="230" text-anchor="middle" font-size="10" fill="currentColor">Mesh Cube</text>
    <rect x="658" y="210" width="72" height="30" rx="5" fill="#4ADE80" fill-opacity="0.12" stroke="#4ADE80" stroke-opacity="0.6" stroke-width="1.3"/><text x="694" y="230" text-anchor="middle" font-size="10" fill="currentColor">Output</text>
    <!-- input link is dropped -->
    <line x1="516" y1="225" x2="542" y2="225" stroke="#E63946" stroke-width="2" stroke-dasharray="3 3" opacity="0.7"/>
    <line x1="632" y1="225" x2="658" y2="225" stroke="#4ADE80" stroke-width="2"/>
  </g>
  <text x="530" y="290" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.6">input</text>
  <rect x="500" y="300" width="60" height="60" fill="none" stroke="currentColor" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="500" y1="300" x2="560" y2="360" stroke="#E63946" stroke-opacity="0.6" stroke-width="1.5"/>
  <line x1="560" y1="300" x2="500" y2="360" stroke="#E63946" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="670" y="290" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.6">new</text>
  <rect x="640" y="310" width="60" height="60" fill="#4A9EFF" fill-opacity="0.18" stroke="#4A9EFF" stroke-width="1.5"/>
  <text x="600" y="410" text-anchor="middle" font-size="12" font-weight="600" fill="#4A9EFF">Fresh geometry</text>
  <text x="600" y="430" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">original discarded</text>

  <defs>
    <marker id="ptr-a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="currentColor" fill-opacity="0.4"/></marker>
  </defs>

  <rect x="40" y="506" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Generator nodes (Mesh Cube, Grid) replace; operator nodes (Set Position, Transform) pass through.</text>
</svg>
