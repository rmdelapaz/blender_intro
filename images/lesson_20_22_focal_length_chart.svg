<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="fc-title fc-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="fc-title">Focal length categories and their uses</title>
  <desc id="fc-desc">A reference chart of five focal length ranges shown as a horizontal segmented bar: ultra-wide 18 to 24 millimetres, wide 24 to 35, standard 35 to 55, portrait 85 to 135, and telephoto 135 millimetres and up. Each range lists its perspective effect and a typical use, with the standard range highlighted as the closest match to human vision.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">FOCAL LENGTH CATEGORIES</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Choosing a lens for the look you want</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ============ SEGMENTED BAR ============ -->
  <!-- Bar spans x 40..760 (w=720), y 138..182. Five equal-ish segments. -->
  <g>
    <rect x="40"  y="138" width="144" height="44" fill="#4A9EFF" fill-opacity="0.85"/>
    <rect x="184" y="138" width="144" height="44" fill="#4ADE80" fill-opacity="0.85"/>
    <rect x="328" y="138" width="144" height="44" fill="#F5C242" fill-opacity="0.9"/>
    <rect x="472" y="138" width="144" height="44" fill="#FF7EA8" fill-opacity="0.85"/>
    <rect x="616" y="138" width="144" height="44" fill="#B47EE8" fill-opacity="0.85"/>
  </g>
  <!-- segment range labels (dark text on the coloured bar reads on both modes) -->
  <g font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">
    <text x="112" y="165">18&#8211;24mm</text>
    <text x="256" y="165">24&#8211;35mm</text>
    <text x="400" y="165">35&#8211;55mm</text>
    <text x="544" y="165">85&#8211;135mm</text>
    <text x="688" y="165">135mm+</text>
  </g>

  <!-- ============ DETAIL ROWS ============ -->
  <!-- Each row: colour chip + category name + effect + use -->
  <!-- Row 1 -->
  <g>
    <rect x="40" y="214" width="14" height="14" rx="2" fill="#4A9EFF"/>
    <text x="64" y="226" font-size="15" font-weight="600" fill="currentColor">Ultra-wide</text>
    <text x="64" y="246" font-size="13" fill="currentColor" opacity="0.6">Exaggerated depth, lines bend outward &#183; Use: tight interiors, dramatic landscapes</text>
  </g>
  <!-- Row 2 -->
  <g>
    <rect x="40" y="278" width="14" height="14" rx="2" fill="#4ADE80"/>
    <text x="64" y="290" font-size="15" font-weight="600" fill="currentColor">Wide-angle</text>
    <text x="64" y="310" font-size="13" fill="currentColor" opacity="0.6">Roomy, slight stretch at edges &#183; Use: environments, architecture, group shots</text>
  </g>
  <!-- Row 3 (highlighted: standard / closest to human vision) -->
  <rect x="34" y="330" width="726" height="64" rx="6" fill="#FF6B00" fill-opacity="0.08"/>
  <rect x="34" y="330" width="4" height="64" fill="#FF6B00"/>
  <g>
    <rect x="48" y="346" width="14" height="14" rx="2" fill="#F5C242"/>
    <text x="72" y="358" font-size="15" font-weight="600" fill="currentColor">Standard <tspan font-size="12" font-weight="400" opacity="0.7">&#183; closest to human vision</tspan></text>
    <text x="72" y="378" font-size="13" fill="currentColor" opacity="0.6">Natural, undistorted perspective &#183; Use: everyday scenes, documentary, the safe default</text>
  </g>
  <!-- Row 4 -->
  <g>
    <rect x="40" y="414" width="14" height="14" rx="2" fill="#FF7EA8"/>
    <text x="64" y="426" font-size="15" font-weight="600" fill="currentColor">Portrait / short telephoto</text>
    <text x="64" y="446" font-size="13" fill="currentColor" opacity="0.6">Flattering, gentle compression &#183; Use: portraits, product hero shots, character close-ups</text>
  </g>
  <!-- Row 5 -->
  <g>
    <rect x="40" y="478" width="14" height="14" rx="2" fill="#B47EE8"/>
    <text x="64" y="490" font-size="15" font-weight="600" fill="currentColor">Telephoto</text>
    <text x="64" y="510" font-size="13" fill="currentColor" opacity="0.6">Strong compression, flat depth &#183; Use: distant subjects, stacked layers, isolation</text>
  </g>

  <!-- mid divider before footer -->
  <line x1="40" y1="544" x2="760" y2="544" stroke="currentColor" stroke-width="1" opacity="0.12"/>
  <text x="40" y="572" font-size="13" fill="currentColor" opacity="0.6">Longer focal length = narrower view + more compression. Shorter = wider view + more depth.</text>

  <!-- ============ FOOTER TIP (Variant B, left rail; 680 variant y shift) ============ -->
  <rect x="40" y="641" width="720" height="34" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Set focal length in Camera &#8250; Lens &#183; 50mm is the natural-looking starting point.
  </text>
</svg>
