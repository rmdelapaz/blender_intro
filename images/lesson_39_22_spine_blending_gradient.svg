<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="sbg-title sbg-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="sbg-title">Spine Blending Visualization</title>
  <desc id="sbg-desc">An interpolation bar shows how the middle spine bones blend between full COG influence at the base and full Chest influence at the top. Percentage markers along the bar map each spine bone to its blend ratio.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">SPINE BLENDING</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Middle bones interpolate · COG to Chest influence</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <text x="40" y="138" font-size="18" font-weight="600" fill="currentColor">Influence interpolation · base to top</text>

  <defs>
    <linearGradient id="sbg-grad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="50%" stop-color="#2196F3"/>
      <stop offset="100%" stop-color="#4ADE80"/>
    </linearGradient>
  </defs>

  <!-- Gradient blend bar (base COG -> top Chest) -->
  <rect x="120" y="170" width="80" height="300" rx="6" fill="url(#sbg-grad)" opacity="0.85"/>
  <rect x="120" y="170" width="80" height="300" rx="6" fill="none" stroke="currentColor" stroke-width="1" opacity="0.3"/>
  <text x="160" y="160" font-size="13" font-weight="600" fill="#4ADE80" text-anchor="middle">Chest 100%</text>
  <text x="160" y="490" font-size="13" font-weight="600" fill="#4ADE80" text-anchor="middle">COG 100%</text>

  <!-- Spine-bone tick markers mapped to blend ratio -->
  <g stroke="currentColor" stroke-width="1.5" opacity="0.3" stroke-linecap="round">
    <line x1="200" y1="200" x2="224" y2="200"/>
    <line x1="200" y1="275" x2="224" y2="275"/>
    <line x1="200" y1="350" x2="224" y2="350"/>
  </g>
  <circle cx="200" cy="200" r="5" fill="#2196F3"/>
  <text x="234" y="196" font-size="14" font-weight="500" fill="currentColor">spine_03</text>
  <text x="234" y="213" font-size="12" fill="#2196F3" opacity="0.9">COG / Chest · 25 / 75</text>
  <circle cx="200" cy="275" r="5" fill="#2196F3"/>
  <text x="234" y="271" font-size="14" font-weight="500" fill="currentColor">spine_02</text>
  <text x="234" y="288" font-size="12" fill="#2196F3" opacity="0.9">COG / Chest · 50 / 50</text>
  <circle cx="200" cy="350" r="5" fill="#2196F3"/>
  <text x="234" y="346" font-size="14" font-weight="500" fill="currentColor">spine_01</text>
  <text x="234" y="363" font-size="12" fill="#2196F3" opacity="0.9">COG / Chest · 75 / 25</text>

  <text x="470" y="200" font-size="14" font-weight="600" fill="currentColor">How it blends</text>
  <text x="470" y="228" font-size="13" fill="currentColor" opacity="0.6">The COG control fully drives the</text>
  <text x="470" y="248" font-size="13" fill="currentColor" opacity="0.6">lowest spine bone; the Chest control</text>
  <text x="470" y="268" font-size="13" fill="currentColor" opacity="0.6">fully drives the highest. Each middle</text>
  <text x="470" y="288" font-size="13" fill="currentColor" opacity="0.6">bone mixes the two by its position,</text>
  <text x="470" y="308" font-size="13" fill="currentColor" opacity="0.6">so the torso curves smoothly instead</text>
  <text x="470" y="328" font-size="13" fill="currentColor" opacity="0.6">of snapping at one joint.</text>

  <!-- Footer tip Variant B -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Blend weights across the middle bones (roughly 75/25, 50/50, 25/75) so no single joint carries the whole bend.</text>
</svg>
