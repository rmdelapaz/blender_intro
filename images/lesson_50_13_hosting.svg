<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="car13-title car13-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="car13-title">Where to Host Your Reel</title>
  <desc id="car13-desc">A comparison matrix of four places to host a demo reel across three factors: reach, control, and industry fit. YouTube offers the widest reach, Vimeo gives clean playback and strong control, ArtStation is the strongest industry fit for art and animation roles, and a personal site gives full control but the least built-in reach.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Where to Host Your Reel</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Each platform trades reach, control, and industry fit differently. Match it to your goal.</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Column headers -->
  <g>
    <text x="300" y="164" font-size="13" text-anchor="middle" font-weight="600" fill="#4A9EFF">Reach</text>
    <text x="452" y="164" font-size="13" text-anchor="middle" font-weight="600" fill="#B47EE8">Control</text>
    <text x="612" y="164" font-size="13" text-anchor="middle" font-weight="600" fill="#4ADE80">Industry fit</text>
  </g>
  <line x1="40" y1="176" x2="760" y2="176" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Row helper: dots meter drawn inline per cell -->
  <!-- Row 1 YouTube -->
  <g>
    <text x="48" y="214" font-size="16" font-weight="600" fill="currentColor">YouTube</text>
    <text x="48" y="234" font-size="12" fill="currentColor" opacity="0.6">Widest audience</text>
    <!-- reach 3/3 -->
    <circle cx="278" cy="212" r="7" fill="#4A9EFF"/><circle cx="300" cy="212" r="7" fill="#4A9EFF"/><circle cx="322" cy="212" r="7" fill="#4A9EFF"/>
    <!-- control 1/3 -->
    <circle cx="430" cy="212" r="7" fill="#B47EE8"/><circle cx="452" cy="212" r="7" fill="currentColor" opacity="0.15"/><circle cx="474" cy="212" r="7" fill="currentColor" opacity="0.15"/>
    <!-- fit 2/3 -->
    <circle cx="590" cy="212" r="7" fill="#4ADE80"/><circle cx="612" cy="212" r="7" fill="#4ADE80"/><circle cx="634" cy="212" r="7" fill="currentColor" opacity="0.15"/>
  </g>
  <line x1="40" y1="252" x2="760" y2="252" stroke="currentColor" stroke-width="1" opacity="0.08"/>

  <!-- Row 2 Vimeo -->
  <g>
    <text x="48" y="290" font-size="16" font-weight="600" fill="currentColor">Vimeo</text>
    <text x="48" y="310" font-size="12" fill="currentColor" opacity="0.6">Clean, ad-free playback</text>
    <circle cx="278" cy="288" r="7" fill="#4A9EFF"/><circle cx="300" cy="288" r="7" fill="#4A9EFF"/><circle cx="322" cy="288" r="7" fill="currentColor" opacity="0.15"/>
    <circle cx="430" cy="288" r="7" fill="#B47EE8"/><circle cx="452" cy="288" r="7" fill="#B47EE8"/><circle cx="474" cy="288" r="7" fill="#B47EE8"/>
    <circle cx="590" cy="288" r="7" fill="#4ADE80"/><circle cx="612" cy="288" r="7" fill="#4ADE80"/><circle cx="634" cy="288" r="7" fill="currentColor" opacity="0.15"/>
  </g>
  <line x1="40" y1="328" x2="760" y2="328" stroke="currentColor" stroke-width="1" opacity="0.08"/>

  <!-- Row 3 ArtStation -->
  <g>
    <text x="48" y="366" font-size="16" font-weight="600" fill="currentColor">ArtStation</text>
    <text x="48" y="386" font-size="12" fill="currentColor" opacity="0.6">Recruiters browse here</text>
    <circle cx="278" cy="364" r="7" fill="#4A9EFF"/><circle cx="300" cy="364" r="7" fill="#4A9EFF"/><circle cx="322" cy="364" r="7" fill="currentColor" opacity="0.15"/>
    <circle cx="430" cy="364" r="7" fill="#B47EE8"/><circle cx="452" cy="364" r="7" fill="#B47EE8"/><circle cx="474" cy="364" r="7" fill="currentColor" opacity="0.15"/>
    <circle cx="590" cy="364" r="7" fill="#4ADE80"/><circle cx="612" cy="364" r="7" fill="#4ADE80"/><circle cx="634" cy="364" r="7" fill="#4ADE80"/>
  </g>
  <line x1="40" y1="404" x2="760" y2="404" stroke="currentColor" stroke-width="1" opacity="0.08"/>

  <!-- Row 4 Personal site -->
  <g>
    <text x="48" y="442" font-size="16" font-weight="600" fill="currentColor">Personal site</text>
    <text x="48" y="462" font-size="12" fill="currentColor" opacity="0.6">Your rules, your brand</text>
    <circle cx="278" cy="440" r="7" fill="#4A9EFF"/><circle cx="300" cy="440" r="7" fill="currentColor" opacity="0.15"/><circle cx="322" cy="440" r="7" fill="currentColor" opacity="0.15"/>
    <circle cx="430" cy="440" r="7" fill="#B47EE8"/><circle cx="452" cy="440" r="7" fill="#B47EE8"/><circle cx="474" cy="440" r="7" fill="#B47EE8"/>
    <circle cx="590" cy="440" r="7" fill="#4ADE80"/><circle cx="612" cy="440" r="7" fill="#4ADE80"/><circle cx="634" cy="440" r="7" fill="currentColor" opacity="0.15"/>
  </g>

  <!-- scale legend -->
  <text x="720" y="478" font-size="11" text-anchor="end" fill="currentColor" opacity="0.5">More dots = stronger</text>

  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Post where your target studios look. Many animators host on Vimeo or ArtStation and link it from a simple personal page.</text>
</svg>
