<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="spc-title spc-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="spc-title">Eevee Next render settings presets reference</title>
  <desc id="spc-desc">A three-column reference card comparing Draft, Production, and High Quality render presets for Eevee Next in Blender 5.1.1, listing render samples, raytracing, raytracing resolution, shadow rays and steps, and fast global illumination for each preset.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Render Settings Presets</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">EEVEE Next reference &#183; Blender 5.1.1 &#183; trade speed against quality</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Row label column header -->
  <text x="40" y="158" font-size="13" font-weight="600" fill="currentColor" opacity="0.6">Setting</text>

  <!-- Column DRAFT -->
  <rect x="220" y="128" width="172" height="446" rx="8" fill="#4ADE80" fill-opacity="0.08" stroke="#4ADE80" stroke-width="1.5"/>
  <text x="306" y="156" text-anchor="middle" font-size="17" font-weight="700" fill="#4ADE80">DRAFT</text>
  <text x="306" y="176" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">fast iteration</text>

  <!-- Column PRODUCTION -->
  <rect x="404" y="128" width="172" height="446" rx="8" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-width="1.5"/>
  <text x="490" y="156" text-anchor="middle" font-size="17" font-weight="700" fill="#FF6B00">PRODUCTION</text>
  <text x="490" y="176" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">balanced default</text>

  <!-- Column HIGH QUALITY -->
  <rect x="588" y="128" width="172" height="446" rx="8" fill="#4A9EFF" fill-opacity="0.08" stroke="#4A9EFF" stroke-width="1.5"/>
  <text x="674" y="156" text-anchor="middle" font-size="17" font-weight="700" fill="#4A9EFF">HIGH QUALITY</text>
  <text x="674" y="176" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">final render</text>

  <!-- Row 1: Render Samples -->
  <line x1="40" y1="206" x2="760" y2="206" stroke="currentColor" stroke-width="1" opacity="0.10"/>
  <text x="40" y="234" font-size="14" font-weight="600" fill="currentColor">Render Samples</text>
  <text x="40" y="252" font-size="11" fill="currentColor" opacity="0.5">taa_render_samples</text>
  <text x="306" y="240" text-anchor="middle" font-size="20" font-weight="700" fill="currentColor">16</text>
  <text x="490" y="240" text-anchor="middle" font-size="20" font-weight="700" fill="currentColor">64</text>
  <text x="674" y="240" text-anchor="middle" font-size="20" font-weight="700" fill="currentColor">256</text>

  <!-- Row 2: Raytracing -->
  <line x1="40" y1="272" x2="760" y2="272" stroke="currentColor" stroke-width="1" opacity="0.10"/>
  <text x="40" y="300" font-size="14" font-weight="600" fill="currentColor">Raytracing</text>
  <text x="40" y="318" font-size="11" fill="currentColor" opacity="0.5">use_raytracing</text>
  <text x="306" y="306" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor" opacity="0.55">Off</text>
  <text x="490" y="306" text-anchor="middle" font-size="15" font-weight="700" fill="#FF6B00">On</text>
  <text x="674" y="306" text-anchor="middle" font-size="15" font-weight="700" fill="#4A9EFF">On</text>

  <!-- Row 3: RT Resolution -->
  <line x1="40" y1="338" x2="760" y2="338" stroke="currentColor" stroke-width="1" opacity="0.10"/>
  <text x="40" y="366" font-size="14" font-weight="600" fill="currentColor">RT Resolution</text>
  <text x="40" y="384" font-size="11" fill="currentColor" opacity="0.5">resolution_scale</text>
  <text x="306" y="372" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor" opacity="0.45">&#183;</text>
  <text x="490" y="372" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor">1:2</text>
  <text x="674" y="372" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor">1:1</text>

  <!-- Row 4: Shadow Rays -->
  <line x1="40" y1="404" x2="760" y2="404" stroke="currentColor" stroke-width="1" opacity="0.10"/>
  <text x="40" y="432" font-size="14" font-weight="600" fill="currentColor">Shadow Rays</text>
  <text x="40" y="450" font-size="11" fill="currentColor" opacity="0.5">shadow_ray_count</text>
  <text x="306" y="438" text-anchor="middle" font-size="20" font-weight="700" fill="currentColor">1</text>
  <text x="490" y="438" text-anchor="middle" font-size="20" font-weight="700" fill="currentColor">2</text>
  <text x="674" y="438" text-anchor="middle" font-size="20" font-weight="700" fill="currentColor">4</text>

  <!-- Row 5: Shadow Steps -->
  <line x1="40" y1="470" x2="760" y2="470" stroke="currentColor" stroke-width="1" opacity="0.10"/>
  <text x="40" y="498" font-size="14" font-weight="600" fill="currentColor">Shadow Steps</text>
  <text x="40" y="516" font-size="11" fill="currentColor" opacity="0.5">shadow_step_count</text>
  <text x="306" y="504" text-anchor="middle" font-size="20" font-weight="700" fill="currentColor">2</text>
  <text x="490" y="504" text-anchor="middle" font-size="20" font-weight="700" fill="currentColor">6</text>
  <text x="674" y="504" text-anchor="middle" font-size="20" font-weight="700" fill="currentColor">12</text>

  <!-- Row 6: Fast GI -->
  <line x1="40" y1="536" x2="760" y2="536" stroke="currentColor" stroke-width="1" opacity="0.10"/>
  <text x="40" y="564" font-size="14" font-weight="600" fill="currentColor">Fast GI</text>
  <text x="40" y="582" font-size="11" fill="currentColor" opacity="0.5">use_fast_gi</text>
  <text x="306" y="570" text-anchor="middle" font-size="15" font-weight="700" fill="#4ADE80">On</text>
  <text x="490" y="570" text-anchor="middle" font-size="15" font-weight="700" fill="#FF6B00">On</text>
  <text x="674" y="570" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor" opacity="0.55">Off (full GI)</text>

  <!-- Footer tip Variant B (dense position) -->
  <rect x="40" y="641" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Start in Draft to block out lighting, then switch to Production once the look holds.</text>
</svg>
