<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" color="#222" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" role="img" aria-labelledby="mod49-t mod49-d">
  <title id="mod49-t">Modular Modelling: Build One Master, Instance the Rest</title>
  <desc id="mod49-d">One carefully-built master window is arrayed and instanced into a full facade grid, with small per-copy variation added so the repeated element reads as a real building rather than an obvious copy-paste.</desc>
  <rect x="0" y="0" width="760" height="380" fill="none"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="currentColor">Modular Modelling &#8212; Build Once, Use Everywhere</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#8a8f98">Model one window well, then let instancing do the repetition</text>

  <!-- master -->
  <text x="120" y="94" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FF6B00">1 &#183; MASTER</text>
  <g stroke="#FF6B00" stroke-width="2.5" fill="#1a1a1a">
    <rect x="82" y="108" width="76" height="100" rx="3"/>
  </g>
  <g stroke="#FF6B00" stroke-width="1.2">
    <line x1="120" y1="108" x2="120" y2="208"/>
    <line x1="82" y1="158" x2="158" y2="158"/>
  </g>
  <text x="120" y="230" text-anchor="middle" font-size="11" fill="#8a8f98">bevels, frame,</text>
  <text x="120" y="244" text-anchor="middle" font-size="11" fill="#8a8f98">glass, sill</text>

  <!-- arrow 1 -->
  <defs><marker id="mod49-a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8a8f98"/></marker></defs>
  <line x1="176" y1="158" x2="222" y2="158" stroke="#8a8f98" stroke-width="2" marker-end="url(#mod49-a)"/>
  <text x="199" y="148" text-anchor="middle" font-size="10.5" fill="#8a8f98">array</text>

  <!-- instanced row -->
  <text x="330" y="94" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4A9EFF">2 &#183; INSTANCE</text>
  <g stroke="#4A9EFF" stroke-width="1.5" fill="#1a1a1a">
    <rect x="248" y="120" width="46" height="62" rx="2"/>
    <rect x="304" y="120" width="46" height="62" rx="2"/>
    <rect x="360" y="120" width="46" height="62" rx="2"/>
  </g>
  <g stroke="#4A9EFF" stroke-width="0.8" opacity="0.7">
    <line x1="271" y1="120" x2="271" y2="182"/><line x1="248" y1="151" x2="294" y2="151"/>
    <line x1="327" y1="120" x2="327" y2="182"/><line x1="304" y1="151" x2="350" y2="151"/>
    <line x1="383" y1="120" x2="383" y2="182"/><line x1="360" y1="151" x2="406" y2="151"/>
  </g>
  <text x="327" y="204" text-anchor="middle" font-size="11" fill="#8a8f98">one mesh, many copies &#8212; edit once, all update</text>

  <!-- arrow 2 -->
  <line x1="424" y1="158" x2="470" y2="158" stroke="#8a8f98" stroke-width="2" marker-end="url(#mod49-a)"/>
  <text x="447" y="148" text-anchor="middle" font-size="10.5" fill="#8a8f98">grid</text>

  <!-- facade grid -->
  <text x="600" y="94" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4ADE80">3 &#183; FACADE</text>
  <g stroke="#4ADE80" stroke-width="1.1" fill="#1a1a1a">
    <rect x="512" y="112" width="26" height="34" rx="1"/><rect x="548" y="112" width="26" height="34" rx="1"/><rect x="584" y="112" width="26" height="34" rx="1"/><rect x="620" y="112" width="26" height="34" rx="1"/><rect x="656" y="112" width="26" height="34" rx="1"/>
    <rect x="512" y="156" width="26" height="34" rx="1"/><rect x="548" y="156" width="26" height="34" rx="1"/><rect x="584" y="156" width="26" height="34" rx="1"/><rect x="620" y="156" width="26" height="34" rx="1"/><rect x="656" y="156" width="26" height="34" rx="1"/>
    <rect x="512" y="200" width="26" height="34" rx="1"/><rect x="548" y="200" width="26" height="34" rx="1"/><rect x="584" y="200" width="26" height="34" rx="1"/><rect x="620" y="200" width="26" height="34" rx="1"/><rect x="656" y="200" width="26" height="34" rx="1"/>
  </g>
  <text x="597" y="256" text-anchor="middle" font-size="11" fill="#8a8f98">tileable in seconds</text>

  <!-- variation callout -->
  <rect x="90" y="292" width="580" height="66" rx="9" fill="#1a1a1a"/>
  <text x="112" y="318" font-size="13.5" font-weight="700" fill="#F5C242">Break the pattern</text>
  <text x="112" y="340" font-size="13" fill="#c9ccd1">Nudge a few copies &#8212; a blind here, a cracked pane there, slight rotation &#8212; and the</text>
  <text x="112" y="356" font-size="13" fill="#c9ccd1">grid stops looking cloned and starts looking lived-in.</text>
</svg>
