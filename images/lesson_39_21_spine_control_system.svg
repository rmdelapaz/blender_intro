<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="scs-title scs-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="scs-title">Spine Control System Overview</title>
  <desc id="scs-desc">Vertical control hierarchy for the COG and Chest spine rig: a ground Root master parents the COG center-of-gravity control, which feeds three middle spine mechanism bones that blend between COG and Chest, topped by the Chest control for the upper body.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">SPINE CONTROL SYSTEM</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Root · COG · Spine blend · Chest hierarchy</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <text x="40" y="138" font-size="18" font-weight="600" fill="currentColor">Control hierarchy · ground to upper body</text>

  <g stroke="currentColor" stroke-width="1.5" opacity="0.3" stroke-linecap="round" fill="none">
    <line x1="170" y1="196" x2="170" y2="232"/>
    <line x1="170" y1="280" x2="170" y2="316"/>
    <line x1="170" y1="424" x2="170" y2="460"/>
  </g>

  <!-- Root -->
  <circle cx="170" cy="182" r="14" fill="none" stroke="#FF6B00" stroke-width="3"/>
  <text x="200" y="180" font-size="15" font-weight="600" fill="currentColor">Root</text>
  <text x="200" y="198" font-size="13" fill="#FF6B00" opacity="0.9">Moves the entire character</text>
  <text x="470" y="186" font-size="13" fill="currentColor" opacity="0.6">Master · world space</text>

  <!-- COG -->
  <circle cx="170" cy="266" r="14" fill="none" stroke="#4ADE80" stroke-width="3"/>
  <text x="200" y="264" font-size="15" font-weight="600" fill="currentColor">COG</text>
  <text x="200" y="282" font-size="13" fill="#4ADE80" opacity="0.9">Hips and weight · base of the spine</text>
  <text x="470" y="270" font-size="13" fill="currentColor" opacity="0.6">CTRL · center of gravity</text>

  <!-- Spine blend block: 3 MCH segments -->
  <rect x="120" y="311" width="100" height="26" rx="5" fill="none" stroke="#2196F3" stroke-width="2"/>
  <text x="170" y="329" font-size="13" font-weight="500" fill="currentColor" text-anchor="middle">spine_03</text>
  <text x="240" y="329" font-size="12" fill="#2196F3" opacity="0.9">Chest 100%</text>
  <rect x="120" y="347" width="100" height="26" rx="5" fill="none" stroke="#2196F3" stroke-width="2"/>
  <text x="170" y="365" font-size="13" font-weight="500" fill="currentColor" text-anchor="middle">spine_02</text>
  <text x="240" y="365" font-size="12" fill="#2196F3" opacity="0.9">~50 / 50</text>
  <rect x="120" y="383" width="100" height="26" rx="5" fill="none" stroke="#2196F3" stroke-width="2"/>
  <text x="170" y="401" font-size="13" font-weight="500" fill="currentColor" text-anchor="middle">spine_01</text>
  <text x="240" y="401" font-size="12" fill="#2196F3" opacity="0.9">COG 100%</text>
  <text x="470" y="362" font-size="13" fill="currentColor" opacity="0.6">MCH · middle bones interpolate</text>
  <text x="470" y="380" font-size="13" fill="currentColor" opacity="0.6">between COG and Chest influence</text>

  <!-- Chest -->
  <circle cx="170" cy="450" r="14" fill="none" stroke="#4ADE80" stroke-width="3"/>
  <text x="200" y="448" font-size="15" font-weight="600" fill="currentColor">Chest</text>
  <text x="200" y="466" font-size="13" fill="#4ADE80" opacity="0.9">Shoulders and ribcage · twist and lean</text>
  <text x="470" y="454" font-size="13" fill="currentColor" opacity="0.6">CTRL · upper body</text>

  <!-- Footer tip Variant B -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> The COG drives the base of the spine and the Chest drives the top; the middle bones blend between them so the torso bends smoothly.</text>
</svg>
