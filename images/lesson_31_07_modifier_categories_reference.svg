<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="mcr-title mcr-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="mcr-title">Modifier categories reference</title>
  <desc id="mcr-desc">A two-by-two grid of Blender's four modifier categories. Modify adjusts existing geometry data. Generate creates new geometry. Deform moves vertices without adding geometry. Physics drives simulations. Each quadrant lists representative modifiers.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Modifier categories</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Blender groups modifiers into four families</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Quadrant geometry: two columns x=40 / x=412, width 348; two rows y=138 / y=336, height 178 -->

  <!-- MODIFY (top-left) -->
  <rect x="40" y="138" width="348" height="178" rx="8" fill="currentColor" opacity="0.05"/>
  <rect x="40" y="138" width="348" height="178" rx="8" fill="none" stroke="#4A9EFF" stroke-width="2"/>
  <rect x="40" y="138" width="348" height="34" rx="8" fill="#4A9EFF"/>
  <rect x="40" y="156" width="348" height="16" fill="#4A9EFF"/>
  <text x="60" y="161" font-size="16" font-weight="700" fill="#fff">MODIFY</text>
  <text x="60" y="198" font-size="13" font-weight="600" fill="currentColor" opacity="0.7">Adjusts existing geometry data</text>
  <text x="60" y="226" font-size="14" fill="currentColor">Data Transfer</text>
  <text x="60" y="250" font-size="14" fill="currentColor">Normal Edit</text>
  <text x="60" y="274" font-size="14" fill="currentColor">UV Warp</text>
  <text x="60" y="298" font-size="14" fill="currentColor">Weighted Normal</text>

  <!-- GENERATE (top-right) -->
  <rect x="412" y="138" width="348" height="178" rx="8" fill="currentColor" opacity="0.05"/>
  <rect x="412" y="138" width="348" height="178" rx="8" fill="none" stroke="#FF6B00" stroke-width="2"/>
  <rect x="412" y="138" width="348" height="34" rx="8" fill="#FF6B00"/>
  <rect x="412" y="156" width="348" height="16" fill="#FF6B00"/>
  <text x="432" y="161" font-size="16" font-weight="700" fill="#fff">GENERATE</text>
  <text x="432" y="198" font-size="13" font-weight="600" fill="currentColor" opacity="0.7">Creates new geometry</text>
  <text x="432" y="226" font-size="14" fill="currentColor">Array</text>
  <text x="432" y="250" font-size="14" fill="currentColor">Mirror</text>
  <text x="432" y="274" font-size="14" fill="currentColor">Boolean</text>
  <text x="432" y="298" font-size="14" fill="currentColor">Subdivision Surface</text>

  <!-- DEFORM (bottom-left) -->
  <rect x="40" y="336" width="348" height="178" rx="8" fill="currentColor" opacity="0.05"/>
  <rect x="40" y="336" width="348" height="178" rx="8" fill="none" stroke="#4ADE80" stroke-width="2"/>
  <rect x="40" y="336" width="348" height="34" rx="8" fill="#4ADE80"/>
  <rect x="40" y="354" width="348" height="16" fill="#4ADE80"/>
  <text x="60" y="359" font-size="16" font-weight="700" fill="#0f1a14">DEFORM</text>
  <text x="60" y="396" font-size="13" font-weight="600" fill="currentColor" opacity="0.7">Moves vertices, adds no geometry</text>
  <text x="60" y="424" font-size="14" fill="currentColor">Curve</text>
  <text x="60" y="448" font-size="14" fill="currentColor">Lattice</text>
  <text x="60" y="472" font-size="14" fill="currentColor">Shrinkwrap</text>
  <text x="60" y="496" font-size="14" fill="currentColor">Simple Deform</text>

  <!-- PHYSICS (bottom-right) -->
  <rect x="412" y="336" width="348" height="178" rx="8" fill="currentColor" opacity="0.05"/>
  <rect x="412" y="336" width="348" height="178" rx="8" fill="none" stroke="#E63946" stroke-width="2"/>
  <rect x="412" y="336" width="348" height="34" rx="8" fill="#E63946"/>
  <rect x="412" y="354" width="348" height="16" fill="#E63946"/>
  <text x="432" y="359" font-size="16" font-weight="700" fill="#fff">PHYSICS</text>
  <text x="432" y="396" font-size="13" font-weight="600" fill="currentColor" opacity="0.7">Simulation-driven results</text>
  <text x="432" y="424" font-size="14" fill="currentColor">Cloth</text>
  <text x="432" y="448" font-size="14" fill="currentColor">Soft Body</text>
  <text x="432" y="472" font-size="14" fill="currentColor">Fluid</text>
  <text x="432" y="496" font-size="14" fill="currentColor">Collision</text>

  <!-- Footer tip -->
  <rect x="40" y="526" width="720" height="28" rx="0" fill="none"/>
  <rect x="40" y="526" width="4" height="28" fill="#FF6B00"/>
  <text x="58" y="545" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> The category tabs in the Add Modifier menu follow this same grouping.
  </text>
</svg>
