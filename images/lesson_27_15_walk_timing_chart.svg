<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="tc-title tc-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="tc-title">Walk cycle timing chart: a 24-frame cycle with four key poses</title>
  <desc id="tc-desc">A frame timeline from frame 1 to frame 25 showing one full walk cycle at 24 frames per second. The cycle divides into four phases of three frames each, then repeats for the opposite leg. Key poses fall at fixed frames: Contact at 1 and 13, Down at 4 and 16, Passing at 7 and 19, Up at 10 and 22, returning to Contact at 25. The first half steps with the left leg, the second half with the right.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Walk Cycle Timing Chart</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">A standard cycle is 24 frames &#183; one second at 24 fps</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Phase legend -->
  <g font-size="12" fill="currentColor">
    <rect x="40" y="126" width="12" height="12" rx="2" fill="#FF6B00"/>
    <text x="58" y="136" opacity="0.75">Contact &#8594; Down</text>
    <rect x="170" y="126" width="12" height="12" rx="2" fill="#B47EE8"/>
    <text x="188" y="136" opacity="0.75">Down &#8594; Passing</text>
    <rect x="300" y="126" width="12" height="12" rx="2" fill="#FF7EA8"/>
    <text x="318" y="136" opacity="0.75">Passing &#8594; Up</text>
    <rect x="424" y="126" width="12" height="12" rx="2" fill="#4A9EFF"/>
    <text x="442" y="136" opacity="0.75">Up &#8594; Contact</text>
  </g>

  <!-- ============ HALF 1 (frames 1-13, LEFT leg lead) ============ -->
  <text x="40" y="180" font-size="14" font-weight="600" fill="currentColor">First half &#183; left leg steps</text>

  <!-- Timeline track geometry: x maps frame 1..13 across x=70..730 -->
  <!-- zone bars y=196 h=22 -->
  <rect x="70"  y="196" width="165" height="22" rx="3" fill="#FF6B00" opacity="0.85"/>
  <rect x="235" y="196" width="165" height="22" rx="3" fill="#B47EE8" opacity="0.85"/>
  <rect x="400" y="196" width="165" height="22" rx="3" fill="#FF7EA8" opacity="0.85"/>
  <rect x="565" y="196" width="165" height="22" rx="3" fill="#4A9EFF" opacity="0.85"/>

  <!-- frame ticks + numbers for key frames 1,4,7,10,13 -->
  <g stroke="currentColor" stroke-width="1.5" opacity="0.4">
    <line x1="70" y1="218" x2="70" y2="232"/>
    <line x1="235" y1="218" x2="235" y2="232"/>
    <line x1="400" y1="218" x2="400" y2="232"/>
    <line x1="565" y1="218" x2="565" y2="232"/>
    <line x1="730" y1="218" x2="730" y2="232"/>
  </g>
  <g font-size="12" fill="currentColor" opacity="0.7" text-anchor="middle">
    <text x="70" y="248">F1</text>
    <text x="235" y="248">F4</text>
    <text x="400" y="248">F7</text>
    <text x="565" y="248">F10</text>
    <text x="730" y="248">F13</text>
  </g>

  <!-- key-pose markers (circles) + mini silhouettes above -->
  <g>
    <!-- F1 Contact -->
    <circle cx="70" cy="196" r="9" fill="currentColor"/>
    <text x="70" y="300" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">Contact</text>
    <!-- F4 Down -->
    <circle cx="235" cy="196" r="9" fill="currentColor"/>
    <text x="235" y="300" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">Down</text>
    <!-- F7 Passing -->
    <circle cx="400" cy="196" r="9" fill="currentColor"/>
    <text x="400" y="300" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">Passing</text>
    <!-- F10 Up -->
    <circle cx="565" cy="196" r="9" fill="currentColor"/>
    <text x="565" y="300" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">Up</text>
    <!-- F13 Contact -->
    <circle cx="730" cy="196" r="9" fill="currentColor"/>
    <text x="730" y="300" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">Contact</text>
  </g>

  <!-- mini pose silhouettes (simple, currentColor) above the track at y~262 -->
  <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- F1 contact: legs spread V -->
    <g transform="translate(70,258)"><circle cx="0" cy="-14" r="5" fill="currentColor" stroke="none"/><path d="M0 -9 L0 6"/><path d="M0 6 L-9 20"/><path d="M0 6 L9 20"/><path d="M0 -4 L-8 4"/><path d="M0 -4 L8 4"/></g>
    <!-- F4 down: compressed -->
    <g transform="translate(235,260)"><circle cx="0" cy="-12" r="5" fill="currentColor" stroke="none"/><path d="M0 -7 L0 5"/><path d="M0 5 L-7 18"/><path d="M0 5 L6 17"/><path d="M0 -3 L-7 3"/><path d="M0 -3 L7 3"/></g>
    <!-- F7 passing: tall, one knee up -->
    <g transform="translate(400,256)"><circle cx="0" cy="-16" r="5" fill="currentColor" stroke="none"/><path d="M0 -11 L0 6"/><path d="M0 6 L-2 22"/><path d="M0 6 L8 14 L6 22"/><path d="M0 -6 L-7 2"/><path d="M0 -6 L7 2"/></g>
    <!-- F10 up: extending -->
    <g transform="translate(565,256)"><circle cx="0" cy="-16" r="5" fill="currentColor" stroke="none"/><path d="M0 -11 L0 6"/><path d="M0 6 L-8 20"/><path d="M0 6 L7 19"/><path d="M0 -6 L-8 1"/><path d="M0 -6 L8 1"/></g>
    <!-- F13 contact -->
    <g transform="translate(730,258)"><circle cx="0" cy="-14" r="5" fill="currentColor" stroke="none"/><path d="M0 -9 L0 6"/><path d="M0 6 L-9 20"/><path d="M0 6 L9 20"/><path d="M0 -4 L-8 4"/><path d="M0 -4 L8 4"/></g>
  </g>

  <!-- ============ HALF 2 (frames 13-25, RIGHT leg lead) ============ -->
  <text x="40" y="350" font-size="14" font-weight="600" fill="currentColor">Second half &#183; right leg steps</text>

  <rect x="70"  y="366" width="165" height="22" rx="3" fill="#FF6B00" opacity="0.55"/>
  <rect x="235" y="366" width="165" height="22" rx="3" fill="#B47EE8" opacity="0.55"/>
  <rect x="400" y="366" width="165" height="22" rx="3" fill="#FF7EA8" opacity="0.55"/>
  <rect x="565" y="366" width="165" height="22" rx="3" fill="#4A9EFF" opacity="0.55"/>

  <g stroke="currentColor" stroke-width="1.5" opacity="0.4">
    <line x1="70" y1="388" x2="70" y2="402"/>
    <line x1="235" y1="388" x2="235" y2="402"/>
    <line x1="400" y1="388" x2="400" y2="402"/>
    <line x1="565" y1="388" x2="565" y2="402"/>
    <line x1="730" y1="388" x2="730" y2="402"/>
  </g>
  <g font-size="12" fill="currentColor" opacity="0.7" text-anchor="middle">
    <text x="70" y="418">F13</text>
    <text x="235" y="418">F16</text>
    <text x="400" y="418">F19</text>
    <text x="565" y="418">F22</text>
    <text x="730" y="418">F25</text>
  </g>

  <g>
    <circle cx="70" cy="366" r="9" fill="currentColor"/>
    <text x="70" y="470" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">Contact</text>
    <circle cx="235" cy="366" r="9" fill="currentColor"/>
    <text x="235" y="470" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">Down</text>
    <circle cx="400" cy="366" r="9" fill="currentColor"/>
    <text x="400" y="470" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">Passing</text>
    <circle cx="565" cy="366" r="9" fill="currentColor"/>
    <text x="565" y="470" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">Up</text>
    <circle cx="730" cy="366" r="9" fill="currentColor"/>
    <text x="730" y="470" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">Contact</text>
  </g>

  <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(70,428)"><circle cx="0" cy="-14" r="5" fill="currentColor" stroke="none"/><path d="M0 -9 L0 6"/><path d="M0 6 L-9 20"/><path d="M0 6 L9 20"/><path d="M0 -4 L-8 4"/><path d="M0 -4 L8 4"/></g>
    <g transform="translate(235,430)"><circle cx="0" cy="-12" r="5" fill="currentColor" stroke="none"/><path d="M0 -7 L0 5"/><path d="M0 5 L-6 17"/><path d="M0 5 L7 18"/><path d="M0 -3 L-7 3"/><path d="M0 -3 L7 3"/></g>
    <g transform="translate(400,426)"><circle cx="0" cy="-16" r="5" fill="currentColor" stroke="none"/><path d="M0 -11 L0 6"/><path d="M0 6 L2 22"/><path d="M0 6 L-8 14 L-6 22"/><path d="M0 -6 L-7 2"/><path d="M0 -6 L7 2"/></g>
    <g transform="translate(565,426)"><circle cx="0" cy="-16" r="5" fill="currentColor" stroke="none"/><path d="M0 -11 L0 6"/><path d="M0 6 L-7 19"/><path d="M0 6 L8 20"/><path d="M0 -6 L-8 1"/><path d="M0 -6 L8 1"/></g>
    <g transform="translate(730,428)"><circle cx="0" cy="-14" r="5" fill="currentColor" stroke="none"/><path d="M0 -9 L0 6"/><path d="M0 6 L-9 20"/><path d="M0 6 L9 20"/><path d="M0 -4 L-8 4"/><path d="M0 -4 L8 4"/></g>
  </g>

  <!-- Summary band -->
  <line x1="40" y1="500" x2="760" y2="500" stroke="currentColor" stroke-width="1" opacity="0.15"/>
  <text x="40" y="528" font-size="13" font-weight="600" fill="currentColor">Key poses land on fixed frames</text>
  <text x="40" y="550" font-size="13" fill="currentColor" opacity="0.7">Contact F1 / F13 / F25 &#183; Down F4 / F16 &#183; Passing F7 / F19 &#183; Up F10 / F22</text>
  <text x="40" y="572" font-size="13" fill="currentColor" opacity="0.7">Each phase spans 3 frames &#183; the second half mirrors the first with the opposite leg.</text>

  <!-- Footer tip (Variant B, left rail, dense y) -->
  <rect x="40" y="641" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Block the four key poses first, then add Down and Up as breakdowns &#183; timing comes before detail.
  </text>
</svg>
