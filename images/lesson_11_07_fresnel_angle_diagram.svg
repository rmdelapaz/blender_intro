<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="fa-title fa-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="fa-title">Fresnel reflection by viewing angle</title>
  <desc id="fa-desc">A flat surface viewed from three angles. At a perpendicular zero degree view only about four percent of light reflects and ninety six percent enters the material. At forty five degrees about fifteen percent reflects and eighty five percent enters. At an eighty five degree grazing angle one hundred percent reflects and none enters, showing that reflection rises sharply as the viewing angle approaches grazing.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Fresnel: Reflection vs Viewing Angle</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Reflection rises as the view approaches a grazing angle</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Surface plane at y=400, normal pointing up -->
  <rect x="120" y="400" width="560" height="64" rx="4" fill="currentColor" opacity="0.10"/>
  <line x1="120" y1="400" x2="680" y2="400" stroke="currentColor" stroke-width="2.5" opacity="0.55"/>
  <text x="672" y="438" font-size="13" text-anchor="end" fill="currentColor" opacity="0.6">Material surface</text>
  <!-- surface normal (dashed) at the contact point x=400 -->
  <line x1="400" y1="400" x2="400" y2="150" stroke="currentColor" stroke-width="1.2" opacity="0.3" stroke-dasharray="5 6"/>
  <text x="408" y="162" font-size="12" fill="currentColor" opacity="0.45">Normal</text>

  <!-- contact point -->
  <circle cx="400" cy="400" r="4" fill="#FF6B00"/>

  <!-- Ray 1: 0 degrees (perpendicular) -->
  <line x1="400" y1="150" x2="400" y2="400" stroke="#F4C430" stroke-width="3" opacity="0.9" marker-end="url(#fa-incoming)"/>
  <line x1="400" y1="400" x2="372" y2="168" stroke="#FF6B00" stroke-width="1.5" marker-end="url(#fa-reflect)"/>
  <line x1="400" y1="400" x2="400" y2="468" stroke="#4F9DDE" stroke-width="7" marker-end="url(#fa-transmit)"/>
  <text x="300" y="250" font-size="14" font-weight="600" fill="currentColor">0&#176; view</text>
  <text x="300" y="270" font-size="12" fill="#FF6B00">4% reflected</text>
  <text x="300" y="288" font-size="12" fill="#4F9DDE">96% enters</text>

  <!-- Ray 2: 45 degrees -->
  <line x1="170" y1="170" x2="400" y2="400" stroke="#F4C430" stroke-width="3" opacity="0.9" marker-end="url(#fa-incoming)"/>
  <line x1="400" y1="400" x2="560" y2="240" stroke="#FF6B00" stroke-width="3" marker-end="url(#fa-reflect)"/>
  <line x1="400" y1="400" x2="498" y2="466" stroke="#4F9DDE" stroke-width="6" marker-end="url(#fa-transmit)"/>
  <text x="150" y="150" font-size="14" font-weight="600" fill="currentColor">45&#176; view</text>
  <text x="566" y="232" font-size="12" fill="#FF6B00">15% reflected</text>
  <text x="512" y="460" font-size="12" fill="#4F9DDE">85% enters</text>

  <!-- Ray 3: 85 degrees (grazing) -->
  <line x1="130" y1="372" x2="400" y2="400" stroke="#F4C430" stroke-width="3" opacity="0.9" marker-end="url(#fa-incoming)"/>
  <line x1="400" y1="400" x2="670" y2="372" stroke="#FF6B00" stroke-width="7" marker-end="url(#fa-reflect)"/>
  <line x1="400" y1="400" x2="412" y2="436" stroke="#4F9DDE" stroke-width="1.5" opacity="0.35"/>
  <text x="120" y="348" font-size="14" font-weight="600" fill="currentColor">85&#176; grazing</text>
  <text x="500" y="352" font-size="12" font-weight="700" fill="#FF6B00">100% reflected</text>
  <text x="430" y="452" font-size="12" fill="#4F9DDE" opacity="0.55">0% enters</text>

  <!-- Legend -->
  <rect x="40" y="486" width="720" height="54" rx="6" fill="currentColor" opacity="0.04"/>
  <line x1="62" y1="506" x2="100" y2="506" stroke="#F4C430" stroke-width="3"/>
  <text x="108" y="510" font-size="13" fill="currentColor">Incoming light</text>
  <line x1="250" y1="506" x2="288" y2="506" stroke="#FF6B00" stroke-width="3"/>
  <text x="296" y="510" font-size="13" fill="currentColor">Reflected (line weight = energy)</text>
  <line x1="566" y1="506" x2="604" y2="506" stroke="#4F9DDE" stroke-width="5"/>
  <text x="612" y="510" font-size="13" fill="currentColor">Transmitted</text>
  <text x="62" y="532" font-size="12" fill="currentColor" opacity="0.6">Reflection climbs from 4% head-on to 100% at the grazing angle &#183; all materials become mirror-like at the edge.</text>

  <defs>
    <marker id="fa-incoming" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#F4C430"/></marker>
    <marker id="fa-reflect" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#FF6B00"/></marker>
    <marker id="fa-transmit" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4F9DDE"/></marker>
  </defs>
</svg>
