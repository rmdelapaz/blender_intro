<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580" role="img" aria-labelledby="snTitle snDesc" fill="none" style="max-width:100%;height:auto;color:currentColor">
  <title id="snTitle">Snapping system overview</title>
  <desc id="snDesc">An infographic of Blender snapping modes: Increment, Vertex, Edge, Face, and Volume, each with an icon and a short description.</desc>
  <style>
    .sn-card{stroke:currentColor;stroke-width:1.5;fill:currentColor;fill-opacity:.04;rx:10}
    .sn-icon{stroke:currentColor;stroke-width:1.8;fill:none}
    .sn-fill{fill:currentColor}
    .sn-name{font:700 16px system-ui,Arial,sans-serif;fill:currentColor}
    .sn-desc{font:400 12px system-ui,Arial,sans-serif;fill:currentColor;opacity:.72}
    .sn-hd{font:600 13px system-ui,Arial,sans-serif;fill:currentColor;opacity:.85}
  </style>

  <text class="sn-hd" x="380" y="32" text-anchor="middle">Snap modes &#8212; hold Ctrl, or toggle the magnet, to snap while transforming</text>

  <!-- Card template: 350x96 -->
  <!-- INCREMENT -->
  <g transform="translate(30,56)">
    <rect class="sn-card" x="0" y="0" width="700" height="92" rx="10"/>
    <g transform="translate(34,22)">
      <line class="sn-icon" x1="0" y1="48" x2="48" y2="48"/>
      <line class="sn-icon" x1="0" y1="42" x2="0" y2="54"/>
      <line class="sn-icon" x1="16" y1="44" x2="16" y2="52"/>
      <line class="sn-icon" x1="32" y1="44" x2="32" y2="52"/>
      <line class="sn-icon" x1="48" y1="42" x2="48" y2="54"/>
    </g>
    <text class="sn-name" x="108" y="40">Increment</text>
    <text class="sn-desc" x="108" y="62">Snaps to grid units &#8212; clean steps like 0.1, 0.5, 1.0</text>
  </g>

  <!-- VERTEX -->
  <g transform="translate(30,156)">
    <rect class="sn-card" x="0" y="0" width="700" height="92" rx="10"/>
    <g transform="translate(34,22)">
      <path class="sn-icon" d="M4,48 L24,8 L44,48 Z"/>
      <circle class="sn-fill" cx="24" cy="8" r="5"/>
    </g>
    <text class="sn-name" x="108" y="40">Vertex</text>
    <text class="sn-desc" x="108" y="62">Snaps to the nearest vertex point &#8212; exact corner alignment</text>
  </g>

  <!-- EDGE -->
  <g transform="translate(30,256)">
    <rect class="sn-card" x="0" y="0" width="700" height="92" rx="10"/>
    <g transform="translate(34,22)">
      <path class="sn-icon" d="M4,48 L24,8 L44,48 Z"/>
      <line class="sn-icon" x1="24" y1="8" x2="44" y2="48" stroke-width="3.4"/>
    </g>
    <text class="sn-name" x="108" y="40">Edge</text>
    <text class="sn-desc" x="108" y="62">Snaps to the nearest edge &#8212; slide along or onto a span</text>
  </g>

  <!-- FACE -->
  <g transform="translate(30,356)">
    <rect class="sn-card" x="0" y="0" width="700" height="92" rx="10"/>
    <g transform="translate(34,22)">
      <path class="sn-icon" d="M4,48 L24,8 L44,48 Z"/>
      <path class="sn-fill" d="M4,48 L24,8 L44,48 Z" opacity=".22"/>
    </g>
    <text class="sn-name" x="108" y="40">Face</text>
    <text class="sn-desc" x="108" y="62">Snaps onto face surfaces &#8212; drop objects flush against a plane</text>
  </g>

  <!-- VOLUME -->
  <g transform="translate(30,456)">
    <rect class="sn-card" x="0" y="0" width="700" height="92" rx="10"/>
    <g transform="translate(30,18)">
      <path class="sn-icon" d="M8,18 L28,8 L48,18 L48,44 L28,54 L8,44 Z"/>
      <path class="sn-icon" d="M8,18 L28,28 L48,18 M28,28 L28,54"/>
      <circle class="sn-fill" cx="28" cy="28" r="4"/>
    </g>
    <text class="sn-name" x="108" y="40">Volume</text>
    <text class="sn-desc" x="108" y="62">Snaps inside a mesh volume &#8212; centers within solid geometry</text>
  </g>
</svg>
