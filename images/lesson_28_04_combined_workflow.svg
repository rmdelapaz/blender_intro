<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cw-title cw-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="cw-title">Combined character-creation workflow</title>
  <desc id="cw-desc">Five sequential stages alternating between polygon modeling and sculpting: block out form, sculpt details, retopology, bake details, rig and animate.</desc>
  <defs>
    <marker id="cw-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="2" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

    <text x="380" y="30" text-anchor="middle" fill="currentColor" stroke="none" font-size="15" font-weight="700">Character creation: sculpting AND polygon modeling</text>

    <!-- method legend -->
    <g font-size="11.5">
      <rect x="232" y="46" width="14" height="14" rx="3" stroke-width="1.6"/>
      <text x="252" y="58" fill="currentColor" stroke="none">Polygon modeling</text>
      <rect x="404" y="46" width="14" height="14" rx="3" stroke-width="1.6" stroke-dasharray="3 2"/>
      <text x="424" y="58" fill="currentColor" stroke="none">Sculpting</text>
    </g>

    <!-- 5 stage nodes -->
    <g font-size="12">
      <!-- 1 block out: polygon -->
      <g>
        <rect x="20" y="92" width="128" height="92" rx="11" stroke-width="2"/>
        <circle cx="40" cy="112" r="11" stroke-width="1.6"/>
        <text x="40" y="116" text-anchor="middle" fill="currentColor" stroke="none" font-size="11" font-weight="700">1</text>
        <text x="84" y="138" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">Block out</text>
        <text x="84" y="155" text-anchor="middle" fill="currentColor" stroke="none" font-size="10.5" opacity="0.72">basic body</text>
        <text x="84" y="169" text-anchor="middle" fill="currentColor" stroke="none" font-size="10.5" opacity="0.72">shape</text>
      </g>
      <!-- 2 sculpt: sculpting (dashed) -->
      <g>
        <rect x="168" y="92" width="128" height="92" rx="11" stroke-width="2" stroke-dasharray="3 2"/>
        <circle cx="188" cy="112" r="11" stroke-width="1.6"/>
        <text x="188" y="116" text-anchor="middle" fill="currentColor" stroke="none" font-size="11" font-weight="700">2</text>
        <text x="232" y="138" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">Sculpt</text>
        <text x="232" y="155" text-anchor="middle" fill="currentColor" stroke="none" font-size="10.5" opacity="0.72">muscles, wrinkles,</text>
        <text x="232" y="169" text-anchor="middle" fill="currentColor" stroke="none" font-size="10.5" opacity="0.72">facial features</text>
      </g>
      <!-- 3 retopo: polygon -->
      <g>
        <rect x="316" y="92" width="128" height="92" rx="11" stroke-width="2"/>
        <circle cx="336" cy="112" r="11" stroke-width="1.6"/>
        <text x="336" y="116" text-anchor="middle" fill="currentColor" stroke="none" font-size="11" font-weight="700">3</text>
        <text x="380" y="138" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">Retopology</text>
        <text x="380" y="155" text-anchor="middle" fill="currentColor" stroke="none" font-size="10.5" opacity="0.72">clean mesh</text>
        <text x="380" y="169" text-anchor="middle" fill="currentColor" stroke="none" font-size="10.5" opacity="0.72">over sculpt</text>
      </g>
      <!-- 4 bake: bridge (dashed+solid) -->
      <g>
        <rect x="464" y="92" width="128" height="92" rx="11" stroke-width="2"/>
        <circle cx="484" cy="112" r="11" stroke-width="1.6"/>
        <text x="484" y="116" text-anchor="middle" fill="currentColor" stroke="none" font-size="11" font-weight="700">4</text>
        <text x="528" y="138" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">Bake detail</text>
        <text x="528" y="155" text-anchor="middle" fill="currentColor" stroke="none" font-size="10.5" opacity="0.72">to low-poly via</text>
        <text x="528" y="169" text-anchor="middle" fill="currentColor" stroke="none" font-size="10.5" opacity="0.72">normal maps</text>
      </g>
      <!-- 5 rig: polygon -->
      <g>
        <rect x="612" y="92" width="128" height="92" rx="11" stroke-width="2"/>
        <circle cx="632" cy="112" r="11" stroke-width="1.6"/>
        <text x="632" y="116" text-anchor="middle" fill="currentColor" stroke="none" font-size="11" font-weight="700">5</text>
        <text x="676" y="138" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">Rig &amp;</text>
        <text x="676" y="155" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">animate</text>
        <text x="676" y="171" text-anchor="middle" fill="currentColor" stroke="none" font-size="10.5" opacity="0.72">clean mesh + detail</text>
      </g>
    </g>

    <!-- connectors -->
    <g stroke-width="1.8">
      <line x1="148" y1="138" x2="166" y2="138" marker-end="url(#cw-arrow)"/>
      <line x1="296" y1="138" x2="314" y2="138" marker-end="url(#cw-arrow)"/>
      <line x1="444" y1="138" x2="462" y2="138" marker-end="url(#cw-arrow)"/>
      <line x1="592" y1="138" x2="610" y2="138" marker-end="url(#cw-arrow)"/>
    </g>

    <text x="380" y="230" text-anchor="middle" fill="currentColor" stroke="none" font-size="12.5" opacity="0.85">Use each method where it is strongest &#183; transition between methods as needed</text>
    <text x="380" y="268" text-anchor="middle" fill="currentColor" stroke="none" font-size="11.5" opacity="0.65">Don&#8217;t think &#8220;sculpting OR modeling&#8221; &#8212; think &#8220;sculpting AND modeling&#8221;</text>
  </g>
</svg>
