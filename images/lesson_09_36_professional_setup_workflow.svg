<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" color="#222" role="img" aria-labelledby="ps-title ps-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="ps-title">Professional Project Setup Workflow</title>
  <desc id="ps-desc">A five-step setup routine to run in the first five minutes of any precision modeling project: configure scene units, set grid scale, enable snapping, create reference objects, then save the project file. Steps run top to bottom with a color progression from blue at the start to green at completion.</desc>

  <!-- card -->
  <rect x="0" y="0" width="800" height="680" rx="18" fill="#0f1a14"/>
  <!-- top accent strip -->
  <rect x="0" y="0" width="800" height="10" rx="5" fill="#FF6B00"/>

  <!-- heading -->
  <text x="40" y="58" font-size="30" font-weight="700" fill="#f5f7f6">Professional Project Setup</text>
  <text x="40" y="88" font-size="17" font-weight="500" fill="#9fb0a8">First 5 minutes &#183; do these in order, every time</text>

  <!-- connectors (drawn first so boxes sit on top) -->
  <defs>
    <marker id="ps-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7d8f87"/>
    </marker>
  </defs>
  <g stroke="#7d8f87" stroke-width="3" marker-end="url(#ps-arrow)">
    <line x1="400" y1="178" x2="400" y2="206"/>
    <line x1="400" y1="280" x2="400" y2="308"/>
    <line x1="400" y1="382" x2="400" y2="410"/>
    <line x1="400" y1="484" x2="400" y2="512"/>
  </g>

  <!-- step 1 · Configure Scene Units (blue start) -->
  <g>
    <rect x="120" y="118" width="560" height="60" rx="10" fill="#13233a" stroke="#4A9EFF" stroke-width="2"/>
    <circle cx="160" cy="148" r="20" fill="#4A9EFF"/>
    <!-- ruler glyph -->
    <g stroke="#0f1a14" stroke-width="2" fill="none">
      <rect x="150" y="142" width="20" height="12" rx="1" fill="#0f1a14" stroke="none"/>
      <line x1="154" y1="142" x2="154" y2="147"/>
      <line x1="158" y1="142" x2="158" y2="147"/>
      <line x1="162" y1="142" x2="162" y2="147"/>
      <line x1="166" y1="142" x2="166" y2="147"/>
    </g>
    <text x="200" y="143" font-size="19" font-weight="700" fill="#f5f7f6">1 &#183; Configure Scene Units</text>
    <text x="200" y="166" font-size="14" fill="#9fb0a8">Properties &#8594; Scene &#8594; Units &#183; set Metric / Meters, scale 1.0</text>
  </g>

  <!-- step 2 · Set Grid Scale -->
  <g>
    <rect x="120" y="220" width="560" height="60" rx="10" fill="#14283a" stroke="#46A6C8" stroke-width="2"/>
    <circle cx="160" cy="250" r="20" fill="#46A6C8"/>
    <!-- grid glyph -->
    <g stroke="#0f1a14" stroke-width="2">
      <line x1="150" y1="244" x2="170" y2="244"/>
      <line x1="150" y1="250" x2="170" y2="250"/>
      <line x1="150" y1="256" x2="170" y2="256"/>
      <line x1="154" y1="240" x2="154" y2="260"/>
      <line x1="160" y1="240" x2="160" y2="260"/>
      <line x1="166" y1="240" x2="166" y2="260"/>
    </g>
    <text x="200" y="245" font-size="19" font-weight="700" fill="#f5f7f6">2 &#183; Set Grid Scale</text>
    <text x="200" y="268" font-size="14" fill="#9fb0a8">Overlays &#8594; Guides &#8594; Scale &#183; match your unit of work</text>
  </g>

  <!-- step 3 · Enable Snapping -->
  <g>
    <rect x="120" y="322" width="560" height="60" rx="10" fill="#162c33" stroke="#3FB6A0" stroke-width="2"/>
    <circle cx="160" cy="352" r="20" fill="#3FB6A0"/>
    <!-- magnet glyph -->
    <g fill="none" stroke="#0f1a14" stroke-width="3">
      <path d="M152,346 a8,9 0 0 1 16,0 v9"/>
      <line x1="152" y1="355" x2="152" y2="359"/>
      <line x1="168" y1="355" x2="168" y2="359"/>
    </g>
    <text x="200" y="347" font-size="19" font-weight="700" fill="#f5f7f6">3 &#183; Enable Appropriate Snapping</text>
    <text x="200" y="370" font-size="14" fill="#9fb0a8">Magnet on &#183; pick the snap target the task needs</text>
  </g>

  <!-- step 4 · Create Reference Objects -->
  <g>
    <rect x="120" y="424" width="560" height="60" rx="10" fill="#173326" stroke="#43C66B" stroke-width="2"/>
    <circle cx="160" cy="454" r="20" fill="#43C66B"/>
    <!-- cube glyph -->
    <g fill="none" stroke="#0f1a14" stroke-width="2">
      <rect x="151" y="448" width="13" height="13"/>
      <path d="M151,448 l5,-5 h13 v13 l-5,5 M164,448 l5,-5"/>
    </g>
    <text x="200" y="449" font-size="19" font-weight="700" fill="#f5f7f6">4 &#183; Create Reference Objects</text>
    <text x="200" y="472" font-size="14" fill="#9fb0a8">Drop a 1.7 m figure or sized cube to sanity-check scale</text>
  </g>

  <!-- step 5 · Save Project File (green complete) -->
  <g>
    <rect x="120" y="526" width="560" height="60" rx="10" fill="#193a28" stroke="#4ADE80" stroke-width="2"/>
    <circle cx="160" cy="556" r="20" fill="#4ADE80"/>
    <!-- floppy glyph -->
    <g fill="none" stroke="#0f1a14" stroke-width="2">
      <path d="M150,548 h16 l4,4 v12 h-20 z"/>
      <rect x="155" y="558" width="10" height="8" fill="#0f1a14" stroke="none"/>
      <rect x="157" y="548" width="6" height="5" fill="#0f1a14" stroke="none"/>
    </g>
    <text x="200" y="551" font-size="19" font-weight="700" fill="#f5f7f6">5 &#183; Save Project File</text>
    <text x="200" y="574" font-size="14" fill="#9fb0a8">Ctrl+S early &#183; name it before you model a single vertex</text>
  </g>

  <!-- footer tip rail -->
  <rect x="40" y="616" width="6" height="36" rx="3" fill="#F5C242"/>
  <text x="60" y="639" font-size="15" font-weight="600" fill="#F5C242">Five minutes here saves hours of rescaling and re-snapping later.</text>
</svg>
