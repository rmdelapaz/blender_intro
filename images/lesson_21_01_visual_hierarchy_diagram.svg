<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="vh-title vh-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="vh-title">Visual hierarchy and eye path</title>
  <desc id="vh-desc">A composition frame with four numbered markers showing the order in which the eye reads an image: first the high-contrast focal point, then a color element, then a bright supporting detail, then background context. Curved arrows connect the markers along the viewing path.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">VISUAL HIERARCHY</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">How the eye reads a composition &#183; first to last</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ============ Scene frame ============ -->
  <!-- frame x 40..470 (w 430), y 138..490 (h 352): the "image" the eye scans -->
  <rect x="40" y="138" width="430" height="352" rx="4"
        fill="currentColor" fill-opacity="0.03"
        stroke="currentColor" stroke-opacity="0.4" stroke-width="2"/>

  <!-- Background context block (low contrast, read last) -->
  <rect x="70" y="168" width="370" height="120" rx="6" fill="currentColor" fill-opacity="0.07"/>

  <!-- Focal point: high-contrast subject. A light stage keeps the dark subject reading on dark pages too. -->
  <ellipse cx="170" cy="240" rx="58" ry="58" fill="#f2f2f2"/>
  <circle cx="170" cy="240" r="40" fill="#1a1a1a"/>
  <!-- Secondary: color element -->
  <rect x="320" y="210" width="70" height="70" rx="10" fill="#FF7EA8"/>
  <!-- Supporting bright detail -->
  <circle cx="250" cy="410" r="26" fill="#F5C242"/>

  <!-- Eye-path arrows (curved, follow viewing order). Cyan connectors. -->
  <g fill="none" stroke="#00BCD4" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <path d="M 205 232 Q 280 175 322 232" marker-end="url(#vh-arrow)"/>
    <path d="M 350 282 Q 320 370 276 398" marker-end="url(#vh-arrow)"/>
    <path d="M 256 386 Q 420 360 410 206" marker-end="url(#vh-arrow)"/>
  </g>

  <defs>
    <marker id="vh-arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00BCD4"/>
    </marker>
  </defs>

  <!-- Order badges (orange numbered circles) -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <!-- 1 focal -->
    <circle cx="170" cy="240" r="16" fill="#FF6B00"/>
    <text x="170" y="246" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <!-- 2 color -->
    <circle cx="355" cy="245" r="16" fill="#FF6B00"/>
    <text x="355" y="251" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <!-- 3 bright detail -->
    <circle cx="250" cy="410" r="16" fill="#FF6B00"/>
    <text x="250" y="416" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <!-- 4 background context -->
    <circle cx="410" cy="186" r="16" fill="#FF6B00"/>
    <text x="410" y="192" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  </g>

  <!-- ============ Legend (right column) ============ -->
  <g>
    <text x="510" y="162" font-size="18" font-weight="600" fill="currentColor">Reading order</text>

    <!-- 1 -->
    <circle cx="522" cy="200" r="13" fill="#FF6B00"/>
    <text x="522" y="205" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="548" y="197" font-size="14" font-weight="600" fill="currentColor">Focal point</text>
    <text x="548" y="215" font-size="13" fill="currentColor" opacity="0.6">Highest contrast wins first.</text>

    <!-- 2 -->
    <circle cx="522" cy="258" r="13" fill="#FF6B00"/>
    <text x="522" y="263" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="548" y="255" font-size="14" font-weight="600" fill="currentColor">Color element</text>
    <text x="548" y="273" font-size="13" fill="currentColor" opacity="0.6">Saturation pulls the eye next.</text>

    <!-- 3 -->
    <circle cx="522" cy="316" r="13" fill="#FF6B00"/>
    <text x="522" y="321" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="548" y="313" font-size="14" font-weight="600" fill="currentColor">Bright detail</text>
    <text x="548" y="331" font-size="13" fill="currentColor" opacity="0.6">Local brightness draws notice.</text>

    <!-- 4 -->
    <circle cx="522" cy="374" r="13" fill="#FF6B00"/>
    <text x="522" y="379" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="548" y="371" font-size="14" font-weight="600" fill="currentColor">Background</text>
    <text x="548" y="389" font-size="13" fill="currentColor" opacity="0.6">Low-contrast context, read last.</text>
  </g>

  <!-- Footer tip callout (Variant B, left rail) -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Contrast outranks size. The strongest light-to-dark jump is read first, so guard it for your subject.
  </text>
</svg>
