<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="wf-title wf-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="wf-title">Modifier workflow decision tree</title>
  <desc id="wf-desc">A decision-tree flowchart for the modifier workflow. Starting from a geometry change, it asks whether the task is repetitive or symmetric to decide between using a modifier or editing manually, then asks whether you are still iterating to decide whether to keep the modifier live or apply it, and asks whether an export or sculpt target needs baked geometry before applying. Terminal outcomes are keep live (green), apply after duplicating (red), and manual edit (neutral).</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Modifier Workflow: When to Add, Keep, or Apply</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Follow the arrows · most of the time the answer is keep it live</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ============ FLOWCHART ============ -->
  <!-- All connector arrows drawn first, nodes on top -->

  <!-- Arrow defs -->
  <defs>
    <marker id="wf-arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1,1 L10,6 L1,11 z" fill="#FF6B00"/>
    </marker>
  </defs>

  <!-- Start -> Decision 1 -->
  <line x1="400" y1="162" x2="400" y2="186" stroke="#FF6B00" stroke-width="2.5" marker-end="url(#wf-arrow)"/>
  <!-- Decision 1 -> Decision 2 (Yes, down) -->
  <line x1="400" y1="266" x2="400" y2="296" stroke="#FF6B00" stroke-width="2.5" marker-end="url(#wf-arrow)"/>
  <!-- Decision 1 -> Manual edit (No, right) -->
  <line x1="486" y1="226" x2="632" y2="226" stroke="#FF6B00" stroke-width="2.5" marker-end="url(#wf-arrow)"/>
  <!-- Decision 2 -> Decision 3 (down) -->
  <line x1="400" y1="376" x2="400" y2="406" stroke="#FF6B00" stroke-width="2.5" marker-end="url(#wf-arrow)"/>
  <!-- Decision 3 -> Keep Live (No, left) -->
  <line x1="314" y1="446" x2="180" y2="446" stroke="#FF6B00" stroke-width="2.5" marker-end="url(#wf-arrow)"/>
  <!-- Decision 3 -> Apply (Yes, down) -->
  <line x1="400" y1="486" x2="400" y2="516" stroke="#FF6B00" stroke-width="2.5" marker-end="url(#wf-arrow)"/>

  <!-- Edge labels -->
  <text x="412" y="284" font-size="12" font-weight="700" fill="#4ADE80">Yes</text>
  <text x="500" y="216" font-size="12" font-weight="700" fill="currentColor" opacity="0.7">No</text>
  <text x="196" y="438" font-size="12" font-weight="700" fill="#4ADE80">No · keep working</text>
  <text x="412" y="508" font-size="12" font-weight="700" fill="#E63946">Yes · it is final</text>

  <!-- START node -->
  <rect x="276" y="128" width="248" height="34" rx="17" fill="#FF6B00"/>
  <text x="400" y="150" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Need to change geometry?</text>

  <!-- DECISION 1 diamond: repetitive / symmetric? -->
  <polygon points="400,186 486,226 400,266 314,226" fill="#F5C242" fill-opacity="0.16" stroke="#F5C242" stroke-width="2"/>
  <text x="400" y="220" font-size="13" font-weight="700" fill="currentColor" text-anchor="middle">Repetitive or</text>
  <text x="400" y="238" font-size="13" font-weight="700" fill="currentColor" text-anchor="middle">symmetric?</text>

  <!-- DECISION 2 diamond: still iterating? -->
  <polygon points="400,296 486,336 400,376 314,336" fill="#F5C242" fill-opacity="0.16" stroke="#F5C242" stroke-width="2"/>
  <text x="400" y="332" font-size="13" font-weight="700" fill="currentColor" text-anchor="middle">Add a modifier</text>
  <text x="400" y="350" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle" opacity="0.7">Array · Mirror · Bevel · Subdiv</text>

  <!-- DECISION 3 diamond: need baked geometry? -->
  <polygon points="400,406 486,446 400,486 314,446" fill="#F5C242" fill-opacity="0.16" stroke="#F5C242" stroke-width="2"/>
  <text x="400" y="440" font-size="13" font-weight="700" fill="currentColor" text-anchor="middle">Need baked</text>
  <text x="400" y="458" font-size="13" font-weight="700" fill="currentColor" text-anchor="middle">geometry?</text>

  <!-- TERMINAL: Manual edit (neutral) -->
  <rect x="632" y="206" width="128" height="40" rx="8" fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-opacity="0.4" stroke-width="2"/>
  <text x="696" y="231" font-size="13" font-weight="700" fill="currentColor" text-anchor="middle">Edit manually</text>

  <!-- TERMINAL: Keep live (green) -->
  <rect x="44" y="426" width="136" height="40" rx="8" fill="#4ADE80" fill-opacity="0.14" stroke="#4ADE80" stroke-width="2"/>
  <text x="112" y="451" font-size="14" font-weight="700" fill="#4ADE80" text-anchor="middle">Keep it live</text>

  <!-- TERMINAL: Apply (red) -->
  <rect x="286" y="516" width="228" height="44" rx="8" fill="#E63946" fill-opacity="0.10" stroke="#E63946" stroke-width="2"/>
  <text x="400" y="535" font-size="14" font-weight="700" fill="#E63946" text-anchor="middle">Duplicate first, then Apply</text>
  <text x="400" y="552" font-size="11" font-weight="600" fill="currentColor" text-anchor="middle" opacity="0.7">Shift+D to keep a live backup</text>

  <!-- Guidance rail: the default answer -->
  <rect x="40" y="586" width="720" height="44" rx="10" fill="#4ADE80" fill-opacity="0.08"/>
  <rect x="40" y="586" width="4" height="44" fill="#4ADE80"/>
  <text x="64" y="604" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#4ADE80">Default to live:</tspan> keep modifiers editable while you iterate. Only apply when a sculpt, export,</text>
  <text x="64" y="622" font-size="13" fill="currentColor">or hand-edit step truly needs real geometry · and always duplicate the object first.</text>

  <!-- Footer tip (Variant B, left rail) -->
  <rect x="40" y="641" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Blender reads the stack bottom to top · order the modifiers before you commit to applying.</text>
</svg>
