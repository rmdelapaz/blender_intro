<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="pcc-title pcc-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="pcc-title">Modifier performance comparison</title>
  <desc id="pcc-desc">A horizontal bar chart ranking modifiers by relative performance cost from highest to lowest. Simulation and exact Boolean are the most expensive, shown in red. High subdivision, remesh, and geometry nodes are moderate, shown in yellow. Array, mirror, bevel, and data modifiers are cheap, shown in green.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Performance cost by modifier</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Relative viewport cost &#183; longer bar means heavier</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Bars: label column x=40..230 (right-aligned at 222), bar starts x=240, max width 470 to x=710 -->
  <!-- 10 rows, height 30, gap 8, start y=132 -->
  <!-- baseline scale: width = cost/100 * 470 -->

  <!-- Simulation (Cloth/Fluid) cost 100 -->
  <text x="222" y="153" text-anchor="end" font-size="13" fill="currentColor">Simulation</text>
  <rect x="240" y="138" width="470" height="22" rx="3" fill="#E63946"/>
  <text x="700" y="153" text-anchor="end" font-size="12" font-weight="700" fill="#fff">Highest</text>

  <!-- Boolean Exact cost 82 -->
  <text x="222" y="191" text-anchor="end" font-size="13" fill="currentColor">Boolean (Exact)</text>
  <rect x="240" y="176" width="385" height="22" rx="3" fill="#E63946"/>

  <!-- Subdivision high cost 70 -->
  <text x="222" y="229" text-anchor="end" font-size="13" fill="currentColor">Subdivision (high)</text>
  <rect x="240" y="214" width="329" height="22" rx="3" fill="#E63946"/>

  <!-- Remesh / Voxel cost 58 -->
  <text x="222" y="267" text-anchor="end" font-size="13" fill="currentColor">Remesh / Voxel</text>
  <rect x="240" y="252" width="273" height="22" rx="3" fill="#F5C242"/>

  <!-- Geometry Nodes cost 50 -->
  <text x="222" y="305" text-anchor="end" font-size="13" fill="currentColor">Geometry Nodes</text>
  <rect x="240" y="290" width="235" height="22" rx="3" fill="#F5C242"/>
  <text x="481" y="305" font-size="11" fill="currentColor" opacity="0.55">varies</text>

  <!-- Boolean Fast cost 40 -->
  <text x="222" y="343" text-anchor="end" font-size="13" fill="currentColor">Boolean (Fast)</text>
  <rect x="240" y="328" width="188" height="22" rx="3" fill="#F5C242"/>

  <!-- Array cost 24 -->
  <text x="222" y="381" text-anchor="end" font-size="13" fill="currentColor">Array</text>
  <rect x="240" y="366" width="113" height="22" rx="3" fill="#4ADE80"/>

  <!-- Bevel cost 18 -->
  <text x="222" y="419" text-anchor="end" font-size="13" fill="currentColor">Bevel</text>
  <rect x="240" y="404" width="85" height="22" rx="3" fill="#4ADE80"/>

  <!-- Mirror cost 12 -->
  <text x="222" y="457" text-anchor="end" font-size="13" fill="currentColor">Mirror</text>
  <rect x="240" y="442" width="56" height="22" rx="3" fill="#4ADE80"/>

  <!-- Data modifiers cost 8 -->
  <text x="222" y="495" text-anchor="end" font-size="13" fill="currentColor">Data modifiers</text>
  <rect x="240" y="480" width="38" height="22" rx="3" fill="#4ADE80"/>
  <text x="700" y="495" text-anchor="end" font-size="12" font-weight="700" fill="#4ADE80">Lowest</text>

  <!-- Legend -->
  <rect x="240" y="516" width="12" height="12" rx="2" fill="#E63946"/>
  <text x="258" y="526" font-size="12" fill="currentColor" opacity="0.7">Expensive</text>
  <rect x="360" y="516" width="12" height="12" rx="2" fill="#F5C242"/>
  <text x="378" y="526" font-size="12" fill="currentColor" opacity="0.7">Moderate</text>
  <rect x="470" y="516" width="12" height="12" rx="2" fill="#4ADE80"/>
  <text x="488" y="526" font-size="12" fill="currentColor" opacity="0.7">Cheap</text>
</svg>
