<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" role="img" aria-labelledby="efTitle efDesc" fill="none" style="max-width:100%;height:auto;color:currentColor">
  <title id="efTitle">Edge flow patterns</title>
  <desc id="efDesc">A two by two grid showing ideal edge flow for cylindrical, spherical, planar, and radial forms.</desc>
  <style>
    .ef-cell{stroke:currentColor;stroke-width:1.5;fill:none;opacity:.35;rx:10}
    .ef-form{stroke:currentColor;stroke-width:2;fill:currentColor;fill-opacity:.05}
    .ef-flow{stroke:currentColor;stroke-width:1.3;fill:none;opacity:.75}
    .ef-name{font:700 16px system-ui,Arial,sans-serif;fill:currentColor}
    .ef-sub{font:400 11.5px system-ui,Arial,sans-serif;fill:currentColor;opacity:.7}
    .ef-hd{font:600 13px system-ui,Arial,sans-serif;fill:currentColor;opacity:.85}
  </style>

  <text class="ef-hd" x="380" y="30" text-anchor="middle">Edge flow follows the form &#8212; loops wrap, edges span</text>

  <!-- ===== Cylindrical (top-left) ===== -->
  <g transform="translate(40,56)">
    <rect class="ef-cell" x="0" y="0" width="320" height="240" rx="10"/>
    <text class="ef-name" x="20" y="34">Cylindrical</text>
    <text class="ef-sub" x="20" y="52">rings around, edges along length</text>
    <g transform="translate(110,78)">
      <!-- cylinder body -->
      <ellipse class="ef-form" cx="50" cy="14" rx="50" ry="14"/>
      <path class="ef-form" d="M0,14 V130 A50,14 0 0 0 100,130 V14"/>
      <!-- horizontal rings -->
      <ellipse class="ef-flow" cx="50" cy="48" rx="50" ry="13"/>
      <ellipse class="ef-flow" cx="50" cy="82" rx="50" ry="13"/>
      <ellipse class="ef-flow" cx="50" cy="116" rx="50" ry="13"/>
      <!-- vertical edges -->
      <line class="ef-flow" x1="0" y1="14" x2="0" y2="130"/>
      <line class="ef-flow" x1="25" y1="20" x2="25" y2="136"/>
      <line class="ef-flow" x1="75" y1="20" x2="75" y2="136"/>
      <line class="ef-flow" x1="100" y1="14" x2="100" y2="130"/>
    </g>
  </g>

  <!-- ===== Spherical (top-right) ===== -->
  <g transform="translate(400,56)">
    <rect class="ef-cell" x="0" y="0" width="320" height="240" rx="10"/>
    <text class="ef-name" x="20" y="34">Spherical</text>
    <text class="ef-sub" x="20" y="52">latitude and longitude loops</text>
    <g transform="translate(160,150)">
      <circle class="ef-form" cx="0" cy="0" r="72"/>
      <!-- longitude -->
      <ellipse class="ef-flow" cx="0" cy="0" rx="24" ry="72"/>
      <ellipse class="ef-flow" cx="0" cy="0" rx="52" ry="72"/>
      <line class="ef-flow" x1="0" y1="-72" x2="0" y2="72"/>
      <!-- latitude -->
      <ellipse class="ef-flow" cx="0" cy="0" rx="72" ry="24"/>
      <ellipse class="ef-flow" cx="0" cy="0" rx="72" ry="52"/>
      <line class="ef-flow" x1="-72" y1="0" x2="72" y2="0"/>
    </g>
  </g>

  <!-- ===== Planar (bottom-left) ===== -->
  <g transform="translate(40,320)">
    <rect class="ef-cell" x="0" y="0" width="320" height="240" rx="10"/>
    <text class="ef-name" x="20" y="34">Planar</text>
    <text class="ef-sub" x="20" y="52">even, regular grid</text>
    <g transform="translate(70,78)">
      <rect class="ef-form" x="0" y="0" width="180" height="130"/>
      <line class="ef-flow" x1="36" y1="0" x2="36" y2="130"/>
      <line class="ef-flow" x1="72" y1="0" x2="72" y2="130"/>
      <line class="ef-flow" x1="108" y1="0" x2="108" y2="130"/>
      <line class="ef-flow" x1="144" y1="0" x2="144" y2="130"/>
      <line class="ef-flow" x1="0" y1="32.5" x2="180" y2="32.5"/>
      <line class="ef-flow" x1="0" y1="65" x2="180" y2="65"/>
      <line class="ef-flow" x1="0" y1="97.5" x2="180" y2="97.5"/>
    </g>
  </g>

  <!-- ===== Radial (bottom-right) ===== -->
  <g transform="translate(400,320)">
    <rect class="ef-cell" x="0" y="0" width="320" height="240" rx="10"/>
    <text class="ef-name" x="20" y="34">Radial</text>
    <text class="ef-sub" x="20" y="52">spokes from a center pole</text>
    <g transform="translate(160,150)">
      <circle class="ef-form" cx="0" cy="0" r="72"/>
      <!-- concentric rings -->
      <circle class="ef-flow" cx="0" cy="0" r="24"/>
      <circle class="ef-flow" cx="0" cy="0" r="48"/>
      <!-- spokes -->
      <line class="ef-flow" x1="0" y1="0" x2="0" y2="-72"/>
      <line class="ef-flow" x1="0" y1="0" x2="51" y2="-51"/>
      <line class="ef-flow" x1="0" y1="0" x2="72" y2="0"/>
      <line class="ef-flow" x1="0" y1="0" x2="51" y2="51"/>
      <line class="ef-flow" x1="0" y1="0" x2="0" y2="72"/>
      <line class="ef-flow" x1="0" y1="0" x2="-51" y2="51"/>
      <line class="ef-flow" x1="0" y1="0" x2="-72" y2="0"/>
      <line class="ef-flow" x1="0" y1="0" x2="-51" y2="-51"/>
    </g>
  </g>
</svg>
