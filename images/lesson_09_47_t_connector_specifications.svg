<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" color="#222" role="img" aria-labelledby="ts-title ts-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="ts-title">T-Connector Project Specifications</title>
  <desc id="ts-desc">An engineering specification drawing for the T-connector precision modeling project, laid out as a manufacturing blueprint. Three orthographic views are shown: a front view of the T-shaped body, a top view, and a right side view, each with dash-dot centerlines and dimension lines with arrowheads. The main body is a 3 centimetre diameter cylinder, 2 centimetres long, with a 2 centimetre diameter branch, 2 centimetres long, joined perpendicular. Flanges on each open end are 0.2 centimetres thick and 15 percent larger in diameter. A cutaway section view shows the 2 centimetre diameter hollow interior and the 0.05 centimetre edge bevels. A title block in the lower corner records the part name, dimensions, units, and scale.</desc>

  <defs>
    <marker id="ts-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#9fb0a8"/>
    </marker>
    <pattern id="ts-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#3a6f5a" stroke-width="1.1"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="800" height="680" rx="18" fill="#0f1a14"/>
  <rect x="0" y="0" width="800" height="10" rx="5" fill="#FF6B00"/>

  <!-- header -->
  <text x="40" y="58" font-size="30" font-weight="700" fill="#f5f7f6">T-Connector Specifications</text>
  <text x="40" y="88" font-size="17" font-weight="500" fill="#9fb0a8">Orthographic views &#183; dimensions in centimetres &#183; not to scale</text>

  <!-- drawing border frame -->
  <rect x="32" y="108" width="736" height="452" fill="none" stroke="#26342c" stroke-width="1.5" rx="6"/>

  <!-- ===================== FRONT VIEW (top-left) ===================== -->
  <text x="60" y="138" font-size="14" font-weight="700" fill="#F5C242">FRONT VIEW</text>
  <!-- vertical centerline (dash-dot) -->
  <line x1="180" y1="150" x2="180" y2="330" stroke="#6f8a7e" stroke-width="1" stroke-dasharray="14 4 3 4"/>
  <!-- horizontal centerline of main body -->
  <line x1="92" y1="260" x2="300" y2="260" stroke="#6f8a7e" stroke-width="1" stroke-dasharray="14 4 3 4"/>

  <!-- main body (horizontal bar): 3cm dia tall x 2cm long -->
  <rect x="130" y="218" width="100" height="84" fill="#1b2a22" stroke="#cfe0d8" stroke-width="2"/>
  <!-- left flange (0.2cm thick, +15% dia) -->
  <rect x="118" y="212" width="12" height="96" fill="#243a30" stroke="#cfe0d8" stroke-width="2"/>
  <!-- right flange -->
  <rect x="230" y="212" width="12" height="96" fill="#243a30" stroke="#cfe0d8" stroke-width="2"/>
  <!-- branch (vertical) 2cm dia x 2cm, rises from top -->
  <rect x="152" y="160" width="56" height="58" fill="#1b2a22" stroke="#cfe0d8" stroke-width="2"/>
  <!-- branch flange (top) -->
  <rect x="146" y="150" width="68" height="10" fill="#243a30" stroke="#cfe0d8" stroke-width="2"/>

  <!-- dim: main body length 2cm (below) -->
  <line x1="130" y1="324" x2="230" y2="324" stroke="#9fb0a8" stroke-width="1" marker-start="url(#ts-arrow)" marker-end="url(#ts-arrow)"/>
  <line x1="130" y1="308" x2="130" y2="328" stroke="#9fb0a8" stroke-width="0.8"/>
  <line x1="230" y1="308" x2="230" y2="328" stroke="#9fb0a8" stroke-width="0.8"/>
  <rect x="166" y="316" width="28" height="16" rx="3" fill="#0f1a14"/>
  <text x="180" y="328" font-size="12.5" fill="#dfe9e4" text-anchor="middle">2 cm</text>

  <!-- dim: main body diameter 3cm (right of body, left of branch dim) -->
  <line x1="286" y1="218" x2="286" y2="302" stroke="#9fb0a8" stroke-width="1" marker-start="url(#ts-arrow)" marker-end="url(#ts-arrow)"/>
  <line x1="242" y1="218" x2="290" y2="218" stroke="#9fb0a8" stroke-width="0.8"/>
  <line x1="242" y1="302" x2="290" y2="302" stroke="#9fb0a8" stroke-width="0.8"/>
  <rect x="270" y="252" width="46" height="16" rx="3" fill="#0f1a14"/>
  <text x="293" y="264" font-size="12.5" fill="#dfe9e4" text-anchor="middle">&#8709;3 cm</text>

  <!-- dim: branch length 2cm (left of branch) -->
  <line x1="112" y1="160" x2="112" y2="218" stroke="#9fb0a8" stroke-width="1" marker-start="url(#ts-arrow)" marker-end="url(#ts-arrow)"/>
  <line x1="108" y1="160" x2="152" y2="160" stroke="#9fb0a8" stroke-width="0.8"/>
  <rect x="78" y="181" width="34" height="16" rx="3" fill="#0f1a14"/>
  <text x="95" y="193" font-size="12.5" fill="#dfe9e4" text-anchor="middle">2 cm</text>

  <!-- dim: branch diameter 2cm (above branch) -->
  <line x1="152" y1="142" x2="208" y2="142" stroke="#9fb0a8" stroke-width="1" marker-start="url(#ts-arrow)" marker-end="url(#ts-arrow)"/>
  <line x1="152" y1="142" x2="152" y2="152" stroke="#9fb0a8" stroke-width="0.8"/>
  <line x1="208" y1="142" x2="208" y2="152" stroke="#9fb0a8" stroke-width="0.8"/>
  <rect x="156" y="124" width="48" height="16" rx="3" fill="#0f1a14"/>
  <text x="180" y="136" font-size="12.5" fill="#dfe9e4" text-anchor="middle">&#8709;2 cm</text>

  <!-- flange thickness leader 0.2cm -->
  <line x1="124" y1="200" x2="100" y2="186" stroke="#9fb0a8" stroke-width="0.9" marker-start="url(#ts-arrow)"/>
  <rect x="40" y="178" width="60" height="16" rx="3" fill="#0f1a14"/>
  <text x="70" y="190" font-size="11.5" fill="#dfe9e4" text-anchor="middle">0.2 cm thk</text>

  <!-- ===================== RIGHT VIEW (top-right) ===================== -->
  <text x="430" y="138" font-size="14" font-weight="700" fill="#F5C242">RIGHT VIEW</text>
  <!-- centerlines -->
  <line x1="560" y1="150" x2="560" y2="330" stroke="#6f8a7e" stroke-width="1" stroke-dasharray="14 4 3 4"/>
  <line x1="478" y1="260" x2="642" y2="260" stroke="#6f8a7e" stroke-width="1" stroke-dasharray="14 4 3 4"/>
  <!-- main body end-on = circle 3cm dia -->
  <circle cx="560" cy="260" r="42" fill="#1b2a22" stroke="#cfe0d8" stroke-width="2"/>
  <!-- flange ring (+15%) -->
  <circle cx="560" cy="260" r="48" fill="none" stroke="#243a30" stroke-width="3"/>
  <!-- branch circle on top (2cm dia) seen end-on behind -->
  <circle cx="560" cy="260" r="28" fill="none" stroke="#6f8a7e" stroke-width="1.2" stroke-dasharray="5 4"/>
  <!-- branch projecting up -->
  <rect x="546" y="178" width="28" height="40" fill="#1b2a22" stroke="#cfe0d8" stroke-width="2"/>
  <rect x="540" y="168" width="40" height="10" fill="#243a30" stroke="#cfe0d8" stroke-width="2"/>

  <!-- dim: body dia 3cm (horizontal through center) -->
  <line x1="518" y1="338" x2="602" y2="338" stroke="#9fb0a8" stroke-width="1" marker-start="url(#ts-arrow)" marker-end="url(#ts-arrow)"/>
  <line x1="518" y1="302" x2="518" y2="342" stroke="#9fb0a8" stroke-width="0.8"/>
  <line x1="602" y1="302" x2="602" y2="342" stroke="#9fb0a8" stroke-width="0.8"/>
  <rect x="537" y="330" width="46" height="16" rx="3" fill="#0f1a14"/>
  <text x="560" y="342" font-size="12.5" fill="#dfe9e4" text-anchor="middle">&#8709;3 cm</text>

  <!-- dim: flange +15% leader -->
  <line x1="604" y1="226" x2="660" y2="206" stroke="#9fb0a8" stroke-width="0.9" marker-start="url(#ts-arrow)"/>
  <rect x="612" y="196" width="120" height="16" rx="3" fill="#0f1a14"/>
  <text x="672" y="208" font-size="11.5" fill="#dfe9e4" text-anchor="middle">flange &#8709; +15%</text>

  <!-- ===================== TOP VIEW (lower-left) ===================== -->
  <text x="60" y="392" font-size="14" font-weight="700" fill="#F5C242">TOP VIEW</text>
  <!-- centerlines -->
  <line x1="180" y1="404" x2="180" y2="540" stroke="#6f8a7e" stroke-width="1" stroke-dasharray="14 4 3 4"/>
  <line x1="92" y1="470" x2="300" y2="470" stroke="#6f8a7e" stroke-width="1" stroke-dasharray="14 4 3 4"/>
  <!-- main body footprint: 2cm long x 3cm dia projected -->
  <rect x="130" y="442" width="100" height="56" fill="#1b2a22" stroke="#cfe0d8" stroke-width="2"/>
  <rect x="118" y="436" width="12" height="68" fill="#243a30" stroke="#cfe0d8" stroke-width="2"/>
  <rect x="230" y="436" width="12" height="68" fill="#243a30" stroke="#cfe0d8" stroke-width="2"/>
  <!-- branch seen from top = circle 2cm dia centred -->
  <circle cx="180" cy="470" r="28" fill="none" stroke="#6f8a7e" stroke-width="1.2" stroke-dasharray="5 4"/>

  <!-- dim: body length 2cm (below) -->
  <line x1="130" y1="520" x2="230" y2="520" stroke="#9fb0a8" stroke-width="1" marker-start="url(#ts-arrow)" marker-end="url(#ts-arrow)"/>
  <line x1="130" y1="504" x2="130" y2="524" stroke="#9fb0a8" stroke-width="0.8"/>
  <line x1="230" y1="504" x2="230" y2="524" stroke="#9fb0a8" stroke-width="0.8"/>
  <rect x="166" y="512" width="28" height="16" rx="3" fill="#0f1a14"/>
  <text x="180" y="524" font-size="12.5" fill="#dfe9e4" text-anchor="middle">2 cm</text>

  <!-- ===================== SECTION VIEW A-A (lower-right) ===================== -->
  <text x="430" y="392" font-size="14" font-weight="700" fill="#F5C242">SECTION A&#8211;A</text>
  <!-- centerlines -->
  <line x1="560" y1="404" x2="560" y2="544" stroke="#6f8a7e" stroke-width="1" stroke-dasharray="14 4 3 4"/>
  <line x1="470" y1="478" x2="650" y2="478" stroke="#6f8a7e" stroke-width="1" stroke-dasharray="14 4 3 4"/>

  <!-- outer wall of body, hatched, with hollow 2cm bore -->
  <!-- left wall -->
  <rect x="510" y="450" width="14" height="56" fill="url(#ts-hatch)" stroke="#cfe0d8" stroke-width="2"/>
  <!-- right wall -->
  <rect x="596" y="450" width="14" height="56" fill="url(#ts-hatch)" stroke="#cfe0d8" stroke-width="2"/>
  <!-- top wall around branch (split by bore) -->
  <rect x="510" y="450" width="36" height="14" fill="url(#ts-hatch)" stroke="#cfe0d8" stroke-width="2"/>
  <rect x="574" y="450" width="36" height="14" fill="url(#ts-hatch)" stroke="#cfe0d8" stroke-width="2"/>
  <!-- bottom wall -->
  <rect x="510" y="492" width="100" height="14" fill="url(#ts-hatch)" stroke="#cfe0d8" stroke-width="2"/>
  <!-- branch walls rising -->
  <rect x="540" y="420" width="10" height="44" fill="url(#ts-hatch)" stroke="#cfe0d8" stroke-width="2"/>
  <rect x="570" y="420" width="10" height="44" fill="url(#ts-hatch)" stroke="#cfe0d8" stroke-width="2"/>
  <!-- hollow interior (2cm bore) drawn on top so it reads as open void -->
  <path d="M524 464 H540 V420 H580 V464 H596 V492 H524 Z" fill="#0a120d"/>
  <path d="M524 464 H540 V420 H580 V464 H596 V492 H524 Z" fill="none" stroke="#6f8a7e" stroke-width="1.3" stroke-dasharray="4 3"/>

  <!-- dim: interior hollow bore 2cm -->
  <line x1="540" y1="446" x2="580" y2="446" stroke="#9fb0a8" stroke-width="1" marker-start="url(#ts-arrow)" marker-end="url(#ts-arrow)"/>
  <rect x="536" y="438" width="48" height="16" rx="3" fill="#0f1a14"/>
  <text x="560" y="450" font-size="12" fill="#dfe9e4" text-anchor="middle">&#8709;2 cm</text>

  <!-- bevel callout 0.05cm -->
  <line x1="610" y1="450" x2="664" y2="430" stroke="#9fb0a8" stroke-width="0.9" marker-start="url(#ts-arrow)"/>
  <rect x="612" y="420" width="104" height="16" rx="3" fill="#0f1a14"/>
  <text x="664" y="432" font-size="11.5" fill="#dfe9e4" text-anchor="middle">bevel 0.05 cm</text>

  <!-- wall = flange/wall thickness note -->
  <line x1="517" y1="500" x2="490" y2="524" stroke="#9fb0a8" stroke-width="0.9" marker-start="url(#ts-arrow)"/>
  <rect x="430" y="518" width="64" height="16" rx="3" fill="#0f1a14"/>
  <text x="462" y="530" font-size="11.5" fill="#dfe9e4" text-anchor="middle">wall solid</text>

  <!-- ===================== TITLE BLOCK ===================== -->
  <g>
    <rect x="468" y="568" width="300" height="84" rx="6" fill="#14211a" stroke="#26342c" stroke-width="1.5"/>
    <line x1="468" y1="596" x2="768" y2="596" stroke="#26342c" stroke-width="1"/>
    <line x1="468" y1="624" x2="768" y2="624" stroke="#26342c" stroke-width="1"/>
    <line x1="618" y1="568" x2="618" y2="652" stroke="#26342c" stroke-width="1"/>

    <text x="480" y="588" font-size="14" font-weight="700" fill="#f5f7f6">T-CONNECTOR &#183; precision part</text>

    <text x="480" y="612" font-size="11" fill="#9fb0a8">BODY</text>
    <text x="480" y="640" font-size="11" fill="#9fb0a8">BRANCH</text>
    <text x="630" y="612" font-size="11" fill="#9fb0a8">UNITS</text>
    <text x="630" y="640" font-size="11" fill="#9fb0a8">DRAWING</text>

    <text x="540" y="612" font-size="11.5" font-weight="600" fill="#dfe9e4">&#8709;3 &#215; 2 cm</text>
    <text x="540" y="640" font-size="11.5" font-weight="600" fill="#dfe9e4">&#8709;2 &#215; 2 cm</text>
    <text x="690" y="612" font-size="11.5" font-weight="600" fill="#dfe9e4">cm &#183; metric</text>
    <text x="690" y="640" font-size="11.5" font-weight="600" fill="#dfe9e4">spec / NTS</text>
  </g>

  <!-- legend strip -->
  <text x="40" y="588" font-size="11" fill="#6f8a7e">Centerline</text>
  <line x1="40" y1="598" x2="120" y2="598" stroke="#6f8a7e" stroke-width="1" stroke-dasharray="14 4 3 4"/>
  <text x="40" y="622" font-size="11" fill="#6f8a7e">Hidden / bore</text>
  <line x1="40" y1="632" x2="120" y2="632" stroke="#6f8a7e" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="40" y="648" font-size="11" fill="#6f8a7e">Section cut shown hatched &#183; &#8709; denotes diameter</text>
</svg>
