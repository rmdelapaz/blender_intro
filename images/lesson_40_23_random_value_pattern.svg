<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="rvp-title rvp-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="rvp-title">Random Value node pattern</title>
  <desc id="rvp-desc">The essential procedural-variation pattern: an Index feeds a Random Value node whose per-element output drives Scale and Rotation on instanced geometry, so every instance varies while the node tree stays a single deterministic graph.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">RANDOM VALUE PATTERN</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">The essential recipe for procedural variation across instances</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Essential-pattern banner -->
  <rect x="40" y="128" width="720" height="34" rx="6" fill="#FF6B00" fill-opacity="0.10" stroke="#FF6B00" stroke-opacity="0.4"/>
  <text x="400" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#FF6B00">ESSENTIAL PATTERN · seed once, vary everything</text>

  <!-- Node chain: Index -> Random Value -> Scale/Rotate -->
  <!-- Index node -->
  <rect x="48" y="210" width="150" height="96" rx="8" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.5"/>
  <rect x="48" y="210" width="150" height="26" rx="8" fill="#4A9EFF" fill-opacity="0.85"/>
  <text x="123" y="228" text-anchor="middle" font-size="13" font-weight="600" fill="#0f1a14">Index</text>
  <text x="123" y="262" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.7">unique integer</text>
  <text x="123" y="280" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.7">per element</text>
  <circle cx="198" cy="272" r="5" fill="#4A9EFF"/>

  <!-- Random Value node -->
  <rect x="325" y="196" width="170" height="124" rx="8" fill="currentColor" fill-opacity="0.06" stroke="#B47EE8" stroke-opacity="0.9" stroke-width="1.8"/>
  <rect x="325" y="196" width="170" height="26" rx="8" fill="#B47EE8" fill-opacity="0.9"/>
  <text x="410" y="214" text-anchor="middle" font-size="13" font-weight="600" fill="#0f1a14">Random Value</text>
  <text x="340" y="246" font-size="12" fill="currentColor" opacity="0.75">ID: from Index</text>
  <text x="340" y="266" font-size="12" fill="currentColor" opacity="0.75">Seed: 0</text>
  <text x="340" y="286" font-size="12" fill="currentColor" opacity="0.75">Min / Max range</text>
  <text x="340" y="306" font-size="12" fill="currentColor" opacity="0.55" font-style="italic">deterministic</text>
  <circle cx="325" cy="272" r="5" fill="#4A9EFF"/>
  <circle cx="495" cy="248" r="5" fill="#F5C242"/>
  <circle cx="495" cy="296" r="5" fill="#F5C242"/>

  <!-- Scale node -->
  <rect x="612" y="180" width="150" height="60" rx="8" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.5"/>
  <rect x="612" y="180" width="150" height="24" rx="8" fill="#4ADE80" fill-opacity="0.85"/>
  <text x="687" y="197" text-anchor="middle" font-size="12" font-weight="600" fill="#0f1a14">Scale Instances</text>
  <text x="687" y="226" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.7">per-instance size</text>
  <circle cx="612" cy="220" r="5" fill="#F5C242"/>

  <!-- Rotate node -->
  <rect x="612" y="276" width="150" height="60" rx="8" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.5"/>
  <rect x="612" y="276" width="150" height="24" rx="8" fill="#4ADE80" fill-opacity="0.85"/>
  <text x="687" y="293" text-anchor="middle" font-size="12" font-weight="600" fill="#0f1a14">Rotate Instances</text>
  <text x="687" y="322" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.7">per-instance angle</text>
  <circle cx="612" cy="316" r="5" fill="#F5C242"/>

  <!-- Connectors -->
  <g stroke-linecap="round" fill="none">
    <path d="M 203 272 C 260 272, 275 272, 320 272" stroke="#4A9EFF" stroke-width="2.5" opacity="0.8"/>
    <path d="M 500 248 C 550 248, 570 220, 607 220" stroke="#F5C242" stroke-width="2.5" opacity="0.8"/>
    <path d="M 500 296 C 550 296, 570 316, 607 316" stroke="#F5C242" stroke-width="2.5" opacity="0.8"/>
  </g>

  <!-- Result strip: varied instances -->
  <text x="40" y="376" font-size="18" font-weight="600" fill="currentColor">Result · every instance is different, the graph is not</text>
  <g>
    <rect x="70"  y="404" width="26" height="66" rx="3" fill="#B47EE8" fill-opacity="0.55"/>
    <rect x="150" y="420" width="34" height="50" rx="3" fill="#B47EE8" fill-opacity="0.55" transform="rotate(-12 167 445)"/>
    <rect x="240" y="398" width="22" height="72" rx="3" fill="#B47EE8" fill-opacity="0.55" transform="rotate(8 251 434)"/>
    <rect x="330" y="426" width="40" height="44" rx="3" fill="#B47EE8" fill-opacity="0.55" transform="rotate(-6 350 448)"/>
    <rect x="430" y="410" width="28" height="60" rx="3" fill="#B47EE8" fill-opacity="0.55" transform="rotate(15 444 440)"/>
    <rect x="520" y="416" width="32" height="54" rx="3" fill="#B47EE8" fill-opacity="0.55" transform="rotate(-18 536 443)"/>
    <rect x="610" y="402" width="24" height="68" rx="3" fill="#B47EE8" fill-opacity="0.55" transform="rotate(5 622 436)"/>
    <rect x="690" y="424" width="36" height="46" rx="3" fill="#B47EE8" fill-opacity="0.55" transform="rotate(-10 708 447)"/>
  </g>
  <line x1="60" y1="472" x2="740" y2="472" stroke="currentColor" stroke-width="1.5" opacity="0.25"/>

  <!-- Footer tip Variant B -->
  <rect x="40" y="506" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Feed the Index into the ID socket so each element gets a stable value · change Seed to reshuffle the whole set at once.</text>
</svg>
