<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" role="img" aria-labelledby="chc-title chc-desc" color="#222" font-family="'Segoe UI',system-ui,-apple-system,sans-serif">
<title id="chc-title">Collection hierarchy concept</title>
<desc id="chc-desc">A tree showing the Scene Collection root branching into nested collections, which in turn hold objects; collections are organizational containers, not scene geometry.</desc>
<text x="410" y="34" fill="currentColor" font-size="22" font-weight="700" text-anchor="middle">Collections are nesting containers</text>
<text x="410" y="58" fill="currentColor" font-size="14" text-anchor="middle" opacity="0.75">A Scene Collection holds collections; collections hold objects or more collections</text>

<!-- Scene Collection root -->
<rect x="300" y="82" width="220" height="46" rx="8" fill="#2a2a2a" stroke="#FF6B00" stroke-width="2"/>
<text x="330" y="111" fill="#d4d4d4" font-size="16">&#128194;</text>
<text x="356" y="111" fill="#d4d4d4" font-size="15" font-weight="700">Scene Collection</text>
<text x="530" y="105" fill="#FF6B00" font-size="12" font-weight="600">root</text>
<text x="530" y="121" fill="currentColor" font-size="11" opacity="0.7">always present</text>

<!-- connectors root -> children -->
<path d="M410 128 V150 M180 150 H640 M180 150 V174 M410 150 V174 M640 150 V174" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.55"/>

<!-- Child collection A: COLL_Environment -->
<rect x="70" y="174" width="220" height="44" rx="7" fill="#2a2a2a" stroke="#4A9EFF" stroke-width="1.6"/>
<text x="90" y="201" fill="#F5C242" font-size="15">&#128193;</text>
<text x="114" y="201" fill="#d4d4d4" font-size="13" font-weight="600">COLL_Environment</text>

<!-- Child collection B: COLL_Characters (nested) -->
<rect x="300" y="174" width="220" height="44" rx="7" fill="#2a2a2a" stroke="#4A9EFF" stroke-width="1.6"/>
<text x="320" y="201" fill="#F5C242" font-size="15">&#128193;</text>
<text x="344" y="201" fill="#d4d4d4" font-size="13" font-weight="600">COLL_Characters</text>

<!-- Child collection C: COLL_Lighting -->
<rect x="530" y="174" width="220" height="44" rx="7" fill="#2a2a2a" stroke="#4A9EFF" stroke-width="1.6"/>
<text x="550" y="201" fill="#F5C242" font-size="15">&#128193;</text>
<text x="574" y="201" fill="#d4d4d4" font-size="13" font-weight="600">COLL_Lighting</text>

<!-- Environment holds objects -->
<path d="M180 218 V240 M120 240 H240 M120 240 V262 M180 240 V262 M240 240 V262" fill="none" stroke="currentColor" stroke-width="1.3" opacity="0.5"/>
<g font-size="12">
<rect x="80" y="262" width="80" height="34" rx="5" fill="#2a2a2a" stroke="#4ADE80" stroke-width="1.2"/>
<text x="120" y="283" fill="#4ADE80" text-anchor="middle">&#9648; Ground</text>
<rect x="168" y="262" width="80" height="34" rx="5" fill="#2a2a2a" stroke="#4ADE80" stroke-width="1.2"/>
<text x="208" y="283" fill="#4ADE80" text-anchor="middle">&#9648; Trees</text>
</g>

<!-- Characters nests a sub-collection + object -->
<path d="M410 218 V240 M355 240 H465 M355 240 V262 M465 240 V262" fill="none" stroke="currentColor" stroke-width="1.3" opacity="0.5"/>
<rect x="300" y="262" width="120" height="34" rx="5" fill="#2a2a2a" stroke="#4A9EFF" stroke-width="1.4"/>
<text x="316" y="283" fill="#F5C242" font-size="13">&#128193;</text>
<text x="338" y="283" fill="#d4d4d4" font-size="11" font-weight="600">COLL_Hero</text>
<rect x="428" y="262" width="90" height="34" rx="5" fill="#2a2a2a" stroke="#4ADE80" stroke-width="1.2"/>
<text x="473" y="283" fill="#4ADE80" font-size="12" text-anchor="middle">&#9648; NPC_01</text>

<!-- sub-collection deeper -->
<path d="M360 296 V316" fill="none" stroke="currentColor" stroke-width="1.3" opacity="0.5"/>
<rect x="300" y="316" width="120" height="32" rx="5" fill="#2a2a2a" stroke="#4ADE80" stroke-width="1.2"/>
<text x="360" y="336" fill="#4ADE80" font-size="12" text-anchor="middle">&#9648; Hero_Body</text>

<!-- Lighting holds lights -->
<path d="M640 218 V240 M585 240 H695 M585 240 V262 M695 240 V262" fill="none" stroke="currentColor" stroke-width="1.3" opacity="0.5"/>
<g font-size="12">
<rect x="545" y="262" width="90" height="34" rx="5" fill="#2a2a2a" stroke="#4ADE80" stroke-width="1.2"/>
<text x="590" y="283" fill="#4ADE80" text-anchor="middle">&#9679; Key</text>
<rect x="643" y="262" width="90" height="34" rx="5" fill="#2a2a2a" stroke="#4ADE80" stroke-width="1.2"/>
<text x="688" y="283" fill="#4ADE80" text-anchor="middle">&#9679; Fill</text>
</g>

<!-- Legend -->
<rect x="70" y="392" width="680" height="140" rx="10" fill="#2a2a2a" stroke="currentColor" stroke-width="1" opacity="0.96"/>
<text x="90" y="418" fill="#d4d4d4" font-size="14" font-weight="700">How to read it</text>
<g font-size="13" fill="#d4d4d4">
<text x="90" y="444"><tspan fill="#FF6B00" font-weight="700">Scene Collection</tspan> is the fixed root &#8212; everything you see in the viewport lives under it.</text>
<text x="90" y="468"><tspan fill="#4A9EFF" font-weight="700">Collections</tspan> (folder icon) are containers. They can hold objects, or nest other collections to any depth.</text>
<text x="90" y="492"><tspan fill="#4ADE80" font-weight="700">Objects</tspan> (square/dot) are the actual scene data &#8212; meshes, lights, cameras &#8212; placed inside a collection.</text>
<text x="90" y="516" opacity="0.8">Collections are organizational only: nesting them changes structure, never the geometry itself.</text>
</g>
</svg>
