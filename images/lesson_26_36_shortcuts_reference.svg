<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="sr-title sr-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="sr-title">Essential Graph Editor keyboard shortcuts</title>
  <desc id="sr-desc">A keyboard shortcut cheat sheet for the Graph Editor, grouped into four sections. Navigation: Home frames all curves, Numpad Period frames the selection, drag the middle mouse button to pan, scroll to zoom, and Spacebar plays the animation. Selection: A selects all, Alt A deselects all, B box select, C circle select, and Shift Click adds to the selection. Editing: G grabs and moves, G then X or G then Y locks the move to one axis, S scales, R rotates handles, V sets the handle type, Shift D duplicates, and X deletes. Interface: N toggles the side panel, Shift and Ctrl modify snapping while dragging, and T opens the toolbar.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">KEYBOARD SHORTCUTS</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">The Graph Editor moves worth memorizing &#183; keep this handy until they are muscle memory</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ===================== NAVIGATION (top-left) ===================== -->
  <rect x="40" y="130" width="360" height="248" rx="10" fill="currentColor" opacity="0.04"/>
  <rect x="40" y="130" width="360" height="4" fill="#4A9EFF"/>
  <text x="62" y="162" font-size="15" font-weight="700" fill="#4A9EFF">NAVIGATION</text>
  <!-- rows -->
  <rect x="62" y="178" width="104" height="32" rx="6" fill="#FF6B00"/>
  <text x="114" y="200" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Home</text>
  <text x="182" y="200" font-size="13.5" fill="currentColor">Frame all curves</text>

  <rect x="62" y="218" width="104" height="32" rx="6" fill="#FF6B00"/>
  <text x="114" y="240" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Numpad .</text>
  <text x="182" y="240" font-size="13.5" fill="currentColor">Frame selected</text>

  <rect x="62" y="258" width="104" height="32" rx="6" fill="#FF6B00"/>
  <text x="114" y="280" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">MMB drag</text>
  <text x="182" y="280" font-size="13.5" fill="currentColor">Pan the view</text>

  <rect x="62" y="298" width="104" height="32" rx="6" fill="#FF6B00"/>
  <text x="114" y="320" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Scroll</text>
  <text x="182" y="320" font-size="13.5" fill="currentColor">Zoom in / out</text>

  <rect x="62" y="338" width="104" height="32" rx="6" fill="#FF6B00"/>
  <text x="114" y="360" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Spacebar</text>
  <text x="182" y="360" font-size="13.5" fill="currentColor">Play animation</text>

  <!-- ===================== SELECTION (top-right) ===================== -->
  <rect x="416" y="130" width="344" height="248" rx="10" fill="currentColor" opacity="0.04"/>
  <rect x="416" y="130" width="344" height="4" fill="#4ADE80"/>
  <text x="438" y="162" font-size="15" font-weight="700" fill="#4ADE80">SELECTION</text>

  <rect x="438" y="178" width="104" height="32" rx="6" fill="#FF6B00"/>
  <text x="490" y="200" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
  <text x="558" y="200" font-size="13.5" fill="currentColor">Select all</text>

  <rect x="438" y="218" width="104" height="32" rx="6" fill="#FF6B00"/>
  <text x="490" y="240" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Alt+A</text>
  <text x="558" y="240" font-size="13.5" fill="currentColor">Deselect all</text>

  <rect x="438" y="258" width="104" height="32" rx="6" fill="#FF6B00"/>
  <text x="490" y="280" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
  <text x="558" y="280" font-size="13.5" fill="currentColor">Box select</text>

  <rect x="438" y="298" width="104" height="32" rx="6" fill="#FF6B00"/>
  <text x="490" y="320" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
  <text x="558" y="320" font-size="13.5" fill="currentColor">Circle select</text>

  <rect x="438" y="338" width="104" height="32" rx="6" fill="#FF6B00"/>
  <text x="490" y="360" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">Shift+Click</text>
  <text x="558" y="360" font-size="13.5" fill="currentColor">Add to selection</text>

  <!-- ===================== EDITING (bottom-left) ===================== -->
  <rect x="40" y="394" width="360" height="222" rx="10" fill="currentColor" opacity="0.04"/>
  <rect x="40" y="394" width="360" height="4" fill="#FF6B00"/>
  <text x="62" y="424" font-size="15" font-weight="700" fill="#FF6B00">EDITING</text>

  <rect x="62" y="434" width="104" height="24" rx="6" fill="#FF6B00"/>
  <text x="114" y="451" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">G</text>
  <text x="182" y="451" font-size="13" fill="currentColor">Grab / move keys</text>

  <rect x="62" y="462" width="104" height="24" rx="6" fill="#FF6B00"/>
  <text x="114" y="479" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">G &#183; X / Y</text>
  <text x="182" y="479" font-size="13" fill="currentColor">Move on one axis</text>

  <rect x="62" y="490" width="104" height="24" rx="6" fill="#FF6B00"/>
  <text x="114" y="507" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">S</text>
  <text x="182" y="507" font-size="13" fill="currentColor">Scale keys</text>

  <rect x="62" y="518" width="104" height="24" rx="6" fill="#FF6B00"/>
  <text x="114" y="535" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">R</text>
  <text x="182" y="535" font-size="13" fill="currentColor">Rotate handles</text>

  <rect x="62" y="546" width="104" height="24" rx="6" fill="#FF6B00"/>
  <text x="114" y="563" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">V</text>
  <text x="182" y="563" font-size="13" fill="currentColor">Set handle type</text>

  <rect x="62" y="574" width="104" height="24" rx="6" fill="#FF6B00"/>
  <text x="114" y="591" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Shift+D</text>
  <text x="182" y="591" font-size="13" fill="currentColor">Duplicate</text>

  <rect x="244" y="574" width="60" height="24" rx="6" fill="#FF6B00"/>
  <text x="274" y="591" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">X</text>
  <text x="312" y="591" font-size="13" fill="currentColor">Delete</text>

  <!-- ===================== INTERFACE (bottom-right) ===================== -->
  <rect x="416" y="394" width="344" height="222" rx="10" fill="currentColor" opacity="0.04"/>
  <rect x="416" y="394" width="344" height="4" fill="#B47EE8"/>
  <text x="438" y="426" font-size="15" font-weight="700" fill="#B47EE8">INTERFACE</text>

  <rect x="438" y="442" width="104" height="32" rx="6" fill="#FF6B00"/>
  <text x="490" y="464" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">N</text>
  <text x="558" y="464" font-size="13.5" fill="currentColor">Side panel</text>

  <rect x="438" y="482" width="104" height="32" rx="6" fill="#FF6B00"/>
  <text x="490" y="504" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">T</text>
  <text x="558" y="504" font-size="13.5" fill="currentColor">Toolbar</text>

  <rect x="438" y="522" width="104" height="32" rx="6" fill="#FF6B00"/>
  <text x="490" y="544" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Shift</text>
  <text x="558" y="544" font-size="13.5" fill="currentColor">Fine, slow drag</text>

  <rect x="438" y="562" width="104" height="32" rx="6" fill="#FF6B00"/>
  <text x="490" y="584" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Ctrl</text>
  <text x="558" y="584" font-size="13.5" fill="currentColor">Snap while dragging</text>

  <!-- Footer tip (800x680 variant: y=641 rail, y=663 text) -->
  <rect x="40" y="641" width="720" height="34" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Hover any control and press F1, or check the status bar at the bottom, to see the live shortcut for your build.
  </text>
</svg>
