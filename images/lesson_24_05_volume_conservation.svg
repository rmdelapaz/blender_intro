<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="vc-title vc-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="vc-title">Squash and stretch volume conservation</title>
  <desc id="vc-desc">Three states of the same ball, squashed, neutral, and stretched. Each occupies the same volume: when the ball is squashed it becomes wider and shorter, and when it is stretched it becomes taller and thinner, but the overall volume stays constant.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Volume Conservation</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">The golden rule of squash and stretch: the volume never changes, only the shape</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Three equal-volume reference frames (dashed currentColor boxes), each 200 wide -->
  <g stroke="currentColor" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 5" fill="none">
    <rect x="58"  y="170" width="200" height="200"/>
    <rect x="300" y="170" width="200" height="200"/>
    <rect x="542" y="170" width="200" height="200"/>
  </g>

  <!-- SQUASHED (left): wide + short ellipse -->
  <ellipse cx="158" cy="318" rx="92" ry="46" fill="#FF6B00"/>
  <!-- width tick (wide) -->
  <g stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5">
    <line x1="66" y1="384" x2="250" y2="384"/>
    <line x1="66" y1="378" x2="66" y2="390"/>
    <line x1="250" y1="378" x2="250" y2="390"/>
  </g>
  <text x="158" y="402" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">wider</text>
  <!-- height tick (short) -->
  <g stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5">
    <line x1="266" y1="272" x2="266" y2="364"/>
    <line x1="260" y1="272" x2="272" y2="272"/>
    <line x1="260" y1="364" x2="272" y2="364"/>
  </g>
  <text x="284" y="322" font-size="12" fill="currentColor" opacity="0.6">shorter</text>

  <!-- NEUTRAL (center): perfect circle -->
  <circle cx="400" cy="270" r="62" fill="#FF6B00"/>
  <g stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5">
    <line x1="338" y1="346" x2="462" y2="346"/>
    <line x1="338" y1="340" x2="338" y2="352"/>
    <line x1="462" y1="340" x2="462" y2="352"/>
  </g>
  <text x="400" y="364" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">base width</text>

  <!-- STRETCHED (right): tall + thin ellipse -->
  <ellipse cx="642" cy="270" rx="40" ry="96" fill="#FF6B00"/>
  <!-- width tick (narrow) -->
  <g stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5">
    <line x1="602" y1="384" x2="682" y2="384"/>
    <line x1="602" y1="378" x2="602" y2="390"/>
    <line x1="682" y1="378" x2="682" y2="390"/>
  </g>
  <text x="642" y="402" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">thinner</text>
  <!-- height tick (tall) -->
  <g stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5">
    <line x1="500" y1="174" x2="500" y2="366"/>
    <line x1="494" y1="174" x2="506" y2="174"/>
    <line x1="494" y1="366" x2="506" y2="366"/>
  </g>
  <text x="484" y="274" text-anchor="end" font-size="12" fill="currentColor" opacity="0.6">taller</text>

  <!-- State labels -->
  <text x="158" y="150" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor">SQUASHED</text>
  <text x="400" y="150" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor">NEUTRAL</text>
  <text x="642" y="150" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor">STRETCHED</text>

  <!-- Equal-volume pills under each frame -->
  <g>
    <rect x="98"  y="432" width="120" height="26" rx="13" fill="#FF6B00" fill-opacity="0.12" stroke="#FF6B00" stroke-opacity="0.5"/>
    <text x="158" y="450" text-anchor="middle" font-size="13" font-weight="700" fill="#FF6B00">100% volume</text>
    <rect x="340" y="432" width="120" height="26" rx="13" fill="#FF6B00" fill-opacity="0.12" stroke="#FF6B00" stroke-opacity="0.5"/>
    <text x="400" y="450" text-anchor="middle" font-size="13" font-weight="700" fill="#FF6B00">100% volume</text>
    <rect x="582" y="432" width="120" height="26" rx="13" fill="#FF6B00" fill-opacity="0.12" stroke="#FF6B00" stroke-opacity="0.5"/>
    <text x="642" y="450" text-anchor="middle" font-size="13" font-weight="700" fill="#FF6B00">100% volume</text>
  </g>

  <!-- Equality connectors between frames -->
  <text x="279" y="455" text-anchor="middle" font-size="20" font-weight="700" fill="currentColor" opacity="0.5">=</text>
  <text x="521" y="455" text-anchor="middle" font-size="20" font-weight="700" fill="currentColor" opacity="0.5">=</text>

  <!-- Footer tip (Variant B left rail) -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> If a squash makes the ball wider, it must get shorter by the same measure. Grow one dimension, shrink the other.</text>
</svg>
