<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" color="#222" role="img" aria-labelledby="dm-title dm-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="dm-title">Duplication Methods Comparison</title>
  <desc id="dm-desc">Three precise ways to make duplicate arrays. Numerical duplication uses Shift+D then an axis and distance then Shift+R to repeat, giving regular spacing with full control. The Array modifier sets a count for a non-destructive editable array. Radial duplication snaps the cursor to a centre then rotates copies for circular arrangements.</desc>

  <rect x="0" y="0" width="800" height="680" rx="18" fill="#0f1a14"/>
  <rect x="0" y="0" width="800" height="10" rx="5" fill="#FF6B00"/>

  <text x="40" y="58" font-size="30" font-weight="700" fill="#f5f7f6">Three Ways to Duplicate</text>
  <text x="40" y="88" font-size="17" font-weight="500" fill="#9fb0a8">Same precision &#183; pick the method that fits the layout</text>

  <!-- panel 1 · Numerical (blue) -->
  <g>
    <rect x="32" y="116" width="240" height="492" rx="12" fill="#11201a" stroke="#4A9EFF" stroke-width="2"/>
    <rect x="32" y="116" width="240" height="46" rx="12" fill="#4A9EFF"/>
    <rect x="32" y="140" width="240" height="22" fill="#4A9EFF"/>
    <text x="152" y="147" font-size="18" font-weight="700" fill="#0f1a14" text-anchor="middle">Numerical</text>
    <!-- visual: linear evenly spaced cubes -->
    <g fill="#2a3a4f" stroke="#4A9EFF" stroke-width="2">
      <rect x="58" y="196" width="34" height="34" rx="3"/>
      <rect x="108" y="196" width="34" height="34" rx="3"/>
      <rect x="158" y="196" width="34" height="34" rx="3"/>
      <rect x="208" y="196" width="34" height="34" rx="3"/>
    </g>
    <g stroke="#9fb0a8" stroke-width="1.5">
      <line x1="92" y1="246" x2="108" y2="246"/>
      <line x1="142" y1="246" x2="158" y2="246"/>
      <line x1="192" y1="246" x2="208" y2="246"/>
    </g>
    <text x="152" y="263" font-size="12" fill="#9fb0a8" text-anchor="middle">equal spacing, full control</text>
    <!-- steps -->
    <text x="56" y="312" font-size="13" font-weight="700" fill="#cdd8d2">STEPS</text>
    <g font-size="13.5" fill="#e6edea">
      <text x="56" y="338">1. Shift+D to duplicate</text>
      <text x="56" y="362">2. X then 2.5 then Enter</text>
      <text x="56" y="386">3. Shift+R repeats it</text>
    </g>
    <!-- shortcut pill -->
    <rect x="56" y="404" width="184" height="30" rx="6" fill="#152232" stroke="#4A9EFF" stroke-width="1.5"/>
    <text x="148" y="424" font-size="13" font-weight="700" fill="#9fd0ff" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">Shift+D X 2.5 &#183; Shift+R</text>
    <!-- best for -->
    <text x="56" y="470" font-size="12.5" font-weight="700" fill="#4ADE80">BEST FOR</text>
    <text x="56" y="492" font-size="13" fill="#cdd8d2">Straight rows with</text>
    <text x="56" y="510" font-size="13" fill="#cdd8d2">exact, known spacing.</text>
  </g>

  <!-- panel 2 · Array Modifier (orange) -->
  <g>
    <rect x="280" y="116" width="240" height="492" rx="12" fill="#11201a" stroke="#FF6B00" stroke-width="2"/>
    <rect x="280" y="116" width="240" height="46" rx="12" fill="#FF6B00"/>
    <rect x="280" y="140" width="240" height="22" fill="#FF6B00"/>
    <text x="400" y="147" font-size="18" font-weight="700" fill="#0f1a14" text-anchor="middle">Array Modifier</text>
    <!-- visual: one solid + ghosted parametric copies -->
    <g>
      <rect x="306" y="196" width="34" height="34" rx="3" fill="#3a2a18" stroke="#FF6B00" stroke-width="2"/>
      <rect x="350" y="196" width="34" height="34" rx="3" fill="#241a10" stroke="#FF6B00" stroke-width="1.5" stroke-dasharray="4 3"/>
      <rect x="394" y="196" width="34" height="34" rx="3" fill="#241a10" stroke="#FF6B00" stroke-width="1.5" stroke-dasharray="4 3"/>
      <rect x="438" y="196" width="34" height="34" rx="3" fill="#241a10" stroke="#FF6B00" stroke-width="1.5" stroke-dasharray="4 3"/>
    </g>
    <text x="400" y="263" font-size="12" fill="#9fb0a8" text-anchor="middle">one source, live copies</text>
    <!-- steps -->
    <text x="304" y="312" font-size="13" font-weight="700" fill="#cdd8d2">STEPS</text>
    <g font-size="13.5" fill="#e6edea">
      <text x="304" y="338">1. Model the base once</text>
      <text x="304" y="362">2. Add Array modifier</text>
      <text x="304" y="386">3. Set Count + Offset</text>
    </g>
    <rect x="304" y="404" width="184" height="30" rx="6" fill="#2a1c10" stroke="#FF6B00" stroke-width="1.5"/>
    <text x="396" y="424" font-size="13" font-weight="700" fill="#ffb878" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">Modifiers &#183; Array</text>
    <text x="304" y="470" font-size="12.5" font-weight="700" fill="#4ADE80">BEST FOR</text>
    <text x="304" y="492" font-size="13" fill="#cdd8d2">Non-destructive sets</text>
    <text x="304" y="510" font-size="13" fill="#cdd8d2">you may re-edit later.</text>
  </g>

  <!-- panel 3 · Radial (purple) -->
  <g>
    <rect x="528" y="116" width="240" height="492" rx="12" fill="#11201a" stroke="#B47EE8" stroke-width="2"/>
    <rect x="528" y="116" width="240" height="46" rx="12" fill="#B47EE8"/>
    <rect x="528" y="140" width="240" height="22" fill="#B47EE8"/>
    <text x="648" y="147" font-size="18" font-weight="700" fill="#0f1a14" text-anchor="middle">Radial</text>
    <!-- visual: circular pattern around a centre -->
    <g>
      <circle cx="648" cy="213" r="3" fill="#B47EE8"/>
      <g fill="#2c2140" stroke="#B47EE8" stroke-width="2">
        <rect x="640" y="178" width="16" height="16" rx="2"/>
        <rect x="672" y="190" width="16" height="16" rx="2"/>
        <rect x="678" y="220" width="16" height="16" rx="2"/>
        <rect x="654" y="240" width="16" height="16" rx="2"/>
        <rect x="624" y="240" width="16" height="16" rx="2"/>
        <rect x="608" y="220" width="16" height="16" rx="2"/>
        <rect x="614" y="190" width="16" height="16" rx="2"/>
      </g>
    </g>
    <text x="648" y="270" font-size="12" fill="#9fb0a8" text-anchor="middle">copies around a centre</text>
    <text x="552" y="312" font-size="13" font-weight="700" fill="#cdd8d2">STEPS</text>
    <g font-size="13.5" fill="#e6edea">
      <text x="552" y="338">1. Cursor to centre</text>
      <text x="552" y="362">2. Shift+D then R Z 45</text>
      <text x="552" y="386">3. Shift+R fills the ring</text>
    </g>
    <rect x="552" y="404" width="184" height="30" rx="6" fill="#211733" stroke="#B47EE8" stroke-width="1.5"/>
    <text x="644" y="424" font-size="13" font-weight="700" fill="#d6b8f0" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">R Z 360/8 &#183; Shift+R</text>
    <text x="552" y="470" font-size="12.5" font-weight="700" fill="#4ADE80">BEST FOR</text>
    <text x="552" y="492" font-size="13" fill="#cdd8d2">Circular and spoke</text>
    <text x="552" y="510" font-size="13" fill="#cdd8d2">arrangements.</text>
  </g>

  <!-- footer tip rail -->
  <rect x="40" y="616" width="6" height="36" rx="3" fill="#F5C242"/>
  <text x="60" y="639" font-size="15" font-weight="600" fill="#F5C242">All three keep exact spacing &#183; the right choice is about editability and shape.</text>
</svg>
