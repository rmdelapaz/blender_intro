<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="gsm-title gsm-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="gsm-title">Goal to direction map: where your career goal routes your portfolio</title>
  <desc id="gsm-desc">A routing map from four common goals to the portfolio direction each one points toward. Wanting a game studio job routes to game-ready assets. Wanting film or visual effects routes to a cinematic render. Wanting product or archviz work routes to a realistic product or space. Wanting freelance or personal art routes to stylised signature work. Answer what you want first, then let it choose the direction.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Let Your Goal Choose the Direction</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Answer &#8220;what do I want this piece to do for me?&#8221; and the direction follows</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Column headers -->
  <text x="150" y="140" font-size="13" font-weight="700" fill="currentColor" opacity="0.55" text-anchor="middle">IF YOUR GOAL IS&#8230;</text>
  <text x="600" y="140" font-size="13" font-weight="700" fill="currentColor" opacity="0.55" text-anchor="middle">AIM THE PIECE AT&#8230;</text>

  <!-- connector group -->
  <g stroke="currentColor" stroke-width="1.5" opacity="0.3" stroke-linecap="round" fill="none">
    <path d="M 268 192 C 360 192 360 192 452 192"/>
    <path d="M 268 268 C 360 268 360 268 452 268"/>
    <path d="M 268 344 C 360 344 360 344 452 344"/>
    <path d="M 268 420 C 360 420 360 420 452 420"/>
  </g>
  <g fill="currentColor" opacity="0.35">
    <path d="M 452 192 l -9 -4 l 0 8 z"/>
    <path d="M 452 268 l -9 -4 l 0 8 z"/>
    <path d="M 452 344 l -9 -4 l 0 8 z"/>
    <path d="M 452 420 l -9 -4 l 0 8 z"/>
  </g>

  <!-- ROW 1: game studio -> game-ready -->
  <rect x="40" y="168" width="228" height="48" rx="8" fill="#4A9EFF" fill-opacity="0.10"/>
  <rect x="40" y="168" width="4" height="48" fill="#4A9EFF"/>
  <text x="58" y="190" font-size="14" font-weight="600" fill="currentColor">A game studio job</text>
  <text x="58" y="208" font-size="12" fill="currentColor" opacity="0.6">Realtime, teamwork, pipelines</text>
  <rect x="452" y="168" width="308" height="48" rx="8" fill="#4A9EFF" fill-opacity="0.14"/>
  <text x="470" y="190" font-size="14" font-weight="700" fill="#4A9EFF">Game-ready asset</text>
  <text x="470" y="208" font-size="12" fill="currentColor" opacity="0.7">Clean low-poly, baked maps, turntable, poly count shown</text>

  <!-- ROW 2: film/vfx -> cinematic -->
  <rect x="40" y="244" width="228" height="48" rx="8" fill="#B47EE8" fill-opacity="0.10"/>
  <rect x="40" y="244" width="4" height="48" fill="#B47EE8"/>
  <text x="58" y="266" font-size="14" font-weight="600" fill="currentColor">Film or visual effects</text>
  <text x="58" y="284" font-size="12" fill="currentColor" opacity="0.6">Story, mood, image quality</text>
  <rect x="452" y="244" width="308" height="48" rx="8" fill="#B47EE8" fill-opacity="0.14"/>
  <text x="470" y="266" font-size="14" font-weight="700" fill="#B47EE8">Cinematic render</text>
  <text x="470" y="284" font-size="12" fill="currentColor" opacity="0.7">Composed frame, dramatic light, post-processed final image</text>

  <!-- ROW 3: product/archviz -> realistic -->
  <rect x="40" y="320" width="228" height="48" rx="8" fill="#4ADE80" fill-opacity="0.10"/>
  <rect x="40" y="320" width="4" height="48" fill="#4ADE80"/>
  <text x="58" y="342" font-size="14" font-weight="600" fill="currentColor">Product or archviz work</text>
  <text x="58" y="360" font-size="12" fill="currentColor" opacity="0.6">Accuracy, materials, believability</text>
  <rect x="452" y="320" width="308" height="48" rx="8" fill="#4ADE80" fill-opacity="0.14"/>
  <text x="470" y="342" font-size="14" font-weight="700" fill="#4ADE80">Realistic product or space</text>
  <text x="470" y="360" font-size="12" fill="currentColor" opacity="0.7">True-to-life scale, PBR materials, studio or interior lighting</text>

  <!-- ROW 4: freelance/personal -> stylised -->
  <rect x="40" y="396" width="228" height="48" rx="8" fill="#F5C242" fill-opacity="0.10"/>
  <rect x="40" y="396" width="4" height="48" fill="#F5C242"/>
  <text x="58" y="418" font-size="14" font-weight="600" fill="currentColor">Freelance or personal art</text>
  <text x="58" y="436" font-size="12" fill="currentColor" opacity="0.6">Voice, identity, standing out</text>
  <rect x="452" y="396" width="308" height="48" rx="8" fill="#F5C242" fill-opacity="0.14"/>
  <text x="470" y="418" font-size="14" font-weight="700" fill="#F5C242">Stylised signature work</text>
  <text x="470" y="436" font-size="12" fill="currentColor" opacity="0.7">A distinct look, a recognisable palette, a piece only you would make</text>

  <!-- convergence note -->
  <rect x="40" y="464" width="720" height="30" rx="6" fill="currentColor" opacity="0.04"/>
  <text x="400" y="483" font-size="12.5" fill="currentColor" opacity="0.7" text-anchor="middle">Where a goal and a skill you already enjoy overlap is your sweet spot &#183; that&#8217;s the piece to build.</text>

  <!-- Footer tip (Variant B, left rail) -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> No goal yet? Pick the direction whose day-to-day work sounds most fun &#183; you&#8217;ll finish what you enjoy building.
  </text>
</svg>
