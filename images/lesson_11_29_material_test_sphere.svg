<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="ts-title ts-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="ts-title">Material test sphere preview setup</title>
  <desc id="ts-desc">A top-down schematic of a professional material preview setup. A test sphere sits at the center on a neutral gray ground, surrounded by an HDRI dome. A three-point lighting rig of key, fill, and rim lights is positioned around it, and a camera views the sphere from a 45-degree angle. Labels mark each element and its standard settings.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">MATERIAL TEST SPHERE SETUP</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">The industry-standard rig for previewing a material consistently</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Stage center reference -->
  <!-- center of stage at (400, 330) -->

  <!-- HDRI dome ring -->
  <circle cx="400" cy="330" r="190" fill="none" stroke="#4A9EFF" stroke-width="2" stroke-dasharray="3 6" opacity="0.7"/>
  <text x="400" y="158" font-size="13" font-weight="600" fill="#4A9EFF" text-anchor="middle">HDRI dome environment</text>
  <text x="400" y="176" font-size="11" fill="currentColor" opacity="0.6" text-anchor="middle">Studio HDRI &#183; strength 1.0</text>

  <!-- Neutral gray ground plane (ellipse, perspective) -->
  <ellipse cx="400" cy="378" rx="150" ry="46" fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-width="1" stroke-opacity="0.25"/>
  <text x="400" y="442" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">18% gray background plane</text>

  <!-- Test sphere -->
  <defs>
    <radialGradient id="ts-spherefill" cx="0.38" cy="0.34" r="0.75">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#FF6B00" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0.06"/>
    </radialGradient>
  </defs>
  <circle cx="400" cy="346" r="58" fill="url(#ts-spherefill)" stroke="#FF6B00" stroke-width="2"/>
  <!-- subtle latitude/longitude cue -->
  <ellipse cx="400" cy="346" rx="58" ry="20" fill="none" stroke="#FF6B00" stroke-width="1" opacity="0.4"/>
  <ellipse cx="400" cy="346" rx="20" ry="58" fill="none" stroke="#FF6B00" stroke-width="1" opacity="0.4"/>
  <text x="400" y="350" font-size="13" font-weight="700" fill="#FF6B00" text-anchor="middle">SPHERE</text>

  <!-- Key light (top-right, brightest) -->
  <g>
    <line x1="556" y1="206" x2="446" y2="312" stroke="#F5C242" stroke-width="2.5" stroke-linecap="round" opacity="0.85" stroke-dasharray="6 5"/>
    <polygon points="446,312 458,308 454,320" fill="#F5C242"/>
    <circle cx="566" cy="198" r="13" fill="#F5C242" fill-opacity="0.22" stroke="#F5C242" stroke-width="2"/>
    <g stroke="#F5C242" stroke-width="2" stroke-linecap="round">
      <line x1="566" y1="180" x2="566" y2="174"/>
      <line x1="581" y1="186" x2="586" y2="182"/>
      <line x1="584" y1="198" x2="590" y2="198"/>
    </g>
    <text x="588" y="196" font-size="14" font-weight="600" fill="currentColor">Key light</text>
    <text x="588" y="214" font-size="11" fill="currentColor" opacity="0.6">Main &#183; brightest</text>
  </g>

  <!-- Fill light (left, softer) -->
  <g>
    <line x1="214" y1="318" x2="336" y2="346" stroke="#4ADE80" stroke-width="2.5" stroke-linecap="round" opacity="0.8" stroke-dasharray="6 5"/>
    <polygon points="336,346 324,340 326,352" fill="#4ADE80"/>
    <circle cx="200" cy="316" r="13" fill="#4ADE80" fill-opacity="0.20" stroke="#4ADE80" stroke-width="2"/>
    <text x="120" y="312" font-size="14" font-weight="600" fill="currentColor">Fill light</text>
    <text x="120" y="330" font-size="11" fill="currentColor" opacity="0.6">Softens shadows</text>
  </g>

  <!-- Rim light (back, behind sphere) -->
  <g>
    <line x1="400" y1="200" x2="400" y2="290" stroke="#FF7EA8" stroke-width="2.5" stroke-linecap="round" opacity="0.8" stroke-dasharray="6 5"/>
    <polygon points="400,290 394,278 406,278" fill="#FF7EA8"/>
    <circle cx="400" cy="206" r="13" fill="#FF7EA8" fill-opacity="0.20" stroke="#FF7EA8" stroke-width="2"/>
    <text x="420" y="210" font-size="14" font-weight="600" fill="currentColor">Rim light</text>
    <text x="420" y="228" font-size="11" fill="currentColor" opacity="0.6">Edge separation</text>
  </g>

  <!-- Camera (front-right, 45 degrees) -->
  <g>
    <line x1="648" y1="330" x2="456" y2="356" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.55" stroke-dasharray="6 5"/>
    <polygon points="456,356 468,350 470,362" fill="currentColor" opacity="0.55"/>
    <!-- camera body -->
    <g transform="translate(650,320)">
      <rect x="0" y="0" width="34" height="22" rx="3" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="2" opacity="0.7"/>
      <polygon points="34,6 46,1 46,21 34,16" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="2" opacity="0.7"/>
    </g>
    <text x="650" y="300" font-size="14" font-weight="600" fill="currentColor">Camera</text>
    <text x="650" y="364" font-size="11" fill="currentColor" opacity="0.6">50mm &#183; 45&#176; angle</text>
    <!-- 45 degree angle arc near sphere -->
    <path d="M 458 348 A 30 30 0 0 1 476 372" fill="none" stroke="#FF6B00" stroke-width="1.5" opacity="0.7"/>
    <text x="480" y="366" font-size="11" font-weight="600" fill="#FF6B00">45&#176;</text>
  </g>

  <!-- Specs strip -->
  <rect x="40" y="470" width="4" height="44" fill="#FF6B00"/>
  <text x="58" y="488" font-size="14" font-weight="700" fill="currentColor">High-subdivision UV sphere &#183; three-point rig &#183; HDRI dome &#183; 18% gray</text>
  <text x="58" y="508" font-size="13" fill="currentColor" opacity="0.65">Keep the rig fixed and only swap the material, so every preview is judged on the same terms.</text>

  <!-- Footer tip (Variant B, left rail) -->
  <rect x="40" y="526" width="720" height="30" rx="0" fill="none"/>
  <rect x="40" y="526" width="4" height="30" fill="#FF6B00"/>
  <text x="58" y="546" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Render every material on this same sphere to build a consistent, comparable material catalog.
  </text>
</svg>
