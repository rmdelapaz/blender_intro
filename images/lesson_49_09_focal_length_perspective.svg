<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" color="#222" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" role="img" aria-labelledby="fl49-t fl49-d">
  <title id="fl49-t">Focal Length: How Lens Choice Reshapes a Building</title>
  <desc id="fl49-d">The same building framed at 24mm, 50mm, and 85mm, comparing how a wide lens exaggerates perspective and distorts edges while a longer lens compresses depth and flattens the facade, so the right focal length is chosen for the look intended.</desc>
  <rect x="0" y="0" width="760" height="400" fill="none"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="currentColor">Camera Settings That Matter &#8212; Focal Length</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#8a8f98">Same building, three lenses &#8212; the trade between drama and honesty</text>

  <!-- 24mm -->
  <g>
    <text x="145" y="94" text-anchor="middle" font-size="13.5" font-weight="700" fill="#FF6B00">24mm wide</text>
    <rect x="60" y="106" width="170" height="180" rx="8" fill="#1a1a1a" stroke="#FF6B00" stroke-width="1.6"/>
    <!-- keystoned building -->
    <path d="M108,150 L182,150 L200,258 L90,258 Z" fill="none" stroke="#FF6B00" stroke-width="1.8"/>
    <line x1="145" y1="150" x2="145" y2="258" stroke="#FF6B00" stroke-width="0.8" opacity="0.6"/>
    <text x="145" y="304" text-anchor="middle" font-size="11" fill="#8a8f98">exaggerated depth,</text>
    <text x="145" y="318" text-anchor="middle" font-size="11" fill="#8a8f98">edges flare outward</text>
    <text x="145" y="338" text-anchor="middle" font-size="10.5" fill="#c9ccd1">good: tight sites, interiors</text>
  </g>
  <!-- 50mm -->
  <g>
    <text x="380" y="94" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4ADE80">50mm normal</text>
    <rect x="295" y="106" width="170" height="180" rx="8" fill="#1a1a1a" stroke="#4ADE80" stroke-width="1.6"/>
    <rect x="335" y="152" width="90" height="106" fill="none" stroke="#4ADE80" stroke-width="1.8"/>
    <line x1="380" y1="152" x2="380" y2="258" stroke="#4ADE80" stroke-width="0.8" opacity="0.6"/>
    <text x="380" y="304" text-anchor="middle" font-size="11" fill="#8a8f98">natural, close to how</text>
    <text x="380" y="318" text-anchor="middle" font-size="11" fill="#8a8f98">the eye sees it</text>
    <text x="380" y="338" text-anchor="middle" font-size="10.5" fill="#c9ccd1">good: honest documentation</text>
  </g>
  <!-- 85mm -->
  <g>
    <text x="615" y="94" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4A9EFF">85mm long</text>
    <rect x="530" y="106" width="170" height="180" rx="8" fill="#1a1a1a" stroke="#4A9EFF" stroke-width="1.6"/>
    <rect x="576" y="158" width="78" height="94" fill="none" stroke="#4A9EFF" stroke-width="1.8"/>
    <line x1="615" y1="158" x2="615" y2="252" stroke="#4A9EFF" stroke-width="0.8" opacity="0.6"/>
    <text x="615" y="304" text-anchor="middle" font-size="11" fill="#8a8f98">compressed, flattened</text>
    <text x="615" y="318" text-anchor="middle" font-size="11" fill="#8a8f98">&#8212; layers stack up</text>
    <text x="615" y="338" text-anchor="middle" font-size="10.5" fill="#c9ccd1">good: detail &amp; context shots</text>
  </g>

  <rect x="150" y="360" width="460" height="30" rx="6" fill="#1a1a1a"/>
  <text x="380" y="380" text-anchor="middle" font-size="12.5" fill="#F5C242">Wide = dramatic but distorts &#183; Long = truthful proportions, less depth</text>
</svg>
