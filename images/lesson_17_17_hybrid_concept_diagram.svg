<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="hc-title hc-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="hc-title">Combining HDRI and manual lights</title>
  <desc id="hc-desc">A Venn diagram showing HDRI lighting (ambient and reflections) overlapping with manual three-point lights (key, fill, rim); the overlap is the best result, realistic base plus precise control. Two example tiles below show a flat HDRI-only result versus a controlled hybrid result.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">COMBINING HDRI + MANUAL LIGHTS</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">HDRI for realistic base &#183; manual lights for precise control</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ===== Venn ===== -->
  <!-- Left circle: HDRI (brand orange) -->
  <circle cx="320" cy="290" r="170" fill="#FF6B00" fill-opacity="0.10" stroke="#FF6B00" stroke-width="2.5"/>
  <!-- Right circle: Manual lights (cool neutral blue) -->
  <circle cx="480" cy="290" r="170" fill="#4A9EFF" fill-opacity="0.10" stroke="#4A9EFF" stroke-width="2.5"/>

  <!-- HDRI side label + bullets -->
  <text x="205" y="200" text-anchor="middle" font-size="18" font-weight="700" fill="#FF6B00">HDRI</text>
  <text x="205" y="232" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.85">Ambient light</text>
  <text x="205" y="254" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.85">Reflections</text>
  <text x="205" y="276" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.85">Environment</text>
  <text x="205" y="298" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.85">Quick realism</text>

  <!-- Manual side label + bullets (three-light coding) -->
  <text x="595" y="200" text-anchor="middle" font-size="18" font-weight="700" fill="#4A9EFF">MANUAL LIGHTS</text>
  <text x="595" y="232" text-anchor="middle" font-size="13" fill="#667eea" font-weight="600">Key &#183; direction</text>
  <text x="595" y="254" text-anchor="middle" font-size="13" fill="#6BCF7F" font-weight="600">Fill &#183; contrast</text>
  <text x="595" y="276" text-anchor="middle" font-size="13" fill="#FF6B9D" font-weight="600">Rim &#183; separation</text>
  <text x="595" y="298" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.85">Drama &#183; control</text>

  <!-- Overlap label -->
  <text x="400" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor">BEST</text>
  <text x="400" y="282" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor">RESULTS</text>
  <text x="400" y="308" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.7">realistic</text>
  <text x="400" y="324" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.7">+ controlled</text>

  <!-- ===== Example tiles ===== -->
  <text x="40" y="500" font-size="18" font-weight="600" fill="currentColor">The hybrid difference</text>

  <!-- Tile A: HDRI only (flat) -->
  <rect x="40" y="516" width="350" height="86" rx="8" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.18" stroke-width="1"/>
  <circle cx="92" cy="559" r="26" fill="#9a9aa0"/>
  <ellipse cx="92" cy="588" rx="30" ry="6" fill="currentColor" opacity="0.12"/>
  <text x="140" y="548" font-size="13" font-weight="700" fill="#FF6B00">HDRI only</text>
  <text x="140" y="570" font-size="12" fill="currentColor" opacity="0.75">Realistic ambient, but flat &#183;</text>
  <text x="140" y="588" font-size="12" fill="currentColor" opacity="0.75">no controlled key or separation</text>

  <!-- Tile B: HDRI + manual (controlled) -->
  <rect x="410" y="516" width="350" height="86" rx="8" fill="#FF6B00" fill-opacity="0.05" stroke="#FF6B00" stroke-opacity="0.4" stroke-width="1.5"/>
  <circle cx="462" cy="559" r="26" fill="#c9c9cf"/>
  <path d="M 462 533 A 26 26 0 0 1 485 572 L 462 559 Z" fill="#ffffff" opacity="0.55"/>
  <path d="M 462 559 L 440 575 A 26 26 0 0 1 449 540 Z" fill="#6BCF7F" opacity="0.30"/>
  <ellipse cx="462" cy="588" rx="30" ry="6" fill="currentColor" opacity="0.12"/>
  <text x="510" y="548" font-size="13" font-weight="700" fill="#FF6B00">HDRI + manual lights</text>
  <text x="510" y="570" font-size="12" fill="currentColor" opacity="0.85">Realistic base AND a defined key,</text>
  <text x="510" y="588" font-size="12" fill="currentColor" opacity="0.85">fill, and rim &#183; full control</text>

  <!-- Footer tip (Variant B, dense) -->
  <rect x="40" y="641" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Drop HDRI strength to 0.3&#8211;0.7 when adding manual lights, so it becomes fill, not the whole scene.
  </text>
</svg>
