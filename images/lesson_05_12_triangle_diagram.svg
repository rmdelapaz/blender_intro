<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" color="#222"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Triangle: three vertices, always planar</title>
  <desc>A geometric primer for the triangle polygon type. A large equilateral
  triangle is shown with three highlighted orange vertex glyphs. Three property
  pills below the shape list the side count, animation behavior, and subdivision
  behavior. An italic takeaway and a footer tip card reinforce that triangles
  are always planar and that GPUs ultimately render everything as triangles.</desc>

  <!-- Top accent rail -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Header band -->
  <text x="400" y="56" text-anchor="middle" font-size="24" font-weight="700"
        fill="currentColor">TRIANGLE</text>
  <text x="400" y="84" text-anchor="middle" font-size="14"
        fill="currentColor" opacity="0.65">Three vertices. Always planar. The bedrock of real-time graphics.</text>
  <line x1="120" y1="108" x2="680" y2="108"
        stroke="currentColor" stroke-width="1" opacity="0.25"/>
  <text x="400" y="138" text-anchor="middle" font-size="15" font-weight="700"
        fill="#FF6B00" letter-spacing="2">TRIANGLE &#183; 3 SIDES</text>

  <!-- Hero polygon: equilateral triangle, apex top -->
  <polygon points="400,195 270,415 530,415"
           fill="currentColor" fill-opacity="0.05"
           stroke="#FF6B00" stroke-width="4" stroke-linejoin="round"/>

  <!-- Vertex glyphs (three-circle stack per vertex) -->
  <g id="tri-vertices">
    <!-- Apex -->
    <circle cx="400" cy="195" r="10" fill="#FF6B00" opacity="0.20"/>
    <circle cx="400" cy="195" r="6" fill="#FF6B00"/>
    <circle cx="400" cy="195" r="1.8" fill="#ffffff"/>
    <!-- Bottom-left -->
    <circle cx="270" cy="415" r="10" fill="#FF6B00" opacity="0.20"/>
    <circle cx="270" cy="415" r="6" fill="#FF6B00"/>
    <circle cx="270" cy="415" r="1.8" fill="#ffffff"/>
    <!-- Bottom-right -->
    <circle cx="530" cy="415" r="10" fill="#FF6B00" opacity="0.20"/>
    <circle cx="530" cy="415" r="6" fill="#FF6B00"/>
    <circle cx="530" cy="415" r="1.8" fill="#ffffff"/>
  </g>

  <!-- Property pills row -->
  <g id="tri-pills">
    <!-- Sides -->
    <rect x="50" y="425" width="220" height="40" rx="6"
          fill="currentColor" fill-opacity="0.04"
          stroke="#FF6B00" stroke-width="1" stroke-opacity="0.5"/>
    <text x="160" y="442" text-anchor="middle" font-size="11" font-weight="700"
          fill="#FF6B00" letter-spacing="1">SIDES</text>
    <text x="160" y="459" text-anchor="middle" font-size="12"
          fill="currentColor" opacity="0.85">3</text>
    <!-- Animation -->
    <rect x="290" y="425" width="220" height="40" rx="6"
          fill="currentColor" fill-opacity="0.04"
          stroke="#FF6B00" stroke-width="1" stroke-opacity="0.5"/>
    <text x="400" y="442" text-anchor="middle" font-size="11" font-weight="700"
          fill="#FF6B00" letter-spacing="1">ANIMATION</text>
    <text x="400" y="459" text-anchor="middle" font-size="12"
          fill="currentColor" opacity="0.85">Always planar</text>
    <!-- Subdivision -->
    <rect x="530" y="425" width="220" height="40" rx="6"
          fill="currentColor" fill-opacity="0.04"
          stroke="#FF6B00" stroke-width="1" stroke-opacity="0.5"/>
    <text x="640" y="442" text-anchor="middle" font-size="11" font-weight="700"
          fill="#FF6B00" letter-spacing="1">SUBDIVISION</text>
    <text x="640" y="459" text-anchor="middle" font-size="12"
          fill="currentColor" opacity="0.85">Subdivides cleanly</text>
  </g>

  <!-- Italic takeaway -->
  <text x="400" y="490" text-anchor="middle" font-size="13" font-style="italic"
        fill="currentColor" opacity="0.75">Three points always define a flat plane. Game engines tessellate everything to triangles before rendering.</text>

  <!-- Footer tip card -->
  <g id="tri-tip">
    <rect x="40" y="506" width="720" height="34" rx="6"
          fill="currentColor" fill-opacity="0.04"
          stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>
    <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
    <text x="58" y="527" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Triangles are what your GPU actually draws. Even quads get split into two triangles at render time.</text>
  </g>
</svg>
