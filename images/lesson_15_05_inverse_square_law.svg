<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="isq-title isq-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="isq-title">The inverse square law of light falloff</title>
  <desc id="isq-desc">A light source emits a widening cone of rays. The same amount of light spreads over one unit of area at distance d, four units of area at distance 2d, and nine units at distance 3d, so brightness falls to 100 percent, then 25 percent, then about 11 percent. Doubling the distance quarters the brightness.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">The Inverse Square Law</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Light intensity falls with the square of distance &#183; double distance = quarter brightness</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Diagram region: light at left (x=90,cy=300), cone opening to the right -->
  <!-- Three planes at x=300 (1d), x=520 (2d), x=730 (3d). Cone half-heights scale 1:2:3 -->
  <!-- base half-height 40 at 1d -> 40 / 80 / 120 -->

  <!-- Cone fill (light spread) -->
  <polygon points="90,300 300,260 730,180 730,420 300,340"
           fill="#FF6B00" fill-opacity="0.08"/>
  <!-- Cone edge rays -->
  <g stroke="#FF6B00" stroke-width="2" stroke-opacity="0.55" stroke-linecap="round">
    <line x1="90" y1="300" x2="730" y2="180"/>
    <line x1="90" y1="300" x2="730" y2="420"/>
  </g>
  <!-- A few interior rays for emission feel -->
  <g stroke="#FF6B00" stroke-width="1" stroke-opacity="0.3" stroke-linecap="round">
    <line x1="90" y1="300" x2="730" y2="220"/>
    <line x1="90" y1="300" x2="730" y2="300"/>
    <line x1="90" y1="300" x2="730" y2="380"/>
  </g>

  <!-- Light source -->
  <circle cx="90" cy="300" r="16" fill="#FF6B00"/>
  <circle cx="90" cy="300" r="24" fill="none" stroke="#FF6B00" stroke-width="2" stroke-opacity="0.4"/>
  <text x="90" y="356" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">light</text>

  <!-- Plane 1 @ 1d : half-height 40 (260..340), 1 cell -->
  <rect x="294" y="260" width="12" height="80" fill="#FF6B00" fill-opacity="0.85"/>
  <text x="300" y="244" font-size="14" font-weight="700" fill="currentColor" text-anchor="middle">1d</text>
  <text x="300" y="372" font-size="16" font-weight="700" fill="#FF6B00" text-anchor="middle">100%</text>
  <text x="300" y="392" font-size="12" fill="currentColor" opacity="0.7" text-anchor="middle">1 &#215; area</text>

  <!-- Plane 2 @ 2d : half-height 80 (220..380), 4 cells (2x2 grid feel via splits) -->
  <rect x="514" y="220" width="12" height="160" fill="#FF6B00" fill-opacity="0.45"/>
  <text x="520" y="204" font-size="14" font-weight="700" fill="currentColor" text-anchor="middle">2d</text>
  <text x="520" y="410" font-size="16" font-weight="700" fill="#FF6B00" text-anchor="middle">25%</text>
  <text x="520" y="430" font-size="12" fill="currentColor" opacity="0.7" text-anchor="middle">4 &#215; area</text>

  <!-- Plane 3 @ 3d : half-height 120 (180..420), 9 cells -->
  <rect x="724" y="180" width="12" height="240" fill="#FF6B00" fill-opacity="0.28"/>
  <text x="730" y="164" font-size="14" font-weight="700" fill="currentColor" text-anchor="middle">3d</text>
  <text x="700" y="452" font-size="16" font-weight="700" fill="#FF6B00" text-anchor="end">11%</text>
  <text x="700" y="472" font-size="12" fill="currentColor" opacity="0.7" text-anchor="end">9 &#215; area</text>

  <!-- Distance baseline with brackets -->
  <line x1="90" y1="300" x2="730" y2="300" stroke="currentColor" stroke-opacity="0.0"/>

  <!-- The math row -->
  <text x="40" y="506" font-size="14" fill="currentColor" opacity="0.85">
    Brightness &#8733; 1 / distance&#178; &#160;&#183;&#160; at 2&#215; distance the light covers 4&#215; the area, so each point gets &#188;.
  </text>

  <!-- Footer tip (Variant B left rail) -->
  <rect x="40" y="516" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="516" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="538" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Inverse Square is Blender's default falloff, and why objects near a light look so much brighter than far ones.
  </text>
</svg>
