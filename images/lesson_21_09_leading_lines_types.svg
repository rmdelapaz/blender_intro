<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="ll-title ll-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="ll-title">Leading line types and their moods</title>
  <desc id="ll-desc">Six panels showing line types used to guide the eye through a composition: horizontal lines feel calm, vertical lines feel powerful, diagonal lines feel dynamic, curved lines feel graceful, zigzag lines feel tense, and converging lines create depth.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">LEADING LINE TYPES</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Each line shape carries its own mood &#183; use it to steer the eye</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ============ 3 cols x 2 rows ============ -->
  <!-- cell w 230, gap 15; xs: 40, 285, 530 ; row ys: 138 and 410 ; cell h 250 -->

  <!-- HORIZONTAL -->
  <g>
    <rect x="40" y="138" width="230" height="250" rx="8" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.12"/>
    <g stroke="#4A9EFF" stroke-width="4" stroke-linecap="round">
      <line x1="75" y1="220" x2="235" y2="220"/>
      <line x1="75" y1="255" x2="235" y2="255"/>
      <line x1="75" y1="290" x2="235" y2="290"/>
    </g>
    <text x="155" y="338" font-size="15" font-weight="600" fill="currentColor" text-anchor="middle">Horizontal</text>
    <text x="155" y="360" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">Calm &#183; stable &#183; restful</text>
  </g>

  <!-- VERTICAL -->
  <g>
    <rect x="285" y="138" width="230" height="250" rx="8" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.12"/>
    <g stroke="#FF6B00" stroke-width="4" stroke-linecap="round">
      <line x1="345" y1="185" x2="345" y2="305"/>
      <line x1="400" y1="185" x2="400" y2="305"/>
      <line x1="455" y1="185" x2="455" y2="305"/>
    </g>
    <text x="400" y="338" font-size="15" font-weight="600" fill="currentColor" text-anchor="middle">Vertical</text>
    <text x="400" y="360" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">Power &#183; strength &#183; growth</text>
  </g>

  <!-- DIAGONAL -->
  <g>
    <rect x="530" y="138" width="230" height="250" rx="8" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.12"/>
    <g stroke="#E63946" stroke-width="4" stroke-linecap="round">
      <line x1="565" y1="305" x2="700" y2="185"/>
      <line x1="585" y1="310" x2="725" y2="200"/>
    </g>
    <text x="645" y="338" font-size="15" font-weight="600" fill="currentColor" text-anchor="middle">Diagonal</text>
    <text x="645" y="360" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">Dynamic &#183; energy &#183; motion</text>
  </g>

  <!-- CURVED -->
  <g>
    <rect x="40" y="410" width="230" height="250" rx="8" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.12"/>
    <path d="M 80 470 C 230 480, 70 560, 230 575" fill="none" stroke="#4ADE80" stroke-width="4" stroke-linecap="round"/>
    <text x="155" y="610" font-size="15" font-weight="600" fill="currentColor" text-anchor="middle">Curved</text>
    <text x="155" y="632" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">Graceful &#183; natural &#183; flowing</text>
  </g>

  <!-- ZIGZAG -->
  <g>
    <rect x="285" y="410" width="230" height="250" rx="8" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.12"/>
    <polyline points="320,560 360,475 400,560 440,475 480,560" fill="none" stroke="#F5C242" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="400" y="610" font-size="15" font-weight="600" fill="currentColor" text-anchor="middle">Zigzag</text>
    <text x="400" y="632" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">Tension &#183; chaos &#183; alert</text>
  </g>

  <!-- CONVERGING -->
  <g>
    <rect x="530" y="410" width="230" height="250" rx="8" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.12"/>
    <g stroke="#B47EE8" stroke-width="4" stroke-linecap="round">
      <line x1="560" y1="575" x2="645" y2="475"/>
      <line x1="730" y1="575" x2="645" y2="475"/>
      <line x1="600" y1="575" x2="645" y2="500"/>
      <line x1="690" y1="575" x2="645" y2="500"/>
    </g>
    <circle cx="645" cy="475" r="6" fill="#B47EE8"/>
    <text x="645" y="610" font-size="15" font-weight="600" fill="currentColor" text-anchor="middle">Converging</text>
    <text x="645" y="632" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">Depth &#183; perspective &#183; pull</text>
  </g>

  <!-- Footer tip callout (Variant B, left rail) -->
  <rect x="40" y="641" width="720" height="34" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Aim lines so they enter from a corner and lead toward your subject, not off the edge of the frame.
  </text>
</svg>
