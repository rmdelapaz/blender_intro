<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="dt-title dt-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="dt-title">Material Workflow Decision Tree</title>
  <desc id="dt-desc">A top-to-bottom flowchart for choosing Metallic and Roughness values. It starts by asking whether the material is metal, which sets Metallic to 1.0 or 0.0, then asks how reflective the surface is, branching to five Roughness ranges from mirror smooth (0.0 to 0.1) down to completely rough (0.9 to 1.0).</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Material Workflow Decision Tree</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Two questions decide most materials: metal or not, then how reflective</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Connectors -->
  <g stroke="currentColor" stroke-opacity="0.3" stroke-width="1.5" stroke-linecap="round" fill="none">
    <line x1="400" y1="168" x2="400" y2="182"/>
    <line x1="332" y1="210" x2="210" y2="210"/>
    <line x1="210" y1="210" x2="210" y2="240"/>
    <line x1="468" y1="210" x2="590" y2="210"/>
    <line x1="590" y1="210" x2="590" y2="240"/>
    <line x1="210" y1="284" x2="210" y2="306"/>
    <line x1="210" y1="306" x2="400" y2="306"/>
    <line x1="590" y1="284" x2="590" y2="306"/>
    <line x1="590" y1="306" x2="400" y2="306"/>
    <line x1="400" y1="306" x2="400" y2="320"/>
  </g>

  <!-- Start node -->
  <rect x="280" y="136" width="240" height="32" rx="16" fill="#B47EE8"/>
  <text x="400" y="157" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1014">Start: what am I making?</text>

  <!-- Decision 1 -->
  <polygon points="400,182 468,210 400,238 332,210" fill="#FF6B00"/>
  <text x="400" y="215" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1014">Is it metal?</text>
  <text x="266" y="202" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">Yes</text>
  <text x="534" y="202" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">No</text>

  <!-- Action boxes -->
  <rect x="110" y="240" width="200" height="44" rx="8" fill="#4ADE80"/>
  <text x="210" y="261" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1a14">Metal</text>
  <text x="210" y="278" text-anchor="middle" font-size="13" font-weight="400" fill="#0f1a14">Metallic = 1.0</text>
  <rect x="490" y="240" width="200" height="44" rx="8" fill="#4ADE80"/>
  <text x="590" y="261" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1a14">Not metal</text>
  <text x="590" y="278" text-anchor="middle" font-size="13" font-weight="400" fill="#0f1a14">Metallic = 0.0</text>

  <!-- Decision 2 -->
  <polygon points="400,320 488,350 400,380 312,350" fill="#FF6B00"/>
  <text x="400" y="347" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1014">How reflective</text>
  <text x="400" y="364" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1014">is the surface?</text>

  <!-- Fan-out trunk to 5 rows -->
  <g stroke="currentColor" stroke-opacity="0.3" stroke-width="1.5" stroke-linecap="round" fill="none">
    <line x1="400" y1="380" x2="400" y2="398"/>
    <line x1="150" y1="398" x2="400" y2="398"/>
    <line x1="150" y1="398" x2="150" y2="650"/>
    <line x1="150" y1="424" x2="468" y2="424"/>
    <line x1="150" y1="480" x2="468" y2="480"/>
    <line x1="150" y1="536" x2="468" y2="536"/>
    <line x1="150" y1="592" x2="468" y2="592"/>
    <line x1="150" y1="648" x2="468" y2="648"/>
  </g>

  <!-- 5 value rows: left descriptor + blue value box -->
  <text x="150" y="420" text-anchor="start" font-size="13" font-weight="600" fill="currentColor">Mirror smooth</text>
  <rect x="470" y="402" width="240" height="40" rx="8" fill="#4A9EFF"/>
  <text x="590" y="427" text-anchor="middle" font-size="14" font-weight="700" fill="#08172e">Roughness 0.0 &#183; 0.1</text>

  <text x="150" y="476" text-anchor="start" font-size="13" font-weight="600" fill="currentColor">Glossy / polished</text>
  <rect x="470" y="458" width="240" height="40" rx="8" fill="#4A9EFF"/>
  <text x="590" y="483" text-anchor="middle" font-size="14" font-weight="700" fill="#08172e">Roughness 0.1 &#183; 0.3</text>

  <text x="150" y="532" text-anchor="start" font-size="13" font-weight="600" fill="currentColor">Satin / semi-gloss</text>
  <rect x="470" y="514" width="240" height="40" rx="8" fill="#4A9EFF"/>
  <text x="590" y="539" text-anchor="middle" font-size="14" font-weight="700" fill="#08172e">Roughness 0.3 &#183; 0.6</text>

  <text x="150" y="588" text-anchor="start" font-size="13" font-weight="600" fill="currentColor">Matte / diffuse</text>
  <rect x="470" y="570" width="240" height="40" rx="8" fill="#4A9EFF"/>
  <text x="590" y="595" text-anchor="middle" font-size="14" font-weight="700" fill="#08172e">Roughness 0.6 &#183; 0.9</text>

  <text x="150" y="644" text-anchor="start" font-size="13" font-weight="600" fill="currentColor">Completely rough</text>
  <rect x="470" y="626" width="240" height="40" rx="8" fill="#4A9EFF"/>
  <text x="590" y="651" text-anchor="middle" font-size="14" font-weight="700" fill="#08172e">Roughness 0.9 &#183; 1.0</text>
</svg>
