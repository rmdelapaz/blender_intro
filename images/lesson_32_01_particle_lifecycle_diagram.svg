<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="pl-title pl-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" color="#222">
  <title id="pl-title">Particle lifecycle from birth to death</title>
  <desc id="pl-desc">A left-to-right flow diagram showing the three stages of a particle's life: Birth at the emitter, Life while forces act on the moving particle, and Death as the particle fades after its lifespan ends.</desc>
  <style>
    .pl-stage{font:700 18px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:currentColor}
    .pl-sub{font:400 13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:currentColor;opacity:.6}
    .pl-lbl{font:400 12px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:currentColor;opacity:.7}
    .pl-card{fill:currentColor;fill-opacity:.04;stroke:currentColor;stroke-opacity:.15;stroke-width:1}
    .pl-emit{fill:#4A9EFF;fill-opacity:.18;stroke:#4A9EFF;stroke-width:2}
    .pl-flow{stroke:currentColor;stroke-opacity:.3;stroke-width:2;fill:none;stroke-linecap:round}
    .pl-force{stroke:currentColor;stroke-opacity:.45;stroke-width:1.5;fill:none;stroke-linecap:round}
  </style>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">PARTICLE LIFECYCLE</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Birth &#183; Life &#183; Death &#183; every particle follows the same arc</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Three stage cards -->
  <rect class="pl-card" x="40" y="140" width="220" height="260" rx="8"/>
  <rect class="pl-card" x="290" y="140" width="220" height="260" rx="8"/>
  <rect class="pl-card" x="540" y="140" width="220" height="260" rx="8"/>

  <!-- Flow arrows between cards -->
  <g>
    <path class="pl-flow" d="M262,270 H286"/>
    <path class="pl-flow" d="M280,264 L288,270 L280,276" stroke-linejoin="round"/>
    <path class="pl-flow" d="M512,270 H536"/>
    <path class="pl-flow" d="M530,264 L538,270 L530,276" stroke-linejoin="round"/>
  </g>

  <!-- ===== Stage 1: BIRTH ===== -->
  <text class="pl-stage" x="150" y="172" text-anchor="middle">BIRTH</text>
  <text class="pl-sub" x="150" y="192" text-anchor="middle">Spawned at the emitter</text>
  <!-- emitter object -->
  <rect class="pl-emit" x="92" y="300" width="64" height="48" rx="4"/>
  <text class="pl-lbl" x="124" y="368" text-anchor="middle">Emitter object</text>
  <!-- a fresh particle leaving the surface -->
  <circle cx="178" cy="276" r="8" fill="#FF6B00"/>
  <circle cx="160" cy="296" r="5" fill="#FF6B00" fill-opacity="0.7"/>
  <text class="pl-lbl" x="200" y="236" text-anchor="middle">New particle</text>

  <!-- ===== Stage 2: LIFE ===== -->
  <text class="pl-stage" x="400" y="172" text-anchor="middle">LIFE</text>
  <text class="pl-sub" x="400" y="192" text-anchor="middle">Moves as forces act on it</text>
  <!-- motion path of a particle across the card -->
  <path class="pl-flow" d="M320,340 Q380,210 470,250" stroke-dasharray="4 5"/>
  <circle cx="320" cy="340" r="4" fill="#FF6B00" fill-opacity="0.5"/>
  <circle cx="388" cy="252" r="5" fill="#FF6B00" fill-opacity="0.75"/>
  <circle cx="470" cy="250" r="8" fill="#FF6B00"/>
  <!-- force arrows: gravity + wind -->
  <path class="pl-force" d="M360,224 V258"/>
  <path class="pl-force" d="M356,252 L360,260 L364,252" stroke-linejoin="round"/>
  <text class="pl-lbl" x="360" y="218" text-anchor="middle">Gravity</text>
  <path class="pl-force" d="M430,300 H468"/>
  <path class="pl-force" d="M462,294 L470,300 L462,306" stroke-linejoin="round"/>
  <text class="pl-lbl" x="436" y="326" text-anchor="middle">Force fields</text>

  <!-- ===== Stage 3: DEATH ===== -->
  <text class="pl-stage" x="650" y="172" text-anchor="middle">DEATH</text>
  <text class="pl-sub" x="650" y="192" text-anchor="middle">Fades when lifespan ends</text>
  <!-- fading sequence -->
  <circle cx="588" cy="280" r="8" fill="#FF6B00" fill-opacity="0.85"/>
  <circle cx="636" cy="280" r="7" fill="#FF6B00" fill-opacity="0.5"/>
  <circle cx="680" cy="280" r="6" fill="#FF6B00" fill-opacity="0.25"/>
  <circle cx="718" cy="280" r="5" fill="#FF6B00" fill-opacity="0.08"/>
  <text class="pl-lbl" x="650" y="344" text-anchor="middle">Opacity falls to zero,</text>
  <text class="pl-lbl" x="650" y="362" text-anchor="middle">then the particle is removed</text>

  <!-- Footer tip (Variant B, left rail) -->
  <rect x="40" y="416" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="438" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Lifespan is set by the Lifetime value; a particle older than its lifetime dies regardless of position.</text>
</svg>
