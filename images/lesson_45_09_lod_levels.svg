<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="l45f09-t l45f09-d" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" color="#222">
<title id="l45f09-t">Level of detail drops polygon count as objects move farther away</title>
<desc id="l45f09-d">Level of detail, or LOD, swaps a mesh for progressively simpler versions as it recedes from the camera. LOD0 is the full-detail hero mesh used up close. LOD1, LOD2, and LOD3 carry fewer and fewer polygons for mid, far, and distant ranges, where the loss of detail is not visible. This keeps distant objects cheap without hurting the near view.</desc>
<style>
.title{font-size:15px;font-weight:700;}
.sub{font-size:11.5px;fill:#c8c8c8;}
.lod{font-size:13px;font-weight:800;}
.poly{font-size:11px;font-weight:700;}
.dist{font-size:10.5px;fill:#c8c8c8;}
.axis{font-size:10.5px;fill:#c8c8c8;}
</style>
<text class="title" x="380" y="38" text-anchor="middle">LOD: less detail as distance grows</text>
<line x1="70" y1="250" x2="712" y2="250" stroke="#8a8a8a" stroke-width="1.5"/>
<polygon points="70,244 712,232 712,250 70,250" fill="#3a3a3a"/>
<text class="axis" x="70" y="278">near</text>
<text class="axis" x="712" y="278" text-anchor="end">far &#8594;</text>
<g text-anchor="middle">
<!-- LOD0 -->
<circle cx="150" cy="150" r="46" fill="none" stroke="#4ADE80" stroke-width="2"/>
<path d="M150 104 L186 132 L172 176 L128 176 L114 132 Z M150 104 L172 176 M150 104 L128 176 M114 132 L172 176 M186 132 L128 176" stroke="#4ADE80" stroke-width="1" fill="none"/>
<text class="lod" x="150" y="216" fill="#4ADE80">LOD0</text>
<text class="poly" x="150" y="234" fill="#4ADE80">full detail</text>
<!-- LOD1 -->
<circle cx="320" cy="156" r="38" fill="none" stroke="#4A9EFF" stroke-width="2"/>
<path d="M320 118 L350 145 L338 190 L302 190 L290 145 Z M320 118 L320 190" stroke="#4A9EFF" stroke-width="1" fill="none"/>
<text class="lod" x="320" y="216" fill="#4A9EFF">LOD1</text>
<text class="poly" x="320" y="234" fill="#4A9EFF">~50%</text>
<!-- LOD2 -->
<circle cx="480" cy="162" r="30" fill="none" stroke="#B47EE8" stroke-width="2"/>
<path d="M480 132 L504 162 L456 162 Z" stroke="#B47EE8" stroke-width="1" fill="none"/>
<text class="lod" x="480" y="216" fill="#B47EE8">LOD2</text>
<text class="poly" x="480" y="234" fill="#B47EE8">~20%</text>
<!-- LOD3 -->
<circle cx="620" cy="168" r="22" fill="none" stroke="#F5C242" stroke-width="2"/>
<rect x="608" y="156" width="24" height="24" fill="none" stroke="#F5C242" stroke-width="1"/>
<text class="lod" x="620" y="216" fill="#F5C242">LOD3</text>
<text class="poly" x="620" y="234" fill="#F5C242">~5%</text>
</g>
<text class="sub" x="380" y="380" text-anchor="middle">Swap to cheaper meshes at range; the detail loss is invisible at distance.</text>
</svg>
