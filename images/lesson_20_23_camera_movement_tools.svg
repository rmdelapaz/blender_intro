<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="cm-title cm-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="cm-title">Three ways to move the camera in Blender</title>
  <desc id="cm-desc">A workflow diagram comparing three methods for positioning a camera: transform tools using the G and R shortcuts for precise moves, Lock Camera to View for intuitive navigation through the viewport, and numeric entry in the N panel for exact coordinates. Each method is shown as a card with its shortcut and a one-line strength.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">MOVING THE CAMERA</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Three ways to position your shot</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ============ THREE METHOD CARDS ============ -->
  <!-- Card geometry: three columns. x: 40..253, 293..507, 547..760 (w=213 each), y 150..430 -->

  <!-- Card 1: Transform tools -->
  <rect x="40" y="150" width="213" height="280" rx="8"
        fill="currentColor" fill-opacity="0.03"
        stroke="currentColor" stroke-width="1.5" opacity="0.7"/>
  <rect x="40" y="150" width="213" height="4" rx="2" fill="#FF6B00"/>
  <!-- icon: move/rotate arrows -->
  <g transform="translate(146,210)" stroke="#FF6B00" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="-22" y1="0" x2="22" y2="0"/>
    <polyline points="14,-8 22,0 14,8"/>
    <line x1="0" y1="-22" x2="0" y2="22"/>
    <polyline points="-8,14 0,22 8,14"/>
  </g>
  <text x="146" y="268" font-size="16" font-weight="600" text-anchor="middle" fill="currentColor">Transform Tools</text>
  <!-- shortcut badge (filled brand) -->
  <rect x="98" y="282" width="58" height="26" rx="6" fill="#FF6B00"/>
  <text x="127" y="300" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">G / R</text>
  <text x="146" y="338" font-size="13" font-weight="600" text-anchor="middle" fill="#FF6B00">Precise</text>
  <text x="146" y="362" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.6">Grab to move,</text>
  <text x="146" y="380" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.6">rotate to aim. Type a</text>
  <text x="146" y="398" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.6">number to nudge exactly.</text>

  <!-- Card 2: Lock Camera to View -->
  <rect x="293" y="150" width="213" height="280" rx="8"
        fill="currentColor" fill-opacity="0.03"
        stroke="currentColor" stroke-width="1.5" opacity="0.7"/>
  <rect x="293" y="150" width="213" height="4" rx="2" fill="#FF6B00"/>
  <!-- icon: eye -->
  <g transform="translate(399,206)" stroke="#FF6B00" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M -24 0 C -12 -16 12 -16 24 0 C 12 16 -12 16 -24 0 Z"/>
    <circle cx="0" cy="0" r="6" fill="#FF6B00" stroke="none"/>
  </g>
  <text x="399" y="268" font-size="16" font-weight="600" text-anchor="middle" fill="currentColor">Lock Camera</text>
  <text x="399" y="287" font-size="16" font-weight="600" text-anchor="middle" fill="currentColor">to View</text>
  <!-- shortcut badge: N panel -->
  <rect x="349" y="298" width="100" height="26" rx="6" fill="#FF6B00"/>
  <text x="399" y="316" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">N &#8250; View</text>
  <text x="399" y="350" font-size="13" font-weight="600" text-anchor="middle" fill="#FF6B00">Intuitive</text>
  <text x="399" y="374" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.6">Fly the viewport and</text>
  <text x="399" y="392" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.6">the camera follows.</text>
  <text x="399" y="410" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.6">Turn off when done.</text>

  <!-- Card 3: Numeric entry -->
  <rect x="547" y="150" width="213" height="280" rx="8"
        fill="currentColor" fill-opacity="0.03"
        stroke="currentColor" stroke-width="1.5" opacity="0.7"/>
  <rect x="547" y="150" width="213" height="4" rx="2" fill="#FF6B00"/>
  <!-- icon: numeric fields -->
  <g transform="translate(653,188)" stroke="#FF6B00" stroke-width="2.5" fill="none" stroke-linecap="round">
    <rect x="-34" y="0" width="68" height="16" rx="3"/>
    <rect x="-34" y="22" width="68" height="16" rx="3"/>
    <rect x="-34" y="44" width="68" height="16" rx="3"/>
  </g>
  <text x="653" y="268" font-size="16" font-weight="600" text-anchor="middle" fill="currentColor">Numeric Entry</text>
  <!-- shortcut badge: N panel transform -->
  <rect x="595" y="282" width="116" height="26" rx="6" fill="#FF6B00"/>
  <text x="653" y="300" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">N &#8250; Transform</text>
  <text x="653" y="338" font-size="13" font-weight="600" text-anchor="middle" fill="#FF6B00">Exact</text>
  <text x="653" y="362" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.6">Type Location and</text>
  <text x="653" y="380" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.6">Rotation values for</text>
  <text x="653" y="398" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.6">repeatable setups.</text>

  <!-- under-card note -->
  <text x="400" y="466" font-size="13" text-anchor="middle" fill="currentColor" opacity="0.6">Mix all three: rough it in by eye, then dial in exact numbers.</text>

  <!-- ============ FOOTER TIP (Variant B, left rail) ============ -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Select the camera first &#183; G and R only move what is selected.
  </text>
</svg>
