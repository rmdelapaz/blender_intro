<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" color="#222" role="img" aria-labelledby="nm-title nm-desc">
  <title id="nm-title">Non-Manifold Geometry Types</title>
  <desc id="nm-desc">Four-panel grid showing the four conditions that make a mesh non-manifold: a boundary edge with only one face, a triple edge shown in cross-section with three faces fanning from one shared edge, an isolated vertex floating above a clean quad patch, and a wire edge extending without face support. All four panels share a red AVOID header bar.</desc>

  <!-- Top accent rail -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Header band -->
  <text x="400" y="56" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="currentColor">Non-Manifold Geometry</text>
  <text x="400" y="84" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" text-anchor="middle" fill="currentColor" opacity="0.65">Four conditions that violate the every-edge-two-faces rule</text>
  <line x1="120" y1="108" x2="680" y2="108" stroke="currentColor" stroke-width="1" opacity="0.25"/>
  <text x="400" y="138" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#FF6B00" letter-spacing="2">BOUNDARY &#183; TRIPLE &#183; ISOLATED &#183; WIRE</text>

  <!-- Panel 1: BOUNDARY EDGE (center x=120) -->
  <g id="nm-panel-1">
    <rect x="35" y="170" width="170" height="230" rx="4" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-width="1" stroke-opacity="0.25"/>
    <rect x="35" y="170" width="170" height="26" rx="4" fill="#E63946"/>
    <rect x="35" y="188" width="170" height="8" fill="#E63946"/>
    <text x="120" y="189" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">BOUNDARY</text>
    <g id="nm-p1-mesh">
      <!-- Left quad -->
      <polygon points="60,240 120,240 120,340 60,340" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.3" stroke-opacity="0.85"/>
      <!-- Right quad -->
      <polygon points="120,240 180,240 180,340 120,340" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.3" stroke-opacity="0.85"/>
      <!-- Highlight the right outer edge as the boundary edge (only one face borders it) -->
      <line x1="180" y1="240" x2="180" y2="340" stroke="#E63946" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <text x="120" y="385" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#E63946">1 face</text>
  </g>

  <!-- Panel 2: TRIPLE EDGE (center x=305) -->
  <g id="nm-panel-2">
    <rect x="220" y="170" width="170" height="230" rx="4" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-width="1" stroke-opacity="0.25"/>
    <rect x="220" y="170" width="170" height="26" rx="4" fill="#E63946"/>
    <rect x="220" y="188" width="170" height="8" fill="#E63946"/>
    <text x="305" y="189" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">TRIPLE</text>
    <!-- Cross-section view: central edge shown as one red dot, 3 face-lines fanning at 120 degree intervals -->
    <g id="nm-p2-mesh">
      <line x1="305" y1="280" x2="305" y2="215" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.5"/>
      <line x1="305" y1="280" x2="249" y2="313" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.5"/>
      <line x1="305" y1="280" x2="361" y2="313" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.5"/>
      <circle cx="305" cy="215" r="2.5" fill="currentColor" opacity="0.5"/>
      <circle cx="249" cy="313" r="2.5" fill="currentColor" opacity="0.5"/>
      <circle cx="361" cy="313" r="2.5" fill="currentColor" opacity="0.5"/>
      <!-- Central edge dot (red 3-layer glyph) -->
      <circle cx="305" cy="280" r="10" fill="#E63946" opacity="0.20"/>
      <circle cx="305" cy="280" r="6" fill="#E63946"/>
      <circle cx="305" cy="280" r="2" fill="#ffffff"/>
    </g>
    <text x="305" y="385" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#E63946">3 faces</text>
  </g>

  <!-- Panel 3: ISOLATED VERTEX (center x=490) -->
  <g id="nm-panel-3">
    <rect x="405" y="170" width="170" height="230" rx="4" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-width="1" stroke-opacity="0.25"/>
    <rect x="405" y="170" width="170" height="26" rx="4" fill="#E63946"/>
    <rect x="405" y="188" width="170" height="8" fill="#E63946"/>
    <text x="490" y="189" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">ISOLATED</text>
    <!-- Clean 2x2 quad patch in the panel interior -->
    <g id="nm-p3-mesh">
      <polygon points="440,270 490,270 490,320 440,320" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.7"/>
      <polygon points="490,270 540,270 540,320 490,320" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.7"/>
      <polygon points="440,320 490,320 490,370 440,370" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.7"/>
      <polygon points="490,320 540,320 540,370 490,370" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.7"/>
      <!-- Orphan vertex floating above the patch (red 3-layer glyph) -->
      <circle cx="490" cy="225" r="10" fill="#E63946" opacity="0.20"/>
      <circle cx="490" cy="225" r="6" fill="#E63946"/>
      <circle cx="490" cy="225" r="2" fill="#ffffff"/>
    </g>
    <text x="490" y="385" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#E63946">0 edges</text>
  </g>

  <!-- Panel 4: WIRE EDGE (center x=675) -->
  <g id="nm-panel-4">
    <rect x="590" y="170" width="170" height="230" rx="4" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-width="1" stroke-opacity="0.25"/>
    <rect x="590" y="170" width="170" height="26" rx="4" fill="#E63946"/>
    <rect x="590" y="188" width="170" height="8" fill="#E63946"/>
    <text x="675" y="189" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">WIRE</text>
    <g id="nm-p4-mesh">
      <!-- Clean 2x2 quad patch -->
      <polygon points="625,270 675,270 675,320 625,320" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.7"/>
      <polygon points="675,270 725,270 725,320 675,320" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.7"/>
      <polygon points="625,320 675,320 675,370 625,370" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.7"/>
      <polygon points="675,320 725,320 725,370 675,370" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.7"/>
      <!-- Wire edge extending out from top-right corner vertex -->
      <line x1="725" y1="270" x2="745" y2="230" stroke="#E63946" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Terminal vertex (red 2-layer dot) -->
      <circle cx="745" cy="230" r="7" fill="#E63946" opacity="0.20"/>
      <circle cx="745" cy="230" r="4" fill="#E63946"/>
    </g>
    <text x="675" y="385" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#E63946">0 faces</text>
  </g>

  <!-- Property pill row -->
  <g id="nm-pills">
    <!-- Pill 1 -->
    <g transform="translate(50, 420)">
      <rect x="0" y="0" width="220" height="40" rx="6" fill="currentColor" fill-opacity="0.04" stroke="#FF6B00" stroke-width="1" stroke-opacity="0.5"/>
      <text x="14" y="17" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FF6B00" letter-spacing="1">PROBLEM</text>
      <text x="14" y="32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="currentColor" opacity="0.85">Boolean operations fail</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(290, 420)">
      <rect x="0" y="0" width="220" height="40" rx="6" fill="currentColor" fill-opacity="0.04" stroke="#FF6B00" stroke-width="1" stroke-opacity="0.5"/>
      <text x="14" y="17" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FF6B00" letter-spacing="1">PROBLEM</text>
      <text x="14" y="32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="currentColor" opacity="0.85">3D-print slicer breaks</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(530, 420)">
      <rect x="0" y="0" width="220" height="40" rx="6" fill="currentColor" fill-opacity="0.04" stroke="#FF6B00" stroke-width="1" stroke-opacity="0.5"/>
      <text x="14" y="17" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FF6B00" letter-spacing="1">PROBLEM</text>
      <text x="14" y="32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="currentColor" opacity="0.85">Physics simulation crashes</text>
    </g>
  </g>

  <!-- Italic takeaway -->
  <text x="400" y="485" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-style="italic" text-anchor="middle" fill="currentColor" opacity="0.75">Any of these four conditions breaks the manifold rule. Select All by Trait &gt; Non Manifold finds them in one click.</text>

  <!-- Footer tip card -->
  <g id="nm-tip">
    <rect x="60" y="506" width="680" height="34" rx="4" fill="currentColor" fill-opacity="0.04" stroke="#FF6B00" stroke-width="1" stroke-opacity="0.4"/>
    <rect x="60" y="506" width="4" height="34" fill="#FF6B00"/>
    <text x="74" y="528" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="currentColor" opacity="0.85"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> After deleting faces or merging vertices, run a Non Manifold select to catch any stray geometry.</text>
  </g>
</svg>
