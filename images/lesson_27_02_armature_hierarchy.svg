<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="ah-title ah-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="ah-title">Armature hierarchy: parent-child bone relationships in a humanoid rig</title>
  <desc id="ah-desc">A tree diagram of a humanoid armature. The Hips root sits at the top. The spine runs up through chest to a neck-and-head branch. The chest also parents a left arm chain and a right arm chain, each running shoulder to upper arm to forearm to hand. The hips also parent a left leg chain and a right leg chain, each running thigh to shin to foot. Moving a parent bone moves every child below it.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Armature Hierarchy</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Parent bones drive their children &#183; move the Hips and the whole rig follows</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Legend -->
  <g font-size="12" fill="currentColor">
    <rect x="40" y="126" width="12" height="12" rx="2" fill="#FF6B00"/>
    <text x="58" y="136" opacity="0.75">Root</text>
    <rect x="108" y="126" width="12" height="12" rx="2" fill="currentColor" opacity="0.55"/>
    <text x="126" y="136" opacity="0.75">Spine</text>
    <rect x="182" y="126" width="12" height="12" rx="2" fill="#B47EE8"/>
    <text x="200" y="136" opacity="0.75">Head</text>
    <rect x="252" y="126" width="12" height="12" rx="2" fill="#4A9EFF"/>
    <text x="270" y="136" opacity="0.75">Left side</text>
    <rect x="340" y="126" width="12" height="12" rx="2" fill="#FF7EA8"/>
    <text x="358" y="136" opacity="0.75">Right side</text>
  </g>

  <!-- ============ Neutral connectors (spine chain + branch buses) ============ -->
  <g stroke="currentColor" stroke-width="1.5" opacity="0.3" fill="none" stroke-linecap="round">
    <!-- Hips -> Spine -> Chest spine chain -->
    <line x1="400" y1="194" x2="400" y2="214"/>
    <line x1="400" y1="252" x2="400" y2="272"/>
    <!-- Chest down into arm/head branch bus -->
    <line x1="400" y1="310" x2="400" y2="332"/>
    <!-- Arm/head horizontal bus + drops to the three children -->
    <line x1="170" y1="332" x2="630" y2="332"/>
    <line x1="170" y1="332" x2="170" y2="352"/>
    <line x1="400" y1="332" x2="400" y2="352"/>
    <line x1="630" y1="332" x2="630" y2="352"/>
    <!-- Hips -> leg branch: stub down the LEFT of the spine stack to the leg bus -->
    <line x1="340" y1="175" x2="300" y2="175"/>
    <line x1="300" y1="175" x2="300" y2="585"/>
    <line x1="300" y1="585" x2="515" y2="585"/>
    <line x1="285" y1="585" x2="285" y2="605"/>
    <line x1="515" y1="585" x2="515" y2="605"/>
  </g>

  <!-- Colored chain connectors -->
  <g stroke="#B47EE8" stroke-width="1.5" opacity="0.5" fill="none">
    <line x1="400" y1="390" x2="400" y2="410"/>
  </g>
  <g stroke="#4A9EFF" stroke-width="1.5" opacity="0.5" fill="none">
    <line x1="170" y1="390" x2="170" y2="410"/>
    <line x1="170" y1="448" x2="170" y2="468"/>
    <line x1="170" y1="506" x2="170" y2="526"/>
    <line x1="285" y1="643" x2="285" y2="660"/>
  </g>
  <g stroke="#FF7EA8" stroke-width="1.5" opacity="0.55" fill="none">
    <line x1="630" y1="390" x2="630" y2="410"/>
    <line x1="630" y1="448" x2="630" y2="468"/>
    <line x1="630" y1="506" x2="630" y2="526"/>
    <line x1="515" y1="643" x2="515" y2="660"/>
  </g>

  <!-- ============ Boxes ============ -->
  <!-- Hips / Root -->
  <rect x="320" y="156" width="160" height="38" rx="8" fill="#FF6B00"/>
  <text x="400" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Hips / Root</text>

  <!-- Spine -->
  <rect x="320" y="214" width="160" height="38" rx="8" fill="none" stroke="currentColor" stroke-width="2" opacity="0.55"/>
  <text x="400" y="238" text-anchor="middle" font-size="14" fill="currentColor">Spine</text>

  <!-- Chest -->
  <rect x="320" y="272" width="160" height="38" rx="8" fill="none" stroke="currentColor" stroke-width="2" opacity="0.55"/>
  <text x="400" y="296" text-anchor="middle" font-size="14" fill="currentColor">Chest</text>

  <!-- Neck/Head -->
  <rect x="330" y="352" width="140" height="38" rx="8" fill="none" stroke="#B47EE8" stroke-width="2"/>
  <text x="400" y="376" text-anchor="middle" font-size="14" fill="currentColor">Neck &#183; Head</text>

  <!-- Left arm chain -->
  <rect x="100" y="352" width="140" height="38" rx="8" fill="none" stroke="#4A9EFF" stroke-width="2"/>
  <text x="170" y="376" text-anchor="middle" font-size="14" fill="currentColor">Shoulder.L</text>
  <rect x="100" y="410" width="140" height="38" rx="8" fill="none" stroke="#4A9EFF" stroke-width="2"/>
  <text x="170" y="434" text-anchor="middle" font-size="14" fill="currentColor">Upper Arm.L</text>
  <rect x="100" y="468" width="140" height="38" rx="8" fill="none" stroke="#4A9EFF" stroke-width="2"/>
  <text x="170" y="492" text-anchor="middle" font-size="14" fill="currentColor">Forearm.L</text>
  <rect x="100" y="526" width="140" height="38" rx="8" fill="none" stroke="#4A9EFF" stroke-width="2"/>
  <text x="170" y="550" text-anchor="middle" font-size="14" fill="currentColor">Hand.L</text>

  <!-- Right arm chain -->
  <rect x="560" y="352" width="140" height="38" rx="8" fill="none" stroke="#FF7EA8" stroke-width="2"/>
  <text x="630" y="376" text-anchor="middle" font-size="14" fill="currentColor">Shoulder.R</text>
  <rect x="560" y="410" width="140" height="38" rx="8" fill="none" stroke="#FF7EA8" stroke-width="2"/>
  <text x="630" y="434" text-anchor="middle" font-size="14" fill="currentColor">Upper Arm.R</text>
  <rect x="560" y="468" width="140" height="38" rx="8" fill="none" stroke="#FF7EA8" stroke-width="2"/>
  <text x="630" y="492" text-anchor="middle" font-size="14" fill="currentColor">Forearm.R</text>
  <rect x="560" y="526" width="140" height="38" rx="8" fill="none" stroke="#FF7EA8" stroke-width="2"/>
  <text x="630" y="550" text-anchor="middle" font-size="14" fill="currentColor">Hand.R</text>

  <!-- Left leg chain -->
  <rect x="215" y="605" width="140" height="38" rx="8" fill="none" stroke="#4A9EFF" stroke-width="2"/>
  <text x="285" y="629" text-anchor="middle" font-size="14" fill="currentColor">Thigh.L</text>
  <!-- Right leg chain -->
  <rect x="445" y="605" width="140" height="38" rx="8" fill="none" stroke="#FF7EA8" stroke-width="2"/>
  <text x="515" y="629" text-anchor="middle" font-size="14" fill="currentColor">Thigh.R</text>

  <!-- leg continuation note -->
  <text x="285" y="673" text-anchor="middle" font-size="12" font-style="italic" fill="currentColor" opacity="0.45">Shin.L &#183; Foot.L &#8230;</text>
  <text x="515" y="673" text-anchor="middle" font-size="12" font-style="italic" fill="currentColor" opacity="0.45">Shin.R &#183; Foot.R &#8230;</text>
</svg>
