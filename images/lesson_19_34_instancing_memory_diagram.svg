<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="imd-title imd-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="imd-title">Instancing memory savings</title>
  <desc id="imd-desc">A comparison of two ways to make 100 copies of one object. On the left, 100 unique copies each store their own geometry, filling a tall red memory bar. On the right, 100 linked instances all share one geometry, filling a short green memory bar. A badge notes about a 100 times memory reduction.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Instancing Saves Memory</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">100 unique copies vs 100 linked instances · same look, far less RAM</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- LEFT: unique copies -->
  <text x="200" y="142" text-anchor="middle" font-size="18" font-weight="600" fill="currentColor">100 Unique Copies</text>
  <text x="200" y="163" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.6">Each copy stores its own mesh</text>
  <!-- object grid: 6x3 = 18 shown, "x100" implied -->
  <g>
    <rect x="92" y="176" width="216" height="104" rx="8" fill="currentColor" opacity="0.05"/>
    <g fill="#E63946" opacity="0.85">
      <rect x="104" y="188" width="16" height="16" rx="2"/>
      <rect x="136" y="188" width="16" height="16" rx="2"/>
      <rect x="168" y="188" width="16" height="16" rx="2"/>
      <rect x="200" y="188" width="16" height="16" rx="2"/>
      <rect x="232" y="188" width="16" height="16" rx="2"/>
      <rect x="264" y="188" width="16" height="16" rx="2"/>
      <rect x="104" y="214" width="16" height="16" rx="2"/>
      <rect x="136" y="214" width="16" height="16" rx="2"/>
      <rect x="168" y="214" width="16" height="16" rx="2"/>
      <rect x="200" y="214" width="16" height="16" rx="2"/>
      <rect x="232" y="214" width="16" height="16" rx="2"/>
      <rect x="264" y="214" width="16" height="16" rx="2"/>
      <rect x="104" y="240" width="16" height="16" rx="2"/>
      <rect x="136" y="240" width="16" height="16" rx="2"/>
      <rect x="168" y="240" width="16" height="16" rx="2"/>
      <rect x="200" y="240" width="16" height="16" rx="2"/>
      <rect x="232" y="240" width="16" height="16" rx="2"/>
      <rect x="264" y="240" width="16" height="16" rx="2"/>
    </g>
    <text x="200" y="272" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">each holds full geometry</text>
  </g>
  <!-- memory bar (tall, red) -->
  <text x="200" y="306" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Memory used</text>
  <rect x="150" y="318" width="100" height="140" rx="4" fill="currentColor" opacity="0.08"/>
  <rect x="150" y="318" width="100" height="140" rx="4" fill="#E63946" opacity="0.85"/>
  <text x="200" y="478" text-anchor="middle" font-size="14" font-weight="700" fill="#E63946">100 x mesh data</text>

  <!-- Divider -->
  <line x1="400" y1="134" x2="400" y2="466" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- RIGHT: linked instances -->
  <text x="600" y="142" text-anchor="middle" font-size="18" font-weight="600" fill="currentColor">100 Linked Instances</text>
  <text x="600" y="163" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.6">All point to one shared mesh</text>
  <g>
    <rect x="492" y="176" width="216" height="104" rx="8" fill="currentColor" opacity="0.05"/>
    <rect x="582" y="190" width="36" height="36" rx="4" fill="#4ADE80" opacity="0.9"/>
    <text x="600" y="242" text-anchor="middle" font-size="11" font-weight="700" fill="#4ADE80">source mesh</text>
    <g stroke="#4ADE80" stroke-width="1" opacity="0.4">
      <line x1="600" y1="226" x2="520" y2="262"/>
      <line x1="600" y1="226" x2="548" y2="262"/>
      <line x1="600" y1="226" x2="576" y2="262"/>
      <line x1="600" y1="226" x2="624" y2="262"/>
      <line x1="600" y1="226" x2="652" y2="262"/>
      <line x1="600" y1="226" x2="680" y2="262"/>
    </g>
    <g fill="#4ADE80" opacity="0.7">
      <circle cx="520" cy="264" r="6"/>
      <circle cx="548" cy="264" r="6"/>
      <circle cx="576" cy="264" r="6"/>
      <circle cx="624" cy="264" r="6"/>
      <circle cx="652" cy="264" r="6"/>
      <circle cx="680" cy="264" r="6"/>
    </g>
  </g>
  <!-- memory bar (short, green) -->
  <text x="600" y="306" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Memory used</text>
  <rect x="550" y="318" width="100" height="140" rx="4" fill="currentColor" opacity="0.08"/>
  <rect x="550" y="444" width="100" height="14" rx="4" fill="#4ADE80" opacity="0.9"/>
  <text x="600" y="478" text-anchor="middle" font-size="14" font-weight="700" fill="#4ADE80">1 x mesh data</text>

  <!-- center reduction badge -->
  <g>
    <rect x="338" y="366" width="124" height="46" rx="23" fill="#FF6B00"/>
    <text x="400" y="386" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">about</text>
    <text x="400" y="404" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">100x less</text>
  </g>

  <!-- Footer tip (Variant B left rail) -->
  <rect x="40" y="506" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Use Alt+D for linked duplicates. Grass, trees, crowds, and bolts cost almost nothing extra.
  </text>
</svg>
