<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="lp-title lp-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" color="#222">
  <title id="lp-title">Mesh density: low poly to high poly</title>
  <desc id="lp-desc">Four spheres shown side by side at increasing segment counts: 8 segments, 16 segments, 32 segments, and 64 segments. Each panel shows the wireframe silhouette and reports its face and vertex counts.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <text x="400" y="56" text-anchor="middle" font-size="24" font-weight="700" fill="currentColor">MESH DENSITY: LOW POLY TO HIGH POLY</text>
  <text x="400" y="84" text-anchor="middle" font-size="14" fill="currentColor" opacity="0.65">Doubling segments and rings roughly quadruples the face count.</text>
  <line x1="120" y1="108" x2="680" y2="108" stroke="currentColor" stroke-width="1" stroke-opacity="0.25"/>
  <text x="400" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#FF6B00" letter-spacing="2">FROM CHUNKY TO SMOOTH</text>

  <!-- Panel 1: 8 segments -->
  <rect x="40" y="170" width="175" height="290" rx="8" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>
  <text x="127" y="195" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">8 SEGMENTS</text>
  <!-- octagon silhouette -->
  <polygon points="127,255 170,272 187,315 170,358 127,375 84,358 67,315 84,272" fill="#FF6B00" fill-opacity="0.08" stroke="currentColor" stroke-width="1.6" stroke-opacity="0.85"/>
  <!-- horizontal latitude lines -->
  <line x1="84" y1="272" x2="170" y2="272" stroke="currentColor" stroke-width="1" stroke-opacity="0.55"/>
  <line x1="67" y1="315" x2="187" y2="315" stroke="currentColor" stroke-width="1" stroke-opacity="0.55"/>
  <line x1="84" y1="358" x2="170" y2="358" stroke="currentColor" stroke-width="1" stroke-opacity="0.55"/>
  <!-- vertical longitude line -->
  <line x1="127" y1="255" x2="127" y2="375" stroke="currentColor" stroke-width="1" stroke-opacity="0.55"/>
  <!-- vertex dots at 8 corners -->
  <circle cx="127" cy="255" r="3.5" fill="#FF6B00"/>
  <circle cx="170" cy="272" r="3.5" fill="#FF6B00"/>
  <circle cx="187" cy="315" r="3.5" fill="#FF6B00"/>
  <circle cx="170" cy="358" r="3.5" fill="#FF6B00"/>
  <circle cx="127" cy="375" r="3.5" fill="#FF6B00"/>
  <circle cx="84" cy="358" r="3.5" fill="#FF6B00"/>
  <circle cx="67" cy="315" r="3.5" fill="#FF6B00"/>
  <circle cx="84" cy="272" r="3.5" fill="#FF6B00"/>
  <!-- footer counts -->
  <text x="127" y="420" text-anchor="middle" font-size="13" font-weight="700" fill="#FF6B00">32 faces</text>
  <text x="127" y="438" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.7">26 verts</text>

  <!-- Panel 2: 16 segments -->
  <rect x="225" y="170" width="175" height="290" rx="8" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>
  <text x="312" y="195" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">16 SEGMENTS</text>
  <!-- hexadecagon silhouette -->
  <polygon points="312,255 335,259 355,272 367,292 372,315 367,338 355,358 335,371 312,375 289,371 269,358 257,338 252,315 257,292 269,272 289,259" fill="#FF6B00" fill-opacity="0.08" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.85"/>
  <!-- latitudes (5) -->
  <ellipse cx="312" cy="275" rx="40" ry="5" fill="none" stroke="currentColor" stroke-width="0.9" stroke-opacity="0.55"/>
  <ellipse cx="312" cy="295" rx="55" ry="6" fill="none" stroke="currentColor" stroke-width="0.9" stroke-opacity="0.55"/>
  <ellipse cx="312" cy="315" rx="60" ry="7" fill="none" stroke="currentColor" stroke-width="0.9" stroke-opacity="0.55"/>
  <ellipse cx="312" cy="335" rx="55" ry="6" fill="none" stroke="currentColor" stroke-width="0.9" stroke-opacity="0.55"/>
  <ellipse cx="312" cy="355" rx="40" ry="5" fill="none" stroke="currentColor" stroke-width="0.9" stroke-opacity="0.55"/>
  <!-- longitudes (3) -->
  <line x1="312" y1="255" x2="312" y2="375" stroke="currentColor" stroke-width="0.9" stroke-opacity="0.55"/>
  <ellipse cx="312" cy="315" rx="25" ry="60" fill="none" stroke="currentColor" stroke-width="0.9" stroke-opacity="0.55"/>
  <ellipse cx="312" cy="315" rx="48" ry="60" fill="none" stroke="currentColor" stroke-width="0.9" stroke-opacity="0.55"/>
  <!-- 16 small dots -->
  <circle cx="312" cy="255" r="2.5" fill="#FF6B00"/>
  <circle cx="335" cy="259" r="2.5" fill="#FF6B00"/>
  <circle cx="355" cy="272" r="2.5" fill="#FF6B00"/>
  <circle cx="367" cy="292" r="2.5" fill="#FF6B00"/>
  <circle cx="372" cy="315" r="2.5" fill="#FF6B00"/>
  <circle cx="367" cy="338" r="2.5" fill="#FF6B00"/>
  <circle cx="355" cy="358" r="2.5" fill="#FF6B00"/>
  <circle cx="335" cy="371" r="2.5" fill="#FF6B00"/>
  <circle cx="312" cy="375" r="2.5" fill="#FF6B00"/>
  <circle cx="289" cy="371" r="2.5" fill="#FF6B00"/>
  <circle cx="269" cy="358" r="2.5" fill="#FF6B00"/>
  <circle cx="257" cy="338" r="2.5" fill="#FF6B00"/>
  <circle cx="252" cy="315" r="2.5" fill="#FF6B00"/>
  <circle cx="257" cy="292" r="2.5" fill="#FF6B00"/>
  <circle cx="269" cy="272" r="2.5" fill="#FF6B00"/>
  <circle cx="289" cy="259" r="2.5" fill="#FF6B00"/>
  <text x="312" y="420" text-anchor="middle" font-size="13" font-weight="700" fill="#FF6B00">128 faces</text>
  <text x="312" y="438" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.7">114 verts</text>

  <!-- Panel 3: 32 segments -->
  <rect x="410" y="170" width="175" height="290" rx="8" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>
  <text x="497" y="195" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">32 SEGMENTS</text>
  <!-- circle silhouette -->
  <circle cx="497" cy="315" r="60" fill="#FF6B00" fill-opacity="0.08" stroke="currentColor" stroke-width="1.3" stroke-opacity="0.85"/>
  <!-- latitudes (5) -->
  <ellipse cx="497" cy="275" rx="44" ry="6" fill="none" stroke="currentColor" stroke-width="0.8" stroke-opacity="0.5"/>
  <ellipse cx="497" cy="295" rx="54" ry="7" fill="none" stroke="currentColor" stroke-width="0.8" stroke-opacity="0.5"/>
  <ellipse cx="497" cy="315" rx="60" ry="8" fill="none" stroke="currentColor" stroke-width="0.8" stroke-opacity="0.5"/>
  <ellipse cx="497" cy="335" rx="54" ry="7" fill="none" stroke="currentColor" stroke-width="0.8" stroke-opacity="0.5"/>
  <ellipse cx="497" cy="355" rx="44" ry="6" fill="none" stroke="currentColor" stroke-width="0.8" stroke-opacity="0.5"/>
  <!-- longitudes (3 ellipses + center line) -->
  <line x1="497" y1="255" x2="497" y2="375" stroke="currentColor" stroke-width="0.8" stroke-opacity="0.5"/>
  <ellipse cx="497" cy="315" rx="8" ry="60" fill="none" stroke="currentColor" stroke-width="0.8" stroke-opacity="0.5"/>
  <ellipse cx="497" cy="315" rx="28" ry="60" fill="none" stroke="currentColor" stroke-width="0.8" stroke-opacity="0.5"/>
  <ellipse cx="497" cy="315" rx="48" ry="60" fill="none" stroke="currentColor" stroke-width="0.8" stroke-opacity="0.5"/>
  <!-- 4 cardinal dots -->
  <circle cx="497" cy="255" r="2" fill="#FF6B00"/>
  <circle cx="557" cy="315" r="2" fill="#FF6B00"/>
  <circle cx="497" cy="375" r="2" fill="#FF6B00"/>
  <circle cx="437" cy="315" r="2" fill="#FF6B00"/>
  <text x="497" y="420" text-anchor="middle" font-size="13" font-weight="700" fill="#FF6B00">512 faces</text>
  <text x="497" y="438" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.7">482 verts</text>

  <!-- Panel 4: 64 segments -->
  <rect x="595" y="170" width="175" height="290" rx="8" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>
  <text x="682" y="195" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">64 SEGMENTS</text>
  <!-- circle silhouette -->
  <circle cx="682" cy="315" r="60" fill="#FF6B00" fill-opacity="0.08" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.85"/>
  <!-- latitudes (7) -->
  <ellipse cx="682" cy="265" rx="33" ry="4" fill="none" stroke="currentColor" stroke-width="0.7" stroke-opacity="0.45"/>
  <ellipse cx="682" cy="283" rx="48" ry="5" fill="none" stroke="currentColor" stroke-width="0.7" stroke-opacity="0.45"/>
  <ellipse cx="682" cy="300" rx="56" ry="6" fill="none" stroke="currentColor" stroke-width="0.7" stroke-opacity="0.45"/>
  <ellipse cx="682" cy="315" rx="60" ry="7" fill="none" stroke="currentColor" stroke-width="0.7" stroke-opacity="0.45"/>
  <ellipse cx="682" cy="330" rx="56" ry="6" fill="none" stroke="currentColor" stroke-width="0.7" stroke-opacity="0.45"/>
  <ellipse cx="682" cy="347" rx="48" ry="5" fill="none" stroke="currentColor" stroke-width="0.7" stroke-opacity="0.45"/>
  <ellipse cx="682" cy="365" rx="33" ry="4" fill="none" stroke="currentColor" stroke-width="0.7" stroke-opacity="0.45"/>
  <!-- longitudes (center line + 4 ellipses) -->
  <line x1="682" y1="255" x2="682" y2="375" stroke="currentColor" stroke-width="0.7" stroke-opacity="0.45"/>
  <ellipse cx="682" cy="315" rx="6" ry="60" fill="none" stroke="currentColor" stroke-width="0.7" stroke-opacity="0.45"/>
  <ellipse cx="682" cy="315" rx="22" ry="60" fill="none" stroke="currentColor" stroke-width="0.7" stroke-opacity="0.45"/>
  <ellipse cx="682" cy="315" rx="38" ry="60" fill="none" stroke="currentColor" stroke-width="0.7" stroke-opacity="0.45"/>
  <ellipse cx="682" cy="315" rx="52" ry="60" fill="none" stroke="currentColor" stroke-width="0.7" stroke-opacity="0.45"/>
  <text x="682" y="420" text-anchor="middle" font-size="13" font-weight="700" fill="#FF6B00">2,048 faces</text>
  <text x="682" y="438" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.7">1,986 verts</text>

  <!-- Italic takeaway -->
  <text x="400" y="478" text-anchor="middle" font-size="13" font-style="italic" fill="currentColor" opacity="0.75">Higher density looks smoother, but stores more data and renders slower.</text>

  <!-- Footer tip -->
  <rect x="40" y="506" width="720" height="34" rx="6" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="527" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Match density to the job. Background props stay low poly. Hero shots earn the extra geometry.</text>
</svg>
