<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="gti-title gti-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <title id="gti-title">Particle edit mode grooming tools</title>
    <desc id="gti-desc">A two-row by four-column grid of the eight hair grooming brushes found in Particle Edit mode: Comb, Smooth, Add, Length, Puff, Cut, Weight, and None, each with a simple icon and a one-line description of what it does.</desc>
    <style>
        .gti-name{font:700 15px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:currentColor}
        .gti-desc{font:400 11.5px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:currentColor;opacity:.6}
        .gti-cell{fill:currentColor;fill-opacity:.04;stroke:currentColor;stroke-opacity:.18;stroke-width:1}
        .gti-ic{fill:none;stroke:#FF6B00;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
        .gti-icf{fill:#FF6B00}
    </style>
    <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
    <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">GROOMING TOOLS</text>
    <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">The eight Particle Edit brushes &#183; comb &#183; smooth &#183; add &#183; length &#183; puff &#183; cut &#183; weight</text>
    <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

    <!-- 4 cols x 2 rows. cell 170x178, origin x=40,y=128, colstep=180, rowstep=194 -->
    <!-- ROW 1 -->
    <!-- Comb -->
    <g transform="translate(40,128)">
        <rect class="gti-cell" width="170" height="178" rx="8"/>
        <g transform="translate(85,52)">
            <path class="gti-ic" d="M-26,-14 L26,-14"/>
            <path class="gti-ic" d="M-22,-14 L-26,18"/>
            <path class="gti-ic" d="M-11,-14 L-13,18"/>
            <path class="gti-ic" d="M0,-14 L0,18"/>
            <path class="gti-ic" d="M11,-14 L13,18"/>
            <path class="gti-ic" d="M22,-14 L26,18"/>
        </g>
        <text x="85" y="118" text-anchor="middle" class="gti-name">Comb</text>
        <text x="85" y="140" text-anchor="middle" class="gti-desc">Push hairs along</text>
        <text x="85" y="156" text-anchor="middle" class="gti-desc">brush direction</text>
    </g>
    <!-- Smooth -->
    <g transform="translate(220,128)">
        <rect class="gti-cell" width="170" height="178" rx="8"/>
        <g transform="translate(85,52)">
            <path class="gti-ic" d="M-28,8 C-18,-18 -6,-18 0,0 C6,18 18,18 28,-8"/>
        </g>
        <text x="85" y="118" text-anchor="middle" class="gti-name">Smooth</text>
        <text x="85" y="140" text-anchor="middle" class="gti-desc">Average nearby</text>
        <text x="85" y="156" text-anchor="middle" class="gti-desc">hairs; reduce frizz</text>
    </g>
    <!-- Add -->
    <g transform="translate(400,128)">
        <rect class="gti-cell" width="170" height="178" rx="8"/>
        <g transform="translate(85,52)">
            <path class="gti-ic" d="M0,-20 L0,20"/>
            <path class="gti-ic" d="M-20,0 L20,0"/>
        </g>
        <text x="85" y="118" text-anchor="middle" class="gti-name">Add</text>
        <text x="85" y="140" text-anchor="middle" class="gti-desc">Paint new hairs</text>
        <text x="85" y="156" text-anchor="middle" class="gti-desc">onto the surface</text>
    </g>
    <!-- Length -->
    <g transform="translate(580,128)">
        <rect class="gti-cell" width="170" height="178" rx="8"/>
        <g transform="translate(85,52)">
            <path class="gti-ic" d="M-14,20 L-14,-20"/>
            <path class="gti-ic" d="M-22,-12 L-14,-20 L-6,-12"/>
            <path class="gti-ic" d="M14,20 L14,-4"/>
            <path class="gti-ic" stroke-dasharray="3 3" d="M14,-4 L14,-20"/>
            <path class="gti-ic" d="M6,-12 L14,-20 L22,-12" opacity="0.45"/>
        </g>
        <text x="85" y="118" text-anchor="middle" class="gti-name">Length</text>
        <text x="85" y="140" text-anchor="middle" class="gti-desc">Grow or shrink</text>
        <text x="85" y="156" text-anchor="middle" class="gti-desc">hairs (Grow/Shrink)</text>
    </g>

    <!-- ROW 2 -->
    <!-- Puff -->
    <g transform="translate(40,322)">
        <rect class="gti-cell" width="170" height="178" rx="8"/>
        <g transform="translate(85,52)">
            <path class="gti-ic" d="M-24,18 L-24,-12"/>
            <path class="gti-ic" d="M0,18 L0,-20"/>
            <path class="gti-ic" d="M24,18 L24,-12"/>
            <line class="gti-ic" x1="-30" y1="18" x2="30" y2="18"/>
        </g>
        <text x="85" y="118" text-anchor="middle" class="gti-name">Puff</text>
        <text x="85" y="140" text-anchor="middle" class="gti-desc">Lift hairs to stand</text>
        <text x="85" y="156" text-anchor="middle" class="gti-desc">up from the surface</text>
    </g>
    <!-- Cut -->
    <g transform="translate(220,322)">
        <rect class="gti-cell" width="170" height="178" rx="8"/>
        <g transform="translate(85,52)">
            <circle class="gti-ic" cx="-12" cy="12" r="7"/>
            <circle class="gti-ic" cx="12" cy="12" r="7"/>
            <path class="gti-ic" d="M-7,7 L18,-18"/>
            <path class="gti-ic" d="M7,7 L-18,-18"/>
        </g>
        <text x="85" y="118" text-anchor="middle" class="gti-name">Cut</text>
        <text x="85" y="140" text-anchor="middle" class="gti-desc">Trim hairs shorter</text>
        <text x="85" y="156" text-anchor="middle" class="gti-desc">at the brush edge</text>
    </g>
    <!-- Weight -->
    <g transform="translate(400,322)">
        <rect class="gti-cell" width="170" height="178" rx="8"/>
        <g transform="translate(85,52)">
            <path class="gti-ic" d="M-18,-16 L18,-16 L24,18 L-24,18 Z"/>
            <path class="gti-ic" d="M-8,-16 C-8,-24 8,-24 8,-16"/>
        </g>
        <text x="85" y="118" text-anchor="middle" class="gti-name">Weight</text>
        <text x="85" y="140" text-anchor="middle" class="gti-desc">Paint weight for</text>
        <text x="85" y="156" text-anchor="middle" class="gti-desc">hair dynamics pinning</text>
    </g>
    <!-- None -->
    <g transform="translate(580,322)">
        <rect class="gti-cell" width="170" height="178" rx="8"/>
        <g transform="translate(85,52)">
            <circle class="gti-ic" cx="0" cy="0" r="20"/>
            <path class="gti-ic" d="M-14,-14 L14,14"/>
        </g>
        <text x="85" y="118" text-anchor="middle" class="gti-name">None</text>
        <text x="85" y="140" text-anchor="middle" class="gti-desc">Selection only;</text>
        <text x="85" y="156" text-anchor="middle" class="gti-desc">no brush effect</text>
    </g>
</svg>
