<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="trs-title trs-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="trs-title">Texture resolution strategy by camera distance</title>
  <desc id="trs-desc">A depth diagram showing three zones from the camera: close objects get high resolution textures, mid-distance objects get medium resolution, and far objects get low resolution, to save Eevee memory and keep the viewport responsive.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Texture Resolution Strategy</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Match texture detail to camera distance &#183; save VRAM, keep Eevee responsive</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Camera glyph at left -->
  <g>
    <rect x="44" y="300" width="44" height="34" rx="5" fill="#FF6B00"/>
    <polygon points="88,308 110,298 110,336 88,326" fill="#FF6B00"/>
    <circle cx="66" cy="317" r="9" fill="#0f1a14" opacity="0.85"/>
    <text x="66" y="360" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Camera</text>
  </g>

  <!-- Depth axis arrow (flow points away from camera, left to right) -->
  <line x1="116" y1="430" x2="744" y2="430" stroke="currentColor" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
  <polygon points="744,430 734,425 734,435" fill="currentColor" opacity="0.3"/>
  <text x="430" y="452" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.6">Increasing distance from camera</text>

  <!-- Zone CLOSE -->
  <g>
    <rect x="132" y="138" width="186" height="172" rx="8" fill="#4ADE80" fill-opacity="0.10" stroke="#4ADE80" stroke-width="1.5"/>
    <text x="225" y="166" text-anchor="middle" font-size="15" font-weight="700" fill="#4ADE80">CLOSE</text>
    <text x="225" y="186" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.6">hero / foreground</text>
    <rect x="170" y="200" width="110" height="56" rx="4" fill="#4ADE80" fill-opacity="0.22"/>
    <line x1="170" y1="218" x2="280" y2="218" stroke="#4ADE80" stroke-width="1" opacity="0.7"/>
    <line x1="170" y1="237" x2="280" y2="237" stroke="#4ADE80" stroke-width="1" opacity="0.7"/>
    <line x1="207" y1="200" x2="207" y2="256" stroke="#4ADE80" stroke-width="1" opacity="0.7"/>
    <line x1="244" y1="200" x2="244" y2="256" stroke="#4ADE80" stroke-width="1" opacity="0.7"/>
    <text x="225" y="284" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor">4K &#183; 2K</text>
    <text x="225" y="302" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">full detail, all maps</text>
  </g>

  <!-- Zone MID -->
  <g>
    <rect x="332" y="158" width="170" height="132" rx="8" fill="#FF6B00" fill-opacity="0.10" stroke="#FF6B00" stroke-width="1.5"/>
    <text x="417" y="186" text-anchor="middle" font-size="15" font-weight="700" fill="#FF6B00">MID</text>
    <text x="417" y="206" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.6">supporting set</text>
    <rect x="372" y="218" width="90" height="40" rx="4" fill="#FF6B00" fill-opacity="0.22"/>
    <line x1="372" y1="238" x2="462" y2="238" stroke="#FF6B00" stroke-width="1" opacity="0.7"/>
    <line x1="417" y1="218" x2="417" y2="258" stroke="#FF6B00" stroke-width="1" opacity="0.7"/>
    <text x="417" y="278" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor">1K</text>
  </g>

  <!-- Zone FAR -->
  <g>
    <rect x="516" y="178" width="150" height="92" rx="8" fill="#F5C242" fill-opacity="0.12" stroke="#F5C242" stroke-width="1.5"/>
    <text x="591" y="206" text-anchor="middle" font-size="15" font-weight="700" fill="#F5C242">FAR</text>
    <text x="591" y="226" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">background</text>
    <rect x="563" y="234" width="56" height="22" rx="3" fill="#F5C242" fill-opacity="0.25"/>
    <text x="591" y="284" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor">512 &#183; 256</text>
  </g>

  <!-- right reasoning chip -->
  <g>
    <text x="688" y="190" font-size="12" fill="currentColor" opacity="0.6">Distant pixels</text>
    <text x="688" y="208" font-size="12" fill="currentColor" opacity="0.6">cover few screen</text>
    <text x="688" y="226" font-size="12" fill="currentColor" opacity="0.6">texels, so detail</text>
    <text x="688" y="244" font-size="12" fill="currentColor" opacity="0.6">is wasted VRAM</text>
  </g>

  <!-- Footer tip Variant B -->
  <rect x="40" y="506" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Use the Simplify panel &#183; Max Texture Size to cap all textures at once for fast viewport iteration.</text>
</svg>
