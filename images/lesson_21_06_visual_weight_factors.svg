<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="vw-title vw-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="vw-title">Visual weight factors</title>
  <desc id="vw-desc">Eight panels showing the factors that make a composition element feel visually heavy: size, color intensity, contrast, detail, isolation, position, sharpness, and recognizable subjects. Each panel pairs a heavy example with a light one.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">VISUAL WEIGHT FACTORS</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">What makes an element feel heavy &#183; heavier shape on the left of each pair</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ============ 4 cols x 2 rows of factor cells ============ -->
  <!-- cell w 170, gap 10; xs: 40,220,400,580 ; row ys: 138 and 410 ; cell h 250 -->

  <!-- ROW 1 -->

  <!-- SIZE -->
  <g>
    <rect x="40" y="138" width="170" height="250" rx="8" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.12"/>
    <text x="125" y="166" font-size="15" font-weight="600" fill="currentColor" text-anchor="middle">Size</text>
    <circle cx="95" cy="260" r="44" fill="currentColor" opacity="0.8"/>
    <circle cx="170" cy="290" r="18" fill="currentColor" opacity="0.8"/>
    <text x="125" y="372" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">Bigger = heavier</text>
  </g>

  <!-- COLOR -->
  <g>
    <rect x="220" y="138" width="170" height="250" rx="8" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.12"/>
    <text x="305" y="166" font-size="15" font-weight="600" fill="currentColor" text-anchor="middle">Color</text>
    <circle cx="275" cy="265" r="34" fill="#E63946"/>
    <circle cx="350" cy="285" r="30" fill="currentColor" opacity="0.18"/>
    <text x="305" y="372" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">Saturated = heavier</text>
  </g>

  <!-- CONTRAST -->
  <g>
    <rect x="400" y="138" width="170" height="250" rx="8" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.12"/>
    <text x="485" y="166" font-size="15" font-weight="600" fill="currentColor" text-anchor="middle">Contrast</text>
    <rect x="430" y="220" width="64" height="90" rx="6" fill="#ffffff" stroke="currentColor" stroke-opacity="0.3"/>
    <circle cx="462" cy="265" r="20" fill="#111"/>
    <rect x="500" y="220" width="64" height="90" rx="6" fill="currentColor" fill-opacity="0.12"/>
    <circle cx="532" cy="265" r="20" fill="currentColor" opacity="0.28"/>
    <text x="485" y="372" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">High contrast = heavier</text>
  </g>

  <!-- DETAIL -->
  <g>
    <rect x="580" y="138" width="170" height="250" rx="8" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.12"/>
    <text x="665" y="166" font-size="15" font-weight="600" fill="currentColor" text-anchor="middle">Detail</text>
    <!-- textured (cross-hatch) block -->
    <rect x="610" y="220" width="60" height="90" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.3"/>
    <g stroke="currentColor" stroke-opacity="0.55" stroke-width="1.5">
      <line x1="610" y1="240" x2="670" y2="240"/>
      <line x1="610" y1="260" x2="670" y2="260"/>
      <line x1="610" y1="280" x2="670" y2="280"/>
      <line x1="610" y1="300" x2="670" y2="300"/>
      <line x1="628" y1="220" x2="628" y2="310"/>
      <line x1="650" y1="220" x2="650" y2="310"/>
    </g>
    <!-- plain block -->
    <rect x="685" y="220" width="55" height="90" rx="6" fill="currentColor" fill-opacity="0.12"/>
    <text x="665" y="372" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">Texture = heavier</text>
  </g>

  <!-- ROW 2 -->

  <!-- ISOLATION -->
  <g>
    <rect x="40" y="410" width="170" height="250" rx="8" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.12"/>
    <text x="125" y="438" font-size="15" font-weight="600" fill="currentColor" text-anchor="middle">Isolation</text>
    <circle cx="85" cy="525" r="22" fill="#FF6B00"/>
    <g fill="currentColor" opacity="0.28">
      <circle cx="150" cy="500" r="13"/>
      <circle cx="178" cy="520" r="13"/>
      <circle cx="150" cy="548" r="13"/>
      <circle cx="180" cy="552" r="13"/>
    </g>
    <text x="125" y="644" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">Alone = heavier</text>
  </g>

  <!-- POSITION -->
  <g>
    <rect x="220" y="410" width="170" height="250" rx="8" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.12"/>
    <text x="305" y="438" font-size="15" font-weight="600" fill="currentColor" text-anchor="middle">Position</text>
    <rect x="245" y="458" width="120" height="160" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.25"/>
    <circle cx="305" cy="478" r="15" fill="currentColor" opacity="0.8"/>
    <circle cx="305" cy="598" r="15" fill="currentColor" opacity="0.28"/>
    <text x="305" y="644" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">Higher / edge = heavier</text>
  </g>

  <!-- SHARPNESS -->
  <g>
    <rect x="400" y="410" width="170" height="250" rx="8" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.12"/>
    <text x="485" y="438" font-size="15" font-weight="600" fill="currentColor" text-anchor="middle">Sharpness</text>
    <!-- sharp: crisp solid circle -->
    <circle cx="455" cy="525" r="26" fill="#4A9EFF"/>
    <!-- soft: concentric translucent rings emulate a blurred edge (renders everywhere; no filter dependency) -->
    <g fill="#4A9EFF">
      <circle cx="525" cy="525" r="34" opacity="0.10"/>
      <circle cx="525" cy="525" r="30" opacity="0.14"/>
      <circle cx="525" cy="525" r="26" opacity="0.20"/>
      <circle cx="525" cy="525" r="21" opacity="0.30"/>
      <circle cx="525" cy="525" r="15" opacity="0.45"/>
    </g>
    <text x="485" y="644" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">Sharp = heavier</text>
  </g>

  <!-- RECOGNITION -->
  <g>
    <rect x="580" y="410" width="170" height="250" rx="8" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.12"/>
    <text x="665" y="438" font-size="15" font-weight="600" fill="currentColor" text-anchor="middle">Recognition</text>
    <!-- face glyph -->
    <circle cx="625" cy="525" r="28" fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-opacity="0.5"/>
    <circle cx="616" cy="518" r="3.5" fill="currentColor"/>
    <circle cx="634" cy="518" r="3.5" fill="currentColor"/>
    <path d="M 614 534 Q 625 542 636 534" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <!-- abstract shape -->
    <polygon points="690,505 715,520 705,548 678,545" fill="currentColor" opacity="0.22"/>
    <text x="665" y="644" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">Faces = heavier</text>
  </g>

  <!-- Footer tip callout (Variant B, left rail) -->
  <rect x="40" y="641" width="720" height="34" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Weight is relative. A small, sharp, saturated face can outweigh a large, soft, grey shape across the frame.
  </text>
</svg>
