<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="ad-title ad-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="ad-title">Area light emission direction</title>
  <desc id="ad-desc">An area light is a flat plane that emits light from one face only, along its local negative Z axis. Objects in front of the emitting face are lit; objects behind the plane receive no light. A side view confirms the one-sided emission.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">AREA LIGHT DIRECTION</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Emits from one face only &#183; along local &#8722;Z &#183; the back face is dark</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Perspective view (left) -->
  <text x="40" y="150" font-size="18" font-weight="600" fill="currentColor">Perspective view</text>

  <!-- Area light plane as a parallelogram (3/4 view) -->
  <polygon points="150,210 360,180 410,300 200,330"
           fill="#FF6B00" fill-opacity="0.14"
           stroke="#FF6B00" stroke-width="2.5"/>
  <text x="248" y="262" font-size="13" font-weight="600" text-anchor="middle" fill="#FF6B00">Area light plane</text>

  <!-- Emission arrows: parallel orange arrows from the front (lit) face toward the lit object -->
  <g stroke="#FF6B00" stroke-width="3" stroke-linecap="round" fill="none">
    <line x1="220" y1="262" x2="320" y2="392"/>
    <line x1="268" y1="256" x2="368" y2="386"/>
    <line x1="316" y1="250" x2="416" y2="380"/>
  </g>
  <g fill="#FF6B00">
    <polygon points="320,392 308,378 326,376"/>
    <polygon points="368,386 356,372 374,370"/>
    <polygon points="416,380 404,366 422,364"/>
  </g>
  <text x="250" y="318" font-size="12.5" font-weight="700" fill="#FF6B00" transform="rotate(52 250 318)">emission &#8594; &#8722;Z</text>

  <!-- Lit object (in front of emitting face) -->
  <circle cx="430" cy="430" r="34" fill="#4ADE80" fill-opacity="0.25" stroke="#4ADE80" stroke-width="2.5"/>
  <text x="430" y="496" font-size="13" font-weight="600" text-anchor="middle" fill="#4ADE80">Lit (in front)</text>

  <!-- Dark object (behind the plane) -->
  <circle cx="120" cy="408" r="30" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="2" stroke-opacity="0.45"/>
  <text x="120" y="468" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" opacity="0.6">Dark (behind)</text>

  <!-- back-face marker -->
  <text x="150" y="196" font-size="12" fill="currentColor" opacity="0.6">back face &#183; no emission</text>

  <!-- Side-view inset (right) -->
  <text x="560" y="150" font-size="18" font-weight="600" fill="currentColor">Side view</text>
  <rect x="520" y="168" width="240" height="250" rx="8"
        fill="currentColor" fill-opacity="0.04"
        stroke="currentColor" stroke-opacity="0.2" stroke-width="1"/>

  <!-- plane edge-on -->
  <rect x="612" y="210" width="8" height="150" rx="2" fill="#FF6B00"/>
  <text x="616" y="392" font-size="12" text-anchor="middle" fill="#FF6B00" font-weight="600">plane (edge-on)</text>

  <!-- emission hemisphere to the right (front) only -->
  <path d="M 620 210 A 150 150 0 0 1 620 360"
        fill="#FF6B00" fill-opacity="0.10" stroke="#FF6B00" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="624" y1="285" x2="712" y2="285" stroke="#FF6B00" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="712,285 698,277 698,293" fill="#FF6B00"/>
  <text x="690" y="270" font-size="12" text-anchor="middle" fill="#FF6B00" font-weight="700">&#8722;Z</text>

  <!-- no-light marker to the left (back) -->
  <line x1="608" y1="285" x2="556" y2="285" stroke="currentColor" stroke-width="2" stroke-opacity="0.35" stroke-dasharray="4 4"/>
  <g stroke="#E63946" stroke-width="2.5" stroke-linecap="round">
    <line x1="568" y1="274" x2="582" y2="296"/>
    <line x1="582" y1="274" x2="568" y2="296"/>
  </g>
  <text x="560" y="320" font-size="12" text-anchor="middle" fill="#E63946" font-weight="600">no light</text>

  <!-- conclusion band (right column, clear of the left-side captions) -->
  <text x="520" y="448" font-size="12.5" fill="currentColor" opacity="0.6">Rotate the plane to aim it:</text>
  <text x="520" y="466" font-size="12.5" fill="currentColor" opacity="0.6">the lit hemisphere follows local &#8722;Z.</text>

  <!-- Footer tip (Variant B, left rail) -->
  <rect x="40" y="506" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> If a surface looks unlit, the area light may be facing away. Rotate it 180&#176; so its front face points at the subject.
  </text>
</svg>
