<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" color="#222" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" role="img" aria-labelledby="tod49-t tod49-d">
  <title id="tod49-t">The Time-of-Day Decision: Sun Arc, Shadow, and Colour</title>
  <desc id="tod49-d">The sun's arc across a day with five marked positions &#8212; morning, noon, afternoon, golden hour, and dusk &#8212; each annotated with its shadow length and colour temperature, showing how the same building's mood changes with the hour chosen.</desc>
  <rect x="0" y="0" width="760" height="380" fill="none"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="currentColor">The Time of Day Decision</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#8a8f98">Same building, five suns &#8212; shadow length and colour set the whole mood</text>

  <!-- ground -->
  <line x1="60" y1="300" x2="700" y2="300" stroke="#8a8f98" stroke-width="1.5"/>
  <!-- arc -->
  <path d="M90,300 A310,210 0 0 1 670,300" fill="none" stroke="#8a8f98" stroke-width="1.2" stroke-dasharray="5 5"/>

  <!-- sun positions -->
  <g>
    <circle cx="118" cy="252" r="12" fill="#F5C242"/>
    <text x="118" y="332" text-anchor="middle" font-size="11.5" font-weight="700" fill="currentColor">Morning</text>
    <text x="118" y="348" text-anchor="middle" font-size="10" fill="#8a8f98">long shadow</text>
    <text x="118" y="360" text-anchor="middle" font-size="10" fill="#8a8f98">cool, soft</text>
  </g>
  <g>
    <circle cx="250" cy="150" r="13" fill="#FFD966"/>
    <text x="250" y="332" text-anchor="middle" font-size="11.5" font-weight="700" fill="currentColor">Mid-morning</text>
    <text x="250" y="348" text-anchor="middle" font-size="10" fill="#8a8f98">medium shadow</text>
    <text x="250" y="360" text-anchor="middle" font-size="10" fill="#8a8f98">neutral</text>
  </g>
  <g>
    <circle cx="380" cy="112" r="14" fill="#FFFFFF" stroke="#F5C242" stroke-width="1.5"/>
    <text x="380" y="332" text-anchor="middle" font-size="11.5" font-weight="700" fill="currentColor">Noon</text>
    <text x="380" y="348" text-anchor="middle" font-size="10" fill="#8a8f98">short, flat shadow</text>
    <text x="380" y="360" text-anchor="middle" font-size="10" fill="#8a8f98">harsh, white</text>
  </g>
  <g>
    <circle cx="510" cy="150" r="13" fill="#FFB84D"/>
    <text x="510" y="332" text-anchor="middle" font-size="11.5" font-weight="700" fill="currentColor">Golden hour</text>
    <text x="510" y="348" text-anchor="middle" font-size="10" fill="#FF6B00">long, warm shadow</text>
    <text x="510" y="360" text-anchor="middle" font-size="10" fill="#8a8f98">the flattering hour</text>
  </g>
  <g>
    <circle cx="642" cy="252" r="12" fill="#E68A5C"/>
    <text x="642" y="332" text-anchor="middle" font-size="11.5" font-weight="700" fill="currentColor">Dusk</text>
    <text x="642" y="348" text-anchor="middle" font-size="10" fill="#8a8f98">very long shadow</text>
    <text x="642" y="360" text-anchor="middle" font-size="10" fill="#8a8f98">deep amber</text>
  </g>

  <!-- little house on ground with shadow -->
  <g>
    <rect x="366" y="270" width="28" height="30" fill="#1a1a1a" stroke="#c9ccd1" stroke-width="1.5"/>
    <path d="M366,270 L380,258 L394,270 Z" fill="#1a1a1a" stroke="#c9ccd1" stroke-width="1.5"/>
  </g>

  <!-- colour temp legend -->
  <rect x="230" y="88" width="300" height="26" rx="6" fill="#1a1a1a"/>
  <text x="380" y="105" text-anchor="middle" font-size="11" fill="#8a8f98">cool blue  &#8592;  colour temperature  &#8594;  warm amber</text>
</svg>
