<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="dd-title dd-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="dd-title">Dissolve versus delete comparison</title>
  <desc id="dd-desc">Two side by side panels comparing how Delete and Dissolve treat a removed face in a three by three face grid. The Delete panel leaves a visible hole bounded by four orange highlighted edges. The Dissolve panel shows the same starting mesh with the face dissolved and the surrounding plus shaped region reconnected as a single continuous larger face.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Header block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Dissolve vs Delete</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">WHEN A FACE GOES · WHAT STAYS BEHIND</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- DELETE panel (left) -->
  <g id="dd-delete-panel">
    <!-- Frame outline -->
    <rect x="40" y="138" width="350" height="342" fill="none" stroke="currentColor" stroke-width="1" opacity="0.15"/>

    <!-- Header bar -->
    <g id="dd-delete-header">
      <rect x="40" y="138" width="350" height="32" fill="#E63946"/>
      <text x="215" y="160" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">DELETE</text>
    </g>

    <!-- Mesh diagram: 3x3 face grid with center face removed (the hole) -->
    <g id="dd-delete-mesh">
      <!-- 8 surviving face fills (center face intentionally absent) -->
      <rect x="130" y="225" width="55" height="55" fill="currentColor" opacity="0.08"/>
      <rect x="185" y="225" width="55" height="55" fill="currentColor" opacity="0.08"/>
      <rect x="240" y="225" width="55" height="55" fill="currentColor" opacity="0.08"/>
      <rect x="130" y="280" width="55" height="55" fill="currentColor" opacity="0.08"/>
      <rect x="240" y="280" width="55" height="55" fill="currentColor" opacity="0.08"/>
      <rect x="130" y="335" width="55" height="55" fill="currentColor" opacity="0.08"/>
      <rect x="185" y="335" width="55" height="55" fill="currentColor" opacity="0.08"/>
      <rect x="240" y="335" width="55" height="55" fill="currentColor" opacity="0.08"/>

      <!-- Base edges in gray (20 of 24; the 4 boundary edges of the hole drawn separately in orange) -->
      <line x1="130" y1="225" x2="295" y2="225" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
      <line x1="130" y1="280" x2="185" y2="280" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
      <line x1="240" y1="280" x2="295" y2="280" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
      <line x1="130" y1="335" x2="185" y2="335" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
      <line x1="240" y1="335" x2="295" y2="335" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
      <line x1="130" y1="390" x2="295" y2="390" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
      <line x1="130" y1="225" x2="130" y2="390" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
      <line x1="185" y1="225" x2="185" y2="280" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
      <line x1="185" y1="335" x2="185" y2="390" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
      <line x1="240" y1="225" x2="240" y2="280" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
      <line x1="240" y1="335" x2="240" y2="390" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
      <line x1="295" y1="225" x2="295" y2="390" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>

      <!-- 4 boundary edges of the hole highlighted in brand orange -->
      <line x1="185" y1="280" x2="240" y2="280" stroke="#FF6B00" stroke-width="3" stroke-linecap="round"/>
      <line x1="240" y1="280" x2="240" y2="335" stroke="#FF6B00" stroke-width="3" stroke-linecap="round"/>
      <line x1="185" y1="335" x2="240" y2="335" stroke="#FF6B00" stroke-width="3" stroke-linecap="round"/>
      <line x1="185" y1="280" x2="185" y2="335" stroke="#FF6B00" stroke-width="3" stroke-linecap="round"/>

      <!-- 16 vertex dots -->
      <circle cx="130" cy="225" r="2.5" fill="currentColor"/>
      <circle cx="185" cy="225" r="2.5" fill="currentColor"/>
      <circle cx="240" cy="225" r="2.5" fill="currentColor"/>
      <circle cx="295" cy="225" r="2.5" fill="currentColor"/>
      <circle cx="130" cy="280" r="2.5" fill="currentColor"/>
      <circle cx="185" cy="280" r="2.5" fill="currentColor"/>
      <circle cx="240" cy="280" r="2.5" fill="currentColor"/>
      <circle cx="295" cy="280" r="2.5" fill="currentColor"/>
      <circle cx="130" cy="335" r="2.5" fill="currentColor"/>
      <circle cx="185" cy="335" r="2.5" fill="currentColor"/>
      <circle cx="240" cy="335" r="2.5" fill="currentColor"/>
      <circle cx="295" cy="335" r="2.5" fill="currentColor"/>
      <circle cx="130" cy="390" r="2.5" fill="currentColor"/>
      <circle cx="185" cy="390" r="2.5" fill="currentColor"/>
      <circle cx="240" cy="390" r="2.5" fill="currentColor"/>
      <circle cx="295" cy="390" r="2.5" fill="currentColor"/>
    </g>

    <!-- Caption strip -->
    <text id="dd-delete-caption" x="215" y="460" font-size="14" font-weight="600" fill="currentColor" opacity="0.85" text-anchor="middle" letter-spacing="2">LEAVES HOLES</text>
  </g>

  <!-- DISSOLVE panel (right) -->
  <g id="dd-dissolve-panel">
    <!-- Frame outline -->
    <rect x="410" y="138" width="350" height="342" fill="none" stroke="currentColor" stroke-width="1" opacity="0.15"/>

    <!-- Header bar -->
    <g id="dd-dissolve-header">
      <rect x="410" y="138" width="350" height="32" fill="#4ADE80"/>
      <text x="585" y="160" font-size="18" font-weight="700" fill="#0f1a14" text-anchor="middle" letter-spacing="2">DISSOLVE</text>
    </g>

    <!-- Mesh diagram: 3x3 face grid with center face dissolved into a plus shaped continuous face -->
    <g id="dd-dissolve-mesh">
      <!-- 4 corner face fills -->
      <rect x="500" y="225" width="55" height="55" fill="currentColor" opacity="0.08"/>
      <rect x="610" y="225" width="55" height="55" fill="currentColor" opacity="0.08"/>
      <rect x="500" y="335" width="55" height="55" fill="currentColor" opacity="0.08"/>
      <rect x="610" y="335" width="55" height="55" fill="currentColor" opacity="0.08"/>

      <!-- Plus shaped continuous face (the 4 mid faces plus the former center face merged) -->
      <path d="M 555,225 L 610,225 L 610,280 L 665,280 L 665,335 L 610,335 L 610,390 L 555,390 L 555,335 L 500,335 L 500,280 L 555,280 Z" fill="#4ADE80" opacity="0.14"/>

      <!-- Base edges in gray (20 of 24; the 4 interior edges that bounded the former center face are gone) -->
      <line x1="500" y1="225" x2="665" y2="225" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
      <line x1="500" y1="280" x2="555" y2="280" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
      <line x1="610" y1="280" x2="665" y2="280" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
      <line x1="500" y1="335" x2="555" y2="335" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
      <line x1="610" y1="335" x2="665" y2="335" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
      <line x1="500" y1="390" x2="665" y2="390" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
      <line x1="500" y1="225" x2="500" y2="390" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
      <line x1="555" y1="225" x2="555" y2="280" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
      <line x1="555" y1="335" x2="555" y2="390" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
      <line x1="610" y1="225" x2="610" y2="280" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
      <line x1="610" y1="335" x2="610" y2="390" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
      <line x1="665" y1="225" x2="665" y2="390" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>

      <!-- 16 vertex dots -->
      <circle cx="500" cy="225" r="2.5" fill="currentColor"/>
      <circle cx="555" cy="225" r="2.5" fill="currentColor"/>
      <circle cx="610" cy="225" r="2.5" fill="currentColor"/>
      <circle cx="665" cy="225" r="2.5" fill="currentColor"/>
      <circle cx="500" cy="280" r="2.5" fill="currentColor"/>
      <circle cx="555" cy="280" r="2.5" fill="currentColor"/>
      <circle cx="610" cy="280" r="2.5" fill="currentColor"/>
      <circle cx="665" cy="280" r="2.5" fill="currentColor"/>
      <circle cx="500" cy="335" r="2.5" fill="currentColor"/>
      <circle cx="555" cy="335" r="2.5" fill="currentColor"/>
      <circle cx="610" cy="335" r="2.5" fill="currentColor"/>
      <circle cx="665" cy="335" r="2.5" fill="currentColor"/>
      <circle cx="500" cy="390" r="2.5" fill="currentColor"/>
      <circle cx="555" cy="390" r="2.5" fill="currentColor"/>
      <circle cx="610" cy="390" r="2.5" fill="currentColor"/>
      <circle cx="665" cy="390" r="2.5" fill="currentColor"/>
    </g>

    <!-- Caption strip -->
    <text id="dd-dissolve-caption" x="585" y="460" font-size="14" font-weight="600" fill="currentColor" opacity="0.85" text-anchor="middle" letter-spacing="2">RECONNECTS GEOMETRY</text>
  </g>

  <!-- Footer tip (Variant B 4px left rail) -->
  <rect x="40" y="506" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="521" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Reach for Dissolve when you want to simplify · reach for Delete when you want to open the mesh up<tspan x="58" dy="15">understanding the difference is core to clean editing</tspan></text>

</svg>
