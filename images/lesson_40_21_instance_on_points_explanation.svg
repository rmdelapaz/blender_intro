<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="iop-title iop-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="iop-title">Instance on Points</title>
  <desc id="iop-desc">The instancing idea in three stages. A row of points marks locations, a single cube is the object to copy, and the result places a copy of that cube at every point. One object is stored in memory but many are displayed.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Instance on Points</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Place a copy of one object at every point, cheaply</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Stage 1: points -->
  <text x="150" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor">Points</text>
  <text x="150" y="200" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">locations</text>
  <g fill="#4A9EFF">
    <circle cx="70" cy="290" r="6"/><circle cx="110" cy="290" r="6"/><circle cx="150" cy="290" r="6"/><circle cx="190" cy="290" r="6"/><circle cx="230" cy="290" r="6"/>
  </g>

  <!-- plus -->
  <text x="290" y="298" text-anchor="middle" font-size="30" font-weight="700" fill="#FF6B00">+</text>

  <!-- Stage 2: template -->
  <text x="400" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor">Object to copy</text>
  <text x="400" y="200" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">the template</text>
  <rect x="372" y="262" width="56" height="56" fill="#FF6B00" fill-opacity="0.22" stroke="#FF6B00" stroke-width="2"/>

  <!-- equals -->
  <text x="500" y="298" text-anchor="middle" font-size="30" font-weight="700" fill="#FF6B00">=</text>

  <!-- Stage 3: result -->
  <text x="650" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor">Instances</text>
  <text x="650" y="200" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">one at each point</text>
  <g fill="#4ADE80" fill-opacity="0.22" stroke="#4ADE80" stroke-width="1.5">
    <rect x="556" y="272" width="34" height="34"/><rect x="598" y="272" width="34" height="34"/><rect x="640" y="272" width="34" height="34"/><rect x="682" y="272" width="34" height="34"/><rect x="724" y="272" width="34" height="34"/>
  </g>

  <!-- efficiency note -->
  <rect x="140" y="392" width="520" height="56" rx="8" fill="#4ADE80" fill-opacity="0.08" stroke="#4ADE80" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="400" y="416" text-anchor="middle" font-size="13" font-weight="700" fill="#4ADE80">Efficient</text>
  <text x="400" y="435" text-anchor="middle" font-size="13" fill="currentColor">All instances share one object in memory: 1 stored, many shown.</text>

  <rect x="40" y="506" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Any point cloud works: mesh vertices, a curve, or a distribute-on-surface node.</text>
</svg>
