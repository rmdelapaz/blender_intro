<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="ltc-title ltc-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="ltc-title">Light type comparison for three-point lighting roles</title>
  <desc id="ltc-desc">A three-column reference showing which light type works best for each three-point role. The key light uses an Area light at 3 to 5 metres, 800 to 1500 watts, for soft realistic flattering light at the cost of slower renders. The fill light uses a large Area light at 4 to 6 metres, 300 to 500 watts, with shadows off, for very soft even coverage. The rim light uses a Spot or small Area light, 30 to 50 degree cone, 400 to 800 watts, for focused controllable edge light that needs careful aiming. Key is purple, fill is green, rim is pink.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">LIGHT TYPE COMPARISON</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Best light type for each three-point role &#183; settings, pros, and cons</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ============ KEY column ============ -->
  <g>
    <!-- header band -->
    <rect x="40" y="132" width="232" height="44" rx="6" fill="#667eea"/>
    <text x="156" y="153" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">KEY LIGHT</text>
    <text x="156" y="170" font-size="12" fill="#ffffff" opacity="0.9" text-anchor="middle">the main light</text>

    <!-- area-light glyph: rectangle with normal arrow -->
    <rect x="116" y="196" width="80" height="48" rx="4" fill="none" stroke="#667eea" stroke-width="2.5"/>
    <line x1="156" y1="244" x2="156" y2="282" stroke="#667eea" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="156,282 150,268 162,268" fill="#667eea"/>

    <text x="156" y="312" font-size="15" font-weight="600" fill="currentColor" text-anchor="middle">Area Light</text>

    <text x="156" y="346" font-size="12" font-weight="700" fill="currentColor" opacity="0.6" text-anchor="middle">TYPICAL SETTINGS</text>
    <text x="156" y="368" font-size="13" fill="currentColor" text-anchor="middle">3&#8211;5 m size</text>
    <text x="156" y="388" font-size="13" fill="currentColor" text-anchor="middle">800&#8211;1500 W</text>
    <text x="156" y="408" font-size="13" fill="currentColor" text-anchor="middle">45&#176; side, 40&#176; above</text>

    <text x="156" y="446" font-size="12" font-weight="700" fill="#4ADE80" text-anchor="middle">PROS</text>
    <text x="156" y="468" font-size="13" fill="currentColor" text-anchor="middle">Soft, realistic</text>
    <text x="156" y="488" font-size="13" fill="currentColor" text-anchor="middle">Flattering modeling</text>

    <text x="156" y="526" font-size="12" font-weight="700" fill="#E63946" text-anchor="middle">CONS</text>
    <text x="156" y="548" font-size="13" fill="currentColor" text-anchor="middle">Slower to render</text>
  </g>

  <!-- ============ FILL column ============ -->
  <g>
    <rect x="284" y="132" width="232" height="44" rx="6" fill="#6BCF7F"/>
    <text x="400" y="153" font-size="16" font-weight="700" fill="#0f1a14" text-anchor="middle">FILL LIGHT</text>
    <text x="400" y="170" font-size="12" fill="#0f1a14" opacity="0.85" text-anchor="middle">softens the shadows</text>

    <!-- large-area glyph: bigger rectangle -->
    <rect x="350" y="194" width="100" height="52" rx="4" fill="none" stroke="#6BCF7F" stroke-width="2.5"/>
    <line x1="400" y1="246" x2="400" y2="282" stroke="#6BCF7F" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="400,282 394,268 406,268" fill="#6BCF7F"/>

    <text x="400" y="312" font-size="15" font-weight="600" fill="currentColor" text-anchor="middle">Large Area</text>

    <text x="400" y="346" font-size="12" font-weight="700" fill="currentColor" opacity="0.6" text-anchor="middle">TYPICAL SETTINGS</text>
    <text x="400" y="368" font-size="13" fill="currentColor" text-anchor="middle">4&#8211;6 m size</text>
    <text x="400" y="388" font-size="13" fill="currentColor" text-anchor="middle">300&#8211;500 W</text>
    <text x="400" y="408" font-size="13" fill="currentColor" text-anchor="middle">opposite key, shadows off</text>

    <text x="400" y="446" font-size="12" font-weight="700" fill="#4ADE80" text-anchor="middle">PROS</text>
    <text x="400" y="468" font-size="13" fill="currentColor" text-anchor="middle">Very soft</text>
    <text x="400" y="488" font-size="13" fill="currentColor" text-anchor="middle">Even coverage</text>

    <text x="400" y="526" font-size="12" font-weight="700" fill="#E63946" text-anchor="middle">CONS</text>
    <text x="400" y="548" font-size="13" fill="currentColor" text-anchor="middle">Must disable shadows</text>
  </g>

  <!-- ============ RIM column ============ -->
  <g>
    <rect x="528" y="132" width="232" height="44" rx="6" fill="#FF6B9D"/>
    <text x="644" y="153" font-size="16" font-weight="700" fill="#0f1a14" text-anchor="middle">RIM LIGHT</text>
    <text x="644" y="170" font-size="12" fill="#0f1a14" opacity="0.85" text-anchor="middle">edge separation</text>

    <!-- spot glyph: cone -->
    <polygon points="644,196 620,250 668,250" fill="none" stroke="#FF6B9D" stroke-width="2.5" stroke-linejoin="round"/>
    <line x1="644" y1="250" x2="644" y2="282" stroke="#FF6B9D" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="644,282 638,268 650,268" fill="#FF6B9D"/>

    <text x="644" y="312" font-size="15" font-weight="600" fill="currentColor" text-anchor="middle">Spot or small Area</text>

    <text x="644" y="346" font-size="12" font-weight="700" fill="currentColor" opacity="0.6" text-anchor="middle">TYPICAL SETTINGS</text>
    <text x="644" y="368" font-size="13" fill="currentColor" text-anchor="middle">30&#8211;50&#176; spot cone</text>
    <text x="644" y="388" font-size="13" fill="currentColor" text-anchor="middle">400&#8211;800 W</text>
    <text x="644" y="408" font-size="13" fill="currentColor" text-anchor="middle">behind, 45&#8211;60&#176; above</text>

    <text x="644" y="446" font-size="12" font-weight="700" fill="#4ADE80" text-anchor="middle">PROS</text>
    <text x="644" y="468" font-size="13" fill="currentColor" text-anchor="middle">Focused</text>
    <text x="644" y="488" font-size="13" fill="currentColor" text-anchor="middle">Controllable</text>

    <text x="644" y="526" font-size="12" font-weight="700" fill="#E63946" text-anchor="middle">CONS</text>
    <text x="644" y="548" font-size="13" fill="currentColor" text-anchor="middle">Needs careful aiming</text>
  </g>

  <!-- column dividers -->
  <line x1="278" y1="190" x2="278" y2="556" stroke="currentColor" stroke-width="1" opacity="0.12"/>
  <line x1="522" y1="190" x2="522" y2="556" stroke="currentColor" stroke-width="1" opacity="0.12"/>

  <!-- Footer tip (Variant B left rail) -->
  <rect x="40" y="625" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="647" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Area lights give the soft, flattering light for key and fill; use a Spot for a tight, aimable rim edge.</text>
</svg>
