<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="d7-title d7-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="d7-title">The 7-day launch plan for week one</title>
  <desc id="d7-desc">A day-by-day launch plan for the first week: Day 1 choose your direction, Day 2 research and references, Day 3 planning and documentation, Days 4 to 5 blockout, and Days 6 to 7 start modeling, with the time commitment for each.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">The 7-Day Launch Plan</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Week 1: build momentum, not a finished piece</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- vertical timeline rail -->
  <line x1="92" y1="150" x2="92" y2="470" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Day 1 -->
  <g>
    <circle cx="92" cy="164" r="9" fill="#FF6B00"/>
    <rect x="120" y="140" width="640" height="52" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.15"/>
    <text x="138" y="164" font-size="14" font-weight="700" fill="#FF6B00">Day 1</text>
    <text x="210" y="164" font-size="15" font-weight="600" fill="currentColor">Choose Your Direction</text>
    <text x="138" y="182" font-size="12" fill="currentColor" opacity="0.6">Score 3&#8211;5 ideas on excitement, goal fit, showcase, achievability &#8212; then commit</text>
    <text x="748" y="164" font-size="12" font-weight="600" fill="#4A9EFF" text-anchor="end">1&#8211;2 hrs</text>
  </g>
  <!-- Day 2 -->
  <g>
    <circle cx="92" cy="228" r="9" fill="#4A9EFF"/>
    <rect x="120" y="204" width="640" height="52" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.15"/>
    <text x="138" y="228" font-size="14" font-weight="700" fill="#4A9EFF">Day 2</text>
    <text x="210" y="228" font-size="15" font-weight="600" fill="currentColor">Research and References</text>
    <text x="138" y="246" font-size="12" fill="currentColor" opacity="0.6">Gather and organise reference into your project folder</text>
    <text x="748" y="228" font-size="12" font-weight="600" fill="#4A9EFF" text-anchor="end">2&#8211;3 hrs</text>
  </g>
  <!-- Day 3 -->
  <g>
    <circle cx="92" cy="292" r="9" fill="#B47EE8"/>
    <rect x="120" y="268" width="640" height="52" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.15"/>
    <text x="138" y="292" font-size="14" font-weight="700" fill="#B47EE8">Day 3</text>
    <text x="210" y="292" font-size="15" font-weight="600" fill="currentColor">Planning and Documentation</text>
    <text x="138" y="310" font-size="12" fill="currentColor" opacity="0.6">Write the spec and the phase list before you build</text>
    <text x="748" y="292" font-size="12" font-weight="600" fill="#4A9EFF" text-anchor="end">1&#8211;2 hrs</text>
  </g>
  <!-- Day 4-5 -->
  <g>
    <circle cx="92" cy="356" r="9" fill="#F5C242"/>
    <rect x="120" y="332" width="640" height="52" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.15"/>
    <text x="138" y="356" font-size="14" font-weight="700" fill="#F5C242">Day 4&#8211;5</text>
    <text x="210" y="356" font-size="15" font-weight="600" fill="currentColor">Blockout</text>
    <text x="138" y="374" font-size="12" fill="currentColor" opacity="0.6">Rough shapes and proportions &#8212; the shot in grey boxes</text>
    <text x="748" y="356" font-size="12" font-weight="600" fill="#4A9EFF" text-anchor="end">3&#8211;5 hrs</text>
  </g>
  <!-- Day 6-7 -->
  <g>
    <circle cx="92" cy="420" r="9" fill="#4ADE80"/>
    <rect x="120" y="396" width="640" height="52" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.15"/>
    <text x="138" y="420" font-size="14" font-weight="700" fill="#4ADE80">Day 6&#8211;7</text>
    <text x="210" y="420" font-size="15" font-weight="600" fill="currentColor">Start Modeling</text>
    <text x="138" y="438" font-size="12" fill="currentColor" opacity="0.6">Begin the real geometry on your strongest hero element</text>
    <text x="748" y="420" font-size="12" font-weight="600" fill="#4A9EFF" text-anchor="end">3&#8211;5 hrs</text>
  </g>

  <text x="120" y="482" font-size="13" fill="currentColor" opacity="0.6">By day 7: a committed direction, organised references, a written plan, and geometry underway.</text>

  <!-- Footer tip -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Week 1 is about smart decisions and a foundation, not finished work &#8212; momentum carries the rest.</text>
</svg>
