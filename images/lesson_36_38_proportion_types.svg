<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" color="currentColor" role="img" aria-labelledby="ptv-title ptv-desc" style="max-width:100%;height:auto">
<title id="ptv-title">Body proportion variations</title>
<desc id="ptv-desc">Four character figures drawn to the same total height showing how head-to-body ratio changes the read: realistic at eight heads, heroic at eight and a half, cartoon at four, and child at five heads.</desc>
<style>
.ptv-s{fill:none;stroke:currentColor;stroke-width:2}
.ptv-base{fill:none;stroke:currentColor;stroke-width:1.2;opacity:.35}
.ptv-t{fill:currentColor;font-family:system-ui,Arial,sans-serif}
.ptv-h{font-size:16px;font-weight:700}.ptv-nm{font-size:13.5px;font-weight:700}.ptv-d{font-size:11px;opacity:.82}
.ptv-r{fill:#3a8ee6;font-size:11.5px;font-weight:700;font-family:system-ui,Arial,sans-serif}
</style>
<text x="40" y="32" class="ptv-t ptv-h">Same height, different head-to-body ratio</text>
<!-- baseline + top reference -->
<path d="M40 70 H700" class="ptv-base"/>
<path d="M40 360 H700" class="ptv-base"/>
<text x="44" y="64" class="ptv-t ptv-d">top</text>
<text x="44" y="382" class="ptv-t ptv-d">ground &#183; all figures equal total height</text>
<!-- columns center x: 120, 300, 480, 640 ; figure height 290 (70..360) -->
<!-- REALISTIC 8 heads: head r ~ 290/16=18 -->
<g transform="translate(120,0)">
<ellipse cx="0" cy="88" rx="16" ry="18" class="ptv-s"/>
<path d="M-8 106 v8 M8 106 v8 M-26 122 q26 -12 52 0" class="ptv-s"/>
<path d="M-26 122 C-30 200 -28 220 -18 250 H18 C28 220 30 200 26 122" class="ptv-s"/>
<path d="M-24 124 C-50 180 -52 220 -48 258 M24 124 C50 180 52 220 48 258" class="ptv-s"/>
<path d="M-14 250 C-20 300 -20 330 -18 360 M14 250 C20 300 20 330 18 360" class="ptv-s"/>
<text x="0" y="392" class="ptv-t ptv-nm" text-anchor="middle">Realistic</text>
<text x="0" y="410" class="ptv-r" text-anchor="middle">8 heads</text>
<text x="0" y="428" class="ptv-t ptv-d" text-anchor="middle">true adult</text>
</g>
<!-- HEROIC 8.5 heads: smaller head, broad shoulders, longer legs. head r~16 -->
<g transform="translate(300,0)">
<ellipse cx="0" cy="86" rx="15" ry="17" class="ptv-s"/>
<path d="M-7 103 v7 M7 103 v7 M-40 120 q40 -16 80 0" class="ptv-s"/>
<path d="M-40 120 C-26 180 -22 210 -16 244 H16 C22 210 26 180 40 120" class="ptv-s"/>
<path d="M-38 122 C-60 180 -60 224 -54 262 M38 122 C60 180 60 224 54 262" class="ptv-s"/>
<path d="M-14 244 C-20 305 -20 340 -18 360 M14 244 C20 305 20 340 18 360" class="ptv-s"/>
<text x="0" y="392" class="ptv-t ptv-nm" text-anchor="middle">Heroic</text>
<text x="0" y="410" class="ptv-r" text-anchor="middle">8.5 heads</text>
<text x="0" y="428" class="ptv-t ptv-d" text-anchor="middle">idealized</text>
</g>
<!-- CARTOON 4 heads: head r ~ 290/8 = 36 -->
<g transform="translate(480,0)">
<circle cx="0" cy="106" r="36" class="ptv-s"/>
<path d="M-30 144 q30 16 60 0" class="ptv-s"/>
<path d="M-30 146 C-34 200 -30 240 -22 268 H22 C30 240 34 200 30 146" class="ptv-s"/>
<path d="M-28 152 C-48 190 -50 220 -44 246 M28 152 C48 190 50 220 44 246" class="ptv-s"/>
<path d="M-16 268 C-20 310 -20 340 -18 360 M16 268 C20 310 20 340 18 360" class="ptv-s"/>
<text x="0" y="392" class="ptv-t ptv-nm" text-anchor="middle">Cartoon</text>
<text x="0" y="410" class="ptv-r" text-anchor="middle">4 heads</text>
<text x="0" y="428" class="ptv-t ptv-d" text-anchor="middle">stylized</text>
</g>
<!-- CHILD 5 heads: head r ~ 290/10 = 29 -->
<g transform="translate(640,0)">
<circle cx="0" cy="99" r="29" class="ptv-s"/>
<path d="M-9 126 v8 M9 126 v8 M-24 142 q24 -12 48 0" class="ptv-s"/>
<path d="M-24 142 C-26 195 -22 225 -14 252 H14 C22 225 26 195 24 142" class="ptv-s"/>
<path d="M-22 146 C-40 185 -42 215 -36 244 M22 146 C40 185 42 215 36 244" class="ptv-s"/>
<path d="M-13 252 C-16 305 -16 340 -15 360 M13 252 C16 305 16 340 15 360" class="ptv-s"/>
<text x="0" y="392" class="ptv-t ptv-nm" text-anchor="middle">Child</text>
<text x="0" y="410" class="ptv-r" text-anchor="middle">5 heads</text>
<text x="0" y="428" class="ptv-t ptv-d" text-anchor="middle">larger head</text>
</g>
</svg>
