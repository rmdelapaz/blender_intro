<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="fp-title fp-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="fp-title">Four-point lighting diagram (top and side views)</title>
  <desc id="fp-desc">Four-point lighting adds a background light to the standard three-point setup. The top view shows the key light front-right, the fill light front-left with shadows off, the rim light behind the subject, and a new background light placed behind the subject aimed at the backdrop. The side view shows the same four lights from the side, with the background light throwing a glow onto the back wall to separate the subject from the background. Key is purple, fill is green, rim is pink, and the background light is blue.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">FOUR-POINT LIGHTING</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Adding a background light to the three-point setup &#183; top and side views</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ============ TOP VIEW (left half) ============ -->
  <text x="40" y="138" font-size="18" font-weight="600" fill="currentColor">Top view</text>

  <!-- backdrop line behind subject (top of the top-view zone) -->
  <line x1="70" y1="178" x2="370" y2="178" stroke="currentColor" stroke-width="3" opacity="0.3"/>
  <text x="220" y="170" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">Backdrop</text>

  <!-- subject zone ring -->
  <circle cx="220" cy="300" r="60" fill="none" stroke="currentColor" stroke-width="1" opacity="0.12" stroke-dasharray="3 6"/>

  <!-- camera sightline -->
  <line x1="220" y1="392" x2="220" y2="300" stroke="currentColor" stroke-width="1.5" opacity="0.3" stroke-dasharray="5 5"/>

  <!-- direction arrows -->
  <g stroke-width="2.5" stroke-linecap="round" opacity="0.9">
    <!-- key: front-right -->
    <line x1="332" y1="246" x2="252" y2="288" stroke="#667eea"/>
    <polygon points="252,288 270,284 264,300" fill="#667eea"/>
    <!-- fill: front-left -->
    <line x1="108" y1="246" x2="188" y2="288" stroke="#6BCF7F"/>
    <polygon points="188,288 170,284 176,300" fill="#6BCF7F"/>
    <!-- rim: behind-right, points at subject back -->
    <line x1="300" y1="206" x2="244" y2="266" stroke="#FF6B9D"/>
    <polygon points="244,266 262,264 254,280" fill="#FF6B9D"/>
    <!-- background light: behind subject, aimed AT the backdrop (away from subject) -->
    <line x1="178" y1="232" x2="150" y2="188" stroke="#4A9EFF"/>
    <polygon points="150,188 168,194 154,204" fill="#4A9EFF"/>
  </g>

  <!-- subject (Suzanne) tie-break orange -->
  <g>
    <circle cx="220" cy="300" r="20" fill="#FF6B00" opacity="0.92"/>
    <circle cx="202" cy="290" r="7" fill="#FF6B00" opacity="0.92"/>
    <circle cx="238" cy="290" r="7" fill="#FF6B00" opacity="0.92"/>
    <text x="220" y="344" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Subject</text>
  </g>

  <!-- light glyphs top view -->
  <g>
    <rect x="324" y="222" width="34" height="24" rx="4" fill="#667eea"/>
    <text x="341" y="239" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">K</text>
  </g>
  <g>
    <rect x="82" y="222" width="34" height="24" rx="4" fill="#6BCF7F"/>
    <text x="99" y="239" font-size="13" font-weight="700" fill="#0f1a14" text-anchor="middle">F</text>
  </g>
  <g>
    <rect x="306" y="182" width="34" height="24" rx="4" fill="#FF6B9D"/>
    <text x="323" y="199" font-size="13" font-weight="700" fill="#0f1a14" text-anchor="middle">R</text>
  </g>
  <g>
    <rect x="156" y="206" width="34" height="24" rx="4" fill="#4A9EFF"/>
    <text x="173" y="223" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
  </g>

  <!-- camera glyph top view -->
  <g>
    <rect x="200" y="392" width="40" height="24" rx="3" fill="none" stroke="currentColor" stroke-width="2" opacity="0.7"/>
    <polygon points="240,398 254,393 254,415 240,410" fill="none" stroke="currentColor" stroke-width="2" opacity="0.7"/>
    <text x="220" y="434" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Camera</text>
  </g>

  <!-- ============ SIDE VIEW (right half) ============ -->
  <text x="430" y="138" font-size="18" font-weight="600" fill="currentColor">Side view</text>

  <!-- ground line -->
  <line x1="450" y1="392" x2="760" y2="392" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
  <text x="600" y="410" font-size="11" fill="currentColor" opacity="0.5" text-anchor="middle">Ground</text>

  <!-- back wall (backdrop) on the right -->
  <line x1="700" y1="200" x2="700" y2="392" stroke="currentColor" stroke-width="3" opacity="0.3"/>
  <text x="724" y="300" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle" transform="rotate(90 724 300)">Backdrop</text>

  <!-- background-light glow on the wall -->
  <ellipse cx="700" cy="300" rx="10" ry="52" fill="#4A9EFF" opacity="0.18"/>

  <!-- subject bust silhouette in profile -->
  <g>
    <circle cx="560" cy="312" r="22" fill="#FF6B00" opacity="0.92"/>
    <path d="M 540 392 Q 540 348 560 340 Q 580 348 580 392 Z" fill="#FF6B00" opacity="0.92"/>
    <text x="560" y="372" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">S</text>
  </g>

  <!-- direction arrows side view -->
  <g stroke-width="2.5" stroke-linecap="round" opacity="0.9">
    <!-- key: upper, ~40 above -->
    <line x1="500" y1="206" x2="548" y2="290" stroke="#667eea"/>
    <polygon points="548,290 536,278 550,272" fill="#667eea"/>
    <!-- fill: front, near eye level -->
    <line x1="468" y1="312" x2="536" y2="312" stroke="#6BCF7F"/>
    <polygon points="536,312 520,305 520,319" fill="#6BCF7F"/>
    <!-- rim: upper-back, hits top/back edge -->
    <line x1="640" y1="208" x2="582" y2="296" stroke="#FF6B9D"/>
    <polygon points="582,296 584,278 596,290" fill="#FF6B9D"/>
    <!-- background light: behind subject, aimed at the wall -->
    <line x1="636" y1="280" x2="688" y2="296" stroke="#4A9EFF"/>
    <polygon points="688,296 670,294 676,280" fill="#4A9EFF"/>
  </g>

  <!-- light glyphs side view -->
  <g>
    <rect x="476" y="182" width="34" height="24" rx="4" fill="#667eea"/>
    <text x="493" y="199" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">K</text>
  </g>
  <g>
    <rect x="430" y="300" width="34" height="24" rx="4" fill="#6BCF7F"/>
    <text x="447" y="317" font-size="13" font-weight="700" fill="#0f1a14" text-anchor="middle">F</text>
  </g>
  <g>
    <rect x="636" y="182" width="34" height="24" rx="4" fill="#FF6B9D"/>
    <text x="653" y="199" font-size="13" font-weight="700" fill="#0f1a14" text-anchor="middle">R</text>
  </g>
  <g>
    <rect x="600" y="258" width="34" height="24" rx="4" fill="#4A9EFF"/>
    <text x="617" y="275" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
  </g>

  <!-- ============ LEGEND ============ -->
  <g font-size="13">
    <rect x="40" y="468" width="16" height="16" rx="3" fill="#667eea"/>
    <text x="64" y="481" fill="currentColor">Key &#183; main light, 45&#176; front-right</text>
    <rect x="40" y="494" width="16" height="16" rx="3" fill="#6BCF7F"/>
    <text x="64" y="507" fill="currentColor">Fill &#183; softens shadows, opposite key, shadows off</text>
    <rect x="420" y="468" width="16" height="16" rx="3" fill="#FF6B9D"/>
    <text x="444" y="481" fill="currentColor">Rim &#183; edge separation, behind subject</text>
    <rect x="420" y="494" width="16" height="16" rx="3" fill="#4A9EFF"/>
    <text x="444" y="507" fill="currentColor">Background &#183; lights the backdrop, adds depth</text>
  </g>

  <!-- Footer tip (Variant B left rail) -->
  <rect x="40" y="625" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="647" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> The background light points at the backdrop, not the subject; it adds depth and separation.</text>
</svg>
