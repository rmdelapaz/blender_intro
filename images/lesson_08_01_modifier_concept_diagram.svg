<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" color="#222" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <title>How modifiers work: the non-destructive flow</title>
    <desc>A three-stage horizontal flow showing the non-destructive modifier concept. Stage one: the original mesh, a grey cube, unchanged. Stage two: a non-destructive modifier applied, shown as a purple filter layer over the cube. Stage three: the editable result, a smooth green rounded shape. A toggle-and-adjust banner spans all three stages, indicating the modifier can be turned off or re-tuned at any time without losing the original.</desc>

    <!-- accent rail -->
    <rect x="0" y="0" width="8" height="560" fill="#FF6B00"/>

    <!-- heading -->
    <text x="40" y="56" font-size="30" font-weight="700" fill="currentColor">Modifiers are non-destructive</text>
    <text x="40" y="88" font-size="17" fill="currentColor" opacity="0.75">Your original geometry is never lost · the effect stays live and editable</text>

    <!-- ============ STAGE 1: ORIGINAL MESH ============ -->
    <g>
        <rect x="40" y="150" width="200" height="220" rx="12" fill="none" stroke="currentColor" stroke-width="2" opacity="0.35"/>
        <!-- grey blocky cube -->
        <g stroke="#0f1a14" stroke-width="2.5" stroke-linejoin="round">
            <polygon points="100,250 140,228 200,250 160,272" fill="#c9ccd1"/>
            <polygon points="100,250 100,310 160,332 160,272" fill="#a9adb5"/>
            <polygon points="160,272 200,250 200,310 160,332" fill="#babdc4"/>
        </g>
        <text x="140" y="356" font-size="16" font-weight="700" fill="currentColor" text-anchor="middle">Original mesh</text>
        <text x="140" y="178" font-size="13" fill="currentColor" text-anchor="middle" opacity="0.7">Unchanged</text>
    </g>

    <!-- arrow 1 -->
    <g stroke="#FF6B00" stroke-width="4" fill="#FF6B00">
        <line x1="252" y1="260" x2="296" y2="260" stroke-linecap="round"/>
        <polygon points="296,250 316,260 296,270"/>
    </g>

    <!-- ============ STAGE 2: MODIFIER APPLIED ============ -->
    <g>
        <rect x="328" y="150" width="200" height="220" rx="12" fill="none" stroke="#B47EE8" stroke-width="2.5"/>
        <!-- same cube under a purple filter overlay -->
        <g stroke="#0f1a14" stroke-width="2.5" stroke-linejoin="round">
            <polygon points="388,250 428,228 488,250 448,272" fill="#c9ccd1"/>
            <polygon points="388,250 388,310 448,332 448,272" fill="#a9adb5"/>
            <polygon points="448,272 488,250 488,310 448,332" fill="#babdc4"/>
        </g>
        <!-- purple filter layer -->
        <rect x="356" y="206" width="144" height="148" rx="10" fill="#B47EE8" opacity="0.34"/>
        <!-- filter glyph -->
        <circle cx="428" cy="280" r="20" fill="none" stroke="#B47EE8" stroke-width="4"/>
        <line x1="428" y1="266" x2="428" y2="294" stroke="#B47EE8" stroke-width="4" stroke-linecap="round"/>
        <line x1="414" y1="280" x2="442" y2="280" stroke="#B47EE8" stroke-width="4" stroke-linecap="round"/>
        <text x="428" y="356" font-size="16" font-weight="700" fill="#9a5fd0" text-anchor="middle">Modifier applied</text>
        <text x="428" y="178" font-size="13" fill="#9a5fd0" text-anchor="middle" opacity="0.85">Live filter layer</text>
    </g>

    <!-- arrow 2 -->
    <g stroke="#FF6B00" stroke-width="4" fill="#FF6B00">
        <line x1="540" y1="260" x2="584" y2="260" stroke-linecap="round"/>
        <polygon points="584,250 604,260 584,270"/>
    </g>

    <!-- ============ STAGE 3: EDITABLE RESULT ============ -->
    <g>
        <rect x="616" y="150" width="160" height="220" rx="12" fill="none" stroke="#4ADE80" stroke-width="2.5"/>
        <!-- smooth rounded result -->
        <path d="M 696,224 C 736,224 750,262 750,288 C 750,318 726,336 696,336 C 666,336 642,318 642,288 C 642,262 656,224 696,224 Z" fill="#4ADE80" opacity="0.85" stroke="#0f1a14" stroke-width="2.5"/>
        <text x="696" y="356" font-size="16" font-weight="700" fill="#2fa85f" text-anchor="middle">Editable result</text>
        <text x="696" y="178" font-size="13" fill="#2fa85f" text-anchor="middle" opacity="0.85">Smooth · still tunable</text>
    </g>

    <!-- ============ TOGGLE / ADJUST BANNER ============ -->
    <g>
        <rect x="40" y="416" width="736" height="96" rx="12" fill="#FF6B00" opacity="0.10"/>
        <rect x="40" y="416" width="736" height="96" rx="12" fill="none" stroke="#FF6B00" stroke-width="2"/>

        <!-- toggle switch glyph (ON) -->
        <rect x="68" y="450" width="60" height="30" rx="15" fill="#4ADE80"/>
        <circle cx="113" cy="465" r="11" fill="#ffffff"/>
        <text x="148" y="462" font-size="15" font-weight="700" fill="currentColor">Toggle off anytime</text>
        <text x="148" y="484" font-size="13" fill="currentColor" opacity="0.75">Hide the effect, original returns instantly</text>

        <!-- adjust glyph (slider) -->
        <g transform="translate(424,449)">
            <line x1="0" y1="8" x2="96" y2="8" stroke="#B47EE8" stroke-width="4" stroke-linecap="round"/>
            <line x1="0" y1="24" x2="96" y2="24" stroke="#B47EE8" stroke-width="4" stroke-linecap="round"/>
            <circle cx="68" cy="8" r="9" fill="#B47EE8"/>
            <circle cx="32" cy="24" r="9" fill="#B47EE8"/>
        </g>
        <text x="540" y="462" font-size="15" font-weight="700" fill="currentColor">Adjust settings anytime</text>
        <text x="540" y="484" font-size="13" fill="currentColor" opacity="0.75">Re-tune values, no rebuild</text>
    </g>
</svg>
