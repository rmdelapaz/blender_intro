<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="sc-title sc-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="sc-title">Camera animation keyboard shortcuts reference</title>
  <desc id="sc-desc">A keyboard cheat-sheet card for camera animation, grouped into four clusters: Keyframes (I, Alt+I, Shift+Alt+I), Playback and timeline (Spacebar, Shift+Ctrl+Spacebar, arrow keys, Home, End), Viewport and camera (Numpad 0, N, G, Shift+A), and Dope Sheet and reuse (A, Ctrl+C, Ctrl+V, Shift+D, S, Ctrl+T, Ctrl+P). Each shortcut is a muted orange key chip with a short description.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">CAMERA ANIMATION SHORTCUTS</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Every keyboard move from this lesson, in one card</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ============ Cluster 1: Keyframes ============ -->
  <text x="40" y="140" font-size="14" font-weight="700" fill="currentColor">Keyframes</text>
  <line x1="40" y1="150" x2="760" y2="150" stroke="currentColor" stroke-width="1" opacity="0.12"/>
  <!-- row: I -->
  <g transform="translate(40,162)">
    <rect x="0" y="0" width="118" height="26" rx="5" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-opacity="0.55"/>
    <text x="59" y="18" font-size="13" font-weight="700" text-anchor="middle" fill="#FF6B00">I</text>
    <text x="130" y="18" font-size="13" fill="currentColor" opacity="0.8">Insert keyframe (LocRot)</text>
  </g>
  <g transform="translate(360,162)">
    <rect x="0" y="0" width="118" height="26" rx="5" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-opacity="0.55"/>
    <text x="59" y="18" font-size="13" font-weight="700" text-anchor="middle" fill="#FF6B00">Alt+I</text>
    <text x="130" y="18" font-size="13" fill="currentColor" opacity="0.8">Delete keyframe</text>
  </g>
  <g transform="translate(40,196)">
    <rect x="0" y="0" width="118" height="26" rx="5" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-opacity="0.55"/>
    <text x="59" y="18" font-size="13" font-weight="700" text-anchor="middle" fill="#FF6B00">Shift+Alt+I</text>
    <text x="130" y="18" font-size="13" fill="currentColor" opacity="0.8">Clear all keyframes</text>
  </g>

  <!-- ============ Cluster 2: Playback & timeline ============ -->
  <text x="40" y="256" font-size="14" font-weight="700" fill="currentColor">Playback &amp; timeline</text>
  <line x1="40" y1="266" x2="760" y2="266" stroke="currentColor" stroke-width="1" opacity="0.12"/>
  <g transform="translate(40,278)">
    <rect x="0" y="0" width="158" height="26" rx="5" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-opacity="0.55"/>
    <text x="79" y="18" font-size="13" font-weight="700" text-anchor="middle" fill="#FF6B00">Spacebar</text>
    <text x="170" y="18" font-size="13" fill="currentColor" opacity="0.8">Play / pause</text>
  </g>
  <g transform="translate(400,278)">
    <rect x="0" y="0" width="180" height="26" rx="5" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-opacity="0.55"/>
    <text x="90" y="18" font-size="12" font-weight="700" text-anchor="middle" fill="#FF6B00">Shift+Ctrl+Spacebar</text>
    <text x="192" y="18" font-size="13" fill="currentColor" opacity="0.8">Reverse</text>
  </g>
  <g transform="translate(40,312)">
    <rect x="0" y="0" width="158" height="26" rx="5" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-opacity="0.55"/>
    <text x="79" y="18" font-size="12" font-weight="700" text-anchor="middle" fill="#FF6B00">Left/Right Arrow</text>
    <text x="170" y="18" font-size="13" fill="currentColor" opacity="0.8">Step 1 frame</text>
  </g>
  <g transform="translate(400,312)">
    <rect x="0" y="0" width="180" height="26" rx="5" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-opacity="0.55"/>
    <text x="90" y="18" font-size="12" font-weight="700" text-anchor="middle" fill="#FF6B00">Shift+Left/Right Arrow</text>
    <text x="192" y="18" font-size="13" fill="currentColor" opacity="0.8">Jump 10</text>
  </g>
  <g transform="translate(40,346)">
    <rect x="0" y="0" width="158" height="26" rx="5" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-opacity="0.55"/>
    <text x="79" y="18" font-size="13" font-weight="700" text-anchor="middle" fill="#FF6B00">Home</text>
    <text x="170" y="18" font-size="13" fill="currentColor" opacity="0.8">Frame 1</text>
  </g>
  <g transform="translate(400,346)">
    <rect x="0" y="0" width="180" height="26" rx="5" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-opacity="0.55"/>
    <text x="90" y="18" font-size="13" font-weight="700" text-anchor="middle" fill="#FF6B00">End</text>
    <text x="192" y="18" font-size="13" fill="currentColor" opacity="0.8">Last frame</text>
  </g>

  <!-- ============ Cluster 3: Viewport & camera ============ -->
  <text x="40" y="406" font-size="14" font-weight="700" fill="currentColor">Viewport &amp; camera</text>
  <line x1="40" y1="416" x2="760" y2="416" stroke="currentColor" stroke-width="1" opacity="0.12"/>
  <g transform="translate(40,428)">
    <rect x="0" y="0" width="118" height="26" rx="5" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-opacity="0.55"/>
    <text x="59" y="18" font-size="13" font-weight="700" text-anchor="middle" fill="#FF6B00">Numpad 0</text>
    <text x="130" y="18" font-size="13" fill="currentColor" opacity="0.8">Toggle camera view</text>
  </g>
  <g transform="translate(360,428)">
    <rect x="0" y="0" width="118" height="26" rx="5" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-opacity="0.55"/>
    <text x="59" y="18" font-size="13" font-weight="700" text-anchor="middle" fill="#FF6B00">N</text>
    <text x="130" y="18" font-size="13" fill="currentColor" opacity="0.8">Side panel (Lock Cam to View)</text>
  </g>
  <g transform="translate(40,462)">
    <rect x="0" y="0" width="118" height="26" rx="5" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-opacity="0.55"/>
    <text x="59" y="18" font-size="13" font-weight="700" text-anchor="middle" fill="#FF6B00">G</text>
    <text x="130" y="18" font-size="13" fill="currentColor" opacity="0.8">Grab / move camera</text>
  </g>
  <g transform="translate(360,462)">
    <rect x="0" y="0" width="118" height="26" rx="5" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-opacity="0.55"/>
    <text x="59" y="18" font-size="13" font-weight="700" text-anchor="middle" fill="#FF6B00">Shift+A</text>
    <text x="130" y="18" font-size="13" fill="currentColor" opacity="0.8">Add (camera, empty)</text>
  </g>

  <!-- ============ Cluster 4: Dope Sheet & reuse ============ -->
  <text x="40" y="522" font-size="14" font-weight="700" fill="currentColor">Dope Sheet &amp; reuse</text>
  <line x1="40" y1="532" x2="760" y2="532" stroke="currentColor" stroke-width="1" opacity="0.12"/>
  <g transform="translate(40,544)">
    <rect x="0" y="0" width="118" height="26" rx="5" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-opacity="0.55"/>
    <text x="59" y="18" font-size="13" font-weight="700" text-anchor="middle" fill="#FF6B00">A</text>
    <text x="130" y="18" font-size="13" fill="currentColor" opacity="0.8">Select all keys</text>
  </g>
  <g transform="translate(360,544)">
    <rect x="0" y="0" width="140" height="26" rx="5" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-opacity="0.55"/>
    <text x="70" y="18" font-size="12" font-weight="700" text-anchor="middle" fill="#FF6B00">Ctrl+C / Ctrl+V</text>
    <text x="152" y="18" font-size="13" fill="currentColor" opacity="0.8">Copy / paste keys</text>
  </g>
  <g transform="translate(40,578)">
    <rect x="0" y="0" width="118" height="26" rx="5" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-opacity="0.55"/>
    <text x="59" y="18" font-size="13" font-weight="700" text-anchor="middle" fill="#FF6B00">Shift+D</text>
    <text x="130" y="18" font-size="13" fill="currentColor" opacity="0.8">Duplicate</text>
  </g>
  <g transform="translate(360,578)">
    <rect x="0" y="0" width="118" height="26" rx="5" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-opacity="0.55"/>
    <text x="59" y="18" font-size="13" font-weight="700" text-anchor="middle" fill="#FF6B00">S</text>
    <text x="130" y="18" font-size="13" fill="currentColor" opacity="0.8">Scale keys (timing)</text>
  </g>
  <g transform="translate(40,612)">
    <rect x="0" y="0" width="118" height="26" rx="5" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-opacity="0.55"/>
    <text x="59" y="18" font-size="13" font-weight="700" text-anchor="middle" fill="#FF6B00">Ctrl+T</text>
    <text x="130" y="18" font-size="13" fill="currentColor" opacity="0.8">Track To</text>
  </g>
  <g transform="translate(360,612)">
    <rect x="0" y="0" width="118" height="26" rx="5" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-opacity="0.55"/>
    <text x="59" y="18" font-size="13" font-weight="700" text-anchor="middle" fill="#FF6B00">Ctrl+P</text>
    <text x="130" y="18" font-size="13" fill="currentColor" opacity="0.8">Parent (orbit rig)</text>
  </g>
</svg>
