<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="dr-title dr-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="dr-title">Real-world F&#183;Curve: door opening rotation</title>
  <desc id="dr-desc">A Graph Editor rotation F-curve for a door opening from 0 degrees at frame 1 to 90 degrees at frame 24. A smooth S-curve: the door begins slowly, swings quickly through the middle, then settles gently into its open position.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">REAL-WORLD CURVE &#183; DOOR OPENING</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Z-Rotation 0&#176; to 90&#176; &#183; ease in, swing, ease out into the open position</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Gridlines: vertical at frame 1,8,16,24 ; horizontal at 0,30,60,90 deg -->
  <g stroke="currentColor" stroke-width="1" opacity="0.15">
    <line x1="110" y1="170" x2="110" y2="460"/>
    <line x1="313" y1="170" x2="313" y2="460"/>
    <line x1="517" y1="170" x2="517" y2="460"/>
    <line x1="720" y1="170" x2="720" y2="460"/>
    <line x1="110" y1="460" x2="720" y2="460"/>
    <line x1="110" y1="363" x2="720" y2="363"/>
    <line x1="110" y1="267" x2="720" y2="267"/>
    <line x1="110" y1="170" x2="720" y2="170"/>
  </g>

  <!-- Axes -->
  <g stroke="currentColor" stroke-width="1.5" opacity="0.4" stroke-linecap="round">
    <line x1="110" y1="170" x2="110" y2="460"/>
    <line x1="110" y1="460" x2="720" y2="460"/>
  </g>

  <!-- Axis labels + ticks -->
  <text x="110" y="478" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">1</text>
  <text x="313" y="478" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">8</text>
  <text x="517" y="478" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">16</text>
  <text x="720" y="478" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">24</text>
  <text x="415" y="500" font-size="13" fill="currentColor" opacity="0.65" text-anchor="middle">Frame (time)</text>
  <text x="98" y="464" font-size="13" fill="currentColor" opacity="0.6" text-anchor="end">0&#176;</text>
  <text x="98" y="367" font-size="13" fill="currentColor" opacity="0.6" text-anchor="end">30&#176;</text>
  <text x="98" y="271" font-size="13" fill="currentColor" opacity="0.6" text-anchor="end">60&#176;</text>
  <text x="98" y="174" font-size="13" fill="currentColor" opacity="0.6" text-anchor="end">90&#176;</text>
  <text x="64" y="315" font-size="13" fill="currentColor" opacity="0.65" text-anchor="middle" transform="rotate(-90 64 315)">Rotation</text>

  <!-- Door rotation S-curve: X-axis red (rotation). Monotonic ease-in/out 0deg to 90deg -->
  <path d="M 110 460 C 400 460 430 170 720 170" fill="none" stroke="#E63946" stroke-width="3" stroke-linecap="round"/>

  <!-- Keyframe diamonds at endpoints -->
  <g fill="#FF6B00">
    <path d="M 110 451 L 119 460 L 110 469 L 101 460 Z"/>
    <path d="M 720 161 L 729 170 L 720 179 L 711 170 Z"/>
  </g>

  <!-- Annotation: slow start -->
  <line x1="160" y1="445" x2="175" y2="405" stroke="currentColor" stroke-width="1" opacity="0.3" stroke-linecap="round"/>
  <text x="181" y="400" font-size="14" fill="currentColor">Door begins moving</text>
  <text x="181" y="418" font-size="13" fill="currentColor" opacity="0.65">(slow start)</text>

  <!-- Annotation: fast swing middle -->
  <line x1="415" y1="315" x2="455" y2="320" stroke="currentColor" stroke-width="1" opacity="0.3" stroke-linecap="round"/>
  <text x="461" y="316" font-size="14" fill="currentColor">Door swinging</text>
  <text x="461" y="334" font-size="13" fill="currentColor" opacity="0.65">(fast middle)</text>

  <!-- Annotation: settle -->
  <line x1="660" y1="185" x2="615" y2="220" stroke="currentColor" stroke-width="1" opacity="0.3" stroke-linecap="round"/>
  <text x="500" y="218" font-size="14" fill="currentColor" text-anchor="end">Settles open (slow end)</text>

  <!-- Positive pill: natural ease in/out -->
  <rect x="470" y="396" width="250" height="30" rx="6" fill="#4ADE80" fill-opacity="0.16" stroke="#4ADE80" stroke-opacity="0.55"/>
  <circle cx="488" cy="411" r="4" fill="#4ADE80"/>
  <text x="500" y="416" font-size="14" font-weight="600" fill="currentColor">Natural ease in / ease out</text>

  <!-- Footer tip -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> The same S-curve that moves a ball smoothly also swings a door &#183; ease in/out is everywhere.
  </text>
</svg>
