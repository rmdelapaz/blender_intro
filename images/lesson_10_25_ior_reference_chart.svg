<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="ir-title ir-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="ir-title">Index of Refraction Reference Chart</title>
  <desc id="ir-desc">A reference list of Index of Refraction values for common transparent materials, each with a small diagram of a light ray bending as it enters the material. Air or vacuum is 1.0 with no bending, water 1.33, plastic or acrylic 1.45 to 1.49, standard glass 1.45 to 1.52, quartz crystal 1.54, sapphire 1.77, and diamond 2.42 with the most dramatic bending. Higher IOR means light bends more sharply.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Index of Refraction (IOR) Reference</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Higher IOR bends light more sharply &#183; only affects materials with Transmission above 0</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Column headers -->
  <text x="40" y="138" font-size="13" font-weight="700" fill="currentColor" opacity="0.6">MATERIAL</text>
  <text x="300" y="138" font-size="13" font-weight="700" fill="currentColor" opacity="0.6">IOR</text>
  <text x="560" y="138" font-size="13" font-weight="700" fill="currentColor" opacity="0.6" text-anchor="middle">LIGHT BENDING</text>

  <!-- Row 1: Air / Vacuum 1.0 -->
  <text x="40" y="180" font-size="16" font-weight="600" fill="currentColor">Air / Vacuum</text>
  <text x="40" y="202" font-size="13" fill="currentColor" opacity="0.6">Reference baseline, no bending</text>
  <text x="300" y="186" font-size="20" font-weight="700" fill="currentColor">1.00</text>
  <g stroke-linecap="round" fill="none">
    <line x1="470" y1="175" x2="650" y2="175" stroke="currentColor" stroke-opacity="0.25" stroke-width="2"/>
    <line x1="560" y1="151" x2="560" y2="199" stroke="currentColor" stroke-opacity="0.35" stroke-width="2"/>
    <line x1="478" y1="157" x2="560" y2="175" stroke="#4A9EFF" stroke-width="3"/>
    <line x1="560" y1="175" x2="642" y2="193" stroke="#4A9EFF" stroke-width="3"/>
  </g>
  <line x1="40" y1="216" x2="760" y2="216" stroke="currentColor" stroke-width="1" opacity="0.1"/>

  <!-- Row 2: Water 1.33 -->
  <text x="40" y="250" font-size="16" font-weight="600" fill="currentColor">Water</text>
  <text x="40" y="272" font-size="13" fill="currentColor" opacity="0.6">Slight bend, like a pool surface</text>
  <text x="300" y="256" font-size="20" font-weight="700" fill="currentColor">1.33</text>
  <g stroke-linecap="round" fill="none">
    <line x1="470" y1="245" x2="650" y2="245" stroke="currentColor" stroke-opacity="0.25" stroke-width="2"/>
    <line x1="560" y1="221" x2="560" y2="269" stroke="currentColor" stroke-opacity="0.35" stroke-width="2"/>
    <line x1="478" y1="227" x2="560" y2="245" stroke="#4A9EFF" stroke-width="3"/>
    <line x1="560" y1="245" x2="640" y2="278" stroke="#4A9EFF" stroke-width="3"/>
  </g>
  <line x1="40" y1="286" x2="760" y2="286" stroke="currentColor" stroke-width="1" opacity="0.1"/>

  <!-- Row 3: Plastic / Acrylic 1.45-1.49 -->
  <text x="40" y="320" font-size="16" font-weight="600" fill="currentColor">Plastic / Acrylic</text>
  <text x="40" y="342" font-size="13" fill="currentColor" opacity="0.6">Typical for synthetics</text>
  <text x="300" y="326" font-size="20" font-weight="700" fill="currentColor">1.45 &#8211; 1.49</text>
  <g stroke-linecap="round" fill="none">
    <line x1="470" y1="315" x2="650" y2="315" stroke="currentColor" stroke-opacity="0.25" stroke-width="2"/>
    <line x1="560" y1="291" x2="560" y2="339" stroke="currentColor" stroke-opacity="0.35" stroke-width="2"/>
    <line x1="478" y1="297" x2="560" y2="315" stroke="#4A9EFF" stroke-width="3"/>
    <line x1="560" y1="315" x2="636" y2="351" stroke="#4A9EFF" stroke-width="3"/>
  </g>
  <line x1="40" y1="356" x2="760" y2="356" stroke="currentColor" stroke-width="1" opacity="0.1"/>

  <!-- Row 4: Glass (standard) 1.45-1.52 -->
  <text x="40" y="390" font-size="16" font-weight="600" fill="currentColor">Glass (standard)</text>
  <text x="40" y="412" font-size="13" fill="currentColor" opacity="0.6">Windows, bottles, lenses</text>
  <text x="300" y="396" font-size="20" font-weight="700" fill="currentColor">1.45 &#8211; 1.52</text>
  <g stroke-linecap="round" fill="none">
    <line x1="470" y1="385" x2="650" y2="385" stroke="currentColor" stroke-opacity="0.25" stroke-width="2"/>
    <line x1="560" y1="361" x2="560" y2="409" stroke="currentColor" stroke-opacity="0.35" stroke-width="2"/>
    <line x1="478" y1="367" x2="560" y2="385" stroke="#4A9EFF" stroke-width="3"/>
    <line x1="560" y1="385" x2="634" y2="423" stroke="#4A9EFF" stroke-width="3"/>
  </g>
  <line x1="40" y1="426" x2="760" y2="426" stroke="currentColor" stroke-width="1" opacity="0.1"/>

  <!-- Row 5: Quartz Crystal 1.54 -->
  <text x="40" y="460" font-size="16" font-weight="600" fill="currentColor">Quartz Crystal</text>
  <text x="40" y="482" font-size="13" fill="currentColor" opacity="0.6">Noticeable optical effect</text>
  <text x="300" y="466" font-size="20" font-weight="700" fill="currentColor">1.54</text>
  <g stroke-linecap="round" fill="none">
    <line x1="470" y1="455" x2="650" y2="455" stroke="currentColor" stroke-opacity="0.25" stroke-width="2"/>
    <line x1="560" y1="431" x2="560" y2="479" stroke="currentColor" stroke-opacity="0.35" stroke-width="2"/>
    <line x1="478" y1="437" x2="560" y2="455" stroke="#4A9EFF" stroke-width="3"/>
    <line x1="560" y1="455" x2="630" y2="495" stroke="#4A9EFF" stroke-width="3"/>
  </g>
  <line x1="40" y1="496" x2="760" y2="496" stroke="currentColor" stroke-width="1" opacity="0.1"/>

  <!-- Row 6: Sapphire 1.77 -->
  <text x="40" y="530" font-size="16" font-weight="600" fill="currentColor">Sapphire</text>
  <text x="40" y="552" font-size="13" fill="currentColor" opacity="0.6">Strong, gemstone-quality refraction</text>
  <text x="300" y="536" font-size="20" font-weight="700" fill="currentColor">1.77</text>
  <g stroke-linecap="round" fill="none">
    <line x1="470" y1="525" x2="650" y2="525" stroke="currentColor" stroke-opacity="0.25" stroke-width="2"/>
    <line x1="560" y1="501" x2="560" y2="549" stroke="currentColor" stroke-opacity="0.35" stroke-width="2"/>
    <line x1="478" y1="507" x2="560" y2="525" stroke="#4A9EFF" stroke-width="3"/>
    <line x1="560" y1="525" x2="622" y2="567" stroke="#FF6B00" stroke-width="3"/>
  </g>
  <line x1="40" y1="566" x2="760" y2="566" stroke="currentColor" stroke-width="1" opacity="0.1"/>

  <!-- Row 7: Diamond 2.42 -->
  <text x="40" y="600" font-size="16" font-weight="600" fill="currentColor">Diamond</text>
  <text x="40" y="622" font-size="13" fill="currentColor" opacity="0.6">Extreme bending, brilliant sparkle</text>
  <text x="300" y="606" font-size="20" font-weight="700" fill="currentColor">2.42</text>
  <g stroke-linecap="round" fill="none">
    <line x1="470" y1="595" x2="650" y2="595" stroke="currentColor" stroke-opacity="0.25" stroke-width="2"/>
    <line x1="560" y1="571" x2="560" y2="619" stroke="currentColor" stroke-opacity="0.35" stroke-width="2"/>
    <line x1="478" y1="577" x2="560" y2="595" stroke="#4A9EFF" stroke-width="3"/>
    <line x1="560" y1="595" x2="606" y2="637" stroke="#FF6B00" stroke-width="3"/>
  </g>

  <!-- Footer tip (Variant B, dense variant y) -->
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> The orange ray marks the steepest benders. Diamond's high IOR is why cut stones throw so much sparkle.
  </text>
</svg>
