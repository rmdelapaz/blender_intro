<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" color="#222" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" role="img" aria-labelledby="pvp-t pvp-d">
  <title id="pvp-t">The Five Pillars of Product Visualization: Impact vs. Effort</title>
  <desc id="pvp-d">A quadrant chart placing the five pillars &#8212; clean geometry, realistic materials, professional lighting, strong composition, and polished post &#8212; by how much visual payoff each delivers against how much time it costs, so beginners know what to prioritize first.</desc>
  <rect x="0" y="0" width="760" height="520" fill="none"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="currentColor">The Five Pillars &#8212; Priority Matrix</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#8a8f98">Where to spend your effort first on your first product render</text>

  <!-- axes frame -->
  <g stroke="#666" stroke-width="1.5">
    <line x1="120" y1="90" x2="120" y2="440"/>
    <line x1="120" y1="440" x2="710" y2="440"/>
  </g>
  <!-- quadrant divider -->
  <g stroke="#555" stroke-width="1" stroke-dasharray="4 4">
    <line x1="415" y1="90" x2="415" y2="440"/>
    <line x1="120" y1="265" x2="710" y2="265"/>
  </g>
  <!-- axis labels -->
  <text x="415" y="470" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">EFFORT / TIME COST  &#8594;</text>
  <text x="88" y="265" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor" transform="rotate(-90 88 265)">VISUAL IMPACT  &#8594;</text>
  <text x="267" y="106" text-anchor="middle" font-size="11" fill="#8a8f98">low effort</text>
  <text x="562" y="106" text-anchor="middle" font-size="11" fill="#8a8f98">high effort</text>

  <!-- quadrant tint hints -->
  <rect x="121" y="91" width="293" height="173" fill="#4ADE80" opacity="0.06"/>
  <text x="267" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#4ADE80" opacity="0.85">DO FIRST &#183; big win, cheap</text>

  <!-- pillar bubbles: cx,cy sized by role -->
  <!-- Professional Lighting: high impact, medium effort -->
  <g>
    <circle cx="360" cy="150" r="40" fill="#FF6B00" opacity="0.9"/>
    <text x="360" y="147" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Pro</text>
    <text x="360" y="162" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Lighting</text>
  </g>
  <!-- Realistic Materials: high impact, high effort -->
  <g>
    <circle cx="560" cy="175" r="38" fill="#B47EE8" opacity="0.9"/>
    <text x="560" y="172" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Realistic</text>
    <text x="560" y="187" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Materials</text>
  </g>
  <!-- Strong Composition: high impact, low effort -->
  <g>
    <circle cx="230" cy="185" r="36" fill="#4ADE80" opacity="0.9"/>
    <text x="230" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Strong</text>
    <text x="230" y="197" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">Composition</text>
  </g>
  <!-- Clean Geometry: medium impact, medium-high effort -->
  <g>
    <circle cx="500" cy="345" r="35" fill="#4A9EFF" opacity="0.9"/>
    <text x="500" y="342" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Clean</text>
    <text x="500" y="357" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Geometry</text>
  </g>
  <!-- Polished Post: low-medium impact, low effort -->
  <g>
    <circle cx="245" cy="360" r="30" fill="#F5C242" opacity="0.9"/>
    <text x="245" y="357" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">Polished</text>
    <text x="245" y="371" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">Post</text>
  </g>

  <!-- legend / takeaway -->
  <text x="120" y="502" font-size="12" fill="#8a8f98">Bubble size = how central the pillar is for a first project. Chase the green corner first: composition and lighting buy the most realism per hour.</text>
</svg>
