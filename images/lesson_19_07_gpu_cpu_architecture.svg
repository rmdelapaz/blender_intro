<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="gca-title gca-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="gca-title">CPU versus GPU architecture for path tracing</title>
  <desc id="gca-desc">A CPU is drawn as a few large cores; a GPU as a grid of many small cores. Below them, two horizontal bars compare render time: the CPU bar is long, the GPU bar is short, showing the GPU finishing several times faster on parallel path-tracing work.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">CPU vs GPU: Why the GPU Wins</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">A few powerful cores · versus · thousands of small parallel cores</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ============ CPU panel ============ -->
  <g>
    <text x="200" y="150" text-anchor="middle" font-size="18" font-weight="600" fill="currentColor">CPU</text>
    <text x="200" y="172" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.6">4 to 16 large cores</text>
    <!-- chip outline -->
    <rect x="80" y="190" width="240" height="150" rx="8" fill="#4A9EFF" opacity="0.10" stroke="#4A9EFF" stroke-width="2"/>
    <!-- 4 large cores -->
    <g fill="#4A9EFF" opacity="0.85">
      <rect x="100" y="210" width="90" height="55" rx="5"/>
      <rect x="210" y="210" width="90" height="55" rx="5"/>
      <rect x="100" y="280" width="90" height="55" rx="5"/>
      <rect x="210" y="280" width="90" height="55" rx="5"/>
    </g>
    <text x="200" y="365" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.6">Each core very powerful</text>
  </g>

  <!-- ============ GPU panel ============ -->
  <g>
    <text x="600" y="150" text-anchor="middle" font-size="18" font-weight="600" fill="currentColor">GPU</text>
    <text x="600" y="172" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.6">Thousands of small cores</text>
    <rect x="480" y="190" width="240" height="150" rx="8" fill="#B47EE8" opacity="0.10" stroke="#B47EE8" stroke-width="2"/>
    <!-- grid of many small cores: 10 cols x 5 rows -->
    <g fill="#B47EE8" opacity="0.85">
      <rect x="496" y="206" width="15" height="15" rx="2"/>
      <rect x="517" y="206" width="15" height="15" rx="2"/>
      <rect x="538" y="206" width="15" height="15" rx="2"/>
      <rect x="559" y="206" width="15" height="15" rx="2"/>
      <rect x="580" y="206" width="15" height="15" rx="2"/>
      <rect x="601" y="206" width="15" height="15" rx="2"/>
      <rect x="622" y="206" width="15" height="15" rx="2"/>
      <rect x="643" y="206" width="15" height="15" rx="2"/>
      <rect x="664" y="206" width="15" height="15" rx="2"/>
      <rect x="685" y="206" width="15" height="15" rx="2"/>
      <rect x="496" y="231" width="15" height="15" rx="2"/>
      <rect x="517" y="231" width="15" height="15" rx="2"/>
      <rect x="538" y="231" width="15" height="15" rx="2"/>
      <rect x="559" y="231" width="15" height="15" rx="2"/>
      <rect x="580" y="231" width="15" height="15" rx="2"/>
      <rect x="601" y="231" width="15" height="15" rx="2"/>
      <rect x="622" y="231" width="15" height="15" rx="2"/>
      <rect x="643" y="231" width="15" height="15" rx="2"/>
      <rect x="664" y="231" width="15" height="15" rx="2"/>
      <rect x="685" y="231" width="15" height="15" rx="2"/>
      <rect x="496" y="256" width="15" height="15" rx="2"/>
      <rect x="517" y="256" width="15" height="15" rx="2"/>
      <rect x="538" y="256" width="15" height="15" rx="2"/>
      <rect x="559" y="256" width="15" height="15" rx="2"/>
      <rect x="580" y="256" width="15" height="15" rx="2"/>
      <rect x="601" y="256" width="15" height="15" rx="2"/>
      <rect x="622" y="256" width="15" height="15" rx="2"/>
      <rect x="643" y="256" width="15" height="15" rx="2"/>
      <rect x="664" y="256" width="15" height="15" rx="2"/>
      <rect x="685" y="256" width="15" height="15" rx="2"/>
      <rect x="496" y="281" width="15" height="15" rx="2"/>
      <rect x="517" y="281" width="15" height="15" rx="2"/>
      <rect x="538" y="281" width="15" height="15" rx="2"/>
      <rect x="559" y="281" width="15" height="15" rx="2"/>
      <rect x="580" y="281" width="15" height="15" rx="2"/>
      <rect x="601" y="281" width="15" height="15" rx="2"/>
      <rect x="622" y="281" width="15" height="15" rx="2"/>
      <rect x="643" y="281" width="15" height="15" rx="2"/>
      <rect x="664" y="281" width="15" height="15" rx="2"/>
      <rect x="685" y="281" width="15" height="15" rx="2"/>
      <rect x="496" y="306" width="15" height="15" rx="2"/>
      <rect x="517" y="306" width="15" height="15" rx="2"/>
      <rect x="538" y="306" width="15" height="15" rx="2"/>
      <rect x="559" y="306" width="15" height="15" rx="2"/>
      <rect x="580" y="306" width="15" height="15" rx="2"/>
      <rect x="601" y="306" width="15" height="15" rx="2"/>
      <rect x="622" y="306" width="15" height="15" rx="2"/>
      <rect x="643" y="306" width="15" height="15" rx="2"/>
      <rect x="664" y="306" width="15" height="15" rx="2"/>
      <rect x="685" y="306" width="15" height="15" rx="2"/>
    </g>
    <text x="600" y="365" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.6">Many samples in parallel</text>
  </g>

  <!-- ============ Render-time comparison ============ -->
  <text x="40" y="416" font-size="18" font-weight="600" fill="currentColor">Render time on the same path-traced scene</text>

  <!-- CPU bar (long) -->
  <text x="40" y="446" font-size="14" fill="currentColor">CPU</text>
  <rect x="90" y="434" width="600" height="20" rx="4" fill="#4A9EFF" opacity="0.85"/>
  <text x="700" y="449" font-size="13" fill="currentColor" opacity="0.75">10 min</text>

  <!-- GPU bar (short) -->
  <text x="40" y="480" font-size="14" fill="currentColor">GPU</text>
  <rect x="90" y="468" width="120" height="20" rx="4" fill="#B47EE8" opacity="0.85"/>
  <text x="220" y="483" font-size="13" fill="currentColor" opacity="0.75">2 min · about 3 to 10x faster</text>

  <!-- Footer tip (Variant B) -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> The GPU is limited by its VRAM. If a scene does not fit, Cycles can fall back to the CPU and system RAM.</text>
</svg>
