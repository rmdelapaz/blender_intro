<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="scr-title scr-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="scr-title">Socket colour reference</title>
  <desc id="scr-desc">A reference chart pairing each socket colour with its data type, an example value, and a common use. Geometry is green, Float is grey, Vector is purple, Integer is blue, Color is yellow, Boolean is white, and String is pink. Only sockets of matching type connect.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Socket colour reference</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Each data type has its own socket colour. Only matching types connect.</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- column heads -->
  <text x="106" y="134" font-size="12" font-weight="700" fill="currentColor" opacity="0.5">TYPE</text>
  <text x="300" y="134" font-size="12" font-weight="700" fill="currentColor" opacity="0.5">EXAMPLE</text>
  <text x="520" y="134" font-size="12" font-weight="700" fill="currentColor" opacity="0.5">COMMON USE</text>

  <g>
    <circle cx="70" cy="168" r="16" fill="#4ADE80"/>
    <text x="106" y="164" font-size="15" font-weight="600" fill="currentColor">Geometry</text>
    <text x="300" y="164" font-size="13" fill="currentColor" opacity="0.7" font-family="ui-monospace, monospace">Meshes, curves</text>
    <text x="520" y="164" font-size="13" fill="currentColor" opacity="0.6">Main data flow</text>
    <line x1="40" y1="190" x2="760" y2="190" stroke="currentColor" stroke-width="1" opacity="0.12"/>
  </g>
  <g>
    <circle cx="70" cy="234" r="16" fill="currentColor" fill-opacity="0.45"/>
    <text x="106" y="230" font-size="15" font-weight="600" fill="currentColor">Float</text>
    <text x="300" y="230" font-size="13" fill="currentColor" opacity="0.7" font-family="ui-monospace, monospace">3.14, 100.0</text>
    <text x="520" y="230" font-size="13" fill="currentColor" opacity="0.6">Numbers, scales</text>
    <line x1="40" y1="256" x2="760" y2="256" stroke="currentColor" stroke-width="1" opacity="0.12"/>
  </g>
  <g>
    <circle cx="70" cy="300" r="16" fill="#B47EE8"/>
    <text x="106" y="296" font-size="15" font-weight="600" fill="currentColor">Vector</text>
    <text x="300" y="296" font-size="13" fill="currentColor" opacity="0.7" font-family="ui-monospace, monospace">(1.0, 2.5, -3.0)</text>
    <text x="520" y="296" font-size="13" fill="currentColor" opacity="0.6">Positions, directions</text>
    <line x1="40" y1="322" x2="760" y2="322" stroke="currentColor" stroke-width="1" opacity="0.12"/>
  </g>
  <g>
    <circle cx="70" cy="366" r="16" fill="#4A9EFF"/>
    <text x="106" y="362" font-size="15" font-weight="600" fill="currentColor">Integer</text>
    <text x="300" y="362" font-size="13" fill="currentColor" opacity="0.7" font-family="ui-monospace, monospace">5, 42, -3</text>
    <text x="520" y="362" font-size="13" fill="currentColor" opacity="0.6">Counts, indices</text>
    <line x1="40" y1="388" x2="760" y2="388" stroke="currentColor" stroke-width="1" opacity="0.12"/>
  </g>
  <g>
    <circle cx="70" cy="432" r="16" fill="#F5C242"/>
    <text x="106" y="428" font-size="15" font-weight="600" fill="currentColor">Color</text>
    <text x="300" y="428" font-size="13" fill="currentColor" opacity="0.7" font-family="ui-monospace, monospace">RGBA 0-1</text>
    <text x="520" y="428" font-size="13" fill="currentColor" opacity="0.6">Vertex colors</text>
    <line x1="40" y1="454" x2="760" y2="454" stroke="currentColor" stroke-width="1" opacity="0.12"/>
  </g>
  <g>
    <circle cx="70" cy="498" r="16" fill="#ffffff" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="106" y="494" font-size="15" font-weight="600" fill="currentColor">Boolean</text>
    <text x="300" y="494" font-size="13" fill="currentColor" opacity="0.7" font-family="ui-monospace, monospace">True / False</text>
    <text x="520" y="494" font-size="13" fill="currentColor" opacity="0.6">Selections, masks</text>
    <line x1="40" y1="520" x2="760" y2="520" stroke="currentColor" stroke-width="1" opacity="0.12"/>
  </g>
  <g>
    <circle cx="70" cy="564" r="16" fill="#FF7EA8"/>
    <text x="106" y="560" font-size="15" font-weight="600" fill="currentColor">String</text>
    <text x="300" y="560" font-size="13" fill="currentColor" opacity="0.7" font-family="ui-monospace, monospace">"position"</text>
    <text x="520" y="560" font-size="13" fill="currentColor" opacity="0.6">Attribute names</text>
    <line x1="40" y1="586" x2="760" y2="586" stroke="currentColor" stroke-width="1" opacity="0.12"/>
  </g>

  <rect x="40" y="641" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> If a link refuses to connect, check that both sockets are the same colour.</text>
</svg>
