<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="sy-title sy-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="sy-title">Types of symmetry</title>
  <desc id="sy-desc">Three panels showing symmetry types. Bilateral symmetry mirrors left and right across a vertical axis. Vertical symmetry mirrors top and bottom across a horizontal axis. Radial symmetry repeats elements rotating around a center point. Each axis is drawn in cyan.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">SYMMETRY TYPES</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Mirror across an axis, or rotate around a center</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ============ 3 panels ============ -->
  <!-- panel w 230, gap 15 ; xs 40, 285, 530 ; y 138 ; h 330 -->

  <!-- BILATERAL (left-right) -->
  <g>
    <rect x="40" y="138" width="230" height="330" rx="8" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.12"/>
    <!-- vertical axis -->
    <line x1="155" y1="160" x2="155" y2="400" stroke="#00BCD4" stroke-width="2" stroke-dasharray="6 5"/>
    <!-- mirrored shapes: left + right identical -->
    <g fill="#B47EE8">
      <polygon points="155,210 110,300 155,300"/>
      <polygon points="155,210 200,300 155,300"/>
    </g>
    <g fill="#FF6B00">
      <circle cx="120" cy="345" r="16"/>
      <circle cx="190" cy="345" r="16"/>
    </g>
    <text x="155" y="430" font-size="15" font-weight="600" fill="currentColor" text-anchor="middle">Bilateral</text>
    <text x="155" y="452" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">Left-right mirror</text>
  </g>

  <!-- VERTICAL (top-bottom) -->
  <g>
    <rect x="285" y="138" width="230" height="330" rx="8" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.12"/>
    <!-- horizontal axis -->
    <line x1="305" y1="285" x2="495" y2="285" stroke="#00BCD4" stroke-width="2" stroke-dasharray="6 5"/>
    <!-- mirrored shapes: top + bottom identical -->
    <g fill="#B47EE8">
      <polygon points="400,200 355,265 445,265"/>
      <polygon points="400,370 355,305 445,305"/>
    </g>
    <g fill="#FF6B00">
      <circle cx="345" cy="230" r="13"/>
      <circle cx="345" cy="340" r="13"/>
      <circle cx="455" cy="230" r="13"/>
      <circle cx="455" cy="340" r="13"/>
    </g>
    <text x="400" y="430" font-size="15" font-weight="600" fill="currentColor" text-anchor="middle">Vertical</text>
    <text x="400" y="452" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">Top-bottom mirror</text>
  </g>

  <!-- RADIAL (around center) -->
  <g>
    <rect x="530" y="138" width="230" height="330" rx="8" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.12"/>
    <!-- center + radiating axes -->
    <g stroke="#00BCD4" stroke-width="2" stroke-dasharray="6 5" opacity="0.85">
      <line x1="645" y1="285" x2="645" y2="180"/>
      <line x1="645" y1="285" x2="736" y2="338"/>
      <line x1="645" y1="285" x2="554" y2="338"/>
    </g>
    <!-- petals rotating around center (6 around) -->
    <g fill="#B47EE8">
      <ellipse cx="645" cy="225" rx="14" ry="30"/>
      <ellipse cx="645" cy="225" rx="14" ry="30" transform="rotate(60 645 285)"/>
      <ellipse cx="645" cy="225" rx="14" ry="30" transform="rotate(120 645 285)"/>
      <ellipse cx="645" cy="225" rx="14" ry="30" transform="rotate(180 645 285)"/>
      <ellipse cx="645" cy="225" rx="14" ry="30" transform="rotate(240 645 285)"/>
      <ellipse cx="645" cy="225" rx="14" ry="30" transform="rotate(300 645 285)"/>
    </g>
    <circle cx="645" cy="285" r="12" fill="#FF6B00"/>
    <text x="645" y="430" font-size="15" font-weight="600" fill="currentColor" text-anchor="middle">Radial</text>
    <text x="645" y="452" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">Rotating around center</text>
  </g>

  <!-- Footer tip callout (Variant B, left rail) -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Perfect symmetry feels formal and calm. Break it slightly to add life without losing the balance.
  </text>
</svg>
