<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" color="#222" role="img" aria-labelledby="foq-title foq-desc" font-family="'Segoe UI',system-ui,sans-serif">
<title id="foq-title">Field operations quick reference</title>
<desc id="foq-desc">A reference card of six common field patterns, each shown as a mini node-chain glyph with a one-line purpose.</desc>
<rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
<text x="400" y="56" text-anchor="middle" font-size="26" font-weight="700" fill="currentColor">Field Operations Quick Reference</text>
<text x="400" y="84" text-anchor="middle" font-size="15" fill="currentColor" opacity="0.75">Common field node-chains and what each is for</text>
<line x1="60" y1="108" x2="740" y2="108" stroke="currentColor" stroke-width="1" opacity="0.3"/>

<!-- row template: y bands at 138,222,306,390,474; each 74 tall -->
<!-- ROW 1 -->
<g>
<rect x="60" y="130" width="680" height="72" rx="8" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.15"/>
<text x="80" y="158" font-size="15" font-weight="700" fill="#4A9EFF">Position &#8594; height mask</text>
<text x="80" y="180" font-size="12.5" fill="currentColor" opacity="0.8">Separate XYZ, take Z, compare with a threshold to select high geometry.</text>
<g transform="translate(500,148)">
<rect x="0" y="0" width="78" height="26" rx="4" fill="#4A9EFF" fill-opacity="0.18" stroke="#4A9EFF" stroke-width="1.5"/><text x="39" y="17" text-anchor="middle" font-size="10.5" fill="currentColor">Position</text>
<line x1="78" y1="13" x2="98" y2="13" stroke="currentColor" stroke-width="1.5"/>
<rect x="98" y="0" width="60" height="26" rx="4" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.4"/><text x="128" y="17" text-anchor="middle" font-size="10.5" fill="currentColor">Sep XYZ</text>
<line x1="158" y1="13" x2="178" y2="13" stroke="currentColor" stroke-width="1.5"/>
<rect x="178" y="0" width="44" height="26" rx="4" fill="#4ADE80" fill-opacity="0.18" stroke="#4ADE80" stroke-width="1.5"/><text x="200" y="17" text-anchor="middle" font-size="10.5" fill="currentColor">&gt; h</text>
</g>
</g>
<!-- ROW 2 -->
<g>
<rect x="60" y="214" width="680" height="72" rx="8" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.15"/>
<text x="80" y="242" font-size="15" font-weight="700" fill="#4A9EFF">Normal &#8594; slope mask</text>
<text x="80" y="264" font-size="12.5" fill="currentColor" opacity="0.8">Dot Normal with up vector; low result = steep faces (cliffs, walls).</text>
<g transform="translate(500,232)">
<rect x="0" y="0" width="70" height="26" rx="4" fill="#4A9EFF" fill-opacity="0.18" stroke="#4A9EFF" stroke-width="1.5"/><text x="35" y="17" text-anchor="middle" font-size="10.5" fill="currentColor">Normal</text>
<line x1="70" y1="13" x2="90" y2="13" stroke="currentColor" stroke-width="1.5"/>
<rect x="90" y="0" width="60" height="26" rx="4" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.4"/><text x="120" y="17" text-anchor="middle" font-size="10.5" fill="currentColor">Dot Up</text>
<line x1="150" y1="13" x2="170" y2="13" stroke="currentColor" stroke-width="1.5"/>
<rect x="170" y="0" width="52" height="26" rx="4" fill="#F5C242" fill-opacity="0.2" stroke="#F5C242" stroke-width="1.5"/><text x="196" y="17" text-anchor="middle" font-size="10.5" fill="currentColor">Range</text>
</g>
</g>
<!-- ROW 3 -->
<g>
<rect x="60" y="298" width="680" height="72" rx="8" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.15"/>
<text x="80" y="326" font-size="15" font-weight="700" fill="#B47EE8">Noise &#8594; density</text>
<text x="80" y="348" font-size="12.5" fill="currentColor" opacity="0.8">Feed a Noise Texture into a distribution Density input for organic scatter.</text>
<g transform="translate(500,316)">
<rect x="0" y="0" width="64" height="26" rx="4" fill="#B47EE8" fill-opacity="0.2" stroke="#B47EE8" stroke-width="1.5"/><text x="32" y="17" text-anchor="middle" font-size="10.5" fill="currentColor">Noise</text>
<line x1="64" y1="13" x2="84" y2="13" stroke="currentColor" stroke-width="1.5"/>
<rect x="84" y="0" width="60" height="26" rx="4" fill="#F5C242" fill-opacity="0.2" stroke="#F5C242" stroke-width="1.5"/><text x="114" y="17" text-anchor="middle" font-size="10.5" fill="currentColor">Range</text>
<line x1="144" y1="13" x2="164" y2="13" stroke="currentColor" stroke-width="1.5"/>
<rect x="164" y="0" width="58" height="26" rx="4" fill="#4ADE80" fill-opacity="0.18" stroke="#4ADE80" stroke-width="1.5"/><text x="193" y="17" text-anchor="middle" font-size="10.5" fill="currentColor">Density</text>
</g>
</g>
<!-- ROW 4 -->
<g>
<rect x="60" y="382" width="680" height="72" rx="8" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.15"/>
<text x="80" y="410" font-size="15" font-weight="700" fill="#FF6B00">Proximity &#8594; falloff</text>
<text x="80" y="432" font-size="12.5" fill="currentColor" opacity="0.8">Geometry Proximity distance into Map Range for a smooth edge blend.</text>
<g transform="translate(500,400)">
<rect x="0" y="0" width="76" height="26" rx="4" fill="#FF6B00" fill-opacity="0.16" stroke="#FF6B00" stroke-width="1.5"/><text x="38" y="17" text-anchor="middle" font-size="10.5" fill="currentColor">Proximity</text>
<line x1="76" y1="13" x2="96" y2="13" stroke="currentColor" stroke-width="1.5"/>
<rect x="96" y="0" width="64" height="26" rx="4" fill="#F5C242" fill-opacity="0.2" stroke="#F5C242" stroke-width="1.5"/><text x="128" y="17" text-anchor="middle" font-size="10.5" fill="currentColor">Map Rng</text>
<line x1="160" y1="13" x2="180" y2="13" stroke="currentColor" stroke-width="1.5"/>
<rect x="180" y="0" width="42" height="26" rx="4" fill="#4ADE80" fill-opacity="0.18" stroke="#4ADE80" stroke-width="1.5"/><text x="201" y="17" text-anchor="middle" font-size="10.5" fill="currentColor">Fac</text>
</g>
</g>
<!-- ROW 5 -->
<g>
<rect x="60" y="466" width="680" height="72" rx="8" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.15"/>
<text x="80" y="494" font-size="15" font-weight="700" fill="#4ADE80">Boolean &#8594; combine</text>
<text x="80" y="516" font-size="12.5" fill="currentColor" opacity="0.8">Join two masks with AND/OR/NOT Boolean Math to refine a selection.</text>
<g transform="translate(500,484)">
<rect x="0" y="0" width="52" height="26" rx="4" fill="#4ADE80" fill-opacity="0.18" stroke="#4ADE80" stroke-width="1.5"/><text x="26" y="17" text-anchor="middle" font-size="10.5" fill="currentColor">Mask A</text>
<rect x="0" y="0" width="52" height="26" rx="4" fill="none"/>
<rect x="0" y="0" width="52" height="26" rx="4" fill="none"/>
<rect x="0" y="0" width="52" height="26" rx="4" fill="none"/>
<line x1="52" y1="13" x2="78" y2="13" stroke="currentColor" stroke-width="1.5"/>
<rect x="78" y="-6" width="66" height="38" rx="4" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.4"/><text x="111" y="17" text-anchor="middle" font-size="10.5" fill="currentColor">AND/OR</text>
<line x1="52" y1="13" x2="60" y2="13" stroke="none"/>
<rect x="0" y="34" width="52" height="26" rx="4" fill="#4ADE80" fill-opacity="0.18" stroke="#4ADE80" stroke-width="1.5"/><text x="26" y="51" text-anchor="middle" font-size="10.5" fill="currentColor">Mask B</text>
<line x1="52" y1="47" x2="78" y2="27" stroke="currentColor" stroke-width="1.5"/>
<line x1="144" y1="13" x2="164" y2="13" stroke="currentColor" stroke-width="1.5"/>
<rect x="164" y="0" width="58" height="26" rx="4" fill="#FF6B00" fill-opacity="0.16" stroke="#FF6B00" stroke-width="1.5"/><text x="193" y="17" text-anchor="middle" font-size="10.5" fill="currentColor">Select</text>
</g>
</g>

<!-- footer tip Variant B (dense y positions) -->
<rect x="60" y="641" width="4" height="34" rx="2" fill="#FF6B00"/>
<text x="76" y="654" font-size="12.5" font-weight="600" fill="currentColor">Tip</text>
<text x="76" y="672" font-size="12.5" fill="currentColor" opacity="0.8">Every field is just a value per element &#183; chain small math nodes to shape it into a selection or a factor.</text>
</svg>
