<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="car11-title car11-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="car11-title">Framing for Clarity</title>
  <desc id="car11-desc">A framing guide showing a rule-of-thirds grid with the subject placed on an intersection, plus the headroom above the head and the lead-room in the direction the subject faces. Placing the subject on a third line and leaving space where it looks reads as balanced and intentional.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Framing for Clarity</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Place the subject on a third, leave room to breathe and room to look.</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Frame -->
  <g>
    <rect x="60" y="150" width="480" height="300" rx="6" fill="currentColor" opacity="0.04" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.5"/>
    <!-- thirds grid -->
    <g stroke="#4A9EFF" stroke-width="1.5" opacity="0.55" stroke-dasharray="6 5">
      <line x1="220" y1="150" x2="220" y2="450"/>
      <line x1="380" y1="150" x2="380" y2="450"/>
      <line x1="60" y1="250" x2="540" y2="250"/>
      <line x1="60" y1="350" x2="540" y2="350"/>
    </g>
    <!-- intersection markers -->
    <circle cx="220" cy="250" r="4" fill="#4A9EFF"/>
    <circle cx="380" cy="250" r="4" fill="#4A9EFF"/>
    <circle cx="220" cy="350" r="4" fill="#4A9EFF"/>
    <circle cx="380" cy="350" r="4" fill="#4A9EFF"/>

    <!-- subject on left third, facing right -->
    <g fill="#FF6B00">
      <circle cx="220" cy="278" r="26"/>
      <path d="M 194 320 Q 220 300 246 320 L 250 400 L 190 400 Z"/>
    </g>
    <!-- nose direction cue -->
    <polygon points="246,278 262,272 262,284" fill="#FF6B00"/>
    <!-- highlight the used intersection -->
    <circle cx="220" cy="250" r="9" fill="none" stroke="#FF6B00" stroke-width="2.5"/>

    <!-- headroom bracket -->
    <line x1="300" y1="152" x2="300" y2="252" stroke="#4ADE80" stroke-width="2"/>
    <line x1="295" y1="152" x2="305" y2="152" stroke="#4ADE80" stroke-width="2"/>
    <line x1="295" y1="252" x2="305" y2="252" stroke="#4ADE80" stroke-width="2"/>
    <text x="312" y="205" font-size="13" font-weight="600" fill="#4ADE80">headroom</text>

    <!-- lead-room bracket -->
    <line x1="262" y1="430" x2="538" y2="430" stroke="#B47EE8" stroke-width="2"/>
    <line x1="262" y1="425" x2="262" y2="435" stroke="#B47EE8" stroke-width="2"/>
    <line x1="538" y1="425" x2="538" y2="435" stroke="#B47EE8" stroke-width="2"/>
    <text x="400" y="423" font-size="13" text-anchor="middle" font-weight="600" fill="#B47EE8">lead-room</text>
  </g>

  <!-- Legend -->
  <g>
    <rect x="576" y="150" width="184" height="300" rx="8" fill="currentColor" opacity="0.04"/>
    <text x="596" y="180" font-size="15" font-weight="600" fill="currentColor">The rules</text>

    <circle cx="602" cy="212" r="5" fill="#4A9EFF"/>
    <text x="616" y="209" font-size="13" font-weight="600" fill="#4A9EFF">Thirds</text>
    <text x="596" y="230" font-size="12" fill="currentColor" opacity="0.6">Subject on a line</text>
    <text x="596" y="246" font-size="12" fill="currentColor" opacity="0.6">or intersection</text>

    <circle cx="602" cy="286" r="5" fill="#4ADE80"/>
    <text x="616" y="283" font-size="13" font-weight="600" fill="#4ADE80">Headroom</text>
    <text x="596" y="304" font-size="12" fill="currentColor" opacity="0.6">A little gap above</text>
    <text x="596" y="320" font-size="12" fill="currentColor" opacity="0.6">the head, not too much</text>

    <circle cx="602" cy="360" r="5" fill="#B47EE8"/>
    <text x="616" y="357" font-size="13" font-weight="600" fill="#B47EE8">Lead-room</text>
    <text x="596" y="378" font-size="12" fill="currentColor" opacity="0.6">Space ahead of the</text>
    <text x="596" y="394" font-size="12" fill="currentColor" opacity="0.6">gaze or movement</text>
  </g>

  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Turn on the thirds overlay in Blender's camera view. Compose to the grid, then hide it before you render.</text>
</svg>
