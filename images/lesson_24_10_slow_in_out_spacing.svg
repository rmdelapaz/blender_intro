<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="si-title si-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="si-title">Slow in, slow out spacing</title>
  <desc id="si-desc">A single horizontal track of twenty-four position dots for a moving object. The dots are bunched close together at the start, spread far apart through the middle, and bunch close again at the end, showing acceleration and deceleration.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Slow in, slow out</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">One dot per frame : tight spacing is slow, wide spacing is fast</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <text x="40" y="150" font-size="18" font-weight="600" fill="currentColor">Frame positions across one move</text>

  <!-- baseline -->
  <line x1="60" y1="300" x2="740" y2="300" stroke="currentColor" stroke-width="1" opacity="0.12"/>
  <path d="M70.0 300 Q400 250 730.0 300" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
  <!-- position dots -->
    <circle cx="70.0" cy="300" r="6" fill="#FF6B00"/>
    <circle cx="73.1" cy="300" r="6" fill="#FF6B00"/>
    <circle cx="82.2" cy="300" r="6" fill="#FF6B00"/>
    <circle cx="97.3" cy="300" r="6" fill="#FF6B00"/>
    <circle cx="118.0" cy="300" r="6" fill="#FF6B00"/>
    <circle cx="144.0" cy="300" r="6" fill="#FF6B00"/>
    <circle cx="174.8" cy="300" r="6" fill="#FF6B00"/>
    <circle cx="209.7" cy="300" r="6" fill="#FF6B00"/>
    <circle cx="248.2" cy="300" r="6" fill="#FF6B00"/>
    <circle cx="289.5" cy="300" r="6" fill="#FF6B00"/>
    <circle cx="332.9" cy="300" r="6" fill="#FF6B00"/>
    <circle cx="377.5" cy="300" r="6" fill="#FF6B00"/>
    <circle cx="422.5" cy="300" r="6" fill="#FF6B00"/>
    <circle cx="467.1" cy="300" r="6" fill="#FF6B00"/>
    <circle cx="510.5" cy="300" r="6" fill="#FF6B00"/>
    <circle cx="551.8" cy="300" r="6" fill="#FF6B00"/>
    <circle cx="590.3" cy="300" r="6" fill="#FF6B00"/>
    <circle cx="625.2" cy="300" r="6" fill="#FF6B00"/>
    <circle cx="656.0" cy="300" r="6" fill="#FF6B00"/>
    <circle cx="682.0" cy="300" r="6" fill="#FF6B00"/>
    <circle cx="702.7" cy="300" r="6" fill="#FF6B00"/>
    <circle cx="717.8" cy="300" r="6" fill="#FF6B00"/>
    <circle cx="726.9" cy="300" r="6" fill="#FF6B00"/>
    <circle cx="730.0" cy="300" r="6" fill="#FF6B00"/>

  <!-- zone labels with brackets under the track -->
  <line x1="70" y1="350" x2="209.7" y2="350" stroke="#FF6B00" stroke-width="2" opacity="0.5"/>
  <text x="139.8" y="378" font-size="14" fill="currentColor" text-anchor="middle" font-weight="600">Ease in</text>
  <text x="139.8" y="398" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">accelerating</text>

  <line x1="248.2" y1="350" x2="551.8" y2="350" stroke="#FF6B00" stroke-width="2" opacity="0.5"/>
  <text x="400.0" y="378" font-size="14" fill="currentColor" text-anchor="middle" font-weight="600">Full speed</text>
  <text x="400.0" y="398" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">widest spacing</text>

  <line x1="590.3" y1="350" x2="730" y2="350" stroke="#FF6B00" stroke-width="2" opacity="0.5"/>
  <text x="660.2" y="378" font-size="14" fill="currentColor" text-anchor="middle" font-weight="600">Ease out</text>
  <text x="660.2" y="398" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">decelerating</text>

  <text x="60" y="450" font-size="14" fill="currentColor" opacity="0.65">Start</text>
  <text x="740" y="450" font-size="14" fill="currentColor" opacity="0.65" text-anchor="end">End</text>

  <rect x="40" y="506" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Almost every natural move eases in and out. Constant spacing reads as robotic.</text>
</svg>
