<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="wf-title wf-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="wf-title">Workflow Flowchart - Complete Rig Build</title>
  <desc id="wf-desc">A top-to-bottom flowchart of the full biped rig build: Preparation, then Spine, Arms, and Legs in sequence, then Polish. Decision diamonds at each limb check whether the result is correct and loop back to fix before moving on.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">RIG BUILD WORKFLOW</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Preparation · Spine · Arms · Legs · Polish</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <text x="40" y="138" font-size="18" font-weight="600" fill="currentColor">Complete biped rig · build order</text>

  <defs>
    <marker id="wf-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- Stage boxes + decision diamonds, top to bottom -->
  <rect x="160" y="160" width="180" height="44" rx="8" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.55"/>
  <rect x="160" y="160" width="4" height="44" fill="#FF6B00"/>
  <text x="250" y="180" font-size="14" font-weight="600" fill="currentColor" text-anchor="middle">Preparation</text>
  <text x="250" y="196" font-size="11" fill="currentColor" opacity="0.6" text-anchor="middle">reference · layers · DEF bones</text>
  <line x1="250" y1="204" x2="250" y2="224" stroke="currentColor" stroke-width="1.5" opacity="0.45" marker-end="url(#wf-ah)"/>
  <rect x="160" y="224" width="180" height="44" rx="8" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.55"/>
  <rect x="160" y="224" width="4" height="44" fill="#4ADE80"/>
  <text x="250" y="244" font-size="14" font-weight="600" fill="currentColor" text-anchor="middle">Spine</text>
  <text x="250" y="260" font-size="11" fill="currentColor" opacity="0.6" text-anchor="middle">Root · COG · Chest · blend</text>
  <line x1="250" y1="268" x2="250" y2="288" stroke="currentColor" stroke-width="1.5" opacity="0.45" marker-end="url(#wf-ah)"/>
  <rect x="160" y="288" width="180" height="44" rx="8" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.55"/>
  <rect x="160" y="288" width="4" height="44" fill="#ff8c00"/>
  <text x="250" y="308" font-size="14" font-weight="600" fill="currentColor" text-anchor="middle">Arms</text>
  <text x="250" y="324" font-size="11" fill="currentColor" opacity="0.6" text-anchor="middle">DEF · FK · IK · IK/FK switch</text>
  <line x1="250" y1="332" x2="250" y2="350" stroke="currentColor" stroke-width="1.5" opacity="0.45" marker-end="url(#wf-ah)"/>
  <polygon points="250,350 320,376 250,402 180,376" fill="none" stroke="#F5C242" stroke-width="1.5"/>
  <text x="250" y="380" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Elbow OK?</text>
  <line x1="250" y1="402" x2="250" y2="422" stroke="currentColor" stroke-width="1.5" opacity="0.45" marker-end="url(#wf-ah)"/>
  <rect x="160" y="422" width="180" height="44" rx="8" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.55"/>
  <rect x="160" y="422" width="4" height="44" fill="#00bcd4"/>
  <text x="250" y="442" font-size="14" font-weight="600" fill="currentColor" text-anchor="middle">Legs</text>
  <text x="250" y="458" font-size="11" fill="currentColor" opacity="0.6" text-anchor="middle">foot hierarchy · IK · pivots</text>
  <line x1="250" y1="466" x2="250" y2="484" stroke="currentColor" stroke-width="1.5" opacity="0.45" marker-end="url(#wf-ah)"/>
  <polygon points="250,484 320,510 250,536 180,510" fill="none" stroke="#F5C242" stroke-width="1.5"/>
  <text x="250" y="514" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Foot rolls?</text>
  <line x1="250" y1="536" x2="250" y2="556" stroke="currentColor" stroke-width="1.5" opacity="0.45" marker-end="url(#wf-ah)"/>
  <rect x="160" y="556" width="180" height="44" rx="8" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.55"/>
  <rect x="160" y="556" width="4" height="44" fill="#B47EE8"/>
  <text x="250" y="576" font-size="14" font-weight="600" fill="currentColor" text-anchor="middle">Polish</text>
  <text x="250" y="592" font-size="11" fill="currentColor" opacity="0.6" text-anchor="middle">constraints · symmetry · test</text>

  <!-- No-branch feedback loops (adjust pole / pivots, retry) -->
  <g stroke="#E63946" stroke-width="1.5" opacity="0.7" fill="none" stroke-linecap="round" marker-end="url(#wf-ah)">
    <path d="M 320 376 L 470 376 L 470 246 L 342 246"/>
    <path d="M 320 510 L 470 510 L 470 444 L 342 444"/>
  </g>

  <text x="262" y="416" font-size="11" fill="#4ADE80" opacity="0.9">Yes</text>
  <text x="262" y="550" font-size="11" fill="#4ADE80" opacity="0.9">Yes</text>
  <text x="392" y="370" font-size="11" fill="#E63946" opacity="0.9">No · fix pole angle</text>
  <text x="392" y="504" font-size="11" fill="#E63946" opacity="0.9">No · fix pivots</text>

  <text x="560" y="232" font-size="12" font-weight="600" fill="currentColor" opacity="0.8">Build in order</text>
  <text x="560" y="256" font-size="12" fill="currentColor" opacity="0.6">Each stage builds on the</text>
  <text x="560" y="275" font-size="12" fill="currentColor" opacity="0.6">last. Test each limb before</text>
  <text x="560" y="294" font-size="12" fill="currentColor" opacity="0.6">moving on, because a wrong</text>
  <text x="560" y="313" font-size="12" fill="currentColor" opacity="0.6">pole or pivot only gets</text>
  <text x="560" y="332" font-size="12" fill="currentColor" opacity="0.6">harder to fix later.</text>

  <!-- Footer tip Variant B -->
  <rect x="40" y="641" width="720" height="34" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Build the spine first, then arms and legs off it, and verify each limb's IK before you polish constraints and symmetry.</text>
</svg>
