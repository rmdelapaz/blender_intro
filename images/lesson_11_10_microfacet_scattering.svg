<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="ms-title ms-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="ms-title">Light scattering and multiple bounces across a rough surface</title>
  <desc id="ms-desc">A magnified cross-section of a rough surface built from peaks and valleys. Several incoming rays strike facets at different orientations and reflect in different directions on their first bounce. Where a reflected ray meets a neighbouring facet it bounces a second time before leaving the surface. This multiple scattering between facets is why rough surfaces lose energy and look dimmer than a simple blurred reflection.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">How Light Scatters on a Rough Surface</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Different facet angles send each ray a different way &#183; some bounce twice</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- magnification note -->
  <text x="40" y="138" font-size="12" font-style="italic" fill="currentColor" opacity="0.45">Microscopic view &#183; magnified many thousands of times</text>

  <!-- Rough surface profile: peaks and valleys. Baseline ~ y=430 -->
  <path d="M 60,300 L 130,420 L 200,300 L 270,420 L 340,300 L 410,420 L 480,300 L 550,420 L 620,300 L 690,420 L 740,330
           L 740,470 L 60,470 Z"
        fill="currentColor" opacity="0.10"/>
  <polyline points="60,300 130,420 200,300 270,420 340,300 410,420 480,300 550,420 620,300 690,420 740,330"
            fill="none" stroke="currentColor" stroke-width="2.6" opacity="0.65"/>
  <text x="724" y="462" font-size="13" text-anchor="end" fill="currentColor" opacity="0.55">Microfacet surface</text>

  <!-- Ray A: single clean bounce off a left peak-flank, exits up-left -->
  <line x1="95" y1="170" x2="165" y2="360" stroke="#F4C430" stroke-width="3" marker-end="url(#ms-in)"/>
  <line x1="165" y1="360" x2="110" y2="210" stroke="#FF6B00" stroke-width="2.4" marker-end="url(#ms-out)"/>

  <!-- Ray B: hits a valley flank, first bounce orange, second bounce red across to neighbour, then exits -->
  <line x1="250" y1="170" x2="305" y2="380" stroke="#F4C430" stroke-width="3" marker-end="url(#ms-in)"/>
  <line x1="305" y1="380" x2="372" y2="352" stroke="#FF6B00" stroke-width="2.4" marker-end="url(#ms-out2)"/>
  <line x1="372" y1="352" x2="338" y2="200" stroke="#E0506A" stroke-width="2" marker-end="url(#ms-out3)"/>

  <!-- Ray C: clean bounce off a middle peak, exits up-right -->
  <line x1="470" y1="170" x2="455" y2="350" stroke="#F4C430" stroke-width="3" marker-end="url(#ms-in)"/>
  <line x1="455" y1="350" x2="540" y2="215" stroke="#FF6B00" stroke-width="2.4" marker-end="url(#ms-out)"/>

  <!-- Ray D: double bounce on the right valley, trapped then exits steeply -->
  <line x1="650" y1="170" x2="605" y2="362" stroke="#F4C430" stroke-width="3" marker-end="url(#ms-in)"/>
  <line x1="605" y1="362" x2="660" y2="340" stroke="#FF6B00" stroke-width="2.4" marker-end="url(#ms-out2)"/>
  <line x1="660" y1="340" x2="690" y2="205" stroke="#E0506A" stroke-width="2" marker-end="url(#ms-out3)"/>

  <!-- callout: multiple scattering region -->
  <ellipse cx="335" cy="372" rx="58" ry="30" fill="none" stroke="#FF6B00" stroke-width="1.4" opacity="0.5" stroke-dasharray="4 5"/>
  <text x="335" y="446" font-size="11.5" text-anchor="middle" fill="#FF6B00">Multiple scattering</text>

  <!-- Legend -->
  <rect x="40" y="490" width="720" height="50" rx="6" fill="currentColor" opacity="0.04"/>
  <line x1="62" y1="510" x2="100" y2="510" stroke="#F4C430" stroke-width="3"/>
  <text x="108" y="514" font-size="13" fill="currentColor">Incoming</text>
  <line x1="220" y1="510" x2="258" y2="510" stroke="#FF6B00" stroke-width="3"/>
  <text x="266" y="514" font-size="13" fill="currentColor">First bounce</text>
  <line x1="400" y1="510" x2="438" y2="510" stroke="#E0506A" stroke-width="3"/>
  <text x="446" y="514" font-size="13" fill="currentColor">Second bounce</text>
  <text x="62" y="532" font-size="12" fill="currentColor" opacity="0.6">Light trapped between facets bounces again before escaping &#183; each bounce loses energy, so rough looks dimmer.</text>

  <defs>
    <marker id="ms-in" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#F4C430"/></marker>
    <marker id="ms-out" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#FF6B00"/></marker>
    <marker id="ms-out2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#FF6B00"/></marker>
    <marker id="ms-out3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#E0506A"/></marker>
  </defs>
</svg>
