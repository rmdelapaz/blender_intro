<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="bk-title bk-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="bk-title">Texture Baking Workflow</title>
  <desc id="bk-desc">A seven-step vertical flowchart for baking a procedural material to an image texture. The steps run top to bottom: UV unwrap the object, create the procedural material, add a blank image texture node, select that node so it is active, configure the bake settings, click bake, then save the baked texture. Arrows connect each step to the next.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">TEXTURE BAKING WORKFLOW</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Procedural material &#183; baked to a reusable image texture</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Flow steps: centered card column. card x=200 w=400 h=58, step gap 80 (card 58 + arrow 22). first card y=130 -->
  <!-- Step number chip on the left of each card at cx=178 -->

  <g>
    <!-- arrows: vertical connectors between cards, currentColor 0.3 -->
    <g stroke="currentColor" stroke-opacity="0.3" stroke-width="2" fill="none" stroke-linecap="round">
      <line x1="400" y1="188" x2="400" y2="208"/>
      <line x1="400" y1="266" x2="400" y2="286"/>
      <line x1="400" y1="344" x2="400" y2="364"/>
      <line x1="400" y1="422" x2="400" y2="442"/>
      <line x1="400" y1="500" x2="400" y2="520"/>
      <line x1="400" y1="578" x2="400" y2="598"/>
    </g>
    <!-- arrowheads -->
    <g fill="currentColor" fill-opacity="0.3">
      <polygon points="400,210 394,200 406,200"/>
      <polygon points="400,288 394,278 406,278"/>
      <polygon points="400,366 394,356 406,356"/>
      <polygon points="400,444 394,434 406,434"/>
      <polygon points="400,522 394,512 406,512"/>
      <polygon points="400,600 394,590 406,590"/>
    </g>
  </g>

  <!-- Step 1 -->
  <g>
    <rect x="200" y="130" width="400" height="58" rx="10" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-opacity="0.5" stroke-width="1.5"/>
    <circle cx="226" cy="159" r="15" fill="#FF6B00"/>
    <text x="226" y="164" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="256" y="155" font-size="15" font-weight="700" fill="currentColor">UV Unwrap the Object</text>
    <text x="256" y="174" font-size="12" fill="currentColor" opacity="0.6">Tab &#8594; U &#8594; Smart UV Project</text>
  </g>
  <!-- Step 2 -->
  <g>
    <rect x="200" y="208" width="400" height="58" rx="10" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-opacity="0.5" stroke-width="1.5"/>
    <circle cx="226" cy="237" r="15" fill="#FF6B00"/>
    <text x="226" y="242" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="256" y="233" font-size="15" font-weight="700" fill="currentColor">Build the Procedural Material</text>
    <text x="256" y="252" font-size="12" fill="currentColor" opacity="0.6">The shader you want to capture as an image</text>
  </g>
  <!-- Step 3 -->
  <g>
    <rect x="200" y="286" width="400" height="58" rx="10" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-opacity="0.5" stroke-width="1.5"/>
    <circle cx="226" cy="315" r="15" fill="#FF6B00"/>
    <text x="226" y="320" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="256" y="311" font-size="15" font-weight="700" fill="currentColor">Add an Image Texture Node</text>
    <text x="256" y="330" font-size="12" fill="currentColor" opacity="0.6">New, blank &#183; do not connect it yet</text>
  </g>
  <!-- Step 4 -->
  <g>
    <rect x="200" y="364" width="400" height="58" rx="10" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-opacity="0.5" stroke-width="1.5"/>
    <circle cx="226" cy="393" r="15" fill="#FF6B00"/>
    <text x="226" y="398" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="256" y="389" font-size="15" font-weight="700" fill="currentColor">Select the Image Node</text>
    <text x="256" y="408" font-size="12" fill="currentColor" opacity="0.6">It must be the active node to receive the bake</text>
  </g>
  <!-- Step 5 -->
  <g>
    <rect x="200" y="442" width="400" height="58" rx="10" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-opacity="0.5" stroke-width="1.5"/>
    <circle cx="226" cy="471" r="15" fill="#FF6B00"/>
    <text x="226" y="476" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
    <text x="256" y="467" font-size="15" font-weight="700" fill="currentColor">Configure Bake Settings</text>
    <text x="256" y="486" font-size="12" fill="currentColor" opacity="0.6">Render Properties &#8594; Bake &#8594; choose type</text>
  </g>
  <!-- Step 6 -->
  <g>
    <rect x="200" y="520" width="400" height="58" rx="10" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-opacity="0.5" stroke-width="1.5"/>
    <circle cx="226" cy="549" r="15" fill="#FF6B00"/>
    <text x="226" y="554" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
    <text x="256" y="545" font-size="15" font-weight="700" fill="currentColor">Click Bake</text>
    <text x="256" y="564" font-size="12" fill="currentColor" opacity="0.6">Wait for the progress bar to finish</text>
  </g>
  <!-- Step 7 (success) -->
  <g>
    <rect x="200" y="598" width="400" height="58" rx="10" fill="#4ADE80" fill-opacity="0.14" stroke="#4ADE80" stroke-opacity="0.6" stroke-width="1.5"/>
    <circle cx="226" cy="627" r="15" fill="#4ADE80"/>
    <text x="226" y="632" font-size="15" font-weight="700" fill="#0f1a14" text-anchor="middle">7</text>
    <text x="256" y="623" font-size="15" font-weight="700" fill="currentColor">Save the Baked Texture</text>
    <text x="256" y="642" font-size="12" fill="currentColor" opacity="0.6">Image &#8594; Save As &#8594; PNG or EXR</text>
  </g>
</svg>
