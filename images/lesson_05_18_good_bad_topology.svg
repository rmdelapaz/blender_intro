<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 800 560"
     color="#222"
     role="img"
     aria-labelledby="gb-title gb-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="gb-title">Good vs Bad Topology</title>
  <desc id="gb-desc">Paired comparison panels. Left panel shows uniform quad grid topology with all 4-valence vertices and one acceptable 5-pole transition. Right panel shows the same surface area filled with a chaotic mix of triangles, n-gons, and a problematic 6-pole vertex highlighted in red.</desc>

  <!-- Top accent rail -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Header band -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Good vs Bad Topology</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Same surface, different quality of geometry</text>
  <line x1="120" y1="108" x2="680" y2="108" stroke="currentColor" stroke-opacity="0.25"/>
  <text x="400" y="138" font-size="15" font-weight="700" fill="#FF6B00" text-anchor="middle" letter-spacing="2">QUAD GRIDS · IRREGULAR MIX</text>

  <!-- Left panel: GOOD (green header) -->
  <g>
    <!-- Header bar -->
    <rect x="40" y="160" width="340" height="26" fill="#4ADE80"/>
    <text x="210" y="180" font-size="14" font-weight="700" fill="#0f1a14" text-anchor="middle">GOOD: ALL QUADS</text>
    <!-- 6x6 quad grid: 7 horizontal lines -->
    <line x1="50" y1="200" x2="370" y2="200" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <line x1="50" y1="232" x2="370" y2="232" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <line x1="50" y1="264" x2="370" y2="264" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <line x1="50" y1="296" x2="370" y2="296" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <line x1="50" y1="328" x2="370" y2="328" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <line x1="50" y1="360" x2="370" y2="360" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <line x1="50" y1="392" x2="370" y2="392" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <!-- 7 vertical lines -->
    <line x1="50" y1="200" x2="50" y2="392" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <line x1="103.33" y1="200" x2="103.33" y2="392" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <line x1="156.67" y1="200" x2="156.67" y2="392" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <line x1="210" y1="200" x2="210" y2="392" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <line x1="263.33" y1="200" x2="263.33" y2="392" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <line x1="316.67" y1="200" x2="316.67" y2="392" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <line x1="370" y1="200" x2="370" y2="392" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <!-- 5-pole marker at off-center intersection (yellow) -->
    <circle cx="210" cy="264" r="6" fill="#F5C242" fill-opacity="0.20"/>
    <circle cx="210" cy="264" r="3" fill="#F5C242"/>
  </g>

  <!-- Right panel: BAD (red header) -->
  <g>
    <!-- Header bar -->
    <rect x="420" y="160" width="340" height="26" fill="#E63946"/>
    <text x="590" y="180" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">BAD: TRIS, N-GONS, POLES</text>
    <!-- Outer panel border rect (visible mesh boundary) -->
    <rect x="436" y="196" width="308" height="200" fill="none" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <!-- 6-pole spoke edges (red) -->
    <line x1="570" y1="270" x2="570" y2="225" stroke="#E63946" stroke-opacity="0.85" stroke-width="1.4"/>
    <line x1="570" y1="270" x2="609" y2="248" stroke="#E63946" stroke-opacity="0.85" stroke-width="1.4"/>
    <line x1="570" y1="270" x2="609" y2="293" stroke="#E63946" stroke-opacity="0.85" stroke-width="1.4"/>
    <line x1="570" y1="270" x2="570" y2="315" stroke="#E63946" stroke-opacity="0.85" stroke-width="1.4"/>
    <line x1="570" y1="270" x2="531" y2="293" stroke="#E63946" stroke-opacity="0.85" stroke-width="1.4"/>
    <line x1="570" y1="270" x2="531" y2="248" stroke="#E63946" stroke-opacity="0.85" stroke-width="1.4"/>
    <!-- Ring edges around pole (normal color, forming 6 pinched triangles) -->
    <line x1="570" y1="225" x2="609" y2="248" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <line x1="609" y1="248" x2="609" y2="293" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <line x1="609" y1="293" x2="570" y2="315" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <line x1="570" y1="315" x2="531" y2="293" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <line x1="531" y1="293" x2="531" y2="248" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <line x1="531" y1="248" x2="570" y2="225" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <!-- Extending edges from pole-ring outward to panel boundary -->
    <line x1="570" y1="225" x2="570" y2="196" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <line x1="609" y1="248" x2="700" y2="220" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <line x1="609" y1="248" x2="744" y2="245" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <line x1="609" y1="293" x2="744" y2="290" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <line x1="531" y1="248" x2="436" y2="240" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <line x1="531" y1="293" x2="436" y2="300" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <!-- Auxiliary mid-area edges -->
    <line x1="700" y1="196" x2="700" y2="220" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <line x1="700" y1="220" x2="744" y2="245" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <!-- Two triangles in lower-left (red outline) -->
    <polygon points="436,335 490,330 470,380" fill="none" stroke="#E63946" stroke-opacity="0.85" stroke-width="1.4"/>
    <polygon points="470,380 490,330 530,380" fill="none" stroke="#E63946" stroke-opacity="0.85" stroke-width="1.4"/>
    <line x1="436" y1="335" x2="436" y2="396" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <line x1="530" y1="380" x2="530" y2="396" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <line x1="436" y1="396" x2="530" y2="396" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <line x1="490" y1="330" x2="570" y2="315" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <!-- Hexagonal n-gon in lower-right (red outline) -->
    <polygon points="702,335 691,355 669,355 658,335 669,315 691,315" fill="none" stroke="#E63946" stroke-opacity="0.85" stroke-width="1.4"/>
    <line x1="691" y1="315" x2="744" y2="290" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <line x1="702" y1="335" x2="744" y2="345" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <line x1="691" y1="355" x2="744" y2="396" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <line x1="669" y1="355" x2="640" y2="396" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <line x1="658" y1="335" x2="609" y2="293" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <!-- 6-pole vertex glyph (red, 3-layer) -->
    <circle cx="570" cy="270" r="12" fill="#E63946" fill-opacity="0.20"/>
    <circle cx="570" cy="270" r="6" fill="#E63946"/>
    <circle cx="570" cy="270" r="2" fill="white"/>
  </g>

  <!-- Italic takeaway -->
  <text x="400" y="425" font-size="13" fill="currentColor" opacity="0.75" font-style="italic" text-anchor="middle">The same physical area can be tessellated cleanly with quads (left) or chaotically with mixed polygons (right). Clean topology subdivides smoothly, deforms predictably, and stays readable in Edit Mode.</text>

  <!-- Property pills row -->
  <g>
    <!-- Pill 1: ANIMATION -->
    <rect x="50" y="455" width="220" height="40" rx="6" fill="currentColor" fill-opacity="0.04" stroke="#FF6B00" stroke-width="1" stroke-opacity="0.5"/>
    <text x="160" y="473" font-size="11" font-weight="700" fill="#FF6B00" text-anchor="middle" letter-spacing="1">ANIMATION</text>
    <text x="160" y="489" font-size="12" fill="currentColor" opacity="0.85" text-anchor="middle">Quads deform clean</text>
    <!-- Pill 2: SUBDIVISION -->
    <rect x="290" y="455" width="220" height="40" rx="6" fill="currentColor" fill-opacity="0.04" stroke="#FF6B00" stroke-width="1" stroke-opacity="0.5"/>
    <text x="400" y="473" font-size="11" font-weight="700" fill="#FF6B00" text-anchor="middle" letter-spacing="1">SUBDIVISION</text>
    <text x="400" y="489" font-size="12" fill="currentColor" opacity="0.85" text-anchor="middle">Quads predictable</text>
    <!-- Pill 3: READABILITY -->
    <rect x="530" y="455" width="220" height="40" rx="6" fill="currentColor" fill-opacity="0.04" stroke="#FF6B00" stroke-width="1" stroke-opacity="0.5"/>
    <text x="640" y="473" font-size="11" font-weight="700" fill="#FF6B00" text-anchor="middle" letter-spacing="1">READABILITY</text>
    <text x="640" y="489" font-size="12" fill="currentColor" opacity="0.85" text-anchor="middle">Edit Mode clarity</text>
  </g>

  <!-- Footer tip card -->
  <rect x="40" y="506" width="720" height="34" rx="4" fill="currentColor" fill-opacity="0.04" stroke="#FF6B00" stroke-opacity="0.4"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="60" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Mesh &gt; Clean Up &gt; Tris to Quads converts triangle pairs back to quads where possible.</text>
</svg>
