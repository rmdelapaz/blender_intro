<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="l45f11-t l45f11-d" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" color="#222">
<title id="l45f11-t">Simple shaders render fast, deeply nested node trees are expensive</title>
<desc id="l45f11-d">A simple material with a few nodes evaluates quickly per sample. A heavy material stacking many procedural nodes, noise textures, and layered mixes multiplies the shading cost at every ray hit. Bake complex results to textures where possible, and reserve deep node networks for hero surfaces.</desc>
<style>
.title{font-size:15px;font-weight:700;}
.sub{font-size:11.5px;fill:#c8c8c8;}
.hdr{font-size:13px;font-weight:800;}
.cost{font-size:12px;font-weight:800;}
.nd{font-size:9.5px;fill:#e8e8e8;}
</style>
<text class="title" x="380" y="36" text-anchor="middle">Shader complexity scales render cost per sample</text>
<!-- SIMPLE -->
<rect x="54" y="66" width="316" height="256" rx="8" fill="#2a2a2a" stroke="#4ADE80" stroke-width="1.5"/>
<text class="hdr" x="212" y="92" fill="#4ADE80" text-anchor="middle">Simple material</text>
<g>
<rect x="84" y="150" width="70" height="30" rx="4" fill="#3a3a3a" stroke="#4ADE80" stroke-width="1"/>
<text class="nd" x="119" y="169" text-anchor="middle">Texture</text>
<rect x="196" y="150" width="70" height="30" rx="4" fill="#3a3a3a" stroke="#4ADE80" stroke-width="1"/>
<text class="nd" x="231" y="169" text-anchor="middle">BSDF</text>
<rect x="290" y="150" width="56" height="30" rx="4" fill="#3a3a3a" stroke="#4ADE80" stroke-width="1"/>
<text class="nd" x="318" y="169" text-anchor="middle">Out</text>
<line x1="154" y1="165" x2="196" y2="165" stroke="#4ADE80" stroke-width="1.5"/>
<line x1="266" y1="165" x2="290" y2="165" stroke="#4ADE80" stroke-width="1.5"/>
</g>
<text class="cost" x="212" y="300" fill="#4ADE80" text-anchor="middle">low cost</text>
<!-- HEAVY -->
<rect x="390" y="66" width="316" height="256" rx="8" fill="#2a2a2a" stroke="#E63946" stroke-width="1.5"/>
<text class="hdr" x="548" y="92" fill="#E63946" text-anchor="middle">Heavy material</text>
<g stroke="#E63946" stroke-width="1" fill="#3a3a3a">
<rect x="410" y="112" width="54" height="24" rx="3"/>
<rect x="410" y="150" width="54" height="24" rx="3"/>
<rect x="410" y="188" width="54" height="24" rx="3"/>
<rect x="410" y="226" width="54" height="24" rx="3"/>
<rect x="500" y="130" width="54" height="24" rx="3"/>
<rect x="500" y="170" width="54" height="24" rx="3"/>
<rect x="500" y="210" width="54" height="24" rx="3"/>
<rect x="590" y="150" width="54" height="24" rx="3"/>
<rect x="590" y="192" width="54" height="24" rx="3"/>
<rect x="648" y="170" width="42" height="24" rx="3"/>
</g>
<g stroke="#E63946" stroke-width="1">
<line x1="464" y1="124" x2="500" y2="142"/><line x1="464" y1="162" x2="500" y2="152"/>
<line x1="464" y1="200" x2="500" y2="182"/><line x1="464" y1="238" x2="500" y2="222"/>
<line x1="554" y1="142" x2="590" y2="162"/><line x1="554" y1="182" x2="590" y2="162"/>
<line x1="554" y1="222" x2="590" y2="204"/><line x1="644" y1="162" x2="648" y2="182"/>
<line x1="644" y1="204" x2="648" y2="182"/>
</g>
<text class="cost" x="548" y="300" fill="#E63946" text-anchor="middle">high cost every sample</text>
<text class="sub" x="380" y="380" text-anchor="middle">Bake heavy node results to textures; keep deep trees for hero surfaces only.</text>
</svg>
