<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="ss-title ss-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="ss-title">Object Selection States in Blender</title>
  <desc id="ss-desc">Three cubes shown side by side to compare how Blender displays object selection states. The leftmost cube has a bright orange outline at full opacity, indicating the active object. The middle cube has a dimmer orange outline, indicating a selected object that is not currently active. The rightmost cube has no outline and only a faint fill, indicating an unselected object. A note explains that when multiple objects are selected, the brightest orange marks the active one. A tip below reminds the reader that the active object is the last one selected, and that its properties appear in the Properties panel.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Header -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">OBJECT SELECTION STATES</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">How Blender shows what's selected</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Section sub-label -->
  <text x="400" y="142" font-size="15" font-weight="700" fill="#FF6B00" text-anchor="middle" letter-spacing="2">THREE STATES, AT A GLANCE</text>
  <text x="400" y="164" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">Same cube, three different selection states</text>

  <!-- =============================================================== -->
  <!-- THREE CUBES, centers x=200, 400, 600                             -->
  <!-- Front face: 60x60 from (cx-30, 265) to (cx+30, 325)              -->
  <!-- Top polygon: (cx-30,265) (cx-8,247) (cx+52,247) (cx+30,265)      -->
  <!-- Right polygon: (cx+30,265) (cx+52,247) (cx+52,307) (cx+30,325)   -->
  <!-- =============================================================== -->

  <!-- ===== CUBE 1: ACTIVE (full-opacity orange) at x=200 ===== -->
  <g opacity="0.12">
    <rect x="170" y="265" width="60" height="60" fill="#FF6B00"/>
    <polygon points="170,265 192,247 252,247 230,265" fill="#FF6B00"/>
    <polygon points="230,265 252,247 252,307 230,325" fill="#FF6B00"/>
  </g>
  <g stroke="#FF6B00" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="170" y="265" width="60" height="60"/>
    <polygon points="170,265 192,247 252,247 230,265"/>
    <polygon points="230,265 252,247 252,307 230,325"/>
  </g>

  <!-- ===== CUBE 2: SELECTED, NOT ACTIVE (dim orange) at x=400 ===== -->
  <g opacity="0.06">
    <rect x="370" y="265" width="60" height="60" fill="#FF6B00"/>
    <polygon points="370,265 392,247 452,247 430,265" fill="#FF6B00"/>
    <polygon points="430,265 452,247 452,307 430,325" fill="#FF6B00"/>
  </g>
  <g stroke="#FF6B00" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.5">
    <rect x="370" y="265" width="60" height="60"/>
    <polygon points="370,265 392,247 452,247 430,265"/>
    <polygon points="430,265 452,247 452,307 430,325"/>
  </g>

  <!-- ===== CUBE 3: UNSELECTED (no stroke, just faint fill) at x=600 ===== -->
  <g opacity="0.18">
    <rect x="570" y="265" width="60" height="60" fill="currentColor"/>
    <polygon points="570,265 592,247 652,247 630,265" fill="currentColor"/>
    <polygon points="630,265 652,247 652,307 630,325" fill="currentColor"/>
  </g>

  <!-- Primary labels under each cube -->
  <text x="200" y="362" font-size="14" font-weight="700" fill="currentColor" text-anchor="middle">Active (Bright Orange)</text>
  <text x="400" y="362" font-size="14" font-weight="700" fill="currentColor" text-anchor="middle">Selected, Not Active</text>
  <text x="600" y="362" font-size="14" font-weight="700" fill="currentColor" text-anchor="middle">Unselected</text>

  <!-- Secondary swatch labels -->
  <text x="200" y="382" font-size="12" font-weight="600" fill="#FF6B00" text-anchor="middle">Bright orange outline</text>
  <text x="400" y="382" font-size="12" font-weight="600" fill="#FF6B00" text-anchor="middle" opacity="0.7">Dimmer orange outline</text>
  <text x="600" y="382" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle" opacity="0.55">No outline</text>

  <!-- Bottom inset: why two oranges -->
  <g transform="translate(60, 422)">
    <rect x="0" y="0" width="680" height="68" rx="6"
          fill="currentColor" fill-opacity="0.04"
          stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>
    <text x="14" y="22" font-size="11" font-weight="700" fill="currentColor" opacity="0.75" letter-spacing="0.8">WHY TWO ORANGES?</text>
    <text x="14" y="44" font-size="12" fill="currentColor" opacity="0.8">When several objects are selected at once, the brightest orange marks the active one. Every other</text>
    <text x="14" y="60" font-size="12" fill="currentColor" opacity="0.8">selected object gets a dimmer outline so you can still see the full selection set.</text>
  </g>

  <!-- Footer tip callout -->
  <rect x="40" y="506" width="720" height="34" rx="6"
        fill="#FF6B00" fill-opacity="0.10"
        stroke="#FF6B00" stroke-opacity="0.4"/>
  <text x="54" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> The active object is the last one you selected, and its properties appear in the Properties panel.
  </text>
</svg>
