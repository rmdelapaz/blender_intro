<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" color="#222" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" role="img" aria-labelledby="dof-t dof-d">
  <title id="dof-t">Depth of Field: Focal Length and F-Stop</title>
  <desc id="dof-d">A camera diagram showing how aperture and focal length shape depth of field &#8212; a wide aperture (low f-number) gives a shallow zone of focus that blurs the background and isolates the product, while a narrow aperture (high f-number) keeps more of the scene sharp; a longer focal length compresses and further separates the subject &#8212; so background blur becomes a deliberate composition tool.</desc>
  <rect x="0" y="0" width="760" height="480" fill="none"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="currentColor">Depth of Field &amp; Subject Isolation</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#8a8f98">Aperture blurs the background; focal length separates the subject</text>

  <!-- TOP: wide aperture (shallow DOF) -->
  <g>
    <text x="60" y="94" font-size="13" font-weight="700" fill="#4ADE80">Wide aperture (f/1.8) &#8212; shallow focus</text>
    <!-- camera -->
    <rect x="60" y="108" width="34" height="40" rx="4" fill="#4A9EFF"/>
    <!-- focus cone -->
    <polygon points="94,128 700,102 700,154 94,128" fill="#4ADE80" opacity="0.1"/>
    <!-- in-focus band -->
    <rect x="300" y="104" width="60" height="48" fill="#4ADE80" opacity="0.22"/>
    <text x="330" y="170" text-anchor="middle" font-size="10" fill="#4ADE80">in focus</text>
    <!-- subject sharp -->
    <circle cx="330" cy="128" r="18" fill="#FF6B00"/>
    <!-- background blurred blobs -->
    <circle cx="560" cy="122" r="20" fill="#B47EE8" opacity="0.35"/>
    <circle cx="620" cy="134" r="24" fill="#F5C242" opacity="0.3"/>
    <circle cx="670" cy="120" r="16" fill="#4A9EFF" opacity="0.3"/>
    <text x="600" y="170" text-anchor="middle" font-size="10" fill="#8a8f98">soft, creamy bokeh</text>
    <text x="120" y="128" font-size="10" fill="#8a8f98">camera</text>
  </g>

  <line x1="60" y1="196" x2="700" y2="196" stroke="#444" stroke-width="1"/>

  <!-- BOTTOM: narrow aperture (deep DOF) -->
  <g>
    <text x="60" y="236" font-size="13" font-weight="700" fill="#4A9EFF">Narrow aperture (f/11) &#8212; deep focus</text>
    <rect x="60" y="250" width="34" height="40" rx="4" fill="#4A9EFF"/>
    <polygon points="94,270 700,246 700,296 94,270 94,270" fill="#4A9EFF" opacity="0.08"/>
    <!-- wide in-focus band -->
    <rect x="240" y="246" width="440" height="48" fill="#4A9EFF" opacity="0.16"/>
    <text x="460" y="312" text-anchor="middle" font-size="10" fill="#4A9EFF">most of the scene sharp</text>
    <circle cx="330" cy="270" r="18" fill="#FF6B00"/>
    <circle cx="560" cy="266" r="18" fill="#B47EE8" opacity="0.85"/>
    <circle cx="640" cy="274" r="16" fill="#F5C242" opacity="0.85"/>
    <text x="120" y="270" font-size="10" fill="#8a8f98">camera</text>
  </g>

  <!-- focal length note strip -->
  <g>
    <rect x="60" y="344" width="640" height="104" rx="8" fill="#B47EE8" opacity="0.1"/>
    <rect x="60" y="344" width="640" height="104" rx="8" fill="none" stroke="#B47EE8" stroke-width="1.3"/>
    <text x="78" y="370" font-size="13" font-weight="700" fill="#B47EE8">Focal length changes the feel too</text>
    <text x="78" y="394" font-size="12" fill="currentColor">Short (24mm): wide view, exaggerated perspective &#8212; can distort product shape.</text>
    <text x="78" y="416" font-size="12" fill="currentColor">Long (85&#8211;135mm): compresses depth, flatters proportions, separates subject from bg.</text>
    <text x="78" y="438" font-size="11" fill="#8a8f98">Product-viz sweet spot: 50&#8211;100mm at a moderate f-stop &#8212; honest shape, clean isolation.</text>
  </g>
</svg>
