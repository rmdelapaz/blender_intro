<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="pr-title pr-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="pr-title">Product photography depth of field setup</title>
  <desc id="pr-desc">Side profile diagram of a product photography camera setup. A camera at left aims along an optical axis at a product resting on a platform. An orange focal plane line passes through the product feature, a moderate cyan acceptable sharpness band covers the product with one third in front and two thirds behind, and the background four to five units away is gently softened. A specifications card lists 50mm focal length, f slash 4 aperture, focus on the product feature, and moderate subject to background separation.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Product DoF Setup</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Moderate depth of field to keep the product crisp with a clean backdrop</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Optical axis -->
  <line x1="96" y1="300" x2="720" y2="300" stroke="currentColor" stroke-width="1.5" opacity="0.3" stroke-dasharray="2 6" stroke-linecap="round"/>

  <!-- DoF acceptable sharpness band (cyan), moderate width, 1/3 front : 2/3 behind around plane x=320 -->
  <rect x="262" y="150" width="174" height="300" fill="#4A9EFF" opacity="0.13"/>
  <text x="349" y="468" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.6">Sharp zone</text>

  <!-- Camera glyph at left -->
  <g>
    <rect x="64" y="282" width="40" height="36" rx="3" fill="currentColor" opacity="0.75"/>
    <polygon points="104,290 124,278 124,322 104,310" fill="currentColor" opacity="0.75"/>
    <text x="84" y="338" font-size="12" text-anchor="middle" fill="currentColor">Camera</text>
  </g>

  <!-- Product on platform at focus, x~320 -->
  <g>
    <rect x="296" y="262" width="48" height="56" rx="3" fill="currentColor" opacity="0.85"/>
    <!-- feature mark -->
    <circle cx="320" cy="290" r="6" fill="#FF6B00"/>
    <!-- platform -->
    <rect x="280" y="324" width="80" height="8" rx="2" fill="currentColor" opacity="0.45"/>
    <text x="320" y="352" font-size="12" text-anchor="middle" fill="currentColor">Product</text>
  </g>

  <!-- Focal plane line through product feature (orange) -->
  <line x1="320" y1="150" x2="320" y2="438" stroke="#FF6B00" stroke-width="3"/>
  <text x="320" y="142" font-size="13" font-weight="600" text-anchor="middle" fill="#FF6B00">Focal plane (feature)</text>

  <!-- Background: 4 to 5 units, gentle soften -->
  <g>
    <rect x="560" y="250" width="120" height="100" rx="4" fill="currentColor" opacity="0.12"/>
    <text x="620" y="372" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.6">Soft backdrop</text>
  </g>

  <!-- Dimension: camera to product -->
  <g stroke="#4A9EFF" stroke-width="1.5" fill="none">
    <line x1="84" y1="408" x2="320" y2="408"/>
    <line x1="84" y1="402" x2="84" y2="414"/>
    <line x1="320" y1="402" x2="320" y2="414"/>
  </g>
  <text x="202" y="426" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.8">Subject distance</text>

  <!-- Dimension: product to background -->
  <g stroke="#4A9EFF" stroke-width="1.5" fill="none">
    <line x1="320" y1="440" x2="620" y2="440"/>
    <line x1="320" y1="434" x2="320" y2="446"/>
    <line x1="620" y1="434" x2="620" y2="446"/>
  </g>
  <text x="470" y="458" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.8">Background 4 to 5 units behind</text>

  <!-- Specs card -->
  <g>
    <rect x="40" y="150" width="170" height="118" rx="6" fill="#FF6B00" fill-opacity="0.06" stroke="#FF6B00" stroke-opacity="0.4"/>
    <text x="56" y="174" font-size="13" font-weight="700" fill="#FF6B00">Settings</text>
    <text x="56" y="198" font-size="13" fill="currentColor">50mm focal length</text>
    <text x="56" y="220" font-size="13" fill="currentColor">f / 4 aperture</text>
    <text x="56" y="242" font-size="13" fill="currentColor">Focus: key feature</text>
    <text x="56" y="260" font-size="12" fill="currentColor" opacity="0.65">Product fully sharp</text>
  </g>

  <!-- Footer tip (Variant B, left rail) -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> f / 4 keeps the whole product sharp while still calming the background.
  </text>
</svg>
