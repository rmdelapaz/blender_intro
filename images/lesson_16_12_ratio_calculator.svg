<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="rc-title rc-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="rc-title">Lighting ratio calculator</title>
  <desc id="rc-desc">Chart showing key-to-fill power relationships: a 2 to 1 ratio means fill is 50 percent of key (500 watts at a 1000 watt key), 3 to 1 is 33 percent (333 watts), 4 to 1 is 25 percent (250 watts), and 8 to 1 is 12.5 percent (125 watts). The key bar is full length, the fill bar shows the proportional shadow-side power.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Lighting Ratio Calculator</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Fill power as a fraction of key, at a 1000W key</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <text x="48" y="150" font-size="13" font-weight="600" fill="currentColor" opacity="0.6">RATIO</text>
  <text x="210" y="150" font-size="13" font-weight="600" fill="currentColor" opacity="0.6">KEY vs FILL POWER</text>
  <text x="594" y="150" font-size="13" font-weight="600" fill="currentColor" opacity="0.6">FILL</text>
  <text x="48" y="206" font-size="26" font-weight="700" fill="#FF6B00">2:1</text>
  <rect x="210" y="176" width="360" height="22" rx="4" fill="#FF6B00"/>
  <text x="218" y="192" font-size="13" font-weight="700" fill="#ffffff">KEY &#183; 1000W</text>
  <rect x="210" y="206" width="180" height="22" rx="4" fill="#4A9EFF"/>
  <text x="218" y="222" font-size="13" font-weight="700" fill="#0b1a2e">FILL &#183; 500W</text>
  <text x="594" y="206" font-size="22" font-weight="700" fill="currentColor">50%</text>
  <line x1="48" y1="244" x2="760" y2="244" stroke="currentColor" stroke-width="1" opacity="0.12"/>
  <text x="48" y="290" font-size="26" font-weight="700" fill="#FF6B00">3:1</text>
  <rect x="210" y="260" width="360" height="22" rx="4" fill="#FF6B00"/>
  <text x="218" y="276" font-size="13" font-weight="700" fill="#ffffff">KEY &#183; 1000W</text>
  <rect x="210" y="290" width="120" height="22" rx="4" fill="#4A9EFF"/>
  <text x="340" y="306" font-size="13" font-weight="700" fill="currentColor">FILL &#183; 333W</text>
  <text x="594" y="290" font-size="22" font-weight="700" fill="currentColor">33%</text>
  <line x1="48" y1="328" x2="760" y2="328" stroke="currentColor" stroke-width="1" opacity="0.12"/>
  <text x="48" y="374" font-size="26" font-weight="700" fill="#FF6B00">4:1</text>
  <rect x="210" y="344" width="360" height="22" rx="4" fill="#FF6B00"/>
  <text x="218" y="360" font-size="13" font-weight="700" fill="#ffffff">KEY &#183; 1000W</text>
  <rect x="210" y="374" width="90" height="22" rx="4" fill="#4A9EFF"/>
  <text x="310" y="390" font-size="13" font-weight="700" fill="currentColor">FILL &#183; 250W</text>
  <text x="594" y="374" font-size="22" font-weight="700" fill="currentColor">25%</text>
  <line x1="48" y1="412" x2="760" y2="412" stroke="currentColor" stroke-width="1" opacity="0.12"/>
  <text x="48" y="458" font-size="26" font-weight="700" fill="#FF6B00">8:1</text>
  <rect x="210" y="428" width="360" height="22" rx="4" fill="#FF6B00"/>
  <text x="218" y="444" font-size="13" font-weight="700" fill="#ffffff">KEY &#183; 1000W</text>
  <rect x="210" y="458" width="45" height="22" rx="4" fill="#4A9EFF"/>
  <text x="265" y="474" font-size="13" font-weight="700" fill="currentColor">FILL &#183; 125W</text>
  <text x="594" y="458" font-size="22" font-weight="700" fill="currentColor">12.5%</text>

  <rect x="40" y="506" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Ratios are about proportion, not absolute watts: 1000W key with 500W fill looks the same as 100W with 50W.
  </text>
</svg>