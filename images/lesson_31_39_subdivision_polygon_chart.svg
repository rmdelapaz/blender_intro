<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="spc-title spc-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="spc-title">Subdivision polygon count growth</title>
  <desc id="spc-desc">A vertical bar chart showing how polygon count grows exponentially with each subdivision surface level. Starting from a base mesh, level one multiplies polygons by four, level two by sixteen, level three by sixty-four, and level four by two hundred fifty-six. The level four bar carries a viewport performance warning.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Subdivision polygon growth</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Each level multiplies polygon count by four</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Plot area: baseline y=470, bars across 5 slots. Log-style heights so all bars read. -->
  <!-- x centers: 130, 268, 406, 544, 682. bar width 86 -->
  <line x1="60" y1="470" x2="740" y2="470" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>

  <!-- Base: height 36 -->
  <rect x="87" y="434" width="86" height="36" rx="3" fill="#4ADE80"/>
  <text x="130" y="424" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">1,000</text>
  <text x="130" y="490" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Base</text>
  <text x="130" y="508" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">polys</text>

  <!-- Level 1: height 80 -->
  <rect x="225" y="390" width="86" height="80" rx="3" fill="#A3D955"/>
  <text x="268" y="380" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">4,000</text>
  <text x="268" y="490" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Level 1</text>
  <text x="268" y="508" text-anchor="middle" font-size="12" font-weight="700" fill="#FF6B00">&#215;4</text>

  <!-- Level 2: height 142 -->
  <rect x="363" y="328" width="86" height="142" rx="3" fill="#F5C242"/>
  <text x="406" y="318" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">16,000</text>
  <text x="406" y="490" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Level 2</text>
  <text x="406" y="508" text-anchor="middle" font-size="12" font-weight="700" fill="#FF6B00">&#215;16</text>

  <!-- Level 3: height 224 -->
  <rect x="501" y="246" width="86" height="224" rx="3" fill="#F0883E"/>
  <text x="544" y="236" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">64,000</text>
  <text x="544" y="490" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Level 3</text>
  <text x="544" y="508" text-anchor="middle" font-size="12" font-weight="700" fill="#FF6B00">&#215;64</text>

  <!-- Level 4: height 320 -->
  <rect x="639" y="150" width="86" height="320" rx="3" fill="#E63946"/>
  <text x="682" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">256,000</text>
  <text x="682" y="490" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Level 4</text>
  <text x="682" y="508" text-anchor="middle" font-size="12" font-weight="700" fill="#FF6B00">&#215;256</text>

  <!-- Warning badge on Level 4 -->
  <rect x="612" y="178" width="140" height="26" rx="6" fill="#E63946"/>
  <text x="682" y="196" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Performance risk</text>

  <!-- Footer tip -->
  <rect x="40" y="526" width="720" height="28" rx="0" fill="none"/>
  <rect x="40" y="526" width="4" height="28" fill="#FF6B00"/>
  <text x="58" y="545" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Keep the viewport level low and raise only the render level for the final output.
  </text>
</svg>
