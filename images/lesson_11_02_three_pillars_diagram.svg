<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="tp-title tp-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="tp-title">The Three Pillars of PBR</title>
  <desc id="tp-desc">An architectural diagram showing three pillars labeled Energy Conservation, Physically Plausible Materials, and Accurate Light Behavior supporting an entablature labeled PBR Rendering. Each pillar carries a small icon and a short description of its principle.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">THE THREE PILLARS OF PBR</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Three principles hold up every physically based material</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Entablature (roof) -->
  <rect x="90" y="150" width="620" height="46" rx="4" fill="#FF6B00" opacity="0.12"/>
  <rect x="90" y="150" width="620" height="46" rx="4" fill="none" stroke="#FF6B00" stroke-width="2" opacity="0.55"/>
  <text x="400" y="180" text-anchor="middle" font-size="18" font-weight="600" fill="currentColor">PBR RENDERING</text>
  <!-- Entablature base shelf the pillars meet -->
  <rect x="78" y="196" width="644" height="10" rx="2" fill="currentColor" opacity="0.18"/>

  <!-- Floor / stylobate -->
  <rect x="78" y="430" width="644" height="10" rx="2" fill="currentColor" opacity="0.18"/>

  <!-- ===== Pillar 1: Energy Conservation (blue) ===== -->
  <!-- column shaft -->
  <rect x="135" y="212" width="92" height="214" rx="3" fill="#4A9EFF" opacity="0.16"/>
  <rect x="135" y="212" width="92" height="214" rx="3" fill="none" stroke="#4A9EFF" stroke-width="2" opacity="0.7"/>
  <!-- capital + base -->
  <rect x="127" y="206" width="108" height="10" rx="2" fill="#4A9EFF" opacity="0.85"/>
  <rect x="127" y="424" width="108" height="10" rx="2" fill="#4A9EFF" opacity="0.85"/>
  <!-- icon: balanced scales -->
  <g stroke="#4A9EFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="181" y1="244" x2="181" y2="270"/>
    <line x1="159" y1="252" x2="203" y2="252"/>
    <path d="M 159 252 L 151 270 L 167 270 Z" fill="#4A9EFF" fill-opacity="0.25"/>
    <path d="M 203 252 L 195 270 L 211 270 Z" fill="#4A9EFF" fill-opacity="0.25"/>
    <line x1="170" y1="276" x2="192" y2="276"/>
  </g>
  <!-- label + description -->
  <text x="181" y="306" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor">Energy</text>
  <text x="181" y="324" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor">Conservation</text>
  <text x="181" y="356" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">Reflected +</text>
  <text x="181" y="372" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">absorbed +</text>
  <text x="181" y="388" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">transmitted</text>
  <text x="181" y="404" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">= 100%</text>

  <!-- ===== Pillar 2: Physically Plausible Materials (purple) ===== -->
  <rect x="354" y="212" width="92" height="214" rx="3" fill="#B47EE8" opacity="0.16"/>
  <rect x="354" y="212" width="92" height="214" rx="3" fill="none" stroke="#B47EE8" stroke-width="2" opacity="0.7"/>
  <rect x="346" y="206" width="108" height="10" rx="2" fill="#B47EE8" opacity="0.85"/>
  <rect x="346" y="424" width="108" height="10" rx="2" fill="#B47EE8" opacity="0.85"/>
  <!-- icon: atom -->
  <g stroke="#B47EE8" stroke-width="2.5" fill="none">
    <circle cx="400" cy="258" r="5" fill="#B47EE8" fill-opacity="0.4"/>
    <ellipse cx="400" cy="258" rx="22" ry="9"/>
    <ellipse cx="400" cy="258" rx="22" ry="9" transform="rotate(60 400 258)"/>
    <ellipse cx="400" cy="258" rx="22" ry="9" transform="rotate(120 400 258)"/>
  </g>
  <text x="400" y="306" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor">Physically</text>
  <text x="400" y="324" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor">Plausible</text>
  <text x="400" y="342" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor">Materials</text>
  <text x="400" y="372" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">Metals and</text>
  <text x="400" y="388" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">non-metals obey</text>
  <text x="400" y="404" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">real-world rules</text>

  <!-- ===== Pillar 3: Accurate Light Behavior (green) ===== -->
  <rect x="573" y="212" width="92" height="214" rx="3" fill="#4ADE80" opacity="0.16"/>
  <rect x="573" y="212" width="92" height="214" rx="3" fill="none" stroke="#4ADE80" stroke-width="2" opacity="0.7"/>
  <rect x="565" y="206" width="108" height="10" rx="2" fill="#4ADE80" opacity="0.85"/>
  <rect x="565" y="424" width="108" height="10" rx="2" fill="#4ADE80" opacity="0.85"/>
  <!-- icon: light rays from a sun -->
  <g stroke="#4ADE80" stroke-width="2.5" fill="none" stroke-linecap="round">
    <circle cx="619" cy="258" r="8" fill="#4ADE80" fill-opacity="0.3"/>
    <line x1="619" y1="240" x2="619" y2="232"/>
    <line x1="619" y1="284" x2="619" y2="276"/>
    <line x1="601" y1="258" x2="593" y2="258"/>
    <line x1="645" y1="258" x2="637" y2="258"/>
    <line x1="606" y1="245" x2="600" y2="239"/>
    <line x1="632" y1="271" x2="638" y2="277"/>
    <line x1="632" y1="245" x2="638" y2="239"/>
    <line x1="606" y1="271" x2="600" y2="277"/>
  </g>
  <text x="619" y="306" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor">Accurate</text>
  <text x="619" y="324" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor">Light</text>
  <text x="619" y="342" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor">Behavior</text>
  <text x="619" y="372" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">Reflection,</text>
  <text x="619" y="388" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">refraction and</text>
  <text x="619" y="404" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">bounce by physics</text>

  <!-- Footer tip callout (Variant B, left rail) -->
  <rect x="40" y="506" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Remove any one pillar and the material stops being physically based.
  </text>
</svg>
