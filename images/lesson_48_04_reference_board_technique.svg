<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" color="#222" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" role="img" aria-labelledby="rbt-t rbt-d">
  <title id="rbt-t">Anatomy of a Reference Board</title>
  <desc id="rbt-d">A PureRef-style reference board divided into four working zones &#8212; a large front/side orthographic block for silhouette and proportion, a detail cluster for close-ups of seams and controls, a materials strip for surface and finish samples, and a context row for scale and real-world lighting &#8212; so every modeling decision has a source to check against.</desc>
  <rect x="0" y="0" width="760" height="520" fill="none"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="currentColor">Anatomy of a Reference Board</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#8a8f98">One board, four zones &#8212; never model from memory</text>

  <!-- board frame -->
  <rect x="40" y="76" width="680" height="392" rx="6" fill="#000" opacity="0.18"/>
  <rect x="40" y="76" width="680" height="392" rx="6" fill="none" stroke="#666" stroke-width="1.5"/>

  <!-- Zone 1: orthographic block (front/side) -->
  <g>
    <rect x="56" y="94" width="330" height="220" rx="4" fill="#4A9EFF" opacity="0.12"/>
    <rect x="56" y="94" width="330" height="220" rx="4" fill="none" stroke="#4A9EFF" stroke-width="1.5"/>
    <text x="70" y="114" font-size="12" font-weight="700" fill="#4A9EFF">1 &#183; ORTHOGRAPHIC BLOCK</text>
    <!-- front tile -->
    <rect x="70" y="126" width="140" height="120" rx="3" fill="#4A9EFF" opacity="0.16"/>
    <text x="140" y="190" text-anchor="middle" font-size="12" fill="currentColor">front</text>
    <!-- side tile -->
    <rect x="222" y="126" width="150" height="120" rx="3" fill="#4A9EFF" opacity="0.16"/>
    <text x="297" y="190" text-anchor="middle" font-size="12" fill="currentColor">side</text>
    <text x="70" y="272" font-size="11" fill="#8a8f98">Biggest tiles: drive silhouette</text>
    <text x="70" y="290" font-size="11" fill="#8a8f98">&amp; overall proportion.</text>
  </g>

  <!-- Zone 2: detail cluster -->
  <g>
    <rect x="398" y="94" width="308" height="220" rx="4" fill="#FF6B00" opacity="0.12"/>
    <rect x="398" y="94" width="308" height="220" rx="4" fill="none" stroke="#FF6B00" stroke-width="1.5"/>
    <text x="412" y="114" font-size="12" font-weight="700" fill="#FF6B00">2 &#183; DETAIL CLUSTER</text>
    <rect x="412" y="126" width="86" height="80" rx="3" fill="#FF6B00" opacity="0.16"/>
    <rect x="508" y="126" width="86" height="80" rx="3" fill="#FF6B00" opacity="0.16"/>
    <rect x="604" y="126" width="86" height="80" rx="3" fill="#FF6B00" opacity="0.16"/>
    <text x="455" y="170" text-anchor="middle" font-size="11" fill="currentColor">seam</text>
    <text x="551" y="170" text-anchor="middle" font-size="11" fill="currentColor">port</text>
    <text x="647" y="170" text-anchor="middle" font-size="11" fill="currentColor">hinge</text>
    <rect x="412" y="214" width="134" height="60" rx="3" fill="#FF6B00" opacity="0.16"/>
    <rect x="556" y="214" width="134" height="60" rx="3" fill="#FF6B00" opacity="0.16"/>
    <text x="479" y="248" text-anchor="middle" font-size="11" fill="currentColor">buttons</text>
    <text x="623" y="248" text-anchor="middle" font-size="11" fill="currentColor">logo</text>
    <text x="412" y="298" font-size="11" fill="#8a8f98">Close-ups: what breaks the illusion if wrong.</text>
  </g>

  <!-- Zone 3: materials strip -->
  <g>
    <rect x="56" y="330" width="400" height="122" rx="4" fill="#B47EE8" opacity="0.12"/>
    <rect x="56" y="330" width="400" height="122" rx="4" fill="none" stroke="#B47EE8" stroke-width="1.5"/>
    <text x="70" y="350" font-size="12" font-weight="700" fill="#B47EE8">3 &#183; MATERIALS STRIP</text>
    <rect x="70" y="362" width="70" height="70" rx="3" fill="#1a1a1a"/>
    <rect x="152" y="362" width="70" height="70" rx="3" fill="#8a8f98"/>
    <rect x="234" y="362" width="70" height="70" rx="3" fill="#B47EE8" opacity="0.5"/>
    <rect x="316" y="362" width="70" height="70" rx="3" fill="#F5C242" opacity="0.6"/>
    <text x="398" y="400" font-size="11" fill="#8a8f98">finish</text>
    <text x="398" y="416" font-size="11" fill="#8a8f98">samples</text>
  </g>

  <!-- Zone 4: context row -->
  <g>
    <rect x="468" y="330" width="238" height="122" rx="4" fill="#4ADE80" opacity="0.12"/>
    <rect x="468" y="330" width="238" height="122" rx="4" fill="none" stroke="#4ADE80" stroke-width="1.5"/>
    <text x="482" y="350" font-size="12" font-weight="700" fill="#4ADE80">4 &#183; CONTEXT / SCALE</text>
    <rect x="482" y="362" width="100" height="70" rx="3" fill="#4ADE80" opacity="0.16"/>
    <rect x="592" y="362" width="100" height="70" rx="3" fill="#4ADE80" opacity="0.16"/>
    <text x="532" y="401" text-anchor="middle" font-size="11" fill="currentColor">in-hand</text>
    <text x="642" y="401" text-anchor="middle" font-size="11" fill="currentColor">real light</text>
  </g>

  <text x="40" y="502" font-size="12" fill="#8a8f98">Zone size = priority. Proportion first, details second, then materials and real-world context to ground your lighting.</text>
</svg>
