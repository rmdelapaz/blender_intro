<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" color="#222" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" role="img" aria-labelledby="rac-t rac-d">
  <title id="rac-t">Reference Capture: The Angles You Need to Shoot</title>
  <desc id="rac-d">A top-down diagram of a product on a turntable ringed by camera positions &#8212; front, side, three-quarter, and back &#8212; plus a callout for close-up detail shots, showing which angles a reference set must cover before modeling.</desc>
  <rect x="0" y="0" width="760" height="500" fill="none"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="currentColor">Reference Capture &#8212; Cover Every Angle</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#8a8f98">Shoot the product from these positions before you open Blender</text>

  <!-- turntable -->
  <ellipse cx="300" cy="270" rx="150" ry="120" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="5 5"/>
  <!-- product at center (headphones glyph) -->
  <g transform="translate(300,270)">
    <path d="M -34 6 A 34 40 0 0 1 34 6" fill="none" stroke="#FF6B00" stroke-width="6"/>
    <rect x="-44" y="2" width="20" height="30" rx="6" fill="#FF6B00"/>
    <rect x="24" y="2" width="20" height="30" rx="6" fill="#FF6B00"/>
    <text x="0" y="60" text-anchor="middle" font-size="11" fill="#8a8f98">product</text>
  </g>

  <!-- camera markers around ring -->
  <!-- front (bottom) -->
  <g transform="translate(300,410)">
    <circle r="15" fill="#4ADE80"/><text x="0" y="4" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">F</text>
    <text x="0" y="34" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">Front (0&#176;)</text>
  </g>
  <!-- side (right) -->
  <g transform="translate(450,270)">
    <circle r="15" fill="#4A9EFF"/><text x="0" y="4" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">S</text>
    <text x="0" y="-24" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">Side (90&#176;)</text>
  </g>
  <!-- three-quarter (bottom-right) -->
  <g transform="translate(406,376)">
    <circle r="15" fill="#F5C242"/><text x="0" y="4" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">&#190;</text>
  </g>
  <text x="430" y="410" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">3/4 (45&#176;)</text>
  <!-- back (top) -->
  <g transform="translate(300,150)">
    <circle r="15" fill="#B47EE8"/><text x="0" y="4" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">B</text>
    <text x="0" y="-22" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">Back (180&#176;)</text>
  </g>

  <!-- sightlines to center -->
  <g stroke="#666" stroke-width="1" stroke-dasharray="3 3">
    <line x1="300" y1="395" x2="300" y2="310"/>
    <line x1="435" y1="270" x2="335" y2="270"/>
    <line x1="300" y1="165" x2="300" y2="232"/>
    <line x1="396" y1="366" x2="325" y2="300"/>
  </g>

  <!-- detail-shot callout panel -->
  <rect x="520" y="120" width="216" height="300" rx="8" fill="#E63946" opacity="0.07"/>
  <text x="628" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="#E63946">+ DETAIL SHOTS</text>
  <g font-size="12.5" fill="currentColor">
    <text x="538" y="180">&#9679; Seams &amp; panel gaps</text>
    <text x="538" y="210">&#9679; Hinge / moving joints</text>
    <text x="538" y="240">&#9679; Buttons, ports, logos</text>
    <text x="538" y="270">&#9679; Material transitions</text>
    <text x="538" y="300">&#9679; Texture close-ups</text>
    <text x="538" y="330">&#9679; Wear / edge highlights</text>
  </g>
  <text x="538" y="372" font-size="11.5" fill="#8a8f98">Macro shots resolve the small</text>
  <text x="538" y="390" font-size="11.5" fill="#8a8f98">forms your 4 angles can't.</text>

  <text x="30" y="484" font-size="12" fill="#8a8f98">Four orbit angles lock proportion; detail shots lock the surface story. Get both before modeling.</text>
</svg>
