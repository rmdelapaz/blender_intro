<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="mc-title mc-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="mc-title">The three mesh components: vertices, edges, and faces</title>
  <desc id="mc-desc">A single 3D cube sits at the center of the diagram. Three labeled annotation cards point to the three fundamental mesh components. A Vertex card sits above the cube and connects with a dashed line to a highlighted orange dot at the top-front-right corner. An Edge card sits at the lower-left and connects to the front-bottom edge, drawn as a thick orange line. A Face card sits at the lower-right and connects to the front face, filled with semi-transparent orange. Each card pairs a short bold title with a one-line description and a small icon. A footer tip explains that pressing 1, 2, or 3 in Edit Mode switches between vertex, edge, and face selection.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">MESH COMPONENTS</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Every 3D mesh is built from vertices, edges, and faces.</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Subhead -->
  <text x="400" y="138" font-size="15" font-weight="700" fill="#FF6B00" text-anchor="middle" letter-spacing="2">EIGHT VERTICES, TWELVE EDGES, SIX FACES</text>

  <!-- =============================================================== -->
  <!-- Composition area                                                 -->
  <!-- Hero cube: front face (340, 260) to (460, 380), depth (34, 34)   -->
  <!-- Highlighted vertex at (460, 260)                                 -->
  <!-- Highlighted edge from (340, 380) to (460, 380)                   -->
  <!-- Highlighted face is the front face, centered at (400, 320)       -->
  <!-- Cards at: top (295, 150), BL (65, 415), BR (540, 415)            -->
  <!-- =============================================================== -->

  <!-- Connector lines drawn first so the cube and highlights sit on top -->
  <g stroke="currentColor" stroke-width="1.2" fill="none" stroke-dasharray="4 3" opacity="0.30">
    <line x1="495" y1="205" x2="460" y2="260"/>
    <line x1="265" y1="415" x2="400" y2="380"/>
    <line x1="540" y1="415" x2="430" y2="320"/>
  </g>

  <!-- Highlighted face fill (front face, semi-transparent orange) -->
  <rect x="340" y="260" width="120" height="120" fill="#FF6B00" fill-opacity="0.10"/>

  <!-- Cube back faces (faint) -->
  <g opacity="0.10">
    <polygon points="340,260 374,226 494,226 460,260" fill="currentColor"/>
    <polygon points="460,260 494,226 494,346 460,380" fill="currentColor"/>
  </g>

  <!-- Cube outline -->
  <g stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <rect x="340" y="260" width="120" height="120"/>
    <polygon points="340,260 374,226 494,226 460,260"/>
    <polygon points="460,260 494,226 494,346 460,380"/>
  </g>

  <!-- Highlighted edge (front-bottom) drawn as a thick orange overlay -->
  <line x1="340" y1="380" x2="460" y2="380" stroke="#FF6B00" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Highlighted vertex (top-front-right corner) -->
  <circle cx="460" cy="260" r="10" fill="#FF6B00" opacity="0.20"/>
  <circle cx="460" cy="260" r="6" fill="#FF6B00"/>
  <circle cx="460" cy="260" r="2.2" fill="#ffffff"/>

  <!-- =============================================================== -->
  <!-- THREE ANNOTATION CARDS                                           -->
  <!-- =============================================================== -->

  <!-- ===== TOP CARD: VERTEX ===== -->
  <g transform="translate(295, 150)">
    <rect x="0" y="0" width="200" height="55" rx="6"
          fill="currentColor" fill-opacity="0.04"
          stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>
    <text x="12" y="22" font-size="14" font-weight="700" fill="#FF6B00">Vertex</text>
    <text x="12" y="40" font-size="11" fill="currentColor" opacity="0.7">A point in 3D space</text>
    <!-- Icon: orange dot -->
    <g transform="translate(165, 17)">
      <circle cx="12" cy="12" r="9" fill="#FF6B00" opacity="0.20"/>
      <circle cx="12" cy="12" r="5" fill="#FF6B00"/>
      <circle cx="12" cy="12" r="1.8" fill="#ffffff"/>
    </g>
  </g>

  <!-- ===== BOTTOM-LEFT CARD: EDGE ===== -->
  <g transform="translate(65, 415)">
    <rect x="0" y="0" width="200" height="55" rx="6"
          fill="currentColor" fill-opacity="0.04"
          stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>
    <text x="12" y="22" font-size="14" font-weight="700" fill="#FF6B00">Edge</text>
    <text x="12" y="40" font-size="11" fill="currentColor" opacity="0.7">A line between two vertices</text>
    <!-- Icon: orange segment with two endpoint dots -->
    <g transform="translate(165, 17)">
      <line x1="2" y1="12" x2="22" y2="12" stroke="#FF6B00" stroke-width="3" stroke-linecap="round"/>
      <circle cx="2" cy="12" r="3" fill="#FF6B00"/>
      <circle cx="22" cy="12" r="3" fill="#FF6B00"/>
    </g>
  </g>

  <!-- ===== BOTTOM-RIGHT CARD: FACE ===== -->
  <g transform="translate(540, 415)">
    <rect x="0" y="0" width="200" height="55" rx="6"
          fill="currentColor" fill-opacity="0.04"
          stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>
    <text x="12" y="22" font-size="14" font-weight="700" fill="#FF6B00">Face</text>
    <text x="12" y="40" font-size="11" fill="currentColor" opacity="0.7">A flat surface bounded by edges</text>
    <!-- Icon: small filled quad with orange corner dots -->
    <g transform="translate(163, 13)">
      <rect x="2" y="2" width="22" height="16" fill="#FF6B00" fill-opacity="0.18" stroke="#FF6B00" stroke-width="1.5"/>
      <circle cx="2" cy="2" r="2.2" fill="#FF6B00"/>
      <circle cx="24" cy="2" r="2.2" fill="#FF6B00"/>
      <circle cx="24" cy="18" r="2.2" fill="#FF6B00"/>
      <circle cx="2" cy="18" r="2.2" fill="#FF6B00"/>
    </g>
  </g>

  <!-- Italic takeaway -->
  <text x="400" y="495" font-size="13" font-style="italic" fill="currentColor" opacity="0.6" text-anchor="middle">Connect vertices with edges, close edges into faces, and you have a mesh.</text>

  <!-- Footer tip callout -->
  <rect x="40" y="510" width="720" height="34" rx="6"
        fill="#FF6B00" fill-opacity="0.10"
        stroke="#FF6B00" stroke-opacity="0.4"/>
  <text x="54" y="532" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Press 1, 2, or 3 in Edit Mode to switch between vertex, edge, and face selection.
  </text>
</svg>
