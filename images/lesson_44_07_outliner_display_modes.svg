<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" role="img" aria-labelledby="odm-title odm-desc" color="#222" font-family="'Segoe UI',system-ui,sans-serif">
<title id="odm-title">Outliner display modes</title>
<desc id="odm-desc">The Outliner header dropdown offers five display modes. View Layer is the default organizational view used most of the time. Scenes lists every scene in the file. Blender File shows all data blocks by type for asset management. Data API is a technical Python view. Orphan Data shows unused data blocks for cleanup and purging.</desc>
<text x="440" y="34" text-anchor="middle" font-size="23" font-weight="700" fill="currentColor">Outliner Display Modes</text>
<text x="440" y="58" text-anchor="middle" font-size="13.5" fill="currentColor" opacity="0.75">The dropdown at the top of the Outliner switches what the tree shows</text>

<!-- dropdown header mock -->
<rect x="300" y="80" width="280" height="34" rx="6" fill="#2a2a2a" stroke="#FF6B00" stroke-width="1.5"/>
<text x="318" y="102" font-size="13.5" fill="#d4d4d4">View Layer</text>
<text x="558" y="103" font-size="13" fill="#FF6B00">&#9662;</text>
<line x1="440" y1="114" x2="440" y2="134" stroke="currentColor" stroke-width="1.4"/>

<!-- 5 mode cards: View Layer (brand, default), Scenes, Blender File, Data API, Orphan Data -->
<!-- Card 1 View Layer -->
<g>
<rect x="24" y="140" width="410" height="132" rx="8" fill="#2a2a2a" stroke="#FF6B00" stroke-width="1.5"/>
<rect x="24" y="140" width="6" height="132" rx="3" fill="#FF6B00"/>
<text x="46" y="166" font-size="15.5" font-weight="700" fill="#FF6B00">View Layer</text>
<rect x="330" y="152" width="94" height="20" rx="10" fill="#FF6B00"/>
<text x="377" y="166" text-anchor="middle" font-size="11" font-weight="700" fill="#1e1e1e">DEFAULT</text>
<g fill="#d4d4d4" font-size="12.5">
<text x="46" y="192">Collections &amp; objects in the current view layer</text>
<text x="46" y="214">Standard organizational view</text>
<text x="46" y="236">What you use 90% of the time</text>
<text x="46" y="258">Shows hierarchy: collections, objects, data</text>
</g>
</g>

<!-- Card 2 Scenes -->
<g>
<rect x="446" y="140" width="410" height="132" rx="8" fill="#2a2a2a" stroke="#4A9EFF" stroke-width="1.2"/>
<rect x="446" y="140" width="6" height="132" rx="3" fill="#4A9EFF"/>
<text x="468" y="166" font-size="15.5" font-weight="700" fill="#4A9EFF">Scenes</text>
<g fill="#d4d4d4" font-size="12.5">
<text x="468" y="192">Lists all scenes in the file</text>
<text x="468" y="214">Each scene shown with its contents</text>
<text x="468" y="236">Use when working with multiple scenes</text>
</g>
</g>

<!-- Card 3 Blender File -->
<g>
<rect x="24" y="286" width="410" height="132" rx="8" fill="#2a2a2a" stroke="#4A9EFF" stroke-width="1.2"/>
<rect x="24" y="286" width="6" height="132" rx="3" fill="#4A9EFF"/>
<text x="46" y="312" font-size="15.5" font-weight="700" fill="#4A9EFF">Blender File</text>
<g fill="#d4d4d4" font-size="12.5">
<text x="46" y="338">All data blocks in the file, by type</text>
<text x="46" y="360">Meshes, Materials, Textures, Images&#8230;</text>
<text x="46" y="382">For asset management &amp; finding unused data</text>
<text x="46" y="404">Great for deleting orphaned data blocks</text>
</g>
</g>

<!-- Card 4 Data API -->
<g>
<rect x="446" y="286" width="410" height="132" rx="8" fill="#2a2a2a" stroke="#B47EE8" stroke-width="1.2"/>
<rect x="446" y="286" width="6" height="132" rx="3" fill="#B47EE8"/>
<text x="468" y="312" font-size="15.5" font-weight="700" fill="#B47EE8">Data API</text>
<g fill="#d4d4d4" font-size="12.5">
<text x="468" y="338">Technical view for Python scripting</text>
<text x="468" y="360">Shows the internal data structure</text>
<text x="468" y="382">Advanced &#8212; most artists never need it</text>
</g>
</g>

<!-- Card 5 Orphan Data (full width) -->
<g>
<rect x="24" y="432" width="832" height="118" rx="8" fill="#2a2a2a" stroke="#F5C242" stroke-width="1.4"/>
<rect x="24" y="432" width="6" height="118" rx="3" fill="#F5C242"/>
<text x="46" y="458" font-size="15.5" font-weight="700" fill="#F5C242">Orphan Data</text>
<g fill="#d4d4d4" font-size="12.5">
<text x="46" y="484">Data blocks not used by anything &#8212; unused materials, meshes, textures taking up memory</text>
<text x="46" y="506">Use for file cleanup and optimization</text>
</g>
<rect x="46" y="518" width="470" height="22" rx="11" fill="#1e1e1e" stroke="#F5C242" stroke-width="1"/>
<text x="60" y="533" font-size="12" fill="#F5C242" font-family="'Consolas','Courier New',monospace">Purge orphans:  File &#8594; Clean Up &#8594; Purge</text>
</g>
</svg>
