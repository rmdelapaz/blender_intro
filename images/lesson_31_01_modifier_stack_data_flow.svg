<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="msf-title msf-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="msf-title">Modifier stack data flow</title>
  <desc id="msf-desc">A vertical flowchart showing data flowing sequentially through a Blender modifier stack: the base mesh passes through Mirror, Array, Boolean, Bevel, and Subdivision modifiers in order, each one feeding the next, producing the final visual result.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Modifier stack data flow</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Data passes top to bottom &#183; each modifier feeds the next</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Flow column geometry: boxes centered at x=300, width 320; descriptions to the right -->
  <g stroke="currentColor" opacity="0.3" stroke-width="1.5" stroke-linecap="round">
    <line x1="300" y1="178" x2="300" y2="198"/>
    <line x1="300" y1="246" x2="300" y2="266"/>
    <line x1="300" y1="314" x2="300" y2="334"/>
    <line x1="300" y1="382" x2="300" y2="402"/>
    <line x1="300" y1="450" x2="300" y2="470"/>
    <line x1="300" y1="518" x2="300" y2="538"/>
  </g>
  <!-- Arrowheads on each connector -->
  <g fill="currentColor" opacity="0.3">
    <polygon points="294,192 306,192 300,200"/>
    <polygon points="294,260 306,260 300,268"/>
    <polygon points="294,328 306,328 300,336"/>
    <polygon points="294,396 306,396 300,404"/>
    <polygon points="294,464 306,464 300,472"/>
    <polygon points="294,532 306,532 300,540"/>
  </g>

  <!-- Base mesh -->
  <rect x="140" y="138" width="320" height="40" rx="6" fill="currentColor" opacity="0.08"/>
  <rect x="140" y="138" width="320" height="40" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
  <text x="300" y="163" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor">Base mesh</text>
  <text x="476" y="163" font-size="13" fill="currentColor" opacity="0.6">Source geometry (verts, edges, faces)</text>

  <!-- Modifier 1: Mirror -->
  <rect x="140" y="206" width="320" height="40" rx="6" fill="#FF6B00" fill-opacity="0.10"/>
  <rect x="140" y="206" width="4" height="40" fill="#FF6B00"/>
  <text x="158" y="231" font-size="15" font-weight="600" fill="currentColor">1 &#183; Mirror</text>
  <text x="476" y="231" font-size="13" fill="currentColor" opacity="0.6">Duplicates across an axis</text>

  <!-- Modifier 2: Array -->
  <rect x="140" y="274" width="320" height="40" rx="6" fill="#FF6B00" fill-opacity="0.10"/>
  <rect x="140" y="274" width="4" height="40" fill="#FF6B00"/>
  <text x="158" y="299" font-size="15" font-weight="600" fill="currentColor">2 &#183; Array</text>
  <text x="476" y="299" font-size="13" fill="currentColor" opacity="0.6">Repeats the result in a pattern</text>

  <!-- Modifier 3: Boolean -->
  <rect x="140" y="342" width="320" height="40" rx="6" fill="#FF6B00" fill-opacity="0.10"/>
  <rect x="140" y="342" width="4" height="40" fill="#FF6B00"/>
  <text x="158" y="367" font-size="15" font-weight="600" fill="currentColor">3 &#183; Boolean</text>
  <text x="476" y="367" font-size="13" fill="currentColor" opacity="0.6">Cuts or combines with other meshes</text>

  <!-- Modifier 4: Bevel -->
  <rect x="140" y="410" width="320" height="40" rx="6" fill="#FF6B00" fill-opacity="0.10"/>
  <rect x="140" y="410" width="4" height="40" fill="#FF6B00"/>
  <text x="158" y="435" font-size="15" font-weight="600" fill="currentColor">4 &#183; Bevel</text>
  <text x="476" y="435" font-size="13" fill="currentColor" opacity="0.6">Rounds the new hard edges</text>

  <!-- Modifier 5: Subdivision -->
  <rect x="140" y="478" width="320" height="40" rx="6" fill="#FF6B00" fill-opacity="0.10"/>
  <rect x="140" y="478" width="4" height="40" fill="#FF6B00"/>
  <text x="158" y="503" font-size="15" font-weight="600" fill="currentColor">5 &#183; Subdivision</text>
  <text x="476" y="503" font-size="13" fill="currentColor" opacity="0.6">Smooths the whole result</text>

  <!-- Final result -->
  <rect x="140" y="546" width="320" height="40" rx="6" fill="#FF6B00"/>
  <text x="300" y="571" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Final visual result</text>
  <text x="476" y="571" font-size="13" fill="currentColor" opacity="0.6">Displayed mesh (non-destructive)</text>

  <!-- Footer tip -->
  <rect x="40" y="625" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="625" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="647" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> The base mesh is never changed. Each modifier reads the result above it, so reordering the stack changes the output.
  </text>
</svg>
