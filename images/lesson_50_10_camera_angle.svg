<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="car10-title car10-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="car10-title">Choosing the Camera Angle</title>
  <desc id="car10-desc">Four camera angles arranged as a quadrant chart, each paired with the feeling it creates: a low angle makes the subject powerful, eye level feels neutral and honest, a high angle makes the subject vulnerable, and a dutch tilt creates unease. The angle you pick shapes how the audience reads the subject.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Choosing the Camera Angle</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">The height and tilt of the lens tells the audience how to feel about the subject.</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Low angle -->
  <g>
    <rect x="40" y="150" width="350" height="140" rx="8" fill="currentColor" opacity="0.04"/>
    <rect x="40" y="150" width="4" height="140" fill="#FF6B00"/>
    <!-- subject -->
    <rect x="72" y="196" width="26" height="60" rx="4" fill="currentColor" opacity="0.35"/>
    <circle cx="85" cy="188" r="12" fill="currentColor" opacity="0.35"/>
    <!-- camera below looking up -->
    <rect x="70" y="266" width="30" height="18" rx="3" fill="#FF6B00"/>
    <line x1="85" y1="266" x2="85" y2="210" stroke="#FF6B00" stroke-width="2" stroke-dasharray="5 5"/>
    <polygon points="85,204 80,216 90,216" fill="#FF6B00"/>
    <text x="128" y="184" font-size="16" font-weight="600" fill="#FF6B00">Low angle</text>
    <text x="128" y="206" font-size="13" fill="currentColor" opacity="0.6">Camera looks up</text>
    <text x="128" y="228" font-size="14" font-weight="500" fill="currentColor">Powerful · dominant</text>
    <text x="128" y="250" font-size="12" fill="currentColor" opacity="0.6">Heroes, villains, imposing scale</text>
  </g>

  <!-- Eye level -->
  <g>
    <rect x="410" y="150" width="350" height="140" rx="8" fill="currentColor" opacity="0.04"/>
    <rect x="410" y="150" width="4" height="140" fill="#4ADE80"/>
    <rect x="442" y="188" width="26" height="60" rx="4" fill="currentColor" opacity="0.35"/>
    <circle cx="455" cy="180" r="12" fill="currentColor" opacity="0.35"/>
    <rect x="486" y="200" width="30" height="18" rx="3" fill="#4ADE80"/>
    <line x1="486" y1="209" x2="472" y2="209" stroke="#4ADE80" stroke-width="2" stroke-dasharray="5 5"/>
    <polygon points="466,209 478,204 478,214" fill="#4ADE80"/>
    <text x="540" y="184" font-size="16" font-weight="600" fill="#4ADE80">Eye level</text>
    <text x="540" y="206" font-size="13" fill="currentColor" opacity="0.6">Camera level with subject</text>
    <text x="540" y="228" font-size="14" font-weight="500" fill="currentColor">Neutral · honest</text>
    <text x="540" y="250" font-size="12" fill="currentColor" opacity="0.6">Dialogue, relatable moments</text>
  </g>

  <!-- High angle -->
  <g>
    <rect x="40" y="304" width="350" height="140" rx="8" fill="currentColor" opacity="0.04"/>
    <rect x="40" y="304" width="4" height="140" fill="#4A9EFF"/>
    <rect x="72" y="360" width="26" height="52" rx="4" fill="currentColor" opacity="0.35"/>
    <circle cx="85" cy="352" r="12" fill="currentColor" opacity="0.35"/>
    <rect x="70" y="316" width="30" height="18" rx="3" fill="#4A9EFF"/>
    <line x1="85" y1="334" x2="85" y2="384" stroke="#4A9EFF" stroke-width="2" stroke-dasharray="5 5"/>
    <polygon points="85,390 80,378 90,378" fill="#4A9EFF"/>
    <text x="128" y="338" font-size="16" font-weight="600" fill="#4A9EFF">High angle</text>
    <text x="128" y="360" font-size="13" fill="currentColor" opacity="0.6">Camera looks down</text>
    <text x="128" y="382" font-size="14" font-weight="500" fill="currentColor">Vulnerable · small</text>
    <text x="128" y="404" font-size="12" fill="currentColor" opacity="0.6">Weakness, isolation, defeat</text>
  </g>

  <!-- Dutch tilt -->
  <g>
    <rect x="410" y="304" width="350" height="140" rx="8" fill="currentColor" opacity="0.04"/>
    <rect x="410" y="304" width="4" height="140" fill="#E63946"/>
    <g transform="rotate(-16 468 375)">
      <rect x="455" y="350" width="26" height="52" rx="4" fill="currentColor" opacity="0.35"/>
      <circle cx="468" cy="342" r="12" fill="currentColor" opacity="0.35"/>
    </g>
    <rect x="486" y="360" width="30" height="18" rx="3" fill="#E63946" transform="rotate(-16 501 369)"/>
    <text x="540" y="338" font-size="16" font-weight="600" fill="#E63946">Dutch tilt</text>
    <text x="540" y="360" font-size="13" fill="currentColor" opacity="0.6">Camera rolled off level</text>
    <text x="540" y="382" font-size="14" font-weight="500" fill="currentColor">Unease · tension</text>
    <text x="540" y="404" font-size="12" fill="currentColor" opacity="0.6">Disorientation, danger, chaos</text>
  </g>

  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Pick the angle for the emotion, not the convenience. A default eye-level shot on every clip flattens the whole reel.</text>
</svg>
