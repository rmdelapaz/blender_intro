<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" color="#222" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" role="img" aria-labelledby="q49-t q49-d">
  <title id="q49-t">The ArchViz Quality Ladder: Amateur to Photoreal</title>
  <desc id="q49-d">A left-to-right progression from an amateur render to a professional one, showing the six aspects &#8212; lighting, materials, camera, context, scale, and details &#8212; that each step up the ladder, ending at the benchmark question: could this be mistaken for a photo?</desc>
  <rect x="0" y="0" width="760" height="430" fill="none"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="currentColor">The ArchViz Quality Ladder</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#8a8f98">What separates an amateur render from one you'd mistake for a photo</text>

  <!-- progression arrow track -->
  <defs>
    <marker id="q49-arw" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8a8f98"/></marker>
  </defs>
  <line x1="70" y1="120" x2="690" y2="120" stroke="#8a8f98" stroke-width="2" marker-end="url(#q49-arw)"/>
  <text x="70" y="104" font-size="12.5" font-weight="600" fill="#8a8f98">AMATEUR</text>
  <text x="690" y="104" text-anchor="end" font-size="12.5" font-weight="600" fill="#4ADE80">PHOTOREAL</text>

  <!-- six rungs -->
  <g font-size="13" font-weight="600">
    <g>
      <circle cx="130" cy="120" r="8" fill="#FF6B00"/>
      <text x="130" y="160" text-anchor="middle" fill="currentColor">Lighting</text>
      <text x="130" y="178" text-anchor="middle" font-size="11" font-weight="400" fill="#8a8f98">believable sun</text>
      <text x="130" y="192" text-anchor="middle" font-size="11" font-weight="400" fill="#8a8f98">&amp; soft shadow</text>
    </g>
    <g>
      <circle cx="242" cy="120" r="8" fill="#F5C242"/>
      <text x="242" y="160" text-anchor="middle" fill="currentColor">Materials</text>
      <text x="242" y="178" text-anchor="middle" font-size="11" font-weight="400" fill="#8a8f98">real surface</text>
      <text x="242" y="192" text-anchor="middle" font-size="11" font-weight="400" fill="#8a8f98">wear &amp; variation</text>
    </g>
    <g>
      <circle cx="354" cy="120" r="8" fill="#4A9EFF"/>
      <text x="354" y="160" text-anchor="middle" fill="currentColor">Camera</text>
      <text x="354" y="178" text-anchor="middle" font-size="11" font-weight="400" fill="#8a8f98">right lens,</text>
      <text x="354" y="192" text-anchor="middle" font-size="11" font-weight="400" fill="#8a8f98">level verticals</text>
    </g>
    <g>
      <circle cx="466" cy="120" r="8" fill="#4ADE80"/>
      <text x="466" y="160" text-anchor="middle" fill="currentColor">Context</text>
      <text x="466" y="178" text-anchor="middle" font-size="11" font-weight="400" fill="#8a8f98">sky, ground,</text>
      <text x="466" y="192" text-anchor="middle" font-size="11" font-weight="400" fill="#8a8f98">surroundings</text>
    </g>
    <g>
      <circle cx="578" cy="120" r="8" fill="#B47EE8"/>
      <text x="578" y="160" text-anchor="middle" fill="currentColor">Scale</text>
      <text x="578" y="178" text-anchor="middle" font-size="11" font-weight="400" fill="#8a8f98">human-sized</text>
      <text x="578" y="192" text-anchor="middle" font-size="11" font-weight="400" fill="#8a8f98">proportions</text>
    </g>
    <g>
      <circle cx="668" cy="120" r="8" fill="#E63946"/>
      <text x="668" y="160" text-anchor="middle" fill="currentColor">Details</text>
      <text x="668" y="178" text-anchor="middle" font-size="11" font-weight="400" fill="#8a8f98">imperfections</text>
      <text x="668" y="192" text-anchor="middle" font-size="11" font-weight="400" fill="#8a8f98">that sell it</text>
    </g>
  </g>

  <!-- benchmark bar -->
  <rect x="70" y="248" width="620" height="132" rx="10" fill="#1a1a1a"/>
  <text x="90" y="280" font-size="14" font-weight="700" fill="#e0e0e0">The benchmark</text>
  <text x="90" y="308" font-size="13.5" fill="#c9ccd1">Every rung is a place a render can quietly fail. A great ArchViz image passes</text>
  <text x="90" y="330" font-size="13.5" fill="#c9ccd1">on all six at once &#8212; and then survives one final test:</text>
  <text x="90" y="362" font-size="15" font-weight="700" fill="#4ADE80">&#8220;Could a stranger mistake this for a photograph?&#8221;</text>
</svg>
