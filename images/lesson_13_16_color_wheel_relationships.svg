<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640"
     role="img" aria-labelledby="cw-title cw-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="cw-title">Color wheel showing analogous and complementary relationships</title>
  <desc id="cw-desc">A standard twelve-section color wheel. An orange arc over three adjacent segments (blue, blue-green, green) marks analogous colors, which create harmony. A straight line across the wheel connects orange and blue, two opposite segments, marking complementary colors, which create contrast. A legend below explains both relationships with example swatches.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Color Relationships on the Wheel</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Twelve-section wheel &#183; analogous for harmony &#183; complementary for contrast</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Color wheel -->
  <g transform="translate(0,38)">
    <path d="M 361.18 145.11 A 150 150 0 0 1 438.82 145.11 L 420.19 214.66 A 78 78 0 0 0 379.81 214.66 Z" fill="#FFE000" stroke="#000" stroke-opacity="0.18" stroke-width="1"/>
    <path d="M 438.82 145.11 A 150 150 0 0 1 506.07 183.93 L 455.15 234.85 A 78 78 0 0 0 420.19 214.66 Z" fill="#FFB000" stroke="#000" stroke-opacity="0.18" stroke-width="1"/>
    <path d="M 506.07 183.93 A 150 150 0 0 1 544.89 251.18 L 475.34 269.81 A 78 78 0 0 0 455.15 234.85 Z" fill="#FF7A00" stroke="#000" stroke-opacity="0.18" stroke-width="1"/>
    <path d="M 544.89 251.18 A 150 150 0 0 1 544.89 328.82 L 475.34 310.19 A 78 78 0 0 0 475.34 269.81 Z" fill="#FF3D1F" stroke="#000" stroke-opacity="0.18" stroke-width="1"/>
    <path d="M 544.89 328.82 A 150 150 0 0 1 506.07 396.07 L 455.15 345.15 A 78 78 0 0 0 475.34 310.19 Z" fill="#E81020" stroke="#000" stroke-opacity="0.18" stroke-width="1"/>
    <path d="M 506.07 396.07 A 150 150 0 0 1 438.82 434.89 L 420.19 365.34 A 78 78 0 0 0 455.15 345.15 Z" fill="#C01863" stroke="#000" stroke-opacity="0.18" stroke-width="1"/>
    <path d="M 438.82 434.89 A 150 150 0 0 1 361.18 434.89 L 379.81 365.34 A 78 78 0 0 0 420.19 365.34 Z" fill="#7A2FB0" stroke="#000" stroke-opacity="0.18" stroke-width="1"/>
    <path d="M 361.18 434.89 A 150 150 0 0 1 293.93 396.07 L 344.85 345.15 A 78 78 0 0 0 379.81 365.34 Z" fill="#3A3DBF" stroke="#000" stroke-opacity="0.18" stroke-width="1"/>
    <path d="M 293.93 396.07 A 150 150 0 0 1 255.11 328.82 L 324.66 310.19 A 78 78 0 0 0 344.85 345.15 Z" fill="#1670D8" stroke="#000" stroke-opacity="0.18" stroke-width="1"/>
    <path d="M 255.11 328.82 A 150 150 0 0 1 255.11 251.18 L 324.66 269.81 A 78 78 0 0 0 324.66 310.19 Z" fill="#119C9C" stroke="#000" stroke-opacity="0.18" stroke-width="1"/>
    <path d="M 255.11 251.18 A 150 150 0 0 1 293.93 183.93 L 344.85 234.85 A 78 78 0 0 0 324.66 269.81 Z" fill="#1FA838" stroke="#000" stroke-opacity="0.18" stroke-width="1"/>
    <path d="M 293.93 183.93 A 150 150 0 0 1 361.18 145.11 L 379.81 214.66 A 78 78 0 0 0 344.85 234.85 Z" fill="#9BC215" stroke="#000" stroke-opacity="0.18" stroke-width="1"/>

    <!-- Complementary line: orange to blue across the wheel -->
    <line x1="531.64" y1="214.00" x2="268.36" y2="366.00" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    <line x1="531.64" y1="214.00" x2="268.36" y2="366.00" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="2 5"/>
    <circle cx="531.64" cy="214.00" r="6" fill="none" stroke="currentColor" stroke-width="2.5"/>
    <circle cx="268.36" cy="366.00" r="6" fill="none" stroke="currentColor" stroke-width="2.5"/>

    <!-- Analogous arc over blue / blue-green / green -->
    <path d="M 252.78 375.00 A 170 170 0 0 1 252.78 205.00" fill="none" stroke="#FF6B00" stroke-width="4" stroke-linecap="round"/>
    <line x1="268.36" y1="366.00" x2="252.78" y2="375.00" stroke="#FF6B00" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="248.00" y1="290.00" x2="230.00" y2="290.00" stroke="#FF6B00" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="268.36" y1="214.00" x2="252.78" y2="205.00" stroke="#FF6B00" stroke-width="2.5" stroke-linecap="round"/>
    <text x="212.00" y="295.00" font-size="13" font-weight="700" fill="#FF6B00" text-anchor="end">Analogous</text>

    <!-- center label -->
    <text x="400" y="288" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">12 pure</text>
    <text x="400" y="304" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">hues</text>

    <!-- complementary callout: label top-right with leader to orange endpoint -->
    <text x="660" y="150" font-size="13" font-weight="700" fill="currentColor" text-anchor="middle">Complementary</text>
    <line x1="660" y1="158" x2="535.64" y2="210.00" stroke="currentColor" stroke-width="1" opacity="0.45"/>
  </g>

  <!-- Legend: two stacked blocks -->
  <g transform="translate(40,536)">
    <!-- Analogous -->
    <rect x="0" y="0" width="4" height="40" fill="#FF6B00"/>
    <rect x="16" y="2" width="30" height="20" fill="#1670D8" stroke="currentColor" stroke-opacity="0.25"/>
    <rect x="48" y="2" width="30" height="20" fill="#119C9C" stroke="currentColor" stroke-opacity="0.25"/>
    <rect x="80" y="2" width="30" height="20" fill="#1FA838" stroke="currentColor" stroke-opacity="0.25"/>
    <text x="124" y="12" font-size="14" font-weight="700" fill="currentColor">Analogous &#183; Harmony</text>
    <text x="124" y="32" font-size="12.5" fill="currentColor" opacity="0.8">Adjacent hues. Calm, cohesive, natural. Good for shadows and ambient surfaces.</text>

    <!-- Complementary -->
    <rect x="0" y="52" width="4" height="40" fill="currentColor"/>
    <rect x="16" y="54" width="30" height="20" fill="#FF7A00" stroke="currentColor" stroke-opacity="0.25"/>
    <text x="50" y="69" font-size="14" fill="currentColor">&#8596;</text>
    <rect x="68" y="54" width="30" height="20" fill="#1670D8" stroke="currentColor" stroke-opacity="0.25"/>
    <text x="124" y="64" font-size="14" font-weight="700" fill="currentColor">Complementary &#183; Contrast</text>
    <text x="124" y="84" font-size="12.5" fill="currentColor" opacity="0.8">Opposite hues. Bold, high-energy focal points. Example: orange rust on blue-gray metal.</text>
  </g>
</svg>