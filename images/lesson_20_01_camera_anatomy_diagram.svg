<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="ca-title ca-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="ca-title">Blender camera object anatomy</title>
  <desc id="ca-desc">A 3/4 view of Blender's camera object drawn as a wireframe pyramid. The solid orange frame border marks the rendered image plane, dashed orange lines form the view frustum extending from the camera body, and a small triangle above the frame marks the top of the image. Callouts label the Camera Body, Field of View, Frustum, Frame Border, and Top Indicator.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">CAMERA OBJECT ANATOMY</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">How Blender draws the camera in the 3D viewport</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ============ CAMERA WIREFRAME ============ -->
  <!-- Geometry: apex (camera body) at left, frame plane (trapezoid) at right.
       Apex = (250, 330). Frame plane corners (3/4 perspective):
         TL=(510,228) TR=(690,262) BR=(690,418) BL=(510,452) -->

  <!-- Frustum: dashed lines from apex to each frame corner -->
  <g stroke="#FF6B00" stroke-width="2" stroke-dasharray="7 6" fill="none" opacity="0.9">
    <line x1="250" y1="330" x2="510" y2="228"/>
    <line x1="250" y1="330" x2="690" y2="262"/>
    <line x1="250" y1="330" x2="690" y2="418"/>
    <line x1="250" y1="330" x2="510" y2="452"/>
  </g>

  <!-- Frame border: solid trapezoid = the rendered image plane -->
  <polygon points="510,228 690,262 690,418 510,452"
           fill="#FF6B00" fill-opacity="0.06"
           stroke="#FF6B00" stroke-width="3"/>

  <!-- Top indicator triangle: sits above the top edge of the frame, marks image "up" -->
  <polygon points="588,214 612,214 600,190"
           fill="#FF6B00" stroke="#FF6B00" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Camera body: a small box at the apex, 3/4 view -->
  <g stroke="#FF6B00" stroke-width="2.5" fill="#FF6B00" fill-opacity="0.10" stroke-linejoin="round">
    <!-- front face -->
    <polygon points="214,308 262,308 262,352 214,352"/>
    <!-- top face (depth) -->
    <polygon points="214,308 230,292 278,292 262,308"/>
    <!-- side face (depth) -->
    <polygon points="262,308 278,292 278,336 262,352"/>
  </g>
  <!-- Apex contact dot where frustum lines meet the body -->
  <circle cx="250" cy="330" r="4" fill="#FF6B00"/>

  <!-- ============ CALLOUTS ============ -->
  <!-- connector style -->
  <g stroke="currentColor" stroke-width="1.5" opacity="0.45" stroke-linecap="round">
    <!-- Camera Body -> body box -->
    <line x1="150" y1="408" x2="238" y2="356"/>
    <!-- Field of View -> mid frustum region -->
    <line x1="360" y1="150" x2="400" y2="262"/>
    <!-- Frustum -> a dashed line -->
    <line x1="300" y1="452" x2="372" y2="410"/>
    <!-- Frame Border -> right edge of frame -->
    <line x1="772" y1="396" x2="692" y2="356"/>
    <!-- Top Indicator -> triangle -->
    <line x1="600" y1="138" x2="600" y2="186"/>
  </g>

  <!-- Callout labels -->
  <!-- Camera Body -->
  <text x="150" y="424" font-size="14" font-weight="600" text-anchor="middle" fill="currentColor">Camera Body</text>
  <text x="150" y="442" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.6">The object you select</text>

  <!-- Field of View -->
  <text x="360" y="136" font-size="14" font-weight="600" text-anchor="middle" fill="currentColor">Field of View</text>
  <text x="360" y="154" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.6">Set by focal length</text>

  <!-- Frustum (dashed) -->
  <text x="300" y="470" font-size="14" font-weight="600" text-anchor="middle" fill="currentColor">Frustum (dashed)</text>
  <text x="300" y="488" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.6">The visible volume</text>

  <!-- Frame Border (solid) -->
  <text x="770" y="406" font-size="14" font-weight="600" text-anchor="end" fill="currentColor">Frame Border (solid)</text>
  <text x="770" y="424" font-size="12" text-anchor="end" fill="currentColor" opacity="0.6">What gets rendered</text>

  <!-- Top Indicator -->
  <text x="600" y="124" font-size="14" font-weight="600" text-anchor="middle" fill="currentColor">Top Indicator</text>
  <text x="600" y="142" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.6">Marks image &#8220;up&#8221;</text>

  <!-- ============ FOOTER TIP (Variant B, left rail) ============ -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Press Numpad 0 to look through the active camera &#183; the solid frame is exactly what renders.
  </text>
</svg>
