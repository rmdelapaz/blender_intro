<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" width="760" color="#222" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" role="img" aria-labelledby="pev-t pev-d">
  <title id="pev-t">Portfolio Export and Variation Series</title>
  <desc id="pev-d">Two planning aids for finishing a project &#8212; an export-size matrix pairing common deliverables (hero web image, social square, print, thumbnail) with their target resolution and format, and a variation-series concept showing how one finished scene yields a turntable of angles, alternate colorways, and lighting moods to fill a portfolio from a single build.</desc>
  <rect x="0" y="0" width="760" height="490" fill="none"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="currentColor">Export &amp; Variation Series</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#8a8f98">One finished scene &#8594; many deliverables and portfolio pieces</text>

  <!-- LEFT: export matrix -->
  <g>
    <text x="60" y="90" font-size="14" font-weight="700" fill="#4A9EFF">Export size matrix</text>
    <!-- header -->
    <text x="60" y="116" font-size="11" font-weight="600" fill="#8a8f98">Deliverable</text>
    <text x="230" y="116" font-size="11" font-weight="600" fill="#8a8f98">Resolution</text>
    <text x="330" y="116" font-size="11" font-weight="600" fill="#8a8f98">Format</text>
    <line x1="60" y1="124" x2="380" y2="124" stroke="#666" stroke-width="1"/>
    <g font-size="12" fill="currentColor">
      <rect x="60" y="134" width="10" height="10" fill="#FF6B00"/><text x="78" y="143">Hero / web</text>
      <text x="230" y="143">2560&#215;1440</text><text x="330" y="143" fill="#8a8f98">PNG</text>
      <rect x="60" y="160" width="10" height="10" fill="#4ADE80"/><text x="78" y="169">Social square</text>
      <text x="230" y="169">1080&#215;1080</text><text x="330" y="169" fill="#8a8f98">JPG</text>
      <rect x="60" y="186" width="10" height="10" fill="#B47EE8"/><text x="78" y="195">Print</text>
      <text x="230" y="195">300 DPI TIFF</text><text x="330" y="195" fill="#8a8f98">16-bit</text>
      <rect x="60" y="212" width="10" height="10" fill="#F5C242"/><text x="78" y="221">Thumbnail</text>
      <text x="230" y="221">512&#215;512</text><text x="330" y="221" fill="#8a8f98">JPG</text>
      <rect x="60" y="238" width="10" height="10" fill="#4A9EFF"/><text x="78" y="247">Master</text>
      <text x="230" y="247">EXR full-float</text><text x="330" y="247" fill="#8a8f98">.exr</text>
    </g>
    <text x="60" y="278" font-size="11" fill="#8a8f98">Always keep the EXR master; export</text>
    <text x="60" y="294" font-size="11" fill="#8a8f98">the rest from it, never re-render.</text>
  </g>

  <!-- divider -->
  <line x1="410" y1="80" x2="410" y2="300" stroke="#444" stroke-width="1"/>

  <!-- RIGHT: variation series -->
  <g>
    <text x="440" y="90" font-size="14" font-weight="700" fill="#FF6B00">Variation series from one build</text>
    <!-- turntable -->
    <text x="440" y="120" font-size="12" font-weight="600" fill="currentColor">Turntable angles</text>
    <circle cx="470" cy="150" r="16" fill="#FF6B00" opacity="0.9"/>
    <circle cx="516" cy="150" r="16" fill="#FF6B00" opacity="0.7"/>
    <circle cx="562" cy="150" r="16" fill="#FF6B00" opacity="0.5"/>
    <circle cx="608" cy="150" r="16" fill="#FF6B00" opacity="0.35"/>
    <text x="656" y="154" font-size="11" fill="#8a8f98">0&#176;&#8594;360&#176;</text>
    <!-- colorways -->
    <text x="440" y="196" font-size="12" font-weight="600" fill="currentColor">Colorways (swap base color)</text>
    <rect x="470" y="206" width="30" height="30" rx="5" fill="#1a1a1a"/>
    <rect x="510" y="206" width="30" height="30" rx="5" fill="#E63946"/>
    <rect x="550" y="206" width="30" height="30" rx="5" fill="#4A9EFF"/>
    <rect x="590" y="206" width="30" height="30" rx="5" fill="#4ADE80"/>
    <rect x="630" y="206" width="30" height="30" rx="5" fill="#F5C242"/>
    <!-- lighting moods -->
    <text x="440" y="272" font-size="12" font-weight="600" fill="currentColor">Lighting moods</text>
    <rect x="470" y="282" width="46" height="30" rx="5" fill="#e8ecf2"/>
    <rect x="524" y="282" width="46" height="30" rx="5" fill="#8a8f98"/>
    <rect x="578" y="282" width="46" height="30" rx="5" fill="#1a1a1a"/>
    <text x="470" y="330" font-size="10" fill="#8a8f98">bright</text>
    <text x="524" y="330" font-size="10" fill="#8a8f98">neutral</text>
    <text x="578" y="330" font-size="10" fill="#8a8f98">dramatic</text>
  </g>

  <!-- takeaway -->
  <g>
    <rect x="60" y="360" width="640" height="94" rx="8" fill="#4ADE80" opacity="0.1"/>
    <rect x="60" y="360" width="640" height="94" rx="8" fill="none" stroke="#4ADE80" stroke-width="1.3"/>
    <text x="78" y="388" font-size="13" font-weight="700" fill="#4ADE80">The portfolio multiplier</text>
    <text x="78" y="412" font-size="12" fill="currentColor">One solid scene, re-shot as angles &#215; colorways &#215; moods, becomes a whole product page.</text>
    <text x="78" y="434" font-size="11" fill="#8a8f98">Set up cameras and color/light variants as scenes once, then batch-render overnight.</text>
  </g>
</svg>
