<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="nad-title nad-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="nad-title">Anatomy of a geometry node</title>
  <desc id="nad-desc">A single Set Position node labelled part by part: the header bar with its name and collapse arrow, input sockets on the left (Geometry, Selection, Position, Offset), parameter value fields in the body, and the Geometry output socket on the right. Socket colours indicate data type.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Anatomy of a node</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Every geometry node follows the same layout: inputs left, parameters centre, outputs right</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- The node body -->
  <g>
    <!-- body -->
    <rect x="300" y="200" width="200" height="200" rx="8" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.5"/>
    <!-- header -->
    <rect x="300" y="200" width="200" height="30" rx="8" fill="#4A9EFF" fill-opacity="0.85"/>
    <rect x="300" y="216" width="200" height="14" fill="#4A9EFF" fill-opacity="0.85"/>
    <path d="M 314 210 l 8 0 l -4 7 z" fill="#ffffff"/>
    <text x="332" y="220" font-size="13" font-weight="600" fill="#ffffff">Set Position</text>

    <!-- input sockets (left) -->
    <circle cx="300" cy="252" r="6" fill="#4ADE80"/>
    <text x="314" y="257" font-size="12" fill="currentColor">Geometry</text>
    <circle cx="300" cy="284" r="6" fill="#ffffff" stroke="currentColor" stroke-opacity="0.4" stroke-width="1"/>
    <text x="314" y="289" font-size="12" fill="currentColor">Selection</text>
    <circle cx="300" cy="316" r="6" fill="#B47EE8"/>
    <text x="314" y="321" font-size="12" fill="currentColor">Position</text>
    <circle cx="300" cy="348" r="6" fill="#B47EE8"/>
    <text x="314" y="353" font-size="12" fill="currentColor">Offset</text>

    <!-- parameter field -->
    <rect x="336" y="366" width="128" height="22" rx="4" fill="currentColor" fill-opacity="0.10"/>
    <text x="400" y="381" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.7">X 0.0  Y 0.0  Z 0.0</text>

    <!-- output socket (right) -->
    <circle cx="500" cy="252" r="6" fill="#4ADE80"/>
    <text x="486" y="257" text-anchor="end" font-size="12" fill="currentColor">Geometry</text>
  </g>

  <!-- Labels + leaders -->
  <g stroke="#FF6B00" stroke-width="1.5" fill="none">
    <line x1="400" y1="200" x2="400" y2="150"/>
    <line x1="300" y1="252" x2="180" y2="252"/>
    <line x1="464" y1="377" x2="600" y2="377"/>
    <line x1="500" y1="252" x2="620" y2="252"/>
  </g>
  <text x="400" y="144" text-anchor="middle" font-size="13" font-weight="600" fill="#FF6B00">Header (name + collapse arrow)</text>
  <text x="176" y="248" text-anchor="end" font-size="13" font-weight="600" fill="#FF6B00">Input sockets</text>
  <text x="176" y="266" text-anchor="end" font-size="12" fill="currentColor" opacity="0.6">data flows in</text>
  <text x="624" y="381" font-size="13" font-weight="600" fill="#FF6B00">Parameter fields</text>
  <text x="624" y="248" font-size="13" font-weight="600" fill="#FF6B00">Output socket</text>
  <text x="624" y="266" font-size="12" fill="currentColor" opacity="0.6">result flows out</text>

  <!-- Socket colour key -->
  <text x="40" y="452" font-size="12" fill="currentColor" opacity="0.65">Socket colour = data type:</text>
  <circle cx="236" cy="448" r="6" fill="#4ADE80"/><text x="248" y="452" font-size="12" fill="currentColor">Geometry</text>
  <circle cx="352" cy="448" r="6" fill="#B47EE8"/><text x="364" y="452" font-size="12" fill="currentColor">Vector</text>
  <circle cx="440" cy="448" r="6" fill="#ffffff" stroke="currentColor" stroke-opacity="0.4"/><text x="452" y="452" font-size="12" fill="currentColor">Boolean</text>

  <rect x="40" y="506" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Read any node left to right: what goes in, what it changes, what comes out.</text>
</svg>
