<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="l45f06-t l45f06-d" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" color="#222">
<title id="l45f06-t">Polygon budget by object role</title>
<desc id="l45f06-d">A rough polygon budget scales with how much screen attention an object gets. Background and filler objects stay in the low thousands, mid-ground props sit in the tens of thousands, and hero or close-up objects earn the highest counts. Spending most of the budget on hero geometry keeps scenes efficient.</desc>
<style>
.title{font-size:15px;font-weight:700;}
.sub{font-size:11.5px;fill:#c8c8c8;}
.cat{font-size:13.5px;font-weight:700;}
.val{font-size:13px;font-weight:700;}
.axis{font-size:10.5px;fill:#c8c8c8;}
</style>
<text class="title" x="380" y="40" text-anchor="middle">Spend polygons where the eye lingers</text>
<line x1="180" y1="80" x2="180" y2="316" stroke="#8a8a8a" stroke-width="1.5"/>
<line x1="180" y1="316" x2="712" y2="316" stroke="#8a8a8a" stroke-width="1.5"/>
<g>
<text class="cat" x="168" y="120" text-anchor="end" fill="#4A9EFF">Background</text>
<text class="sub" x="168" y="138" text-anchor="end">walls, distant filler</text>
<rect x="180" y="100" width="70" height="46" rx="5" fill="#4A9EFF"/>
<text class="val" x="262" y="128" fill="#4A9EFF">~ 500&#8211;2K tris</text>
</g>
<g>
<text class="cat" x="168" y="200" text-anchor="end" fill="#F5C242">Mid-ground</text>
<text class="sub" x="168" y="218" text-anchor="end">props, furniture</text>
<rect x="180" y="180" width="240" height="46" rx="5" fill="#F5C242"/>
<text class="val" x="432" y="208" fill="#F5C242">~ 5K&#8211;30K tris</text>
</g>
<g>
<text class="cat" x="168" y="280" text-anchor="end" fill="#FF6B00">Hero / close-up</text>
<text class="sub" x="168" y="298" text-anchor="end">characters, focal object</text>
<rect x="180" y="260" width="470" height="46" rx="5" fill="#FF6B00"/>
<text class="val" x="662" y="288" text-anchor="end" fill="#1e1e1e">~ 50K&#8211;500K+ tris</text>
</g>
<text class="axis" x="180" y="336" text-anchor="middle">low</text>
<text class="axis" x="712" y="336" text-anchor="end">high &#8594; triangle count</text>
<text class="sub" x="446" y="366" text-anchor="middle">Budgets are relative, not fixed &#8212; scale them to your target hardware and frame rate.</text>
</svg>
