<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="dx-title dx-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="dx-title">Diagnosing robotic motion: linear curve versus eased curve</title>
  <desc id="dx-desc">A Graph Editor diagnostic comparison between the same two keyframes. The problem curve is a perfectly straight diagonal line with linear handles, which produces stiff robotic motion that starts and stops instantly. The fixed curve is an S-shaped ease-in/out between the identical keyframes, which produces natural motion. The straight line is drawn in warning red and the eased curve in green.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">DIAGNOSIS &#183; ROBOTIC MOTION</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Symptom: stiff, mechanical movement &#183; Cause: a straight (linear) curve with no easing</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Gridlines -->
  <g stroke="currentColor" stroke-width="1" opacity="0.15">
    <line x1="110" y1="170" x2="110" y2="460"/>
    <line x1="262" y1="170" x2="262" y2="460"/>
    <line x1="415" y1="170" x2="415" y2="460"/>
    <line x1="567" y1="170" x2="567" y2="460"/>
    <line x1="720" y1="170" x2="720" y2="460"/>
    <line x1="110" y1="460" x2="720" y2="460"/>
    <line x1="110" y1="170" x2="720" y2="170"/>
  </g>

  <!-- Axes -->
  <g stroke="currentColor" stroke-width="1.5" opacity="0.4" stroke-linecap="round">
    <line x1="110" y1="170" x2="110" y2="460"/>
    <line x1="110" y1="460" x2="720" y2="460"/>
  </g>

  <!-- Axis labels + ticks -->
  <text x="110" y="478" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">1</text>
  <text x="415" y="478" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">12</text>
  <text x="720" y="478" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">24</text>
  <text x="415" y="500" font-size="13" fill="currentColor" opacity="0.65" text-anchor="middle">Frame (time)</text>
  <text x="98" y="464" font-size="13" fill="currentColor" opacity="0.6" text-anchor="end">0</text>
  <text x="98" y="174" font-size="13" fill="currentColor" opacity="0.6" text-anchor="end">5</text>
  <text x="78" y="315" font-size="13" fill="currentColor" opacity="0.65" text-anchor="middle" transform="rotate(-90 78 315)">Value</text>

  <!-- Shared keyframes: start(110,460) end(720,170). -->

  <!-- PROBLEM: straight linear curve (warning red), dashed to read as "wrong". -->
  <path d="M 110 460 L 720 170"
        fill="none" stroke="#E63946" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 9"/>
  <!-- Linear (vector) handle arms along the line, faint red -->
  <g stroke="#E63946" stroke-width="1.5" opacity="0.5" stroke-linecap="round">
    <line x1="110" y1="460" x2="170" y2="431"/>
    <line x1="720" y1="170" x2="660" y2="199"/>
  </g>

  <!-- FIXED: eased S-curve (green), solid. -->
  <path d="M 110 460 C 360 460 470 170 720 170"
        fill="none" stroke="#4ADE80" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Flat handle arms (green) -->
  <g stroke="#4ADE80" stroke-width="1.5" opacity="0.55" stroke-linecap="round">
    <line x1="110" y1="460" x2="190" y2="460"/>
    <line x1="720" y1="170" x2="640" y2="170"/>
  </g>
  <rect x="184" y="454" width="12" height="12" fill="#4ADE80"/>
  <rect x="634" y="164" width="12" height="12" fill="#4ADE80"/>

  <!-- Shared control-point diamonds (orange, on top) -->
  <g fill="#FF6B00">
    <path d="M 110 449 L 121 460 L 110 471 L 99 460 Z"/>
    <path d="M 720 159 L 731 170 L 720 181 L 709 170 Z"/>
  </g>

  <!-- Problem badge / annotation (warning red) -->
  <line x1="415" y1="315" x2="455" y2="355" stroke="#E63946" stroke-width="1" opacity="0.6" stroke-linecap="round"/>
  <rect x="461" y="345" width="250" height="48" rx="6" fill="#E63946"/>
  <text x="475" y="366" font-size="14" font-weight="700" fill="#ffffff">Problem: straight line</text>
  <text x="475" y="384" font-size="13" fill="#ffffff" opacity="0.92">constant speed, instant start/stop</text>

  <!-- Fix badge / annotation (green) -->
  <line x1="300" y1="392" x2="260" y2="250" stroke="#4ADE80" stroke-width="1" opacity="0.6" stroke-linecap="round"/>
  <rect x="120" y="210" width="245" height="48" rx="6" fill="#4ADE80"/>
  <text x="134" y="231" font-size="14" font-weight="700" fill="#0f1a14">Fix: ease the handles</text>
  <text x="134" y="249" font-size="13" fill="#0f1a14" opacity="0.85">flatten ends so it eases in and out</text>

  <!-- Footer tip -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> A dead-straight curve always reads as robotic. Select the keys and press T &#8250; Bezier to add easing.
  </text>
</svg>
