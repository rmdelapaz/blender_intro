<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" color="#222" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" role="img" aria-labelledby="ks49-t ks49-d">
  <title id="ks49-t">Fixing Keystoning: Tilted Camera vs. Lens Shift</title>
  <desc id="ks49-d">Side by side, a camera tilted up makes a building's vertical edges converge and appear to fall backward, while a shifted (or corrected) camera keeps the verticals parallel and upright &#8212; the rule that architectural verticals must stay vertical.</desc>
  <rect x="0" y="0" width="760" height="400" fill="none"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="currentColor">Keep Verticals Vertical &#8212; Keystone Correction</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#8a8f98">The rule that instantly separates amateur from architectural</text>

  <!-- WRONG: tilted camera -->
  <text x="200" y="94" text-anchor="middle" font-size="13.5" font-weight="700" fill="#E63946">TILTED CAMERA</text>
  <rect x="70" y="106" width="260" height="230" rx="9" fill="#1a1a1a" stroke="#E63946" stroke-width="1.8"/>
  <!-- converging building -->
  <path d="M150,300 L250,300 L228,140 L172,140 Z" fill="none" stroke="#E63946" stroke-width="2"/>
  <line x1="200" y1="300" x2="200" y2="140" stroke="#E63946" stroke-width="0.8" opacity="0.5"/>
  <!-- convergence guides -->
  <line x1="150" y1="300" x2="200" y2="70" stroke="#E63946" stroke-width="0.7" stroke-dasharray="3 4" opacity="0.7"/>
  <line x1="250" y1="300" x2="200" y2="70" stroke="#E63946" stroke-width="0.7" stroke-dasharray="3 4" opacity="0.7"/>
  <!-- camera tilted -->
  <g transform="rotate(-22 200 356)"><rect x="182" y="346" width="36" height="22" rx="3" fill="#1a1a1a" stroke="#E63946" stroke-width="1.5"/></g>
  <text x="200" y="384" text-anchor="middle" font-size="11" fill="#c9ccd1">walls lean in &#8212; building "falls back"</text>

  <!-- RIGHT: shift / corrected -->
  <text x="560" y="94" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4ADE80">SHIFTED / CORRECTED</text>
  <rect x="430" y="106" width="260" height="230" rx="9" fill="#1a1a1a" stroke="#4ADE80" stroke-width="1.8"/>
  <rect x="512" y="140" width="96" height="160" fill="none" stroke="#4ADE80" stroke-width="2"/>
  <line x1="560" y1="140" x2="560" y2="300" stroke="#4ADE80" stroke-width="0.8" opacity="0.5"/>
  <line x1="512" y1="140" x2="512" y2="300" stroke="#4ADE80" stroke-width="0.7" stroke-dasharray="3 4" opacity="0.7"/>
  <line x1="608" y1="140" x2="608" y2="300" stroke="#4ADE80" stroke-width="0.7" stroke-dasharray="3 4" opacity="0.7"/>
  <g><rect x="542" y="346" width="36" height="22" rx="3" fill="#1a1a1a" stroke="#4ADE80" stroke-width="1.5"/></g>
  <text x="560" y="384" text-anchor="middle" font-size="11" fill="#c9ccd1">verticals stay parallel &#8212; reads correct</text>
</svg>
