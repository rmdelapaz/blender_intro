<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="ntxTitle ntxDesc" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" color="#222">
  <title id="ntxTitle">Compositor Node Taxonomy</title>
  <desc id="ntxDesc">The essential compositor nodes grouped by function into five families: Input nodes that bring image data in, Color nodes that adjust tone and hue, Filter nodes that blur sharpen or add effects, Distort nodes that transform or warp geometry, and Output nodes that send the result to the composite or a viewer. Each family is color-coded.</desc>
  <style>
    .hd{fill:currentColor;font-size:19px;font-weight:700;}
    .sub{fill:#9aa4b2;font-size:11px;}
    .gh{fill:#ffffff;font-size:12px;font-weight:700;}
    .it{fill:#d4d4d4;font-size:10.5px;}
    .cap{fill:#9aa4b2;font-size:10px;}
  </style>
  <text x="20" y="34" class="hd">Essential node families</text>
  <text x="20" y="54" class="sub">Every compositor tree is built from five functional groups &#8212; know one node from each and you can wire almost anything.</text>

  <!-- INPUT -->
  <g>
    <rect x="20" y="74" width="140" height="300" rx="7" fill="#1b1b1b" stroke="#4ADE80" stroke-width="2"/>
    <rect x="20" y="74" width="140" height="26" rx="7" fill="#4ADE80"/>
    <text x="30" y="92" class="gh" fill="#14351f">INPUT</text>
    <text x="30" y="126" class="it">Render Layers</text>
    <text x="30" y="148" class="it">Image</text>
    <text x="30" y="170" class="it">Movie Clip</text>
    <text x="30" y="192" class="it">Mask</text>
    <text x="30" y="214" class="it">RGB / Value</text>
    <text x="30" y="360" class="cap">Bring data in</text>
  </g>
  <!-- COLOR -->
  <g>
    <rect x="172" y="74" width="140" height="300" rx="7" fill="#1b1b1b" stroke="#B47EE8" stroke-width="2"/>
    <rect x="172" y="74" width="140" height="26" rx="7" fill="#B47EE8"/>
    <text x="182" y="92" class="gh">COLOR</text>
    <text x="182" y="126" class="it">Color Balance</text>
    <text x="182" y="148" class="it">RGB Curves</text>
    <text x="182" y="170" class="it">Hue/Sat/Value</text>
    <text x="182" y="192" class="it">Bright/Contrast</text>
    <text x="182" y="214" class="it">Mix (Add/Mult)</text>
    <text x="182" y="360" class="cap">Adjust tone &amp; hue</text>
  </g>
  <!-- FILTER -->
  <g>
    <rect x="324" y="74" width="140" height="300" rx="7" fill="#1b1b1b" stroke="#4A9EFF" stroke-width="2"/>
    <rect x="324" y="74" width="140" height="26" rx="7" fill="#4A9EFF"/>
    <text x="334" y="92" class="gh">FILTER</text>
    <text x="334" y="126" class="it">Blur</text>
    <text x="334" y="148" class="it">Glare</text>
    <text x="334" y="170" class="it">Filter (sharpen)</text>
    <text x="334" y="192" class="it">Denoise</text>
    <text x="334" y="214" class="it">Vector Blur</text>
    <text x="334" y="360" class="cap">Blur, sharpen, glow</text>
  </g>
  <!-- DISTORT -->
  <g>
    <rect x="476" y="74" width="140" height="300" rx="7" fill="#1b1b1b" stroke="#F5C242" stroke-width="2"/>
    <rect x="476" y="74" width="140" height="26" rx="7" fill="#F5C242"/>
    <text x="486" y="92" class="gh" fill="#3a2c05">DISTORT</text>
    <text x="486" y="126" class="it">Transform</text>
    <text x="486" y="148" class="it">Translate</text>
    <text x="486" y="170" class="it">Lens Distortion</text>
    <text x="486" y="192" class="it">Crop</text>
    <text x="486" y="214" class="it">Corner Pin</text>
    <text x="486" y="360" class="cap">Move &amp; warp</text>
  </g>
  <!-- OUTPUT -->
  <g>
    <rect x="628" y="74" width="112" height="300" rx="7" fill="#1b1b1b" stroke="#FF6B00" stroke-width="2"/>
    <rect x="628" y="74" width="112" height="26" rx="7" fill="#FF6B00"/>
    <text x="638" y="92" class="gh">OUTPUT</text>
    <text x="638" y="126" class="it">Composite</text>
    <text x="638" y="148" class="it">Viewer</text>
    <text x="638" y="170" class="it">File Output</text>
    <text x="638" y="192" class="it">Split Viewer</text>
    <text x="638" y="360" class="cap">Send result out</text>
  </g>
</svg>
