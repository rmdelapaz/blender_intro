<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="ch-title ch-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="ch-title">How animation channels are organized in the Graph Editor</title>
  <desc id="ch-desc">A tree diagram of the channel list for an animated object. The object expands into three transform groups: Location, Rotation Euler, and Scale. Each group expands into three channels, one per axis: X, Y, and Z. Every channel is colour coded by its axis, with X in red, Y in green, and Z in blue, matching the transform gizmo colours in the viewport. A small sample curve in each channel's axis colour sits beside it.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">THE CHANNEL LIST</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Every animated property is its own channel &#183; grouped by transform, colored by axis</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ===== Tree connectors (straight only, currentColor 0.3) ===== -->
  <g stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.3">
    <!-- Object trunk down to last group (Scale at y=470) -->
    <line x1="72" y1="166" x2="72" y2="470"/>
    <!-- branches to the three groups -->
    <line x1="72" y1="190" x2="106" y2="190"/>
    <line x1="72" y1="330" x2="106" y2="330"/>
    <line x1="72" y1="470" x2="106" y2="470"/>

    <!-- Location sub-trunk to its last leaf (Z at y=270) -->
    <line x1="128" y1="200" x2="128" y2="270"/>
    <line x1="128" y1="230" x2="160" y2="230"/>
    <line x1="128" y1="250" x2="160" y2="250"/>
    <line x1="128" y1="270" x2="160" y2="270"/>

    <!-- Rotation sub-trunk to its last leaf (Z at y=410) -->
    <line x1="128" y1="340" x2="128" y2="410"/>
    <line x1="128" y1="370" x2="160" y2="370"/>
    <line x1="128" y1="390" x2="160" y2="390"/>
    <line x1="128" y1="410" x2="160" y2="410"/>

    <!-- Scale sub-trunk to its last leaf (Z at y=550) -->
    <line x1="128" y1="480" x2="128" y2="550"/>
    <line x1="128" y1="510" x2="160" y2="510"/>
    <line x1="128" y1="530" x2="160" y2="530"/>
    <line x1="128" y1="550" x2="160" y2="550"/>
  </g>

  <!-- ===== Object root ===== -->
  <path transform="translate(56,140)" d="M 4 7 Q 4 5 6 5 L 11 5 L 14 8 L 26 8 Q 28 8 28 10 L 28 22 Q 28 24 26 24 L 6 24 Q 4 24 4 22 Z" fill="#FF6B00"/>
  <text x="96" y="162" font-size="16" font-weight="600" fill="currentColor">Cube</text>
  <text x="150" y="162" font-size="13" fill="currentColor" opacity="0.6" font-style="italic">the animated object</text>

  <!-- ============ GROUP: Location ============ -->
  <text x="116" y="195" font-size="11" fill="currentColor" opacity="0.45">&#9662;</text>
  <text x="134" y="195" font-size="15" font-weight="500" fill="currentColor">Location</text>
  <!-- X leaf -->
  <rect x="160" y="221" width="14" height="14" rx="3" fill="#E63946"/>
  <text x="184" y="235" font-size="14" fill="currentColor">X Location</text>
  <path d="M 320 232 C 340 232 348 224 368 224" fill="none" stroke="#E63946" stroke-width="2" stroke-linecap="round"/>
  <!-- Y leaf -->
  <rect x="160" y="241" width="14" height="14" rx="3" fill="#4ADE80"/>
  <text x="184" y="255" font-size="14" fill="currentColor">Y Location</text>
  <path d="M 320 252 C 340 252 348 244 368 244" fill="none" stroke="#4ADE80" stroke-width="2" stroke-linecap="round"/>
  <!-- Z leaf -->
  <rect x="160" y="261" width="14" height="14" rx="3" fill="#4A9EFF"/>
  <text x="184" y="275" font-size="14" fill="currentColor">Z Location</text>
  <path d="M 320 270 C 336 270 344 254 360 250 C 372 247 380 264 392 264" fill="none" stroke="#4A9EFF" stroke-width="2" stroke-linecap="round"/>

  <!-- ============ GROUP: Rotation Euler ============ -->
  <text x="116" y="335" font-size="11" fill="currentColor" opacity="0.45">&#9662;</text>
  <text x="134" y="335" font-size="15" font-weight="500" fill="currentColor">Rotation Euler</text>
  <!-- X leaf -->
  <rect x="160" y="361" width="14" height="14" rx="3" fill="#E63946"/>
  <text x="184" y="375" font-size="14" fill="currentColor">X Euler Rotation</text>
  <path d="M 320 372 C 340 372 348 364 368 364" fill="none" stroke="#E63946" stroke-width="2" stroke-linecap="round"/>
  <!-- Y leaf -->
  <rect x="160" y="381" width="14" height="14" rx="3" fill="#4ADE80"/>
  <text x="184" y="395" font-size="14" fill="currentColor">Y Euler Rotation</text>
  <path d="M 320 392 C 340 392 348 384 368 384" fill="none" stroke="#4ADE80" stroke-width="2" stroke-linecap="round"/>
  <!-- Z leaf -->
  <rect x="160" y="401" width="14" height="14" rx="3" fill="#4A9EFF"/>
  <text x="184" y="415" font-size="14" fill="currentColor">Z Euler Rotation</text>
  <path d="M 320 412 C 344 412 352 396 376 396 C 388 396 392 404 392 404" fill="none" stroke="#4A9EFF" stroke-width="2" stroke-linecap="round"/>

  <!-- ============ GROUP: Scale ============ -->
  <text x="116" y="475" font-size="11" fill="currentColor" opacity="0.45">&#9662;</text>
  <text x="134" y="475" font-size="15" font-weight="500" fill="currentColor">Scale</text>
  <!-- X leaf -->
  <rect x="160" y="501" width="14" height="14" rx="3" fill="#E63946"/>
  <text x="184" y="515" font-size="14" fill="currentColor">X Scale</text>
  <path d="M 320 512 L 392 512" fill="none" stroke="#E63946" stroke-width="2" stroke-linecap="round"/>
  <!-- Y leaf -->
  <rect x="160" y="521" width="14" height="14" rx="3" fill="#4ADE80"/>
  <text x="184" y="535" font-size="14" fill="currentColor">Y Scale</text>
  <path d="M 320 532 L 392 532" fill="none" stroke="#4ADE80" stroke-width="2" stroke-linecap="round"/>
  <!-- Z leaf -->
  <rect x="160" y="541" width="14" height="14" rx="3" fill="#4A9EFF"/>
  <text x="184" y="555" font-size="14" fill="currentColor">Z Scale</text>
  <path d="M 320 552 C 340 552 348 540 368 540 C 380 540 384 548 392 548" fill="none" stroke="#4A9EFF" stroke-width="2" stroke-linecap="round"/>

  <!-- ===== Axis legend panel (right) ===== -->
  <rect x="470" y="190" width="290" height="200" rx="10" fill="currentColor" opacity="0.04"/>
  <rect x="470" y="190" width="4" height="200" fill="#FF6B00"/>
  <text x="494" y="222" font-size="15" font-weight="700" fill="currentColor">Axis color coding</text>
  <text x="494" y="244" font-size="12.5" fill="currentColor" opacity="0.65">Same colors as the move gizmo</text>
  <!-- X swatch -->
  <rect x="494" y="262" width="18" height="18" rx="4" fill="#E63946"/>
  <text x="522" y="276" font-size="14" font-weight="600" fill="currentColor">X axis</text>
  <text x="586" y="276" font-size="13" fill="currentColor" opacity="0.6">left &#183; right</text>
  <!-- Y swatch -->
  <rect x="494" y="296" width="18" height="18" rx="4" fill="#4ADE80"/>
  <text x="522" y="310" font-size="14" font-weight="600" fill="currentColor">Y axis</text>
  <text x="586" y="310" font-size="13" fill="currentColor" opacity="0.6">forward &#183; back</text>
  <!-- Z swatch -->
  <rect x="494" y="330" width="18" height="18" rx="4" fill="#4A9EFF"/>
  <text x="522" y="344" font-size="14" font-weight="600" fill="currentColor">Z axis</text>
  <text x="586" y="344" font-size="13" fill="currentColor" opacity="0.6">up &#183; down</text>
  <text x="494" y="374" font-size="12.5" fill="currentColor" opacity="0.6">Click a channel to edit just that curve.</text>

  <!-- Footer tip (800x680 variant: y=641 rail, y=663 text) -->
  <rect x="40" y="641" width="720" height="34" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Click the triangle next to a group to collapse it &#183; hide channels you are not editing to cut the clutter.
  </text>
</svg>
