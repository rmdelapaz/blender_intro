<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="car05-title car05-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="car05-title">Anticipation Before Action</title>
  <desc id="car05-desc">A three-pose strip showing anticipation: the character first winds up in the opposite direction of the main action, then springs into the action, then follows through, which makes the main move read clearly.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Anticipation Before Action</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">A small move the opposite way makes the big move read.</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <g>
    <rect x="40" y="150" width="220" height="280" rx="8" fill="currentColor" opacity="0.04"/>
    <text x="150" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#B47EE8">1. Anticipation</text>
    <circle cx="130" cy="240" r="18" fill="none" stroke="currentColor" stroke-width="3"/>
    <path d="M 130 258 L 128 320" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    <path d="M 128 275 L 100 300" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    <path d="M 128 275 L 105 258" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    <path d="M 128 320 L 108 360" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    <path d="M 128 320 L 150 358" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    <path d="M 190 260 L 155 260" stroke="#B47EE8" stroke-width="3" stroke-linecap="round"/>
    <path d="M 165 252 L 155 260 L 165 268" stroke="#B47EE8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="150" y="410" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">Wind up, opposite way</text>
  </g>
  <g>
    <rect x="290" y="150" width="220" height="280" rx="8" fill="currentColor" opacity="0.04"/>
    <text x="400" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#FF6B00">2. Action</text>
    <circle cx="380" cy="235" r="18" fill="none" stroke="currentColor" stroke-width="3"/>
    <path d="M 380 253 L 400 318" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    <path d="M 388 275 L 420 262" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    <path d="M 388 275 L 415 295" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    <path d="M 400 318 L 420 358" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    <path d="M 400 318 L 385 360" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    <path d="M 355 260 L 430 260" stroke="#FF6B00" stroke-width="4" stroke-linecap="round"/>
    <path d="M 418 250 L 432 260 L 418 270" stroke="#FF6B00" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="400" y="410" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">Spring into the move</text>
  </g>
  <g>
    <rect x="540" y="150" width="220" height="280" rx="8" fill="currentColor" opacity="0.04"/>
    <text x="650" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#4A9EFF">3. Settle</text>
    <circle cx="640" cy="238" r="18" fill="none" stroke="currentColor" stroke-width="3"/>
    <path d="M 640 256 L 648 320" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    <path d="M 643 275 L 672 285" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    <path d="M 643 275 L 668 262" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    <path d="M 648 320 L 668 358" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    <path d="M 648 320 L 630 360" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    <text x="650" y="410" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">Overshoot, then settle</text>
  </g>

  <path d="M 262 290 L 288 290" stroke="currentColor" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
  <path d="M 512 290 L 538 290" stroke="currentColor" stroke-width="2" opacity="0.4" stroke-linecap="round"/>

  <g>
    <rect x="40" y="452" width="720" height="40" rx="6" fill="currentColor" opacity="0.04"/>
    <text x="60" y="477" font-size="13" fill="currentColor" opacity="0.8">Without anticipation, an action can pop out of nowhere and the eye misses it. The windup tells the viewer where to look.</text>
  </g>

  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> The bigger the action, the bigger the anticipation it needs to sell it.</text>
</svg>
