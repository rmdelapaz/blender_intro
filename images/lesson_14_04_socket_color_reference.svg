<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="sc-title sc-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="sc-title">Blender shader node socket color reference</title>
  <desc id="sc-desc">A four-row reference chart of Blender node socket colors and the data type each one carries: green sockets are shader data, yellow sockets are color or RGB data, grey sockets are single numeric values, and blue sockets are vector data such as coordinates and normals.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Node Socket Color Guide</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">What each socket color tells you to connect</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Row 1: Green = Shader -->
  <g>
    <circle cx="92" cy="166" r="22" fill="#63C763" stroke="#0f1a14" stroke-width="1.5"/>
    <text x="140" y="160" font-size="17" font-weight="700" fill="currentColor">GREEN</text>
    <text x="140" y="182" font-size="15" font-weight="500" fill="currentColor">Shader Data</text>
    <text x="404" y="172" font-size="13" fill="currentColor" opacity="0.6">Material results: BSDF, Mix Shader, Surface input</text>
  </g>
  <line x1="40" y1="206" x2="760" y2="206" stroke="currentColor" stroke-width="1" opacity="0.12"/>

  <!-- Row 2: Yellow = Color / RGB -->
  <g>
    <circle cx="92" cy="262" r="22" fill="#C7C729" stroke="#0f1a14" stroke-width="1.5"/>
    <text x="140" y="256" font-size="17" font-weight="700" fill="currentColor">YELLOW</text>
    <text x="140" y="278" font-size="15" font-weight="500" fill="currentColor">Color / RGB Data</text>
    <text x="404" y="268" font-size="13" fill="currentColor" opacity="0.6">Colors and textures: Base Color, image textures</text>
  </g>
  <line x1="40" y1="302" x2="760" y2="302" stroke="currentColor" stroke-width="1" opacity="0.12"/>

  <!-- Row 3: Grey = Value -->
  <g>
    <circle cx="92" cy="358" r="22" fill="#A1A1A1" stroke="#0f1a14" stroke-width="1.5"/>
    <text x="140" y="352" font-size="17" font-weight="700" fill="currentColor">GREY</text>
    <text x="140" y="374" font-size="15" font-weight="500" fill="currentColor">Value / Number</text>
    <text x="404" y="364" font-size="13" fill="currentColor" opacity="0.6">Single numbers: Roughness, Metallic, IOR, factors</text>
  </g>
  <line x1="40" y1="398" x2="760" y2="398" stroke="currentColor" stroke-width="1" opacity="0.12"/>

  <!-- Row 4: Blue = Vector -->
  <g>
    <circle cx="92" cy="454" r="22" fill="#6363C7" stroke="#0f1a14" stroke-width="1.5"/>
    <text x="140" y="448" font-size="17" font-weight="700" fill="currentColor">BLUE</text>
    <text x="140" y="470" font-size="15" font-weight="500" fill="currentColor">Vector Data</text>
    <text x="404" y="460" font-size="13" fill="currentColor" opacity="0.6">Directions and coordinates: Normal, Mapping</text>
  </g>

  <!-- Footer tip (Variant B, left rail) -->
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Sockets only connect to matching colors. If a noodle refuses to attach, the data types do not match.
  </text>
</svg>
