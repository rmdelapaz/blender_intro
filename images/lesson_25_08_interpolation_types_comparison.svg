<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="ic-title ic-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="ic-title">Interpolation types comparison</title>
  <desc id="ic-desc">A three-panel comparison of Bezier, Linear, and Constant interpolation. Each panel shows a row of ball positions illustrating spacing and a small graph below it. Bezier bunches the balls at the ends and spreads them in the middle with an S-curve. Linear spaces the balls evenly with a straight line. Constant shows two clustered positions with a stair-step graph.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Interpolation Types</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">How Blender fills the frames between your keyframes</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Panel dividers (vertical) -->
  <g stroke="#FF6B00" stroke-width="2" opacity="0.9">
    <line x1="293" y1="138" x2="293" y2="600"/>
    <line x1="506" y1="138" x2="506" y2="600"/>
  </g>

  <!-- ===== Panel 1: BEZIER (x 40..280) ===== -->
  <text x="160" y="162" font-size="16" font-weight="600" fill="currentColor" text-anchor="middle">BEZIER</text>
  <text x="160" y="182" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">smooth ease in / out</text>
  <!-- motion trail row y=240 ; bunched at ends, spread in middle -->
  <g fill="#FF6B00">
    <circle cx="56" cy="240" r="9"/>
    <circle cx="68" cy="240" r="9" opacity="0.85"/>
    <circle cx="92" cy="240" r="9" opacity="0.7"/>
    <circle cx="160" cy="240" r="9" opacity="0.55"/>
    <circle cx="228" cy="240" r="9" opacity="0.7"/>
    <circle cx="252" cy="240" r="9" opacity="0.85"/>
    <circle cx="264" cy="240" r="9"/>
  </g>
  <!-- mini graph box y 290..420 -->
  <rect x="56" y="290" width="208" height="130" fill="none" stroke="currentColor" stroke-width="1" opacity="0.15"/>
  <path d="M 56 420 C 130 420 190 290 264 290" fill="none" stroke="#4A9EFF" stroke-width="3" stroke-linecap="round"/>
  <text x="160" y="446" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">S-curve</text>

  <!-- ===== Panel 2: LINEAR (x 306..493) ===== -->
  <text x="400" y="162" font-size="16" font-weight="600" fill="currentColor" text-anchor="middle">LINEAR</text>
  <text x="400" y="182" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">constant speed</text>
  <!-- motion trail evenly spaced -->
  <g fill="#FF6B00">
    <circle cx="312" cy="240" r="9"/>
    <circle cx="341" cy="240" r="9" opacity="0.75"/>
    <circle cx="370" cy="240" r="9" opacity="0.75"/>
    <circle cx="400" cy="240" r="9" opacity="0.75"/>
    <circle cx="430" cy="240" r="9" opacity="0.75"/>
    <circle cx="459" cy="240" r="9" opacity="0.75"/>
    <circle cx="488" cy="240" r="9"/>
  </g>
  <rect x="312" y="290" width="176" height="130" fill="none" stroke="currentColor" stroke-width="1" opacity="0.15"/>
  <line x1="312" y1="420" x2="488" y2="290" stroke="#4A9EFF" stroke-width="3" stroke-linecap="round"/>
  <text x="400" y="446" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">straight line</text>

  <!-- ===== Panel 3: CONSTANT (x 519..760) ===== -->
  <text x="640" y="162" font-size="16" font-weight="600" fill="currentColor" text-anchor="middle">CONSTANT</text>
  <text x="640" y="182" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">hold then jump</text>
  <!-- two clustered positions, no trail between -->
  <g fill="#FF6B00">
    <circle cx="552" cy="240" r="9"/>
    <circle cx="728" cy="240" r="9"/>
  </g>
  <text x="640" y="244" font-size="20" fill="currentColor" opacity="0.4" text-anchor="middle">&#8594;</text>
  <rect x="552" y="290" width="176" height="130" fill="none" stroke="currentColor" stroke-width="1" opacity="0.15"/>
  <!-- stair step -->
  <polyline points="552,420 640,420 640,290 728,290" fill="none" stroke="#4A9EFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="640" y="446" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">stair step</text>

  <!-- Shared caption row -->
  <text x="400" y="500" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">Top row: where the ball sits each frame.  Bottom box: the value graph over time.</text>
  <text x="400" y="524" font-size="13" fill="currentColor" text-anchor="middle">Tightly bunched balls = slow.  Wide gaps = fast.</text>

  <!-- Footer tip (Variant B left rail) for 680 variant: y=641 -->
  <rect x="40" y="641" width="720" height="34" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Same two keyframes, three very different motions. The interpolation mode is what sells the feel.
  </text>
</svg>
