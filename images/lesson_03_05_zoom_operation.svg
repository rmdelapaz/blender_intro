<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540"
     role="img" aria-labelledby="zo-title zo-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="zo-title">Zoom: Adjusting Distance to the Scene</title>
  <desc id="zo-desc">An educational diagram of the Blender zoom operation. Three cube wireframes appear in a row at progressively larger sizes, illustrating the same cube viewed from far away, normal working distance, and very close. A bidirectional arrow band underneath labels the direction: scroll wheel rolled away or middle-mouse-button drag upward zooms in, while scrolling toward you or dragging down zooms out. A small scroll wheel icon reinforces the input mapping. Zoom changes only your distance to the scene, not the cube's size in 3D space.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Zoom: Adjusting Distance</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Move closer to see details. Move further to see composition.</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Operation badge -->
  <text x="400" y="142" font-size="15" font-weight="700" fill="#FF6B00" text-anchor="middle" letter-spacing="2">ZOOM</text>
  <text x="400" y="164" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">Scroll Wheel</text>
  <text x="400" y="180" font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">or Ctrl + MMB + Drag</text>

  <!-- ============================================================== -->
  <!-- Three cube sizes in a row, baseline aligned                     -->
  <!-- Baseline (ground line) at y=330                                 -->
  <!-- ============================================================== -->

  <!-- Ground line spanning all three -->
  <line x1="80" y1="330" x2="720" y2="330" stroke="currentColor" stroke-width="1" opacity="0.2" stroke-dasharray="4 3"/>

  <!-- SMALL CUBE (far / zoomed out) at center x=170 -->
  <g stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.7">
    <rect x="158" y="304" width="24" height="24"/>
    <polyline points="158,304 164,298 188,298 182,304"/>
    <polyline points="188,298 188,322 182,328"/>
  </g>
  <text x="170" y="358" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle" opacity="0.7">Far</text>
  <text x="170" y="374" font-size="10" fill="currentColor" text-anchor="middle" opacity="0.55">Zoomed out</text>

  <!-- MEDIUM CUBE (normal distance) at center x=400 -->
  <g stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <rect x="378" y="280" width="44" height="44"/>
    <polyline points="378,280 390,268 434,268 422,280"/>
    <polyline points="434,268 434,312 422,324"/>
  </g>
  <text x="400" y="358" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Normal</text>
  <text x="400" y="374" font-size="10" fill="currentColor" text-anchor="middle" opacity="0.55">Working distance</text>

  <!-- LARGE CUBE (near / zoomed in) at center x=630 -->
  <g stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <rect x="598" y="262" width="64" height="64"/>
    <polyline points="598,262 614,248 678,248 662,262"/>
    <polyline points="678,248 678,312 662,326"/>
  </g>
  <text x="630" y="358" font-size="12" font-weight="600" fill="#FF6B00" text-anchor="middle">Near</text>
  <text x="630" y="374" font-size="10" fill="currentColor" text-anchor="middle" opacity="0.55">Zoomed in</text>

  <!-- ============================================================== -->
  <!-- Bidirectional zoom arrow band                                   -->
  <!-- ============================================================== -->
  <g transform="translate(0, 398)">
    <rect x="80" y="0" width="640" height="32" rx="16"
          fill="#FF6B00" fill-opacity="0.10"
          stroke="#FF6B00" stroke-opacity="0.4" stroke-width="1.5"/>
    <!-- Left arrow (zoom out direction) -->
    <line x1="100" y1="16" x2="140" y2="16" stroke="#FF6B00" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 100 16 L 110 10 L 110 22 Z" fill="#FF6B00"/>
    <text x="160" y="20" font-size="12" font-weight="700" fill="#FF6B00">ZOOM OUT</text>
    <text x="160" y="32" font-size="10" fill="currentColor" opacity="0.6">scroll toward you</text>

    <!-- Right arrow (zoom in direction) -->
    <line x1="660" y1="16" x2="700" y2="16" stroke="#FF6B00" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 700 16 L 690 10 L 690 22 Z" fill="#FF6B00"/>
    <text x="640" y="20" font-size="12" font-weight="700" fill="#FF6B00" text-anchor="end">ZOOM IN</text>
    <text x="640" y="32" font-size="10" fill="currentColor" opacity="0.6" text-anchor="end">scroll away from you</text>
  </g>

  <!-- ===== Inset: scroll wheel diagram (bottom-left) ===== -->
  <g transform="translate(60, 446)">
    <rect x="0" y="0" width="280" height="62" rx="6"
          fill="currentColor" fill-opacity="0.04"
          stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>
    <text x="14" y="20" font-size="11" font-weight="700" fill="currentColor" opacity="0.75" letter-spacing="0.8">INPUT MAPPING</text>
    <!-- Mini scroll wheel -->
    <g transform="translate(50, 42)">
      <rect x="-6" y="-14" width="12" height="28" rx="2" fill="#FF6B00"/>
      <line x1="-4" y1="-8" x2="4" y2="-8" stroke="#fff" stroke-width="0.8" opacity="0.75"/>
      <line x1="-4" y1="-2" x2="4" y2="-2" stroke="#fff" stroke-width="0.8" opacity="0.75"/>
      <line x1="-4" y1="4" x2="4" y2="4" stroke="#fff" stroke-width="0.8" opacity="0.75"/>
      <line x1="-4" y1="10" x2="4" y2="10" stroke="#fff" stroke-width="0.8" opacity="0.75"/>
      <!-- Up/down arrow hints -->
      <path d="M 14 -10 L 9 -4 L 19 -4 Z" fill="#FF6B00" opacity="0.7"/>
      <path d="M 14 10 L 9 4 L 19 4 Z" fill="#FF6B00" opacity="0.7"/>
    </g>
    <text x="80" y="38" font-size="11" fill="currentColor" opacity="0.75">Each scroll click</text>
    <text x="80" y="53" font-size="11" fill="currentColor" opacity="0.75">moves a step.</text>
  </g>

  <!-- ===== Inset: key idea (bottom-right) ===== -->
  <g transform="translate(460, 446)">
    <rect x="0" y="0" width="280" height="62" rx="6"
          fill="currentColor" fill-opacity="0.04"
          stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>
    <text x="14" y="20" font-size="11" font-weight="700" fill="currentColor" opacity="0.75" letter-spacing="0.8">KEY IDEA</text>
    <text x="14" y="40" font-size="12" fill="currentColor" opacity="0.8">The cube's real size never changes.</text>
    <text x="14" y="55" font-size="12" fill="currentColor" opacity="0.8">You just moved closer or further.</text>
  </g>
</svg>
