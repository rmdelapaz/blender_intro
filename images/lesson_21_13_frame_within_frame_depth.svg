<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="ff-title ff-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="ff-title">Frame within a frame creates depth</title>
  <desc id="ff-desc">An exploded view of three stacked layers: a near foreground frame such as a doorway, a sharp subject in the middle ground, and a soft background for context. An arrow shows the three combining into one composition where the foreground frame surrounds the subject.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">FRAME WITHIN A FRAME</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">A near frame around the subject builds layered depth</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ============ Exploded layers (left) ============ -->
  <text x="40" y="138" font-size="15" font-weight="600" fill="currentColor">Three layers</text>

  <!-- Background layer (farthest) -->
  <g>
    <rect x="60" y="160" width="200" height="120" rx="6" fill="#4A9EFF" fill-opacity="0.12" stroke="#4A9EFF" stroke-opacity="0.5"/>
    <!-- soft horizon to read as background -->
    <rect x="60" y="232" width="200" height="48" rx="0" fill="#4A9EFF" fill-opacity="0.10"/>
    <text x="270" y="206" font-size="13" font-weight="600" fill="currentColor">Background</text>
    <text x="270" y="224" font-size="12" fill="currentColor" opacity="0.6">Context, soft, farthest</text>
  </g>

  <!-- Middle layer (subject, sharp) -->
  <g>
    <rect x="60" y="240" width="200" height="120" rx="6" fill="#4ADE80" fill-opacity="0.10" stroke="#4ADE80" stroke-opacity="0.6"/>
    <circle cx="120" cy="300" r="26" fill="#4ADE80"/>
    <text x="270" y="286" font-size="13" font-weight="600" fill="currentColor">Subject</text>
    <text x="270" y="304" font-size="12" fill="currentColor" opacity="0.6">Sharp, in focus, the star</text>
  </g>

  <!-- Foreground frame layer (nearest, dark, soft) -->
  <g>
    <rect x="60" y="320" width="200" height="120" rx="6" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-opacity="0.7"/>
    <!-- doorway/arch cutout glyph -->
    <path d="M 78 432 L 78 360 Q 78 340 120 340 Q 162 340 162 360 L 162 432"
          fill="none" stroke="#FF6B00" stroke-width="8" opacity="0.85"/>
    <text x="270" y="366" font-size="13" font-weight="600" fill="currentColor">Foreground frame</text>
    <text x="270" y="384" font-size="12" fill="currentColor" opacity="0.6">Near, often dark / soft</text>
    <text x="270" y="402" font-size="12" fill="currentColor" opacity="0.6">( doorway, window, branch )</text>
  </g>

  <!-- Combine arrow -->
  <g>
    <line x1="470" y1="300" x2="520" y2="300" stroke="currentColor" stroke-width="3" opacity="0.35" stroke-linecap="round" marker-end="url(#ff-arrow)"/>
    <text x="495" y="288" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">combine</text>
  </g>
  <defs>
    <marker id="ff-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" opacity="0.5"/>
    </marker>
  </defs>

  <!-- ============ Combined result (right) ============ -->
  <text x="540" y="138" font-size="15" font-weight="600" fill="currentColor">Combined</text>
  <g>
    <!-- background fill -->
    <rect x="540" y="160" width="220" height="290" rx="6" fill="#4A9EFF" fill-opacity="0.12" stroke="currentColor" stroke-opacity="0.3"/>
    <!-- soft horizon -->
    <rect x="540" y="330" width="220" height="120" fill="#4A9EFF" fill-opacity="0.08"/>
    <!-- subject, sharp, centered in the opening -->
    <circle cx="650" cy="300" r="34" fill="#4ADE80"/>
    <!-- foreground frame (arch) wrapping the subject -->
    <path d="M 575 450 L 575 250 Q 575 205 650 205 Q 725 205 725 250 L 725 450"
          fill="none" stroke="#FF6B00" stroke-width="22" opacity="0.85"/>
    <text x="650" y="478" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">Frame leads the eye inward to the subject</text>
  </g>

  <!-- Footer tip callout (Variant B, left rail) -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Keep the frame darker and softer than the subject so it surrounds without stealing focus.
  </text>
</svg>
