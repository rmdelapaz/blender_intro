<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" role="img" aria-labelledby="lva-title lva-desc" color="#222" font-family="'Segoe UI',system-ui,sans-serif">
<title id="lva-title">Link versus Append</title>
<desc id="lva-desc">Two ways to bring data from one blend file into another. Link references the data from the source file so it updates when the source changes, ideal for characters, props, and assets reused across multiple scenes. Append copies the data into the current file so it becomes independent and does not update, ideal for final assembly and one-time imports. Both are reached through the File menu.</desc>
<text x="440" y="34" text-anchor="middle" font-size="23" font-weight="700" fill="currentColor">Link vs. Append</text>
<text x="440" y="58" text-anchor="middle" font-size="13.5" fill="currentColor" opacity="0.75">Two ways to pull data from another .blend &#8212; one references, one copies</text>

<!-- shared source file -->
<rect x="360" y="88" width="160" height="60" rx="9" fill="#2a2a2a" stroke="#FF6B00" stroke-width="1.5"/>
<rect x="360" y="88" width="6" height="60" rx="3" fill="#FF6B00"/>
<text x="440" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#FF6B00">Source .blend</text>
<text x="440" y="134" text-anchor="middle" font-size="10.5" fill="#d4d4d4" font-family="'Consolas','Courier New',monospace">Character_Master.blend</text>

<!-- connectors down to the two cards -->
<path d="M400 148 C400 180 250 180 250 208" fill="none" stroke="#4A9EFF" stroke-width="1.6" opacity="0.8"/>
<path d="M480 148 C480 180 630 180 630 208" fill="none" stroke="#F5C242" stroke-width="1.6" opacity="0.8"/>

<!-- LINK card -->
<g>
<rect x="30" y="208" width="400" height="300" rx="10" fill="#2a2a2a" stroke="#4A9EFF" stroke-width="1.4"/>
<rect x="30" y="208" width="6" height="300" rx="3" fill="#4A9EFF"/>
<text x="54" y="240" font-size="18" font-weight="700" fill="#4A9EFF">Link</text>
<text x="410" y="240" text-anchor="end" font-size="11" fill="#4A9EFF" font-family="'Consolas','Courier New',monospace">File &#8594; Link</text>
<rect x="54" y="254" width="352" height="34" rx="6" fill="#1e1e1e"/>
<text x="66" y="276" font-size="12" fill="#d4d4d4">References data from the source file &#8212; a live link</text>
<text x="54" y="312" font-size="12" fill="#4ADE80" font-weight="700">&#10003; Updates when the source changes</text>
<text x="54" y="336" font-size="11.5" fill="#d4d4d4">&#9642; Source stays the single point of truth</text>
<text x="54" y="358" font-size="11.5" fill="#d4d4d4">&#9642; Small file size &#8212; data not duplicated</text>
<text x="54" y="380" font-size="11.5" fill="#E63946" font-weight="700">&#10007; Linked data is not directly editable</text>
<rect x="54" y="398" width="352" height="94" rx="7" fill="#1e1e1e" stroke="#4A9EFF" stroke-width="0.8"/>
<text x="66" y="420" font-size="11.5" fill="#4A9EFF" font-weight="700">Use for:</text>
<text x="66" y="442" font-size="11.5" fill="#d4d4d4">Characters, props &amp; assets used across</text>
<text x="66" y="460" font-size="11.5" fill="#d4d4d4">multiple scenes; fix once, updates everywhere.</text>
<text x="66" y="482" font-size="11" fill="#d4d4d4" opacity="0.85">e.g. one hero rig linked into every shot file</text>
</g>

<!-- APPEND card -->
<g>
<rect x="450" y="208" width="400" height="300" rx="10" fill="#2a2a2a" stroke="#F5C242" stroke-width="1.4"/>
<rect x="450" y="208" width="6" height="300" rx="3" fill="#F5C242"/>
<text x="474" y="240" font-size="18" font-weight="700" fill="#F5C242">Append</text>
<text x="830" y="240" text-anchor="end" font-size="11" fill="#F5C242" font-family="'Consolas','Courier New',monospace">File &#8594; Append</text>
<rect x="474" y="254" width="352" height="34" rx="6" fill="#1e1e1e"/>
<text x="486" y="276" font-size="12" fill="#d4d4d4">Copies data into the current file &#8212; independent</text>
<text x="474" y="312" font-size="12" fill="#4ADE80" font-weight="700">&#10003; Fully editable, self-contained copy</text>
<text x="474" y="336" font-size="11.5" fill="#d4d4d4">&#9642; No dependency on the source file</text>
<text x="474" y="358" font-size="11.5" fill="#d4d4d4">&#9642; Survives moving or archiving the project</text>
<text x="474" y="380" font-size="11.5" fill="#E63946" font-weight="700">&#10007; Won't update when the source changes</text>
<rect x="474" y="398" width="352" height="94" rx="7" fill="#1e1e1e" stroke="#F5C242" stroke-width="0.8"/>
<text x="486" y="420" font-size="11.5" fill="#F5C242" font-weight="700">Use for:</text>
<text x="486" y="442" font-size="11.5" fill="#d4d4d4">Final assembly &amp; one-time imports where</text>
<text x="486" y="460" font-size="11.5" fill="#d4d4d4">you want a frozen, editable copy.</text>
<text x="486" y="482" font-size="11" fill="#d4d4d4" opacity="0.85">e.g. dropping a prop into a scene to tweak it</text>
</g>

<!-- footer rule of thumb -->
<rect x="30" y="522" width="820" height="30" rx="8" fill="#2a2a2a" stroke="currentColor" stroke-width="1"/>
<text x="440" y="542" text-anchor="middle" font-size="12" fill="currentColor">Rule of thumb: <tspan fill="#4A9EFF" font-weight="700">Link</tspan> to reuse and stay in sync &#183; <tspan fill="#F5C242" font-weight="700">Append</tspan> to own an independent copy.</text>
</svg>
