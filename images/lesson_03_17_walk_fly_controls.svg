<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="wf-title wf-desc" color="#222">
  <title id="wf-title">Walk and Fly mode controls, WASD plus mouse look</title>
  <desc id="wf-desc">A keyboard cluster shows W, A, S, D highlighted for forward and strafe, Q and E for down and up, plus Space and Shift. A mouse on the right has curved arrows around it indicating free look in pitch and yaw. Two insets contrast Walk mode and Fly mode.</desc>

  <!-- Orange top strip -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Header -->
  <text x="400" y="48" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="currentColor">Walk and Fly Mode Controls</text>
  <text x="400" y="74" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="currentColor" opacity="0.7">First person navigation with WASD and mouse look</text>

  <!-- Operation badge -->
  <text x="400" y="118" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FF6B00" letter-spacing="1.5">NAVIGATION MODE</text>
  <text x="400" y="142" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="currentColor">Walk &amp; Fly</text>
  <text x="400" y="164" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="currentColor" opacity="0.7">Shift + ` to enter, Tab to switch modes</text>

  <!-- Keyboard cluster header -->
  <text x="225" y="200" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FF6B00" letter-spacing="1.5">KEYBOARD</text>

  <!-- Row 1: Q W E -->
  <rect x="140" y="216" width="50" height="50" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.35" stroke-width="1"/>
  <text x="165" y="248" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="currentColor" opacity="0.85">Q</text>
  <text x="165" y="282" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="currentColor" opacity="0.7">DOWN</text>

  <!-- W highlighted -->
  <rect x="196" y="216" width="50" height="50" rx="6" fill="#FF6B00" fill-opacity="0.18" stroke="#FF6B00" stroke-width="1.5"/>
  <text x="221" y="248" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#FF6B00">W</text>
  <text x="221" y="282" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#FF6B00">FORWARD</text>
  <!-- Arrow up above W -->
  <path d="M 221 209 L 221 196 M 215 202 L 221 196 L 227 202" fill="none" stroke="#FF6B00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="252" y="216" width="50" height="50" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.35" stroke-width="1"/>
  <text x="277" y="248" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="currentColor" opacity="0.85">E</text>
  <text x="277" y="282" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="currentColor" opacity="0.7">UP</text>

  <!-- Row 2: A S D (highlighted) -->
  <rect x="140" y="294" width="50" height="50" rx="6" fill="#FF6B00" fill-opacity="0.18" stroke="#FF6B00" stroke-width="1.5"/>
  <text x="165" y="326" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#FF6B00">A</text>
  <text x="165" y="360" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#FF6B00">STRAFE L</text>
  <!-- Arrow left from A -->
  <path d="M 133 319 L 120 319 M 126 313 L 120 319 L 126 325" fill="none" stroke="#FF6B00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="196" y="294" width="50" height="50" rx="6" fill="#FF6B00" fill-opacity="0.18" stroke="#FF6B00" stroke-width="1.5"/>
  <text x="221" y="326" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#FF6B00">S</text>
  <text x="221" y="360" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#FF6B00">BACK</text>
  <!-- Arrow down below S -->
  <path d="M 221 367 L 221 380 M 215 374 L 221 380 L 227 374" fill="none" stroke="#FF6B00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="252" y="294" width="50" height="50" rx="6" fill="#FF6B00" fill-opacity="0.18" stroke="#FF6B00" stroke-width="1.5"/>
  <text x="277" y="326" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#FF6B00">D</text>
  <text x="277" y="360" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#FF6B00">STRAFE R</text>
  <!-- Arrow right from D -->
  <path d="M 309 319 L 322 319 M 316 313 L 322 319 L 316 325" fill="none" stroke="#FF6B00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Row 3: Space (wide) -->
  <rect x="140" y="378" width="162" height="36" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.35" stroke-width="1"/>
  <text x="221" y="401" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="currentColor" opacity="0.85">Space</text>
  <text x="221" y="430" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="currentColor" opacity="0.7">TELEPORT &#47; JUMP</text>

  <!-- Shift indicator -->
  <rect x="140" y="446" width="78" height="30" rx="5" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.35" stroke-width="1"/>
  <text x="179" y="466" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="currentColor" opacity="0.85">Shift</text>
  <text x="179" y="492" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="currentColor" opacity="0.7">FASTER</text>

  <rect x="224" y="446" width="78" height="30" rx="5" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.35" stroke-width="1"/>
  <text x="263" y="466" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="currentColor" opacity="0.85">Tab</text>
  <text x="263" y="492" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="currentColor" opacity="0.7">TOGGLE MODE</text>

  <!-- Mouse cluster header -->
  <text x="600" y="200" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FF6B00" letter-spacing="1.5">MOUSE LOOK</text>

  <!-- Mouse body -->
  <path d="M 600 224 C 568 224, 552 250, 552 286 L 552 360 C 552 396, 572 416, 600 416 C 628 416, 648 396, 648 360 L 648 286 C 648 250, 632 224, 600 224 Z"
        fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- Mouse top split line -->
  <line x1="600" y1="224" x2="600" y2="296" stroke="currentColor" stroke-opacity="0.35" stroke-width="1"/>

  <!-- Scroll wheel -->
  <rect x="594" y="248" width="12" height="22" rx="6" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-opacity="0.5" stroke-width="1"/>

  <!-- Look arrows around the mouse, curved -->
  <!-- Yaw arc, horizontal (rotation around vertical) -->
  <path d="M 504 320 Q 504 290, 532 280" fill="none" stroke="#4A9EFF" stroke-width="2" stroke-linecap="round"/>
  <path d="M 528 274 L 532 280 L 526 285" fill="none" stroke="#4A9EFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 696 320 Q 696 290, 668 280" fill="none" stroke="#4A9EFF" stroke-width="2" stroke-linecap="round"/>
  <path d="M 672 274 L 668 280 L 674 285" fill="none" stroke="#4A9EFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="488" y="335" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#4A9EFF" letter-spacing="0.5">YAW</text>
  <text x="694" y="335" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#4A9EFF" letter-spacing="0.5">YAW</text>

  <!-- Pitch arrows, vertical -->
  <path d="M 600 200 L 600 218" fill="none" stroke="#B47EE8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 594 206 L 600 200 L 606 206" fill="none" stroke="#B47EE8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 600 440 L 600 422" fill="none" stroke="#B47EE8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 594 434 L 600 440 L 606 434" fill="none" stroke="#B47EE8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="600" y="190" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#B47EE8" letter-spacing="0.5">PITCH UP</text>
  <text x="600" y="458" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#B47EE8" letter-spacing="0.5">PITCH DOWN</text>

  <!-- Insets at y=502 -->
  <rect x="68" y="502" width="320" height="58" rx="8" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>
  <text x="86" y="522" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="currentColor" opacity="0.75" letter-spacing="0.8">WALK MODE</text>
  <text x="86" y="540" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="currentColor" opacity="0.85">Gravity is on, feet on the ground.</text>
  <text x="86" y="554" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="currentColor" opacity="0.85">Best for room scale, archviz tours.</text>

  <rect x="412" y="502" width="320" height="58" rx="8" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>
  <text x="430" y="522" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="currentColor" opacity="0.75" letter-spacing="0.8">FLY MODE</text>
  <text x="430" y="540" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="currentColor" opacity="0.85">No gravity, free float in any direction.</text>
  <text x="430" y="554" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="currentColor" opacity="0.85">Best for scoping large scenes quickly.</text>

  <!-- Footer tip -->
  <rect x="68" y="568" width="664" height="24" rx="6" fill="#FF6B00" fill-opacity="0.10" stroke="#FF6B00" stroke-opacity="0.4" stroke-width="1"/>
  <text x="86" y="584" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="currentColor" opacity="0.85"><tspan font-weight="700" fill="#FF6B00" letter-spacing="1.5">TIP </tspan>Click or press Enter to confirm a new position. Press Esc to bail out and snap back to where you started.</text>
</svg>
