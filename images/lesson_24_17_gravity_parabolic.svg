<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="gp-title gp-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="gp-title">Gravity makes a parabolic arc with even-time spacing</title>
  <desc id="gp-desc">A free-fall throw arc drawn as a parabola between launch and landing on a ground line. Ghost dots placed at even time intervals stay evenly spaced horizontally but bunch together near the apex and spread apart near the ground, showing motion slowing as it rises and speeding up as it falls.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">THE GRAVITY PARABOLA</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Even-time positions bunch at the apex and spread toward the ground</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ground line -->
  <line x1="70" y1="450" x2="730" y2="450" stroke="currentColor" stroke-width="2" opacity="0.5"/>
  <text x="70" y="468" font-size="12" fill="currentColor" opacity="0.6">ground</text>

  <!-- parabola path: launch (90,450) apex (400,170) landing (710,450) -->
  <path d="M 90 450 Q 400 -110 710 450" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round" opacity="0.7"/>

  <!-- even-time ghost dots. x even-spaced; y from parabola y=450 - 280*(1-((x-400)/310)^2) -->
  <!-- computed cy values baked below -->
  <g>
    <circle cx="90"  cy="450" r="6" fill="#FF6B00"/>
    <circle cx="178" cy="314" r="6" fill="#FF6B00"/>
    <circle cx="266" cy="222" r="6" fill="#FF6B00"/>
    <circle cx="354" cy="176" r="6" fill="#FF6B00"/>
    <circle cx="446" cy="176" r="6" fill="#FF6B00"/>
    <circle cx="534" cy="222" r="6" fill="#FF6B00"/>
    <circle cx="622" cy="314" r="6" fill="#FF6B00"/>
    <circle cx="710" cy="450" r="6" fill="#FF6B00"/>
  </g>
  <!-- frame labels -->
  <g font-size="11" fill="currentColor" opacity="0.7">
    <text x="78"  y="442" text-anchor="end">f1</text>
    <text x="166" y="310" text-anchor="end">f3</text>
    <text x="254" y="218" text-anchor="end">f5</text>
    <text x="346" y="172" text-anchor="end">f7</text>
    <text x="454" y="172">f9</text>
    <text x="546" y="218">f11</text>
    <text x="634" y="310">f13</text>
    <text x="722" y="442">f15</text>
  </g>

  <!-- apex pill -->
  <g>
    <rect x="364" y="135" width="72" height="22" rx="11" fill="none" stroke="#FF6B00" stroke-opacity="0.5"/>
    <text x="400" y="150" font-size="12" text-anchor="middle" fill="currentColor">apex</text>
  </g>

  <!-- slowing / speeding up pills -->
  <g>
    <rect x="150" y="345" width="84" height="22" rx="11" fill="none" stroke="currentColor" stroke-opacity="0.35"/>
    <text x="192" y="360" font-size="12" text-anchor="middle" fill="currentColor">slowing</text>
  </g>
  <g>
    <rect x="566" y="345" width="116" height="22" rx="11" fill="none" stroke="currentColor" stroke-opacity="0.35"/>
    <text x="624" y="360" font-size="12" text-anchor="middle" fill="currentColor">speeding up</text>
  </g>

  <!-- vertical spacing brackets: bunched near apex (tight) vs wide near ground -->
  <g stroke="currentColor" stroke-width="1.5" opacity="0.5" stroke-linecap="round">
    <!-- near apex: tight gap f5->f7 -->
    <line x1="310" y1="222" x2="310" y2="176"/>
    <line x1="306" y1="222" x2="314" y2="222"/>
    <line x1="306" y1="176" x2="314" y2="176"/>
    <!-- near ground: wide gap f1->f3 -->
    <line x1="130" y1="450" x2="130" y2="314"/>
    <line x1="126" y1="450" x2="134" y2="450"/>
    <line x1="126" y1="314" x2="134" y2="314"/>
  </g>
  <text x="322" y="204" font-size="10" fill="currentColor" opacity="0.6">tight</text>
  <text x="62" y="388" font-size="10" fill="currentColor" opacity="0.6">wide gap</text>

  <!-- Footer tip Variant B -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Gravity accelerates everything equally &#183; the arc bunches where motion slows, spreads where it speeds up.</text>
</svg>
