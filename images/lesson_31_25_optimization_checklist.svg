<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="opt-title opt-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="opt-title">Stack performance optimization checklist</title>
  <desc id="opt-desc">A ten-item checklist for keeping a modifier stack fast: keep subdivision viewport levels low, use simple Boolean cutters, set cutter display to wire or bounds, disable expensive modifiers while modeling, try the Fast Boolean solver first, keep the stack under about ten modifiers, apply modifiers that will not change, use instances for repeated elements, cache physics simulations, and save often.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Optimization checklist</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Keep a heavy stack responsive while you work</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- 10 rows, height 46, start y=130. checkbox at x=52, label at x=92 -->
  <!-- reusable check: green rounded square + white tick -->

  <!-- Row 1 -->
  <g transform="translate(52,138)">
    <rect width="26" height="26" rx="5" fill="#4ADE80"/>
    <path d="M 6 13 L 11 19 L 20 7" fill="none" stroke="#0f1a14" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="92" y="157" font-size="14" fill="currentColor">Subdivision viewport level kept at 2 or below</text>

  <!-- Row 2 -->
  <g transform="translate(52,184)">
    <rect width="26" height="26" rx="5" fill="#4ADE80"/>
    <path d="M 6 13 L 11 19 L 20 7" fill="none" stroke="#0f1a14" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="92" y="203" font-size="14" fill="currentColor">Boolean cutters are simple, low-poly geometry</text>

  <!-- Row 3 -->
  <g transform="translate(52,230)">
    <rect width="26" height="26" rx="5" fill="#4ADE80"/>
    <path d="M 6 13 L 11 19 L 20 7" fill="none" stroke="#0f1a14" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="92" y="249" font-size="14" fill="currentColor">Cutter objects set to Wire or Bounds display</text>

  <!-- Row 4 -->
  <g transform="translate(52,276)">
    <rect width="26" height="26" rx="5" fill="#4ADE80"/>
    <path d="M 6 13 L 11 19 L 20 7" fill="none" stroke="#0f1a14" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="92" y="295" font-size="14" fill="currentColor">Expensive modifiers disabled in viewport while modeling</text>

  <!-- Row 5 -->
  <g transform="translate(52,322)">
    <rect width="26" height="26" rx="5" fill="#4ADE80"/>
    <path d="M 6 13 L 11 19 L 20 7" fill="none" stroke="#0f1a14" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="92" y="341" font-size="14" fill="currentColor">Boolean solver set to Fast first, Exact only when needed</text>

  <!-- Row 6 -->
  <g transform="translate(52,368)">
    <rect width="26" height="26" rx="5" fill="#4ADE80"/>
    <path d="M 6 13 L 11 19 L 20 7" fill="none" stroke="#0f1a14" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="92" y="387" font-size="14" fill="currentColor">No more than 8 to 10 modifiers in a single stack</text>

  <!-- Row 7 -->
  <g transform="translate(52,414)">
    <rect width="26" height="26" rx="5" fill="#4ADE80"/>
    <path d="M 6 13 L 11 19 L 20 7" fill="none" stroke="#0f1a14" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="92" y="433" font-size="14" fill="currentColor">Stable modifiers applied once they will not change</text>

  <!-- Row 8 -->
  <g transform="translate(52,460)">
    <rect width="26" height="26" rx="5" fill="#4ADE80"/>
    <path d="M 6 13 L 11 19 L 20 7" fill="none" stroke="#0f1a14" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="92" y="479" font-size="14" fill="currentColor">Instances used for repeated elements instead of copies</text>

  <!-- Row 9 -->
  <g transform="translate(52,506)">
    <rect width="26" height="26" rx="5" fill="#4ADE80"/>
    <path d="M 6 13 L 11 19 L 20 7" fill="none" stroke="#0f1a14" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="92" y="525" font-size="14" fill="currentColor">Physics simulations baked or cached</text>

  <!-- Row 10 -->
  <g transform="translate(52,552)">
    <rect width="26" height="26" rx="5" fill="#4ADE80"/>
    <path d="M 6 13 L 11 19 L 20 7" fill="none" stroke="#0f1a14" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="92" y="571" font-size="14" fill="currentColor">Saved regularly, before and after heavy operations</text>

  <line x1="40" y1="600" x2="760" y2="600" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Footer tip -->
  <rect x="40" y="625" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="625" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="647" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Toggle the viewport eye on expensive modifiers to model at full speed, then re-enable before rendering.
  </text>
</svg>
