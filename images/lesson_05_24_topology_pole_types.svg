<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 800 560"
     color="#222"
     role="img"
     aria-labelledby="tl-title tl-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="tl-title">Topology Poles</title>
  <desc id="tl-desc">Four-panel grid showing 3-pole, 4-pole, 5-pole, and 6-pole vertices with color-coded acceptability. 4-pole is the ideal regular vertex; 3-pole and 5-pole are acceptable in transitions; 6-pole and higher should be avoided.</desc>

  <!-- Top accent rail -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Header band -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Topology Poles</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Vertices where N edges meet, with N other than 4</text>
  <line x1="120" y1="108" x2="680" y2="108" stroke="currentColor" stroke-opacity="0.25"/>
  <text x="400" y="138" font-size="15" font-weight="700" fill="#FF6B00" text-anchor="middle" letter-spacing="2">POLE COUNT · ACCEPTABILITY</text>

  <!-- Panel 1: 3-pole (green, OK) -->
  <g>
    <rect x="35" y="170" width="170" height="230" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.25"/>
    <rect x="35" y="170" width="170" height="26" fill="#4ADE80"/>
    <text x="120" y="190" font-size="14" font-weight="700" fill="#0f1a14" text-anchor="middle">OK</text>
    <!-- Edges from center to 3 peripheral dots -->
    <line x1="120" y1="280" x2="120" y2="225" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5"/>
    <line x1="120" y1="280" x2="167.63" y2="307.5" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5"/>
    <line x1="120" y1="280" x2="72.37" y2="307.5" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5"/>
    <!-- Peripheral dots (2-layer) -->
    <circle cx="120" cy="225" r="6" fill="currentColor" fill-opacity="0.20"/>
    <circle cx="120" cy="225" r="3.5" fill="currentColor"/>
    <circle cx="167.63" cy="307.5" r="6" fill="currentColor" fill-opacity="0.20"/>
    <circle cx="167.63" cy="307.5" r="3.5" fill="currentColor"/>
    <circle cx="72.37" cy="307.5" r="6" fill="currentColor" fill-opacity="0.20"/>
    <circle cx="72.37" cy="307.5" r="3.5" fill="currentColor"/>
    <!-- Central vertex glyph (3-layer) -->
    <circle cx="120" cy="280" r="8" fill="#FF6B00" fill-opacity="0.20"/>
    <circle cx="120" cy="280" r="5" fill="#FF6B00"/>
    <circle cx="120" cy="280" r="1.5" fill="white"/>
    <!-- Panel label -->
    <text x="120" y="365" font-size="13" font-weight="700" fill="currentColor" text-anchor="middle">3-POLE</text>
    <text x="120" y="383" font-size="11" fill="currentColor" opacity="0.75" font-style="italic" text-anchor="middle">Common in transitions</text>
  </g>

  <!-- Panel 2: 4-pole (green, BEST) -->
  <g>
    <rect x="220" y="170" width="170" height="230" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.25"/>
    <rect x="220" y="170" width="170" height="26" fill="#4ADE80"/>
    <text x="305" y="190" font-size="14" font-weight="700" fill="#0f1a14" text-anchor="middle">BEST</text>
    <!-- Edges -->
    <line x1="305" y1="280" x2="305" y2="225" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5"/>
    <line x1="305" y1="280" x2="360" y2="280" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5"/>
    <line x1="305" y1="280" x2="305" y2="335" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5"/>
    <line x1="305" y1="280" x2="250" y2="280" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5"/>
    <!-- Peripheral dots -->
    <circle cx="305" cy="225" r="6" fill="currentColor" fill-opacity="0.20"/>
    <circle cx="305" cy="225" r="3.5" fill="currentColor"/>
    <circle cx="360" cy="280" r="6" fill="currentColor" fill-opacity="0.20"/>
    <circle cx="360" cy="280" r="3.5" fill="currentColor"/>
    <circle cx="305" cy="335" r="6" fill="currentColor" fill-opacity="0.20"/>
    <circle cx="305" cy="335" r="3.5" fill="currentColor"/>
    <circle cx="250" cy="280" r="6" fill="currentColor" fill-opacity="0.20"/>
    <circle cx="250" cy="280" r="3.5" fill="currentColor"/>
    <!-- Central vertex glyph -->
    <circle cx="305" cy="280" r="8" fill="#FF6B00" fill-opacity="0.20"/>
    <circle cx="305" cy="280" r="5" fill="#FF6B00"/>
    <circle cx="305" cy="280" r="1.5" fill="white"/>
    <!-- Panel label -->
    <text x="305" y="365" font-size="13" font-weight="700" fill="currentColor" text-anchor="middle">4-POLE</text>
    <text x="305" y="383" font-size="11" fill="currentColor" opacity="0.75" font-style="italic" text-anchor="middle">Regular: the ideal</text>
  </g>

  <!-- Panel 3: 5-pole (yellow, OK) -->
  <g>
    <rect x="405" y="170" width="170" height="230" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.25"/>
    <rect x="405" y="170" width="170" height="26" fill="#F5C242"/>
    <text x="490" y="190" font-size="14" font-weight="700" fill="#0f1a14" text-anchor="middle">OK</text>
    <!-- Edges -->
    <line x1="490" y1="280" x2="490" y2="225" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5"/>
    <line x1="490" y1="280" x2="542.32" y2="263.01" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5"/>
    <line x1="490" y1="280" x2="522.32" y2="324.49" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5"/>
    <line x1="490" y1="280" x2="457.68" y2="324.49" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5"/>
    <line x1="490" y1="280" x2="437.68" y2="263.01" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5"/>
    <!-- Peripheral dots -->
    <circle cx="490" cy="225" r="6" fill="currentColor" fill-opacity="0.20"/>
    <circle cx="490" cy="225" r="3.5" fill="currentColor"/>
    <circle cx="542.32" cy="263.01" r="6" fill="currentColor" fill-opacity="0.20"/>
    <circle cx="542.32" cy="263.01" r="3.5" fill="currentColor"/>
    <circle cx="522.32" cy="324.49" r="6" fill="currentColor" fill-opacity="0.20"/>
    <circle cx="522.32" cy="324.49" r="3.5" fill="currentColor"/>
    <circle cx="457.68" cy="324.49" r="6" fill="currentColor" fill-opacity="0.20"/>
    <circle cx="457.68" cy="324.49" r="3.5" fill="currentColor"/>
    <circle cx="437.68" cy="263.01" r="6" fill="currentColor" fill-opacity="0.20"/>
    <circle cx="437.68" cy="263.01" r="3.5" fill="currentColor"/>
    <!-- Central vertex glyph -->
    <circle cx="490" cy="280" r="8" fill="#FF6B00" fill-opacity="0.20"/>
    <circle cx="490" cy="280" r="5" fill="#FF6B00"/>
    <circle cx="490" cy="280" r="1.5" fill="white"/>
    <!-- Panel label -->
    <text x="490" y="365" font-size="13" font-weight="700" fill="currentColor" text-anchor="middle">5-POLE</text>
    <text x="490" y="383" font-size="11" fill="currentColor" opacity="0.75" font-style="italic" text-anchor="middle">E-pole: manageable</text>
  </g>

  <!-- Panel 4: 6-pole (red, AVOID) -->
  <g>
    <rect x="590" y="170" width="170" height="230" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.25"/>
    <rect x="590" y="170" width="170" height="26" fill="#E63946"/>
    <text x="675" y="190" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">AVOID</text>
    <!-- Edges -->
    <line x1="675" y1="280" x2="675" y2="225" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5"/>
    <line x1="675" y1="280" x2="722.63" y2="252.5" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5"/>
    <line x1="675" y1="280" x2="722.63" y2="307.5" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5"/>
    <line x1="675" y1="280" x2="675" y2="335" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5"/>
    <line x1="675" y1="280" x2="627.37" y2="307.5" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5"/>
    <line x1="675" y1="280" x2="627.37" y2="252.5" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5"/>
    <!-- Peripheral dots -->
    <circle cx="675" cy="225" r="6" fill="currentColor" fill-opacity="0.20"/>
    <circle cx="675" cy="225" r="3.5" fill="currentColor"/>
    <circle cx="722.63" cy="252.5" r="6" fill="currentColor" fill-opacity="0.20"/>
    <circle cx="722.63" cy="252.5" r="3.5" fill="currentColor"/>
    <circle cx="722.63" cy="307.5" r="6" fill="currentColor" fill-opacity="0.20"/>
    <circle cx="722.63" cy="307.5" r="3.5" fill="currentColor"/>
    <circle cx="675" cy="335" r="6" fill="currentColor" fill-opacity="0.20"/>
    <circle cx="675" cy="335" r="3.5" fill="currentColor"/>
    <circle cx="627.37" cy="307.5" r="6" fill="currentColor" fill-opacity="0.20"/>
    <circle cx="627.37" cy="307.5" r="3.5" fill="currentColor"/>
    <circle cx="627.37" cy="252.5" r="6" fill="currentColor" fill-opacity="0.20"/>
    <circle cx="627.37" cy="252.5" r="3.5" fill="currentColor"/>
    <!-- Central vertex glyph -->
    <circle cx="675" cy="280" r="8" fill="#FF6B00" fill-opacity="0.20"/>
    <circle cx="675" cy="280" r="5" fill="#FF6B00"/>
    <circle cx="675" cy="280" r="1.5" fill="white"/>
    <!-- Panel label -->
    <text x="675" y="365" font-size="13" font-weight="700" fill="currentColor" text-anchor="middle">6-POLE</text>
    <text x="675" y="383" font-size="11" fill="currentColor" opacity="0.75" font-style="italic" text-anchor="middle">Causes artifacts</text>
  </g>

  <!-- Property pills row -->
  <g>
    <!-- Pill 1: BEST -->
    <rect x="50" y="425" width="220" height="40" rx="6" fill="currentColor" fill-opacity="0.04" stroke="#FF6B00" stroke-width="1" stroke-opacity="0.5"/>
    <text x="160" y="443" font-size="11" font-weight="700" fill="#FF6B00" text-anchor="middle" letter-spacing="1">BEST</text>
    <text x="160" y="459" font-size="12" fill="currentColor" opacity="0.85" text-anchor="middle">4-pole vertex</text>
    <!-- Pill 2: OK -->
    <rect x="290" y="425" width="220" height="40" rx="6" fill="currentColor" fill-opacity="0.04" stroke="#FF6B00" stroke-width="1" stroke-opacity="0.5"/>
    <text x="400" y="443" font-size="11" font-weight="700" fill="#FF6B00" text-anchor="middle" letter-spacing="1">OK</text>
    <text x="400" y="459" font-size="12" fill="currentColor" opacity="0.85" text-anchor="middle">3-pole, 5-pole</text>
    <!-- Pill 3: AVOID -->
    <rect x="530" y="425" width="220" height="40" rx="6" fill="currentColor" fill-opacity="0.04" stroke="#FF6B00" stroke-width="1" stroke-opacity="0.5"/>
    <text x="640" y="443" font-size="11" font-weight="700" fill="#FF6B00" text-anchor="middle" letter-spacing="1">AVOID</text>
    <text x="640" y="459" font-size="12" fill="currentColor" opacity="0.85" text-anchor="middle">6 or more pole</text>
  </g>

  <!-- Italic takeaway -->
  <text x="400" y="490" font-size="13" fill="currentColor" opacity="0.75" font-style="italic" text-anchor="middle">Most production meshes have a few poles; the goal is to minimize them, especially 6-plus pole vertices.</text>

  <!-- Footer tip card -->
  <rect x="40" y="506" width="720" height="34" rx="4" fill="currentColor" fill-opacity="0.04" stroke="#FF6B00" stroke-opacity="0.4"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="60" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Use Select &gt; All by Trait &gt; Faces by Sides to find pole-related polygons in any mesh.</text>
</svg>
