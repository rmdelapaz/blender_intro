<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="l45f04-t l45f04-d" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" color="#222">
<title id="l45f04-t">Simplify: separate viewport and render detail</title>
<desc id="l45f04-d">The Simplify panel sets two independent levels. A low viewport level keeps editing fast by capping subdivision and child particles while you work, while a high render level restores full detail only at final output. The same scene is shown light in the viewport and full at render.</desc>
<style>
.title{font-size:16px;font-weight:700;}
.sub{font-size:12px;fill:#c8c8c8;}
.cardbg{fill:#2a2a2a;}
.lab{font-size:12.5px;font-weight:700;}
.val{font-size:13px;font-weight:700;}
.small{font-size:11px;fill:#c8c8c8;}
</style>
<text class="title" x="380" y="42" text-anchor="middle">One Simplify panel, two independent levels</text>
<g>
<rect class="cardbg" x="48" y="72" width="300" height="230" rx="12" stroke="#4A9EFF" stroke-width="2"/>
<text class="lab" x="198" y="102" text-anchor="middle" fill="#4A9EFF">While editing (Viewport)</text>
<rect x="90" y="122" width="216" height="120" rx="6" fill="#1e1e1e"/>
<g stroke="#4A9EFF" stroke-width="1.5" fill="none">
<circle cx="198" cy="182" r="46"/>
<path d="M152,182 L244,182 M198,136 L198,228 M166,150 L230,214 M230,150 L166,214"/>
</g>
<text class="small" x="198" y="262" text-anchor="middle">coarse subdivision, fewer particles</text>
<rect x="90" y="272" width="216" height="22" rx="5" fill="#4A9EFF"/>
<text class="val" x="198" y="288" text-anchor="middle" fill="#1e1e1e">Max Subdiv: 1</text>
</g>
<g>
<rect class="cardbg" x="412" y="72" width="300" height="230" rx="12" stroke="#FF6B00" stroke-width="2"/>
<text class="lab" x="562" y="102" text-anchor="middle" fill="#FF6B00">At final output (Render)</text>
<rect x="454" y="122" width="216" height="120" rx="6" fill="#1e1e1e"/>
<g stroke="#FF6B00" stroke-width="0.8" fill="none" opacity="0.9">
<circle cx="562" cy="182" r="46"/><circle cx="562" cy="182" r="36"/><circle cx="562" cy="182" r="26"/><circle cx="562" cy="182" r="16"/>
<path d="M516,182 L608,182 M562,136 L562,228 M528,148 L596,216 M596,148 L528,216 M540,140 L584,224 M584,140 L540,224"/>
</g>
<text class="small" x="562" y="262" text-anchor="middle">full subdivision, all particles</text>
<rect x="454" y="272" width="216" height="22" rx="5" fill="#FF6B00"/>
<text class="val" x="562" y="288" text-anchor="middle" fill="#1e1e1e">Max Subdiv: 6</text>
</g>
<line x1="348" y1="187" x2="410" y2="187" stroke="#8a8a8a" stroke-width="2.5" marker-end="url(#a4)"/>
<defs><marker id="a4" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8a8a8a"/></marker></defs>
<text class="sub" x="380" y="336" text-anchor="middle">Editing stays fast; the render still gets every detail &#8212; no manual toggling.</text>
</svg>
