<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="sr-title sr-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="sr-title">Sun light emits parallel rays</title>
  <desc id="sr-desc">A sun light source casts straight parallel rays across the whole scene at a single angle, so objects near and far receive light from the same direction with no divergence and no falloff with distance.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">SUN LIGHT &#183; PARALLEL RAYS</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Rays travel in one direction at the same angle, no matter how far the object sits</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Sun glyph, top-left -->
  <g>
    <circle cx="120" cy="180" r="30" fill="#FF6B00"/>
    <g stroke="#FF6B00" stroke-width="4" stroke-linecap="round">
      <line x1="120" y1="128" x2="120" y2="142"/>
      <line x1="120" y1="218" x2="120" y2="232"/>
      <line x1="68" y1="180" x2="82" y2="180"/>
      <line x1="158" y1="180" x2="172" y2="180"/>
      <line x1="83" y1="143" x2="93" y2="153"/>
      <line x1="147" y1="207" x2="157" y2="217"/>
      <line x1="157" y1="143" x2="147" y2="153"/>
      <line x1="93" y1="207" x2="83" y2="217"/>
    </g>
    <text x="120" y="266" font-size="14" font-weight="600" fill="#FF6B00" text-anchor="middle">Sun</text>
    <text x="120" y="286" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">(infinitely far)</text>
  </g>

  <!-- Arrowhead marker for the parallel rays -->
  <defs>
    <marker id="sr-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- Parallel rays: six rays all at the SAME angle (dx=160, dy=120), evenly offset -->
  <g stroke="currentColor" stroke-width="2" opacity="0.55" marker-end="url(#sr-arrow)">
    <line x1="210" y1="150" x2="370" y2="270"/>
    <line x1="300" y1="150" x2="460" y2="270"/>
    <line x1="390" y1="150" x2="550" y2="270"/>
    <line x1="480" y1="150" x2="640" y2="270"/>
    <line x1="570" y1="150" x2="730" y2="270"/>
    <line x1="210" y1="240" x2="370" y2="360"/>
    <line x1="300" y1="240" x2="460" y2="360"/>
    <line x1="390" y1="240" x2="550" y2="360"/>
    <line x1="480" y1="240" x2="640" y2="360"/>
    <line x1="570" y1="240" x2="730" y2="360"/>
  </g>

  <!-- Objects at different distances from the sun, all receiving the same-angle rays -->
  <!-- Near object (closer to sun glyph) -->
  <g>
    <rect x="350" y="372" width="64" height="64" rx="6" fill="currentColor" opacity="0.18"/>
    <rect x="350" y="372" width="64" height="64" rx="6" fill="none" stroke="currentColor" stroke-width="2" opacity="0.55"/>
    <text x="382" y="458" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">near</text>
  </g>
  <!-- Far object (further away) -->
  <g>
    <rect x="600" y="372" width="64" height="64" rx="6" fill="currentColor" opacity="0.18"/>
    <rect x="600" y="372" width="64" height="64" rx="6" fill="none" stroke="currentColor" stroke-width="2" opacity="0.55"/>
    <text x="632" y="458" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">far</text>
  </g>

  <!-- Equal-angle callout: same incidence angle on both objects -->
  <text x="400" y="492" font-size="14" font-weight="600" fill="currentColor" text-anchor="middle">Same angle on every surface &#183; no divergence &#183; no falloff with distance</text>

  <!-- Footer tip (Variant B, left rail) -->
  <rect x="40" y="506" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Only the Sun's rotation changes the ray direction. Moving it closer or farther does nothing.
  </text>
</svg>
