<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="gm-title gm-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="gm-title">Fixed Mindset versus Growth Mindset</title>
  <desc id="gm-desc">A two-column comparison showing fixed mindset thoughts on the left, marked with red X icons, versus growth mindset thoughts on the right, marked with green checkmarks. Pairs include: "I cannot do this" versus "I cannot do this yet"; "I am not creative" versus "I am building my creative thinking"; "Talented people do not struggle" versus "Struggle is how skills grow"; "Mistakes mean I am failing" versus "Mistakes show what to improve next".</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Fixed vs. Growth Mindset</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">The thoughts you choose decide whether you improve.</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Column separator -->
  <line x1="400" y1="140" x2="400" y2="470" stroke="currentColor" stroke-width="1" opacity="0.12"/>

  <!-- ==== LEFT: FIXED MINDSET ==== -->
  <text x="200" y="148" font-size="12" font-weight="700" fill="#FF7E7E" opacity="0.9" letter-spacing="1.5" text-anchor="middle">FIXED MINDSET</text>
  <text x="200" y="172" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">Familiar? Time to reframe.</text>

  <!-- Fixed statement 1 -->
  <g transform="translate(60, 230)">
    <circle cx="11" cy="0" r="11" fill="none" stroke="#FF7E7E" stroke-width="1.5" opacity="0.6"/>
    <path d="M 6 -5 L 16 5 M 16 -5 L 6 5" stroke="#FF7E7E" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="92" y="234" font-size="14" fill="currentColor" opacity="0.55">&#8220;I can&#8217;t do this.&#8221;</text>

  <!-- Fixed statement 2 -->
  <g transform="translate(60, 285)">
    <circle cx="11" cy="0" r="11" fill="none" stroke="#FF7E7E" stroke-width="1.5" opacity="0.6"/>
    <path d="M 6 -5 L 16 5 M 16 -5 L 6 5" stroke="#FF7E7E" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="92" y="289" font-size="14" fill="currentColor" opacity="0.55">&#8220;I&#8217;m not a creative person.&#8221;</text>

  <!-- Fixed statement 3 -->
  <g transform="translate(60, 340)">
    <circle cx="11" cy="0" r="11" fill="none" stroke="#FF7E7E" stroke-width="1.5" opacity="0.6"/>
    <path d="M 6 -5 L 16 5 M 16 -5 L 6 5" stroke="#FF7E7E" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="92" y="344" font-size="14" fill="currentColor" opacity="0.55">&#8220;Talented people don&#8217;t struggle.&#8221;</text>

  <!-- Fixed statement 4 -->
  <g transform="translate(60, 395)">
    <circle cx="11" cy="0" r="11" fill="none" stroke="#FF7E7E" stroke-width="1.5" opacity="0.6"/>
    <path d="M 6 -5 L 16 5 M 16 -5 L 6 5" stroke="#FF7E7E" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="92" y="399" font-size="14" fill="currentColor" opacity="0.55">&#8220;Mistakes mean I&#8217;m failing.&#8221;</text>

  <!-- Left summary -->
  <text x="200" y="450" font-size="12" font-style="italic" fill="currentColor" opacity="0.5" text-anchor="middle">These thoughts shut the door.</text>

  <!-- ==== RIGHT: GROWTH MINDSET ==== -->
  <text x="600" y="148" font-size="12" font-weight="700" fill="#4ADE80" opacity="0.95" letter-spacing="1.5" text-anchor="middle">GROWTH MINDSET</text>
  <text x="600" y="172" font-size="13" fill="currentColor" opacity="0.7" text-anchor="middle">How great artists think.</text>

  <!-- Growth statement 1 -->
  <g transform="translate(440, 230)">
    <circle cx="11" cy="0" r="11" fill="none" stroke="#4ADE80" stroke-width="1.5" opacity="0.75"/>
    <path d="M 5 0 L 9 5 L 17 -5" fill="none" stroke="#4ADE80" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="472" y="234" font-size="14" fill="currentColor">&#8220;I can&#8217;t do this </text>
  <text x="617" y="234" font-size="14" font-weight="700" fill="#FF6B00">yet</text>
  <text x="643" y="234" font-size="14" fill="currentColor">.&#8221;</text>

  <!-- Growth statement 2 -->
  <g transform="translate(440, 285)">
    <circle cx="11" cy="0" r="11" fill="none" stroke="#4ADE80" stroke-width="1.5" opacity="0.75"/>
    <path d="M 5 0 L 9 5 L 17 -5" fill="none" stroke="#4ADE80" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="472" y="289" font-size="14" fill="currentColor">&#8220;I&#8217;m building my creative thinking.&#8221;</text>

  <!-- Growth statement 3 -->
  <g transform="translate(440, 340)">
    <circle cx="11" cy="0" r="11" fill="none" stroke="#4ADE80" stroke-width="1.5" opacity="0.75"/>
    <path d="M 5 0 L 9 5 L 17 -5" fill="none" stroke="#4ADE80" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="472" y="344" font-size="14" fill="currentColor">&#8220;Struggle is how skills grow.&#8221;</text>

  <!-- Growth statement 4 -->
  <g transform="translate(440, 395)">
    <circle cx="11" cy="0" r="11" fill="none" stroke="#4ADE80" stroke-width="1.5" opacity="0.75"/>
    <path d="M 5 0 L 9 5 L 17 -5" fill="none" stroke="#4ADE80" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="472" y="399" font-size="14" fill="currentColor">&#8220;Mistakes show what to improve next.&#8221;</text>

  <!-- Right summary -->
  <text x="600" y="450" font-size="12" font-style="italic" fill="currentColor" opacity="0.65" text-anchor="middle">These thoughts open it.</text>

  <!-- Footer tip -->
  <rect x="40" y="506" width="720" height="34" rx="6" fill="#FF6B00" fill-opacity="0.10" stroke="#FF6B00" stroke-opacity="0.4"/>
  <text x="54" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Catch yourself thinking &#8220;I can&#8217;t&#8221; &#8212; and add the word &#8220;yet.&#8221;
  </text>
</svg>
