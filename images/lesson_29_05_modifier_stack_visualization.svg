<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" role="img" aria-labelledby="msTitle msDesc" fill="none" style="max-width:100%;height:auto;color:currentColor">
  <title id="msTitle">Modifier stack visualization</title>
  <desc id="msDesc">A vertical modifier stack ordered Mirror, Array, Boolean, Bevel, Subdivision Surface, with downward data-flow arrows and the resulting effect shown beside each step.</desc>
  <defs>
    <marker id="msFlow" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L5,10 L10,0" fill="none" stroke="currentColor" stroke-width="2"/>
    </marker>
  </defs>
  <style>
    .ms-box{stroke:currentColor;stroke-width:2;fill:none;rx:8}
    .ms-bar{fill:currentColor;opacity:.16}
    .ms-flow{stroke:currentColor;stroke-width:2;fill:none}
    .ms-name{font:700 16px system-ui,Arial,sans-serif;fill:currentColor}
    .ms-note{font:400 12px system-ui,Arial,sans-serif;fill:currentColor;opacity:.7}
    .ms-res{stroke:currentColor;stroke-width:1.6;fill:none;opacity:.85}
    .ms-resfill{fill:currentColor;opacity:.08}
    .ms-hd{font:600 13px system-ui,Arial,sans-serif;fill:currentColor;opacity:.85}
    .ms-idx{font:700 13px system-ui,Arial,sans-serif;fill:currentColor;opacity:.55}
  </style>

  <text class="ms-hd" x="40" y="34">Modifier stack &#8212; top evaluates first, bottom last</text>
  <text class="ms-hd" x="650" y="34" text-anchor="middle">Result</text>

  <!-- Step generator -->
  <!-- 1 MIRROR -->
  <g transform="translate(40,56)">
    <rect class="ms-box" x="0" y="0" width="360" height="78" rx="8"/>
    <rect class="ms-bar" x="0" y="0" width="6" height="78"/>
    <text class="ms-idx" x="22" y="30">1</text>
    <text class="ms-name" x="44" y="33">MIRROR</text>
    <text class="ms-note" x="44" y="56">Build one half, get symmetry free</text>
    <!-- result: two halves -->
    <g transform="translate(560,8)">
      <rect class="ms-resfill" x="0" y="6" width="28" height="46"/><rect class="ms-res" x="0" y="6" width="28" height="46"/>
      <rect class="ms-resfill" x="30" y="6" width="28" height="46"/><rect class="ms-res" x="30" y="6" width="28" height="46"/>
      <line class="ms-res" x1="29" y1="0" x2="29" y2="58" stroke-dasharray="3 3"/>
    </g>
  </g>
  <line class="ms-flow" x1="220" y1="134" x2="220" y2="160" marker-end="url(#msFlow)"/>

  <!-- 2 ARRAY -->
  <g transform="translate(40,162)">
    <rect class="ms-box" x="0" y="0" width="360" height="78" rx="8"/>
    <rect class="ms-bar" x="0" y="0" width="6" height="78"/>
    <text class="ms-idx" x="22" y="30">2</text>
    <text class="ms-name" x="44" y="33">ARRAY</text>
    <text class="ms-note" x="44" y="56">Repeat the form into a pattern</text>
    <g transform="translate(560,16)">
      <rect class="ms-resfill" x="0" y="6" width="18" height="36"/><rect class="ms-res" x="0" y="6" width="18" height="36"/>
      <rect class="ms-resfill" x="22" y="6" width="18" height="36"/><rect class="ms-res" x="22" y="6" width="18" height="36"/>
      <rect class="ms-resfill" x="44" y="6" width="18" height="36"/><rect class="ms-res" x="44" y="6" width="18" height="36"/>
    </g>
  </g>
  <line class="ms-flow" x1="220" y1="240" x2="220" y2="266" marker-end="url(#msFlow)"/>

  <!-- 3 BOOLEAN -->
  <g transform="translate(40,268)">
    <rect class="ms-box" x="0" y="0" width="360" height="78" rx="8"/>
    <rect class="ms-bar" x="0" y="0" width="6" height="78"/>
    <text class="ms-idx" x="22" y="30">3</text>
    <text class="ms-name" x="44" y="33">BOOLEAN</text>
    <text class="ms-note" x="44" y="56">Cut holes, slots and panel lines</text>
    <g transform="translate(560,8)">
      <rect class="ms-resfill" x="0" y="6" width="58" height="46"/><rect class="ms-res" x="0" y="6" width="58" height="46"/>
      <circle cx="22" cy="29" r="8" fill="currentColor"/>
      <rect x="34" y="24" width="16" height="10" fill="currentColor"/>
    </g>
  </g>
  <line class="ms-flow" x1="220" y1="346" x2="220" y2="372" marker-end="url(#msFlow)"/>

  <!-- 4 BEVEL -->
  <g transform="translate(40,374)">
    <rect class="ms-box" x="0" y="0" width="360" height="78" rx="8"/>
    <rect class="ms-bar" x="0" y="0" width="6" height="78"/>
    <text class="ms-idx" x="22" y="30">4</text>
    <text class="ms-name" x="44" y="33">BEVEL</text>
    <text class="ms-note" x="44" y="56">Round edges so they catch light</text>
    <g transform="translate(560,8)">
      <path class="ms-resfill" d="M8,52 L8,16 Q8,8 16,8 L50,8 Q58,8 58,16 L58,52 Z"/>
      <path class="ms-res" d="M8,52 L8,16 Q8,8 16,8 L50,8 Q58,8 58,16 L58,52 Z"/>
    </g>
  </g>
  <line class="ms-flow" x1="220" y1="452" x2="220" y2="478" marker-end="url(#msFlow)"/>

  <!-- 5 SUBDIVISION SURFACE -->
  <g transform="translate(40,480)">
    <rect class="ms-box" x="0" y="0" width="360" height="78" rx="8"/>
    <rect class="ms-bar" x="0" y="0" width="6" height="78"/>
    <text class="ms-idx" x="22" y="30">5</text>
    <text class="ms-name" x="44" y="33">SUBDIVISION SURFACE</text>
    <text class="ms-note" x="44" y="56">Final smoothing pass</text>
    <g transform="translate(560,8)">
      <path class="ms-resfill" d="M30,6 Q58,6 58,29 Q58,52 30,52 Q2,52 2,29 Q2,6 30,6 Z"/>
      <path class="ms-res" d="M30,6 Q58,6 58,29 Q58,52 30,52 Q2,52 2,29 Q2,6 30,6 Z"/>
    </g>
  </g>
</svg>
