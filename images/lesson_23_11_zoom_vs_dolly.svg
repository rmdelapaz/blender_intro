<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="zd-title zd-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="zd-title">Zoom versus dolly, side-by-side diagram</title>
  <desc id="zd-desc">A split-panel comparison. On the left, a dolly moves the camera body physically toward the subject while the field-of-view cone angle stays constant, so perspective and background scale change. On the right, a zoom keeps the camera fixed and narrows the field-of-view cone, magnifying the subject without moving the camera.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">ZOOM vs DOLLY</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Two ways to make the subject bigger &#183; only one moves the camera</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ===== Vertical panel divider ===== -->
  <line x1="400" y1="128" x2="400" y2="488" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ============================================================ -->
  <!-- LEFT PANEL: DOLLY (camera moves, FOV angle constant)         -->
  <!-- ============================================================ -->
  <text x="60" y="150" font-size="18" font-weight="600" fill="currentColor">DOLLY</text>

  <!-- Subject (fixed reference) near top of panel -->
  <g>
    <rect x="168" y="178" width="56" height="48" rx="3" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="2"/>
    <path d="M 168 178 L 182 166 L 238 166 L 224 178" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-width="1.5" opacity="0.55"/>
    <text x="196" y="208" text-anchor="middle" font-size="13" font-weight="500" fill="currentColor">Subject</text>
  </g>

  <!-- FOV cones: SAME apex angle from two camera positions (far + near) -->
  <!-- FAR cone apex (196,420), opening up to subject width at y~234 -->
  <polygon points="196,420 132,240 260,240" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1" stroke-opacity="0.25"/>
  <!-- NEAR cone apex (196,338), SAME half-angle, faint orange edge = active end -->
  <polygon points="196,338 167,240 225,240" fill="currentColor" fill-opacity="0.10" stroke="#FF6B00" stroke-width="1.25" stroke-opacity="0.5"/>

  <!-- Translation arrow (orange, far -> near) -->
  <defs>
    <marker id="zd-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#FF6B00"/>
    </marker>
  </defs>
  <line x1="196" y1="414" x2="196" y2="352" stroke="#FF6B00" stroke-width="3" stroke-linecap="round" marker-end="url(#zd-arrow)"/>

  <!-- FAR camera (ghost) -->
  <g opacity="0.4">
    <rect x="170" y="420" width="52" height="34" rx="4" fill="#FF6B00"/>
    <rect x="188" y="409" width="16" height="13" rx="2" fill="#FF6B00"/>
  </g>
  <!-- NEAR camera (solid) -->
  <g opacity="0.9">
    <rect x="172" y="312" width="48" height="30" rx="4" fill="#FF6B00"/>
    <rect x="188" y="302" width="16" height="12" rx="2" fill="#FF6B00"/>
  </g>

  <!-- FOV-constant note + sub-note -->
  <text x="196" y="474" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor" opacity="0.7">FOV angle constant</text>
  <text x="196" y="492" text-anchor="middle" font-size="13" font-weight="500" fill="#FF6B00">Camera moves &#183; background scale shifts</text>

  <!-- ============================================================ -->
  <!-- RIGHT PANEL: ZOOM (camera fixed, FOV narrows)                -->
  <!-- ============================================================ -->
  <text x="440" y="150" font-size="18" font-weight="600" fill="currentColor">ZOOM</text>

  <!-- Subject (fixed reference) near top of panel -->
  <g>
    <rect x="576" y="178" width="56" height="48" rx="3" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="2"/>
    <path d="M 576 178 L 590 166 L 646 166 L 632 178" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-width="1.5" opacity="0.55"/>
    <text x="604" y="208" text-anchor="middle" font-size="13" font-weight="500" fill="currentColor">Subject</text>
  </g>

  <!-- Two nested cones from ONE fixed apex (604,420). Wide = normal FOV, narrow = zoomed-in (orange). -->
  <!-- WIDE cone (normal) -->
  <polygon points="604,420 540,240 668,240" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1" stroke-opacity="0.25"/>
  <!-- NARROW cone (zoomed), same apex, faint orange = the lens change -->
  <polygon points="604,420 583,240 625,240" fill="#FF6B00" fill-opacity="0.10" stroke="#FF6B00" stroke-width="1.25" stroke-opacity="0.5"/>

  <!-- FIXED camera (single solid body, no translation) -->
  <g opacity="0.9">
    <rect x="580" y="420" width="48" height="30" rx="4" fill="#FF6B00"/>
    <rect x="596" y="410" width="16" height="12" rx="2" fill="#FF6B00"/>
  </g>
  <!-- Fixed-position marker (small anchor pin under camera) -->
  <text x="604" y="474" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor" opacity="0.7">FOV narrows in place</text>
  <text x="604" y="492" text-anchor="middle" font-size="13" font-weight="500" fill="#FF6B00">Camera fixed &#183; FOV narrows</text>

  <!-- ===== Footer tip (Variant B left rail) ===== -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Same framing, different look &#183; a dolly shifts perspective and background scale, a zoom only magnifies.</text>
</svg>
