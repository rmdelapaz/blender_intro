<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" color="#222" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" role="img" aria-labelledby="m3p-t m3p-d">
  <title id="m3p-t">The Three-Pass Modeling Approach</title>
  <desc id="m3p-d">A left-to-right philosophy bar showing modeling in three passes &#8212; block for overall forms and proportion, refine for accurate shapes and edge flow, and detail for the small features that sell realism &#8212; with a rough time budget so beginners resist over-detailing before the base forms are right.</desc>
  <rect x="0" y="0" width="760" height="480" fill="none"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="currentColor">Three-Pass Modeling</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#8a8f98">Get the big shapes right before you touch a single bevel</text>

  <!-- progress bar segments (block 40% / refine 35% / detail 25%) -->
  <g>
    <rect x="60" y="86" width="272" height="46" rx="6" fill="#4A9EFF" opacity="0.9"/>
    <rect x="336" y="86" width="238" height="46" rx="6" fill="#FF6B00" opacity="0.9"/>
    <rect x="578" y="86" width="122" height="46" rx="6" fill="#B47EE8" opacity="0.9"/>
    <text x="196" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">BLOCK &#183; ~40%</text>
    <text x="455" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">REFINE &#183; ~35%</text>
    <text x="639" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">DETAIL 25%</text>
  </g>
  <text x="60" y="152" font-size="11" fill="#8a8f98">simple &#8594; primitives</text>
  <text x="700" y="152" text-anchor="end" font-size="11" fill="#8a8f98">final &#8594; polish</text>

  <!-- three panels -->
  <!-- Pass 1 -->
  <g>
    <rect x="60" y="176" width="200" height="252" rx="6" fill="#4A9EFF" opacity="0.1"/>
    <rect x="60" y="176" width="200" height="252" rx="6" fill="none" stroke="#4A9EFF" stroke-width="1.5"/>
    <text x="160" y="204" text-anchor="middle" font-size="15" font-weight="700" fill="#4A9EFF">1 &#183; BLOCK</text>
    <!-- crude proxy -->
    <rect x="128" y="224" width="64" height="70" rx="4" fill="#4A9EFF" opacity="0.35"/>
    <circle cx="160" cy="316" r="26" fill="#4A9EFF" opacity="0.35"/>
    <text x="160" y="360" text-anchor="middle" font-size="12" fill="currentColor">Primitives, real scale</text>
    <text x="160" y="380" text-anchor="middle" font-size="12" fill="currentColor">Proportion &amp; silhouette</text>
    <text x="160" y="406" text-anchor="middle" font-size="11" fill="#8a8f98">Mistakes are cheap here</text>
  </g>
  <!-- Pass 2 -->
  <g>
    <rect x="280" y="176" width="200" height="252" rx="6" fill="#FF6B00" opacity="0.1"/>
    <rect x="280" y="176" width="200" height="252" rx="6" fill="none" stroke="#FF6B00" stroke-width="1.5"/>
    <text x="380" y="204" text-anchor="middle" font-size="15" font-weight="700" fill="#FF6B00">2 &#183; REFINE</text>
    <rect x="348" y="224" width="64" height="70" rx="10" fill="#FF6B00" opacity="0.35"/>
    <circle cx="380" cy="316" r="26" fill="#FF6B00" opacity="0.35"/>
    <circle cx="380" cy="316" r="16" fill="none" stroke="#FF6B00" stroke-width="2"/>
    <text x="380" y="360" text-anchor="middle" font-size="12" fill="currentColor">Accurate shapes</text>
    <text x="380" y="380" text-anchor="middle" font-size="12" fill="currentColor">Clean edge flow</text>
    <text x="380" y="406" text-anchor="middle" font-size="11" fill="#8a8f98">Match the reference now</text>
  </g>
  <!-- Pass 3 -->
  <g>
    <rect x="500" y="176" width="200" height="252" rx="6" fill="#B47EE8" opacity="0.1"/>
    <rect x="500" y="176" width="200" height="252" rx="6" fill="none" stroke="#B47EE8" stroke-width="1.5"/>
    <text x="600" y="204" text-anchor="middle" font-size="15" font-weight="700" fill="#B47EE8">3 &#183; DETAIL</text>
    <rect x="568" y="224" width="64" height="70" rx="10" fill="#B47EE8" opacity="0.35"/>
    <circle cx="600" cy="316" r="26" fill="#B47EE8" opacity="0.35"/>
    <circle cx="600" cy="316" r="16" fill="none" stroke="#B47EE8" stroke-width="2"/>
    <circle cx="600" cy="316" r="7" fill="#B47EE8" opacity="0.6"/>
    <line x1="576" y1="300" x2="624" y2="300" stroke="#B47EE8" stroke-width="1.5"/>
    <text x="600" y="360" text-anchor="middle" font-size="12" fill="currentColor">Bevels, seams, ports</text>
    <text x="600" y="380" text-anchor="middle" font-size="12" fill="currentColor">The realism-sellers</text>
    <text x="600" y="406" text-anchor="middle" font-size="11" fill="#8a8f98">Last, and only here</text>
  </g>

  <text x="60" y="462" font-size="12" fill="#8a8f98">The trap: jumping to bevels and seams in Pass 1. Detail added over wrong proportions just makes a polished wrong shape.</text>
</svg>
