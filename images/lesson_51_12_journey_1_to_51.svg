<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="jrn-title jrn-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="jrn-title">The journey from Lesson 1 to Lesson 51</title>
  <desc id="jrn-desc">An arc from Lesson 1, opening Blender for the first time, to Lesson 51, building a portfolio piece, with the skill set gained along the way: modeling, materials, lighting, rendering, animation, simulation, and character work.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Lesson 1 to Lesson 51</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">From an alien interface to a portfolio-ready artist</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Journey arc: start node -> skills -> end node -->
  <!-- Start -->
  <g>
    <circle cx="110" cy="180" r="30" fill="#4A9EFF" opacity="0.15" stroke="#4A9EFF" stroke-width="2"/>
    <text x="110" y="176" font-size="13" font-weight="700" fill="#4A9EFF" text-anchor="middle">L1</text>
    <text x="110" y="192" font-size="10" fill="#4A9EFF" text-anchor="middle">start</text>
    <text x="160" y="172" font-size="15" font-weight="600" fill="currentColor">You opened Blender</text>
    <text x="160" y="192" font-size="12" fill="currentColor" opacity="0.6">Couldn't tell a vertex from an edge &#183; the interface felt alien</text>
  </g>

  <!-- connector down into skills -->
  <line x1="110" y1="214" x2="110" y2="248" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Skill chips grid -->
  <text x="40" y="256" font-size="13" font-weight="600" fill="currentColor" opacity="0.7">Along the way you learned:</text>
  <g font-size="13">
    <!-- row 1 -->
    <rect x="40" y="272" width="228" height="46" rx="8" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-opacity="0.4"/>
    <text x="56" y="292" font-weight="600" fill="#FF6B00">Modeling</text>
    <text x="56" y="310" font-size="11" fill="currentColor" opacity="0.6">primitives to organic &amp; hard-surface</text>

    <rect x="286" y="272" width="228" height="46" rx="8" fill="#B47EE8" fill-opacity="0.08" stroke="#B47EE8" stroke-opacity="0.4"/>
    <text x="302" y="292" font-weight="600" fill="#B47EE8">Materials</text>
    <text x="302" y="310" font-size="11" fill="currentColor" opacity="0.6">PBR, procedural, shader networks</text>

    <rect x="532" y="272" width="228" height="46" rx="8" fill="#F5C242" fill-opacity="0.08" stroke="#F5C242" stroke-opacity="0.5"/>
    <text x="548" y="292" font-weight="600" fill="#F5C242">Lighting</text>
    <text x="548" y="310" font-size="11" fill="currentColor" opacity="0.6">three-point, HDRI, mood</text>

    <!-- row 2 -->
    <rect x="40" y="328" width="228" height="46" rx="8" fill="#4A9EFF" fill-opacity="0.08" stroke="#4A9EFF" stroke-opacity="0.4"/>
    <text x="56" y="348" font-weight="600" fill="#4A9EFF">Rendering</text>
    <text x="56" y="366" font-size="11" fill="currentColor" opacity="0.6">Cycles &amp; Eevee, optimization</text>

    <rect x="286" y="328" width="228" height="46" rx="8" fill="#FF7EA8" fill-opacity="0.10" stroke="#FF7EA8" stroke-opacity="0.5"/>
    <text x="302" y="348" font-weight="600" fill="#FF7EA8">Animation</text>
    <text x="302" y="366" font-size="11" fill="currentColor" opacity="0.6">keyframes, graph editor, timing</text>

    <rect x="532" y="328" width="228" height="46" rx="8" fill="#4ADE80" fill-opacity="0.08" stroke="#4ADE80" stroke-opacity="0.5"/>
    <text x="548" y="348" font-weight="600" fill="#4ADE80">Simulation</text>
    <text x="548" y="366" font-size="11" fill="currentColor" opacity="0.6">particles, physics, cloth, rigid body</text>

    <!-- row 3 single centered -->
    <rect x="286" y="384" width="228" height="46" rx="8" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-opacity="0.4"/>
    <text x="302" y="404" font-weight="600" fill="#FF6B00">Character Work</text>
    <text x="302" y="422" font-size="11" fill="currentColor" opacity="0.6">modeling &amp; rigging</text>
  </g>

  <!-- connector to end node -->
  <line x1="650" y1="430" x2="650" y2="452" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.5" stroke-linecap="round"/>
  <!-- End -->
  <g>
    <circle cx="650" cy="470" r="16" fill="#4ADE80"/>
    <text x="650" y="475" font-size="12" font-weight="700" fill="#0f1a14" text-anchor="middle">51</text>
    <text x="620" y="475" font-size="14" font-weight="600" fill="currentColor" text-anchor="end">Your portfolio piece</text>
  </g>

  <!-- Footer tip -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Every skill in this grid feeds the final piece &#8212; the portfolio project is where they finally work together.</text>
</svg>
