<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="ns-title ns-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="ns-title">Keyboard Shortcuts: Navigation and Viewport Control</title>
  <desc id="ns-desc">A reference card of essential navigation and viewport shortcuts for Blender 5.1, organized into six categories: the big three operations, standard views, frame and focus, orbit by keyboard, camera view, and advanced techniques.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Header -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Keyboard Shortcuts: Navigation</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Essential viewport shortcuts for Blender 5.1</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ============================ -->
  <!--        LEFT COLUMN           -->
  <!-- ============================ -->

  <!-- Category 1: THE BIG THREE -->
  <text x="40" y="148" font-size="13" font-weight="700" fill="#FF6B00" letter-spacing="1.5">THE BIG THREE</text>

  <!-- Row 1: MMB | Orbit view -->
  <rect x="40" y="162" width="38" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="59" y="178" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">MMB</text>
  <text x="200" y="178" font-size="13" fill="currentColor">Orbit view around the focus point</text>

  <!-- Row 2: Shift + MMB | Pan view -->
  <rect x="40" y="192" width="42" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="61" y="208" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Shift</text>
  <text x="90" y="208" font-size="13" fill="currentColor" opacity="0.5" text-anchor="middle">+</text>
  <rect x="98" y="192" width="38" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="117" y="208" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">MMB</text>
  <text x="200" y="208" font-size="13" fill="currentColor">Pan view, slide the camera</text>

  <!-- Row 3: Scroll | Zoom view -->
  <rect x="40" y="222" width="46" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="63" y="238" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Scroll</text>
  <text x="200" y="238" font-size="13" fill="currentColor">Zoom in or out in steps</text>

  <!-- Row 4: Ctrl + MMB | Continuous zoom -->
  <rect x="40" y="252" width="38" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="59" y="268" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Ctrl</text>
  <text x="86" y="268" font-size="13" fill="currentColor" opacity="0.5" text-anchor="middle">+</text>
  <rect x="94" y="252" width="38" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="113" y="268" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">MMB</text>
  <text x="200" y="268" font-size="13" fill="currentColor">Continuous dolly zoom</text>

  <!-- Category 2: STANDARD VIEWS -->
  <text x="40" y="302" font-size="13" font-weight="700" fill="#FF6B00" letter-spacing="1.5">STANDARD VIEWS</text>

  <!-- Row 1: Numpad 1 | Front view -->
  <rect x="40" y="316" width="64" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="72" y="332" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Numpad 1</text>
  <text x="200" y="332" font-size="13" fill="currentColor">Front view</text>

  <!-- Row 2: Numpad 3 | Right view -->
  <rect x="40" y="346" width="64" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="72" y="362" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Numpad 3</text>
  <text x="200" y="362" font-size="13" fill="currentColor">Right side view</text>

  <!-- Row 3: Numpad 7 | Top view -->
  <rect x="40" y="376" width="64" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="72" y="392" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Numpad 7</text>
  <text x="200" y="392" font-size="13" fill="currentColor">Top view, looking straight down</text>

  <!-- Row 4: Ctrl + Numpad 1 / 3 / 7 | Opposite views -->
  <rect x="40" y="406" width="38" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="59" y="422" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Ctrl</text>
  <text x="86" y="422" font-size="13" fill="currentColor" opacity="0.5" text-anchor="middle">+</text>
  <rect x="94" y="406" width="86" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="137" y="422" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Numpad 1/3/7</text>
  <text x="200" y="422" font-size="13" fill="currentColor">Opposite views, Back / Left / Bottom</text>

  <!-- Row 5: Numpad 5 | Toggle persp / ortho -->
  <rect x="40" y="436" width="64" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="72" y="452" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Numpad 5</text>
  <text x="200" y="452" font-size="13" fill="currentColor">Toggle perspective and orthographic</text>

  <!-- Row 6: Numpad 9 | Flip view -->
  <rect x="40" y="466" width="64" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="72" y="482" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Numpad 9</text>
  <text x="200" y="482" font-size="13" fill="currentColor">Flip to the opposite side</text>

  <!-- ============================ -->
  <!--        RIGHT COLUMN          -->
  <!-- ============================ -->

  <!-- Category 3: FRAME &amp; FOCUS -->
  <text x="420" y="148" font-size="13" font-weight="700" fill="#FF6B00" letter-spacing="1.5">FRAME &amp; FOCUS</text>

  <!-- Row 1: Home | Frame all -->
  <rect x="420" y="162" width="44" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="442" y="178" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Home</text>
  <text x="580" y="178" font-size="13" fill="currentColor">Frame all objects in view</text>

  <!-- Row 2: Numpad . | Frame selected -->
  <rect x="420" y="192" width="64" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="452" y="208" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Numpad .</text>
  <text x="580" y="208" font-size="13" fill="currentColor">Frame the selection only</text>

  <!-- Row 3: / | Toggle local view -->
  <rect x="420" y="222" width="26" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="433" y="238" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">/</text>
  <text x="580" y="238" font-size="13" fill="currentColor">Toggle local view, isolate selection</text>

  <!-- Category 4: ORBIT BY KEYBOARD -->
  <text x="420" y="272" font-size="13" font-weight="700" fill="#FF6B00" letter-spacing="1.5">ORBIT BY KEYBOARD</text>

  <!-- Row 1: Numpad 4 / 6 | Rotate left / right -->
  <rect x="420" y="286" width="86" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="463" y="302" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Numpad 4 / 6</text>
  <text x="580" y="302" font-size="13" fill="currentColor">Rotate view left or right, 15 degrees</text>

  <!-- Row 2: Numpad 2 / 8 | Rotate down / up -->
  <rect x="420" y="316" width="86" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="463" y="332" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Numpad 2 / 8</text>
  <text x="580" y="332" font-size="13" fill="currentColor">Rotate view down or up, 15 degrees</text>

  <!-- Category 5: CAMERA VIEW -->
  <text x="420" y="366" font-size="13" font-weight="700" fill="#FF6B00" letter-spacing="1.5">CAMERA VIEW</text>

  <!-- Row 1: Numpad 0 | Camera view -->
  <rect x="420" y="380" width="64" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="452" y="396" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Numpad 0</text>
  <text x="580" y="396" font-size="13" fill="currentColor">Jump to the active camera view</text>

  <!-- Row 2: Ctrl + Alt + Numpad 0 | Align camera to view -->
  <rect x="420" y="410" width="38" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="439" y="426" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Ctrl</text>
  <text x="466" y="426" font-size="13" fill="currentColor" opacity="0.5" text-anchor="middle">+</text>
  <rect x="474" y="410" width="30" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="489" y="426" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Alt</text>
  <text x="512" y="426" font-size="13" fill="currentColor" opacity="0.5" text-anchor="middle">+</text>
  <rect x="520" y="410" width="64" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="552" y="426" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Numpad 0</text>
  <text x="596" y="426" font-size="13" fill="currentColor">Align camera to current view</text>

  <!-- Category 6: ADVANCED -->
  <text x="420" y="460" font-size="13" font-weight="700" fill="#FF6B00" letter-spacing="1.5">ADVANCED</text>

  <!-- Row 1: Shift + ` | Walk / Fly mode -->
  <rect x="420" y="474" width="42" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="441" y="490" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Shift</text>
  <text x="470" y="490" font-size="13" fill="currentColor" opacity="0.5" text-anchor="middle">+</text>
  <rect x="478" y="474" width="24" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="490" y="490" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">`</text>
  <text x="580" y="490" font-size="13" fill="currentColor">Enter Walk or Fly mode</text>

  <!-- Row 2: Ctrl + Alt + Q | Toggle quad view -->
  <rect x="420" y="504" width="38" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="439" y="520" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Ctrl</text>
  <text x="466" y="520" font-size="13" fill="currentColor" opacity="0.5" text-anchor="middle">+</text>
  <rect x="474" y="504" width="30" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="489" y="520" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Alt</text>
  <text x="512" y="520" font-size="13" fill="currentColor" opacity="0.5" text-anchor="middle">+</text>
  <rect x="520" y="504" width="24" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="532" y="520" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Q</text>
  <text x="580" y="520" font-size="13" fill="currentColor">Toggle quad view, four panes at once</text>

  <!-- Footer tip callout -->
  <rect x="40" y="618" width="720" height="34" rx="6"
        fill="#FF6B00" fill-opacity="0.10"
        stroke="#FF6B00" stroke-opacity="0.4"/>
  <text x="54" y="640" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Hover over any viewport menu item to see its assigned shortcut. Numpad shortcuts work even with NumLock off.
  </text>

</svg>
