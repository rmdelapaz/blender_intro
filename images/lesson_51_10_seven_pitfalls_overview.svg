<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="pit-title pit-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="pit-title">Seven common portfolio pitfalls at a glance</title>
  <desc id="pit-desc">Seven common portfolio pitfalls, each paired with its one-line fix: scope creep, tutorial hell, perfectionism paralysis, no planning, ignoring composition, weak lighting, and no feedback loop.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Seven Portfolio Pitfalls</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">The trap on the left &#183; the fix on the right</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- rows: red trap chip + green fix -->
  <!-- 1 Scope Creep -->
  <g>
    <text x="44" y="150" font-size="13" font-weight="700" fill="currentColor" opacity="0.45">1</text>
    <rect x="64" y="132" width="330" height="60" rx="8" fill="#E63946" fill-opacity="0.10" stroke="#E63946" stroke-opacity="0.5"/>
    <text x="80" y="157" font-size="15" font-weight="600" fill="#E63946">Scope Creep</text>
    <text x="80" y="178" font-size="12" fill="currentColor" opacity="0.6">Project keeps growing, never ships</text>
    <text x="410" y="157" font-size="14" font-weight="600" fill="#4ADE80">Lock scope early</text>
    <text x="410" y="178" font-size="12" fill="currentColor" opacity="0.6">Write it down; park new ideas for next time</text>
  </g>
  <!-- 2 Tutorial Hell -->
  <g>
    <text x="44" y="222" font-size="13" font-weight="700" fill="currentColor" opacity="0.45">2</text>
    <rect x="64" y="204" width="330" height="60" rx="8" fill="#E63946" fill-opacity="0.10" stroke="#E63946" stroke-opacity="0.5"/>
    <text x="80" y="229" font-size="15" font-weight="600" fill="#E63946">Tutorial Hell</text>
    <text x="80" y="250" font-size="12" fill="currentColor" opacity="0.6">Following along, never building your own</text>
    <text x="410" y="229" font-size="14" font-weight="600" fill="#4ADE80">Build from a blank file</text>
    <text x="410" y="250" font-size="12" fill="currentColor" opacity="0.6">Apply skills to your own idea, no hand-holding</text>
  </g>
  <!-- 3 Perfectionism -->
  <g>
    <text x="44" y="294" font-size="13" font-weight="700" fill="currentColor" opacity="0.45">3</text>
    <rect x="64" y="276" width="330" height="60" rx="8" fill="#E63946" fill-opacity="0.10" stroke="#E63946" stroke-opacity="0.5"/>
    <text x="80" y="301" font-size="15" font-weight="600" fill="#E63946">Perfectionism Paralysis</text>
    <text x="80" y="322" font-size="12" fill="currentColor" opacity="0.6">Endless tweaks, nothing ever "done"</text>
    <text x="410" y="301" font-size="14" font-weight="600" fill="#4ADE80">Set a deadline</text>
    <text x="410" y="322" font-size="12" fill="currentColor" opacity="0.6">Done and shared beats perfect and hidden</text>
  </g>
  <!-- 4 No Planning -->
  <g>
    <text x="44" y="366" font-size="13" font-weight="700" fill="currentColor" opacity="0.45">4</text>
    <rect x="64" y="348" width="330" height="60" rx="8" fill="#E63946" fill-opacity="0.10" stroke="#E63946" stroke-opacity="0.5"/>
    <text x="80" y="373" font-size="15" font-weight="600" fill="#E63946">No Planning</text>
    <text x="80" y="394" font-size="12" fill="currentColor" opacity="0.6">Jumping in, then stalling halfway</text>
    <text x="410" y="373" font-size="14" font-weight="600" fill="#4ADE80">Plan before you model</text>
    <text x="410" y="394" font-size="12" fill="currentColor" opacity="0.6">References, spec, and a phase list up front</text>
  </g>
  <!-- 5 Ignoring Composition -->
  <g>
    <text x="44" y="438" font-size="13" font-weight="700" fill="currentColor" opacity="0.45">5</text>
    <rect x="64" y="420" width="330" height="60" rx="8" fill="#E63946" fill-opacity="0.10" stroke="#E63946" stroke-opacity="0.5"/>
    <text x="80" y="445" font-size="15" font-weight="600" fill="#E63946">Ignoring Composition</text>
    <text x="80" y="466" font-size="12" fill="currentColor" opacity="0.6">Great model, flat lifeless framing</text>
    <text x="410" y="445" font-size="14" font-weight="600" fill="#4ADE80">Frame with intent</text>
    <text x="410" y="466" font-size="12" fill="currentColor" opacity="0.6">Camera angle and layout are half the shot</text>
  </g>
  <!-- 6 Weak Lighting -->
  <g>
    <text x="44" y="510" font-size="13" font-weight="700" fill="currentColor" opacity="0.45">6</text>
    <rect x="64" y="492" width="330" height="60" rx="8" fill="#E63946" fill-opacity="0.10" stroke="#E63946" stroke-opacity="0.5"/>
    <text x="80" y="517" font-size="15" font-weight="600" fill="#E63946">Weak Lighting</text>
    <text x="80" y="538" font-size="12" fill="currentColor" opacity="0.6">Even, dull light kills the render</text>
    <text x="410" y="517" font-size="14" font-weight="600" fill="#4ADE80">Light for mood</text>
    <text x="410" y="538" font-size="12" fill="currentColor" opacity="0.6">Contrast and direction sell depth</text>
  </g>
  <!-- 7 No Feedback -->
  <g>
    <text x="44" y="582" font-size="13" font-weight="700" fill="currentColor" opacity="0.45">7</text>
    <rect x="64" y="564" width="330" height="60" rx="8" fill="#E63946" fill-opacity="0.10" stroke="#E63946" stroke-opacity="0.5"/>
    <text x="80" y="589" font-size="15" font-weight="600" fill="#E63946">No Feedback Loop</text>
    <text x="80" y="610" font-size="12" fill="currentColor" opacity="0.6">Working alone, blind to problems</text>
    <text x="410" y="589" font-size="14" font-weight="600" fill="#4ADE80">Share work in progress</text>
    <text x="410" y="610" font-size="12" fill="currentColor" opacity="0.6">Fresh eyes catch what you stopped seeing</text>
  </g>

  <!-- Footer tip -->
  <rect x="40" y="641" width="720" height="34" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Most of these share one cure &#8212; decide, ship, and show it, rather than polishing in private forever.</text>
</svg>
