<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="pvp-title pvp-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="pvp-title">Portfolio piece versus practice project</title>
  <desc id="pvp-desc">A side-by-side comparison. A portfolio piece shows clean topology, professional lighting, material detail, and post-processing polish, and is meant to be seen. A practice project has rough topology, flat default lighting, and basic materials, and exists to learn a skill.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Portfolio Piece vs Practice Project</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Same subject, different intent: one is built to be seen, one is built to learn</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ============ LEFT PANEL: Portfolio Piece ============ -->
  <!-- Panel header -->
  <rect x="40" y="132" width="345" height="34" rx="6" fill="#4ADE80" fill-opacity="0.12"/>
  <rect x="40" y="132" width="4" height="34" fill="#4ADE80"/>
  <text x="58" y="154" font-size="16" font-weight="700" fill="#4ADE80">Portfolio Piece</text>
  <text x="373" y="154" font-size="13" font-weight="700" fill="#4ADE80" text-anchor="end">SHOW</text>

  <!-- Thumbnail: cup on table, clean quad wireframe overlay -->
  <rect x="40" y="180" width="345" height="150" rx="8" fill="currentColor" opacity="0.04"/>
  <rect x="40.5" y="180.5" width="344" height="149" rx="8" fill="none" stroke="#4ADE80" stroke-width="1.5" opacity="0.55"/>
  <!-- table line -->
  <line x1="64" y1="292" x2="361" y2="292" stroke="currentColor" stroke-width="1.5" opacity="0.35"/>
  <!-- mug body -->
  <path d="M 168 236 Q 168 232 172 232 L 236 232 Q 240 232 240 236 L 236 288 Q 236 292 232 292 L 176 292 Q 172 292 172 288 Z"
        fill="none" stroke="#4ADE80" stroke-width="2"/>
  <!-- handle -->
  <path d="M 240 244 Q 262 244 262 260 Q 262 276 240 276" fill="none" stroke="#4ADE80" stroke-width="2"/>
  <!-- clean quad topology overlay on mug -->
  <g stroke="#4ADE80" stroke-width="0.8" opacity="0.5">
    <line x1="186" y1="232" x2="182" y2="292"/>
    <line x1="204" y1="232" x2="204" y2="292"/>
    <line x1="222" y1="232" x2="226" y2="292"/>
    <line x1="171" y1="252" x2="237" y2="252"/>
    <line x1="170" y1="272" x2="238" y2="272"/>
  </g>
  <!-- rim light glint -->
  <circle cx="230" cy="240" r="3" fill="#F5C242"/>

  <!-- Positive checklist -->
  <g font-size="13" fill="currentColor">
    <text x="40" y="360" font-weight="600">What it demonstrates</text>
    <g transform="translate(40,378)">
      <circle cx="6" cy="-4" r="6" fill="#4ADE80"/><path d="M 3 -4 l 2 2.5 l 4 -5" fill="none" stroke="#0f1a14" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="20" y="0">Clean quad topology, proper edge flow</text>
    </g>
    <g transform="translate(40,400)">
      <circle cx="6" cy="-4" r="6" fill="#4ADE80"/><path d="M 3 -4 l 2 2.5 l 4 -5" fill="none" stroke="#0f1a14" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="20" y="0">Deliberate lighting, rim and soft shadow</text>
    </g>
    <g transform="translate(40,422)">
      <circle cx="6" cy="-4" r="6" fill="#4ADE80"/><path d="M 3 -4 l 2 2.5 l 4 -5" fill="none" stroke="#0f1a14" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="20" y="0">Material detail, subtle imperfection</text>
    </g>
    <g transform="translate(40,444)">
      <circle cx="6" cy="-4" r="6" fill="#4ADE80"/><path d="M 3 -4 l 2 2.5 l 4 -5" fill="none" stroke="#0f1a14" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="20" y="0">Composed framing, post-processing polish</text>
    </g>
  </g>

  <!-- ============ CENTER divider ============ -->
  <line x1="400" y1="132" x2="400" y2="470" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ============ RIGHT PANEL: Practice Project ============ -->
  <rect x="415" y="132" width="345" height="34" rx="6" fill="#F5C242" fill-opacity="0.12"/>
  <rect x="415" y="132" width="4" height="34" fill="#F5C242"/>
  <text x="433" y="154" font-size="16" font-weight="700" fill="#F5C242">Practice Project</text>
  <text x="748" y="154" font-size="13" font-weight="700" fill="#F5C242" text-anchor="end">LEARN</text>

  <!-- Thumbnail: same cup, messy topology -->
  <rect x="415" y="180" width="345" height="150" rx="8" fill="currentColor" opacity="0.04"/>
  <rect x="415.5" y="180.5" width="344" height="149" rx="8" fill="none" stroke="#F5C242" stroke-width="1.5" opacity="0.55"/>
  <line x1="439" y1="292" x2="736" y2="292" stroke="currentColor" stroke-width="1.5" opacity="0.35"/>
  <!-- mug body (same silhouette) -->
  <path d="M 543 236 Q 543 232 547 232 L 611 232 Q 615 232 615 236 L 611 288 Q 611 292 607 292 L 551 292 Q 547 292 547 288 Z"
        fill="none" stroke="#F5C242" stroke-width="2"/>
  <path d="M 615 244 Q 637 244 637 260 Q 637 276 615 276" fill="none" stroke="#F5C242" stroke-width="2"/>
  <!-- messy topology: triangles + ngon, off-grid -->
  <g stroke="#E63946" stroke-width="0.8" opacity="0.6">
    <line x1="547" y1="236" x2="600" y2="262"/>
    <line x1="611" y1="238" x2="560" y2="270"/>
    <line x1="600" y1="262" x2="611" y2="288"/>
    <line x1="560" y1="270" x2="547" y2="250"/>
    <line x1="575" y1="232" x2="590" y2="292"/>
  </g>
  <!-- flat harsh shadow blob (no rim) -->
  <ellipse cx="579" cy="300" rx="46" ry="5" fill="currentColor" opacity="0.18"/>

  <!-- Warning checklist -->
  <g font-size="13" fill="currentColor">
    <text x="415" y="360" font-weight="600">What it usually is</text>
    <g transform="translate(415,378)">
      <circle cx="6" cy="-4" r="6" fill="#E63946"/><path d="M 3 -7 l 6 6 M 9 -7 l -6 6" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
      <text x="20" y="0">Rushed topology, triangles and ngons</text>
    </g>
    <g transform="translate(415,400)">
      <circle cx="6" cy="-4" r="6" fill="#E63946"/><path d="M 3 -7 l 6 6 M 9 -7 l -6 6" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
      <text x="20" y="0">Flat default light, harsh single shadow</text>
    </g>
    <g transform="translate(415,422)">
      <circle cx="6" cy="-4" r="6" fill="#E63946"/><path d="M 3 -7 l 6 6 M 9 -7 l -6 6" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
      <text x="20" y="0">Basic material, no surface variation</text>
    </g>
    <g transform="translate(415,444)">
      <circle cx="6" cy="-4" r="6" fill="#E63946"/><path d="M 3 -7 l 6 6 M 9 -7 l -6 6" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
      <text x="20" y="0">Straight render, framing not considered</text>
    </g>
  </g>

  <!-- Footer tip (Variant B, left rail) -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Every practice project is fuel. A portfolio piece is one you chose to finish, refine, and show.
  </text>
</svg>
