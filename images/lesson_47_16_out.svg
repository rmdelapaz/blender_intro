<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="outTitle outDesc" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" color="#222">
  <title id="outTitle">Output Delivery Matrix</title>
  <desc id="outDesc">A delivery matrix mapping four use cases to their recommended output settings. Web wants sRGB 8-bit PNG or JPEG, small and fast. Print wants a wide-gamut 16-bit TIFF at 300 DPI. Video wants a Rec.709 delivery codec such as H.264 or ProRes. Archive wants a multilayer 16 or 32-bit EXR that preserves every pass and the full dynamic range. Columns are format, color space, and bit depth.</desc>
  <style>
    .hd{fill:currentColor;font-size:19px;font-weight:700;}
    .sub{fill:#9aa4b2;font-size:11px;}
    .ch{fill:#0f0f0f;font-size:11px;font-weight:700;}
    .uc{fill:#ffffff;font-size:13px;font-weight:700;}
    .cell{fill:#d4d4d4;font-size:11px;}
    .row{fill:#1b1b1b;}
  </style>
  <text x="20" y="34" class="hd">Delivery matrix: match output to use case</text>
  <text x="20" y="54" class="sub">There is no single "best export" &#8212; the target decides format, color space, and bit depth.</text>

  <!-- header -->
  <rect x="20" y="74" width="170" height="34" rx="5" fill="#3a3a3a"/>
  <rect x="196" y="74" width="180" height="34" rx="5" fill="#FF6B00"/>
  <text x="230" y="96" class="ch">Format</text>
  <rect x="382" y="74" width="180" height="34" rx="5" fill="#4A9EFF"/>
  <text x="410" y="96" class="ch">Color space</text>
  <rect x="568" y="74" width="172" height="34" rx="5" fill="#B47EE8"/>
  <text x="600" y="96" class="ch">Bit depth</text>

  <!-- Web -->
  <rect x="20" y="114" width="720" height="60" rx="6" fill="#1b1b1b" stroke="#4ADE80" stroke-width="1.5"/>
  <rect x="20" y="114" width="6" height="60" fill="#4ADE80"/>
  <text x="40" y="140" class="uc">Web</text>
  <text x="40" y="160" class="cell" fill="#9aa4b2">fast, small</text>
  <text x="206" y="150" class="cell">PNG / JPEG</text>
  <text x="392" y="150" class="cell">sRGB</text>
  <text x="578" y="150" class="cell">8-bit</text>

  <!-- Print -->
  <rect x="20" y="180" width="720" height="60" rx="6" fill="#1b1b1b" stroke="#F5C242" stroke-width="1.5"/>
  <rect x="20" y="180" width="6" height="60" fill="#F5C242"/>
  <text x="40" y="206" class="uc">Print</text>
  <text x="40" y="226" class="cell" fill="#9aa4b2">300 DPI</text>
  <text x="206" y="216" class="cell">TIFF</text>
  <text x="392" y="216" class="cell">Adobe RGB / CMYK</text>
  <text x="578" y="216" class="cell">16-bit</text>

  <!-- Video -->
  <rect x="20" y="246" width="720" height="60" rx="6" fill="#1b1b1b" stroke="#4A9EFF" stroke-width="1.5"/>
  <rect x="20" y="246" width="6" height="60" fill="#4A9EFF"/>
  <text x="40" y="272" class="uc">Video</text>
  <text x="40" y="292" class="cell" fill="#9aa4b2">delivery</text>
  <text x="206" y="282" class="cell">H.264 / ProRes</text>
  <text x="392" y="282" class="cell">Rec.709</text>
  <text x="578" y="282" class="cell">8&#8211;10-bit</text>

  <!-- Archive -->
  <rect x="20" y="312" width="720" height="64" rx="6" fill="#1b1b1b" stroke="#E63946" stroke-width="1.5"/>
  <rect x="20" y="312" width="6" height="64" fill="#E63946"/>
  <text x="40" y="338" class="uc">Archive</text>
  <text x="40" y="358" class="cell" fill="#9aa4b2">keep everything</text>
  <text x="206" y="348" class="cell">EXR (multilayer)</text>
  <text x="392" y="348" class="cell">Linear / scene-referred</text>
  <text x="578" y="348" class="cell">16&#8211;32-bit</text>
  <text x="206" y="366" class="cell" fill="#9aa4b2">preserves passes + full dynamic range</text>
</svg>
