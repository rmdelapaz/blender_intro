<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="ln-title ln-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="ln-title">Linear versus natural motion</title>
  <desc id="ln-desc">Two panels. The left panel shows robotic linear motion as evenly spaced dots on a straight line, marked with a cross. The right panel shows natural organic motion as eased dots following an arc, marked with a check.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Linear vs natural motion</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">The same A-to-B move, robotic or alive</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Left panel: linear/robotic -->
  <rect x="50" y="140" width="340" height="320" rx="8" fill="currentColor" opacity="0.03"/>
  <circle cx="78" cy="172" r="13" fill="#E63946"/>
  <text x="78" y="178" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">&#215;</text>
  <text x="100" y="178" font-size="16" font-weight="600" fill="currentColor">Linear</text>
  <text x="100" y="200" font-size="13" fill="currentColor" opacity="0.6">Even spacing, straight path : robotic</text>
  <line x1="90.0" y1="330" x2="360.0" y2="330" stroke="#E63946" stroke-width="1.5" opacity="0.4"/>
    <circle cx="90.0" cy="330" r="6" fill="#E63946"/>
    <circle cx="117.0" cy="330" r="6" fill="#E63946"/>
    <circle cx="144.0" cy="330" r="6" fill="#E63946"/>
    <circle cx="171.0" cy="330" r="6" fill="#E63946"/>
    <circle cx="198.0" cy="330" r="6" fill="#E63946"/>
    <circle cx="225.0" cy="330" r="6" fill="#E63946"/>
    <circle cx="252.0" cy="330" r="6" fill="#E63946"/>
    <circle cx="279.0" cy="330" r="6" fill="#E63946"/>
    <circle cx="306.0" cy="330" r="6" fill="#E63946"/>
    <circle cx="333.0" cy="330" r="6" fill="#E63946"/>
    <circle cx="360.0" cy="330" r="6" fill="#E63946"/>
  <text x="220" y="430" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">Constant speed start to finish</text>

  <!-- Right panel: natural/organic -->
  <rect x="410" y="140" width="340" height="320" rx="8" fill="currentColor" opacity="0.03"/>
  <circle cx="438" cy="172" r="13" fill="#4ADE80"/>
  <text x="438" y="178" font-size="15" font-weight="700" fill="#0f1a14" text-anchor="middle">&#10003;</text>
  <text x="460" y="178" font-size="16" font-weight="600" fill="currentColor">Natural</text>
  <text x="460" y="200" font-size="13" fill="currentColor" opacity="0.6">Eased spacing, arced path : organic</text>
  <polyline points="440.0,330.0 446.6,302.2 465.8,277.1 495.6,257.2 533.3,244.4 575.0,240.0 616.7,244.4 654.4,257.2 684.2,277.1 703.4,302.2 710.0,330.0" fill="none" stroke="#4ADE80" stroke-width="1.5" opacity="0.4"/>
    <circle cx="440.0" cy="330.0" r="6" fill="#4ADE80"/>
    <circle cx="446.6" cy="302.2" r="6" fill="#4ADE80"/>
    <circle cx="465.8" cy="277.1" r="6" fill="#4ADE80"/>
    <circle cx="495.6" cy="257.2" r="6" fill="#4ADE80"/>
    <circle cx="533.3" cy="244.4" r="6" fill="#4ADE80"/>
    <circle cx="575.0" cy="240.0" r="6" fill="#4ADE80"/>
    <circle cx="616.7" cy="244.4" r="6" fill="#4ADE80"/>
    <circle cx="654.4" cy="257.2" r="6" fill="#4ADE80"/>
    <circle cx="684.2" cy="277.1" r="6" fill="#4ADE80"/>
    <circle cx="703.4" cy="302.2" r="6" fill="#4ADE80"/>
    <circle cx="710.0" cy="330.0" r="6" fill="#4ADE80"/>
  <text x="580" y="430" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">Eases out, arcs, eases in</text>

  <rect x="40" y="506" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Color is a hint, not the message. The cross and check carry the meaning on their own.</text>
</svg>
