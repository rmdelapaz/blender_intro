<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="tg-title tg-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="tg-title">The Blender Move Gizmo</title>
  <desc id="tg-desc">A single-panel diagram of Blender's move (grab) gizmo on a selected cube. Three arrows emanate from the cube center: a red X arrow pointing horizontally to the right, a green Y arrow pointing diagonally upper-right (representing the +Y axis going away from the viewer), and a blue Z arrow pointing straight up. A white-outlined circle around the cube origin represents the free-movement handle that drags the object in any direction. Each gizmo element has an annotation label with a small connector line: the X arrow labels "X axis, left and right", the Y arrow labels "Y axis, forward and back", the Z arrow labels "Z axis, up and down", and the center circle labels "Free movement, any direction". A footer tip reminds the reader that the gizmo appears when an object is selected and that clicking and dragging an arrow constrains motion to that axis.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">THE MOVE GIZMO</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Three arrows and a center for free movement</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Subhead: how to enable -->
  <text x="400" y="142" font-size="13" font-weight="700" fill="#FF6B00" text-anchor="middle" letter-spacing="2">PRESS G TO MOVE THE SELECTED OBJECT</text>

  <!-- ===================================================================== -->
  <!-- HERO VISUAL: cube + gizmo at center-left, annotations on right and below -->
  <!-- Gizmo origin (cube visual center): (300, 310)                            -->
  <!-- ===================================================================== -->

  <!-- ===== Cube wireframe (sits under the gizmo) ===== -->
  <!-- Front face -->
  <g opacity="0.10">
    <rect x="278" y="288" width="44" height="44" fill="currentColor"/>
    <polygon points="278,288 290,276 334,276 322,288" fill="currentColor"/>
    <polygon points="322,288 334,276 334,320 322,332" fill="currentColor"/>
  </g>
  <g stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.75">
    <rect x="278" y="288" width="44" height="44"/>
    <polygon points="278,288 290,276 334,276 322,288"/>
    <polygon points="322,288 334,276 334,320 322,332"/>
  </g>

  <!-- ===== Gizmo arrows from origin (300, 310) ===== -->

  <!-- X arrow (red, +X to the right) -->
  <line x1="300" y1="310" x2="450" y2="310" stroke="#E63946" stroke-width="4" stroke-linecap="round"/>
  <polygon points="450,310 436,303 436,317" fill="#E63946"/>

  <!-- Y arrow (green, +Y upper-right at 45 degrees, representing "into the scene") -->
  <line x1="300" y1="310" x2="380" y2="230" stroke="#4ADE80" stroke-width="4" stroke-linecap="round"/>
  <polygon points="380,230 367,237 373,243" fill="#4ADE80"/>

  <!-- Z arrow (blue, +Z straight up) -->
  <line x1="300" y1="310" x2="300" y2="170" stroke="#4A9EFF" stroke-width="4" stroke-linecap="round"/>
  <polygon points="300,170 293,184 307,184" fill="#4A9EFF"/>

  <!-- ===== Free-movement handle (white-outlined circle at origin, on top of cube) ===== -->
  <circle cx="300" cy="310" r="22" fill="none" stroke="currentColor" stroke-width="2.2" opacity="0.6"/>
  <circle cx="300" cy="310" r="3.5" fill="currentColor" opacity="0.85"/>

  <!-- ===================================================================== -->
  <!-- ANNOTATIONS                                                             -->
  <!-- Each: small anchor dot at the source point, a thin connector line to    -->
  <!-- the label group, two-line label (axis name in axis color, descriptor in -->
  <!-- currentColor at reduced opacity)                                        -->
  <!-- ===================================================================== -->

  <!-- Z annotation (top-right) -->
  <circle cx="300" cy="170" r="2.5" fill="currentColor" opacity="0.5"/>
  <line x1="302" y1="170" x2="495" y2="195" stroke="currentColor" stroke-width="1" opacity="0.35" stroke-linecap="round"/>
  <text x="500" y="200" font-size="15" font-weight="600" fill="#4A9EFF">Z axis</text>
  <text x="500" y="218" font-size="13" fill="currentColor" opacity="0.65">up and down</text>

  <!-- Y annotation (upper-middle right) -->
  <circle cx="380" cy="230" r="2.5" fill="currentColor" opacity="0.5"/>
  <line x1="382" y1="232" x2="495" y2="252" stroke="currentColor" stroke-width="1" opacity="0.35" stroke-linecap="round"/>
  <text x="500" y="257" font-size="15" font-weight="600" fill="#4ADE80">Y axis</text>
  <text x="500" y="275" font-size="13" fill="currentColor" opacity="0.65">forward and back</text>

  <!-- X annotation (middle right) -->
  <circle cx="450" cy="310" r="2.5" fill="currentColor" opacity="0.5"/>
  <line x1="452" y1="310" x2="495" y2="312" stroke="currentColor" stroke-width="1" opacity="0.35" stroke-linecap="round"/>
  <text x="500" y="316" font-size="15" font-weight="600" fill="#E63946">X axis</text>
  <text x="500" y="334" font-size="13" fill="currentColor" opacity="0.65">left and right</text>

  <!-- Free-movement annotation (below the gizmo, centered under it) -->
  <circle cx="300" cy="333" r="2.5" fill="currentColor" opacity="0.5"/>
  <line x1="300" y1="335" x2="300" y2="402" stroke="currentColor" stroke-width="1" opacity="0.35" stroke-linecap="round"/>
  <text x="300" y="418" font-size="15" font-weight="600" fill="currentColor" text-anchor="middle">Free movement</text>
  <text x="300" y="436" font-size="13" fill="currentColor" opacity="0.65" text-anchor="middle">any direction</text>

  <!-- ===== Key idea inset (bottom-right, mirrors orbit_operation style) ===== -->
  <g transform="translate(500, 380)">
    <rect x="0" y="0" width="240" height="76" rx="6"
          fill="currentColor" fill-opacity="0.04"
          stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>
    <text x="14" y="20" font-size="11" font-weight="700" fill="currentColor" opacity="0.75" letter-spacing="0.8">HOW IT WORKS</text>
    <text x="14" y="40" font-size="12" fill="currentColor" opacity="0.8">Click and drag an arrow:</text>
    <text x="14" y="56" font-size="12" fill="currentColor" opacity="0.8">motion locks to that axis.</text>
    <text x="14" y="72" font-size="12" fill="currentColor" opacity="0.8">Drag the center: free move.</text>
  </g>

  <!-- Footer tip callout -->
  <rect x="40" y="506" width="720" height="34" rx="6"
        fill="#FF6B00" fill-opacity="0.10"
        stroke="#FF6B00" stroke-opacity="0.4"/>
  <text x="54" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> The gizmo appears whenever an object is selected. Press G first if you prefer to type the axis: G then X locks the move to X.
  </text>
</svg>
