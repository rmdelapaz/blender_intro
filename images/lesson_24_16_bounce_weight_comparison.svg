<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="bw-title bw-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="bw-title">Bounce behaviour by weight: light versus heavy</title>
  <desc id="bw-desc">Two bounce trajectories along a shared ground line. A light object bounces high and decays slowly across many arcs with long hang-time; a heavy object bounces low and decays fast across few arcs with short hang-time. Weight reads through how quickly the bounce decays, not the object size.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">WEIGHT THROUGH BOUNCE</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Mass reads through how fast the bounce decays, not the ball's size</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- LIGHT panel (left) -->
  <text x="60" y="150" font-size="18" font-weight="600" fill="currentColor">LIGHT</text>
  <!-- name pill + balloon glyph -->
  <g>
    <rect x="118" y="135" width="118" height="22" rx="11" fill="none" stroke="#FF6B00" stroke-opacity="0.5"/>
    <circle cx="133" cy="146" r="6" fill="#FF6B00"/>
    <path d="M 133 152 L 130 160 L 136 160 Z" fill="#FF6B00"/>
    <text x="146" y="151" font-size="12" fill="currentColor">beach ball</text>
  </g>

  <!-- ground line shared, drawn full width -->
  <line x1="56" y1="430" x2="744" y2="430" stroke="currentColor" stroke-width="2" opacity="0.5"/>
  <text x="56" y="448" font-size="12" fill="currentColor" opacity="0.6">ground</text>

  <!-- vertical divider between panels -->
  <line x1="400" y1="128" x2="400" y2="410" stroke="currentColor" stroke-width="1" opacity="0.12" stroke-dasharray="3 5"/>

  <!-- LIGHT: tall arcs, slow decay (apexes 200,235,262,283) -->
  <g fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round" opacity="0.7">
    <path d="M 70 430 Q 110 -30 150 430"/>
    <path d="M 150 430 Q 188 40 226 430"/>
    <path d="M 226 430 Q 260 94 294 430"/>
    <path d="M 294 430 Q 324 136 354 430"/>
    <path d="M 354 430 Q 374 290 394 430"/>
  </g>
  <!-- apex ghost dots + apex-height ticks -->
  <g>
    <line x1="110" y1="200" x2="110" y2="430" stroke="currentColor" stroke-width="1" opacity="0.25" stroke-dasharray="2 4"/>
    <line x1="188" y1="235" x2="188" y2="430" stroke="currentColor" stroke-width="1" opacity="0.25" stroke-dasharray="2 4"/>
    <line x1="260" y1="262" x2="260" y2="430" stroke="currentColor" stroke-width="1" opacity="0.25" stroke-dasharray="2 4"/>
    <line x1="324" y1="283" x2="324" y2="430" stroke="currentColor" stroke-width="1" opacity="0.25" stroke-dasharray="2 4"/>
    <circle cx="110" cy="200" r="7" fill="#FF6B00"/>
    <circle cx="188" cy="235" r="7" fill="#FF6B00"/>
    <circle cx="260" cy="262" r="7" fill="#FF6B00"/>
    <circle cx="324" cy="283" r="7" fill="#FF6B00"/>
    <circle cx="374" cy="360" r="6" fill="#FF6B00"/>
    <!-- ground contacts -->
    <circle cx="150" cy="430" r="4" fill="#FF6B00" opacity="0.8"/>
    <circle cx="226" cy="430" r="4" fill="#FF6B00" opacity="0.8"/>
    <circle cx="294" cy="430" r="4" fill="#FF6B00" opacity="0.8"/>
    <circle cx="354" cy="430" r="4" fill="#FF6B00" opacity="0.8"/>
  </g>
  <text x="78" y="190" font-size="11" fill="currentColor" opacity="0.7">high, slow decay</text>
  <text x="225" y="470" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.6">many arcs &#183; long hang-time</text>

  <!-- HEAVY panel (right) -->
  <text x="430" y="150" font-size="18" font-weight="600" fill="currentColor">HEAVY</text>
  <g>
    <rect x="496" y="135" width="120" height="22" rx="11" fill="none" stroke="#FF6B00" stroke-opacity="0.5"/>
    <circle cx="511" cy="146" r="6" fill="#FF6B00"/>
    <text x="524" y="151" font-size="12" fill="currentColor">bowling ball</text>
  </g>

  <!-- HEAVY: low arcs, fast decay (apexes 360,395,415) -->
  <g fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round" opacity="0.7">
    <path d="M 440 430 Q 480 266 520 430"/>
    <path d="M 520 430 Q 552 354 584 430"/>
    <path d="M 584 430 Q 608 398 632 430"/>
  </g>
  <g>
    <line x1="480" y1="348" x2="480" y2="430" stroke="currentColor" stroke-width="1" opacity="0.25" stroke-dasharray="2 4"/>
    <line x1="552" y1="392" x2="552" y2="430" stroke="currentColor" stroke-width="1" opacity="0.25" stroke-dasharray="2 4"/>
    <circle cx="480" cy="348" r="7" fill="#FF6B00"/>
    <circle cx="552" cy="392" r="7" fill="#FF6B00"/>
    <circle cx="608" cy="414" r="6" fill="#FF6B00"/>
    <circle cx="520" cy="430" r="4" fill="#FF6B00" opacity="0.8"/>
    <circle cx="584" cy="430" r="4" fill="#FF6B00" opacity="0.8"/>
    <circle cx="632" cy="430" r="4" fill="#FF6B00" opacity="0.8"/>
  </g>
  <text x="446" y="338" font-size="11" fill="currentColor" opacity="0.7">low, fast decay</text>
  <text x="560" y="470" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.6">few arcs &#183; short hang-time</text>

  <!-- Footer tip Variant B -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Heavier objects bounce lower and settle faster &#183; weight shows in how fast the bounce decays.</text>
</svg>
