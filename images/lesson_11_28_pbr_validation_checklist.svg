<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="vc-title vc-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="vc-title">PBR material validation checklist</title>
  <desc id="vc-desc">A six-section checklist for validating a physically based material: Energy Conservation, Metallic Value, Roughness Accuracy, Albedo and Base Color, Fresnel Behavior, and Lighting Independence. Each section has an icon and two check items covering the key physical criteria a material should pass.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">PBR VALIDATION CHECKLIST</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Six checks every physically based material should pass</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ============ Row 1: left = Energy Conservation, right = Metallic Value ============ -->

  <!-- Section 1: Energy Conservation -->
  <g>
    <!-- icon: balanced scales -->
    <g stroke="#4ADE80" stroke-width="2.5" fill="none" stroke-linecap="round">
      <line x1="64" y1="150" x2="64" y2="178"/>
      <line x1="48" y1="158" x2="80" y2="158"/>
      <path d="M 48 158 L 41 174 L 55 174 Z" fill="#4ADE80" fill-opacity="0.18"/>
      <path d="M 80 158 L 73 174 L 87 174 Z" fill="#4ADE80" fill-opacity="0.18"/>
      <line x1="56" y1="182" x2="72" y2="182"/>
    </g>
    <text x="100" y="158" font-size="16" font-weight="600" fill="currentColor">Energy Conservation</text>
    <text x="100" y="178" font-size="13" fill="currentColor" opacity="0.6">No more light out than comes in</text>
    <!-- check items -->
    <g>
      <rect x="100" y="196" width="15" height="15" rx="3" fill="none" stroke="#4ADE80" stroke-width="2"/>
      <path d="M 103 204 L 107 208 L 113 199" fill="none" stroke="#4ADE80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="124" y="208" font-size="13" fill="currentColor">Never glows brighter than the light</text>
    </g>
    <g>
      <rect x="100" y="218" width="15" height="15" rx="3" fill="none" stroke="#4ADE80" stroke-width="2"/>
      <path d="M 103 226 L 107 230 L 113 221" fill="none" stroke="#4ADE80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="124" y="230" font-size="13" fill="currentColor">Passes the white-room test</text>
    </g>
  </g>

  <!-- Section 2: Metallic Value -->
  <g>
    <!-- icon: metal atom -->
    <g stroke="#F5C242" stroke-width="2" fill="none">
      <circle cx="424" cy="166" r="4" fill="#F5C242"/>
      <ellipse cx="424" cy="166" rx="16" ry="7"/>
      <ellipse cx="424" cy="166" rx="16" ry="7" transform="rotate(60 424 166)"/>
      <ellipse cx="424" cy="166" rx="16" ry="7" transform="rotate(120 424 166)"/>
    </g>
    <text x="460" y="158" font-size="16" font-weight="600" fill="currentColor">Metallic Value</text>
    <text x="460" y="178" font-size="13" fill="currentColor" opacity="0.6">A material is metal or it is not</text>
    <g>
      <rect x="460" y="196" width="15" height="15" rx="3" fill="none" stroke="#4ADE80" stroke-width="2"/>
      <path d="M 463 204 L 467 208 L 473 199" fill="none" stroke="#4ADE80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="484" y="208" font-size="13" fill="currentColor">Set to 0.0 or 1.0 only</text>
    </g>
    <g>
      <rect x="460" y="218" width="15" height="15" rx="3" fill="none" stroke="#4ADE80" stroke-width="2"/>
      <path d="M 463 226 L 467 230 L 473 221" fill="none" stroke="#4ADE80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="484" y="230" font-size="13" fill="currentColor">Metals show colored reflections</text>
    </g>
  </g>

  <line x1="40" y1="256" x2="760" y2="256" stroke="currentColor" stroke-width="1" opacity="0.1"/>

  <!-- ============ Row 2: left = Roughness Accuracy, right = Albedo / Base Color ============ -->

  <!-- Section 3: Roughness Accuracy -->
  <g>
    <!-- icon: surface texture -->
    <g stroke="#4A9EFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 48 300 Q 54 286 60 300 Q 66 314 72 300 Q 78 286 84 300"/>
      <path d="M 48 290 Q 54 282 60 290 Q 66 298 72 290 Q 78 282 84 290" opacity="0.5"/>
    </g>
    <text x="100" y="296" font-size="16" font-weight="600" fill="currentColor">Roughness Accuracy</text>
    <text x="100" y="316" font-size="13" fill="currentColor" opacity="0.6">Matches the real material</text>
    <g>
      <rect x="100" y="334" width="15" height="15" rx="3" fill="none" stroke="#4ADE80" stroke-width="2"/>
      <path d="M 103 342 L 107 346 L 113 337" fill="none" stroke="#4ADE80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="124" y="346" font-size="13" fill="currentColor">Within the real reference range</text>
    </g>
    <g>
      <rect x="100" y="356" width="15" height="15" rx="3" fill="none" stroke="#4ADE80" stroke-width="2"/>
      <path d="M 103 364 L 107 368 L 113 359" fill="none" stroke="#4ADE80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="124" y="368" font-size="13" fill="currentColor">Highlights read right at all angles</text>
    </g>
  </g>

  <!-- Section 4: Albedo / Base Color -->
  <g>
    <!-- icon: color wheel -->
    <g>
      <circle cx="424" cy="304" r="15" fill="none" stroke="currentColor" stroke-width="1" opacity="0.3"/>
      <path d="M 424 304 L 424 289 A 15 15 0 0 1 437 311 Z" fill="#E63946"/>
      <path d="M 424 304 L 437 311 A 15 15 0 0 1 411 311 Z" fill="#4ADE80"/>
      <path d="M 424 304 L 411 311 A 15 15 0 0 1 424 289 Z" fill="#4A9EFF"/>
      <circle cx="424" cy="304" r="4" fill="currentColor"/>
    </g>
    <text x="460" y="296" font-size="16" font-weight="600" fill="currentColor">Albedo &#183; Base Color</text>
    <text x="460" y="316" font-size="13" fill="currentColor" opacity="0.6">Stay inside physical limits</text>
    <g>
      <rect x="460" y="334" width="15" height="15" rx="3" fill="none" stroke="#4ADE80" stroke-width="2"/>
      <path d="M 463 342 L 467 346 L 473 337" fill="none" stroke="#4ADE80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="484" y="346" font-size="13" fill="currentColor">Within the 0.02 to 0.95 range</text>
    </g>
    <g>
      <rect x="460" y="356" width="15" height="15" rx="3" fill="none" stroke="#4ADE80" stroke-width="2"/>
      <path d="M 463 364 L 467 368 L 473 359" fill="none" stroke="#4ADE80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="484" y="368" font-size="13" fill="currentColor">No pure black or pure white</text>
    </g>
  </g>

  <line x1="40" y1="394" x2="760" y2="394" stroke="currentColor" stroke-width="1" opacity="0.1"/>

  <!-- ============ Row 3: left = Fresnel Behavior, right = Lighting Independence ============ -->

  <!-- Section 5: Fresnel Behavior -->
  <g>
    <!-- icon: angle diagram -->
    <g stroke="#FF7EA8" stroke-width="2.5" fill="none" stroke-linecap="round">
      <line x1="46" y1="446" x2="86" y2="446"/>
      <line x1="66" y1="446" x2="50" y2="424"/>
      <line x1="66" y1="446" x2="82" y2="424"/>
      <path d="M 58 446 A 10 10 0 0 1 62 437" stroke-width="1.5"/>
    </g>
    <text x="100" y="438" font-size="16" font-weight="600" fill="currentColor">Fresnel Behavior</text>
    <text x="100" y="458" font-size="13" fill="currentColor" opacity="0.6">Edges brighten at grazing angles</text>
    <g>
      <rect x="100" y="476" width="15" height="15" rx="3" fill="none" stroke="#4ADE80" stroke-width="2"/>
      <path d="M 103 484 L 107 488 L 113 479" fill="none" stroke="#4ADE80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="124" y="488" font-size="13" fill="currentColor">Specular left at the default 0.5</text>
    </g>
    <g>
      <rect x="100" y="498" width="15" height="15" rx="3" fill="none" stroke="#4ADE80" stroke-width="2"/>
      <path d="M 103 506 L 107 510 L 113 501" fill="none" stroke="#4ADE80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="124" y="510" font-size="13" fill="currentColor">Edge highlights appear correctly</text>
    </g>
  </g>

  <!-- Section 6: Lighting Independence -->
  <g>
    <!-- icon: lightbulb -->
    <g stroke="#F5C242" stroke-width="2" fill="none" stroke-linecap="round">
      <circle cx="424" cy="440" r="11" fill="#F5C242" fill-opacity="0.18"/>
      <line x1="419" y1="453" x2="429" y2="453"/>
      <line x1="420" y1="457" x2="428" y2="457"/>
      <line x1="424" y1="424" x2="424" y2="418"/>
      <line x1="438" y1="430" x2="443" y2="426"/>
      <line x1="410" y1="430" x2="405" y2="426"/>
    </g>
    <text x="460" y="438" font-size="16" font-weight="600" fill="currentColor">Lighting Independence</text>
    <text x="460" y="458" font-size="13" fill="currentColor" opacity="0.6">Correct in any environment</text>
    <g>
      <rect x="460" y="476" width="15" height="15" rx="3" fill="none" stroke="#4ADE80" stroke-width="2"/>
      <path d="M 463 484 L 467 488 L 473 479" fill="none" stroke="#4ADE80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="484" y="488" font-size="13" fill="currentColor">Looks right in any HDRI</text>
    </g>
    <g>
      <rect x="460" y="498" width="15" height="15" rx="3" fill="none" stroke="#4ADE80" stroke-width="2"/>
      <path d="M 463 506 L 467 510 L 473 501" fill="none" stroke="#4ADE80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="484" y="510" font-size="13" fill="currentColor">No per-scene parameter tweaks</text>
    </g>
  </g>

  <line x1="40" y1="548" x2="760" y2="548" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Pass-condition strip -->
  <rect x="40" y="566" width="4" height="44" fill="#4ADE80"/>
  <text x="58" y="584" font-size="14" font-weight="700" fill="currentColor">All twelve boxes checked &#183; the material is physically valid</text>
  <text x="58" y="604" font-size="13" fill="currentColor" opacity="0.65">A green check on every line means the material holds up under any light, at any angle.</text>

  <!-- Footer tip (Variant B, left rail) -->
  <rect x="40" y="625" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="625" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="647" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Run this list against every material, not just the ones that look wrong, the subtle misses hide in the passes.
  </text>
</svg>
