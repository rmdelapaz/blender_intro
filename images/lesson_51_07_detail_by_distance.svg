<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="lod-title lod-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="lod-title">Detail by distance from camera</title>
  <desc id="lod-desc">The detail-distance rule: detail needed is inversely proportional to distance from the camera. A hero object one foot away gets full detail, a supporting object gets medium detail, and a background object ten feet away needs roughly ten times less detail.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">The Detail Distance Rule</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Detail needed is inversely proportional to distance from camera</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Camera glyph -->
  <g transform="translate(56,300)">
    <rect x="0" y="-16" width="34" height="32" rx="4" fill="#FF6B00"/>
    <path d="M 34 -8 L 50 -18 L 50 18 L 34 8 Z" fill="#FF6B00"/>
    <circle cx="17" cy="0" r="8" fill="#1e1e1e" opacity="0.35"/>
  </g>
  <text x="56" y="340" font-size="13" font-weight="600" fill="currentColor">Camera</text>

  <!-- Distance axis -->
  <line x1="120" y1="360" x2="740" y2="360" stroke="currentColor" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
  <text x="120" y="382" font-size="12" fill="currentColor" opacity="0.6">1 ft</text>
  <text x="410" y="382" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">5 ft</text>
  <text x="740" y="382" font-size="12" fill="currentColor" opacity="0.6" text-anchor="end">10 ft</text>

  <!-- Three objects, shrinking density with distance -->
  <!-- Hero: 1ft, full detail (fine grid) -->
  <g transform="translate(150,180)">
    <rect x="0" y="0" width="150" height="150" rx="4" fill="none" stroke="#4ADE80" stroke-width="2.5"/>
    <g stroke="#4ADE80" stroke-width="1" opacity="0.55">
      <line x1="25" y1="0" x2="25" y2="150"/><line x1="50" y1="0" x2="50" y2="150"/>
      <line x1="75" y1="0" x2="75" y2="150"/><line x1="100" y1="0" x2="100" y2="150"/>
      <line x1="125" y1="0" x2="125" y2="150"/>
      <line x1="0" y1="25" x2="150" y2="25"/><line x1="0" y1="50" x2="150" y2="50"/>
      <line x1="0" y1="75" x2="150" y2="75"/><line x1="0" y1="100" x2="150" y2="100"/>
      <line x1="0" y1="125" x2="150" y2="125"/>
    </g>
  </g>
  <text x="225" y="352" font-size="13" font-weight="600" fill="#4ADE80" text-anchor="middle">Hero</text>
  <text x="225" y="166" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">full detail</text>

  <!-- Supporting: 5ft, medium detail -->
  <g transform="translate(380,205)">
    <rect x="0" y="0" width="110" height="110" rx="4" fill="none" stroke="#F5C242" stroke-width="2.5"/>
    <g stroke="#F5C242" stroke-width="1" opacity="0.55">
      <line x1="37" y1="0" x2="37" y2="110"/><line x1="73" y1="0" x2="73" y2="110"/>
      <line x1="0" y1="37" x2="110" y2="37"/><line x1="0" y1="73" x2="110" y2="73"/>
    </g>
  </g>
  <text x="435" y="352" font-size="13" font-weight="600" fill="#F5C242" text-anchor="middle">Supporting</text>
  <text x="435" y="196" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">medium detail</text>

  <!-- Background: 10ft, minimal detail -->
  <g transform="translate(640,240)">
    <rect x="0" y="0" width="70" height="70" rx="4" fill="none" stroke="#4A9EFF" stroke-width="2.5"/>
    <g stroke="#4A9EFF" stroke-width="1" opacity="0.55">
      <line x1="35" y1="0" x2="35" y2="70"/>
      <line x1="0" y1="35" x2="70" y2="35"/>
    </g>
  </g>
  <text x="675" y="352" font-size="13" font-weight="600" fill="#4A9EFF" text-anchor="middle">Background</text>
  <text x="675" y="231" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">minimal detail</text>

  <!-- Rule callout band -->
  <text x="400" y="432" font-size="15" font-weight="600" fill="currentColor" text-anchor="middle">10 ft from camera &#8594; roughly 10&#215; less detail than 1 ft</text>
  <text x="400" y="458" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">Don't waste time adding detail the camera will never see.</text>

  <!-- Footer tip (Variant B, left rail) -->
  <rect x="40" y="506" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Focus background objects on silhouette, not surface detail &#183; nobody zooms in on these.
  </text>
</svg>
