<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="po-title po-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="po-title">The 12 principles of animation</title>
  <desc id="po-desc">A grid of the twelve classic principles of animation, each numbered one through twelve with its name and a short descriptor, grouped from squash and stretch through appeal.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">The 12 principles of animation</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Disney's foundational toolkit : every believable motion uses several at once</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Principle grid: 3 cols x 4 rows. Col x-origins 40 / 293 / 546. Card 214 wide. Row tops 138 / 264 / 390 / 516, row height 110. -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

    <!-- Row 1 -->
    <!-- 1 Squash and stretch -->
    <rect x="40" y="138" width="214" height="110" rx="8" fill="currentColor" opacity="0.04"/>
    <circle cx="68" cy="166" r="14" fill="#FF6B00"/>
    <text x="68" y="171" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="92" y="171" font-size="15" font-weight="600" fill="currentColor">Squash &amp; stretch</text>
    <text x="60" y="200" font-size="13" fill="currentColor" opacity="0.6">Deform, keep volume</text>
    <text x="60" y="220" font-size="13" fill="currentColor" opacity="0.6">Sells weight and impact</text>

    <!-- 2 Anticipation -->
    <rect x="293" y="138" width="214" height="110" rx="8" fill="currentColor" opacity="0.04"/>
    <circle cx="321" cy="166" r="14" fill="#FF6B00"/>
    <text x="321" y="171" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="345" y="171" font-size="15" font-weight="600" fill="currentColor">Anticipation</text>
    <text x="313" y="200" font-size="13" fill="currentColor" opacity="0.6">A wind-up before action</text>
    <text x="313" y="220" font-size="13" fill="currentColor" opacity="0.6">Prepares the viewer</text>

    <!-- 3 Staging -->
    <rect x="546" y="138" width="214" height="110" rx="8" fill="currentColor" opacity="0.04"/>
    <circle cx="574" cy="166" r="14" fill="#FF6B00"/>
    <text x="574" y="171" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="598" y="171" font-size="15" font-weight="600" fill="currentColor">Staging</text>
    <text x="566" y="200" font-size="13" fill="currentColor" opacity="0.6">Direct the eye clearly</text>
    <text x="566" y="220" font-size="13" fill="currentColor" opacity="0.6">Reads in silhouette</text>

    <!-- Row 2 -->
    <!-- 4 Straight ahead / pose to pose -->
    <rect x="40" y="264" width="214" height="110" rx="8" fill="currentColor" opacity="0.04"/>
    <circle cx="68" cy="292" r="14" fill="#FF6B00"/>
    <text x="68" y="297" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="92" y="297" font-size="15" font-weight="600" fill="currentColor">Straight ahead</text>
    <text x="60" y="326" font-size="13" fill="currentColor" opacity="0.6">&amp; pose to pose</text>
    <text x="60" y="346" font-size="13" fill="currentColor" opacity="0.6">Two ways to build motion</text>

    <!-- 5 Follow-through / overlap -->
    <rect x="293" y="264" width="214" height="110" rx="8" fill="currentColor" opacity="0.04"/>
    <circle cx="321" cy="292" r="14" fill="#FF6B00"/>
    <text x="321" y="297" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
    <text x="345" y="297" font-size="15" font-weight="600" fill="currentColor">Follow-through</text>
    <text x="313" y="326" font-size="13" fill="currentColor" opacity="0.6">&amp; overlapping action</text>
    <text x="313" y="346" font-size="13" fill="currentColor" opacity="0.6">Parts settle at their pace</text>

    <!-- 6 Slow in slow out -->
    <rect x="546" y="264" width="214" height="110" rx="8" fill="currentColor" opacity="0.04"/>
    <circle cx="574" cy="292" r="14" fill="#FF6B00"/>
    <text x="574" y="297" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
    <text x="598" y="297" font-size="15" font-weight="600" fill="currentColor">Slow in, slow out</text>
    <text x="566" y="326" font-size="13" fill="currentColor" opacity="0.6">Ease at the extremes</text>
    <text x="566" y="346" font-size="13" fill="currentColor" opacity="0.6">Spacing makes it natural</text>

    <!-- Row 3 -->
    <!-- 7 Arcs -->
    <rect x="40" y="390" width="214" height="110" rx="8" fill="currentColor" opacity="0.04"/>
    <circle cx="68" cy="418" r="14" fill="#FF6B00"/>
    <text x="68" y="423" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>
    <text x="92" y="423" font-size="15" font-weight="600" fill="currentColor">Arcs</text>
    <text x="60" y="452" font-size="13" fill="currentColor" opacity="0.6">Natural motion curves</text>
    <text x="60" y="472" font-size="13" fill="currentColor" opacity="0.6">Rarely a straight line</text>

    <!-- 8 Secondary action -->
    <rect x="293" y="390" width="214" height="110" rx="8" fill="currentColor" opacity="0.04"/>
    <circle cx="321" cy="418" r="14" fill="#FF6B00"/>
    <text x="321" y="423" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">8</text>
    <text x="345" y="423" font-size="15" font-weight="600" fill="currentColor">Secondary action</text>
    <text x="313" y="452" font-size="13" fill="currentColor" opacity="0.6">Supporting detail motion</text>
    <text x="313" y="472" font-size="13" fill="currentColor" opacity="0.6">Adds life, not noise</text>

    <!-- 9 Timing -->
    <rect x="546" y="390" width="214" height="110" rx="8" fill="currentColor" opacity="0.04"/>
    <circle cx="574" cy="418" r="14" fill="#FF6B00"/>
    <text x="574" y="423" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">9</text>
    <text x="598" y="423" font-size="15" font-weight="600" fill="currentColor">Timing</text>
    <text x="566" y="452" font-size="13" fill="currentColor" opacity="0.6">Frame count sets speed</text>
    <text x="566" y="472" font-size="13" fill="currentColor" opacity="0.6">Defines weight and mood</text>

    <!-- Row 4 -->
    <!-- 10 Exaggeration -->
    <rect x="40" y="516" width="214" height="110" rx="8" fill="currentColor" opacity="0.04"/>
    <circle cx="72" cy="544" r="14" fill="#FF6B00"/>
    <text x="72" y="549" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">10</text>
    <text x="96" y="549" font-size="15" font-weight="600" fill="currentColor">Exaggeration</text>
    <text x="60" y="578" font-size="13" fill="currentColor" opacity="0.6">Push past the literal</text>
    <text x="60" y="598" font-size="13" fill="currentColor" opacity="0.6">Clarity over realism</text>

    <!-- 11 Solid drawing -->
    <rect x="293" y="516" width="214" height="110" rx="8" fill="currentColor" opacity="0.04"/>
    <circle cx="325" cy="544" r="14" fill="#FF6B00"/>
    <text x="325" y="549" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">11</text>
    <text x="349" y="549" font-size="15" font-weight="600" fill="currentColor">Solid drawing</text>
    <text x="313" y="578" font-size="13" fill="currentColor" opacity="0.6">Believable form and mass</text>
    <text x="313" y="598" font-size="13" fill="currentColor" opacity="0.6">Weight, balance, depth</text>

    <!-- 12 Appeal -->
    <rect x="546" y="516" width="214" height="110" rx="8" fill="currentColor" opacity="0.04"/>
    <circle cx="578" cy="544" r="14" fill="#FF6B00"/>
    <text x="578" y="549" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">12</text>
    <text x="602" y="549" font-size="15" font-weight="600" fill="currentColor">Appeal</text>
    <text x="566" y="578" font-size="13" fill="currentColor" opacity="0.6">Charisma the eye enjoys</text>
    <text x="566" y="598" font-size="13" fill="currentColor" opacity="0.6">Not just being pretty</text>

  </g>

  <!-- Footer tip (Variant B, left rail) at dense-variant y -->
  <rect x="40" y="641" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> The principles overlap : a good bounce uses squash, timing, spacing, and arcs together.
  </text>
</svg>
