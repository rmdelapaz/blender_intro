<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="it-title it-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="it-title">Interpolation types in Blender</title>
  <desc id="it-desc">Four value-versus-frame curve cards comparing how Blender fills the frames between keyframes: Linear is a straight diagonal (constant speed), Bezier is a smooth S-curve (the adjustable default), Ease In and Out is a gentle symmetric S, and Constant is a stair-step that jumps with no in-between motion.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">INTERPOLATION</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">How Blender fills the frames between keyframes</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- 2x2 grid of curve cards. Card plot area = 250 wide x 120 tall.
       Cols at x=40 and x=420 ; Rows at y=138 and y=330. -->

  <!-- ============ Card: Linear (top-left) ============ -->
  <g>
    <!-- axis cross -->
    <line x1="70" y1="158" x2="70" y2="268" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
    <line x1="70" y1="268" x2="320" y2="268" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
    <text x="58" y="154" font-size="11" fill="currentColor" opacity="0.45">value</text>
    <text x="300" y="286" font-size="11" fill="currentColor" opacity="0.45">frame</text>
    <!-- curve: straight diagonal -->
    <path d="M 70 268 L 320 162" fill="none" stroke="#FF6B00" stroke-width="3" stroke-linecap="round"/>
    <!-- label + gloss -->
    <text x="70" y="306" font-size="15" font-weight="600" fill="currentColor">Linear</text>
    <text x="70" y="324" font-size="13" fill="currentColor" opacity="0.6">Constant speed, no acceleration (robotic)</text>
  </g>

  <!-- ============ Card: Bezier (top-right, tie-break default) ============ -->
  <g>
    <!-- faint orange emphasis edge around the default card's plot -->
    <rect x="446" y="150" width="284" height="130" rx="6" fill="none" stroke="#FF6B00" stroke-width="1.5" opacity="0.5"/>
    <!-- axis cross -->
    <line x1="470" y1="158" x2="470" y2="268" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
    <line x1="470" y1="268" x2="710" y2="268" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
    <text x="458" y="154" font-size="11" fill="currentColor" opacity="0.45">value</text>
    <text x="690" y="286" font-size="11" fill="currentColor" opacity="0.45">frame</text>
    <!-- curve: smooth S -->
    <path d="M 470 268 C 540 268 540 162 710 162" fill="none" stroke="#FF6B00" stroke-width="3" stroke-linecap="round"/>
    <!-- label + gloss -->
    <text x="470" y="306" font-size="15" font-weight="600" fill="currentColor">Bezier</text>
    <text x="470" y="324" font-size="13" fill="currentColor" opacity="0.6">Smooth, adjustable handles (default)</text>
  </g>

  <!-- ============ Card: Ease In/Out (bottom-left) ============ -->
  <g>
    <!-- axis cross -->
    <line x1="70" y1="350" x2="70" y2="460" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
    <line x1="70" y1="460" x2="320" y2="460" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
    <text x="58" y="346" font-size="11" fill="currentColor" opacity="0.45">value</text>
    <text x="300" y="478" font-size="11" fill="currentColor" opacity="0.45">frame</text>
    <!-- curve: gentle symmetric S (slow-fast-slow) -->
    <path d="M 70 460 C 150 460 130 354 195 354 C 260 354 240 354 320 354" fill="none" stroke="#FF6B00" stroke-width="3" stroke-linecap="round"/>
    <!-- label + gloss -->
    <text x="70" y="498" font-size="15" font-weight="600" fill="currentColor">Ease In / Out</text>
    <text x="70" y="516" font-size="13" fill="currentColor" opacity="0.6">Slow start, fast middle, slow end</text>
  </g>

  <!-- ============ Card: Constant (bottom-right) ============ -->
  <g>
    <!-- axis cross -->
    <line x1="470" y1="350" x2="470" y2="460" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
    <line x1="470" y1="460" x2="710" y2="460" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
    <text x="458" y="346" font-size="11" fill="currentColor" opacity="0.45">value</text>
    <text x="690" y="478" font-size="11" fill="currentColor" opacity="0.45">frame</text>
    <!-- curve: stair-step -->
    <path d="M 470 460 L 550 460 L 550 407 L 630 407 L 630 354 L 710 354" fill="none" stroke="#FF6B00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- label + gloss -->
    <text x="470" y="498" font-size="15" font-weight="600" fill="currentColor">Constant</text>
    <text x="470" y="516" font-size="13" fill="currentColor" opacity="0.6">Instant jump, no in-betweens</text>
  </g>

  <!-- Footer tip (Variant B, left rail) -->
  <rect x="40" y="526" width="720" height="30" fill="none"/>
  <rect x="40" y="526" width="4" height="30" fill="#FF6B00"/>
  <text x="58" y="546" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Bezier is the default and suits most moves &#183; Linear feels mechanical, Constant snaps with no motion.</text>
</svg>
