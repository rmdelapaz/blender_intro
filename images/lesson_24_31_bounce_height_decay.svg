<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="bd-title bd-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="bd-title">Bounce height decays by a roughly constant ratio</title>
  <desc id="bd-desc">A single ball bouncing left to right along a ground line. Each successive apex is about seventy percent of the previous height, so the apexes step down 100, 70, 49, 34 percent. Dashed height-guide lines and percentage labels mark each apex; frame numbers mark each ground contact for blocking the project timeline.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">BOUNCE HEIGHT DECAY</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Each bounce keeps a roughly constant fraction of the last height</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- height-guide lines at each apex with % labels -->
  <g stroke="currentColor" stroke-width="1" opacity="0.22" stroke-dasharray="3 5">
    <line x1="60" y1="180" x2="740" y2="180"/>
    <line x1="60" y1="258" x2="740" y2="258"/>
    <line x1="60" y1="313" x2="740" y2="313"/>
    <line x1="60" y1="352" x2="740" y2="352"/>
  </g>
  <g font-size="12" fill="currentColor" opacity="0.7">
    <text x="748" y="184">100%</text>
    <text x="748" y="262">70%</text>
    <text x="748" y="317">49%</text>
    <text x="748" y="356">34%</text>
  </g>

  <!-- ground line -->
  <line x1="56" y1="440" x2="744" y2="440" stroke="currentColor" stroke-width="2" opacity="0.5"/>
  <text x="56" y="458" font-size="12" fill="currentColor" opacity="0.6">ground</text>

  <!-- decaying bounce arc series -->
  <path d="M 72 440 Q 170 -80 268 440 Q 353 76 439 440 Q 514 186 588 440 Q 653 264 719 440" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round" opacity="0.7"/>

  <!-- apex ghost balls -->
  <g>
    <circle cx="170" cy="180" r="9" fill="#FF6B00"/>
    <circle cx="353" cy="258" r="8" fill="#FF6B00"/>
    <circle cx="514" cy="313" r="7" fill="#FF6B00"/>
    <circle cx="653" cy="352" r="6" fill="#FF6B00"/>
  </g>
  <!-- ground-contact ghost balls -->
  <g>
    <circle cx="72" cy="440" r="5" fill="#FF6B00" opacity="0.85"/>
    <circle cx="268" cy="440" r="5" fill="#FF6B00" opacity="0.85"/>
    <circle cx="439" cy="440" r="5" fill="#FF6B00" opacity="0.85"/>
    <circle cx="588" cy="440" r="5" fill="#FF6B00" opacity="0.85"/>
    <circle cx="719" cy="440" r="5" fill="#FF6B00" opacity="0.85"/>
  </g>
  <!-- frame-number contact labels (blocking timeline) -->
  <g font-size="11" fill="currentColor" opacity="0.7" text-anchor="middle">
    <text x="72" y="472">f1</text>
    <text x="268" y="472">f14</text>
    <text x="439" y="472">f24</text>
    <text x="588" y="472">f32</text>
    <text x="719" y="472">f38</text>
  </g>

  <!-- Footer tip Variant B -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Each bounce loses a fairly constant fraction of its height &#183; block the apexes first, then fill the in-betweens.</text>
</svg>
