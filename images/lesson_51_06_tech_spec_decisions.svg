<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="tsc-title tsc-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="tsc-title">Technical specification decisions</title>
  <desc id="tsc-desc">Six technical decisions to lock before production: render engine, final resolution, render type, topology requirements, level of detail, and asset sources. Each shows the core question it answers so nothing has to be remade later.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Lock Your Tech Specs</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Decide these before you model &#183; prevents remaking things later</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Six decision rows -->
  <g font-size="15">
    <!-- Row 1: Render Engine -->
    <rect x="40" y="130" width="720" height="72" rx="6" fill="currentColor" opacity="0.04"/>
    <rect x="40" y="130" width="6" height="72" fill="#FF6B00"/>
    <text x="64" y="160" font-weight="600" fill="currentColor">Render Engine</text>
    <text x="64" y="184" font-size="13" fill="currentColor" opacity="0.6">Cycles or Eevee? Each has different material requirements.</text>

    <!-- Row 2: Final Resolution -->
    <rect x="40" y="212" width="720" height="72" rx="6" fill="currentColor" opacity="0.04"/>
    <rect x="40" y="212" width="6" height="72" fill="#4A9EFF"/>
    <text x="64" y="242" font-weight="600" fill="currentColor">Final Resolution</text>
    <text x="64" y="266" font-size="13" fill="currentColor" opacity="0.6">1920x1080? 4K? Portrait or landscape? Drives detail level.</text>

    <!-- Row 3: Render Type -->
    <rect x="40" y="294" width="720" height="72" rx="6" fill="currentColor" opacity="0.04"/>
    <rect x="40" y="294" width="6" height="72" fill="#F5C242"/>
    <text x="64" y="324" font-weight="600" fill="currentColor">Render Type</text>
    <text x="64" y="348" font-size="13" fill="currentColor" opacity="0.6">Still or animation? Single hero shot or multiple angles?</text>

    <!-- Row 4: Topology Requirements -->
    <rect x="40" y="376" width="720" height="72" rx="6" fill="currentColor" opacity="0.04"/>
    <rect x="40" y="376" width="6" height="72" fill="#B47EE8"/>
    <text x="64" y="406" font-weight="600" fill="currentColor">Topology Requirements</text>
    <text x="64" y="430" font-size="13" fill="currentColor" opacity="0.6">Animated needs clean topology &#183; display-only can optimize.</text>

    <!-- Row 5: Level of Detail -->
    <rect x="40" y="458" width="720" height="72" rx="6" fill="currentColor" opacity="0.04"/>
    <rect x="40" y="458" width="6" height="72" fill="#4ADE80"/>
    <text x="64" y="488" font-weight="600" fill="currentColor">Level of Detail</text>
    <text x="64" y="512" font-size="13" fill="currentColor" opacity="0.6">How close does the camera get? High detail vs. simple.</text>

    <!-- Row 6: Asset Sources -->
    <rect x="40" y="540" width="720" height="72" rx="6" fill="currentColor" opacity="0.04"/>
    <rect x="40" y="540" width="6" height="72" fill="#E63946"/>
    <text x="64" y="570" font-weight="600" fill="currentColor">Asset Sources</text>
    <text x="64" y="594" font-size="13" fill="currentColor" opacity="0.6">Model hero elements from scratch &#183; existing assets for minor ones.</text>
  </g>

  <!-- Footer tip (Variant B, left rail), dense 680 canvas -->
  <rect x="40" y="641" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Your portfolio shows what YOU can do, so the main subject should always be your own work.
  </text>
</svg>
