<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="hwf-title hwf-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <title id="hwf-title">Complete hair creation workflow</title>
    <desc id="hwf-desc">A top-to-bottom flowchart of the full hair pipeline in six stages: add a hair particle system, set emission and distribution, groom in particle edit mode, add hair dynamics, assign a hair material, then light and render. A side loop shows that grooming and dynamics are often revisited.</desc>
    <style>
        .hwf-box{fill:currentColor;fill-opacity:.05;stroke:currentColor;stroke-opacity:.4;stroke-width:1.5}
        .hwf-num{font:700 13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#FF6B00}
        .hwf-t{font:700 15px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:currentColor}
        .hwf-d{font:400 12px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:currentColor;opacity:.62}
        .hwf-flow{stroke:#FF6B00;stroke-width:2.5;fill:none}
        .hwf-loop{stroke:#4A9EFF;stroke-width:2;fill:none;stroke-dasharray:5 4}
    </style>
    <defs>
        <marker id="hwf-h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#FF6B00"/>
        </marker>
        <marker id="hwf-h-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#4A9EFF"/>
        </marker>
    </defs>
    <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
    <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">COMPLETE HAIR WORKFLOW</text>
    <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">System &#8594; emission &#8594; groom &#8594; dynamics &#8594; material &#8594; render</text>
    <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

    <!-- 6 boxes stacked, w=430 h=56, x=70 -->
    <!-- 1 -->
    <g transform="translate(70,128)">
        <rect class="hwf-box" width="430" height="56" rx="8"/>
        <text x="20" y="26" class="hwf-num">01</text>
        <text x="48" y="26" class="hwf-t">Add hair particle system</text>
        <text x="48" y="45" class="hwf-d">Particle Properties &#8594; New &#8594; type Hair</text>
    </g>
    <line class="hwf-flow" x1="285" y1="184" x2="285" y2="194" marker-end="url(#hwf-h)"/>
    <!-- 2 -->
    <g transform="translate(70,196)">
        <rect class="hwf-box" width="430" height="56" rx="8"/>
        <text x="20" y="26" class="hwf-num">02</text>
        <text x="48" y="26" class="hwf-t">Set emission &amp; distribution</text>
        <text x="48" y="45" class="hwf-d">Number, Length, Seed; Faces / Verts; density vgroup</text>
    </g>
    <line class="hwf-flow" x1="285" y1="252" x2="285" y2="262" marker-end="url(#hwf-h)"/>
    <!-- 3 -->
    <g transform="translate(70,264)">
        <rect class="hwf-box" width="430" height="56" rx="8"/>
        <text x="20" y="26" class="hwf-num">03</text>
        <text x="48" y="26" class="hwf-t">Groom in Particle Edit mode</text>
        <text x="48" y="45" class="hwf-d">Comb, Cut, Length, Puff; shape the guides</text>
    </g>
    <line class="hwf-flow" x1="285" y1="320" x2="285" y2="330" marker-end="url(#hwf-h)"/>
    <!-- 4 -->
    <g transform="translate(70,332)">
        <rect class="hwf-box" width="430" height="56" rx="8"/>
        <text x="20" y="26" class="hwf-num">04</text>
        <text x="48" y="26" class="hwf-t">Add hair dynamics</text>
        <text x="48" y="45" class="hwf-d">Stiffness, mass, pinning; let it settle &amp; bake</text>
    </g>
    <line class="hwf-flow" x1="285" y1="388" x2="285" y2="398" marker-end="url(#hwf-h)"/>
    <!-- 5 -->
    <g transform="translate(70,400)">
        <rect class="hwf-box" width="430" height="56" rx="8"/>
        <text x="20" y="26" class="hwf-num">05</text>
        <text x="48" y="26" class="hwf-t">Assign a hair material</text>
        <text x="48" y="45" class="hwf-d">Principled Hair BSDF; root-to-tip color; children</text>
    </g>
    <line class="hwf-flow" x1="285" y1="456" x2="285" y2="466" marker-end="url(#hwf-h)"/>
    <!-- 6 -->
    <g transform="translate(70,468)">
        <rect class="hwf-box" width="430" height="56" rx="8"/>
        <text x="20" y="26" class="hwf-num">06</text>
        <text x="48" y="26" class="hwf-t">Light &amp; render</text>
        <text x="48" y="45" class="hwf-d">Rim/back light; viewport &amp; render display %; Cycles for depth</text>
    </g>

    <!-- iterate loop: box5 right edge up to box3 right edge -->
    <path class="hwf-loop" d="M500,428 C600,428 600,292 510,292" marker-end="url(#hwf-h-blue)"/>
    <text x="612" y="356" class="hwf-d" fill="#4A9EFF">Iterate:</text>
    <text x="612" y="374" class="hwf-d" fill="#4A9EFF">re-groom after</text>
    <text x="612" y="392" class="hwf-d" fill="#4A9EFF">seeing dynamics</text>
    <text x="612" y="410" class="hwf-d" fill="#4A9EFF">&amp; material</text>

    <text x="612" y="156" class="hwf-d">A guide-hair count</text>
    <text x="612" y="174" class="hwf-d">stays low; children</text>
    <text x="612" y="192" class="hwf-d">multiply at render.</text>
</svg>
