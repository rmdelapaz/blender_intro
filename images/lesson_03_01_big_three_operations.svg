<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="b3-title b3-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="b3-title">The Big Three Viewport Navigation Operations</title>
  <desc id="b3-desc">A three-panel diagram comparing the three fundamental Blender viewport navigation operations. Orbit, triggered by middle-mouse-button drag, rotates the view around a central object. Pan, triggered by Shift plus middle-mouse-button drag, slides the view sideways without rotating. Zoom, triggered by the scroll wheel or Ctrl plus middle-mouse-button drag, moves the view closer to or further from the object. Each panel shows a wireframe cube with motion indicators specific to that operation.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">The Big Three: Orbit, Pan, Zoom</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Three fundamental operations cover every viewport movement in Blender.</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Panel separators (subtle) -->
  <line x1="278" y1="140" x2="278" y2="470" stroke="currentColor" stroke-width="1" opacity="0.12"/>
  <line x1="522" y1="140" x2="522" y2="470" stroke="currentColor" stroke-width="1" opacity="0.12"/>

  <!-- ============================================================== -->
  <!-- PANEL 1: ORBIT  (center x = 155)                                -->
  <!-- ============================================================== -->

  <text x="155" y="160" font-size="16" font-weight="700" fill="#FF6B00" text-anchor="middle" letter-spacing="1.5">ORBIT</text>
  <text x="155" y="184" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">MMB + Drag</text>

  <!-- Orbit ellipse (dashed, orange) wrapping around cube -->
  <ellipse cx="155" cy="305" rx="90" ry="26"
           fill="none" stroke="#FF6B00" stroke-width="2"
           stroke-dasharray="5 4" opacity="0.7"/>

  <!-- Direction arrows on the orbit path -->
  <g fill="#FF6B00">
    <!-- right-side arrowhead pointing down-right (clockwise) -->
    <path d="M 244 308 L 248 314 L 252 305 Z"/>
    <!-- left-side arrowhead pointing up-left (clockwise) -->
    <path d="M 66 302 L 62 296 L 58 305 Z"/>
  </g>

  <!-- Cube wireframe at center (155, 305) -->
  <g stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <!-- Front face square -->
    <rect x="135" y="293" width="34" height="34"/>
    <!-- Top face -->
    <polyline points="135,293 144,283 178,283 169,293"/>
    <polyline points="178,283 178,317 169,327"/>
  </g>

  <!-- Eye/camera marker on the orbit path -->
  <g transform="translate(70, 305)">
    <circle cx="0" cy="0" r="6" fill="#FF6B00"/>
    <circle cx="0" cy="0" r="2.5" fill="#fff"/>
  </g>

  <!-- Description -->
  <text x="155" y="412" font-size="13" fill="currentColor" opacity="0.75" text-anchor="middle">Rotate the view around</text>
  <text x="155" y="430" font-size="13" fill="currentColor" opacity="0.75" text-anchor="middle">the scene to see all sides.</text>

  <!-- ============================================================== -->
  <!-- PANEL 2: PAN  (center x = 400)                                  -->
  <!-- ============================================================== -->

  <text x="400" y="160" font-size="16" font-weight="700" fill="#FF6B00" text-anchor="middle" letter-spacing="1.5">PAN</text>
  <text x="400" y="184" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">Shift + MMB + Drag</text>

  <!-- Ghost cube at left position (faded) -->
  <g stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.3" stroke-dasharray="3 2">
    <rect x="338" y="293" width="34" height="34"/>
    <polyline points="338,293 347,283 381,283 372,293"/>
    <polyline points="381,283 381,317 372,327"/>
  </g>

  <!-- Solid cube at right position -->
  <g stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <rect x="423" y="293" width="34" height="34"/>
    <polyline points="423,293 432,283 466,283 457,293"/>
    <polyline points="466,283 466,317 457,327"/>
  </g>

  <!-- Big horizontal slide arrow (orange) between ghost and solid -->
  <g fill="none" stroke="#FF6B00" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <line x1="380" y1="270" x2="420" y2="270"/>
  </g>
  <path d="M 420 270 L 412 265 L 412 275 Z" fill="#FF6B00" opacity="0.85"/>

  <!-- Vertical direction hints (small up/down arrows above and below center) -->
  <g fill="#FF6B00" opacity="0.55">
    <!-- up arrow -->
    <path d="M 400 233 L 394 243 L 406 243 Z"/>
    <!-- down arrow -->
    <path d="M 400 377 L 394 367 L 406 367 Z"/>
  </g>

  <!-- Description -->
  <text x="400" y="412" font-size="13" fill="currentColor" opacity="0.75" text-anchor="middle">Slide the view sideways,</text>
  <text x="400" y="430" font-size="13" fill="currentColor" opacity="0.75" text-anchor="middle">up, or down without rotating.</text>

  <!-- ============================================================== -->
  <!-- PANEL 3: ZOOM  (center x = 645)                                 -->
  <!-- ============================================================== -->

  <text x="645" y="160" font-size="16" font-weight="700" fill="#FF6B00" text-anchor="middle" letter-spacing="1.5">ZOOM</text>
  <text x="645" y="184" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">Scroll Wheel</text>
  <text x="645" y="201" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.55">or Ctrl + MMB + Drag</text>

  <!-- Large outer cube (zoomed-out size, faded) -->
  <g stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.3" stroke-dasharray="3 2">
    <rect x="608" y="278" width="60" height="60"/>
    <polyline points="608,278 622,264 682,264 668,278"/>
    <polyline points="682,264 682,324 668,338"/>
  </g>

  <!-- Small inner cube (zoomed-in size, solid) -->
  <g stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <rect x="631" y="299" width="22" height="22"/>
    <polyline points="631,299 638,293 660,293 653,299"/>
    <polyline points="660,293 660,315 653,321"/>
  </g>

  <!-- Zoom-in arrows: four corners pointing inward toward center cube -->
  <g fill="none" stroke="#FF6B00" stroke-width="2.2" stroke-linecap="round" opacity="0.85">
    <!-- top-left inward arrow -->
    <line x1="585" y1="255" x2="610" y2="280"/>
    <!-- top-right inward arrow -->
    <line x1="705" y1="255" x2="680" y2="280"/>
    <!-- bottom-left inward arrow -->
    <line x1="585" y1="365" x2="610" y2="340"/>
    <!-- bottom-right inward arrow -->
    <line x1="705" y1="365" x2="680" y2="340"/>
  </g>
  <g fill="#FF6B00" opacity="0.85">
    <!-- arrowheads pointing inward at the inner cube corners -->
    <path d="M 610 280 L 605 273 L 614 273 Z" transform="rotate(135, 610, 280)"/>
    <path d="M 680 280 L 685 273 L 676 273 Z" transform="rotate(-135, 680, 280)"/>
    <path d="M 610 340 L 605 347 L 614 347 Z" transform="rotate(45, 610, 340)"/>
    <path d="M 680 340 L 685 347 L 676 347 Z" transform="rotate(-45, 680, 340)"/>
  </g>

  <!-- Vertical scroll hint near right edge of panel -->
  <g opacity="0.65">
    <rect x="730" y="285" width="10" height="44" rx="2" fill="#FF6B00"/>
    <path d="M 735 278 L 730 285 L 740 285 Z" fill="#FF6B00"/>
    <path d="M 735 336 L 730 329 L 740 329 Z" fill="#FF6B00"/>
  </g>

  <!-- Description -->
  <text x="645" y="412" font-size="13" fill="currentColor" opacity="0.75" text-anchor="middle">Move closer or further away</text>
  <text x="645" y="430" font-size="13" fill="currentColor" opacity="0.75" text-anchor="middle">to change working distance.</text>

  <!-- ============================================================== -->
  <!-- Bottom hint band                                                -->
  <!-- ============================================================== -->

  <text x="400" y="468" font-size="13" font-style="italic" fill="currentColor" opacity="0.6" text-anchor="middle">
    Combine all three smoothly and your hands learn the choreography of 3D navigation.
  </text>

  <!-- Footer tip callout -->
  <rect x="40" y="506" width="720" height="34" rx="6"
        fill="#FF6B00" fill-opacity="0.10"
        stroke="#FF6B00" stroke-opacity="0.4"/>
  <text x="54" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Practice each operation in isolation first, then combine them. Fluency comes from repetition, not memorization.
  </text>
</svg>
