<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" color="#222" role="img" aria-labelledby="dt-title dt-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="dt-title">Snapping Decision Tree</title>
  <desc id="dt-desc">A decision guide for choosing the right snap type. Start from the question what needs to align, then follow the matching condition: regular spacing chooses Grid or Increment, point to point chooses Vertex, along an edge chooses Edge, onto a surface chooses Face, and center alignment chooses Volume.</desc>

  <rect x="0" y="0" width="800" height="680" rx="18" fill="#0f1a14"/>
  <rect x="0" y="0" width="800" height="10" rx="5" fill="#FF6B00"/>

  <text x="40" y="58" font-size="30" font-weight="700" fill="#f5f7f6">Which Snap Type?</text>
  <text x="40" y="88" font-size="17" font-weight="500" fill="#9fb0a8">Match the situation &#183; one question, five answers</text>

  <defs>
    <marker id="dt-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7d8f87"/>
    </marker>
  </defs>

  <!-- root question diamond -->
  <g>
    <polygon points="220,116 380,158 220,200 60,158" fill="#1c2620" stroke="#F5C242" stroke-width="2"/>
    <text x="220" y="153" font-size="17" font-weight="700" fill="#F5C242" text-anchor="middle">What needs</text>
    <text x="220" y="174" font-size="17" font-weight="700" fill="#F5C242" text-anchor="middle">to align?</text>
  </g>

  <!-- spine down the left, branch stubs to each condition row -->
  <g stroke="#7d8f87" stroke-width="3" fill="none">
    <path d="M220,200 V520"/>
  </g>
  <g stroke="#7d8f87" stroke-width="3" fill="none" marker-end="url(#dt-arrow)">
    <line x1="220" y1="255" x2="252" y2="255"/>
    <line x1="220" y1="317" x2="252" y2="317"/>
    <line x1="220" y1="379" x2="252" y2="379"/>
    <line x1="220" y1="441" x2="252" y2="441"/>
    <line x1="220" y1="503" x2="252" y2="503"/>
  </g>

  <!-- row 1 · Grid / Increment (blue) -->
  <g>
    <text x="264" y="248" font-size="13.5" font-weight="600" fill="#cdd8d2">Regular, even spacing</text>
    <rect x="260" y="256" width="300" height="44" rx="9" fill="#13233a" stroke="#4A9EFF" stroke-width="2"/>
    <rect x="260" y="256" width="8" height="44" rx="4" fill="#4A9EFF"/>
    <text x="286" y="284" font-size="18" font-weight="700" fill="#f5f7f6">Grid / Increment</text>
  </g>
  <!-- row 2 · Vertex (orange) -->
  <g>
    <text x="264" y="310" font-size="13.5" font-weight="600" fill="#cdd8d2">Point to point</text>
    <rect x="260" y="318" width="300" height="44" rx="9" fill="#2a1c10" stroke="#FF6B00" stroke-width="2"/>
    <rect x="260" y="318" width="8" height="44" rx="4" fill="#FF6B00"/>
    <text x="286" y="346" font-size="18" font-weight="700" fill="#f5f7f6">Vertex</text>
  </g>
  <!-- row 3 · Edge (blue) -->
  <g>
    <text x="264" y="372" font-size="13.5" font-weight="600" fill="#cdd8d2">Along an edge / line</text>
    <rect x="260" y="380" width="300" height="44" rx="9" fill="#13233a" stroke="#4A9EFF" stroke-width="2"/>
    <rect x="260" y="380" width="8" height="44" rx="4" fill="#4A9EFF"/>
    <text x="286" y="408" font-size="18" font-weight="700" fill="#f5f7f6">Edge</text>
  </g>
  <!-- row 4 · Face (orange) -->
  <g>
    <text x="264" y="434" font-size="13.5" font-weight="600" fill="#cdd8d2">Onto a surface</text>
    <rect x="260" y="442" width="300" height="44" rx="9" fill="#2a1c10" stroke="#FF6B00" stroke-width="2"/>
    <rect x="260" y="442" width="8" height="44" rx="4" fill="#FF6B00"/>
    <text x="286" y="470" font-size="18" font-weight="700" fill="#f5f7f6">Face</text>
  </g>
  <!-- row 5 · Volume (purple) -->
  <g>
    <text x="264" y="496" font-size="13.5" font-weight="600" fill="#cdd8d2">Centre to centre</text>
    <rect x="260" y="504" width="300" height="44" rx="9" fill="#231733" stroke="#B47EE8" stroke-width="2"/>
    <rect x="260" y="504" width="8" height="44" rx="4" fill="#B47EE8"/>
    <text x="286" y="532" font-size="18" font-weight="700" fill="#f5f7f6">Volume</text>
  </g>

  <!-- right-side guidance panel -->
  <g>
    <rect x="588" y="222" width="172" height="326" rx="12" fill="#11201a" stroke="#24382e" stroke-width="2"/>
    <text x="606" y="252" font-size="16" font-weight="700" fill="#4ADE80">Rule of thumb</text>
    <text x="606" y="280" font-size="13" fill="#cdd8d2">Match the snap to</text>
    <text x="606" y="298" font-size="13" fill="#cdd8d2">the geometry you</text>
    <text x="606" y="316" font-size="13" fill="#cdd8d2">are aiming at.</text>
    <text x="606" y="352" font-size="12.5" fill="#9fb0a8">&#8226; Ctrl snaps live</text>
    <text x="606" y="374" font-size="12.5" fill="#9fb0a8">&#8226; Shift+S sets cursor</text>
    <text x="606" y="396" font-size="12.5" fill="#9fb0a8">&#8226; Closest is default</text>
    <text x="606" y="430" font-size="12" fill="#7d8f87">Colour = snap family:</text>
    <text x="606" y="450" font-size="12" fill="#7d8f87">blue grid/edge,</text>
    <text x="606" y="468" font-size="12" fill="#7d8f87">orange vertex/face,</text>
    <text x="606" y="486" font-size="12" fill="#7d8f87">purple volume.</text>
  </g>

  <!-- footer tip rail -->
  <rect x="40" y="616" width="6" height="36" rx="3" fill="#F5C242"/>
  <text x="60" y="639" font-size="15" font-weight="600" fill="#F5C242">When unsure, start with Vertex + Closest and adjust from there.</text>
</svg>
