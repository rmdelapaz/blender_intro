<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="lt-title lt-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="lt-title">The Eevee light threshold setting</title>
  <desc id="lt-desc">A diagram showing five lights of decreasing power against a horizontal threshold line. Lights with power above the threshold are evaluated and cast shadows, shown in orange above the line. Lights below the threshold are culled to save performance, shown dim and greyed below the line. Raising the threshold culls more weak lights and speeds up the render; lowering it keeps more lights at a performance cost.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Light Threshold</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">A cutoff that skips lights too dim to matter, to save render time</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- plot frame -->
  <text x="44" y="150" font-size="12" fill="currentColor" opacity="0.6" transform="rotate(0)">light power</text>
  <line x1="120" y1="150" x2="120" y2="430" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
  <line x1="120" y1="430" x2="720" y2="430" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>

  <!-- threshold line -->
  <line x1="120" y1="312" x2="720" y2="312" stroke="#FF6B00" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="724" y="316" font-size="12" font-weight="700" fill="#FF6B00">threshold</text>

  <!-- ABOVE region label -->
  <text x="136" y="176" font-size="12.5" font-weight="600" fill="#4ADE80">Above &#183; evaluated, casts shadow</text>
  <!-- BELOW region label -->
  <text x="136" y="408" font-size="12.5" font-weight="600" fill="currentColor" opacity="0.45">Below &#183; culled to save performance</text>

  <!-- bars: 5 lights decreasing. y=430 baseline. above bars orange (kept), below grey (culled) -->
  <!-- L1 power high -->
  <rect x="170" y="196" width="56" height="234" rx="3" fill="#FF6B00" fill-opacity="0.85"/>
  <circle cx="198" cy="186" r="9" fill="#F5C242"/>
  <text x="198" y="448" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.7">L1</text>
  <!-- L2 -->
  <rect x="278" y="240" width="56" height="190" rx="3" fill="#FF6B00" fill-opacity="0.85"/>
  <circle cx="306" cy="230" r="8" fill="#F5C242"/>
  <text x="306" y="448" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.7">L2</text>
  <!-- L3 just above threshold -->
  <rect x="386" y="288" width="56" height="142" rx="3" fill="#FF6B00" fill-opacity="0.85"/>
  <circle cx="414" cy="278" r="7" fill="#F5C242"/>
  <text x="414" y="448" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.7">L3</text>
  <!-- L4 below threshold -> culled (grey, only up to its low power) -->
  <rect x="494" y="344" width="56" height="86" rx="3" fill="currentColor" fill-opacity="0.18"/>
  <circle cx="522" cy="334" r="6" fill="currentColor" fill-opacity="0.3"/>
  <text x="522" y="448" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.5">L4</text>
  <!-- L5 well below -> culled -->
  <rect x="602" y="386" width="56" height="44" rx="3" fill="currentColor" fill-opacity="0.18"/>
  <circle cx="630" cy="376" r="5" fill="currentColor" fill-opacity="0.3"/>
  <text x="630" y="448" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.5">L5</text>

  <!-- culled X marks -->
  <g stroke="#E63946" stroke-width="2.5" stroke-linecap="round">
    <line x1="514" y1="356" x2="530" y2="372"/><line x1="530" y1="356" x2="514" y2="372"/>
    <line x1="622" y1="396" x2="638" y2="412"/><line x1="638" y1="396" x2="622" y2="412"/>
  </g>

  <!-- summary chips -->
  <rect x="120" y="470" width="290" height="36" rx="6" fill="#4ADE80" fill-opacity="0.1"/>
  <text x="136" y="493" font-size="12.5" fill="currentColor"><tspan font-weight="700">Lower threshold:</tspan> more lights kept, slower</text>
  <rect x="430" y="470" width="290" height="36" rx="6" fill="#FF6B00" fill-opacity="0.1"/>
  <text x="446" y="493" font-size="12.5" fill="currentColor"><tspan font-weight="700">Raise threshold:</tspan> weak lights culled, faster</text>

  <!-- Footer tip (Variant B left rail) -->
  <rect x="40" y="514" width="720" height="34" fill="none"/>
  <rect x="40" y="514" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="536" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Nudge the threshold up until you notice a light disappear &#183; then back off one step.</text>
</svg>