<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="fnd-title fnd-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <title id="fnd-title">Face normals and hair growth direction</title>
    <desc id="fnd-desc">Two mesh surfaces in cross-section. On the left, blue face-normal arrows point straight out and orange hair grows the same way alongside them. On the right, one normal is flipped to point inward and its orange hair grows down into the mesh.</desc>
    <style>
        .fnd-lbl{font:600 14px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:currentColor}
        .fnd-val{font:400 12px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:currentColor;opacity:.6}
        .fnd-surf{fill:currentColor;fill-opacity:.06;stroke:currentColor;stroke-opacity:.45;stroke-width:2}
        .fnd-cap{font:700 13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
    </style>
    <defs>
        <marker id="fnd-h-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#4A9EFF"/>
        </marker>
        <marker id="fnd-h-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#FF6B00"/>
        </marker>
        <marker id="fnd-h-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#F87171"/>
        </marker>
    </defs>
    <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
    <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">FACE NORMALS &amp; HAIR DIRECTION</text>
    <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Normals point out &#183; hair follows them &#183; a flipped normal grows hair inward</text>
    <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

    <!-- LEFT: correct -->
    <text x="200" y="146" text-anchor="middle" class="fnd-cap" fill="#4ADE80">CORRECT &#183; normals outward</text>
    <rect class="fnd-surf" x="60" y="338" width="280" height="38"/>
    <!-- helper: at each base x, blue normal at x-10 (shorter), orange hair at x+10 (taller) -->
    <!-- pt1 base 130 -->
    <line x1="120" y1="338" x2="120" y2="262" stroke="#4A9EFF" stroke-width="2.5" marker-end="url(#fnd-h-blue)"/>
    <line x1="140" y1="338" x2="140" y2="206" stroke="#FF6B00" stroke-width="3.5" stroke-linecap="round" marker-end="url(#fnd-h-orange)"/>
    <!-- pt2 base 200 -->
    <line x1="190" y1="338" x2="190" y2="262" stroke="#4A9EFF" stroke-width="2.5" marker-end="url(#fnd-h-blue)"/>
    <line x1="210" y1="338" x2="210" y2="200" stroke="#FF6B00" stroke-width="3.5" stroke-linecap="round" marker-end="url(#fnd-h-orange)"/>
    <!-- pt3 base 270 -->
    <line x1="260" y1="338" x2="260" y2="262" stroke="#4A9EFF" stroke-width="2.5" marker-end="url(#fnd-h-blue)"/>
    <line x1="280" y1="338" x2="280" y2="206" stroke="#FF6B00" stroke-width="3.5" stroke-linecap="round" marker-end="url(#fnd-h-orange)"/>
    <text x="200" y="398" text-anchor="middle" class="fnd-val">Hair grows out along the normal &#8212; as expected</text>

    <!-- divider -->
    <line x1="400" y1="138" x2="400" y2="404" stroke="currentColor" stroke-width="1" opacity="0.18"/>

    <!-- RIGHT: flipped -->
    <text x="600" y="146" text-anchor="middle" class="fnd-cap" fill="#F87171">FLIPPED &#183; normal inward</text>
    <rect class="fnd-surf" x="460" y="338" width="280" height="38"/>
    <!-- two ok points -->
    <line x1="520" y1="338" x2="520" y2="262" stroke="#4A9EFF" stroke-width="2.5" marker-end="url(#fnd-h-blue)"/>
    <line x1="540" y1="338" x2="540" y2="206" stroke="#FF6B00" stroke-width="3.5" stroke-linecap="round" marker-end="url(#fnd-h-orange)"/>
    <line x1="680" y1="338" x2="680" y2="262" stroke="#4A9EFF" stroke-width="2.5" marker-end="url(#fnd-h-blue)"/>
    <line x1="700" y1="338" x2="700" y2="206" stroke="#FF6B00" stroke-width="3.5" stroke-linecap="round" marker-end="url(#fnd-h-orange)"/>
    <!-- flipped center: red normal DOWN, orange hair follows DOWN into mesh -->
    <line x1="600" y1="338" x2="600" y2="408" stroke="#F87171" stroke-width="2.5" marker-end="url(#fnd-h-red)"/>
    <line x1="620" y1="338" x2="620" y2="430" stroke="#FF6B00" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#fnd-h-orange)"/>
    <text x="610" y="330" text-anchor="middle" class="fnd-val" fill="#F87171">grows into mesh</text>

    <!-- legend -->
    <g transform="translate(60,436)">
        <line x1="0" y1="-4" x2="26" y2="-4" stroke="#4A9EFF" stroke-width="2.5" marker-end="url(#fnd-h-blue)"/>
        <text x="34" y="0" class="fnd-val">Face normal</text>
        <line x1="150" y1="-4" x2="176" y2="-4" stroke="#FF6B00" stroke-width="3.5" stroke-linecap="round" marker-end="url(#fnd-h-orange)"/>
        <text x="184" y="0" class="fnd-val">Hair growth</text>
    </g>
    <text x="470" y="440" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Fix:</tspan> Mesh &#8594; Normals &#8594; Recalculate Outside.</text>
</svg>
