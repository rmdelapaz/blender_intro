<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="pg-title pg-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="pg-title">Real-world F&#183;Curve: pulsing glow emission</title>
  <desc id="pg-desc">A Graph Editor emission F-curve for a pulsing glow. A smooth repeating sine wave that rises and falls between a dim value of 1 and a bright value of 5 across three full cycles, producing a steady breathing pulse of light.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">REAL-WORLD CURVE &#183; PULSING GLOW</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Emission strength over time &#183; a smooth repeating wave = a breathing pulse</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Gridlines: vertical at frame 0,10,20,30 ; horizontal at value 1 (y402) and 5 (y170) -->
  <g stroke="currentColor" stroke-width="1" opacity="0.15">
    <line x1="110" y1="170" x2="110" y2="460"/>
    <line x1="313" y1="170" x2="313" y2="460"/>
    <line x1="517" y1="170" x2="517" y2="460"/>
    <line x1="720" y1="170" x2="720" y2="460"/>
    <line x1="110" y1="460" x2="720" y2="460"/>
    <line x1="110" y1="402" x2="720" y2="402"/>
    <line x1="110" y1="170" x2="720" y2="170"/>
  </g>

  <!-- Axes -->
  <g stroke="currentColor" stroke-width="1.5" opacity="0.4" stroke-linecap="round">
    <line x1="110" y1="170" x2="110" y2="460"/>
    <line x1="110" y1="460" x2="720" y2="460"/>
  </g>

  <!-- Axis labels + ticks -->
  <text x="110" y="478" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">0</text>
  <text x="313" y="478" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">10</text>
  <text x="517" y="478" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">20</text>
  <text x="720" y="478" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">30</text>
  <text x="415" y="500" font-size="13" fill="currentColor" opacity="0.65" text-anchor="middle">Frame (time)</text>
  <text x="98" y="464" font-size="13" fill="currentColor" opacity="0.6" text-anchor="end">0</text>
  <text x="98" y="406" font-size="13" fill="currentColor" opacity="0.6" text-anchor="end">1</text>
  <text x="98" y="174" font-size="13" fill="currentColor" opacity="0.6" text-anchor="end">5</text>
  <text x="64" y="315" font-size="13" fill="currentColor" opacity="0.65" text-anchor="middle" transform="rotate(-90 64 315)">Emission</text>

  <!-- Pulsing glow sine wave: brand orange (emission, no axis role) -->
  <path d="M 110.0 402.0 C 147.0 402.0 174.6 170.0 211.7 170.0 C 248.7 170.0 276.3 402.0 313.3 402.0 C 350.4 402.0 378.0 170.0 415.0 170.0 C 452.0 170.0 479.6 402.0 516.7 402.0 C 553.7 402.0 581.3 170.0 618.3 170.0 C 655.4 170.0 683.0 402.0 720.0 402.0"
        fill="none" stroke="#FF6B00" stroke-width="3" stroke-linecap="round"/>

  <!-- Keyframe diamonds at peaks (211.7,415,618.3 @ y170) and valleys (110,313.3,516.7,720 @ y402) -->
  <g fill="#FF6B00">
    <path d="M 110 393 L 119 402 L 110 411 L 101 402 Z"/>
    <path d="M 211.7 161 L 220.7 170 L 211.7 179 L 202.7 170 Z"/>
    <path d="M 313.3 393 L 322.3 402 L 313.3 411 L 304.3 402 Z"/>
    <path d="M 415 161 L 424 170 L 415 179 L 406 170 Z"/>
    <path d="M 516.7 393 L 525.7 402 L 516.7 411 L 507.7 402 Z"/>
    <path d="M 618.3 161 L 627.3 170 L 618.3 179 L 609.3 170 Z"/>
    <path d="M 720 393 L 729 402 L 720 411 L 711 402 Z"/>
  </g>

  <!-- Annotation: bright peak -->
  <line x1="415" y1="170" x2="415" y2="140" stroke="currentColor" stroke-width="1" opacity="0.3" stroke-linecap="round"/>
  <text x="415" y="134" font-size="14" fill="currentColor" text-anchor="middle">Peaks = brightest glow</text>

  <!-- Annotation: dim valley -->
  <line x1="313.3" y1="402" x2="313.3" y2="432" stroke="currentColor" stroke-width="1" opacity="0.3" stroke-linecap="round"/>
  <text x="313.3" y="448" font-size="13" fill="currentColor" opacity="0.65" text-anchor="middle">Valleys = dimmest</text>

  <!-- Tip pill: could use Cycles modifier -->
  <rect x="470" y="206" width="250" height="30" rx="6" fill="#FF6B00" fill-opacity="0.10" stroke="#FF6B00" stroke-opacity="0.5"/>
  <text x="484" y="226" font-size="14" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Hint:</tspan> repeat it with a Cycles modifier</text>

  <!-- Footer tip -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Smooth, evenly spaced waves read as a calm pulse &#183; tighten the spacing to speed the flicker.
  </text>
</svg>
