<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="eq-title eq-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="eq-title">Equirectangular HDRI projection wrapping to a sphere</title>
  <desc id="eq-desc">A flat equirectangular environment map with a two to one aspect ratio sits at the top, overlaid with a latitude and longitude grid that bunches together toward the top and bottom edges to show pole distortion. Projection arrows connect the flat map to a sphere below, illustrating how the rectangular image wraps around a three dimensional scene.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Equirectangular Projection</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">How a flat HDRI wraps around your scene</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <defs>
    <!-- sky-to-ground gradient for the panoramic map -->
    <linearGradient id="eq-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3F6FB5"/>
      <stop offset="0.42" stop-color="#9CC3E8"/>
      <stop offset="0.52" stop-color="#D9E6F2"/>
      <stop offset="0.62" stop-color="#C9A876"/>
      <stop offset="1" stop-color="#6E5536"/>
    </linearGradient>
    <radialGradient id="eq-sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFDF2"/>
      <stop offset="0.5" stop-color="#FFE39A"/>
      <stop offset="1" stop-color="#FFE39A" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="eq-mapclip"><rect x="140" y="138" width="520" height="180" rx="4"/></clipPath>
  </defs>

  <!-- ============ Flat equirectangular map (2:1) ============ -->
  <text x="140" y="132" font-size="14" font-weight="600" fill="currentColor">Equirectangular map <tspan font-weight="400" opacity="0.6">&#183; 2:1 ratio (360&#176; &#215; 180&#176;)</tspan></text>
  <g clip-path="url(#eq-mapclip)">
    <rect x="140" y="138" width="520" height="180" fill="url(#eq-sky)"/>
    <!-- sun in the sky band -->
    <circle cx="300" cy="186" r="46" fill="url(#eq-sun)"/>
    <circle cx="300" cy="186" r="13" fill="#FFFBEA"/>
    <!-- a couple of soft clouds -->
    <ellipse cx="520" cy="178" rx="44" ry="13" fill="#ffffff" opacity="0.45"/>
    <ellipse cx="470" cy="200" rx="30" ry="9" fill="#ffffff" opacity="0.30"/>
    <!-- horizon line -->
    <line x1="140" y1="246" x2="660" y2="246" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5"/>
    <!-- longitude lines (vertical, evenly spaced) -->
    <g stroke="#ffffff" stroke-opacity="0.55" stroke-width="1">
      <line x1="205" y1="138" x2="205" y2="318"/>
      <line x1="270" y1="138" x2="270" y2="318"/>
      <line x1="335" y1="138" x2="335" y2="318"/>
      <line x1="400" y1="138" x2="400" y2="318"/>
      <line x1="465" y1="138" x2="465" y2="318"/>
      <line x1="530" y1="138" x2="530" y2="318"/>
      <line x1="595" y1="138" x2="595" y2="318"/>
    </g>
    <!-- latitude lines (horizontal): bunched near top and bottom to show pole distortion -->
    <g stroke="#ffffff" stroke-opacity="0.55" stroke-width="1">
      <line x1="140" y1="150" x2="660" y2="150"/>
      <line x1="140" y1="166" x2="660" y2="166"/>
      <line x1="140" y1="190" x2="660" y2="190"/>
      <line x1="140" y1="246" x2="660" y2="246"/>
      <line x1="140" y1="296" x2="660" y2="296"/>
      <line x1="140" y1="308" x2="660" y2="308"/>
    </g>
  </g>
  <rect x="140" y="138" width="520" height="180" rx="4" fill="none" stroke="currentColor" stroke-opacity="0.3" stroke-width="1"/>

  <!-- pole-distortion callouts -->
  <text x="670" y="156" font-size="12" fill="#FF6B00" font-weight="600">top pole</text>
  <text x="670" y="170" font-size="11" fill="currentColor" opacity="0.6">stretched</text>
  <text x="670" y="304" font-size="12" fill="#FF6B00" font-weight="600">bottom pole</text>
  <text x="670" y="318" font-size="11" fill="currentColor" opacity="0.6">stretched</text>
  <text x="68" y="232" font-size="12" fill="currentColor" opacity="0.7">horizon</text>
  <line x1="112" y1="228" x2="138" y2="240" stroke="currentColor" stroke-opacity="0.4" stroke-width="1"/>

  <!-- ============ Projection arrows ============ -->
  <g stroke="#FF6B00" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M 260 330 C 280 380, 330 400, 372 432" marker-end="url(#eq-arrow)"/>
    <path d="M 400 330 C 400 380, 400 400, 400 430" marker-end="url(#eq-arrow)"/>
    <path d="M 540 330 C 520 380, 470 400, 428 432" marker-end="url(#eq-arrow)"/>
  </g>
  <defs>
    <marker id="eq-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF6B00"/>
    </marker>
  </defs>
  <text x="400" y="372" text-anchor="middle" font-size="13" font-weight="600" fill="#FF6B00">wraps onto a sphere</text>

  <!-- ============ Sphere (the wrap) ============ -->
  <g>
    <circle cx="400" cy="520" r="78" fill="url(#eq-sky)" stroke="currentColor" stroke-opacity="0.3" stroke-width="1"/>
    <!-- sun reflected onto sphere upper-left -->
    <circle cx="362" cy="486" r="26" fill="url(#eq-sun)"/>
    <!-- longitude meridians curving around the sphere -->
    <g stroke="#ffffff" stroke-opacity="0.5" stroke-width="1" fill="none">
      <ellipse cx="400" cy="520" rx="26" ry="78"/>
      <ellipse cx="400" cy="520" rx="54" ry="78"/>
      <line x1="400" y1="442" x2="400" y2="598"/>
    </g>
    <!-- latitude rings (ellipses) -->
    <g stroke="#ffffff" stroke-opacity="0.5" stroke-width="1" fill="none">
      <ellipse cx="400" cy="498" rx="74" ry="20"/>
      <ellipse cx="400" cy="520" rx="78" ry="6"/>
      <ellipse cx="400" cy="542" rx="74" ry="20"/>
    </g>
    <!-- subtle shading on the sphere -->
    <circle cx="400" cy="520" r="78" fill="#000000" opacity="0.04"/>
  </g>
  <text x="400" y="624" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.7">360&#176; environment surrounding your 3D scene</text>

  <!-- Footer tip (Variant B, dense position) -->
  <rect x="40" y="641" width="720" height="34" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Equirectangular is Blender's native HDRI format. The stretched poles map correctly once wrapped.
  </text>
</svg>
