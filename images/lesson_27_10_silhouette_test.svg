<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="st-title st-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="st-title">The silhouette test: clear, readable, and unclear poses</title>
  <desc id="st-desc">Three poses shown as solid silhouettes. The first is a clear waving pose with the arm held up and away from the body, marked with a green check. The second is a readable pose with both arms out and some limb overlap, marked with a yellow check. The third is an unclear pose with the arms folded against the torso so the limbs are lost, marked with a red cross. A pose reads best when its action is recognizable from the silhouette alone.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">The Silhouette Test</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">If the action reads as a solid shape, the pose is clear</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Panel dividers -->
  <line x1="280" y1="140" x2="280" y2="470" stroke="currentColor" stroke-width="1" opacity="0.12"/>
  <line x1="520" y1="140" x2="520" y2="470" stroke="currentColor" stroke-width="1" opacity="0.12"/>

  <!-- ============ PANEL 1: CLEAR (waving) ============ -->
  <g fill="none" stroke="currentColor" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 140 224 L 150 330"/>
    <path d="M 150 330 L 122 392"/>
    <path d="M 150 330 L 178 392"/>
    <path d="M 140 244 L 112 300 L 108 330"/>
    <path d="M 146 244 L 196 212 L 224 196"/>
  </g>
  <circle cx="140" cy="200" r="24" fill="currentColor"/>

  <rect x="92" y="416" width="96" height="30" rx="6" fill="#4ADE80"/>
  <text x="140" y="437" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1a14">&#10003; CLEAR</text>
  <text x="140" y="468" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">Action reads instantly</text>

  <!-- ============ PANEL 2: READABLE (arms out) ============ -->
  <g fill="none" stroke="currentColor" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 402 224 L 404 330"/>
    <path d="M 404 330 L 380 392"/>
    <path d="M 404 330 L 430 392"/>
    <path d="M 400 246 L 360 256 L 342 244"/>
    <path d="M 406 246 L 450 256 L 470 236"/>
  </g>
  <circle cx="400" cy="200" r="24" fill="currentColor"/>

  <rect x="344" y="416" width="120" height="30" rx="6" fill="#F5C242"/>
  <text x="404" y="437" text-anchor="middle" font-size="15" font-weight="700" fill="#0f1a14">&#10003; READABLE</text>
  <text x="404" y="468" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">Clear, but limbs overlap</text>

  <!-- ============ PANEL 3: UNCLEAR (arms folded into torso) ============ -->
  <g fill="none" stroke="currentColor" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 660 224 L 660 330"/>
    <path d="M 660 330 L 644 392"/>
    <path d="M 660 330 L 676 392"/>
    <path d="M 660 258 L 632 272 L 652 288"/>
    <path d="M 660 258 L 688 272 L 668 288"/>
  </g>
  <circle cx="660" cy="200" r="24" fill="currentColor"/>

  <rect x="600" y="416" width="120" height="30" rx="6" fill="#E63946"/>
  <text x="660" y="437" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">&#10007; UNCLEAR</text>
  <text x="660" y="468" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">Limbs lost against the body</text>

  <!-- Footer tip (Variant B, left rail) -->
  <rect x="40" y="506" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Squint at your pose or fill it black &#183; if you can still name the action, the silhouette works.
  </text>
</svg>
