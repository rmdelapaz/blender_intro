<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" color="#222" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" role="img" aria-labelledby="pp49-t pp49-d">
  <title id="pp49-t">Before and After: The Post-Processing Impact</title>
  <desc id="pp49-d">The post-processing stack that turns a raw render into a finished image &#8212; exposure, contrast, colour, and finishing life &#8212; shown as a raw-to-graded transform, with the 15 percent rule gauge marking the sweet spot between too subtle and overdone.</desc>
  <rect x="0" y="0" width="760" height="420" fill="none"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="currentColor">Post-Processing: The Final 15%</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#8a8f98">A good grade sells the render &#8212; but the best grade you never notice</text>

  <!-- RAW -> GRADED transform -->
  <rect x="46" y="86" width="150" height="104" rx="9" fill="#1a1a1a" stroke="#8a8f98" stroke-width="1.6"/>
  <text x="121" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#c9ccd1">RAW render</text>
  <text x="121" y="133" text-anchor="middle" font-size="10.5" fill="#8a8f98">flat &#183; low contrast</text>
  <text x="121" y="150" text-anchor="middle" font-size="10.5" fill="#8a8f98">slightly dull</text>
  <text x="121" y="173" text-anchor="middle" font-size="10.5" fill="#8a8f98">straight from Cycles</text>

  <!-- stack of steps in the middle -->
  <line x1="200" y1="138" x2="224" y2="138" stroke="#F5C242" stroke-width="2.4"/><path d="M224,138 l-10,-6 l0,12 z" fill="#F5C242"/>
  <rect x="230" y="86" width="300" height="104" rx="9" fill="#1a1a1a" stroke="#F5C242" stroke-width="1.4"/>
  <text x="380" y="106" text-anchor="middle" font-size="11.5" font-weight="700" fill="#F5C242">THE ENHANCEMENT STACK</text>
  <text x="246" y="128" font-size="11" fill="#FF6B00">1 &#183; Exposure</text><text x="330" y="128" font-size="10" fill="#8a8f98">set overall brightness</text>
  <text x="246" y="146" font-size="11" fill="#4ADE80">2 &#183; Contrast</text><text x="330" y="146" font-size="10" fill="#8a8f98">depth via tonal range</text>
  <text x="246" y="164" font-size="11" fill="#4A9EFF">3 &#183; Colour</text><text x="330" y="164" font-size="10" fill="#8a8f98">balance &amp; grade the mood</text>
  <text x="246" y="182" font-size="11" fill="#B47EE8">4 &#183; Life</text><text x="330" y="182" font-size="10" fill="#8a8f98">glare, vignette, grain, bloom</text>

  <line x1="534" y1="138" x2="558" y2="138" stroke="#F5C242" stroke-width="2.4"/><path d="M558,138 l-10,-6 l0,12 z" fill="#F5C242"/>
  <rect x="564" y="86" width="150" height="104" rx="9" fill="#1a1a1a" stroke="#4ADE80" stroke-width="1.8"/>
  <text x="639" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#4ADE80">GRADED</text>
  <text x="639" y="133" text-anchor="middle" font-size="10.5" fill="#c9ccd1">rich &#183; intentional</text>
  <text x="639" y="150" text-anchor="middle" font-size="10.5" fill="#c9ccd1">reads as a photo</text>
  <text x="639" y="173" text-anchor="middle" font-size="10.5" fill="#8a8f98">the delivered image</text>

  <!-- 15% rule gauge -->
  <text x="380" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor">The 15% Rule</text>
  <text x="380" y="254" text-anchor="middle" font-size="11.5" fill="#8a8f98">Push the grade until it looks right, then dial it back &#8212; aim for a light touch</text>

  <!-- gauge bar -->
  <rect x="120" y="278" width="520" height="26" rx="13" fill="#1a1a1a" stroke="#8a8f98" stroke-width="1.2"/>
  <rect x="120" y="278" width="120" height="26" rx="13" fill="#4A9EFF" opacity="0.25"/>
  <rect x="360" y="278" width="280" height="26" rx="13" fill="#E63946" opacity="0.22"/>
  <rect x="240" y="278" width="120" height="26" fill="#4ADE80" opacity="0.30"/>
  <!-- sweet-spot marker -->
  <line x1="300" y1="268" x2="300" y2="314" stroke="#4ADE80" stroke-width="2.4"/>
  <circle cx="300" cy="268" r="5" fill="#4ADE80"/>
  <text x="180" y="332" text-anchor="middle" font-size="11" fill="#4A9EFF">too subtle</text>
  <text x="180" y="347" text-anchor="middle" font-size="9.5" fill="#8a8f98">looks unfinished</text>
  <text x="300" y="332" text-anchor="middle" font-size="11" font-weight="700" fill="#4ADE80">the sweet spot</text>
  <text x="300" y="347" text-anchor="middle" font-size="9.5" fill="#8a8f98">enhances, not obvious</text>
  <text x="500" y="332" text-anchor="middle" font-size="11" fill="#E63946">overdone</text>
  <text x="500" y="347" text-anchor="middle" font-size="9.5" fill="#8a8f98">crushed, oversaturated, fake</text>

  <text x="380" y="392" text-anchor="middle" font-size="12" fill="#c9ccd1">If the viewer notices the grading, it has gone too far &#8212; subtle beats dramatic.</text>
</svg>
