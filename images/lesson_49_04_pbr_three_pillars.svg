<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" color="#222" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" role="img" aria-labelledby="pbr49-t pbr49-d">
  <title id="pbr49-t">The Three Pillars of Believable PBR Materials</title>
  <desc id="pbr49-d">Three supporting pillars &#8212; accurate physical values, surface variation, and correct real-world scale &#8212; hold up the goal of a material that reads as real, showing that a convincing surface needs all three at once.</desc>
  <rect x="0" y="0" width="760" height="400" fill="none"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="currentColor">The PBR Foundation &#8212; Three Pillars</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#8a8f98">Physically-based materials stand on three supports at once</text>

  <!-- roof / goal -->
  <rect x="150" y="96" width="460" height="46" rx="8" fill="#4ADE80"/>
  <text x="380" y="118" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0d1a0d">GOAL: a surface the eye accepts as real</text>
  <text x="380" y="136" text-anchor="middle" font-size="11.5" fill="#0d1a0d">remove any one pillar and it falls</text>

  <!-- three pillars -->
  <g>
    <rect x="150" y="168" width="140" height="150" rx="9" fill="#1a1a1a" stroke="#FF6B00" stroke-width="2"/>
    <text x="220" y="196" text-anchor="middle" font-size="13.5" font-weight="700" fill="#FF6B00">Accurate values</text>
    <text x="220" y="224" text-anchor="middle" font-size="11.5" fill="#c9ccd1">base colour, metallic,</text>
    <text x="220" y="240" text-anchor="middle" font-size="11.5" fill="#c9ccd1">roughness set to</text>
    <text x="220" y="256" text-anchor="middle" font-size="11.5" fill="#c9ccd1">real measured ranges</text>
    <text x="220" y="286" text-anchor="middle" font-size="11" fill="#8a8f98">concrete isn't pure</text>
    <text x="220" y="300" text-anchor="middle" font-size="11" fill="#8a8f98">black or mirror-shiny</text>
  </g>
  <g>
    <rect x="310" y="168" width="140" height="150" rx="9" fill="#1a1a1a" stroke="#4A9EFF" stroke-width="2"/>
    <text x="380" y="196" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4A9EFF">Surface variation</text>
    <text x="380" y="224" text-anchor="middle" font-size="11.5" fill="#c9ccd1">grime, wear, streaks,</text>
    <text x="380" y="240" text-anchor="middle" font-size="11.5" fill="#c9ccd1">edge dirt breaking</text>
    <text x="380" y="256" text-anchor="middle" font-size="11.5" fill="#c9ccd1">up flat uniformity</text>
    <text x="380" y="286" text-anchor="middle" font-size="11" fill="#8a8f98">nothing real is</text>
    <text x="380" y="300" text-anchor="middle" font-size="11" fill="#8a8f98">perfectly even</text>
  </g>
  <g>
    <rect x="470" y="168" width="140" height="150" rx="9" fill="#1a1a1a" stroke="#B47EE8" stroke-width="2"/>
    <text x="540" y="196" text-anchor="middle" font-size="13.5" font-weight="700" fill="#B47EE8">Scale accuracy</text>
    <text x="540" y="224" text-anchor="middle" font-size="11.5" fill="#c9ccd1">texture sized to its</text>
    <text x="540" y="240" text-anchor="middle" font-size="11.5" fill="#c9ccd1">true real-world</text>
    <text x="540" y="256" text-anchor="middle" font-size="11.5" fill="#c9ccd1">dimensions</text>
    <text x="540" y="286" text-anchor="middle" font-size="11" fill="#8a8f98">giant bricks read as</text>
    <text x="540" y="300" text-anchor="middle" font-size="11" fill="#8a8f98">a toy instantly</text>
  </g>

  <!-- base -->
  <rect x="150" y="344" width="460" height="30" rx="6" fill="#1a1a1a"/>
  <text x="380" y="364" text-anchor="middle" font-size="12.5" fill="#8a8f98">A texture that looks great in the shader can still fail on any one of these</text>
</svg>
