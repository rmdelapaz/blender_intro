<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="rf-title rf-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="rf-title">Rack focus scene setup, top-down view</title>
  <desc id="rf-desc">Top-down layout of a rack focus shot. A camera sits at left on an optical axis. A foreground subject stands about two units away and a background subject about ten units away. A focus Empty animates its position from the foreground subject (start focus) to the background subject (end focus) along an orange path, pulling focus from near to far. Cyan dimension arrows mark the two distances.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">RACK FOCUS SCENE SETUP</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Top-down view &#183; pulling focus from a near subject to a far subject</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Optical axis (camera looks right along this line) -->
  <line x1="120" y1="300" x2="720" y2="300" stroke="currentColor" stroke-width="1.5" opacity="0.3" stroke-dasharray="6 6" stroke-linecap="round"/>
  <text x="540" y="290" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">optical axis</text>

  <!-- Camera glyph at left -->
  <g>
    <rect x="64" y="282" width="40" height="36" rx="4" fill="none" stroke="currentColor" stroke-width="2"/>
    <polygon points="104,290 124,278 124,322 104,310" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    <text x="84" y="346" font-size="14" font-weight="600" fill="currentColor" text-anchor="middle">Camera</text>
  </g>

  <!-- Foreground subject at ~2u -->
  <!-- Foreground plane tick (faint orange focus state) -->
  <line x1="300" y1="250" x2="300" y2="350" stroke="#FF6B00" stroke-width="2" opacity="0.28" stroke-dasharray="4 5"/>
  <rect x="284" y="244" width="32" height="56" rx="3" fill="currentColor" opacity="0.82"/>
  <text x="300" y="376" font-size="14" font-weight="600" fill="currentColor" text-anchor="middle">Foreground subject</text>
  <text x="300" y="396" font-size="13" fill="#FF6B00" font-weight="600" text-anchor="middle">Start focus</text>

  <!-- Background subject at ~10u -->
  <line x1="640" y1="250" x2="640" y2="350" stroke="#FF6B00" stroke-width="2" opacity="0.28" stroke-dasharray="4 5"/>
  <rect x="624" y="252" width="32" height="48" rx="3" fill="currentColor" opacity="0.55"/>
  <text x="640" y="376" font-size="14" font-weight="600" fill="currentColor" text-anchor="middle">Background subject</text>
  <text x="640" y="396" font-size="13" fill="#FF6B00" font-weight="600" text-anchor="middle">End focus</text>

  <!-- Focus Empty path: animated rack from foreground to background (orange tie-break highlight) -->
  <g>
    <line x1="300" y1="210" x2="630" y2="210" stroke="#FF6B00" stroke-width="2.5" stroke-dasharray="7 6" stroke-linecap="round"/>
    <polygon points="630,210 616,203 616,217" fill="#FF6B00"/>
    <!-- Focus Empty glyph at start -->
    <g stroke="#FF6B00" stroke-width="2" stroke-linecap="round">
      <line x1="290" y1="210" x2="310" y2="210"/>
      <line x1="300" y1="200" x2="300" y2="220"/>
    </g>
    <text x="300" y="186" font-size="14" font-weight="600" fill="#FF6B00" text-anchor="middle">Focus Empty</text>
    <text x="468" y="200" font-size="13" fill="#FF6B00" opacity="0.9" text-anchor="middle">animates near to far (the rack)</text>
  </g>

  <!-- Dimension arrows (cyan) for the two distances -->
  <g stroke="#4A9EFF" stroke-width="2" fill="#4A9EFF">
    <!-- 2u: camera to foreground -->
    <line x1="124" y1="440" x2="300" y2="440" stroke-linecap="round"/>
    <polygon points="124,440 138,433 138,447"/>
    <polygon points="300,440 286,433 286,447"/>
    <!-- 10u: camera to background -->
    <line x1="124" y1="478" x2="640" y2="478" stroke-linecap="round"/>
    <polygon points="124,478 138,471 138,485"/>
    <polygon points="640,478 626,471 626,485"/>
  </g>
  <line x1="124" y1="432" x2="124" y2="486" stroke="#4A9EFF" stroke-width="1.5" opacity="0.5"/>
  <line x1="300" y1="350" x2="300" y2="448" stroke="#4A9EFF" stroke-width="1" opacity="0.35" stroke-dasharray="3 4"/>
  <line x1="640" y1="350" x2="640" y2="486" stroke="#4A9EFF" stroke-width="1" opacity="0.35" stroke-dasharray="3 4"/>
  <text x="212" y="434" font-size="13" font-weight="600" fill="#4A9EFF" text-anchor="middle">2 units</text>
  <text x="382" y="472" font-size="13" font-weight="600" fill="#4A9EFF" text-anchor="middle">10 units</text>

  <!-- Footer tip (Variant B, left rail) -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Keyframe the Empty (not the camera) so the focus pull follows your subjects if they move.
  </text>
</svg>
