<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" color="#222" role="img" aria-labelledby="rd-title rd-desc">
    <title id="rd-title">Real-World Dimensions Reference</title>
    <desc id="rd-desc">A scale reference chart showing a 1.7 metre human silhouette beside common real-world object dimensions: a 2.0 metre door, 2.4 to 2.7 metre ceiling, 0.75 metre table, 0.45 metre chair seat, a 4.5 metre car, and an 8.5 by 5.4 centimetre credit card. Use these as sanity checks when modelling to scale.</desc>

    <!-- card background -->
    <rect x="0" y="0" width="800" height="680" rx="14" fill="#0f1a14"/>
    <!-- top orange accent strip -->
    <rect x="0" y="0" width="800" height="8" rx="4" fill="#FF6B00"/>

    <!-- heading -->
    <text x="40" y="50" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#f5f7f6">Real-World Dimensions Reference</text>
    <text x="40" y="78" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#9fb0a8">Common sizes in metres &#183; sanity-check your model against these</text>

    <!-- legend (own row, left band, clear of title and cards) -->
    <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
        <circle cx="46" cy="104" r="6" fill="#4A9EFF"/>
        <text x="58" y="109" fill="#cfe0ff">Architecture</text>
        <circle cx="176" cy="104" r="6" fill="#FF6B00"/>
        <text x="188" y="109" fill="#ffd9b8">Furniture</text>
        <circle cx="286" cy="104" r="6" fill="#B47EE8"/>
        <text x="298" y="109" fill="#e6d3f6">Vehicles &#183; small</text>
    </g>

    <!-- ===== LEFT: human + height scale ===== -->
    <g>
        <!-- ground line -->
        <line x1="60" y1="600" x2="360" y2="600" stroke="#2c3a33" stroke-width="2"/>
        <!-- vertical height ruler at far left -->
        <line x1="92" y1="150" x2="92" y2="600" stroke="#4ADE80" stroke-width="2"/>
        <!-- tick at human head (1.7m), door (2.0m off-scale here use ceiling band) -->
        <!-- scale: y=600 is 0m, y=150 is ~2.7m  => 166.7 px per metre -->
        <!-- 1.7m tick -->
        <line x1="86" y1="317" x2="98" y2="317" stroke="#4ADE80" stroke-width="2"/>
        <text x="58" y="322" font-family="system-ui, sans-serif" font-size="12" fill="#4ADE80" text-anchor="end">1.7</text>
        <!-- 1.0m tick -->
        <line x1="86" y1="433" x2="98" y2="433" stroke="#4ADE80" stroke-width="1.5"/>
        <text x="58" y="438" font-family="system-ui, sans-serif" font-size="12" fill="#7fdca0" text-anchor="end">1.0</text>
        <!-- 2.0m tick -->
        <line x1="86" y1="267" x2="98" y2="267" stroke="#4ADE80" stroke-width="1.5"/>
        <text x="58" y="272" font-family="system-ui, sans-serif" font-size="12" fill="#7fdca0" text-anchor="end">2.0</text>
        <!-- 0m baseline label -->
        <text x="58" y="605" font-family="system-ui, sans-serif" font-size="12" fill="#7fdca0" text-anchor="end">0 m</text>

        <!-- human silhouette (~1.7m tall, centred ~x210, feet y=600 head y=317) -->
        <g fill="#cdd6d1">
            <!-- head -->
            <circle cx="210" cy="338" r="20"/>
            <!-- torso -->
            <path d="M190 360 Q210 352 230 360 L236 460 L184 460 Z"/>
            <!-- legs -->
            <path d="M188 462 L200 600 L212 600 L210 470 L208 600 L220 600 L232 462 Z"/>
            <!-- arms -->
            <path d="M192 366 L172 452 L182 454 L200 372 Z"/>
            <path d="M228 366 L248 452 L238 454 L220 372 Z"/>
        </g>
        <text x="210" y="628" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#4ADE80" text-anchor="middle">Person &#183; 1.7 m</text>

        <!-- door outline beside human (2.0m high, 0.9m wide) -->
        <rect x="280" y="267" width="70" height="333" fill="none" stroke="#4A9EFF" stroke-width="2.5"/>
        <circle cx="342" cy="440" r="3.5" fill="#4A9EFF"/>
        <text x="315" y="255" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#9fc8ff" text-anchor="middle">Door</text>
        <text x="315" y="628" font-family="system-ui, sans-serif" font-size="12" fill="#9fc8ff" text-anchor="middle">2.0 &#215; 0.9 m</text>
    </g>

    <!-- ===== RIGHT: object cards ===== -->
    <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
        <!-- card: ceiling -->
        <rect x="400" y="110" width="360" height="76" rx="8" fill="#13241c" stroke="#27506e" stroke-width="1.5"/>
        <text x="420" y="142" font-size="17" font-weight="700" fill="#9fc8ff">Ceiling height</text>
        <text x="420" y="166" font-size="13" fill="#9fb0a8">Standard interior room</text>
        <text x="740" y="156" font-size="22" font-weight="700" fill="#4A9EFF" text-anchor="end">2.4&#8211;2.7 m</text>

        <!-- card: table -->
        <rect x="400" y="198" width="360" height="76" rx="8" fill="#241a10" stroke="#7a4a16" stroke-width="1.5"/>
        <text x="420" y="230" font-size="17" font-weight="700" fill="#ffd9b8">Table</text>
        <text x="420" y="254" font-size="13" fill="#9fb0a8">Desk &#183; dining surface height</text>
        <text x="740" y="244" font-size="22" font-weight="700" fill="#FF6B00" text-anchor="end">0.75 m</text>

        <!-- card: chair -->
        <rect x="400" y="286" width="360" height="76" rx="8" fill="#241a10" stroke="#7a4a16" stroke-width="1.5"/>
        <text x="420" y="318" font-size="17" font-weight="700" fill="#ffd9b8">Chair</text>
        <text x="420" y="342" font-size="13" fill="#9fb0a8">Seat height from floor</text>
        <text x="740" y="332" font-size="22" font-weight="700" fill="#FF6B00" text-anchor="end">0.45 m</text>

        <!-- card: car -->
        <rect x="400" y="374" width="360" height="76" rx="8" fill="#1d1526" stroke="#5a3f7a" stroke-width="1.5"/>
        <text x="420" y="406" font-size="17" font-weight="700" fill="#e6d3f6">Car</text>
        <text x="420" y="430" font-size="13" fill="#9fb0a8">Length &#215; width, midsize</text>
        <text x="740" y="420" font-size="22" font-weight="700" fill="#B47EE8" text-anchor="end">4.5 &#215; 1.8 m</text>

        <!-- card: credit card -->
        <rect x="400" y="462" width="360" height="76" rx="8" fill="#1d1526" stroke="#5a3f7a" stroke-width="1.5"/>
        <text x="420" y="494" font-size="17" font-weight="700" fill="#e6d3f6">Credit card</text>
        <text x="420" y="518" font-size="13" fill="#9fb0a8">Pocket-scale reference</text>
        <text x="740" y="508" font-size="22" font-weight="700" fill="#B47EE8" text-anchor="end">8.5 &#215; 5.4 cm</text>
    </g>

    <!-- footer tip rail -->
    <rect x="400" y="556" width="360" height="60" rx="8" fill="#1a160a"/>
    <rect x="400" y="556" width="5" height="60" rx="2.5" fill="#F5C242"/>
    <text x="420" y="582" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#F5C242">Tip</text>
    <text x="420" y="603" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#e8dcc0">Keep a 1.7 m figure in-scene as a living scale check.</text>
</svg>
