<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="bf-title bf-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="bf-title">Brush falloff curve comparison</title>
  <desc id="bf-desc">Four brush falloff types shown in a two by two grid. Each panel pairs a falloff curve graph with a gradient circle showing the resulting brush edge: Smooth gives a soft gradual edge, Sharp a harder edge, Root a very soft wide edge, and Constant a hard solid edge with no fade.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Brush Falloff and Shape</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">How the falloff curve shapes the brush edge &#183; curve on the left, resulting stroke on the right</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Radial gradients for the brush-edge circles -->
  <defs>
    <radialGradient id="bf-smooth" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#FF6B00" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bf-sharp" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.95"/>
      <stop offset="78%" stop-color="#FF6B00" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bf-root" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.85"/>
      <stop offset="30%" stop-color="#FF6B00" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bf-constant" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.92"/>
      <stop offset="92%" stop-color="#FF6B00" stop-opacity="0.92"/>
      <stop offset="93%" stop-color="#FF6B00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Panel 1: Smooth (top-left) -->
  <g>
    <text x="60" y="150" font-size="16" font-weight="600" fill="currentColor">Smooth</text>
    <text x="60" y="170" font-size="13" fill="currentColor" opacity="0.6">soft, gradual edge &#183; default</text>
    <line x1="60" y1="280" x2="60" y2="190" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.5"/>
    <line x1="60" y1="280" x2="180" y2="280" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.5"/>
    <path d="M 60 192 C 100 196, 120 250, 180 280" fill="none" stroke="#FF6B00" stroke-width="2.5"/>
    <circle cx="270" cy="235" r="48" fill="url(#bf-smooth)"/>
  </g>

  <!-- Panel 2: Sharp (top-right) -->
  <g>
    <text x="440" y="150" font-size="16" font-weight="600" fill="currentColor">Sharp</text>
    <text x="440" y="170" font-size="13" fill="currentColor" opacity="0.6">harder edge, stays full longer</text>
    <line x1="440" y1="280" x2="440" y2="190" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.5"/>
    <line x1="440" y1="280" x2="560" y2="280" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.5"/>
    <path d="M 440 192 C 500 196, 530 210, 560 280" fill="none" stroke="#FF6B00" stroke-width="2.5"/>
    <circle cx="650" cy="235" r="48" fill="url(#bf-sharp)"/>
  </g>

  <!-- Panel 3: Root (bottom-left) -->
  <g>
    <text x="60" y="392" font-size="16" font-weight="600" fill="currentColor">Root</text>
    <text x="60" y="412" font-size="13" fill="currentColor" opacity="0.6">very soft, wide fade</text>
    <line x1="60" y1="522" x2="60" y2="432" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.5"/>
    <line x1="60" y1="522" x2="180" y2="522" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.5"/>
    <path d="M 60 434 C 84 478, 110 514, 180 522" fill="none" stroke="#FF6B00" stroke-width="2.5"/>
    <circle cx="270" cy="477" r="48" fill="url(#bf-root)"/>
  </g>

  <!-- Panel 4: Constant (bottom-right) -->
  <g>
    <text x="440" y="392" font-size="16" font-weight="600" fill="currentColor">Constant</text>
    <text x="440" y="412" font-size="13" fill="currentColor" opacity="0.6">hard edge, no fade</text>
    <line x1="440" y1="522" x2="440" y2="432" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.5"/>
    <line x1="440" y1="522" x2="560" y2="522" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.5"/>
    <path d="M 440 434 L 548 434 L 548 522" fill="none" stroke="#FF6B00" stroke-width="2.5"/>
    <circle cx="650" cy="477" r="48" fill="url(#bf-constant)"/>
  </g>

  <!-- Grid dividers -->
  <line x1="400" y1="138" x2="400" y2="540" stroke="currentColor" stroke-opacity="0.12" stroke-width="1"/>
  <line x1="40" y1="340" x2="760" y2="340" stroke="currentColor" stroke-opacity="0.12" stroke-width="1"/>

  <!-- axis hint label -->
  <text x="44" y="566" font-size="12" fill="currentColor" opacity="0.45">Curve: brush strength from center (left) to edge (right). Circle: the painted result.</text>

  <!-- Footer tip (Variant B, left rail) -->
  <rect x="40" y="625" width="720" height="34" fill="none"/>
  <rect x="40" y="625" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="647" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Smooth suits most blending &#183; Constant is best for hard masks and clean color fills.
  </text>
</svg>
