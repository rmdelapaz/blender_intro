<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="tsp-title tsp-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="tsp-title">Transform Geometry versus Set Position</title>
  <desc id="tsp-desc">Two panels compare geometry operations. Transform Geometry moves every point by the same amount, shifting the whole object uniformly. Set Position moves each point individually, producing a wave-like per-point displacement.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Transform vs Set Position</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">One moves the whole object; the other moves each point on its own</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>
  <line x1="400" y1="140" x2="400" y2="460" stroke="currentColor" stroke-width="1" opacity="0.12"/>

  <!-- LEFT Transform -->
  <text x="200" y="166" text-anchor="middle" font-size="16" font-weight="600" fill="#4A9EFF">Transform Geometry</text>
  <text x="200" y="186" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">uniform: every point moves the same</text>
  <text x="200" y="228" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">before</text>
  <circle cx="120" cy="240" r="4" fill="currentColor"/><circle cx="160" cy="240" r="4" fill="currentColor"/><circle cx="200" cy="240" r="4" fill="currentColor"/><circle cx="240" cy="240" r="4" fill="currentColor"/><circle cx="280" cy="240" r="4" fill="currentColor"/>
  <!-- move arrows uniform -->
  <g stroke="#4A9EFF" stroke-width="1.5" opacity="0.7">
    <line x1="120" y1="248" x2="120" y2="300" marker-end="url(#tsp-a)"/>
    <line x1="160" y1="248" x2="160" y2="300" marker-end="url(#tsp-a)"/>
    <line x1="200" y1="248" x2="200" y2="300" marker-end="url(#tsp-a)"/>
    <line x1="240" y1="248" x2="240" y2="300" marker-end="url(#tsp-a)"/>
    <line x1="280" y1="248" x2="280" y2="300" marker-end="url(#tsp-a)"/>
  </g>
  <text x="200" y="330" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">after</text>
  <circle cx="120" cy="312" r="4" fill="#4A9EFF"/><circle cx="160" cy="312" r="4" fill="#4A9EFF"/><circle cx="200" cy="312" r="4" fill="#4A9EFF"/><circle cx="240" cy="312" r="4" fill="#4A9EFF"/><circle cx="280" cy="312" r="4" fill="#4A9EFF"/>
  <text x="200" y="405" text-anchor="middle" font-size="12" font-weight="600" fill="#4A9EFF">Moves object as a whole</text>

  <!-- RIGHT Set Position -->
  <text x="600" y="166" text-anchor="middle" font-size="16" font-weight="600" fill="#B47EE8">Set Position</text>
  <text x="600" y="186" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">per-point: each point moves on its own</text>
  <text x="600" y="228" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">before</text>
  <circle cx="520" cy="240" r="4" fill="currentColor"/><circle cx="560" cy="240" r="4" fill="currentColor"/><circle cx="600" cy="240" r="4" fill="currentColor"/><circle cx="640" cy="240" r="4" fill="currentColor"/><circle cx="680" cy="240" r="4" fill="currentColor"/>
  <!-- per point varying arrows -->
  <g stroke="#B47EE8" stroke-width="1.5" opacity="0.75">
    <line x1="520" y1="248" x2="520" y2="284" marker-end="url(#tsp-a)"/>
    <line x1="560" y1="248" x2="560" y2="316" marker-end="url(#tsp-a)"/>
    <line x1="600" y1="248" x2="600" y2="272" marker-end="url(#tsp-a)"/>
    <line x1="640" y1="248" x2="640" y2="320" marker-end="url(#tsp-a)"/>
    <line x1="680" y1="248" x2="680" y2="288" marker-end="url(#tsp-a)"/>
  </g>
  <text x="600" y="345" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">after (wave)</text>
  <g fill="#B47EE8">
    <circle cx="520" cy="288" r="4"/><circle cx="560" cy="320" r="4"/><circle cx="600" cy="276" r="4"/><circle cx="640" cy="324" r="4"/><circle cx="680" cy="292" r="4"/>
  </g>
  <path d="M 520 288 Q 560 330 600 276 T 680 292" fill="none" stroke="#B47EE8" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="600" y="405" text-anchor="middle" font-size="12" font-weight="600" fill="#B47EE8">Moves each point individually</text>

  <defs>
    <marker id="tsp-a" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto"><path d="M0,0 L6,0 L3,6 Z" fill="currentColor" fill-opacity="0.5"/></marker>
  </defs>

  <rect x="40" y="506" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Reach for Set Position when you want noise, waves, or any effect that varies point by point.</text>
</svg>
