<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="lbv-title lbv-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="lbv-title">A single light path with numbered bounces</title>
  <desc id="lbv-desc">A camera on the left fires one ray that travels through a scene. It hits a glossy surface at bounce 1, a diffuse wall at bounce 2, and a diffuse floor at bounce 3, then reaches the ceiling light. Each surface tints the ray, and the accumulated color sets the pixel.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Following One Light Path</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Camera to glossy to diffuse to diffuse to light · 3 bounces</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Ceiling light -->
  <rect x="300" y="150" width="160" height="20" rx="4" fill="#F5C242"/>
  <text x="380" y="143" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.7">Ceiling light</text>
  <!-- light emission hint -->
  <g stroke="#F5C242" stroke-width="2" opacity="0.4" stroke-linecap="round">
    <line x1="330" y1="174" x2="324" y2="188"/>
    <line x1="380" y1="174" x2="380" y2="190"/>
    <line x1="430" y1="174" x2="436" y2="188"/>
  </g>

  <!-- Glossy surface (bounce 1 target) -->
  <rect x="250" y="300" width="120" height="18" rx="3" fill="#4A9EFF" opacity="0.6"/>
  <text x="310" y="338" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.7">Glossy</text>

  <!-- Diffuse wall (bounce 2 target) -->
  <rect x="560" y="220" width="18" height="160" rx="3" fill="#4ADE80" opacity="0.55"/>
  <text x="588" y="250" text-anchor="start" font-size="13" fill="currentColor" opacity="0.7">Diffuse wall</text>

  <!-- Diffuse floor (bounce 3 target) -->
  <rect x="360" y="430" width="260" height="18" rx="3" fill="#B47EE8" opacity="0.5"/>
  <text x="490" y="468" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.7">Diffuse floor</text>

  <!-- Camera -->
  <rect x="70" y="360" width="50" height="38" rx="5" fill="#FF6B00"/>
  <polygon points="120,369 142,360 142,398 120,389" fill="#FF6B00"/>
  <text x="96" y="420" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.7">Camera</text>

  <!-- The bold cyan ray path: camera -> glossy(1) -> wall(2) -> floor(3) -> light -->
  <g stroke="#4A9EFF" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="142" y1="378" x2="305" y2="306"/>
    <line x1="305" y1="306" x2="566" y2="300"/>
    <line x1="566" y1="300" x2="470" y2="436"/>
    <line x1="470" y1="436" x2="382" y2="170"/>
  </g>

  <!-- Bounce badges -->
  <circle cx="305" cy="306" r="13" fill="#FF6B00"/>
  <text x="305" y="311" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
  <circle cx="566" cy="300" r="13" fill="#FF6B00"/>
  <text x="566" y="305" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
  <circle cx="470" cy="436" r="13" fill="#FF6B00"/>
  <text x="470" y="441" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text>

  <!-- bounce annotations -->
  <text x="250" y="284" font-size="12" fill="currentColor" opacity="0.6">Bounce 1: reflects</text>
  <text x="600" y="350" font-size="12" fill="currentColor" opacity="0.6">Bounce 2: scatters</text>
  <text x="300" y="452" font-size="12" fill="currentColor" opacity="0.6">Bounce 3: scatters</text>

  <!-- Footer tip -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> The ray picks up color at every bounce, so the diffuse wall can tint light onto the floor (color bleeding).</text>
</svg>
