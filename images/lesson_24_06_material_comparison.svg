<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="mc-title mc-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="mc-title">Squash and stretch by material</title>
  <desc id="mc-desc">Four balls shown at the moment of impact, ordered from soft to rigid: rubber squashes the most, then basketball, then bowling ball, and metal barely deforms at all. A faint outline behind each ball shows its undeformed shape so the amount of squash is visible per material.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Material Comparison</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">How much a ball squashes at impact depends on the material: softer deforms more, rigid barely deforms</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Shared ground line -->
  <line x1="40" y1="400" x2="760" y2="400" stroke="currentColor" stroke-width="2" opacity="0.4"/>
  <text x="752" y="418" text-anchor="end" font-size="12" fill="currentColor" opacity="0.5">ground</text>

  <!-- Column centers: 140, 340, 540, 700 wait recompute: 4 cols across 760, centers 145, 327, 509, 691 -->
  <!-- Undeformed reference radius = 56 for all. Ground at y=400; deformed ellipse sits on ground. -->

  <!-- RUBBER (extreme squash ~50%): ry small, rx large -->
  <ellipse cx="145" cy="344" rx="56" ry="56" fill="none" stroke="currentColor" stroke-opacity="0.28" stroke-width="1.5" stroke-dasharray="5 5"/>
  <ellipse cx="145" cy="372" rx="86" ry="28" fill="#FF6B00"/>

  <!-- BASKETBALL (moderate ~25%): -->
  <ellipse cx="327" cy="344" rx="56" ry="56" fill="none" stroke="currentColor" stroke-opacity="0.28" stroke-width="1.5" stroke-dasharray="5 5"/>
  <ellipse cx="327" cy="358" rx="68" ry="42" fill="#FF6B00"/>

  <!-- BOWLING BALL (minimal ~8%): -->
  <ellipse cx="509" cy="344" rx="56" ry="56" fill="none" stroke="currentColor" stroke-opacity="0.28" stroke-width="1.5" stroke-dasharray="5 5"/>
  <ellipse cx="509" cy="347" rx="60" ry="52" fill="#FF6B00"/>

  <!-- METAL (almost none ~2%): -->
  <ellipse cx="691" cy="344" rx="56" ry="56" fill="none" stroke="currentColor" stroke-opacity="0.28" stroke-width="1.5" stroke-dasharray="5 5"/>
  <ellipse cx="691" cy="345" rx="57" ry="55" fill="#FF6B00"/>

  <!-- Material name + deformation labels -->
  <g text-anchor="middle">
    <text x="145" y="446" font-size="15" font-weight="600" fill="currentColor">Rubber</text>
    <text x="145" y="466" font-size="13" fill="currentColor" opacity="0.6">~50% squash</text>
    <text x="327" y="446" font-size="15" font-weight="600" fill="currentColor">Basketball</text>
    <text x="327" y="466" font-size="13" fill="currentColor" opacity="0.6">~25% squash</text>
    <text x="509" y="446" font-size="15" font-weight="600" fill="currentColor">Bowling ball</text>
    <text x="509" y="466" font-size="13" fill="currentColor" opacity="0.6">~8% squash</text>
    <text x="691" y="446" font-size="15" font-weight="600" fill="currentColor">Metal</text>
    <text x="691" y="466" font-size="13" fill="currentColor" opacity="0.6">~2% squash</text>
  </g>

  <!-- Soft to rigid axis cue -->
  <text x="40" y="150" font-size="13" font-weight="600" fill="currentColor" opacity="0.55">soft</text>
  <text x="760" y="150" text-anchor="end" font-size="13" font-weight="600" fill="currentColor" opacity="0.55">rigid</text>
  <line x1="78" y1="146" x2="722" y2="146" stroke="currentColor" stroke-opacity="0.25" stroke-width="1.5"/>
  <polygon points="722,146 712,141 712,151" fill="currentColor" opacity="0.4"/>
  <text x="400" y="138" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.5">dashed outline = the ball's shape before impact</text>

  <!-- Footer tip (Variant B left rail) -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Match the squash amount to the material. A rubber ball flattens dramatically; a metal ball should barely change shape.</text>
</svg>
