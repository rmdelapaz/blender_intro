<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" color="#222" role="img" aria-labelledby="tk-title tk-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="tk-title">Precision Modeling Toolkit</title>
  <desc id="tk-desc">A one-page reference grouping the lesson's precision tools into six categories: snapping, numerical input, measurement, unit systems, mirror and symmetry, and verification. Each category lists its main tools with the primary shortcut and what it is best used for.</desc>

  <rect x="0" y="0" width="800" height="680" rx="18" fill="#0f1a14"/>
  <rect x="0" y="0" width="800" height="10" rx="5" fill="#FF6B00"/>

  <text x="40" y="58" font-size="30" font-weight="700" fill="#f5f7f6">Precision Modeling Toolkit</text>
  <text x="40" y="88" font-size="17" font-weight="500" fill="#9fb0a8">Six tool families &#183; one shortcut and one job each</text>

  <!-- ===== ROW 1 ===== -->
  <!-- Snapping (orange) -->
  <g>
    <rect x="40" y="108" width="234" height="166" rx="12" fill="#11201a" stroke="#FF6B00" stroke-width="2"/>
    <circle cx="68" cy="138" r="15" fill="#FF6B00" opacity="0.18"/>
    <path d="M61 145 V133 a7 7 0 0 1 14 0 V145 M61 139 H75" fill="none" stroke="#FF6B00" stroke-width="2.5"/>
    <text x="92" y="143" font-size="16" font-weight="700" fill="#ffb878">Snapping</text>
    <text x="56" y="172" font-size="13" fill="#cdd8d2">Grid &#183; Vertex &#183; Edge</text>
    <text x="56" y="190" font-size="13" fill="#cdd8d2">Face &#183; Volume targets</text>
    <text x="56" y="218" font-size="13" font-weight="700" fill="#f5f7f6">Hold Ctrl &#183; Shift+Tab</text>
    <text x="56" y="244" font-size="12.5" fill="#9fb0a8">Lock geometry to exact</text>
    <text x="56" y="261" font-size="12.5" fill="#9fb0a8">points while moving.</text>
  </g>
  <!-- Numerical Input (blue) -->
  <g>
    <rect x="284" y="108" width="234" height="166" rx="12" fill="#11201a" stroke="#4A9EFF" stroke-width="2"/>
    <circle cx="312" cy="138" r="15" fill="#4A9EFF" opacity="0.18"/>
    <text x="312" y="144" font-size="15" font-weight="700" fill="#4A9EFF" text-anchor="middle">123</text>
    <text x="336" y="143" font-size="16" font-weight="700" fill="#9fd0ff">Numerical Input</text>
    <text x="300" y="172" font-size="13" fill="#cdd8d2">Type exact distances,</text>
    <text x="300" y="190" font-size="13" fill="#cdd8d2">angles and scales.</text>
    <text x="300" y="218" font-size="13" font-weight="700" fill="#f5f7f6">G / R / S &#183; axis &#183; number</text>
    <text x="300" y="244" font-size="12.5" fill="#9fb0a8">Math works too, e.g.</text>
    <text x="300" y="261" font-size="12.5" fill="#9fb0a8">R Z 360/8 for one step.</text>
  </g>
  <!-- Measurement (blue) -->
  <g>
    <rect x="528" y="108" width="232" height="166" rx="12" fill="#11201a" stroke="#4A9EFF" stroke-width="2"/>
    <circle cx="556" cy="138" r="15" fill="#4A9EFF" opacity="0.18"/>
    <path d="M548 131 L564 147 M551 145 l3 -3 M557 139 l3 -3" fill="none" stroke="#4A9EFF" stroke-width="2.5"/>
    <text x="580" y="143" font-size="16" font-weight="700" fill="#9fd0ff">Measurement</text>
    <text x="544" y="172" font-size="13" fill="#cdd8d2">Measure tool &#183; edge</text>
    <text x="544" y="190" font-size="13" fill="#cdd8d2">length &#183; statistics.</text>
    <text x="544" y="218" font-size="13" font-weight="700" fill="#f5f7f6">Overlays &#183; Edit Mode</text>
    <text x="544" y="244" font-size="12.5" fill="#9fb0a8">Verify lengths, angles</text>
    <text x="544" y="261" font-size="12.5" fill="#9fb0a8">and counts as you work.</text>
  </g>

  <!-- ===== ROW 2 ===== -->
  <!-- Unit Systems (purple) -->
  <g>
    <rect x="40" y="294" width="234" height="166" rx="12" fill="#11201a" stroke="#B47EE8" stroke-width="2"/>
    <circle cx="68" cy="324" r="15" fill="#B47EE8" opacity="0.18"/>
    <path d="M60 331 H76 M60 324 H76 M60 317 H76" fill="none" stroke="#B47EE8" stroke-width="2.5"/>
    <text x="92" y="329" font-size="16" font-weight="700" fill="#d6b8f5">Unit Systems</text>
    <text x="56" y="358" font-size="13" fill="#cdd8d2">Metric or Imperial,</text>
    <text x="56" y="376" font-size="13" fill="#cdd8d2">real-world scale.</text>
    <text x="56" y="404" font-size="13" font-weight="700" fill="#f5f7f6">Scene &#183; Units panel</text>
    <text x="56" y="430" font-size="12.5" fill="#9fb0a8">Set length and scale</text>
    <text x="56" y="447" font-size="12.5" fill="#9fb0a8">before you model.</text>
  </g>
  <!-- Mirror & Symmetry (green) -->
  <g>
    <rect x="284" y="294" width="234" height="166" rx="12" fill="#11201a" stroke="#4ADE80" stroke-width="2"/>
    <circle cx="312" cy="324" r="15" fill="#4ADE80" opacity="0.18"/>
    <path d="M312 314 V334 M304 318 L308 324 L304 330 M320 318 L316 324 L320 330" fill="none" stroke="#4ADE80" stroke-width="2.5"/>
    <text x="336" y="329" font-size="16" font-weight="700" fill="#86efac">Mirror &amp; Symmetry</text>
    <text x="300" y="358" font-size="13" fill="#cdd8d2">Mirror modifier, X-Mirror,</text>
    <text x="300" y="376" font-size="13" fill="#cdd8d2">Symmetrize.</text>
    <text x="300" y="404" font-size="13" font-weight="700" fill="#f5f7f6">Ctrl+M &#183; Clipping ON</text>
    <text x="300" y="430" font-size="12.5" fill="#9fb0a8">Model one half, keep the</text>
    <text x="300" y="447" font-size="12.5" fill="#9fb0a8">center seam gap-free.</text>
  </g>
  <!-- Verification (yellow) -->
  <g>
    <rect x="528" y="294" width="232" height="166" rx="12" fill="#11201a" stroke="#F5C242" stroke-width="2"/>
    <circle cx="556" cy="324" r="15" fill="#F5C242" opacity="0.18"/>
    <path d="M549 324 l5 5 l9 -10" fill="none" stroke="#F5C242" stroke-width="2.5"/>
    <text x="580" y="329" font-size="16" font-weight="700" fill="#f7d579">Verification</text>
    <text x="544" y="358" font-size="13" fill="#cdd8d2">Apply Scale &#183; Merge by</text>
    <text x="544" y="376" font-size="13" fill="#cdd8d2">Distance &#183; recalc normals.</text>
    <text x="544" y="404" font-size="13" font-weight="700" fill="#f5f7f6">Ctrl+A &#183; M &#8594; By Distance</text>
    <text x="544" y="430" font-size="12.5" fill="#9fb0a8">Clean up before export so</text>
    <text x="544" y="447" font-size="12.5" fill="#9fb0a8">measurements stay true.</text>
  </g>

  <!-- ===== legend band ===== -->
  <g>
    <rect x="40" y="486" width="720" height="118" rx="10" fill="#11201a" stroke="#24382e" stroke-width="2"/>
    <text x="56" y="512" font-size="14" font-weight="700" fill="#F5C242">HOW THE FAMILIES FIT TOGETHER</text>
    <text x="56" y="540" font-size="13.5" fill="#cdd8d2">Set <tspan fill="#d6b8f5" font-weight="700">units</tspan> first, then place geometry with <tspan fill="#ffb878" font-weight="700">snapping</tspan> and <tspan fill="#9fd0ff" font-weight="700">numerical input</tspan> for exact</text>
    <text x="56" y="562" font-size="13.5" fill="#cdd8d2">positions. Use <tspan fill="#86efac" font-weight="700">mirror and symmetry</tspan> to halve the work, <tspan fill="#9fd0ff" font-weight="700">measure</tspan> to confirm, and</text>
    <text x="56" y="584" font-size="13.5" fill="#cdd8d2"><tspan fill="#f7d579" font-weight="700">verification</tspan> tools to clean the result before it leaves Blender.</text>
  </g>

  <!-- footer tip rail -->
  <rect x="40" y="632" width="6" height="32" rx="3" fill="#F5C242"/>
  <text x="60" y="654" font-size="15" font-weight="600" fill="#F5C242">One job per tool &#183; combine them and precision becomes routine.</text>
</svg>
