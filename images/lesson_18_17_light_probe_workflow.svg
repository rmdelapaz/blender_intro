<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="lp-title lp-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="lp-title">The Eevee Next light probe workflow</title>
  <desc id="lp-desc">A five-step vertical flowchart for indirect lighting in Eevee Next. Step one add a light probe, choosing Volume, Sphere or Plane. Step two position it and set its influence distance to cover the area. Step three enable Raytracing in the render properties so reflections are computed. Step four bake the light probe volume to capture indirect light. Step five switch the viewport to Rendered to check the result, rebaking after scene changes. A note explains these replace the legacy irradiance volume and reflection cubemap bake workflow.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Light Probe Workflow</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Capturing indirect light and reflections in Eevee Next</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- connecting spine -->
  <line x1="92" y1="150" x2="92" y2="556" stroke="#FF6B00" stroke-width="2" opacity="0.35"/>

  <!-- Step 1 -->
  <circle cx="92" cy="170" r="18" fill="#FF6B00"/>
  <text x="92" y="176" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
  <rect x="130" y="146" width="630" height="64" rx="8" fill="#FF6B00" fill-opacity="0.07" stroke="#FF6B00" stroke-width="1.5"/>
  <text x="150" y="174" font-size="16" font-weight="700" fill="currentColor">Add a Light Probe</text>
  <text x="150" y="196" font-size="12.5" fill="currentColor" opacity="0.72">Add menu &#183; Light Probe &#183; choose Volume (area GI), Sphere (local reflections) or Plane (flat mirror)</text>

  <!-- Step 2 -->
  <circle cx="92" cy="262" r="18" fill="#FF6B00"/>
  <text x="92" y="268" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
  <rect x="130" y="238" width="630" height="64" rx="8" fill="#FF6B00" fill-opacity="0.07" stroke="#FF6B00" stroke-width="1.5"/>
  <text x="150" y="266" font-size="16" font-weight="700" fill="currentColor">Position and size it</text>
  <text x="150" y="288" font-size="12.5" fill="currentColor" opacity="0.72">Scale the probe and set Influence Distance in Object Data so it covers the lit area</text>

  <!-- Step 3 -->
  <circle cx="92" cy="354" r="18" fill="#FF6B00"/>
  <text x="92" y="360" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
  <rect x="130" y="330" width="630" height="64" rx="8" fill="#FF6B00" fill-opacity="0.07" stroke="#FF6B00" stroke-width="1.5"/>
  <text x="150" y="358" font-size="16" font-weight="700" fill="currentColor">Enable Raytracing</text>
  <text x="150" y="380" font-size="12.5" fill="currentColor" opacity="0.72">Render Properties &#183; Raytracing &#183; turn on so Sphere and Plane reflections are traced</text>

  <!-- Step 4 -->
  <circle cx="92" cy="446" r="18" fill="#FF6B00"/>
  <text x="92" y="452" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
  <rect x="130" y="422" width="630" height="64" rx="8" fill="#4ADE80" fill-opacity="0.1" stroke="#4ADE80" stroke-width="1.5"/>
  <text x="150" y="450" font-size="16" font-weight="700" fill="currentColor">Bake Light Probe Volume</text>
  <text x="150" y="472" font-size="12.5" fill="currentColor" opacity="0.72">Object &#183; Light Probe &#183; Bake Light Probe Volume &#183; stores indirect light into the volume cache</text>

  <!-- Step 5 -->
  <circle cx="92" cy="538" r="18" fill="#FF6B00"/>
  <text x="92" y="544" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">5</text>
  <rect x="130" y="514" width="630" height="64" rx="8" fill="#FF6B00" fill-opacity="0.07" stroke="#FF6B00" stroke-width="1.5"/>
  <text x="150" y="542" font-size="16" font-weight="700" fill="currentColor">Check in Rendered view</text>
  <text x="150" y="564" font-size="12.5" fill="currentColor" opacity="0.72">Switch viewport shading to Rendered &#183; rebake the volume after moving geometry or lights</text>

  <!-- EEVEE Next note chip -->
  <rect x="40" y="598" width="720" height="40" rx="6" fill="#4A9EFF" fill-opacity="0.08"/>
  <text x="58" y="616" font-size="12" font-weight="700" fill="#4A9EFF">Eevee Next:</text>
  <text x="142" y="616" font-size="12" fill="currentColor" opacity="0.78">Volume, Sphere and Plane probes plus Raytracing replace the old Irradiance</text>
  <text x="58" y="632" font-size="12" fill="currentColor" opacity="0.78">Volume, Reflection Cubemap and single Bake Indirect Lighting button from legacy Eevee.</text>

  <!-- Footer tip (Variant B left rail) -->
  <rect x="40" y="646" width="720" height="28" fill="none"/>
  <rect x="40" y="646" width="4" height="28" fill="#FF6B00"/>
  <text x="58" y="665" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> A baked volume is a snapshot &#183; if lighting looks stale after edits, rebake before you trust it.</text>
</svg>