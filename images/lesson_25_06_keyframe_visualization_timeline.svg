<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="kv-title kv-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="kv-title">Keyframe visualization on a timeline</title>
  <desc id="kv-desc">A timeline showing three keyframes you set by hand at frames 1, 24, and 48, drawn as orange diamonds, with a ball at a different height above each one. Between the keyframes, faded grey balls show the in-between frames that Blender generates automatically by interpolation. The point is that you set only a few key poses and Blender fills in the rest.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">What a Keyframe Captures</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">You set a few key poses; Blender fills in every frame between them</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ===== Motion stage (y 150..330): balls at heights above each frame ===== -->
  <!-- Keyframed balls (orange, solid) -->
  <g>
    <circle cx="120" cy="300" r="16" fill="#FF6B00"/>
    <circle cx="400" cy="180" r="16" fill="#FF6B00"/>
    <circle cx="680" cy="260" r="16" fill="#FF6B00"/>
  </g>

  <!-- In-between balls (faded grey, auto-generated) along an arc 1->24 and 24->48 -->
  <g fill="currentColor" opacity="0.22">
    <circle cx="190" cy="268" r="12"/>
    <circle cx="260" cy="234" r="12"/>
    <circle cx="330" cy="200" r="12"/>
    <circle cx="470" cy="196" r="12"/>
    <circle cx="540" cy="218" r="12"/>
    <circle cx="610" cy="240" r="12"/>
  </g>

  <!-- arc guide (subtle) -->
  <path d="M 120 300 Q 260 150 400 180 Q 540 210 680 260" fill="none" stroke="currentColor" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="4 5"/>

  <!-- ===== Timeline track (y=370) ===== -->
  <line x1="80" y1="370" x2="720" y2="370" stroke="currentColor" stroke-width="2" opacity="0.3"/>
  <!-- frame ticks under the three keyframes -->
  <g stroke="currentColor" stroke-opacity="0.3" stroke-width="1">
    <line x1="120" y1="364" x2="120" y2="376"/>
    <line x1="400" y1="364" x2="400" y2="376"/>
    <line x1="680" y1="364" x2="680" y2="376"/>
  </g>

  <!-- Keyframe diamonds on the track -->
  <g fill="#F5C242" stroke="currentColor" stroke-opacity="0.3" stroke-width="1">
    <path d="M 120 358 L 132 370 L 120 382 L 108 370 Z"/>
    <path d="M 400 358 L 412 370 L 400 382 L 388 370 Z"/>
    <path d="M 680 358 L 692 370 L 680 382 L 668 370 Z"/>
  </g>

  <!-- vertical connectors from ball to its keyframe diamond -->
  <g stroke="#FF6B00" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="3 4">
    <line x1="120" y1="316" x2="120" y2="356"/>
    <line x1="400" y1="196" x2="400" y2="356"/>
    <line x1="680" y1="276" x2="680" y2="356"/>
  </g>

  <!-- frame number labels -->
  <g font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">
    <text x="120" y="404">Frame 1</text>
    <text x="400" y="404">Frame 24</text>
    <text x="680" y="404">Frame 48</text>
  </g>
  <g font-size="12" fill="#FF6B00" font-weight="600" text-anchor="middle">
    <text x="120" y="422">keyframe</text>
    <text x="400" y="422">keyframe</text>
    <text x="680" y="422">keyframe</text>
  </g>

  <!-- in-between label -->
  <text x="260" y="448" font-size="12" fill="currentColor" opacity="0.55" text-anchor="middle">in-between frames (generated)</text>
  <text x="540" y="448" font-size="12" fill="currentColor" opacity="0.55" text-anchor="middle">in-between frames (generated)</text>

  <!-- Legend -->
  <circle cx="250" cy="478" r="9" fill="#FF6B00"/>
  <text x="266" y="483" font-size="13" fill="currentColor">You set these</text>
  <circle cx="430" cy="478" r="9" fill="currentColor" opacity="0.22"/>
  <text x="446" y="483" font-size="13" fill="currentColor">Blender fills these</text>

  <!-- Footer tip (Variant B left rail, 560 canvas: y=506) -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> A keyframe stores a value at a frame. Fewer, well-placed keys are easier to edit than many crowded ones.
  </text>
</svg>
