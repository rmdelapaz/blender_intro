<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" color="#222" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" role="img" aria-labelledby="nz49-t nz49-d">
  <title id="nz49-t">Dealing with Noise and Fireflies</title>
  <desc id="nz49-d">A map of the five common sources of render noise and fireflies in Cycles &#8212; glass caustics, indirect light, small bright sources, complex materials, and too few samples &#8212; each paired with the fix that targets it, rather than only raising samples.</desc>
  <rect x="0" y="0" width="760" height="430" fill="none"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="currentColor">Noise &amp; Fireflies: Match the Fix to the Source</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#8a8f98">Raising samples is the last resort, not the first &#8212; find what is actually noisy</text>

  <!-- column headers -->
  <text x="212" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#E63946">SOURCE OF NOISE</text>
  <text x="560" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#4ADE80">TARGETED FIX</text>

  <!-- row 1: glass caustics -->
  <rect x="40" y="100" width="344" height="52" rx="7" fill="#1a1a1a" stroke="#E63946" stroke-width="1.4"/>
  <text x="58" y="122" font-size="13" font-weight="700" fill="#c9ccd1">Glass caustics</text>
  <text x="58" y="141" font-size="10.5" fill="#8a8f98">bright speckles through refractive surfaces</text>
  <line x1="388" y1="126" x2="408" y2="126" stroke="#F5C242" stroke-width="2"/><path d="M408,126 l-9,-5 l0,10 z" fill="#F5C242"/>
  <rect x="412" y="100" width="308" height="52" rx="7" fill="#1a1a1a" stroke="#4ADE80" stroke-width="1.4"/>
  <text x="430" y="122" font-size="12.5" fill="#4ADE80">Enable caustics / use a Light Path node</text>
  <text x="430" y="141" font-size="10.5" fill="#8a8f98">clamp indirect; blur reflective caustics</text>

  <!-- row 2: indirect light -->
  <rect x="40" y="160" width="344" height="52" rx="7" fill="#1a1a1a" stroke="#E63946" stroke-width="1.4"/>
  <text x="58" y="182" font-size="13" font-weight="700" fill="#c9ccd1">Indirect / bounced light</text>
  <text x="58" y="201" font-size="10.5" fill="#8a8f98">grain in shadows &amp; interiors</text>
  <line x1="388" y1="186" x2="408" y2="186" stroke="#F5C242" stroke-width="2"/><path d="M408,186 l-9,-5 l0,10 z" fill="#F5C242"/>
  <rect x="412" y="160" width="308" height="52" rx="7" fill="#1a1a1a" stroke="#4ADE80" stroke-width="1.4"/>
  <text x="430" y="182" font-size="12.5" fill="#4ADE80">Raise bounces + portals on openings</text>
  <text x="430" y="201" font-size="10.5" fill="#8a8f98">add fill light so paths are not starved</text>

  <!-- row 3: small bright -->
  <rect x="40" y="220" width="344" height="52" rx="7" fill="#1a1a1a" stroke="#E63946" stroke-width="1.4"/>
  <text x="58" y="242" font-size="13" font-weight="700" fill="#c9ccd1">Small, very bright sources</text>
  <text x="58" y="261" font-size="10.5" fill="#8a8f98">tiny emitters / sharp sun = fireflies</text>
  <line x1="388" y1="246" x2="408" y2="246" stroke="#F5C242" stroke-width="2"/><path d="M408,246 l-9,-5 l0,10 z" fill="#F5C242"/>
  <rect x="412" y="220" width="308" height="52" rx="7" fill="#1a1a1a" stroke="#4ADE80" stroke-width="1.4"/>
  <text x="430" y="242" font-size="12.5" fill="#4ADE80">Clamp Indirect; enlarge the emitter</text>
  <text x="430" y="261" font-size="10.5" fill="#8a8f98">bigger source = softer, cleaner paths</text>

  <!-- row 4: complex materials -->
  <rect x="40" y="280" width="344" height="52" rx="7" fill="#1a1a1a" stroke="#E63946" stroke-width="1.4"/>
  <text x="58" y="302" font-size="13" font-weight="700" fill="#c9ccd1">Complex / glossy materials</text>
  <text x="58" y="321" font-size="10.5" fill="#8a8f98">rough reflections converge slowly</text>
  <line x1="388" y1="306" x2="408" y2="306" stroke="#F5C242" stroke-width="2"/><path d="M408,306 l-9,-5 l0,10 z" fill="#F5C242"/>
  <rect x="412" y="280" width="308" height="52" rx="7" fill="#1a1a1a" stroke="#4ADE80" stroke-width="1.4"/>
  <text x="430" y="302" font-size="12.5" fill="#4ADE80">Multiple Importance + slight roughness</text>
  <text x="430" y="321" font-size="10.5" fill="#8a8f98">avoid perfectly sharp mirror where you can</text>

  <!-- row 5: too few samples -->
  <rect x="40" y="340" width="344" height="52" rx="7" fill="#1a1a1a" stroke="#E63946" stroke-width="1.4"/>
  <text x="58" y="362" font-size="13" font-weight="700" fill="#c9ccd1">Too few samples</text>
  <text x="58" y="381" font-size="10.5" fill="#8a8f98">uniform fine grain everywhere</text>
  <line x1="388" y1="366" x2="408" y2="366" stroke="#F5C242" stroke-width="2"/><path d="M408,366 l-9,-5 l0,10 z" fill="#F5C242"/>
  <rect x="412" y="340" width="308" height="52" rx="7" fill="#1a1a1a" stroke="#4ADE80" stroke-width="1.4"/>
  <text x="430" y="362" font-size="12.5" fill="#4ADE80">Denoiser first, then raise samples</text>
  <text x="430" y="381" font-size="10.5" fill="#8a8f98">OptiX / OpenImageDenoise before brute force</text>

  <text x="380" y="416" text-anchor="middle" font-size="11.5" fill="#B47EE8">Diagnose the source first &#183; a denoiser hides grain but cannot invent missing light.</text>
</svg>
