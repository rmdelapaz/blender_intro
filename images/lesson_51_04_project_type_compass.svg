<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="ptc-title ptc-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="ptc-title">Project type compass: five portfolio directions compared</title>
  <desc id="ptc-desc">Five common portfolio project types laid out as cards, each with what it proves, its main difficulty, and who it is best for. Character piece proves anatomy and appeal. Environment proves scene composition and scale. Hard-surface product proves precision and materials. Stylised scene proves artistic voice. Motion or animation proves timing and rigging. Choose by matching what a type proves to the job you want.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Project Type Compass</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Five directions, what each one proves, and who it suits &#183; pick the fit, not the trend</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ROW 1: Character -->
  <rect x="40" y="132" width="720" height="86" rx="8" fill="#B47EE8" fill-opacity="0.07"/>
  <rect x="40" y="132" width="4" height="86" fill="#B47EE8"/>
  <!-- glyph: head silhouette -->
  <circle cx="86" cy="167" r="16" fill="none" stroke="#B47EE8" stroke-width="2"/>
  <path d="M 66 200 Q 86 182 106 200" fill="none" stroke="#B47EE8" stroke-width="2"/>
  <text x="128" y="160" font-size="16" font-weight="700" fill="#B47EE8">Character Piece</text>
  <text x="128" y="182" font-size="12.5" fill="currentColor" opacity="0.8"><tspan font-weight="600">Proves:</tspan> anatomy, silhouette, appeal, sculpt-to-retopo control</text>
  <text x="128" y="202" font-size="12.5" fill="currentColor" opacity="0.6"><tspan fill="#E63946" font-weight="600">Hard part:</tspan> anatomy reads instantly &#183; <tspan font-weight="600">Best for:</tspan> games, film, concept work</text>

  <!-- ROW 2: Environment -->
  <rect x="40" y="230" width="720" height="86" rx="8" fill="#4ADE80" fill-opacity="0.07"/>
  <rect x="40" y="230" width="4" height="86" fill="#4ADE80"/>
  <!-- glyph: mountains -->
  <path d="M 66 292 l 20 -34 l 12 18 l 14 -24 l 20 40 z" fill="none" stroke="#4ADE80" stroke-width="2" stroke-linejoin="round"/>
  <text x="128" y="258" font-size="16" font-weight="700" fill="#4ADE80">Environment / Scene</text>
  <text x="128" y="280" font-size="12.5" fill="currentColor" opacity="0.8"><tspan font-weight="600">Proves:</tspan> composition, scale, set dressing, mood and atmosphere</text>
  <text x="128" y="300" font-size="12.5" fill="currentColor" opacity="0.6"><tspan fill="#E63946" font-weight="600">Hard part:</tspan> scope control &#183; <tspan font-weight="600">Best for:</tspan> games, archviz, film backgrounds</text>

  <!-- ROW 3: Hard-surface / product -->
  <rect x="40" y="328" width="720" height="86" rx="8" fill="#4A9EFF" fill-opacity="0.07"/>
  <rect x="40" y="328" width="4" height="86" fill="#4A9EFF"/>
  <!-- glyph: gear-ish cube -->
  <rect x="70" y="350" width="32" height="32" rx="3" fill="none" stroke="#4A9EFF" stroke-width="2"/>
  <line x1="70" y1="360" x2="102" y2="360" stroke="#4A9EFF" stroke-width="1.4" opacity="0.7"/>
  <line x1="86" y1="350" x2="86" y2="382" stroke="#4A9EFF" stroke-width="1.4" opacity="0.7"/>
  <text x="128" y="356" font-size="16" font-weight="700" fill="#4A9EFF">Hard-Surface / Product</text>
  <text x="128" y="378" font-size="12.5" fill="currentColor" opacity="0.8"><tspan font-weight="600">Proves:</tspan> precision, bevels, material accuracy, studio lighting</text>
  <text x="128" y="398" font-size="12.5" fill="currentColor" opacity="0.6"><tspan fill="#E63946" font-weight="600">Hard part:</tspan> clean topology on curves &#183; <tspan font-weight="600">Best for:</tspan> product viz, industrial design</text>

  <!-- ROW 4: Stylised -->
  <rect x="40" y="426" width="720" height="86" rx="8" fill="#F5C242" fill-opacity="0.07"/>
  <rect x="40" y="426" width="4" height="86" fill="#F5C242"/>
  <!-- glyph: star -->
  <path d="M 86 448 l 5 12 l 13 1 l -10 9 l 3 13 l -11 -7 l -11 7 l 3 -13 l -10 -9 l 13 -1 z" fill="none" stroke="#F5C242" stroke-width="2" stroke-linejoin="round"/>
  <text x="128" y="454" font-size="16" font-weight="700" fill="#F5C242">Stylised Scene</text>
  <text x="128" y="476" font-size="12.5" fill="currentColor" opacity="0.8"><tspan font-weight="600">Proves:</tspan> artistic voice, colour, shape language, a distinct look</text>
  <text x="128" y="496" font-size="12.5" fill="currentColor" opacity="0.6"><tspan fill="#E63946" font-weight="600">Hard part:</tspan> consistency of style &#183; <tspan font-weight="600">Best for:</tspan> indie, freelance, personal brand</text>

  <!-- ROW 5: Motion / animation -->
  <rect x="40" y="524" width="720" height="86" rx="8" fill="#FF7EA8" fill-opacity="0.07"/>
  <rect x="40" y="524" width="4" height="86" fill="#FF7EA8"/>
  <!-- glyph: play + motion arcs -->
  <path d="M 74 548 l 24 15 l -24 15 z" fill="none" stroke="#FF7EA8" stroke-width="2" stroke-linejoin="round"/>
  <text x="128" y="552" font-size="16" font-weight="700" fill="#FF7EA8">Motion / Animation</text>
  <text x="128" y="574" font-size="12.5" fill="currentColor" opacity="0.8"><tspan font-weight="600">Proves:</tspan> timing, weight, rigging, staging over time</text>
  <text x="128" y="594" font-size="12.5" fill="currentColor" opacity="0.6"><tspan fill="#E63946" font-weight="600">Hard part:</tspan> polish across every frame &#183; <tspan font-weight="600">Best for:</tspan> film, motion graphics, games</text>

  <!-- Footer tip (Variant B, left rail) -->
  <rect x="40" y="641" width="720" height="34" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> One type, done well, beats five half-explored. Your second piece can prove a second thing.
  </text>
</svg>
