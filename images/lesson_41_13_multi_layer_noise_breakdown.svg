<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="mln-title mln-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="mln-title">Multi-Layer Noise Breakdown</title>
  <desc id="mln-desc">Three noise layers stacked additively: a large-scale base wave, a mid-scale detail wave, and a fine-scale wave, summed to produce the final combined terrain profile.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Multi-Layer Noise Breakdown</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Stack noise octaves to get natural detail: big shapes plus small ones</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Layer 1: base large-scale -->
  <text x="40" y="138" font-size="18" font-weight="600" fill="currentColor">Layer 1 &#183; Base</text>
  <text x="220" y="138" font-size="13" fill="currentColor" opacity="0.6">Large scale &#183; low frequency &#183; the overall hills</text>
  <rect x="40" y="150" width="4" height="56" fill="#4A9EFF"/>
  <polyline points="60,178 120,160 180,196 240,166 300,188 360,158 420,190 480,168 540,184 600,162 660,192 720,176"
            fill="none" stroke="#4A9EFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="400" y="228" font-size="22" font-weight="700" fill="currentColor" text-anchor="middle" opacity="0.5">+</text>

  <!-- Layer 2: mid detail -->
  <text x="40" y="264" font-size="18" font-weight="600" fill="currentColor">Layer 2 &#183; Detail</text>
  <text x="220" y="264" font-size="13" fill="currentColor" opacity="0.6">Mid scale &#183; higher frequency &#183; ridges and bumps</text>
  <rect x="40" y="276" width="4" height="56" fill="#B47EE8"/>
  <polyline points="60,304 90,290 120,314 150,292 180,316 210,294 240,312 270,290 300,316 330,296 360,310 390,288 420,314 450,294 480,312 510,290 540,316 570,296 600,310 630,290 660,314 690,294 720,308"
            fill="none" stroke="#B47EE8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="400" y="354" font-size="22" font-weight="700" fill="currentColor" text-anchor="middle" opacity="0.5">+</text>

  <!-- Layer 3: fine -->
  <text x="40" y="390" font-size="18" font-weight="600" fill="currentColor">Layer 3 &#183; Fine</text>
  <text x="220" y="390" font-size="13" fill="currentColor" opacity="0.6">Small scale &#183; highest frequency &#183; surface roughness</text>
  <rect x="40" y="402" width="4" height="48" fill="#F5C242"/>
  <polyline points="60,426 75,418 90,430 105,418 120,428 135,418 150,430 165,418 180,428 195,418 210,430 225,418 240,428 255,418 270,430 285,418 300,428 315,418 330,430 345,418 360,428 375,418 390,430 405,418 420,428 435,418 450,430 465,418 480,428 495,418 510,430 525,418 540,428 555,418 570,430 585,418 600,428 615,418 630,430 645,418 660,428 675,418 690,430 705,418 720,426"
            fill="none" stroke="#F5C242" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="400" y="482" font-size="22" font-weight="700" fill="currentColor" text-anchor="middle" opacity="0.5">=</text>

  <!-- Result: combined -->
  <text x="40" y="518" font-size="18" font-weight="600" fill="currentColor">Result &#183; Combined</text>
  <text x="240" y="518" font-size="13" fill="currentColor" opacity="0.6">All layers summed &#183; natural-looking terrain</text>
  <rect x="40" y="530" width="4" height="72" fill="#FF6B00"/>
  <polyline points="60,568 90,556 120,584 150,554 180,586 210,558 240,576 270,548 300,582 330,560 360,568 390,544 420,582 450,562 480,574 510,548 540,586 570,562 600,570 630,548 660,584 690,560 720,572"
            fill="none" stroke="#FF6B00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="60" y1="600" x2="720" y2="600" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Footer tip Variant B (dense y=641/663) -->
  <rect x="40" y="641" width="720" height="34" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Each layer halves the scale and the strength &#183; a Noise node per octave, added together with Math nodes.</text>
</svg>
