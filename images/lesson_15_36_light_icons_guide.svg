<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" role="img" color="#222"
     aria-labelledby="li-title li-desc" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <title id="li-title">Light type identification guide</title>
  <desc id="li-desc">A 2 by 2 reference card showing the four Blender light type icons (Point, Sun, Spot, Area) with their names and key characteristics, for recognizing light types in the viewport.</desc>

  <!-- ===== card background ===== -->
  <rect x="0" y="0" width="800" height="680" rx="16" fill="#1b1d22"/>
  <rect x="0.5" y="0.5" width="799" height="679" rx="16" fill="none" stroke="#3a3d44" stroke-width="1"/>

  <!-- header -->
  <text x="400" y="46" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff">Light Type Icons</text>
  <text x="400" y="74" text-anchor="middle" font-size="16" fill="#b9bdc6">How each light reads in the Blender viewport</text>
  <rect x="300" y="86" width="200" height="3" rx="1.5" fill="#FF6B00"/>

  <!-- quadrant divider lines -->
  <line x1="400" y1="110" x2="400" y2="652" stroke="#3a3d44" stroke-width="1.5"/>
  <line x1="28" y1="381" x2="772" y2="381" stroke="#3a3d44" stroke-width="1.5"/>

  <!-- =========================================================
       Q1 (top-left): POINT  - sphere with radiating dots/rays
       ========================================================= -->
  <g id="li-point">
    <!-- icon: central glow + radiating short rays = omni -->
    <g transform="translate(120,180)">
      <circle cx="0" cy="0" r="20" fill="none" stroke="#FF6B00" stroke-width="3"/>
      <circle cx="0" cy="0" r="6" fill="#FF6B00"/>
      <!-- 8 radiating rays -->
      <g stroke="#e8eaee" stroke-width="3" stroke-linecap="round">
        <line x1="0" y1="-30" x2="0" y2="-44"/>
        <line x1="0" y1="30" x2="0" y2="44"/>
        <line x1="-30" y1="0" x2="-44" y2="0"/>
        <line x1="30" y1="0" x2="44" y2="0"/>
        <line x1="-21" y1="-21" x2="-31" y2="-31"/>
        <line x1="21" y1="-21" x2="31" y2="-31"/>
        <line x1="-21" y1="21" x2="-31" y2="31"/>
        <line x1="21" y1="21" x2="31" y2="31"/>
      </g>
    </g>
    <text x="200" y="150" font-size="22" font-weight="700" fill="#ffffff">Point</text>
    <text x="200" y="178" font-size="14" fill="#9aa0ab">Omnidirectional bulb</text>
    <g font-size="14.5" fill="#d4d7de">
      <text x="200" y="214">&#183; Emits in all directions</text>
      <text x="200" y="240">&#183; Light falls off with distance</text>
      <text x="200" y="266">&#183; Hard shadows (small radius)</text>
    </g>
  </g>

  <!-- =========================================================
       Q2 (top-right): SUN  - disc with long parallel rays + arrow
       ========================================================= -->
  <g id="li-sun">
    <g transform="translate(505,180)">
      <circle cx="0" cy="0" r="16" fill="none" stroke="#FF6B00" stroke-width="3"/>
      <!-- long even rays = distant / parallel -->
      <g stroke="#e8eaee" stroke-width="3" stroke-linecap="round">
        <line x1="0" y1="-26" x2="0" y2="-46"/>
        <line x1="0" y1="26" x2="0" y2="46"/>
        <line x1="-26" y1="0" x2="-46" y2="0"/>
        <line x1="26" y1="0" x2="46" y2="0"/>
        <line x1="-18" y1="-18" x2="-33" y2="-33"/>
        <line x1="18" y1="-18" x2="33" y2="-33"/>
        <line x1="-18" y1="18" x2="-33" y2="33"/>
        <line x1="18" y1="18" x2="33" y2="33"/>
      </g>
      <!-- direction arrow (sun has a direction line in viewport) -->
      <line x1="0" y1="46" x2="0" y2="74" stroke="#4A9EFF" stroke-width="2.5"/>
      <path d="M -5,68 L 0,78 L 5,68 Z" fill="#4A9EFF"/>
    </g>
    <text x="560" y="150" font-size="22" font-weight="700" fill="#ffffff">Sun</text>
    <text x="560" y="178" font-size="14" fill="#9aa0ab">Distant directional</text>
    <g font-size="14.5" fill="#d4d7de">
      <text x="560" y="214">&#183; Parallel rays (one way)</text>
      <text x="560" y="240">&#183; No falloff across scene</text>
      <text x="560" y="266">&#183; Position ignored; angle only</text>
    </g>
  </g>

  <!-- =========================================================
       Q3 (bottom-left): SPOT  - cone pointing down
       ========================================================= -->
  <g id="li-spot">
    <g transform="translate(120,470)">
      <!-- emitter dot + dashed cone -->
      <circle cx="0" cy="-34" r="6" fill="#FF6B00"/>
      <path d="M 0,-34 L -34,42 L 34,42 Z" fill="#FF6B00" fill-opacity="0.12"
            stroke="#FF6B00" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- pool ellipse at cone base -->
      <ellipse cx="0" cy="42" rx="34" ry="9" fill="none" stroke="#e8eaee" stroke-width="2.5"/>
    </g>
    <text x="200" y="440" font-size="22" font-weight="700" fill="#ffffff">Spot</text>
    <text x="200" y="468" font-size="14" fill="#9aa0ab">Focused cone</text>
    <g font-size="14.5" fill="#d4d7de">
      <text x="200" y="504">&#183; Cone-shaped beam</text>
      <text x="200" y="530">&#183; Circular pool of light</text>
      <text x="200" y="556">&#183; Spot Size + Blend control edge</text>
    </g>
  </g>

  <!-- =========================================================
       Q4 (bottom-right): AREA  - rectangle plane + normal arrow
       ========================================================= -->
  <g id="li-area">
    <g transform="translate(505,460)">
      <!-- tilted plane (parallelogram) to read as a surface -->
      <path d="M -40,-22 L 40,-30 L 40,14 L -40,22 Z" fill="#FF6B00" fill-opacity="0.14"
            stroke="#FF6B00" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- emission-normal arrow (direction matters for Area) -->
      <line x1="0" y1="-4" x2="0" y2="44" stroke="#4A9EFF" stroke-width="2.5"/>
      <path d="M -5,38 L 0,48 L 5,38 Z" fill="#4A9EFF"/>
    </g>
    <text x="560" y="440" font-size="22" font-weight="700" fill="#ffffff">Area</text>
    <text x="560" y="468" font-size="14" fill="#9aa0ab">Rectangular panel</text>
    <g font-size="14.5" fill="#d4d7de">
      <text x="560" y="504">&#183; Emits from a surface</text>
      <text x="560" y="530">&#183; Soft, gradual shadows</text>
      <text x="560" y="556">&#183; Larger size = softer shadow</text>
    </g>
  </g>

  <!-- footer legend: arrow meaning -->
  <g transform="translate(0,612)">
    <line x1="300" y1="0" x2="324" y2="0" stroke="#4A9EFF" stroke-width="2.5"/>
    <path d="M 319,-4 L 329,0 L 319,4 Z" fill="#4A9EFF"/>
    <text x="338" y="5" font-size="13.5" fill="#9aa0ab">blue arrow = emission direction (Sun &amp; Area)</text>
  </g>
</svg>
