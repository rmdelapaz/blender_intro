<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="li-title li-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="li-title">Linear interpolation diagram</title>
  <desc id="li-desc">A value-versus-time graph showing the straight diagonal line produced by Linear interpolation between two keyframes. Evenly spaced tick marks along the line show constant velocity. The motion starts at full speed instantly and stops abruptly, which reads as mechanical or robotic.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Linear Interpolation</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Constant speed &#183; no acceleration &#183; mechanical feel</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Graph plot area: x 120..720, y 150..450 -->
  <g stroke="currentColor" opacity="0.15" stroke-width="1">
    <line x1="120" y1="150" x2="120" y2="450"/>
    <line x1="420" y1="150" x2="420" y2="450"/>
    <line x1="720" y1="150" x2="720" y2="450"/>
    <line x1="120" y1="450" x2="720" y2="450"/>
    <line x1="120" y1="300" x2="720" y2="300"/>
    <line x1="120" y1="150" x2="720" y2="150"/>
  </g>

  <!-- Axis lines -->
  <g stroke="currentColor" opacity="0.45" stroke-width="1.5" stroke-linecap="round">
    <line x1="120" y1="150" x2="120" y2="450"/>
    <line x1="120" y1="450" x2="720" y2="450"/>
  </g>

  <!-- Axis labels: X -->
  <text x="420" y="492" font-size="13" text-anchor="middle" fill="currentColor" opacity="0.6">TIME (frames)</text>
  <text x="120" y="470" font-size="13" text-anchor="middle" fill="currentColor" opacity="0.6">1</text>
  <text x="420" y="470" font-size="13" text-anchor="middle" fill="currentColor" opacity="0.6">12</text>
  <text x="720" y="470" font-size="13" text-anchor="middle" fill="currentColor" opacity="0.6">24</text>

  <!-- Axis labels: Y -->
  <text x="64" y="300" font-size="13" text-anchor="middle" fill="currentColor" opacity="0.6" transform="rotate(-90 64 300)">VALUE (position)</text>
  <text x="104" y="455" font-size="13" text-anchor="end" fill="currentColor" opacity="0.6">0</text>
  <text x="104" y="305" font-size="13" text-anchor="end" fill="currentColor" opacity="0.6">5</text>
  <text x="104" y="155" font-size="13" text-anchor="end" fill="currentColor" opacity="0.6">10</text>

  <!-- Linear line from (120,450) to (720,150) -->
  <line x1="120" y1="450" x2="720" y2="150" stroke="#FF6B00" stroke-width="4" stroke-linecap="round"/>

  <!-- Even-spacing velocity ticks along the line (constant velocity) -->
  <g fill="currentColor" opacity="0.45">
    <circle cx="220" cy="400" r="3.5"/>
    <circle cx="320" cy="350" r="3.5"/>
    <circle cx="420" cy="300" r="3.5"/>
    <circle cx="520" cy="250" r="3.5"/>
    <circle cx="620" cy="200" r="3.5"/>
  </g>

  <!-- Keyframe diamonds (yellow) -->
  <path d="M 120 438 L 132 450 L 120 462 L 108 450 Z" fill="#F5C242" stroke="currentColor" stroke-opacity="0.3" stroke-width="1"/>
  <path d="M 720 138 L 732 150 L 720 162 L 708 150 Z" fill="#F5C242" stroke="currentColor" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Annotations -->
  <text x="150" y="438" font-size="13" font-weight="600" fill="currentColor">Instant full speed</text>
  <text x="430" y="280" font-size="13" font-weight="600" fill="currentColor">Constant speed</text>
  <text x="430" y="296" font-size="12" fill="currentColor" opacity="0.6">even spacing = no acceleration</text>
  <text x="712" y="186" font-size="13" font-weight="600" fill="currentColor" text-anchor="end">Sudden stop</text>

  <!-- Even-spacing legend -->
  <circle cx="430" cy="356" r="3.5" fill="currentColor" opacity="0.45"/>
  <text x="446" y="360" font-size="12" fill="currentColor" opacity="0.6">Equal gaps = equal value change per frame</text>

  <!-- Footer tip (Variant B left rail) -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Reserve Linear for mechanical motion (conveyors, gears, clock hands). For anything organic, Bezier reads more natural.
  </text>
</svg>
