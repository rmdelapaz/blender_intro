<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="hr-title hr-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="hr-title">Headroom and looking room in character framing</title>
  <desc id="hr-desc">A 16:9 camera frame holding a head-and-shoulders figure that faces right. A small gap above the head is labelled headroom. The large open space in front of the face, in the direction the subject looks, is labelled looking room, and is wider than the smaller space behind the subject.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">HEADROOM &amp; LOOKING ROOM</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Give a subject room to breathe and to look</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ============ 16:9 FRAME ============ -->
  <!-- Frame x 170..630 (w=460), y 150..409 (h=259) ~16:9 -->
  <rect x="170" y="150" width="460" height="259"
        fill="currentColor" fill-opacity="0.03"
        stroke="currentColor" stroke-width="2" opacity="0.85"/>

  <!-- Subject: head + shoulders, larger, set left-of-centre, facing right.
       Head centre = (315, 262), r=46. Shoulders fill the lower frame.
       Eye level (measurement row) y=262. -->
  <g fill="currentColor" opacity="0.32">
    <!-- shoulders / bust filling bottom of frame -->
    <path d="M 232 409 C 232 338 268 300 315 300 C 362 300 398 338 398 409 Z"/>
    <!-- head -->
    <circle cx="315" cy="262" r="46"/>
    <!-- facing-direction nose hint (points right) -->
    <polygon points="361,262 378,255 378,269"/>
  </g>

  <!-- ============ MEASUREMENT ANNOTATIONS ============ -->
  <!-- Headroom: gap between head top (y=216) and frame top (y=150) -->
  <g stroke="#FF6B00" stroke-width="2" opacity="0.9">
    <line x1="315" y1="150" x2="315" y2="216"/>
    <line x1="305" y1="150" x2="325" y2="150"/>
    <line x1="305" y1="216" x2="325" y2="216"/>
  </g>

  <!-- Looking room: head right edge x=378 to frame right x=630, at eye level y=262 -->
  <g stroke="#4ADE80" stroke-width="2" opacity="0.95">
    <line x1="385" y1="262" x2="630" y2="262"/>
    <line x1="385" y1="252" x2="385" y2="272"/>
    <line x1="630" y1="252" x2="630" y2="272"/>
  </g>

  <!-- Space behind: smaller, frame left x=170 to head left edge x=269, at y=262 -->
  <g stroke="currentColor" stroke-width="2" opacity="0.45">
    <line x1="170" y1="262" x2="262" y2="262"/>
    <line x1="170" y1="252" x2="170" y2="272"/>
    <line x1="262" y1="252" x2="262" y2="272"/>
  </g>

  <!-- ============ LABELS ============ -->
  <!-- Headroom label (leader to the headroom line) -->
  <g stroke="currentColor" stroke-width="1.5" opacity="0.45" stroke-linecap="round">
    <line x1="470" y1="182" x2="319" y2="184"/>
  </g>
  <text x="478" y="180" font-size="14" font-weight="600" fill="#FF6B00">Headroom</text>
  <text x="478" y="198" font-size="12" fill="currentColor" opacity="0.6">Small gap above the head</text>

  <!-- Looking room label, in the open space in front (below the green line) -->
  <text x="515" y="296" font-size="14" font-weight="600" text-anchor="middle" fill="#4ADE80">Looking Room</text>
  <text x="515" y="314" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.6">More space where the</text>
  <text x="515" y="330" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.6">subject faces</text>

  <!-- Space behind label (above the behind line, clear of head) -->
  <text x="216" y="240" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" opacity="0.7">Less</text>
  <text x="216" y="256" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" opacity="0.7">behind</text>

  <!-- ============ TAKEAWAY ============ -->
  <text x="170" y="446" font-size="13" font-weight="600" fill="currentColor">Lead the eye:</text>
  <text x="170" y="464" font-size="13" fill="currentColor" opacity="0.6">leave more room in the direction the subject looks or moves, and just a little above.</text>

  <!-- ============ FOOTER TIP (Variant B, left rail) ============ -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Too much headroom is the most common beginner framing mistake &#183; keep it tight.
  </text>
</svg>
