<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" color="currentColor" role="img" aria-labelledby="pbc-title pbc-desc" style="max-width:100%;height:auto">
<title id="pbc-title">Polygon count budget chart</title>
<desc id="pbc-desc">A logarithmic bar chart of typical character polygon budgets across mobile, game console, film and VFX, and sculpting targets.</desc>
<style>
.pbc-axis{fill:none;stroke:currentColor;stroke-width:1.5}
.pbc-grid{fill:none;stroke:currentColor;stroke-width:1;opacity:.25;stroke-dasharray:3 4}
.pbc-t{fill:currentColor;font-family:system-ui,Arial,sans-serif}
.pbc-h{font-size:17px;font-weight:700}.pbc-b{font-size:12px}.pbc-s2{font-size:10.5px;opacity:.8}
.pbc-val{font-size:12px;font-weight:700;fill:currentColor}
.b1{fill:#4CAF50}.b2{fill:#3a8ee6}.b3{fill:#e8833a}.b4{fill:#9b6dd6}
</style>
<text x="40" y="34" class="pbc-t pbc-h">Character polygon budgets (tris)</text>
<text x="40" y="54" class="pbc-t pbc-s2">log scale &#183; ranges are typical per-character targets, not hard limits</text>
<!-- plot area: x 150..690, y 80..320 ; log10 from 1e3 to 1e7 -->
<!-- gridlines at 1e3,1e4,1e5,1e6,1e7 -->
<g class="pbc-grid">
<path d="M150 80 V320"/><path d="M285 80 V320"/><path d="M420 80 V320"/><path d="M555 80 V320"/><path d="M690 80 V320"/>
</g>
<g class="pbc-t pbc-s2" text-anchor="middle">
<text x="150" y="338">1K</text><text x="285" y="338">10K</text><text x="420" y="338">100K</text><text x="555" y="338">1M</text><text x="690" y="338">10M</text>
</g>
<path d="M150 80 V320" class="pbc-axis"/>
<!-- bars: each row label left, bar spans min..max in log space.
log map: x = 150 + (log10(v)-3)*135 -->
<!-- Mobile / VR: 3k..15k -> log10 3.477..4.176 -> x 214..309 -->
<text x="40" y="116" class="pbc-t pbc-b">Mobile / VR</text>
<rect x="214" y="100" width="95" height="22" rx="4" class="b1"/>
<text x="319" y="116" class="pbc-val">3K&#8211;15K</text>
<!-- Game console: 30k..100k -> log10 4.477..5 -> x 349..420 -->
<text x="40" y="160" class="pbc-t pbc-b">Game / console</text>
<rect x="349" y="144" width="71" height="22" rx="4" class="b2"/>
<text x="430" y="160" class="pbc-val">30K&#8211;100K</text>
<!-- Film / VFX (render mesh): 200k..2M -> log10 5.301..6.301 -> x 461..596 -->
<text x="40" y="204" class="pbc-t pbc-b">Film / VFX</text>
<rect x="461" y="188" width="135" height="22" rx="4" class="b3"/>
<text x="455" y="204" class="pbc-val" text-anchor="end">200K&#8211;2M</text>
<!-- Sculpt / source: 2M..20M -> log10 6.301..7.301 clamp 7 -> x 596..690 -->
<text x="40" y="248" class="pbc-t pbc-b">Sculpt source</text>
<rect x="596" y="232" width="94" height="22" rx="4" class="b4"/>
<text x="591" y="248" class="pbc-val" text-anchor="end">2M&#8211;20M+</text>
<!-- baseline -->
<path d="M150 320 H690" class="pbc-axis"/>
<!-- notes -->
<text x="40" y="370" class="pbc-t pbc-s2">&#183; Game/real-time meshes are the modeling target; sculpt source is retopologized down to it.</text>
<text x="40" y="388" class="pbc-t pbc-s2">&#183; Budgets scale with screen importance: hero close-ups get more, background crowd far less (see LOD).</text>
</svg>
