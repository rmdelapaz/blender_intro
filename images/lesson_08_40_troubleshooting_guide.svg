<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="tg-title tg-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="tg-title">Modifier troubleshooting guide</title>
  <desc id="tg-desc">A troubleshooting reference table for common modifier problems and their fixes. Five rows pair a problem with a solution: a gap at the mirror seam is fixed by enabling Clipping; a bevel that is invisible is fixed by increasing the amount or applying scale; overlapping array copies are fixed by increasing the offset; a subdivision surface that looks bloated is fixed by adding supporting loops or creases; and a modifier that has no visible effect is fixed by enabling its viewport visibility toggle. Each problem is marked in red and each solution in green.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Modifier Troubleshooting: Common Fixes</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Most modifier surprises come from five small settings · here is the fix for each</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Column headers -->
  <text x="74" y="132" font-size="13" font-weight="700" fill="#E63946">PROBLEM</text>
  <text x="446" y="132" font-size="13" font-weight="700" fill="#4ADE80">FIX</text>
  <line x1="424" y1="146" x2="424" y2="636" stroke="currentColor" stroke-width="1" opacity="0.12"/>

  <!-- ===== ROW 1 : Mirror seam gap ===== -->
  <g>
    <circle cx="64" cy="170" r="9" fill="#E63946"/>
    <text x="64" y="175" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">!</text>
    <text x="84" y="167" font-size="14" font-weight="700" fill="currentColor">Gap at the mirror seam</text>
    <text x="84" y="187" font-size="12.5" fill="currentColor" opacity="0.75">The two halves do not meet at the center line.</text>

    <circle cx="448" cy="170" r="9" fill="#4ADE80"/>
    <path d="M444,170 l3,4 l6,-8" stroke="#0f1a14" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="468" y="167" font-size="14" font-weight="700" fill="currentColor">Enable <tspan fill="#4ADE80">Clipping</tspan></text>
    <text x="468" y="187" font-size="12.5" fill="currentColor" opacity="0.75">Locks center verts to the mirror plane · seam closes.</text>
  </g>
  <line x1="40" y1="206" x2="760" y2="206" stroke="currentColor" stroke-width="1" opacity="0.10"/>

  <!-- ===== ROW 2 : Invisible bevel ===== -->
  <g>
    <circle cx="64" cy="240" r="9" fill="#E63946"/>
    <text x="64" y="245" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">!</text>
    <text x="84" y="237" font-size="14" font-weight="700" fill="currentColor">Bevel does nothing</text>
    <text x="84" y="257" font-size="12.5" fill="currentColor" opacity="0.75">Edges stay razor sharp no matter the amount.</text>

    <circle cx="448" cy="240" r="9" fill="#4ADE80"/>
    <path d="M444,240 l3,4 l6,-8" stroke="#0f1a14" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="468" y="237" font-size="14" font-weight="700" fill="currentColor">Raise Amount · <tspan fill="#4ADE80">apply scale</tspan></text>
    <text x="468" y="257" font-size="12.5" fill="currentColor" opacity="0.75">Ctrl+A &gt; Scale · unapplied scale shrinks the bevel.</text>
  </g>
  <line x1="40" y1="276" x2="760" y2="276" stroke="currentColor" stroke-width="1" opacity="0.10"/>

  <!-- ===== ROW 3 : Array overlap ===== -->
  <g>
    <circle cx="64" cy="310" r="9" fill="#E63946"/>
    <text x="64" y="315" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">!</text>
    <text x="84" y="307" font-size="14" font-weight="700" fill="currentColor">Array copies overlap</text>
    <text x="84" y="327" font-size="12.5" fill="currentColor" opacity="0.75">Copies pile into each other instead of spacing out.</text>

    <circle cx="448" cy="310" r="9" fill="#4ADE80"/>
    <path d="M444,310 l3,4 l6,-8" stroke="#0f1a14" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="468" y="307" font-size="14" font-weight="700" fill="currentColor">Increase <tspan fill="#4ADE80">Relative Offset</tspan></text>
    <text x="468" y="327" font-size="12.5" fill="currentColor" opacity="0.75">Offset 1.0 = one width · go above 1.0 for a gap.</text>
  </g>
  <line x1="40" y1="346" x2="760" y2="346" stroke="currentColor" stroke-width="1" opacity="0.10"/>

  <!-- ===== ROW 4 : Subdivision too smooth ===== -->
  <g>
    <circle cx="64" cy="380" r="9" fill="#E63946"/>
    <text x="64" y="385" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">!</text>
    <text x="84" y="377" font-size="14" font-weight="700" fill="currentColor">Subdivision looks bloated</text>
    <text x="84" y="397" font-size="12.5" fill="currentColor" opacity="0.75">The whole shape balloons into a soft blob.</text>

    <circle cx="448" cy="380" r="9" fill="#4ADE80"/>
    <path d="M444,380 l3,4 l6,-8" stroke="#0f1a14" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="468" y="377" font-size="14" font-weight="700" fill="currentColor">Add <tspan fill="#4ADE80">supporting loops</tspan></text>
    <text x="468" y="397" font-size="12.5" fill="currentColor" opacity="0.75">Loop cuts or Edge Crease (Shift+E) sharpen edges.</text>
  </g>
  <line x1="40" y1="416" x2="760" y2="416" stroke="currentColor" stroke-width="1" opacity="0.10"/>

  <!-- ===== ROW 5 : Modifier not visible ===== -->
  <g>
    <circle cx="64" cy="450" r="9" fill="#E63946"/>
    <text x="64" y="455" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">!</text>
    <text x="84" y="447" font-size="14" font-weight="700" fill="currentColor">Modifier has no effect</text>
    <text x="84" y="467" font-size="12.5" fill="currentColor" opacity="0.75">Settings change but the object never updates.</text>

    <circle cx="448" cy="450" r="9" fill="#4ADE80"/>
    <path d="M444,450 l3,4 l6,-8" stroke="#0f1a14" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="468" y="447" font-size="14" font-weight="700" fill="currentColor">Turn on the <tspan fill="#4ADE80">viewport toggle</tspan></text>
    <text x="468" y="467" font-size="12.5" fill="currentColor" opacity="0.75">The monitor icon in the panel header must be on.</text>
  </g>
  <line x1="40" y1="486" x2="760" y2="486" stroke="currentColor" stroke-width="1" opacity="0.10"/>

  <!-- Golden-rule reminder panel -->
  <text x="40" y="522" font-size="18" font-weight="600" fill="currentColor">When in doubt</text>
  <rect x="40" y="538" width="720" height="92" rx="10" fill="#4A9EFF" fill-opacity="0.07"/>
  <rect x="40" y="538" width="4" height="92" fill="#4A9EFF"/>
  <text x="64" y="566" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#4A9EFF">Check the order first.</tspan> Many "broken" results are just modifiers in the wrong order ·</text>
  <text x="64" y="586" font-size="13" fill="currentColor">Blender evaluates the stack bottom to top, so a deform before a generate reads differently.</text>
  <text x="64" y="610" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#4A9EFF">Still stuck?</tspan> Toggle the modifier off and on to confirm it is the cause, then change one</text>
  <text x="64" y="626" font-size="13" fill="currentColor">setting at a time · changing several at once hides which one fixed it.</text>

  <!-- Footer tip (Variant B, left rail) -->
  <rect x="40" y="641" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Keep the stack live while debugging · an applied modifier cannot be toggled to test it.</text>
</svg>
