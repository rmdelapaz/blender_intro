<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="rvp-title rvp-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="rvp-title">Ray tracing versus path tracing</title>
  <desc id="rvp-desc">Two side by side panels compare the two methods. On the left, ray tracing fires a single ray per pixel that makes one direct check to the light, labelled fast but approximate. On the right, path tracing fires many sample rays per pixel that bounce multiple times through the scene before reaching the light, labelled slow but accurate.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Ray Tracing vs Path Tracing</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">One direct ray per pixel versus many bouncing sampled paths per pixel</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ===== LEFT PANEL: RAY TRACING ===== -->
  <text x="200" y="140" text-anchor="middle" font-size="18" font-weight="600" fill="currentColor">Ray Tracing</text>
  <text x="200" y="160" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.6">One ray per pixel, direct check</text>

  <!-- panel divider -->
  <line x1="400" y1="128" x2="400" y2="470" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Light source (left) -->
  <circle cx="320" cy="210" r="16" fill="#F5C242"/>
  <text x="320" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1a14">L</text>
  <text x="320" y="245" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.65">Light</text>

  <!-- Camera (left) -->
  <rect x="56" y="300" width="44" height="34" rx="4" fill="#FF6B00"/>
  <polygon points="100,308 118,300 118,334 100,326" fill="#FF6B00"/>
  <text x="78" y="356" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.65">Camera</text>

  <!-- Surface hit point (left) -->
  <rect x="250" y="360" width="90" height="16" rx="3" fill="#4ADE80" opacity="0.55"/>
  <circle cx="295" cy="360" r="5" fill="#FF6B00"/>

  <!-- Single ray: camera -> surface -->
  <line x1="118" y1="316" x2="295" y2="360" stroke="#4A9EFF" stroke-width="3" stroke-linecap="round"/>
  <!-- Single direct shadow ray: surface -> light -->
  <line x1="295" y1="360" x2="320" y2="226" stroke="#4A9EFF" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 5"/>
  <text x="150" y="408" font-size="12" fill="currentColor" opacity="0.7">1 ray + 1 direct light check</text>

  <!-- Left verdict pill -->
  <rect x="60" y="430" width="280" height="30" rx="6" fill="#4A9EFF" fill-opacity="0.12" stroke="#4A9EFF" stroke-opacity="0.45"/>
  <text x="200" y="450" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Fast · approximate · misses indirect light</text>

  <!-- ===== RIGHT PANEL: PATH TRACING ===== -->
  <text x="600" y="140" text-anchor="middle" font-size="18" font-weight="600" fill="currentColor">Path Tracing</text>
  <text x="600" y="160" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.6">Many sampled rays, multiple bounces</text>

  <!-- Light source (right) -->
  <circle cx="720" cy="210" r="16" fill="#F5C242"/>
  <text x="720" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1a14">L</text>
  <text x="720" y="245" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.65">Light</text>

  <!-- Camera (right) -->
  <rect x="456" y="300" width="44" height="34" rx="4" fill="#FF6B00"/>
  <polygon points="500,308 518,300 518,334 500,326" fill="#FF6B00"/>
  <text x="478" y="356" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.65">Camera</text>

  <!-- Surfaces (right): two bounce surfaces -->
  <rect x="560" y="380" width="80" height="14" rx="3" fill="#4ADE80" opacity="0.55"/>
  <rect x="650" y="300" width="14" height="70" rx="3" fill="#B47EE8" opacity="0.55"/>

  <!-- Faint extra sample rays (the many-samples idea) -->
  <line x1="518" y1="318" x2="600" y2="384" stroke="#4A9EFF" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
  <line x1="518" y1="318" x2="640" y2="392" stroke="#4A9EFF" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
  <line x1="518" y1="318" x2="585" y2="380" stroke="#4A9EFF" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>

  <!-- Bold sampled path: camera -> surface1 -> surface2 -> light -->
  <line x1="518" y1="318" x2="600" y2="386" stroke="#4A9EFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="600" y1="386" x2="657" y2="336" stroke="#4A9EFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="657" y1="336" x2="720" y2="226" stroke="#4A9EFF" stroke-width="3" stroke-linecap="round"/>

  <!-- Bounce badges -->
  <circle cx="600" cy="386" r="11" fill="#FF6B00"/>
  <text x="600" y="390" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text>
  <circle cx="657" cy="336" r="11" fill="#FF6B00"/>
  <text x="657" y="340" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text>

  <text x="600" y="430" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.7">Many rays, bounce 1, bounce 2, then light</text>

  <!-- Right verdict pill -->
  <rect x="460" y="442" width="280" height="30" rx="6" fill="#4ADE80" fill-opacity="0.14" stroke="#4ADE80" stroke-opacity="0.5"/>
  <text x="600" y="462" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Slow · accurate · captures indirect light</text>

  <!-- Footer tip -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Cycles is a path tracer: it trades render time for physically accurate global illumination.</text>
</svg>
