<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="ewm-title ewm-desc" color="#222" font-family="'Segoe UI',system-ui,sans-serif">
<title id="ewm-title">Edge wear mask node flowchart</title>
<desc id="ewm-desc">Node flow for an edge wear mask: the Geometry node Pointiness output feeds a tight ColorRamp to isolate edges, which is multiplied by a Noise texture to add variation, producing a final edge wear mask.</desc>
<defs>
<marker id="ewm-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#FF6B00"/>
</marker>
<linearGradient id="ewm-ramp" x1="0" y1="0" x2="1" y2="0">
<stop offset="0.48" stop-color="#111"/><stop offset="0.52" stop-color="#eee"/>
</linearGradient>
<radialGradient id="ewm-noise" cx="0.4" cy="0.4" r="0.7">
<stop offset="0" stop-color="#ccc"/><stop offset="0.5" stop-color="#777"/><stop offset="1" stop-color="#333"/>
</radialGradient>
</defs>

<text x="400" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="currentColor">Building an Edge Wear Mask</text>
<text x="400" y="56" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.75">Pointiness finds convex edges &#183; ColorRamp sharpens &#183; Noise breaks it up</text>

<!-- Step 1: Geometry -->
<g transform="translate(30,120)">
<rect x="0" y="0" width="150" height="80" rx="8" fill="currentColor" fill-opacity="0.06" stroke="#4A9EFF" stroke-width="2"/>
<rect x="0" y="0" width="150" height="20" rx="8" fill="#4A9EFF" fill-opacity="0.85"/>
<rect x="0" y="10" width="150" height="10" fill="#4A9EFF" fill-opacity="0.85"/>
<text x="10" y="15" font-size="11" font-weight="700" fill="#fff">Geometry</text>
<text x="12" y="42" font-size="11" fill="currentColor" opacity="0.9">Pointiness &#9679;</text>
<text x="12" y="62" font-size="9.5" fill="currentColor" opacity="0.6">convex edges = bright</text>
<text x="75" y="98" text-anchor="middle" font-size="10" font-weight="700" fill="currentColor" opacity="0.7">1 &#183; Get edges</text>
</g>
<line x1="182" y1="160" x2="222" y2="160" stroke="#FF6B00" stroke-width="2" marker-end="url(#ewm-arrow)"/>

<!-- Step 2: ColorRamp -->
<g transform="translate(224,120)">
<rect x="0" y="0" width="150" height="80" rx="8" fill="currentColor" fill-opacity="0.06" stroke="#F5C242" stroke-width="2"/>
<rect x="0" y="0" width="150" height="20" rx="8" fill="#F5C242" fill-opacity="0.9"/>
<rect x="0" y="10" width="150" height="10" fill="#F5C242" fill-opacity="0.9"/>
<text x="10" y="15" font-size="11" font-weight="700" fill="#222">ColorRamp</text>
<rect x="14" y="34" width="122" height="16" rx="2" fill="url(#ewm-ramp)" stroke="currentColor" stroke-opacity="0.4"/>
<text x="75" y="64" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.7">tight 0.50 &#8594; 0.52</text>
<text x="75" y="98" text-anchor="middle" font-size="10" font-weight="700" fill="currentColor" opacity="0.7">2 &#183; Isolate</text>
</g>
<line x1="376" y1="160" x2="416" y2="160" stroke="#FF6B00" stroke-width="2" marker-end="url(#ewm-arrow)"/>

<!-- Step 3: Multiply -->
<g transform="translate(418,120)">
<rect x="0" y="0" width="150" height="80" rx="8" fill="currentColor" fill-opacity="0.06" stroke="#B47EE8" stroke-width="2"/>
<rect x="0" y="0" width="150" height="20" rx="8" fill="#B47EE8" fill-opacity="0.9"/>
<rect x="0" y="10" width="150" height="10" fill="#B47EE8" fill-opacity="0.9"/>
<text x="10" y="15" font-size="11" font-weight="700" fill="#fff">Mix (Multiply)</text>
<text x="75" y="50" text-anchor="middle" font-size="26" font-weight="700" fill="#B47EE8">&#215;</text>
<text x="75" y="68" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.7">edges AND noise</text>
<text x="75" y="98" text-anchor="middle" font-size="10" font-weight="700" fill="currentColor" opacity="0.7">3 &#183; Combine</text>
</g>
<line x1="570" y1="160" x2="610" y2="160" stroke="#FF6B00" stroke-width="2" marker-end="url(#ewm-arrow)"/>

<!-- Final mask -->
<g transform="translate(612,116)">
<rect x="0" y="0" width="158" height="88" rx="8" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-width="2"/>
<text x="79" y="22" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FF6B00">Edge Wear Mask</text>
<rect x="30" y="30" width="98" height="40" rx="4" fill="#222"/>
<path d="M34 66 Q79 34 124 66" fill="none" stroke="#eee" stroke-width="3"/>
<path d="M34 60 L58 40 M124 60 L100 40" stroke="#eee" stroke-width="2"/>
<text x="79" y="84" text-anchor="middle" font-size="9" fill="currentColor" opacity="0.7">white on worn edges</text>
</g>

<!-- Noise feeding multiply from below -->
<g transform="translate(418,300)">
<rect x="0" y="0" width="150" height="80" rx="8" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.5"/>
<rect x="0" y="0" width="150" height="20" rx="8" fill="currentColor" fill-opacity="0.25"/>
<rect x="0" y="10" width="150" height="10" fill="currentColor" fill-opacity="0.25"/>
<text x="10" y="15" font-size="11" font-weight="700" fill="currentColor">Noise Texture</text>
<rect x="14" y="30" width="60" height="40" rx="3" fill="url(#ewm-noise)"/>
<text x="130" y="46" text-anchor="end" font-size="9.5" fill="currentColor" opacity="0.7">random</text>
<text x="130" y="60" text-anchor="end" font-size="9.5" fill="currentColor" opacity="0.7">variation</text>
</g>
<line x1="493" y1="298" x2="493" y2="204" stroke="#FF6B00" stroke-width="2" marker-end="url(#ewm-arrow)"/>
<text x="500" y="250" font-size="10" fill="currentColor" opacity="0.65">2nd input</text>

<!-- footer tip -->
<g transform="translate(60,420)">
<rect x="0" y="0" width="680" height="96" rx="10" fill="#4ADE80" fill-opacity="0.08" stroke="#4ADE80" stroke-opacity="0.45"/>
<text x="340" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#4ADE80">Why multiply, not add?</text>
<text x="340" y="54" text-anchor="middle" font-size="11.5" fill="currentColor" opacity="0.85">Multiply keeps wear only where the edge mask AND the noise are both bright,</text>
<text x="340" y="72" text-anchor="middle" font-size="11.5" fill="currentColor" opacity="0.85">so worn spots stay on edges but look irregular instead of a perfect outline.</text>
</g>
</svg>
