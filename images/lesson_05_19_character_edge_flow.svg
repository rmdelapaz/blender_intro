<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 800 560"
     color="#222"
     role="img"
     aria-labelledby="cf-title cf-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="cf-title">Character Edge Flow</title>
  <desc id="cf-desc">A stylized front-facing character head showing how mesh edge loops follow the major muscle and expression zones of the face. Concentric loops surround the eyes, paired loops trace the mouth, and diagonal loops carry deformation from cheek to jaw. Three labeled cards on the left, right, and bottom call out each loop region.</desc>

  <!-- Top accent rail -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Header band -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Character Edge Flow</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Loops follow facial muscle and expression zones</text>
  <line x1="120" y1="108" x2="680" y2="108" stroke="currentColor" stroke-opacity="0.25"/>
  <text x="400" y="138" font-size="15" font-weight="700" fill="#FF6B00" text-anchor="middle" letter-spacing="2">EYES · MOUTH · CHEEKS</text>

  <!-- Head silhouette -->
  <ellipse cx="400" cy="300" rx="125" ry="140" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="2"/>

  <!-- Forehead arc loop -->
  <path d="M 322 218 Q 400 198 478 218" fill="none" stroke="#FF6B00" stroke-opacity="0.75" stroke-width="2"/>

  <!-- Right eye (subject right / viewer left), concentric loops -->
  <g>
    <ellipse cx="360" cy="255" rx="22" ry="12" fill="none" stroke="#FF6B00" stroke-opacity="0.75" stroke-width="2"/>
    <ellipse cx="360" cy="255" rx="16" ry="8" fill="none" stroke="#FF6B00" stroke-opacity="0.75" stroke-width="2"/>
    <ellipse cx="360" cy="255" rx="10" ry="5" fill="none" stroke="#FF6B00" stroke-opacity="0.75" stroke-width="2"/>
  </g>

  <!-- Left eye (subject left / viewer right), concentric loops -->
  <g>
    <ellipse cx="440" cy="255" rx="22" ry="12" fill="none" stroke="#FF6B00" stroke-opacity="0.75" stroke-width="2"/>
    <ellipse cx="440" cy="255" rx="16" ry="8" fill="none" stroke="#FF6B00" stroke-opacity="0.75" stroke-width="2"/>
    <ellipse cx="440" cy="255" rx="10" ry="5" fill="none" stroke="#FF6B00" stroke-opacity="0.75" stroke-width="2"/>
  </g>

  <!-- Mouth loops -->
  <g>
    <ellipse cx="400" cy="370" rx="35" ry="15" fill="none" stroke="#FF6B00" stroke-opacity="0.75" stroke-width="2"/>
    <ellipse cx="400" cy="370" rx="22" ry="9" fill="none" stroke="#FF6B00" stroke-opacity="0.75" stroke-width="2"/>
  </g>

  <!-- Right cheek flow (viewer left) -->
  <path d="M 338 285 C 320 335 320 385 340 425" fill="none" stroke="#FF6B00" stroke-opacity="0.75" stroke-width="2"/>
  <!-- Left cheek flow (viewer right) -->
  <path d="M 462 285 C 480 335 480 385 460 425" fill="none" stroke="#FF6B00" stroke-opacity="0.75" stroke-width="2"/>

  <!-- LEFT annotation card: EYE LOOPS -->
  <g>
    <rect x="40" y="200" width="180" height="70" rx="6" fill="currentColor" fill-opacity="0.04" stroke="#FF6B00" stroke-opacity="0.5"/>
    <text x="54" y="222" font-size="13" font-weight="700" fill="#FF6B00">EYE LOOPS</text>
    <text x="54" y="244" font-size="11" fill="currentColor" opacity="0.75">Concentric rings let the eye</text>
    <text x="54" y="258" font-size="11" fill="currentColor" opacity="0.75">open and close cleanly.</text>
  </g>
  <!-- Dashed connector from LEFT card to right eye (subject right) -->
  <path d="M 220 235 Q 280 240 338 255" fill="none" stroke="currentColor" stroke-opacity="0.30" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- RIGHT annotation card: MOUTH LOOPS -->
  <g>
    <rect x="580" y="200" width="180" height="70" rx="6" fill="currentColor" fill-opacity="0.04" stroke="#FF6B00" stroke-opacity="0.5"/>
    <text x="594" y="222" font-size="13" font-weight="700" fill="#FF6B00">MOUTH LOOPS</text>
    <text x="594" y="244" font-size="11" fill="currentColor" opacity="0.75">Loops around the mouth</text>
    <text x="594" y="258" font-size="11" fill="currentColor" opacity="0.75">shape every facial expression.</text>
  </g>
  <!-- Dashed connector from RIGHT card to mouth (right edge) -->
  <path d="M 580 258 Q 510 320 435 370" fill="none" stroke="currentColor" stroke-opacity="0.30" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- BOTTOM annotation card: CHEEK FLOW -->
  <g>
    <rect x="310" y="460" width="180" height="70" rx="6" fill="currentColor" fill-opacity="0.04" stroke="#FF6B00" stroke-opacity="0.5"/>
    <text x="324" y="482" font-size="13" font-weight="700" fill="#FF6B00">CHEEK FLOW</text>
    <text x="324" y="504" font-size="11" fill="currentColor" opacity="0.75">Diagonal loops carry</text>
    <text x="324" y="518" font-size="11" fill="currentColor" opacity="0.75">deformation into the jaw.</text>
  </g>
  <!-- Dashed connector from BOTTOM card to right cheek (lower bend) -->
  <path d="M 400 460 Q 380 442 345 422" fill="none" stroke="currentColor" stroke-opacity="0.30" stroke-width="1" stroke-dasharray="4 3"/>
</svg>
