<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" role="img" aria-labelledby="ccs-title ccs-desc" color="#222" font-family="'Segoe UI',system-ui,sans-serif">
<title id="ccs-title">Professional color correction node stack</title>
<desc id="ccs-desc">A vertical schematic of a color-correction node chain: Render Layers feeds RGB Curves for exposure and contrast, then Hue/Saturation/Value for saturation, then Color Balance for the creative grade, then Composite. The order matters: fix technical problems first, then apply the creative look.</desc>
<rect x="0" y="0" width="800" height="620" fill="none"/>
<text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="currentColor">Color Correction Stack</text>
<text x="400" y="58" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.75">Fix technical problems first, then apply the creative look</text>

<!-- left: node chain; right: annotations -->
<!-- node helper: rounded rect w/ header stripe -->

<!-- 1 Render Layers -->
<g>
  <rect x="120" y="82" width="220" height="60" rx="8" fill="#2a2a2a" stroke="#4ADE80" stroke-width="2"/>
  <rect x="120" y="82" width="220" height="22" rx="8" fill="#4ADE80"/>
  <rect x="120" y="94" width="220" height="10" fill="#4ADE80"/>
  <text x="230" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">INPUT</text>
  <text x="230" y="128" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor">Render Layers</text>
  <circle cx="340" cy="126" r="5" fill="#F5C242"/>
</g>
<!-- wire -->
<path d="M230 142 L230 168" stroke="#FF6B00" stroke-width="2.5" fill="none"/>
<polygon points="230,172 225,162 235,162" fill="#FF6B00"/>

<!-- 2 RGB Curves -->
<g>
  <rect x="120" y="174" width="220" height="60" rx="8" fill="#2a2a2a" stroke="#FF6B00" stroke-width="2"/>
  <rect x="120" y="174" width="220" height="22" rx="8" fill="#FF6B00"/>
  <rect x="120" y="186" width="220" height="10" fill="#FF6B00"/>
  <text x="230" y="190" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">FIX 1</text>
  <text x="230" y="220" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor">RGB Curves</text>
  <circle cx="120" cy="218" r="5" fill="#F5C242"/><circle cx="340" cy="218" r="5" fill="#F5C242"/>
</g>
<path d="M230 234 L230 260" stroke="#FF6B00" stroke-width="2.5" fill="none"/>
<polygon points="230,264 225,254 235,254" fill="#FF6B00"/>

<!-- 3 Hue Sat -->
<g>
  <rect x="120" y="266" width="220" height="60" rx="8" fill="#2a2a2a" stroke="#FF6B00" stroke-width="2"/>
  <rect x="120" y="266" width="220" height="22" rx="8" fill="#FF6B00"/>
  <rect x="120" y="278" width="220" height="10" fill="#FF6B00"/>
  <text x="230" y="282" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">FIX 2</text>
  <text x="230" y="312" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor">Hue / Saturation / Value</text>
  <circle cx="120" cy="310" r="5" fill="#F5C242"/><circle cx="340" cy="310" r="5" fill="#F5C242"/>
</g>
<path d="M230 326 L230 352" stroke="#FF6B00" stroke-width="2.5" fill="none"/>
<polygon points="230,356 225,346 235,346" fill="#FF6B00"/>

<!-- 4 Color Balance -->
<g>
  <rect x="120" y="358" width="220" height="60" rx="8" fill="#2a2a2a" stroke="#B47EE8" stroke-width="2"/>
  <rect x="120" y="358" width="220" height="22" rx="8" fill="#B47EE8"/>
  <rect x="120" y="370" width="220" height="10" fill="#B47EE8"/>
  <text x="230" y="374" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">GRADE</text>
  <text x="230" y="404" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor">Color Balance</text>
  <circle cx="120" cy="402" r="5" fill="#F5C242"/><circle cx="340" cy="402" r="5" fill="#F5C242"/>
</g>
<path d="M230 418 L230 444" stroke="#FF6B00" stroke-width="2.5" fill="none"/>
<polygon points="230,448 225,438 235,438" fill="#FF6B00"/>

<!-- 5 Composite -->
<g>
  <rect x="120" y="450" width="220" height="60" rx="8" fill="#2a2a2a" stroke="#4ADE80" stroke-width="2"/>
  <rect x="120" y="450" width="220" height="22" rx="8" fill="#4ADE80"/>
  <rect x="120" y="462" width="220" height="10" fill="#4ADE80"/>
  <text x="230" y="466" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">OUTPUT</text>
  <text x="230" y="496" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor">Composite</text>
  <circle cx="120" cy="494" r="5" fill="#F5C242"/>
</g>

<!-- right-side annotations -->
<g font-size="12.5">
  <path d="M344 204 L400 204" stroke="currentColor" stroke-width="1" opacity="0.4" stroke-dasharray="3 3"/>
  <text x="410" y="199" font-weight="700" fill="#FF6B00">Exposure &#38; contrast</text>
  <text x="410" y="217" fill="currentColor" opacity="0.85">Lift shadows, set white point,</text>
  <text x="410" y="233" fill="currentColor" opacity="0.85">correct a flat or dark render.</text>

  <path d="M344 296 L400 296" stroke="currentColor" stroke-width="1" opacity="0.4" stroke-dasharray="3 3"/>
  <text x="410" y="291" font-weight="700" fill="#FF6B00">Saturation</text>
  <text x="410" y="309" fill="currentColor" opacity="0.85">Tame or boost color intensity</text>
  <text x="410" y="325" fill="currentColor" opacity="0.85">once brightness is neutral.</text>

  <path d="M344 388 L400 388" stroke="currentColor" stroke-width="1" opacity="0.4" stroke-dasharray="3 3"/>
  <text x="410" y="383" font-weight="700" fill="#B47EE8">The creative look</text>
  <text x="410" y="401" fill="currentColor" opacity="0.85">Warm highlights, cool shadows,</text>
  <text x="410" y="417" fill="currentColor" opacity="0.85">teal-and-orange, mood tint.</text>
</g>

<!-- why order matters callout -->
<g>
  <rect x="120" y="536" width="560" height="66" rx="10" fill="none" stroke="#F5C242" stroke-width="2"/>
  <circle cx="148" cy="569" r="12" fill="#F5C242"/>
  <text x="148" y="574" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">!</text>
  <text x="176" y="562" font-size="13" font-weight="700" fill="currentColor">Why the order matters</text>
  <text x="176" y="583" font-size="12" fill="currentColor" opacity="0.88">Grade a broken image and you grade the problem too. Neutralize exposure and</text>
  <text x="176" y="598" font-size="12" fill="currentColor" opacity="0.88">saturation first, so the creative Color Balance sits on a clean, predictable base.</text>
</g>
</svg>
