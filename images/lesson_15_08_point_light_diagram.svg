<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="pt-title pt-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="pt-title">Point light omnidirectional emission</title>
  <desc id="pt-desc">A central point light source emitting light rays equally in all directions, surrounded by concentric falloff rings that fade with distance, illustrating spherical light distribution from a single point.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">POINT LIGHT</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Emits light equally in all directions from a single point</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Falloff rings (fade outward) -->
  <g fill="none" stroke="#FF6B00">
    <circle cx="400" cy="318" r="195" stroke-opacity="0.10"/>
    <circle cx="400" cy="318" r="155" stroke-opacity="0.16"/>
    <circle cx="400" cy="318" r="110" stroke-opacity="0.24"/>
  </g>

  <!-- Radiating rays (omnidirectional) -->
  <g stroke="#FF6B00" stroke-width="2.5" stroke-linecap="round" fill="#FF6B00" opacity="0.92">
    <line x1="400.0" y1="272.0" x2="400.0" y2="168.0"/>
    <polygon points="400.0,168.0 404.5,175.8 395.5,175.8"/>
    <line x1="417.6" y1="275.5" x2="457.4" y2="179.4"/>
    <polygon points="457.4,179.4 458.6,188.3 450.3,184.9"/>
    <line x1="432.5" y1="285.5" x2="506.1" y2="211.9"/>
    <polygon points="506.1,211.9 503.7,220.6 497.4,214.3"/>
    <line x1="442.5" y1="300.4" x2="538.6" y2="260.6"/>
    <polygon points="538.6,260.6 533.1,267.7 529.7,259.4"/>
    <line x1="446.0" y1="318.0" x2="550.0" y2="318.0"/>
    <polygon points="550.0,318.0 542.2,322.5 542.2,313.5"/>
    <line x1="442.5" y1="335.6" x2="538.6" y2="375.4"/>
    <polygon points="538.6,375.4 529.7,376.6 533.1,368.3"/>
    <line x1="432.5" y1="350.5" x2="506.1" y2="424.1"/>
    <polygon points="506.1,424.1 497.4,421.7 503.7,415.4"/>
    <line x1="417.6" y1="360.5" x2="457.4" y2="456.6"/>
    <polygon points="457.4,456.6 450.3,451.1 458.6,447.7"/>
    <line x1="400.0" y1="364.0" x2="400.0" y2="468.0"/>
    <polygon points="400.0,468.0 395.5,460.2 404.5,460.2"/>
    <line x1="382.4" y1="360.5" x2="342.6" y2="456.6"/>
    <polygon points="342.6,456.6 341.4,447.7 349.7,451.1"/>
    <line x1="367.5" y1="350.5" x2="293.9" y2="424.1"/>
    <polygon points="293.9,424.1 296.3,415.4 302.6,421.7"/>
    <line x1="357.5" y1="335.6" x2="261.4" y2="375.4"/>
    <polygon points="261.4,375.4 266.9,368.3 270.3,376.6"/>
    <line x1="354.0" y1="318.0" x2="250.0" y2="318.0"/>
    <polygon points="250.0,318.0 257.8,313.5 257.8,322.5"/>
    <line x1="357.5" y1="300.4" x2="261.4" y2="260.6"/>
    <polygon points="261.4,260.6 270.3,259.4 266.9,267.7"/>
    <line x1="367.5" y1="285.5" x2="293.9" y2="211.9"/>
    <polygon points="293.9,211.9 302.6,214.3 296.3,220.6"/>
    <line x1="382.4" y1="275.5" x2="342.6" y2="179.4"/>
    <polygon points="342.6,179.4 349.7,184.9 341.4,188.3"/>
  </g>

  <!-- Central point-light glow + source -->
  <circle cx="400" cy="318" r="38" fill="#FF6B00" opacity="0.14"/>
  <circle cx="400" cy="318" r="24" fill="#FF6B00" opacity="0.30"/>
  <circle cx="400" cy="318" r="12" fill="#FF6B00"/>

  <!-- Annotation under the diagram -->
  <text x="400" y="470" text-anchor="middle" font-size="14" fill="currentColor" opacity="0.6">Intensity falls off with distance, but direction is uniform everywhere.</text>

  <!-- Footer tip (Variant B, left rail) -->
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Great for bare bulbs, candles, and small omnidirectional sources; raise Radius for softer shadows.</text>
</svg>