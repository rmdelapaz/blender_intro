<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="btc-title btc-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="btc-title">Three types of light bounce: diffuse, glossy, and transmission</title>
  <desc id="btc-desc">Three side-by-side panels each show one incoming ray striking a surface. Diffuse scatters many rays in random directions. Glossy reflects one clean ray at a mirrored angle. Transmission passes the ray through a transparent material, bending it as it enters and exits.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">How Rays Bounce: Three Surface Types</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Diffuse · Glossy · Transmission · the bounce type depends on the material</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ============ Panel 1: Diffuse ============ -->
  <g>
    <text x="160" y="150" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor">Diffuse</text>
    <text x="160" y="170" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.6">Matte surface</text>

    <!-- surface bar -->
    <rect x="50" y="360" width="220" height="14" rx="2" fill="#4ADE80" opacity="0.35"/>
    <line x1="50" y1="360" x2="270" y2="360" stroke="#4ADE80" stroke-width="2"/>
    <!-- hit point -->
    <circle cx="160" cy="360" r="5" fill="#FF6B00"/>
    <!-- incoming ray -->
    <line x1="70" y1="200" x2="160" y2="360" stroke="#4A9EFF" stroke-width="3" stroke-linecap="round"/>
    <polygon points="160,360 150,343 142,353" fill="#4A9EFF"/>
    <!-- scattered exit rays (random) -->
    <g stroke="#F5C242" stroke-width="2" stroke-linecap="round" opacity="0.9">
      <line x1="160" y1="360" x2="80" y2="250"/>
      <line x1="160" y1="360" x2="130" y2="225"/>
      <line x1="160" y1="360" x2="175" y2="215"/>
      <line x1="160" y1="360" x2="225" y2="240"/>
      <line x1="160" y1="360" x2="250" y2="285"/>
    </g>
    <text x="160" y="404" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.6">Scatters randomly</text>
  </g>

  <!-- ============ Panel 2: Glossy ============ -->
  <g>
    <text x="400" y="150" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor">Glossy</text>
    <text x="400" y="170" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.6">Shiny surface</text>

    <rect x="290" y="360" width="220" height="14" rx="2" fill="#4A9EFF" opacity="0.35"/>
    <line x1="290" y1="360" x2="510" y2="360" stroke="#4A9EFF" stroke-width="2"/>
    <circle cx="400" cy="360" r="5" fill="#FF6B00"/>
    <!-- incoming ray -->
    <line x1="310" y1="200" x2="400" y2="360" stroke="#4A9EFF" stroke-width="3" stroke-linecap="round"/>
    <polygon points="400,360 390,343 382,353" fill="#4A9EFF"/>
    <!-- single mirrored exit ray -->
    <line x1="400" y1="360" x2="490" y2="200" stroke="#F5C242" stroke-width="3" stroke-linecap="round"/>
    <polygon points="490,200 472,206 484,218" fill="#F5C242"/>
    <!-- normal (dashed) -->
    <line x1="400" y1="360" x2="400" y2="250" stroke="currentColor" stroke-width="1" opacity="0.3" stroke-dasharray="4 4"/>
    <text x="400" y="404" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.6">Reflects at equal angle</text>
  </g>

  <!-- ============ Panel 3: Transmission ============ -->
  <g>
    <text x="640" y="150" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor">Transmission</text>
    <text x="640" y="170" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.6">Transparent material</text>

    <!-- glass slab -->
    <rect x="585" y="250" width="110" height="120" rx="4" fill="#B47EE8" opacity="0.18" stroke="#B47EE8" stroke-width="2"/>
    <!-- incoming ray to front face -->
    <line x1="560" y1="210" x2="615" y2="280" stroke="#4A9EFF" stroke-width="3" stroke-linecap="round"/>
    <polygon points="615,280 599,272 600,286" fill="#4A9EFF"/>
    <circle cx="615" cy="280" r="5" fill="#FF6B00"/>
    <!-- bent ray inside slab -->
    <line x1="615" y1="280" x2="655" y2="345" stroke="#F5C242" stroke-width="3" stroke-linecap="round"/>
    <circle cx="655" cy="345" r="5" fill="#FF6B00"/>
    <!-- exit ray, bent back -->
    <line x1="655" y1="345" x2="710" y2="410" stroke="#F5C242" stroke-width="3" stroke-linecap="round"/>
    <polygon points="710,410 694,402 695,416" fill="#F5C242"/>
    <text x="640" y="450" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.6">Bends through (refracts)</text>
  </g>

  <!-- legend -->
  <g font-size="13" fill="currentColor">
    <rect x="40" y="468" width="16" height="4" rx="2" fill="#4A9EFF"/>
    <text x="64" y="473" opacity="0.75">Incoming ray</text>
    <rect x="220" y="468" width="16" height="4" rx="2" fill="#F5C242"/>
    <text x="244" y="473" opacity="0.75">Outgoing ray(s)</text>
    <circle cx="430" cy="470" r="5" fill="#FF6B00"/>
    <text x="444" y="473" opacity="0.75">Bounce point</text>
  </g>

  <!-- Footer tip (Variant B) -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> A real material can mix these: glass both transmits and reflects, and a glossy floor also scatters a little.</text>
</svg>
