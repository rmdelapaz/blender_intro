<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540"
     role="img" aria-labelledby="or-title or-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="or-title">Orbit: Rotating the Viewport Around the Scene</title>
  <desc id="or-desc">An educational diagram of the Blender orbit operation. A central wireframe cube sits at the middle of a dashed orbital ring, with four viewpoint markers at the front, right, back, and left positions on the ring, illustrating that orbit moves the viewer around a stationary scene. Curved arrows on the ring show the direction of rotation. An inset shows that horizontal mouse drag rotates the view horizontally, and vertical mouse drag rotates the view vertically.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Orbit: Rotating Around the Scene</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Your viewpoint moves; the scene stays still.</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Operation badge -->
  <text x="400" y="142" font-size="15" font-weight="700" fill="#FF6B00" text-anchor="middle" letter-spacing="2">ORBIT</text>
  <text x="400" y="164" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">MMB + Drag</text>

  <!-- ===== Central visual: cube + orbit ring + viewpoints ===== -->

  <!-- Orbit ellipse (dashed orange) at cube center (400, 320) -->
  <ellipse cx="400" cy="320" rx="170" ry="46"
           fill="none" stroke="#FF6B00" stroke-width="2"
           stroke-dasharray="5 4" opacity="0.75"/>

  <!-- Direction arrows on the ring (clockwise) -->
  <g fill="#FF6B00" opacity="0.85">
    <path d="M 568 324 L 574 319 L 568 312 Z" transform="rotate(45, 568, 320)"/>
    <path d="M 232 316 L 226 321 L 232 328 Z" transform="rotate(45, 232, 320)"/>
  </g>

  <!-- Cube wireframe at center (400, 320) -->
  <g stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <rect x="378" y="306" width="44" height="44"/>
    <polyline points="378,306 390,294 434,294 422,306"/>
    <polyline points="434,294 434,338 422,350"/>
  </g>

  <!-- Four viewpoint markers at front, right, back, left positions -->

  <!-- FRONT viewpoint (bottom of ring, closer to viewer) -->
  <g transform="translate(400, 366)">
    <circle cx="0" cy="0" r="8" fill="#FF6B00"/>
    <circle cx="0" cy="0" r="3" fill="#fff"/>
    <text x="0" y="24" font-size="11" font-weight="600" fill="currentColor" text-anchor="middle">Front</text>
  </g>

  <!-- RIGHT viewpoint (right of ring) -->
  <g transform="translate(570, 320)">
    <circle cx="0" cy="0" r="7" fill="#FF6B00" opacity="0.65"/>
    <circle cx="0" cy="0" r="2.5" fill="#fff"/>
    <text x="0" y="-12" font-size="11" font-weight="600" fill="currentColor" text-anchor="middle">Right</text>
  </g>

  <!-- BACK viewpoint (top of ring, farther) -->
  <g transform="translate(400, 274)">
    <circle cx="0" cy="0" r="6" fill="#FF6B00" opacity="0.45"/>
    <circle cx="0" cy="0" r="2" fill="#fff"/>
    <text x="0" y="-10" font-size="11" font-weight="600" fill="currentColor" text-anchor="middle" opacity="0.7">Back</text>
  </g>

  <!-- LEFT viewpoint (left of ring) -->
  <g transform="translate(230, 320)">
    <circle cx="0" cy="0" r="7" fill="#FF6B00" opacity="0.65"/>
    <circle cx="0" cy="0" r="2.5" fill="#fff"/>
    <text x="0" y="-12" font-size="11" font-weight="600" fill="currentColor" text-anchor="middle">Left</text>
  </g>

  <!-- Description below visual -->
  <text x="400" y="412" font-size="13" fill="currentColor" opacity="0.75" text-anchor="middle">Drag in any direction. Your viewpoint travels around the cube,</text>
  <text x="400" y="430" font-size="13" fill="currentColor" opacity="0.75" text-anchor="middle">always pointed at the visible center.</text>

  <!-- ===== Inset: mouse drag mapping (bottom-left) ===== -->
  <g transform="translate(60, 446)">
    <rect x="0" y="0" width="280" height="62" rx="6"
          fill="currentColor" fill-opacity="0.04"
          stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>
    <text x="14" y="20" font-size="11" font-weight="700" fill="currentColor" opacity="0.75" letter-spacing="0.8">DRAG MAPPING</text>
    <!-- Horizontal hint -->
    <g stroke="#FF6B00" stroke-width="1.8" stroke-linecap="round" opacity="0.85">
      <line x1="20" y1="42" x2="64" y2="42"/>
    </g>
    <path d="M 64 42 L 58 37 L 58 47 Z" fill="#FF6B00"/>
    <text x="76" y="46" font-size="11" fill="currentColor" opacity="0.75">drag sideways = orbit sideways</text>
    <!-- Vertical hint -->
    <g stroke="#FF6B00" stroke-width="1.8" stroke-linecap="round" opacity="0.6">
      <line x1="42" y1="46" x2="42" y2="58"/>
    </g>
    <path d="M 42 58 L 37 52 L 47 52 Z" fill="#FF6B00" opacity="0.6"/>
  </g>

  <!-- ===== Inset: stays-on-center hint (bottom-right) ===== -->
  <g transform="translate(460, 446)">
    <rect x="0" y="0" width="280" height="62" rx="6"
          fill="currentColor" fill-opacity="0.04"
          stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>
    <text x="14" y="20" font-size="11" font-weight="700" fill="currentColor" opacity="0.75" letter-spacing="0.8">KEY IDEA</text>
    <text x="14" y="40" font-size="12" fill="currentColor" opacity="0.8">The cube does not move.</text>
    <text x="14" y="55" font-size="12" fill="currentColor" opacity="0.8">You move around it, on a sphere.</text>
  </g>
</svg>
