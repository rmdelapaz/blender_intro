<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="pf-title pf-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="pf-title">Proportional editing falloff types compared</title>
  <desc id="pf-desc">Six small line charts arranged in a two by three grid, each showing how proportional editing influence strength drops with distance from the selection for one falloff type: smooth, sharp, linear, constant, sphere, and random.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">PROPORTIONAL EDITING FALLOFF</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">How influence drops off with distance from selection · 6 modes</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Panel: SMOOTH (row 0, col 0) -->
  <g>
    <rect x="40" y="120" width="230" height="150"
          fill="none" stroke="currentColor" stroke-width="1" opacity="0.15"/>
    <line x1="60.0" y1="250.0" x2="250.0" y2="250.0"
          stroke="currentColor" stroke-width="1" opacity="0.15"/>
    <line x1="60.0" y1="250.0" x2="60.0" y2="140.0"
          stroke="currentColor" stroke-width="1" opacity="0.15"/>
    <polyline points="60.0,140.0 69.5,140.7 79.0,142.7 88.5,146.0 98.0,150.5 107.5,156.1 117.0,162.7 126.5,170.0 136.0,178.0 145.5,186.4 155.0,195.0 164.5,203.6 174.0,212.0 183.5,220.0 193.0,227.3 202.5,233.9 212.0,239.5 221.5,244.0 231.0,247.3 240.5,249.3 250.0,250.0"
              fill="none" stroke="#FF6B00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="155" y="290" font-size="14" font-weight="700" text-anchor="middle" fill="currentColor">SMOOTH</text>
  </g>
  <!-- Panel: SHARP (row 0, col 1) -->
  <g>
    <rect x="285" y="120" width="230" height="150"
          fill="none" stroke="currentColor" stroke-width="1" opacity="0.15"/>
    <line x1="305.0" y1="250.0" x2="495.0" y2="250.0"
          stroke="currentColor" stroke-width="1" opacity="0.15"/>
    <line x1="305.0" y1="250.0" x2="305.0" y2="140.0"
          stroke="currentColor" stroke-width="1" opacity="0.15"/>
    <polyline points="305.0,140.0 314.5,150.7 324.0,160.9 333.5,170.5 343.0,179.6 352.5,188.1 362.0,196.1 371.5,203.5 381.0,210.4 390.5,216.7 400.0,222.5 409.5,227.7 419.0,232.4 428.5,236.5 438.0,240.1 447.5,243.1 457.0,245.6 466.5,247.5 476.0,248.9 485.5,249.7 495.0,250.0"
              fill="none" stroke="#FF6B00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="400" y="290" font-size="14" font-weight="700" text-anchor="middle" fill="currentColor">SHARP</text>
  </g>
  <!-- Panel: LINEAR (row 0, col 2) -->
  <g>
    <rect x="530" y="120" width="230" height="150"
          fill="none" stroke="currentColor" stroke-width="1" opacity="0.15"/>
    <line x1="550.0" y1="250.0" x2="740.0" y2="250.0"
          stroke="currentColor" stroke-width="1" opacity="0.15"/>
    <line x1="550.0" y1="250.0" x2="550.0" y2="140.0"
          stroke="currentColor" stroke-width="1" opacity="0.15"/>
    <polyline points="550.0,140.0 559.5,145.5 569.0,151.0 578.5,156.5 588.0,162.0 597.5,167.5 607.0,173.0 616.5,178.5 626.0,184.0 635.5,189.5 645.0,195.0 654.5,200.5 664.0,206.0 673.5,211.5 683.0,217.0 692.5,222.5 702.0,228.0 711.5,233.5 721.0,239.0 730.5,244.5 740.0,250.0"
              fill="none" stroke="#FF6B00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="645" y="290" font-size="14" font-weight="700" text-anchor="middle" fill="currentColor">LINEAR</text>
  </g>
  <!-- Panel: CONSTANT (row 1, col 0) -->
  <g>
    <rect x="40" y="317" width="230" height="150"
          fill="none" stroke="currentColor" stroke-width="1" opacity="0.15"/>
    <line x1="60.0" y1="447.0" x2="250.0" y2="447.0"
          stroke="currentColor" stroke-width="1" opacity="0.15"/>
    <line x1="60.0" y1="447.0" x2="60.0" y2="337.0"
          stroke="currentColor" stroke-width="1" opacity="0.15"/>
    <polyline points="60.0,337.0 250.0,337.0 250.0,447.0"
              fill="none" stroke="#FF6B00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="155" y="487" font-size="14" font-weight="700" text-anchor="middle" fill="currentColor">CONSTANT</text>
  </g>
  <!-- Panel: SPHERE (row 1, col 1) -->
  <g>
    <rect x="285" y="317" width="230" height="150"
          fill="none" stroke="currentColor" stroke-width="1" opacity="0.15"/>
    <line x1="305.0" y1="447.0" x2="495.0" y2="447.0"
          stroke="currentColor" stroke-width="1" opacity="0.15"/>
    <line x1="305.0" y1="447.0" x2="305.0" y2="337.0"
          stroke="currentColor" stroke-width="1" opacity="0.15"/>
    <polyline points="305.0,337.0 314.5,337.1 324.0,337.6 333.5,338.2 343.0,339.2 352.5,340.5 362.0,342.1 371.5,344.0 381.0,346.2 390.5,348.8 400.0,351.7 409.5,355.1 419.0,359.0 428.5,363.4 438.0,368.4 447.5,374.2 457.0,381.0 466.5,389.1 476.0,399.1 485.5,412.7 495.0,447.0"
              fill="none" stroke="#FF6B00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="400" y="487" font-size="14" font-weight="700" text-anchor="middle" fill="currentColor">SPHERE</text>
  </g>
  <!-- Panel: RANDOM (row 1, col 2) -->
  <g>
    <rect x="530" y="317" width="230" height="150"
          fill="none" stroke="currentColor" stroke-width="1" opacity="0.15"/>
    <line x1="550.0" y1="447.0" x2="740.0" y2="447.0"
          stroke="currentColor" stroke-width="1" opacity="0.15"/>
    <line x1="550.0" y1="447.0" x2="550.0" y2="337.0"
          stroke="currentColor" stroke-width="1" opacity="0.15"/>
    <polyline points="550.0,367.8 559.5,350.2 569.0,397.5 578.5,344.7 588.0,412.9 597.5,361.2 607.0,386.5 616.5,341.4 626.0,400.8 635.5,373.3 645.0,355.7 654.5,404.1 664.0,368.9 673.5,383.2 683.0,343.6 692.5,407.4 702.0,378.8 711.5,393.1 721.0,353.5 730.5,401.9 740.0,447.0"
              fill="none" stroke="#FF6B00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="645" y="487" font-size="14" font-weight="700" text-anchor="middle" fill="currentColor">RANDOM</text>
  </g>
  <!-- Footer tip (Variant B left rail) -->
  <rect x="40" y="506" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> SMOOTH and SPHERE produce the most natural hills; CONSTANT applies full influence everywhere inside the radius.
  </text>
</svg>
