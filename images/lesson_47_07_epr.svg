<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="eprTitle eprDesc" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" color="#222">
  <title id="eprTitle">Essential Render Passes Reference</title>
  <desc id="eprDesc">Reference cards for the render passes you will use most: Combined is the full beauty image, Diffuse and Glossy split direct surface color from reflections, Ambient Occlusion adds contact shadow, Z-depth encodes distance for fog and depth of field, Normal encodes surface direction, Mist gives a ready-made depth fade, and Cryptomatte gives per-object masks. Each card lists what it isolates and its typical post use.</desc>
  <style>
    .hd{fill:currentColor;font-size:19px;font-weight:700;}
    .sub{fill:#9aa4b2;font-size:11px;}
    .nm{fill:#ffffff;font-size:12px;font-weight:700;}
    .ds{fill:#d4d4d4;font-size:9.5px;}
    .us{fill:#F5C242;font-size:9px;font-weight:700;}
    .card{fill:#1b1b1b;stroke-width:1.5;rx:6;}
  </style>
  <text x="20" y="34" class="hd">Passes you will actually enable</text>
  <text x="20" y="54" class="sub">Turn these on in View Layer Properties &#8594; Passes. Each isolates one component you can grade separately.</text>

  <!-- row 1 -->
  <g>
    <rect class="card" x="20" y="72" width="230" height="94" fill="#1b1b1b" stroke="#FF6B00"/>
    <rect x="20" y="72" width="6" height="94" fill="#FF6B00"/>
    <text x="36" y="92" class="nm">Combined (Beauty)</text>
    <text x="36" y="112" class="ds">Full lit render, all passes merged.</text>
    <text x="36" y="128" class="ds">Your starting image.</text>
    <text x="36" y="152" class="us">USE: base for grading</text>
  </g>
  <g>
    <rect class="card" x="265" y="72" width="230" height="94" fill="#1b1b1b" stroke="#4ADE80"/>
    <rect x="265" y="72" width="6" height="94" fill="#4ADE80"/>
    <text x="281" y="92" class="nm">Diffuse / Glossy</text>
    <text x="281" y="112" class="ds">Base color vs reflections &amp;</text>
    <text x="281" y="128" class="ds">specular, kept separate.</text>
    <text x="281" y="152" class="us">USE: retune shine without repaint</text>
  </g>
  <g>
    <rect class="card" x="510" y="72" width="230" height="94" fill="#1b1b1b" stroke="#B47EE8"/>
    <rect x="510" y="72" width="6" height="94" fill="#B47EE8"/>
    <text x="526" y="92" class="nm">Ambient Occlusion</text>
    <text x="526" y="112" class="ds">Contact shadow in crevices,</text>
    <text x="526" y="128" class="ds">grayscale.</text>
    <text x="526" y="152" class="us">USE: multiply for grounded depth</text>
  </g>

  <!-- row 2 -->
  <g>
    <rect class="card" x="20" y="180" width="230" height="94" fill="#1b1b1b" stroke="#4A9EFF"/>
    <rect x="20" y="180" width="6" height="94" fill="#4A9EFF"/>
    <text x="36" y="200" class="nm">Z-Depth</text>
    <text x="36" y="220" class="ds">Distance from camera per pixel,</text>
    <text x="36" y="236" class="ds">near dark &#8594; far bright.</text>
    <text x="36" y="260" class="us">USE: fog, depth of field</text>
  </g>
  <g>
    <rect class="card" x="265" y="180" width="230" height="94" fill="#1b1b1b" stroke="#4A9EFF"/>
    <rect x="265" y="180" width="6" height="94" fill="#4A9EFF"/>
    <text x="281" y="200" class="nm">Normal</text>
    <text x="281" y="220" class="ds">Surface direction as RGB;</text>
    <text x="281" y="236" class="ds">drives relighting tricks.</text>
    <text x="281" y="260" class="us">USE: fake relight, edge masks</text>
  </g>
  <g>
    <rect class="card" x="510" y="180" width="230" height="94" fill="#1b1b1b" stroke="#F5C242"/>
    <rect x="510" y="180" width="6" height="94" fill="#F5C242"/>
    <text x="526" y="200" class="nm">Mist</text>
    <text x="526" y="220" class="ds">Ready-made 0&#8211;1 depth fade with</text>
    <text x="526" y="236" class="ds">start/depth controls.</text>
    <text x="526" y="260" class="us">USE: quick atmospheric haze</text>
  </g>

  <!-- row 3 full -->
  <g>
    <rect class="card" x="20" y="288" width="720" height="92" fill="#1b1b1b" stroke="#E63946"/>
    <rect x="20" y="288" width="6" height="92" fill="#E63946"/>
    <text x="36" y="308" class="nm">Cryptomatte</text>
    <text x="36" y="330" class="ds">Automatic per-object / per-material ID masks &#8212; click a surface in the compositor to isolate it precisely, no manual roto.</text>
    <text x="36" y="352" class="us">USE: grade or swap one object without touching the rest</text>
    <rect x="470" y="300" width="250" height="66" rx="4" fill="#0f0f0f"/>
    <circle cx="520" cy="333" r="20" fill="#E63946"/>
    <circle cx="575" cy="333" r="20" fill="#4ADE80"/>
    <circle cx="630" cy="333" r="20" fill="#4A9EFF"/>
    <circle cx="685" cy="333" r="20" fill="#F5C242"/>
  </g>
</svg>
