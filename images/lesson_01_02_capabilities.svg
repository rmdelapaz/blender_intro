<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="cap-title cap-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="cap-title">Blender Capabilities Overview</title>
  <desc id="cap-desc">A hub-and-spoke infographic showing the ten core capabilities Blender brings into one application: Modeling, Sculpting, Texturing, Rigging, Animation, Simulation, Rendering, Compositing, Video Editing, and Geometry Nodes. All ten radiate from a central Blender hub.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">One Tool, Ten Disciplines</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Everything you&#8217;d normally need a separate program for &#8212; Blender does it all.</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Spokes from hub (400,305) to each node -->
  <g stroke="currentColor" stroke-width="1.4" opacity="0.22" fill="none" stroke-linecap="round">
    <line x1="400" y1="305" x2="400" y2="175"/>
    <line x1="400" y1="305" x2="476.4" y2="199.8"/>
    <line x1="400" y1="305" x2="523.6" y2="264.8"/>
    <line x1="400" y1="305" x2="523.6" y2="345.2"/>
    <line x1="400" y1="305" x2="476.4" y2="410.2"/>
    <line x1="400" y1="305" x2="400" y2="435"/>
    <line x1="400" y1="305" x2="323.6" y2="410.2"/>
    <line x1="400" y1="305" x2="276.4" y2="345.2"/>
    <line x1="400" y1="305" x2="276.4" y2="264.8"/>
    <line x1="400" y1="305" x2="323.6" y2="199.8"/>
  </g>

  <!-- Central hub -->
  <circle cx="400" cy="305" r="48" fill="#FF6B00"/>
  <text x="400" y="302" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="2">BLENDER</text>
  <text x="400" y="320" font-size="9" fill="#fff" opacity="0.85" text-anchor="middle" letter-spacing="0.5">does all of this</text>

  <!-- ===== Node 0: Modeling (top, blue) ===== -->
  <circle cx="400" cy="175" r="28" fill="#4A9EFF"/>
  <g transform="translate(400, 175)" stroke="#fff" stroke-width="1.6" fill="none" stroke-linejoin="round">
    <path d="M -9 -3 L 0 -9 L 9 -3 L 9 7 L 0 13 L -9 7 Z"/>
    <path d="M -9 -3 L 0 3 L 9 -3 M 0 3 L 0 13"/>
  </g>
  <text x="400" y="133" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Modeling</text>

  <!-- ===== Node 1: Sculpting (upper-right, green) ===== -->
  <circle cx="476.4" cy="199.8" r="28" fill="#4ADE80"/>
  <g transform="translate(476.4, 199.8)">
    <path d="M -8 -6 Q -11 0 -7 6 Q -2 10 4 8 Q 11 4 9 -4 Q 5 -10 -2 -9 Q -7 -9 -8 -6 Z" fill="#fff"/>
  </g>
  <text x="501" y="166" font-size="12" font-weight="600" fill="currentColor">Sculpting</text>

  <!-- ===== Node 2: Texturing (right-upper, blue) ===== -->
  <circle cx="523.6" cy="264.8" r="28" fill="#4A9EFF"/>
  <g transform="translate(523.6, 264.8)" stroke="#fff" fill="#fff">
    <path d="M -9 8 L 8 -9" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <circle cx="-7" cy="9" r="3"/>
    <path d="M 7 -10 L 11 -6 L 9 -8 Z" fill="none" stroke-width="1"/>
  </g>
  <text x="563" y="252" font-size="12" font-weight="600" fill="currentColor">Texturing</text>

  <!-- ===== Node 3: Rigging (right-lower, green) ===== -->
  <circle cx="523.6" cy="345.2" r="28" fill="#4ADE80"/>
  <g transform="translate(523.6, 345.2)" fill="#fff" stroke="#fff" stroke-width="1.4" stroke-linecap="round">
    <circle cx="0" cy="-9" r="2.2" stroke="none"/>
    <circle cx="0" cy="-1" r="2.2" stroke="none"/>
    <circle cx="0" cy="7" r="2.2" stroke="none"/>
    <circle cx="-6" cy="0" r="2.2" stroke="none"/>
    <circle cx="6" cy="0" r="2.2" stroke="none"/>
    <line x1="0" y1="-7" x2="0" y2="5" fill="none"/>
    <line x1="-1.5" y1="-2" x2="-5" y2="-0.5" fill="none"/>
    <line x1="1.5" y1="-2" x2="5" y2="-0.5" fill="none"/>
  </g>
  <text x="563" y="358" font-size="12" font-weight="600" fill="currentColor">Rigging</text>

  <!-- ===== Node 4: Animation (lower-right, blue) ===== -->
  <circle cx="476.4" cy="410.2" r="28" fill="#4A9EFF"/>
  <g transform="translate(476.4, 410.2)">
    <path d="M -6 -9 L 9 0 L -6 9 Z" fill="#fff"/>
  </g>
  <text x="501" y="455" font-size="12" font-weight="600" fill="currentColor">Animation</text>

  <!-- ===== Node 5: Simulation (bottom, green) ===== -->
  <circle cx="400" cy="435" r="28" fill="#4ADE80"/>
  <g transform="translate(400, 435)" fill="#fff">
    <circle cx="-7" cy="-6" r="2"/>
    <circle cx="3" cy="-8" r="2"/>
    <circle cx="-5" cy="2" r="2"/>
    <circle cx="7" cy="-1" r="2"/>
    <circle cx="-1" cy="8" r="2"/>
    <circle cx="8" cy="7" r="2"/>
    <circle cx="-9" cy="8" r="2"/>
  </g>
  <text x="400" y="477" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Simulation</text>

  <!-- ===== Node 6: Rendering (lower-left, blue) ===== -->
  <circle cx="323.6" cy="410.2" r="28" fill="#4A9EFF"/>
  <g transform="translate(323.6, 410.2)" stroke="#fff" stroke-width="1.6" fill="none">
    <rect x="-9" y="-4" width="18" height="13" rx="1.5"/>
    <rect x="-4" y="-8" width="8" height="4"/>
    <circle cx="0" cy="2.5" r="4"/>
  </g>
  <text x="299" y="455" font-size="12" font-weight="600" fill="currentColor" text-anchor="end">Rendering</text>

  <!-- ===== Node 7: Compositing (left-lower, green) ===== -->
  <circle cx="276.4" cy="345.2" r="28" fill="#4ADE80"/>
  <g transform="translate(276.4, 345.2)" stroke="#fff" stroke-width="1.6" fill="none">
    <rect x="-9" y="-9" width="11" height="11"/>
    <rect x="-2" y="-2" width="11" height="11"/>
  </g>
  <text x="236" y="358" font-size="12" font-weight="600" fill="currentColor" text-anchor="end">Compositing</text>

  <!-- ===== Node 8: Video Editing (left-upper, blue) ===== -->
  <circle cx="276.4" cy="264.8" r="28" fill="#4A9EFF"/>
  <g transform="translate(276.4, 264.8)" stroke="#fff" stroke-width="1.5" fill="none">
    <rect x="-10" y="-6" width="20" height="12"/>
    <rect x="-8" y="-4" width="4" height="8" stroke-width="0.9"/>
    <rect x="-2" y="-4" width="4" height="8" stroke-width="0.9"/>
    <rect x="4" y="-4" width="4" height="8" stroke-width="0.9"/>
  </g>
  <text x="236" y="259" font-size="12" font-weight="600" fill="currentColor" text-anchor="end">Video</text>
  <text x="236" y="275" font-size="12" font-weight="600" fill="currentColor" text-anchor="end">Editing</text>

  <!-- ===== Node 9: Geometry Nodes (upper-left, green) ===== -->
  <circle cx="323.6" cy="199.8" r="28" fill="#4ADE80"/>
  <g transform="translate(323.6, 199.8)" stroke="#fff" stroke-width="1.4" fill="none">
    <circle cx="-7" cy="-5" r="2.8"/>
    <circle cx="7" cy="-5" r="2.8"/>
    <circle cx="0" cy="7" r="2.8"/>
    <line x1="-4.5" y1="-3.5" x2="-1.8" y2="4.5"/>
    <line x1="4.5" y1="-3.5" x2="1.8" y2="4.5"/>
    <line x1="-4" y1="-5" x2="4" y2="-5"/>
  </g>
  <text x="299" y="158" font-size="12" font-weight="600" fill="currentColor" text-anchor="end">Geometry</text>
  <text x="299" y="174" font-size="12" font-weight="600" fill="currentColor" text-anchor="end">Nodes</text>

  <!-- Footer tip -->
  <rect x="40" y="506" width="720" height="34" rx="6" fill="#FF6B00" fill-opacity="0.10" stroke="#FF6B00" stroke-opacity="0.4"/>
  <text x="54" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Most studios pay for five tools to do what one Blender install handles for free.
  </text>
</svg>
