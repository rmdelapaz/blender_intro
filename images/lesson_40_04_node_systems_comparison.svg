<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="nsc-title nsc-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="nsc-title">Blender node systems compared</title>
  <desc id="nsc-desc">Three of Blender's node editors sit side by side. Shader Nodes control materials and appearance, Geometry Nodes build and modify structure, and Compositor Nodes handle post-processing. Dotted links show that the three systems work together in one project.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Blender node systems</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Geometry Nodes is one of three node editors, each owning a different job</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Dotted inter-system links (behind cards) -->
  <g stroke="currentColor" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="3 5" fill="none">
    <line x1="200" y1="300" x2="400" y2="300"/>
    <line x1="560" y1="300" x2="600" y2="300"/>
    <path d="M 130 380 Q 400 470 670 380"/>
  </g>

  <!-- Shader Nodes card -->
  <g>
    <rect x="50" y="180" width="160" height="220" rx="12" fill="#FF6B00" fill-opacity="0.10" stroke="#FF6B00" stroke-width="2"/>
    <circle cx="130" cy="238" r="26" fill="#FF6B00" fill-opacity="0.9"/>
    <circle cx="130" cy="238" r="26" fill="none" stroke="#FF6B00" stroke-width="2"/>
    <text x="130" y="300" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor">Shader Nodes</text>
    <text x="130" y="330" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.6">Materials</text>
    <text x="130" y="350" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.6">and appearance</text>
    <text x="130" y="378" text-anchor="middle" font-size="13" fill="#FF6B00" font-weight="600">How it looks</text>
  </g>

  <!-- Geometry Nodes card (highlighted focus) -->
  <g>
    <rect x="320" y="160" width="160" height="260" rx="12" fill="#4A9EFF" fill-opacity="0.14" stroke="#4A9EFF" stroke-width="3"/>
    <text x="400" y="192" text-anchor="middle" font-size="11" font-weight="700" fill="#FF6B00" letter-spacing="1">THIS LESSON</text>
    <rect x="374" y="212" width="52" height="44" rx="6" fill="#4A9EFF" fill-opacity="0.85"/>
    <rect x="374" y="212" width="52" height="44" rx="6" fill="none" stroke="#4A9EFF" stroke-width="2"/>
    <text x="400" y="300" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor">Geometry Nodes</text>
    <text x="400" y="330" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.6">Geometry</text>
    <text x="400" y="350" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.6">and structure</text>
    <text x="400" y="378" text-anchor="middle" font-size="13" fill="#4A9EFF" font-weight="600">What it is made of</text>
  </g>

  <!-- Compositor Nodes card -->
  <g>
    <rect x="590" y="180" width="160" height="220" rx="12" fill="#4ADE80" fill-opacity="0.12" stroke="#4ADE80" stroke-width="2"/>
    <rect x="644" y="216" width="52" height="44" rx="6" fill="#4ADE80" fill-opacity="0.85"/>
    <rect x="644" y="216" width="52" height="44" rx="6" fill="none" stroke="#4ADE80" stroke-width="2"/>
    <text x="670" y="300" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor">Compositor Nodes</text>
    <text x="670" y="330" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.6">Post-processing</text>
    <text x="670" y="350" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.6">the final image</text>
    <text x="670" y="378" text-anchor="middle" font-size="13" fill="#4ADE80" font-weight="600">How it is finished</text>
  </g>

  <!-- Shared trait note -->
  <text x="400" y="452" text-anchor="middle" font-size="14" fill="currentColor" opacity="0.65">All three share the same node-based way of working: connect nodes to build a result.</text>

  <!-- Footer tip (Variant B, left rail) -->
  <rect x="40" y="506" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Learn the node habits here and the same skills carry straight into Shader and Compositor nodes.</text>
</svg>
