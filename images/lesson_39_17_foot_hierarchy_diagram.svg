<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="fh-title fh-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="fh-title">Leg rig foot control hierarchy</title>
  <desc id="fh-desc">A side view of a foot rig and its control hierarchy. The IK_foot control at the ankle is the parent that moves the whole foot system. Below it the heel pivot rotates the foot on the heel, the toe pivot rotates it on the ball, and the mechanism leg target at the ankle is the actual IK constraint target. A tree on the right shows the parent-to-child order: IK_foot, then heel pivot, then toe pivot, then the leg target feeding the IK constraint.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">FOOT CONTROL HIERARCHY</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">IK_foot · heel pivot · toe pivot · leg target · why order matters</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ===== LEFT: side-view foot (~60%) ===== -->
  <text x="40" y="142" font-size="18" font-weight="600" fill="currentColor">Side view</text>

  <!-- ground line -->
  <line x1="60" y1="470" x2="470" y2="470" stroke="currentColor" stroke-width="2" opacity="0.3"/>

  <!-- foot silhouette -->
  <path d="M 150 300 L 170 300 L 185 440 L 380 440 L 410 470 L 130 470 L 145 440 Z" fill="currentColor" opacity="0.18"/>
  <!-- leg stub up from ankle -->
  <path d="M 150 300 L 170 300 L 174 220 L 146 220 Z" fill="currentColor" opacity="0.18"/>

  <!-- heel + ball contact dots -->
  <circle cx="150" cy="470" r="6" fill="#ff8c00"/>
  <text x="96" y="492" font-size="11" fill="currentColor" opacity="0.6">heel contact</text>
  <circle cx="360" cy="470" r="6" fill="#4ADE80"/>
  <text x="332" y="492" font-size="11" fill="currentColor" opacity="0.6">ball contact</text>

  <!-- MCH_IK_leg_target (ankle, grey) -->
  <circle cx="160" cy="300" r="9" fill="none" stroke="currentColor" stroke-width="2.5" opacity="0.55"/>
  <text x="178" y="296" font-size="13" fill="currentColor" opacity="0.75">MCH_IK_leg_target.L</text>
  <text x="178" y="314" font-size="11" fill="currentColor" opacity="0.5">actual IK constraint target</text>

  <!-- IK_foot control (ankle, cyan, parent) -->
  <rect x="120" y="248" width="34" height="26" rx="4" fill="none" stroke="#00bcd4" stroke-width="3"/>
  <text x="178" y="262" font-size="13" font-weight="600" fill="#00bcd4">IK_foot.L</text>
  <text x="178" y="280" font-size="11" fill="currentColor" opacity="0.5">moves the whole foot system</text>

  <!-- heel pivot (heel, orange) + rotation arc -->
  <circle cx="150" cy="455" r="10" fill="none" stroke="#ff8c00" stroke-width="3"/>
  <path d="M 132 446 a 22 22 0 0 1 8 -16" stroke="#ff8c00" stroke-width="2" fill="none" stroke-linecap="round"/>
  <polyline points="138,432 140,422 148,428" fill="#ff8c00" stroke="none"/>
  <text x="60" y="430" font-size="12" font-weight="600" fill="#ff8c00">IK_heel_pivot.L</text>

  <!-- toe pivot (ball, green) + rotation arc -->
  <circle cx="360" cy="455" r="10" fill="none" stroke="#4ADE80" stroke-width="3"/>
  <path d="M 380 446 a 22 22 0 0 0 -8 -16" stroke="#4ADE80" stroke-width="2" fill="none" stroke-linecap="round"/>
  <polyline points="376,432 372,422 366,430" fill="#4ADE80" stroke="none"/>
  <text x="360" y="424" font-size="12" font-weight="600" fill="#4ADE80">IK_toe_pivot.L</text>

  <!-- ===== RIGHT: tree hierarchy box (~40%) ===== -->
  <text x="500" y="142" font-size="18" font-weight="600" fill="currentColor">Parent → child order</text>

  <!-- tree connectors (straight, currentColor op0.3) -->
  <g stroke="currentColor" stroke-width="1.5" opacity="0.3" stroke-linecap="round" fill="none">
    <line x1="520" y1="190" x2="520" y2="250"/>
    <line x1="520" y1="250" x2="540" y2="250"/>
    <line x1="520" y1="190" x2="520" y2="320"/>
    <line x1="520" y1="320" x2="540" y2="320"/>
    <line x1="520" y1="190" x2="520" y2="390"/>
    <line x1="520" y1="390" x2="540" y2="390"/>
    <line x1="520" y1="190" x2="520" y2="460"/>
    <line x1="520" y1="460" x2="540" y2="460"/>
  </g>

  <!-- node 1: IK_foot.L (root) -->
  <text x="506" y="184" font-size="14" font-weight="600" fill="#00bcd4">IK_foot.L</text>
  <!-- node 2: heel pivot -->
  <text x="548" y="255" font-size="14" font-weight="600" fill="#ff8c00">IK_heel_pivot.L</text>
  <!-- node 3: toe pivot -->
  <text x="548" y="325" font-size="14" font-weight="600" fill="#4ADE80">IK_toe_pivot.L</text>
  <!-- node 4: leg target -->
  <text x="548" y="395" font-size="14" fill="currentColor" opacity="0.75">MCH_IK_leg_target.L</text>
  <!-- terminal: IK Constraint -->
  <text x="548" y="465" font-size="14" font-weight="600" fill="#FF6B00">IK Constraint</text>

  <!-- explanatory note under tree -->
  <text x="500" y="510" font-size="13" fill="currentColor" opacity="0.6">Each pivot is a child of the one above,</text>
  <text x="500" y="530" font-size="13" fill="currentColor" opacity="0.6">so rotating it carries everything below.</text>

  <!-- Footer tip (Variant B, left rail, dense y641) -->
  <rect x="40" y="641" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Build the hierarchy IK_foot down to leg_target, or heel and toe roll will fight each other.</text>
</svg>