<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="cb-title cb-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" color="#222">
  <title id="cb-title">Particle collision behaviour outcomes</title>
  <desc id="cb-desc">A decision tree starting from a particle hitting a collision object, branching into four outcomes determined by the settings: Kill removes the particle, Stick holds it on the surface, Bounce reflects it, and Slide carries it along the surface with friction.</desc>
  <style>
    .cb-root{font:700 15px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:currentColor}
    .cb-out{font:700 14px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
    .cb-desc{font:400 12px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:currentColor;opacity:.65}
    .cb-rootbox{fill:#4A9EFF;fill-opacity:.15;stroke:#4A9EFF;stroke-width:2}
    .cb-conn{stroke:currentColor;stroke-opacity:.3;stroke-width:1.5;fill:none;stroke-linecap:round}
  </style>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">COLLISION BEHAVIOUR</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">What happens when a particle meets a collision object</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Root node -->
  <rect class="cb-rootbox" x="300" y="138" width="200" height="56" rx="8"/>
  <text class="cb-root" x="400" y="164" text-anchor="middle">Particle hits object</text>
  <text class="cb-desc" x="400" y="183" text-anchor="middle">Outcome depends on settings</text>

  <!-- Connectors from root down to a rail, then to each outcome -->
  <g class="cb-conn">
    <path d="M400,194 V224"/>
    <path d="M115,224 H685"/>
    <path d="M115,224 V252"/>
    <path d="M305,224 V252"/>
    <path d="M495,224 V252"/>
    <path d="M685,224 V252"/>
  </g>

  <!-- ===== Outcome: KILL (warning red) ===== -->
  <rect x="40" y="252" width="150" height="120" rx="8" fill="#E63946" fill-opacity="0.12" stroke="#E63946" stroke-width="2"/>
  <text class="cb-out" x="115" y="282" text-anchor="middle" fill="#E63946">KILL</text>
  <!-- icon: particle vanishing -->
  <circle cx="100" cy="312" r="7" fill="#E63946" fill-opacity="0.8"/>
  <circle cx="124" cy="312" r="5" fill="#E63946" fill-opacity="0.35"/>
  <line x1="62" y1="332" x2="168" y2="332" stroke="#E63946" stroke-width="2" stroke-opacity="0.5"/>
  <text class="cb-desc" x="115" y="352" text-anchor="middle">Removed on contact</text>
  <text class="cb-desc" x="115" y="367" text-anchor="middle">(rain, splatter)</text>

  <!-- ===== Outcome: STICK (caution amber) ===== -->
  <rect x="230" y="252" width="150" height="120" rx="8" fill="#F5C242" fill-opacity="0.14" stroke="#F5C242" stroke-width="2"/>
  <text class="cb-out" x="305" y="282" text-anchor="middle" fill="#F5C242">STICK</text>
  <!-- icon: particle resting on surface -->
  <line x1="252" y1="332" x2="358" y2="332" stroke="#F5C242" stroke-width="2" stroke-opacity="0.6"/>
  <circle cx="305" cy="324" r="7" fill="#F5C242"/>
  <text class="cb-desc" x="305" y="352" text-anchor="middle">Stays where it lands</text>
  <text class="cb-desc" x="305" y="367" text-anchor="middle">(snow, dew)</text>

  <!-- ===== Outcome: BOUNCE (positive green) ===== -->
  <rect x="420" y="252" width="150" height="120" rx="8" fill="#4ADE80" fill-opacity="0.12" stroke="#4ADE80" stroke-width="2"/>
  <text class="cb-out" x="495" y="282" text-anchor="middle" fill="#4ADE80">BOUNCE</text>
  <!-- icon: reflected path -->
  <line x1="442" y1="332" x2="548" y2="332" stroke="#4ADE80" stroke-width="2" stroke-opacity="0.6"/>
  <path d="M462,302 L495,332 L528,308" fill="none" stroke="#4ADE80" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="528" cy="308" r="5" fill="#4ADE80"/>
  <text class="cb-desc" x="495" y="352" text-anchor="middle">Reflects off surface</text>
  <text class="cb-desc" x="495" y="367" text-anchor="middle">(hail, debris)</text>

  <!-- ===== Outcome: SLIDE (brand orange) ===== -->
  <rect x="610" y="252" width="150" height="120" rx="8" fill="#FF6B00" fill-opacity="0.10" stroke="#FF6B00" stroke-width="2"/>
  <text class="cb-out" x="685" y="282" text-anchor="middle" fill="#FF6B00">SLIDE</text>
  <!-- icon: particle moving along surface -->
  <line x1="632" y1="332" x2="738" y2="332" stroke="#FF6B00" stroke-width="2" stroke-opacity="0.6"/>
  <circle cx="652" cy="324" r="7" fill="#FF6B00"/>
  <path d="M668,324 H726" fill="none" stroke="#FF6B00" stroke-width="2" stroke-linecap="round"/>
  <path d="M720,318 L728,324 L720,330" fill="none" stroke="#FF6B00" stroke-width="2" stroke-linejoin="round"/>
  <text class="cb-desc" x="685" y="352" text-anchor="middle">Travels along it</text>
  <text class="cb-desc" x="685" y="367" text-anchor="middle">with friction</text>

  <!-- Footer tip (Variant B, left rail) -->
  <rect x="40" y="416" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="438" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Kill lives on the particle system; bounce, stick and slide come from the object's Damping and Friction.</text>
</svg>
