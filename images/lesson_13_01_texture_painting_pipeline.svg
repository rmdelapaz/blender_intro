<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360"
     role="img" aria-labelledby="pp-title pp-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="pp-title">Texture painting pipeline</title>
  <desc id="pp-desc">A horizontal flowchart showing how a brush stroke painted on a 3D model travels through Blender's texture pipeline. The stages are: Paint Stroke on 3D Model, then Blender Uses UV Map, then Projects Paint to 2D Texture, then Texture Image Updates, then Material Shows Result. The first stage is accented in Blender orange and the final result stage in green, with arrows connecting each stage left to right.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">The texture painting pipeline</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Paint on the 3D model &#183; Blender projects the stroke through the UV map onto the 2D texture</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Pipeline row: 5 stage nodes connected by arrows -->
  <!-- Geometry: 5 nodes, each 132 wide x 96 tall, top y=150; gaps host arrows -->
  <defs>
    <marker id="pp-arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#FF6B00"/>
    </marker>
  </defs>

  <g font-size="13" font-weight="600">
    <!-- Stage 1: Paint Stroke (orange accent, start) -->
    <rect x="40" y="150" width="118" height="96" rx="10" fill="#FF6B00" fill-opacity="0.10" stroke="#FF6B00" stroke-width="2"/>
    <circle cx="99" cy="184" r="15" fill="none" stroke="#FF6B00" stroke-width="2.5"/>
    <circle cx="99" cy="184" r="4" fill="#FF6B00"/>
    <text x="99" y="222" text-anchor="middle" fill="currentColor">Paint stroke</text>
    <text x="99" y="239" text-anchor="middle" fill="currentColor" opacity="0.7" font-weight="400" font-size="12">on 3D model</text>

    <!-- arrow 1 to 2 -->
    <line x1="160" y1="198" x2="196" y2="198" stroke="#FF6B00" stroke-width="2.5" marker-end="url(#pp-arrow)"/>

    <!-- Stage 2: UV Map -->
    <rect x="198" y="150" width="118" height="96" rx="10" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.85"/>
    <g stroke="currentColor" stroke-width="2" fill="none" opacity="0.85">
      <rect x="241" y="170" width="32" height="28"/>
      <line x1="257" y1="170" x2="257" y2="198"/>
      <line x1="241" y1="184" x2="273" y2="184"/>
    </g>
    <text x="257" y="222" text-anchor="middle" fill="currentColor">Blender uses</text>
    <text x="257" y="239" text-anchor="middle" fill="currentColor" opacity="0.7" font-weight="400" font-size="12">the UV map</text>

    <!-- arrow 2 to 3 -->
    <line x1="318" y1="198" x2="354" y2="198" stroke="#FF6B00" stroke-width="2.5" marker-end="url(#pp-arrow)"/>

    <!-- Stage 3: Project to 2D -->
    <rect x="356" y="150" width="118" height="96" rx="10" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.85"/>
    <g stroke="currentColor" stroke-width="2" fill="none" opacity="0.85">
      <path d="M 400 168 L 415 178 L 415 200 L 400 190 z"/>
      <rect x="423" y="172" width="22" height="24"/>
    </g>
    <text x="415" y="222" text-anchor="middle" fill="currentColor">Projects to</text>
    <text x="415" y="239" text-anchor="middle" fill="currentColor" opacity="0.7" font-weight="400" font-size="12">2D texture</text>

    <!-- arrow 3 to 4 -->
    <line x1="476" y1="198" x2="512" y2="198" stroke="#FF6B00" stroke-width="2.5" marker-end="url(#pp-arrow)"/>

    <!-- Stage 4: Texture updates -->
    <rect x="514" y="150" width="118" height="96" rx="10" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.85"/>
    <g stroke="currentColor" stroke-width="2" fill="none" opacity="0.85">
      <rect x="557" y="170" width="32" height="28"/>
      <path d="M 557 190 L 567 180 L 575 188 L 582 182 L 589 189" stroke-linejoin="round"/>
    </g>
    <text x="573" y="222" text-anchor="middle" fill="currentColor">Texture image</text>
    <text x="573" y="239" text-anchor="middle" fill="currentColor" opacity="0.7" font-weight="400" font-size="12">updates</text>

    <!-- arrow 4 to 5 -->
    <line x1="634" y1="198" x2="670" y2="198" stroke="#FF6B00" stroke-width="2.5" marker-end="url(#pp-arrow)"/>

    <!-- Stage 5: Material result (green, end) -->
    <rect x="672" y="150" width="88" height="96" rx="10" fill="#4ADE80" fill-opacity="0.12" stroke="#4ADE80" stroke-width="2"/>
    <path d="M 705 188 l 7 7 l 13 -15" fill="none" stroke="#4ADE80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="716" y="222" text-anchor="middle" fill="currentColor">Material</text>
    <text x="716" y="239" text-anchor="middle" fill="currentColor" opacity="0.7" font-weight="400" font-size="12">shows result</text>
  </g>

  <!-- Loop-back note: painting updates feed straight back to what you see -->
  <path d="M 716 246 L 716 286 L 99 286 L 99 250" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.3" stroke-dasharray="5 5" marker-end="url(#pp-arrow)"/>
  <text x="408" y="282" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.55">You see the painted model update live in the viewport</text>

  <!-- Footer tip callout (Variant B, left rail) -->
  <rect x="40" y="312" width="720" height="34" fill="none"/>
  <rect x="40" y="312" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="334" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Good UVs come first &#183; the projection is only as clean as the UV map underneath it.</text>
</svg>
