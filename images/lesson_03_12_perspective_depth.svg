<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="pd-title pd-desc" color="#222">
  <title id="pd-title">Perspective projection, depth and vanishing point</title>
  <desc id="pd-desc">Two orange rails converge toward a single vanishing point on the horizon, with evenly spaced cross ties that grow smaller and closer together as distance increases. A railroad track illustrates how perspective projection compresses depth into a vanishing point.</desc>

  <!-- Orange top strip -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Header -->
  <text x="400" y="48" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="currentColor">Perspective Projection</text>
  <text x="400" y="74" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="currentColor" opacity="0.7">Parallel lines converge toward a vanishing point on the horizon</text>

  <!-- Operation badge -->
  <text x="400" y="118" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FF6B00" letter-spacing="1.5">PROJECTION MODE</text>
  <text x="400" y="142" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="currentColor">Perspective</text>
  <text x="400" y="164" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="currentColor" opacity="0.7">Toggle with Numpad 5</text>

  <!-- Sky and ground subtle separation -->
  <rect x="100" y="190" width="600" height="50" fill="currentColor" fill-opacity="0.02"/>
  <rect x="100" y="240" width="600" height="200" fill="currentColor" fill-opacity="0.04"/>

  <!-- Horizon line, dashed -->
  <line x1="100" y1="240" x2="700" y2="240" stroke="currentColor" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="710" y="244" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="currentColor" opacity="0.55" letter-spacing="0.5">HORIZON</text>

  <!-- Cross ties, drawn first so rails sit on top -->
  <line x1="170" y1="420" x2="630" y2="420" stroke="currentColor" stroke-opacity="0.55" stroke-width="2"/>
  <line x1="221" y1="380" x2="579" y2="380" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.8"/>
  <line x1="272" y1="340" x2="528" y2="340" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.6"/>
  <line x1="323" y1="300" x2="477" y2="300" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.4"/>
  <line x1="362" y1="270" x2="438" y2="270" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2"/>
  <line x1="385" y1="252" x2="415" y2="252" stroke="currentColor" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Rails -->
  <line x1="170" y1="420" x2="400" y2="240" stroke="#FF6B00" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="630" y1="420" x2="400" y2="240" stroke="#FF6B00" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Vanishing point -->
  <circle cx="400" cy="240" r="7" fill="#FF6B00"/>
  <circle cx="400" cy="240" r="3" fill="#ffffff"/>
  <text x="400" y="218" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FF6B00" letter-spacing="0.8">VANISHING POINT</text>

  <!-- Side annotations: depth callouts -->
  <line x1="640" y1="420" x2="670" y2="420" stroke="currentColor" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="675" y="424" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="currentColor" opacity="0.7">Near</text>

  <line x1="588" y1="380" x2="670" y2="380" stroke="currentColor" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="675" y="384" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="currentColor" opacity="0.6">Mid</text>

  <line x1="445" y1="270" x2="670" y2="270" stroke="currentColor" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="675" y="274" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="currentColor" opacity="0.55">Far</text>

  <!-- Insets at y=452 -->
  <rect x="68" y="446" width="320" height="56" rx="8" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>
  <text x="86" y="466" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="currentColor" opacity="0.75" letter-spacing="0.8">PERSPECTIVE EFFECT</text>
  <text x="86" y="486" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="currentColor" opacity="0.85">Distant objects shrink, parallel lines</text>
  <text x="86" y="500" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="currentColor" opacity="0.85">converge, depth reads as natural sight</text>

  <rect x="412" y="446" width="320" height="56" rx="8" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>
  <text x="430" y="466" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="currentColor" opacity="0.75" letter-spacing="0.8">WHEN TO USE</text>
  <text x="430" y="486" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="currentColor" opacity="0.85">Final renders, camera framing, scenes</text>
  <text x="430" y="500" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="currentColor" opacity="0.85">where depth should feel cinematic</text>

  <!-- Footer tip -->
  <rect x="68" y="514" width="664" height="34" rx="8" fill="#FF6B00" fill-opacity="0.10" stroke="#FF6B00" stroke-opacity="0.4" stroke-width="1"/>
  <text x="86" y="528" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FF6B00" letter-spacing="1.5">TIP</text>
  <text x="86" y="542" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="currentColor" opacity="0.85">Perspective is the default for new scenes. It matches how the human eye sees, ideal for previews and cinematics.</text>
</svg>
