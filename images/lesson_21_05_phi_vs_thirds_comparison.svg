<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="pt-title pt-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="pt-title">Phi grid versus rule of thirds</title>
  <desc id="pt-desc">A single frame with two overlaid grids. The rule-of-thirds grid divides the frame at 33.3 and 66.7 percent in cyan. The phi grid divides it at 38.2 and 61.8 percent in gold. The phi lines sit slightly closer to the frame center, shown by the small gap between each pair.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">PHI GRID vs RULE OF THIRDS</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">The golden ratio pulls the dividing lines a little closer to center</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ============ Framed overlaid grids ============ -->
  <!-- frame x 150..610 (w 460), y 150..454 (h 304) -->
  <!-- thirds verticals: 150 + 460/3 = 303.33 ; 456.67 ; horizontals: 150 + 304/3 = 251.33 ; 352.67 -->
  <!-- phi verticals: 150 + 460*0.382 = 325.72 ; 150 + 460*0.618 = 434.28 ; horizontals: 150 + 304*0.382 = 266.13 ; 150 + 304*0.618 = 337.87 -->

  <rect x="150" y="150" width="460" height="304" rx="4"
        fill="currentColor" fill-opacity="0.03"
        stroke="currentColor" stroke-opacity="0.4" stroke-width="2"/>

  <!-- Rule-of-thirds grid (cyan) -->
  <g stroke="#00BCD4" stroke-width="2" opacity="0.9">
    <line x1="303.33" y1="150" x2="303.33" y2="454"/>
    <line x1="456.67" y1="150" x2="456.67" y2="454"/>
    <line x1="150" y1="251.33" x2="610" y2="251.33"/>
    <line x1="150" y1="352.67" x2="610" y2="352.67"/>
  </g>

  <!-- Phi grid (gold) -->
  <g stroke="#FFD700" stroke-width="2" opacity="0.95">
    <line x1="325.72" y1="150" x2="325.72" y2="454"/>
    <line x1="434.28" y1="150" x2="434.28" y2="454"/>
    <line x1="150" y1="266.13" x2="610" y2="266.13"/>
    <line x1="150" y1="337.87" x2="610" y2="337.87"/>
  </g>

  <!-- Difference highlight: subtle red band between the left vertical pair (303.33..325.72) -->
  <rect x="303.33" y="150" width="22.39" height="304" fill="#E63946" opacity="0.10"/>
  <rect x="434.28" y="150" width="22.39" height="304" fill="#E63946" opacity="0.10"/>

  <!-- Percentage markers above frame: thirds (cyan) -->
  <g font-size="11" text-anchor="middle">
    <text x="303.33" y="142" fill="#0097a7">33.3%</text>
    <text x="456.67" y="142" fill="#0097a7">66.7%</text>
  </g>
  <!-- phi (gold) below frame -->
  <g font-size="11" text-anchor="middle" fill="#b89500">
    <text x="325.72" y="472">38.2%</text>
    <text x="434.28" y="472">61.8%</text>
  </g>

  <!-- ============ Legend (bottom) ============ -->
  <g font-size="13">
    <rect x="150" y="486" width="24" height="4" fill="#00BCD4"/>
    <text x="182" y="491" fill="currentColor">Rule of thirds &#183; 1 : 1 : 1 spacing</text>

    <rect x="420" y="486" width="24" height="4" fill="#FFD700"/>
    <text x="452" y="491" fill="currentColor">Phi grid &#183; 1 : 1.618 spacing</text>
  </g>

  <!-- Footer tip callout (Variant B, left rail) -->
  <rect x="40" y="516" width="720" height="34" fill="none"/>
  <rect x="40" y="516" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="538" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> The difference is small. Thirds is easier to eyeball; phi reads as slightly tighter and more refined.
  </text>
</svg>
