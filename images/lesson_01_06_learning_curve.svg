<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="lc-title lc-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="lc-title">The Realistic Learning Curve</title>
  <desc id="lc-desc">A line graph showing how skill develops over time when learning Blender. Rapid initial progress is followed by a first plateau, then a breakthrough to a new level, then steady growth, then a second longer plateau, then a major breakthrough, ending at proficiency. Plateaus are normal and lead to breakthroughs.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">The Learning Curve, Honestly</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Progress isn&#8217;t a straight line &#8212; and that&#8217;s good news.</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Y axis label rotated -->
  <text x="40" y="305" font-size="12" font-weight="600" fill="currentColor" opacity="0.65"
        text-anchor="middle" transform="rotate(-90 40 305)">Skill Level</text>

  <!-- Y axis line -->
  <line x1="110" y1="170" x2="110" y2="440" stroke="currentColor" stroke-width="1" opacity="0.4"/>

  <!-- Y axis ticks -->
  <g stroke="currentColor" stroke-width="1" opacity="0.25">
    <line x1="106" y1="440" x2="110" y2="440"/>
    <line x1="106" y1="372" x2="110" y2="372"/>
    <line x1="106" y1="305" x2="110" y2="305"/>
    <line x1="106" y1="237" x2="110" y2="237"/>
    <line x1="106" y1="170" x2="110" y2="170"/>
  </g>

  <!-- Y axis labels -->
  <g font-size="11" fill="currentColor" opacity="0.55" text-anchor="end">
    <text x="100" y="444">0</text>
    <text x="100" y="376">25</text>
    <text x="100" y="309">50</text>
    <text x="100" y="241">75</text>
    <text x="100" y="174">100</text>
  </g>

  <!-- X axis line -->
  <line x1="110" y1="440" x2="700" y2="440" stroke="currentColor" stroke-width="1" opacity="0.4"/>

  <!-- X axis labels -->
  <g font-size="11" fill="currentColor" opacity="0.55" text-anchor="middle">
    <text x="110" y="460">Day 1</text>
    <text x="200" y="460">Week 1</text>
    <text x="320" y="460">Month 3</text>
    <text x="430" y="460">Month 6</text>
    <text x="555" y="460">Year 1</text>
    <text x="685" y="460">Year 2+</text>
  </g>

  <!-- X axis title -->
  <text x="405" y="488" font-size="12" font-weight="600" fill="currentColor" opacity="0.65" text-anchor="middle">Time Practicing &#8594;</text>

  <!-- Plateau reference dashed lines -->
  <g stroke="#FF6B00" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.45" fill="none">
    <line x1="250" y1="333" x2="340" y2="333"/>
    <line x1="430" y1="273" x2="560" y2="273"/>
  </g>

  <!-- The learning curve -->
  <path d="M 110 440 C 130 420 160 360 175 345 L 250 333 L 300 333 C 320 333 335 305 340 292 L 430 273 L 510 273 C 530 273 545 230 560 220 L 620 203 L 690 192"
        fill="none" stroke="#FF6B00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- First breakthrough star (small) -->
  <path transform="translate(340, 292) scale(0.5)"
        d="M 0 -20 L 4.7 -6.47 L 19.02 -6.18 L 7.6 2.47 L 11.76 16.18 L 0 8 L -11.76 16.18 L -7.6 2.47 L -19.02 -6.18 L -4.7 -6.47 Z"
        fill="#F5C242"/>

  <!-- Major breakthrough star (large) -->
  <path transform="translate(560, 220) scale(0.85)"
        d="M 0 -20 L 4.7 -6.47 L 19.02 -6.18 L 7.6 2.47 L 11.76 16.18 L 0 8 L -11.76 16.18 L -7.6 2.47 L -19.02 -6.18 L -4.7 -6.47 Z"
        fill="#F5C242"/>

  <!-- Plateau labels -->
  <text x="295" y="324" font-size="11" font-style="italic" fill="currentColor" opacity="0.6" text-anchor="middle">First Plateau</text>
  <text x="495" y="264" font-size="11" font-style="italic" fill="currentColor" opacity="0.6" text-anchor="middle">The Long Plateau</text>

  <!-- Breakthrough callouts -->
  <text x="365" y="282" font-size="11" font-weight="600" fill="#FF6B00" opacity="0.85">Breakthrough!</text>
  <text x="585" y="210" font-size="12" font-weight="700" fill="#FF6B00" opacity="0.9">Big Breakthrough!</text>

  <!-- Start label "you are here" -->
  <text x="125" y="430" font-size="10" font-style="italic" fill="currentColor" opacity="0.5">you start here</text>

  <!-- Proficiency callout -->
  <text x="685" y="180" font-size="11" font-weight="600" fill="currentColor" opacity="0.75" text-anchor="end">Proficiency</text>

  <!-- Footer tip -->
  <rect x="40" y="506" width="720" height="34" rx="6" fill="#FF6B00" fill-opacity="0.10" stroke="#FF6B00" stroke-opacity="0.4"/>
  <text x="54" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Plateaus are normal &#8212; they mean your brain is consolidating before the next leap.
  </text>
</svg>
