<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" role="img" aria-labelledby="vls-title vls-desc" color="#222" font-family="'Segoe UI',system-ui,sans-serif">
<title id="vls-title">Common view layer setups</title>
<desc id="vls-desc">Four professional view layer patterns. Basic uses a single Beauty layer with all collections and passes for most projects. Character plus Environment split renders the character and the background as separate layers to composite later. Multi-pass VFX splits Beauty, Shadows, Reflections, and ambient occlusion into layers composited with full control. Preview plus Final pairs a low-sample test layer with a high-sample production layer.</desc>
<text x="440" y="34" text-anchor="middle" font-size="23" font-weight="700" fill="currentColor">Common View Layer Setups</text>
<text x="440" y="58" text-anchor="middle" font-size="13.5" fill="currentColor" opacity="0.75">Four professional patterns &#8212; pick the one that matches your render goal</text>

<!-- Card 1: Basic -->
<g>
<rect x="24" y="82" width="410" height="228" rx="9" fill="#2a2a2a" stroke="#4ADE80" stroke-width="1.3"/>
<rect x="24" y="82" width="6" height="228" rx="3" fill="#4ADE80"/>
<text x="48" y="110" font-size="15" font-weight="700" fill="#4ADE80">1 &#183; Basic Setup</text>
<text x="418" y="110" text-anchor="end" font-size="10.5" fill="#4ADE80" opacity="0.85">good for most projects</text>
<rect x="48" y="126" width="362" height="42" rx="6" fill="#1e1e1e"/>
<text x="60" y="145" font-size="12.5" fill="#4ADE80" font-weight="700" font-family="'Consolas','Courier New',monospace">"Beauty"</text>
<text x="60" y="161" font-size="11" fill="#d4d4d4">All collections &#183; all render passes enabled</text>
<text x="48" y="196" font-size="11.5" fill="#d4d4d4">&#9642; One single main final render</text>
<text x="48" y="218" font-size="11.5" fill="#d4d4d4">&#9642; Simplest to set up and manage</text>
<text x="48" y="240" font-size="11.5" fill="#d4d4d4">&#9642; No compositing juggling required</text>
<rect x="48" y="258" width="362" height="38" rx="6" fill="#1e1e1e" stroke="#4ADE80" stroke-width="0.7"/>
<text x="60" y="281" font-size="11" fill="#4ADE80">Best when: single clean output is all you need.</text>
</g>

<!-- Card 2: Character + Environment Split -->
<g>
<rect x="446" y="82" width="410" height="228" rx="9" fill="#2a2a2a" stroke="#4A9EFF" stroke-width="1.3"/>
<rect x="446" y="82" width="6" height="228" rx="3" fill="#4A9EFF"/>
<text x="470" y="110" font-size="15" font-weight="700" fill="#4A9EFF">2 &#183; Character + Environment</text>
<rect x="470" y="126" width="176" height="70" rx="6" fill="#1e1e1e"/>
<text x="482" y="145" font-size="12" fill="#4A9EFF" font-weight="700" font-family="'Consolas','Courier New',monospace">"Character"</text>
<text x="482" y="163" font-size="10.5" fill="#d4d4d4">only character collection</text>
<text x="482" y="180" font-size="10.5" fill="#d4d4d4">renders isolated</text>
<rect x="656" y="126" width="188" height="70" rx="6" fill="#1e1e1e"/>
<text x="668" y="145" font-size="12" fill="#B47EE8" font-weight="700" font-family="'Consolas','Courier New',monospace">"Environment"</text>
<text x="668" y="163" font-size="10.5" fill="#d4d4d4">only background</text>
<text x="668" y="180" font-size="10.5" fill="#d4d4d4">renders separately</text>
<text x="470" y="224" font-size="11.5" fill="#d4d4d4">&#9642; Composite character over environment later</text>
<text x="470" y="246" font-size="11.5" fill="#d4d4d4">&#9642; Adjust each element independently in comp</text>
<rect x="470" y="258" width="374" height="38" rx="6" fill="#1e1e1e" stroke="#4A9EFF" stroke-width="0.7"/>
<text x="482" y="281" font-size="11" fill="#4A9EFF">Best when: foreground and background need separate control.</text>
</g>

<!-- Card 3: Multi-Pass VFX -->
<g>
<rect x="24" y="326" width="410" height="234" rx="9" fill="#2a2a2a" stroke="#F5C242" stroke-width="1.3"/>
<rect x="24" y="326" width="6" height="234" rx="3" fill="#F5C242"/>
<text x="48" y="354" font-size="15" font-weight="700" fill="#F5C242">3 &#183; Multi-Pass VFX</text>
<text x="418" y="354" text-anchor="end" font-size="10.5" fill="#F5C242" opacity="0.85">maximum control</text>
<text x="48" y="386" font-size="12" fill="#d4d4d4" font-family="'Consolas','Courier New',monospace"><tspan fill="#4ADE80">"Beauty"</tspan> &#8594; full scene, all passes</text>
<text x="48" y="410" font-size="12" fill="#d4d4d4" font-family="'Consolas','Courier New',monospace"><tspan fill="#B47EE8">"Shadows"</tspan> &#8594; shadow pass only</text>
<text x="48" y="434" font-size="12" fill="#d4d4d4" font-family="'Consolas','Courier New',monospace"><tspan fill="#4A9EFF">"Reflections"</tspan> &#8594; glossy pass only</text>
<text x="48" y="458" font-size="12" fill="#d4d4d4" font-family="'Consolas','Courier New',monospace"><tspan fill="#FF6B00">"AO"</tspan> &#8594; ambient occlusion pass</text>
<rect x="48" y="474" width="362" height="66" rx="6" fill="#1e1e1e" stroke="#F5C242" stroke-width="0.7"/>
<text x="60" y="496" font-size="11" fill="#F5C242" font-weight="700">Composite all layers with full control over each.</text>
<text x="60" y="516" font-size="10.5" fill="#d4d4d4">Industry standard &#8212; a complex shot may carry</text>
<text x="60" y="532" font-size="10.5" fill="#d4d4d4">10&#8211;20 view layers.</text>
</g>

<!-- Card 4: Preview + Final -->
<g>
<rect x="446" y="326" width="410" height="234" rx="9" fill="#2a2a2a" stroke="#FF6B00" stroke-width="1.3"/>
<rect x="446" y="326" width="6" height="234" rx="3" fill="#FF6B00"/>
<text x="470" y="354" font-size="15" font-weight="700" fill="#FF6B00">4 &#183; Preview + Final</text>
<rect x="470" y="370" width="176" height="96" rx="6" fill="#1e1e1e"/>
<text x="482" y="390" font-size="12" fill="#F5C242" font-weight="700" font-family="'Consolas','Courier New',monospace">"Preview"</text>
<text x="482" y="410" font-size="10.5" fill="#d4d4d4">low sample count</text>
<text x="482" y="428" font-size="10.5" fill="#d4d4d4">simplified passes</text>
<text x="482" y="446" font-size="10.5" fill="#d4d4d4">quick test renders</text>
<rect x="656" y="370" width="188" height="96" rx="6" fill="#1e1e1e"/>
<text x="668" y="390" font-size="12" fill="#4ADE80" font-weight="700" font-family="'Consolas','Courier New',monospace">"Final"</text>
<text x="668" y="410" font-size="10.5" fill="#d4d4d4">high sample count</text>
<text x="668" y="428" font-size="10.5" fill="#d4d4d4">all passes enabled</text>
<text x="668" y="446" font-size="10.5" fill="#d4d4d4">production quality</text>
<rect x="470" y="482" width="374" height="58" rx="6" fill="#1e1e1e" stroke="#FF6B00" stroke-width="0.7"/>
<text x="482" y="504" font-size="11" fill="#FF6B00" font-weight="700">Iterate on Preview, switch to Final for delivery.</text>
<text x="482" y="524" font-size="10.5" fill="#d4d4d4">Don't waste time rendering what you don't need.</text>
</g>
</svg>
