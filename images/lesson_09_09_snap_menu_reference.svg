<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" color="#222" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="sm-title sm-desc">
  <title id="sm-title">Shift+S Snap Menu Quick Reference</title>
  <desc id="sm-desc">Reference card for the six most-used Blender Shift+S snap menu operations, color coded by category: cursor operations in blue and selection operations in orange. Each row shows an icon, the operation name, and a one-line use case.</desc>

  <!-- background -->
  <rect x="0" y="0" width="800" height="680" rx="14" fill="#0f1a14"/>

  <!-- top brand accent strip -->
  <rect x="0" y="0" width="800" height="8" rx="4" fill="#FF6B00"/>

  <!-- header -->
  <text x="40" y="58" font-size="30" font-weight="700" fill="#f5f7f6">Shift+S Snap Menu</text>
  <text x="40" y="88" font-size="17" font-weight="500" fill="#9aa6a0">Quick reference · 6 most-used snap operations</text>

  <!-- legend -->
  <g font-size="14" font-weight="600">
    <circle cx="476" cy="52" r="7" fill="#4A9EFF"/>
    <text x="490" y="57" fill="#9aa6a0">Cursor ops</text>
    <circle cx="596" cy="52" r="7" fill="#FF6B00"/>
    <text x="610" y="57" fill="#9aa6a0">Selection ops</text>
  </g>

  <!-- divider under header -->
  <line x1="40" y1="108" x2="760" y2="108" stroke="#2a3a30" stroke-width="2"/>

  <!-- ===== ROWS ===== -->
  <!-- Row geometry: icon tile 56x56 at x=44; name + use case to the right; accent bar at left edge by category -->

  <!-- Row 1 · Selection to Cursor (selection · orange) -->
  <g>
    <rect x="40" y="128" width="720" height="76" rx="10" fill="#13211b"/>
    <rect x="40" y="128" width="6" height="76" rx="3" fill="#FF6B00"/>
    <!-- icon: selection (square) pulled toward cursor crosshair -->
    <g transform="translate(64,144)">
      <rect x="0" y="14" width="22" height="22" rx="2" fill="none" stroke="#FF6B00" stroke-width="3"/>
      <line x1="40" y1="6" x2="40" y2="46" stroke="#FF6B00" stroke-width="2.5"/>
      <line x1="20" y1="26" x2="60" y2="26" stroke="#FF6B00" stroke-width="2.5"/>
      <circle cx="40" cy="26" r="6" fill="none" stroke="#FF6B00" stroke-width="2.5"/>
      <path d="M24 26 L34 26" stroke="#FF6B00" stroke-width="3" marker-end="url(#sm-arrow-o)"/>
    </g>
    <text x="148" y="160" font-size="19" font-weight="700" fill="#f5f7f6">Selection to Cursor</text>
    <text x="148" y="186" font-size="15" fill="#9aa6a0">Move selected objects onto the 3D cursor · gather parts to one point</text>
  </g>

  <!-- Row 2 · Cursor to Selected (cursor · blue) -->
  <g>
    <rect x="40" y="212" width="720" height="76" rx="10" fill="#13211b"/>
    <rect x="40" y="212" width="6" height="76" rx="3" fill="#4A9EFF"/>
    <g transform="translate(64,228)">
      <rect x="36" y="14" width="22" height="22" rx="2" fill="none" stroke="#4A9EFF" stroke-width="3"/>
      <line x1="14" y1="6" x2="14" y2="46" stroke="#4A9EFF" stroke-width="2.5"/>
      <line x1="-6" y1="26" x2="34" y2="26" stroke="#4A9EFF" stroke-width="2.5"/>
      <circle cx="14" cy="26" r="6" fill="none" stroke="#4A9EFF" stroke-width="2.5"/>
      <path d="M40 26 L26 26" stroke="#4A9EFF" stroke-width="3" marker-end="url(#sm-arrow-b)"/>
    </g>
    <text x="148" y="244" font-size="19" font-weight="700" fill="#f5f7f6">Cursor to Selected</text>
    <text x="148" y="270" font-size="15" fill="#9aa6a0">Place the 3D cursor at the selection center · set a pivot or spawn point</text>
  </g>

  <!-- Row 3 · Cursor to World Origin (cursor · blue) -->
  <g>
    <rect x="40" y="296" width="720" height="76" rx="10" fill="#13211b"/>
    <rect x="40" y="296" width="6" height="76" rx="3" fill="#4A9EFF"/>
    <g transform="translate(64,312)">
      <line x1="26" y1="6" x2="26" y2="46" stroke="#4A9EFF" stroke-width="2.5"/>
      <line x1="6" y1="26" x2="46" y2="26" stroke="#4A9EFF" stroke-width="2.5"/>
      <circle cx="26" cy="26" r="7" fill="none" stroke="#4A9EFF" stroke-width="2.5"/>
      <circle cx="26" cy="26" r="2.5" fill="#F5C242"/>
    </g>
    <text x="148" y="328" font-size="19" font-weight="700" fill="#f5f7f6">Cursor to World Origin</text>
    <text x="148" y="354" font-size="15" fill="#9aa6a0">Reset the 3D cursor to (0, 0, 0) · return to a known reference</text>
  </g>

  <!-- Row 4 · Selection to Grid (selection · orange) -->
  <g>
    <rect x="40" y="380" width="720" height="76" rx="10" fill="#13211b"/>
    <rect x="40" y="380" width="6" height="76" rx="3" fill="#FF6B00"/>
    <g transform="translate(64,396)">
      <line x1="4" y1="12" x2="52" y2="12" stroke="#3a4a40" stroke-width="1.5"/>
      <line x1="4" y1="28" x2="52" y2="28" stroke="#3a4a40" stroke-width="1.5"/>
      <line x1="4" y1="44" x2="52" y2="44" stroke="#3a4a40" stroke-width="1.5"/>
      <line x1="12" y1="4" x2="12" y2="52" stroke="#3a4a40" stroke-width="1.5"/>
      <line x1="28" y1="4" x2="28" y2="52" stroke="#3a4a40" stroke-width="1.5"/>
      <line x1="44" y1="4" x2="44" y2="52" stroke="#3a4a40" stroke-width="1.5"/>
      <rect x="33" y="17" width="22" height="22" rx="2" fill="none" stroke="#FF6B00" stroke-width="3"/>
      <circle cx="28" cy="28" r="4" fill="#FF6B00"/>
    </g>
    <text x="148" y="412" font-size="19" font-weight="700" fill="#f5f7f6">Selection to Grid</text>
    <text x="148" y="438" font-size="15" fill="#9aa6a0">Snap selected objects to the nearest grid points · clean axis-aligned layout</text>
  </g>

  <!-- Row 5 · Selection to Active (selection · orange) -->
  <g>
    <rect x="40" y="464" width="720" height="76" rx="10" fill="#13211b"/>
    <rect x="40" y="464" width="6" height="76" rx="3" fill="#FF6B00"/>
    <g transform="translate(64,480)">
      <rect x="0" y="14" width="20" height="20" rx="2" fill="none" stroke="#FF6B00" stroke-width="2.5"/>
      <rect x="36" y="14" width="22" height="22" rx="2" fill="#FF6B00" fill-opacity="0.18" stroke="#F5C242" stroke-width="3"/>
      <path d="M24 26 L34 26" stroke="#FF6B00" stroke-width="3" marker-end="url(#sm-arrow-o)"/>
    </g>
    <text x="148" y="496" font-size="19" font-weight="700" fill="#f5f7f6">Selection to Active</text>
    <text x="148" y="522" font-size="15" fill="#9aa6a0">Snap the selection onto the active object (yellow) · align to a chosen anchor</text>
  </g>

  <!-- Row 6 · Cursor to Grid (cursor · blue) -->
  <g>
    <rect x="40" y="548" width="720" height="76" rx="10" fill="#13211b"/>
    <rect x="40" y="548" width="6" height="76" rx="3" fill="#4A9EFF"/>
    <g transform="translate(64,564)">
      <line x1="4" y1="12" x2="52" y2="12" stroke="#3a4a40" stroke-width="1.5"/>
      <line x1="4" y1="28" x2="52" y2="28" stroke="#3a4a40" stroke-width="1.5"/>
      <line x1="4" y1="44" x2="52" y2="44" stroke="#3a4a40" stroke-width="1.5"/>
      <line x1="12" y1="4" x2="12" y2="52" stroke="#3a4a40" stroke-width="1.5"/>
      <line x1="28" y1="4" x2="28" y2="52" stroke="#3a4a40" stroke-width="1.5"/>
      <line x1="44" y1="4" x2="44" y2="52" stroke="#3a4a40" stroke-width="1.5"/>
      <line x1="28" y1="18" x2="28" y2="38" stroke="#4A9EFF" stroke-width="2.5"/>
      <line x1="18" y1="28" x2="38" y2="28" stroke="#4A9EFF" stroke-width="2.5"/>
      <circle cx="28" cy="28" r="5.5" fill="none" stroke="#4A9EFF" stroke-width="2.5"/>
    </g>
    <text x="148" y="580" font-size="19" font-weight="700" fill="#f5f7f6">Cursor to Grid</text>
    <text x="148" y="606" font-size="15" fill="#9aa6a0">Snap the 3D cursor to the nearest grid point · precise cursor placement</text>
  </g>

  <!-- footer tip rail -->
  <g>
    <rect x="40" y="640" width="6" height="26" rx="3" fill="#F5C242"/>
    <text x="58" y="659" font-size="14" font-weight="600" fill="#9aa6a0">Tip · press Shift+S in the viewport · the pie menu puts each option under a direction for fast muscle memory</text>
  </g>

  <!-- arrow markers -->
  <defs>
    <marker id="sm-arrow-o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#FF6B00"/>
    </marker>
    <marker id="sm-arrow-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4A9EFF"/>
    </marker>
  </defs>
</svg>
