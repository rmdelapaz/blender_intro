<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="fixTitle fixDesc" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" color="#222">
  <title id="fixTitle">Common Fixes: Before and After</title>
  <desc id="fixDesc">A grid of four common render problems and their post-processing fix, each shown as a before and after pair. Underexposure fixed by raising exposure and lifting shadows. Fireflies, the bright noise dots from glossy paths, removed with a denoise or despeckle pass. A color cast neutralized by correcting white balance. A soft image crispened with a subtle sharpen. Each cell labels the problem and the tool that fixes it.</desc>
  <style>
    .hd{fill:currentColor;font-size:19px;font-weight:700;}
    .sub{fill:#9aa4b2;font-size:11px;}
    .pn{fill:#ffffff;font-size:12px;font-weight:700;}
    .ba{fill:#9aa4b2;font-size:9px;font-weight:700;}
    .tool{fill:#F5C242;font-size:9.5px;font-weight:700;}
  </style>
  <text x="20" y="34" class="hd">Common fixes at a glance</text>
  <text x="20" y="54" class="sub">Four problems you will hit often &#8212; each with the before, the after, and the tool that gets you there.</text>

  <!-- cell 1 Underexposure -->
  <rect x="20" y="72" width="350" height="150" rx="8" fill="#1b1b1b" stroke="#E63946" stroke-width="1.5"/>
  <text x="34" y="92" class="pn">Underexposed</text>
  <text x="34" y="214" class="tool">FIX: raise exposure + lift shadows</text>
  <rect x="34" y="102" width="150" height="96" rx="4" fill="#0a0a0a"/>
  <circle cx="109" cy="150" r="28" fill="#1c1c22"/>
  <text x="98" y="118" class="ba" fill="#E63946">BEFORE</text>
  <rect x="200" y="102" width="150" height="96" rx="4" fill="#1a1a1a"/>
  <circle cx="275" cy="150" r="28" fill="#6a6a76"/>
  <text x="268" y="118" class="ba" fill="#4ADE80">AFTER</text>

  <!-- cell 2 Fireflies -->
  <rect x="390" y="72" width="350" height="150" rx="8" fill="#1b1b1b" stroke="#E63946" stroke-width="1.5"/>
  <text x="404" y="92" class="pn">Fireflies (glossy noise)</text>
  <text x="404" y="214" class="tool">FIX: denoise / despeckle pass</text>
  <rect x="404" y="102" width="150" height="96" rx="4" fill="#14141a"/>
  <circle cx="479" cy="150" r="28" fill="#33343f"/>
  <circle cx="450" cy="120" r="2" fill="#fff"/>
  <circle cx="500" cy="135" r="2.5" fill="#fff"/>
  <circle cx="470" cy="175" r="2" fill="#fff"/>
  <circle cx="515" cy="170" r="2" fill="#fff"/>
  <circle cx="440" cy="160" r="1.5" fill="#fff"/>
  <text x="468" y="118" class="ba" fill="#E63946">BEFORE</text>
  <rect x="570" y="102" width="150" height="96" rx="4" fill="#14141a"/>
  <circle cx="645" cy="150" r="28" fill="#33343f"/>
  <text x="638" y="118" class="ba" fill="#4ADE80">AFTER</text>

  <!-- cell 3 Color cast -->
  <rect x="20" y="234" width="350" height="150" rx="8" fill="#1b1b1b" stroke="#E63946" stroke-width="1.5"/>
  <text x="34" y="254" class="pn">Color cast</text>
  <text x="34" y="376" class="tool">FIX: correct white balance</text>
  <rect x="34" y="264" width="150" height="96" rx="4" fill="#243a1e"/>
  <circle cx="109" cy="312" r="28" fill="#3c5230"/>
  <text x="98" y="280" class="ba" fill="#E63946">BEFORE</text>
  <rect x="200" y="264" width="150" height="96" rx="4" fill="#2a2a2a"/>
  <circle cx="275" cy="312" r="28" fill="#5a5a5a"/>
  <text x="268" y="280" class="ba" fill="#4ADE80">AFTER</text>

  <!-- cell 4 Soft image -->
  <rect x="390" y="234" width="350" height="150" rx="8" fill="#1b1b1b" stroke="#E63946" stroke-width="1.5"/>
  <text x="404" y="254" class="pn">Too soft</text>
  <text x="404" y="376" class="tool">FIX: subtle sharpen (avoid halos)</text>
  <rect x="404" y="264" width="150" height="96" rx="4" fill="#1a1a1a"/>
  <circle cx="479" cy="312" r="28" fill="#565660" opacity="0.6"/>
  <text x="468" y="280" class="ba" fill="#E63946">BEFORE</text>
  <rect x="570" y="264" width="150" height="96" rx="4" fill="#1a1a1a"/>
  <circle cx="645" cy="312" r="28" fill="#565660"/>
  <circle cx="645" cy="312" r="28" fill="none" stroke="#8a8a96" stroke-width="1"/>
  <text x="638" y="280" class="ba" fill="#4ADE80">AFTER</text>
</svg>
