<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="cvgTitle cvgDesc" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" color="#222">
  <title id="cvgTitle">Correction versus Grading</title>
  <desc id="cvgDesc">A split panel contrasting two stages of color work. Color Correction on the left is technical and neutral: fixing exposure, white balance, and contrast so the image reads correctly and matches other shots. Color Grading on the right is creative and stylistic: pushing mood, palette, and look, such as teal shadows with warm highlights. Correction comes first and is objective; grading comes second and is subjective.</desc>
  <style>
    .hd{fill:currentColor;font-size:19px;font-weight:700;}
    .sub{fill:#9aa4b2;font-size:11px;}
    .ph{fill:#ffffff;font-size:15px;font-weight:700;}
    .tag{fill:#0f0f0f;font-size:10px;font-weight:700;}
    .li{fill:#d4d4d4;font-size:11px;}
    .ft{fill:#9aa4b2;font-size:10px;font-style:italic;}
  </style>
  <text x="20" y="34" class="hd">Correction vs grading</text>
  <text x="20" y="54" class="sub">Two different jobs, done in order: get it right, then give it a look.</text>

  <!-- correction panel -->
  <rect x="20" y="72" width="345" height="300" rx="8" fill="#1b1b1b" stroke="#4A9EFF" stroke-width="2"/>
  <rect x="20" y="72" width="345" height="34" rx="8" fill="#4A9EFF"/>
  <text x="36" y="95" class="ph">1 &#183; Color Correction</text>
  <rect x="250" y="80" width="105" height="18" rx="9" fill="#cfe0ff"/>
  <text x="262" y="93" class="tag">TECHNICAL</text>
  <text x="36" y="134" class="li">Goal: make it look <tspan fill="#4A9EFF" font-weight="700">right</tspan>.</text>
  <text x="36" y="164" class="li">&#8226; Fix exposure (too dark / blown)</text>
  <text x="36" y="192" class="li">&#8226; Neutralize white balance</text>
  <text x="36" y="220" class="li">&#8226; Set black &amp; white points</text>
  <text x="36" y="248" class="li">&#8226; Recover shadow / highlight detail</text>
  <text x="36" y="276" class="li">&#8226; Match shot to shot</text>
  <rect x="36" y="296" width="140" height="54" rx="5" fill="#0f0f0f"/>
  <rect x="36" y="296" width="70" height="54" rx="5" fill="#5b4636"/>
  <text x="188" y="322" class="ft">Off-cast fixed to</text>
  <text x="188" y="338" class="ft">neutral grays.</text>

  <!-- grading panel -->
  <rect x="395" y="72" width="345" height="300" rx="8" fill="#1b1b1b" stroke="#B47EE8" stroke-width="2"/>
  <rect x="395" y="72" width="345" height="34" rx="8" fill="#B47EE8"/>
  <text x="411" y="95" class="ph">2 &#183; Color Grading</text>
  <rect x="625" y="80" width="105" height="18" rx="9" fill="#2a1533"/>
  <text x="637" y="93" class="tag" fill="#e9d5ff">CREATIVE</text>
  <text x="411" y="134" class="li">Goal: give it a <tspan fill="#B47EE8" font-weight="700">look</tspan>.</text>
  <text x="411" y="164" class="li">&#8226; Push a palette (teal / orange)</text>
  <text x="411" y="192" class="li">&#8226; Set mood: warm, cold, bleak</text>
  <text x="411" y="220" class="li">&#8226; Stylize shadows &amp; highlights</text>
  <text x="411" y="248" class="li">&#8226; Add vignette / film emulation</text>
  <text x="411" y="276" class="li">&#8226; Support the story, not realism</text>
  <rect x="411" y="296" width="140" height="54" rx="5" fill="#0f0f0f"/>
  <rect x="411" y="296" width="70" height="54" rx="5" fill="#1e3a3a"/>
  <rect x="481" y="296" width="70" height="54" rx="5" fill="#4a3420"/>
  <text x="563" y="322" class="ft">Teal shadows,</text>
  <text x="563" y="338" class="ft">warm highlights.</text>
</svg>
