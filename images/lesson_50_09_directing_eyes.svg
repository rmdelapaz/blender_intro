<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="car09-title car09-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="car09-title">Directing the Eyes</title>
  <desc id="car09-desc">A diagram of how a character's gaze line guides the viewer and sells a thinking beat. The eyes dart to a target, hold, then shift, and the audience follows the same line, so where a character looks tells the audience what the character is thinking about.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Directing the Eyes</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">The audience looks where the character looks. Eyes lead the thought.</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Left: head with gaze lines -->
  <g>
    <text x="40" y="146" font-size="18" font-weight="600" fill="currentColor">The gaze line</text>
    <!-- head -->
    <circle cx="160" cy="290" r="72" fill="currentColor" opacity="0.06"/>
    <circle cx="160" cy="290" r="72" fill="none" stroke="currentColor" stroke-width="2" opacity="0.3"/>
    <!-- eyes -->
    <ellipse cx="138" cy="278" rx="15" ry="10" fill="#fff" stroke="currentColor" stroke-width="1.5" opacity="0.9"/>
    <ellipse cx="182" cy="278" rx="15" ry="10" fill="#fff" stroke="currentColor" stroke-width="1.5" opacity="0.9"/>
    <circle cx="146" cy="278" r="5" fill="#FF6B00"/>
    <circle cx="190" cy="278" r="5" fill="#FF6B00"/>
    <!-- gaze rays to target -->
    <line x1="146" y1="278" x2="360" y2="212" stroke="#FF6B00" stroke-width="2" stroke-dasharray="6 6" opacity="0.85"/>
    <line x1="190" y1="278" x2="360" y2="212" stroke="#FF6B00" stroke-width="2" stroke-dasharray="6 6" opacity="0.85"/>
    <circle cx="360" cy="212" r="12" fill="none" stroke="#FF6B00" stroke-width="2.5"/>
    <circle cx="360" cy="212" r="4" fill="#FF6B00"/>
    <text x="360" y="192" font-size="13" text-anchor="middle" font-weight="600" fill="#FF6B00">target</text>
    <text x="160" y="392" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.6">Both eyes converge on one point</text>
  </g>

  <!-- Right: thinking-beat timeline -->
  <g>
    <text x="440" y="146" font-size="18" font-weight="600" fill="currentColor">The thinking beat</text>
    <rect x="440" y="170" width="320" height="248" rx="8" fill="currentColor" opacity="0.04"/>

    <!-- step 1 dart -->
    <circle cx="470" cy="212" r="10" fill="#4A9EFF"/>
    <text x="470" y="217" font-size="12" text-anchor="middle" font-weight="700" fill="#fff">1</text>
    <text x="492" y="208" font-size="14" font-weight="600" fill="#4A9EFF">Dart</text>
    <text x="492" y="226" font-size="12" fill="currentColor" opacity="0.6">Eyes flick to the idea</text>

    <!-- step 2 hold -->
    <circle cx="470" cy="272" r="10" fill="#B47EE8"/>
    <text x="470" y="277" font-size="12" text-anchor="middle" font-weight="700" fill="#fff">2</text>
    <text x="492" y="268" font-size="14" font-weight="600" fill="#B47EE8">Hold</text>
    <text x="492" y="286" font-size="12" fill="currentColor" opacity="0.6">A beat of stillness lands the thought</text>

    <!-- step 3 shift -->
    <circle cx="470" cy="332" r="10" fill="#4ADE80"/>
    <text x="470" y="337" font-size="12" text-anchor="middle" font-weight="700" fill="#fff">3</text>
    <text x="492" y="328" font-size="14" font-weight="600" fill="#4ADE80">Shift</text>
    <text x="492" y="346" font-size="12" fill="currentColor" opacity="0.6">Gaze moves as the decision is made</text>

    <!-- connector -->
    <line x1="470" y1="222" x2="470" y2="322" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>

    <text x="600" y="398" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.6">Dart · hold · shift sells the think</text>
  </g>

  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Animate the eyes a frame or two before the head turn. Real eyes lead, and the head follows the look.</text>
</svg>
