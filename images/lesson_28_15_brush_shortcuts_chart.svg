<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bs-title bs-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="bs-title">Essential sculpting brush shortcuts</title>
  <desc id="bs-desc">Keyboard shortcut reference: four brush keys, two interactive adjust shortcuts, and two modifier keys.</desc>
  <g fill="none" stroke="currentColor" stroke-width="2" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

    <text x="380" y="34" text-anchor="middle" fill="currentColor" stroke="none" font-size="16" font-weight="700">Essential Brush Shortcuts</text>

    <!-- keycap helper rows: x positions for key, label, sublabel -->
    <!-- Group A: brushes -->
    <text x="60" y="74" fill="currentColor" stroke="none" font-size="12.5" font-weight="700" opacity="0.7">BRUSHES</text>

    <g font-size="13">
      <!-- X -->
      <rect x="60" y="86" width="46" height="40" rx="8" stroke-width="2"/>
      <text x="83" y="112" text-anchor="middle" fill="currentColor" stroke="none" font-size="16" font-weight="700">X</text>
      <text x="124" y="104" fill="currentColor" stroke="none" font-weight="600">Draw</text>
      <text x="124" y="120" fill="currentColor" stroke="none" font-size="11" opacity="0.7">the workhorse</text>

      <!-- G -->
      <rect x="400" y="86" width="46" height="40" rx="8" stroke-width="2"/>
      <text x="423" y="112" text-anchor="middle" fill="currentColor" stroke="none" font-size="16" font-weight="700">G</text>
      <text x="464" y="104" fill="currentColor" stroke="none" font-weight="600">Grab</text>
      <text x="464" y="120" fill="currentColor" stroke="none" font-size="11" opacity="0.7">move forms</text>

      <!-- S -->
      <rect x="60" y="140" width="46" height="40" rx="8" stroke-width="2"/>
      <text x="83" y="166" text-anchor="middle" fill="currentColor" stroke="none" font-size="16" font-weight="700">S</text>
      <text x="124" y="158" fill="currentColor" stroke="none" font-weight="600">Smooth</text>
      <text x="124" y="174" fill="currentColor" stroke="none" font-size="11" opacity="0.7">blend &amp; soften</text>

      <!-- C -->
      <rect x="400" y="140" width="46" height="40" rx="8" stroke-width="2"/>
      <text x="423" y="166" text-anchor="middle" fill="currentColor" stroke="none" font-size="16" font-weight="700">C</text>
      <text x="464" y="158" fill="currentColor" stroke="none" font-weight="600">Clay Strips</text>
      <text x="464" y="174" fill="currentColor" stroke="none" font-size="11" opacity="0.7">form building</text>
    </g>

    <line x1="60" y1="200" x2="700" y2="200" stroke-width="1" opacity="0.35"/>

    <!-- Group B: adjust -->
    <text x="60" y="228" fill="currentColor" stroke="none" font-size="12.5" font-weight="700" opacity="0.7">ADJUST (move mouse)</text>
    <g font-size="13">
      <!-- F -->
      <rect x="60" y="240" width="46" height="40" rx="8" stroke-width="2"/>
      <text x="83" y="266" text-anchor="middle" fill="currentColor" stroke="none" font-size="16" font-weight="700">F</text>
      <text x="124" y="258" fill="currentColor" stroke="none" font-weight="600">Brush size</text>
      <text x="124" y="274" fill="currentColor" stroke="none" font-size="11" opacity="0.7">radius</text>

      <!-- Shift+F -->
      <rect x="356" y="240" width="90" height="40" rx="8" stroke-width="2"/>
      <text x="401" y="266" text-anchor="middle" fill="currentColor" stroke="none" font-size="13" font-weight="700">Shift+F</text>
      <text x="464" y="258" fill="currentColor" stroke="none" font-weight="600">Brush strength</text>
      <text x="464" y="274" fill="currentColor" stroke="none" font-size="11" opacity="0.7">0.0 &#8211; 1.0</text>
    </g>

    <line x1="60" y1="300" x2="700" y2="300" stroke-width="1" opacity="0.35"/>

    <!-- Group C: modifiers (held) -->
    <text x="60" y="328" fill="currentColor" stroke="none" font-size="12.5" font-weight="700" opacity="0.7">MODIFIERS (hold)</text>
    <g font-size="13">
      <!-- Ctrl -->
      <rect x="60" y="340" width="68" height="40" rx="8" stroke-width="2"/>
      <text x="94" y="366" text-anchor="middle" fill="currentColor" stroke="none" font-size="14" font-weight="700">Ctrl</text>
      <text x="146" y="358" fill="currentColor" stroke="none" font-weight="600">Invert brush</text>
      <text x="146" y="374" fill="currentColor" stroke="none" font-size="11" opacity="0.7">push becomes pull</text>

      <!-- Shift -->
      <rect x="356" y="340" width="68" height="40" rx="8" stroke-width="2"/>
      <text x="390" y="366" text-anchor="middle" fill="currentColor" stroke="none" font-size="13" font-weight="700">Shift</text>
      <text x="442" y="358" fill="currentColor" stroke="none" font-weight="600">Temporary smooth</text>
      <text x="442" y="374" fill="currentColor" stroke="none" font-size="11" opacity="0.7">most used shortcut</text>
    </g>

    <text x="380" y="408" text-anchor="middle" fill="currentColor" stroke="none" font-size="11.5" opacity="0.7">Memorize these &#8212; they are your foundation</text>
  </g>
</svg>
