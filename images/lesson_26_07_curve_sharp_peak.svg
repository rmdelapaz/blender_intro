<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="cp-title cp-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="cp-title">Sharp-peak F&#183;Curve: instant direction change</title>
  <desc id="cp-desc">A Graph Editor F-curve that rises steeply from frame 1 value 0 to a sharp apex at frame 12 value 5, then falls steeply back to frame 24 value 0. The near-pointed peak means the value reverses direction almost instantly, the curve shape behind bounces and impacts.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">READING F&#183;CURVES &#183; SHARP PEAK</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">A sharp peak means an instant direction change &#183; bounce and impact behavior</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Gridlines -->
  <g stroke="currentColor" stroke-width="1" opacity="0.15">
    <line x1="110" y1="170" x2="110" y2="460"/>
    <line x1="415" y1="170" x2="415" y2="460"/>
    <line x1="720" y1="170" x2="720" y2="460"/>
    <line x1="110" y1="460" x2="720" y2="460"/>
    <line x1="110" y1="170" x2="720" y2="170"/>
  </g>

  <!-- Axes -->
  <g stroke="currentColor" stroke-width="1.5" opacity="0.4" stroke-linecap="round">
    <line x1="110" y1="170" x2="110" y2="460"/>
    <line x1="110" y1="460" x2="720" y2="460"/>
  </g>

  <!-- Axis labels + ticks -->
  <text x="110" y="478" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">1</text>
  <text x="415" y="478" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">12</text>
  <text x="720" y="478" font-size="13" fill="currentColor" opacity="0.6" text-anchor="middle">24</text>
  <text x="415" y="500" font-size="13" fill="currentColor" opacity="0.65" text-anchor="middle">Frame (time)</text>
  <text x="98" y="464" font-size="13" fill="currentColor" opacity="0.6" text-anchor="end">0</text>
  <text x="98" y="174" font-size="13" fill="currentColor" opacity="0.6" text-anchor="end">5</text>
  <text x="78" y="315" font-size="13" fill="currentColor" opacity="0.65" text-anchor="middle" transform="rotate(-90 78 315)">Value</text>

  <!-- Sharp peak: up to (415,170) apex, slight rounding, back down -->
  <path d="M 110 460 L 405 178 Q 415 170 425 178 L 720 460" fill="none" stroke="#FF6B00" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Keyframe diamonds: start, apex, end -->
  <g fill="#FF6B00">
    <path d="M 110 451 L 119 460 L 110 469 L 101 460 Z"/>
    <path d="M 415 161 L 424 170 L 415 179 L 406 170 Z"/>
    <path d="M 720 451 L 729 460 L 720 469 L 711 460 Z"/>
  </g>

  <!-- Annotation: quick rise -->
  <line x1="250" y1="320" x2="210" y2="295" stroke="currentColor" stroke-width="1" opacity="0.3" stroke-linecap="round"/>
  <text x="204" y="288" font-size="14" fill="currentColor" text-anchor="end">Quick rise</text>

  <!-- Annotation: sharp peak at apex -->
  <line x1="415" y1="170" x2="470" y2="210" stroke="currentColor" stroke-width="1" opacity="0.3" stroke-linecap="round"/>
  <text x="476" y="206" font-size="14" fill="currentColor">Sharp peak =</text>
  <text x="476" y="224" font-size="14" fill="currentColor" opacity="0.65">instant reversal</text>

  <!-- Annotation: quick fall -->
  <line x1="580" y1="320" x2="620" y2="295" stroke="currentColor" stroke-width="1" opacity="0.3" stroke-linecap="round"/>
  <text x="626" y="288" font-size="14" fill="currentColor">Quick fall</text>

  <!-- Caution pill: bounce / impact -->
  <rect x="476" y="396" width="244" height="30" rx="6" fill="#F5C242" fill-opacity="0.14" stroke="#F5C242" stroke-opacity="0.55"/>
  <circle cx="494" cy="411" r="4" fill="#F5C242"/>
  <text x="506" y="416" font-size="14" font-weight="600" fill="currentColor">Bounce &#183; impact behavior</text>

  <!-- Footer tip -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> The less rounding at the apex, the harder the hit &#183; short handles keep the peak sharp.
  </text>
</svg>
