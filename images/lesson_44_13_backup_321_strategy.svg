<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" role="img" aria-labelledby="bkp-title bkp-desc" color="#222" font-family="'Segoe UI',system-ui,sans-serif">
<title id="bkp-title">The 3-2-1 backup rule</title>
<desc id="bkp-desc">The 3-2-1 backup strategy. Keep three copies of your work: the original plus two backups. Store them on two different media, such as a hard drive and a cloud or external drive. Keep one copy off-site, such as cloud backup or an external drive stored elsewhere. Backup methods include manual copy, cloud sync, scheduled OS backup, and version control, with daily automated backups for active projects.</desc>
<text x="440" y="34" text-anchor="middle" font-size="23" font-weight="700" fill="currentColor">The 3-2-1 Backup Rule</text>
<text x="440" y="58" text-anchor="middle" font-size="13.5" fill="currentColor" opacity="0.75">Hard drives fail and cloud services go down &#8212; the only question is when, not if</text>

<!-- three big number cards -->
<!-- 3 copies -->
<g>
<rect x="30" y="86" width="266" height="196" rx="12" fill="#2a2a2a" stroke="#4ADE80" stroke-width="1.5"/>
<text x="70" y="164" font-size="72" font-weight="800" fill="#4ADE80">3</text>
<text x="150" y="132" font-size="16" font-weight="700" fill="#4ADE80">copies</text>
<text x="150" y="156" font-size="12" fill="#d4d4d4">total of your work</text>
<line x1="54" y1="196" x2="272" y2="196" stroke="currentColor" stroke-width="0.8" opacity="0.4"/>
<text x="54" y="222" font-size="12.5" fill="#d4d4d4">&#9642; 1 original working copy</text>
<text x="54" y="246" font-size="12.5" fill="#d4d4d4">&#9642; + 2 separate backups</text>
<text x="54" y="270" font-size="11.5" fill="#4ADE80">redundancy is the whole point</text>
</g>
<!-- 2 media -->
<g>
<rect x="307" y="86" width="266" height="196" rx="12" fill="#2a2a2a" stroke="#4A9EFF" stroke-width="1.5"/>
<text x="347" y="164" font-size="72" font-weight="800" fill="#4A9EFF">2</text>
<text x="427" y="132" font-size="16" font-weight="700" fill="#4A9EFF">media</text>
<text x="427" y="156" font-size="12" fill="#d4d4d4">different storage types</text>
<line x1="331" y1="196" x2="549" y2="196" stroke="currentColor" stroke-width="0.8" opacity="0.4"/>
<text x="331" y="222" font-size="12.5" fill="#d4d4d4">&#9642; Local hard drive</text>
<text x="331" y="246" font-size="12.5" fill="#d4d4d4">&#9642; Cloud or external drive</text>
<text x="331" y="270" font-size="11.5" fill="#4A9EFF">one failure can't take both</text>
</g>
<!-- 1 off-site -->
<g>
<rect x="584" y="86" width="266" height="196" rx="12" fill="#2a2a2a" stroke="#F5C242" stroke-width="1.5"/>
<text x="624" y="164" font-size="72" font-weight="800" fill="#F5C242">1</text>
<text x="704" y="132" font-size="16" font-weight="700" fill="#F5C242">off-site</text>
<text x="704" y="156" font-size="12" fill="#d4d4d4">stored elsewhere</text>
<line x1="608" y1="196" x2="826" y2="196" stroke="currentColor" stroke-width="0.8" opacity="0.4"/>
<text x="608" y="222" font-size="12.5" fill="#d4d4d4">&#9642; Cloud backup, or</text>
<text x="608" y="246" font-size="12.5" fill="#d4d4d4">&#9642; External drive off-premises</text>
<text x="608" y="270" font-size="11.5" fill="#F5C242">survives fire, theft, disaster</text>
</g>

<!-- methods row -->
<text x="30" y="316" font-size="14" font-weight="700" fill="currentColor">Backup Methods</text>
<g font-family="'Segoe UI',system-ui,sans-serif">
<rect x="30" y="326" width="200" height="70" rx="8" fill="#1e1e1e" stroke="#B47EE8" stroke-width="1"/>
<text x="46" y="350" font-size="12.5" font-weight="700" fill="#B47EE8">Manual copy</text>
<text x="46" y="370" font-size="11" fill="#d4d4d4">copy project folder</text>
<text x="46" y="386" font-size="11" fill="#d4d4d4">to an external drive</text>
<rect x="242" y="326" width="200" height="70" rx="8" fill="#1e1e1e" stroke="#B47EE8" stroke-width="1"/>
<text x="258" y="350" font-size="12.5" font-weight="700" fill="#B47EE8">Cloud sync</text>
<text x="258" y="370" font-size="11" fill="#d4d4d4">Dropbox, Google Drive</text>
<text x="258" y="386" font-size="11" fill="#d4d4d4">automatic &amp; off-site</text>
<rect x="454" y="326" width="200" height="70" rx="8" fill="#1e1e1e" stroke="#B47EE8" stroke-width="1"/>
<text x="470" y="350" font-size="12.5" font-weight="700" fill="#B47EE8">Scheduled backup</text>
<text x="470" y="370" font-size="11" fill="#d4d4d4">Time Machine,</text>
<text x="470" y="386" font-size="11" fill="#d4d4d4">Windows Backup</text>
<rect x="666" y="326" width="184" height="70" rx="8" fill="#1e1e1e" stroke="#B47EE8" stroke-width="1"/>
<text x="682" y="350" font-size="12.5" font-weight="700" fill="#B47EE8">Version control</text>
<text x="682" y="370" font-size="11" fill="#d4d4d4">Git for text/code,</text>
<text x="682" y="386" font-size="11" fill="#d4d4d4">Git LFS for assets</text>
</g>

<!-- frequency row -->
<text x="30" y="434" font-size="14" font-weight="700" fill="currentColor">Backup Frequency</text>
<g font-family="'Segoe UI',system-ui,sans-serif">
<rect x="30" y="444" width="266" height="66" rx="8" fill="#2a2a2a" stroke="#4ADE80" stroke-width="1"/>
<text x="46" y="468" font-size="12.5" font-weight="700" fill="#4ADE80">Active projects</text>
<text x="46" y="490" font-size="11.5" fill="#d4d4d4">Daily backup (automated)</text>
<rect x="307" y="444" width="266" height="66" rx="8" fill="#2a2a2a" stroke="#F5C242" stroke-width="1"/>
<text x="323" y="468" font-size="12.5" font-weight="700" fill="#F5C242">Milestone versions</text>
<text x="323" y="490" font-size="11.5" fill="#d4d4d4">Manual copy to external drive</text>
<rect x="584" y="444" width="266" height="66" rx="8" fill="#2a2a2a" stroke="#4A9EFF" stroke-width="1"/>
<text x="600" y="468" font-size="12.5" font-weight="700" fill="#4A9EFF">Completed projects</text>
<text x="600" y="490" font-size="11.5" fill="#d4d4d4">Archive &amp; back up before deleting</text>
</g>

<!-- footer -->
<rect x="30" y="524" width="820" height="34" rx="8" fill="#1e1e1e" stroke="#E63946" stroke-width="1.2"/>
<text x="440" y="545" text-anchor="middle" font-size="12.5" fill="#E63946" font-weight="700">Regular backups are the only real protection against data loss. Don't wait for the failure.</text>
</svg>
