<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="sp-title sp-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="sp-title">Strategic Seam Placement on a Character Model</title>
  <desc id="sp-desc">A front-facing humanoid figure annotated with good seam locations in green on hidden areas such as the spine, underarms, inner legs, and under the chin, and bad seam locations in red on visible areas such as the face, chest, and outer limbs. Good seams hide where they will not be seen; bad seams cut across prominent visible surfaces.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">STRATEGIC SEAM PLACEMENT</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Hide seams where they are not seen &#183; avoid cutting across visible surfaces</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Figure: simplified front-facing humanoid, centered -->
  <g stroke="#00bcd4" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- head -->
    <ellipse cx="400" cy="178" rx="34" ry="40"/>
    <!-- neck -->
    <path d="M 384 214 L 384 236 M 416 214 L 416 236"/>
    <!-- torso -->
    <path d="M 360 236 Q 400 228 440 236 L 452 360 Q 400 372 348 360 Z"/>
    <!-- left arm (figure's right, viewer left) -->
    <path d="M 360 244 L 322 270 L 300 372 L 316 378 L 340 282 L 360 268"/>
    <!-- right arm -->
    <path d="M 440 244 L 478 270 L 500 372 L 484 378 L 460 282 L 440 268"/>
    <!-- hips -->
    <path d="M 348 360 Q 400 372 452 360 L 452 392 L 348 392 Z"/>
    <!-- left leg -->
    <path d="M 352 392 L 344 540 L 380 540 L 392 392"/>
    <!-- right leg -->
    <path d="M 448 392 L 456 540 L 420 540 L 408 392"/>
  </g>

  <!-- GOOD seams (green, hidden areas): drawn on the figure -->
  <g stroke="#4ADE80" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="2 7">
    <!-- spine / back centre line -->
    <path d="M 400 238 L 400 358"/>
    <!-- under chin -->
    <path d="M 380 210 Q 400 220 420 210"/>
    <!-- left underarm -->
    <path d="M 360 250 L 338 286"/>
    <!-- right underarm -->
    <path d="M 440 250 L 462 286"/>
    <!-- left inner leg -->
    <path d="M 392 396 L 384 534"/>
    <!-- right inner leg -->
    <path d="M 408 396 L 416 534"/>
  </g>

  <!-- BAD seams (red, visible areas): drawn on the figure -->
  <g stroke="#E63946" stroke-width="4" fill="none" stroke-linecap="round">
    <!-- across face -->
    <path d="M 372 176 L 428 176"/>
    <!-- down chest front -->
    <path d="M 378 250 L 378 352"/>
    <!-- across outer right thigh -->
    <path d="M 448 420 L 456 470"/>
  </g>

  <!-- Annotation pills: GOOD (right side) -->
  <g font-size="13" font-weight="600">
    <!-- spine -->
    <line x1="400" y1="298" x2="556" y2="276" stroke="#4ADE80" stroke-width="2"/>
    <circle cx="400" cy="298" r="5" fill="#4ADE80"/>
    <rect x="556" y="262" width="172" height="28" rx="6" fill="#4ADE80"/>
    <text x="642" y="281" text-anchor="middle" fill="#0f1a14">Back / spine</text>
    <!-- under chin -->
    <line x1="400" y1="214" x2="556" y2="214" stroke="#4ADE80" stroke-width="2"/>
    <circle cx="400" cy="214" r="5" fill="#4ADE80"/>
    <rect x="556" y="200" width="172" height="28" rx="6" fill="#4ADE80"/>
    <text x="642" y="219" text-anchor="middle" fill="#0f1a14">Under chin</text>
    <!-- right underarm -->
    <line x1="462" y1="286" x2="556" y2="324" stroke="#4ADE80" stroke-width="2"/>
    <circle cx="462" cy="286" r="5" fill="#4ADE80"/>
    <rect x="556" y="310" width="172" height="28" rx="6" fill="#4ADE80"/>
    <text x="642" y="329" text-anchor="middle" fill="#0f1a14">Underarms</text>
    <!-- inner leg -->
    <line x1="416" y1="470" x2="556" y2="372" stroke="#4ADE80" stroke-width="2"/>
    <circle cx="416" cy="470" r="5" fill="#4ADE80"/>
    <rect x="556" y="358" width="172" height="28" rx="6" fill="#4ADE80"/>
    <text x="642" y="377" text-anchor="middle" fill="#0f1a14">Inner legs</text>
  </g>

  <!-- Annotation pills: BAD (left side) -->
  <g font-size="13" font-weight="600">
    <!-- face -->
    <line x1="372" y1="176" x2="244" y2="200" stroke="#E63946" stroke-width="2"/>
    <circle cx="372" cy="176" r="5" fill="#E63946"/>
    <rect x="72" y="186" width="172" height="28" rx="6" fill="#E63946"/>
    <text x="158" y="205" text-anchor="middle" fill="#ffffff">Face</text>
    <!-- chest -->
    <line x1="378" y1="300" x2="244" y2="300" stroke="#E63946" stroke-width="2"/>
    <circle cx="378" cy="300" r="5" fill="#E63946"/>
    <rect x="72" y="286" width="172" height="28" rx="6" fill="#E63946"/>
    <text x="158" y="305" text-anchor="middle" fill="#ffffff">Chest front</text>
    <!-- outer thigh -->
    <line x1="452" y1="446" x2="244" y2="420" stroke="#E63946" stroke-width="2"/>
    <circle cx="452" cy="446" r="5" fill="#E63946"/>
    <rect x="72" y="406" width="172" height="28" rx="6" fill="#E63946"/>
    <text x="158" y="425" text-anchor="middle" fill="#ffffff">Visible limbs</text>
  </g>

  <!-- Legend -->
  <g font-size="14">
    <rect x="72" y="568" width="20" height="20" rx="4" fill="#4ADE80"/>
    <text x="102" y="583" fill="currentColor"><tspan font-weight="700">GOOD</tspan> &#183; Hidden areas</text>
    <rect x="320" y="568" width="20" height="20" rx="4" fill="#E63946"/>
    <text x="350" y="583" fill="currentColor"><tspan font-weight="700">BAD</tspan> &#183; Visible areas</text>
  </g>

  <!-- Footer tip (Variant B, left rail) -->
  <rect x="40" y="641" width="720" height="34" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Run seams along edges the camera rarely sees so the texture join stays out of sight.
  </text>
</svg>
