<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="mct-title mct-desc" color="#222">
<title id="mct-title">Mask Combination Techniques</title>
<desc id="mct-desc">Three rows showing how two black-and-white masks combine: Multiply acts as logical AND keeping only shared white areas, Add acts as logical OR keeping white from either, and Mix blends the two gradually.</desc>
<defs>
<pattern id="mA" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#111"/><circle cx="14" cy="14" r="12" fill="#eee"/></pattern>
<pattern id="mB" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#111"/><circle cx="26" cy="24" r="12" fill="#eee"/></pattern>
<pattern id="mAnd" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#111"/><path d="M20,6 a12,12 0 0 1 0,24 a12,12 0 0 1 0,-24" fill="#eee"/></pattern>
<pattern id="mOr" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#111"/><circle cx="14" cy="14" r="12" fill="#eee"/><circle cx="26" cy="24" r="12" fill="#eee"/></pattern>
<pattern id="mMix" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#111"/><circle cx="14" cy="14" r="12" fill="#888"/><circle cx="26" cy="24" r="12" fill="#888"/></pattern>
</defs>
<style>
.lbl{fill:currentColor;font-family:'Segoe UI',Arial,sans-serif;}
.hd{font-size:26px;font-weight:700;}
.op{font-size:34px;font-weight:700;}
.tag{font-size:16px;font-weight:700;}
.cap{font-size:12px;fill:currentColor;opacity:.7;}
.sw{stroke:currentColor;stroke-width:1.5;}
</style>
<text x="400" y="42" text-anchor="middle" class="lbl hd">Mask Combination Techniques</text>

<!-- column headers -->
<text x="95"  y="88" text-anchor="middle" class="lbl cap">Mask A</text>
<text x="255" y="88" text-anchor="middle" class="lbl cap">operation</text>
<text x="415" y="88" text-anchor="middle" class="lbl cap">Mask B</text>
<text x="640" y="88" text-anchor="middle" class="lbl cap">Result</text>

<!-- ROW 1 Multiply / AND -->
<g transform="translate(0,100)">
<rect x="55"  y="0" width="80" height="80" class="sw" fill="url(#mA)"/>
<text x="255" y="52" text-anchor="middle" class="lbl op" fill="#4A9EFF">&#215;</text>
<rect x="375" y="0" width="80" height="80" class="sw" fill="url(#mB)"/>
<line x1="470" y1="40" x2="590" y2="40" stroke="#FF6B00" stroke-width="3"/><polygon points="590,33 590,47 604,40" fill="#FF6B00"/>
<rect x="600" y="0" width="80" height="80" class="sw" fill="url(#mAnd)"/>
<text x="255" y="76" text-anchor="middle" class="lbl tag" fill="#4A9EFF">Multiply</text>
<text x="720" y="34" class="lbl tag">AND</text>
<text x="720" y="54" class="lbl cap">white in</text>
<text x="720" y="68" class="lbl cap">both only</text>
</g>

<!-- ROW 2 Add / OR -->
<g transform="translate(0,220)">
<rect x="55"  y="0" width="80" height="80" class="sw" fill="url(#mA)"/>
<text x="255" y="52" text-anchor="middle" class="lbl op" fill="#4ADE80">+</text>
<rect x="375" y="0" width="80" height="80" class="sw" fill="url(#mB)"/>
<line x1="470" y1="40" x2="590" y2="40" stroke="#FF6B00" stroke-width="3"/><polygon points="590,33 590,47 604,40" fill="#FF6B00"/>
<rect x="600" y="0" width="80" height="80" class="sw" fill="url(#mOr)"/>
<text x="255" y="76" text-anchor="middle" class="lbl tag" fill="#4ADE80">Add</text>
<text x="720" y="34" class="lbl tag">OR</text>
<text x="720" y="54" class="lbl cap">white in</text>
<text x="720" y="68" class="lbl cap">either</text>
</g>

<!-- ROW 3 Mix / blend -->
<g transform="translate(0,340)">
<rect x="55"  y="0" width="80" height="80" class="sw" fill="url(#mA)"/>
<text x="255" y="50" text-anchor="middle" class="lbl op" fill="#F5C242">&#189;</text>
<rect x="375" y="0" width="80" height="80" class="sw" fill="url(#mB)"/>
<line x1="470" y1="40" x2="590" y2="40" stroke="#FF6B00" stroke-width="3"/><polygon points="590,33 590,47 604,40" fill="#FF6B00"/>
<rect x="600" y="0" width="80" height="80" class="sw" fill="url(#mMix)"/>
<text x="255" y="76" text-anchor="middle" class="lbl tag" fill="#F5C242">Mix</text>
<text x="720" y="34" class="lbl tag">BLEND</text>
<text x="720" y="54" class="lbl cap">gradual</text>
<text x="720" y="68" class="lbl cap">combine</text>
</g>

<text x="400" y="470" text-anchor="middle" class="lbl cap">Multiply narrows coverage, Add widens it, Mix fades between the two masks by a factor.</text>
</svg>
