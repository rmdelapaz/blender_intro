<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" color="#222"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Quad: four vertices in a closed loop</title>
  <desc>A geometric primer for the quad polygon type. A clean square is shown
  with four highlighted orange vertex glyphs at the corners. Three property
  pills below the shape list the side count, animation behavior, and subdivision
  behavior. An italic takeaway and a footer tip card emphasize that quads carry
  edge loops cleanly through deformation and subdivide smoothly with the
  Subdivision Surface modifier.</desc>

  <!-- Top accent rail -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Header band -->
  <text x="400" y="56" text-anchor="middle" font-size="24" font-weight="700"
        fill="currentColor">QUAD</text>
  <text x="400" y="84" text-anchor="middle" font-size="14"
        fill="currentColor" opacity="0.65">Four vertices in a closed loop. The deformation-friendly default.</text>
  <line x1="120" y1="108" x2="680" y2="108"
        stroke="currentColor" stroke-width="1" opacity="0.25"/>
  <text x="400" y="138" text-anchor="middle" font-size="15" font-weight="700"
        fill="#FF6B00" letter-spacing="2">QUAD &#183; 4 SIDES</text>

  <!-- Hero polygon: clean square -->
  <polygon points="260,165 540,165 540,445 260,445"
           fill="currentColor" fill-opacity="0.05"
           stroke="#FF6B00" stroke-width="4" stroke-linejoin="round"/>

  <!-- Vertex glyphs (three-circle stack per vertex) -->
  <g id="qd-vertices">
    <!-- Top-left -->
    <circle cx="260" cy="165" r="10" fill="#FF6B00" opacity="0.20"/>
    <circle cx="260" cy="165" r="6" fill="#FF6B00"/>
    <circle cx="260" cy="165" r="1.8" fill="#ffffff"/>
    <!-- Top-right -->
    <circle cx="540" cy="165" r="10" fill="#FF6B00" opacity="0.20"/>
    <circle cx="540" cy="165" r="6" fill="#FF6B00"/>
    <circle cx="540" cy="165" r="1.8" fill="#ffffff"/>
    <!-- Bottom-right -->
    <circle cx="540" cy="445" r="10" fill="#FF6B00" opacity="0.20"/>
    <circle cx="540" cy="445" r="6" fill="#FF6B00"/>
    <circle cx="540" cy="445" r="1.8" fill="#ffffff"/>
    <!-- Bottom-left -->
    <circle cx="260" cy="445" r="10" fill="#FF6B00" opacity="0.20"/>
    <circle cx="260" cy="445" r="6" fill="#FF6B00"/>
    <circle cx="260" cy="445" r="1.8" fill="#ffffff"/>
  </g>

  <!-- Property pills row -->
  <g id="qd-pills">
    <!-- Sides -->
    <rect x="50" y="425" width="220" height="40" rx="6"
          fill="currentColor" fill-opacity="0.04"
          stroke="#FF6B00" stroke-width="1" stroke-opacity="0.5"/>
    <text x="160" y="442" text-anchor="middle" font-size="11" font-weight="700"
          fill="#FF6B00" letter-spacing="1">SIDES</text>
    <text x="160" y="459" text-anchor="middle" font-size="12"
          fill="currentColor" opacity="0.85">4</text>
    <!-- Animation -->
    <rect x="290" y="425" width="220" height="40" rx="6"
          fill="currentColor" fill-opacity="0.04"
          stroke="#FF6B00" stroke-width="1" stroke-opacity="0.5"/>
    <text x="400" y="442" text-anchor="middle" font-size="11" font-weight="700"
          fill="#FF6B00" letter-spacing="1">ANIMATION</text>
    <text x="400" y="459" text-anchor="middle" font-size="12"
          fill="currentColor" opacity="0.85">Deforms cleanly</text>
    <!-- Subdivision -->
    <rect x="530" y="425" width="220" height="40" rx="6"
          fill="currentColor" fill-opacity="0.04"
          stroke="#FF6B00" stroke-width="1" stroke-opacity="0.5"/>
    <text x="640" y="442" text-anchor="middle" font-size="11" font-weight="700"
          fill="#FF6B00" letter-spacing="1">SUBDIVISION</text>
    <text x="640" y="459" text-anchor="middle" font-size="12"
          fill="currentColor" opacity="0.85">Smooth Catmull-Clark</text>
  </g>

  <!-- Italic takeaway -->
  <text x="400" y="490" text-anchor="middle" font-size="13" font-style="italic"
        fill="currentColor" opacity="0.75">Quads carry edge loops cleanly through joints and bends. The industry default for character modeling.</text>

  <!-- Footer tip card -->
  <g id="qd-tip">
    <rect x="40" y="506" width="720" height="34" rx="6"
          fill="currentColor" fill-opacity="0.04"
          stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>
    <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
    <text x="58" y="527" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Quads also subdivide smoothly with the Subdivision Surface modifier. Reach for them first.</text>
  </g>
</svg>
