<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="skt-title skt-desc" color="#222" font-family="'Segoe UI',system-ui,sans-serif">
<title id="skt-title">Compositor socket types and connection rules</title>
<desc id="skt-desc">Legend of the three main compositor socket colours (yellow color/RGBA, gray value, blue vector) with a matrix showing which socket outputs may connect to which inputs and how Blender auto-converts mismatched types.</desc>
<rect x="0" y="0" width="800" height="600" fill="none"/>
<text x="400" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="currentColor">Sockets &#38; Data Types</text>
<text x="400" y="62" text-anchor="middle" font-size="14" fill="currentColor" opacity="0.75">Socket colour tells you what kind of data flows through the wire</text>

<!-- Legend row -->
<g>
  <rect x="40" y="90" width="230" height="130" rx="10" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.9"/>
  <circle cx="70" cy="122" r="11" fill="#F5C242" stroke="currentColor" stroke-width="1.5"/>
  <text x="92" y="127" font-size="17" font-weight="700" fill="currentColor">Yellow &#8212; Color</text>
  <text x="55" y="152" font-size="13" fill="currentColor" opacity="0.85">Full RGBA image data</text>
  <text x="55" y="172" font-size="13" fill="currentColor" opacity="0.85">Red, Green, Blue + Alpha</text>
  <text x="55" y="192" font-size="13" fill="currentColor" opacity="0.85">Render Layers Image,</text>
  <text x="55" y="209" font-size="13" fill="currentColor" opacity="0.85">Composite input</text>
</g>
<g>
  <rect x="285" y="90" width="230" height="130" rx="10" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.9"/>
  <circle cx="315" cy="122" r="11" fill="#AAAAAA" stroke="currentColor" stroke-width="1.5"/>
  <text x="337" y="127" font-size="17" font-weight="700" fill="currentColor">Gray &#8212; Value</text>
  <text x="300" y="152" font-size="13" fill="currentColor" opacity="0.85">Single grayscale channel</text>
  <text x="300" y="172" font-size="13" fill="currentColor" opacity="0.85">Factors, masks, Z depth,</text>
  <text x="300" y="192" font-size="13" fill="currentColor" opacity="0.85">Mist, single-value maps</text>
  <text x="300" y="209" font-size="13" fill="currentColor" opacity="0.85">0.0 to 1.0 range</text>
</g>
<g>
  <rect x="530" y="90" width="230" height="130" rx="10" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.9"/>
  <circle cx="560" cy="122" r="11" fill="#4A9EFF" stroke="currentColor" stroke-width="1.5"/>
  <text x="582" y="127" font-size="17" font-weight="700" fill="currentColor">Blue &#8212; Vector</text>
  <text x="545" y="152" font-size="13" fill="currentColor" opacity="0.85">Three-component data</text>
  <text x="545" y="172" font-size="13" fill="currentColor" opacity="0.85">Normals, motion,</text>
  <text x="545" y="192" font-size="13" fill="currentColor" opacity="0.85">UV / speed vectors</text>
  <text x="545" y="209" font-size="13" fill="currentColor" opacity="0.85">XYZ per pixel</text>
</g>

<!-- Connection rule matrix -->
<text x="400" y="270" text-anchor="middle" font-size="18" font-weight="700" fill="currentColor">Connection Rules</text>
<text x="400" y="292" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.75">Blender auto-converts most mismatches &#8212; but the result is not always what you want</text>

<g font-size="13" fill="currentColor">
  <!-- header -->
  <rect x="60" y="310" width="680" height="40" rx="6" fill="#2a2a2a"/>
  <text x="150" y="335" text-anchor="middle" font-size="13" font-weight="700" fill="#d4d4d4">Output &#8594; Input</text>
  <text x="330" y="335" text-anchor="middle" font-size="13" font-weight="700" fill="#d4d4d4">To Color</text>
  <text x="480" y="335" text-anchor="middle" font-size="13" font-weight="700" fill="#d4d4d4">To Value</text>
  <text x="640" y="335" text-anchor="middle" font-size="13" font-weight="700" fill="#d4d4d4">To Vector</text>

  <!-- row: from Color -->
  <line x1="60" y1="392" x2="740" y2="392" stroke="currentColor" stroke-width="1" opacity="0.3"/>
  <circle cx="80" cy="374" r="8" fill="#F5C242" stroke="currentColor" stroke-width="1"/>
  <text x="98" y="379" font-weight="600">From Color</text>
  <text x="330" y="379" text-anchor="middle" fill="#4ADE80" font-weight="700">direct</text>
  <text x="480" y="379" text-anchor="middle">luminance avg</text>
  <text x="640" y="379" text-anchor="middle">RGB &#8594; XYZ</text>

  <!-- row: from Value -->
  <line x1="60" y1="434" x2="740" y2="434" stroke="currentColor" stroke-width="1" opacity="0.3"/>
  <circle cx="80" cy="416" r="8" fill="#AAAAAA" stroke="currentColor" stroke-width="1"/>
  <text x="98" y="421" font-weight="600">From Value</text>
  <text x="330" y="421" text-anchor="middle">gray in RGB</text>
  <text x="480" y="421" text-anchor="middle" fill="#4ADE80" font-weight="700">direct</text>
  <text x="640" y="421" text-anchor="middle">copied to XYZ</text>

  <!-- row: from Vector -->
  <circle cx="80" cy="458" r="8" fill="#4A9EFF" stroke="currentColor" stroke-width="1"/>
  <text x="98" y="463" font-weight="600">From Vector</text>
  <text x="330" y="463" text-anchor="middle">XYZ &#8594; RGB</text>
  <text x="480" y="463" text-anchor="middle">first component</text>
  <text x="640" y="463" text-anchor="middle" fill="#4ADE80" font-weight="700">direct</text>
</g>

<!-- caution note -->
<g>
  <rect x="60" y="500" width="680" height="72" rx="10" fill="none" stroke="#F5C242" stroke-width="2"/>
  <circle cx="88" cy="536" r="12" fill="#F5C242"/>
  <text x="88" y="541" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">!</text>
  <text x="115" y="527" font-size="14" font-weight="700" fill="currentColor">Match types on purpose</text>
  <text x="115" y="548" font-size="12.5" fill="currentColor" opacity="0.85">Feeding a Z-depth (Value) into a Color input works, but you see raw depth as brightness.</text>
  <text x="115" y="565" font-size="12.5" fill="currentColor" opacity="0.85">Use Map Range or ColorRamp to shape a Value before it drives a factor or a color.</text>
</g>
</svg>
