<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" color="#222" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" role="img" aria-labelledby="cbm-t cbm-d">
  <title id="cbm-t">Component-Based Modeling: Break the Product Down</title>
  <desc id="cbm-d">A pair of headphones exploded into its named components &#8212; headband, two ear cups, two cushions, a hinge/yoke pair, and the cable &#8212; each tagged with a build-order number so the model is assembled as separate, manageable objects instead of one impossible mesh.</desc>
  <rect x="0" y="0" width="760" height="520" fill="none"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="currentColor">Component-Based Modeling</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#8a8f98">Model separate parts in a sensible order, not one giant mesh</text>

  <!-- exploded schematic of headphones -->
  <!-- headband arc -->
  <path d="M 210 250 A 170 170 0 0 1 550 250" fill="none" stroke="#FF6B00" stroke-width="18" stroke-linecap="round" opacity="0.85"/>
  <!-- left yoke -->
  <line x1="210" y1="250" x2="210" y2="320" stroke="#B47EE8" stroke-width="10" stroke-linecap="round"/>
  <!-- right yoke -->
  <line x1="550" y1="250" x2="550" y2="320" stroke="#B47EE8" stroke-width="10" stroke-linecap="round"/>
  <!-- left cup -->
  <circle cx="210" cy="350" r="46" fill="#4A9EFF" opacity="0.85"/>
  <!-- right cup -->
  <circle cx="550" cy="350" r="46" fill="#4A9EFF" opacity="0.85"/>
  <!-- left cushion -->
  <circle cx="210" cy="350" r="26" fill="#4ADE80" opacity="0.9"/>
  <!-- right cushion -->
  <circle cx="550" cy="350" r="26" fill="#4ADE80" opacity="0.9"/>
  <!-- cable -->
  <path d="M 550 392 q 40 60 -10 100 q -50 40 10 20" fill="none" stroke="#F5C242" stroke-width="6" stroke-linecap="round"/>

  <!-- build-order badges -->
  <g font-size="13" font-weight="700">
    <circle cx="380" cy="118" r="15" fill="#FF6B00"/><text x="380" y="123" text-anchor="middle" fill="#1a1a1a">1</text>
    <circle cx="210" cy="415" r="15" fill="#4A9EFF"/><text x="210" y="420" text-anchor="middle" fill="#1a1a1a">2</text>
    <circle cx="550" cy="415" r="15" fill="#4A9EFF"/><text x="550" y="420" text-anchor="middle" fill="#1a1a1a">2</text>
    <circle cx="150" cy="350" r="15" fill="#4ADE80"/><text x="150" y="355" text-anchor="middle" fill="#1a1a1a">3</text>
    <circle cx="610" cy="350" r="15" fill="#4ADE80"/><text x="610" y="355" text-anchor="middle" fill="#1a1a1a">3</text>
    <circle cx="175" cy="292" r="15" fill="#B47EE8"/><text x="175" y="297" text-anchor="middle" fill="#1a1a1a">4</text>
    <circle cx="585" cy="292" r="15" fill="#B47EE8"/><text x="585" y="297" text-anchor="middle" fill="#1a1a1a">4</text>
    <circle cx="600" cy="500" r="15" fill="#F5C242"/><text x="600" y="505" text-anchor="middle" fill="#1a1a1a">5</text>
  </g>

  <!-- component key -->
  <g font-size="13">
    <rect x="40" y="90" width="14" height="14" rx="2" fill="#FF6B00"/><text x="62" y="102" fill="currentColor">1 &#183; Headband arc</text>
    <rect x="40" y="116" width="14" height="14" rx="2" fill="#4A9EFF"/><text x="62" y="128" fill="currentColor">2 &#183; Ear cups (mirror)</text>
    <rect x="40" y="142" width="14" height="14" rx="2" fill="#4ADE80"/><text x="62" y="154" fill="currentColor">3 &#183; Cushions (mirror)</text>
    <rect x="40" y="168" width="14" height="14" rx="2" fill="#B47EE8"/><text x="62" y="180" fill="currentColor">4 &#183; Hinge / yoke (mirror)</text>
    <rect x="40" y="194" width="14" height="14" rx="2" fill="#F5C242"/><text x="62" y="206" fill="currentColor">5 &#183; Cable</text>
  </g>

  <text x="40" y="502" font-size="12" fill="#8a8f98">Number = build order. Symmetric parts (cups, cushions, yokes) are modeled once, then mirrored &#8212; half the work, perfect symmetry.</text>
</svg>
