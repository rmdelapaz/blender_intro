<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="ov-title ov-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="ov-title">Overlap signals depth order</title>
  <desc id="ov-desc">Three similar shapes overlap so the brain reads them as stacked in space. The red shape covers the blue, and the blue covers the green, so red is nearest and green is farthest. A side view below confirms the same near-to-far order.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">OVERLAP = DEPTH ORDER</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Whatever covers another shape reads as nearer</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ============ Front view (left): three overlapping discs ============ -->
  <text x="40" y="150" font-size="15" font-weight="600" fill="currentColor">What the camera sees</text>

  <!-- draw back-to-front so overlaps are correct -->
  <!-- GREEN (back) -->
  <circle cx="300" cy="320" r="80" fill="#4ADE80"/>
  <!-- BLUE (middle) -->
  <circle cx="230" cy="300" r="80" fill="#4A9EFF"/>
  <!-- RED (front) -->
  <circle cx="165" cy="280" r="80" fill="#E63946"/>

  <!-- order badges -->
  <g font-weight="700" text-anchor="middle">
    <circle cx="130" cy="250" r="16" fill="#ffffff" stroke="#E63946" stroke-width="2"/>
    <text x="130" y="256" font-size="16" fill="#E63946">1</text>
    <circle cx="265" cy="300" r="16" fill="#ffffff" stroke="#4A9EFF" stroke-width="2"/>
    <text x="265" y="306" font-size="16" fill="#4A9EFF">2</text>
    <circle cx="345" cy="345" r="16" fill="#ffffff" stroke="#4ADE80" stroke-width="2"/>
    <text x="345" y="351" font-size="16" fill="#4ADE80">3</text>
  </g>

  <!-- ============ Side view (right): Z-depth positions ============ -->
  <text x="560" y="150" font-size="15" font-weight="600" fill="currentColor">From the side</text>

  <!-- camera glyph -->
  <g transform="translate(520,300)">
    <rect x="0" y="-16" width="34" height="32" rx="4" fill="currentColor" opacity="0.55"/>
    <polygon points="34,-10 50,-20 50,20 34,10" fill="currentColor" opacity="0.55"/>
    <text x="17" y="44" font-size="11" fill="currentColor" opacity="0.6" text-anchor="middle">camera</text>
  </g>

  <!-- depth axis -->
  <line x1="585" y1="300" x2="740" y2="300" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.5" marker-end="url(#ov-arrow)"/>

  <!-- markers along Z (nearest left) -->
  <circle cx="610" cy="300" r="18" fill="#E63946"/>
  <text x="610" y="340" font-size="12" fill="currentColor" opacity="0.7" text-anchor="middle">1 near</text>
  <circle cx="668" cy="300" r="18" fill="#4A9EFF"/>
  <text x="668" y="340" font-size="12" fill="currentColor" opacity="0.7" text-anchor="middle">2</text>
  <circle cx="726" cy="300" r="18" fill="#4ADE80"/>
  <text x="726" y="340" font-size="12" fill="currentColor" opacity="0.7" text-anchor="middle">3 far</text>

  <defs>
    <marker id="ov-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" opacity="0.5"/>
    </marker>
  </defs>

  <!-- Footer tip callout (Variant B, left rail) -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Overlap is the strongest depth cue. Even with no size or focus change, the eye still reads the order.
  </text>
</svg>
