<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="ks-title ks-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="ks-title">Keyboard Shortcuts: The Blender Interface</title>
  <desc id="ks-desc">A reference card of essential keyboard and mouse shortcuts for navigating the Blender 5.1 interface, organized into six categories: viewport navigation, frame and camera, panels, areas and workspaces, menus and search, and file and history.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Header -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Keyboard Shortcuts: The Interface</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Essential shortcuts for navigating Blender 5.1</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ============================ -->
  <!--        LEFT COLUMN           -->
  <!-- ============================ -->

  <!-- Category 1: VIEWPORT NAVIGATION -->
  <text x="40" y="148" font-size="13" font-weight="700" fill="#FF6B00" letter-spacing="1.5">VIEWPORT NAVIGATION</text>

  <!-- Row 1: MMB | Orbit view -->
  <rect x="40" y="162" width="38" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="59" y="178" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">MMB</text>
  <text x="200" y="178" font-size="13" fill="currentColor">Orbit view</text>

  <!-- Row 2: Shift + MMB | Pan view -->
  <rect x="40" y="192" width="42" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="61" y="208" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Shift</text>
  <text x="90" y="208" font-size="13" fill="currentColor" opacity="0.5" text-anchor="middle">+</text>
  <rect x="98" y="192" width="38" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="117" y="208" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">MMB</text>
  <text x="200" y="208" font-size="13" fill="currentColor">Pan view</text>

  <!-- Row 3: Scroll | Zoom view -->
  <rect x="40" y="222" width="46" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="63" y="238" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Scroll</text>
  <text x="200" y="238" font-size="13" fill="currentColor">Zoom view</text>

  <!-- Row 4: Numpad 1/3/7 | Front / Side / Top views -->
  <rect x="40" y="252" width="100" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="90" y="268" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Numpad 1/3/7</text>
  <text x="200" y="268" font-size="13" fill="currentColor">Front / Side / Top views</text>

  <!-- Row 5: Numpad 5 | Toggle perspective / ortho -->
  <rect x="40" y="282" width="64" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="72" y="298" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Numpad 5</text>
  <text x="200" y="298" font-size="13" fill="currentColor">Toggle perspective / ortho</text>

  <!-- Category 2: FRAME &amp; CAMERA -->
  <text x="40" y="332" font-size="13" font-weight="700" fill="#FF6B00" letter-spacing="1.5">FRAME &amp; CAMERA</text>

  <!-- Row 1: Numpad 0 | Camera view -->
  <rect x="40" y="346" width="64" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="72" y="362" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Numpad 0</text>
  <text x="200" y="362" font-size="13" fill="currentColor">Camera view</text>

  <!-- Row 2: Home | Frame all in viewport -->
  <rect x="40" y="376" width="44" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="62" y="392" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Home</text>
  <text x="200" y="392" font-size="13" fill="currentColor">Frame all in viewport</text>

  <!-- Row 3: Numpad . | Frame selected -->
  <rect x="40" y="406" width="64" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="72" y="422" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Numpad .</text>
  <text x="200" y="422" font-size="13" fill="currentColor">Frame selected</text>

  <!-- Row 4: / | Toggle local view -->
  <rect x="40" y="436" width="26" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="53" y="452" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">/</text>
  <text x="200" y="452" font-size="13" fill="currentColor">Toggle local view</text>

  <!-- Category 3: PANELS -->
  <text x="40" y="486" font-size="13" font-weight="700" fill="#FF6B00" letter-spacing="1.5">PANELS</text>

  <!-- Row 1: T | Toggle Toolbar -->
  <rect x="40" y="500" width="24" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="52" y="516" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">T</text>
  <text x="200" y="516" font-size="13" fill="currentColor">Toggle Toolbar</text>

  <!-- Row 2: N | Toggle Sidebar -->
  <rect x="40" y="530" width="24" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="52" y="546" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">N</text>
  <text x="200" y="546" font-size="13" fill="currentColor">Toggle Sidebar</text>

  <!-- Row 3: ` | View pie menu -->
  <rect x="40" y="560" width="24" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="52" y="576" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">`</text>
  <text x="200" y="576" font-size="13" fill="currentColor">View pie menu</text>

  <!-- ============================ -->
  <!--        RIGHT COLUMN          -->
  <!-- ============================ -->

  <!-- Category 4: AREAS &amp; WORKSPACES -->
  <text x="420" y="148" font-size="13" font-weight="700" fill="#FF6B00" letter-spacing="1.5">AREAS &amp; WORKSPACES</text>

  <!-- Row 1: Ctrl + Space | Maximize active area -->
  <rect x="420" y="162" width="38" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="439" y="178" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Ctrl</text>
  <text x="466" y="178" font-size="13" fill="currentColor" opacity="0.5" text-anchor="middle">+</text>
  <rect x="474" y="162" width="50" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="499" y="178" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Space</text>
  <text x="580" y="178" font-size="13" fill="currentColor">Maximize active area</text>

  <!-- Row 2: Ctrl + PgUp | Next workspace -->
  <rect x="420" y="192" width="38" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="439" y="208" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Ctrl</text>
  <text x="466" y="208" font-size="13" fill="currentColor" opacity="0.5" text-anchor="middle">+</text>
  <rect x="474" y="192" width="44" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="496" y="208" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">PgUp</text>
  <text x="580" y="208" font-size="13" fill="currentColor">Next workspace</text>

  <!-- Row 3: Ctrl + PgDn | Previous workspace -->
  <rect x="420" y="222" width="38" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="439" y="238" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Ctrl</text>
  <text x="466" y="238" font-size="13" fill="currentColor" opacity="0.5" text-anchor="middle">+</text>
  <rect x="474" y="222" width="44" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="496" y="238" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">PgDn</text>
  <text x="580" y="238" font-size="13" fill="currentColor">Previous workspace</text>

  <!-- Row 4: Right-click | Split / Join area (on border) -->
  <rect x="420" y="252" width="84" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="462" y="268" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Right-click</text>
  <text x="580" y="268" font-size="13" fill="currentColor">Split / Join area (on border)</text>

  <!-- Category 5: MENUS &amp; SEARCH -->
  <text x="420" y="302" font-size="13" font-weight="700" fill="#FF6B00" letter-spacing="1.5">MENUS &amp; SEARCH</text>

  <!-- Row 1: Q | Quick Favorites menu -->
  <rect x="420" y="316" width="24" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="432" y="332" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Q</text>
  <text x="580" y="332" font-size="13" fill="currentColor">Quick Favorites menu</text>

  <!-- Row 2: F3 | Operator search -->
  <rect x="420" y="346" width="30" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="435" y="362" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">F3</text>
  <text x="580" y="362" font-size="13" fill="currentColor">Operator search</text>

  <!-- Row 3: Right-click | Context menu -->
  <rect x="420" y="376" width="84" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="462" y="392" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Right-click</text>
  <text x="580" y="392" font-size="13" fill="currentColor">Context menu</text>

  <!-- Category 6: FILE &amp; HISTORY -->
  <text x="420" y="426" font-size="13" font-weight="700" fill="#FF6B00" letter-spacing="1.5">FILE &amp; HISTORY</text>

  <!-- Row 1: Ctrl + S | Save file -->
  <rect x="420" y="440" width="38" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="439" y="456" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Ctrl</text>
  <text x="466" y="456" font-size="13" fill="currentColor" opacity="0.5" text-anchor="middle">+</text>
  <rect x="474" y="440" width="24" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="486" y="456" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">S</text>
  <text x="580" y="456" font-size="13" fill="currentColor">Save file</text>

  <!-- Row 2: Ctrl + N | New file -->
  <rect x="420" y="470" width="38" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="439" y="486" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Ctrl</text>
  <text x="466" y="486" font-size="13" fill="currentColor" opacity="0.5" text-anchor="middle">+</text>
  <rect x="474" y="470" width="24" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="486" y="486" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">N</text>
  <text x="580" y="486" font-size="13" fill="currentColor">New file</text>

  <!-- Row 3: Ctrl + O | Open file -->
  <rect x="420" y="500" width="38" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="439" y="516" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Ctrl</text>
  <text x="466" y="516" font-size="13" fill="currentColor" opacity="0.5" text-anchor="middle">+</text>
  <rect x="474" y="500" width="24" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="486" y="516" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">O</text>
  <text x="580" y="516" font-size="13" fill="currentColor">Open file</text>

  <!-- Row 4: Ctrl + Z | Undo -->
  <rect x="420" y="530" width="38" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="439" y="546" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Ctrl</text>
  <text x="466" y="546" font-size="13" fill="currentColor" opacity="0.5" text-anchor="middle">+</text>
  <rect x="474" y="530" width="24" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="486" y="546" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Z</text>
  <text x="580" y="546" font-size="13" fill="currentColor">Undo</text>

  <!-- Row 5: Ctrl + Shift + Z | Redo -->
  <rect x="420" y="560" width="38" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="439" y="576" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Ctrl</text>
  <text x="466" y="576" font-size="13" fill="currentColor" opacity="0.5" text-anchor="middle">+</text>
  <rect x="474" y="560" width="42" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="495" y="576" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Shift</text>
  <text x="524" y="576" font-size="13" fill="currentColor" opacity="0.5" text-anchor="middle">+</text>
  <rect x="532" y="560" width="24" height="22" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="544" y="576" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Z</text>
  <text x="580" y="576" font-size="13" fill="currentColor">Redo</text>

  <!-- Footer tip callout -->
  <rect x="40" y="618" width="720" height="34" rx="6"
        fill="#FF6B00" fill-opacity="0.10"
        stroke="#FF6B00" stroke-opacity="0.4"/>
  <text x="54" y="640" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Hover over any menu item or button in Blender to see its assigned shortcut in the tooltip.
  </text>

</svg>
