<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="mf-title mf-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="mf-title">Microfacet surface structure at four roughness values</title>
  <desc id="mf-desc">Four cross-section panels of a surface magnified to the microscopic level. At roughness zero the tiny mirror facets all line up flat, so one incoming ray reflects as a single sharp ray. At roughness 0.3 the facets tilt slightly and the reflection spreads into a narrow cone. At roughness 0.7 the facets vary widely and the reflection becomes a wide cone. At roughness 1.0 the facets point in random directions and light scatters across the whole hemisphere as diffuse reflection.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Microfacets: Roughness at the Microscopic Scale</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Facet alignment controls how one ray scatters into many</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Panel 1: Roughness 0.0 -->
  <text x="135" y="150" font-size="14" font-weight="600" text-anchor="middle" fill="currentColor">Roughness 0.0</text>
  <text x="135" y="168" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.6">Aligned facets</text>
  <line x1="40" y1="300" x2="230" y2="300" stroke="currentColor" stroke-width="1.2" opacity="0.3" stroke-dasharray="5 6"/>
  <!-- flat facet row -->
  <polyline points="48,300 64,292 80,300 96,292 112,300 128,292 144,300 160,292 176,300 192,292 208,300 224,292"
            fill="none" stroke="currentColor" stroke-width="2.4" opacity="0.7"/>
  <!-- incoming + single reflection -->
  <line x1="100" y1="190" x2="135" y2="296" stroke="#F4C430" stroke-width="3" marker-end="url(#mf-in)"/>
  <line x1="135" y1="296" x2="172" y2="190" stroke="#FF6B00" stroke-width="3" marker-end="url(#mf-out)"/>
  <text x="135" y="332" font-size="11.5" text-anchor="middle" fill="#FF6B00">Sharp single ray</text>

  <!-- Panel 2: Roughness 0.3 -->
  <text x="325" y="150" font-size="14" font-weight="600" text-anchor="middle" fill="currentColor">Roughness 0.3</text>
  <text x="325" y="168" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.6">Slight variation</text>
  <line x1="230" y1="300" x2="420" y2="300" stroke="currentColor" stroke-width="1.2" opacity="0.3" stroke-dasharray="5 6"/>
  <polyline points="238,300 254,290 270,302 286,289 302,301 318,291 334,300 350,288 366,302 382,292 398,300 414,290"
            fill="none" stroke="currentColor" stroke-width="2.4" opacity="0.7"/>
  <line x1="290" y1="190" x2="325" y2="296" stroke="#F4C430" stroke-width="3" marker-end="url(#mf-in)"/>
  <line x1="325" y1="296" x2="348" y2="190" stroke="#FF6B00" stroke-width="2.2" marker-end="url(#mf-out)"/>
  <line x1="325" y1="296" x2="368" y2="200" stroke="#FF6B00" stroke-width="1.6" opacity="0.7" marker-end="url(#mf-out)"/>
  <line x1="325" y1="296" x2="330" y2="190" stroke="#FF6B00" stroke-width="1.6" opacity="0.7" marker-end="url(#mf-out)"/>
  <text x="325" y="332" font-size="11.5" text-anchor="middle" fill="#FF6B00">Narrow cone</text>

  <!-- Panel 3: Roughness 0.7 -->
  <text x="515" y="150" font-size="14" font-weight="600" text-anchor="middle" fill="currentColor">Roughness 0.7</text>
  <text x="515" y="168" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.6">Wide variation</text>
  <line x1="420" y1="300" x2="610" y2="300" stroke="currentColor" stroke-width="1.2" opacity="0.3" stroke-dasharray="5 6"/>
  <polyline points="428,300 444,284 460,304 476,286 492,302 508,283 524,305 540,287 556,301 572,284 588,304 604,288"
            fill="none" stroke="currentColor" stroke-width="2.4" opacity="0.7"/>
  <line x1="480" y1="190" x2="515" y2="296" stroke="#F4C430" stroke-width="3" marker-end="url(#mf-in)"/>
  <line x1="515" y1="296" x2="470" y2="206" stroke="#FF6B00" stroke-width="1.5" opacity="0.75" marker-end="url(#mf-out)"/>
  <line x1="515" y1="296" x2="505" y2="192" stroke="#FF6B00" stroke-width="1.5" opacity="0.75" marker-end="url(#mf-out)"/>
  <line x1="515" y1="296" x2="545" y2="196" stroke="#FF6B00" stroke-width="1.5" opacity="0.75" marker-end="url(#mf-out)"/>
  <line x1="515" y1="296" x2="572" y2="216" stroke="#FF6B00" stroke-width="1.5" opacity="0.75" marker-end="url(#mf-out)"/>
  <text x="515" y="332" font-size="11.5" text-anchor="middle" fill="#FF6B00">Wide cone</text>

  <!-- Panel 4: Roughness 1.0 -->
  <text x="705" y="150" font-size="14" font-weight="600" text-anchor="middle" fill="currentColor">Roughness 1.0</text>
  <text x="705" y="168" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.6">Random facets</text>
  <line x1="610" y1="300" x2="768" y2="300" stroke="currentColor" stroke-width="1.2" opacity="0.3" stroke-dasharray="5 6"/>
  <polyline points="618,300 632,282 646,306 660,284 674,304 688,281 702,307 716,283 730,305 744,282 758,304 768,290"
            fill="none" stroke="currentColor" stroke-width="2.4" opacity="0.7"/>
  <line x1="678" y1="190" x2="705" y2="296" stroke="#F4C430" stroke-width="3" marker-end="url(#mf-in)"/>
  <line x1="705" y1="296" x2="640" y2="232" stroke="#FF6B00" stroke-width="1.3" opacity="0.7" marker-end="url(#mf-out)"/>
  <line x1="705" y1="296" x2="660" y2="200" stroke="#FF6B00" stroke-width="1.3" opacity="0.7" marker-end="url(#mf-out)"/>
  <line x1="705" y1="296" x2="700" y2="188" stroke="#FF6B00" stroke-width="1.3" opacity="0.7" marker-end="url(#mf-out)"/>
  <line x1="705" y1="296" x2="745" y2="196" stroke="#FF6B00" stroke-width="1.3" opacity="0.7" marker-end="url(#mf-out)"/>
  <line x1="705" y1="296" x2="766" y2="232" stroke="#FF6B00" stroke-width="1.3" opacity="0.7" marker-end="url(#mf-out)"/>
  <text x="705" y="332" font-size="11.5" text-anchor="middle" fill="#FF6B00">Hemispherical scatter</text>

  <!-- panel dividers -->
  <line x1="230" y1="138" x2="230" y2="346" stroke="currentColor" stroke-width="1" opacity="0.12"/>
  <line x1="420" y1="138" x2="420" y2="346" stroke="currentColor" stroke-width="1" opacity="0.12"/>
  <line x1="610" y1="138" x2="610" y2="346" stroke="currentColor" stroke-width="1" opacity="0.12"/>

  <!-- Legend -->
  <rect x="40" y="372" width="720" height="40" rx="6" fill="currentColor" opacity="0.04"/>
  <line x1="62" y1="392" x2="100" y2="392" stroke="#F4C430" stroke-width="3"/>
  <text x="108" y="396" font-size="13" fill="currentColor">Incoming ray</text>
  <line x1="250" y1="392" x2="288" y2="392" stroke="#FF6B00" stroke-width="3"/>
  <text x="296" y="396" font-size="13" fill="currentColor">Reflected ray(s)</text>
  <text x="468" y="396" font-size="12.5" fill="currentColor" opacity="0.6">Same total energy &#183; only the spread changes.</text>

  <!-- Footer tip (Variant B left rail) -->
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Roughness does not blur a reflection &#183; it changes how millions of mirror facets line up.
  </text>

  <defs>
    <marker id="mf-in" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#F4C430"/></marker>
    <marker id="mf-out" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#FF6B00"/></marker>
  </defs>
</svg>
