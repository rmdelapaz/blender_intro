<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" color="#222" role="img" aria-labelledby="col-title col-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <title id="col-title">How collision distance creates an invisible buffer</title>
    <desc id="col-desc">A side-on cross-section. A grey collision sphere sits in the centre with its solid surface drawn as a line. A dashed orange ring around it marks the collision distance buffer zone. A cyan cloth mesh with visible vertices drapes from above and comes to rest on the dashed buffer ring, never touching the actual sphere surface. A dimension arrow labels the gap between the sphere surface and the buffer as the collision distance.</desc>
    <style>
        .col-h{font:700 24px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:currentColor}
        .col-sub{font:400 14px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:currentColor;opacity:.65}
        .col-lt{font:700 14px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:currentColor}
        .col-ld{font:400 12px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:currentColor;opacity:.62}
        .col-dim{font:700 13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#FF8C00}
        .col-cloth{stroke:#00BCD4;stroke-width:2.5;fill:none}
        .col-vtx{fill:#00BCD4}
    </style>
    <defs>
        <marker id="col-dimL" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#FF8C00"/></marker>
        <marker id="col-dimR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FF8C00"/></marker>
    </defs>
    <rect x="0" y="0" width="800" height="3" fill="#FF8C00"/>
    <text x="40" y="50" class="col-h">COLLISION DISTANCE: THE INVISIBLE BUFFER</text>
    <text x="40" y="76" class="col-sub">Cloth stops at a thin offset around the object, not on its surface</text>
    <line x1="40" y1="96" x2="760" y2="96" stroke="currentColor" stroke-width="1" opacity="0.15"/>

    <!-- Sphere centre ~ (340,330), surface r=110, buffer r=140 -->
    <!-- Buffer zone fill (between surface and buffer ring) -->
    <circle cx="340" cy="330" r="140" fill="#FF8C00" fill-opacity="0.10" stroke="none"/>
    <!-- collision object body: theme-safe currentColor fill (light in dark mode, dark in light mode) -->
    <circle cx="340" cy="330" r="110" fill="currentColor" fill-opacity="0.13"/>

    <!-- buffer ring dashed -->
    <circle cx="340" cy="330" r="140" fill="none" stroke="#FF8C00" stroke-width="2" stroke-dasharray="7 5"/>
    <!-- actual sphere surface solid -->
    <circle cx="340" cy="330" r="110" fill="none" stroke="currentColor" stroke-width="2.5" stroke-opacity="0.85"/>

    <text x="340" y="336" class="col-lt" text-anchor="middle">Collision</text>
    <text x="340" y="356" class="col-lt" text-anchor="middle">object</text>

    <!-- Cloth draping from top, resting on the buffer ring top (y = 330-140 = 190) -->
    <!-- A gentle catenary that dips to touch ~ (340,190) then rises -->
    <path class="col-cloth" d="M120,150 C200,150 250,188 340,190 C430,188 480,150 560,150"/>
    <!-- vertices along cloth -->
    <g class="col-vtx">
        <circle cx="120" cy="150" r="4.5"/><circle cx="185" cy="158" r="4.5"/>
        <circle cx="245" cy="180" r="4.5"/><circle cx="305" cy="190" r="4.5"/>
        <circle cx="340" cy="190" r="4.5"/><circle cx="375" cy="190" r="4.5"/>
        <circle cx="435" cy="180" r="4.5"/><circle cx="495" cy="158" r="4.5"/>
        <circle cx="560" cy="150" r="4.5"/>
    </g>
    <text x="120" y="138" class="col-ld">Cloth mesh (vertices shown)</text>

    <!-- Dimension arrow for the gap: from sphere top (340,220) to buffer top (340,190) along a callout to the right -->
    <!-- draw the gap on the right flank where surface=450,330 buffer=480,330 -->
    <line x1="450" y1="330" x2="450" y2="404" stroke="currentColor" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="3 3"/>
    <line x1="480" y1="330" x2="480" y2="404" stroke="#FF8C00" stroke-width="1" stroke-opacity="0.6" stroke-dasharray="3 3"/>
    <line x1="450" y1="396" x2="480" y2="396" stroke="#FF8C00" stroke-width="2" marker-start="url(#col-dimL)" marker-end="url(#col-dimR)"/>
    <text x="496" y="400" class="col-dim">Distance: 0.02 m</text>
    <text x="496" y="420" class="col-ld">the buffer thickness</text>

    <!-- Labels for the two rings -->
    <line x1="232" y1="330" x2="150" y2="445" stroke="currentColor" stroke-width="1" stroke-opacity="0.35"/>
    <text x="60" y="460" class="col-ld">Solid line = real surface</text>
    <line x1="200" y1="330" x2="120" y2="478" stroke="#FF8C00" stroke-width="1" stroke-opacity="0.5"/>
    <text x="60" y="492" class="col-ld" fill="#FF8C00">Dashed ring = buffer zone</text>

    <!-- takeaway -->
    <text x="600" y="300" class="col-ld">A larger Distance keeps</text>
    <text x="600" y="318" class="col-ld">cloth further off and</text>
    <text x="600" y="336" class="col-ld">prevents poke-through,</text>
    <text x="600" y="354" class="col-ld">but can look like it</text>
    <text x="600" y="372" class="col-ld">floats above the object.</text>
</svg>
