<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="mq-title mq-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="mq-title">Classic camera moves quick reference</title>
  <desc id="mq-desc">A quick-reference card of the seven classic camera moves in two groups. Move through space: Dolly (forward and back), Track (left and right), Crane (up and down), Orbit (circle around subject). Rotate in place: Pan (horizontal rotation), Tilt (vertical rotation), Roll (axis rotation). Each move has a small diagram glyph showing a subject reference, a camera, and an orange motion indicator.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">CAMERA MOVES</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">The seven classic moves at a glance</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ===== Band 1: Move through space ===== -->
  <text x="40" y="136" font-size="14" font-weight="700" fill="currentColor">Move through space</text>
  <line x1="40" y1="146" x2="760" y2="146" stroke="currentColor" stroke-width="1" opacity="0.12"/>

  <!-- DOLLY -->
  <g transform="translate(40,160)">
    <!-- glyph box 64x40 -->
    <g transform="translate(0,4)">
      <!-- subject -->
      <rect x="54" y="14" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <!-- camera -->
      <rect x="4" y="13" width="18" height="14" rx="2" fill="#FF6B00"/>
      <path d="M 22 16 L 30 13 L 30 27 L 22 24 Z" fill="#FF6B00"/>
      <!-- motion arrow: straight in toward subject -->
      <line x1="26" y1="34" x2="48" y2="34" stroke="#FF6B00" stroke-width="2.5" marker-end="url(#mqArrow)"/>
    </g>
    <text x="78" y="18" font-size="15" font-weight="600" fill="currentColor">Dolly</text>
    <text x="78" y="36" font-size="13" fill="currentColor" opacity="0.6">Forward / back (push in-out)</text>
  </g>

  <!-- TRACK -->
  <g transform="translate(400,160)">
    <g transform="translate(0,4)">
      <rect x="30" y="6" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <rect x="4" y="24" width="18" height="14" rx="2" fill="#FF6B00"/>
      <path d="M 22 27 L 30 24 L 30 38 L 22 35 Z" fill="#FF6B00"/>
      <!-- motion arrow: lateral -->
      <line x1="6" y1="44" x2="54" y2="44" stroke="#FF6B00" stroke-width="2.5" marker-start="url(#mqArrowBack)" marker-end="url(#mqArrow)"/>
    </g>
    <text x="78" y="18" font-size="15" font-weight="600" fill="currentColor">Track</text>
    <text x="78" y="36" font-size="13" fill="currentColor" opacity="0.6">Left / right (lateral)</text>
  </g>

  <!-- CRANE -->
  <g transform="translate(40,238)">
    <g transform="translate(0,4)">
      <rect x="48" y="20" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <rect x="18" y="20" width="18" height="14" rx="2" fill="#FF6B00"/>
      <path d="M 36 23 L 44 20 L 44 34 L 36 31 Z" fill="#FF6B00"/>
      <!-- motion arrow: vertical up/down, clear to the left of the body -->
      <line x1="6" y1="46" x2="6" y2="6" stroke="#FF6B00" stroke-width="2.5" marker-start="url(#mqArrowBack)" marker-end="url(#mqArrow)"/>
    </g>
    <text x="78" y="18" font-size="15" font-weight="600" fill="currentColor">Crane</text>
    <text x="78" y="36" font-size="13" fill="currentColor" opacity="0.6">Up / down (boom)</text>
  </g>

  <!-- ORBIT -->
  <g transform="translate(400,238)">
    <g transform="translate(0,4)">
      <!-- subject center -->
      <rect x="28" y="18" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <!-- orbit circle -->
      <circle cx="34" cy="24" r="22" fill="none" stroke="currentColor" stroke-width="1" opacity="0.3" stroke-dasharray="2 3"/>
      <!-- camera on the ring (left) aimed inward -->
      <g transform="translate(6,24)">
        <rect x="-8" y="-7" width="14" height="12" rx="2" fill="#FF6B00"/>
        <path d="M 6 -4 L 13 -7 L 13 5 L 6 2 Z" fill="#FF6B00"/>
      </g>
      <!-- arc motion arrow around top -->
      <path d="M 12 8 A 22 22 0 0 1 56 24" fill="none" stroke="#FF6B00" stroke-width="2.5" marker-end="url(#mqArrow)"/>
    </g>
    <text x="78" y="18" font-size="15" font-weight="600" fill="currentColor">Orbit</text>
    <text x="78" y="36" font-size="13" fill="currentColor" opacity="0.6">Circle around subject</text>
  </g>

  <!-- ===== Band 2: Rotate in place ===== -->
  <text x="40" y="340" font-size="14" font-weight="700" fill="currentColor">Rotate in place</text>
  <line x1="40" y1="350" x2="760" y2="350" stroke="currentColor" stroke-width="1" opacity="0.12"/>

  <!-- PAN -->
  <g transform="translate(40,364)">
    <g transform="translate(0,4)">
      <!-- fixed camera -->
      <rect x="20" y="20" width="18" height="14" rx="2" fill="#FF6B00"/>
      <path d="M 38 23 L 46 20 L 46 34 L 38 31 Z" fill="#FF6B00"/>
      <!-- horizontal rotation arc above -->
      <path d="M 8 16 A 30 30 0 0 1 58 16" fill="none" stroke="#FF6B00" stroke-width="2.5" marker-end="url(#mqArrow)" marker-start="url(#mqArrowBack)"/>
    </g>
    <text x="78" y="18" font-size="15" font-weight="600" fill="currentColor">Pan</text>
    <text x="78" y="36" font-size="13" fill="currentColor" opacity="0.6">Horizontal rotation</text>
  </g>

  <!-- TILT -->
  <g transform="translate(400,364)">
    <g transform="translate(0,4)">
      <rect x="2" y="20" width="18" height="14" rx="2" fill="#FF6B00"/>
      <path d="M 20 23 L 28 20 L 28 34 L 20 31 Z" fill="#FF6B00"/>
      <!-- vertical rotation arc to the right, clear of the lens nub -->
      <path d="M 46 8 A 26 26 0 0 1 46 46" fill="none" stroke="#FF6B00" stroke-width="2.5" marker-end="url(#mqArrow)" marker-start="url(#mqArrowBack)"/>
    </g>
    <text x="78" y="18" font-size="15" font-weight="600" fill="currentColor">Tilt</text>
    <text x="78" y="36" font-size="13" fill="currentColor" opacity="0.6">Vertical rotation</text>
  </g>

  <!-- ROLL -->
  <g transform="translate(40,442)">
    <g transform="translate(0,4)">
      <rect x="14" y="18" width="18" height="14" rx="2" fill="#FF6B00"/>
      <path d="M 32 21 L 40 18 L 40 32 L 32 29 Z" fill="#FF6B00"/>
      <!-- roll: circular arrow around the lens axis (front view ring) -->
      <path d="M 27 4 A 21 21 0 1 1 25 4" fill="none" stroke="#FF6B00" stroke-width="2.5" marker-end="url(#mqArrow)"/>
    </g>
    <text x="78" y="18" font-size="15" font-weight="600" fill="currentColor">Roll</text>
    <text x="78" y="36" font-size="13" fill="currentColor" opacity="0.6">Axis rotation</text>
  </g>

  <!-- arrow markers -->
  <defs>
    <marker id="mqArrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#FF6B00"/>
    </marker>
    <marker id="mqArrowBack" markerWidth="7" markerHeight="7" refX="1" refY="3" orient="auto">
      <path d="M6,0 L0,3 L6,6 Z" fill="#FF6B00"/>
    </marker>
  </defs>

  <!-- Footer tip (Variant B) -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Pan and tilt rotate in place &#183; dolly, track, crane and orbit move the camera through space.</text>
</svg>
