<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" color="currentColor" role="img" aria-labelledby="qfl-title qfl-desc" style="max-width:100%;height:auto">
<title id="qfl-title">The quad flow pattern</title>
<desc id="qfl-desc">A quad subdivides cleanly into four quads while a triangle produces an irregular pole, showing why quad topology is preferred.</desc>
<style>
.qfl-s{fill:none;stroke:currentColor;stroke-width:2}
.qfl-sub{fill:none;stroke:currentColor;stroke-width:1.4;opacity:.55}
.qfl-t{fill:currentColor;font-family:system-ui,Arial,sans-serif}
.qfl-h{font-size:16px;font-weight:700}.qfl-b{font-size:12.5px}.qfl-s2{font-size:11px;opacity:.78}
.qfl-good{fill:#4CAF50}.qfl-bad{fill:#e1483a}
.qfl-arrow{fill:none;stroke:currentColor;stroke-width:2}
</style>
<!-- LEFT: quad -->
<circle cx="40" cy="34" r="8" class="qfl-good"/>
<path d="M36 34 l3 3 l5 -7" fill="none" stroke="#fff" stroke-width="2"/>
<text x="56" y="39" class="qfl-t qfl-h">Quad subdivides cleanly</text>
<rect x="40" y="60" width="110" height="110" class="qfl-s"/>
<path d="M210 115 h44 m0 0 l-8 -7 m8 7 l-8 7" class="qfl-arrow"/>
<g transform="translate(280,60)">
<rect x="0" y="0" width="110" height="110" class="qfl-s"/>
<path d="M55 0 v110 M0 55 h110" class="qfl-sub"/>
</g>
<text x="40" y="200" class="qfl-t qfl-b">Each edge midpoint joins to form</text>
<text x="40" y="218" class="qfl-t qfl-b">4 even quads &#183; predictable, smooth.</text>
<text x="40" y="244" class="qfl-t qfl-s2">Edge loops stay continuous &#8594; clean</text>
<text x="40" y="260" class="qfl-t qfl-s2">deformation and subdivision.</text>
<!-- divider -->
<path d="M460 40 v280" stroke="currentColor" stroke-width="1" opacity=".3"/>
<!-- RIGHT: triangle -->
<circle cx="496" cy="34" r="8" class="qfl-bad"/>
<path d="M492 30 l8 8 M500 30 l-8 8" fill="none" stroke="#fff" stroke-width="2"/>
<text x="512" y="39" class="qfl-t qfl-h">Triangle = pole</text>
<path d="M540 168 l55 -108 l55 108 z" class="qfl-s"/>
<path d="M700 115 h0" />
<path d="M540 168 l55 -108 l55 108 z" transform="translate(0,0)" class="qfl-s" opacity="0"/>
<!-- subdivided triangle showing central pole -->
<g transform="translate(540,60)">
<path d="M55 0 l55 108 l-110 0 z" class="qfl-s"/>
<path d="M27 54 L83 54 M55 0 L55 108 M27 54 L82 54" class="qfl-sub"/>
<path d="M27 54 l28 54 M83 54 l-28 54 M27 54 q28 -10 56 0" class="qfl-sub"/>
<circle cx="55" cy="62" r="4.5" class="qfl-bad"/>
</g>
<text x="496" y="200" class="qfl-t qfl-b">Subdividing forces a 3- or 5-edge</text>
<text x="496" y="218" class="qfl-t qfl-b">pole (red) &#183; pinches &amp; shading.</text>
<text x="496" y="244" class="qfl-t qfl-s2">Poles break edge-loop flow and</text>
<text x="496" y="260" class="qfl-t qfl-s2">show as artifacts when posed.</text>
<!-- key -->
<circle cx="50" cy="318" r="5" class="qfl-good"/><text x="62" y="322" class="qfl-t qfl-s2">Clean 4-edge vertices</text>
<circle cx="370" cy="318" r="5" class="qfl-bad"/><text x="382" y="322" class="qfl-t qfl-s2">Pole (3 or 5+ edges) &#8211; avoid in flex areas</text>
</svg>
