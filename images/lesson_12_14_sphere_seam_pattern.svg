<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="ss-title ss-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="ss-title">Sphere Seam Pattern and Pole Pinch Distortion</title>
  <desc id="ss-desc">A two panel diagram. The left panel shows a sphere with longitude seam lines running pole to pole in red, like the segments of an orange peel. The right panel shows the resulting UV layout: vertical orange-peel segments that are full width at the equator and pinch to narrow points at the top and bottom poles, illustrating the characteristic distortion of sphere unwrapping.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">SPHERE SEAM PATTERN</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Longitude seams unwrap a sphere, but the poles always pinch</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <line x1="400" y1="138" x2="400" y2="496" stroke="#FF6B00" stroke-width="2" opacity="0.55"/>

  <text x="200" y="158" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor">Longitude Seams</text>
  <text x="600" y="158" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor">Pole Pinch Distortion</text>

  <!-- LEFT: sphere, cyan wires -->
  <g stroke="#00bcd4" stroke-width="2.5" fill="none">
    <!-- outline -->
    <circle cx="200" cy="320" r="100"/>
    <!-- latitude ellipses -->
    <ellipse cx="200" cy="320" rx="100" ry="34"/>
    <ellipse cx="200" cy="284" rx="86" ry="24"/>
    <ellipse cx="200" cy="356" rx="86" ry="24"/>
  </g>

  <!-- LEFT: longitude seams pole-to-pole in red (orange-peel segments) -->
  <g stroke="#ff0000" stroke-width="3.5" fill="none" stroke-linecap="round">
    <path d="M 200 220 Q 140 320 200 420"/>
    <path d="M 200 220 Q 260 320 200 420"/>
    <path d="M 200 220 Q 96 320 200 420"/>
    <path d="M 200 220 Q 304 320 200 420"/>
  </g>

  <!-- RIGHT: UV = orange-peel segments pinching at poles -->
  <g stroke="#FF6B00" stroke-width="2.5" fill="#FF6B00" fill-opacity="0.10">
    <!-- four lens/segment shapes, full at equator (y=320), pinched at top/bottom -->
    <path d="M 512 224 Q 540 320 512 416 Q 484 320 512 224 Z"/>
    <path d="M 570 224 Q 598 320 570 416 Q 542 320 570 224 Z"/>
    <path d="M 628 224 Q 656 320 628 416 Q 600 320 628 224 Z"/>
    <path d="M 686 224 Q 714 320 686 416 Q 658 320 686 224 Z"/>
  </g>
  <!-- pinch markers at poles -->
  <g font-size="12" font-weight="600" fill="#E63946" text-anchor="middle">
    <text x="600" y="214">pinch &#8593;</text>
    <text x="600" y="438">pinch &#8595;</text>
  </g>
  <text x="600" y="328" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor" opacity="0.8">equator: full width</text>

  <!-- Footer tip -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Spheres cannot unwrap without some pole distortion; more segments spread it but never remove it.
  </text>
</svg>
