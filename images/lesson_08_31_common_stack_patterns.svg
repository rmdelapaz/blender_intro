<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="sp-title sp-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="sp-title">Common modifier stack patterns</title>
  <desc id="sp-desc">Four reusable modifier stack recipes shown as ordered chip lists read bottom to top: a hard-surface panel stack of Mirror then Bevel then Subdivision, a fence or railing stack of Array then Mirror, an organic smoothing stack of Mirror then Subdivision then Bevel, and a tiled-grid stack of Array then Array. Each recipe lists the order rule and a typical use case.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Common Stack Patterns</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Reusable modifier recipes · read each stack bottom to top, the way Blender evaluates it</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ============ Pattern 1: Hard-surface (top-left) ============ -->
  <rect x="40" y="132" width="350" height="232" rx="10" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.12" stroke-width="1.5"/>
  <text x="60" y="162" font-size="16" font-weight="700" fill="#FF6B00">1 · Hard-surface panel</text>

  <!-- Stack chips (bottom-to-top, drawn top row = last evaluated) -->
  <!-- Subdivision (top / last) -->
  <rect x="60" y="178" width="180" height="28" rx="6" fill="#B47EE8" fill-opacity="0.9"/>
  <text x="150" y="197" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Subdivision</text>
  <!-- Bevel (middle) -->
  <rect x="60" y="210" width="180" height="28" rx="6" fill="#4A9EFF" fill-opacity="0.9"/>
  <text x="150" y="229" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Bevel</text>
  <!-- Mirror (bottom / first) -->
  <rect x="60" y="242" width="180" height="28" rx="6" fill="#4ADE80" fill-opacity="0.9"/>
  <text x="150" y="261" font-size="13" font-weight="700" fill="#0f1a14" text-anchor="middle">Mirror</text>
  <!-- bottom-to-top arrow -->
  <g stroke="currentColor" stroke-opacity="0.4" stroke-width="2" fill="none">
    <line x1="256" y1="262" x2="256" y2="190" stroke-linecap="round"/>
  </g>
  <polygon points="250,194 256,180 262,194" fill="currentColor" fill-opacity="0.4"/>
  <text x="276" y="200" font-size="11" fill="currentColor" opacity="0.55">last</text>
  <text x="272" y="262" font-size="11" fill="currentColor" opacity="0.55">first</text>

  <text x="60" y="298" font-size="13" font-weight="600" fill="currentColor">Order rule</text>
  <text x="60" y="318" font-size="12.5" fill="currentColor" opacity="0.72">Mirror builds the whole part, Bevel rounds its</text>
  <text x="60" y="336" font-size="12.5" fill="currentColor" opacity="0.72">edges, Subdivision smooths last.</text>
  <text x="60" y="356" font-size="12" fill="#FF6B00" font-weight="600">Use for: symmetrical props, machine parts</text>

  <!-- ============ Pattern 2: Fence / railing (top-right) ============ -->
  <rect x="410" y="132" width="350" height="232" rx="10" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.12" stroke-width="1.5"/>
  <text x="430" y="162" font-size="16" font-weight="700" fill="#FF6B00">2 · Fence or railing</text>

  <!-- Mirror (top / last) -->
  <rect x="430" y="178" width="180" height="28" rx="6" fill="#4ADE80" fill-opacity="0.9"/>
  <text x="520" y="197" font-size="13" font-weight="700" fill="#0f1a14" text-anchor="middle">Mirror</text>
  <!-- Array (bottom / first) -->
  <rect x="430" y="210" width="180" height="28" rx="6" fill="#F5C242" fill-opacity="0.95"/>
  <text x="520" y="229" font-size="13" font-weight="700" fill="#0f1a14" text-anchor="middle">Array</text>
  <g stroke="currentColor" stroke-opacity="0.4" stroke-width="2" fill="none">
    <line x1="626" y1="230" x2="626" y2="190" stroke-linecap="round"/>
  </g>
  <polygon points="620,194 626,180 632,194" fill="currentColor" fill-opacity="0.4"/>
  <text x="646" y="200" font-size="11" fill="currentColor" opacity="0.55">last</text>
  <text x="642" y="230" font-size="11" fill="currentColor" opacity="0.55">first</text>

  <text x="430" y="270" font-size="13" font-weight="600" fill="currentColor">Order rule</text>
  <text x="430" y="290" font-size="12.5" fill="currentColor" opacity="0.72">Array repeats one post into a run, then Mirror</text>
  <text x="430" y="308" font-size="12.5" fill="currentColor" opacity="0.72">copies the whole run to the far side.</text>
  <text x="430" y="328" font-size="12" fill="currentColor" opacity="0.55">Swap the order and Mirror only doubles a</text>
  <text x="430" y="346" font-size="12" fill="currentColor" opacity="0.55">single post before it gets repeated.</text>
  <text x="430" y="360" font-size="12" fill="#FF6B00" font-weight="600" opacity="0">spacer</text>

  <!-- ============ Pattern 3: Organic / character (bottom-left) ============ -->
  <rect x="40" y="380" width="350" height="232" rx="10" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.12" stroke-width="1.5"/>
  <text x="60" y="410" font-size="16" font-weight="700" fill="#FF6B00">3 · Organic / character</text>

  <!-- Bevel (top / last) -->
  <rect x="60" y="426" width="180" height="28" rx="6" fill="#4A9EFF" fill-opacity="0.9"/>
  <text x="150" y="445" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Bevel</text>
  <!-- Subdivision (middle) -->
  <rect x="60" y="458" width="180" height="28" rx="6" fill="#B47EE8" fill-opacity="0.9"/>
  <text x="150" y="477" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Subdivision</text>
  <!-- Mirror (bottom / first) -->
  <rect x="60" y="490" width="180" height="28" rx="6" fill="#4ADE80" fill-opacity="0.9"/>
  <text x="150" y="509" font-size="13" font-weight="700" fill="#0f1a14" text-anchor="middle">Mirror</text>
  <g stroke="currentColor" stroke-opacity="0.4" stroke-width="2" fill="none">
    <line x1="256" y1="510" x2="256" y2="438" stroke-linecap="round"/>
  </g>
  <polygon points="250,442 256,428 262,442" fill="currentColor" fill-opacity="0.4"/>
  <text x="276" y="448" font-size="11" fill="currentColor" opacity="0.55">last</text>
  <text x="272" y="510" font-size="11" fill="currentColor" opacity="0.55">first</text>

  <text x="60" y="546" font-size="13" font-weight="600" fill="currentColor">Order rule</text>
  <text x="60" y="566" font-size="12.5" fill="currentColor" opacity="0.72">Mirror builds both halves, Subdivision smooths</text>
  <text x="60" y="584" font-size="12.5" fill="currentColor" opacity="0.72">the form, a light Bevel sharpens key edges.</text>
  <text x="60" y="604" font-size="12" fill="#FF6B00" font-weight="600">Use for: heads, bodies, soft props</text>

  <!-- ============ Pattern 4: Tiled grid (bottom-right) ============ -->
  <rect x="410" y="380" width="350" height="232" rx="10" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.12" stroke-width="1.5"/>
  <text x="430" y="410" font-size="16" font-weight="700" fill="#FF6B00">4 · Tiled grid</text>

  <!-- Array Y (top / last) -->
  <rect x="430" y="426" width="180" height="28" rx="6" fill="#F5C242" fill-opacity="0.95"/>
  <text x="520" y="445" font-size="13" font-weight="700" fill="#0f1a14" text-anchor="middle">Array · Y</text>
  <!-- Array X (bottom / first) -->
  <rect x="430" y="458" width="180" height="28" rx="6" fill="#F5C242" fill-opacity="0.65"/>
  <text x="520" y="477" font-size="13" font-weight="700" fill="#0f1a14" text-anchor="middle">Array · X</text>
  <g stroke="currentColor" stroke-opacity="0.4" stroke-width="2" fill="none">
    <line x1="626" y1="478" x2="626" y2="438" stroke-linecap="round"/>
  </g>
  <polygon points="620,442 626,428 632,442" fill="currentColor" fill-opacity="0.4"/>
  <text x="646" y="448" font-size="11" fill="currentColor" opacity="0.55">last</text>
  <text x="642" y="478" font-size="11" fill="currentColor" opacity="0.55">first</text>

  <text x="430" y="518" font-size="13" font-weight="600" fill="currentColor">Order rule</text>
  <text x="430" y="538" font-size="12.5" fill="currentColor" opacity="0.72">First Array makes a row on X, the second</text>
  <text x="430" y="556" font-size="12.5" fill="currentColor" opacity="0.72">Array repeats that row on Y into a full grid.</text>
  <text x="430" y="576" font-size="12" fill="#FF6B00" font-weight="600">Use for: tile floors, windows, fences</text>

  <!-- Footer tip (Variant B, left rail) -->
  <rect x="40" y="641" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> When a stack looks wrong, check the order first · the same modifiers in a new order give a new result.</text>
</svg>
