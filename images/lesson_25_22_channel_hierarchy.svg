<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="ch-title ch-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="ch-title">Dope Sheet channel hierarchy</title>
  <desc id="ch-desc">A tree diagram of the channel hierarchy in the Dope Sheet. The object Cube expands into Location, Rotation, and Scale groups. Each group expands into individual X, Y, and Z channels, each of which can hold its own keyframes shown as diamonds. Expand and collapse arrows sit beside each parent group.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Dope Sheet Channel Hierarchy</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Every transform breaks down into individually keyable X, Y, Z channels</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- keyframe diamond helper drawn inline; rows at fixed ys.
       Indent columns: object x=56, group x=96, channel x=150.
       Keyframe lane starts at x=470. -->

  <!-- Object: Cube (expanded, down arrow) -->
  <polygon points="40,162 52,162 46,170" fill="currentColor" opacity="0.55"/>
  <text x="60" y="171" font-size="16" font-weight="700" fill="currentColor">Cube</text>

  <!-- tree trunk from Cube down -->
  <line x1="58" y1="178" x2="58" y2="600" stroke="currentColor" stroke-width="1" opacity="0.2"/>

  <!-- ===== Group: Location (expanded, down arrow) ===== -->
  <polygon points="82,198 94,198 88,206" fill="#FF6B00"/>
  <text x="104" y="207" font-size="15" font-weight="600" fill="currentColor">Location</text>
  <line x1="58" y1="202" x2="84" y2="202" stroke="currentColor" stroke-width="1" opacity="0.2"/>
  <!-- channels X/Y/Z -->
  <g>
    <line x1="120" y1="208" x2="120" y2="300" stroke="currentColor" stroke-width="1" opacity="0.2"/>
    <!-- X -->
    <line x1="120" y1="232" x2="146" y2="232" stroke="currentColor" stroke-width="1" opacity="0.2"/>
    <text x="150" y="237" font-size="14" fill="currentColor">X Location</text>
    <path d="M 470 232 l 8 8 l -8 8 l -8 -8 Z" fill="#F5C242"/>
    <path d="M 600 232 l 8 8 l -8 8 l -8 -8 Z" fill="#F5C242"/>
    <!-- Y -->
    <line x1="120" y1="264" x2="146" y2="264" stroke="currentColor" stroke-width="1" opacity="0.2"/>
    <text x="150" y="269" font-size="14" fill="currentColor">Y Location</text>
    <path d="M 530 264 l 8 8 l -8 8 l -8 -8 Z" fill="#F5C242"/>
    <!-- Z -->
    <line x1="120" y1="296" x2="146" y2="296" stroke="currentColor" stroke-width="1" opacity="0.2"/>
    <text x="150" y="301" font-size="14" fill="currentColor">Z Location</text>
    <path d="M 470 296 l 8 8 l -8 8 l -8 -8 Z" fill="#F5C242"/>
    <path d="M 535 296 l 8 8 l -8 8 l -8 -8 Z" fill="#F5C242"/>
    <path d="M 600 296 l 8 8 l -8 8 l -8 -8 Z" fill="#F5C242"/>
    <path d="M 665 296 l 8 8 l -8 8 l -8 -8 Z" fill="#F5C242"/>
  </g>

  <!-- ===== Group: Rotation (expanded, down arrow) ===== -->
  <polygon points="82,334 94,334 88,342" fill="#FF6B00"/>
  <text x="104" y="343" font-size="15" font-weight="600" fill="currentColor">Rotation</text>
  <line x1="58" y1="338" x2="84" y2="338" stroke="currentColor" stroke-width="1" opacity="0.2"/>
  <g>
    <line x1="120" y1="344" x2="120" y2="436" stroke="currentColor" stroke-width="1" opacity="0.2"/>
    <line x1="120" y1="368" x2="146" y2="368" stroke="currentColor" stroke-width="1" opacity="0.2"/>
    <text x="150" y="373" font-size="14" fill="currentColor">X Euler Rotation</text>
    <line x1="120" y1="400" x2="146" y2="400" stroke="currentColor" stroke-width="1" opacity="0.2"/>
    <text x="150" y="405" font-size="14" fill="currentColor">Y Euler Rotation</text>
    <path d="M 565 400 l 8 8 l -8 8 l -8 -8 Z" fill="#F5C242"/>
    <line x1="120" y1="432" x2="146" y2="432" stroke="currentColor" stroke-width="1" opacity="0.2"/>
    <text x="150" y="437" font-size="14" fill="currentColor">Z Euler Rotation</text>
    <path d="M 470 432 l 8 8 l -8 8 l -8 -8 Z" fill="#F5C242"/>
    <path d="M 665 432 l 8 8 l -8 8 l -8 -8 Z" fill="#F5C242"/>
  </g>

  <!-- ===== Group: Scale (collapsed, right arrow) ===== -->
  <polygon points="84,468 92,474 84,480" fill="currentColor" opacity="0.55"/>
  <text x="104" y="479" font-size="15" font-weight="600" fill="currentColor">Scale</text>
  <line x1="58" y1="474" x2="84" y2="474" stroke="currentColor" stroke-width="1" opacity="0.2"/>
  <text x="180" y="479" font-size="13" fill="currentColor" opacity="0.45" font-style="italic">collapsed &#183; click the arrow to expand X, Y, Z</text>

  <!-- Keyframe lane guide line + frame ticks header -->
  <line x1="450" y1="150" x2="450" y2="492" stroke="currentColor" stroke-width="1" opacity="0.12"/>
  <text x="610" y="146" font-size="12" fill="currentColor" opacity="0.5" text-anchor="middle">keyframes per channel &#8594;</text>

  <!-- Legend card -->
  <rect x="40" y="516" width="720" height="86" rx="8" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.12" stroke-width="1"/>
  <!-- expand arrow sample -->
  <polygon points="58,540 70,540 64,548" fill="#FF6B00"/>
  <text x="84" y="551" font-size="13" fill="currentColor">Orange arrow points down = expanded.  Grey arrow points right = collapsed.</text>
  <!-- diamond sample -->
  <path d="M 64 572 l 8 8 l -8 8 l -8 -8 Z" fill="#F5C242"/>
  <text x="84" y="585" font-size="13" fill="currentColor">Each diamond is one keyframe on that single axis, set independently of the others.</text>

  <!-- Footer tip (Variant B, 680 variant: y=641) -->
  <rect x="40" y="641" width="720" height="34" fill="none"/>
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Because each axis is its own channel, you can retime just Z without touching X or Y. That is the Dope Sheet's superpower.
  </text>
</svg>
