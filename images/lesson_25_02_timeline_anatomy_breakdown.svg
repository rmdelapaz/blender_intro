<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="ta-title ta-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="ta-title">Timeline editor anatomy breakdown</title>
  <desc id="ta-desc">A labeled diagram of Blender's Timeline editor. The transport controls sit at the left of the header for play, pause, and frame jumps. The current frame field shows the active frame. The start and end fields set the playback range. The frame ruler runs across the top with numbered ticks. The blue playhead marks the current frame. Orange diamonds on the track are keyframes. The scrub area below the ruler is where you drag to move through time.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Timeline Anatomy</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">The parts of the Timeline editor, and what each one does</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ===== Mock Timeline editor (x 40..760, y 150..300) ===== -->
  <!-- Editor outer frame -->
  <rect x="40" y="150" width="720" height="150" rx="6" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-width="1" opacity="0.9" stroke-opacity="0.2"/>

  <!-- Header bar -->
  <rect x="40" y="150" width="720" height="40" rx="6" fill="currentColor" fill-opacity="0.06"/>
  <line x1="40" y1="190" x2="760" y2="190" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Transport controls (left of header) -->
  <g fill="currentColor" opacity="0.75">
    <path d="M 62 162 L 62 178 L 56 170 Z"/>
    <rect x="74" y="162" width="3" height="16"/>
    <path d="M 80 162 L 80 178 L 90 170 Z"/>
    <path d="M 100 162 L 100 178 L 110 170 Z"/>
    <rect x="112" y="162" width="3" height="16"/>
    <path d="M 130 162 L 130 178 L 124 170 Z"/>
    <rect x="118" y="162" width="3" height="16"/>
  </g>

  <!-- Current frame field -->
  <rect x="152" y="160" width="62" height="20" rx="4" fill="#4A9EFF" fill-opacity="0.18" stroke="#4A9EFF" stroke-width="1"/>
  <text x="183" y="174" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">24</text>

  <!-- Start / End range fields (right of header) -->
  <rect x="612" y="160" width="62" height="20" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>
  <text x="643" y="174" font-size="12" fill="currentColor" text-anchor="middle">Start 1</text>
  <rect x="684" y="160" width="62" height="20" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>
  <text x="715" y="174" font-size="12" fill="currentColor" text-anchor="middle">End 96</text>

  <!-- Frame ruler ticks -->
  <g stroke="currentColor" stroke-opacity="0.3" stroke-width="1">
    <line x1="90" y1="190" x2="90" y2="200"/>
    <line x1="190" y1="190" x2="190" y2="200"/>
    <line x1="290" y1="190" x2="290" y2="200"/>
    <line x1="390" y1="190" x2="390" y2="200"/>
    <line x1="490" y1="190" x2="490" y2="200"/>
    <line x1="590" y1="190" x2="590" y2="200"/>
    <line x1="690" y1="190" x2="690" y2="200"/>
  </g>
  <g font-size="10" fill="currentColor" opacity="0.5" text-anchor="middle">
    <text x="90" y="212">1</text>
    <text x="190" y="212">20</text>
    <text x="290" y="212">40</text>
    <text x="390" y="212">60</text>
    <text x="490" y="212">80</text>
    <text x="590" y="212">100</text>
  </g>

  <!-- Scrub track area -->
  <rect x="40" y="220" width="720" height="80" fill="currentColor" fill-opacity="0.02"/>

  <!-- Keyframe diamonds on the track -->
  <g fill="#F5C242" stroke="currentColor" stroke-opacity="0.3" stroke-width="1">
    <path d="M 90 262 L 100 272 L 90 282 L 80 272 Z"/>
    <path d="M 240 262 L 250 272 L 240 282 L 230 272 Z"/>
    <path d="M 430 262 L 440 272 L 430 282 L 420 272 Z"/>
    <path d="M 590 262 L 600 272 L 590 282 L 580 272 Z"/>
  </g>

  <!-- Playhead (blue vertical line + top handle) at frame 24 -> x=210 -->
  <line x1="210" y1="190" x2="210" y2="300" stroke="#4A9EFF" stroke-width="2"/>
  <rect x="201" y="190" width="18" height="14" rx="2" fill="#4A9EFF"/>

  <!-- ===== Callout labels with leader lines ===== -->
  <g stroke="currentColor" stroke-opacity="0.3" stroke-width="1.5" stroke-linecap="round" fill="none">
    <line x1="95" y1="195" x2="95" y2="350"/>
    <line x1="183" y1="150" x2="183" y2="132"/>
    <line x1="715" y1="150" x2="715" y2="132"/>
    <line x1="390" y1="200" x2="390" y2="350"/>
    <line x1="210" y1="300" x2="210" y2="430"/>
    <line x1="600" y1="272" x2="660" y2="380"/>
    <line x1="500" y1="288" x2="500" y2="420"/>
  </g>

  <!-- Transport label -->
  <text x="95" y="368" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">Transport controls</text>
  <text x="95" y="385" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">Play, pause, jump frames</text>

  <!-- Current frame label (above editor) -->
  <text x="183" y="126" font-size="13" font-weight="600" fill="#4A9EFF" text-anchor="middle">Current frame</text>

  <!-- Range fields label (above editor) -->
  <text x="690" y="126" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">Start / End range</text>

  <!-- Frame ruler label -->
  <text x="390" y="368" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">Frame ruler</text>
  <text x="390" y="385" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">Numbered timeline of frames</text>

  <!-- Playhead label -->
  <text x="210" y="448" font-size="13" font-weight="600" fill="#4A9EFF" text-anchor="middle">Playhead</text>
  <text x="210" y="465" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">Marks the current frame</text>

  <!-- Keyframe label -->
  <text x="660" y="398" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">Keyframes</text>
  <text x="660" y="415" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">Stored poses on the track</text>

  <!-- Scrub label -->
  <text x="500" y="438" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">Scrub area</text>
  <text x="500" y="455" font-size="12" fill="currentColor" opacity="0.6" text-anchor="middle">Drag to move through time</text>

  <!-- Footer tip (Variant B left rail, 560 canvas: y=506) -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> The blue playhead and the current frame field always agree. Drag one and the other follows.
  </text>
</svg>
