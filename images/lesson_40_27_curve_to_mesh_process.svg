<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="ctm-title ctm-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="ctm-title">Curve to Mesh process</title>
  <desc id="ctm-desc">Three-stage diagram of the Curve to Mesh node: a path curve plus a circle profile curve combine to sweep the profile along the path, producing a cylindrical rail mesh.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">CURVE TO MESH</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Sweep a profile curve along a path to build a solid mesh</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Stage 1: Path curve -->
  <text x="140" y="164" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor">Path (Curve)</text>
  <rect x="40" y="180" width="200" height="180" rx="8" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.2" stroke-width="1.5"/>
  <path d="M 70 330 C 110 210, 170 330, 210 220" fill="none" stroke="#4A9EFF" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="70" cy="330" r="5" fill="#4A9EFF"/>
  <circle cx="210" cy="220" r="5" fill="#4A9EFF"/>
  <text x="140" y="348" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6" font-style="italic">where it goes</text>

  <!-- Plus -->
  <text x="272" y="278" text-anchor="middle" font-size="34" font-weight="700" fill="#FF6B00">+</text>

  <!-- Stage 2: Profile circle -->
  <text x="400" y="164" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor">Profile (Curve)</text>
  <rect x="304" y="180" width="192" height="180" rx="8" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.2" stroke-width="1.5"/>
  <ellipse cx="400" cy="268" rx="52" ry="52" fill="none" stroke="#B47EE8" stroke-width="3.5"/>
  <circle cx="400" cy="268" r="4" fill="#B47EE8"/>
  <text x="400" y="348" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6" font-style="italic">cross-section shape</text>

  <!-- Equals -->
  <text x="528" y="278" text-anchor="middle" font-size="30" font-weight="700" fill="#FF6B00">=</text>

  <!-- Stage 3: Result rail mesh -->
  <text x="660" y="164" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor">Rail (Mesh)</text>
  <rect x="560" y="180" width="200" height="180" rx="8" fill="currentColor" fill-opacity="0.04" stroke="#4ADE80" stroke-opacity="0.4" stroke-width="1.5"/>
  <!-- swept tube: two offset path strokes + connecting ellipses to read as a cylinder rail -->
  <path d="M 592 332 C 630 214, 688 332, 726 224" fill="none" stroke="#4ADE80" stroke-width="20" stroke-linecap="round" opacity="0.35"/>
  <path d="M 592 332 C 630 214, 688 332, 726 224" fill="none" stroke="#4ADE80" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="592" cy="332" rx="11" ry="6" fill="none" stroke="#4ADE80" stroke-width="2"/>
  <ellipse cx="726" cy="224" rx="11" ry="6" fill="none" stroke="#4ADE80" stroke-width="2"/>
  <text x="660" y="348" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6" font-style="italic">solid, renderable</text>

  <!-- Node row -->
  <rect x="270" y="404" width="260" height="60" rx="8" fill="currentColor" fill-opacity="0.06" stroke="#4ADE80" stroke-opacity="0.9" stroke-width="1.8"/>
  <rect x="270" y="404" width="260" height="24" rx="8" fill="#4ADE80" fill-opacity="0.9"/>
  <text x="400" y="421" text-anchor="middle" font-size="13" font-weight="600" fill="#0f1a14">Curve to Mesh</text>
  <text x="400" y="450" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.75">Curve · Profile Curve · Fill Caps</text>

  <!-- Footer tip Variant B -->
  <rect x="40" y="506" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> A closed profile makes a tube · enable Fill Caps to seal the ends into a solid mesh.</text>
</svg>
