<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 800 560"
     color="#222"
     role="img"
     aria-labelledby="ef-title ef-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="ef-title">Edge Flow: Good vs Bad Topology Around a Curve</title>
  <desc id="ef-desc">Paired comparison panels showing topology on the same curved surface section. Left panel: clean quads with horizontal loops that follow the curved top boundary and even vertical columns, all vertices 4-valent. Right panel: same boundary filled with a chaotic mix of triangles in the lower left, a hexagonal n-gon in the lower right, and a 6-pole vertex highlighted in red at the center with edges that cut across the form instead of following it.</desc>

  <!-- Top accent rail -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Header band -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">Edge Flow Around a Curve</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Good topology follows the form · bad topology cuts across it</text>
  <line x1="120" y1="108" x2="680" y2="108" stroke="currentColor" stroke-opacity="0.25"/>
  <text x="400" y="138" font-size="15" font-weight="700" fill="#FF6B00" text-anchor="middle" letter-spacing="2">LOOPS FOLLOW CURVE · LOOPS CUT ACROSS</text>

  <!-- Left panel: GOOD (green header) -->
  <g>
    <!-- Header bar -->
    <rect x="40" y="160" width="340" height="26" fill="#4ADE80"/>
    <text x="210" y="180" font-size="14" font-weight="700" fill="#0f1a14" text-anchor="middle">GOOD: LOOPS FOLLOW THE FORM</text>

    <!-- Outline of the curved patch (top edge curves up like a flared mug rim cross-section) -->
    <path d="M 62,220 Q 210,195 358,220 L 358,410 L 62,410 Z" fill="none" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.5"/>

    <!-- Horizontal edge loops following the top curve with diminishing arc depth -->
    <path d="M 62,258 Q 210,238 358,258" fill="none" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <path d="M 62,296 Q 210,281 358,296" fill="none" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <path d="M 62,334 Q 210,324 358,334" fill="none" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <path d="M 62,372 Q 210,367 358,372" fill="none" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>

    <!-- Vertical columns (straight, even spacing) -->
    <line x1="111" y1="213" x2="111" y2="410" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <line x1="161" y1="209" x2="161" y2="410" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <line x1="210" y1="207" x2="210" y2="410" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <line x1="259" y1="209" x2="259" y2="410" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <line x1="309" y1="213" x2="309" y2="410" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
  </g>

  <!-- Right panel: BAD (red header) -->
  <g>
    <!-- Header bar -->
    <rect x="420" y="160" width="340" height="26" fill="#E63946"/>
    <text x="590" y="180" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">BAD: TRIS, N-GON, AND A POLE</text>

    <!-- Outline of the same curved patch -->
    <path d="M 442,220 Q 590,195 738,220 L 738,410 L 442,410 Z" fill="none" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.5"/>

    <!-- 6-pole spoke edges (red) -->
    <line x1="590" y1="305" x2="590" y2="250" stroke="#E63946" stroke-opacity="0.85" stroke-width="1.4"/>
    <line x1="590" y1="305" x2="635" y2="280" stroke="#E63946" stroke-opacity="0.85" stroke-width="1.4"/>
    <line x1="590" y1="305" x2="635" y2="330" stroke="#E63946" stroke-opacity="0.85" stroke-width="1.4"/>
    <line x1="590" y1="305" x2="590" y2="360" stroke="#E63946" stroke-opacity="0.85" stroke-width="1.4"/>
    <line x1="590" y1="305" x2="545" y2="330" stroke="#E63946" stroke-opacity="0.85" stroke-width="1.4"/>
    <line x1="590" y1="305" x2="545" y2="280" stroke="#E63946" stroke-opacity="0.85" stroke-width="1.4"/>

    <!-- Ring edges around the pole (gray) -->
    <line x1="590" y1="250" x2="635" y2="280" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <line x1="635" y1="280" x2="635" y2="330" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <line x1="635" y1="330" x2="590" y2="360" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <line x1="590" y1="360" x2="545" y2="330" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <line x1="545" y1="330" x2="545" y2="280" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <line x1="545" y1="280" x2="590" y2="250" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>

    <!-- Extending edges from ring outward to panel boundary -->
    <line x1="590" y1="250" x2="590" y2="207" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <line x1="635" y1="280" x2="710" y2="260" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <line x1="635" y1="330" x2="738" y2="335" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <line x1="545" y1="280" x2="470" y2="260" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>

    <!-- Auxiliary mid-area edges connecting boundary back to ring corners -->
    <line x1="470" y1="220" x2="470" y2="260" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <line x1="710" y1="220" x2="710" y2="260" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <line x1="470" y1="260" x2="442" y2="265" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <line x1="710" y1="260" x2="738" y2="265" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>

    <!-- Two triangles in lower-left (red outline) -->
    <polygon points="442,365 500,360 480,408" fill="none" stroke="#E63946" stroke-opacity="0.85" stroke-width="1.4"/>
    <polygon points="480,408 500,360 545,408" fill="none" stroke="#E63946" stroke-opacity="0.85" stroke-width="1.4"/>
    <line x1="442" y1="335" x2="442" y2="365" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <line x1="500" y1="360" x2="545" y2="330" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <line x1="545" y1="408" x2="590" y2="360" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>

    <!-- Hexagonal n-gon in lower-right (red outline) -->
    <polygon points="700,360 689,378 667,378 656,360 667,342 689,342" fill="none" stroke="#E63946" stroke-opacity="0.85" stroke-width="1.4"/>
    <line x1="667" y1="342" x2="635" y2="330" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <line x1="700" y1="360" x2="738" y2="370" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <line x1="689" y1="378" x2="700" y2="408" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <line x1="667" y1="378" x2="650" y2="408" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>
    <line x1="656" y1="360" x2="590" y2="360" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.2"/>

    <!-- 6-pole vertex glyph (red, 3-layer) -->
    <circle cx="590" cy="305" r="12" fill="#E63946" fill-opacity="0.20"/>
    <circle cx="590" cy="305" r="6" fill="#E63946"/>
    <circle cx="590" cy="305" r="2" fill="white"/>
  </g>

  <!-- Italic takeaway -->
  <text x="400" y="438" font-size="13" fill="currentColor" opacity="0.75" font-style="italic" text-anchor="middle">Same curved patch · clean quads that follow the boundary (left) deform predictably; tris, n-gons, and poles (right) pinch and shade unevenly under smooth shading.</text>

  <!-- Property pills row -->
  <g>
    <!-- Pill 1: QUADS -->
    <rect x="50" y="455" width="220" height="40" rx="6" fill="currentColor" fill-opacity="0.04" stroke="#FF6B00" stroke-width="1" stroke-opacity="0.5"/>
    <text x="160" y="473" font-size="11" font-weight="700" fill="#FF6B00" text-anchor="middle" letter-spacing="1">QUADS</text>
    <text x="160" y="489" font-size="12" fill="currentColor" opacity="0.85" text-anchor="middle">4-sided faces, predictable</text>
    <!-- Pill 2: EVEN SPACING -->
    <rect x="290" y="455" width="220" height="40" rx="6" fill="currentColor" fill-opacity="0.04" stroke="#FF6B00" stroke-width="1" stroke-opacity="0.5"/>
    <text x="400" y="473" font-size="11" font-weight="700" fill="#FF6B00" text-anchor="middle" letter-spacing="1">EVEN SPACING</text>
    <text x="400" y="489" font-size="12" fill="currentColor" opacity="0.85" text-anchor="middle">Loops at regular intervals</text>
    <!-- Pill 3: LOOPS FOLLOW FORM -->
    <rect x="530" y="455" width="220" height="40" rx="6" fill="currentColor" fill-opacity="0.04" stroke="#FF6B00" stroke-width="1" stroke-opacity="0.5"/>
    <text x="640" y="473" font-size="11" font-weight="700" fill="#FF6B00" text-anchor="middle" letter-spacing="1">LOOPS FOLLOW FORM</text>
    <text x="640" y="489" font-size="12" fill="currentColor" opacity="0.85" text-anchor="middle">Edges curve with the surface</text>
  </g>

  <!-- Footer tip card -->
  <rect x="40" y="506" width="720" height="34" rx="4" fill="currentColor" fill-opacity="0.04" stroke="#FF6B00" stroke-opacity="0.4"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="60" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Run Mesh &gt; Clean Up &gt; Tris to Quads after extrudes that leave odd triangles around curves.</text>
</svg>
