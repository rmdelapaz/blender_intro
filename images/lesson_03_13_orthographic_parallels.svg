<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="op-title op-desc" color="#222">
  <title id="op-title">Orthographic projection, parallel lines stay parallel</title>
  <desc id="op-desc">A blueprint style diagram with two vertical blue rails that never converge, joined by seven evenly spaced horizontal cross ties of identical length. A subtle grid background reinforces that distance does not change apparent size in orthographic projection.</desc>

  <!-- Orange top strip -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Header -->
  <text x="400" y="48" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="currentColor">Orthographic Projection</text>
  <text x="400" y="74" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="currentColor" opacity="0.7">Parallel lines stay parallel, sizes do not change with distance</text>

  <!-- Operation badge -->
  <text x="400" y="118" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FF6B00" letter-spacing="1.5">PROJECTION MODE</text>
  <text x="400" y="142" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="currentColor">Orthographic</text>
  <text x="400" y="164" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="currentColor" opacity="0.7">Toggle with Numpad 5</text>

  <!-- Blueprint background panel -->
  <rect x="140" y="184" width="520" height="272" rx="6" fill="#4A9EFF" fill-opacity="0.04" stroke="#4A9EFF" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Vertical blueprint grid lines (every 40px) -->
  <line x1="180" y1="184" x2="180" y2="456" stroke="#4A9EFF" stroke-opacity="0.10" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="220" y1="184" x2="220" y2="456" stroke="#4A9EFF" stroke-opacity="0.10" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="260" y1="184" x2="260" y2="456" stroke="#4A9EFF" stroke-opacity="0.10" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="300" y1="184" x2="300" y2="456" stroke="#4A9EFF" stroke-opacity="0.10" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="340" y1="184" x2="340" y2="456" stroke="#4A9EFF" stroke-opacity="0.10" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="380" y1="184" x2="380" y2="456" stroke="#4A9EFF" stroke-opacity="0.10" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="420" y1="184" x2="420" y2="456" stroke="#4A9EFF" stroke-opacity="0.10" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="460" y1="184" x2="460" y2="456" stroke="#4A9EFF" stroke-opacity="0.10" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="500" y1="184" x2="500" y2="456" stroke="#4A9EFF" stroke-opacity="0.10" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="540" y1="184" x2="540" y2="456" stroke="#4A9EFF" stroke-opacity="0.10" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="580" y1="184" x2="580" y2="456" stroke="#4A9EFF" stroke-opacity="0.10" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="620" y1="184" x2="620" y2="456" stroke="#4A9EFF" stroke-opacity="0.10" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- Horizontal blueprint grid lines -->
  <line x1="140" y1="220" x2="660" y2="220" stroke="#4A9EFF" stroke-opacity="0.10" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="140" y1="260" x2="660" y2="260" stroke="#4A9EFF" stroke-opacity="0.10" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="140" y1="300" x2="660" y2="300" stroke="#4A9EFF" stroke-opacity="0.10" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="140" y1="340" x2="660" y2="340" stroke="#4A9EFF" stroke-opacity="0.10" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="140" y1="380" x2="660" y2="380" stroke="#4A9EFF" stroke-opacity="0.10" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="140" y1="420" x2="660" y2="420" stroke="#4A9EFF" stroke-opacity="0.10" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- Cross ties (drawn first so rails sit on top) -->
  <line x1="240" y1="200" x2="560" y2="200" stroke="#4A9EFF" stroke-opacity="0.55" stroke-width="2"/>
  <line x1="240" y1="240" x2="560" y2="240" stroke="#4A9EFF" stroke-opacity="0.55" stroke-width="2"/>
  <line x1="240" y1="280" x2="560" y2="280" stroke="#4A9EFF" stroke-opacity="0.55" stroke-width="2"/>
  <line x1="240" y1="320" x2="560" y2="320" stroke="#4A9EFF" stroke-opacity="0.55" stroke-width="2"/>
  <line x1="240" y1="360" x2="560" y2="360" stroke="#4A9EFF" stroke-opacity="0.55" stroke-width="2"/>
  <line x1="240" y1="400" x2="560" y2="400" stroke="#4A9EFF" stroke-opacity="0.55" stroke-width="2"/>
  <line x1="240" y1="440" x2="560" y2="440" stroke="#4A9EFF" stroke-opacity="0.55" stroke-width="2"/>

  <!-- Parallel rails, stay vertical -->
  <line x1="240" y1="200" x2="240" y2="440" stroke="#4A9EFF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="560" y1="200" x2="560" y2="440" stroke="#4A9EFF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Width measurement at top -->
  <line x1="240" y1="190" x2="560" y2="190" stroke="currentColor" stroke-opacity="0.5" stroke-width="1"/>
  <line x1="240" y1="186" x2="240" y2="194" stroke="currentColor" stroke-opacity="0.5" stroke-width="1"/>
  <line x1="560" y1="186" x2="560" y2="194" stroke="currentColor" stroke-opacity="0.5" stroke-width="1"/>
  <rect x="378" y="178" width="44" height="14" rx="3" fill="#ffffff" fill-opacity="0.85"/>
  <text x="400" y="189" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="currentColor" opacity="0.75">320 u</text>

  <!-- Width measurement at bottom (same value, proves no shrink) -->
  <line x1="240" y1="450" x2="560" y2="450" stroke="currentColor" stroke-opacity="0.5" stroke-width="1"/>
  <line x1="240" y1="446" x2="240" y2="454" stroke="currentColor" stroke-opacity="0.5" stroke-width="1"/>
  <line x1="560" y1="446" x2="560" y2="454" stroke="currentColor" stroke-opacity="0.5" stroke-width="1"/>
  <rect x="378" y="442" width="44" height="14" rx="3" fill="#ffffff" fill-opacity="0.85"/>
  <text x="400" y="453" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="currentColor" opacity="0.75">320 u</text>

  <!-- "Equal" callout in the middle -->
  <text x="608" y="324" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#4A9EFF" letter-spacing="0.8">EQUAL AT</text>
  <text x="608" y="338" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#4A9EFF" letter-spacing="0.8">ANY DEPTH</text>

  <!-- Insets at y=476 (slightly lower than #12 since diagram extends to 456) -->
  <rect x="68" y="476" width="320" height="44" rx="8" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>
  <text x="86" y="494" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="currentColor" opacity="0.75" letter-spacing="0.8">ORTHOGRAPHIC EFFECT</text>
  <text x="86" y="512" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="currentColor" opacity="0.85">No depth distortion, measurements stay true</text>

  <rect x="412" y="476" width="320" height="44" rx="8" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>
  <text x="430" y="494" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="currentColor" opacity="0.75" letter-spacing="0.8">WHEN TO USE</text>
  <text x="430" y="512" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="currentColor" opacity="0.85">Modeling, alignment, technical accuracy</text>

  <!-- Footer tip -->
  <rect x="68" y="528" width="664" height="24" rx="6" fill="#FF6B00" fill-opacity="0.10" stroke="#FF6B00" stroke-opacity="0.4" stroke-width="1"/>
  <text x="86" y="544" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="currentColor" opacity="0.85"><tspan font-weight="700" fill="#FF6B00" letter-spacing="1.5">TIP </tspan>Modelers live in orthographic. It is the only way to keep proportions honest while you build.</text>
</svg>
