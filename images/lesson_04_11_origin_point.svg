<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="op-title op-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="op-title">The object origin point and its three roles</title>
  <desc id="op-desc">A single cube sits at the center of the diagram with a small orange dot marking its origin point. Three small annotation cards sit around the cube: Rotation pivot above, Scale center to the lower left, and Location reference to the lower right. Each card pairs a short label and one line of subtext with a tiny icon, and a dashed line connects each card to the origin dot. The rotation icon shows a circular arrow around a center dot. The scale icon shows four outward arrows from a center dot. The location icon shows red, green, and blue X, Y, Z axes radiating from a center dot. A footer tip explains that the origin is the pivot for every transform and that a misplaced origin causes unexpected rotation and scale behavior.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">OBJECT ORIGIN: THE PIVOT POINT</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Every transform pivots around this single point.</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Subhead -->
  <text x="400" y="138" font-size="15" font-weight="700" fill="#FF6B00" text-anchor="middle" letter-spacing="2">ONE POINT, THREE ROLES</text>

  <!-- =============================================================== -->
  <!-- Composition area                                                 -->
  <!-- Hero cube: front face (350, 270) to (450, 370), depth (30, 30)   -->
  <!-- Origin dot at (415, 305)                                         -->
  <!-- Cards at: top (300, 155), BL (80, 385), BR (520, 385)            -->
  <!-- =============================================================== -->

  <!-- Connector lines drawn first so cube outline and origin dot sit on top -->
  <g stroke="currentColor" stroke-width="1.2" fill="none" stroke-dasharray="4 3" opacity="0.30">
    <line x1="400" y1="205" x2="415" y2="305"/>
    <line x1="240" y1="385" x2="415" y2="305"/>
    <line x1="560" y1="385" x2="415" y2="305"/>
  </g>

  <!-- Hero cube: faint fill then stroke outline (same pattern as #5 and #10) -->
  <g opacity="0.10">
    <rect x="350" y="270" width="100" height="100" fill="currentColor"/>
    <polygon points="350,270 380,240 480,240 450,270" fill="currentColor"/>
    <polygon points="450,270 480,240 480,340 450,370" fill="currentColor"/>
  </g>
  <g stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <rect x="350" y="270" width="100" height="100"/>
    <polygon points="350,270 380,240 480,240 450,270"/>
    <polygon points="450,270 480,240 480,340 450,370"/>
  </g>

  <!-- Origin dot at the cube's geometric center (front + half depth) -->
  <circle cx="415" cy="305" r="11" fill="#FF6B00" opacity="0.20"/>
  <circle cx="415" cy="305" r="7" fill="#FF6B00"/>
  <circle cx="415" cy="305" r="2.5" fill="#ffffff"/>

  <!-- Origin label tag -->
  <text x="427" y="322" font-size="11" font-weight="700" font-style="italic" fill="#FF6B00">origin</text>

  <!-- =============================================================== -->
  <!-- THREE ANNOTATION CARDS                                           -->
  <!-- =============================================================== -->

  <!-- ===== TOP CARD: ROTATION PIVOT ===== -->
  <g transform="translate(300, 155)">
    <rect x="0" y="0" width="200" height="50" rx="6"
          fill="currentColor" fill-opacity="0.04"
          stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>
    <text x="12" y="20" font-size="13" font-weight="700" fill="currentColor">Rotation pivot</text>
    <text x="12" y="38" font-size="11" fill="currentColor" opacity="0.7">R rotates the object around this point</text>
    <g transform="translate(164, 13)">
      <path d="M 22 12 A 10 10 0 1 1 12 2" stroke="#FF6B00" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <polygon points="12,2 8,-1 8,5" fill="#FF6B00"/>
      <circle cx="12" cy="12" r="2.5" fill="#FF6B00"/>
    </g>
  </g>

  <!-- ===== BOTTOM-LEFT CARD: SCALE CENTER ===== -->
  <g transform="translate(80, 385)">
    <rect x="0" y="0" width="200" height="50" rx="6"
          fill="currentColor" fill-opacity="0.04"
          stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>
    <text x="12" y="20" font-size="13" font-weight="700" fill="currentColor">Scale center</text>
    <text x="12" y="38" font-size="11" fill="currentColor" opacity="0.7">S scales out from this point</text>
    <g transform="translate(164, 13)">
      <circle cx="12" cy="12" r="2.5" fill="#FF6B00"/>
      <g stroke="#FF6B00" stroke-width="1.5" stroke-linecap="round" fill="none">
        <line x1="12" y1="9" x2="12" y2="4"/>
        <line x1="12" y1="15" x2="12" y2="20"/>
        <line x1="9" y1="12" x2="4" y2="12"/>
        <line x1="15" y1="12" x2="20" y2="12"/>
      </g>
      <g fill="#FF6B00">
        <polygon points="12,2 9,6 15,6"/>
        <polygon points="12,22 9,18 15,18"/>
        <polygon points="2,12 6,9 6,15"/>
        <polygon points="22,12 18,9 18,15"/>
      </g>
    </g>
  </g>

  <!-- ===== BOTTOM-RIGHT CARD: LOCATION REFERENCE ===== -->
  <g transform="translate(520, 385)">
    <rect x="0" y="0" width="200" height="50" rx="6"
          fill="currentColor" fill-opacity="0.04"
          stroke="currentColor" stroke-width="1" stroke-opacity="0.2"/>
    <text x="12" y="20" font-size="13" font-weight="700" fill="currentColor">Location reference</text>
    <text x="12" y="38" font-size="11" fill="currentColor" opacity="0.7">X, Y, Z report where this point sits</text>
    <g transform="translate(164, 13)">
      <line x1="12" y1="12" x2="22" y2="12" stroke="#E63946" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="12" y1="12" x2="18" y2="6" stroke="#4ADE80" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="12" y1="12" x2="12" y2="2" stroke="#4A9EFF" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="12" cy="12" r="2.5" fill="#FF6B00"/>
    </g>
  </g>

  <!-- Italic takeaway -->
  <text x="400" y="470" font-size="13" font-style="italic" fill="currentColor" opacity="0.6" text-anchor="middle">Move the origin and rotation, scale, and location all reroute through the new point.</text>

  <!-- Footer tip callout -->
  <rect x="40" y="506" width="720" height="34" rx="6"
        fill="#FF6B00" fill-opacity="0.10"
        stroke="#FF6B00" stroke-opacity="0.4"/>
  <text x="54" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> The origin sits at the center of every transform. If a rotation looks off axis or a scale stretches the wrong way, check the origin first.
  </text>
</svg>
