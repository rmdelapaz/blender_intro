<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680"
     role="img" aria-labelledby="nrr-title nrr-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="nrr-title">Noise Recipes Reference Chart</title>
  <desc id="nrr-desc">A reference chart of four procedural-noise recipes for common terrain and surface effects: rolling hills, sharp mountains, small bumps, and cracks. Each recipe lists its Scale, Detail, and Roughness parameters alongside a mini height-profile swatch showing the resulting surface character.</desc>

  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">NOISE RECIPES REFERENCE</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">Starting-point parameter sets for four common surface characters</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- Column headers -->
  <text x="58" y="134" font-size="13" font-weight="700" fill="currentColor" opacity="0.55">RECIPE</text>
  <text x="300" y="134" font-size="13" font-weight="700" fill="currentColor" opacity="0.55">PARAMETERS</text>
  <text x="600" y="134" font-size="13" font-weight="700" fill="currentColor" opacity="0.55">PROFILE</text>

  <!-- ===== Row 1: Rolling Hills (green, smooth low-freq) ===== -->
  <rect x="40" y="148" width="4" height="104" fill="#4ADE80"/>
  <text x="58" y="176" font-size="17" font-weight="600" fill="#4ADE80">Rolling Hills</text>
  <text x="58" y="200" font-size="13" fill="currentColor" opacity="0.6">Broad, gentle undulation</text>
  <text x="58" y="224" font-size="12" fill="currentColor" opacity="0.45">Large scale, low detail</text>

  <text x="300" y="176" font-size="13" fill="currentColor">Scale <tspan font-weight="700">2.0</tspan></text>
  <text x="300" y="200" font-size="13" fill="currentColor">Detail <tspan font-weight="700">2.0</tspan></text>
  <text x="300" y="224" font-size="13" fill="currentColor">Roughness <tspan font-weight="700">0.4</tspan></text>

  <rect x="600" y="156" width="160" height="80" rx="4" fill="currentColor" opacity="0.04"/>
  <polyline points="600,212 620,200 640,190 660,196 680,178 700,186 720,172 740,182 760,196"
            fill="none" stroke="#4ADE80" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <line x1="40" y1="264" x2="760" y2="264" stroke="currentColor" stroke-width="1" opacity="0.1"/>

  <!-- ===== Row 2: Sharp Mountains (blue Z, high detail, jagged) ===== -->
  <rect x="40" y="278" width="4" height="104" fill="#4A9EFF"/>
  <text x="58" y="306" font-size="17" font-weight="600" fill="#4A9EFF">Sharp Mountains</text>
  <text x="58" y="330" font-size="13" fill="currentColor" opacity="0.6">Steep ridges and peaks</text>
  <text x="58" y="354" font-size="12" fill="currentColor" opacity="0.45">High detail, high roughness</text>

  <text x="300" y="306" font-size="13" fill="currentColor">Scale <tspan font-weight="700">1.5</tspan></text>
  <text x="300" y="330" font-size="13" fill="currentColor">Detail <tspan font-weight="700">8.0</tspan></text>
  <text x="300" y="354" font-size="13" fill="currentColor">Roughness <tspan font-weight="700">0.7</tspan></text>

  <rect x="600" y="286" width="160" height="80" rx="4" fill="currentColor" opacity="0.04"/>
  <polyline points="600,352 616,330 626,340 640,300 652,320 668,296 680,332 694,308 708,344 722,314 736,336 750,304 760,352"
            fill="none" stroke="#4A9EFF" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <line x1="40" y1="394" x2="760" y2="394" stroke="currentColor" stroke-width="1" opacity="0.1"/>

  <!-- ===== Row 3: Small Bumps (amber, fine even ripple) ===== -->
  <rect x="40" y="408" width="4" height="104" fill="#F5C242"/>
  <text x="58" y="436" font-size="17" font-weight="600" fill="#F5C242">Small Bumps</text>
  <text x="58" y="460" font-size="13" fill="currentColor" opacity="0.6">Fine, even surface texture</text>
  <text x="58" y="484" font-size="12" fill="currentColor" opacity="0.45">Small scale, low roughness</text>

  <text x="300" y="436" font-size="13" fill="currentColor">Scale <tspan font-weight="700">15.0</tspan></text>
  <text x="300" y="460" font-size="13" fill="currentColor">Detail <tspan font-weight="700">2.0</tspan></text>
  <text x="300" y="484" font-size="13" fill="currentColor">Roughness <tspan font-weight="700">0.3</tspan></text>

  <rect x="600" y="416" width="160" height="80" rx="4" fill="currentColor" opacity="0.04"/>
  <polyline points="600,470 612,460 624,470 636,458 648,470 660,459 672,470 684,457 696,470 708,460 720,470 732,458 744,470 756,460 760,466"
            fill="none" stroke="#F5C242" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <line x1="40" y1="524" x2="760" y2="524" stroke="currentColor" stroke-width="1" opacity="0.1"/>

  <!-- ===== Row 4: Cracks (red warning, sparse sharp troughs) ===== -->
  <rect x="40" y="538" width="4" height="90" fill="#E63946"/>
  <text x="58" y="566" font-size="17" font-weight="600" fill="#E63946">Cracks</text>
  <text x="58" y="590" font-size="13" fill="currentColor" opacity="0.6">Sharp narrow crevices</text>
  <text x="58" y="614" font-size="12" fill="currentColor" opacity="0.45">Voronoi distance, high contrast</text>

  <text x="300" y="566" font-size="13" fill="currentColor">Scale <tspan font-weight="700">6.0</tspan></text>
  <text x="300" y="590" font-size="13" fill="currentColor">Voronoi <tspan font-weight="700">Distance</tspan></text>
  <text x="300" y="614" font-size="13" fill="currentColor">Contrast <tspan font-weight="700">High</tspan></text>

  <rect x="600" y="546" width="160" height="72" rx="4" fill="currentColor" opacity="0.04"/>
  <polyline points="600,560 628,560 636,606 644,560 690,560 700,606 710,560 744,560 752,600 760,560"
            fill="none" stroke="#E63946" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Footer tip (Variant B, dense y=641/663) -->
  <rect x="40" y="641" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="663" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Use these as starting points, then tune Scale to your object size. Higher Detail always costs more.</text>
</svg>
