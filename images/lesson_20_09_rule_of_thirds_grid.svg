<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="rt-title rt-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="#222">
  <title id="rt-title">The rule of thirds composition grid</title>
  <desc id="rt-desc">A 16:9 camera frame divided into nine equal cells by two evenly spaced vertical and two horizontal lines. The four points where the lines cross are marked as power points with orange circles. A subject silhouette sits on the lower-left power point to show correct placement.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">RULE OF THIRDS</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">The foundation of good composition</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ============ 16:9 FRAME ============ -->
  <!-- Frame: x 150..650 (w=500), y 150..431 (h=281) -> 500:281 ~= 16:9.
       Thirds verticals at x=316.7, 483.3 ; horizontals at y=243.7, 337.3 -->
  <rect x="150" y="150" width="500" height="281"
        fill="currentColor" fill-opacity="0.03"
        stroke="currentColor" stroke-width="2" opacity="0.85"/>

  <!-- Subject silhouette on lower-left power point (behind grid lines) -->
  <g fill="currentColor" opacity="0.30">
    <!-- simple standing figure: head + body -->
    <circle cx="316.7" cy="312" r="16"/>
    <path d="M 316.7 330 C 300 332 294 350 294 372 L 294 410 L 339 410 L 339 372 C 339 350 333 332 316.7 330 Z"/>
  </g>

  <!-- Thirds grid lines -->
  <g stroke="#FF6B00" stroke-width="2" opacity="0.9">
    <!-- verticals -->
    <line x1="316.7" y1="150" x2="316.7" y2="431"/>
    <line x1="483.3" y1="150" x2="483.3" y2="431"/>
    <!-- horizontals -->
    <line x1="150" y1="243.7" x2="650" y2="243.7"/>
    <line x1="150" y1="337.3" x2="650" y2="337.3"/>
  </g>

  <!-- Power points: four intersections -->
  <g fill="#FF6B00">
    <circle cx="316.7" cy="243.7" r="8"/>
    <circle cx="483.3" cy="243.7" r="8"/>
    <circle cx="316.7" cy="337.3" r="8"/>
    <circle cx="483.3" cy="337.3" r="8"/>
  </g>
  <!-- ring the occupied power point to emphasise placement -->
  <circle cx="316.7" cy="337.3" r="15" fill="none" stroke="#FF6B00" stroke-width="2.5" opacity="0.7"/>

  <!-- ============ ANNOTATIONS ============ -->
  <!-- Power Points callout (top-right power point) -->
  <g stroke="currentColor" stroke-width="1.5" opacity="0.45" stroke-linecap="round">
    <line x1="660" y1="200" x2="491" y2="240"/>
    <line x1="150" y1="470" x2="316.7" y2="350"/>
  </g>
  <text x="668" y="196" font-size="14" font-weight="600" fill="currentColor">Power Points</text>
  <text x="668" y="214" font-size="12" fill="currentColor" opacity="0.6">Place key subjects</text>
  <text x="668" y="230" font-size="12" fill="currentColor" opacity="0.6">on these crossings</text>

  <text x="150" y="486" font-size="13" font-weight="600" fill="currentColor">Subject on a power point</text>
  <text x="150" y="503" font-size="12" fill="currentColor" opacity="0.6">reads as balanced, not centred</text>

  <!-- Grid line labels -->
  <text x="400" y="142" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.6">vertical thirds</text>
  <text x="664" y="247" font-size="12" fill="currentColor" opacity="0.6">horizontal thirds</text>

  <!-- ============ FOOTER TIP (Variant B, left rail) ============ -->
  <rect x="40" y="506" width="720" height="34" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor">
    <tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Enable the Thirds composition guide in Camera &#8250; Viewport Display &#183; Composition Guides.
  </text>
</svg>
