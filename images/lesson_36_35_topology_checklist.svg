<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" color="currentColor" role="img" aria-labelledby="tcl-title tcl-desc" style="max-width:100%;height:auto">
<title id="tcl-title">Topology quality checklist</title>
<desc id="tcl-desc">An illustrated checklist of six topology quality checks: all-quad mesh, edge loops following anatomy, even density, consistent face orientation, no non-manifold geometry, and poles kept away from deforming areas.</desc>
<style>
.tcl-card{fill:none;stroke:currentColor;stroke-width:1.4;opacity:.45}
.tcl-s{fill:none;stroke:currentColor;stroke-width:1.8}
.tcl-thin{fill:none;stroke:currentColor;stroke-width:1.1;opacity:.6}
.tcl-t{fill:currentColor;font-family:system-ui,Arial,sans-serif}
.tcl-h{font-size:18px;font-weight:700}.tcl-it{font-size:13.5px;font-weight:700}.tcl-d{font-size:11px;opacity:.8}
.tcl-chk{fill:#4CAF50}
</style>
<text x="40" y="36" class="tcl-t tcl-h">Topology quality checklist</text>
<text x="40" y="56" class="tcl-t tcl-d">Run before subdivision, rigging, or export &#183; all six should pass.</text>
<!-- 2 cols x 3 rows. card 320x108, gap. col x: 30, 370. row y: 76,196,316 -->
<!-- helper checkmark circle drawn per item -->
<!-- Item 1 -->
<g transform="translate(30,76)">
<rect width="320" height="108" rx="9" class="tcl-card"/>
<circle cx="34" cy="34" r="14" class="tcl-chk"/><path d="M27 34 l5 6 l9 -12" fill="none" stroke="#fff" stroke-width="2.6"/>
<text x="62" y="32" class="tcl-t tcl-it">All quads</text>
<text x="62" y="52" class="tcl-t tcl-d">No tris or n-gons in deforming areas.</text>
<g class="tcl-thin" transform="translate(230,58)"><rect x="0" y="0" width="60" height="30"/><path d="M30 0 V30 M0 15 H60"/></g>
</g>
<!-- Item 2 -->
<g transform="translate(370,76)">
<rect width="320" height="108" rx="9" class="tcl-card"/>
<circle cx="34" cy="34" r="14" class="tcl-chk"/><path d="M27 34 l5 6 l9 -12" fill="none" stroke="#fff" stroke-width="2.6"/>
<text x="62" y="32" class="tcl-t tcl-it">Loops follow anatomy</text>
<text x="62" y="52" class="tcl-t tcl-d">Edge loops ring eyes, mouth, joints.</text>
<g class="tcl-thin" transform="translate(228,52)"><ellipse cx="32" cy="20" rx="30" ry="16"/><ellipse cx="32" cy="20" rx="20" ry="10"/><ellipse cx="32" cy="20" rx="10" ry="5"/></g>
</g>
<!-- Item 3 -->
<g transform="translate(30,196)">
<rect width="320" height="108" rx="9" class="tcl-card"/>
<circle cx="34" cy="34" r="14" class="tcl-chk"/><path d="M27 34 l5 6 l9 -12" fill="none" stroke="#fff" stroke-width="2.6"/>
<text x="62" y="32" class="tcl-t tcl-it">Even density</text>
<text x="62" y="52" class="tcl-t tcl-d">Uniform quad sizing; extra loops only at bends.</text>
<g class="tcl-thin" transform="translate(232,58)"><path d="M0 0 H56 M0 15 H56 M0 30 H56 M14 0 V30 M28 0 V30 M42 0 V30"/></g>
</g>
<!-- Item 4 -->
<g transform="translate(370,196)">
<rect width="320" height="108" rx="9" class="tcl-card"/>
<circle cx="34" cy="34" r="14" class="tcl-chk"/><path d="M27 34 l5 6 l9 -12" fill="none" stroke="#fff" stroke-width="2.6"/>
<text x="62" y="32" class="tcl-t tcl-it">Normals consistent</text>
<text x="62" y="52" class="tcl-t tcl-d">All face orientation outward (no blue flips).</text>
<g class="tcl-thin" transform="translate(238,52)"><rect x="0" y="2" width="44" height="32"/><path d="M22 18 l0 -14 m0 -0 l-4 5 m4 -5 l4 5"/></g>
</g>
<!-- Item 5 -->
<g transform="translate(30,316)">
<rect width="320" height="108" rx="9" class="tcl-card"/>
<circle cx="34" cy="34" r="14" class="tcl-chk"/><path d="M27 34 l5 6 l9 -12" fill="none" stroke="#fff" stroke-width="2.6"/>
<text x="62" y="32" class="tcl-t tcl-it">Manifold mesh</text>
<text x="62" y="52" class="tcl-t tcl-d">No holes, doubles, or internal faces.</text>
<g class="tcl-thin" transform="translate(236,52)"><path d="M8 4 h40 v32 h-40 z M8 20 h40"/></g>
</g>
<!-- Item 6 -->
<g transform="translate(370,316)">
<rect width="320" height="108" rx="9" class="tcl-card"/>
<circle cx="34" cy="34" r="14" class="tcl-chk"/><path d="M27 34 l5 6 l9 -12" fill="none" stroke="#fff" stroke-width="2.6"/>
<text x="62" y="32" class="tcl-t tcl-it">Poles placed safely</text>
<text x="62" y="52" class="tcl-t tcl-d">Keep 5-poles off joints &amp; flat flex zones.</text>
<g class="tcl-thin" transform="translate(236,50)"><path d="M24 18 v-16 M24 18 v16 M24 18 h-18 M24 18 h18 M24 18 l-13 -13 M24 18 l13 13"/><circle cx="24" cy="18" r="4" fill="#4CAF50" stroke="none"/></g>
</g>
</svg>
