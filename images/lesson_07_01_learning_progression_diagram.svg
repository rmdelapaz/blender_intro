<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" color="#222" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Coffee Mug Skills Transferable to Many 3D Objects</title>
  <desc>Hub-and-spoke diagram showing five target objects (vase, bowl, bucket, water bottle, stool) radiating from a central coffee mug icon, each connected by an arrow labeled with the skill that transfers from the mug project.</desc>

  <defs>
    <marker id="lp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" fill="#FF6B00">
      <path d="M 0 0 L 10 5 L 0 10 Z" />
    </marker>
  </defs>

  <!-- Title block -->
  <text x="400" y="38" font-size="24" font-weight="700" text-anchor="middle" fill="currentColor">Coffee Mug Skills</text>
  <text x="400" y="62" font-size="14" font-weight="400" text-anchor="middle" fill="currentColor" opacity="0.7">Transferable to many 3D objects</text>

  <!-- Arrows from hub to spokes -->
  <g stroke="#FF6B00" stroke-width="2.5" fill="none" stroke-linecap="round">
    <line x1="400" y1="230" x2="400" y2="175" marker-end="url(#lp-arrow)" />
    <line x1="486" y1="292" x2="538" y2="275" marker-end="url(#lp-arrow)" />
    <line x1="453" y1="393" x2="485" y2="437" marker-end="url(#lp-arrow)" />
    <line x1="347" y1="393" x2="315" y2="437" marker-end="url(#lp-arrow)" />
    <line x1="314" y1="292" x2="262" y2="275" marker-end="url(#lp-arrow)" />
  </g>

  <!-- Hub: coffee mug icon (centered at 400, 320) -->
  <g stroke="#FF6B00" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 360 272 L 360 365 Q 360 380 375 380 L 425 380 Q 440 380 440 365 L 440 272" />
    <ellipse cx="400" cy="272" rx="40" ry="7" />
    <path d="M 440 295 Q 480 295 480 325 Q 480 355 440 355" />
  </g>

  <!-- Spoke 1: Vase (top, purple) -->
  <g stroke="#B47EE8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 388 88 L 412 88 L 412 102 Q 420 112 420 128 Q 420 148 400 152 Q 380 148 380 128 Q 380 112 388 102 Z" />
  </g>

  <!-- Spoke 2: Bowl (upper-right, blue) -->
  <g stroke="#4A9EFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 550 244 Q 590 295 630 244" />
    <ellipse cx="590" cy="244" rx="40" ry="6" />
  </g>

  <!-- Spoke 3: Bucket (lower-right, yellow) -->
  <g stroke="#F5C242" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 485 414 L 551 414 L 545 472 L 491 472 Z" />
    <path d="M 491 414 Q 518 386 545 414" />
  </g>

  <!-- Spoke 4: Water bottle (lower-left, green) -->
  <g stroke="#4ADE80" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="274" y="412" width="16" height="8" rx="1.5" />
    <path d="M 277 420 L 277 430" />
    <path d="M 287 420 L 287 430" />
    <path d="M 277 430 Q 262 432 262 446 L 262 467 Q 262 472 267 472 L 297 472 Q 302 472 302 467 L 302 446 Q 302 432 287 430" />
  </g>

  <!-- Spoke 5: Stool (upper-left, pink) -->
  <g stroke="#FF7EA8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="210" cy="195" rx="30" ry="6" />
    <line x1="188" y1="200" x2="180" y2="248" />
    <line x1="232" y1="200" x2="240" y2="248" />
    <line x1="195" y1="225" x2="225" y2="225" />
  </g>

  <!-- Labels (adjacent to spoke icons, outboard side) -->
  <g font-size="14" font-weight="600" fill="currentColor">
    <text x="435" y="126" text-anchor="start">Hollow interior</text>
    <text x="640" y="262" text-anchor="start">Curved surfaces</text>
    <text x="560" y="448" text-anchor="start">Handle creation</text>
    <text x="255" y="448" text-anchor="end">Tapered profile</text>
    <text x="170" y="222" text-anchor="end">Smooth shading</text>
  </g>

</svg>
