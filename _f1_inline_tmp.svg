<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"
     role="img" aria-labelledby="tla-title tla-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     color="currentColor">
  <title id="tla-title">Three-layer rig architecture diagram</title>
  <desc id="tla-desc">A vertical stack of three rig layers. The top CTRL layer in green holds the control bones an animator interacts with. The middle MCH layer in blue holds mechanism bones that run behind-the-scenes calculations. The bottom DEF layer in purple holds deformation bones that actually deform the mesh. Arrows flow downward showing that controls drive mechanisms, mechanisms drive deformation, and deformation drives the character mesh at the base.</desc>

  <!-- Top brand accent -->
  <rect x="0" y="0" width="800" height="3" fill="#FF6B00"/>

  <!-- Heading block -->
  <text x="40" y="56" font-size="24" font-weight="700" fill="currentColor">THREE-LAYER RIG ARCHITECTURE</text>
  <text x="40" y="84" font-size="14" fill="currentColor" opacity="0.65">CTRL · MCH · DEF · how every bone in a rig is organized</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- CTRL layer (top) -->
  <g>
    <rect x="40" y="134" width="560" height="84" rx="8" fill="none" stroke="#4ADE80" stroke-width="1.5" opacity="0.9"/>
    <rect x="40" y="134" width="6" height="84" rx="0" fill="#4ADE80"/>
    <text x="64" y="162" font-size="16" font-weight="600" fill="#4ADE80">CTRL · Control Bones</text>
    <text x="64" y="185" font-size="14" fill="currentColor">hand_IK.L · foot_IK.L · COG · chest</text>
    <text x="64" y="206" font-size="13" fill="currentColor" opacity="0.6">What animators interact with · custom shapes, color-coded</text>
    <text x="620" y="180" font-size="13" fill="currentColor" opacity="0.6">Top layer</text>
  </g>

  <!-- connector CTRL -> MCH -->
  <g stroke="currentColor" stroke-width="1.5" opacity="0.3" stroke-linecap="round" fill="none">
    <line x1="320" y1="218" x2="320" y2="238"/>
    <polyline points="312,230 320,238 328,230"/>
  </g>

  <!-- MCH layer (middle) -->
  <g>
    <rect x="40" y="238" width="560" height="84" rx="8" fill="none" stroke="#2196F3" stroke-width="1.5" opacity="0.9"/>
    <rect x="40" y="238" width="6" height="84" rx="0" fill="#2196F3"/>
    <text x="64" y="266" font-size="16" font-weight="600" fill="#2196F3">MCH · Mechanism Bones</text>
    <text x="64" y="289" font-size="14" fill="currentColor">MCH_IK_upper_arm.L · MCH_IK_shin.L</text>
    <text x="64" y="310" font-size="13" fill="currentColor" opacity="0.6">Behind-the-scenes calculations · IK solvers, constraints</text>
    <text x="620" y="284" font-size="13" fill="currentColor" opacity="0.6">Middle layer</text>
  </g>

  <!-- connector MCH -> DEF -->
  <g stroke="currentColor" stroke-width="1.5" opacity="0.3" stroke-linecap="round" fill="none">
    <line x1="320" y1="322" x2="320" y2="342"/>
    <polyline points="312,334 320,342 328,334"/>
  </g>

  <!-- DEF layer (bottom) -->
  <g>
    <rect x="40" y="342" width="560" height="84" rx="8" fill="none" stroke="#B47EE8" stroke-width="1.5" opacity="0.9"/>
    <rect x="40" y="342" width="6" height="84" rx="0" fill="#B47EE8"/>
    <text x="64" y="370" font-size="16" font-weight="600" fill="#B47EE8">DEF · Deformation Bones</text>
    <text x="64" y="393" font-size="14" fill="currentColor">DEF_upper_arm.L · DEF_forearm.L · DEF_hand.L</text>
    <text x="64" y="414" font-size="13" fill="currentColor" opacity="0.6">Actually deform the mesh · weighted in weight paint</text>
    <text x="620" y="388" font-size="13" fill="currentColor" opacity="0.6">Bottom layer</text>
  </g>

  <!-- connector DEF -> MESH -->
  <g stroke="currentColor" stroke-width="1.5" opacity="0.3" stroke-linecap="round" fill="none">
    <line x1="320" y1="426" x2="320" y2="446"/>
    <polyline points="312,438 320,446 328,438"/>
  </g>

  <!-- mesh silhouette -->
  <g>
    <path d="M 280 470 q 40 -20 80 0 q 10 18 -4 28 l -72 0 q -14 -10 -4 -28 Z" fill="currentColor" opacity="0.3"/>
    <text x="380" y="490" font-size="13" fill="currentColor" opacity="0.6">Character mesh · deformed by DEF bones</text>
  </g>

  <!-- Footer tip (Variant B, left rail) -->
  <rect x="40" y="506" width="720" height="34" rx="0" fill="none"/>
  <rect x="40" y="506" width="4" height="34" fill="#FF6B00"/>
  <text x="58" y="528" font-size="13" fill="currentColor"><tspan font-weight="700" fill="#FF6B00">Tip:</tspan> Animators touch only the CTRL layer; MCH and DEF run automatically beneath it.</text>
</svg>
